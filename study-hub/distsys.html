<h2 class="title">১. Foundation — কেন Distributed Systems দরকার</h2>
<p class="lead">একটা মাত্র সার্ভারে চলা প্রোগ্রাম বোঝা সহজ — এক প্রসেস, এক মেমরি, এক ঘড়ি, হয় চলছে নয়তো বন্ধ। কিন্তু যখনই সেই কাজ একাধিক মেশিনে ছড়িয়ে দিতে হয়, নতুন এক শ্রেণির সমস্যা তৈরি হয় যা single-process programming-এ কখনো মুখোমুখি হতে হয় না। এই চ্যাপ্টার সেই মৌলিক সত্যগুলো প্রতিষ্ঠা করবে যার উপর পুরো কোর্স দাঁড়িয়ে থাকবে।</p>

<h3>Distributed System মানে কী</h3>
<p>একটা <span class="kw">distributed system</span> হলো একাধিক স্বাধীন কম্পিউটার (<span class="kw">node</span>) — যাদের প্রত্যেকের নিজস্ব মেমরি, নিজস্ব CPU, নিজস্ব ঘড়ি আছে — যারা নেটওয়ার্কের মাধ্যমে বার্তা আদান-প্রদান করে সমন্বয় করে, আর ব্যবহারকারীর কাছে একটা একক, সুসংগত সিস্টেম হিসেবে ধরা দেয়। খেয়াল করুন — সংজ্ঞার দুটো অংশই সমান গুরুত্বপূর্ণ। "স্বাধীন" মানে প্রতিটা node একে অপর থেকে আলাদাভাবে ক্র্যাশ করতে পারে, ধীর হতে পারে, বা নেটওয়ার্ক থেকে বিচ্ছিন্ন হতে পারে। আর "একক সিস্টেম হিসেবে ধরা দেয়" মানে ব্যবহারকারী — Google Search-এ কিছু খোঁজা কেউ — জানেও না, জানার দরকারও নেই যে তার request-টা হাজার হাজার মেশিনের কোনগুলো স্পর্শ করে গেল।</p>
<div class="callout why"><span class="tag">কেন এই "একক সিস্টেমের মতো দেখানো" জরুরি</span>
এই ধারণাকে বলে <span class="kw">transparency</span> — location transparency, failure transparency ইত্যাদি। এটা কোনো বিলাসিতা নয়, বরং engineering-এর মূল লক্ষ্য: ভেতরে যতই জটিলতা থাকুক (৩টা replica, ২টা datacenter, ৫টা partition), বাইরে থেকে client একটাই simple API দেখবে। এই কোর্সের প্রতিটা কৌশল — replication, consensus, partitioning — আসলে এই transparency বজায় রাখার একেকটা উপায়।</div>

<h3>কেন আমরা কষ্ট করে Distributed System বানাই</h3>
<p>একটা শক্তিশালী সার্ভার কিনলেই তো ঝামেলা এড়ানো যায় — তাহলে কেন এত জটিলতা মেনে নিয়ে একাধিক মেশিনে সিস্টেম ছড়ানো হয়? মূলত চারটা কারণে, আর প্রতিটাই বাস্তব ব্যবসায়িক প্রয়োজন থেকে আসা।</p>
<div class="grid2">
<div class="box"><b>Scale</b> — একক মেশিনের ক্ষমতা পার হওয়া। একটা মেশিনের CPU, RAM, disk I/O-এর একটা সীমা আছে। Facebook-এর ৩ বিলিয়ন ব্যবহারকারীর ডেটা, বা প্রতি সেকেন্ডে লক্ষ লক্ষ request — কোনো একক মেশিন দিয়ে সামলানো সম্ভব না, যতই powerful হোক।</div>
<div class="box"><b>Availability / Redundancy</b> — একটা মেশিন মারা গেলেও সিস্টেম বেঁচে থাকা। এক মেশিনের সিস্টেমে হার্ডওয়্যার নষ্ট হলে পুরো সার্ভিস বন্ধ। একাধিক node-এ ছড়ালে একটা node হারালেও বাকিরা সার্ভিস চালিয়ে যেতে পারে — এটাই <span class="kw">fault tolerance</span>-এর ভিত্তি।</div>
<div class="box"><b>Geographic locality / Latency</b> — বিশ্বজুড়ে ব্যবহারকারী। ঢাকার ব্যবহারকারীর request যদি প্রতিবার US-এর একটা সার্ভারে যেতে হয়, নেটওয়ার্ক latency-ই কষ্টকর হয়ে যায়। বিভিন্ন অঞ্চলে node রাখলে ব্যবহারকারীর কাছাকাছি থেকে সেবা দেওয়া যায়।</div>
<div class="box"><b>Fault / Workload Isolation</b> — এক অংশের সমস্যা যেন পুরো সিস্টেমকে না ডোবায়। ভারী batch-processing কাজ আর user-facing API একই প্রসেসে থাকলে একটার overload আরেকটাকে থামিয়ে দিতে পারে। আলাদা node/service-এ ভাগ করলে একটার সমস্যা অন্যটাকে স্পর্শ করে না।</div>
</div>
<div class="callout mistake"><span class="tag">Common mistake — শুধু "স্কেল দরকার" ভেবে distributed system বানানো</span>
অনেক টিম মনে করে distributed architecture মানেই ভালো architecture। বাস্তবে distributed system একটা <b>খরচ</b> — অপারেশনাল জটিলতা, ডিবাগিং কষ্ট, নতুন শ্রেণির bug (নিচেই দেখবেন)। যদি একটা বড়, ভালো-টিউন করা একক মেশিন (vertical scaling) আপনার লোড সামলে ফেলে, সেটাই প্রায়ই সহজ, সস্তা, আর কম bug-প্রবণ সমাধান। Distributed system তখনই বানান যখন উপরের চারটা কারণের অন্তত একটা সত্যিকারের প্রয়োজন, কল্পিত প্রয়োজন নয়।</div>

<h3>মডেলের পরিবর্তন — Message Passing বনাম Shared Memory</h3>
<p>একটা single process-এর ভেতরে দুটো thread যোগাযোগ করে <span class="kw">shared memory</span> দিয়ে — একটা variable-এ লিখলে আরেকটা সাথে সাথেই সেটা পড়তে পারে (উপযুক্ত synchronization সহ)। কিন্তু দুটো আলাদা node-এর মধ্যে কোনো shared memory নেই — একমাত্র উপায় হলো <span class="kw">message passing</span>: এক node আরেক node-কে নেটওয়ার্কের মাধ্যমে একটা বার্তা পাঠায় (HTTP request, gRPC call, একটা queue-তে message), আর অপেক্ষা করে জবাবের। এই পার্থক্যটাই distributed system-কে গুণগতভাবে আলাদা করে তোলে — কারণ নেটওয়ার্ক shared memory-এর মতো নির্ভরযোগ্য নয় (পরের সেকশনে বিস্তারিত)।</p>
<div class="grid2">
<div class="box"><b>Node ও Cluster</b> — একটা <span class="kw">node</span> হলো একটা independent কম্পিউটার/প্রসেস যা সিস্টেমের অংশ হিসেবে কাজ করে। একাধিক node একসাথে সমন্বিতভাবে কাজ করলে তাকে বলে <span class="kw">cluster</span>। এই কোর্স জুড়ে "node" ও "cluster" শব্দ দুটো বারবার আসবে।</div>
<div class="box"><b>Latency বনাম Throughput</b> — <span class="kw">latency</span> মানে একটা একক request সম্পন্ন হতে কতটুকু সময় লাগে (যেমন ৫০ms)। <span class="kw">throughput</span> মানে একক সময়ে সিস্টেম মোট কতগুলো request সামলাতে পারে (যেমন ১০,০০০ req/sec)। দুটো প্রায়ই একে অপরের বিপরীতে ট্রেড-অফ করতে হয় — ব্যাচিং করে throughput বাড়ালে প্রতিটা request-এর latency বেড়ে যায়।</div>
</div>

<h3>তিনটা মৌলিক সত্য যা সবকিছু কঠিন করে তোলে</h3>
<p>Distributed system শেখার আগে তিনটা মৌলিক, অপরিবর্তনীয় সত্য মেনে নিতে হবে — এগুলো কোনো ইঞ্জিনিয়ারিং সিদ্ধান্তে "ঠিক করা" যায় না, শুধু এদের সাথে সামঞ্জস্য রেখে ডিজাইন করা যায়।</p>
<h4>১. নেটওয়ার্ক অবিশ্বাস্য (The network is unreliable)</h4>
<p>নেটওয়ার্কে পাঠানো একটা বার্তা দেরি হতে পারে (<span class="kw">delay</span>), হারিয়ে যেতে পারে (<span class="kw">drop</span>), দুইবার পৌঁছাতে পারে (<span class="kw">duplicate</span>, সাধারণত retry-এর কারণে), অথবা পাঠানো ক্রম উল্টে যেতে পারে (<span class="kw">reorder</span>)। এর কোনোটাই একক প্রসেসের function call-এ ঘটে না — একটা function call হয় সফল হয়, নয়তো exception ছোঁড়ে, তাৎক্ষণিকভাবে।</p>
<div class="diagram"><pre>
স্বাভাবিক                    Dropped                     Delayed                    Reordered
──────────                  ──────────                  ──────────                 ──────────
Client   Server              Client   Server              Client   Server            Client   Server
  │        │                   │        │                   │        │                 │        │
  │──req──▶│                   │──req──X   (হারিয়ে গেল)      │──req──▶│                 │─req#2─▶│ (আগে পৌঁছাল)
  │◀─resp──│                   │        │                   │  ... অনেকক্ষণ পর ...      │─req#1─▶│ (পরে পৌঁছাল)
  │        │                   │  (client টাইমআউট, কিন্তু    │◀─resp──│                 │        │
  │        │                   │   জানে না request পৌঁছেছিল  │        │                 │ Server এখন কোন
  │        │                   │   কিনা সার্ভারে!)           │        │                 │ ক্রমে process করবে?
</pre></div>
<div class="callout why"><span class="tag">কেন এটা এত গুরুত্বপূর্ণ</span>
একটা request পাঠিয়ে যদি জবাব না আসে, পাঠানো node জানতে পারে না তিনটা সম্ভাবনার মধ্যে কোনটা ঘটেছে — request-টাই পৌঁছায়নি, নাকি request পৌঁছে কাজও হয়ে গেছে কিন্তু response হারিয়ে গেছে, নাকি সার্ভার এখনো কাজ করছে (শুধু ধীর)। এই অনিশ্চয়তা থেকেই আসে <span class="kw">idempotency</span>, <span class="kw">retry</span>, আর <span class="kw">at-least-once/at-most-once/exactly-once delivery</span>-এর মতো ধারণা — যা Messaging চ্যাপ্টারে বিস্তারিত দেখবেন।</div>
<div class="callout behind"><span class="tag">Two Generals Problem — কেন কোনো acknowledgment স্কিমই ১০০% নিশ্চয়তা দিতে পারে না</span>
একটা ক্লাসিক থট এক্সপেরিমেন্ট এই অনিশ্চয়তার গভীরতা স্পষ্ট করে। দুইটা সেনাবাহিনী দুইটা পাহাড়ে, মাঝখানে শত্রু-অধিকৃত উপত্যকা — দুই সেনাপতি <b>একসাথে</b> আক্রমণ করলে জিতবে, একা করলে হারবে। তাই তাদের আক্রমণের সময় নিয়ে একমত হতে হবে, কিন্তু যোগাযোগের একমাত্র উপায় একজন বার্তাবাহক, যে পথে ধরা পড়ে যেতে পারে (বার্তা হারিয়ে যেতে পারে)। সেনাপতি A বার্তা পাঠাল "কাল ভোরে আক্রমণ" — কিন্তু বার্তাবাহক ধরা পড়তে পারে বলে A নিশ্চিত না B তা পেয়েছে কিনা। তাই B একটা acknowledgment ফেরত পাঠায় — কিন্তু সেই ack-বাহকও ধরা পড়তে পারে, তাই এবার B নিশ্চিত না A সেই ack পেয়েছে কিনা। A যদি ack-এর ack পাঠায়, সেটাও পথে হারাতে পারে — এই শৃঙ্খল অসীম পর্যন্ত চলতে থাকে। গাণিতিকভাবে প্রমাণিত সত্য হলো: একটা অনির্ভরযোগ্য চ্যানেলের ওপর দিয়ে, যতগুলোই বার্তা বিনিময় হোক না কেন, দুই পক্ষ কখনো একসাথে ১০০% নিশ্চিত হতে পারে না যে অন্য পক্ষও প্রস্তুত। এটাই সেই মৌলিক কারণ যার জন্য এই কোর্সের পরে (চ্যাপ্টার ১১) দেখবেন — সত্যিকারের "exactly-once delivery" প্রমাণযোগ্যভাবে অসম্ভব, শুধু at-least-once বা at-most-once বেছে নেওয়া যায়, মাঝামাঝি কোনো নিখুঁত তৃতীয় পথ নেই।</div>

<h4>২. কোনো ভাগাভাগি করা ঘড়ি নেই (No shared clock)</h4>
<p>একটা একক প্রসেসে সবকিছু একই ঘড়ির সাপেক্ষে ঘটে — event A যদি event B-এর আগে code-এ লেখা হয়, তাহলে A-ই আগে ঘটেছে, নিঃসন্দেহে। কিন্তু দুটো আলাদা node-এর প্রতিটার নিজস্ব hardware clock আছে, আর এই ঘড়িগুলো কখনোই নিখুঁতভাবে সমলয়ে (synchronized) থাকে না — সেকেন্ডে মিলিসেকেন্ড পার্থক্য (<span class="kw">clock drift</span>) জমতেই থাকে। ফলে "node A-তে event X node B-এর event Y-এর আগে ঘটেছিল কি না" — এই সাধারণ প্রশ্নের উত্তর দেওয়াই যান্ত্রিকভাবে অসম্ভব হয়ে দাঁড়ায় যদি শুধু wall-clock timestamp-এর উপর নির্ভর করেন।</p>
<div class="callout behind"><span class="tag">এই সমস্যার সমাধান কীভাবে হয় — পরের চ্যাপ্টারের ভূমিকা</span>
এই একটামাত্র সত্য থেকেই পুরো একটা চ্যাপ্টার (২. Time, Clock ও Ordering) তৈরি হয়েছে। সংক্ষেপে বলা যায়: distributed system-এ wall-clock timestamp-এর বদলে <span class="kw">logical clock</span> (Lamport clock, vector clock) দিয়ে "before/after" সম্পর্ক নির্ণয় করা হয় — physical সময় না মেপে, causality (কোন event কোনটার কারণ) মেপে।</div>

<h4>৩. আংশিক ব্যর্থতা (Partial failure)</h4>
<p>একটা single process-এর জন্য মাত্র দুটো অবস্থা সম্ভব — চলছে, অথবা বন্ধ। কিন্তু একটা distributed system-এ N-টা node-এর মধ্যে ১টা ক্র্যাশ করলেও বাকি N-১টা স্বাভাবিকভাবে চলতে থাকে — একে বলে <span class="kw">partial failure</span>, আর এটা distributed system-এর সবচেয়ে গভীর ও পাল্টা-স্বজ্ঞাত (counter-intuitive) সমস্যা। আরও খারাপ ব্যাপার হলো — একটা node-এর প্রতিবেশী node-রা এমনকি এটাও নিশ্চিতভাবে জানতে পারে না যে সেই node সত্যিই ক্র্যাশ করেছে, নাকি শুধু ধীর (GC pause, CPU overload) হয়ে জবাব দিতে দেরি করছে। বাইরে থেকে "মৃত" আর "ধীর"-কে আলাদা করার কোনো নিশ্চিত উপায় নেই।</p>
<pre><span class="c">// Node A চেষ্টা করছে বুঝতে Node B বেঁচে আছে কি না</span>
response = sendRequest(NodeB, "ping", timeout: 3000ms)

if response == null:
    <span class="c">// টাইমআউট হয়েছে — কিন্তু এর মানে কী, নিশ্চিতভাবে জানার উপায় নেই:</span>
    <span class="kw">// সম্ভাবনা ১:</span> NodeB সত্যিই ক্র্যাশ করেছে
    <span class="kw">// সম্ভাবনা ২:</span> NodeB বেঁচে আছে, কিন্তু GC pause / CPU overload-এ ধীর
    <span class="kw">// সম্ভাবনা ৩:</span> NodeB জবাব পাঠিয়েছিল, কিন্তু সেটাই নেটওয়ার্কে হারিয়ে গেছে
    <span class="kw">// সম্ভাবনা ৪:</span> শুধু network partition — উভয় node-ই বেঁচে, একে অপরের সাথে কথা বলতে পারছে না
    markAsSuspected(NodeB)   <span class="c">// "মৃত" ঘোষণা নয়, "সন্দেহভাজন" — নিশ্চিততা কখনোই সম্ভব নয়</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — timeout মানেই "node মারা গেছে" ধরে নেওয়া</span>
অনেক নতুন ডিজাইন ধরে নেয় timeout হলেই সেই node নিরাপদে "মৃত" ঘোষণা করা যায় এবং তার কাজ অন্য node-কে দেওয়া যায়। বাস্তবে node-টা হয়তো বেঁচে আছে (শুধু ধীর) এবং সে নিজেও তার কাজ চালিয়ে যাচ্ছে — ফলে দুটো node একই কাজ (যেমন: একই leader হিসেবে লেখা) সমান্তরালে করে ফেলতে পারে, একে বলে <span class="kw">split-brain</span>। এই কারণেই ৯ নম্বর চ্যাপ্টারে (Failure Detection ও Fault Tolerance) দেখবেন failure detection সবসময় সম্ভাবনা-ভিত্তিক (probabilistic), কখনো ১০০% নিশ্চিত নয়।</div>

<h3>একটা ছবিতে পার্থক্য — Monolith বনাম Distributed</h3>
<p>নিচের চিত্রটা একই লজিক্যাল সিস্টেম দুইভাবে দেখাচ্ছে — বাঁয়ে একক মেশিনে, ডানে ৩টা node জুড়ে ছড়ানো। লক্ষ্য করুন ডানপাশে নতুন যে ব্যর্থতার পৃষ্ঠতল (failure surface) তৈরি হলো, যা বাঁয়ে ছিলই না।</p>

<h3>৮টা Fallacies of Distributed Computing</h3>
<p>১৯৯০-এর দশকে Sun Microsystems-এর <span class="kw">L. Peter Deutsch</span> (ও সহকর্মীরা) আটটা ভুল ধারণা তালিকাভুক্ত করেন যা প্রায় সব নতুন distributed system ডেভেলপার প্রথমে বিশ্বাস করে বসেন — আর প্রতিটাই বাস্তবে ভুল প্রমাণিত হয়, প্রায়ই production outage-এর মাধ্যমে শেখা হয়।</p>

<h2 class="title">২. Time, Clock ও Ordering</h2>
<p class="lead">আগের চ্যাপ্টারে একটা কঠিন সত্য মেনে নিয়েছিলাম — distributed system-এ কোনো <b>শেয়ার্ড ঘড়ি</b> নেই। এই চ্যাপ্টারে দেখব সেই একটা বাক্য থেকে ঠিক কী কী সমস্যা তৈরি হয়, আর ইঞ্জিনিয়াররা কীভাবে "কোন event আগে ঘটেছে" এই প্রশ্নের উত্তর — শারীরিক ঘড়ি ছাড়াই — নির্ভরযোগ্যভাবে দেওয়ার উপায় বের করেছে।</p>

<h3>শেয়ার্ড ঘড়ি নেই — "একই সময়ে" কথাটার আসলে কোনো নিখুঁত অর্থ নেই</h3>
<p>একটা মেশিনে চলা প্রোগ্রামে event-এর ক্রম বোঝা সহজ — একটা <span class="kw">CPU</span>, একটা instruction pointer, একটা রৈখিক সময়। কিন্তু দুইটা আলাদা সার্ভারে দুইটা event ঘটলে — সার্ভার A-তে ১০:০০:০০.১২৩-এ একটা write, সার্ভার B-তে ১০:০০:০০.১২১-এ আরেকটা write — কোনটা "আগে" ঘটেছে তা বলা আসলে যতটা সহজ মনে হয় ততটা নয়। কারণ A আর B-এর <span class="kw">physical clock</span> (হার্ডওয়্যার oscillator-চালিত ঘড়ি) কখনোই পুরোপুরি সমলয় (synchronized) নয়।</p>
<div class="callout why"><span class="tag">কেন এটা এড়ানো যায় না</span>
প্রতিটা সার্ভারের নিজস্ব একটা quartz crystal oscillator থাকে যেটা ঘড়ির টিক গোনে — কিন্তু কোনো দুইটা crystal হুবহু একই ফ্রিকোয়েন্সিতে দোলে না (তাপমাত্রা, উৎপাদন-ভিন্নতা, বার্ধক্যের কারণে)। ফলে প্রতিটা মেশিনের ঘড়ি বাস্তব সময় থেকে ধীরে ধীরে সরে যায় — একে বলে <span class="kw">clock drift</span>। দুটো মেশিনের ঘড়ি একই মুহূর্তে যে পরিমাণ ভিন্ন রিডিং দেখায় তাকে বলে <span class="kw">clock skew</span>। এটা কোনো বাগ নয় — এটা পদার্থবিজ্ঞানের সীমাবদ্ধতা, যেকোনো দুইটা physically আলাদা ঘড়ির জন্য অনিবার্য।</div>

<h3>NTP সিঙ্ক্রোনাইজেশন — শুধু error-কে সীমাবদ্ধ করে, শূন্য করে না</h3>
<p><span class="kw">NTP</span> (Network Time Protocol) নিয়মিত বিরতিতে সার্ভারের ঘড়িকে একটা reference time-এর কাছাকাছি টেনে আনে। কিন্তু এই সংশোধনটাও নেটওয়ার্কের মধ্য দিয়েই আসে — আর নেটওয়ার্ক latency অসম (asymmetric) ও অনিয়মিত (jittery), তাই NTP নিজেই নিশ্চিতভাবে জানে না request আর response-এর মধ্যে ঠিক কতটা সময় গেল। ফলাফল: ভালোভাবে কনফিগার করা NTP-ও সাধারণত কয়েক মিলিসেকেন্ড থেকে কয়েক দশ মিলিসেকেন্ড error bound রেখে দেয় (datacenter-এর ভেতরে কম, WAN-এর ওপারে বেশি) — আর কনফিগারেশন খারাপ হলে, বা কোনো সার্ভার সাময়িকভাবে sync হারালে, এই ব্যবধান সেকেন্ডের পর্যায়েও চলে যেতে পারে।</p>

<h3>Naive Wall-Clock Timestamp দিয়ে Ordering — কেন এটা বিপজ্জনক</h3>
<p>উপরের বাস্তবতা মেনে নিলে একটা সহজ কিন্তু গুরুত্বপূর্ণ সিদ্ধান্তে পৌঁছানো যায়: দুইটা আলাদা নোডে তৈরি হওয়া timestamp তুলনা করে "কোনটা আগে ঘটেছে" বলাটা নীতিগতভাবেই অনির্ভরযোগ্য, কারণ timestamp-দুটো ভিন্ন ঘড়ি থেকে এসেছে, যাদের মধ্যে clock skew আছে।</p>
<div class="callout mistake"><span class="tag">Common mistake — wall-clock timestamp দিয়ে "কোন write শেষ হলো" ঠিক করা</span>
ধরুন দুইটা সার্ভার একই record আপডেট করছে (leaderless replication-এ এটা খুবই সাধারণ, চ্যাপ্টার ৫-এ বিস্তারিত দেখবেন)। conflict resolve করার সবচেয়ে সহজ (এবং বহুল-ব্যবহৃত) পদ্ধতি: <span class="kw">Last-Write-Wins (LWW)</span> — যে write-এর wall-clock timestamp বড়, সেটাই টিকে যাবে, বাকিটা ফেলে দেওয়া হবে। সমস্যা হলো, Server C-এর ঘড়ি যদি Server A-এর চেয়ে কয়েক মিলিসেকেন্ড পিছিয়ে থাকে (উপরের উদাহরণের মতো), তাহলে C-তে <b>বাস্তবে পরে</b> ঘটা একটা write A-এর <b>বাস্তবে আগে</b> ঘটা write-এর চেয়ে ছোট timestamp পাবে — আর LWW সেই নতুন, সঠিক ডেটাটাকেই নিঃশব্দে বাতিল করে দেবে। ব্যবহারকারীর কাছে এটা দেখাবে যেন তার সাম্প্রতিক আপডেট "হারিয়ে গেছে" — অথচ কোনো error লগ হবে না, কারণ সিস্টেমের দৃষ্টিতে সবকিছুই ঠিকঠাক কাজ করেছে।
</div>

<h3>Lamport Logical Clock — কার্যকারণ ক্রম গণনা করা</h3>
<p>সমস্যাটা যেহেতু "wall-clock সময়" নিয়ে, সমাধানও সময়ের বাইরে খোঁজা হলো: <b>Leslie Lamport</b> ১৯৭৮ সালে দেখালেন, event-এর ক্রম ঠিক করতে আসল ঘড়ির দরকারই নেই — দরকার শুধু <b>কে কাকে কারণ (cause) হয়ে প্রভাবিত করেছে</b> তার হিসাব। এই ধারণাকে বলে <span class="kw">Lamport logical clock</span> — প্রতিটা নোডে একটামাত্র integer counter, বাস্তব সময়ের সাথে যার কোনো সম্পর্ক নেই।</p>

<h4>অ্যালগরিদম</h4>
<pre><span class="c">// প্রতিটা নোডে একটা local counter থাকে, শুরুতে 0</span>

<span class="kw">function</span> onInternalEvent():
    counter = counter + 1                      <span class="c">// নিজের ভেতরে কিছু ঘটলেই বাড়াও</span>

<span class="kw">function</span> onSendMessage(message):
    counter = counter + 1
    message.timestamp = counter                 <span class="c">// counter সংযুক্ত করে পাঠাও</span>

<span class="kw">function</span> onReceiveMessage(message):
    counter = max(counter, message.timestamp) + 1   <span class="c">// দুটোর বড়টার চেয়ে ১ বেশি</span></pre>
<p>এই তিনটা নিয়মের ফলাফল একটা guarantee: যদি event <b>a</b> সত্যিই event <b>b</b>-কে কারণ হিসেবে প্রভাবিত করে থাকে — একে বলে <span class="kw">happens-before</span> সম্পর্ক, লেখা হয় a → b — তাহলে নিশ্চিতভাবে LC(a) সংখ্যাটা LC(b) সংখ্যার চেয়ে ছোট হবে।</p>

<div class="grid2">
  <div class="box"><b>যা এটা ক্যাপচার করে</b> a → b (কারণ-কার্য সম্পর্ক, সরাসরি বা কয়েক ধাপ বার্তার মাধ্যমে পরোক্ষভাবে) থাকলে নিশ্চিতভাবে LC(a) ছোট হবে LC(b)-এর চেয়ে। এই একমুখী guarantee-টাই causal order বজায় রাখার জন্য যথেষ্ট অনেক ক্ষেত্রে (যেমন distributed log-এ event replay করা)।</div>
  <div class="box"><b>যা এটা ক্যাপচার করে না</b> উল্টোটা সত্যি নয় — শুধু LC(a) ছোট LC(b)-এর চেয়ে দেখে বলা যায় না a আসলেই b-এর কারণ। দুটো সম্পূর্ণ causally-unrelated (independent, একে অপরকে প্রভাবিত করেনি এমন) event একে অপরের চেয়ে ভিন্ন — এমনকি সমান — Lamport সংখ্যা পেতে পারে। Lamport clock সব event-কে একটা <span class="kw">total order</span>-এ জোর করে বসিয়ে দেয়, কিন্তু বাস্তবে অনেক event <span class="kw">concurrent</span> (একে অপরের সাথে কার্যকারণহীন) — তাদের মধ্যে "কে আগে" এই প্রশ্নটারই কোনো অর্থ নেই।</div>
</div>

<h3>Vector Clock — Lamport-এর সীমাবদ্ধতা সমাধান</h3>
<p>যদি শুধু "a কি b-এর কারণ" জানাই যথেষ্ট না হয় — বরং "a আর b কি সত্যিই সম্পূর্ণ স্বতন্ত্র (concurrent)" এই প্রশ্নের নির্ভরযোগ্য উত্তরও দরকার হয় (যেমন conflict detection-এ, চ্যাপ্টার ৫-এ replication আলোচনায় গুরুত্বপূর্ণ হবে) — তাহলে একটামাত্র সংখ্যা যথেষ্ট নয়। <span class="kw">Vector clock</span> প্রতিটা নোডের জন্য একটা আলাদা counter রাখে একটা array-তে, একটামাত্র সংখ্যার বদলে।</p>

<h4>অ্যালগরিদম</h4>
<pre><span class="c">// N নোডের cluster-এ প্রতিটা নোড length-N একটা vector V রাখে, শুরুতে সব ইনডেক্স 0</span>
<span class="c">// নোড i শুধু নিজের ইনডেক্স V[i] বাড়ায়, কখনোই অন্যেরটা সরাসরি নয়</span>

<span class="kw">function</span> onInternalEvent(nodeId):
    V[nodeId] = V[nodeId] + 1

<span class="kw">function</span> onSendMessage(nodeId, message):
    V[nodeId] = V[nodeId] + 1
    message.vector = copy(V)                    <span class="c">// পুরো vector-টাই সংযুক্ত করে পাঠাও</span>

<span class="kw">function</span> onReceiveMessage(nodeId, message):
    <span class="kw">for</span> j in 0..N-1:
        V[j] = max(V[j], message.vector[j])       <span class="c">// প্রতিটা ইনডেক্সে element-wise max</span>
    V[nodeId] = V[nodeId] + 1                    <span class="c">// এরপর নিজের receive event-টা গোনা</span></pre>
<p>দুইটা vector তুলনা করার নিয়ম সহজ: V1 → V2 (V1 causally V2-এর আগে) তখনই যখন V1-এর প্রতিটা ইনডেক্স V2-এর সংশ্লিষ্ট ইনডেক্সের চেয়ে ছোট অথবা সমান (সব ইনডেক্সে V1 ≤ V2), এবং দুটো ভেক্টর সম্পূর্ণ অভিন্ন নয়। যদি কোনো দিকেই এই শর্ত পূরণ না হয় — অর্থাৎ কিছু ইনডেক্সে V1 বড়, কিছু ইনডেক্সে V2 বড় — তাহলে দুটো event নিশ্চিতভাবে <b>concurrent</b>, কোনো অস্পষ্টতা ছাড়াই। এটাই Lamport clock-এর চেয়ে vector clock-এর মূল সুবিধা: happens-before আর concurrent — দুটোই দ্ব্যর্থহীনভাবে নির্ণয় করা যায়, শুধু একমুখী guarantee নয়।</p>

যদি শুধু causal ordering দরকার হয় (যেমন একটা distributed log-এ event-গুলো সঠিক causal ক্রমে replay করা), Lamport clock যথেষ্ট এবং সস্তা। কিন্তু যদি সিস্টেমকে সিদ্ধান্ত নিতে হয় "দুইটা write কি সত্যিই সংঘর্ষে (conflict) আছে, নাকি একটা আরেকটার আপডেট" — তাহলে vector clock (বা তার বাস্তব রূপ, নিচে দেখুন) ছাড়া উপায় নেই, O(n) খরচ মেনে নিয়েই।
</div>

<h3>বাস্তব জগতে — Version Vector থেকে Google-এর TrueTime পর্যন্ত</h3>
<p>Vector clock-এর ধারণাটা বাস্তব ডাটাবেসে হুবহু নয়, বরং সামান্য পরিবর্তিত রূপে ব্যবহৃত হয়েছে — একে বলে <span class="kw">version vector</span>। <b>Amazon Dynamo</b>-র নকশা অনুসরণ করা leaderless replication সিস্টেম যেমন পুরনো <b>Cassandra</b> ও <b>Riak</b>-এ, প্রতিটা object-এর সাথে একটা version vector সংরক্ষিত থাকে, যাতে দুইটা replica-তে একই object-এর ভিন্ন update সত্যিই সংঘর্ষে আছে কি না তা নির্ভুলভাবে ধরা যায় (চ্যাপ্টার ৫-এ replication strategy আলোচনায় এটা আবার আসবে)। wall-clock timestamp দিয়ে LWW-এর যে বিপদ আগে দেখানো হলো, তার সঠিক প্রকৌশলগত সমাধানই এটা।</p>
<div class="callout behind"><span class="tag">Spanner যেভাবে পুরো সমস্যাটাই এড়িয়ে যায়</span>
Google <span class="kw">Spanner</span> ভিন্ন পথ নিয়েছে — logical clock দিয়ে causal order গণনা না করে, তারা হার্ডওয়্যার-সহায়ক একটা physical clock বানিয়েছে যার নাম <span class="kw">TrueTime</span>। প্রতিটা datacenter-এ GPS receiver ও atomic clock বসিয়ে তারা wall-clock সময়ের uncertainty-কে কয়েক মিলিসেকেন্ডের বদলে মাত্র কয়েক মিলিসেকেন্ডেরও কম একটা <b>bounded interval</b>-এ নামিয়ে এনেছে — আর তারপর সেই সীমিত অনিশ্চয়তা মেনে নিয়েই transaction ordering-এর সিদ্ধান্ত নেয় (প্রয়োজনে সেই bound-টুকু অপেক্ষা করে নিশ্চিত হয়)। এটা logical clock-এর বিকল্প নয়, বরং clock uncertainty সমস্যাটাকে ইঞ্জিনিয়ারিং দিয়ে (বিশেষ হার্ডওয়্যার) ছোট করে ফেলার একটা সম্পূর্ণ ভিন্ন কৌশল — বিস্তারিত চ্যাপ্টার ১৪-এর case study-তে।</div>

<h3>কোনটা কখন বেছে নেবেন</h3>
<p>বাস্তব সিস্টেম ডিজাইন করার সময় এই চ্যাপ্টারের ধারণাগুলো নিচের মতো প্রশ্নে রূপ নেয়:</p>
<div class="grid2">
  <div class="box"><b>শুধু causal ক্রম জানা দরকার?</b> Lamport clock ব্যবহার করুন — সস্তা, সহজ, single-integer overhead।</div>
  <div class="box"><b>Conflict নিশ্চিতভাবে সনাক্ত করা দরকার?</b> Vector clock / version vector ব্যবহার করুন — O(n) খরচ মেনে নিতে হবে, কিন্তু concurrency মিস হবে না।</div>
  <div class="box"><b>বহু datacenter জুড়ে strict transaction ordering দরকার?</b> logical clock দিয়েই যথেষ্ট নাও হতে পারে — Spanner-এর TrueTime-এর মতো bounded-uncertainty physical clock বিবেচনা করুন (বাস্তবে এটা বিশাল ইনফ্রাস্ট্রাকচার বিনিয়োগ)।</div>
  <div class="box"><b>যেকোনো ক্ষেত্রেই</b> wall-clock timestamp-কে একমাত্র truth ধরে "কোনটা শেষ write" সিদ্ধান্ত নেবেন না — যদি না আপনি জানেন আপনার clock synchronization-এর precise error bound কত, এবং সেই bound আপনার ব্যবসায়িক ঝুঁকির তুলনায় গ্রহণযোগ্য।</div>
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Distributed system-এ কোনো শেয়ার্ড ঘড়ি নেই — physical clock-এ অনিবার্য drift ও skew থাকে, আর NTP সেই ব্যবধান কমায় মাত্র, শূন্যে আনে না। ফলে wall-clock timestamp দিয়ে "কোন event আগে ঘটল" ঠিক করা বিপজ্জনক — বিশেষ করে naive Last-Write-Wins-এ, যেখানে clock skew নিঃশব্দে সঠিক, নতুন ডেটা মুছে দিতে পারে। <span class="kw">Lamport logical clock</span> বাস্তব সময়কে সম্পূর্ণ পাশ কাটিয়ে causal order (happens-before) ক্যাপচার করে একমুখী guarantee দিয়ে, কিন্তু concurrency সনাক্ত করতে পারে না। <span class="kw">Vector clock</span> নোড-প্রতি আলাদা counter রেখে এই সীমাবদ্ধতা কাটায় — happens-before ও concurrent দুটোই নিশ্চিতভাবে বলা যায়, তবে O(n) storage খরচে। বাস্তব সিস্টেম দুই পথই বেছে নিয়েছে — Cassandra/Riak-এর মতো leaderless database-এ version vector দিয়ে conflict detection, আর Google Spanner-এ TrueTime দিয়ে সম্পূর্ণ ভিন্ন, হার্ডওয়্যার-সহায়ক পথ। মনে রাখবেন — এই পুরো চ্যাপ্টারটাই ছিল "একই সময়ে দুটো ঘটনা ঘটলে সিস্টেম কী দেখবে" এই প্রশ্নের একটা অংশ মাত্র। পরের চ্যাপ্টারে (৩. Consistency Models) আমরা দেখব ordering-এর এই ভিত্তির উপর দাঁড়িয়ে একটা distributed system আসলে কী কী <b>guarantee</b> ব্যবহারকারীকে দিতে পারে — এবং কোন guarantee-র জন্য কী মূল্য দিতে হয়।

<h2 class="title">৩. Consistency Models</h2>
<p class="lead">একই ডেটার একাধিক কপি (replica) যখন একসাথে read/write হয়, তখন প্রশ্ন ওঠে — একটা read ঠিক কী দেখতে <b>বাধ্য</b>? <span class="kw">Consistency model</span> আসলে একটা চুক্তি (contract) — একটা read, সাম্প্রতিক বা concurrent write-এর সাপেক্ষে কী দেখতে পারবে তার নিয়ম। এই চুক্তি যত কড়া হয়, তত বেশি coordination লাগে, তত কমে availability আর latency — এটাই এই পুরো চ্যাপ্টারের কেন্দ্রীয় ট্রেড-অফ।</p>

<h3>Consistency Model আসলে কী, আর কেন দরকার</h3>
<p>একটা single-machine database-এ এই প্রশ্নটাই ওঠে না — একটাই copy, তাই read সবসময় সর্বশেষ write দেখে। কিন্তু replication চালু হলেই (চ্যাপ্টার ৫-এ বিস্তারিত) একই ডেটার ৩টা, ৫টা কপি ভিন্ন ভিন্ন মেশিনে থাকে, আর network delay-এর কারণে সব কপিতে write একসাথে পৌঁছায় না। তাহলে node<sub>A</sub>-তে যে read যায় সে কি node<sub>B</sub>-তে এইমাত্র হওয়া write দেখবে? <b>এই প্রশ্নের উত্তর নির্ধারণ করাই consistency model-এর কাজ।</b> একটা model যত বেশি guarantee দেয় (সব node সবসময় একরকম, real-time ক্রম মেনে) — ততই প্রতিটা operation-এ node-গুলোর মধ্যে বার্তা চালাচালি (coordination) লাগে, যা latency বাড়ায় আর network partition-এর সময় availability কমিয়ে দেয়। যত কম guarantee — তত কম coordination, তত বেশি availability/latency। এই পুরো spectrum-টাই এই চ্যাপ্টারের বিষয়।</p>
<div class="callout why"><span class="tag">এক্সাম ভুল ধারণা</span>
"Consistency" শব্দটা ACID transaction-এর C (Consistency, অর্থাৎ constraint মেনে চলা) থেকে আলাদা জিনিস বোঝায় এখানে। Distributed systems-এ consistency model বলতে বোঝায় <b>একাধিক replica জুড়ে ordering guarantee</b> — কোন read কোন write দেখবে তার নিয়ম, কোনো business-rule constraint নয়।</div>
<div class="callout mistake"><span class="tag">আরেকটা সাধারণ গুলিয়ে ফেলা — Linearizability বনাম Serializability</span>
এই দুটো শব্দ শুনতে প্রায় একইরকম আর দুটোই "কড়া guarantee" বোঝায় বলে প্রায়ই একে অপরের প্রতিশব্দ ভাবা হয় — বাস্তবে এরা সম্পূর্ণ ভিন্ন স্তরে কাজ করে। <b>Linearizability</b> (এই চ্যাপ্টারের বিষয়) কথা বলে আলাদা আলাদা <b>একক operation</b> (একটা read, একটা write) নিয়ে — একাধিক replica জুড়ে সেগুলো real-time ক্রম মেনে চলবে কিনা। <b>Serializability</b> (ACID-এর Isolation guarantee-র সাথে সম্পর্কিত, চ্যাপ্টার ৮-এ ACID সংজ্ঞা দেখুন) কথা বলে একাধিক অপারেশন নিয়ে গঠিত <b>পুরো transaction</b> নিয়ে — একগুচ্ছ concurrent transaction এমনভাবে চলবে যেন সেগুলো কোনো এক ক্রমে, একটার পর একটা (serially) চলেছে, যদিও বাস্তবে সমান্তরালে চলেছে। একটা ডেটাবেস serializable হতে পারে অথচ linearizable না-ও হতে পারে (transaction-এর ভেতরের ক্রম নিয়ে কথা বলে, বাইরের real-time ক্রম নিয়ে নয়), আবার একটা key-value store শুধু single-operation linearizability দিতে পারে, multi-operation transaction ছাড়াই। দুটোই "strong guarantee" — কিন্তু ভিন্ন প্রশ্নের উত্তর দেয়, তাই "strongly consistent" বলার আগে ঠিক কোনটা বোঝানো হচ্ছে তা স্পষ্ট করা জরুরি।</div>

<h3>Linearizability — সবচেয়ে কড়া guarantee (Strong Consistency)</h3>
<p><span class="kw">Linearizability</span> (এক ধরনের <span class="kw">strong consistency</span>) বলে: প্রতিটা operation (read বা write) এমনভাবে আচরণ করে যেন সেটা তার invocation আর response-এর মাঝের ঠিক একটা মুহূর্তে, তাৎক্ষণিকভাবে ঘটে গেছে — আর সব node একই বাস্তব-সময়-সংগত (real-time-respecting) ক্রমে একমত হয়। মানে, যদি write W শেষ হওয়ার পরে read R শুরু হয়, তাহলে R অবশ্যই W (বা তার পরের কোনো write) দেখবে — কখনোই পুরনো ডেটা নয়।</p>
<div class="diagram"><pre>
Client A: ─write(x=5)──┤
                        │  (write সম্পন্ন — এখন থেকে x=5 বলে সবাই মানতে বাধ্য)
Client B:                    ├──read(x) → অবশ্যই 5 পাবে, কখনো পুরনো মান নয়
                    real-time axis ──────────────────▶
</pre></div>
<p>এই guarantee পেতে হলে প্রতিটা operation-এর জন্য majority node-এর সাথে coordination লাগে (quorum/consensus — চ্যাপ্টার ৬-এ Paxos/Raft বিস্তারিত) — প্রতিটা write সব (বা majority) replica নিশ্চিত না করা পর্যন্ত সফল ঘোষণা করা যায় না। এটাই কেন linearizability সবচেয়ে ব্যয়বহুল (latency ও availability-র দিক থেকে) মডেল।</p>
<div class="callout behind"><span class="tag">কেন এটা এত costly</span>
Linearizability নিশ্চিত করতে প্রতিটা operation-এর একটা single, globally-agreed ক্রমে বসতে হয় — যেন গোটা cluster একটাই মেশিনের মতো আচরণ করছে। এই সিঙ্গেল-ক্রম বজায় রাখতে হয় একটা leader/consensus protocol দিয়ে, যেখানে প্রতিটা write majority node-এর acknowledgment ছাড়া commit হয় না। Network partition হলে minority side-এর node কোনো write/read servে (linearizable guarantee বজায় রেখে) করতে পারে না — availability compromise হয়ে যায়। এটাই চ্যাপ্টার ৪-এ CAP theorem-এর মূল জায়গা।</div>

<h3>Sequential Consistency — একই ক্রম, কিন্তু real-time নয়</h3>
<p><span class="kw">Sequential consistency</span> কিছুটা শিথিল: সব node operation-গুলো <b>একই ক্রমে</b> দেখে (একটা total order আছে), কিন্তু সেই ক্রম আবশ্যিকভাবে real-time/wall-clock ক্রম মেনে চলতে হবে না। অর্থাৎ, প্রতিটা node একমত হয় "কী আগে, কী পরে" — কিন্তু সেই সিদ্ধান্ত বাস্তব সময়ের সাথে না মিললেও চলবে, যতক্ষণ প্রতিটা client নিজের operation-গুলো program-order অনুযায়ী ইস্যু করে।</p>
<p>ফারাকটা সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ: linearizability বলে "real-time অনুযায়ী আগে যেটা শেষ হয়েছে সেটাই আগে দেখাতে হবে"; sequential consistency শুধু বলে "সবাই একই একটা ক্রম মানবে" — সেই ক্রম বাস্তব সময়ের সাপেক্ষে একটু আগে-পিছে হলেও আপত্তি নেই। তাই এটা linearizability-র চেয়ে দুর্বল, কিন্তু এখনো একটা total order বজায় রাখে বলে causal consistency-র চেয়ে শক্তিশালী।</p>

<h3>Causal Consistency — কারণ-ফলাফল সম্পর্ক রক্ষা করা</h3>
<p><span class="kw">Causal consistency</span> total order-এর দাবি ছেড়ে দেয় — শুধু <b>কারণ-ফলাফল (cause-and-effect)</b> সম্পর্ক রক্ষা করে। যদি operation A, operation B-কে প্রভাবিত করে থাকে (causally related) — যেমন B, A-এর ফলাফল পড়ে তারপর লিখেছে — তাহলে সব node A-কে B-এর আগে দেখবে। কিন্তু যেসব operation একে অপরের সাথে causally সম্পর্কিত নয় (concurrent, independent), সেগুলো ভিন্ন ভিন্ন node ভিন্ন ভিন্ন ক্রমে দেখতে পারে — আর তাতে কোনো সমস্যা নেই।</p>
<div class="callout behind"><span class="tag">চ্যাপ্টার ২-এর সাথে সরাসরি সংযোগ</span>
Causal consistency বাস্তবে বাস্তবায়ন হয় ঠিক আগের চ্যাপ্টারে শেখা <span class="kw">vector clock</span> দিয়ে। প্রতিটা write-এর সাথে তার vector clock (কোন replica-র কোন version পর্যন্ত এই write "দেখেছে") সংরক্ষিত থাকে। একটা replica নতুন কোনো write প্রয়োগ করার আগে চেক করে — তার নিজের vector clock কি সেই write-এর "দেখা" সব আগের write already ধারণ করে? যদি না করে, replica অপেক্ষা করে (বা buffer করে) যতক্ষণ না causally-আগের সব write পৌঁছায়। happens-before সম্পর্ক (চ্যাপ্টার ২) আর causal consistency-র সংজ্ঞা আসলে একই জিনিস — একটা তত্ত্ব, আরেকটা তার বাস্তবায়ন।</div>
<pre><span class="c">// Session token দিয়ে causal সম্পর্ক client-side রক্ষা করা (read-your-writes বাস্তবায়ন)</span>
var writeResult = await db.WriteAsync(key, value);
<span class="c">// writeResult.VectorClock = এই write ঘটার সময় replica-র vector clock</span>
session.LastSeen = writeResult.VectorClock;   <span class="c">// token client session-এ সংরক্ষণ</span>

<span class="c">// পরের যেকোনো read-এ এই token পাঠানো হয়</span>
var read = await db.ReadAsync(key, minVersion: session.LastSeen);
<span class="c">// replica নিশ্চিত করে: তার local vector clock >= session.LastSeen</span>
<span class="c">// না হলে সেই replica এখনো "পিছিয়ে আছে" — অন্য replica-তে redirect বা wait করবে</span></pre>

<h4>Session Guarantees — causal consistency-র চারটি ব্যবহারিক রূপ</h4>
<p>Causal consistency একটা ছাতা-ধারণা; বাস্তবে এটা client-এর অভিজ্ঞতায় চারটা নির্দিষ্ট guarantee হিসেবে ধরা হয় — প্রতিটার নিজস্ব bug-scenario আছে যা সেটা ছাড়া ঘটে:</p>
<div class="grid2">
<div class="box"><b>Read-your-writes</b> নিজের করা write নিজে সবসময় পরে দেখা যাবে। <br><span class="badge">bug ছাড়া</span> একটা comment পোস্ট করে refresh করলে সেটা উধাও — কারণ read একটা replica-তে গেছে যেখানে write তখনো পৌঁছায়নি।</div>
<div class="box"><b>Monotonic reads</b> একটা client পরপর read করলে, আগে যা দেখেছে তার চেয়ে "পিছিয়ে" যাবে না। <br><span class="badge">bug ছাড়া</span> একবার ৫টা notification দেখার পর refresh করলে ৩টা দেখা যাচ্ছে — সময় পিছিয়ে গেছে মনে হয়।</div>
<div class="box"><b>Monotonic writes</b> একই client-এর লেখা write-গুলো সব replica-তে একই ক্রমে প্রয়োগ হবে, যে ক্রমে সেগুলো ইস্যু হয়েছিল। <br><span class="badge">bug ছাড়া</span> profile picture আপলোড তারপর নাম বদলালে, কোনো replica-তে নাম বদল আগে প্রয়োগ হয়ে পরে পুরনো ছবি ফিরে আসতে পারে।</div>
<div class="box"><b>Writes-follow-reads</b> একটা client যা পড়েছে তার ভিত্তিতে যে write করে, সেই write সবসময় সেই read-করা ভার্সনের "পরে" গণ্য হবে। <br><span class="badge">bug ছাড়া</span> একটা spam comment মুছে দেওয়ার পর তার reply যদি অন্য replica-তে মুছে-ফেলা comment-এর <b>আগে</b> দেখা যায়, তাহলে reply আসল context হারায়।</div>
</div>

<h3>Eventual Consistency — সবচেয়ে শিথিল guarantee</h3>
<p><span class="kw">Eventual consistency</span> সবচেয়ে দুর্বল কিন্তু সবচেয়ে বেশি availability দেয়: এটা <b>কখন</b> সব replica এক জায়গায় মিলবে তার কোনো নিশ্চয়তা দেয় না — শুধু বলে, নতুন কোনো write না এলে, শেষমেশ (eventually) সব replica একই state-এ পৌঁছাবে। এর মধ্যে সাময়িকভাবে ভিন্ন replica ভিন্ন উত্তর দিতে পারে, এমনকি ordering guarantee-ও (causal পর্যন্ত) নাও থাকতে পারে সবচেয়ে শিথিল রূপে।</p>
<div class="callout mistake"><span class="tag">Common misconception</span>
"Eventually consistent" মানে এই না যে ডেটা "কিছুক্ষণ পরে ঠিক হয়ে যাবে" এমন কোনো bounded সময়সীমা আছে — সংজ্ঞায় কোনো time bound নেই। ব্যবহারিকভাবে এটা মিলিসেকেন্ড থেকে (normal অবস্থায়) কিন্তু network partition দীর্ঘায়িত হলে ঘণ্টাও লাগতে পারে। "Eventual" আর "inconsistent/broken" গুলিয়ে ফেলাও ভুল — এটা একটা ইচ্ছাকৃত, সচেতন ট্রেড-অফ, দুর্ঘটনা নয়।</div>
<p>Replica-গুলো আসলে কীভাবে মেলে (converge) তা দুইটা মূল মেকানিজম চালায়:</p>
<ul>
<li><span class="kw">Anti-entropy</span> — replica-গুলো নিয়মিত ব্যাকগ্রাউন্ডে একে অপরের সাথে state তুলনা করে (প্রায়ই Merkle tree দিয়ে দ্রুত পার্থক্য বের করে) আর অমিল অংশ sync করে।</li>
<li><span class="kw">Read-repair</span> — একটা read-এর সময় একাধিক replica থেকে উত্তর নিয়ে তুলনা করলে যদি অসঙ্গতি ধরা পড়ে, সাথে সাথেই পিছিয়ে-থাকা replica-কে সর্বশেষ ভার্সনে আপডেট করে দেওয়া হয় — read-এর "পাশাপাশি" convergence ঘটে।</li>
</ul>

<div class="callout why"><span class="tag">কেন সবসময় সবচেয়ে শক্তিশালী মডেল বেছে নেওয়া হয় না</span>
Linearizability সবসময় "নিরাপদ" মনে হলেও, প্রতিটা operation-এ network round-trip আর quorum wait যোগ করে — উচ্চ-throughput সিস্টেমে (যেমন view counter, notification feed) এই cost অপ্রয়োজনীয়। ইঞ্জিনিয়ারিং সিদ্ধান্তটা তাই "সবচেয়ে শক্তিশালী কোনটা" নয়, বরং "এই নির্দিষ্ট ডেটার জন্য কোন দুর্বলতা মেনে নেওয়া নিরাপদ" — ব্যাংক ব্যালেন্সে causal/eventual চলবে না, কিন্তু লাইক কাউন্টে linearizability অপ্রয়োজনীয় বিলাসিতা।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Consistency model হলো একটা চুক্তি — read কী দেখতে বাধ্য তার নিয়ম। <b>Linearizability</b> সবচেয়ে কড়া (real-time total order, প্রতি op-এ quorum লাগে); <b>sequential consistency</b> একই total order রাখে কিন্তু real-time বাধ্যতা ছাড়া; <b>causal consistency</b> শুধু cause-effect সম্পর্ক রক্ষা করে (এবং চ্যাপ্টার ২-এর vector clock-ই এর বাস্তবায়ন, session guarantee-গুলো এর ব্যবহারিক রূপ); <b>eventual consistency</b> সবচেয়ে শিথিল — শুধু convergence-এর প্রতিশ্রুতি, anti-entropy আর read-repair দিয়ে বাস্তবায়িত। শক্তিশালী দিকে গেলে coordination cost বাড়ে, availability কমে; দুর্বল দিকে গেলে উল্টোটা। এই ঠিক ট্রেড-অফটাই পরের চ্যাপ্টারে <span class="kw">CAP theorem</span>-এর ভিত্তি — network partition হলে ঠিক এই স্পেকট্রামের কোন বিন্দুতে দাঁড়াবেন, সেই বাধ্যতামূলক সিদ্ধান্তই CAP-এর আসল বিষয়বস্তু।</div>

<h2 class="title">৪. CAP Theorem ও PACELC</h2>
<p class="lead">CAP Theorem সম্ভবত distributed systems-এর সবচেয়ে বেশি উদ্ধৃত অথচ সবচেয়ে বেশি ভুল বোঝা তত্ত্ব। ইন্টারভিউতে "CP নাকি AP?" প্রশ্নটা প্রায়ই শোনা যায়, কিন্তু বেশিরভাগ উত্তরদাতাই — এবং অনেক সময় প্রশ্নকর্তাও — তত্ত্বটার আসল দাবিটা ভুল বোঝেন। এই চ্যাপ্টারে আমরা CAP-কে ঠিকভাবে দাঁড় করাব, সবচেয়ে সাধারণ ভুল ধারণাটা ভাঙব, আর তার বাস্তবসম্মত সম্প্রসারণ <span class="kw">PACELC</span> দিয়ে দেখাব কেন "সুস্থ" অবস্থাতেও একটা trade-off থেকেই যায়।</p>

<h3>CAP আসলে কী বলে — আনুষ্ঠানিক বিবৃতি</h3>
<p>২০০০ সালে Eric Brewer এই conjecture উপস্থাপন করেন, পরে Gilbert ও Lynch আনুষ্ঠানিকভাবে প্রমাণ করেন। CAP তিনটা property নিয়ে কথা বলে, একটা বিতরণকৃত ডেটা সিস্টেমে:</p>
<div class="grid2">
  <div class="box"><b>Consistency (C)</b> — প্রতিটা read একটা <span class="kw">linearizable</span> ফলাফল পায় (ch.৩ থেকে মনে করুন) — অর্থাৎ সবচেয়ে সাম্প্রতিক successful write-টাই সব client একই ক্রমে দেখে, যেন আসলে একটাই কপি ডেটা আছে।</div>
  <div class="box"><b>Availability (A)</b> — প্রতিটা non-failing node-এ পাঠানো প্রতিটা request একটা (error নয়) response পায় — যদিও সেই response হয়তো সবচেয়ে সাম্প্রতিক লেখা প্রতিফলিত না-ও করতে পারে।</div>
</div>
<p>আর <b>Partition Tolerance (P)</b> — network-এর কিছু অংশ একে অপরের সাথে বার্তা আদান-প্রদান করতে ব্যর্থ হলেও (message হারিয়ে যায় বা দেরি হয়) সিস্টেম চলতে থাকে। CAP theorem-এর দাবি: <b>যখন একটা network partition ঘটে, তখন আপনি C এবং A দুটোই একসাথে পুরোপুরি দিতে পারবেন না — একটাকে ছাড় দিতেই হবে।</b></p>
<div class="diagram"><pre>
             Partition ঘটলে (P সবসময় true ধরে নিন) —
             তখন মাত্র দুইটা পথ খোলা থাকে:

</pre></div>

<div class="callout mistake"><span class="tag">সবচেয়ে বড় ভুল ধারণা — "৩টার মধ্যে যেকোনো ২টা বেছে নাও"</span>
CAP প্রায়ই ভুলভাবে শেখানো হয় যেন এটা একটা মেনু — "C+A", "C+P", বা "A+P" — যেকোনো একটা সবসময়ের জন্য বেছে নিন। এটা ভুল, কারণ <b>P কোনো ঐচ্ছিক বিকল্প নয়</b>। বাস্তব নেটওয়ার্কে packet হারায়, latency spike হয়, switch/cable ব্যর্থ হয় — partition ঘটবেই, সময়ের ব্যাপার মাত্র। তাই "CA" বেছে নেওয়ার অর্থ দাঁড়ায় "আমরা ধরে নিচ্ছি partition কখনো হবে না" — যা একাধিক নোডের যেকোনো real-world সিস্টেমের জন্য একটা অবাস্তব প্রতিশ্রুতি। আসল প্রশ্নটা তাই "C+A+P থেকে ২টা বেছে নিন" নয়, বরং: <b>"partition ঘটলে, আপনি C ছাড় দেবেন নাকি A ছাড় দেবেন?"</b> — আর যখন partition নেই (normal অবস্থা), তখন C এবং A দুটোই একসাথে পুরোপুরি পাওয়া সম্ভব, কোনো ছাড় ছাড়াই।</div>

<h3>CP উদাহরণ — ZooKeeper/etcd: minority side-কে unavailable করে দেওয়া</h3>
<p><span class="kw">ZooKeeper</span> ও <span class="kw">etcd</span>-এর মতো সিস্টেম <b>CP</b> বেছে নেয় — partition-এর সময় consistency রক্ষা করতে availability ছাড় দেয়। এরা একটা quorum/majority-ভিত্তিক consensus protocol (ch.৬-এ Raft/ZAB বিস্তারিত দেখবেন) ব্যবহার করে: cluster দুই ভাগে বিভক্ত হলে, শুধু যে অংশে সংখ্যাগরিষ্ঠ (majority) নোড আছে সেটাই লেখা গ্রহণ করতে থাকে — <b>minority অংশ নিজে থেকেই সাড়া দেওয়া বন্ধ করে দেয়</b> (বা read-only/stale-marked মোডে চলে যায়), যদিও সেই নোডগুলো টেকনিক্যালি জীবিত এবং client request গ্রহণ করতে পারত।</p>
<div class="diagram"><pre>
   ┌── Datacenter A ──┐      ╳╳╳ broken link ╳╳╳      ┌── Datacenter B ──┐
   │  Node1  Node2    │◀───────────────────────────▶│      Node3       │
   │  (majority: 2/3) │                              │  (minority: 1/3)  │
   └──────────────────┘                              └───────────────────┘
        ▼ লেখা/পড়া চালিয়ে যায়                              ▼
   linearizable থাকে,                                  নিজে থেকে সাড়া বন্ধ রাখে
   client-রা normal response পায়                        (client error/timeout পায়)
</pre></div>
<div class="callout why"><span class="tag">কেন minority side নিজে থেকেই থেমে যায়</span>
যদি minority side (Node3) নিজের মতো করে লেখা গ্রহণ চালিয়ে যেত, তাহলে দুই পাশেই আলাদা আলাদা "সত্য" তৈরি হতো — partition সেরে গেলে দুটো সাংঘর্ষিক ইতিহাস মেলানো লাগত, আর linearizability ভেঙে যেত। তাই consensus protocol ডিজাইন করেই রাখা হয় যেন majority ছাড়া কোনো decision "কমিট" গণ্য না হয় — minority side শুধু জানে না সে minority-তে আছে, কিন্তু quorum না পেয়ে নিজে থেকেই লেখা reject করে। এটাই সজ্ঞানে A-কে ছাড় দেওয়া, C বাঁচানোর জন্য।</div>

<h3>AP উদাহরণ — Dynamo/Cassandra: দুই পাশই চালু রাখা</h3>
<p>বিপরীতে <span class="kw">Amazon Dynamo</span>-স্টাইল সিস্টেম ও <span class="kw">Cassandra</span> <b>AP</b> বেছে নেয় — partition-এর দুই পাশেই read/write চালু রাখে, consistency-তে সাময়িক ছাড় দিয়ে। ফলাফল: partition চলাকালীন দুই পাশে একই key-তে ভিন্ন ভিন্ন write ঘটতে পারে (conflicting writes), যা ch.২-এর <span class="kw">vector clock</span>-জাতীয় metadata দিয়ে ট্র্যাক করা হয় আর partition সেরে যাওয়ার পর <span class="kw">read repair</span>/anti-entropy দিয়ে মিলিয়ে নেওয়া হয় — ঠিক ch.৩-এ যে <span class="kw">eventual consistency</span> দেখেছেন সেটাই।</p>
<div class="diagram"><pre>
   ┌── Datacenter A ──┐      ╳╳╳ broken link ╳╳╳      ┌── Datacenter B ──┐
   │      Node1        │◀───────────────────────────▶│      Node2       │
   └──────────────────┘                              └───────────────────┘
        ▼ লেখা/পড়া চালিয়ে যায়                              ▼ লেখা/পড়া চালিয়ে যায়
   client normal response পায়                        client normal response পায়
        └──────────────── partition সেরে যাওয়ার পর ────────────────┘
                    conflict resolution / read-repair
                (vector clock দিয়ে কোনটা "জিতবে" ঠিক হয়)
</pre></div>
<div class="callout best"><span class="tag">Cassandra-এর tunable consistency — একটা তৃতীয় পথের ইঙ্গিত</span>
Cassandra বাস্তবে খাঁটি AP নয় — প্রতিটা query-তে <code>consistency level</code> (<code>ONE</code>, <code>QUORUM</code>, <code>ALL</code>) বেছে নেওয়া যায়। <code>QUORUM</code> রিড+রাইট ব্যবহার করলে প্রায়-linearizable আচরণ পাওয়া যায়, ঠিক যেমন <code>ONE</code> দিয়ে সর্বোচ্চ availability/lowest latency। অর্থাৎ CAP-এর অক্ষর একটামাত্র সিস্টেমের গায়ে স্থায়ীভাবে সাঁটা লেবেল নয় — এটা <b>প্রতিটা অপারেশনে নেওয়া একটা সিদ্ধান্ত</b>। ch.১৪-এ Cassandra/DynamoDB কেস স্টাডিতে এটা আরও বিস্তারিত দেখবেন।</div>

<h3>PACELC — CAP যা বলে না তা পূরণ করা</h3>
<p>CAP-এর একটা বড় সীমাবদ্ধতা: এটা শুধু partition-এর সময়ের কথা বলে। কিন্তু বেশিরভাগ সময় সিস্টেম <b>সুস্থ</b> থাকে — partition নেই। তাহলে কি সুস্থ অবস্থায় কোনো trade-off নেই? আছে — আর এটাই ধরার জন্য Daniel Abadi ২০১০ সালে <span class="kw">PACELC</span> প্রস্তাব করেন:</p>
<div class="card">
<b>P</b>artition ঘটলে → <b>A</b>vailability নাকি <b>C</b>onsistency বেছে নাও (এটাই CAP)<br>
<b>E</b>lse (partition না থাকলে, normal operation) → <b>L</b>atency নাকি <b>C</b>onsistency বেছে নাও (এটা CAP-এর বাইরের নতুন insight)
</div>
<p>"Else" অংশটাই আসল সংযোজন। Partition না থাকলেও, একটা strongly consistent read নিশ্চিত করতে হলে সাধারণত leader/majority-এর সাথে একটা <b>network round-trip</b> লাগে (ch.২-এর message latency মনে করুন) — এটা ধীর। বিপরীতে, nearest/local replica থেকে read করলে সাড়া দ্রুত আসে, কিন্তু সেই replica-তে সর্বশেষ write এখনো নাও পৌঁছাতে পারে (replication lag) — ফলে stale data। তাই এমনকি সুস্থ অবস্থাতেও: <b>strong consistency চাইলে latency-তে খরচ করতে হবে, নয়তো latency বাঁচাতে consistency-তে ছাড় দিতে হবে।</b></p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — round-trip কেন অনিবার্য</span>
Leader-ভিত্তিক সিস্টেমে linearizable read নিশ্চিত করতে হয় হয় সরাসরি leader থেকে পড়ে (যেখানে সব commit-ই সর্বপ্রথম ঘটে), অথবা replica-কে leader-এর সাথে যাচাই করে নিতে হয় ("আমি কি up-to-date?")। দুটো পথেই network এর ওপারে কারো সাথে communicate করা লাগে। Local replica থেকে সরাসরি পড়লে এই round-trip এড়ানো যায় — কিন্তু তখন replica-তে replication asynchronous হলে কতটুকু stale তা guarantee করা যায় না। এই latency-vs-consistency উত্তেজনা network delay-এর ভৌত বাস্তবতা থেকেই আসে — কোনো ভালো ইঞ্জিনিয়ারিং দিয়েও পুরোপুরি এড়ানো যায় না, শুধু trade-off-এর জায়গাটা সরানো যায় (যেমন Spanner-এর TrueTime, ch.১৪)।</div>

<h3>বাস্তব সিস্টেম কীভাবে শ্রেণীবদ্ধ হয়</h3>
<table>
<tr><th>সিস্টেম</th><th>CAP শ্রেণী</th><th>PACELC</th><th>মন্তব্য</th></tr>

<tr><td><span class="kw">DynamoDB</span> / <span class="kw">Cassandra</span></td><td>AP (tunable)</td><td>PA/EL (ডিফল্ট), কনফিগ করে PC/EC-ও সম্ভব</td><td>Consistency level প্রতি-query সেট করা যায় — একটা একক অক্ষরে বন্দি করা ভুল হবে; ch.১৪-এ বিস্তারিত</td></tr>

<tr><td><span class="kw">Google Spanner</span></td><td>বিপণনে "effectively CP" তবে বাস্তবে খুব উচ্চ availability</td><td>PC/EC, কিন্তু TrueTime দিয়ে round-trip খরচ কমানো</td><td>Redundant infrastructure + synchronized clock (TrueTime, ch.২) দিয়ে সাধারণ CP সিস্টেমের তুলনায় অনেক কম latency penalty-তে strong consistency দেয়; ch.১৪-এ বিস্তারিত</td></tr>

<div class="callout mistake"><span class="tag">সতর্কতা — এই টেবিলটাকে একদম আক্ষরিকভাবে নেবেন না</span>
বাস্তব সিস্টেম প্রায় কখনোই একটামাত্র অক্ষরে বন্দি নয়। "Cassandra is AP" বলাটা একটা প্রথম-অনুমান হিসেবে ঠিক আছে, কিন্তু ডিফল্ট কনফিগারেশন আর tunable option দুটোই না জেনে এই লেবেল ব্যবহার করলে ভুল সিদ্ধান্ত হবে। CAP/PACELC শ্রেণীবিভাগকে দেখুন একটা <b>vocabulary</b> হিসেবে — আলোচনা সহজ করার জন্য — বাস্তব সিদ্ধান্তের বিকল্প হিসেবে নয়।</div>

<h3>CAP-কে সঠিকভাবে ব্যবহার করা — প্রতিটা অপারেশনের সিদ্ধান্ত</h3>
<div class="callout mistake"><span class="tag">CAP-কে ইন্টারভিউ ট্রিভিয়া বানিয়ে ফেলা</span>
"তোমার সিস্টেম কি CP নাকি AP?" — এই প্রশ্নটা প্রায়ই এমনভাবে জিজ্ঞেস করা হয় যেন পুরো সিস্টেমের জন্য একটাই উত্তর থাকা উচিত। বাস্তব প্রোডাকশন সিস্টেমে ভিন্ন ভিন্ন অপারেশনের ভিন্ন ভিন্ন প্রয়োজন থাকে — যেমন একটা e-commerce সিস্টেমে <b>payment/inventory decrement</b>-এর জন্য strong consistency (CP-ধাঁচের) দরকার হতে পারে, অথচ <b>product recommendation</b> বা <b>view count</b>-এর জন্য availability ও কম latency (AP-ধাঁচের) যথেষ্ট। CAP/PACELC শেখার আসল উদ্দেশ্য কোনো সিস্টেমকে একটা লেবেল আটকানো নয় — বরং <b>প্রতিটা read/write path-এর জন্য সচেতনভাবে এই trade-off বেছে নেওয়ার ভাষা ও কাঠামো</b> পাওয়া।</div>

<h2 class="title">৫. Replication Strategies</h2>
<p class="lead">একটা মাত্র node-এ ডেটা রাখলে সেটা এক দুর্ঘটনার দূরত্বে থাকে — disk crash, datacenter-এর আগুন, বা নিছক network cable কাটা পড়া। <span class="kw">Replication</span> মানে একই ডেটার একাধিক কপি একাধিক node-এ রাখা — কিন্তু এই সিদ্ধান্তটা প্রশ্ন খুলে দেয় ৩য় চ্যাপ্টারে (Consistency Models) যা শিখেছিলেন তার ঠিক বিপরীত দিক থেকে: একই ডেটার একাধিক কপি থাকলে সেগুলো <b>সবসময় এক থাকবে কীভাবে</b>? এই চ্যাপ্টার সেই প্রশ্নের তিনটা মৌলিক architectural উত্তর নিয়ে।</p>

<h3>কেন আদৌ ডেটা replicate করা হয়</h3>
<p>Replication চারটা আলাদা সমস্যার সমাধান দেয় — এবং প্রতিটার জন্য replication দরকার এমন নয়, কিন্তু বাস্তব সিস্টেমে সাধারণত সবগুলোই একসাথে দরকার হয়:</p>
<div class="grid2">
<div class="box"><b>Durability</b><br/>একটা disk বা node হারিয়ে গেলেও ডেটা হারায় না — অন্তত একটা কপি বেঁচে থাকে অন্য কোনো node-এ।</div>
<div class="box"><b>Availability</b><br/>একটা node down থাকলেও অন্য কোনো replica থেকে read/write চালিয়ে যাওয়া যায় — single point of failure এড়ানো।</div>
<div class="box"><b>Read scaling</b><br/>লক্ষ লক্ষ read request একটা মাত্র node সামলাতে পারে না — একাধিক replica জুড়ে read traffic ভাগ করে দেওয়া যায়।</div>
<div class="box"><b>Geographic locality</b><br/>ব্যবহারকারী যে অঞ্চলে বসে, সেখানকার কাছের একটা replica থেকে সার্ভ করলে latency অনেক কমে — মহাদেশ পার হয়ে round-trip করতে হয় না।</div>
</div>
<div class="callout why"><span class="tag">আসল challenge কপি রাখা নয়, কপি মিলিয়ে রাখা</span>
ডেটার একটা কপি বানানো তুচ্ছ একটা কাজ — কঠিন অংশ হলো, ডেটা বদলাতে থাকা অবস্থায় (application চলতে থাকা অবস্থায়) সব কপিকে সমন্বিত রাখা। প্রতিটা replication strategy আসলে একই প্রশ্নের ভিন্ন উত্তর: <b>কে লিখতে পারবে, কখন অন্য কপি জানবে, আর দুটো কপি সাংঘর্ষিক (conflicting) লেখা পেলে কী হবে</b>। এই তিনটা প্রশ্নের উত্তরই আলাদা করে single-leader, multi-leader, আর leaderless topology-কে।</div>

<h3>Single-leader (Leader-follower) Replication</h3>
<p><span class="kw">Single-leader (leader-follower) replication</span>-এ node-গুলোর মধ্যে একটাকে <b>leader</b> (বা primary) বলা হয়, বাকিগুলো <b>follower</b> (বা replica/secondary)। সব write শুধু leader গ্রহণ করে; leader প্রতিটা write-কে একটা ordered <span class="kw">change stream</span> (replication log) হিসেবে follower-দের কাছে পাঠায়, আর follower সেই log অনুযায়ী ধাপে ধাপে নিজের কপি হালনাগাদ করে। Read যেকোনো replica থেকে করা যায় — এখানেই read scaling-এর সুবিধা আসে। PostgreSQL streaming replication, MySQL replication, MongoDB replica set — সবই এই মডেল অনুসরণ করে।</p>

<h4>Synchronous বনাম Asynchronous — একটা মৌলিক trade-off</h4>
<p>Leader একটা write পাওয়ার পর follower-কে সেই write পাঠায় — কিন্তু client-কে "সফল" জানানোর আগে সেই follower-এর acknowledgment-এর জন্য অপেক্ষা করবে কি না, সেটাই এই সিদ্ধান্ত:</p>
<pre><span class="c"># PostgreSQL-এর মতো সিস্টেমে এটা per-follower কনফিগার করা যায়</span>
synchronous_commit = on
synchronous_standby_names = 'follower_1'   <span class="c"># commit তখনই সফল যখন follower_1 ack দেয়</span>

<span class="c"># বাকি follower-গুলো ডিফল্টে asynchronous — leader অপেক্ষা করে না</span></pre>
<table>
<tr><th></th><th>Synchronous replication</th><th>Asynchronous replication</th></tr>
<tr><td>Write latency</td><td>বেশি — follower-এর ack না আসা পর্যন্ত commit আটকে থাকে</td><td>কম — leader নিজের disk-এ লিখেই client-কে জানিয়ে দেয়</td></tr>
<tr><td>Durability গ্যারান্টি</td><td>শক্তিশালী — commit হওয়া মানে অন্তত ২টা node-এ ডেটা আছে</td><td>দুর্বল — leader crash করলে follower-এ না পৌঁছানো write হারিয়ে যেতে পারে</td></tr>
<tr><td>Leader-এর availability</td><td>Follower slow/down হলে leader-ও আটকে যায়</td><td>Follower slow/down হলেও leader লিখতে থাকে</td></tr>
</table>
<div class="callout mistake"><span class="tag">একটা ধীর follower পুরো সিস্টেমকে থামিয়ে দিতে পারে</span>
Synchronous follower নেটওয়ার্ক-এ delay খেলে, disk I/O-তে আটকে গেলে, বা সাময়িকভাবে unreachable হলে — leader-এর প্রতিটা write সেই একটা follower-এর গতির উপর নির্ভরশীল হয়ে পড়ে। এটাই সবচেয়ে বড় practical কারণ কেন সব production সিস্টেমে <b>সব</b> follower synchronous রাখা হয় না, বরং সাধারণত একটামাত্র (বা কম সংখ্যক) synchronous follower + বাকিগুলো asynchronous — এই মিশ্র কনফিগারেশন ব্যবহার করা হয়।</div>

<h4>Replication Lag ও তার পরিণতি</h4>
<p>Asynchronous follower-এ write পৌঁছাতে সময় লাগে — এই ব্যবধানকে বলে <span class="kw">replication lag</span>। Lag থাকা অবস্থায় সেই follower থেকে read করলে পুরনো (stale) ডেটা পাওয়া যায়। এটা ৩য় চ্যাপ্টারে দেখা <b>read-after-write</b> ও <b>monotonic reads</b> session guarantee-র ভাঙন হিসেবে সরাসরি প্রকাশ পায়:</p>
<div class="diagram"><pre>
Client                Leader                    Follower (async)
  │                      │                           │
  │── write(x=5) ───────▶│                           │
  │◀───── ack ───────────│                           │
  │                      │── replicate(x=5) ────────▶│   (নেটওয়ার্ক/ডিস্ক ল্যাগ)
  │                      │                           │
  │── read(x)  ── লোড-ব্যালেন্সার এই read-টা follower-এ পাঠাল ──▶│
  │◀──────────────────── x = 3  (স্টেল! এখনো replicate হয়নি) ───┘
</pre></div>
<p>এই সমস্যার সাধারণ সমাধান: নিজের সদ্য করা write-এর পরের read নির্দিষ্ট সময়ের জন্য leader থেকেই করা (read-after-write consistency), অথবা একই client-এর সিকোয়েন্সিয়াল read-গুলোকে একই replica-তে "স্টিকি" করে রাখা (monotonic reads) — দুটোই ৩য় চ্যাপ্টারে আলোচিত session guarantee-র বাস্তব প্রয়োগ।</p>

<h3>Multi-leader Replication</h3>
<p><span class="kw">Multi-leader replication</span>-এ একাধিক node write গ্রহণ করতে পারে — সাধারণত একটা প্রতি-datacenter একটা leader (multi-datacenter deployment), অথবা mobile/offline-capable client যেখানে প্রতিটা device নিজে সাময়িক একটা "leader" হয়ে স্থানীয়ভাবে write নেয়, পরে sync হয় (যেমন Google Docs-এর অফলাইন এডিটিং)। উদ্দেশ্য: প্রতিটা লেখা স্থানীয় leader-এ যায় বলে write latency কম থাকে, আর একটা datacenter সম্পূর্ণ বিচ্ছিন্ন হয়ে গেলেও বাকিগুলো স্বাধীনভাবে write নিতে পারে।</p>
<div class="callout why"><span class="tag">সমস্যাটা কোথা থেকে আসে</span>
Single-leader-এ সব write একটা জায়গা দিয়ে যায় বলে একটা স্বাভাবিক total order তৈরি হয়। Multi-leader-এ দুটো datacenter-এর দুটো leader যদি <b>একই key</b>-তে প্রায় একই সময়ে ভিন্ন value লেখে, তখন কোনো একক leader নেই যে সিদ্ধান্ত নেবে কোনটা "আগে" হয়েছে — দুটো leader পরস্পরের লেখা সম্পর্কে জানার আগেই দুটো commit হয়ে যায়। একে বলে <b>write conflict</b>, আর এটাই multi-leader-এর কেন্দ্রীয় সমস্যা।</div>
<p>Conflict সমাধানের কয়েকটা পথ:</p>
<ul>
<li><b>Last-write-wins (LWW)</b> — প্রতিটা write-এ একটা timestamp জুড়ে দিয়ে, সবচেয়ে বড় timestamp-ওয়ালা write-কে জয়ী ঘোষণা করা। সহজ, কিন্তু ২য় চ্যাপ্টারে দেখা <b>clock skew</b>-এর সমস্যা এখানে সরাসরি ফিরে আসে — দুটো node-এর ঘড়ি সামান্য বেঠিক হলে, আসলে যে write পরে হয়েছে, শুধু ঘড়ির ভুলের কারণে সেটাই হারিয়ে যেতে পারে (silent data loss, কোনো error ছাড়াই)।</li>
<li><b>Custom merge function</b> — অ্যাপ্লিকেশন নিজেই ঠিক করে দেয় conflict হলে কী করতে হবে, যেমন দুটো shopping cart-এর item সেট union করে ফেলা (কোনোটাই "হারায়" না)।</li>
<li><b><span class="kw">CRDT</span> (Conflict-free Replicated Data Type)</b> — একটা গাণিতিকভাবে প্রমাণিত পদ্ধতি, যেখানে ডেটা টাইপটাই এমনভাবে ডিজাইন করা হয় (যেমন counter, set) যে যেকোনো ক্রমে/যেকোনো সংখ্যক বার merge করলেও ফলাফল একই ও সংগতিপূর্ণ হয় — timestamp-নির্ভর অনুমানের বদলে গঠনগতভাবেই conflict-free।</li>
</ul>
<div class="callout behind"><span class="tag">CRDT বাস্তবে কীভাবে কাজ করে (সংক্ষেপে)</span>
একটা সাধারণ উদাহরণ — <b>G-Counter</b> (Grow-only Counter): প্রতিটা node নিজের একটা আলাদা কাউন্টার রাখে (node-A: ৩, node-B: ৫), আর মোট মান হলো সবগুলোর যোগফল। দুটো node একসাথে increment করলেও, merge মানে শুধু প্রতিটা node-এর নিজস্ব কাউন্টারের সর্বোচ্চ মান নেওয়া — কোনো "কোনটা আগে হয়েছে" প্রশ্নই ওঠে না, কারণ প্রতিটা node-এর অবদান আলাদাভাবে ট্র্যাক হয়। এই নীতি বিস্তৃত করে set, map, এমনকি text editing (collaborative editor)-এর জন্যও CRDT ডিজাইন করা যায়, যদিও general-purpose CRDT ডিজাইন করা সহজ কাজ নয়।</div>

<h3>Leaderless Replication (Dynamo-style) ও Quorum</h3>
<p><span class="kw">Leaderless replication</span>-এ কোনো node-ই বিশেষ নয় — client সরাসরি একাধিক replica-কে write পাঠায় এবং সরাসরি একাধিক replica থেকে read করে, কোনো central leader-এর মধ্য দিয়ে না গিয়ে। Amazon Dynamo, Apache Cassandra, Riak — এই মডেলে চলে।</p>
<p>এখানে ধারাবাহিকতা আসে একটা সহজ গাণিতিক শর্ত থেকে — <span class="kw">quorum</span> formula:</p>
<div class="card">
<p style="margin:0 0 8px"><b>W + R &gt; N</b></p>
<p style="margin:0"><span class="badge">N</span> মোট replica সংখ্যা &nbsp; <span class="badge">W</span> write সফল ধরতে যতগুলো replica-র ack লাগবে &nbsp; <span class="badge">R</span> read-এ যতগুলো replica-কে জিজ্ঞেস করা হবে</p>
</div>
<p>এই শর্ত পূরণ হলে, যেকোনো write-এর সেট ও যেকোনো read-এর সেট — দুটো সেটেই <b>অন্তত একটা common replica</b> থাকতে বাধ্য (pigeonhole principle: দুটো সেট মিলিয়ে N-এর বেশি হলে ওভারল্যাপ ছাড়া উপায় নেই)। ফলে read সবসময় সাম্প্রতিকতম write-এর অন্তত একটা কপি দেখতে পাবে — যদিও কোন কপিটা সাম্প্রতিক তা বের করতে version/timestamp তুলনা লাগে।</p>
<pre><span class="c">// N=3 replica, W=2, R=2 — একটা সাধারণ quorum কনফিগারেশন</span>
async Task WriteAsync(string key, Value value)
{
    var acks = await SendToAllReplicasInParallelAsync(key, value); <span class="c">// N=3-টাতেই পাঠানো হয়</span>
    if (acks.Count(a => a.Success) &gt;= <span class="kw">W</span>) <span class="c">// W=2 হলেই write সফল ধরা হয়</span>
        return; <span class="c">// তৃতীয় replica পরে/asynchronously পৌঁছাবে</span>
    throw new QuorumNotReachedException();
}</pre>
<p>যেহেতু W ও R উভয়ই N-এর চেয়ে ছোট হতে পারে, ধীরতম বা সাময়িক unreachable replica পুরো অপারেশনকে আটকায় না — leaderless replication তাই node failure-এর সময়ও লেখা/পড়া চালিয়ে যেতে পারে, যতক্ষণ না N-এর মধ্যে যথেষ্ট সংখ্যক replica বেঁচে থাকে।</p>
<p>কিন্তু কিছু replica পিছিয়ে থাকা (stale হয়ে যাওয়া) এড়ানো যায় না পুরোপুরি — এজন্য দুটো mechanism কাজ করে:</p>
<ul>
<li><b>Read repair</b> — read-এর সময় একাধিক replica থেকে version তুলনা করে, পুরনো replica-কে সাথে সাথেই নতুন value দিয়ে হালনাগাদ করে দেওয়া হয়।</li>
<li><b>Hinted handoff</b> — write-এর সময় কোনো replica সাময়িকভাবে down থাকলে, অন্য একটা node সাময়িকভাবে সেই write "hint" আকারে ধরে রাখে, আর আসল replica ফিরে এলে সেটা তাকে হস্তান্তর (hand off) করে দেয়।</li>
</ul>

<h3>সবচেয়ে সাধারণ ভুল ধারণা ও ব্যবহারিক মধ্যপথ</h3>
<div class="callout mistake"><span class="tag">"সব follower-এ synchronous replicate করাই সবচেয়ে নিরাপদ" — এই ধারণা বিপজ্জনক</span>
স্বজ্ঞা বলে: বেশি synchronous follower মানে বেশি নিরাপত্তা। বাস্তবে উল্টোটা ঘটে — synchronous replication মানে leader-এর write সেই follower-এর response-এর উপর নির্ভরশীল হয়ে যায়। N-টা follower-ই যদি synchronous হয়, তাহলে পুরো সিস্টেমের availability দাঁড়িয়ে থাকে <b>সবচেয়ে ধীর বা সবচেয়ে ভঙ্গুর একটা follower</b>-এর উপর — একটামাত্র follower সাময়িক অসুস্থ হলেও পুরো write path আটকে যায়। "সব জায়গায় sync" আসলে সিস্টেমকে তার দুর্বলতম অংশের সমান নিরাপদ (এবং দুর্বলতম অংশের সমান ধীর) বানিয়ে দেয়।</div>
<div class="callout best"><span class="tag">ব্যবহারিক মধ্যপথ — Partial (quorum-based) acknowledgment</span>
বাস্তব সিস্টেম তাই দুই চরমের মাঝামাঝি একটা পথ নেয়: সব N replica-র ack-এর জন্য অপেক্ষা না করে, শুধু একটা <b>majority/quorum</b>-এর ack নিশ্চিত হলেই write সফল ধরা হয় (leaderless-এর W+R&gt;N ঠিক এই নীতিরই একটা প্রত্যক্ষ রূপ)। এতে একটা-দুটো ধীর/বিচ্ছিন্ন replica পুরো সিস্টেমকে আটকাতে পারে না, অথচ যথেষ্ট সংখ্যক কপিতে ডেটা নিশ্চিত থাকার গ্যারান্টিও বজায় থাকে। এই "majority-এর সিদ্ধান্তই যথেষ্ট" নীতিটাই পরের চ্যাপ্টারের (৬. Consensus) কেন্দ্রীয় ভিত্তি — Paxos ও Raft-এর মতো consensus algorithm ঠিক এই majority quorum ব্যবহার করেই একাধিক node-এর মধ্যে সিদ্ধান্তে ঐকমত্যে পৌঁছায়, শুধু ডেটা replicate করার জন্য নয়, বরং <b>কোন write-টা আদৌ commit হয়েছে</b> তা নিয়েও node-গুলোর মধ্যে দ্বন্দ্বহীন সিদ্ধান্ত নিতে।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Replication তিনটা মৌলিক টপোলজিতে বিভক্ত: <span class="kw">single-leader</span> সরল ও সংগতিপূর্ণ কিন্তু leader-এ bottleneck তৈরি করে ও sync/async trade-off চাপিয়ে দেয়; <span class="kw">multi-leader</span> লেখার latency ও multi-region availability বাড়ায় কিন্তু conflict resolution-এর বোঝা যোগ করে; <span class="kw">leaderless</span> node-failure-এর বিরুদ্ধে সবচেয়ে সহনশীল, কারণ এটা quorum (<b>W+R&gt;N</b>) দিয়ে সবার-সম্মতির বদলে আংশিক-সম্মতিতে সন্তুষ্ট থাকে। তিনটা মডেলই একটা সাধারণ শিক্ষা দেয় — সব replica-র কাছ থেকে একসাথে একমত হওয়া দাবি করলে সিস্টেম ভঙ্গুর হয়ে যায়; দরকার একটা <b>যথেষ্ট (majority)</b> অংশের সম্মতি। পরের চ্যাপ্টারে (৬. Consensus — Paxos, Raft, ZAB) দেখা যাবে, ঠিক এই majority quorum নীতি ব্যবহার করেই distributed system-গুলো আরও কঠিন একটা সমস্যা সমাধান করে — একাধিক node কীভাবে network partition ও node failure সত্ত্বেও <b>একটামাত্র সত্যের উপর</b> ঐকমত্যে পৌঁছায়।</div>

<h2 class="title">৬. Consensus — Paxos, Raft, ZAB</h2>
<p class="lead">চ্যাপ্টার ৫-এ দেখেছেন কীভাবে quorum (<code>W + R &gt; N</code>) দিয়ে read আর write-কে নিরাপদ রাখা যায়। কিন্তু একটা প্রশ্ন তখন উত্তরহীন রয়ে গিয়েছিল — নেটওয়ার্ক partition হলে, বা leader node crash করলে, নোডগুলো কীভাবে নিশ্চিত হবে যে ঠিক <b>কোন একটাই</b> নোড leader, বা ঠিক <b>কোন মান</b>টা চূড়ান্তভাবে গৃহীত হয়েছে? এই প্রশ্নের কঠোর, প্রমাণযোগ্য উত্তর দেয় <span class="kw">consensus</span> প্রোটোকল — Paxos, Raft, আর ZAB।</p>

<h3>Consensus সমস্যা — ঠিক কী সমাধান করতে হবে</h3>
<p>Consensus সমস্যার সংজ্ঞাটা নির্দিষ্ট এবং কঠোর: একগুচ্ছ নোডকে এমনভাবে একটামাত্র মান (বা একটার পর একটা মানের ধারাবাহিক sequence — যেমন একটা replicated log-এর এন্ট্রি) নিয়ে একমত করানো, যাতে নোড crash হলেও, বার্তা দেরিতে পৌঁছালেও বা হারিয়ে গেলেও — চূড়ান্ত সিদ্ধান্তে কখনো দ্বিমত না থাকে। এখানে দুটো গ্যারান্টি একসাথে দরকার: <b>Safety</b> (কখনো দুটো ভিন্ন মান "চূড়ান্ত" হিসেবে গৃহীত হবে না) এবং <b>Liveness</b> (একটা না একটা মান শেষ পর্যন্ত গৃহীত <i>হবেই</i>, প্রক্রিয়াটা চিরকাল আটকে থাকবে না)।</p>
<div class="callout why"><span class="tag">Consensus কেন চ্যাপ্টার ৫-এর Replication-কে আসলে নিরাপদ করে</span>
চ্যাপ্টার ৫-এর quorum-based replication শুধু বলে "majority-কে লিখলে/পড়লে নিরাপদ" — কিন্তু majority কে ঠিক করবে <b>কে</b> leader, বা network partition-এর দুই পাশে দুটো ভিন্ন majority আলাদা আলাদা leader বেছে নিলে কী হবে (একে বলে <span class="kw">split-brain</span> — দুই leader সমান্তরালে লিখতে শুরু করলে ডেটা conflict অবধারিত)। Consensus প্রোটোকলই এই নিশ্চয়তা দেয় যে যেকোনো মুহূর্তে <b>একটামাত্র</b> নোড নিজেকে বৈধ leader মনে করবে, আর একটা লেখা "committed" ঘোষণা করার আগে সেটা সত্যিই majority-তে টিকে গেছে তা নিশ্চিত করে। এজন্যই etcd, Kafka-র নতুন controller quorum, বা যেকোনো strongly-consistent replicated system-এর কেন্দ্রে সবসময় একটা consensus প্রোটোকল বসানো থাকে।</div>

<h3>FLP Impossibility — কেন Consensus তাত্ত্বিকভাবে অসম্ভব, তবু বাস্তবে কাজ করে</h3>
<p>১৯৮৫ সালে Fischer, Lynch, ও Paterson একটা বিখ্যাত ফলাফল প্রমাণ করেন, যাকে বলা হয় <span class="kw">FLP impossibility result</span>: একটা সম্পূর্ণ <b>asynchronous</b> নেটওয়ার্কে (যেখানে বার্তা পৌঁছাতে কত সময় লাগবে তার কোনো bound নেই) — এমনকি মাত্র একটা নোড fail করার সম্ভাবনা থাকলেও — কোনো deterministic অ্যালগরিদম consensus-এর termination (liveness) নিশ্চিতভাবে গ্যারান্টি দিতে পারে না। স্বজ্ঞাগতভাবে কারণটা সহজ: asynchronous নেটওয়ার্কে একটা নোড থেকে reply না এলে বোঝার কোনো উপায় নেই সেটা <b>ধীর</b> নাকি <b>মৃত</b> — আর এই অনিশ্চয়তার সুযোগ নিয়ে এমন একটা execution sequence সবসময় বানানো যায় যেখানে অ্যালগরিদম চিরকাল সিদ্ধান্তহীন থেকে যায়।</p>
<div class="callout behind"><span class="tag">তাহলে Raft/Paxos বাস্তবে কীভাবে কাজ করে?</span>
FLP একটা তাত্ত্বিক ফলাফল, কোনো ব্যবহারিক deadlock নয় — বাস্তব সিস্টেম এটাকে এড়িয়ে যায় দুইভাবে। প্রথমত, বাস্তব নেটওয়ার্ক সম্পূর্ণ asynchronous নয়; বেশিরভাগ সময় বার্তা একটা যুক্তিসঙ্গত সময়ের মধ্যে পৌঁছায় — এই ধরনের অনুমানকে বলে <span class="kw">partial synchrony</span>, আর timeout-ভিত্তিক failure detection (একটা নোড থেকে নির্দিষ্ট সময়ে reply না এলে "সম্ভবত মৃত" ধরে নেওয়া) এই অনুমানের উপরই দাঁড়িয়ে। Raft-এর randomized election timeout ঠিক এই কৌশলেরই বাস্তবায়ন। দ্বিতীয় পথ হলো randomization (যেমন Ben-Or-এর randomized consensus) — নিশ্চিত termination-এর বদলে সম্ভাব্যতাভিত্তিক (probabilistic) termination মেনে নেওয়া। দুই ক্ষেত্রেই মূল কথা: তাত্ত্বিক 100% guarantee ছেড়ে দিয়ে ব্যবহারিক liveness অর্জন করা হয় — এটাই কেন প্রতিটা consensus প্রোটোকলে timeout-এর মতো একটা প্যারামিটার দেখতে পাবেন।</div>

<h3>Paxos — ভিত্তি প্রোটোকল</h3>
<p><span class="kw">Paxos</span> (Leslie Lamport, ১৯৮৯) consensus সমস্যার প্রথম কঠোরভাবে প্রমাণিত সমাধান, এবং প্রায় প্রতিটা পরবর্তী প্রোটোকলের (Raft-সহ) তাত্ত্বিক ভিত্তি। এতে তিনটা ভূমিকা: <span class="kw">proposer</span> (একটা মান প্রস্তাব করে), <span class="kw">acceptor</span> (প্রস্তাবে ভোট দেয়, majority acceptor-দের সিদ্ধান্তই চূড়ান্ত হয়), আর <span class="kw">learner</span> (চূড়ান্ত সিদ্ধান্ত জেনে নেয়)। একটা বাস্তব নোড একাধিক ভূমিকা একসাথে পালন করতে পারে।</p>
<h4>দুই ধাপের প্রোটোকল</h4>
<p>Paxos-এর মূল কৌশল দুইটা ধাপে ভাগ করা:</p>
<div class="diagram"><pre>
Proposer                          Acceptors (majority: ⌊N/2⌋+1 দরকার)
   │
   │──Prepare(n)──────────────▶  ┌──────────┐ ┌──────────┐ ┌──────────┐
   │                             │Acceptor 1│ │Acceptor 2│ │Acceptor 3│
   │◀────Promise(n, prev)─────── └──────────┘ └──────────┘ └──────────┘
   │     majority সাড়া দিলেই phase 2 শুরু
   │
   │──Accept(n, v)─────────────▶  majority-ই v গ্রহণ করলে
   │◀────Accepted(n, v)─────────
   ▼
value v এখন "chosen" — কোনো ভবিষ্যৎ proposal এটা আর উল্টাতে পারবে না
</pre></div>
<pre><span class="c">// Proposer</span>
function propose(value):
    n = generate_unique_increasing_number()
    responses = broadcast(<span class="kw">Prepare</span>(n), to=all_acceptors)
    promises = wait_for_majority(responses)      <span class="c">// majority quorum — ch.৫-এর মতোই</span>

    <span class="c">// আগের কোনো accepted value থাকলে সেটাই ব্যবহার করতে হবে, নিজেরটা নয় — এটাই safety-এর চাবিকাঠি</span>
    if any promise contains an already-accepted (n', v'):
        value = v' of the highest n' among promises
    responses = broadcast(<span class="kw">Accept</span>(n, value), to=all_acceptors)
    if majority_accepted(responses):
        return CHOSEN(value)

<span class="c">// Acceptor</span>
on receive Prepare(n):
    if n > highest_promised_n:
        highest_promised_n = n
        reply Promise(n, last_accepted_proposal)  <span class="c">// প্রতিশ্রুতি: n-এর কম কোনো proposal আর accept করব না</span>
    else:
        reject(n)

on receive Accept(n, v):
    if n >= highest_promised_n:
        accept(n, v); reply Accepted(n, v)
    else:
        reject(n)</pre>
<div class="callout behind"><span class="tag"><code>generate_unique_increasing_number()</code> আসলে কীভাবে কাজ করে</span>
পুরো Paxos-এর safety নির্ভর করে <code>n</code> সংখ্যাগুলো তুলনাযোগ্য (comparable) ও সবার জন্য অনন্য (unique) হওয়ার ওপর — কিন্তু একাধিক proposer সমান্তরালে চললে, প্রতিটা যদি নিজের একটা লোকাল কাউন্টার শুধু বাড়িয়ে যায়, দুইজন সহজেই একই <code>n</code>-এ পৌঁছে যেতে পারে (দুজনই যদি নিজের প্রথম proposal-এ <code>n=1</code> ব্যবহার করে)। বাস্তব বাস্তবায়নে এই সমস্যা এড়ানো হয় <code>n</code>-কে দুই ভাগে গঠন করে: <code>n = round_number × N + proposer_id</code> (অথবা সমতুল্য কোনো স্কিম, যেমন high bits-এ একটা round counter আর low bits-এ node-এর নিজস্ব, স্থায়ী আইডি)। এতে দুটো জিনিস একসাথে নিশ্চিত হয় — প্রতিটা proposer-এর নিজের round বাড়ার সাথে সাথে তার <code>n</code>-ও monotonically বাড়ে, আর দুইজন ভিন্ন proposer কখনো ঠিক একই <code>n</code>-এ পৌঁছাতে পারে না, কারণ শেষ অংশে (proposer_id) তাদের মান আলাদা। ফলে acceptor-রা যে <code>n</code> তুলনা করে "বড়টাই জেতে" সিদ্ধান্ত নেয়, সেই তুলনাটা কখনো টাই (tie) হয় না — কোনো কেন্দ্রীয় সমন্বয়কারী ছাড়াই।</div>
<p>কেন majority-ই যথেষ্ট, minority-তে থাকা stale acceptor থাকলেও? কারণ যেকোনো দুটো majority সেট অন্তত একটা নোডে ওভারল্যাপ করবেই — এটাই ch.৫-এর quorum গণিত, শুধু একটামাত্র সিদ্ধান্তের জন্য প্রয়োগ করা।</p>

</pre></div>
<div class="callout mistake"><span class="tag">Raw Paxos নিজে থেকে implement করার চেষ্টা</span>
Paxos প্রমাণযোগ্যভাবে সঠিক, কিন্তু কুখ্যাতভাবে বাস্তবে সঠিকভাবে implement করা কঠিন — প্রতিটা এন্ট্রির জন্য পুরো দুই-ধাপ চালানো ব্যয়বহুল, আর edge case (একাধিক proposer একসাথে চেষ্টা করলে livelock, membership change ইত্যাদি) সামলানো জটিল। ব্যবহারিক ক্ষেত্রে তাই <span class="kw">Multi-Paxos</span> ব্যবহার হয় — একবার একটা stable leader নির্বাচিত হয়ে গেলে, প্রতিটা নতুন log entry-র জন্য শুধু phase 2 (Accept/Accepted) চালালেই চলে, phase 1 বারবার লাগে না। এটাই একটা continuous replicated log চালানোর ব্যবহারিক রূপ — এবং এই একই ধারণা থেকেই Raft-এর জন্ম, শুধু আরও স্পষ্টভাবে সংজ্ঞায়িত করে।</div>

<h3>Raft — বোঝার সহজতাকে ডিজাইন গোল বানানো</h3>
<p><span class="kw">Raft</span> (Ongaro ও Ousterhout, ২০১৪) সরাসরি স্বীকার করেই ডিজাইন করা হয়েছিল যে Paxos সঠিক হলেও বুঝতে ও implement করতে কষ্টকর — Raft-এর মূল লক্ষ্যই ছিল একই গ্যারান্টি দেওয়া কিন্তু স্পষ্ট, পড়ার-উপযোগী উপায়ে। এটাই বর্তমানে সবচেয়ে বেশি ব্যবহৃত consensus প্রোটোকল (etcd, Consul, Kafka KRaft)।</p>
<h4>Term — যৌক্তিক ঘড়ি</h4>
<p>Raft সময়কে <span class="kw">term</span>-এ ভাগ করে — প্রতিটা term একটা monotonically বাড়তে থাকা সংখ্যা, আর প্রতিটা term-এ সর্বোচ্চ একজনই leader থাকতে পারে (অথবা কেউই না, যদি election ব্যর্থ হয়)। কোনো নোড পুরনো term-এর কোনো বার্তা পেলে সেটা সাথে সাথে বাতিল/আপডেট করে — এভাবেই term একটা সহজ যৌক্তিক ঘড়ি হিসেবে কাজ করে stale leader-কে চিনতে।</p>
<h4>Leader Election</h4>
<p>প্রতিটা follower একটা <span class="kw">randomized election timeout</span> (সাধারণত ১৫০–৩০০ms, প্রতিবার এলোমেলোভাবে ঠিক হয়) নিয়ে অপেক্ষা করে; leader-এর কাছ থেকে সময়মতো heartbeat না পেলে সেই নোড নিজেকে candidate ঘোষণা করে, term এক বাড়ায়, নিজেকে ভোট দেয়, আর বাকি সবাইকে <span class="kw">RequestVote</span> পাঠায়। একটা majority ভোট পেলেই সে leader হয়ে যায়। Timeout-টা randomized রাখার কারণ নির্দিষ্ট — সব নোড একই সময়ে timeout হয়ে একসাথে candidate হয়ে গেলে ভোট ভাগ হয়ে যায় (split vote), কেউ majority পায় না, election আবার শুরু করতে হয়; randomization এই সম্ভাবনা কার্যত শূন্যের কাছাকাছি নামিয়ে আনে।</p>

<h4>Log Replication ও Commit-এর নিরাপত্তা নিয়ম</h4>
<p>Leader নির্বাচিত হওয়ার পর প্রতিটা client request নিজের log-এ একটা নতুন entry হিসেবে append করে, তারপর সমান্তরালে সব follower-কে <span class="kw">AppendEntries</span> পাঠায়। একটা entry <span class="kw">committed</span> বলে গণ্য হয় শুধু তখনই যখন majority follower সেটা নিজের log-এ রেখে দিয়েছে বলে acknowledge করেছে — এর আগ পর্যন্ত সেটা "committed" নয়, state machine-এ apply হয় না।</p>
<pre><span class="c">// Follower</span>
on election_timeout (randomized 150–300ms, কোনো AppendEntries পায়নি):
    state = CANDIDATE; currentTerm += 1; votedFor = self; votes = 1
    broadcast RequestVote(currentTerm, lastLogIndex, lastLogTerm)

on receive RequestVote(term, lastLogIndex, lastLogTerm):
    if term >= currentTerm and votedFor in {null, candidateId}
       and candidate_log_at_least_as_up_to_date:
        votedFor = candidateId; reply VoteGranted
    else:
        reply VoteDenied

<span class="c">// Candidate → Leader</span>
on receive VoteGranted from majority_of_peers:
    state = LEADER   <span class="kw">// এখন থেকেই periodic heartbeat/AppendEntries পাঠানো শুরু</span>

<span class="c">// Leader — log replication ও commit</span>
on client_request(command):
    log.append(Entry(currentTerm, command))
    replicate_to_all_followers()          <span class="c">// AppendEntries RPC, সমান্তরালে</span>

on majority_acknowledged(entryIndex):
    commitIndex = entryIndex               <span class="kw">// এখনই entry নিরাপদে "committed" — আর হারাবে না</span>
    apply_to_state_machine(log[commitIndex])
    <span class="c">// পরের heartbeat-এ commitIndex followers-কেও পাঠানো হয়, তারাও apply করে</span></pre>
<div class="callout best"><span class="tag">Leader crash করলেও committed data কেন হারায় না</span>
মূল guarantee টা majority quorum-এর ওভারল্যাপ থেকেই আসে (ঠিক Paxos-এর মতোই): একটা entry commit হতে হলে majority-তে থাকতে হয়েছে; পরবর্তী যেকোনো leader নির্বাচিত হতে হলেও তাকে একটা majority-র ভোট পেতে হবে — আর সেই দুই majority অন্তত একটা নোডে মিলবেই। Raft-এর election rule স্পষ্টভাবে বলে দেয় candidate-এর log অবশ্যই ভোটদাতার চেয়ে অন্তত সমান up-to-date হতে হবে (<code>lastLogTerm</code>/<code>lastLogIndex</code> দিয়ে যাচাই) — তাই যেই majority-তে committed entry ছিল, তাদের কেউ না কেউ নতুন leader-কে ভোট দেওয়ার আগেই সেই entry-টা তার log-এ থাকবে। ফলে leader crash হওয়ার ঠিক পরমুহূর্তেই নতুন election হলেও, committed data কখনো হারায় না — এটাই Raft-এর মূল নিরাপত্তা প্রতিশ্রুতি।</div>

<h4>Linearizable Read — প্রতিটা Read কি Log-এ Append করতে হয়?</h4>
<p>এতক্ষণ যা দেখলাম তার সবটাই <b>write</b>-এর জন্য — প্রতিটা write log-এ append হয়ে majority-এর acknowledgment পেলে committed হয়। কিন্তু read-এর বেলায় কী হয়? স্বাভাবিক একটা প্রশ্ন জাগে: leader তো নিজের local state machine-এই সব committed ডেটা রাখে, তাহলে সরাসরি সেখান থেকে পড়লেই কি linearizable read পাওয়া যায় না, log-এ কিছু না লিখেই?</p>
<p>উত্তর — প্রায়, কিন্তু একটা সূক্ষ্ম ফাঁক থেকে যায়। একটা leader নিজে বিশ্বাস করলেও যে সে এখনো leader, বাস্তবে network partition-এর কারণে বাকি cluster ইতিমধ্যে majority ভোট দিয়ে একটা <b>নতুন</b> leader নির্বাচন করে ফেলতে পারে — পুরনো leader নিজে তখনো জানে না তার leadership আর বৈধ নয় (এটা ch.৯-এর "মৃত নাকি ধীর" অনিশ্চয়তারই আরেকটা রূপ, এবার leader নিজের জন্যই)। এই পুরনো, বাতিল leader-এর local state থেকে সরাসরি পড়লে stale ডেটা ফেরত যাওয়ার ঝুঁকি থাকে। ব্যবহারিক সমাধান দুইটা:</p>
<div class="grid2">
<div class="box"><b><span class="kw">Read Index</span></b><br/>Read serve করার ঠিক আগে leader নিজের বর্তমান commit index মনে রাখে, তারপর majority follower-দের কাছ থেকে একটা হালকা heartbeat-জাতীয় confirmation নেয় (পুরো log entry append না করেই) যে সে এখনো তাদের কাছে বৈধ leader। এই confirmation পেলেই নিশ্চিত হওয়া যায় সে stale leader নয় — তখন local state machine থেকে পড়া নিরাপদ, অথচ disk-এ নতুন log entry লিখতে হয় না।</div>
<div class="box"><b><span class="kw">Lease Read</span></b><br/>Leader ধরে নেয় সে একটা নির্দিষ্ট সময়ের (lease) জন্য নিশ্চিতভাবে leader থাকবে — কারণ heartbeat interval-এর চেয়ে কম সময়ে নতুন election সম্ভবই না। সেই lease-এর মেয়াদে বারবার confirm না করেই সরাসরি local read serve করে — Read Index-এর চেয়েও দ্রুত, কিন্তু ফলাফলের নির্ভুলতা এবার clock drift (ch.২)-এর ওপর কিছুটা নির্ভরশীল হয়ে পড়ে।</div>
</div>
<p>etcd ও অন্যান্য প্রোডাকশন Raft বাস্তবায়ন প্রায়ই এই দুটোর মিশ্রণ ব্যবহার করে, যাতে প্রতিটা read-এ পুরো log-append-এর খরচ (network round trip + disk write) এড়ানো যায়, অথচ linearizability অক্ষত থাকে।</p>

<h3>ZAB — ZooKeeper-এর নিজস্ব প্রোটোকল</h3>
<p><span class="kw">ZAB</span> (ZooKeeper Atomic Broadcast) Apache ZooKeeper-এর নিজস্ব consensus/atomic-broadcast প্রোটোকল — Raft-এর মতোই leader-ভিত্তিক, একটা broadcast phase (leader থেকে follower-দের কাছে ordered write পাঠানো, majority ack-এ commit) আর একটা recovery phase (leader হারিয়ে গেলে নতুন leader নির্বাচন, যার কাছে সবচেয়ে up-to-date history আছে তাকেই বেছে নেওয়া) আছে। লক্ষ্য অনেকটা একই — ZooKeeper-এর znode tree-তে হওয়া প্রতিটা write পুরো cluster জুড়ে একই, কঠোরভাবে অর্ডারড ধারাবাহিকতায় প্রয়োগ হবে তা নিশ্চিত করা। Raft ও ZAB একই সমস্যার দুটো স্বাধীনভাবে ডিজাইন করা সমাধান — একে অপরের থেকে উদ্ভূত নয়, কিন্তু কেন্দ্রীয় ধারণা (leader, majority quorum, ordered log) একই।</p>

<h3>কোন প্রোটোকল বাস্তবে কোথায় ব্যবহৃত হয়</h3>

<h3>Consensus বনাম Leaderless Replication — কখন কোনটা দরকার</h3>
<div class="callout why"><span class="tag">দুটো ভিন্ন জগৎ, দুটো ভিন্ন প্রয়োজন</span>
চ্যাপ্টার ৫-এর leaderless/AP replication (Dynamo-স্টাইল, quorum read/write) আর এই চ্যাপ্টারের consensus — দুটোই "quorum" শব্দ ব্যবহার করে বলে গুলিয়ে ফেলা সহজ, কিন্তু এরা মৌলিকভাবে ভিন্ন সমস্যা সমাধান করে। Leaderless replication-এ কোনো একক সিদ্ধান্ত নিয়ে <b>আগে থেকে</b> একমত হওয়ার চেষ্টা হয় না — একাধিক write সমান্তরালে ঘটতে পারে, conflict <b>পরে</b> ধরা পড়ে ও resolve হয় (vector clock, last-write-wins, বা CRDT দিয়ে)। Consensus উল্টো — প্রতিটা সিদ্ধান্ত (কে leader, log-এর কোন entry পরেরটা) নেওয়ার <b>আগেই</b> majority-র সম্মতি নিশ্চিত করে, ফলে conflict তৈরিই হতে পারে না। তাই: distributed lock, leader election, cluster configuration, বা financial ledger-এর মতো single-writer semantics দরকার হলে — সত্যিকারের consensus চাই। শপিং কার্ট, view counter, বা যেখানে সাময়িক conflict acceptable ও পরে মেলানো যায় — সেখানে leaderless AP replication-ই যথেষ্ট, বরং বেশি available ও দ্রুত।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Consensus সমাধান করে replication-কে নিরাপদ রাখার আসল প্রশ্ন — কীভাবে বহু নোড, ব্যর্থতা ও নেটওয়ার্ক বিলম্ব সত্ত্বেও একটামাত্র মান বা log entry নিয়ে একমত হবে, split-brain এড়িয়ে। FLP impossibility মনে করিয়ে দেয় এটা তাত্ত্বিকভাবে অসম্ভব একটা fully asynchronous জগতে — বাস্তব সিস্টেম timeout-ভিত্তিক partial synchrony ধরে নিয়ে এই সীমাবদ্ধতা এড়ায়। Paxos এই সমস্যার প্রথম প্রমাণিত সমাধান (Prepare/Promise + Accept/Accepted, majority quorum দিয়ে safety) কিন্তু বাস্তবে implement করা কঠিন বলে সরাসরি কম ব্যবহৃত হয়। Raft একই গ্যারান্টি দেয় understandability-কে ডিজাইন গোল বানিয়ে — randomized election timeout দিয়ে leader নির্বাচন, majority-acknowledgment দিয়ে commit। ZAB ZooKeeper-এর নিজস্ব সমতুল্য সমাধান। এই সবগুলো প্রোটোকলই একটা <b>একক, সুসংগত leader</b> ও একটা <b>ক্রমাগত-বর্ধিত log</b>-এর ধারণার উপর দাঁড়িয়ে — কিন্তু বাস্তব ডেটা তো একটামাত্র নোডে বা log-এ রাখা যায় না, বহু নোড জুড়ে ভাগ করতে হয়। পরের চ্যাপ্টারে (৭. Partitioning ও Sharding) দেখব ডেটা কীভাবে ভাগ হয়, কোন key কোন node-এ যায় তা কীভাবে ঠিক হয় — আর সেখানেও consensus কীভাবে shard-এর মালিকানা নিয়ে সিদ্ধান্তকে নিরাপদ রাখে।</div>

<h2 class="title">৭. Partitioning ও Sharding</h2>
<p class="lead">এতদিন আমরা ধরে নিয়েছি একটা ডেটাসেট একটা নোডে (বা তার কয়েকটা replica-তে, চ্যাপ্টার ৫ অনুযায়ী) পুরোপুরি রাখা যায়। বাস্তবে একটা নির্দিষ্ট স্কেলের পর এই ধারণাটাই ভেঙে পড়ে — ডেটা বা ট্রাফিক এত বড় হয়ে যায় যে কোনো একক মেশিনে তা আর ধরে না। এই চ্যাপ্টার সেই সমস্যার সমাধান নিয়ে — কীভাবে ডেটাকে বহু নোড জুড়ে ভাগ করা যায়, আর কীভাবে সেই ভাগাভাগি নোড যোগ/বিয়োগ হওয়ার পরেও স্থিতিশীল থাকে।</p>

<h3>কেন ডেটা Partition করতে হয়</h3>
<p>ধরুন একটা e-commerce প্ল্যাটফর্মের <code>orders</code> টেবিলে প্রতিদিন কোটি কোটি row যোগ হচ্ছে, অথবা একটা social feed সিস্টেম প্রতি সেকেন্ডে লক্ষ লক্ষ read request সামলাচ্ছে। একটা একক মেশিনের ডিস্ক স্পেস, RAM, CPU, নেটওয়ার্ক থ্রুপুট — সবকিছুরই একটা ঊর্ধ্বসীমা আছে। ডেটাসেট বা ট্রাফিক একবার সেই সীমা ছাড়িয়ে গেলে "আরেকটু বড় মেশিন কেনা" (vertical scaling) একটা সময় পর অসম্ভব বা অবিশ্বাস্য ব্যয়বহুল হয়ে যায়। এই বাস্তবতা থেকেই <span class="kw">partitioning</span> (relational ডেটাবেস জগতে প্রায়ই বলা হয় <span class="kw">sharding</span> — ধারণাটা একই) এসেছে — গোটা ডেটাসেটকে ছোট ছোট টুকরায় ভাগ করে প্রতিটা নোডকে শুধু তার নিজের অংশটুকু ধরে রাখা ও সার্ভ করার দায়িত্ব দেওয়া হয়। ফলে সিস্টেম মোটামুটি <b>রৈখিকভাবে (linearly)</b> স্কেল করতে পারে — বেশি ডেটা/ট্রাফিক এলে আরও নোড যোগ করাই যথেষ্ট, একটা মেশিনকে অসীম বড় করার দরকার পড়ে না।</p>
<div class="callout why"><span class="tag">Partitioning বনাম Replication — দুটো ভিন্ন সমস্যার সমাধান</span>
চ্যাপ্টার ৫-এ দেখা <span class="kw">replication</span> আর এই চ্যাপ্টারের <span class="kw">partitioning</span> প্রায়ই গুলিয়ে ফেলা হয়, কিন্তু এরা সম্পূর্ণ আলাদা সমস্যা সমাধান করে। Replication একই ডেটার একাধিক <b>কপি</b> রাখে (durability ও availability-র জন্য) — প্রতিটা কপিতে পুরো ডেটাসেটই থাকে। Partitioning ডেটাকে <b>ভাগ</b> করে — প্রতিটা নোডে ডেটাসেটের শুধু একটা অংশ থাকে (স্কেলের জন্য)। বাস্তব সিস্টেমে দুটো একসাথে ব্যবহৃত হয়: ডেটাসেট প্রথমে N-টা partition-এ ভাগ হয়, তারপর <b>প্রতিটা partition আলাদাভাবে</b> ৩টা (বা তার বেশি) নোডে replicate হয়। তাই একটা ৬-নোড cluster-এ ৩টা partition ও replication factor ৩ থাকলে, প্রতিটা partition-এর একটা primary ও দুইটা replica ভিন্ন নোডে বসে।
</div>

<h3>Partition Key — ভাগ করার ভিত্তি</h3>
<p>প্রতিটা partitioning scheme-এর মূলে থাকে একটা <span class="kw">partition key</span> (বা shard key) — প্রতিটা record-এর যে field-এর মান দেখে ঠিক করা হয় সেটা কোন partition-এ যাবে (যেমন <code>user_id</code>, <code>order_id</code>, বা <code>created_at</code>)। এই key কীভাবে ব্যবহার করে node ঠিক করা হয় তার তিনটা মূল কৌশল আছে — <span class="kw">range partitioning</span>, <span class="kw">hash partitioning</span>, আর <span class="kw">consistent hashing</span> — প্রতিটার আলাদা trade-off।</p>

<h3>Range Partitioning — সাজানো key-র পরিসর</h3>
<p><span class="kw">Range partitioning</span>-এ সব key সাজিয়ে (sorted) পরপর কয়েকটা <b>contiguous range</b>-এ ভাগ করা হয়, আর প্রতিটা range একটা নির্দিষ্ট নোডে বসে — যেমন <code>A–F</code> Node-1-এ, <code>G–M</code> Node-2-এ, ইত্যাদি। এর সবচেয়ে বড় সুবিধা: <b>range scan</b> খুব efficient — "T1 থেকে T2 সময়ের মধ্যে সব event" এই query শুধু ওই সময়সীমার সাথে সংশ্লিষ্ট গুটিকয়েক নোডেই পাঠাতে হয়, বাকি সব নোড এড়িয়ে যাওয়া যায়।</p>
<div class="callout mistake"><span class="tag">ক্লাসিক Hot Spot — Timestamp-Prefixed Key</span>
Range partitioning-এর সবচেয়ে পরিচিত বিপত্তি: key যদি ক্রমাগত বাড়তে থাকা (monotonically increasing) হয় — যেমন <code>created_at</code> timestamp বা auto-increment ID দিয়ে শুরু হওয়া key — তাহলে <b>সব নতুন write সবসময় সবচেয়ে শেষ range-এর নোডেই যায়</b>। পুরনো range-গুলো ধরে থাকা নোড প্রায় idle বসে থাকে, অথচ সাম্প্রতিক range-এর নোড একাই সব লেখা সামলাতে গিয়ে <span class="kw">hot spot</span>-এ পরিণত হয় — partitioning করেও লাভ হলো না, কারণ কার্যত সব লোড একটা মাত্র নোডেই। এড়ানোর সাধারণ উপায়: key-র সামনে একটা কম-predictable prefix (যেমন hash-এর প্রথম কয়েক bit, বা reversed timestamp) জুড়ে দেওয়া, যাতে ধারাবাহিক লেখা বিভিন্ন range-এ ছড়িয়ে পড়ে।
</div>

<h3>Hash Partitioning — সমান বিতরণ, কিন্তু Range হারিয়ে</h3>
<p><span class="kw">Hash partitioning</span>-এ key-র মান নিয়ে কোনো ordering রাখা হয় না — বরং <code>hash(key) % N</code> (বা কাছাকাছি কোনো hash-ভিত্তিক সূত্র) হিসাব করে কোন নোড owner তা ঠিক করা হয়। যেহেতু একটা ভালো hash function input-এর distribution যেমনই হোক না কেন output প্রায় uniform-ভাবে ছড়িয়ে দেয়, তাই monotonic key দিয়েও hot spot হয় না — লোড সব নোডে মোটামুটি সমান থাকে।</p>
<pre><span class="c">// naive hash partitioning — কোন নোড owner তা বের করা</span>
<span class="kw">function</span> getOwnerNaive(key, N):
    h = hash(key)              <span class="c">// একটা নির্দিষ্ট সংখ্যায় ম্যাপ করে</span>
    <span class="kw">return</span> nodes[h % N]      <span class="c">// N নোডের মধ্যে একটা বেছে নেয়</span></pre>
<p>কিন্তু এই সমতার বিনিময়ে range scan-এর সুবিধা হারিয়ে যায় — কারণ hash-এর পর কাছাকাছি key কোনো ordering ধরে রাখে না, তাই "T1 থেকে T2 সময়ের সব event" জাতীয় query আর নির্দিষ্ট কয়েকটা নোডে সীমাবদ্ধ থাকে না, প্রতিটা নোডেই এক-এক টুকরো ডেটা থাকতে পারে বলে query-টা <b>সব নোডে fan-out</b> করতে হয়।</p>

<h3>Consistent Hashing — Ring-ভিত্তিক সমাধান</h3>
<p>উপরের naive hash partitioning-এর একটা মারাত্মক সমস্যা আছে: <code>N</code> বদলালে (নোড যোগ/বিয়োগ) প্রায় প্রতিটা key-র <code>h % N</code>-এর মান বদলে যায় — মানে প্রায় পুরো dataset নতুন করে সরাতে হয়। <span class="kw">Consistent hashing</span> ঠিক এই সমস্যা সমাধানের জন্য ডিজাইন করা।</p>

</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — resize হবে এমন সিস্টেমে naive <code>hash(key) % N</code></span>
যেকোনো সিস্টেম যেখানে নোড সংখ্যা ভবিষ্যতে বদলাতে পারে (প্রায় সব production সিস্টেমেই বদলায় — scale-out, node failure replace), সেখানে সরাসরি <code>hash(key) % N</code> ব্যবহার করা একটা গুরুতর ভুল। উপরের উদাহরণে দেখা গেল N মাত্র ৩ থেকে ৪ হওয়াতেই ১০০% key নড়ে গেল। বাস্তব cluster-এ এর মানে হলো — একটা নোড যোগ করার সাথে সাথে পুরো dataset নেটওয়ার্ক জুড়ে নতুন করে কপি হওয়ার এক বিশাল, অপ্রয়োজনীয় "data-movement storm" শুরু হয়ে যাওয়া, যা cluster-কে সাময়িকভাবে অকেজো করে দিতে পারে। Consistent hashing ঠিক এই storm এড়ানোর জন্যই তৈরি।
</div>
<p><span class="kw">Consistent hashing</span>-এর মূল ধারণা: নোড আর key — দুটোকেই একই <b>বৃত্তাকার (circular) hash space</b>-এ hash করা হয় (কল্পনা করুন <code>0</code> থেকে <code>2^32-1</code> পর্যন্ত একটা রিং)। একটা key ঠিক সেই নোডের অধিকারে যায় যেটা তার hash অবস্থান থেকে ঘড়ির কাঁটার দিকে (clockwise) খুঁজলে <b>প্রথম</b> পাওয়া যায়।</p>
