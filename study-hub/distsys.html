<tr><th>Pattern</th><th>Consistency guarantee</th><th>Write latency</th><th>Cache ব্যর্থ হলে durability ঝুঁকি</th></tr>
<tr><td>Cache-aside</td><td>Eventual — TTL/invalidation পর্যন্ত stale থাকতে পারে</td><td>প্রভাবিত হয় না (cache write অপশনাল)</td><td>নেই — database-ই একমাত্র source of truth</td></tr>
<tr><td>Read-through</td><td>Eventual, cache-aside-এর মতোই (শুধু loading logic cache-এ সরানো)</td><td>প্রভাবিত হয় না</td><td>নেই</td></tr>
<tr><td>Write-through</td><td>Strong — cache ও DB সবসময় সিঙ্ক্রোনাইজড</td><td>বেশি — দুই storage-এ write সম্পন্ন হওয়া পর্যন্ত অপেক্ষা</td><td>কম — write সফল হওয়া মানেই DB-তেও পৌঁছেছে</td></tr>
<tr><td>Write-behind</td><td>সাময়িকভাবে দুর্বল — DB flush না হওয়া পর্যন্ত পুরনো থাকে</td><td>সবচেয়ে কম — শুধু cache write-এর জন্য অপেক্ষা</td><td>সবচেয়ে বেশি — flush-এর আগে cache node হারালে ডেটা হারায়</td></tr>
</table>

<div class="callout mistake"><span class="tag">ভুল ধারণা</span>
"Cache মানেই সবসময় দ্রুত, তাই সব জায়গায় cache-aside যথেষ্ট" — এটা ঠিক নয়। যেসব ডেটা ঘন ঘন বদলায় এবং সামান্য stale data-ও ব্যবসায়িক ক্ষতি করতে পারে (যেমন account balance, inventory count), সেখানে write-through-এর মতো strong-consistency pattern প্রয়োজন, এমনকি বাড়তি latency-র মূল্যেও। Pattern বাছাই সবসময় নির্দিষ্ট ডেটার consistency আর latency চাহিদার ওপর নির্ভর করা উচিত, একটাই pattern সবখানে বসিয়ে দেওয়া উচিত নয়।</div>

<h3>CDN — Geographically Distributed Caching</h3>
<p><span class="kw">CDN</span> (Content Delivery Network) আসলে caching-এর ধারণাটাকেই ভৌগোলিকভাবে ছড়িয়ে দেয়। Origin server যদি শুধু একটা region-এ থাকে (ধরা যাক Singapore-এ), তাহলে ইউরোপ বা আমেরিকার একজন ব্যবহারকারীর প্রতিটা request-কে অর্ধেক পৃথিবী পাড়ি দিয়ে যেতে হয় — যার latency নেটওয়ার্কের কারণেই অনিবার্য, কোনো optimization দিয়েই কমানো যায় না। CDN বিভিন্ন geographic location-এ edge server বসিয়ে static (এবং কখনো কখনো semi-dynamic) content cache করে রাখে, যাতে ব্যবহারকারী তার সবচেয়ে কাছের edge node থেকেই উত্তর পায়। এটা চ্যাপ্টার ১-এ আলোচিত geographic locality-র প্রেরণারই একটা প্রয়োগ — ডেটা ব্যবহারকারীর যত কাছে থাকে, round-trip latency তত কম, network-এর গতির সীমাবদ্ধতা সরাসরি জয় করা যায় না, তাই ডেটাকেই কাছে নিয়ে আসা হয়।</p>

<h3>Distributed Rate Limiting</h3>
<p>একটা single-instance অ্যাপ্লিকেশনে <span class="kw">rate limiting</span> সহজ — একটা in-memory counter রেখে প্রতি সেকেন্ডে কতগুলো request এলো তা গুনলেই চলে। কিন্তু horizontal scaling-এর পর এই সরল সমাধান ভেঙে পড়ে।</p>
<div class="callout mistake"><span class="tag">সবচেয়ে সাধারণ ভুল</span>
ধরা যাক একটা API-তে limit হলো প্রতি user প্রতি মিনিটে ১০০ request, আর সিস্টেমটা load balancer-এর পেছনে ৫টা instance নিয়ে চলছে। যদি প্রতিটা instance নিজের in-memory counter দিয়ে আলাদাভাবে গোনে, তাহলে load balancer request গুলোকে (round robin বা least-connections দিয়ে) ৫টা instance-এ ভাগ করে দেবে — প্রতিটা instance শুধু মোট traffic-এর একটা ভগ্নাংশই দেখবে। ফলে প্রতিটা instance আলাদাভাবে ১০০-র limit মানলেও, বাস্তবে ব্যবহারকারী সবগুলো instance মিলিয়ে ৫×১০০ = ৫০০ request পর্যন্ত পাঠাতে পারবে, তার আগে কোনো instance-ই সীমা অতিক্রম হয়েছে বলে মনে করবে না। অর্থাৎ per-instance in-memory counter নীরবে effective limit-কে instance সংখ্যা দিয়ে গুণ করে দেয় — অথচ dashboard/log দেখলে মনে হবে সিস্টেম সুরক্ষিত আছে, যা একটা মিথ্যা নিরাপত্তাবোধ তৈরি করে।</div>
<p>সমাধান হলো একটা <b>shared counter store</b> — সাধারণত Redis-এর মতো একটা কেন্দ্রীয়, দ্রুত key-value store — যেখানে সব instance একই counter atomic-ভাবে চেক ও আপডেট করে (যেমন Redis-এর <code>INCR</code> + <code>EXPIRE</code>, বা একটা atomic Lua script)। এখন যে instance-ই request পাক না কেন, সবাই একই সত্য দেখে — মোট request সংখ্যা, instance সংখ্যা দিয়ে ভাগ হওয়া কোনো আংশিক দৃশ্য নয়।</p>

<h4>Token Bucket</h4>
<p><span class="kw">Token bucket</span> algorithm-এ প্রতিটা user/key-এর জন্য একটা কাল্পনিক "বালতি" থাকে, যেখানে token একটা নির্দিষ্ট হারে (যেমন প্রতি সেকেন্ডে ২টা) ক্রমাগত ভরতে থাকে, bucket-এর সর্বোচ্চ ধারণক্ষমতা পর্যন্ত। প্রতিটা incoming request একটা token খরচ করে; bucket খালি থাকলে request প্রত্যাখ্যাত হয়। এর সুবিধা হলো এটা <b>controlled burst</b> অনুমতি দেয় — bucket ভরা থাকলে ব্যবহারকারী হঠাৎ bucket-এর সাইজ পর্যন্ত একগুচ্ছ request একসাথে পাঠাতে পারে (যেমন পেজ লোডের সময় একাধিক resource একসাথে fetch করা), কিন্তু দীর্ঘমেয়াদে গড় রেট refill rate-এর মধ্যেই সীমাবদ্ধ থাকে।</p>
<pre>tokens = min(capacity, tokens + elapsed_seconds * refill_rate)   <span class="c">// প্রথমে refill হিসাব</span>
if (tokens >= 1) {
    tokens -= 1
    <span class="kw">allow request</span>
} else {
    <span class="kw">reject request</span>   <span class="c">// bucket খালি</span>
}</pre>
<p>বিকল্প হিসেবে <b>sliding window log</b> (প্রতিটা request-এর timestamp সংরক্ষণ করে, window-এর বাইরের পুরনো entry বাদ দিয়ে গণনা করা — নিখুঁত নির্ভুল কিন্তু বেশি মেমরি লাগে) এবং <b>sliding window counter</b> (আগের ও চলতি window-এর counter-কে ভারযুক্তভাবে মিশিয়ে আনুমানিক হিসাব করা — token bucket-এর চেয়ে কম burst-friendly কিন্তু fixed-window-এর boundary সমস্যা এড়ায়) ব্যবহার করা হয়। এই তিনটা approach-ই একই মূল সমস্যার সমাধান করে, শুধু নির্ভুলতা, মেমরি খরচ, আর burst-সহনশীলতার মধ্যে ভিন্ন ভারসাম্য বেছে নেয়।</p>

<h3>স্থাপত্য একত্রে — একটা চিত্র</h3>
<p>নিচের চিত্রে দেখা যাচ্ছে কীভাবে load balancer, cache layer, আর rate-limit store একসাথে বসে পুরো request path-কে সুরক্ষিত ও দ্রুত রাখে।</p>

<div class="grid2">

<div class="box"><b>Rate-limit store</b> — সব instance-এর জন্য একটাই সত্য উৎস; per-instance counter দিয়ে এটা প্রতিস্থাপনযোগ্য নয়।</div>
<div class="box"><b>Cache layer</b> — database-এর ওপর চাপ কমায়; pattern বাছাই নির্ভর করে consistency বনাম latency চাহিদার ওপর।</div>
<div class="box"><b>Origin database</b> — শেষ পর্যন্ত source of truth; ভালো caching মানে এখানে যত কম সম্ভব request পৌঁছানো।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Scale করা মানে শুধু "আরও instance যোগ করা" নয় — এর মানে হলো সচেতনভাবে ট্রেড-অফ বেছে নেওয়া। Vertical scaling সহজ কিন্তু সীমিত এবং SPOF রেখে দেয়; horizontal scaling near-linear growth আর redundancy দেয়, কিন্তু routing (কোন request কোথায় যাবে), state (cache/rate-limit কীভাবে সব instance জুড়ে সামঞ্জস্যপূর্ণ থাকবে), আর health awareness (মৃত node এড়ানো) সচেতনভাবে ডিজাইন করতে হয়। Consistent hashing (চ্যাপ্টার ৭) routing-এ cache hit rate বাড়ায়, failure detection (চ্যাপ্টার ৯) load balancer-কে অসুস্থ node থেকে দূরে রাখে, আর caching pattern বাছাই সরাসরি consistency model (চ্যাপ্টার ৩)-এর প্রশ্নে ফিরে যায় — কতটা staleness গ্রহণযোগ্য। সবচেয়ে বড় শিক্ষা: distributed environment-এ কোনো "local" ধারণা (in-memory counter, in-memory cache) নিরাপদে কাজ করে না যতক্ষণ না সেটা explicit-ভাবে shared করা হয়। পরের ও শেষ চ্যাপ্টারে (১৪. Real-World Case Studies) আমরা দেখব বাস্তব বড় সিস্টেম — Netflix, Uber, ব্যাংকিং সিস্টেম ইত্যাদি — কীভাবে এই তেরোটা চ্যাপ্টারের প্রতিটা ধারণা (consistency, consensus, partitioning, replication, caching, rate limiting) একসাথে মিলিয়ে বাস্তব প্রকৌশল সিদ্ধান্তে রূপান্তরিত করে।</div>

<h2 class="title">১৪. Real-World Case Studies</h2>
<p class="lead">এই কোর্সের প্রতিটা আগের চ্যাপ্টার একটা করে বিল্ডিং ব্লক আলাদা করে দেখিয়েছে — clock ও ordering, consistency model, CAP/PACELC, replication, consensus, partitioning, transaction, failure detection, coordination, messaging, pattern, স্কেলিং। বাস্তব প্রোডাকশন সিস্টেম কখনো একটা মাত্র ব্লক ব্যবহার করে না — সেগুলো একসাথে, ইচ্ছাকৃতভাবে বেছে নিয়ে জোড়া লাগানো হয়। এই শেষ চ্যাপ্টারে চারটা বহুল-ব্যবহৃত সিস্টেম — Spanner, DynamoDB, Cassandra, Kafka — ভেঙে দেখানো হবে ঠিক কোন চ্যাপ্টারের কোন ধারণা তাদের ভেতরে কাজ করছে, আর কোর্সটা একটা সংহত মানসিক মডেলে বন্ধ করা হবে।</p>

<h3>কেন এই চ্যাপ্টার — বিচ্ছিন্ন ব্লক থেকে সংহত সিস্টেম</h3>
<p>এখন পর্যন্ত প্রতিটা ধারণা আলাদা আলাদা করে পড়া হয়েছে — যেন সেগুলো স্বতন্ত্র টুল, তাকে সাজানো। কিন্তু কোনো বাস্তব ডেটাবেস বা মেসেজিং সিস্টেম ডিজাইন করার সময় প্রশ্নটা হয় না "আমি কি Raft শিখব, নাকি consistent hashing?" — প্রশ্নটা হয় "আমার এই নির্দিষ্ট ডেটার জন্য কতটা শক্তিশালী consistency দরকার, availability-এর কতটা compromise করা যাবে, আর কোন failure মডেল সহ্য করতে হবে?" — আর তারপর সেই উত্তর অনুযায়ী replication, partitioning, consensus, coordination — একেকটা ব্লক বেছে নিয়ে জোড়া লাগানো হয়। নিচের প্রতিটা সিস্টেম আসলে এই কোর্সেরই একেকটা "worked example":</p>

<h3>Google Spanner — TrueTime ও Commit-Wait</h3>
<p><span class="kw">Google Spanner</span> একটা globally-distributed relational database, যেখানে একই transaction বিভিন্ন মহাদেশের datacenter জুড়ে ছড়ানো row নিয়ে কাজ করতে পারে, তবু <span class="kw">external consistency</span> (বাস্তবিকভাবে global scale-এ linearizability, ch.৩) নিশ্চিত করে। ch.২-এ দেখা হয়েছিল — আলাদা মেশিনের মধ্যে কোনো একক শেয়ার্ড clock নেই, তাই Lamport/vector clock দিয়ে শুধু causal order বলা যায়, "কোনটা বাস্তব সময়ে আগে ঘটেছে" নিশ্চিতভাবে বলা যায় না। Spanner এই সমস্যাটা সফটওয়্যারে সমাধান না করে হার্ডওয়্যার দিয়ে সমাধান করে।</p>
<div class="callout why"><span class="tag">TrueTime — একটা সংখ্যা নয়, একটা অনিশ্চয়তার পরিসীমা</span>
প্রতিটা Spanner datacenter-এ GPS receiver ও atomic clock বসানো আছে। <span class="kw">TrueTime API</span>-এর <code>TT.now()</code> কল একটামাত্র timestamp ফেরত দেয় না — বরং একটা <b>bounded uncertainty interval</b> <code>[earliest, latest]</code> ফেরত দেয়, যেখানে প্রকৃত বর্তমান সময় নিশ্চিতভাবে এই সীমার মধ্যে আছে বলে guarantee দেওয়া হয় (uncertainty ε সাধারণত কয়েক মিলিসেকেন্ড)। এটাই ch.২-এর "no shared clock" সমস্যার হার্ডওয়্যার-ভিত্তিক সমাধান — Spanner কখনো ভান করে না যে তার কাছে perfect clock আছে, বরং সেই অনিশ্চয়তাটাকেই স্পষ্টভাবে মেপে হিসাবের ভেতরে নিয়ে আসে।</div>

<pre><span class="c">// Spanner commit-wait (সরলীকৃত সিউডোকোড)</span>
TTinterval tt = TrueTime.now();        <span class="c">// [earliest, latest] — ε-প্রশস্ত অনিশ্চয়তা</span>
Timestamp s   = tt.latest;             <span class="kw">// commit timestamp হিসেবে latest bound বেছে নেওয়া হয়</span>

<span class="c">// শার্ডের Paxos গ্রুপে (ch.৬) majority write commit হওয়ার পর:</span>
while (TrueTime.now().earliest &lt;= s) {
    wait();                            <span class="kw">// commit-wait — ack/lock-release স্থগিত রাখা</span>
}
releaseLocksAndAcknowledge(s);         <span class="c">// এখন s নিশ্চিতভাবে অতীত — সব observer-এর জন্যই</span></pre>
<p>প্রতিটা shard-এর replica group নিজেই একটা <span class="kw">Paxos</span> (ch.৬) গ্রুপ — write শুধু majority quorum commit হলেই সফল ধরা হয়, আর ডেটা range-ভিত্তিক শার্ডে (ch.৭) ভাগ করা, প্রয়োজনমতো auto-split/merge হয়। TrueTime তাই consensus বা partitioning প্রতিস্থাপন করে না — সেগুলোর উপরে বসে শুধু "কখন একটা commit নিরাপদে বাস্তব অতীত" সেই একটা নির্দিষ্ট সমস্যা সমাধান করে।</p>

<h3>Amazon DynamoDB — Leaderless, Quorum ও Vector Clock</h3>
<p><span class="kw">Amazon DynamoDB</span>-এর শিকড় ২০০৭ সালের Dynamo গবেষণাপত্রে — যেখান থেকে <span class="kw">leaderless replication</span> ও <span class="kw">consistent hashing</span>-ভিত্তিক partitioning-এর ধারণা বহু পরবর্তী সিস্টেম ধার করেছে। কোনো একক leader নেই যাকে সব write পাঠাতে হয় (ch.৫) — যেকোনো replica write গ্রহণ করতে পারে, আর একটা write সফল ধরা হয় যখন <code>N</code>টা replica-র মধ্যে <code>W</code>টা তা স্বীকার করে, read সফল ধরা হয় যখন <code>R</code>টা replica থেকে উত্তর মেলে — <code>W + R &gt; N</code> হলে read ও write quorum নিশ্চিতভাবে ওভারল্যাপ করে, তাই অন্তত একটা replica সাম্প্রতিকতম মান নিয়ে সাড়া দেবে।</p>
<table>
<tr><th>W (write quorum)</th><th>R (read quorum)</th><th>N=3 হলে ফলাফল</th></tr>
<tr><td>৩</td><td>১</td><td>প্রতিটা replica-তে write নিশ্চিত হওয়ার পরই ack — read দ্রুত, কিন্তু replica ডাউন থাকলে write ব্যর্থ হতে পারে</td></tr>
<tr><td>২</td><td>২</td><td>W+R=৪ &gt; N=৩ ⇒ quorum overlap নিশ্চিত — strongly consistent read, ভারসাম্যপূর্ণ latency</td></tr>
<tr><td>১</td><td>১</td><td>W+R=২ ≤ N ⇒ দ্রুততম, কিন্তু stale/conflicting read সম্ভব (eventual consistency, ch.৩)</td></tr>
</table>
<div class="callout best"><span class="tag">Quorum টিউনিং — প্রতি অপারেশন আলাদা</span>
DynamoDB-তে <code>W</code>/<code>R</code> কোনো একবার-সেট-করা গ্লোবাল constant না — বরং প্রতিটা read/write request-এ এটা বেছে নেওয়া যায়। এটাই ch.৪-এর PACELC আলোচনার সরাসরি প্রয়োগ: latency-sensitive path-এ (যেমন product-page view) কম quorum দিয়ে দ্রুত eventual read, আর টাকার সাথে জড়িত path-এ (যেমন inventory decrement) বেশি quorum দিয়ে strong consistency — একই ডেটাবেসের ভেতরেই দুই ধরনের ট্রেড-অফ পাশাপাশি চলতে পারে।</div>
<p>একাধিক replica সমান্তরালভাবে write গ্রহণ করলে কনফ্লিক্ট অনিবার্য — মূল Dynamo পেপারে এই কনফ্লিক্ট ধরার জন্য <span class="kw">vector clock</span>/<span class="kw">version vector</span> (ch.২) ব্যবহার হতো: প্রতিটা replica তার নিজের counter বাড়িয়ে একটা ভার্সন হিস্ট্রি রাখত, আর দুটো ভার্সন একে অপরের সাথে causally তুলনীয় না হলে (concurrent write) সেগুলো client-কে ফেরত দেওয়া হতো resolve করার জন্য (Dynamo পেপারের বিখ্যাত shopping-cart উদাহরণ)। আধুনিক DynamoDB সেবায় conditional writes ও last-writer-wins-এর মতো সরলীকৃত API-এর পেছনে একই মূল সমস্যা — concurrent write detect করা — আজও থেকে যায়, ভিন্ন প্যাকেজিংয়ে।</p>

<h3>Apache Cassandra — Ring, Tunable Consistency ও Gossip</h3>
<p><span class="kw">Apache Cassandra</span> Dynamo-র ধারণাগুলোকেই আরও এগিয়ে নিয়ে যায়। ডেটা partition করা ও replica রাখা — দুটোই একই <span class="kw">consistent hashing ring</span>-এর (ch.৭) উপর হয়: প্রতিটা key হ্যাশ করে ring-এর একটা বিন্দুতে ফেলা হয়, আর clockwise পরবর্তী <code>RF</code> (replication factor) সংখ্যক নোড সেই key-এর replica হোল্ড করে।</p>
<div class="diagram"><pre>
        hash ring (0 ─────────────────────── 2¹²⁸−1, wrap-around)

  ... ──▶ Node A ──▶ Node B ──▶ Node C ──▶ Node D ──▶ Node E ──▶ ...
              ▲
              │  key "user:42" হ্যাশ করে এখানে পড়ল
              │  → primary owner: Node B (clockwise প্রথম নোড)
              │  → RF=৩ হলে replica: Node B, Node C, Node D
</pre></div>
<div class="callout mistake"><span class="tag">ভুল ধারণা — "NoSQL মানেই eventual consistency"</span>
Cassandra প্রায়ই ভুলভাবে "শুধু eventually consistent" হিসেবে পরিচিত। বাস্তবে Cassandra প্রতিটা query-তে আলাদাভাবে <span class="kw">consistency level</span> বেছে নেওয়ার সুযোগ দেয় — <code>ONE</code> (একটা replica সাড়া দিলেই যথেষ্ট, দ্রুততম কিন্তু দুর্বলতম), <code>QUORUM</code> (majority replica, W+R&gt;N নিশ্চিত করলে strong consistency), বা <code>ALL</code> (সব replica, সবচেয়ে ধীর কিন্তু সবচেয়ে কড়া)। এটা ch.৪-এর CAP/PACELC আলোচনার হুবহু বাস্তবায়ন — সিস্টেম নিজে একটা গ্লোবাল choice চাপিয়ে দেয় না, প্রতিটা কলিং অ্যাপ্লিকেশন নিজের requirement অনুযায়ী প্রতিটা query-তে consistency-availability/latency স্পেকট্রামে নিজের বিন্দু বেছে নেয়।</div>
<p>নোডগুলো একে অপরের অবস্থা (up/down, ring membership, load) জানে কোনো central coordinator ছাড়াই — <span class="kw">gossip protocol</span> (ch.৯) দিয়ে: প্রতিটা নোড পর্যায়ক্রমে র‍্যান্ডম কিছু peer-কে তার জানা অবস্থা জানায়, তথ্য এভাবে ধীরে ধীরে পুরো ক্লাস্টারে ছড়িয়ে পড়ে। কোনো নোড আসলেই ডাউন নাকি শুধু সাময়িক ধীর — তা নিশ্চিত করতে Cassandra <span class="kw">phi-accrual failure detector</span> ব্যবহার করে, যা একটামাত্র বাইনারি up/down সিদ্ধান্তের বদলে একটা সম্ভাব্যতা স্কোর দেয় — ঠিক ch.৯-তে দেখা সেই নীতি।</p>

<h3>Apache Kafka — একটা Distributed Commit Log হিসেবে</h3>
<p><span class="kw">Apache Kafka</span>-কে সবচেয়ে সহজে বোঝা যায় একটা বিশাল, partition করা, append-only <span class="kw">commit log</span> হিসেবে। প্রতিটা topic কয়েকটা partition-এ ভাগ করা (ch.৭ — সাধারণত key হ্যাশ করে কোন partition যাবে ঠিক হয়), আর প্রতিটা partition-এর ভেতরে message-এর ক্রম চিরকালের জন্য স্থির — এটাই একটা partition-এর ভেতরে ordering guarantee দেয়, পুরো topic জুড়ে নয় (ch.২-এর ordering আলোচনার সাথে সরাসরি সম্পর্কিত)।</p>
<p>প্রতিটা partition-এর একটা leader broker আর কিছু follower থাকে — কিন্তু সব follower "replica" নয়, শুধু যারা leader-এর সাথে যথেষ্ট আপ-টু-ডেট তারাই <span class="kw">In-Sync Replica (ISR)</span> সেটে থাকে। একটা write তখনই সফল ধরা হয় যখন ISR সেটের সব সদস্য তা লিখে ফেলে — এটা ch.৫-এর leader-follower replication আর ch.৬-এর consensus-এর মাঝামাঝি একটা ব্যবহারিক হাইব্রিড।</p>
<pre><span class="c">// producer config — durability বনাম latency ট্রেড-অফ (ch.১১-এর delivery guarantee-র সাথে সরাসরি যুক্ত)</span>
acks=all                 <span class="kw">// leader শুধু তখনই ack দেবে যখন সব ISR replica write পেয়েছে</span>
min.insync.replicas=2    <span class="kw">// ISR সেট এর চেয়ে ছোট হয়ে গেলে write reject — data-loss window বন্ধ</span>
enable.idempotence=true  <span class="c">// producer retry করলেও ডুপ্লিকেট রোধ — at-least-once + idempotency = কার্যত exactly-once</span></pre>
<div class="callout behind"><span class="tag">কে ঠিক করে কোন replica leader — পর্দার আড়ালে</span>
Partition leader নির্বাচন আর ISR সদস্যপদ ব্যবস্থাপনার সিদ্ধান্ত একটা কেন্দ্রীয় <b>controller</b> নেয়, যাকে নিজেই একটা consensus প্রক্রিয়ার মাধ্যমে নির্বাচিত হতে হয় (ch.১০-এর leader election)। ঐতিহাসিকভাবে এই কাজ করত <span class="kw">ZooKeeper</span> (ZAB প্রোটোকল দিয়ে, ch.৬-এর মতোই এক ধরনের consensus); newer Kafka সংস্করণে <span class="kw">KRaft</span> মোড এসেছে, যেখানে ZooKeeper সরিয়ে Kafka নিজেই একটা Raft-ভিত্তিক metadata quorum চালায়। প্রতিটা leader election-এর সাথে একটা বাড়তে-থাকা <b>leader epoch</b> সংখ্যা যুক্ত হয় — এটা ঠিক ch.১০-এর fencing token-এর মতোই কাজ করে: পুরনো, বাদ পড়া leader থেকে আসা কোনো দেরি-করা write পরবর্তী broker-গুলো পুরনো epoch দেখেই বাতিল করে দেয়, split-brain রোধ করে।</div>
<p>Consumer side-এ, প্রতিটা consumer group কোন partition-এ কতদূর পড়েছে (<b>offset</b>) তা নিজেই একটা compacted Kafka topic-এ সংরক্ষণ করে। ডিফল্টভাবে ডেলিভারি <b>at-least-once</b> (ch.১১) — broker crash-এর পর reprocessing সম্ভব — তাই consumer-side অপারেশন <span class="kw">idempotent</span> হওয়া আবশ্যক, নয়তো transactional producer/consumer API দিয়ে effectively-once সেমান্টিক্স আনতে হয়।</p>

<h3>চার সিস্টেমের সারসংক্ষেপ</h3>
<p>নিচের সারণিতে চারটা সিস্টেমকেই এই কোর্সের একই চার প্রশ্নের উত্তর হিসেবে পাশাপাশি রাখা হলো — প্রতিটা সিস্টেম মূলত এই একই চারটা সিদ্ধান্তের একেক রকম সমন্বয়:</p>
<table>
<tr><th>সিস্টেম</th><th>প্রধান Consistency Choice</th><th>Replication Style</th><th>Partitioning Scheme</th><th>Consensus/Coordination</th></tr>
<tr><td>Google Spanner</td><td>External consistency (linearizability, global) — TrueTime bounded uncertainty দিয়ে</td><td>Leader-follower প্রতি শার্ডে, synchronous majority replication</td><td>Range partitioning — key range অনুযায়ী shard/tablet, প্রয়োজনে auto-split</td><td>Paxos — প্রতিটা shard group-এর replicated log-এ</td></tr>
<tr><td>Amazon DynamoDB</td><td>Tunable — ডিফল্টে eventual, প্রয়োজনে strongly consistent read (per-request)</td><td>Leaderless, quorum-based (W+R &gt; N)</td><td>Consistent hashing ring (hash-based)</td><td>কোনো গ্লোবাল consensus নেই — vector clock/version-ভিত্তিক conflict detection (ঐতিহাসিক), conditional writes</td></tr>
<tr><td>Apache Cassandra</td><td>Tunable প্রতি-query (ONE/QUORUM/ALL) — app নিজেই CAP/PACELC স্পেকট্রামে বিন্দু বেছে নেয়</td><td>Leaderless, quorum-based, RF অনুযায়ী multi-replica</td><td>Consistent hashing ring (virtual node সহ)</td><td>Gossip-based membership ও failure detection — কোনো কেন্দ্রীয় consensus নয়</td></tr>
<tr><td>Apache Kafka</td><td>Partition-level linearizable order; consumer-side at-least-once + idempotency ⇒ কার্যত exactly-once</td><td>Leader + In-Sync Replica (ISR) সেট, synchronous acks=all</td><td>Hash/key-based partitioning প্রতিটা topic-এ</td><td>Controller quorum — ঐতিহাসিকভাবে ZooKeeper/ZAB, বর্তমানে KRaft/Raft</td></tr>
</table>

<h3>কোর্স সারাংশ ও পরবর্তী পদক্ষেপ</h3>
<p>উপরের চারটা সিস্টেমই দেখায় একটা সাধারণ প্যাটার্ন — কোনোটাই "একটা ম্যাজিক অ্যালগরিদম" ব্যবহার করে সব সমস্যা সমাধান করেনি। প্রতিটাই ch.২ থেকে ch.১৩ পর্যন্ত শেখা ব্লকগুলো থেকে নিজের প্রয়োজন অনুযায়ী কয়েকটা বেছে নিয়ে, একটা নির্দিষ্ট trade-off-এর দিকে ইচ্ছাকৃতভাবে ঝুঁকেছে — Spanner শক্তিশালী consistency-র জন্য হার্ডওয়্যার clock ও Paxos-এ বিনিয়োগ করেছে, DynamoDB/Cassandra availability ও latency-র জন্য leaderless quorum বেছে নিয়েছে, Kafka ordering ও durability-কে একটা partitioned log আর ISR দিয়ে সমাধান করেছে।</p>
<div class="callout best"><span class="tag">কোর্স সারাংশ ও পরবর্তী পদক্ষেপ</span>
পুরো কোর্সের মূল মানসিক মডেল একটা লাইনে বলা যায়: distributed system ডিজাইন করা মানে একগুচ্ছ স্বাধীন সিদ্ধান্তের সমষ্টি, প্রতিটার নিজস্ব ট্রেড-অফ। <b>Time ও ordering</b> (ch.২) ঠিক করে আপনি ঘটনার ক্রম কীভাবে বলবেন — physical clock, Lamport, নাকি vector clock দিয়ে। <b>Consistency model</b> (ch.৩) ঠিক করে read কতটা আপ-টু-ডেট দেখাবে। <b>CAP/PACELC</b> (ch.৪) মনে করিয়ে দেয় partition-এর সময় (এবং সাধারণ অবস্থাতেও) consistency আর latency/availability-এর মধ্যে বিনামূল্যে কিছু নেই। <b>Replication</b> (ch.৫) ও <b>consensus</b> (ch.৬) ঠিক করে ডেটার একাধিক কপি কীভাবে সমন্বিত থাকবে। <b>Partitioning</b> (ch.৭) ঠিক করে ডেটা স্কেলের জন্য কীভাবে ছড়ানো থাকবে। <b>Distributed transaction</b> (ch.৮), <b>failure detection</b> (ch.৯), আর <b>coordination/leader election</b> (ch.১০) মিলে ঠিক করে একাধিক অংশ জুড়ে কাজ কীভাবে নির্ভরযোগ্যভাবে সম্পন্ন হবে, নোড মরে গেলে কীভাবে ধরা পড়বে, আর কে সিদ্ধান্ত নেওয়ার অধিকার রাখে তা কীভাবে বিতর্কহীন থাকবে। <b>Messaging</b> (ch.১১), <b>design pattern</b> (ch.১২), আর <b>scalability/caching</b> (ch.১৩) সেই ভিত্তির উপর ব্যবহারিক আর্কিটেকচার তৈরি করে।<br><br>
নিজের সিস্টেম ডিজাইন করার সময় সবচেয়ে বড় ভুল হলো প্রশ্ন শুরু করা "কোন trendy database/technology ব্যবহার করব" দিয়ে। সঠিক শুরুর বিন্দু হলো নিজের actual requirement বিশ্লেষণ করা — এই নির্দিষ্ট ডেটার জন্য consistency আসলে কতটা শক্তিশালী হওয়া দরকার (একটা ব্যাংক ব্যালেন্স আর একটা "লাইক কাউন্ট"-এর উত্তর সম্পূর্ণ ভিন্ন), availability/latency-র বাস্তব বাজেট কত, আর কোন failure মডেল (নেটওয়ার্ক partition, নোড ক্র্যাশ, ধীর clock) সহ্য করতে হবে তা স্পষ্ট করা। এই তিনটা প্রশ্নের উত্তর থেকেই ch.২-১৩-এর ব্লকগুলো থেকে সঠিকগুলো বেছে নেওয়া সম্ভব হয় — ঠিক যেভাবে Spanner, DynamoDB, Cassandra ও Kafka-র ডিজাইনাররা নিজেদের প্রশ্নের উত্তর থেকে নিজেদের ব্লকগুলো বেছে নিয়েছিলেন।

<h2 class="title">১৫. Interview প্রশ্নোত্তর</h2>
<p class="lead">Distributed systems ইন্টারভিউতে বারবার ফিরে আসা প্রশ্ন — basic থেকে advanced পর্যন্ত, প্রতিটার সংক্ষিপ্ত ব্যাখ্যা বাংলায়, এই কোর্সের নির্দিষ্ট চ্যাপ্টার রেফারেন্স সহ।</p>

<h3>১) CAP theorem আসলে কী বলে, আর "যেকোনো ২টা বেছে নাও" কেন ভুল ব্যাখ্যা?</h3>
<p><b>ব্যাখ্যা:</b> CAP বলে — network partition ঘটলে Consistency আর Availability দুটো একসাথে পুরোপুরি রাখা যায় না, একটা ছাড় দিতে হয় (অধ্যায় ৪)। এটা "C+A+P থেকে ২টা বেছে নাও" নয়, কারণ Partition Tolerance কোনো ঐচ্ছিক বিকল্প নয় — বাস্তব নেটওয়ার্কে partition ঘটবেই। তাই আসল প্রশ্ন: "partition ঘটলে, C ছাড় দেবে নাকি A?" — normal অবস্থায় (partition না থাকলে) C ও A দুটোই একসাথে পাওয়া সম্ভব।</p>

<h3>২) Linearizability আর Serializability-এর পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> Linearizability (অধ্যায় ৩) আলাদা আলাদা একক operation (একটা read/write) নিয়ে কথা বলে — একাধিক replica জুড়ে সেগুলো real-time ক্রম মেনে চলবে কিনা। Serializability একাধিক operation নিয়ে গঠিত পুরো transaction নিয়ে কথা বলে (ACID-এর Isolation, অধ্যায় ৮) — একগুচ্ছ concurrent transaction যেন কোনো এক serial ক্রমে চলেছে এমন আচরণ করবে। একটা সিস্টেম serializable হয়েও linearizable নাও হতে পারে, কারণ দুটো ভিন্ন প্রশ্নের উত্তর দেয়।</p>

<h3>৩) Quorum read/write কীভাবে কাজ করে? W + R &gt; N শর্তটা কেন যথেষ্ট?</h3>
<pre><span class="c">// N=৫ replica, W=৩, R=৩ হলে W+R=৬ &gt; N=৫</span>
write সফল ধরা হয় যখন ৩টা replica ack দেয়
read পাঠানো হয় ৩টা replica-কে, তাদের মধ্যে সাম্প্রতিকতম version নেওয়া হয়</pre>
<p><b>ব্যাখ্যা:</b> Leaderless replication-এ (অধ্যায় ৫) quorum formula W+R &gt; N নিশ্চিত করে যেকোনো write-সেট আর read-সেট-এর মধ্যে অন্তত একটা common replica থাকবেই (pigeonhole principle) — তাই read সবসময় সাম্প্রতিকতম write-এর অন্তত একটা কপি দেখতে পাবে। W ও R ছোট রাখলে latency কমে কিন্তু stale replica পাওয়ার ঝুঁকি বাড়ে (read repair/hinted handoff দিয়ে প্রশমিত করা হয়); বড় রাখলে উল্টো।</p>

<h3>৪) Paxos আর Raft-এর মূল পার্থক্য কী, দুটোই তো majority quorum ব্যবহার করে?</h3>
<p><b>ব্যাখ্যা:</b> দুটোই একই সমস্যার সমাধান — বহু নোড একটা মান/log entry নিয়ে একমত হওয়া, majority quorum-এর ওভারল্যাপের ওপর ভিত্তি করে (অধ্যায় ৬)। পার্থক্যটা মূলত ডিজাইন-লক্ষ্যে। Paxos (Prepare/Promise + Accept/Accepted) একটামাত্র মান নিয়ে সিদ্ধান্তকে সাধারণীকৃতভাবে প্রমাণ করে, কিন্তু বাস্তবে implement করা কঠিন — leader election আলাদা করে বলা নেই, log replication-এর জন্য Multi-Paxos-এর মতো এক্সটেনশন দরকার। Raft একই safety guarantee দেয়, কিন্তু understandability-কে স্পষ্ট ডিজাইন গোল বানিয়ে — একটামাত্র elected leader, randomized election timeout, আর একটা কড়াকড়িভাবে সংজ্ঞায়িত replicated log দিয়ে। ব্যবহারিকভাবে Raft-ই আজকাল বেশি জনপ্রিয় (etcd, Consul, Kafka KRaft) কারণ implement ও ডিবাগ করা সহজ।</p>

<h3>৫) Split-brain কী, আর majority quorum কীভাবে এটা ঠেকায়?</h3>
<p><b>ব্যাখ্যা:</b> Split-brain হলো যখন network partition-এ cluster দুই ভাগে ভাগ হয়ে যায়, আর দুই পাশই independently নিজেদের leader নির্বাচন করে ফেলে — ফলে দুই leader-ই সমান্তরালে লেখা গ্রহণ করে, ডেটা ভিন্ন হয়ে যায় (অধ্যায় ১০)। Majority quorum এটা গাণিতিকভাবে অসম্ভব করে দেয় — একটা N-নোডের cluster-এ যেকোনো দুইটা majority সেট অন্তত একটা নোডে ওভারল্যাপ করবেই, তাই কখনোই দুইটা ভিন্ন majority (৩+৩ বা তার বেশি একই সাথে, N=৫-এ) থাকতে পারে না। ফলে partition-এর minority অংশ কখনো যথেষ্ট ভোট পায় না, নতুন leader নির্বাচিত হয় না — সেই অংশ unavailable/read-only থেকে যায়।</p>

<h3>৬) Vector clock কী, আর এটা Lamport clock থেকে কীভাবে ভিন্ন?</h3>
<pre><span class="c">// Vector clock — প্রতিটা node তার নিজের counter-সহ একটা array রাখে</span>
NodeA: [A:2, B:1, C:0]
NodeB: [A:1, B:3, C:0]
<span class="c">// দুটো ভিন্ন clock-এর কোনোটাই অন্যটার চেয়ে "বড়" নয় (এক ঘরে বেশি, আরেক ঘরে কম)</span>
<span class="c">// ⇒ concurrent event, causally সম্পর্কিত নয়</span></pre>
<p><b>ব্যাখ্যা:</b> Lamport clock (অধ্যায় ২) একটামাত্র integer counter দিয়ে "before/after" নির্ণয় করে, কিন্তু দুটো event সত্যিই causally related নাকি শুধু concurrent তা নিশ্চিতভাবে বলতে পারে না। Vector clock প্রতিটা node-এর জন্য আলাদা counter রাখা একটা array — তুলনা করে বলা যায় একটা clock আরেকটার চেয়ে সব ঘরে বড়/সমান হলে সেটা causally পরে, নাহলে দুটো event concurrent (conflict সম্ভাবনা আছে)। এই কারণেই Dynamo/Cassandra-স্টাইল সিস্টেম conflict detect করতে vector clock (বা তার ভ্যারিয়েন্ট) ব্যবহার করে, শুধু একটা counter দিয়ে যথেষ্ট হয় না।</p>

<h3>৭) Two-Phase Commit (2PC)-এর সবচেয়ে বড় দুর্বলতা কী?</h3>
<p><b>ব্যাখ্যা:</b> 2PC-তে (অধ্যায় ৮) একটা coordinator সব participant-কে prepare করতে বলে, সবাই "হ্যাঁ" বললে commit পাঠায়। সবচেয়ে বড় দুর্বলতা — coordinator যদি সব participant "prepared" অবস্থায় থাকার পর, কিন্তু commit/abort পাঠানোর আগে ক্র্যাশ করে, তাহলে participant-রা একটা blocked অবস্থায় আটকে থাকে — তারা নিজেরা কমিট করতে পারে না (হয়তো coordinator abort বলত), আবার নিজেরা abort-ও করতে পারে না (হয়তো coordinator commit বলত), যতক্ষণ না coordinator ফিরে আসে। এই কারণেই বাস্তবে (মাইক্রোসার্ভিসে) 2PC-র বদলে প্রায়ই Saga pattern ব্যবহার করা হয়।</p>

<h3>৮) Saga pattern কীভাবে distributed transaction-এর বিকল্প হয়? Choreography বনাম orchestration?</h3>
<p><b>ব্যাখ্যা:</b> Saga (অধ্যায় ৮ ও ১২) একটা লম্বা ব্যবসায়িক অপারেশনকে একাধিক স্থানীয় transaction-এ ভেঙে ফেলে, প্রতিটা তার নিজের service-এ কমিট হয়। কোনো ধাপ ব্যর্থ হলে, আগের সফল ধাপগুলোর জন্য compensating action (উল্টো action) চালিয়ে সিস্টেমকে যুক্তিসঙ্গত অবস্থায় ফেরানো হয় — কোনো গ্লোবাল lock/coordinator ব্লক করে রাখে না। Choreography-তে প্রতিটা service event শুনে নিজে সিদ্ধান্ত নেয় পরের ধাপ কী হবে (কেন্দ্রীয় নিয়ন্ত্রণ নেই, কিন্তু বড় saga-তে ট্রেস করা কঠিন); orchestration-এ একটা কেন্দ্রীয় orchestrator প্রতিটা ধাপ explicitly কল করে (ট্রেস করা সহজ, কিন্তু orchestrator নিজেই একটা critical component হয়ে যায়)।</p>

<h3>৯) CQRS কী সমস্যার সমাধান করে, আর এর দাম কী?</h3>
<p><b>ব্যাখ্যা:</b> CQRS (Command Query Responsibility Segregation, অধ্যায় ১২) write model আর read model আলাদা করে — write model normalized ও validation-focused, read model denormalized ও query-optimized। এতে read আর write আলাদাভাবে scale করা যায় এবং read model নির্দিষ্ট query pattern অনুযায়ী সাজানো যায়। দাম হলো — read model write model-এর সাথে eventually consistent, অর্থাৎ একটা write হওয়ার পরপরই read model সেটা নাও দেখাতে পারে (propagation delay), আর দুটো মডেল maintain করার বাড়তি জটিলতা।</p>

<h3>১০) Event Sourcing-এ পুরনো ইভেন্ট বারবার replay করলে পারফরম্যান্স সমস্যা হয় না?</h3>
<p><b>ব্যাখ্যা:</b> হয়, যদি প্রতিটা read-এ শুরু থেকে সব ইভেন্ট replay করা হয় (অধ্যায় ১২)। বাস্তব সমাধান হলো <b>snapshotting</b> — নির্দিষ্ট বিরতিতে (যেমন প্রতি ১০০০ ইভেন্ট পরপর) বর্তমান অবস্থার একটা snapshot সংরক্ষণ করা হয়, যাতে replay শুরু থেকে না করে সর্বশেষ snapshot থেকে করা যায় এবং শুধু তার পরের ইভেন্টগুলো apply করা লাগে।</p>

<h3>১১) Consistent hashing কী সমস্যা সমাধান করে? সাধারণ modulo hashing (hash % N) কেন যথেষ্ট নয়?</h3>
<pre><span class="c">// সাধারণ modulo hashing — node সংখ্যা বদলালে প্রায় সব key remap হয়</span>
node = hash(key) % N   <span class="c">// N=৪ থেকে N=৫ হলে প্রায় ৮০% key-ই ভিন্ন node-এ চলে যায়</span>

<span class="c">// Consistent hashing — একটা ring-এ node ও key দুটোই hash করে বসানো হয়</span>
<span class="c">// node যোগ/বাদ দিলে শুধু ring-এর সংলগ্ন অংশের key-ই সরে, বাকিসব অপরিবর্তিত</span></pre>
<p><b>ব্যাখ্যা:</b> Partitioning-এ (অধ্যায় ৭) node সংখ্যা বাড়ানো/কমানো একটা সাধারণ ঘটনা। Modulo hashing ব্যবহার করলে node সংখ্যা N বদলালেই প্রায় সব key ভিন্ন node-এ চলে যায় — বিশাল rebalancing দরকার হয়। Consistent hashing একটা ring-এর ওপর node ও key দুটোকেই hash করে বসায়, প্রতিটা key তার clockwise-এ সবচেয়ে কাছের node-এ যায়। একটা node যোগ/বাদ দিলে শুধু ring-এর সেই অংশের key-ই প্রভাবিত হয়, বাকি সব node অপরিবর্তিত থাকে — rebalancing খরচ অনেক কমে যায়। Virtual node ব্যবহার করে load আরও সমানভাবে ছড়ানো হয়।</p>

<h3>১২) Failure detection-এ কেন কখনো ১০০% নিশ্চিত হওয়া যায় না যে একটা node মৃত?</h3>
<p><b>ব্যাখ্যা:</b> Timeout হলে জানার উপায় নেই node আসলেই ক্র্যাশ করেছে, নাকি শুধু ধীর (GC pause, CPU overload), নাকি response-টাই নেটওয়ার্কে হারিয়ে গেছে (অধ্যায় ১ ও ৯)। বাইরে থেকে "মৃত" আর "ধীর"-কে নিশ্চিতভাবে আলাদা করার কোনো উপায় নেই — তাই failure detector সবসময় একটা node-কে "suspected" ঘোষণা করে, "নিশ্চিতভাবে মৃত" নয়। Phi accrual failure detector-এর মতো ব্যবহারিক সমাধান একটা probability score দেয়, বাইনারি সিদ্ধান্ত নয়।</p>

<h3>১৩) Circuit Breaker pattern-এর তিনটা state কী কী, আর Bulkhead pattern থেকে এটা কীভাবে ভিন্ন?</h3>
<p><b>ব্যাখ্যা:</b> Circuit Breaker (অধ্যায় ১২)-এর তিনটা state — Closed (স্বাভাবিক, ব্যর্থতা গোনা হয়), Open (threshold পার হলে trip করে, কোনো call-ই downstream-এ যায় না, fail fast), Half-Open (cooldown শেষে সীমিত trial request পাঠানো হয়)। এটা সিদ্ধান্ত নেয় <b>কখন</b> কল বন্ধ রাখতে হবে। Bulkhead pattern ভিন্ন সমস্যা সমাধান করে — প্রতিটা downstream dependency-র জন্য আলাদা resource pool (thread/connection) বরাদ্দ করে, যাতে একটা dependency-র সমস্যা অন্যদের resource কেড়ে না নেয়। দুটো পরিপূরক, বিকল্প নয় — production-এ একসাথে ব্যবহৃত হয়।</p>

<h3>১৪) At-least-once, at-most-once, আর exactly-once delivery-র মধ্যে পার্থক্য কী? সত্যিকারের exactly-once কি সম্ভব?</h3>
<p><b>ব্যাখ্যা:</b> At-least-once মানে message হারায় না, কিন্তু duplicate হতে পারে (retry-এর কারণে)। At-most-once মানে duplicate হয় না, কিন্তু message হারাতে পারে (retry না করলে)। প্রকৃত exactly-once (একবারই, কখনো হারাবে না, কখনো ডুপ্লিকেট হবে না) দুটো স্বাধীন সিস্টেম জুড়ে প্রমাণযোগ্যভাবে অসম্ভব (Two Generals Problem, অধ্যায় ১ ও ১১)। ব্যবহারিক সমাধান হলো at-least-once delivery + idempotent processing (যেমন unique message ID দিয়ে ডুপ্লিকেট শনাক্ত ও বাদ দেওয়া) — যার ফলাফল কার্যত exactly-once "effect" দেয়, যদিও নেটওয়ার্ক-স্তরে সত্যিকারের exactly-once delivery নেই।</p>

<h3>১৫) Strong consistency চাইলে সবসময়ই কি বেশি latency মেনে নিতে হয়? PACELC এখানে কী যোগ করে?</h3>
<p><b>ব্যাখ্যা:</b> সাধারণত হ্যাঁ। CAP শুধু partition-এর সময়ের ট্রেড-অফ বলে, কিন্তু PACELC (অধ্যায় ৪) দেখায় normal (সুস্থ) অবস্থাতেও একটা trade-off থাকে — strongly consistent read নিশ্চিত করতে leader/majority-এর সাথে একটা network round-trip লাগে (ধীর), অথচ nearest local replica থেকে পড়লে দ্রুত কিন্তু potentially stale ডেটা পাওয়া যায়। Google Spanner-এর TrueTime এই penalty পুরোপুরি সরায় না, বরং synchronized clock দিয়ে কমায় — round-trip-এর প্রয়োজনীয়তা একটা bounded clock-uncertainty দিয়ে প্রতিস্থাপন করে।</p>

<h3>১৬) একটা shopping cart আর একটা bank balance-এর জন্য consistency model বাছাই একই রকম হওয়া উচিত কি?</h3>
<p><b>ব্যাখ্যা:</b> না — এটাই এই পুরো কোর্সের কেন্দ্রীয় ব্যবহারিক শিক্ষা (অধ্যায় ৩, ৪, ১৪)। Bank balance-এ সামান্য stale/conflicting read ব্যবসায়িক ক্ষতি করতে পারে (double-spend, ভুল overdraft সিদ্ধান্ত) — তাই এখানে linearizability/strong consistency দরকার, latency-র বিনিময়েও। Shopping cart বা like-count-এ সাময়িক inconsistency (দুইটা device-এ ভিন্ন cart state কিছুক্ষণের জন্য) গ্রহণযোগ্য এবং পরে merge/reconcile করা যায় — তাই সেখানে eventual consistency-ই বরং বেশি availability ও কম latency দেয়। সঠিক প্রশ্ন সবসময় "কোন consistency model সবচেয়ে ভালো" নয়, বরং "এই নির্দিষ্ট ডেটার জন্য কতটা staleness/conflict ব্যবসায়িকভাবে গ্রহণযোগ্য"।</p>

</template>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
