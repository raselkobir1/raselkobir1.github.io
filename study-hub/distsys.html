<div class="callout behind"><span class="tag">গাণিতিকভাবে কেন মাত্র K/n key সরে</span>
ধরুন মোট <code>K</code>-টা key ও <code>n</code>-টা নোড ring-এ আছে, আর key-গুলো মোটামুটি সমানভাবে ছড়ানো। প্রতিটা নোড গড়ে <code>K/n</code>-টা key-র মালিক — নিজের ও পূর্ববর্তী নোডের মাঝের arc-টুকুর সব key। একটা নতুন নোড ঢুকলে সেটা শুধু তার <b>ঠিক আগের</b> নোডের arc-টুকুকে দু-ভাগ করে — বাকি সব নোডের arc, আর তাই তাদের key-mapping, একদম অপরিবর্তিত থাকে। ফলে গড়ে মাত্র <code>K/n</code>-টা key সরে (নতুন arc-টুকুর key), যেখানে naive <code>hash % N</code>-এ প্রায় <code>K × (n-1)/n</code>-টা key সরত — n বড় হলে এই পার্থক্য বিশাল। একই যুক্তি নোড সরিয়ে ফেলার (leave) ক্ষেত্রেও খাটে: শুধু পরের (clockwise) নোড সেই arc-টুকুর দায়িত্ব নেয়, বাকি সব অপরিবর্তিত।
</div>

<h3>Virtual Nodes — Ring-এর লোড সমান করা</h3>
<p>শুধু <code>n</code>-টা নোডকে সরাসরি ring-এ random হ্যাশ করলে একটা বাস্তব সমস্যা থাকে: random অবস্থানের কারণে কোনো নোড হয়তো বিশাল একটা arc পেয়ে যায়, আরেকটা নোড পায় সামান্য একটুকরো — লোড অসমান হয়ে যায়, বিশেষ করে নোড সংখ্যা কম থাকলে। সমাধান হলো <span class="kw">virtual nodes</span> (vnodes): প্রতিটা physical নোডকে ring-এ একটা মাত্র বিন্দুতে না বসিয়ে, তার নামে <b>শত শত ছোট ছোট বিন্দুতে</b> (যেমন ১০০–২৫৬টা) বসানো হয় — প্রতিটা একটা ছোট arc-এর মালিক। যেহেতু প্রতিটা physical নোড এখন ring জুড়ে ছড়ানো অনেকগুলো ছোট arc-এর সমষ্টি ধরে রাখে, বড় সংখ্যার নিয়মে (law of large numbers) গড়ে প্রতিটা নোডের মোট arc প্রায় সমান হয়ে আসে — একটা একক দুর্ভাগ্যজনক বড় arc-এর ঝুঁকি কমে যায়।</p>
<div class="grid2">
<div class="box"><b>Virtual Node ছাড়া</b><br>Node B ring-এ ১ বার বসে — একটামাত্র (random আকারের) বড় arc পায়। সেই arc বাকিদের তুলনায় বড় হলে B বাকিদের চেয়ে বেশি লোড/ডেটা বহন করে, অথচ hardware একই।</div>
<div class="box"><b>Virtual Node সহ</b><br>Node B ring-এ ১৫০+ ছোট segment-এ দেখা যায় (B-vnode-1, B-vnode-2, …ring জুড়ে ছড়ানো)। প্রতিটা ছোট, তাই গড়ে সবার মোট arc প্রায় সমান — আর নতুন, বেশি capacity-র নোড যোগ করলে তাকে বেশি vnode দিয়ে ইচ্ছেমতো বেশি লোড দেওয়া যায়।</div>
</div>
<div class="callout why"><span class="tag">চ্যাপ্টার ১৪-এর সাথে সংযোগ</span>
Apache Cassandra ও Amazon DynamoDB — দুটোই এই consistent hashing + virtual node ধারণার বাস্তব, production-grade বাস্তবায়ন। চ্যাপ্টার ১৪-এ Cassandra-র ring architecture আর DynamoDB-র partitioning স্কিম হাতেকলমে বিস্তারিত দেখব — এখানে যে গাণিতিক ভিত্তিটা শিখলেন সেটাই সেখানে সরাসরি কাজে লাগবে।
</div>

<h3>Rebalancing — অপারেশনাল বাস্তবতা</h3>
<p>Consistent hashing একটা তাত্ত্বিক কাঠামো দেয়, কিন্তু বাস্তব সিস্টেম দুটো প্রধান কৌশলের একটায় <span class="kw">rebalancing</span> বাস্তবায়ন করে।</p>
<p><b><span class="kw">Fixed number of partitions</span></b> — শুরুতেই ডেটাসেটকে একটা নির্দিষ্ট, বড় সংখ্যক partition-এ ভাগ করে ফেলা হয় (যেমন ১০২৪টা), যা নোড সংখ্যার চেয়ে অনেক বেশি। প্রতিটা নোড শুরুতে কয়েকটা করে partition পায়; নতুন নোড এলে কিছু partition তার কাছে <b>স্থানান্তর</b> করা হয় (partition-এর সংখ্যা বা সীমানা বদলায় না, শুধু owner বদলায়)। এই পদ্ধতি Kafka-স্টাইল সিস্টেমে সাধারণ — একটা topic তৈরির সময়েই partition সংখ্যা ঠিক করে দিতে হয়, broker যোগ/বিয়োগ হলে partition reassignment tool দিয়ে সেগুলো broker-দের মধ্যে পুনর্বণ্টন করা হয়।</p>
<p><b><span class="kw">Dynamic splitting</span></b> — এখানে partition-এর সংখ্যা শুরুতে ঠিক করা থাকে না; প্রতিটা partition একটা নির্দিষ্ট আকারের সীমা (threshold) ছাড়িয়ে গেলে সে নিজেই দু-ভাগে বিভক্ত হয়ে যায়, আর নতুন অর্ধেকটা প্রয়োজনে অন্য নোডে সরিয়ে নেওয়া হয়। এই পদ্ধতি HBase/Bigtable-স্টাইল সিস্টেমে সাধারণ (এখানে partition-কে বলা হয় region/tablet)।</p>
<div class="callout best"><span class="tag">Trade-off — কোনটা কখন</span>
<span class="kw">Fixed partition count</span> reasoning করা সহজ (partition সংখ্যা স্থির, শুধু owner বদলায়), কিন্তু শুরুতেই সঠিক সংখ্যা আন্দাজ করে over-provision করতে হয় — কম রাখলে পরে বাড়ানো কষ্টকর (Kafka-তে topic partition সংখ্যা কমানো যায়ই না, বাড়ানো গেলেও key-এর owner বদলে যায়)। <span class="kw">Dynamic splitting</span> বাস্তব ডেটা বৃদ্ধির সাথে নিজে থেকেই খাপ খায়, upfront আন্দাজের দরকার নেই — কিন্তু split/merge, live ডেটা migration, আর splitting মুহূর্তে সাময়িক latency spike সামলানো — অপারেশনাললি অনেক বেশি জটিল।
</div>

<h3>তুলনা — Range বনাম Hash বনাম Consistent Hashing</h3>

</table>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
একটা মেশিন যখন ডেটা বা ট্রাফিকের পুরো ভার আর সামলাতে পারে না, তখন <span class="kw">partitioning</span> ডেটাকে ভাগ করে বহু নোডে ছড়িয়ে দেয় — আর প্রতিটা partition আলাদাভাবে replicate হয়ে (চ্যাপ্টার ৫) durability পায়। <b>Range partitioning</b> সাজানো key-র পরিসর ধরে ভাগ করে — range scan-এ চমৎকার, কিন্তু monotonic key-তে hot spot-এর ঝুঁকি। <b>Hash partitioning</b> লোড সমান করে দেয়, কিন্তু range query হারায়। আর naive <code>hash % N</code> resize হওয়া সিস্টেমে বিপর্যয়কর — <b>consistent hashing</b> ঠিক এই কারণেই দাঁড় করানো হয়েছে: নোড ও key একই circular hash space-এ বসিয়ে, শুধু ঘড়ির কাঁটার দিকের প্রথম নোডকে owner ধরে, নোড যোগ/বিয়োগে মাত্র K/n key সরানোর গ্যারান্টি দেয় — virtual node দিয়ে সেই ভাগাভাগি আরও মসৃণ করা হয়। অপারেশনালি এই rebalancing হয় fixed partition count (Kafka-স্টাইল) বা dynamic splitting (HBase-স্টাইল) দিয়ে। কিন্তু ডেটা একবার একাধিক নোডে ছড়িয়ে গেলে একটা নতুন, কঠিন প্রশ্ন দাঁড়ায়: একটা লজিক্যাল অপারেশন যদি একসাথে একাধিক partition-এর ডেটা বদলাতে চায় (যেমন দুই ভিন্ন shard-এ থাকা দুইটা account-এর মধ্যে টাকা transfer), তাহলে atomicity নিশ্চিত হবে কীভাবে? এটাই পরের চ্যাপ্টার ৮ — Distributed Transactions — এর মূল বিষয়।

<h2 class="title">৮. Distributed Transactions</h2>
<p class="lead">একটা single-node ডেটাবেসে ট্রানজেকশন কমিট মানে একটা ডিস্কে write-ahead log এন্ট্রি — নিশ্চিত, দ্রুত, atomic। কিন্তু বাস্তব মাইক্রোসার্ভিস আর্কিটেকচারে একটা "অর্ডার প্লেস করা" মানে <b>Order Service</b>-এর ডেটাবেস, <b>Payment Service</b>-এর ডেটাবেস, আর <b>Inventory Service</b>-এর ডেটাবেস — তিনটে সম্পূর্ণ আলাদা প্রসেস, আলাদা মেশিন, যেকোনোটা যেকোনো মুহূর্তে স্বাধীনভাবে ক্র্যাশ করতে পারে। এই তিন জায়গায় একসাথে "সব নয়তো কিছুই না" (all-or-nothing) গ্যারান্টি দেওয়া কীভাবে সম্ভব? এই চ্যাপ্টারে দেখব কেন classic সমাধান <span class="kw">Two-Phase Commit</span> আটকে (block) যায়, আর কেন আধুনিক distributed system তার বদলে <span class="kw">Saga</span> ও <span class="kw">Outbox pattern</span> বেছে নেয়।</p>

<h3>একক নোডে ACID সহজ, বহু নোডে সেটাই কঠিনতম সমস্যা</h3>
<p><span class="kw">ACID</span> — Atomicity (সব অথবা কিছুই না), Consistency (এক বৈধ state থেকে আরেক বৈধ state-এ), Isolation (concurrent transaction একে অপরের মাঝপথের অবস্থা দেখে না), Durability (কমিট হলে সেটা টিকে থাকে) — একটা single-node RDBMS এই চারটা গ্যারান্টিই দেয় কারণ পুরো ট্রানজেকশন একটাই প্রসেসের মেমোরি আর একটাই ডিস্কের write-ahead log-এর ভেতরে ঘটে। লক নেওয়া, লগ লেখা, কমিট মার্ক করা — সবকিছুর ওপর একটা একক ইঞ্জিনের সম্পূর্ণ নিয়ন্ত্রণ থাকে।</p>
<p>এখন কল্পনা করুন — একটা অর্ডার প্লেস করতে তিনটে আলাদা সার্ভিসকে একসাথে "রাজি" হতে হবে: Order DB-তে একটা রো তৈরি, Payment DB-তে কার্ড চার্জ, Inventory DB-তে স্টক রিজার্ভ। কোনো একটা মেশিন যদি ঠিক এই মুহূর্তে ক্র্যাশ করে, নেটওয়ার্ক প্যাকেট হারিয়ে যায়, বা রেসপন্স দেরিতে আসে — তিনটে স্বাধীন সিস্টেমকে কীভাবে বোঝাবেন সবাই মিলে একসাথে কমিট করবে, নাকি কেউই করবে না?</p>
<div class="callout why"><span class="tag">কেন এটা সম্পূর্ণ নতুন শ্রেণির সমস্যা</span>
একক নোডে কোনো নেটওয়ার্ক নেই, কোনো আংশিক ফেইলিউর নেই — প্রসেসটা চলছে অথবা ক্র্যাশ করে বন্ধ হয়ে গেছে, মাঝামাঝি কোনো অবস্থা নেই। কিন্তু distributed সেটিং-এ প্রতিটা participant স্বাধীনভাবে ক্র্যাশ করতে পারে, নেটওয়ার্ক মেসেজ হারাতে বা দেরি হতে পারে, আর কোনো একক জায়গায় "সত্যিকারের" একটা লগ নেই যা সবার অবস্থা একসাথে ধরে রাখে। এখান থেকেই দরকার হয় একটা প্রোটোকল যা একাধিক স্বাধীন সিস্টেমকে সমন্বয় করে একটা যৌথ সিদ্ধান্তে পৌঁছায়।</div>

<h3>Two-Phase Commit (2PC) — একজন Coordinator, অনেক Participant</h3>
<p><span class="kw">Two-Phase Commit (2PC)</span> প্রোটোকলে একটা কেন্দ্রীয় <span class="kw">coordinator</span> (transaction manager) সমন্বয় করে, আর প্রতিটা <span class="kw">participant</span> (resource manager — এখানে প্রতিটা সার্ভিসের ডেটাবেস) আসল ডেটা রাখে। পুরো প্রক্রিয়া দুটো ধাপে ভাগ করা — এই দুই-ধাপের কাঠামোই নামের কারণ।</p>

<h4>Phase 1: Prepare (ভোট নেওয়া)</h4>
<p>Coordinator প্রতিটা participant-কে <code>PREPARE</code> পাঠায়। প্রতিটা participant তখন কমিট করার জন্য যা যা দরকার সবকিছু করে ফেলে — প্রয়োজনীয় রো লক করে, পরিবর্তনগুলো নিজের durable log-এ লিখে ফেলে — <b>কিন্তু আসলে কমিট করে না।</b> তারপর উত্তর দেয় <code>YES</code> (আমি প্রস্তুত, কমিট করতে পারব) বা <code>NO</code> (পারব না — যেমন constraint violation, insufficient stock)। এখানে একটা গুরুত্বপূর্ণ শর্ত: একবার একটা participant <code>YES</code> ভোট দিলে, সেটা একটা <b>স্থায়ী প্রতিশ্রুতি</b> — সে আর একতরফাভাবে সিদ্ধান্ত পাল্টাতে পারবে না, coordinator-এর চূড়ান্ত রায় না আসা পর্যন্ত লক ধরে রাখতেই হবে।</p>

<h4>Phase 2: Commit / Abort (সিদ্ধান্ত কার্যকর করা)</h4>
<p>Coordinator সব ভোট জড়ো করে। সবাই <code>YES</code> দিলে সিদ্ধান্ত <b>COMMIT</b> — সবাইকে <code>COMMIT</code> পাঠায়, প্রতিটা participant চূড়ান্তভাবে কমিট করে লক ছেড়ে দেয়। কেউ একজন <code>NO</code> দিলে (বা টাইমআউট হলে) সিদ্ধান্ত <b>ABORT</b> — সবাইকে <code>ROLLBACK</code> পাঠায়।</p>
<div class="diagram"><pre>Coordinator
   │
   ├──PREPARE──▶ Order DB      ──vote: YES──┐
   ├──PREPARE──▶ Payment DB    ──vote: YES──┼──▶ সব YES → সিদ্ধান্ত: COMMIT
   └──PREPARE──▶ Inventory DB  ──vote: YES──┘

   ├──COMMIT───▶ Order DB       (লক রিলিজ, ফাইনাল)
   ├──COMMIT───▶ Payment DB     (লক রিলিজ, ফাইনাল)
   └──COMMIT───▶ Inventory DB   (লক রিলিজ, ফাইনাল)</pre></div>
<div class="callout mistake"><span class="tag">ব্লকিং সমস্যা — Coordinator ক্র্যাশ করলে কী হয়</span>
ধরুন coordinator সব participant-এর <code>YES</code> ভোট জড়ো করে ফেলেছে, সিদ্ধান্ত নিয়েছে <b>COMMIT</b> — কিন্তু ঠিক সেই মুহূর্তে, <code>COMMIT</code> মেসেজ পাঠানোর আগেই ক্র্যাশ করে গেল। এখন প্রতিটা participant একটা <b>"in doubt" অবস্থায়</b> আটকে গেছে — তারা জানে না চূড়ান্ত সিদ্ধান্ত COMMIT নাকি ABORT ছিল। তারা একতরফাভাবে commit করতে পারবে না (হয়তো সিদ্ধান্ত ছিল ABORT), আবার একতরফাভাবে abort-ও করতে পারবে না (হয়তো অন্য কোনো participant ইতিমধ্যে commit করে ফেলেছে)। ফলাফল: participant-কে <b>লক ধরে রেখেই অপেক্ষা করতে হয়</b> — coordinator ফিরে না আসা পর্যন্ত, যা কয়েক সেকেন্ড থেকে কয়েক ঘণ্টাও হতে পারে। বাস্তবে এর মানে: প্রোডাকশন ডেটাবেসে রো লক হয়ে আছে, ওই রো-কে ছুঁতে চাওয়া অন্য সব ট্রানজেকশন সারিতে আটকে আছে — একটা সাধারণ operational দুঃস্বপ্ন।</div>

<h3>Three-Phase Commit (3PC) — প্রস্তাবিত সমাধান, বাস্তবে প্রায় অব্যবহৃত</h3>
<p><span class="kw">Three-Phase Commit (3PC)</span> ঠিক এই ব্লকিং সমস্যা দূর করার জন্যই ডিজাইন করা — Prepare আর Commit-এর মাঝখানে একটা অতিরিক্ত <b>pre-commit</b> ধাপ যোগ করে। যুক্তিটা এরকম: coordinator শুধু তখনই <code>PRE-COMMIT</code> পাঠায় যখন সব ভোট <code>YES</code> এসেছে। তাই যদি একটা participant pre-commit অবস্থায় পৌঁছে যায় আর তারপর একটা টাইমআউট পর্যন্ত coordinator-এর কোনো খবর না পায়, সে নিরাপদে ধরে নিতে পারে সিদ্ধান্ত COMMIT-ই ছিল এবং একতরফাভাবে এগিয়ে যেতে পারে — কাউকে জিজ্ঞাসা না করেই।</p>
<div class="callout behind"><span class="tag">তাহলে 3PC ব্যবহার হয় না কেন</span>
তত্ত্বে সুন্দর শোনালেও 3PC-এর দুটো বাস্তব সমস্যা আছে। প্রথমত, network partition-এর কিছু নির্দিষ্ট প্যাটার্নে (যেমন coordinator আর কিছু participant একদিকে, বাকি participant অন্যদিকে বিচ্ছিন্ন) প্রোটোকলটা আসলে নিরাপদ থাকে না — split-brain-এর মতো পরিস্থিতি তৈরি হতে পারে যেখানে দুই পাশ ভিন্ন সিদ্ধান্তে পৌঁছায়। দ্বিতীয়ত, প্রতিটা ট্রানজেকশনে একটা অতিরিক্ত নেটওয়ার্ক রাউন্ড-ট্রিপের latency যোগ হয়। এই দুই কারণেই আজকের প্রায় কোনো widely-used প্রোডাকশন ডেটাবেস বা মেসেজিং সিস্টেম 3PC বাস্তবায়ন করে না — এটা মূলত একাডেমিক আগ্রহের বিষয় হয়েই থেকে গেছে।</div>

<h3>Saga Pattern — মাইক্রোসার্ভিস স্কেলে ব্যবহারিক সমাধান</h3>
<p>2PC-এর মূল সমস্যা হলো এটা সব participant-কে <b>লক ধরে অপেক্ষা করতে বাধ্য করে</b> — যতক্ষণ না প্রত্যেকে রাজি হয়। <span class="kw">Saga pattern</span> সম্পূর্ণ ভিন্ন দর্শন নেয়: কোনো global lock নেই, বরং একটা সিকোয়েন্স অফ <b>স্বাধীন local transaction</b> (T1, T2, ... Tn), প্রতিটার জন্য একটা প্রতিসম <span class="kw">compensating action</span> (C1, C2, ... ) — যদি কোনো ধাপ ব্যর্থ হয়, তার আগের সব ধাপ বিপরীত ক্রমে (reverse order) compensating action দিয়ে "semantically" পূর্বাবস্থায় ফেরানো হয়।</p>
<p>উদাহরণ: T1 = Order Service অর্ডার তৈরি করে (status: Pending)। T2 = Payment Service কার্ড চার্জ করে। T3 = Inventory Service স্টক রিজার্ভ করে। যদি T3 ব্যর্থ হয় (স্টক নেই), তাহলে C2 = Payment Service রিফান্ড ইস্যু করে, তারপর C1 = Order Service অর্ডার Cancelled মার্ক করে — ঠিক যেভাবে ধাপগুলো এগিয়েছিল তার উল্টো ক্রমে।</p>

<h4>Choreography — কেন্দ্রহীন ইভেন্ট চেইন</h4>
<p><span class="kw">Choreography</span>-তে কোনো কেন্দ্রীয় নিয়ন্ত্রক নেই। প্রতিটা সার্ভিস তার local transaction শেষ করে একটা ইভেন্ট পাবলিশ করে (যেমন <code>OrderCreated</code>), আর অন্য সার্ভিসগুলো সেই ইভেন্টে সাবস্ক্রাইব করে নিজের পরবর্তী পদক্ষেপ চালায় (বা ব্যর্থতার ইভেন্টে compensating action চালায়)। পুরো সিস্টেম সম্পূর্ণ decentralized — কোনো একক component-এর ওপর নির্ভরতা নেই।</p>

<h4>Orchestration — কেন্দ্রীয় Saga Orchestrator</h4>
<p><span class="kw">Orchestration</span>-এ একটা নির্দিষ্ট <b>saga orchestrator</b> কম্পোনেন্ট প্রতিটা ধাপকে স্পষ্টভাবে কল করে (command পাঠিয়ে), এবং কোনো ধাপ ব্যর্থ হলে সঠিক ক্রমে compensating action-গুলো নিজেই ট্রিগার করে। পুরো flow-টা একটা জায়গায় (orchestrator-এর state machine-এ) কোড হিসেবে লেখা থাকে।</p>
<div class="grid2">
<div class="box"><b>Choreography</b><br>✔ কোনো নতুন central component দরকার নেই, প্রতিটা সার্ভিস স্বাধীন<br>✔ সাধারণ, কম-ধাপের flow-এর জন্য দ্রুত বাস্তবায়নযোগ্য<br>✘ ধাপ বাড়লে সামগ্রিক flow "কে কার ইভেন্টে রিঅ্যাক্ট করছে" — ছড়িয়ে-ছিটিয়ে থাকা লজিক থেকে বোঝা কঠিন হয়ে যায়<br>✘ পুরো saga কোথায় আটকে আছে তা ডিবাগ করতে একাধিক সার্ভিসের লগ ঘাঁটতে হয়</div>
<div class="box"><b>Orchestration</b><br>✔ পুরো business flow একটা জায়গায় স্পষ্টভাবে লেখা — পড়া ও রিজন করা সহজ<br>✔ monitoring/observability সহজ — orchestrator-এর state-ই saga-র প্রগ্রেস বলে দেয়<br>✘ orchestrator নিজেই একটা নতুন কম্পোনেন্ট — বানাতে, ডিপ্লয় করতে, রেজিলিয়েন্ট (restartable state) রাখতে হয়<br>✘ ঠিকমতো ডিজাইন না করলে এটাই একটা bottleneck বা single point of failure হয়ে উঠতে পারে</div>
</div>

<div class="callout behind"><span class="tag">Compensating action আসলে "rollback" নয়</span>
এখানে একটা সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ পার্থক্য আছে। ACID rollback-এ কখনো কারো কাছে অসম্পূর্ণ পরিবর্তন দৃশ্যমান হয় না — Isolation সেটা আটকায়। Saga-তে এমন কোনো গ্যারান্টি নেই: T2 (কার্ড চার্জ) কমিট হওয়ার পর থেকে C2 (রিফান্ড) চালানোর আগ পর্যন্ত, গ্রাহকের ব্যাংক স্টেটমেন্টে সত্যিই টাকা কাটা দেখাবে — এটা বাস্তব জগতে ঘটে যাওয়া একটা ঘটনা, যা "মুছে ফেলা" যায় না। Compensating action তাই ইতিহাস মুছে দেওয়া নয়, বরং একটা নতুন, forward-moving ব্যবসায়িক লেনদেন (রিফান্ড ইস্যু করা) — আর এই সময়ের ফাঁকে সিস্টেমের অন্য অংশ "চার্জ হয়ে গেছে" এই state-টা দেখতে পারে। Saga ডিজাইন করার সময় এই সাময়িক অসঙ্গতি (temporary inconsistency)-কে ব্যবসায়িকভাবে মেনে নেওয়া যায় কিনা, সেটাই আসল প্রশ্ন।</div>

<h3>Outbox Pattern — নির্ভরযোগ্যভাবে ইভেন্ট প্রকাশ করা</h3>
<p>Choreography-নির্ভর Saga-তে (বা যেকোনো event-driven flow-তে) একটা সার্ভিসকে প্রায়ই একই সাথে দুটো কাজ করতে হয়: নিজের লোকাল ডেটাবেস আপডেট করা, আর একটা মেসেজ ব্রোকারে (Kafka, RabbitMQ) একটা ইভেন্ট পাবলিশ করা। এই দুটো সম্পূর্ণ আলাদা সিস্টেম — এদের একটাই atomic transaction-এ মোড়ানো সম্ভব নয় (সেটা করতে গেলে আবার 2PC-এর মতো একটা distributed transaction লাগবে, যা ব্রোকার সাধারণত সাপোর্টই করে না)। এটাই <span class="kw">dual-write problem</span>: DB commit সফল কিন্তু publish ব্যর্থ হলে, অন্য সার্ভিসগুলো কখনোই জানবে না যে পরিবর্তনটা ঘটেছে — সিস্টেম জুড়ে অসঙ্গতি তৈরি হয়ে যায়।</p>
<p>সমাধান: ইভেন্টটা সরাসরি ব্রোকারে না পাঠিয়ে, একটা <span class="kw">outbox</span> টেবিলে একটা রো হিসেবে লিখে ফেলুন — <b>একই স্থানীয় ডেটাবেসে, একই ACID transaction-এ</b> যেখানে ব্যবসায়িক ডেটা আপডেট হচ্ছে। যেহেতু এটা একই ডেটাবেস, একই ট্রানজেকশন — এই ইনসার্ট আর business update স্বয়ংক্রিয়ভাবেই atomic, কোনো distributed transaction ছাড়াই। এরপর একটা আলাদা <b>relay process</b> (হয় প্রতি কয়েক সেকেন্ড পোলিং করে, অথবা <span class="kw">CDC (Change Data Capture)</span>-ভিত্তিক টুল যেমন Debezium ডেটাবেসের transaction log পড়ে) outbox-এর নতুন রো তুলে ব্রোকারে পাবলিশ করে, ack না পাওয়া পর্যন্ত রিট্রাই করে, তারপর processed মার্ক করে।</p>
<pre><span class="c">// একই local transaction-এ business data update + outbox insert</span>
using var tx = await dbContext.Database.BeginTransactionAsync();

order.Status = OrderStatus.Placed;
dbContext.Orders.Update(order);

dbContext.OutboxMessages.Add(new OutboxMessage
{
    Id = Guid.NewGuid(),
    Type = "OrderPlaced",
    Payload = JsonSerializer.Serialize(orderPlacedEvent),
    CreatedAt = DateTime.UtcNow,
    <span class="kw">ProcessedAt = null</span>              <span class="c">// এখনো broker-এ পাঠানো হয়নি</span>
});

await dbContext.SaveChangesAsync();       <span class="c">// দুটো পরিবর্তনই একই ACID transaction-এ কমিট হয়</span>
await tx.CommitAsync();

<span class="c">// ---- আলাদা relay process, প্রতি কয়েক সেকেন্ডে পোলিং (বা CDC-চালিত) ----</span>
var pending = dbContext.OutboxMessages.Where(m => m.ProcessedAt == null).Take(50);
foreach (var msg in pending)
{
    await broker.PublishAsync(msg.Type, msg.Payload);   <span class="kw">// ব্যর্থ হলে retry; ack পেলেই</span>
    msg.ProcessedAt = DateTime.UtcNow;                    // processed মার্ক
}
await dbContext.SaveChangesAsync();</pre>
<p>এতে publish ধাপটা <span class="badge">at-least-once</span> হয়ে যায় — ক্র্যাশের পর retry-তে একই ইভেন্ট একাধিকবার পাঠানো হতে পারে (তাই consumer-কে <span class="kw">idempotent</span> হতে হয়), কিন্তু কখনো একটা ইভেন্টও নীরবে হারিয়ে যায় না।</p>
<div class="callout best"><span class="tag">Polling বনাম CDC relay</span>
পোলিং-ভিত্তিক relay বানানো সহজ (শুধু একটা <code>WHERE ProcessedAt IS NULL</code> কোয়েরি চালানো একটা background worker) কিন্তু poll interval অনুযায়ী latency যোগ করে আর বারবার কোয়েরি চালিয়ে ডেটাবেসে লোড ফেলে। Debezium-এর মতো CDC-ভিত্তিক relay ডেটাবেসের নিজের write-ahead log সরাসরি পড়ে — প্রায় রিয়েল-টাইম, DB-তে বাড়তি কোয়েরি-লোড নেই — কিন্তু বাড়তি ইনফ্রাস্ট্রাকচার (Kafka Connect ইত্যাদি) সেটআপ করতে হয়। বেশিরভাগ টিম শুরু করে পোলিং দিয়ে, স্কেল বাড়লে CDC-তে সরে যায়।</div>

<h3>2PC বনাম Saga — একনজরে</h3>
<table>
<tr><th>দিক</th><th>Two-Phase Commit (2PC)</th><th>Saga</th></tr>
<tr><td>Atomicity গ্যারান্টি</td><td>শক্তিশালী — সত্যিকারের all-or-nothing, একটা single global transaction হিসেবে</td><td>নেই — প্রতিটা ধাপ আলাদাভাবে কমিট হয়; ব্যর্থতায় compensating action দিয়ে <b>semantically</b> undo</td></tr>
<tr><td>Coordinator ব্যর্থ হলে</td><td>Participant-রা "in doubt" অবস্থায় লক ধরে <b>ব্লক হয়ে থাকে</b>, একতরফা সিদ্ধান্ত নিতে পারে না</td><td>প্রতিটা ধাপ ইতিমধ্যে কমিট হয়ে গেছে, স্বাধীন — orchestrator ক্র্যাশ করলে সেটার persisted state থেকে resume করা যায়, participant লক ধরে বসে থাকে না</td></tr>
<tr><td>Rollback mechanism</td><td>স্বয়ংক্রিয়, ইঞ্জিন-স্তরের ROLLBACK</td><td>ম্যানুয়ালি লেখা compensating action (business-level undo, যেমন refund)</td></tr>
<tr><td>Isolation</td><td>হ্যাঁ — অসম্পূর্ণ অবস্থা কারো কাছে দৃশ্যমান নয়</td><td>না — মাঝের ধাপগুলোর প্রভাব সাময়িকভাবে বাইরে দৃশ্যমান হতে পারে</td></tr>

"সব সার্ভিস মিলে একটাই atomic transaction হলে সবচেয়ে নিরাপদ" — এই স্বজ্ঞাত ধারণা থেকে অনেকে মাইক্রোসার্ভিসের মধ্যেও <span class="kw">XA transaction</span> বা distributed 2PC বসাতে চান। সমস্যা হলো, এতে প্রতিটা transaction-এর জন্য <b>জড়িত সব সার্ভিসকেই একসাথে up ও responsive</b> থাকতে হয় — একটা সার্ভিস ধীর হলে বা নামিয়ে দিলে বাকি সবার availability-ও সাথে সাথে নেমে যায়, কারণ তাদের সবার লক আটকে থাকে। আর ওপরে যেমন দেখলাম, coordinator ক্র্যাশ করলে পুরো সিস্টেম ব্লক হয়ে যায়। এই কারণেই আধুনিক distributed architecture-এ Saga + Outbox-ই প্রভাবশালী প্যাটার্ন — শক্তিশালী atomicity-এর বদলে availability ও loose coupling বেছে নেওয়া হয়, ব্যর্থতাকে compensating action দিয়ে ব্যবসায়িকভাবে সামলানো হয়।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Two-Phase Commit শক্তিশালী atomicity দেয় কিন্তু coordinator ব্যর্থ হলে participant-দের লক ধরে ব্লক করে রাখে ও সব সার্ভিসের availability একে অপরের সাথে কাপল করে ফেলে। Three-Phase Commit তাত্ত্বিকভাবে এই ব্লকিং দূর করে, কিন্তু network partition-এর কিছু কেসে নিরাপদ থাকে না আর অতিরিক্ত latency যোগ করে বলে বাস্তবে প্রায় ব্যবহৃত হয় না। Saga pattern সেই ব্লকিং সমস্যা এড়িয়ে যায় — প্রতিটা ধাপ স্বাধীন local transaction হিসেবে কমিট হয়, ব্যর্থতায় বিপরীত ক্রমে compensating action চলে (choreography-তে বিকেন্দ্রীভূতভাবে, orchestration-এ একটা কেন্দ্রীয় কম্পোনেন্ট দিয়ে) — বিনিময়ে হারায় সত্যিকারের isolation। আর Outbox pattern dual-write সমস্যাটা সমাধান করে, local DB transaction-এর ভেতরেই ইভেন্ট নিরাপদে persist করে, distributed transaction ছাড়াই at-least-once ডেলিভারি নিশ্চিত করে। কিন্তু এই পুরো আলোচনা একটা জিনিস ধরে নিয়েছে — একটা সার্ভিস বা নোড "আসলেই ব্যর্থ হয়েছে" নাকি "শুধু ধীর", সেটা নির্ভরযোগ্যভাবে বোঝা যায়। পরের চ্যাপ্টার (৯. Failure Detection ও Fault Tolerance) ঠিক এই প্রশ্নেই যাবে — একটা asynchronous নেটওয়ার্কে কীভাবে বোঝা যায় কেউ মারা গেছে নাকি শুধু দেরি করছে, আর সেই অনিশ্চয়তার ওপর ভিত্তি করে কীভাবে সিস্টেম ডিজাইন করতে হয়।</div>

<h2 class="title">৯. Failure Detection ও Fault Tolerance</h2>
<p class="lead">চ্যাপ্টার ১-এ বলা হয়েছিল, distributed system-এর প্রতিটা সমস্যার মূলে আছে partial failure — সিস্টেমের একটা অংশ কাজ করা বন্ধ করে দেয়, কিন্তু বাকি অংশ প্রথমে সেটা জানেই না। এই চ্যাপ্টারে সেই "জানা"-র সমস্যাটাই খোলাসা করা হবে: একটা node আসলেই মৃত, নাকি শুধু ধীর — এটা বোঝার নির্ভরযোগ্য কোনো উপায় নেই, শুধু সম্ভাব্যতা আছে। আর চ্যাপ্টার ৫-এর replication failover, চ্যাপ্টার ৬-এর leader election — দুটোই এই চ্যাপ্টারে বর্ণিত যন্ত্রের উপর দাঁড়িয়ে।</p>

<h3>Failure-এর ধরন — সবগুলো এক নয়</h3>
<p>distributed system-এ একটা node বা network link অনেকভাবে ব্যর্থ হতে পারে, আর প্রতিটার প্রকৃতি আলাদা বলে মোকাবিলার কৌশলও আলাদা।</p>
<div class="grid2">
  <div class="box"><b><span class="kw">Crash-stop</span> failure</b><br>একটা node পুরোপুরি থেমে যায় এবং আর কখনো ফিরে আসে না। সবচেয়ে সরল মডেল — বেশিরভাগ তাত্ত্বিক আলোচনায় (এই কোর্স সহ) এটাই ডিফল্ট ধরে নেওয়া হয়।</div>
  <div class="box"><b><span class="kw">Crash-recovery</span> failure</b><br>node থেমে যায়, কিছুক্ষণ বা অনেকক্ষণ পর আবার চালু হয় — কিন্তু তখন তার ইন-মেমরি অবস্থা হারিয়ে গেছে বা disk-এ থাকা state stale/পুরনো হতে পারে। রিস্টার্ট হওয়া node কতটা বিশ্বাস করা যাবে সেটাই বড় প্রশ্ন।</div>
  <div class="box"><b><span class="kw">Omission</span> failure</b><br>node নিজে সম্পূর্ণ বেঁচে আছে, কিন্তু network একটা message (request বা response) silently হারিয়ে ফেলে বা ফেলে দেয়। node-এর দৃষ্টিকোণ থেকে সে ঠিকই আছে; বাইরে থেকে দেখলে মনে হয় সাড়া দিচ্ছে না।</div>
  <div class="box"><b><span class="kw">Byzantine</span> failure</b><br>node bug, corruption, বা ইচ্ছাকৃত দুর্বৃত্তপনার কারণে ভুল বা পরস্পরবিরোধী তথ্য পাঠাতে থাকে — কাউকে এক কথা বলে, কাউকে আরেক কথা। সবচেয়ে কঠিন ও ব্যয়বহুল মডেল।</div>
</div>
<div class="callout why"><span class="tag">কেন এই পুরো কোর্স Byzantine failure মোকাবিলা করে না</span>
এই কোর্সের বাকি সব চ্যাপ্টার (Replication, Consensus, Partitioning) শুধু crash আর omission failure মোকাবিলার জন্য ডিজাইন করা প্রোটোকল নিয়ে কথা বলে — Byzantine নয়। কারণ <span class="kw">Byzantine fault tolerance</span> (BFT) নিশ্চিত করতে অনেক বেশি ব্যয়বহুল ব্যবস্থা লাগে: crash fault সহ্য করতে <code>N = 2f+1</code> node যথেষ্ট (f-টা fail করলেও চলবে), কিন্তু Byzantine সহ্য করতে লাগে <code>N = 3f+1</code> node, বাড়তি message round, আর cryptographic signature verification। আপনি যদি নিজের নিয়ন্ত্রণে ও বিশ্বাসে থাকা একটা cluster চালান — নিজের datacenter-এর নিজের deploy করা node — তাহলে ধরে নেওয়া যায় কোনো node ইচ্ছাকৃতভাবে মিথ্যা বলবে না, শুধু crash করতে পারে বা ধীর হতে পারে। BFT দরকার হয় সেসব জায়গায় যেখানে অংশগ্রহণকারীরা একে অপরকে বিশ্বাস করে না — যেমন blockchain, বা একাধিক প্রতিষ্ঠানের মধ্যে trustless সমন্বয়। নিজের cluster-এ BFT ব্যবহার করা মানে অকারণে বহুগুণ খরচ ও latency যোগ করা।</div>

<h3>আসল সমস্যা — একটা node "মৃত" তা নিশ্চিতভাবে জানা যায় না</h3>
<p>ধরুন node <code>A</code>, node <code>B</code>-কে একটা heartbeat/request পাঠাল আর একটা নির্দিষ্ট সময়ের মধ্যে কোনো উত্তর পেল না। এখান থেকে <code>A</code> কী সিদ্ধান্তে আসবে — <code>B</code> মারা গেছে? বাস্তবে <code>A</code>-এর কাছে নিচের তিনটা সম্ভাবনার মধ্যে পার্থক্য করার কোনো উপায় নেই:</p>
<div class="diagram"><pre>
  Node A                                          Node B
    │                                               │
    │ ── heartbeat/request ───────────────────▶    │
    │                                               │
    │       (নির্দিষ্ট সময় পার হয়ে গেল — কোনো response নেই)
    │
  ┌─────────────────────────────────────────────────────────────┐
  │  A-এর দৃষ্টিকোণ থেকে এই তিনটাই দেখতে হুবহু একরকম:                │
  │                                                               │
  │   ১) B সত্যিই crash করেছে                (crash-stop)          │
  │   ২) B বেঁচে আছে, শুধু ব্যস্ত/ধীর           (GC pause, CPU spike) │
  │   ৩) message বা response নেটওয়ার্কে         (omission —          │
  │      হারিয়ে/দেরি হয়ে গেছে, B ঠিকই আছে       B আসলে সুস্থ)         │
  └─────────────────────────────────────────────────────────────┘
</pre></div>
<p>এটা কোনো engineering ঘাটতি না, বরং <span class="kw">asynchronous network</span>-এর একটা মৌলিক সীমাবদ্ধতা — network delay-এর কোনো নিশ্চিত উপরের সীমা (upper bound) ধরে নেওয়া যায় না, তাই "যথেষ্ট সময় দিয়েছি" বলাটা আসলে একটা অনুমান, প্রমাণ না। এই কারণেই বাস্তবে ব্যবহৃত প্রতিটা <span class="kw">failure detector</span> আদতে একটা <b>সন্দেহ যন্ত্র</b> — নিশ্চয়তা যন্ত্র নয় — আর প্রায় সবগুলোর ভিত্তি একটাই ধারণা: <span class="kw">timeout</span>।</p>
<div class="callout mistake"><span class="tag">সাধারণ ভুল ধারণা — "একটু বেশি সময় দিলেই নিশ্চিত হওয়া যাবে"</span>
timeout যত বড়ই করা হোক না কেন, তত্ত্বগতভাবে কখনোই ১০০% নিশ্চিত হওয়া সম্ভব না — network delay-এর কোনো প্রমাণিত উপরের সীমা নেই। বাস্তবে প্রতিটা timeout মান আসলে দুইটা খরচের মধ্যে একটা compromise: <b>false positive</b> (একটা সুস্থ কিন্তু ধীর node-কে ভুলভাবে মৃত ঘোষণা করে অপ্রয়োজনীয় failover/thrashing ঘটানো) বনাম <b>detection latency</b> (আসল failure হওয়ার পরও অনেকক্ষণ অপেক্ষা করে তারপর প্রতিক্রিয়া জানানো)। timeout ছোট করলে failure দ্রুত ধরা পড়ে কিন্তু false positive বাড়ে; বড় করলে false positive কমে কিন্তু আসল failure-এ প্রতিক্রিয়া জানাতে দেরি হয় — কোনো "সঠিক" মান নেই, শুধু trade-off আছে।</div>

<h3>সবচেয়ে সহজ পদ্ধতি — Heartbeat ও নির্দিষ্ট Timeout</h3>
<p>সবচেয়ে প্রচলিত failure detector একেবারে সহজ: প্রতিটা node পর্যায়ক্রমে (যেমন প্রতি ১ সেকেন্ডে) একটা ছোট <span class="kw">heartbeat</span> message পাঠায়; একটা নির্দিষ্ট সময় (যেমন ৫ সেকেন্ড) ধরে কোনো heartbeat না এলে সেই node-কে suspected/dead চিহ্নিত করা হয়।</p>
<pre><span class="c">// প্রতিটা peer থেকে সবশেষ heartbeat আসার সময় রেকর্ড রাখা</span>
Dictionary&lt;string, DateTime&gt; lastHeartbeat = new();
TimeSpan <span class="kw">timeout</span> = TimeSpan.FromSeconds(5);   <span class="c">// একটাই fixed মান, পুরো cluster-এর জন্য</span>

<span class="c">// প্রতি সেকেন্ডে চেক করা হয়</span>
void CheckLiveness()
{
    foreach (var (node, lastSeen) in lastHeartbeat)
    {
        if (DateTime.UtcNow - lastSeen > timeout)
            MarkSuspected(node);   <span class="c">// সত্যিই crash, নাকি শুধু ধীর — জানার উপায় নেই</span>
    }
}</pre>
<p>এর সমস্যা হলো — এই fixed threshold পুরো cluster-এর জন্য, সব মুহূর্তের জন্য একই। বাস্তব নেটওয়ার্কে latency স্থির থাকে না — ব্যস্ত সময়ে বা GC pause-এর সময় স্বাভাবিক heartbeat-ও কিছুটা দেরি করে আসতে পারে, যা একটা rigid fixed threshold ভুলভাবে "মৃত" ধরে নিতে পারে।</p>

<h3>Phi Accrual Failure Detector — নির্দিষ্ট Threshold-এর বদলে ক্রমাগত সন্দেহের মাত্রা</h3>
<p>fixed timeout-এর rigidity সমাধানের জন্য <span class="kw">Phi Accrual failure detector</span> একটা ভিন্ন পদ্ধতি নেয়: একটা বাইনারি "alive/dead" সিদ্ধান্তের বদলে, এটা প্রতিটা node-এর heartbeat আসার ঐতিহাসিক প্যাটার্ন (distribution) থেকে একটা ক্রমাগত পরিবর্তনশীল সন্দেহের মান — φ (phi) — হিসাব করে। φ যত বড় হয়, node-টা মৃত হওয়ার সম্ভাবনা তত বেশি বলে ধরে নেওয়া হয়; কিন্তু ঠিক কোন φ-এ "dead" ঘোষণা করা হবে সেটা application নিজে ঠিক করে।</p>
<pre><span class="c">// heartbeat আসার ঐতিহাসিক ব্যবধান (inter-arrival time) থেকে distribution তৈরি</span>
var history = new SlidingWindow(sampleSize: 200);

double Phi(DateTime now, DateTime lastHeartbeat)
{
    double elapsedMs = (now - lastHeartbeat).TotalMilliseconds;
    double p = 1 - history.Cdf(elapsedMs);    <span class="c">// এত দেরি হওয়ার সম্ভাবনা কত কম</span>
    return -Math.Log10(p);                     <span class="c">// φ বড় মানে সন্দেহ প্রবল</span>
}

<span class="c">// প্রতিটা application নিজের ঝুঁকি-সহনশীলতা অনুযায়ী থ্রেশহোল্ড ঠিক করে</span>
if (Phi(DateTime.UtcNow, lastSeen) > <span class="kw">phiThreshold</span>)
    Suspect(node);</pre>
<p>এটা fixed timeout-এর চেয়ে ভালোভাবে খাপ খায় কেন? কারণ যে node-এর heartbeat স্বাভাবিকভাবেই মাঝেমধ্যে দেরি করে আসে (একটা ব্যস্ত network path, একটা বেশি loaded node), তার ঐতিহাসিক distribution-ই সেটা প্রতিফলিত করে — তাই একই পরিমাণ দেরি সেই node-এর জন্য কম φ তৈরি করবে, কিন্তু সাধারণত স্থির/নির্ভরযোগ্য heartbeat দেওয়া একটা node-এর জন্য সামান্য দেরিতেই φ দ্রুত বেড়ে যাবে। প্রতিটা node-peer জোড়ার নিজস্ব "স্বাভাবিক" কী তা শেখা হয়, একটা এক-মাপ-সবার-জন্য থ্রেশহোল্ডের বদলে। <span class="badge">Cassandra</span> <span class="badge">Akka</span> — দুটোই তাদের cluster membership-এ এই কৌশল ব্যবহার করে।</p>

<h3>Gossip Protocol ও SWIM — কেন্দ্রীয় Coordinator ছাড়াই Failure Detection</h3>
<p>এতক্ষণের আলোচনায় ধরে নেওয়া হয়েছিল কেউ একজন (বা প্রতিটা node নিজে নিজে) প্রতিটা peer-কে সরাসরি monitor করছে। কিন্তু হাজার node-এর cluster-এ একটা কেন্দ্রীয় component দিয়ে সবার health poll করা নিজেই একটা bottleneck ও single point of failure হয়ে দাঁড়ায়। <span class="kw">Gossip protocol</span> (epidemic-style dissemination) এই সমস্যা এড়ায়: কোনো কেন্দ্রীয় কর্তৃপক্ষ ছাড়াই, প্রতিটা node পর্যায়ক্রমে কয়েকজন random peer-এর সাথে তার জানা membership/health তথ্য বিনিময় করে। ঠিক যেমন একটা গুজব সমাজে ছড়ায়, তথ্যটাও সূচকীয় (exponential) হারে পুরো cluster জুড়ে ছড়িয়ে পড়ে — মাত্র কয়েক রাউন্ডেই।</p>

<p>শুধু গুজব ছড়ানোই যথেষ্ট না — কে সন্দেহভাজন সেই সিদ্ধান্তটা ভুলভাবে নিলে (একটা bad network path-এর কারণে) পুরো cluster একটা সুস্থ node-কে ভুলভাবে মৃত ধরে নিতে পারে। <span class="kw">SWIM</span> প্রোটোকল এই সমস্যার একটা সুনির্দিষ্ট সমাধান দেয়।</p>
<div class="callout behind"><span class="tag">SWIM-এর Indirect Probing — পর্দার আড়ালে কী ঘটে</span>
SWIM (Scalable Weakly-consistent Infection-style process group Membership) প্রোটোকলে প্রতিটা round-এ একটা node একটা random peer-কে সরাসরি (direct) ping করে। কিন্তু সেই direct probe ব্যর্থ হলেই তক্ষুনি "dead" ঘোষণা করা হয় না। বরং সেই node আরও কয়েকটা (সাধারণত ৩-৪টা) ভিন্ন random peer-কে অনুরোধ করে: "তোমরাও ওকে একবার probe করে দেখো তো" — এটাই <span class="kw">indirect probing</span>। এই বাড়তি সদস্যদের কেউ সফলভাবে response পেলে বোঝা যায় সমস্যাটা মূল probe-কারী আর target-এর মাঝের নির্দিষ্ট network path-এ ছিল, target node নিজে বেঁচেই আছে। শুধু সবগুলো direct ও indirect probe ব্যর্থ হলেই node-টাকে suspected চিহ্নিত করা হয়, আর সেই সন্দেহও gossip-এর মাধ্যমে বাকি cluster-এ ছড়ায়। <span class="badge">Cassandra</span> <span class="badge">Consul</span> <span class="badge">Serf</span> — তিনটাই membership ও failure detection-এর জন্য gossip-ভিত্তিক প্রোটোকল ব্যবহার করে।</div>

<h3>তিনটা পদ্ধতির তুলনা</h3>

<h3>এই চ্যাপ্টার আগে-পরের সাথে যেভাবে যুক্ত</h3>
<div class="callout best"><span class="tag">কেন এই চ্যাপ্টার ছাড়া বাকি কোর্স অচল</span>
এই চ্যাপ্টারটা বিচ্ছিন্ন কোনো টপিক না — এটা পুরো কোর্সের নিচের স্তরের একটা key building block। চ্যাপ্টার ৫-এ replication-এর <b>failover</b> সিদ্ধান্ত (primary node মৃত ধরে নিয়ে একটা replica-কে promote করা) পুরোপুরি নির্ভর করে এখানে বর্ণিত failure detector-এর উপর — ভুল সন্দেহে (false positive) একটা সুস্থ primary-কে demote করলে split-brain-এর ঝুঁকি তৈরি হয়। চ্যাপ্টার ৬-এ Raft-এর leader election শুরুই হয় একটা <b>election timeout</b> দিয়ে — একজন follower "মনে করে" leader মারা গেছে, আর সেটাও এই চ্যাপ্টারে বর্ণিত timeout-based suspicion-এরই একটা প্রয়োগ মাত্র। পরের চ্যাপ্টারে (১০. Coordination ও Leader Election) দেখা যাবে কীভাবে এই "কে মৃত, কে বেঁচে" প্রশ্নের উত্তরের ভিত্তিতে পুরো cluster একজন নতুন leader নিয়ে সম্মত হয়।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Distributed system-এ failure চার রকমের হয় (crash-stop, crash-recovery, omission, Byzantine) — কিন্তু বাস্তব সিস্টেমের প্রায় সব প্রোটোকল শুধু crash আর omission মোকাবিলার জন্যই ডিজাইন করা হয়, কারণ Byzantine fault tolerance অনেক বেশি ব্যয়বহুল আর নিজের বিশ্বাসযোগ্য cluster-এ প্রয়োজনই হয় না। Asynchronous network-এ একটা node সত্যিই মৃত নাকি শুধু ধীর তা কখনোই ১০০% নিশ্চিতভাবে জানা যায় না — তাই প্রতিটা failure detector আসলে timeout-নির্ভর একটা সন্দেহ যন্ত্র, false positive আর detection latency-এর মধ্যে একটা trade-off মাত্র। Fixed timeout সবচেয়ে সহজ কিন্তু rigid; Phi Accrual প্রতিটা node-এর নিজস্ব latency প্যাটার্ন শিখে ক্রমাগত সন্দেহের মাত্রা দেয়; আর Gossip/SWIM কেন্দ্রীয় coordinator ছাড়াই, epidemic-এর মতো দ্রুত পুরো cluster জুড়ে membership তথ্য ছড়িয়ে দেয়, indirect probing দিয়ে false positive আরও কমিয়ে। পরের চ্যাপ্টারে (১০. Coordination ও Leader Election) দেখা যাবে এই "সন্দেহ"-কেই কীভাবে পুরো cluster একসাথে একটা সিদ্ধান্তে — কে হবে নতুন leader — রূপান্তর করে, আর সেখানেই কনসেনসাসের আসল জটিলতা শুরু হয়।</div>

<h2 class="title">১০. Coordination ও Leader Election</h2>
<p class="lead">রেপ্লিকা যখন একাধিক (৫ম চ্যাপ্টার), আর তাদের মধ্যে একজনকে বিশেষ ভূমিকা (primary/leader) দিতে হয়, তখন প্রশ্ন ওঠে — কে ঠিক করবে কে leader, বাকিরা কীভাবে জানবে, আর leader মারা গেলে দ্বিতীয়জন কীভাবে সেটা টের পাবে? এই চ্যাপ্টারে দেখব কীভাবে <span class="kw">ZooKeeper</span>, <span class="kw">etcd</span>-এর মতো <span class="kw">coordination service</span> — ৬ষ্ঠ চ্যাপ্টারের <span class="kw">consensus</span> (Raft/ZAB)-এর উপর দাঁড়িয়ে — leader election, distributed lock, service discovery, আর shared configuration, এই চারটে আলাদা দেখতে সমস্যাকেই আসলে একটামাত্র primitive দিয়ে সমাধান করে।</p>

<h3>কেন একটা আলাদা "Coordination Service" দরকার</h3>
<p>বাস্তব distributed system-এ বারবার একই ধরনের প্রশ্ন ফিরে আসে, ভিন্ন ভিন্ন প্যাকেজিং-এ —</p>
<ul>
<li><b>Leader election:</b> কয়েকটা replica-র মধ্যে কে primary/coordinator হবে?</li>
<li><b>Distributed mutual-exclusion lock:</b> একটা shared resource-এ একসাথে একজনই কাজ করুক, নিশ্চিত করা কীভাবে?</li>
<li><b>Service discovery / membership:</b> এই মুহূর্তে cluster-এ কোন কোন node জীবিত, আর কার IP কী?</li>
<li><b>Shared configuration:</b> সব node-এর কাছে একটা কনফিগারেশন মান একসাথে, সঙ্গতিপূর্ণভাবে (consistently) পৌঁছানো কীভাবে?</li>
</ul>
<p>উপর থেকে এই চারটা সমস্যা আলাদা মনে হলেও, প্রতিটার মূল দাবি আসলে এক — অল্প পরিমাণ কিছু <b>strongly-consistent, highly-available shared state</b>, যেখানে অনেকগুলো node নিরাপদে read/write করতে পারবে, আর অবস্থা বদলালে সাথে সাথেই notify পাবে (watch/subscribe)। এই "অল্প state-এ সবাই একমত" থাকাটাই মূলত ৬ষ্ঠ চ্যাপ্টারের <span class="kw">consensus</span> সমস্যা — আর সেটা নিজে ঠিকভাবে বাস্তবায়ন করা (edge case, network partition, timing bug সামলে) এত কঠিন যে প্রতিটা team নিজে নিজে এটা লেখা বাস্তবসম্মত নয়।</p>
<div class="callout why"><span class="tag">চারটে সমস্যা, একটাই ভিত্তি</span>
এজন্যই <span class="kw">ZooKeeper</span>, <span class="kw">etcd</span>, <span class="kw">Consul</span>-এর মতো specialized সিস্টেম তৈরি হয়েছে — এরা ভেতরে Raft বা ZAB (ch.৬) চালিয়ে সেই কঠিন consensus সমস্যাটা একবার, সঠিকভাবে সমাধান করে রাখে, আর তার উপর কয়েকটা সহজ primitive (znode, lease, watch ইত্যাদি) exposed করে। এরপর leader election, lock, service discovery, shared config — সবগুলোই আসলে <b>একই primitive-এর ভিন্ন ব্যবহার</b>, নতুন করে consensus আবিষ্কার করার দরকার হয় না।</div>

<h3>Naive Leader Election — Bully ও Ring Algorithm</h3>
<p>Coordination service ব্যবহারের আগে, শিক্ষাগতভাবে বোঝা দরকার কেন এত সহজ-দেখতে একটা সমস্যায় (কে leader হবে) এত ভারী infrastructure লাগে। ক্লাসিক্যাল ডিস্ট্রিবিউটেড সিস্টেম সাহিত্যে দুটো সহজ অ্যালগরিদম আছে:</p>
<div class="grid2">
<div class="box"><b><span class="kw">Bully algorithm</span></b><br>যে node প্রথম লক্ষ্য করে current leader সাড়া দিচ্ছে না, সে একটা election ঘোষণা করে — তার চেয়ে উঁচু ID-ওয়ালা সব node-কে message পাঠায়। কেউ উত্তর দিলে (মানে তার চেয়ে উঁচু ID কেউ জীবিত), সে চুপ করে যায়, উত্তরদাতা নিজে election চালায়। কেউ উত্তর না দিলে, সেই node নিজেই leader ঘোষণা করে সবাইকে জানায়। সবচেয়ে উঁচু ID-ওয়ালা জীবিত node সবসময় জেতে — কিন্তু worst case-এ বার্তা সংখ্যা O(n²) পর্যন্ত যেতে পারে।</div>
<div class="box"><b><span class="kw">Ring algorithm</span></b><br>Node-গুলোকে একটা লজিক্যাল রিং-এ (প্রতিটা শুধু পরেরটাকে চেনে) সাজানো থাকে। Election message রিং ধরে ঘুরতে থাকে, প্রতিটা node তার নিজের ID যোগ করে পাঠিয়ে দেয়। এক পাক ঘুরে ফিরে এলে সর্বোচ্চ ID-টাই leader — এই ফলাফল আবার রিং ধরে সবাইকে জানানো হয়।</div>
</div>
<div class="callout mistake"><span class="tag">Production-এ এসব সরাসরি ব্যবহার হয় না কেন</span>
Bully ও Ring — দুটো অ্যালগরিদমই ধরে নেয় নেটওয়ার্ক হয় পুরোপুরি কাজ করে, নয়তো একটা node পুরোপুরি মৃত। কিন্তু বাস্তবে <b>network partition</b> হলে (ch.৯) cluster দুই ভাগে ভেঙে যেতে পারে, যেখানে দুই ভাগই একে অপরকে "মৃত" মনে করে, অথচ দুই ভাগই নিজেদের ভেতরে স্বাভাবিকভাবে কথা বলতে পারছে। তখন দুই ভাগই স্বাধীনভাবে নিজের একটা leader নির্বাচন করে ফেলতে পারে — এই দুইজন leader-ই একসাথে সক্রিয় থাকার অবস্থাকে বলে <span class="kw">split brain</span>। এজন্য বাস্তব coordination service Bully/Ring-এর মতো সরল অ্যালগরিদম না ব্যবহার করে, ch.৬-এর <span class="kw">Raft</span>/<span class="kw">ZAB</span>-এর মতো <b>majority quorum-ভিত্তিক consensus</b> ব্যবহার করে — যেখানে network partition হলেও, শুধু majority quorum পাওয়া অংশটাই নতুন leader নির্বাচন করতে পারে (বিস্তারিত এই চ্যাপ্টারের শেষে)।</div>

<h3>ZooKeeper-এর তিনটি প্রাথমিক উপাদান</h3>
<p><span class="kw">ZooKeeper primitives</span> মাত্র তিনটা সরল ধারণার উপর দাঁড়িয়ে, কিন্তু এগুলো একসাথে মিলে আশ্চর্যরকম শক্তিশালী প্যাটার্ন তৈরি করে:</p>
<table>
<tr><th>Primitive</th><th>কী</th></tr>
<tr><td><span class="kw">znode</span></td><td>একটা হায়ারার্কিক্যাল namespace-এর নোড — অনেকটা ফাইলসিস্টেমের path-এর মতো (<code>/election/node_1</code>), প্রতিটাতে সামান্য data (কয়েক KB) রাখা যায়</td></tr>
<tr><td><span class="kw">Ephemeral znode</span></td><td>যে client সেটা তৈরি করেছে, তার <b>session শেষ হলেই</b> (client crash, নেটওয়ার্ক বিচ্ছিন্নতা, timeout) ZooKeeper নিজে থেকেই এই znode মুছে ফেলে — এটাই "আমি মরে গেলে, আমার lock/leadership স্বয়ংক্রিয়ভাবে ছেড়ে দেওয়া হবে" এই নিশ্চয়তার ভিত্তি</td></tr>
<tr><td><span class="kw">Watch</span></td><td>একটা client একটা znode-এ watch বসাতে পারে — সেই znode তৈরি/পরিবর্তিত/মোছা হলে ZooKeeper সেই client-কে এক-বারের একটা notification পাঠায়</td></tr>
</table>
<p>এই তিনটে মিলিয়ে <b>leader election</b>-এর ক্লাসিক ZooKeeper recipe এরকম: প্রতিটা candidate <code>/election/</code>-এর নিচে একটা <b>ephemeral sequential znode</b> তৈরি করে (ZooKeeper নিজে ক্রমিক নম্বর জুড়ে দেয় — <code>n_0000000001</code>, <code>n_0000000002</code>...)। যার সিকোয়েন্স নম্বর সবচেয়ে কম, সে-ই leader। বাকিরা leader নয়, নিজের ঠিক আগের (next-lowest) znode-এ watch বসায় — leader-এর znode-এ নয়।</p>
<div class="callout behind"><span class="tag">সবাই leader-কে watch না করে, শুধু নিজের ঠিক আগেরজনকে কেন</span>
প্রথম চিন্তায় মনে হতে পারে সবাই সরাসরি leader-এর znode watch করলেই সহজ। কিন্তু ১০০০টা candidate থাকলে, leader crash করামাত্র একসাথে ৯৯৯টা notification ছুটবে (<span class="kw">thundering herd</span>) — অথচ পরবর্তী leader তো একজনই হবে, বাকি ৯৯৮টা notification অপ্রয়োজনীয় ওভারহেড। তাই আসল recipe-তে প্রতিটা candidate শুধু তার ঠিক আগের (next-lower sequence) znode-টা watch করে — কারও crash হলে ঠিক একজনই (তার পরের জন) notification পায়, বাকি সবাই নিরুত্তাপ থাকে। এই ছোট ডিজাইন সিদ্ধান্তটাই বড় cluster-এ ব্যবহারযোগ্যতার (scalability) পার্থক্য গড়ে দেয়।</div>
<p>একই তিনটা primitive দিয়ে <b>distributed lock</b>ও একইভাবে বাস্তবায়িত হয় — lock "ধরা" মানে সবচেয়ে কম sequence-এর ephemeral znode-এর মালিক হওয়া; lock "ছাড়া" মানে সেই znode মোছা (ইচ্ছাকৃতভাবে, অথবা session শেষ হলে স্বয়ংক্রিয়ভাবে)।</p>

<h3>etcd ও Consul — একই সমস্যার ভিন্ন Primitive</h3>
<p><span class="kw">etcd primitives</span> ভিন্ন নামে হলেও কার্যত একই ধারণা প্রকাশ করে। ZooKeeper-এর ephemeral znode + session-এর জায়গায় etcd-এ আছে <span class="kw">lease</span> — client নির্দিষ্ট সময় পরপর lease renew (keep-alive) করতে থাকে; renew বন্ধ হলে (client crash বা নেটওয়ার্ক বিচ্ছিন্ন) lease expire হয়ে যায়, আর সেই lease-এর সাথে bound করা সব key স্বয়ংক্রিয়ভাবে মুছে যায় — ঠিক ZK session-এর মতোই আচরণ। আর ZooKeeper-এর "সবচেয়ে কম sequence তৈরি করাই lock" — এই ধারণার বদলে etcd-এর ভিত্তি হলো <span class="kw">compare-and-swap (CAS)</span>: একটা atomic conditional write, যেখানে "key-টা যদি এখনো না থাকে (বা একটা নির্দিষ্ট version-এ থাকে), তবেই লেখো" — এই একটা primitive দিয়েই lock acquire, leader election, ও conditional config update — সবগুলো বানানো যায়।</p>
<pre><span class="c">// etcd — lease + CAS দিয়ে leader election (etcdctl দিয়ে ধারণাটা দেখানো)</span>
$ etcdctl lease grant 10                      <span class="c"># ১০ সেকেন্ডের lease তৈরি</span>
lease 694d857overwrite granted with TTL(10s)

$ etcdctl put /election/leader "node-A" --lease=694d857overwrite \
    <span class="kw">--prev-kv --if-not-exist</span>              <span class="c"># CAS: key না থাকলেই লেখো (naive উদাহরণ)</span>

<span class="c">// lease renew বন্ধ হয়ে গেলে (client crash), ১০ সেকেন্ড পর etcd</span>
<span class="c">// নিজে থেকেই /election/leader মুছে দেবে — পরের candidate CAS দিয়ে</span>
<span class="c">// আবার সেই key-টা claim করার চেষ্টা করে, প্রথমজনই জেতে</span></pre>
<p>তৃতীয় একটা ভিন্ন প্রয়োগ — HashiCorp-এর <span class="kw">Consul</span>, যেখানে একই ধারণা <b>session</b> ও <b>session-bound lock</b> নামে আসে: একটা client একটা session তৈরি করে (TTL-সহ, বা health-check-bound), তারপর একটা key-কে সেই session-এর সাথে lock হিসেবে bind করে — session শেষ হলে lock স্বয়ংক্রিয়ভাবে ছাড়া পায়।</p>

<h3>Distributed Lock-এর ফাঁদ — Fencing Token</h3>
<p>একটা distributed lock পাওয়া মানেই নিরাপদ, এটা একটা বিপজ্জনক ভুল ধারণা। মার্টিন ক্লেপম্যানের ক্লাসিক উদাহরণ: ধরুন client X একটা lock ধরে একটা shared storage-এ write করতে যাচ্ছে। ঠিক সেই মুহূর্তে client X-এ একটা লম্বা <span class="kw">GC pause</span> (বা VM migration, বা swap) হলো — এত লম্বা যে তার lock/lease/session-এর মেয়াদ (TTL) পেরিয়ে গেল। Coordination service ধরে নেয় client X মারা গেছে, lock/lease expire করে দেয়, আর client Y সেই lock পেয়ে যায় ও নিজের write শুরু করে। কিছুক্ষণ পর client X ঘুম থেকে জাগে (GC শেষ) — কিন্তু X নিজে জানেই না তার lease expire হয়ে গেছে, তাই সে ভাবে সে এখনো lock ধরে আছে, আর তার আগে থেকে বাফার করা write-টা পাঠিয়ে দেয়। ফলাফল: X এবং Y দুজনেরই write শেষপর্যন্ত storage-এ পৌঁছাতে পারে, যদিও ওদের মধ্যে একজনও জানত না আরেকজন সক্রিয় ছিল — ডেটা করাপশন।</p>
<div class="callout mistake"><span class="tag">Common mistake — শুধু lock থাকা মানেই নিরাপদ ভাবা</span>
সমস্যাটা lock নিজে নয় — সমস্যা হলো <b>lock-holder নিজে জানে না তার lease expire হয়ে গেছে।</b> কোনো distributed lock, তা ZooKeeper ephemeral znode হোক বা etcd lease হোক, দীর্ঘ pause-এর বিরুদ্ধে সম্পূর্ণ নিরাপত্তা দিতে পারে না — কারণ pause-এর দৈর্ঘ্য আগে থেকে বাউন্ড করা যায় না (GC, network hiccup, hypervisor scheduling — এসবের কোনো hard upper limit নেই)।</div>
<p>সমাধান — <span class="kw">fencing token</span>: প্রতিবার lock দেওয়ার সময় coordination service একটা <b>একঘেয়েভাবে ক্রমবর্ধমান (monotonically increasing)</b> নম্বর ইস্যু করে (ZooKeeper-এ znode-এর নিজস্ব sequence number ব্যবহার করা যায়; etcd-এ key-এর <code>revision</code>)। Storage service (protected resource) নিজে lock সম্পর্কে কিছুই জানে না, শুধু জানে — "সর্বশেষ কোন token দিয়ে আমি একটা write গ্রহণ করেছি"; পুরনো token নিয়ে আসা যেকোনো write সে নিঃশর্তে reject করে দেয়।</p>
<pre><span class="c">// Storage service — lock সম্পর্কে কিছুই জানে না, শুধু token-এর ক্রম বজায় রাখে</span>
public class StorageService
{
    private long _lastAcceptedToken = 0;

    public void Write(long fencingToken, byte[] data)
    {
        <span class="kw">if</span> (fencingToken &lt; _lastAcceptedToken)
            <span class="kw">throw</span> <span class="kw">new</span> StaleLockException(
                $"token {fencingToken} পুরনো, সর্বশেষ গৃহীত {_lastAcceptedToken}");

        _lastAcceptedToken = fencingToken;   <span class="c">// এখন থেকে এর চেয়ে ছোট token-ই reject হবে</span>
        PersistToDisk(data);
    }
}

<span class="c">// client X-এর GC pause শেষে পাঠানো write-এ পুরনো token (যেমন 41) থাকবে,</span>
<span class="c">// অথচ client Y ইতিমধ্যে token 42 দিয়ে লিখে ফেলেছে — তাই X-এর write reject হয়,</span>
<span class="c">// যদিও X নিজে বিশ্বাস করে সে এখনো lock-এর মালিক</span></pre>
<div class="callout best"><span class="tag">মূল নীতি</span>
Fencing token distributed lock-কে "নিরাপদ" করে না — বরং এটা মেনে নেয় যে lock ব্যর্থ হতেই পারে, আর সেই ব্যর্থতার প্রভাব <b>protected resource-এর কাছে ঠেলে দেয়</b>, যেখানে একটা সাধারণ ordered-comparison দিয়ে সেটা সামলানো সম্ভব। Lock service-কে বিশ্বাস করার বদলে, শেষ প্রতিরক্ষা-স্তরটা সবসময় resource নিজেই হওয়া উচিত।</div>

<h3>Split-Brain ও Majority Quorum</h3>
<p>একটা concrete দৃশ্য কল্পনা করুন: ৫-নোডের একটা cluster, network partition-এ দুই ভাগ হয়ে গেল — ৩ নোডের একটা majority অংশ, আর ২ নোডের একটা minority অংশ। উভয় অংশই একে অপরকে দেখতে পাচ্ছে না, আর উভয় অংশই ভাবতে পারে আসল leader ঐ অন্য পাশে আটকে গেছে — তাই দুই পাশই একসাথে নতুন leader নির্বাচনের চেষ্টা করতে পারে। যদি দুই পাশই সফলভাবে একজন করে leader পেয়ে যায়, তাহলে সেটাই split-brain — দুই leader-ই independently লেখা গ্রহণ করবে, ডেটা ভিন্ন হয়ে যাবে।</p>
<div class="diagram"><pre>
                         ─────────── Network Partition ───────────
   Partition A (৩ নোড — majority)                Partition B (২ নোড — minority)
   ┌────────┐ ┌────────┐ ┌────────┐              ┌────────┐ ┌────────┐
   │ Node 1  │ │ Node 2  │ │ Node 3  │              │ Node 4  │ │ Node 5  │
   └───┬────┘ └───┬────┘ └───┬────┘              └───┬────┘ └───┬────┘
       └──────────┼──────────┘                        └─────┬─────┘
              ৩ / ৫ ভোট → majority                       ২ / ৫ ভোট → quorum নেই
           নতুন Leader নির্বাচিত হয়  ✔                  Leader নির্বাচন ব্যর্থ হয়  ✘
</pre></div>
<div class="callout why"><span class="tag">Majority Quorum কীভাবে Split-Brain ঠেকায়</span>
ch.৬-এ দেখা <span class="kw">Raft</span>/<span class="kw">ZAB</span> ভিত্তিক consensus নিয়ম বলে — নতুন leader নির্বাচিত (বা re-elect) হতে হলে অবশ্যই cluster-এর <b>মোট নোডের অর্ধেকের বেশি</b> (majority) ভোট পেতে হবে। ৫-নোডের cluster-এ majority মানে অন্তত ৩টা ভোট। এখন এমনভাবে দুই ভাগে ভাগ করা <b>গাণিতিকভাবেই অসম্ভব</b> যেখানে দুই ভাগই একসাথে majority (৩+) পেয়ে যাবে — যেকোনো একভাগে সর্বোচ্চ একটাই majority থাকতে পারে। তাই minority অংশ (২ নোড) যতই চেষ্টা করুক, কখনোই যথেষ্ট ভোট জোগাড় করতে পারবে না, ফলে সেখানে কোনো নতুন leader নির্বাচিত হয় না — সেই অংশ শুধু read-only (বা সম্পূর্ণ unavailable) থেকে যায়, যতক্ষণ না partition সেরে ওঠে। এই সাধারণ পাটিগণিতই ZooKeeper/etcd-এর মতো সিস্টেমকে naive Bully/Ring অ্যালগরিদমের চেয়ে নেটওয়ার্ক-পার্টিশন-নিরাপদ করে তোলে।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Leader election, distributed lock, service discovery, ও shared configuration — চারটেই আসলে একই চাহিদা: অল্প পরিমাণ strongly-consistent shared state, যা ch.৬-এর consensus (Raft/ZAB) সমাধান করে। ZooKeeper তিনটে primitive দিয়ে এটা দেয় — <b>znode</b> (namespace), <b>ephemeral znode</b> (session-বাউন্ড auto-cleanup), আর <b>watch</b> (change notification); etcd একই ধারণা দেয় <b>lease</b> ও <b>compare-and-swap</b> দিয়ে; Consul দেয় <b>session-bound lock</b> দিয়ে। তবে lock পাওয়া মানেই নিরাপত্তা নয় — দীর্ঘ pause-এ lease নিঃশব্দে expire হয়ে যেতে পারে, তাই <b>fencing token</b> দিয়ে protected resource-কেই শেষ প্রতিরক্ষা-স্তর বানাতে হয়। আর network partition-এ <b>majority quorum</b>-এর গাণিতিক নিশ্চয়তাই split-brain ঠেকায়। এখন একজন নির্ভরযোগ্য leader ও সঙ্গতিপূর্ণ shared state হাতে থাকলে, পরের প্রশ্ন — node-গুলোর মধ্যে বার্তা আদান-প্রদান <b>নির্ভরযোগ্যভাবে</b> কীভাবে হবে, একবারই পৌঁছাবে নাকি একাধিকবার, ক্রমানুসারে নাকি এলোমেলো — সেটাই ১১শ চ্যাপ্টার, Messaging ও Delivery Guarantees-এর বিষয়।
</div>

<h2 class="title">১১. Messaging ও Delivery Guarantees</h2>
<p class="lead">এতক্ষণ যা দেখেছেন — replication, consensus, partitioning, coordination — সবই মূলত <b>state</b> নিয়ে। এই চ্যাপ্টার একটা ভিন্ন কিন্তু সমান গুরুত্বপূর্ণ প্রশ্ন নিয়ে: দুটো সার্ভিসের মধ্যে একটা <b>event</b> বা <b>command</b> নির্ভরযোগ্যভাবে পাঠানোর প্রতিশ্রুতি আসলে কতটা রাখা সম্ভব — আর কোথায় সেই প্রতিশ্রুতি ভেঙে যায়।</p>

<h3>কেন সরাসরি Call না করে Asynchronous Messaging</h3>
<p>Service A সরাসরি Service B-কে HTTP/gRPC দিয়ে call করলে দুটো জিনিস implicitly ধরে নেওয়া হয় — B এই মুহূর্তে চালু আছে, আর B এই মুহূর্তেই এই request প্রসেস করতে প্রস্তুত। বাস্তব সিস্টেমে এই দুটো ধারণাই ভঙ্গুর। একটা <span class="kw">message broker</span> (queue বা log — যেমন RabbitMQ, Kafka, SQS) মাঝখানে বসিয়ে producer ও consumer-কে দুইভাবে <b>decouple</b> করা হয়:</p>
<div class="grid2">
  <div class="box"><b>Time-এ decoupling</b><br/>Consumer এই মুহূর্তে ডাউন থাকলেও broker message ধরে রাখে — consumer আবার উঠলেই বাকি কাজ শুরু করে। Producer-কে consumer-এর availability নিয়ে ভাবতেই হয় না।</div>
  <div class="box"><b>Load-এ decoupling</b><br/>হঠাৎ ১০x traffic spike এলে broker সেটা buffer করে রাখে — ধীরগতির consumer নিজের গতিতে, নিজের ক্ষমতা অনুযায়ী প্রসেস করে। Spike সরাসরি downstream-কে overwhelm করে না।</div>
</div>
<div class="callout why"><span class="tag">এটা কেন শুধু "সুবিধা" নয়, বেঁচে থাকার শর্ত</span>
Synchronous call chain-এ (A → B → C) C ধীর হয়ে গেলে সেই ধীরগতি পেছনের দিকে ছড়িয়ে পড়ে — B-র thread/connection pool C-র জন্য অপেক্ষায় আটকে থাকে, তারপর A-র pool-ও B-র জন্য আটকায়। এটাই <span class="kw">cascading failure</span>-এর অন্যতম প্রধান উৎস (চ্যাপ্টার ৯-এ দেখেছেন)। একটা broker এই chain-টাকে ভেঙে দেয় — A শুধু broker-কে message দিয়ে এগিয়ে যায়, C-র গতির সাথে A-র নিজের response time কখনোই সরাসরি যুক্ত থাকে না।</div>

<h3>Delivery Guarantee Semantics — ঠিক কী প্রতিশ্রুতি দেওয়া হচ্ছে</h3>
<p>"Message পাঠানো হয়েছে" বলাটা যথেষ্ট নির্দিষ্ট নয়। ঠিক কোন পরিস্থিতিতে কী ঘটে তা তিনটা <span class="kw">delivery guarantee</span>-এর একটাতে পড়ে:</p>
<table>
<tr><th>Semantics</th><th>Producer-এর আচরণ</th><th>Failure-এ কী হয়</th><th>Consumer-এর দায়িত্ব</th></tr>
<tr><td><span class="kw">At-most-once</span></td><td>একবার পাঠায়, ack না পেলেও আর retry করে না (fire-and-forget)</td><td>Network drop/broker down হলে message <b>হারিয়ে যেতে পারে</b> — কখনো duplicate হয় না</td><td>কিছুই না — কিন্তু data loss সহ্য করতে হবে</td></tr>
<tr><td><span class="kw">At-least-once</span></td><td>ack না পাওয়া পর্যন্ত retry করতেই থাকে</td><td>Message <b>হারায় না</b>, কিন্তু retry-এর কারণে একই message একাধিকবার পৌঁছাতে পারে</td><td>Duplicate সামলানোর জন্য idempotent processing আবশ্যক</td></tr>
<tr><td><span class="kw">Effectively-exactly-once</span></td><td>At-least-once delivery-ই ব্যবহার করে (কোনো জাদু নেই)</td><td>Duplicate ডেলিভারি হয়, কিন্তু consumer সেটা শনাক্ত করে <b>প্রসেসিং একবারই</b> কার্যকর হতে দেয়</td><td>Idempotency key + deduplication store বাধ্যতামূলক</td></tr>
</table>
<div class="callout behind"><span class="tag">কেন সত্যিকারের End-to-End Exactly-Once Delivery অসম্ভব</span>
এটা একটা সাধারণ ভুল ধারণা যে ভালো broker "exactly-once delivery" গ্যারান্টি দিতে পারে literal অর্থে। সমস্যাটা মৌলিক: producer একটা message পাঠানোর পর broker-এর ack-এর জন্য অপেক্ষা করে। সেই ack যদি network-এ হারিয়ে যায় — broker আসলে message পেয়েছে, শুধু ack-টাই ফেরত আসেনি — তাহলে producer-এর কাছে দুটো সম্ভাবনা একইরকম দেখায়: message পৌঁছায়নি, অথবা message পৌঁছেছে কিন্তু ack হারিয়েছে। এই দুটো অবস্থার মধ্যে পার্থক্য করার একমাত্র উপায় আরেকটা round trip (broker-কে জিজ্ঞেস করা "তুমি কি আগেরটা পেয়েছিলে?") — আর সেই round trip-ও একই কারণে fail করতে পারে। এই সমস্যা অসীম regress-এ চলে যায় — <span class="kw">two generals problem</span>-এর একটা রূপ (চ্যাপ্টার ১-এ network unreliability দেখেছেন)। তাই producer-এর একমাত্র বাস্তবসম্মত পছন্দ: হয় retry করো (at-least-once, duplicate-এর ঝুঁকি নিয়ে), নয়তো retry কোরো না (at-most-once, loss-এর ঝুঁকি নিয়ে)। মাঝামাঝি "নিখুঁত" কোনো তৃতীয় পথ নেই।</div>
<p>এই বাস্তবতা থেকেই শিল্পের প্রায়োগিক সমাধান বেরিয়েছে — <b>delivery</b>-তে exactly-once না চেয়ে <b>processing</b>-এ exactly-once অর্জন করা: at-least-once delivery ব্যবহার করো (কখনো হারাবে না), আর consumer-কে এমনভাবে ডিজাইন করো যাতে একই message দুইবার এলেও চূড়ান্ত ফলাফল একবার প্রসেস করার মতোই হয়। এই কৌশলটাই পরের সেকশনের বিষয়।</p>

<h3>Idempotency Key ও Deduplication — Duplicate নিরাপদে Ignore করা</h3>
<p>At-least-once ব্যবহার করার মানে duplicate মেনে নেওয়া, কিন্তু duplicate-কে <b>নিরপেক্ষ (harmless)</b> বানানো যায় দুই উপায়ে:</p>
<div class="grid2">
  <div class="box"><b>Deduplication store</b><br/>প্রতিটা message-এ একটা অনন্য <span class="kw">idempotency key</span> (message ID) থাকে। Consumer প্রসেস করার আগে চেক করে — এই ID আগে প্রসেস হয়েছে কি? হলে skip করে, ack দিয়ে দেয় (আবার প্রসেস না করেই)।</div>
  <div class="box"><b>স্বভাবতই Idempotent Operation</b><br/>Operation-টাকে এমনভাবে ডিজাইন করা যাতে বারবার চালালেও একই ফল হয় — যেমন "balance-এ ১০০ যোগ করো" (বারবার চালালে ভুল ফল) এর বদলে "balance <code>=</code> ৫০০ সেট করো" (বারবার চালালেও একই ফল)।</div>
</div>
<pre><span class="c">// Deduplication store ব্যবহার করে idempotent consumer — .NET উদাহরণ</span>
async Task HandleAsync(OrderPlaced msg)
{
    <span class="c">// প্রতিটা message-এর সাথে থাকা অনন্য MessageId — idempotency key</span>
    bool alreadyProcessed = await _dedupStore.ExistsAsync(msg.MessageId);
    if (alreadyProcessed)
    {
        <span class="c">// আগেই প্রসেস হয়েছে — শুধু ack দাও, আবার সাইড-এফেক্ট চালাবে না</span>
        return;
    }

    <span class="kw">using</span> var tx = _db.BeginTransaction();
    await _orderRepo.MarkPaidAsync(msg.OrderId);
    await _dedupStore.RecordAsync(msg.MessageId);   <span class="c">// একই transaction-এ ID সংরক্ষণ</span>
    await tx.CommitAsync();
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — Dedup Check ও Business Logic আলাদা Transaction-এ রাখা</span>
যদি "MessageId রেকর্ড করা" আর "আসল কাজ করা" আলাদা, non-atomic ধাপে করা হয়, তাহলে দুটোর মাঝে crash হলে হয় duplicate আবার চলবে (যদি record আগে হয়, কাজ পরে ব্যর্থ হয়) — অথবা dedup check নিজেই অকেজো হয়ে যাবে। ঠিক যেমন চ্যাপ্টার ৮-এ outbox pattern-এ event লেখা আর business state বদলানো একই local transaction-এ আটকানো হয়েছিল, এখানেও dedup record আর business effect একই atomic transaction-এর মধ্যে থাকতে হবে।</div>

<h3>Offset/Ack Commit Ordering — কখন Commit করবেন সেটাই আসল সিদ্ধান্ত</h3>
<p>Consumer একটা message প্রসেস করে আর broker-কে জানায় "এটা হয়ে গেছে" (<span class="kw">offset commit</span> বা <span class="kw">ack</span>) — কিন্তু এই দুই কাজের <b>ক্রম</b>ই ঠিক করে দেয় সিস্টেম at-most-once নাকি at-least-once আচরণ করবে।</p>
<div class="diagram"><pre>
Commit BEFORE Processing (বিপজ্জনক)          Commit AFTER Processing (নিরাপদ ডিফল্ট)
──────────────────────────────────          ──────────────────────────────────
1. offset commit করো                         1. message প্রসেস করো (ডাটাবেসে লেখা)
2. তারপর message প্রসেস করো                   2. প্রসেসিং সফল হলে offset commit করো

যদি ধাপ ১-এর পর, ধাপ ২ শেষ হওয়ার                যদি ধাপ ১-এর পর, ধাপ ২-এর আগে crash হয়:
আগেই consumer crash করে:                       → restart-এ broker আবার একই message
→ broker ভাবে "কাজ শেষ" (offset বেড়ে গেছে)        পাঠায় (offset আগায়নি) — reprocess হয়
→ কিন্তু আসল কাজ কখনোই হয়নি                      → duplicate, কিন্তু কিছুই হারায়নি
→ MESSAGE নীরবে হারিয়ে গেল (at-most-once)      → idempotent হলে এটা নিরাপদ (at-least-once)
</pre></div>
<div class="callout best"><span class="tag">কেন "Commit After Processing" ডিফল্ট হওয়া উচিত</span>
Data loss আর duplicate processing-এর মধ্যে বেছে নিতে হলে, প্রায় সব business context-এ duplicate (যা idempotency দিয়ে সামলানো যায়) loss-এর (যা প্রায়ই অপরিবর্তনীয়) চেয়ে ঢের নিরাপদ। এজন্য Kafka consumer, SQS visibility timeout, RabbitMQ manual ack — প্রায় প্রতিটা mainstream broker-এর ডিফল্ট বা recommended প্যাটার্নই "প্রসেস আগে, ack/commit পরে"। "Commit আগে" করাটাই সেই সূক্ষ্ম bug যা প্রোডাকশনে চুপচাপ ডেটা হারায় অথচ কোনো error log-এ ধরা পড়ে না — কারণ broker-এর দৃষ্টিতে সবকিছু ঠিকঠাকভাবেই "সম্পন্ন" দেখায়।</div>

<h3>Ordering Guarantees — Partition-ভিত্তিক Order বনাম Global Order</h3>
<p>একটা broker-এ হাজার হাজার message সমান্তরালে প্রবাহিত হলে, সবকিছুর মধ্যে একটা <b>একক global order</b> বজায় রাখা ভয়ংকর ব্যয়বহুল — এর জন্য কার্যত পুরো সিস্টেমকে একটা single-threaded bottleneck-এ পরিণত করতে হয় (consensus-এর মতোই serialization cost, চ্যাপ্টার ৬ দেখুন)। বাস্তবে দরকারও পড়ে না — দরকার শুধু <b>একই entity/key</b>-এর message-গুলো তাদের নিজেদের মধ্যে সঠিক ক্রমে থাকুক।</p>
<p>Kafka-র মতো log-based broker এই সমাধান দেয় <span class="kw">partition</span>-ভিত্তিক ordering দিয়ে — order শুধু একটা partition-এর <b>ভেতরে</b> guaranteed, পুরো topic জুড়ে নয়। একই <code>OrderId</code>-এর সব event একই partition-এ পাঠালে (key দিয়ে hash করে) সেই order-এর জন্য relative order বজায় থাকে, অথচ ভিন্ন ভিন্ন order-এর event সমান্তরালে, ভিন্ন partition-এ, ভিন্ন consumer instance দিয়ে প্রসেস হতে পারে।</p>
<div class="diagram"><pre>
Topic: order-events  (৩টা partition)

Partition 0 ──▶ [Order#101 Created] → [Order#101 Paid] → [Order#101 Shipped]   ← একই key, order বজায়
Partition 1 ──▶ [Order#102 Created] → [Order#102 Paid]
Partition 2 ──▶ [Order#103 Created] → [Order#103 Cancelled]

Partition-এর ভেতরে ক্রম নিশ্চিত।  Partition ০, ১, ২-এর মধ্যে কোনো আপেক্ষিক ক্রমের গ্যারান্টি নেই।
</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — Partition Key না ভেবে Round-Robin-এ পাঠানো</span>
যদি একই <code>OrderId</code>-এর "Created", "Paid", "Shipped" event ভিন্ন ভিন্ন partition-এ (round-robin distribution-এ) চলে যায়, তাহলে দুটো partition-এর consumer independent গতিতে চলার কারণে "Shipped" event "Paid"-এর <b>আগে</b> প্রসেস হয়ে যেতে পারে — একটা অর্ডার শিপ হয়ে গেছে অথচ সিস্টেমের হিসেবে সেটা এখনো paid হয়নি। সমাধান সবসময় producer-side-এ: partition key হিসেবে ঠিক সেই entity-র ID ব্যবহার করা (Kafka-তে <code>ProducerRecord</code>-এ key দিলে একই key সবসময় একই partition-এ hash হয়)।</div>

<h3>Dead-Letter Queue ও Poison Message — যখন একটা Message বারবার Fail করে</h3>
<p>At-least-once retry ভালো, কিন্তু একটা <span class="kw">poison message</span> — যেমন malformed payload, বা এমন একটা business state যা কখনোই সফলভাবে প্রসেস হবে না — অনন্তকাল retry হতে থাকলে ভয়ানক সমস্যা তৈরি করে।</p>
<div class="callout why"><span class="tag">Head-of-Line Blocking — একটা খারাপ Message পুরো Partition আটকে দেয়</span>
Partition-ভিত্তিক ordering বজায় রাখতে consumer একটা partition-এর message ক্রমান্বয়ে প্রসেস করে — পরের message প্রসেস শুরু হয় না যতক্ষণ না আগেরটা শেষ হয়। এখন একটা message যদি বারবার exception ছুড়ে fail করে আর consumer সেটা infinite retry করতে থাকে, সেই partition-এর <b>পরের সব</b> message (যেগুলো সম্পূর্ণ সুস্থ, প্রসেস করা যেত) আটকে থাকে — এটাই <span class="kw">head-of-line blocking</span>। একটা করাপ্ট message পুরো downstream pipeline থামিয়ে দিতে পারে।
</div>
<p>সমাধান — একটা <span class="kw">retry policy with backoff</span> (সীমিত সংখ্যক retry, প্রতিবার বাড়তে থাকা delay দিয়ে transient error-কে সুযোগ দেওয়া) এবং সীমা পার হলে message-টাকে একটা <span class="kw">dead-letter queue (DLQ)</span>-এ সরিয়ে দেওয়া — মূল queue থেকে সরে গিয়ে বাকি সুস্থ message-গুলোকে এগোতে দেওয়া, আর DLQ-এর content পরে manual investigation/alerting-এর মাধ্যমে দেখা।</p>
<pre><span class="c">// সরলীকৃত retry + DLQ পলিসি</span>
async Task ProcessWithRetryAsync(Message msg)
{
    const int maxAttempts = 5;
    for (int attempt = 1; attempt <= maxAttempts; attempt++)
    {
        try
        {
            await _handler.HandleAsync(msg);
            return;   <span class="c">// সফল — লুপ থেকে বের হয়ে ack/commit</span>
        }
        catch (Exception) when (attempt < maxAttempts)
        {
            var delay = TimeSpan.FromSeconds(Math.Pow(2, attempt));  <span class="c">// exponential backoff</span>
            await Task.Delay(delay);
        }
    }
    await _deadLetterQueue.SendAsync(msg);  <span class="c">// সীমা পার — সরিয়ে দাও, মূল queue এগিয়ে যাক</span>
}</pre>

<h3>চিত্রে — Producer → Broker → Consumer পাইপলাইনে Loss ও Duplicate কোথায় ঢোকে</h3>

<h3>Outbox Pattern-এর সাথে সংযোগ — Publisher নিজেও At-Least-Once-এর অধীন</h3>
<div class="callout behind"><span class="tag">চ্যাপ্টার ৮-এর সাথে যোগসূত্র</span>
চ্যাপ্টার ৮-এ <span class="kw">outbox pattern</span> দেখানো হয়েছিল একটা business state পরিবর্তন আর একটা event প্রকাশ করাকে atomic করার সমাধান হিসেবে — দুটোই একই local database transaction-এ লেখা হয়, তারপর একটা <b>relay process</b> outbox table থেকে event তুলে broker-এ পাঠায়। এই relay নিজেও একটা producer, আর সেই producer-এর সামনে ঠিক এই চ্যাপ্টারেরই সমস্যা: broker ack দেওয়ার আগে relay crash করলে বা network glitch হলে, relay নিশ্চিত হতে পারে না event পৌঁছেছে কিনা — তাই ack না পাওয়া পর্যন্ত সে <b>আবার পাঠাবে</b> (row-টা তখনও outbox-এ "unpublished" হিসেবে থাকে)। অর্থাৎ outbox relay কাঠামোগতভাবেই at-least-once সেমান্টিক্সের অধীনে চলে — আর ঠিক এই কারণেই outbox pattern-এর ওপর নির্ভরশীল প্রতিটা event consumer-কে অবশ্যই idempotent হতে হবে। Outbox আপনাকে "event হারাবে না" এই গ্যারান্টি দেয়, কিন্তু "প্রতিটা event ঠিক একবারই আসবে" এই গ্যারান্টি কখনোই দেয় না — সেই দায়িত্ব consumer-এর।</div>

<h3>সিদ্ধান্তের সংক্ষিপ্তসার</h3>
<div class="card">
<span class="badge">At-most-once</span> শুধু তখন গ্রহণযোগ্য যখন occasional data loss সহনীয় (যেমন non-critical metrics/telemetry)।
<br/><span class="badge">At-least-once + Idempotency</span> বেশিরভাগ business-critical pipeline-এর ডিফল্ট পছন্দ — payment, order, inventory event।
<br/><span class="badge">Partition key নির্বাচন</span> সাবধানে করুন — একই entity-র সব event একই key/partition-এ, নাহলে ordering ভেঙে যাবে।
<br/><span class="badge">DLQ ছাড়া ordered queue</span> কখনো production-এ চালাবেন না — একটা poison message পুরো pipeline থামিয়ে দিতে পারে।
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
সত্যিকারের exactly-once <b>delivery</b> নেটওয়ার্কের মৌলিক অনিশ্চয়তার কারণে অর্জন করা অসম্ভব — কিন্তু at-least-once delivery ও consumer-side idempotency মিলিয়ে effectively-exactly-once <b>processing</b> বাস্তবে অর্জনযোগ্য, এবং এটাই শিল্পের প্রমাণিত standard সমাধান। Offset/ack সবসময় processing শেষে commit করুন, একই entity-র event একই partition key-তে রাখুন order বজায় রাখতে, আর প্রতিটা ordered pipeline-এর সাথে একটা dead-letter queue রাখুন যাতে একটা খারাপ message পুরো সিস্টেম না থামায়। এই নীতিগুলো — idempotent consumer, at-least-once delivery, নির্ভরযোগ্য event publishing — পরের চ্যাপ্টার ১২-এ আরও বড় আকারে ফিরে আসবে, যেখানে <span class="kw">CQRS</span>, <span class="kw">Saga</span>, ও <span class="kw">Circuit Breaker</span>-এর মতো design pattern এই একই বিল্ডিং ব্লকগুলো দিয়ে সম্পূর্ণ distributed workflow তৈরি করবে।</div>

<h2 class="title">১২. Design Patterns — CQRS, Saga, Circuit Breaker</h2>
<p class="lead">এতদিন আমরা distributed system-এর <b>মৌলিক যন্ত্রপাতি</b> নিয়ে কথা বলেছি — replication কীভাবে ডেটা কপি রাখে (অধ্যায় ৫), consensus কীভাবে বহু নোড এক সিদ্ধান্তে একমত হয় (অধ্যায় ৬), distributed transaction কীভাবে একাধিক service জুড়ে কাজ সম্পন্ন করে (অধ্যায় ৮)। এই অধ্যায়ে আমরা এক ধাপ ওপরে উঠব — এই যন্ত্রপাতিগুলোর ওপর ভিত্তি করে তৈরি <b>পুনঃব্যবহারযোগ্য আর্কিটেকচারাল প্যাটার্ন</b>, যেগুলো বাস্তব distributed system ডিজাইনে বারবার ফিরে আসে। এগুলো নতুন মেকানিজম নয় — এগুলো পুরনো মেকানিজম ব্যবহারের প্রমাণিত, নামকরণ করা উপায়।</p>

<h3>CQRS — Command Query Responsibility Segregation</h3>
<p>একটা সাধারণ CRUD service-এ read আর write একই মডেল, একই টেবিল, একই schema ব্যবহার করে। সমস্যা হয় যখন স্কেল বাড়ে — read আর write-এর চাহিদা আলাদা দিকে টানতে শুরু করে। <span class="kw">CQRS</span> (Command Query Responsibility Segregation) প্যাটার্নে write model (command সামলায় — validation, business rule, persistence) আর read model (query সামলায় — দ্রুত পড়ার জন্য optimized, প্রায়ই denormalized) সম্পূর্ণ আলাদা করে ফেলা হয়। এরা প্রায়ই আলাদা schema ব্যবহার করে, কখনো কখনো সম্পূর্ণ আলাদা database (যেমন write-এর জন্য relational DB, read-এর জন্য একটা search index বা document store)।</p>
<div class="diagram"><pre>
Client
  │
  ├──command (write)──▶  Write Model                (normalized, validation, business rule)
  │                            │
  │                            │  async propagate (event / CDC / projection update)
  │                            ▼
  └──query (read) ◀────  Read Model                  (denormalized, query-optimized — শুধু পড়ার জন্য সাজানো)

  Write ও Read model আলাদা schema/database হতে পারে — মাঝের propagation delay-টুকুই eventual consistency-র উৎস
</pre></div>
<div class="callout why"><span class="tag">কেন এটা দরকার হয়</span>
বড় স্কেলে দুটো সুবিধা আসল কারণ। প্রথমত, read আর write আলাদাভাবে scale করা যায় — বেশিরভাগ system-এ read traffic write-এর চেয়ে বহুগুণ বেশি, তাই read side-কে স্বাধীনভাবে replica বাড়িয়ে scale করা যায়, write side-কে না ছুঁয়ে। দ্বিতীয়ত, read model-কে নির্দিষ্ট query pattern অনুযায়ী সাজানো যায় — একটা ড্যাশবোর্ডের জন্য denormalized, pre-joined view বানানো যায়, অথচ write model-এর normalized, validation-friendly গঠন ঠিক রেখেই।
</div>
<p>কিন্তু এর একটা বাস্তব মূল্য আছে, আর এটা মিস করলে ভুল বোঝাবুঝি হয়। Write model-এ একটা পরিবর্তন হওয়ার পরপরই read model সেটা প্রতিফলিত করে না — read model write model-এর সাথে <span class="kw">eventually consistent</span> (অধ্যায় ৩-এর সংজ্ঞা মনে করুন)। মানে write আর read model sync হতে একটা ছোট delay লাগে (সাধারণত মিলিসেকেন্ড থেকে সেকেন্ড), আর caller-কে এই propagation delay সহ্য করতে হবে — একজন ইউজার একটা অর্ডার দেওয়ার সাথে সাথেই read API কল করলে সেই অর্ডার নাও দেখতে পারে।</p>

<h3>Event Sourcing</h3>
<p>প্রচলিত পদ্ধতিতে আমরা "বর্তমান অবস্থা" সংরক্ষণ করি — একটা row-তে আপডেট হলে পুরনো মান হারিয়ে যায়। <span class="kw">Event Sourcing</span> প্যাটার্নে এর উল্টো করা হয়: বর্তমান অবস্থার বদলে <b>কী কী ঘটেছে</b> তার একটা immutable, append-only sequence সংরক্ষণ করা হয় — <code>OrderPlaced</code>, <code>OrderPaid</code>, <code>OrderShipped</code>। বর্তমান অবস্থা কখনো সরাসরি সংরক্ষিত হয় না — সেটা প্রয়োজনমতো এই ইভেন্টগুলো শুরু থেকে replay করে derive করা হয়।</p>
<pre><span class="c">// প্রচলিত পদ্ধতি — শুধু বর্তমান অবস্থা</span>
Order { Id: 42, Status: "Shipped", Total: 1500 }

<span class="c">// Event Sourcing — সম্পূর্ণ ইতিহাস, বর্তমান অবস্থা derive করা হয়</span>
<span class="kw">OrderPlaced</span>   { OrderId: 42, Total: 1500, At: t0 }
<span class="kw">OrderPaid</span>     { OrderId: 42, Amount: 1500, At: t1 }
<span class="kw">OrderShipped</span>  { OrderId: 42, Carrier: "DHL", At: t2 }

<span class="c">// বর্তমান অবস্থা = এই তিনটা ইভেন্ট order-এ ধাপে ধাপে apply করার ফলাফল</span></pre>
<p>স্বাভাবিক প্রশ্ন — বছরের পর বছর ধরে জমে থাকা লক্ষ লক্ষ ইভেন্ট প্রতিবার replay করলে তো পারফরম্যান্স খারাপ হবে? এর ব্যবহারিক সমাধান <span class="kw">snapshotting</span> — নির্দিষ্ট বিরতিতে (যেমন প্রতি ১০০০ ইভেন্ট পরপর) বর্তমান অবস্থার একটা snapshot সংরক্ষণ করা হয়, যাতে replay শুরু থেকে না করে সর্বশেষ snapshot থেকে করা যায়, শুধু তার পরের ইভেন্টগুলো apply করে।</p>
<div class="callout behind"><span class="tag">Event Sourcing আর CQRS কেন প্রায়ই একসাথে থাকে</span>
এই দুটো প্যাটার্ন আলাদা, কিন্তু একসাথে ব্যবহার করলে স্বাভাবিকভাবেই একে অপরের পরিপূরক হয়ে যায়। Event log-টাই write model — প্রতিটা command একটা নতুন ইভেন্ট তৈরি করে। আর সেই একই event stream read model-এর <span class="kw">projection</span> তৈরির জন্য natural source — প্রতিটা ইভেন্ট আসার সাথে সাথে read-optimized ভিউ আপডেট হতে থাকে। ফলে আপনি একই সোর্স অফ ট্রুথ থেকে একাধিক read model বানাতে পারেন (একটা ড্যাশবোর্ডের জন্য, আরেকটা সার্চের জন্য) — শুধু ভিন্ন projection চালিয়ে।
</div>

<h3>Saga — সংক্ষিপ্ত পুনরাবৃত্তি</h3>
<p>অধ্যায় ৮-এ আমরা <span class="kw">Saga</span> প্যাটার্নের সম্পূর্ণ মেকানিক্স দেখেছি — choreography বনাম orchestration, আর ব্যর্থতা হলে compensating action দিয়ে আগের ধাপগুলো উল্টে দেওয়া। এখানে আমরা সেটা পুনরায় derive করছি না, শুধু এই অধ্যায়ের প্রসঙ্গে জায়গামতো বসাচ্ছি — Saga হলো সেই আর্কিটেকচারাল প্যাটার্ন যা ব্যবহার করা হয় যখন একাধিক service জুড়ে একটা ধারাবাহিক পদক্ষেপের সেট-কে transactional consistency দিতে হয়, অথচ classic distributed transaction (two-phase commit) ব্যবহার করা যায় না বা করা ঠিক না (কারণ ও বিস্তারিত মেকানিজম — অধ্যায় ৮ দেখুন)।</p>

<h3>Circuit Breaker Pattern</h3>
<p>ধরুন আপনার service একটা downstream dependency-কে (যেমন একটা payment service) কল করে, আর সেই dependency ধীর হয়ে গেছে বা মরে গেছে। প্রতিটা incoming request সেই dependency-কে কল করতে গিয়ে টাইমআউট পর্যন্ত আটকে থাকে — thread, connection pool স্লট সব আটকে যায়, আর আপনার নিজের service-ও ধসে পড়ে, যদিও আসল সমস্যা downstream-এ। <span class="kw">Circuit Breaker pattern</span> এই সমস্যার সমাধান — এটা একটা state machine যা downstream call-কে wrap করে রাখে, তিনটা অবস্থায় থাকে:</p>
<ul>
<li><b>Closed</b> — স্বাভাবিক অবস্থা। সব request downstream-এ যায় স্বাভাবিকভাবে, আর প্রতিটা ব্যর্থতা গোনা হয়।</li>
<li><b>Open</b> — ব্যর্থতার সংখ্যা একটা নির্ধারিত threshold পার হলে breaker "trip" করে Open অবস্থায় চলে যায়। এই অবস্থায় কোনো request আর downstream-কে কল-ই করে না — সাথে সাথে fail করে দেওয়া হয় (fail fast), একটা নির্ধারিত cooldown সময়ের জন্য।</li>
<li><b>Half-Open</b> — cooldown শেষ হওয়ার পর breaker সীমিত সংখ্যক trial request downstream-এ পাঠাতে দেয়। সেগুলো সফল হলে breaker আবার Closed-এ ফিরে যায়; ব্যর্থ হলে আবার Open-এ ফিরে যায়, নতুন cooldown শুরু হয়।</li>
</ul>
<div class="callout why"><span class="tag">Circuit Breaker কেন দরকার — দুটো আলাদা কারণ</span>
এই প্যাটার্ন দুটো ভিন্ন সমস্যা একসাথে সমাধান করে। প্রথমত, এটা <b>downstream dependency-কে রক্ষা করে</b> — যখন কোনো service ইতিমধ্যে struggle করছে, তার ওপর অবিরাম retry চাপালে সেটা আরও বেশি সময় ধরে অসুস্থ থাকে (একে বলে <span class="kw">retry storm</span>); fail fast করে দিলে সেই dependency কে recover করার সুযোগ দেওয়া হয়। দ্বিতীয়ত, এটা <b>caller service নিজেকে রক্ষা করে</b> — একটা ধীর dependency-র জন্য অপেক্ষা করতে থাকা thread/connection জমা হয়ে caller-এর নিজের resource ফুরিয়ে ফেলতে পারে, যা caller-কেও অস্বাভাবিক করে তোলে এবং পুরো সিস্টেম জুড়ে <span class="kw">cascading failure</span> ছড়িয়ে দেয় (অধ্যায় ৯-এ failure detection প্রসঙ্গে এই ধারণা দেখেছেন)। Circuit Breaker উভয় দিক থেকেই ক্ষতি সীমিত করে।
</div>

<h3>Bulkhead Pattern</h3>
<p><span class="kw">Bulkhead pattern</span>-এর নাম এসেছে জাহাজের হাল থেকে — একটা জাহাজের ভেতরের অংশ ওয়াটারটাইট bulkhead দিয়ে আলাদা আলাদা কম্পার্টমেন্টে ভাগ করা থাকে, যাতে একটা কম্পার্টমেন্টে পানি ঢুকলেও পুরো জাহাজ ডুবে না যায় — ক্ষতি সেই একটা কম্পার্টমেন্টে সীমাবদ্ধ থাকে। Software-এ এই একই ধারণা প্রয়োগ করা হয় resource pool আলাদা করে — প্রতিটা downstream dependency-র জন্য আলাদা thread pool বা আলাদা connection pool limit বরাদ্দ করা হয়, যাতে একটা dependency ধীর বা মৃত হয়ে গেলে সেটা শুধু তার নিজের বরাদ্দকৃত pool ভরিয়ে ফেলে — অন্য, সুস্থ dependency-র calls-এর জন্য shared resource ফুরিয়ে যায় না।</p>
<div class="callout mistake"><span class="tag">ভুল ধারণা</span>
Circuit Breaker আর Bulkhead একে অপরের বিকল্প নয় — এরা পরিপূরক। Circuit Breaker সিদ্ধান্ত নেয় <b>কখন</b> একটা dependency-কে কল করা বন্ধ রাখতে হবে; Bulkhead নিশ্চিত করে যে সেই dependency-র জন্য বরাদ্দ resource আলাদা থাকায়, breaker trip হওয়ার আগ পর্যন্ত সময়টুকুতেও, ওই একটা dependency-র সমস্যা অন্য কলগুলোর resource কেড়ে নিতে না পারে। বাস্তব production system-এ দুটোই একসাথে প্রয়োগ করা হয়।
</div>

<h3>Sidecar ও Service Mesh — সংক্ষিপ্ত পরিচয়</h3>
<p>Circuit Breaker, retry, timeout, mTLS, observability — এই cross-cutting concern-গুলো প্রতিটা service-এর নিজস্ব application code-এ বারবার লিখতে হলে (বিশেষত অনেক ভাষা/framework মিশ্রিত একটা microservices fleet-এ) রক্ষণাবেক্ষণ কঠিন হয়ে যায়। <span class="kw">Sidecar / Service Mesh</span> প্যাটার্নে এই সব concern service-এর নিজের কোডের বাইরে, একটা co-located proxy process-এ সরিয়ে দেওয়া হয় — service শুধু তার business logic নিয়ে ব্যস্ত থাকে, আর পাশে চলা sidecar proxy retry, circuit breaking, mTLS, metric-collection ইত্যাদি সামলায়। এই বিষয়ে বিস্তারিত Kubernetes কোর্সে দেখেছেন।</p>

<h3>কোন প্যাটার্ন কোন সমস্যার জন্য</h3>

<tr><td><span class="kw">CQRS</span></td><td>Read আর write-এর স্কেলিং চাহিদা ভিন্ন; read schema-কে query pattern অনুযায়ী optimize করা দরকার</td><td>Read model eventually consistent — propagation delay সহ্য করতে হয়; দুটো মডেল maintain করার জটিলতা</td></tr>
<tr><td><span class="kw">Event Sourcing</span></td><td>সম্পূর্ণ audit trail দরকার; বর্তমান অবস্থা কীভাবে এলো তা জানা জরুরি; একাধিক read projection দরকার</td><td>Replay-এর পারফরম্যান্স খরচ (snapshotting দিয়ে প্রশমিত); event schema evolution জটিল</td></tr>
<tr><td><span class="kw">Saga</span></td><td>একাধিক service জুড়ে ধারাবাহিক পদক্ষেপে transactional consistency, 2PC ছাড়া</td><td>Compensating action লিখতে হয়; ব্যর্থ মাঝপথে system সাময়িকভাবে inconsistent থাকে</td></tr>
<tr><td><span class="kw">Circuit Breaker</span></td><td>অসুস্থ downstream dependency-কে retry দিয়ে আরও অসুস্থ করা এবং caller-এর নিজস্ব resource exhaustion ঠেকানো</td><td>Threshold/cooldown টিউনিং ভুল হলে fail fast অতিরিক্ত আক্রমণাত্মক বা অতিরিক্ত ধীর হতে পারে</td></tr>
<tr><td><span class="kw">Bulkhead</span></td><td>এক dependency-র সমস্যা অন্য healthy dependency-র resource কেড়ে নেওয়া ঠেকানো</td><td>Resource pool আগে থেকে ভাগ করে রাখতে হয় — কম ব্যবহৃত pool-এ capacity বসে থাকতে পারে</td></tr>

<div class="callout mistake"><span class="tag">সবচেয়ে সাধারণ ভুল</span>

<h2 class="title">১৩. Scalability, Load Balancing ও Caching</h2>
<p class="lead">আগের বারোটা চ্যাপ্টার ছিল মূলত <b>correctness</b> নিয়ে — একাধিক node একমত হয়, একই ঘটনার ক্রম মানে, ব্যর্থতার পরও সঠিক থাকে। কিন্তু একটা distributed system বানানোর সবচেয়ে সাধারণ বাস্তব কারণ হলো <b>একটা মেশিন আর যথেষ্ট নয়</b>। এই চ্যাপ্টারে দেখব traffic বাড়ার সাথে সাথে request কীভাবে ছড়িয়ে দেওয়া হয় (load balancing), বারবার একই ডেটা আনার খরচ কীভাবে কমানো হয় (caching), আর একজন ব্যবহারকারী সিস্টেমকে কীভাবে অতিরিক্ত চাপ দিতে না পারে (rate limiting) — এই তিনটাই scale-এর বাস্তব হাতিয়ার।</p>

<h3>Vertical বনাম Horizontal Scaling</h3>
<p>ট্রাফিক বাড়লে দুইটা মৌলিক পথ আছে। <span class="kw">Vertical scaling</span> মানে একই মেশিনে আরও CPU/RAM/disk যোগ করা — কোড একদম না বদলে, single-instance অ্যাপ্লিকেশনের জন্য এটা সবচেয়ে সহজ সমাধান। কিন্তু এর দুইটা কঠিন সীমা আছে: এক, একটা মেশিনের হার্ডওয়্যার ক্ষমতার একটা <b>physical ceiling</b> আছে — একটা নির্দিষ্ট বিন্দুর পর আর বড় মেশিন কেনা যায় না, বা কিনতে গেলে cost বহুগুণ বেড়ে যায় (linear নয়, বরং exponential)। দুই, এটা এখনও একটামাত্র মেশিন — সেই মেশিন ক্র্যাশ করলে পুরো সিস্টেম বন্ধ, অর্থাৎ এটা একটা <b>single point of failure</b> থেকেই যায়।</p>
<p><span class="kw">Horizontal scaling</span> মানে একটা বড় মেশিনের বদলে অনেকগুলো ছোট মেশিন/instance যোগ করা এবং তাদের মধ্যে load ভাগ করে দেওয়া। এটাই চ্যাপ্টার ১-এ আলোচিত distributed system-এর মূল প্রেরণার সাথে সরাসরি যুক্ত — commodity hardware দিয়ে near-linear scaling পাওয়া যায় (দ্বিগুণ instance ≈ প্রায় দ্বিগুণ throughput), cost বাড়ে ধাপে ধাপে (incremental, একসাথে বিশাল বিনিয়োগ লাগে না), আর সবচেয়ে গুরুত্বপূর্ণ — এটা বিনামূল্যে <b>redundancy</b>ও দেয়: একটা instance মরে গেলেও বাকিগুলো চলতে থাকে। এই কারণেই distributed system-ভিত্তিক আর্কিটেকচার একটা নির্দিষ্ট স্কেলের পরে সবসময় horizontal-কেই প্রাধান্য দেয়।</p>

<div class="callout why"><span class="tag">কেন শুধু vertical scaling যথেষ্ট নয়</span>
বাস্তবে দুটোই ব্যবহৃত হয় — প্রতিটা instance-কে একটা যুক্তিসঙ্গত সাইজ পর্যন্ত vertical scale করা হয় (খুব ছোট মেশিনে network/OS overhead-এর অনুপাত বেশি হয়ে যায়), তারপর সেই সাইজের একাধিক instance horizontal-ভাবে যোগ করা হয়। কিন্তু single point of failure এড়াতে এবং হার্ডওয়্যার ceiling-এর ওপারে যেতে, শেষ পর্যন্ত horizontal scaling-ই একমাত্র টেকসই পথ।</div>

<h3>Load Balancing Algorithm</h3>
<p>Horizontal scaling করলে request গুলো কোন instance-এ যাবে সেই সিদ্ধান্ত নেয় <span class="kw">load balancer</span>। কোন algorithm ব্যবহার হচ্ছে তার ওপর নির্ভর করে সিস্টেমের আচরণ অনেকটাই বদলে যায়:</p>
<ul>
<li><span class="kw">Round robin</span> — প্রতিটা request পালাক্রমে পরের node-এ পাঠানো হয় (1→2→3→1→2→3...)। বাস্তবায়ন সবচেয়ে সহজ, কিন্তু এটা কোনো node আসলে কতটা ব্যস্ত সেটা জানে না — যদি কোনো request ভারী (একটা জটিল রিপোর্ট জেনারেট করা) আর কোনোটা হালকা (health check) হয়, round robin দুটোকেই সমান গুরুত্বে ভাগ করে দেয়, ফলে কোনো node ওভারলোডেড হয়ে যেতে পারে অন্যরা অলস বসে থাকা অবস্থায়।</li>
<li><span class="kw">Least connections</span> — request টা পাঠানো হয় সেই node-এ যার বর্তমানে সবচেয়ে কম active connection/request চলছে। Request-এর processing cost অসম হলে (কিছু ভারী, কিছু হালকা) এটা round robin-এর চেয়ে অনেক ভালো ভারসাম্য দেয়, কারণ এটা প্রকৃত ব্যস্ততা মেপে সিদ্ধান্ত নেয়, শুধু পালাক্রম অনুসরণ করে না।</li>
<li><span class="kw">Consistent-hashing-based routing</span> — চ্যাপ্টার ৭-এ partitioning-এর জন্য যে consistent hashing ring দেখা হয়েছিল, ঠিক একই ধারণা এখানে routing-এর জন্য পুনর্ব্যবহার হয়: request-এর key (যেমন user ID, session ID, বা cache key)-কে hash করে ring-এর ওপর বসানো হয়, আর সেই key সবসময় একই backend node-এ যায় — একে বলে <b>sticky routing</b>। এর সুবিধা হলো cache locality: যদি node-2 আগে থেকেই user-৫০০০-এর ডেটা তার লোকাল cache-এ রেখে থাকে, একই user-এর পরের request আবার node-2-তেই যাবে, ফলে cache hit rate অনেক বেড়ে যায় — অন্যথায় round robin ব্যবহার করলে একই user-এর প্রতিটা request ভিন্ন node-এ যেতে পারে, আর প্রতিটা node-এর লোকাল cache আলাদা হলে প্রতিবারই cache miss হবে।</li>
<li><span class="kw">Health-check-aware routing</span> — চ্যাপ্টার ৯-এ আলোচিত failure detection-এর সাথে সরাসরি যুক্ত: load balancer নিয়মিত প্রতিটা node-এ heartbeat/health-check request পাঠায়, আর যে node সাড়া দেয় না (বা error রিটার্ন করে) তাকে সাথে সাথে rotation থেকে বাদ দিয়ে দেয়। এটা ছাড়া উপরের যেকোনো algorithm-ই একটা মৃত/অসুস্থ node-এ request পাঠাতে থাকবে, যতক্ষণ না request timeout হয়ে ব্যর্থ হয় — health-check এই ব্যর্থ request সম্পূর্ণ এড়িয়ে যায়।</li>
</ul>

<div class="callout behind"><span class="tag">বাস্তবে যা ঘটে</span>
প্রোডাকশন লোড ব্যালেন্সার (NGINX, HAProxy, cloud LB, Kubernetes Service) সাধারণত এই algorithm গুলোর সংমিশ্রণ চালায় — যেমন least-connections + health check একসাথে, অথবা consistent hashing + health check। বিশুদ্ধ round robin আজকাল খুব কমই একা ব্যবহার হয়, কারণ health-check ছাড়া এটা production-এ নির্ভরযোগ্য নয়।</div>

<h3>Distributed Caching Pattern</h3>
<p>প্রতিটা request-এ ডেটাবেস থেকে সরাসরি পড়া ব্যয়বহুল এবং ধীর — <span class="kw">caching</span> এর সমাধান, কিন্তু cache আর database কে সমন্বয় করার একাধিক পদ্ধতি আছে, প্রতিটার আলাদা trade-off।</p>

<h4>Cache-aside (Lazy Loading)</h4>
<p><span class="kw">Cache-aside</span> pattern-এ application নিজে দায়িত্ব নেয়: প্রথমে cache-এ চেক করে, miss হলে database থেকে পড়ে এবং নিজে cache-এ লিখে রাখে।</p>
<pre>value = cache.get(key)
<span class="c">// cache miss হলে</span>
if (value == null) {
    value = database.read(key)
    cache.set(key, value, ttl: 300)   <span class="kw">// TTL সহ populate</span>
}
return value</pre>
<p>সহজ এবং cache-এ শুধু যা আসলে read হয় তাই থাকে (over-fetching নেই), কিন্তু database-এ ডেটা update হলে cache stale (পুরনো) থেকে যেতে পারে যতক্ষণ না TTL expire হয় বা explicit invalidation হয়।</p>

<h4>Read-through</h4>
<p><span class="kw">Read-through</span> pattern-এ application সরাসরি cache-কেই জিজ্ঞেস করে, database সম্পর্কে জানেই না — cache নিজে দায়িত্ব নিয়ে miss হলে database থেকে লোড করে নেয়। Application-এর কাছে পুরো ব্যাপারটা transparent — সে শুধু <code>cache.get(key)</code> কল করে, কখনো সরাসরি database touch করে না।</p>

<h4>Write-through</h4>
<p><span class="kw">Write-through</span> pattern-এ write অপারেশনে cache আর database দুটোতেই synchronous-ভাবে লেখা হয় — দুটো লেখা সম্পূর্ণ হলে তবেই write সফল ধরা হয়। ফলে cache আর database সবসময় সামঞ্জস্যপূর্ণ (consistent) থাকে, কিন্তু প্রতিটা write-এর latency বাড়ে কারণ দুটো storage-এই লেখার জন্য অপেক্ষা করতে হয়।</p>

<h4>Write-behind (Write-back)</h4>
<p><span class="kw">Write-behind</span> (বা <span class="kw">write-back</span>) pattern-এ write প্রথমে শুধু cache-এ হয় (দ্রুত), আর database-এ লেখাটা asynchronous-ভাবে পরে ব্যাচে flush করা হয়। Write latency সবচেয়ে কম এখানে, কিন্তু ঝুঁকিও সবচেয়ে বেশি: cache node database-এ flush হওয়ার আগেই ক্র্যাশ করলে সেই লেখাটা <b>স্থায়ীভাবে হারিয়ে যায়</b>, কারণ ডেটার একমাত্র কপি ছিল সেই cache-এ, আর সেটা এখনো durable storage-এ পৌঁছায়নি।</p>
