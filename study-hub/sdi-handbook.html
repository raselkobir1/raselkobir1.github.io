<h2 class="title">১. Scale from Zero to Millions — এক সার্ভার থেকে কোটি ব্যবহারকারী</h2>
<p class="lead">এই অধ্যায়ে আমরা একটা সিস্টেম <b>একজন ব্যবহারকারী</b> থেকে শুরু করে ধাপে ধাপে <b>লাখ-কোটি ব্যবহারকারী</b> পর্যন্ত বড় করব। প্রতিটা ধাপে একটাই প্রশ্ন: <i>"এখন কোন জিনিসটা প্রথমে ভাঙবে, আর তার সবচেয়ে সরল সমাধান কী?"</i> পরের সব অধ্যায়ের (Rate Limiter থেকে YouTube) ভিত্তি এই অধ্যায়ের building block-গুলো — তাই এখানে সময় দিন।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
System Design interview-তে আপনাকে কেউ "Redis বসাও" বলে দেবে না। আপনাকে নিজে বলতে হবে <b>কেন</b> Redis, <b>কখন</b> sharding, <b>কেন</b> আগে replication। এই অধ্যায়ের পুরো শিক্ষা একটাই: প্রতিটা component একটা নির্দিষ্ট <b>সমস্যার</b> উত্তর। সমস্যা না দেখিয়ে component বসানো হলো over-engineering — interviewer-রা এটাকে red flag ধরেন।</div>

<h3>১.১ ধাপ ০ — সব কিছু এক সার্ভারে</h3>
<p>প্রথম দিনে আপনার ERP-র একটা ছোট web app আছে। Web server, database, background job, file — সব একটা মেশিনে। এটা <b>খারাপ নয়</b>; শুরুতে এটাই সঠিক। প্রথমে request-এর পুরো পথটা বুঝে নিন:</p>
<div class="diagram"><pre>
 ব্যবহারকারী (Browser / Mobile App)
      │ ১. api.myerp.com লিখল
      ▼
   [ DNS ]  ── ২. IP ফেরত দেয়: 15.125.23.214
      │
      ▼ ৩. HTTP/HTTPS request সরাসরি ওই IP-তে
 ┌────────────────────────────┐
 │  একটাই সার্ভার              │
 │  Web App + DB + Cache + Job │
 └────────────────────────────┘
      │ ৪. HTML (web) অথবা JSON (mobile/API) ফেরত
      ▼
   ব্যবহারকারী
</pre></div>
<ul>
<li><b>DNS</b> সাধারণত তৃতীয় পক্ষের (Cloudflare, Route 53, GoDaddy) সেবা — আপনার সার্ভারে চলে না। কাজ: নাম → IP।</li>
<li>Client দুই ধরনের: <b>Web</b> (server-side logic + browser-এর HTML/JS) আর <b>Mobile</b> (HTTP + সাধারণত JSON)। দুটোই একই API-তে আঘাত করে।</li>
</ul>

<h3>১.২ ধাপ ১ — Web tier আর Data tier আলাদা করা</h3>
<p>ব্যবহারকারী বাড়লে প্রথম পদক্ষেপ: <b>database-কে আলাদা সার্ভারে</b> সরানো। কেন? Web server CPU-ভারী (request প্রসেসিং), database মূলত RAM ও disk I/O-ভারী। একসাথে রাখলে একটা অন্যটার resource খায়, আর আলাদা না করলে দুটোকে <b>আলাদাভাবে scale</b> করা যায় না।</p>

<h4>SQL না NoSQL — কীভাবে বাছবেন</h4>
<table>
<tr><th></th><th>Relational (SQL Server, PostgreSQL, MySQL)</th><th>Non-relational (DynamoDB, Cassandra, MongoDB, Redis, Neo4j)</th></tr>
<tr><td>ডেটার গঠন</td><td>টেবিল, row, স্থির schema</td><td>Key-value / Document / Column / Graph</td></tr>
<tr><td>Join</td><td>স্বাভাবিক ও শক্তিশালী</td><td>সাধারণত নেই — ডেটা denormalize করতে হয়</td></tr>
<tr><td>Transaction (ACID)</td><td>চমৎকার (Accounting/Payment-এ অপরিহার্য)</td><td>সীমিত বা প্রতি-document স্তরে</td></tr>
<tr><td>Scale-out</td><td>কঠিন (sharding নিজে করতে হয়)</td><td>সহজাতভাবে অনুবান্ধব</td></tr>
<tr><td>কখন বাছবেন</td><td><b>ডিফল্ট পছন্দ।</b> সম্পর্কযুক্ত ডেটা, consistency জরুরি</td><td>অতি-কম latency, বিশাল ডেটা, unstructured/semi-structured, শুধু serialize/deserialize</td></tr>
</table>
<div class="callout best"><span class="tag">Best Practice</span>
"NoSQL ফ্যাশনেবল" — এই যুক্তিতে NoSQL বাছবেন না। Interview-তে নিয়ম: <b>সম্পর্কযুক্ত ও লেনদেনভিত্তিক ডেটা → SQL দিয়ে শুরু করুন</b>; যখন সুনির্দিষ্ট কারণ (scale, latency, ডেটার আকার) দেখাতে পারবেন তখনই NoSQL আনুন — এবং সেই কারণটা মুখে বলুন।</div>

<h3>১.৩ ধাপ ২ — Vertical বনাম Horizontal Scaling</h3>
<table>
<tr><th></th><th>Vertical (Scale Up)</th><th>Horizontal (Scale Out)</th></tr>
<tr><td>কী</td><td>একই মেশিনে বেশি CPU/RAM/Disk</td><td>আরও মেশিন যোগ করা</td></tr>
<tr><td>সুবিধা</td><td>সরল — code বদলাতে হয় না</td><td>প্রায় সীমাহীন; একটা মরলেও বাকিরা চলে</td></tr>
<tr><td>অসুবিধা</td><td><b>Hardware-এর সীমা আছে</b>; দাম লাফিয়ে বাড়ে; <b>Single Point of Failure</b></td><td>জটিলতা — load balancing, state, consistency</td></tr>
<tr><td>কখন</td><td>ছোট traffic, দ্রুত সমাধান দরকার</td><td>বড় scale ও high availability</td></tr>
</table>
<p>একটা আসল তথ্য মনে রাখুন: অনেক বিখ্যাত সাইট দীর্ঘদিন <b>অল্প সার্ভারে</b> চলেছে (Stack Overflow ২০১৩-তে মাসে ১ কোটির বেশি unique visitor নিয়ে মাত্র একটা master DB-তে চলত)। মানে vertical scaling-ও অনেক দূর যায় — তাই "শুরুতেই microservice আর Kubernetes" দরকার নেই। কিন্তু <b>failover নেই</b> — এই দুর্বলতা দূর করতে হলে horizontal-এ যেতেই হবে।</p>

<h3>১.৪ ধাপ ৩ — Load Balancer</h3>
<p>দুটো সমস্যা: (১) একটাই web server মরলে সাইট বন্ধ; (২) একসাথে অনেক ব্যবহারকারী এলে সেই সার্ভার ধীর হয়ে যায়। সমাধান: সামনে <b>Load Balancer (LB)</b> — আগত traffic একাধিক web server-এ ভাগ করে।</p>
<div class="diagram"><pre>
                       ┌──────────► Web Server 1  (private IP 10.0.1.11)
 User ──► [ Load Balancer ] ──────► Web Server 2  (private IP 10.0.1.12)
        public IP          └──────► Web Server 3  (নতুন যোগ হলে অটো পায়)

 • Client শুধু LB-র public IP চেনে; web server সরাসরি পৌঁছানো যায় না → নিরাপত্তা বাড়ে
 • LB ↔ server যোগাযোগ private IP-তে (শুধু নেটওয়ার্কের ভেতরে পৌঁছানো যায়)
</pre></div>
<ul>
<li>Server 1 মরলে LB health check-এ ধরে ফেলে ও সব traffic Server 2-তে পাঠায় → <b>availability</b> বাড়ল।</li>
<li>Traffic বাড়লে শুধু pool-এ নতুন সার্ভার যোগ করুন; LB নিজে থেকে তাকে request দেওয়া শুরু করবে।</li>
</ul>
<div class="callout behind"><span class="tag">পর্দার পেছনে</span>
LB-র সামনেও একটা SPOF থাকে — LB নিজে মরলে? Production-এ তাই LB-ও জোড়ায় (active-passive বা active-active) চলে, অথবা cloud-এর managed LB (Azure Load Balancer/Application Gateway, AWS ALB) ব্যবহার হয়, যা নিজেই redundant। বিস্তারিত: <a href="scalability.html" style="color:var(--accent2)">Scalability কোর্সের Load Balancer অধ্যায়</a>।</div>

<h3>১.৫ ধাপ ৪ — Database Replication</h3>
<p>Web tier এখন ঠিক, কিন্তু database এখনও একটা — আবার SPOF, আর সব read/write তার উপর। সমাধান <b>replication</b>: একটা <b>primary</b> (বইয়ে master) যেখানে সব <b>write</b> যায়, আর একাধিক <b>replica</b> (বইয়ে slave) যারা primary থেকে ডেটার কপি নেয় ও শুধু <b>read</b> সার্ভ করে।</p>
<div class="diagram"><pre>
   Write (INSERT/UPDATE/DELETE) ──►  [ Primary DB ]
                                          │  replication (সাধারণত async)
                         ┌────────────────┼────────────────┐
                         ▼                ▼                ▼
                   [ Replica 1 ]    [ Replica 2 ]    [ Replica 3 ]
   Read (SELECT) ──────────►  ভাগ হয়ে যায় replica-গুলোতে
</pre></div>
<p><b>কেন কাজ করে:</b> বেশিরভাগ অ্যাপে read : write অনুপাত অনেক বেশি (১০:১ বা ১০০:১), তাই replica বাড়ালে read ক্ষমতা সহজে বাড়ে।</p>
<table>
<tr><th>সুবিধা</th><th>ব্যাখ্যা</th></tr>
<tr><td>Performance</td><td>Read সমান্তরালে অনেক replica-য় ভাগ হয়</td></tr>
<tr><td>Reliability</td><td>এক ডেটা-সেন্টারে দুর্যোগ হলেও অন্য জায়গায় কপি থাকে</td></tr>
<tr><td>High availability</td><td>একটা DB নামলেও অন্যটা থেকে সার্ভিস চলে</td></tr>
</table>
<h4>Failure হলে কী হয়</h4>
<ul>
<li><b>একটা replica মরলে:</b> read অন্য replica-য় যায়; একটাই থাকলে সাময়িকভাবে primary-তে; পরে নতুন replica বসে।</li>
<li><b>Primary মরলে:</b> একটা replica-কে <b>promote</b> করা হয়। বাস্তবে এটা কঠিন — কারণ replica-তে সর্বশেষ কিছু write না-ও পৌঁছে থাকতে পারে (<b>replication lag</b>)। সেই হারানো ডেটা recovery script দিয়ে মেলাতে হয়।</li>
</ul>
<div class="callout mistake"><span class="tag">সাধারণ ভুল — Replication Lag ভুলে যাওয়া</span>
ব্যবহারকারী প্রোফাইল আপডেট করল (primary-তে লেখা হলো), পরের সেকেন্ডে পেজ রিফ্রেশে replica থেকে পুরোনো ডেটা দেখল — "আমার পরিবর্তন সেভ হয়নি!"। এই সমস্যার নাম <b>read-your-writes</b> violation। সমাধান: সদ্য-লেখা ডেটার জন্য কিছুক্ষণ primary থেকে পড়া, বা ব্যবহারকারীর session-এ "last write time" রেখে সেই সময় পর্যন্ত primary-তে read পাঠানো।</div>

<h3>১.৬ ধাপ ৫ — Cache</h3>
<p>এখন প্রতিটা পেজ লোডে একাধিক DB query চলে। অনেক query-র ফলাফল বারবার একই। তাই <b>Cache</b> — memory-তে (Redis/Memcached) সাময়িকভাবে ফলাফল রাখা, যাতে পরের বার DB-তে যেতেই না হয়। Memory ও disk-এর গতির পার্থক্য প্রায় ১০০-১০,০০০ গুণ (পরের অধ্যায়ে দেখব)।</p>
<div class="diagram"><pre>
 Request ─► Web Server ─► ১. Cache-এ আছে? ──হ্যাঁ (hit)──► সরাসরি ফেরত
                               │ না (miss)
                               ▼
                        ২. DB থেকে পড়ো ─► ৩. Cache-এ রাখো (TTL সহ) ─► ফেরত
</pre></div>
<div class="callout behind"><span class="tag">পরিভাষা — "read-through" না "cache-aside"?</span>
উপরের প্রবাহে <b>অ্যাপ নিজে</b> cache চেক করে, miss হলে DB-তে যায়, তারপর নিজে cache ভরে। শিল্পে এই প্যাটার্নের প্রচলিত নাম <b>Cache-Aside (Lazy Loading)</b>। আর প্রকৃত <b>Read-Through</b> মানে cache লাইব্রেরি নিজেই miss-এ DB থেকে লোড করে — অ্যাপ শুধু cache-কে জিজ্ঞেস করে। Interview-তে প্রবাহ ঠিক বললেই চলে; নাম নিয়ে বিতর্কে গেলে "আমি cache-aside বলছি" বলে এগোন। বিস্তারিত কৌশল (write-through, write-back): <a href="systemdesign.html" style="color:var(--accent2)">System Design কোর্সের Caching অধ্যায়</a>।</div>

<h4>C# উদাহরণ — Cache-Aside (IDistributedCache + Redis)</h4>
<pre>
<span class="c">// Program.cs</span>
builder.Services.AddStackExchangeRedisCache(o =&gt; o.Configuration = "localhost:6379");

<span class="c">// Service</span>
public async Task&lt;ProductDto?&gt; GetProductAsync(int id, CancellationToken ct)
{
    var key = $"product:{id}";
    var cached = await _cache.GetStringAsync(key, ct);
    if (cached is not null)                                   <span class="c">// ১. hit</span>
        return JsonSerializer.Deserialize&lt;ProductDto&gt;(cached);

    var product = await _db.Products.FindAsync(new object[] { id }, ct);  <span class="c">// ২. miss → DB</span>
    if (product is null) return null;

    var dto = product.ToDto();
    await _cache.SetStringAsync(key, JsonSerializer.Serialize(dto),       <span class="c">// ৩. cache ভরো</span>
        new DistributedCacheEntryOptions { AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(10) }, ct);
    return dto;
}

<span class="c">// ডেটা বদলালে — stale এড়াতে cache মুছে দিন</span>
public async Task UpdateProductAsync(Product p, CancellationToken ct)
{
    await _db.SaveChangesAsync(ct);
    await _cache.RemoveAsync($"product:{p.Id}", ct);
}</pre>

<h4>Cache ব্যবহারের পাঁচটা বিবেচনা</h4>
<table>
<tr><th>বিষয়</th><th>প্রশ্ন / নিয়ম</th></tr>
<tr><td>কখন cache</td><td>ডেটা <b>ঘনঘন পড়া হয়, কদাচিৎ বদলায়</b>। Cache volatile — রিস্টার্টে সব হারায়, তাই একমাত্র কপি হিসেবে রাখবেন না।</td></tr>
<tr><td>Expiration (TTL)</td><td>খুব ছোট TTL = DB-তে বারবার যাওয়া; খুব বড় TTL = বাসি (stale) ডেটা। ডেটার ধরন দেখে ঠিক করুন।</td></tr>
<tr><td>Consistency</td><td>DB আর cache একই transaction-এ আপডেট হয় না → অমিল সম্ভব। Multi-region-এ আরও কঠিন।</td></tr>
<tr><td>Failure</td><td>একটা cache সার্ভার = SPOF। একাধিক node/AZ রাখুন; memory কিছুটা বাড়তি (over-provision) রাখুন।</td></tr>
<tr><td>Eviction</td><td>Cache ভরে গেলে কী সরবে? <b>LRU</b> (সবচেয়ে পুরোনো-ব্যবহৃত) সবচেয়ে জনপ্রিয়; LFU (কম-ব্যবহৃত), FIFO-ও আছে।</td></tr>
</table>
<div class="callout mistake"><span class="tag">সাধারণ ভুল — Cache Stampede</span>
জনপ্রিয় একটা key (ধরুন Eid-এর ticket তালিকা) এক মুহূর্তে expire হলো; হাজার request একসাথে miss করে সবাই DB-তে ছুটল → DB বসে গেল। প্রতিরোধ: TTL-এ random jitter যোগ, একই key-র জন্য একটা request-ই DB থেকে লোড করবে (lock/single-flight), বা expire হওয়ার আগেই background-এ refresh।</div>

<h3>১.৭ ধাপ ৬ — CDN</h3>
<p><b>CDN (Content Delivery Network)</b> হলো বিশ্বজুড়ে ছড়ানো সার্ভারের জাল, যারা <b>static content</b> (image, CSS, JS, video) ব্যবহারকারীর <b>সবচেয়ে কাছের</b> সার্ভার থেকে পৌঁছে দেয়। দূরত্ব যত কম, লোড তত দ্রুত — আলোর গতিরও একটা সীমা আছে, ঢাকা থেকে ক্যালিফোর্নিয়া ঘুরে আসতেই শত মিলিসেকেন্ড লাগে।</p>
<div class="diagram"><pre>
 User A ──► CDN Edge (ঢাকা/সিঙ্গাপুর) ──miss?──► Origin (আপনার সার্ভার / S3 / Blob Storage)
                 ▲  ◄── ফাইল + TTL header ──────────┘
                 │ cache করে রাখে
 User B ──► একই Edge ──► hit! (origin-এ যেতেই হলো না)
</pre></div>
<table>
<tr><th>বিবেচনা</th><th>কী করবেন</th></tr>
<tr><td>খরচ</td><td>CDN থেকে ডেটা আসা-যাওয়ায় বিল হয়। কম-ব্যবহৃত asset CDN-এ রাখা অপচয়।</td></tr>
<tr><td>Expiry</td><td>খুব ছোট = বারবার origin-এ; খুব বড় = পুরোনো ফাইল। <code>Cache-Control: max-age</code> দিয়ে নিয়ন্ত্রণ।</td></tr>
<tr><td>Fallback</td><td>CDN down হলে client origin থেকে নিতে পারবে কি? ভেবে রাখুন।</td></tr>
<tr><td>Invalidation</td><td>মেয়াদ শেষের আগে সরাতে: CDN-এর invalidate API, অথবা <b>versioning</b> — <code>app.js?v=42</code> বা <code>app.3fa9c.js</code> (hash-নামের ফাইল সবচেয়ে নির্ভরযোগ্য)।</td></tr>
</table>
<p>এই পর্যায়ে নকশা: static ফাইল web server থেকে CDN-এ সরে গেল (web server হালকা), আর DB-র চাপ cache কমাল।</p>

<h3>১.৮ ধাপ ৭ — Stateless Web Tier</h3>
<p>Web tier-কে সত্যিকারের horizontal scale করতে হলে <b>state</b> (যেমন login session, shopping cart) সার্ভারের ভেতর থেকে বের করে আনতে হবে।</p>
<table>
<tr><th></th><th>Stateful</th><th>Stateless</th></tr>
<tr><td>Session কোথায়</td><td>নির্দিষ্ট সার্ভারের memory-তে</td><td>বাইরের shared store-এ (Redis, DB)</td></tr>
<tr><td>Request routing</td><td>একই ব্যবহারকারী <b>একই সার্ভারে</b> যেতে বাধ্য (sticky session)</td><td>যেকোনো সার্ভারে যেতে পারে</td></tr>
<tr><td>সার্ভার যোগ/বাদ</td><td>কঠিন — session হারানোর ঝুঁকি</td><td>সহজ</td></tr>
<tr><td>সার্ভার crash</td><td>ওই সার্ভারের ব্যবহারকারীরা logout/ডেটা হারায়</td><td>অন্য সার্ভার সঙ্গে সঙ্গে সামলায়</td></tr>
<tr><td>Auto-scaling</td><td>জটিল</td><td>সহজ — load দেখে সার্ভার বাড়াও/কমাও</td></tr>
</table>
<div class="diagram"><pre>
 Stateful :  User A ─► Server 1 (A-র session)      Server 2-তে গেলে ⇒ "আপনি লগইন করেননি"
 Stateless:  User A ─► যেকোনো Server ─► [ Redis / Session Store ] থেকে A-র session পড়ে
</pre></div>
<p>ASP.NET Core-এ এর মানে: <code>InMemory</code> session বা in-process <code>MemoryCache</code>-এ গুরুত্বপূর্ণ state না রাখা; JWT বা <code>AddStackExchangeRedisCache</code> + distributed session ব্যবহার করা। Stateless হলে <b>Auto-scaling</b> সম্ভব — CPU/request সংখ্যা দেখে সার্ভার স্বয়ংক্রিয়ভাবে বাড়ে-কমে।</p>

<h3>১.৯ ধাপ ৮ — একাধিক Data Center</h3>
<p>ব্যবহারকারী বিভিন্ন দেশে ছড়ালে দূরের ব্যবহারকারী ধীর অভিজ্ঞতা পায়, আর একটা ডেটা-সেন্টার বন্ধ হলে পুরো সাইট বন্ধ। সমাধান: একাধিক data center ও <b>GeoDNS</b> — ব্যবহারকারীর অবস্থান দেখে DNS তাকে সবচেয়ে কাছের data center-এর IP দেয়।</p>
<div class="diagram"><pre>
 স্বাভাবিক:   ইউরোপের user ─► DC-Frankfurt        এশিয়ার user ─► DC-Singapore
 DC-Singapore বন্ধ:  সব traffic ─► DC-Frankfurt   (GeoDNS রাউটিং বদলে দেয়)
</pre></div>
<table>
<tr><th>চ্যালেঞ্জ</th><th>সমাধান-দিক</th></tr>
<tr><td>Traffic redirection</td><td>GeoDNS / global load balancer</td></tr>
<tr><td>Data synchronization</td><td>Data center-গুলোর মধ্যে ডেটা replicate (সাধারণত asynchronous, তাই eventual consistency)। failover-এ ডেটা না থাকলে ব্যবহারকারী বিভ্রান্ত হবে।</td></tr>
<tr><td>Test ও deployment</td><td>সব জায়গায় একই রকম deploy — automation অপরিহার্য</td></tr>
</table>

<h3>১.১০ ধাপ ৯ — Message Queue</h3>
<p>এখনও সব কিছু <b>synchronous</b> — অ্যাপ একটা কাজ করে উত্তরের অপেক্ষায় বসে থাকে। কিন্তু কিছু কাজ ধীর (ছবি প্রসেসিং, ইমেইল, PDF রিপোর্ট)। <b>Message Queue</b> প্রযোজক (producer) আর ভোক্তাকে (consumer) আলাদা করে: producer queue-তে কাজ রেখে সঙ্গে সঙ্গে ব্যবহারকারীকে "গ্রহণ করা হয়েছে" বলে দেয়; worker-রা নিজের গতিতে queue থেকে তুলে কাজ করে।</p>
<div class="diagram"><pre>
 Web Server (Producer) ─► [ Queue: job1, job2, job3 ... ] ─► Worker 1
        │                                                  ─► Worker 2   (queue বড় হলে worker বাড়াও,
        └─ সঙ্গে সঙ্গে ব্যবহারকারীকে 202 Accepted                          খালি থাকলে কমাও)
</pre></div>
<p><b>মূল সুবিধা:</b> (১) <b>decoupling</b> — Consumer বন্ধ থাকলেও producer কাজ জমা দিতে পারে, উল্টোটাও সত্য; (২) <b>আলাদা scaling</b> — producer ও consumer নিজ নিজ প্রয়োজনে scale হয়; (৩) <b>buffer</b> — হঠাৎ traffic spike queue শুষে নেয়। টুল: RabbitMQ, Azure Service Bus, Amazon SQS, Kafka — আমাদের <a href="rabbitmq.html" style="color:var(--accent2)">RabbitMQ</a> ও <a href="kafka-mastery-bangla.html" style="color:var(--accent2)">Kafka</a> কোর্সে বিস্তারিত আছে।</p>

<h3>১.১১ ধাপ ১০ — Logging, Metrics ও Automation</h3>
<p>ছোট সাইটে এগুলো "ভালো অভ্যাস"; বড় সিস্টেমে <b>অপরিহার্য</b> — কারণ ১০০ সার্ভারের কোনটায় কী হচ্ছে চোখে দেখে ধরা অসম্ভব।</p>
<table>
<tr><th>স্তম্ভ</th><th>কী</th><th>উদাহরণ</th></tr>
<tr><td>Logging</td><td>Error ও ঘটনার রেকর্ড, কেন্দ্রীয়ভাবে জমা</td><td>Serilog → Seq/ELK/Application Insights</td></tr>
<tr><td>Metrics</td><td>Host (CPU, RAM, disk I/O), tier-wise (DB-র গড় latency), ব্যবসায়িক (DAU, retention, revenue)</td><td>Prometheus + Grafana, Azure Monitor</td></tr>
<tr><td>Automation</td><td>CI/CD — প্রতি commit-এ build/test/deploy স্বয়ংক্রিয়</td><td>GitHub Actions, Azure DevOps</td></tr>
</table>

<h3>১.১২ ধাপ ১১ — Database Sharding</h3>
<p>ডেটা প্রতিদিন বাড়ে; replication <b>read</b> scale করে, কিন্তু <b>write</b> ও মোট ডেটার আকার তখনও একটা primary-র উপর নির্ভর করে। এই সীমা ভাঙতে <b>Sharding</b> (horizontal partitioning): ডেটা ভেঙে ছোট ছোট অংশ (shard) বানিয়ে আলাদা আলাদা DB সার্ভারে রাখা। সব shard-এর schema একই, ডেটা আলাদা।</p>
<div class="diagram"><pre>
 shard_id = hash(user_id) % 4          ( বইয়ের উদাহরণ: user_id % 4 )

 user_id=1001 → 1001 % 4 = 1 ─► Shard 1
 user_id=1002 → 1002 % 4 = 2 ─► Shard 2
 user_id=1004 → 1004 % 4 = 0 ─► Shard 0        প্রতিটা shard নিজে আবার replicate হতে পারে
</pre></div>
<p><b>Sharding key</b> বাছাই সবচেয়ে গুরুত্বপূর্ণ সিদ্ধান্ত। ভালো key: (১) ডেটা <b>সমানভাবে</b> ছড়ায়, (২) বেশিরভাগ query একটা shard-এই সীমাবদ্ধ থাকে।</p>
<table>
<tr><th>Sharding-এর নতুন সমস্যা</th><th>ব্যাখ্যা</th><th>উপশম</th></tr>
<tr><td>Resharding</td><td>shard ভরে গেলে বা অসমান বণ্টনে একটা shard আগে ভরলে ফাংশন বদলে ডেটা সরাতে হয়। <code>% 4</code> থেকে <code>% 5</code> করলে প্রায় সব ডেটার জায়গা বদলে যায়!</td><td><b>Consistent Hashing</b> (অধ্যায় ৫-এ আসছে)</td></tr>
<tr><td>Celebrity / Hotspot</td><td>একজন বিখ্যাত ব্যবহারকারীর ডেটা একটা shard-এ জমে সেটা ওভারলোড করে</td><td>hot key-র জন্য আলাদা shard, আরও ভাগ, বা cache</td></tr>
<tr><td>Join ও denormalization</td><td>Shard পেরিয়ে JOIN কঠিন/ধীর</td><td>Denormalize করে এক টেবিলেই query চালানো</td></tr>
</table>
<div class="callout best"><span class="tag">Best Practice</span>
Sharding <b>শেষ অস্ত্র</b> — এর আগে index, query tuning, cache, read replica, vertical scaling, archival সব ফুরালে তবেই। কারণ sharding-এ cross-shard transaction, জটিল reporting, resharding-এর ঝামেলা চিরস্থায়ী। কিছু কাজ (যেমন session, লগ, leaderboard) NoSQL-এ সরিয়ে relational DB-র ভার কমানো যায়।</div>

<h3>১.১৪ আট নীতির সারাংশ (মুখস্থ নয়, কারণসহ বুঝুন)</h3>
<ol>
<li><b>Web tier stateless রাখুন</b> — যাতে যেকোনো সার্ভার যেকোনো request সামলাতে পারে।</li>
<li><b>প্রতিটা স্তরে redundancy</b> — কোথাও SPOF থাকবে না।</li>
<li><b>যতটা সম্ভব cache</b> — সবচেয়ে সস্তা performance জয়।</li>
<li><b>একাধিক data center</b> — দূরত্ব ও দুর্যোগ থেকে রক্ষা।</li>
<li><b>Static asset CDN-এ</b>।</li>
<li><b>Data tier shard করুন</b> — যখন লাগবে।</li>
<li><b>Tier ভেঙে স্বাধীন service বানান</b> — যখন দল ও সিস্টেম বড় হবে।</li>
<li><b>Monitor ও automate করুন</b> — যা মাপা যায় না তা ঠিক করা যায় না।</li>
</ol>

<h3>১.১৫ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. ১০ লাখ ব্যবহারকারীর সিস্টেম আপনি কীভাবে ধাপে ধাপে বাড়াবেন?</b>
<p>এক সার্ভার → web/DB আলাদা → load balancer + একাধিক stateless web server → DB replication → cache + CDN → message queue → একাধিক data center → sharding। প্রতিটা ধাপে আগে <b>bottleneck বলুন</b> (যেমন "DB read-ই এখন সীমা"), তারপর সমাধান। কোনো ধাপ বিনা কারণে আনবেন না।</p></div>
<div class="card"><b>প্র২. Stateless কেন এত জরুরি?</b>
<p>State সার্ভারে থাকলে request নির্দিষ্ট সার্ভারে আটকে যায় (sticky session) — তখন সার্ভার বাড়ানো-কমানো, auto-scaling, crash-recovery সবই কঠিন। State shared store-এ গেলে সব সার্ভার সমান ও বদলযোগ্য।</p></div>
<div class="card"><b>প্র৩. Replication আর Sharding-এর পার্থক্য কী?</b>
<p>Replication = <b>একই ডেটার কপি</b> বহু জায়গায় → read scale ও availability। Sharding = <b>ডেটাকে ভাগ</b> করে বহু জায়গায় → write ও মোট storage scale। বড় সিস্টেমে দুটোই একসাথে: প্রতিটা shard-এর আবার primary + replica।</p></div>
<div class="card"><b>প্র৪. Primary ডাউন হলে কী হয়? কী ঝুঁকি?</b>
<p>একটা replica-কে promote করা হয়। ঝুঁকি: async replication-এ সর্বশেষ write হারিয়ে যেতে পারে; দুটো সার্ভার নিজেকে primary ভাবলে <b>split-brain</b>। এ জন্য consensus-ভিত্তিক leader election ও fencing লাগে (<a href="distsys.html" style="color:var(--accent2)">Distributed Systems কোর্স</a>)।</p></div>
<div class="card"><b>প্র৫. Cache-এ stale ডেটা এড়াবেন কীভাবে?</b>
<p>লেখার সময় cache invalidate/update, যুক্তিসংগত TTL, গুরুত্বপূর্ণ ডেটায় write-through, আর ছোট stale সহনীয় কিনা তা ব্যবসার সঙ্গে আলোচনা করে ঠিক করা। (Payment-এর balance cache করা বিপজ্জনক; পণ্য তালিকা cache করা নিরাপদ।)</p></div>
<div class="card"><b>প্র৬. Sharding key হিসেবে <code>created_at</code> বাছলে কী সমস্যা?</b>
<p>নতুন সব write সর্বশেষ shard-এ জমে → <b>hotspot</b>; পুরোনো shard অলস। ভালো key (যেমন <code>user_id</code>-এর hash) লেখা ও পড়া সমানভাবে ছড়ায়।</p></div>

<h2 class="title">২. Back-of-the-Envelope Estimation — হিসাব কষে design যাচাই</h2>
<p class="lead">Interview-তে প্রায়ই শোনা যায়: <i>"কত QPS হবে? কত storage লাগবে? কয়টা সার্ভার?"</i> এখানে নিখুঁত উত্তর কেউ চায় না — চায় আপনার <b>চিন্তার প্রক্রিয়া</b>: ধারণা (assumption) লেখা, গোল সংখ্যা ধরা, একক (unit) ঠিক রাখা, আর হিসাব থেকে design-এর সিদ্ধান্ত বের করা। এই অধ্যায় সেই দক্ষতা তৈরি করে।</p>

<h4>এই সংখ্যাগুলো থেকে পাঁচটা সিদ্ধান্ত</h4>

<li><b>Memory দ্রুত, disk ধীর</b> → hot data RAM/cache-এ রাখুন (Redis)।</li>
<li><b>Disk seek এড়ান</b> → random access বদলে sequential access; database-এ index; log-structured storage (Kafka, LSM-tree) এ কারণেই দ্রুত।</li>
<li><b>সরল compression দ্রুত</b> → CPU সস্তা, নেটওয়ার্ক/ডিস্ক দামি — compress করে পাঠানো/রাখা লাভজনক।</li>
<li><b>পাঠানোর আগে compress করুন</b> → gzip/Brotli (ASP.NET Core-এ <code>UseResponseCompression</code>)।</li>
<li><b>Data center-গুলো দূরে দূরে, মাঝের যাত্রা ধীর</b> → cross-region call যত কম, তত ভালো; একটা request-এ cross-region ১০টা call মানে ১.৫ সেকেন্ড শুধু বাতাসে!</li>
</ol>

<h3>২.৩ ভিত্তি ৩ — Availability (Nines)</h3>
<p><b>High availability</b> মানে সিস্টেম দীর্ঘ সময় ধরে চালু থাকার ক্ষমতা, শতাংশে মাপা। <b>SLA (Service Level Agreement)</b> হলো সেবাদাতা ও গ্রাহকের মধ্যে লিখিত চুক্তি — কত % uptime নিশ্চিত। বড় cloud provider-দের (AWS, Google, Azure) SLA সাধারণত <b>৯৯.৯% বা তার উপরে</b>।</p>
<table>
<tr><th>Availability %</th><th>দিনে downtime</th><th>বছরে downtime</th><th>ডাকনাম</th></tr>
<tr><td>99%</td><td>~14.4 মিনিট</td><td>~3.65 দিন</td><td>two nines</td></tr>
<tr><td>99.9%</td><td>~1.44 মিনিট</td><td>~8.8 ঘণ্টা</td><td>three nines</td></tr>
<tr><td>99.99%</td><td>~8.6 সেকেন্ড</td><td>~52.6 মিনিট</td><td>four nines</td></tr>
<tr><td>99.999%</td><td>~0.86 সেকেন্ড</td><td>~5.26 মিনিট</td><td>five nines</td></tr>
<tr><td>99.9999%</td><td>~0.086 সেকেন্ড</td><td>~31.5 সেকেন্ড</td><td>six nines</td></tr>
</table>
<div class="callout best"><span class="tag">নিজে বের করার সূত্র</span>
বছরে downtime = (১০০ − availability%) ÷ ১০০ × ৫,২৫,৬০০ মিনিট। যেমন ৯৯.৯৯% → ০.০১% × ৫,২৫,৬০০ ≈ <b>৫২.৬ মিনিট</b>। টেবিল ভুলে গেলেও এই সূত্র আপনাকে বাঁচাবে।</div>
<h4>দুটো গুরুত্বপূর্ণ বাস্তবতা</h4>
<ul>
<li><b>প্রতিটা অতিরিক্ত "৯" দশ গুণ কঠিন ও দামি।</b> ৯৯.৯% থেকে ৯৯.৯৯%-এ যেতে redundancy, automation, monitoring, on-call সবকিছু উন্নত করতে হয়।</li>
<li><b>Serial উপাদানে availability গুণ হয়।</b> যদি আপনার API (99.9%) → DB (99.9%) → তৃতীয় পক্ষের Payment Gateway (99.9%) পরপর নির্ভরশীল হয়, মোট ≈ 0.999³ ≈ <b>99.7%</b> — প্রতিটা নির্ভরতা মোটকে কমায়। উল্টো দিকে <b>parallel redundancy</b> (দুটো স্বাধীন ৯৯% সার্ভার, যে কোনো একটা চললেই হবে) মোট বাড়ায়: 1 − (0.01 × 0.01) = <b>99.99%</b>।</li>
</ul>

<h3>২.৪ হিসাবের পদ্ধতি — ৫ ধাপ</h3>
<div class="diagram"><pre>

  ৪. Bandwidth / Cache    ─► QPS × response আকার;  hot data ≈ ২০% (80/20 নিয়ম)
  ৫. Server সংখ্যা        ─► Peak QPS ÷ এক সার্ভারের ক্ষমতা  (+ redundancy)

<h3>২.৫ কাজের উদাহরণ ১ — Twitter-ধরনের QPS ও Storage</h3>
<p>(সংখ্যাগুলো শেখার জন্য ধরা, আসল Twitter-এর নয়।)</p>
<p><b>ধারণা:</b> ৩০ কোটি MAU; ৫০% প্রতিদিন সক্রিয়; প্রতিজন দিনে ২টা টুইট; ১০% টুইটে media (গড় ১ MB); ডেটা ৫ বছর রাখা হবে।</p>
<pre>
DAU           = 300M × 50%                     = 150M
Tweet QPS     = 150M × 2 ÷ 86,400              ≈ 3,500
Peak QPS      = 2 × 3,500                      ≈ 7,000

Media / দিন   = 150M × 2 × 10% × 1 MB = 30M MB = 30 TB / দিন
৫ বছরে media  = 30 TB × 365 × 5                ≈ 55 PB
</pre>
<p><b>এখান থেকে design-এর সিদ্ধান্ত:</b> ৭,০০০ write QPS একটা সার্ভারে অসম্ভব না হলেও একাধিক সার্ভার ও queue লাগবে; ৫৫ PB মানে media কোনোভাবেই DB-তে নয় — <b>object storage (S3/Blob) + CDN</b>। দেখুন, হিসাব একটা architectural সিদ্ধান্ত বলে দিল!</p>

<h3>২.৬ কাজের উদাহরণ ২ — Eid-এর বাস/ট্রেন টিকিট সিস্টেম (আমাদের নিজস্ব প্রেক্ষাপট)</h3>
<p><b>ধারণা:</b> ২০ লাখ DAU; প্রতিজন দিনে গড়ে ১০টা search ও ০.৫টা বুকিং; একটা বুকিং record ≈ ২ KB; ডেটা ৫ বছর; search response ≈ ২০ KB; Eid-এর আগে peak = গড়ের ১০ গুণ; একটা app server ≈ ৫০০ QPS সামলায়।</p>
<pre>
<span class="c">// ১. Traffic</span>
Search / দিন   = 2M × 10                      = 20M
Search QPS     = 20M ÷ 86,400                 ≈ 230
Peak search    = 230 × 10                     ≈ 2,300

Booking / দিন  = 2M × 0.5                     = 1M
Booking QPS    = 1M ÷ 86,400                  ≈ 12     (peak ≈ 120)

<span class="c">// ২. Storage (শুধু booking record)</span>
১ দিন          = 1M × 2 KB                    = 2 GB
৫ বছর          = 2 GB × 365 × 5               ≈ 3.65 TB       ← একটা DB-তেই ধরে!

<span class="c">// ৩. Bandwidth (peak, শুধু search response)</span>
2,300 × 20 KB                                  ≈ 46 MB/s  ≈ 370 Mbps

<span class="c">// ৪. Server</span>
Peak 2,300 ÷ 500                              ≈ 5 টা  → redundancy সহ ৮–১০ টা
</pre>
<div class="callout best"><span class="tag">হিসাব থেকে সিদ্ধান্ত</span>
<ul style="margin:6px 0">
<li><b>Write মাত্র ~১২০ QPS peak</b> → single primary PostgreSQL/SQL Server যথেষ্ট; শুরুতে sharding অপ্রয়োজনীয়। ৩.৬৫ TB-ও সামলানো যায়।</li>
<li><b>Search ২,৩০০ QPS</b> → এখানেই চাপ। Search ফলাফল (route + তারিখ ধরে) Redis-এ cache করুন; ঘনঘন বদলায় না, hot route কয়েকটাই (৮০/২০ নিয়ম)।</li>
<li><b>৩৭০ Mbps</b> → compression ও CDN-এর কারণ পাওয়া গেল।</li>
<li>বুকিং-এ <b>double-booking</b> এড়ানো (seat lock/idempotency) — এটা estimation নয়, correctness-এর প্রশ্ন; হিসাব দেখাল যে সেটা সামলাতে বিশাল ক্লাস্টার লাগবে না, <b>সঠিক transaction</b> লাগবে।</li>
</ul></div>

<h3>২.৭ কাজের উদাহরণ ৩ — Cache কত বড় লাগবে?</h3>
<p>৮০/২০ নিয়ম: ২০% ডেটা ৮০% request পায়। ধরুন দৈনিক ২ কোটি search; প্রতিটা response ২০ KB; আমরা সবচেয়ে জনপ্রিয় ২০% unique ফলাফল cache করব। যদি দিনে unique ফলাফল ধরা হয় ১০ লাখ:</p>
<pre>
Cache = 1M × 20% × 20 KB = 200,000 × 20 KB = 4 GB
</pre>
<p>৪ GB — একটা সাধারণ Redis instance-এ হেসে ধরে। ফলাফল: cache বিনিয়োগ ছোট, লাভ বিশাল।</p>

<h3>২.১০ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Estimation-এ নিখুঁততা কেন চাওয়া হয় না?</b>
<p>উদ্দেশ্য হলো <b>order of magnitude</b> বোঝা — ১০০ QPS নাকি ১,০০,০০০ QPS, কারণ দুটোর architecture সম্পূর্ণ আলাদা। ১০-২০% ভুলে সিদ্ধান্ত বদলায় না।</p></div>
<div class="card"><b>প্র২. দৈনিক সংখ্যা থেকে দ্রুত QPS বের করার কৌশল?</b>
<p>১ দিন ≈ ১০⁵ সেকেন্ড ধরে ভাগ। যেমন ১০ কোটি request/দিন ≈ ১,০০০ QPS। এরপর peak-এর জন্য ২-১০ গুণ।</p></div>
<div class="card"><b>প্র৩. ৯৯.৯৯% SLA-র অর্থ কী? কীভাবে অর্জন করবেন?</b>
<p>বছরে ~৫২ মিনিট downtime-র বেশি নয়। মানুষের হাতে manual recovery সম্ভব নয় — তাই redundancy (একাধিক AZ), auto-failover, health check, canary/blue-green deploy, ভালো monitoring ও on-call দরকার।</p></div>
<div class="card"><b>প্র৪. হিসাব করে দেখলেন storage ৫ PB — এরপর কী?</b>
<p>এটা প্রমাণ করে ডেটা সাধারণ DB-র জন্য নয়: object storage (S3/Blob), হট-কোল্ড tiering, compression, retention policy ও archival নিয়ে ভাবতে হবে। আর কত ডেটা সত্যিই রাখা দরকার সেই ব্যবসায়িক প্রশ্নও তোলা উচিত।</p></div>
<div class="card"><b>প্র৫. Latency সংখ্যা কেন জানা দরকার?</b>
<p>এগুলো design-এর "বাস্তবতা-যাচাই": যেমন একটা request-এ ১০টা cross-region call = ১.৫ সেকেন্ড, তাই design ভুল; আবার cache hit (~১ ms-এর কম) ও DB query (~১০+ ms) পার্থক্য cache-এর উপযোগিতা প্রমাণ করে।</p></div>

<h2 class="title">৩. System Design Interview-এর Framework — ৪ ধাপের কৌশল</h2>
<p class="lead">"Design YouTube" — এক লাইনের প্রশ্ন, যেটা বানাতে হাজার হাজার প্রকৌশলীর বছর লেগেছে। ৪৫ মিনিটে কেউ তা আশা করে না। তাহলে interview-র উদ্দেশ্য কী? এই অধ্যায়ে সেটা বুঝব, আর একটা পুনরাবৃত্তিযোগ্য <b>৪ ধাপের কাঠামো</b> শিখব যা বাকি সব অধ্যায়ে আমরা ব্যবহার করব।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
ভালো প্রযুক্তিজ্ঞান থাকার পরও অনেকে fail করেন — কারণ তারা কাঠামোহীনভাবে ঝাঁপিয়ে পড়েন, বা এক জায়গায় আটকে সময় শেষ করেন। Framework আপনার <b>নির্ভরযোগ্য মানচিত্র</b>: চাপে মাথা গুলিয়ে গেলেও আপনি জানেন এখন কোন ধাপে আছেন ও পরেরটা কী।</div>

<h3>৩.১ Interview আসলে কী যাচাই করে?</h3>
<p>এটা কুইজ নয়, <b>দুজন সহকর্মীর একটা অস্পষ্ট সমস্যা নিয়ে একসাথে সমাধান খোঁজার সিমুলেশন</b>। কোনো একক "সঠিক উত্তর" নেই; চূড়ান্ত design-এর চেয়ে <b>প্রক্রিয়া</b> বেশি গুরুত্বপূর্ণ। Interviewer সাধারণত এই সংকেতগুলো খোঁজেন:</p>
<table>
<tr><th>দক্ষতা</th><th>তিনি যা দেখেন</th></tr>
<tr><td>Requirement-এর অস্পষ্টতা মোকাবিলা</td><td>প্রশ্ন করেন কি? ধারণা (assumption) স্পষ্ট করেন কি?</td></tr>
<tr><td>Technical design</td><td>সঠিক building block বাছেন? trade-off বোঝেন?</td></tr>
<tr><td>Communication</td><td>চিন্তা জোরে বলেন? পরিষ্কারভাবে বোঝান?</td></tr>
<tr><td>Collaboration</td><td>Feedback নেন? নাকি একাই বলে যান?</td></tr>
<tr><td>Prioritization</td><td>সবচেয়ে গুরুত্বপূর্ণ অংশটা আগে ধরেন?</td></tr>
<tr><td>চাপের মধ্যে আচরণ</td><td>আটকে গেলে হাল ছাড়েন, নাকি সাহায্য চান ও এগোন?</td></tr>
</table>
<h4>যা দেখলে interviewer-রা লাল পতাকা (red flag) তোলেন</h4>
<ul>
<li><b>Over-engineering:</b> ৫০০ ব্যবহারকারীর সিস্টেমে Kafka + Kubernetes + ৫টা microservice। Design-এর "সৌন্দর্য" দেখাতে গিয়ে খরচ ও জটিলতা ভুলে যাওয়া — বাস্তবে অনেক কোম্পানি এর চড়া মূল্য দেয়।</li>
<li><b>একগুঁয়েমি / সংকীর্ণ মন:</b> একটা সমাধানে অন্ধভাবে লেগে থাকা, feedback-এ প্রতিরক্ষামূলক হয়ে যাওয়া।</li>
<li><b>না জেনে লাফ দেওয়া:</b> প্রশ্ন না করে সোজা সমাধানে ঢোকা।</li>
</ul>

<h3>৩.২ চারটা ধাপ ও সময়ের ভাগ (৪৫ মিনিটের জন্য মোটামুটি)</h3>
<div class="diagram"><pre>
 ┌──────────────────────────────────────────────────────────────────┐
 │ ধাপ ১: সমস্যা বোঝা ও Scope ঠিক করা                    ৩–১০ মিনিট │

 │ ধাপ ২: High-level design ও Interviewer-এর সম্মতি       ১০–১৫ মিনিট│
 ├──────────────────────────────────────────────────────────────────┤
 │ ধাপ ৩: Deep dive (গুরুত্বপূর্ণ component-গুলো)          ১০–২৫ মিনিট│
 ├──────────────────────────────────────────────────────────────────┤

<h3>৩.৩ ধাপ ১ — সমস্যা বুঝুন ও Design Scope ঠিক করুন</h3>
<div class="callout mistake"><span class="tag">"জিমি" হবেন না</span>
ক্লাসে যে ছাত্রটা শিক্ষকের প্রশ্ন শেষ হতে না হতেই হাত তুলে উত্তর দেয় — প্রশ্ন বুঝুক বা না বুঝুক। System design interview-তে জিমি হওয়া সবচেয়ে বড় লাল পতাকা। এখানে দ্রুত উত্তরে কোনো পুরস্কার নেই; <b>না-বুঝে দেওয়া উত্তর = ভুল সিস্টেম ডিজাইন।</b></div>
<p>থামুন, ভাবুন, প্রশ্ন করুন। Interviewer হয় সরাসরি উত্তর দেবেন, নয়তো বলবেন "তুমি ধরে নাও" — তখন ধারণাটা <b>বোর্ডে লিখে রাখুন</b>।</p>

<h4>কোন ধরনের প্রশ্ন করবেন — চেকলিস্ট</h4>
<table>
<tr><th>বিভাগ</th><th>প্রশ্নের নমুনা</th></tr>
<tr><td>Feature / Scope</td><td>ঠিক কোন কোন ফিচার বানাব? কোনটা বাদ? (MVP কী?)</td></tr>
<tr><td>Users ও Scale</td><td>কত ব্যবহারকারী (MAU/DAU)? ৩/৬/১২ মাসে কত বাড়বে? read বেশি না write?</td></tr>
<tr><td>Clients</td><td>Web, mobile, নাকি দুটোই? Third-party API দরকার?</td></tr>
<tr><td>Non-functional</td><td>Latency কত চাই? Availability (৯৯.৯%?)? Consistency নাকি availability বেশি জরুরি? Durability?</td></tr>
<tr><td>Constraint</td><td>বিদ্যমান tech stack কী? কোন সেবা কাজে লাগানো যাবে? Budget/টিম সাইজ?</td></tr>
<tr><td>Data</td><td>ডেটার ধরন (text/media)? কতদিন রাখব? কোনো regulation (GDPR, ব্যাংকিং)?</td></tr>
</table>

<h4>উদাহরণ — "News Feed ডিজাইন করুন"</h4>
<div class="card">
<p><b>Candidate:</b> Mobile app নাকি web? নাকি দুটোই?<br>
<b>Interviewer:</b> দুটোই।<br>
<b>Candidate:</b> সবচেয়ে গুরুত্বপূর্ণ ফিচার কী?<br>
<b>Interviewer:</b> পোস্ট করা এবং বন্ধুদের feed দেখা।<br>
<b>Candidate:</b> Feed কি সময়ের উল্টো ক্রমে (reverse chronological) নাকি কোনো ranking-এ? (ranking মানে ঘনিষ্ঠ বন্ধুর পোস্ট বেশি গুরুত্ব পাবে।)<br>
<b>Interviewer:</b> সরলতার জন্য reverse chronological ধরো।<br>
<b>Candidate:</b> একজনের সর্বোচ্চ কত বন্ধু?<br>
<b>Interviewer:</b> ৫,০০০।<br>
<b>Candidate:</b> Traffic কেমন?<br>
<b>Interviewer:</b> ১ কোটি DAU।<br>
<b>Candidate:</b> Feed-এ ছবি/ভিডিও থাকবে?<br>
<b>Interviewer:</b> হ্যাঁ, দুটোই।</p></div>
<p>এই ৬টা প্রশ্নেই ডিজাইনের গতিপথ বদলে গেল — ranking বাদ পড়ল (জটিলতা কমল), media যোগ হলো (CDN/object storage দরকার), বন্ধু সংখ্যা ৫০০০ (fan-out সমস্যা আসবে)।</p>
<div class="callout best"><span class="tag">ধাপ ১ শেষে আপনার হাতে থাকা উচিত</span>
(১) Functional requirement-এর ছোট তালিকা; (২) Non-functional requirement (scale, latency, availability, consistency); (৩) লিখে রাখা assumption; (৪) <b>কী বাদ</b> সেটাও — "out of scope: ranking, ads, search।"</div>

<h3>৩.৪ ধাপ ২ — High-Level Design ও সম্মতি</h3>
<p>এই ধাপের লক্ষ্য: একটা <b>প্রাথমিক নকশা</b> দাঁড় করানো এবং interviewer-কে সঙ্গে নেওয়া। তাঁকে সহকর্মী ভাবুন — অনেক ভালো interviewer কথা বলতে ও জড়িত হতে ভালোবাসেন।</p>
<ul>
<li><b>বোর্ডে বক্স-ডায়াগ্রাম আঁকুন:</b> client (mobile/web), API gateway, web server, database, cache, CDN, message queue, object storage।</li>
<li><b>প্রস্তাব দিয়ে সঙ্গে সঙ্গে feedback চান:</b> "এই কাঠামো ঠিক দিকে যাচ্ছে? কোন অংশে আগে ঢুকব?"</li>
<li><b>Back-of-the-envelope</b> করুন (অধ্যায় ২) — তবে আগে জিজ্ঞেস করুন "এখনই হিসাব করব, নাকি পরে?"। এতে design scale-এর সঙ্গে খাপ খায় কিনা যাচাই হয়।</li>
<li><b>কিছু concrete use case হাঁটুন:</b> "ব্যবহারকারী পোস্ট করলে ডেটা কোথায় যায়? বন্ধু feed খুললে কী ঘটে?" — এতে আপনার না-ভাবা edge case বেরিয়ে আসে।</li>
<li><b>API ও DB schema কি এখনই?</b> সমস্যার ধরনের উপর নির্ভর: "Design Google Search" — এখন schema খুব নিচু স্তর। "মাল্টিপ্লেয়ার পোকারের backend" — schema/API এখনই আলোচ্য। জিজ্ঞেস করে নিন।</li>
</ul>
<h4>উদাহরণ — News Feed-এর high-level (দুটো প্রবাহ)</h4>
<div class="diagram"><pre>
 প্রবাহ ১: Feed Publishing (পোস্ট করা)
   User ─► Load Balancer ─► Web Server ─► Post Service ─► [Post DB + Cache]
                                     └──► Fanout Service ─► বন্ধুদের feed cache-এ পোস্ট ঢোকাও
                                     └──► Notification Service

 প্রবাহ ২: News Feed Building (feed দেখা)
   User ─► Load Balancer ─► Web Server ─► News Feed Service ─► [Feed Cache] ─► (post, user ডেটা জুড়ে) ─► ফেরত
</pre></div>
<p>লক্ষ্য করুন: এখানে আমরা <b>কীভাবে</b> fan-out কাজ করে তা ব্যাখ্যা করছি না — শুধু বলছি দুটো প্রবাহ আছে। বিস্তারিত পরের ধাপে, এবং ১১ নং অধ্যায়ে।</p>

<h3>৩.৫ ধাপ ৩ — Design Deep Dive</h3>
<p>এখন আপনারা দুজনেই একমত: scope ঠিক, high-level খসড়া তৈরি, feedback পাওয়া গেছে। এবার <b>কোন component-এ গভীরে যাবেন</b> তা interviewer-এর সঙ্গে ঠিক করুন — প্রতিটা interview আলাদা:</p>
<table>
<tr><th>Interviewer-এর আগ্রহ</th><th>তখন কী করবেন</th></tr>
<tr><td>High-level-এই থাকতে চান</td><td>আরও use case ও ট্রেড-অফ আলোচনা, গভীরে ঢোকার জোর নয়</td></tr>
<tr><td>Senior পদ — performance</td><td>Bottleneck, resource estimation, latency ভাঙা</td></tr>
<tr><td>URL shortener</td><td>Hash/ID তৈরির ফাংশন ও collision</td></tr>
<tr><td>Chat system</td><td>Latency কমানো, online/offline presence, message ordering</td></tr>
<tr><td>Rate limiter</td><td>Algorithm বাছাই, distributed race condition</td></tr>
</table>
<div class="callout mistake"><span class="tag">সময় ব্যবস্থাপনা</span>
ছোট খুঁটিনাটিতে ডুবে যাওয়া সহজ। উদাহরণ: News Feed-এ Facebook-এর EdgeRank ranking অ্যালগরিদম নিয়ে ১০ মিনিট বলা — চমকপ্রদ, কিন্তু আপনি <b>scalable সিস্টেম ডিজাইন করতে পারেন</b> তার প্রমাণ নয়। নিজেকে জিজ্ঞেস করুন: "এই আলোচনা আমার কোন দক্ষতার সংকেত দিচ্ছে?"</div>
<div class="callout best"><span class="tag">Deep dive-এর কৌশল</span>
সবচেয়ে ঝুঁকিপূর্ণ বা স্কেল-সংবেদনশীল অংশ আগে ধরুন (যেমন <b>celebrity-র fan-out</b>, <b>seat double-booking</b>)। প্রতিটা সিদ্ধান্তে <b>বিকল্প ও ট্রেড-অফ</b> বলুন: "Push model দ্রুত read দেয় কিন্তু celebrity-র জন্য ব্যয়বহুল; তাই hybrid নেব।" Trade-off বলতে পারাই senior সংকেত।</div>

<h3>৩.৬ ধাপ ৪ — Wrap Up</h3>
<p>শেষ কয়েক মিনিটে interviewer follow-up করবেন, নয়তো আপনাকে স্বাধীনভাবে বলতে দেবেন। কাজে লাগার দিকগুলো:</p>
<ul>
<li><b>Bottleneck ও উন্নতি:</b> কখনো বলবেন না "আমার design নিখুঁত"। সবসময় কিছু উন্নতির জায়গা থাকে — এটা সমালোচনামূলক চিন্তার সুযোগ।</li>
<li><b>সংক্ষিপ্ত recap:</b> বিশেষত যদি একাধিক বিকল্প আলোচনা করে থাকেন — দীর্ঘ সেশনের পর interviewer-এর স্মৃতি তাজা করে।</li>
<li><b>Error case:</b> সার্ভার crash, নেটওয়ার্ক ছিন্ন, partial failure, retry-তে duplicate।</li>
<li><b>Operations:</b> Metrics, error log কীভাবে মনিটর করবেন? কীভাবে rollout (canary/blue-green)?</li>
<li><b>পরবর্তী scale:</b> আজ ১০ লাখ চললে ১ কোটিতে কী বদলাবে?</li>
<li><b>আরও সময় থাকলে:</b> কী কী পরিমার্জন করতাম (security, privacy, cost, কম-জরুরি ফিচার)।</li>
</ul>

<h3>৩.৭ Do ও Don't</h3>
<div class="grid2">
<div class="box"><b>✅ Do</b>
<ul>
<li>সবসময় স্পষ্টীকরণ চান — নিজের assumption-কে সত্য ধরে নেবেন না।</li>
<li>Requirement পুরো বুঝুন।</li>

<p class="lead"><b>Rate Limiter</b> নিয়ন্ত্রণ করে একজন client বা সার্ভিস নির্দিষ্ট সময়ে কতগুলো request পাঠাতে পারবে। সীমা পেরোলে বাড়তি request আটকে দেওয়া হয়। এটা framework (অধ্যায় ৩)-এর প্রথম পূর্ণ প্রয়োগ: আমরা ৪ ধাপ মেনে প্রশ্ন করব, high-level আঁকব, deep dive করব, ও wrap-up করব — সাথে C# ও Redis-এ চলনসই কোড।</p>

<h3>৪.৪ পাঁচটা Algorithm — গভীরে</h3>
<p>এখানেই অধ্যায়ের মূল সম্পদ। প্রতিটা: কীভাবে কাজ করে → সুবিধা → অসুবিধা → কখন।</p>

<h4>ক) Token Bucket</h4>
<p>একটা <b>বালতি</b> যার নির্দিষ্ট ধারণক্ষমতা (capacity)। নির্দিষ্ট হারে (refill rate) বালতিতে <b>token</b> ঢালা হয়; ভরে গেলে বাড়তিটা উপচে পড়ে (নষ্ট)। প্রতিটা request <b>১টা token খরচ</b> করে — token থাকলে request পাশ, না থাকলে বাতিল।</p>
<div class="diagram"><pre>
 Refiller: ২ token/সেকেন্ড ──►  ┌──────────┐ capacity = ৪
                                │ ● ● ● ●  │   ← ভরা; বাড়তি token উপচে যায়
                                └────┬─────┘
 Request আসে ──► token আছে? ──হ্যাঁ──► ১টা token সরাও ──► পাশ ✅
                      └─ না ──► বাতিল ❌ (429)

 টাইমলাইন (capacity=4, refill=৪/মিনিট):  শুরুতে ৪ token
   ০s: ৩টা request → ৩ token খরচ → বাকি ১
   ১৫s: +১ token (refill) → ২
   ২০s: ৩টা request → ২টা পাশ, ১টা ❌
</pre></div>
<p><b>Parameter ২টা:</b> bucket size (সর্বোচ্চ burst) ও refill rate (দীর্ঘমেয়াদি গড় হার)।</p>
<p><b>কয়টা bucket?</b> নিয়মের উপর নির্ভর: প্রতি API endpoint-এ আলাদা (যেমন ১ post/সেকেন্ড, ১৫০ বন্ধু/দিন, ৫ like/সেকেন্ড = ৩টা bucket/ব্যবহারকারী); IP-ভিত্তিক হলে প্রতি IP-র একটা; পুরো সিস্টেমে ১০,০০০ req/s সীমা হলে একটা global bucket।</p>
<table>
<tr><th>✅ সুবিধা</th><th>❌ অসুবিধা</th></tr>
<tr><td>বাস্তবায়ন সহজ; memory কম (প্রতি key মাত্র ২টা মান: token সংখ্যা ও শেষ refill সময়)।<br><b>Burst সমর্থন</b> — token জমা থাকলে স্বল্প সময়ে ফাটা traffic পাশ।</td><td>দুটো parameter (size, rate) সঠিকভাবে tune করা চ্যালেঞ্জিং।</td></tr>
</table>
<p>ব্যবহার: Amazon ও Stripe তাদের API-তে এটা ব্যবহার করে — burst সহনশীলতাই কারণ।</p>
<div class="callout behind"><span class="tag">পর্দার পেছনে — Timer ছাড়াই Refill (Lazy Refill)</span>
প্রতি সেকেন্ডে লক্ষ লক্ষ bucket-এ background timer চালানো অসম্ভব। বাস্তবে প্রতিটা bucket-এ শুধু <code>(tokens, lastRefillTime)</code> রাখা হয়। Request এলে হিসাব: <code>tokens = min(capacity, tokens + (এখন − lastRefillTime) × rate)</code>। এতে কোনো timer লাগে না, আর হিসাব request-এর সময়েই হয়।</div>

<h4>C# — In-memory Token Bucket (একটা process-এর জন্য)</h4>
<pre>
public sealed class TokenBucket
{
    private readonly double _capacity;
    private readonly double _refillPerSecond;
    private double _tokens;
    private long _lastTicks;
    private readonly object _gate = new();

    public TokenBucket(double capacity, double refillPerSecond)
    {
        _capacity = capacity;
        _refillPerSecond = refillPerSecond;
        _tokens = capacity;                          <span class="c">// শুরুতে ভরা → প্রথম burst পাশ</span>
        _lastTicks = Stopwatch.GetTimestamp();
    }

    public bool TryConsume(int cost = 1)
    {
        lock (_gate)                                  <span class="c">// check-then-act যেন atomic হয়</span>
        {
            var now = Stopwatch.GetTimestamp();
            var elapsed = (now - _lastTicks) / (double)Stopwatch.Frequency;
            _tokens = Math.Min(_capacity, _tokens + elapsed * _refillPerSecond);  <span class="c">// lazy refill</span>
            _lastTicks = now;

            if (_tokens &lt; cost) return false;
            _tokens -= cost;
            return true;
        }
    }
}</pre>

<h4>খ) Leaking Bucket</h4>
<p>Token bucket-এর মতো, কিন্তু request <b>নির্দিষ্ট স্থির হারে</b> প্রক্রিয়া হয়। সাধারণত একটা <b>FIFO queue</b> দিয়ে বানানো: request এলে queue ভরা না থাকলে ঢোকে, নইলে বাতিল; আলাদা প্রক্রিয়া নির্দিষ্ট বিরতিতে queue থেকে একটা করে তুলে চালায় (বালতির নিচের ছিদ্র দিয়ে সমান হারে পানি ঝরার মতো)।</p>
<div class="diagram"><pre>
 Request ──► queue ভরা? ──না──► [ ■ ■ ■ ■ ]  (FIFO, size = bucket size)
                │ হ্যাঁ                      │ স্থির হারে (outflow rate) একটা করে
                ▼                            ▼
             বাতিল ❌                    প্রক্রিয়া হয় ✅
</pre></div>
<p><b>Parameter:</b> bucket size (= queue size) ও outflow rate।</p>
<table>
<tr><th>✅ সুবিধা</th><th>❌ অসুবিধা</th></tr>
<tr><td>Queue-র আকার সীমিত → memory কম।<br><b>স্থির আউটপুট হার</b> — যেখানে downstream সেবা স্থির গতি চায় (যেমন তৃতীয় পক্ষ API যা প্রতি সেকেন্ডে ১০টার বেশি নেয় না)।</td><td>হঠাৎ burst-এ queue পুরোনো request-এ ভরে যায়; সেগুলো সময়মতো না চললে <b>নতুন request-ও আটকে যায়</b>।<br>দুটো parameter tune করা কঠিন।</td></tr>
</table>
<p>ব্যবহার: Shopify এই পদ্ধতি নেয়। Nginx-এর <code>limit_req</code>-ও এই ধরনের আচরণ দেখায়। বিপরীত তুলনা: <b>Token bucket = burst অনুমোদন, Leaking bucket = burst মসৃণ করে সমান হারে বের করে।</b></p>

<h4>গ) Fixed Window Counter</h4>
<p>সময়রেখাকে নির্দিষ্ট আকারের <b>জানালায়</b> ভাগ করা (যেমন প্রতি ১ মিনিট), প্রতিটার জন্য একটা counter। Request এলে counter +১; সীমায় পৌঁছালে নতুন জানালা শুরু না হওয়া পর্যন্ত বাকিগুলো বাতিল।</p>
<div class="diagram"><pre>
 সীমা = ৫ request/মিনিট          counter reset হয় প্রতি round মিনিটে

 ২:০০:০০ ───────────── ২:০১:০০ ───────────── ২:০২:০০
          ... ৫টা request ▲ ৫টা request ...
                      (২:০০:৩০ → ২:০১:৩০) এই ৬০ সেকেন্ডে ১০টা পাশ!  ← সীমার দ্বিগুণ
</pre></div>
<div class="callout mistake"><span class="tag">মূল দুর্বলতা — Boundary Burst</span>
জানালার <b>শেষে</b> ৫টা ও পরের জানালার <b>শুরুতে</b> ৫টা request এলে, মাঝের যেকোনো ৬০ সেকেন্ডে ১০টা request পাশ হয়ে যায় — মানে সীমার দ্বিগুণ। Login rate-limit-এ এটা আক্রমণকারীকে বাড়তি সুযোগ দেয়।</div>
<table>
<tr><th>✅ সুবিধা</th><th>❌ অসুবিধা</th></tr>
<tr><td>Memory-সাশ্রয়ী (প্রতি key-র একটা integer); সহজবোধ্য; কিছু ক্ষেত্রে "প্রতি মাসে ১০০০ call" ধরনের quota-র জন্য আদর্শ — জানালা শেষে quota reset হওয়াই যা চাই।</td><td>জানালার ধারে traffic spike হলে অনুমোদিত সীমার চেয়ে বেশি request ঢোকে।</td></tr>
</table>

<h4>ঘ) Sliding Window Log</h4>
<p>Fixed window-র সীমানা-সমস্যার সমাধান। প্রতিটা request-এর <b>timestamp</b> সংরক্ষণ (Redis sorted set-এ)। নতুন request এলে: (১) জানালার বাইরের পুরোনো timestamp মুছে ফেলো; (২) নতুনটা যোগ করো; (৩) log-এর আকার সীমার মধ্যে থাকলে পাশ, নইলে বাতিল।</p>
<div class="diagram"><pre>
 সীমা = ২ request/মিনিট
 ১:০০:০১ → log=[১:০০:০১]               ✅
 ১:০০:৩০ → log=[১:০০:০১, ১:০০:৩০]      ✅ (২ ≤ ২)
 ১:০০:৫০ → log=[…, ১:০০:৫০] (৩ > ২)   ❌ বাতিল (timestamp log-এ থেকেই যায়)
 ১:০১:৪০ → জানালা [১:০০:৪০, ১:০১:৪০) → ১:০০:০১ ও ১:০০:৩০ পুরোনো, মুছে যায় → log আকার ১ ✅
</pre></div>
<table>
<tr><th>✅ সুবিধা</th><th>❌ অসুবিধা</th></tr>
<tr><td><b>সবচেয়ে নির্ভুল</b> — যেকোনো rolling জানালায় সীমা কখনো ভাঙে না।</td><td><b>অনেক memory</b> — প্রতিটা request-এর timestamp রাখতে হয় (বই অনুযায়ী বাতিল হওয়া request-এরও থেকে যেতে পারে)। সীমা ১০,০০০/মিনিট হলে প্রতি user-এ ১০,০০০ entry!</td></tr>
</table>
<div class="callout best"><span class="tag">অপ্টিমাইজেশন নোট</span>
বাতিল হওয়া request-এর timestamp log-এ <b>না রাখলে</b> memory কিছুটা কমে, এবং আক্রমণকারী ক্রমাগত চেষ্টা করেই নিজের জানালা "লম্বা" রাখতে পারে না (নিচের Lua কোড তাই করে)। নির্ভুলতা চান কিন্তু memory কম? → পরের algorithm।</div>

<h4>ঙ) Sliding Window Counter (হাইব্রিড)</h4>
<p>Fixed window counter ও sliding window log-এর মিশ্রণ: আগের ও বর্তমান জানালার counter রাখুন, আর rolling জানালা কতটা আগের জানালার সঙ্গে overlap করে তার অনুপাত দিয়ে <b>ওজনযুক্ত যোগফল</b> বের করুন:</p>
<div class="diagram"><pre>
 rolling count = বর্তমান জানালার count + আগের জানালার count × (আগের জানালার overlap%)

 উদাহরণ: সীমা = ৭/মিনিট;  আগের মিনিটে ৫টা, বর্তমান মিনিটে ৩টা।
 নতুন request এল বর্তমান মিনিটের ৩০% পয়েন্টে → rolling জানালার ৭০% আগের মিনিটের উপর।

 count = ৩ + ৫ × ০.৭ = ৬.৫  → নিচে গোল করলে ৬ ≤ ৭ ✅ পাশ
 (আরও ১টা এলে সীমা ছুঁয়ে যাবে)
</pre></div>
<table>
<tr><th>✅ সুবিধা</th><th>❌ অসুবিধা</th></tr>
<tr><td>Traffic spike মসৃণ করে (আগের জানালার গড় ব্যবহার); memory-সাশ্রয়ী (প্রতি key-তে ২টা counter)।</td><td>আগের জানালার request সমানভাবে ছড়ানো ধরে নেওয়া আনুমানিক হিসাব — কড়া look-back-এর জন্য নয়। তবে Cloudflare-এর পরীক্ষায় ৪০ কোটি request-এ মাত্র ০.০০৩% ভুল সিদ্ধান্ত।</td></tr>
</table>

<h3>৪.৫ Counter কোথায় রাখবেন? — Redis</h3>
<p>Disk-ভিত্তিক DB ধীর (অধ্যায় ২-এর disk seek মনে করুন)। তাই <b>in-memory cache</b> — দ্রুত, আর সময়-ভিত্তিক expiration সমর্থন করে। Redis-এর দুটো মূল command: <code>INCR</code> (counter ১ বাড়ায়) ও <code>EXPIRE</code> (timeout, পেরোলে key নিজে মুছে যায়)।</p>
<div class="diagram"><pre>
 Client ─► Rate Limiter Middleware ─► Redis থেকে counter/bucket পড়ো
                                          │ সীমা পেরোলে → ❌ 429
                                          │ নইলে → API Server-এ পাঠাও + counter আপডেট (Redis)
</pre></div>

<h3>৪.৬ ধাপ ৩ — Deep Dive</h3>
<p>High-level নকশা এখনও তিনটা প্রশ্নের উত্তর দেয়নি: <b>Rule কোথায় থাকে? সীমা পেরোলে কী হয়? Distributed পরিবেশে কীভাবে সঠিক থাকবে?</b></p>

<h4>৪.৬.১ Rate Limiting Rules</h4>
<p>Rule কোডে hardcode নয় — <b>configuration</b> হিসেবে রাখুন (ফাইল/DB), যাতে deploy ছাড়াই বদলানো যায়। Lyft-এর open-source rate limiter যেমন করে — আমাদের নিজস্ব উদাহরণে:</p>
<pre>
<span class="c"># rules.yaml</span>
- domain: auth
  descriptors:
    - key: endpoint
      value: login
      rate_limit: { unit: minute, requests_per_unit: 5 }      <span class="c"># প্রতি IP/ব্যবহারকারী মিনিটে ৫ লগইন</span>
- domain: messaging
  descriptors:
    - key: message_type
      value: marketing
      rate_limit: { unit: day, requests_per_unit: 5 }         <span class="c"># দিনে ৫টা marketing SMS</span>
- domain: api
  descriptors:
    - key: plan
      value: free
      rate_limit: { unit: minute, requests_per_unit: 60 }
    - key: plan
      value: premium
      rate_limit: { unit: minute, requests_per_unit: 600 }
</pre>
<p>Worker বা background reload নিয়মিত disk থেকে rule এনে cache-এ রাখে; middleware cache থেকে rule পড়ে — ফলে প্রতি request-এ disk ছোঁয়া লাগে না।</p>

<h4>৪.৬.২ সীমা পেরোলে কী করবেন?</h4>
<ul>
<li><b>HTTP 429 (Too Many Requests)</b> ফেরত দিন।</li>
<li>কিছু ক্ষেত্রে request <b>বাতিল না করে queue-তে রেখে পরে চালান</b> — যেমন সিস্টেম-ওভারলোডে আটকে যাওয়া order পরে প্রক্রিয়া করা (বাতিল করলে ব্যবসা হারাবে)।</li>
</ul>
<h4>Rate-limit Header</h4>
<p>Client জানবে কীভাবে সে throttle হচ্ছে ও কতটা বাকি? HTTP response header-এ:</p>
<table>
<tr><th>Header</th><th>অর্থ</th></tr>
<tr><td><code>X-RateLimit-Limit</code></td><td>প্রতি জানালায় সর্বোচ্চ কতটা call</td></tr>
<tr><td><code>X-RateLimit-Remaining</code></td><td>এই জানালায় আর কতটা অনুমোদিত</td></tr>
<tr><td><code>Retry-After</code> (প্রামাণ্য HTTP header; বইয়ে <code>X-Ratelimit-Retry-After</code>)</td><td>আবার কখন চেষ্টা করা যাবে (সেকেন্ডে)</td></tr>
</table>
<p>429 পাঠালে <code>Retry-After</code> অবশ্যই দিন — ভালো client নিজে নিজেই অপেক্ষা করবে; অন্ধ retry-র ঝড় থামবে।</p>

<h4>৪.৬.৩ বিস্তারিত নকশা</h4>
<div class="diagram"><pre>
 ┌─────────────┐  নিয়মিত pull   ┌───────────────┐
 │ Rules (disk)│ ───────────────►│ Rules Cache   │
 └─────────────┘   (Workers)     └──────┬────────┘
                                         │ rule পড়ে
 Client ──► [ Rate Limiter Middleware ] ◄┘
                │ counter/bucket পড়ে-লেখে
                ▼
          [ Redis (counters) ]
                │
   সীমার মধ্যে ──► API Servers
   সীমা পেরোলে ──► 429 + headers ──► (ঐচ্ছিক) Message Queue-তে রাখো পরে চালাতে
</pre></div>

<h3>৪.৭ Distributed পরিবেশের দুটো কঠিন সমস্যা</h3>
<p>একটা সার্ভারে rate limiter বানানো সহজ। বহু সার্ভার ও concurrent thread-এ <b>Race Condition</b> ও <b>Synchronization</b> — আসল চ্যালেঞ্জ।</p>

<h4>সমস্যা ১: Race Condition</h4>
<p>সাধারণ লজিক: (১) Redis থেকে counter পড়ো; (২) <code>counter+1</code> সীমা ছাড়ায় কিনা দেখো; (৩) না ছাড়ালে Redis-এ বাড়িয়ে লেখো। দুটো request একসাথে এলে:</p>
<div class="diagram"><pre>
 Redis: counter = 3,  সীমা = ৪

 Thread A: পড়ল 3 ─┐
 Thread B: পড়ল 3 ─┤  (দুজনেই ৩ দেখল, কেউ অন্যের লেখা জানে না)
 Thread A: 3+1=4 ≤ 4 → লিখল 4  ✅ পাশ
 Thread B: 3+1=4 ≤ 4 → লিখল 4  ✅ পাশ     ← আসলে counter হওয়া উচিত ছিল ৫ → একটা request সীমা ভেঙে ঢুকে গেল
</pre></div>
<p><b>Lock</b> স্পষ্ট সমাধান, কিন্তু সিস্টেম ধীর করে (সবাই লাইনে)। বাস্তব সমাধান:</p>
<ul>
<li><b>Atomic অপারেশন:</b> Redis-এ <code>INCR</code> নিজেই atomic — আগে বাড়াও, <i>তারপর</i> ফলাফল (নতুন মান) সীমার সাথে মিলাও।</li>
<li><b>Lua script:</b> একাধিক ধাপ (পড়ো-হিসাব করো-লেখো) এক script-এ — Redis এটাকে অবিভাজ্যভাবে চালায়, মাঝে অন্য কমান্ড ঢোকে না।</li>
<li><b>Sorted set:</b> sliding log-এ timestamp রাখার জন্য।</li>
</ul>

<h4>C# + Redis — Lua দিয়ে Atomic Token Bucket</h4>
<pre>
<span class="c">// bucket: capacity, refill/sec, cost — সময় Redis-এর নিজের ঘড়ি থেকে (client ঘড়ির skew এড়াতে)</span>
private const string TokenBucketLua = @"
local capacity = tonumber(ARGV[1])
local rate     = tonumber(ARGV[2])
local cost     = tonumber(ARGV[3])
local t   = redis.call('TIME')
local now = tonumber(t[1]) * 1000 + math.floor(tonumber(t[2]) / 1000)   -- ms

local d = redis.call('HMGET', KEYS[1], 'tokens', 'ts')
local tokens = tonumber(d[1]); if tokens == nil then tokens = capacity end
local ts     = tonumber(d[2]); if ts == nil then ts = now end

tokens = math.min(capacity, tokens + math.max(0, now - ts) / 1000 * rate)  -- lazy refill
local allowed = 0
if tokens >= cost then tokens = tokens - cost; allowed = 1 end

redis.call('HSET', KEYS[1], 'tokens', tokens, 'ts', now)
redis.call('PEXPIRE', KEYS[1], math.ceil(capacity / rate * 1000) * 2)     -- নিষ্ক্রিয় key নিজে মুছবে
return { allowed, math.floor(tokens) }
";

public async Task&lt;(bool Allowed, int Remaining)&gt; TryAcquireAsync(string key, int capacity, double ratePerSec)
{
    var res = (RedisResult[])(await _db.ScriptEvaluateAsync(
        TokenBucketLua,
        new RedisKey[] { $"rl:{key}" },
        new RedisValue[] { capacity, ratePerSec, 1 }))!;
    return ((int)res[0] == 1, (int)res[1]);
}</pre>
<div class="callout behind"><span class="tag">Fixed Window ও Sliding Log-এর Lua (সংক্ষেপে)</span>
<pre style="margin:8px 0 0">
<span class="c">-- Fixed window: INCR + প্রথমবারে EXPIRE (দুটো আলাদা কমান্ডে crash হলে TTL-হীন key থেকে যেত — তাই script)</span>
local c = redis.call('INCR', KEYS[1])
if c == 1 then redis.call('EXPIRE', KEYS[1], ARGV[1]) end
return c

<span class="c">-- Sliding window log (sorted set): ARGV = now_ms, window_ms, limit, unique_id</span>
redis.call('ZREMRANGEBYSCORE', KEYS[1], 0, ARGV[1] - ARGV[2])   <span class="c">-- পুরোনো timestamp সাফ</span>
if redis.call('ZCARD', KEYS[1]) &lt; tonumber(ARGV[3]) then
  redis.call('ZADD', KEYS[1], ARGV[1], ARGV[4])                 <span class="c">-- শুধু অনুমোদিত request log-এ</span>
  redis.call('PEXPIRE', KEYS[1], ARGV[2])
  return 1
end
return 0</pre></div>

<h4>সমস্যা ২: Synchronization</h4>
<p>লক্ষ ব্যবহারকারী সামলাতে বহু rate limiter সার্ভার লাগে, আর web tier stateless হওয়ায় একই client-এর request একবার limiter-1-এ, একবার limiter-2-এ যেতে পারে। প্রত্যেকের নিজস্ব counter থাকলে কেউই পুরো ছবি জানে না → সীমা কার্যকর হয় না।</p>
<table>
<tr><th>সমাধান</th><th>মূল্যায়ন</th></tr>
<tr><td>Sticky session (একই client সবসময় একই limiter-এ)</td><td>❌ স্কেলযোগ্য নয়, নমনীয় নয়; limiter মরলে counter হারায়।</td></tr>
<tr><td><b>কেন্দ্রীয় data store (Redis)</b></td><td>✅ সব limiter একই counter পড়ে-লেখে। সবচেয়ে প্রচলিত। বড় scale-এ Redis Cluster (key দিয়ে shard — অধ্যায় ৫-এর consistent hashing)।</td></tr>
</table>

<h4>৪.৭.৩ Performance Optimization</h4>
<ul>
<li><b>Multi-data-center / Edge:</b> ব্যবহারকারী দূরে হলে limiter-এ যাওয়াই ধীর। Cloudflare-এর মতো edge সার্ভার (কয়েকশ লোকেশন) নিকটতম জায়গায় limit প্রয়োগ করে latency কমায়।</li>
<li><b>Eventual consistency-তে sync:</b> সব region-এর counter তাৎক্ষণিক মেলানো ব্যয়বহুল। সামান্য তফাত মেনে নিয়ে asynchronous sync — "প্রতি region নিজস্ব quota-র অংশ নেয়, পরে মেলায়"। ছোট ভুলে (সীমার কয়েক % বেশি) ব্যবসার ক্ষতি নেই।</li>
<li><b>Local + Global স্তর:</b> প্রতি সার্ভারে ছোট in-memory limiter (দ্রুত, Redis-এ না গিয়েই স্পষ্ট অপব্যবহার কাটে) + Redis-এ নির্ভুল global limiter।</li>
<li><b>Redis round-trip কমান:</b> pipeline/Lua; একটা request-এ একবারই Redis-এ যান।</li>
</ul>

<h4>৪.৭.৪ Failure Handling — Fail-open না Fail-closed?</h4>
<p>Redis ডাউন হলে rate limiter কী করবে?</p>
<table>
<tr><th>Fail-open (request ঢুকতে দাও)</th><th>Fail-closed (সব আটকাও)</th></tr>
<tr><td>সেবা চালু থাকে; কিন্তু সাময়িকভাবে সুরক্ষা নেই</td><td>সুরক্ষিত; কিন্তু limiter-এর সমস্যায় পুরো সেবা বন্ধ</td></tr>
<tr><td><b>অধিকাংশ API-র সঠিক পছন্দ</b> — "fault tolerance" requirement মেনে</td><td>কড়া নিরাপত্তা endpoint-এ (OTP পাঠানো, ব্যয়বহুল paid call)</td></tr>
</table>
<div class="callout best"><span class="tag">Best Practice</span>
Redis call-এ কড়া timeout দিন (যেমন ২০-৫০ ms), circuit breaker বসান, ব্যর্থ হলে fail-open ও local fallback limiter-এ নামুন — আর অবশ্যই alert তুলুন যাতে সুরক্ষাহীন সময় কেউ লক্ষ না করে থেকে যায়।</div>

<h4>৪.৭.৫ Monitoring</h4>
<p>Rate limiter বসিয়ে ভুলে গেলে চলবে না। মাপুন:</p>
<ul>
<li><b>Rule কার্যকর কিনা:</b> বেশি বৈধ request বাতিল হলে rule অতি-কড়া → ঢিলে করুন। ৪২৯-এর হার, কোন key/endpoint-এ বেশি।</li>
<li><b>Algorithm কার্যকর কিনা:</b> হঠাৎ traffic-এ (flash sale) limiter অকেজো হচ্ছে? → burst-সহনশীল algorithm (token bucket) বা বড় bucket।</li>
<li>Limiter-এর নিজের latency ও Redis স্বাস্থ্য।</li>
</ul>

<h3>৪.৮ .NET-এ বাস্তবায়ন — ASP.NET Core Built-in Rate Limiting</h3>
<p>.NET 7+ এ <code>Microsoft.AspNetCore.RateLimiting</code> middleware আছে — চারটা ধরন: <b>Fixed window, Sliding window, Token bucket, Concurrency</b>। (কোড লেখার সময় ভার্সনের API ডকুমেন্টেশন মিলিয়ে নেবেন।)</p>
<pre>
builder.Services.AddRateLimiter(options =&gt;
{
    options.RejectionStatusCode = StatusCodes.Status429TooManyRequests;

    <span class="c">// ১. Token bucket — সাধারণ API; user-ভিত্তিক partition (anonymous হলে IP)</span>
    options.AddPolicy("api", httpContext =&gt;
        RateLimitPartition.GetTokenBucketLimiter(
            partitionKey: httpContext.User.Identity?.Name
                          ?? httpContext.Connection.RemoteIpAddress?.ToString() ?? "anon",
            factory: _ =&gt; new TokenBucketRateLimiterOptions
            {
                TokenLimit = 20,                                   <span class="c">// bucket size (burst)</span>
                TokensPerPeriod = 10,                              <span class="c">// refill</span>
                ReplenishmentPeriod = TimeSpan.FromSeconds(1),     <span class="c">// ১০ token/সেকেন্ড</span>
                QueueLimit = 0,                                    <span class="c">// অপেক্ষা নয়, সরাসরি বাতিল</span>
                AutoReplenishment = true
            }));

    <span class="c">// ২. Sliding window — login-এর জন্য কড়া সীমা</span>
    options.AddPolicy("login", ctx =&gt;
        RateLimitPartition.GetSlidingWindowLimiter(
            ctx.Connection.RemoteIpAddress?.ToString() ?? "anon",
            _ =&gt; new SlidingWindowRateLimiterOptions
            {
                PermitLimit = 5, Window = TimeSpan.FromMinutes(1),
                SegmentsPerWindow = 6, QueueLimit = 0           <span class="c">// ১০ সেকেন্ডের ৬ খণ্ড → sliding window counter ধরনের</span>
            }));

    <span class="c">// ৩. ৪২৯ হলে Retry-After সহ বার্তা</span>
    options.OnRejected = async (context, ct) =&gt;
    {
        if (context.Lease.TryGetMetadata(MetadataName.RetryAfter, out var retryAfter))
            context.HttpContext.Response.Headers.RetryAfter =
                ((int)retryAfter.TotalSeconds).ToString(CultureInfo.InvariantCulture);

        context.HttpContext.Response.ContentType = "application/problem+json";
        await context.HttpContext.Response.WriteAsJsonAsync(new
        {
            title = "Too many requests",
            status = 429,
            detail = "অনুগ্রহ করে কিছুক্ষণ পরে আবার চেষ্টা করুন।"
        }, ct);
    };
});

var app = builder.Build();
app.UseRateLimiter();                                    <span class="c">// routing-এর পরে</span>
app.MapPost("/auth/login", LoginHandler).RequireRateLimiting("login");
app.MapGroup("/api").RequireRateLimiting("api");</pre>
<div class="callout mistake"><span class="tag">সীমাবদ্ধতা — এটা <u>per-instance</u></span>
এই built-in limiter প্রতিটা app instance-এর <b>নিজস্ব memory-তে</b> চলে। ৫টা instance-এ সীমা ১০/সেকেন্ড দিলে কার্যত মোট ৫০/সেকেন্ড ঢুকবে — ঠিক "synchronization" সমস্যা। সত্যিকারের global সীমার জন্য: (ক) gateway/edge-এ (Azure API Management-এর <code>rate-limit-by-key</code> policy, YARP, Nginx, Cloudflare); অথবা (খ) উপরের Redis Lua পদ্ধতি; অথবা (গ) ছোট instance-সংখ্যায় সীমা ÷ instance-সংখ্যা।</div>

<h3>৪.৯ ধাপ ৪ — Wrap Up: আলোচনার অতিরিক্ত বিষয়</h3>
<table>
<tr><th>বিষয়</th><th>ব্যাখ্যা</th></tr>
<tr><td>Hard বনাম Soft</td><td><b>Hard:</b> সীমা কোনোভাবেই ছাড়ানো যাবে না। <b>Soft:</b> স্বল্প সময়ের জন্য ছাড়ানো সহ্য করা হয় (যেমন sliding counter বা async sync-এর ফলে)।</td></tr>
<tr><td>বিভিন্ন স্তরে</td><td>আমরা Layer 7 (HTTP/application) নিয়ে বললাম। Layer 3 (IP)-এও সম্ভব — যেমন Linux <code>iptables</code>/firewall/WAF দিয়ে IP-ভিত্তিক সীমা; DDoS-এর জন্য edge-এ (Cloudflare, Azure Front Door)।</td></tr>
<tr><td>কোন key-তে সীমা</td><td>IP (NAT-এর পেছনে বহু ব্যবহারকারী একই IP — অন্যায্য হতে পারে), user ID, API key, tenant, device ID। প্রায়ই মিশ্রণ।</td></tr>
<tr><td>Client-এর ভদ্রতা</td><td>(১) নিজের cache ব্যবহার করে call কমান; (২) সীমা জেনে burst এড়ান; (৩) exception ধরে সুন্দরভাবে recover; (৪) retry-তে <b>exponential backoff + jitter</b>।</td></tr>
</table>
<h4>C# Client — Polly দিয়ে Backoff + Jitter ও Retry-After</h4>
<pre>
var pipeline = new ResiliencePipelineBuilder&lt;HttpResponseMessage&gt;()
    .AddRetry(new RetryStrategyOptions&lt;HttpResponseMessage&gt;
    {
        MaxRetryAttempts = 4,
        BackoffType = DelayBackoffType.Exponential,   <span class="c">// ১s, ২s, ৪s, ৮s ...</span>
        Delay = TimeSpan.FromSeconds(1),
        UseJitter = true,                             <span class="c">// ঝাঁক-বেঁধে একসাথে retry এড়াতে</span>
        ShouldHandle = new PredicateBuilder&lt;HttpResponseMessage&gt;()
            .HandleResult(r =&gt; r.StatusCode == HttpStatusCode.TooManyRequests
                            || (int)r.StatusCode &gt;= 500),
        DelayGenerator = args =&gt;                      <span class="c">// সার্ভার Retry-After দিলে সেটা মানো</span>
            args.Outcome.Result?.Headers.RetryAfter?.Delta is { } d
                ? new ValueTask&lt;TimeSpan?&gt;(d)
                : new ValueTask&lt;TimeSpan?&gt;((TimeSpan?)null)   <span class="c">// null হলে ডিফল্ট backoff</span>
    })
    .Build();</pre>
<div class="callout behind"><span class="tag">বইয়ের বাইরে — Thundering Herd</span>
১০০০ client একসাথে ৪২৯ পেয়ে ঠিক ১ সেকেন্ড পরে আবার একসাথে retry করলে সার্ভারে নতুন ঢেউ আছড়ে পড়ে। তাই backoff-এ <b>jitter</b> (র‍্যান্ডম বিলম্ব) জরুরি।</div>

<h3>৪.১০ সারসংক্ষেপ</h3>
<ol>
<li><b>অবস্থান:</b> API gateway/middleware (client-side নয়)।</li>
<li><b>Algorithm:</b> Token Bucket (ডিফল্ট), Sliding Window (কড়া/নির্ভুল), Fixed Window (quota), Leaking Bucket (স্থির আউটপুট)।</li>
<li><b>State:</b> Redis-এ; atomicity-র জন্য Lua/INCR।</li>
<li><b>Response:</b> HTTP 429 + <code>Retry-After</code> + <code>RateLimit-*</code> header।</li>
<li><b>Distributed:</b> কেন্দ্রীয় store, edge/multi-DC, eventual consistency।</li>
<li><b>Failure:</b> সাধারণত fail-open + alert।</li>
<li><b>Monitor:</b> ৪২৯ হার ও rule-এর কার্যকারিতা।</li>
</ol>

<h3>৪.১১ নিজে করুন</h3>
<ol>
<li>উপরের in-memory <code>TokenBucket</code>-এ xUnit টেস্ট লিখুন: capacity=3, rate=1/s — ৪টা request তাৎক্ষণিক (৩টা পাশ, ১টা বাতিল), ১.১ সেকেন্ড পর আবার ১টা পাশ। (<code>TimeProvider</code> ইনজেক্ট করলে <code>Thread.Sleep</code> ছাড়াই টেস্ট হয়।)</li>
<li>Sliding window counter-এর সূত্র দিয়ে একটা ছোট ফাংশন লিখুন: <code>Allow(prevCount, currCount, elapsedFractionOfCurrentWindow, limit)</code>।</li>
<li>Docker-এ Redis চালিয়ে Lua script-টা ১০০টা concurrent <code>Task</code> দিয়ে চালান; capacity ২০ হলে ঠিক ২০টা পাশ হচ্ছে কিনা দেখুন (এটাই race-condition-মুক্ত হওয়ার প্রমাণ)।</li>
<li>আপনার প্রজেক্টের login endpoint-এ <code>RequireRateLimiting</code> যোগ করে Postman-এ ৬ বার ঠেলে ৪২৯ ও <code>Retry-After</code> দেখুন।</li>
</ol>

<h3>৪.১২ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Token bucket আর leaking bucket-এর মূল পার্থক্য কী?</b>
<p>Token bucket burst <b>অনুমোদন করে</b> (জমা token থাকলে একসাথে অনেক request পাশ); leaking bucket আউটপুট <b>স্থির হারে</b> মসৃণ করে (burst জমা হয় queue-তে)। তাই burst-বান্ধব public API-তে token bucket, downstream স্থির গতি চাইলে leaking bucket।</p></div>
<div class="card"><b>প্র২. Fixed window counter-এ কী সমস্যা? সমাধান?</b>
<p>জানালার সীমানায় burst — শেষে N + শুরুতে N = ২N request অল্প সময়ে ঢুকতে পারে। সমাধান: sliding window log (নির্ভুল, memory বেশি) বা sliding window counter (প্রায়-নির্ভুল, memory কম)।</p></div>
<div class="card"><b>প্র৩. বহু সার্ভারে rate limiter কীভাবে সঠিক রাখবেন?</b>
<p>কেন্দ্রীয় Redis-এ counter; check-and-update atomic করতে Lua script বা INCR; sticky session নয় (স্কেল হয় না)। বড় scale-এ Redis cluster ও multi-region-এ eventual consistency সহ আঞ্চলিক quota।</p></div>
<div class="card"><b>প্র৪. Race condition কীভাবে হয় ও ঠেকান?</b>
<p>read-then-write দুটো আলাদা ধাপ — দুই thread একই মান পড়ে ও overwrite করে। Lock ধীর; তাই Redis-এর atomic <code>INCR</code> বা পুরো লজিক Lua script-এ (Redis single-threaded হওয়ায় script মাঝপথে বিভক্ত হয় না)।</p></div>
<div class="card"><b>প্র৫. Redis ডাউন হলে কী হবে?</b>
<p>নিরাপত্তা-গুরুত্ব অনুযায়ী সিদ্ধান্ত: সাধারণ API-তে fail-open (সেবা চলুক) + local in-memory fallback + alert; OTP/payment-এর মতো ঝুঁকিপূর্ণ endpoint-এ fail-closed। Timeout ও circuit breaker অবশ্যই।</p></div>
<div class="card"><b>প্র৬. IP-ভিত্তিক rate limit-এর ঝুঁকি কী?</b>
<p>একই অফিস/মোবাইল ক্যারিয়ার NAT-এর পেছনে বহু ব্যবহারকারী একই IP — নিরীহ ব্যবহারকারীও আটকে যায়; আবার আক্রমণকারী IP ঘুরিয়ে (botnet) পার পায়। তাই authenticated হলে user ID/API key ধরুন, IP কে শুধু anonymous ও login-এর মতো ক্ষেত্রে, ও বাড়তি সংকেত (device fingerprint, CAPTCHA) সহ।</p></div>
<div class="card"><b>প্র৭. Rate limiter-এর rule বদলাতে কি deploy লাগবে?</b>
<p>না। Rule configuration হিসেবে সংরক্ষিত (ফাইল/DB/feature-flag), worker নিয়মিত পড়ে cache রিফ্রেশ করে। এতে অপারেশনাল পরিবর্তন (যেমন flash sale-এ সীমা বাড়ানো) তাৎক্ষণিক হয়।</p></div>
<div class="card"><b>প্র৮. Throttle হওয়া request কি বাতিল না করে দেরিতে চালানো যায়?</b>
<p>যায় — queue-তে রেখে (leaking bucket-এর মতো) বা ৪২৯ + client-এর retry। কোনটা ঠিক তা ব্যবসা-নির্ভর: order/payment-এ হারানো চলবে না (queue + idempotency); search-এ বাতিল করাই ঠিক।</p></div>

<h2 class="title">৫. Design Consistent Hashing</h2>
<p class="lead">ডেটা বা request একাধিক সার্ভারে সমানভাবে ভাগ করার সবচেয়ে সহজ উপায় <code>hash(key) % N</code>। কিন্তু সার্ভার যোগ বা বাদ দিলেই এটা প্রায় সব key-র জায়গা বদলে সিস্টেম ধসিয়ে দেয়। <b>Consistent Hashing</b> সেই সমস্যার সমাধান — Cache cluster, Sharded DB, Key-Value Store, CDN সবকিছুর ভিত্তি।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
অধ্যায় ১-এ বলেছিলাম "resharding কঠিন, consistent hashing দিয়ে সমাধান" — এই সেই অধ্যায়। "Cache cluster-এ সার্ভার বাড়ালে কী হবে?", "shard কীভাবে ঠিক করবেন?" — এসব প্রশ্নের শেষ উত্তর এখানে।</div>

<h3>৫.১ সমস্যা — Rehashing</h3>
<p>৪টা cache server, নিয়ম <code>serverIndex = hash(key) % N</code>। একটা সার্ভার মরলে N = ৩ হয়, একই key এখন ভিন্ন সার্ভারে খোঁজা হয়:</p>
<div class="diagram"><pre>
 key hash = 18:   18 % 4 = 2  (s2-তে ছিল)      18 % 3 = 0  → s0-তে খোঁজে ❌ miss
 key hash = 41:   41 % 4 = 1                    41 % 3 = 2  → ❌ miss

 বড় সংখ্যায় (১২,০০০ key গুনে যাচাই করেছি):  ৪ → ৩ সার্ভারে ৭৫% key সরে, ৪ → ৫-এ ৮০%
 ফল: cache miss-এর ঝড় → সব request DB-তে → DB বসে যায়
</pre></div>
<div class="callout mistake"><span class="tag">মূল নীতি</span>
একটা সার্ভারের পরিবর্তনে শুধু <b>সেই সার্ভারের</b> ডেটাই প্রভাবিত হওয়া উচিত। Modulo এই নীতি ভাঙে, কারণ key-র জায়গা নির্ভর করে N-এর উপর।</div>

<h3>৫.২ Consistent Hashing কীভাবে কাজ করে</h3>
<p>Hash function-এর পুরো আউটপুট-পরিসর (যেমন SHA-1: ০ থেকে 2<sup>160</sup>−1)-এর দুই প্রান্ত জুড়ে একটা <b>hash ring</b> বানান। তারপর:</p>
<ol>
<li>সার্ভারের নাম/IP hash করে ring-এ বসান।</li>
<li>Key-ও একই hash function দিয়ে ring-এ বসান (<b>modulo নেই</b>)।</li>
<li><b>Lookup:</b> key-র অবস্থান থেকে clockwise হাঁটুন; প্রথম যে সার্ভার পান, key সেখানে।</li>
</ol>
<div class="diagram"><pre>
 ring = ০..৯৯ (সরলতার জন্য);  s0@10  s1@35  s2@60  s3@85;  keys: k0@20  k1@40  k2@70  k3@90

 k0@20 → s1     k1@40 → s2     k2@70 → s3     k3@90 → (৯৯ পেরিয়ে ০) s0

 সার্ভার যোগ  s4@30 : প্রভাবিত পরিসর (10, 30] — s4 থেকে anticlockwise আগের সার্ভার s0 পর্যন্ত
                      শুধু k0 s1 → s4 যায়; k1, k2, k3 নড়ে না
 সার্ভার বাদ  s1    : তার পরিসরের key (k0) clockwise পরের সার্ভার s2-তে যায়; বাকিরা অপরিবর্তিত
</pre></div>
<p>ফলাফল: সার্ভার সংখ্যা বদলালে গড়ে মাত্র <b>k/n টা key</b> সরে (k = মোট key, n = সার্ভার)।</p>

<h3>৫.৩ দুটো সমস্যা ও Virtual Node</h3>
<p>সরল ring-এ (১) সার্ভার যোগ-বিয়োগের পর partition (দুই সার্ভারের মাঝের ফাঁক) অসমান হয়, (২) সার্ভারের hash কাছাকাছি পড়লে একজন বিশাল পরিসর পায় আর কেউ প্রায় খালি থাকে। সমাধান: প্রতিটা সার্ভারকে ring-এ <b>বহুবার</b> বসানো — <code>s0_0, s0_1, s0_2 …</code> (প্রতিটার আলাদা hash)। এগুলোই <b>virtual node</b>।</p>
<div class="diagram"><pre>
 ring (ঘড়ির কাঁটায):  s0_0  s1_1  s0_2  s1_0  s1_2  s0_1 ...   ← দুই সার্ভারের অংশ মিশে ছড়ানো
 key → প্রথম virtual node (যেমন s1_1) → আসল সার্ভার s1
</pre></div>
<table>
<tr><th>✅ সুবিধা</th><th>⚠️ মূল্য</th></tr>
<tr><td>ফাঁক গড়ে সমান হয় — বইয়ের পরীক্ষায় ১০০ virtual node-এ standard deviation গড়ের ~১০%, ২০০-তে ~৫%<br>সার্ভার মরলে তার ডেটা <b>বহু সার্ভারে</b> ছড়ায়<br>শক্তিশালী সার্ভারকে বেশি virtual node দেওয়া যায় (heterogeneity)</td><td>Virtual node-এর metadata-র জন্য বাড়তি memory<br>Node যোগ/বাদে আরও বেশি সার্ভারের সঙ্গে ডেটা আদান-প্রদান<br>সংখ্যাটা tune করতে হয়</td></tr>
</table>

<h3>৫.৪ C# — Virtual Node সহ Hash Ring</h3>
<p>নিচের কোড চালিয়ে যাচাই করেছি (.NET ১০)। সাজানো <code>List&lt;ulong&gt;</code> + binary search → lookup O(log M)।</p>
<pre>
public sealed class ConsistentHashRing&lt;TNode&gt; where TNode : notnull
{
    private readonly int _virtualNodes;
    private readonly List&lt;ulong&gt; _hashes = new();               <span class="c">// সাজানো ring position</span>
    private readonly Dictionary&lt;ulong, TNode&gt; _owner = new();   <span class="c">// position → আসল node</span>
    private readonly object _gate = new();

    public ConsistentHashRing(int virtualNodes = 150) =&gt; _virtualNodes = virtualNodes;

    private static ulong Hash(string s) =&gt;
        BitConverter.ToUInt64(SHA1.HashData(Encoding.UTF8.GetBytes(s)), 0);

    public void AddNode(TNode node)
    {
        lock (_gate)
        {
            for (var i = 0; i &lt; _virtualNodes; i++)
            {
                var h = Hash($"{node}#vn{i}");
                if (_owner.TryAdd(h, node)) _hashes.Add(h);
            }
            _hashes.Sort();
        }
    }

    <span class="c">// replication-এর জন্য: clockwise হেঁটে প্রথম N টা *আলাদা* আসল node</span>
    public IReadOnlyList&lt;TNode&gt; GetNodes(string key, int count)
    {
        lock (_gate)
        {
            var idx = _hashes.BinarySearch(Hash(key));
            if (idx &lt; 0) idx = ~idx;                             <span class="c">// প্রথম position &gt;= key-র hash</span>
            var result = new List&lt;TNode&gt;(count);
            for (var step = 0; step &lt; _hashes.Count &amp;&amp; result.Count &lt; count; step++)
            {
                var node = _owner[_hashes[(idx + step) % _hashes.Count]];   <span class="c">// শেষে ring ঘুরে শুরুতে</span>
                if (!result.Contains(node)) result.Add(node);
            }
            return result;
        }
    }

    public TNode GetNode(string key) =&gt; GetNodes(key, 1)[0];
}</pre>
<p><code>RemoveNode</code> উল্টো কাজ: একই hash গুলো <code>_owner</code> ও <code>_hashes</code> থেকে সরানো। পরীক্ষা: ১০টা সার্ভার, প্রতিটায় ১৫০ virtual node, ১,০০,০০০ key — তারপর ১১তম সার্ভার যোগ:</p>
<table>
<tr><th>আমার মেশিনে চালানো ফলাফল</th><th>ফল</th><th>আদর্শ</th></tr>
<tr><td>Ring: ১০ → ১১ সার্ভারে কত key সরল</td><td><b>৮.৮%</b></td><td>১/১১ ≈ ৯.১%</td></tr>
<tr><td>Ring: একটা সার্ভার বাদ দিলে</td><td><b>৮.৪%</b></td><td>≈ ৯.১%</td></tr>
<tr><td>সরল <code>hash % N</code>: ১০ → ১১</td><td><b>৯১.০%</b></td><td>—</td></tr>
<tr><td>প্রতি সার্ভারের key (১০টা সার্ভারে)</td><td>৮,০৮৩ – ৯,৭৫৮</td><td>গড় ৯,০৯১</td></tr>
</table>
<div class="callout best"><span class="tag">Practical টিপ</span>
(১) Production-এ দ্রুত non-crypto hash (xxHash/Murmur) ভালো; SHA-1 শেখার জন্য। (২) <code>string.GetHashCode()</code> ব্যবহার করবেন না — .NET-এ process-ভেদে আলাদা, দুই সার্ভারের ring ভিন্ন হয়ে যাবে। (৩) Ring কদাচিৎ বদলায়, প্রতি request-এ পড়া হয় — immutable snapshot বা <code>ReaderWriterLockSlim</code> ভালো।</div>

<h3>৫.৫ বাস্তব ব্যবহার ও সীমাবদ্ধতা</h3>
<ul>
<li><b>ব্যবহার:</b> Amazon Dynamo ও Cassandra-র partitioning, Discord, Akamai CDN, Google Maglev load balancer, Memcached client (ketama)। <b>Redis Cluster</b> ঠিক ring নয় — ১৬,৩৮৪ নির্দিষ্ট hash slot (<code>CRC16(key) % 16384</code>) node-দের মধ্যে ভাগ; ধারণা একই: node বদলালে শুধু কিছু slot সরে (<a href="redis.html" style="color:var(--accent2)">Redis কোর্স</a>)।</li>
<li><b>Rebalance:</b> নতুন node এলে তার প্রতিটা virtual node থেকে anticlockwise আগের node পর্যন্ত ফাঁকের key সরাতে হবে। Migration background-এ ও rate-limit দিয়ে চালান।</li>
<li><b>Hot key এখনও সমস্যা:</b> consistent hashing <b>বণ্টন</b> সমান করে, কিন্তু একটাই অতি-জনপ্রিয় key (celebrity প্রোফাইল) সবসময় একই node-এ পড়ে। প্রতিকার: replica থেকে read, key ভাগ (<code>key#0..#9</code>), local cache।</li>
<li><b>বিকল্প:</b> Rendezvous (HRW) hashing ring ছাড়াই কাজ করে কিন্তু lookup O(সার্ভার সংখ্যা); Jump consistent hash সরল কিন্তু মাঝখান থেকে node বাদ দেওয়া যায় না।</li>
</ul>

<h3>৫.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. <code>hash(key) % N</code>-এ সমস্যা কী?</b>
<p>N বদলালে প্রায় সব key-র সার্ভার বদলায় (N→N−1-এ ~(N−1)/N অংশ)। Cache-এ massive miss ও DB-তে ঝড়; sharded DB-তে প্রায় সব ডেটা সরাতে হয়।</p></div>
<div class="card"><b>প্র২. Consistent hashing কীভাবে কাজ করে?</b>
<p>সার্ভার ও key দুটোই hash ring-এ বসে; key-র অবস্থান থেকে clockwise প্রথম সার্ভারই মালিক। সার্ভার যোগ-বিয়োগে শুধু পাশের ফাঁকের key সরে — গড়ে k/n।</p></div>
<div class="card"><b>প্র৩. Virtual node কেন লাগে?</b>
<p>কম সার্ভারে ring-এর ফাঁক অসমান হয়। প্রতিটা সার্ভারকে বহু জায়গায় বসালে লোড গড়ে সমান হয়, সার্ভার ব্যর্থ হলে লোড বহু সার্ভারে ছড়ায়, আর বেশি ক্ষমতার মেশিনকে বেশি node দেওয়া যায়। ট্রেড-অফ: metadata ও migration জটিলতা।</p></div>
<div class="card"><b>প্র৪. Replica কোথায় রাখবেন?</b>
<p>Key থেকে clockwise হেঁটে প্রথম N টা <b>আলাদা আসল</b> সার্ভার (virtual node বাদ দিয়ে uniqueness দেখে), সম্ভব হলে আলাদা rack/AZ-এ।</p></div>
<div class="card"><b>প্র৫. নতুন সার্ভারে কোন key সরবে কীভাবে জানবেন?</b>
<p>নতুন node-এর অবস্থান থেকে anticlockwise আগের node পর্যন্ত পরিসরের key।</p></div>
<div class="card"><b>প্র৬. একটাই hot key-র সমস্যা কি এতে মেটে?</b>
<p>না — এটা বণ্টন সমান করে, একক key সবসময় একই node-এ। সমাধান: replica read, key ভাগ করা, hot-key cache, client-side cache।</p></div>

<h2 class="title">৬. Design a Key-Value Store</h2>
<p class="lead"><b>Key-Value Store</b> হলো সবচেয়ে সরল NoSQL database: অনন্য <code>key</code>-র সঙ্গে একটা <code>value</code>, অপারেশন মাত্র <code>put(key, value)</code> ও <code>get(key)</code>। কিন্তু একে বিশাল, সবসময় চালু ও দ্রুত বানাতে distributed system-এর প্রায় সব বড় ধারণা লাগে। এই অধ্যায় Amazon Dynamo, Cassandra ও Bigtable-এর ধারণার উপর দাঁড়িয়ে।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
"node মরলে কী হবে?", "দুজন একসাথে লিখলে কে জিতবে?", "stale পড়া কখন গ্রহণযোগ্য?" — এই প্রশ্নগুলো chat, feed, notification, drive সব case study-তে ফিরে আসবে। Redis, DynamoDB, Cassandra ব্যবহারেও এগুলোই আপনার mental model।</div>

<h3>৬.১ Scope</h3>
<p>Requirement: প্রতিটা pair ১০ KB-র কম; বিশাল ডেটা; high availability ও scalability; স্বয়ংক্রিয় scaling; <b>tunable consistency</b>; কম latency। এক সার্ভারে hash table (memory) + compression + hot/cold ভাগ করে কিছুদূর যাওয়া যায়, কিন্তু বড় ডেটায় <b>distributed key-value store</b> (distributed hash table) লাগে।</p>

<h3>৬.২ CAP Theorem</h3>
<p>Consistency (সব client একই ডেটা দেখে), Availability (প্রতিটা অনুরোধ উত্তর পায়), Partition tolerance (network ছিন্ন হলেও চলে) — একসাথে দুটোই সম্ভব। Network partition অনিবার্য, তাই P বাদ যায় না; "CA" সিস্টেম বাস্তবে distributed পরিবেশে নেই। আসল প্রশ্ন: <b>partition ঘটলে C বাছবেন না A?</b></p>

<h3>৬.৩ Partition ও Replication</h3>
<p><b>Partition:</b> consistent hashing (অধ্যায় ৫) — সমান বণ্টন, ন্যূনতম ডেটা সরানো, স্বয়ংক্রিয় scaling, virtual node দিয়ে heterogeneity।<br>
<b>Replication:</b> প্রতিটা key <b>N টা</b> সার্ভারে (সাধারণত ৩) asynchronously কপি হয়: ring-এ key-র অবস্থান থেকে clockwise প্রথম N টা <b>আলাদা আসল</b> সার্ভার।</p>

</pre></div>

<h3>৬.৪ Consistency — Quorum (N, W, R)</h3>
<p><b>N</b> = replica সংখ্যা; <b>W</b> = write সফল ধরতে কতজনের ack লাগবে; <b>R</b> = read সফল ধরতে কতজনের সাড়া লাগবে। ভুল ধারণা: W = 1 মানে "একটা সার্ভারে লেখা" নয় — ডেটা N টাতেই যায়; <b>coordinator</b> (client ও node-দের মাঝের proxy) প্রথম ১টা ack পেয়েই "সফল" জানায়।</p>

                                          ├─► s1 ack ┴─► ২টা ack → "OK"
                                          └─► s2 (ধীর, পরে পৌঁছায়)
 write set ও read set-এর অন্তত ১টা node অভিন্ন (overlap) → সর্বশেষ মান পাওয়া যায়
</pre></div>

<tr><td>W + R ≤ N (যেমন W=R=1)</td><td>Strong consistency গ্যারান্টি নেই, কিন্তু সবচেয়ে দ্রুত</td></tr>

<p>W/R বাড়ালে consistency বাড়ে, কিন্তু সবচেয়ে ধীর replica-র জন্য অপেক্ষা করতে হয় — তাই এটা <b>latency বনাম consistency</b>-র নব। <b>Consistency model:</b> <b>Strong</b> (কখনো stale নয়, কিন্তু availability কমে), <b>Weak</b> (stale হতে পারে), <b>Eventual</b> (যথেষ্ট সময়ে সব replica এক হয়) — Dynamo ও Cassandra eventual বেছেছে; তাই concurrent write-এ ভিন্ন মান ঢুকতে পারে, যা মেটাতে লাগে versioning।</p>

<h3>৬.৫ Conflict Resolution — Vector Clock</h3>
<p>Server1 লিখল <code>name = johnSanFrancisco</code>, একই সময়ে Server2 লিখল <code>johnNewYork</code> — দুটোই আসল মানের উপর ভিত্তি করে, কোনটা বিজয়ী তা স্বয়ংক্রিয়ভাবে বলা যায় না। <b>Vector clock</b> প্রতিটা ডেটার সঙ্গে <code>[server:counter]</code> জোড়া রাখে; server লিখলে নিজের counter বাড়ায় (না থাকলে ১)।</p>
<table>
<tr><th>ধাপ</th><th>ঘটনা</th><th>Clock</th></tr>
<tr><td>১</td><td>D1 লিখল Sx</td><td>[Sx:1]</td></tr>
<tr><td>২</td><td>D1 পড়ে D2 লিখল Sx</td><td>[Sx:2] (D1-এর বংশধর)</td></tr>
<tr><td>৩</td><td>D2 পড়ে D3 লিখল Sy</td><td>[Sx:2, Sy:1]</td></tr>
<tr><td>৪</td><td>D2 পড়ে D4 লিখল Sz</td><td>[Sx:2, Sz:1]</td></tr>
<tr><td>৫</td><td>D3 ও D4 পড়ে conflict ধরে client মেটাল, Sx লিখল</td><td>[Sx:3, Sy:1, Sz:1]</td></tr>
</table>
<p><b>নিয়ম:</b> Y-এর প্রতিটা counter ≥ X-এর হলে X পূর্বসূরি (conflict নেই); কোনো counter একদিকে বেশি আর কোনোটা অন্যদিকে বেশি হলে conflict (siblings)।</p>
<pre>
public enum Order { Equal, Before, After, Concurrent }

public sealed class VectorClock
{
    private readonly Dictionary&lt;string, int&gt; _v = new();
    public VectorClock() { }
    private VectorClock(Dictionary&lt;string, int&gt; v) =&gt; _v = new(v);

    public VectorClock Increment(string server)          <span class="c">// লেখক server-এর counter বাড়াও</span>
    {
        var copy = new Dictionary&lt;string, int&gt;(_v);
        copy[server] = copy.GetValueOrDefault(server) + 1;
        return new VectorClock(copy);
    }

    public Order Compare(VectorClock other)
    {
        bool less = false, greater = false;
        foreach (var s in _v.Keys.Union(other._v.Keys))
        {
            var a = _v.GetValueOrDefault(s); var b = other._v.GetValueOrDefault(s);
            if (a &lt; b) less = true;
            if (a &gt; b) greater = true;
        }
        return (less, greater) switch
        {
            (false, false) =&gt; Order.Equal,
            (true, false)  =&gt; Order.Before,       <span class="c">// conflict নেই</span>
            (false, true)  =&gt; Order.After,
            _              =&gt; Order.Concurrent    <span class="c">// conflict!</span>
        };
    }
}
<span class="c">// d3 = [Sx:2, Sy:1],  d4 = [Sx:2, Sz:1]  →  d3.Compare(d4) == Order.Concurrent  (চালিয়ে যাচাই করা)</span></pre>

<tr><td>[server:counter] তালিকা বাড়তে থাকে</td><td>দৈর্ঘ্যের সীমা, পুরোনো জোড়া ফেলা (সম্পর্ক নির্ণয় কিছুটা অনিশ্চিত হয়; Dynamo পেপার বলে Amazon-এ সমস্যা হয়নি)</td></tr>
</table>
