<h2 class="title">১. Scale from Zero to Millions — এক সার্ভার থেকে কোটি ব্যবহারকারী</h2>
<p class="lead">একজন ব্যবহারকারী থেকে শুরু করে ধাপে ধাপে লাখ-কোটিতে পৌঁছানো। প্রতিটা ধাপে একটাই প্রশ্ন: <i>"এখন কী প্রথমে ভাঙবে, আর তার সরলতম সমাধান কী?"</i> পরের সব অধ্যায়ের building block এখানেই।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
প্রতিটা component একটা নির্দিষ্ট <b>সমস্যার</b> উত্তর। সমস্যা না দেখিয়ে Redis/Kafka/sharding বসানোই over-engineering — interviewer-দের প্রধান red flag।</div>

<h3>১.১ ধাপ ০–১ — এক সার্ভার, তারপর Web ও Data tier আলাদা</h3>
<div class="diagram"><pre>
 User ─► DNS (নাম → IP) ─► Web Server (App + DB + Cache সব একসাথে) ─► HTML / JSON
</pre></div>
<p>শুরুতে এটাই ঠিক। ব্যবহারকারী বাড়লে <b>DB আলাদা সার্ভারে</b> সরান — web CPU-ভারী, DB RAM/disk-ভারী; আলাদা না করলে আলাদাভাবে scale করা যায় না।</p>
<table>
<tr><th></th><th>SQL (SQL Server, PostgreSQL)</th><th>NoSQL (DynamoDB, Cassandra, MongoDB, Redis)</th></tr>
<tr><td>Join / ACID</td><td>শক্তিশালী — payment/accounting-এ অপরিহার্য</td><td>সীমিত; denormalize করতে হয়</td></tr>
<tr><td>Scale-out</td><td>কঠিন (sharding নিজে)</td><td>সহজাত</td></tr>
<tr><td>কখন</td><td><b>ডিফল্ট</b></td><td>অতি-কম latency, বিশাল/unstructured ডেটা, শুধু serialize-deserialize</td></tr>
</table>

<h3>১.২ ধাপ ২ — Vertical বনাম Horizontal, Load Balancer</h3>
<table>
<tr><th></th><th>Vertical (scale up)</th><th>Horizontal (scale out)</th></tr>
<tr><td>সুবিধা</td><td>সরল, code বদলায় না</td><td>প্রায় সীমাহীন; একটা মরলে বাকিরা চলে</td></tr>
<tr><td>অসুবিধা</td><td>hardware সীমা, দাম লাফায়, <b>SPOF</b></td><td>জটিলতা: LB, state, consistency</td></tr>
</table>
<div class="diagram"><pre>
                    ┌──► Web Server 1 (private IP)
 User ─► [ Load Balancer ] ──► Web Server 2          Server 1 মরলে health check ধরে,
        (public IP)  └──► Web Server 3 (নতুন)        সব traffic বাকিদের কাছে যায়
</pre></div>
<p>Client শুধু LB-র IP চেনে, web server সরাসরি পৌঁছানো যায় না (নিরাপত্তা)। LB-ও জোড়ায়/managed হওয়া চাই, নইলে সে-ই SPOF। বিস্তারিত: <a href="scalability.html" style="color:var(--accent2)">Scalability কোর্স</a>।</p>

<h3>১.৩ ধাপ ৩ — Database Replication</h3>
<div class="diagram"><pre>
 Write ──► [ Primary ] ──async replication──► [ Replica 1 ] [ Replica 2 ] ◄── Read (ভাগ হয়ে)
</pre></div>
<p>Read:write অনুপাত সাধারণত ১০:১ বা বেশি, তাই replica বাড়িয়ে read scale ও availability পাওয়া যায়। Replica মরলে read অন্যদের কাছে যায়; <b>primary মরলে একটা replica promote</b> হয় — কিন্তু সর্বশেষ কিছু write তাতে না-ও পৌঁছে থাকতে পারে।</p>
<div class="callout mistake"><span class="tag">সাধারণ ভুল — Replication Lag</span>
ব্যবহারকারী প্রোফাইল সেভ করল (primary), পরের read গেল replica-য় → পুরোনো ডেটা: <b>read-your-writes</b> ভঙ্গ। সমাধান: সদ্য-লেখা ডেটা কিছুক্ষণ primary থেকে পড়া, বা session-এ "last write time" রেখে সেই পর্যন্ত primary-তে পাঠানো।</div>

<h3>১.৪ ধাপ ৪ — Cache ও CDN</h3>
<div class="diagram"><pre>
 Request ─► Cache আছে? ──হ্যাঁ──► ফেরত
                │ না
                └─► DB থেকে পড়ো ─► Cache-এ রাখো (TTL সহ) ─► ফেরত      ← Cache-Aside
</pre></div>
<p>এই প্যাটার্নের প্রচলিত নাম <b>Cache-Aside</b> (বইয়ে "read-through" বলা হয়েছে; প্রকৃত read-through-এ cache নিজেই DB থেকে লোড করে)। বিস্তারিত: <a href="systemdesign.html" style="color:var(--accent2)">Caching অধ্যায়</a>।</p>
<pre>
public async Task&lt;ProductDto?&gt; GetProductAsync(int id, CancellationToken ct)
{
    var key = $"product:{id}";
    var cached = await _cache.GetStringAsync(key, ct);              <span class="c">// IDistributedCache + Redis</span>
    if (cached is not null) return JsonSerializer.Deserialize&lt;ProductDto&gt;(cached);

    var p = await _db.Products.FindAsync(new object[] { id }, ct);  <span class="c">// miss → DB</span>
    if (p is null) return null;
    var dto = p.ToDto();
    await _cache.SetStringAsync(key, JsonSerializer.Serialize(dto),
        new DistributedCacheEntryOptions { AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(10) }, ct);
    return dto;
}   <span class="c">// ডেটা বদলালে: SaveChanges-এর পর _cache.RemoveAsync(key)</span></pre>
<table>
<tr><th>বিবেচনা</th><th>নিয়ম</th></tr>
<tr><td>কখন</td><td>ঘনঘন পড়া, কদাচিৎ বদলায়; cache volatile — একমাত্র কপি নয়</td></tr>
<tr><td>TTL</td><td>খুব ছোট = DB-তে বারবার; খুব বড় = stale</td></tr>
<tr><td>Consistency</td><td>DB ও cache এক transaction-এ নয় → অমিল সম্ভব</td></tr>
<tr><td>Failure / Eviction</td><td>একাধিক node; ভরলে <b>LRU</b> (জনপ্রিয়), LFU, FIFO</td></tr>
</table>
<div class="callout mistake"><span class="tag">Cache Stampede</span>
জনপ্রিয় key (Eid-এর ticket তালিকা) এক মুহূর্তে expire → হাজার request একসাথে DB-তে → DB বসে যায়। প্রতিরোধ: TTL-এ random jitter, একই key-র জন্য একটাই request লোড করবে (single-flight/lock), expire-এর আগে background refresh।</div>
<p><b>CDN</b> — static content (image, CSS, JS, video) ব্যবহারকারীর <b>নিকটতম edge</b> থেকে পৌঁছায়; miss হলে origin (S3/Blob) থেকে এনে TTL পর্যন্ত cache করে। মনে রাখুন: খরচ (কম-ব্যবহৃত asset বাইরে রাখুন), CDN-ডাউনে origin fallback, ও invalidation — <b>ফাইলের নামে hash/version</b> (<code>app.3fa9c.js</code>) সবচেয়ে নির্ভরযোগ্য।</p>

<h3>১.৫ ধাপ ৫ — Stateless Web Tier ও Multi Data Center</h3>
<table>
<tr><th></th><th>Stateful</th><th>Stateless</th></tr>
<tr><td>Session কোথায়</td><td>সার্ভারের memory-তে</td><td>বাইরের shared store-এ (Redis/DB)</td></tr>
<tr><td>Routing</td><td>sticky session বাধ্যতামূলক</td><td>যেকোনো সার্ভারে</td></tr>
<tr><td>Crash / Auto-scale</td><td>session হারায়, scale কঠিন</td><td>সহজ — load দেখে সার্ভার বাড়ে-কমে</td></tr>
</table>
<p>ASP.NET Core-এ: in-process session/<code>MemoryCache</code>-এ গুরুত্বপূর্ণ state নয়; JWT বা Redis-ভিত্তিক distributed session। এরপর বিশ্বজুড়ে ব্যবহারকারী হলে <b>GeoDNS</b> নিকটতম data center-এ পাঠায়, একটা বন্ধ হলে সব traffic অন্যটায় যায়। চ্যালেঞ্জ: data sync (সাধারণত async → eventual consistency), সব জায়গায় একই deploy (automation)।</p>

<h3>১.৬ ধাপ ৬ — Message Queue ও Observability</h3>
<div class="diagram"><pre>
 Web (Producer) ─► [ Queue ] ─► Worker 1..N        ব্যবহারকারী সঙ্গে সঙ্গে "202 Accepted" পায়;
 queue বড় হলে worker বাড়াও, খালি থাকলে কমাও      ধীর কাজ (ছবি, PDF, email) পরে হয়
</pre></div>
<p>সুবিধা: <b>decoupling</b>, আলাদা scaling, spike শুষে নেওয়া। টুল: <a href="rabbitmq.html" style="color:var(--accent2)">RabbitMQ</a>, <a href="kafka-mastery-bangla.html" style="color:var(--accent2)">Kafka</a>, Azure Service Bus। বড় সিস্টেমে তিনটা অপরিহার্য: <b>Logging</b> (Serilog → Seq/ELK), <b>Metrics</b> (host, tier, business — Prometheus/Grafana), <b>Automation</b> (CI/CD)।</p>

<h3>১.৭ ধাপ ৭ — Database Sharding</h3>
<p>Replication read scale করে; <b>write ও মোট ডেটার আকার</b> তখনও এক primary-তে। Sharding ডেটা ভেঙে আলাদা DB-তে রাখে (schema একই, ডেটা আলাদা): <code>shard = hash(user_id) % 4</code>। <b>Sharding key</b> বাছাই সবচেয়ে বড় সিদ্ধান্ত — ডেটা সমানভাবে ছড়াবে ও বেশিরভাগ query এক shard-এ থাকবে।</p>
<table>
<tr><th>নতুন সমস্যা</th><th>উপশম</th></tr>
<tr><td><b>Resharding</b> — <code>%4</code> থেকে <code>%5</code> করলে প্রায় সব ডেটার জায়গা বদলায়</td><td><a href="#" data-go="consistenthash" style="color:var(--accent2)">Consistent Hashing (অধ্যায় ৫)</a></td></tr>
<tr><td><b>Celebrity / Hotspot</b> — এক shard ওভারলোড</td><td>hot key-র আলাদা shard, আরও ভাগ, cache</td></tr>
<tr><td><b>Cross-shard Join</b></td><td>denormalize</td></tr>
</table>
<div class="callout best"><span class="tag">Best Practice</span>
Sharding <b>শেষ অস্ত্র</b> — আগে index, query tuning, cache, replica, vertical scaling, archival। নইলে cross-shard transaction ও resharding-এর ঝামেলা চিরস্থায়ী।</div>

<h3>১.৮ চূড়ান্ত Architecture</h3>
<div class="diagram"><pre>
                   [ DNS / GeoDNS ] ──► (অন্য Data Center, একইভাবে)
                          │
   [ CDN: static ] ◄──────┤
                   [ Load Balancer ] ─► Web Servers (stateless, auto-scale)
                                              │
        ┌─────────────────────┬──────────────┴────────┐
   [ Redis Cache ]    [ Session / NoSQL ]       [ Message Queue ] ─► Workers
        │
   [ Sharded DBs — প্রতিটায় Primary + Replicas ]
   পাশে সবসময়: Logging • Metrics • Alerting • CI/CD
</pre></div>
<h4>আট নীতি</h4>
<ol>
<li>Web tier <b>stateless</b>।</li>
<li>প্রতি স্তরে <b>redundancy</b> — SPOF নয়।</li>
<li>যতটা সম্ভব <b>cache</b>।</li>
<li><b>একাধিক data center</b>।</li>
<li>Static asset <b>CDN-এ</b>।</li>
<li>Data tier <b>shard</b> — যখন লাগবে।</li>
<li>Tier ভেঙে <b>service</b> — যখন দল/সিস্টেম বড় হবে।</li>
<li><b>Monitor ও automate</b>।</li>
</ol>

<h3>১.৯ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. ১০ লাখ ব্যবহারকারীর সিস্টেম ধাপে ধাপে কীভাবে বাড়াবেন?</b>
<p>এক সার্ভার → web/DB আলাদা → LB + stateless web → replication → cache + CDN → queue → multi-DC → sharding। প্রতি ধাপে আগে <b>bottleneck বলুন</b> ("DB read-ই এখন সীমা"), তারপর সমাধান।</p></div>
<div class="card"><b>প্র২. Stateless কেন জরুরি?</b>
<p>State সার্ভারে থাকলে request নির্দিষ্ট সার্ভারে আটকায় (sticky session) — scale, crash-recovery, auto-scaling কঠিন। Shared store-এ গেলে সব সার্ভার সমান ও বদলযোগ্য।</p></div>
<div class="card"><b>প্র৩. Replication বনাম Sharding?</b>
<p>Replication = <b>একই ডেটার কপি</b> → read scale ও availability। Sharding = <b>ডেটা ভাগ</b> → write ও storage scale। বড় সিস্টেমে দুটোই: প্রতি shard-এ primary + replica।</p></div>
<div class="card"><b>প্র৪. Primary ডাউন হলে ঝুঁকি কী?</b>
<p>Replica promote হয়; ঝুঁকি: async-এ শেষ write হারানো, আর দুই সার্ভার নিজেকে primary ভাবলে <b>split-brain</b> — তাই leader election ও fencing (<a href="distsys.html" style="color:var(--accent2)">Distributed Systems</a>)।</p></div>
<div class="card"><b>প্র৫. Cache-এ stale ডেটা এড়াবেন কীভাবে?</b>
<p>লেখায় invalidate, যুক্তিসঙ্গত TTL, গুরুত্বপূর্ণ ডেটায় write-through; কতটা stale সহনীয় তা ব্যবসার সাথে ঠিক করুন (balance cache বিপজ্জনক, পণ্য-তালিকা নিরাপদ)।</p></div>
<div class="card"><b>প্র৬. Sharding key <code>created_at</code> হলে কী সমস্যা?</b>
<p>সব নতুন write সর্বশেষ shard-এ জমে → <b>hotspot</b>, পুরোনো shard অলস। <code>user_id</code>-এর hash লেখা-পড়া সমানভাবে ছড়ায়।</p></div>
</template>

<h3>২.১ ভিত্তি — ২-এর ঘাত ও বাংলা/আন্তর্জাতিক গণনা</h3>

<p>হিসাবে প্রতি ধাপে <b>১,০০০ গুণ</b> ধরুন। ১ ASCII অক্ষর = ১ byte।</p>

<h3>২.২ ভিত্তি — Latency সংখ্যা</h3>
<p>সঠিক মান হার্ডওয়্যারভেদে বদলায়; শেখার বিষয় <b>অনুপাত</b>।</p>
<table>
<tr><th>অপারেশন</th><th>সময়</th></tr>
<tr><td>L1 cache / L2 cache</td><td>0.5 ns / 7 ns</td></tr>
<tr><td>Mutex lock, RAM reference</td><td>100 ns</td></tr>
<tr><td>১ KB compress</td><td>10 µs</td></tr>
<tr><td>১ Gbps-এ ২ KB পাঠানো</td><td>20 µs</td></tr>
<tr><td>RAM থেকে ১ MB sequential পড়া</td><td>250 µs</td></tr>
<tr><td>একই data center-এ round trip</td><td>500 µs</td></tr>
<tr><td>Disk seek / নেটওয়ার্ক থেকে ১ MB পড়া</td><td>10 ms</td></tr>
<tr><td>Disk থেকে ১ MB sequential পড়া</td><td>30 ms</td></tr>
<tr><td>প্যাকেট CA → নেদারল্যান্ডস → CA</td><td>150 ms</td></tr>
</table>
<p>(1 ms = 1,000 µs = 1,000,000 ns।) অনুভূতি: RAM-এ পৌঁছানো ১ সেকেন্ড ধরলে disk seek ~১ লাখ সেকেন্ড (≈ ১ দিনের বেশি)। এ থেকে পাঁচ সিদ্ধান্ত:</p>
<ol>
<li>Memory দ্রুত, disk ধীর → hot data cache-এ।</li>
<li>Disk seek এড়ান → sequential access, index; Kafka/LSM-tree তাই দ্রুত।</li>
<li>Compression সস্তা → পাঠানো/রাখার আগে compress (<code>UseResponseCompression</code>)।</li>
<li>Cross-region call ধীর → একটা request-এ ১০টা cross-region call = ১.৫ সেকেন্ড, design ভুল।</li>
<li>Cache hit (&lt;১ ms) বনাম DB query (১০+ ms) — cache-এর উপযোগিতার প্রমাণ।</li>
</ol>

<tr><th>%</th><th>দিনে downtime</th><th>বছরে downtime</th></tr>
<tr><td>99%</td><td>~14.4 মিনিট</td><td>~3.65 দিন</td></tr>
<tr><td>99.9%</td><td>~1.44 মিনিট</td><td>~8.8 ঘণ্টা</td></tr>
<tr><td>99.99%</td><td>~8.6 সেকেন্ড</td><td>~52.6 মিনিট</td></tr>
<tr><td>99.999%</td><td>~0.86 সেকেন্ড</td><td>~5.26 মিনিট</td></tr>
</table>
<p>সূত্র: বছরে downtime = (১০০ − %) ÷ ১০০ × ৫,২৫,৬০০ মিনিট। <b>SLA</b> = গ্রাহককে দেওয়া লিখিত uptime-চুক্তি; বড় cloud provider-রা সাধারণত ≥ ৯৯.৯%।</p>
<ul>
<li><b>Serial নির্ভরতায় গুণ হয়:</b> API (99.9%) → DB (99.9%) → Payment Gateway (99.9%) ≈ 0.999³ ≈ <b>99.7%</b> — প্রতিটা নির্ভরতা মোট কমায়।</li>
<li><b>Parallel redundancy বাড়ায়:</b> দুটো স্বাধীন ৯৯% সার্ভার = 1 − 0.01² = <b>99.99%</b>।</li>
<li>প্রতিটা অতিরিক্ত "৯" দশ গুণ কঠিন ও দামি।</li>
</ul>

<h3>২.৫ উদাহরণ ১ — Twitter-ধরনের QPS ও Storage</h3>
<p>(শেখার জন্য ধরা সংখ্যা।) ৩০ কোটি MAU; ৫০% দৈনিক সক্রিয়; দিনে ২ টুইট; ১০% টুইটে media (১ MB); ৫ বছর রাখা।</p>
<pre>
DAU          = 300M × 50%               = 150M
Tweet QPS    = 150M × 2 ÷ 86,400        ≈ 3,500      Peak ≈ 7,000
Media/দিন    = 150M × 2 × 10% × 1 MB    = 30 TB
৫ বছরে       = 30 TB × 365 × 5          ≈ 55 PB
</pre>
<p><b>সিদ্ধান্ত:</b> ৭,০০০ write QPS-এ একাধিক সার্ভার ও queue; ৫৫ PB মানে media DB-তে নয় — <b>object storage (S3/Blob) + CDN</b>।</p>

<h3>২.৬ উদাহরণ ২ — Eid-এর বাস/ট্রেন টিকিট সিস্টেম</h3>
<p>২০ লাখ DAU; দিনে ১০ search ও ০.৫ বুকিং; বুকিং record ২ KB; ৫ বছর; search response ২০ KB; Eid-peak = ১০×; এক সার্ভার ৫০০ QPS।</p>
<pre>
Search QPS   = 2M × 10 ÷ 86,400   ≈ 230      Peak ≈ 2,300
Booking QPS  = 2M × 0.5 ÷ 86,400  ≈ 12       Peak ≈ 120
Storage      = 1M × 2 KB = 2 GB/দিন → × 365 × 5 ≈ 3.65 TB
Bandwidth    = 2,300 × 20 KB      ≈ 46 MB/s ≈ 370 Mbps
Server       = 2,300 ÷ 500        ≈ 5 → redundancy সহ ৮–১০
</pre>
<div class="callout best"><span class="tag">হিসাব থেকে সিদ্ধান্ত</span>
<ul style="margin:6px 0">
<li><b>Write peak ~১২০ QPS, ৩.৬৫ TB</b> → single primary DB যথেষ্ট; sharding এখনই নয়।</li>
<li><b>Search ২,৩০০ QPS</b> → route+তারিখ ধরে Redis cache; hot route কয়েকটাই (80/20)। Cache ≈ ১০ লাখ unique × ২০% × ২০ KB ≈ <b>৪ GB</b> — এক Redis-এ ধরে।</li>
<li><b>৩৭০ Mbps</b> → compression ও CDN।</li>
<li>Double-booking এড়ানো scale নয়, <b>correctness</b>-এর প্রশ্ন: সঠিক transaction/seat lock লাগবে, বিশাল cluster নয়।</li>
</ul></div>

</ol>
<details style="margin:12px 0"><summary style="cursor:pointer;color:var(--accent2)">উত্তর দেখুন</summary>
<pre>
১. ৪০০M মেসেজ/দিন → ≈ ৪,০০০ QPS (peak ≈ ৮,০০০); ৪০ GB/দিন → × ৩৬৫ × ২ ≈ ২৯ TB
২. write ≈ ১,০০০ QPS; read ≈ ১০,০০০ QPS; ৩.৬৫ × ১০¹¹ record × ১০০ B ≈ ৩৬.৫ TB
   (৫০০ B/record ধরলে ≈ ১৮২ TB)
৩. ০.৯৯৯৫ × ০.৯৯৯ × ০.৯৯৯ ≈ ৯৯.৭৫% → ০.২৫% × ৫,২৫,৬০০ ≈ ১,৩০০ মিনিট ≈ ২২ ঘণ্টা/বছর
</pre></details>

<h3>২.৯ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Estimation-এ নিখুঁততা কেন চাওয়া হয় না?</b>
<p>উদ্দেশ্য <b>order of magnitude</b> — ১০০ QPS নাকি ১,০০,০০০ QPS, কারণ architecture সম্পূর্ণ আলাদা। ১০-২০% ভুলে সিদ্ধান্ত বদলায় না।</p></div>
<div class="card"><b>প্র২. দৈনিক সংখ্যা থেকে দ্রুত QPS?</b>
<p>১ দিন ≈ ১০⁵ সেকেন্ড ধরে ভাগ; যেমন ১০ কোটি/দিন ≈ ১,০০০ QPS। তারপর peak-এর জন্য ২–১০ গুণ।</p></div>
<div class="card"><b>প্র৩. ৯৯.৯৯% SLA মানে কী, কীভাবে অর্জন?</b>
<p>বছরে ~৫২ মিনিটের বেশি downtime নয়। Manual recovery সম্ভব নয় — একাধিক AZ, auto-failover, health check, canary/blue-green deploy, monitoring ও on-call লাগে।</p></div>
<div class="card"><b>প্র৪. হিসাবে storage ৫ PB এলে?</b>
<p>সাধারণ DB-র জন্য নয়: object storage, hot-cold tiering, compression, retention/archival। কত ডেটা সত্যিই রাখা দরকার সেই ব্যবসায়িক প্রশ্নও তুলুন।</p></div>
<div class="card"><b>প্র৫. Latency সংখ্যা কেন জানা দরকার?</b>
<p>এগুলো design-এর বাস্তবতা-যাচাই: cross-region call-এর যোগফল, cache hit বনাম DB query — দেখে বোঝা যায় কোন design টিকবে।</p></div>
</template>

<h2 class="title">৪. Design a Rate Limiter</h2>
<p class="lead"><b>Rate Limiter</b> নিয়ন্ত্রণ করে একজন client নির্দিষ্ট সময়ে কতগুলো request পাঠাতে পারবে; সীমা পেরোলে বাড়তি request আটকে দেওয়া হয়। এটা অধ্যায় ৩-এর ৪ ধাপের প্রথম পূর্ণ প্রয়োগ।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
ছোট সিস্টেম, কিন্তু একসাথে ধরা পড়ে: algorithm বাছাই, distributed state, race condition, failure handling ও trade-off। বাস্তবেও login brute-force, OTP/SMS বোমাবাজি, paid তৃতীয় পক্ষ API-র খরচ — সবখানে লাগে।</div>

<h3>৪.১ কেন Rate Limit?</h3>
<table>
<tr><th>কারণ</th><th>ERP/Payment উদাহরণ</th></tr>
<tr><td>DoS ও অপব্যবহার ঠেকানো</td><td>Login endpoint-এ password-guessing বন্ধ</td></tr>
<tr><td>খরচ কমানো</td><td>Per-call বিলের বাইরের API (SMS gateway, credit check)</td></tr>
<tr><td>সার্ভার ওভারলোড রোধ</td><td>ভারী রিপোর্ট export, bot traffic</td></tr>
<tr><td>ন্যায্যতা</td><td>Multi-tenant SaaS-এ একজন tenant যেন সবার resource না খায়</td></tr>
</table>

<h3>৪.২ ধাপ ১ — Requirement</h3>
<p>প্রশ্ন করে ঠিক হলো: <b>server-side API limiter</b>, নমনীয় rule (IP / user ID / endpoint), বিপুল scale, distributed পরিবেশ, throttle হলে ব্যবহারকারীকে জানাতে হবে।</p>
<table>
<tr><th>ধরন</th><th>Requirement</th></tr>
<tr><td>Functional</td><td>অতিরিক্ত request নির্ভুলভাবে আটকানো; নমনীয় rule; স্পষ্ট বার্তা (HTTP 429)</td></tr>
<tr><td>Non-functional</td><td>কম latency (কয়েক ms-এর বেশি নয়), কম memory, distributed, <b>fault tolerant</b> (limiter-এর cache মরলেও সিস্টেম না থামে)</td></tr>
</table>

<h3>৪.৩ ধাপ ২ — Rate Limiter কোথায় বসবে?</h3>
<table>
<tr><th>অবস্থান</th><th>মন্তব্য</th></tr>
<tr><td>Client-side</td><td>❌ client জাল করা যায়, নিয়ন্ত্রণ নেই</td></tr>
<tr><td>Server-side (app code)</td><td>✅ algorithm-এ পূর্ণ নিয়ন্ত্রণ; কিন্তু প্রতি service-এ পুনরাবৃত্ত কোড</td></tr>
<tr><td>Middleware / API Gateway</td><td>✅ <b>সাধারণত সেরা</b> — এক জায়গায় সব API-র জন্য (Azure API Management, Kong, Nginx, YARP)</td></tr>
</table>
<div class="diagram"><pre>
 Client ──► [ Rate Limiter Middleware ] ──► API Servers
                 │ সীমার মধ্যে → এগোয়
                 └ সীমা পেরোলে → HTTP 429 Too Many Requests
 (সীমা ২/সেকেন্ড, ৩টা request এলে: ✅ ✅ ❌)
</pre></div>
<p>Microservice ও gateway আগে থেকেই থাকলে gateway-তে যোগ করুন; ইঞ্জিনিয়ারিং সময় কম হলে managed gateway; algorithm-এ পূর্ণ নিয়ন্ত্রণ চাইলে নিজে বানান।</p>

<h3>৪.৪ পাঁচটা Algorithm</h3>

<h4>ক) Token Bucket</h4>
<p>বালতির নির্দিষ্ট capacity; নির্দিষ্ট হারে token ঢালা হয় (ভরলে উপচে যায়)। প্রতিটা request ১টা token খরচ করে — token না থাকলে বাতিল। Parameter: <b>bucket size</b> (সর্বোচ্চ burst) ও <b>refill rate</b>।</p>
<div class="diagram"><pre>
 Refiller: ২ token/s ──► [ ● ● ● ● ] capacity = ৪
 Request ──► token আছে? ─হ্যাঁ─► ১টা সরাও, পাশ ✅
                  └─ না ──► বাতিল ❌ (429)
</pre></div>
<p><b>✅</b> সহজ, memory কম (প্রতি key-তে ২টা মান), burst সমর্থন। <b>❌</b> দুটো parameter tune করা কঠিন। ব্যবহার: Amazon, Stripe।</p>
<div class="callout behind"><span class="tag">Lazy Refill</span>
লক্ষ bucket-এ timer চলে না। শুধু <code>(tokens, lastRefillTime)</code> রাখা হয়; request-এর সময় হিসাব: <code>tokens = min(capacity, tokens + (now − last) × rate)</code>।</div>

<h4>খ) Leaking Bucket</h4>
<p>FIFO queue; request এলে queue ভরা না থাকলে ঢোকে, নইলে বাতিল। আলাদা প্রক্রিয়া <b>স্থির হারে</b> queue থেকে তুলে চালায়। Parameter: queue size ও outflow rate।</p>
<p><b>✅</b> স্থির আউটপুট হার (downstream-এর জন্য), memory কম। <b>❌</b> burst-এ queue পুরোনো request-এ ভরে নতুনগুলো আটকে যায়। ব্যবহার: Shopify, Nginx <code>limit_req</code>। মনে রাখুন: <b>Token bucket burst অনুমোদন করে, Leaking bucket burst মসৃণ করে।</b></p>

<h4>গ) Fixed Window Counter</h4>
<p>সময়কে নির্দিষ্ট জানালায় ভাগ, প্রতিটার একটা counter; সীমায় পৌঁছালে নতুন জানালা পর্যন্ত বাতিল।</p>
<div class="callout mistake"><span class="tag">Boundary Burst</span>
সীমা ৫/মিনিট: ২:০০:৩০–২:০১:০০-এ ৫টা, ২:০১:০০–২:০১:৩০-এ আরও ৫টা → মাঝের ৬০ সেকেন্ডে ১০টা পাশ, সীমার দ্বিগুণ।</div>
<p><b>✅</b> সবচেয়ে সহজ ও সস্তা; দৈনিক/মাসিক quota-র জন্য উপযুক্ত। <b>❌</b> জানালার ধারে spike।</p>

<h4>ঘ) Sliding Window Log</h4>
<p>প্রতিটা request-এর timestamp রাখা (Redis sorted set)। নতুন request এলে জানালার বাইরের timestamp মুছে নতুনটা যোগ; log-এর আকার সীমার মধ্যে থাকলে পাশ।</p>
<p><b>✅</b> সবচেয়ে নির্ভুল — যেকোনো rolling জানালায় সীমা ভাঙে না। <b>❌</b> অনেক memory (প্রতি request-এর timestamp)। টিপ: বাতিল request log-এ না রাখলে memory কমে।</p>

<h4>ঙ) Sliding Window Counter (Hybrid)</h4>
<p>আগের ও বর্তমান জানালার counter রেখে overlap-অনুপাতে ওজনযুক্ত যোগ:</p>
<div class="diagram"><pre>
 count = বর্তমান + আগের × (আগের জানালার overlap%)
 সীমা ৭/মিনিট; আগের মিনিটে ৫, বর্তমানে ৩; request এল ৩০% পয়েন্টে:
 count = ৩ + ৫ × ০.৭ = ৬.৫ → ৬ ≤ ৭ ✅
</pre></div>
<p><b>✅</b> spike মসৃণ, memory কম। <b>❌</b> আনুমানিক (আগের জানালা সমানভাবে ছড়ানো ধরে নেয়); Cloudflare-এর পরীক্ষায় ৪০ কোটি request-এ মাত্র ০.০০৩% ভুল।</p>

<h4>তুলনা ও বাছাই</h4>
<table>
<tr><th></th><th>Token Bucket</th><th>Leaking</th><th>Fixed Window</th><th>Sliding Log</th><th>Sliding Counter</th></tr>
<tr><td>Memory</td><td>কম</td><td>কম</td><td>খুব কম</td><td><b>বেশি</b></td><td>কম</td></tr>
<tr><td>নির্ভুলতা</td><td>ভালো</td><td>ভালো</td><td>সীমানায় দুর্বল</td><td><b>সর্বোচ্চ</b></td><td>প্রায় নির্ভুল</td></tr>
<tr><td>Burst</td><td>✅</td><td>❌ মসৃণ</td><td>সীমানায় অনিয়ন্ত্রিত</td><td>নিয়ন্ত্রিত</td><td>মসৃণ</td></tr>
<tr><td>উপযুক্ত</td><td>সাধারণ public API</td><td>স্থির হার দরকার</td><td>মাসিক quota</td><td>login/OTP (কম volume, কড়া)</td><td>বড় scale</td></tr>
</table>
<div class="callout best"><span class="tag">Interview-তে</span>
"সাধারণ API-তে <b>Token Bucket</b> (সরল, burst-সহনশীল); login/OTP-তে <b>Sliding Window Log</b>; বিপুল scale-এ <b>Sliding Window Counter</b>।" প্রয়োজনে মিশিয়েও চলে।</div>

<h3>৪.৫ Counter কোথায়? — Redis</h3>
<p>Disk ধীর, তাই in-memory <b>Redis</b>: <code>INCR</code> counter বাড়ায়, <code>EXPIRE</code> timeout-এ key নিজে মুছে যায়। Middleware Redis থেকে counter পড়ে, সীমা পেরোলে ❌ 429, নইলে request এগোয় ও counter আপডেট হয়।</p>

<h3>৪.৬ ধাপ ৩ — Deep Dive: Rule, 429 ও Header</h3>
<p><b>Rule</b> কোডে hardcode নয়, configuration-এ (ফাইল/DB); worker নিয়মিত cache রিফ্রেশ করে — deploy ছাড়াই বদলানো যায়:</p>
<pre>
- domain: auth
  descriptors:
    - key: endpoint
      value: login
      rate_limit: { unit: minute, requests_per_unit: 5 }
- domain: api
  descriptors:
    - key: plan
      value: free
      rate_limit: { unit: minute, requests_per_unit: 60 }
</pre>
<p><b>সীমা পেরোলে:</b> HTTP <b>429</b> ফেরত দিন; কিছু ক্ষেত্রে (যেমন order) বাতিল না করে queue-তে রেখে পরে চালান। সঙ্গে header:</p>
<table>
<tr><th>Header</th><th>অর্থ</th></tr>
<tr><td><code>X-RateLimit-Limit</code></td><td>প্রতি জানালায় সর্বোচ্চ call</td></tr>
<tr><td><code>X-RateLimit-Remaining</code></td><td>আর কতটা বাকি</td></tr>
<tr><td><code>Retry-After</code></td><td>কত সেকেন্ড পর আবার চেষ্টা (প্রামাণ্য HTTP header)</td></tr>
</table>

<h3>৪.৭ Distributed পরিবেশের দুটো কঠিন সমস্যা</h3>

<h4>সমস্যা ১: Race Condition</h4>
<p>পড়ো → সীমা দেখো → লেখো: দুই thread একসাথে counter = ৩ পড়ে দুজনেই ৪ লেখে (হওয়া উচিত ছিল ৫) — একটা request সীমা ভেঙে ঢুকে যায়। <b>Lock</b> ধীর; সমাধান: Redis-এর atomic <code>INCR</code> বা পুরো লজিক একটা <b>Lua script</b>-এ (Redis অবিভাজ্যভাবে চালায়)।</p>

<h4>C# + Redis — Lua দিয়ে Atomic Token Bucket</h4>
<pre>
private const string TokenBucketLua = @"
local capacity = tonumber(ARGV[1])
local rate     = tonumber(ARGV[2])
local cost     = tonumber(ARGV[3])
local t   = redis.call('TIME')
local now = tonumber(t[1]) * 1000 + math.floor(tonumber(t[2]) / 1000)   -- Redis-এর ঘড়ি (ms)

local d = redis.call('HMGET', KEYS[1], 'tokens', 'ts')
local tokens = tonumber(d[1]); if tokens == nil then tokens = capacity end
local ts     = tonumber(d[2]); if ts == nil then ts = now end

tokens = math.min(capacity, tokens + math.max(0, now - ts) / 1000 * rate)   -- lazy refill
local allowed = 0
if tokens >= cost then tokens = tokens - cost; allowed = 1 end

redis.call('HSET', KEYS[1], 'tokens', tokens, 'ts', now)
redis.call('PEXPIRE', KEYS[1], math.ceil(capacity / rate * 1000) * 2)       -- নিষ্ক্রিয় key মুছবে
return { allowed, math.floor(tokens) }
";

public async Task&lt;(bool Allowed, int Remaining)&gt; TryAcquireAsync(string key, int capacity, double ratePerSec)
{
    var res = (RedisResult[])(await _db.ScriptEvaluateAsync(
        TokenBucketLua,
        new RedisKey[] { $"rl:{key}" },
        new RedisValue[] { capacity, ratePerSec, 1 }))!;
    return ((int)res[0] == 1, (int)res[1]);
}</pre>

<h4>সমস্যা ২: Synchronization</h4>
<p>Web tier stateless, তাই একই client-এর request একবার limiter-1-এ, একবার limiter-2-এ যায়; প্রত্যেকের নিজস্ব counter থাকলে সীমা কার্যকর হয় না।</p>
<table>
<tr><th>সমাধান</th><th>মূল্যায়ন</th></tr>
<tr><td>Sticky session</td><td>❌ স্কেল হয় না, limiter মরলে counter হারায়</td></tr>
<tr><td><b>কেন্দ্রীয় Redis</b></td><td>✅ সবাই একই counter পড়ে-লেখে; বড় scale-এ Redis Cluster</td></tr>
</table>

<h4>Performance ও Failure Handling</h4>
<ul>
<li><b>Edge / multi-data-center:</b> ব্যবহারকারীর কাছের edge-এ limit প্রয়োগ করে latency কমান; region-গুলোর মধ্যে <b>eventual consistency</b>-তে sync (সীমার সামান্য বেশি ঢোকা সহনীয়)।</li>
<li><b>Local + Global:</b> প্রতি সার্ভারে ছোট in-memory limiter + Redis-এ নির্ভুল global limiter।</li>
<li><b>Redis ডাউন হলে:</b> সাধারণ API-তে <b>fail-open</b> (সেবা চলুক) + local fallback + alert; OTP/payment-এর মতো ঝুঁকিপূর্ণ endpoint-এ <b>fail-closed</b>। Redis call-এ কড়া timeout (২০–৫০ ms) ও circuit breaker দিন।</li>
<li><b>Monitoring:</b> ৪২৯-এর হার ও কোন key-তে বেশি — rule অতি-কড়া হলে বৈধ request মরে; flash sale-এ limiter অকেজো হলে burst-সহনশীল algorithm নিন।</li>
</ul>

<h3>৪.৮ .NET-এ বাস্তবায়ন — ASP.NET Core Built-in Limiter</h3>
<p>.NET 7+ এ <code>AddRateLimiter</code>: Fixed window, Sliding window, Token bucket, Concurrency।</p>
<pre>
builder.Services.AddRateLimiter(o =&gt;
{
    o.RejectionStatusCode = StatusCodes.Status429TooManyRequests;

    o.AddPolicy("api", ctx =&gt; RateLimitPartition.GetTokenBucketLimiter(
        ctx.User.Identity?.Name ?? ctx.Connection.RemoteIpAddress?.ToString() ?? "anon",
        _ =&gt; new TokenBucketRateLimiterOptions
        {
            TokenLimit = 20, TokensPerPeriod = 10,
            ReplenishmentPeriod = TimeSpan.FromSeconds(1),
            QueueLimit = 0, AutoReplenishment = true
        }));

    o.OnRejected = (context, ct) =&gt;
    {
        if (context.Lease.TryGetMetadata(MetadataName.RetryAfter, out var retryAfter))
            context.HttpContext.Response.Headers.RetryAfter =
                ((int)retryAfter.TotalSeconds).ToString(CultureInfo.InvariantCulture);
        return ValueTask.CompletedTask;
    };
});

app.UseRateLimiter();
app.MapGroup("/api").RequireRateLimiting("api");</pre>
<div class="callout mistake"><span class="tag">সীমাবদ্ধতা — per-instance</span>
এই limiter প্রতিটা instance-এর <b>নিজস্ব memory-তে</b> চলে; ৫টা instance-এ ১০/সেকেন্ড দিলে কার্যত ৫০/সেকেন্ড ঢোকে। সত্যিকারের global সীমায়: gateway/edge (Azure APIM <code>rate-limit-by-key</code>, YARP, Nginx) অথবা উপরের Redis Lua পদ্ধতি।</div>

<h3>৪.১০ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Token bucket আর leaking bucket-এর পার্থক্য কী?</b>
<p>Token bucket burst <b>অনুমোদন করে</b> (জমা token থাকলে একসাথে অনেক request পাশ); leaking bucket আউটপুট <b>স্থির হারে</b> মসৃণ করে। Burst-বান্ধব public API-তে token bucket, downstream স্থির গতি চাইলে leaking bucket।</p></div>
<div class="card"><b>প্র২. Fixed window counter-এ কী সমস্যা? সমাধান?</b>
<p>জানালার সীমানায় burst — শেষে N + শুরুতে N = ২N request অল্প সময়ে ঢোকে। সমাধান: sliding window log (নির্ভুল, memory বেশি) বা sliding window counter (প্রায়-নির্ভুল, memory কম)।</p></div>
<div class="card"><b>প্র৩. বহু সার্ভারে rate limiter সঠিক রাখবেন কীভাবে?</b>
<p>কেন্দ্রীয় Redis-এ counter; check-and-update atomic করতে Lua/INCR; sticky session নয়। বড় scale-এ Redis Cluster ও multi-region-এ eventual consistency।</p></div>
<div class="card"><b>প্র৪. Race condition কীভাবে ঘটে ও ঠেকান?</b>
<p>read-then-write দুটো আলাদা ধাপ — দুই thread একই মান পড়ে overwrite করে। Lock ধীর; তাই atomic <code>INCR</code> বা পুরো লজিক Lua script-এ (Redis single-threaded, তাই script মাঝপথে বিভক্ত হয় না)।</p></div>
<div class="card"><b>প্র৫. Redis ডাউন হলে কী হবে?</b>
<p>নিরাপত্তা-গুরুত্ব অনুযায়ী: সাধারণ API-তে fail-open + local fallback + alert; OTP/payment-এ fail-closed। Timeout ও circuit breaker অবশ্যই।</p></div>
<div class="card"><b>প্র৬. IP-ভিত্তিক limit-এর ঝুঁকি কী?</b>
<p>NAT-এর পেছনে বহু ব্যবহারকারী একই IP — নিরীহরাও আটকে যায়; আবার botnet IP ঘুরিয়ে পার পায়। Authenticated হলে user ID/API key ধরুন; IP শুধু anonymous ও login-এ, সাথে CAPTCHA/device fingerprint।</p></div>

<h2 class="title">৫. Design Consistent Hashing</h2>
<p class="lead">ডেটা বা request একাধিক সার্ভারে সমানভাবে ভাগ করার সবচেয়ে সহজ উপায় <code>hash(key) % N</code>। কিন্তু সার্ভার যোগ বা বাদ দিলেই এটা প্রায় সব key-র জায়গা বদলে সিস্টেম ধসিয়ে দেয়। <b>Consistent Hashing</b> সেই সমস্যার সমাধান — Cache cluster, Sharded DB, Key-Value Store, CDN সবকিছুর ভিত্তি।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
অধ্যায় ১-এ বলেছিলাম "resharding কঠিন, consistent hashing দিয়ে সমাধান" — এই সেই অধ্যায়। "Cache cluster-এ সার্ভার বাড়ালে কী হবে?", "shard কীভাবে ঠিক করবেন?" — এসব প্রশ্নের শেষ উত্তর এখানে।</div>

<h3>৫.১ সমস্যা — Rehashing</h3>
<p>৪টা cache server, নিয়ম <code>serverIndex = hash(key) % N</code>। একটা সার্ভার মরলে N = ৩ হয়, একই key এখন ভিন্ন সার্ভারে খোঁজা হয়:</p>
<div class="diagram"><pre>
 key hash = 18:   18 % 4 = 2  (s2-তে ছিল)      18 % 3 = 0  → s0-তে খোঁজে ❌ miss
 key hash = 41:   41 % 4 = 1                    41 % 3 = 2  → ❌ miss

 বড় সংখ্যায় (১২,০০০ key গুনে যাচাই করেছি):  ৪ → ৩ সার্ভারে ৭৫% key সরে, ৪ → ৫-এ ৮০%
 ফল: cache miss-এর ঝড় → সব request DB-তে → DB বসে যায়
</pre></div>
<div class="callout mistake"><span class="tag">মূল নীতি</span>
একটা সার্ভারের পরিবর্তনে শুধু <b>সেই সার্ভারের</b> ডেটাই প্রভাবিত হওয়া উচিত। Modulo এই নীতি ভাঙে, কারণ key-র জায়গা নির্ভর করে N-এর উপর।</div>

<h3>৫.২ Consistent Hashing কীভাবে কাজ করে</h3>
<p>Hash function-এর পুরো আউটপুট-পরিসর (যেমন SHA-1: ০ থেকে 2<sup>160</sup>−1)-এর দুই প্রান্ত জুড়ে একটা <b>hash ring</b> বানান। তারপর:</p>
<ol>
<li>সার্ভারের নাম/IP hash করে ring-এ বসান।</li>
<li>Key-ও একই hash function দিয়ে ring-এ বসান (<b>modulo নেই</b>)।</li>
<li><b>Lookup:</b> key-র অবস্থান থেকে clockwise হাঁটুন; প্রথম যে সার্ভার পান, key সেখানে।</li>
</ol>
<div class="diagram"><pre>
 ring = ০..৯৯ (সরলতার জন্য);  s0@10  s1@35  s2@60  s3@85;  keys: k0@20  k1@40  k2@70  k3@90

 k0@20 → s1     k1@40 → s2     k2@70 → s3     k3@90 → (৯৯ পেরিয়ে ০) s0

 সার্ভার যোগ  s4@30 : প্রভাবিত পরিসর (10, 30] — s4 থেকে anticlockwise আগের সার্ভার s0 পর্যন্ত
                      শুধু k0 s1 → s4 যায়; k1, k2, k3 নড়ে না
 সার্ভার বাদ  s1    : তার পরিসরের key (k0) clockwise পরের সার্ভার s2-তে যায়; বাকিরা অপরিবর্তিত
</pre></div>
<p>ফলাফল: সার্ভার সংখ্যা বদলালে গড়ে মাত্র <b>k/n টা key</b> সরে (k = মোট key, n = সার্ভার)।</p>

<h3>৫.৩ দুটো সমস্যা ও Virtual Node</h3>
<p>সরল ring-এ (১) সার্ভার যোগ-বিয়োগের পর partition (দুই সার্ভারের মাঝের ফাঁক) অসমান হয়, (২) সার্ভারের hash কাছাকাছি পড়লে একজন বিশাল পরিসর পায় আর কেউ প্রায় খালি থাকে। সমাধান: প্রতিটা সার্ভারকে ring-এ <b>বহুবার</b> বসানো — <code>s0_0, s0_1, s0_2 …</code> (প্রতিটার আলাদা hash)। এগুলোই <b>virtual node</b>।</p>
<div class="diagram"><pre>
 ring (ঘড়ির কাঁটায):  s0_0  s1_1  s0_2  s1_0  s1_2  s0_1 ...   ← দুই সার্ভারের অংশ মিশে ছড়ানো
 key → প্রথম virtual node (যেমন s1_1) → আসল সার্ভার s1
</pre></div>
<table>
<tr><th>✅ সুবিধা</th><th>⚠️ মূল্য</th></tr>
<tr><td>ফাঁক গড়ে সমান হয় — বইয়ের পরীক্ষায় ১০০ virtual node-এ standard deviation গড়ের ~১০%, ২০০-তে ~৫%<br>সার্ভার মরলে তার ডেটা <b>বহু সার্ভারে</b> ছড়ায়<br>শক্তিশালী সার্ভারকে বেশি virtual node দেওয়া যায় (heterogeneity)</td><td>Virtual node-এর metadata-র জন্য বাড়তি memory<br>Node যোগ/বাদে আরও বেশি সার্ভারের সঙ্গে ডেটা আদান-প্রদান<br>সংখ্যাটা tune করতে হয়</td></tr>
</table>

<h3>৫.৪ C# — Virtual Node সহ Hash Ring</h3>
<p>নিচের কোড চালিয়ে যাচাই করেছি (.NET ১০)। সাজানো <code>List&lt;ulong&gt;</code> + binary search → lookup O(log M)।</p>
<pre>
public sealed class ConsistentHashRing&lt;TNode&gt; where TNode : notnull
{
    private readonly int _virtualNodes;
    private readonly List&lt;ulong&gt; _hashes = new();               <span class="c">// সাজানো ring position</span>
    private readonly Dictionary&lt;ulong, TNode&gt; _owner = new();   <span class="c">// position → আসল node</span>
    private readonly object _gate = new();

    public ConsistentHashRing(int virtualNodes = 150) =&gt; _virtualNodes = virtualNodes;

    private static ulong Hash(string s) =&gt;
        BitConverter.ToUInt64(SHA1.HashData(Encoding.UTF8.GetBytes(s)), 0);

    public void AddNode(TNode node)
    {
        lock (_gate)
        {
            for (var i = 0; i &lt; _virtualNodes; i++)
            {
                var h = Hash($"{node}#vn{i}");
                if (_owner.TryAdd(h, node)) _hashes.Add(h);
            }
            _hashes.Sort();
        }
    }

    <span class="c">// replication-এর জন্য: clockwise হেঁটে প্রথম N টা *আলাদা* আসল node</span>
    public IReadOnlyList&lt;TNode&gt; GetNodes(string key, int count)
    {
        lock (_gate)
        {
            var idx = _hashes.BinarySearch(Hash(key));
            if (idx &lt; 0) idx = ~idx;                             <span class="c">// প্রথম position &gt;= key-র hash</span>
            var result = new List&lt;TNode&gt;(count);
            for (var step = 0; step &lt; _hashes.Count &amp;&amp; result.Count &lt; count; step++)
            {
                var node = _owner[_hashes[(idx + step) % _hashes.Count]];   <span class="c">// শেষে ring ঘুরে শুরুতে</span>
                if (!result.Contains(node)) result.Add(node);
            }
            return result;
        }
    }

    public TNode GetNode(string key) =&gt; GetNodes(key, 1)[0];
}</pre>
<p><code>RemoveNode</code> উল্টো কাজ: একই hash গুলো <code>_owner</code> ও <code>_hashes</code> থেকে সরানো। পরীক্ষা: ১০টা সার্ভার, প্রতিটায় ১৫০ virtual node, ১,০০,০০০ key — তারপর ১১তম সার্ভার যোগ:</p>
<table>
<tr><th>আমার মেশিনে চালানো ফলাফল</th><th>ফল</th><th>আদর্শ</th></tr>
<tr><td>Ring: ১০ → ১১ সার্ভারে কত key সরল</td><td><b>৮.৮%</b></td><td>১/১১ ≈ ৯.১%</td></tr>
<tr><td>Ring: একটা সার্ভার বাদ দিলে</td><td><b>৮.৪%</b></td><td>≈ ৯.১%</td></tr>
<tr><td>সরল <code>hash % N</code>: ১০ → ১১</td><td><b>৯১.০%</b></td><td>—</td></tr>
<tr><td>প্রতি সার্ভারের key (১০টা সার্ভারে)</td><td>৮,০৮৩ – ৯,৭৫৮</td><td>গড় ৯,০৯১</td></tr>
</table>
<div class="callout best"><span class="tag">Practical টিপ</span>
(১) Production-এ দ্রুত non-crypto hash (xxHash/Murmur) ভালো; SHA-1 শেখার জন্য। (২) <code>string.GetHashCode()</code> ব্যবহার করবেন না — .NET-এ process-ভেদে আলাদা, দুই সার্ভারের ring ভিন্ন হয়ে যাবে। (৩) Ring কদাচিৎ বদলায়, প্রতি request-এ পড়া হয় — immutable snapshot বা <code>ReaderWriterLockSlim</code> ভালো।</div>

<h3>৫.৫ বাস্তব ব্যবহার ও সীমাবদ্ধতা</h3>
<ul>
<li><b>ব্যবহার:</b> Amazon Dynamo ও Cassandra-র partitioning, Discord, Akamai CDN, Google Maglev load balancer, Memcached client (ketama)। <b>Redis Cluster</b> ঠিক ring নয় — ১৬,৩৮৪ নির্দিষ্ট hash slot (<code>CRC16(key) % 16384</code>) node-দের মধ্যে ভাগ; ধারণা একই: node বদলালে শুধু কিছু slot সরে (<a href="redis.html" style="color:var(--accent2)">Redis কোর্স</a>)।</li>
<li><b>Rebalance:</b> নতুন node এলে তার প্রতিটা virtual node থেকে anticlockwise আগের node পর্যন্ত ফাঁকের key সরাতে হবে। Migration background-এ ও rate-limit দিয়ে চালান।</li>
<li><b>Hot key এখনও সমস্যা:</b> consistent hashing <b>বণ্টন</b> সমান করে, কিন্তু একটাই অতি-জনপ্রিয় key (celebrity প্রোফাইল) সবসময় একই node-এ পড়ে। প্রতিকার: replica থেকে read, key ভাগ (<code>key#0..#9</code>), local cache।</li>
<li><b>বিকল্প:</b> Rendezvous (HRW) hashing ring ছাড়াই কাজ করে কিন্তু lookup O(সার্ভার সংখ্যা); Jump consistent hash সরল কিন্তু মাঝখান থেকে node বাদ দেওয়া যায় না।</li>
</ul>

<h3>৫.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. <code>hash(key) % N</code>-এ সমস্যা কী?</b>
<p>N বদলালে প্রায় সব key-র সার্ভার বদলায় (N→N−1-এ ~(N−1)/N অংশ)। Cache-এ massive miss ও DB-তে ঝড়; sharded DB-তে প্রায় সব ডেটা সরাতে হয়।</p></div>
<div class="card"><b>প্র২. Consistent hashing কীভাবে কাজ করে?</b>
<p>সার্ভার ও key দুটোই hash ring-এ বসে; key-র অবস্থান থেকে clockwise প্রথম সার্ভারই মালিক। সার্ভার যোগ-বিয়োগে শুধু পাশের ফাঁকের key সরে — গড়ে k/n।</p></div>
<div class="card"><b>প্র৩. Virtual node কেন লাগে?</b>
<p>কম সার্ভারে ring-এর ফাঁক অসমান হয়। প্রতিটা সার্ভারকে বহু জায়গায় বসালে লোড গড়ে সমান হয়, সার্ভার ব্যর্থ হলে লোড বহু সার্ভারে ছড়ায়, আর বেশি ক্ষমতার মেশিনকে বেশি node দেওয়া যায়। ট্রেড-অফ: metadata ও migration জটিলতা।</p></div>
<div class="card"><b>প্র৪. Replica কোথায় রাখবেন?</b>
<p>Key থেকে clockwise হেঁটে প্রথম N টা <b>আলাদা আসল</b> সার্ভার (virtual node বাদ দিয়ে uniqueness দেখে), সম্ভব হলে আলাদা rack/AZ-এ।</p></div>
<div class="card"><b>প্র৫. নতুন সার্ভারে কোন key সরবে কীভাবে জানবেন?</b>
<p>নতুন node-এর অবস্থান থেকে anticlockwise আগের node পর্যন্ত পরিসরের key।</p></div>
<div class="card"><b>প্র৬. একটাই hot key-র সমস্যা কি এতে মেটে?</b>
<p>না — এটা বণ্টন সমান করে, একক key সবসময় একই node-এ। সমাধান: replica read, key ভাগ করা, hot-key cache, client-side cache।</p></div>
</template>

<template data-page="kvstore">
<h2 class="title">৬. Design a Key-Value Store</h2>
<p class="lead"><b>Key-Value Store</b> হলো সবচেয়ে সরল NoSQL database: অনন্য <code>key</code>-র সঙ্গে একটা <code>value</code>, অপারেশন মাত্র <code>put(key, value)</code> ও <code>get(key)</code>। কিন্তু একে বিশাল, সবসময় চালু ও দ্রুত বানাতে distributed system-এর প্রায় সব বড় ধারণা লাগে। এই অধ্যায় Amazon Dynamo, Cassandra ও Bigtable-এর ধারণার উপর দাঁড়িয়ে।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
"node মরলে কী হবে?", "দুজন একসাথে লিখলে কে জিতবে?", "stale পড়া কখন গ্রহণযোগ্য?" — এই প্রশ্নগুলো chat, feed, notification, drive সব case study-তে ফিরে আসবে। Redis, DynamoDB, Cassandra ব্যবহারেও এগুলোই আপনার mental model।</div>

<h3>৬.১ Scope</h3>
<p>Requirement: প্রতিটা pair ১০ KB-র কম; বিশাল ডেটা; high availability ও scalability; স্বয়ংক্রিয় scaling; <b>tunable consistency</b>; কম latency। এক সার্ভারে hash table (memory) + compression + hot/cold ভাগ করে কিছুদূর যাওয়া যায়, কিন্তু বড় ডেটায় <b>distributed key-value store</b> (distributed hash table) লাগে।</p>

<h3>৬.২ CAP Theorem</h3>
<p>Consistency (সব client একই ডেটা দেখে), Availability (প্রতিটা অনুরোধ উত্তর পায়), Partition tolerance (network ছিন্ন হলেও চলে) — একসাথে দুটোই সম্ভব। Network partition অনিবার্য, তাই P বাদ যায় না; "CA" সিস্টেম বাস্তবে distributed পরিবেশে নেই। আসল প্রশ্ন: <b>partition ঘটলে C বাছবেন না A?</b></p>

<tr><th></th><th>CP</th><th>AP</th></tr>

CAP শুধু <b>partition চলাকালীন</b> আচরণ নিয়ে; স্বাভাবিক সময়েও latency বনাম consistency-র ট্রেড-অফ থাকে — এটাই <b>PACELC</b> (<a href="distsys.html" style="color:var(--accent2)">Distributed Systems কোর্স</a>)। Interview-তে আগে জিজ্ঞেস করুন: <i>"stale পড়া কতটা সহনীয়?"</i></div>

<h3>৬.৩ Partition ও Replication</h3>
<p><b>Partition:</b> consistent hashing (অধ্যায় ৫) — সমান বণ্টন, ন্যূনতম ডেটা সরানো, স্বয়ংক্রিয় scaling, virtual node দিয়ে heterogeneity।<br>
<b>Replication:</b> প্রতিটা key <b>N টা</b> সার্ভারে (সাধারণত ৩) asynchronously কপি হয়: ring-এ key-র অবস্থান থেকে clockwise প্রথম N টা <b>আলাদা আসল</b> সার্ভার।</p>
<div class="diagram"><pre>
 ring (N = 3):  s0 ─ s1 ─ s2 ─ s3 ─ s4 ─ s5 ─ s6 ─ s7
 key0 → s1-এ পড়ল  ⇒  কপি থাকে s1, s2, s3
</pre></div>
<div class="callout mistake"><span class="tag">Correlated Failure</span>
একই rack/data center-এর node একসাথে মরে। তিন কপি একই rack-এ থাকলে N = 3 নিরর্থক — replica বসান আলাদা rack / AZ / data center-এ।</div>

<h3>৬.৪ Consistency — Quorum (N, W, R)</h3>
<p><b>N</b> = replica সংখ্যা; <b>W</b> = write সফল ধরতে কতজনের ack লাগবে; <b>R</b> = read সফল ধরতে কতজনের সাড়া লাগবে। ভুল ধারণা: W = 1 মানে "একটা সার্ভারে লেখা" নয় — ডেটা N টাতেই যায়; <b>coordinator</b> (client ও node-দের মাঝের proxy) প্রথম ১টা ack পেয়েই "সফল" জানায়।</p>
<div class="diagram"><pre>
 N=3, W=2, R=2:   Client ─► Coordinator ─┬─► s0 ack ┐
                                          ├─► s1 ack ┴─► ২টা ack → "OK"
                                          └─► s2 (ধীর, পরে পৌঁছায়)
 write set ও read set-এর অন্তত ১টা node অভিন্ন (overlap) → সর্বশেষ মান পাওয়া যায়
</pre></div>
<table>
<tr><th>কনফিগ</th><th>ফল</th></tr>
<tr><td><b>W + R &gt; N</b> (যেমন N=3, W=R=2)</td><td>Strong consistency — overlap-এর node-এ সর্বশেষ মান আছে। সবচেয়ে প্রচলিত</td></tr>
<tr><td>W + R ≤ N (যেমন W=R=1)</td><td>Strong consistency গ্যারান্টি নেই, কিন্তু সবচেয়ে দ্রুত</td></tr>
<tr><td>R = 1, W = N</td><td>দ্রুত read, ধীর write (read-heavy)</td></tr>
<tr><td>W = 1, R = N</td><td>দ্রুত write, ধীর read (write-heavy)</td></tr>
</table>
<p>W/R বাড়ালে consistency বাড়ে, কিন্তু সবচেয়ে ধীর replica-র জন্য অপেক্ষা করতে হয় — তাই এটা <b>latency বনাম consistency</b>-র নব। <b>Consistency model:</b> <b>Strong</b> (কখনো stale নয়, কিন্তু availability কমে), <b>Weak</b> (stale হতে পারে), <b>Eventual</b> (যথেষ্ট সময়ে সব replica এক হয়) — Dynamo ও Cassandra eventual বেছেছে; তাই concurrent write-এ ভিন্ন মান ঢুকতে পারে, যা মেটাতে লাগে versioning।</p>

<h3>৬.৫ Conflict Resolution — Vector Clock</h3>
<p>Server1 লিখল <code>name = johnSanFrancisco</code>, একই সময়ে Server2 লিখল <code>johnNewYork</code> — দুটোই আসল মানের উপর ভিত্তি করে, কোনটা বিজয়ী তা স্বয়ংক্রিয়ভাবে বলা যায় না। <b>Vector clock</b> প্রতিটা ডেটার সঙ্গে <code>[server:counter]</code> জোড়া রাখে; server লিখলে নিজের counter বাড়ায় (না থাকলে ১)।</p>
<table>
<tr><th>ধাপ</th><th>ঘটনা</th><th>Clock</th></tr>
<tr><td>১</td><td>D1 লিখল Sx</td><td>[Sx:1]</td></tr>
<tr><td>২</td><td>D1 পড়ে D2 লিখল Sx</td><td>[Sx:2] (D1-এর বংশধর)</td></tr>
<tr><td>৩</td><td>D2 পড়ে D3 লিখল Sy</td><td>[Sx:2, Sy:1]</td></tr>
<tr><td>৪</td><td>D2 পড়ে D4 লিখল Sz</td><td>[Sx:2, Sz:1]</td></tr>
<tr><td>৫</td><td>D3 ও D4 পড়ে conflict ধরে client মেটাল, Sx লিখল</td><td>[Sx:3, Sy:1, Sz:1]</td></tr>
</table>
<p><b>নিয়ম:</b> Y-এর প্রতিটা counter ≥ X-এর হলে X পূর্বসূরি (conflict নেই); কোনো counter একদিকে বেশি আর কোনোটা অন্যদিকে বেশি হলে conflict (siblings)।</p>
<pre>
public enum Order { Equal, Before, After, Concurrent }

public sealed class VectorClock
{
    private readonly Dictionary&lt;string, int&gt; _v = new();
    public VectorClock() { }
    private VectorClock(Dictionary&lt;string, int&gt; v) =&gt; _v = new(v);

    public VectorClock Increment(string server)          <span class="c">// লেখক server-এর counter বাড়াও</span>
    {
        var copy = new Dictionary&lt;string, int&gt;(_v);
        copy[server] = copy.GetValueOrDefault(server) + 1;
        return new VectorClock(copy);
    }

    public Order Compare(VectorClock other)
    {
        bool less = false, greater = false;
        foreach (var s in _v.Keys.Union(other._v.Keys))
        {
            var a = _v.GetValueOrDefault(s); var b = other._v.GetValueOrDefault(s);
            if (a &lt; b) less = true;
            if (a &gt; b) greater = true;
        }
        return (less, greater) switch
        {
            (false, false) =&gt; Order.Equal,
            (true, false)  =&gt; Order.Before,       <span class="c">// conflict নেই</span>
            (false, true)  =&gt; Order.After,
            _              =&gt; Order.Concurrent    <span class="c">// conflict!</span>
        };
    }
}
<span class="c">// d3 = [Sx:2, Sy:1],  d4 = [Sx:2, Sz:1]  →  d3.Compare(d4) == Order.Concurrent  (চালিয়ে যাচাই করা)</span></pre>
<table>
<tr><th>দুর্বলতা</th><th>প্রতিকার</th></tr>
<tr><td>Client-কে conflict মেটানোর লজিক লিখতে হয়</td><td>ব্যবসার নিয়ম (cart-এ union), বা CRDT</td></tr>
<tr><td>[server:counter] তালিকা বাড়তে থাকে</td><td>দৈর্ঘ্যের সীমা, পুরোনো জোড়া ফেলা (সম্পর্ক নির্ণয় কিছুটা অনিশ্চিত হয়; Dynamo পেপার বলে Amazon-এ সমস্যা হয়নি)</td></tr>
</table>
<div class="callout behind"><span class="tag">বাস্তবে — Last-Write-Wins</span>
Cassandra-র ডিফল্ট timestamp-ভিত্তিক LWW: সর্বশেষ timestamp জেতে। সরল, কিন্তু clock skew-এ বৈধ write নীরবে হারায়। অর্থের মতো ডেটায় vector clock/application merge বা CP বাছুন।</div>

<h3>৬.৬ Failure Handling</h3>
<h4>ক) Failure Detection — Gossip</h4>
<p>একজনের কথায় "মৃত" ধরা ভুল; দুটো স্বাধীন সূত্র চাই। সবাই সবাইকে ping (all-to-all) বড় cluster-এ অচল। <b>Gossip:</b> প্রতিটা node membership list (member ID + heartbeat counter) রাখে, নিজের counter বাড়ায়, নিয়মিত কিছু র‍্যান্ডম node-কে list পাঠায়, তারা আবার ছড়ায়। কারো counter নির্দিষ্ট সময়ের বেশি না বাড়লে সে offline।</p>
<div class="diagram"><pre>
 s0-এর list:  s0:10232  s1:10224  s2:9008 ← বহুক্ষণ বাড়েনি  s3:10230
 s0 এটা র‍্যান্ডম কিছু node-কে জানায় → তারাও s2-র সাড়া পায় না → s2 "down" চিহ্নিত, খবর সবার কাছে
</pre></div>
<p>কেন্দ্রীয় সমন্বয়কারী নেই (SPOF নেই), বার্তা কম, খবর দ্রুত ছড়ায়।</p>

<h4>খ) অস্থায়ী failure — Sloppy Quorum ও Hinted Handoff</h4>
<p>কড়া quorum-এ নির্দিষ্ট node ডাউন থাকলে read/write আটকে যায়। <b>Sloppy quorum:</b> ring-এ <b>প্রথম W টা সুস্থ</b> (write) ও <b>প্রথম R টা সুস্থ</b> (read) node ব্যবহার, অসুস্থদের এড়িয়ে। s2 ডাউন থাকলে s3 সাময়িকভাবে তার লেখা নেয় ও "hint" রাখে; s2 ফিরলে ডেটা ফেরত দেয় — এটাই <b>hinted handoff</b>।</p>
<div class="callout mistake"><span class="tag">ট্রেড-অফ</span>
Sloppy quorum-এ W + R &gt; N থাকলেও strong consistency থাকে না (লেখা গেছে নির্দিষ্ট N-এর বাইরের node-এ), আর hint-ধারী node মরলে লেখা হারাতে পারে। এটা availability-র জন্য consistency-র মূল্য।</div>

<h4>গ) স্থায়ী failure — Anti-Entropy ও Merkle Tree</h4>
<p>Replica চিরতরে হারালে বা handoff ব্যর্থ হলে replica-গুলো ভিন্ন হয়। বিলিয়ন key সরাসরি তুলনা অসম্ভব, তাই <b>Merkle tree</b>: key space-কে bucket-এ ভেঙে প্রতিটার hash, তারপর উপরে hash-এর hash।</p>
<div class="diagram"><pre>
 bucket:  [১-৩]  [৪-৬]  [৭-৯]  [১০-১২]  →  H1  H2  H3  H4
 উপরে:    H12 = h(H1,H2)    H34 = h(H3,H4)    Root = h(H12,H34)

 দুই সার্ভারের Root মিললে → ডেটা অভিন্ন।  না মিললে → গাছ বেয়ে নেমে অমিল bucket বের করে শুধু সেটুকুই sync
</pre></div>
<p>পাঠানো ডেটা পার্থক্যের সমানুপাতিক, মোট ডেটার নয়। বাস্তবে ১০০ কোটি key-তে ১০ লাখ bucket (প্রতিটায় ~১,০০০ key); গভীরতা ≈ ২০। Cassandra-র <code>nodetool repair</code> এই ধারণা ব্যবহার করে। <b>Data center outage</b> সামলাতে বহু data center-এ replicate করুন (প্রায়ই local DC-তে quorum, অন্য DC-তে asynchronous)।</p>

<h3>৬.৭ আর্কিটেকচার, Write Path ও Read Path</h3>
<div class="diagram"><pre>
 Client ─► Coordinator (যেকোনো node) ─► ring-এর N টা replica
 • সব node সমান দায়িত্বের, ring-এ consistent hashing, বিকেন্দ্রীভূত → SPOF নেই
 • প্রতি node নিজেই: client API, gossip, conflict resolution, repair, replication, storage engine
</pre></div>
<div class="diagram"><pre>
 WRITE:  put ─► ১. Commit Log (disk, append-only, crash recovery)
              ─► ২. Memtable (RAM, সাজানো)
              ─► ৩. ভরলে flush → SSTable (disk, immutable, সাজানো)

 READ:   get ─► Memtable-এ আছে? ──হ্যাঁ──► ফেরত
                 │ না → Bloom filter: কোন SSTable-এ থাকতে পারে? ("নেই" মানে নিশ্চিত নেই)
                 └─► সেই SSTable(গুলো) পড়ে সবচেয়ে নতুন মান ফেরত
</pre></div>
<div class="callout behind"><span class="tag">পর্দার পেছনে — LSM-tree</span>
লেখায় কোথাও random seek নেই (log append + memory + sequential flush), তাই write খুব দ্রুত। মূল্য: SSTable জমে, তাই background <b>compaction</b> লাগে; delete হয় <b>tombstone</b> লিখে। Bloom filter-এর বিস্তারিত <a href="systemdesign.html" style="color:var(--accent2)">System Design কোর্সে</a>।</div>

<h3>৬.৯ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. CAP বলুন; কোনটা বাছবেন?</b>
<p>Partition ঘটলে C ও A-র মধ্যে একটা বাছতে হয়। ব্যাংক/inventory → CP; feed/cart/session → AP। আগে ব্যবসার stale-সহনশীলতা জিজ্ঞেস করুন।</p></div>
<div class="card"><b>প্র২. N=3, W=2, R=2 কেন প্রচলিত?</b>
<p>W+R=৪ &gt; ৩ বলে quorum overlap করে (strong-ধরনের consistency), আবার একটা node ডাউনেও read-write চলে।</p></div>
<div class="card"><b>প্র৩. W = 1 মানে কি একটা node-এ লেখা?</b>
<p>না। ডেটা সব N replica-তে যায়; coordinator প্রথম ১টা ack পেয়েই client-কে সফল জানায়।</p></div>
<div class="card"><b>প্র৪. Vector clock বনাম last-write-wins?</b>
<p>LWW ঘড়ির উপর নির্ভর করে নীরবে একটা write ফেলে দেয়। Vector clock conflict <b>সনাক্ত</b> করে ও মেটানোর সিদ্ধান্ত application-কে দেয়; দাম: client জটিলতা ও clock বৃদ্ধি।</p></div>
<div class="card"><b>প্র৫. Gossip কেন, আর hinted handoff-এর ঝুঁকি কী?</b>
<p>Gossip-এ বার্তা কম, SPOF নেই, খবর দ্রুত ছড়ায়। Hinted handoff availability দেয় কিন্তু strong consistency ভাঙে ও hint-ধারী node মরলে লেখা হারাতে পারে — তাই Merkle-ভিত্তিক anti-entropy ব্যাকআপ।</p></div>
<div class="card"><b>প্র৬. Read path-এ Bloom filter ও Merkle tree কী কাজ করে?</b>
<p>Bloom filter বলে কোন SSTable-এ key থাকতে পারে ("নেই" হলে নিশ্চিত, তাই disk read এড়ানো যায়; false positive সম্ভব, false negative নয়)। Merkle tree (read-এ নয়, repair-এ) দুই replica-র পার্থক্য hash-গাছ বেয়ে দ্রুত বের করে।</p></div>

<h2 class="title">৭. Design a Unique ID Generator in Distributed Systems</h2>
<p class="lead">একটা DB-তে <code>auto_increment</code> primary key সুন্দর কাজ করে — যতক্ষণ DB একটাই। একাধিক DB/সার্ভারে ভাগ হলে (অধ্যায় ১-এর sharding) কে পরের নম্বর দেবে? এই অধ্যায়ে চার ধরনের উপায় তুলনা করে <b>Twitter Snowflake</b>-ধরনের generator বানাব, C#-এ চালিয়ে যাচাই করে।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
Order ID, message ID, transaction ID — প্রতিটা distributed সিস্টেমে লাগে। ID-র ধরন বাছাই পরে বদলানো প্রায় অসম্ভব (সব ডেটা, index, API-তে ঢুকে যায়), তাই শুরুতেই সঠিক সিদ্ধান্ত জরুরি। এটা URL shortener (পরের অধ্যায়)-এরও ভিত্তি।</div>

<h3>৭.১ Requirement (Step 1)</h3>
<p>Interviewer-এর সঙ্গে প্রশ্নোত্তরে ঠিক হলো: ID অনন্য ও <b>সময় অনুযায়ী sortable</b> (সন্ধ্যার ID সকালের চেয়ে বড়, ঠিক +১ নয়); শুধু সংখ্যা; <b>৬৪-bit</b>-এ ধরবে; প্রতি সেকেন্ডে <b>১০,০০০+</b> ID।</p>

<h3>৭.২ চারটা উপায় (Step 2)</h3>
<table>
<tr><th>উপায়</th><th>কীভাবে</th><th>✅ / ❌</th></tr>
<tr><td><b>Multi-master replication</b></td><td>প্রতিটা DB <code>auto_increment</code> বাড়ায় <b>k</b> করে (k = DB সংখ্যা)। k=2: DB-১ → ১,৩,৫…; DB-২ → ২,৪,৬…</td><td>✅ সংখ্যা, সহজ<br>❌ একাধিক data center-এ কঠিন; সার্ভারভেদে সময়ের সঙ্গে ID বাড়ে না; সার্ভার যোগ/বাদে ভাঙে (k বদলায়)</td></tr>
<tr><td><b>UUID</b></td><td>১২৮-bit র‍্যান্ডম সংখ্যা, প্রতিটা সার্ভার নিজে বানায়, কোনো সমন্বয় নেই। উদাহরণ <code>09c93e62-50b4-468d-bf8a-c07e1040bfb2</code>; collision সম্ভাবনা নগণ্য</td><td>✅ সহজ, সহজে scale<br>❌ ১২৮ bit (চাই ৬৪); সময়-ক্রমে নয়; সংখ্যা নয়</td></tr>
<tr><td><b>Ticket server</b></td><td>একটা কেন্দ্রীয় DB-র <code>auto_increment</code> সবাই ব্যবহার করে (Flickr-এর পদ্ধতি)</td><td>✅ সংখ্যা, ছোট-মাঝারি scale-এ সহজ<br>❌ <b>SPOF</b>; একাধিক ticket server করলে synchronization সমস্যা</td></tr>
<tr><td><b>Snowflake</b></td><td>ID-কে অংশে ভাগ: timestamp + datacenter + machine + sequence</td><td>✅ সব requirement পূরণ</td></tr>
</table>
<div class="callout behind"><span class="tag">বইয়ের বাইরে — UUID-র আধুনিক রূপ</span>
র‍্যান্ডম UUID v4 clustered index-এ insert-এ বিক্ষিপ্ত জায়গায় বসে (page split, fragmentation, ধীর write)। সমাধান: <b>time-ordered UUID</b> — .NET ৯+ এ <code>Guid.CreateVersion7()</code> (UUID v7: শুরুতে timestamp), বা SQL Server-এ <code>NEWSEQUENTIALID()</code>। ১২৮-bit চলবে এমন সিস্টেমে এটাই সরল ও ভালো পছন্দ; কিন্তু আমাদের ৬৪-bit শর্ত থাকায় Snowflake।</div>

<h3>৭.৩ Snowflake-এর গঠন</h3>
<p>Divide and conquer: ID সরাসরি না বানিয়ে ৬৪ bit ভাগ করুন।</p>
<div class="diagram"><pre>
 ┌──────┬───────────────────────────────┬────────────┬───────────┬──────────────┐
 │ ১ bit│ ৪১ bit                        │ ৫ bit      │ ৫ bit     │ ১২ bit       │
 │ sign │ timestamp (ms, custom epoch)  │ datacenter │ machine   │ sequence     │
 │  (০) │                               │ ID         │ ID        │ (প্রতি ms)   │
 └──────┴───────────────────────────────┴────────────┴───────────┴──────────────┘
 সময় সবার আগে (উচ্চ bit) → ID সময়-ক্রমে sortable
</pre></div>
<table>
<tr><th>অংশ</th><th>আকার</th><th>ক্ষমতা / বিবরণ</th></tr>
<tr><td>Sign</td><td>১ bit</td><td>সবসময় ০ (ভবিষ্যতের জন্য সংরক্ষিত; ID ঋণাত্মক হয় না)</td></tr>
<tr><td>Timestamp</td><td>৪১ bit</td><td>epoch থেকে milliseconds। 2<sup>41</sup>−1 ms ≈ <b>৬৯.৭ বছর</b>। Epoch আজকের কাছাকাছি রাখলে মেয়াদ বাড়ে (Twitter-এর epoch: <code>1288834974657</code> = ৪ নভেম্বর ২০১০ ০১:৪২:৫৪ UTC)</td></tr>
<tr><td>Datacenter ID</td><td>৫ bit</td><td>2<sup>5</sup> = ৩২টা data center</td></tr>
<tr><td>Machine ID</td><td>৫ bit</td><td>প্রতি DC-তে ৩২ মেশিন → মোট ১,০২৪ generator</td></tr>
<tr><td>Sequence</td><td>১২ bit</td><td>2<sup>12</sup> = ৪,০৯৬; একই ms-এ একাধিক ID হলে ০,১,২… বাড়ে; পরের ms-এ ০-তে ফেরে</td></tr>
</table>
<p><b>ক্ষমতার হিসাব:</b> এক মেশিন সর্বোচ্চ ৪,০৯৬ ID/ms = ~৪১ লক্ষ/সেকেন্ড; ১,০২৪ মেশিনে ৪,০৯৬ × ১,০০০ × ১,০২৪ ≈ ৪১৯ কোটি/সেকেন্ড। আমাদের চাহিদা ১০,০০০/সেকেন্ড — অনেক অনেক কম, তাই এই লেআউট প্রয়োজনের চেয়ে বেশি শক্তিশালী।</p>
<p><b>নির্ভুলতা কেন:</b> দুটো মেশিনের (datacenter, machine) জোড়া আলাদা হলে একই ms-এও ID ভিন্ন; একই মেশিনে একই ms-এ sequence ভিন্ন; ভিন্ন ms-এ timestamp ভিন্ন। তাই <b>সমন্বয় ছাড়াই uniqueness</b>।</p>

<h3>৭.৪ Deep Dive (Step 3)</h3>
<ul>
<li><b>Datacenter ও machine ID</b> সার্ভার চালুর সময় ঠিক হয় ও এরপর স্থির থাকে। ভুলে দুই মেশিনে একই জোড়া পড়লে ID collision — তাই ব্যবস্থা চাই: config/orchestrator (Kubernetes StatefulSet ordinal), বা ZooKeeper/etcd/DB থেকে lease নেওয়া।</li>
<li><b>Timestamp ও sequence</b> চলার সময় তৈরি হয়। Sequence ৪,০৯৬ ছুঁলে পরের millisecond পর্যন্ত অপেক্ষা।</li>
</ul>
<h4>C# — Snowflake Generator (চালিয়ে যাচাই করা)</h4>
<pre>
public sealed class SnowflakeIdGenerator
{
    private const long Epoch = 1288834974657L;          <span class="c">// Twitter default epoch</span>
    private const int  DcBits = 5, MachineBits = 5, SeqBits = 12;
    private const long MaxSeq = (1L &lt;&lt; SeqBits) - 1;     <span class="c">// 4095</span>

    private readonly long _dcId, _machineId;
    private long _lastTs = -1, _seq;
    private readonly object _gate = new();

    public SnowflakeIdGenerator(int datacenterId, int machineId)
    {
        if (datacenterId is &lt; 0 or &gt;= 1 &lt;&lt; DcBits)      throw new ArgumentOutOfRangeException(nameof(datacenterId));
        if (machineId    is &lt; 0 or &gt;= 1 &lt;&lt; MachineBits) throw new ArgumentOutOfRangeException(nameof(machineId));
        _dcId = datacenterId; _machineId = machineId;
    }

    private static long NowMs() =&gt; DateTimeOffset.UtcNow.ToUnixTimeMilliseconds();

    public long NextId()
    {
        lock (_gate)
        {
            var ts = NowMs();
            if (ts &lt; _lastTs)                                    <span class="c">// ঘড়ি পিছিয়েছে (NTP সংশোধন)</span>
                throw new InvalidOperationException($"Clock moved back by {_lastTs - ts} ms");

            if (ts == _lastTs)
            {
                _seq = (_seq + 1) &amp; MaxSeq;
                if (_seq == 0)                                   <span class="c">// এই ms-এর ৪০৯৬টা শেষ → পরের ms-এর অপেক্ষা</span>
                    while ((ts = NowMs()) &lt;= _lastTs) Thread.SpinWait(50);
            }
            else _seq = 0;

            _lastTs = ts;
            return ((ts - Epoch) &lt;&lt; (DcBits + MachineBits + SeqBits))
                 | (_dcId &lt;&lt; (MachineBits + SeqBits))
                 | (_machineId &lt;&lt; SeqBits)
                 | _seq;
        }
    }

    public static DateTimeOffset ExtractTime(long id) =&gt;
        DateTimeOffset.FromUnixTimeMilliseconds((id &gt;&gt; (DcBits + MachineBits + SeqBits)) + Epoch);
}</pre>
<p><b>আমার পরীক্ষা:</b> ২,০০,০০০ ID এক thread-এ: সব অনন্য ও ক্রমবর্ধমান; ৮ thread × ৫০,০০০ = ৪,০০,০০০ ID-ও সব অনন্য। গতি ~৪১ লক্ষ/সেকেন্ড — ঠিক তাত্ত্বিক সীমা (৪,০৯৬/ms)। <code>ExtractTime</code> দিয়ে ID থেকে তৈরির সময় ফেরত পাওয়া যায় (debug/ প্রাচীন ডেটা খুঁজতে কাজে লাগে)।</p>
<div class="callout mistake"><span class="tag">সাধারণ ভুল — JavaScript-এ ID হারানো</span>
৬৪-bit সংখ্যা JavaScript <code>Number</code>-এ (সর্বোচ্চ নিরাপদ পূর্ণসংখ্যা 2<sup>53</sup>) নির্ভুল ধরে না — frontend-এ ID-র শেষ অঙ্ক বদলে যায়! API-তে Snowflake ID <b>string</b> হিসেবে পাঠান (Twitter এ কারণেই <code>id_str</code> দেয়)।</div>

<h3>৭.৫ Wrap Up — অতিরিক্ত আলোচনা (Step 4)</h3>
<table>
<tr><th>বিষয়</th><th>ব্যাখ্যা</th></tr>
<tr><td><b>Clock synchronization</b></td><td>আমরা ধরেছি সব generator-এর ঘড়ি মোটামুটি এক। বাস্তবে মেশিনভেদে ঘড়ি আলাদা। <b>NTP</b> ঘড়ি মেলায়, কিন্তু সংশোধনে ঘড়ি <b>পিছিয়ে</b> যেতে পারে — তখন নতুন ID আগের চেয়ে ছোট বা duplicate হতে পারে। প্রতিকার: পেছানো ধরা পড়লে error দেওয়া/ছোট (কয়েক ms) হলে অপেক্ষা করা (উপরের কোডে error), সর্বশেষ timestamp ডিস্কে/shared store-এ রাখা, NTP-কে "slew" মোডে (ধীরে সংশোধন) চালানো।</td></tr>
<tr><td><b>Section length tuning</b></td><td>কম concurrency কিন্তু দীর্ঘমেয়াদি সিস্টেমে sequence bit কমিয়ে timestamp bit বাড়ান (মেয়াদ বাড়ে); বিপরীতে বিপুল concurrency হলে sequence বাড়ান।</td></tr>
<tr><td><b>High availability</b></td><td>ID generator mission-critical — এটা বন্ধ থাকলে লেখা বন্ধ। তাই বহু generator instance (প্রতিটার আলাদা machine ID), local library হিসেবে app-এর ভেতরেই বা ছোট ID-service হিসেবে।</td></tr>
<tr><td><b>Sortable কতটা?</b></td><td>ID শুধু <b>মোটামুটি</b> সময়-ক্রমে (ভিন্ন মেশিনের একই ms-এর ID-র ক্রম অনির্দিষ্ট) — "ঠিক কোনটা আগে" নির্ণয়ে ব্যবহার করবেন না। কড়া ক্রম চাইলে অন্য পদ্ধতি (single leader/logical clock, <a href="distsys.html" style="color:var(--accent2)">Distributed Systems কোর্স</a>)।</td></tr>
</table>

<h3>৭.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. <code>auto_increment</code> বহু DB-তে কেন চলে না?</b>
<p>একক DB-র ক্ষমতা সীমিত, আর বহু DB-তে সমন্বয় ছাড়া ক্রম/অনন্যতা রাখা কঠিন। Multi-master k-ধাপে বাড়ানো সম্ভব, কিন্তু multi-DC, সার্ভার যোগ-বিয়োগ ও সময়-ক্রমে দুর্বল।</p></div>
<div class="card"><b>প্র২. UUID বনাম Snowflake?</b>
<p>UUID: সমন্বয়হীন, সরল, কিন্তু ১২৮-bit ও (v4) র‍্যান্ডম — index fragmentation। Snowflake: ৬৪-bit, সংখ্যা, সময়-ক্রমে, তবে machine ID বরাদ্দ ও ঘড়ি-নির্ভরতার জটিলতা। ১২৮-bit চলে ও সরলতা চাইলে UUID v7 ভালো।</p></div>
<div class="card"><b>প্র৩. Snowflake ID-র সর্বোচ্চ ক্ষমতা কত? ৪১ bit কতদিন চলবে?</b>
<p>এক মেশিনে ৪,০৯৬ ID/ms (~৪১ লক্ষ/সেকেন্ড)। ৪১ bit ≈ ৬৯.৭ বছর, epoch সিস্টেম চালুর কাছাকাছি রাখলে মেয়াদের পুরোটাই পাওয়া যায়।</p></div>
<div class="card"><b>প্র৪. ঘড়ি পিছিয়ে গেলে কী হবে?</b>
<p>duplicate বা ছোট ID-র ঝুঁকি। generator আগের সর্বশেষ timestamp মনে রাখে; পেছানো ধরলে ছোট হলে অপেক্ষা, বড় হলে error/alert। NTP slew মোড, ও মেশিন-ঘড়ির মনিটরিংও দরকার।</p></div>
<div class="card"><b>প্র৫. দুই মেশিনে ভুলে একই machine ID পড়লে?</b>
<p>একই ms ও sequence-এ একই ID — collision। তাই machine ID বরাদ্দ কেন্দ্রীয়/স্বয়ংক্রিয় (orchestrator ordinal, lease) হওয়া উচিত, হাতে-কলমে config নয়।</p></div>
<div class="card"><b>প্র৬. ID থেকে কী কাজ করা যায়?</b>
<p>তৈরির সময় বের করা (<code>ExtractTime</code>), time-range query সহজ (ID-র পরিসর দিয়ে), shard-routing (bit থেকে datacenter/machine), আর cursor pagination (<code>WHERE id &lt; @last ORDER BY id DESC</code>) — সবই সময়-ক্রমের সুবিধা।</p></div>
</template>

<h2 class="title">৮. Design a URL Shortener</h2>
<p class="lead">লম্বা লিংক দিলে ছোট লিংক ফেরত দেওয়া, আর ছোট লিংকে ক্লিক করলে আসল লিংকে পৌঁছে দেওয়া — tinyurl/bit.ly-র কাজ। এখানে শেখার মূল বিষয়: <b>ছোট কোড বানানোর দুটো পথ (hash বনাম base62), ৩০১ বনাম ৩০২ redirect, আর read-heavy সিস্টেমে cache।</b></p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
একই প্রশ্নে অধ্যায় ৭ (unique ID), ১ (cache) ও ৪ (rate limit) একসাথে বসে। আপনার ERP-তে ইনভয়েস/পেমেন্ট/টিকিট শেয়ার লিংক বানাতে গেলেও এই কাঠামোই লাগবে।</div>

<h3>৮.১ ধাপ ১ — Scope ও হিসাব</h3>
<p><b>ধরে নেওয়া:</b> দিনে ১০ কোটি নতুন URL; কোড যতটা সম্ভব ছোট, অক্ষর <code>0-9a-zA-Z</code>; ১০ বছর চলবে; delete/update নেই। <b>Use case:</b> shorten, redirect, high availability।</p>
<pre>
Write QPS   = 100M ÷ 86,400              ≈ 1,160
Read QPS    = 1,160 × 10 (read:write ১০:১) ≈ 11,600
১০ বছরে     = 100M × 365 × 10            = 365 বিলিয়ন record
Storage     = 365B × 100 B               ≈ 36.5 TB
</pre>
<div class="callout mistake"><span class="tag">বইয়ের গণিত-ভুল</span>
বইয়ে storage "365 TB" লেখা — কিন্তু ১০ বছর আগেই record-সংখ্যায় ধরা, আবার গুণ করা ভুল। সঠিক <b>~36.5 TB</b>। সিদ্ধান্ত: storage সমস্যা নয়; চাপ আসে <b>১১,৬০০ read QPS</b> ও <b>ID-র uniqueness</b> থেকে।</div>

<p>প্রথম খসড়া in-memory hash table ছিল, কিন্তু ৩৬৫ বিলিয়ন record RAM-এ রাখা যায় না — তাই DB: <code>id | short_code | long_url</code>। আসল প্রশ্ন: <b>short_code আসবে কোথা থেকে?</b></p>

<h3>৮.৩ ধাপ ৩ — Deep Dive: ছোট কোড বানানো</h3>
<h4>কোডের দৈর্ঘ্য</h4>
<p>৬২ অক্ষর, দৈর্ঘ্য n → 62<sup>n</sup> জায়গা। 62⁶ ≈ ৫৭ বিলিয়ন (কম), <b>62⁷ = 3,521,614,606,208 ≈ ৩.৫ ট্রিলিয়ন</b> (৩৬৫B-র প্রায় ১০ গুণ) ⇒ দৈর্ঘ্য <b>৭</b>।</p>

<h4>পদ্ধতি ১ — Hash + Collision Resolution</h4>
<p>URL-কে CRC32/MD5/SHA-1-এ hash করে প্রথম ৭ অক্ষর নিন (CRC32 = ৮ hex, MD5 = ৩২, SHA-1 = ৪০ — সবই ৭-এর চেয়ে লম্বা, তাই কাটতে হয়)। কাটলে collision অনিবার্য: ১০০ কোটি URL-এ প্রত্যাশিত ≈ N²/(2M) = 10¹⁸ ÷ 7×10¹² ≈ <b>১.৪ লক্ষ</b>।</p>
<div class="diagram"><pre>
 longUrl ──► hash ──► প্রথম ৭ অক্ষর ──► DB-তে আছে? ──না──► সংরক্ষণ ✅
                                           │ হ্যাঁ (collision)
                      longUrl + salt ──► আবার hash ◄─────┘   (লুপ)
</pre></div>
<p>খরচ: প্রতি write-এ DB query। <b>Bloom filter</b> ("নিশ্চিতভাবে নেই" হলে DB-তে যাওয়া লাগে না) এটা কমায়।</p>

<h4>পদ্ধতি ২ — Base 62 Conversion</h4>
<p>Unique <b>ID (সংখ্যা)</b>-কে base-62-এ লেখা। ম্যাপিং: <code>0–9→0–9, 10–35→a–z, 36–61→A–Z</code>।</p>
<pre>
11157 ÷ 62 = 179 ভাগশেষ 59 → 'X'
  179 ÷ 62 =   2 ভাগশেষ 55 → 'T'
    2 ÷ 62 =   0 ভাগশেষ  2 → '2'      ⇒  "2TX"     (2×62² + 55×62 + 59 = 11157 ✓)
ID 2009215674938  ⇒  "zn9edcu"
</pre>
<pre>
public static class Base62
{
    private const string A = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    public static string Encode(long id)
    {
        if (id == 0) return "0";
        Span&lt;char&gt; buf = stackalloc char[11];            <span class="c">// long.MaxValue ⇒ সর্বোচ্চ ১১ অক্ষর</span>
        var pos = buf.Length;
        for (; id &gt; 0; id /= 62) buf[--pos] = A[(int)(id % 62)];
        return new string(buf[pos..]);
    }

    public static long Decode(string s) =&gt;
        s.Aggregate(0L, (acc, c) =&gt; checked(acc * 62 + A.IndexOf(c)));
}
</pre>

<h4>তুলনা</h4>
<table>
<tr><th></th><th>Hash + collision</th><th>Base62</th></tr>
<tr><td>দৈর্ঘ্য</td><td>স্থির (৭)</td><td>ID-র সঙ্গে বাড়ে</td></tr>
<tr><td>Unique ID generator</td><td>লাগে না</td><td><b>লাগে</b> (অধ্যায় ৭)</td></tr>
<tr><td>Collision</td><td>আছে; প্রতি write-এ চেক</td><td><b>নেই</b></td></tr>
<tr><td>পরের কোড অনুমান</td><td>কঠিন</td><td><b>সহজ</b> (ক্রমিক ID)</td></tr>
</table>
<p>বইয়ের পছন্দ <b>Base62</b> — write পথ সরল। তবে দুটো বাস্তব দায় আছে:</p>
<div class="callout mistake"><span class="tag">দায় ১ — ৭ অক্ষরে ধরানো</span>
Snowflake ID (৬৪-বিট) base62-এ ১০-১১ অক্ষর। ৭ অক্ষরে থাকতে ID < ৩.৫ ট্রিলিয়ন লাগবে। সমাধান: <b>range allocation</b> — কেন্দ্রীয় counter (DB sequence/Redis/ZooKeeper) প্রতি app সার্ভারকে ১০ লাখ ID-র ব্লক দেয়; সার্ভার ব্লকের ভেতর memory-তে বাড়ায়। Crash-এ অব্যবহৃত ID হারালেও ক্ষতি নেই।</div>
<div class="callout mistake"><span class="tag">দায় ২ — Enumeration</span>
ক্রমিক কোডে কেউ পরপর লিংক খুলে অন্যের গোপন ইনভয়েস/পেমেন্ট লিংক সংগ্রহ করতে পারে। প্রতিকার: ID-কে <b>বিপরীতযোগ্য scramble</b> (Feistel/Sqids-ধরনের) করে base62 করা। মনে রাখুন, অস্পষ্টতা নিরাপত্তা নয় — সংবেদনশীল ডেটায় আসল authorization লাগবে।</div>

<h4>Shortening প্রবাহ</h4>
<div class="diagram"><pre>
 longUrl ─► DB-তে আছে? ──হ্যাঁ──► আগের shortUrl ফেরত (idempotent)
              │ না
              ▼
     Unique ID ─► Base62 ─► DB-তে (id, short_code, long_url) সংরক্ষণ ─► shortUrl ফেরত
</pre></div>
<p>"longUrl আছে?" দ্রুত করতে long_url-এর SHA-256 hash কলামে unique index রাখুন (১০০ বাইটের URL-এ সরাসরি index ভারী)। প্রতি campaign-এ আলাদা কোড চাইলে এই চেক বাদ।</p>

<h4>Redirect প্রবাহ — Cache সহ</h4>
<div class="diagram"><pre>
 Click ─► Load Balancer ─► Web Server (stateless)
                              │ ১. Redis-এ আছে? ──হ্যাঁ──► longUrl
                              │ না
                              │ ২. DB (read replica) থেকে পড়ো; নেই ⇒ ৪০৪
                              │ ৩. Redis-এ রাখো (TTL)
                              ▼
                         ৩০২ + Location: longUrl
</pre></div>
<p><b>Cache-এর হিসাব:</b> দৈনিক read ≈ ১১,৬০০ × ৮৬,৪০০ ≈ ১০০ কোটি। ধরুন দৈনিক ১০ কোটি স্বতন্ত্র লিংকের ২০% = ২ কোটি × ~১৫০ বাইট ≈ <b>৩ GB</b> — একটা Redis-এ ধরে; LRU যথেষ্ট।</p>
<pre>
app.MapGet("/{code:regex(^[0-9a-zA-Z]{{1,11}}$)}", async (string code, UrlService svc, CancellationToken ct) =&gt;
{
    var url = await svc.ResolveAsync(code, ct);          <span class="c">// Redis → miss হলে DB → Redis-এ রাখো</span>
    return url is null ? Results.NotFound()
                       : Results.Redirect(url, permanent: false);   <span class="c">// ৩০২</span>
});

app.MapPost("/api/v1/data/shorten", async (ShortenRequest req, UrlService svc, CancellationToken ct) =&gt;
{
    if (!Uri.TryCreate(req.LongUrl, UriKind.Absolute, out var uri)
        || uri.Scheme is not ("http" or "https"))
        return Results.BadRequest("Valid http(s) URL required");      <span class="c">// javascript: আটকাও</span>
    return Results.Ok(new { shortUrl = $"https://tiny.example/{await svc.ShortenAsync(uri.AbsoluteUri, ct)}" });
}).RequireRateLimiting("api");                                        <span class="c">// অধ্যায় ৪</span>
</pre>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span>
(১) যেকোনো URL মেনে নিয়ে ফিশিং-এ ব্যবহৃত হওয়া — blocklist/Safe Browsing-এ যাচাই করুন। (২) ৩০১ দিয়ে পরে analytics হারানো। (৩) "নেই" এমন কোডের negative cache না রাখা — র‍্যান্ডম কোড হাঁকিয়ে DB চাপে ফেলা (cache penetration); ছোট TTL-এ negative cache বা bloom filter।</div>

<h3>৮.৫ অনুশীলনী</h3>
<ol>
<li><code>Decode(Encode(x)) == x</code> — ১০ লাখ র‍্যান্ডম <code>long</code>-এ property test লিখুন।</li>
<li>Redis <code>INCRBY ids:block 1000000</code> দিয়ে range allocator বানান; স্থানীয় counter <code>Interlocked</code>-ভিত্তিক।</li>
<li>৩০১ করে Chrome DevTools-এ দ্বিতীয় ক্লিকে network tab-এ কী বদলায় দেখুন।</li>

<h3>৮.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. ৩০১ না ৩০২?</b>
<p>Analytics লাগলে ৩০২ (প্রতি click সার্ভারে আসে)। ৩০১ load কমায়, কিন্তু click হারায় ও লিংক বদলানো কঠিন।</p></div>
<div class="card"><b>প্র২. কোডে ৭ অক্ষর কেন?</b>
<p>৬২⁷ ≈ ৩.৫ ট্রিলিয়ন ≥ ৩৬৫ বিলিয়ন (প্রায় ১০ গুণ); ৬২⁶ ≈ ৫৭ বিলিয়ন যথেষ্ট নয়।</p></div>
<div class="card"><b>প্র৩. Hash বনাম Base62?</b>
<p>Hash: দৈর্ঘ্য স্থির কিন্তু collision-চেক লাগে। Base62: unique ID থেকে collision-হীন, তবে ID generator লাগে ও কোড অনুমানযোগ্য — তাই scramble যোগ করি।</p></div>
<div class="card"><b>প্র৪. বহু সার্ভারে ৭ অক্ষরের মধ্যে unique ID কীভাবে?</b>
<p>Range allocation: কেন্দ্রীয় counter থেকে ১০ লাখের ব্লক নিয়ে স্থানীয়ভাবে বাড়ানো। Snowflake-এর ID এতে বড়।</p></div>
<div class="card"><b>প্র৫. ১১,৬০০ read QPS কীভাবে সামলাবেন?</b>
<p>Redis cache-aside, stateless web scale-out, read replica, জনপ্রিয় লিংকে CDN; stampede-এ jittered TTL ও single-flight।</p></div>
<div class="card"><b>প্র৬. একই longUrl দুবার এলে?</b>
<p>ব্যবসা-নির্ভর: একই কোড (hash-এ unique index) অথবা প্রতিবার নতুন কোড (আলাদা campaign analytics)। প্রশ্ন করে জেনে নিন।</p></div>

<h2 class="title">৯. Design a Web Crawler</h2>
<p class="lead"><b>Web Crawler</b> (spider) কয়েকটা seed পাতা থেকে শুরু করে লিংক ধরে ধরে নতুন পাতা আবিষ্কার ও ডাউনলোড করে। মূল চক্র সরল — নামাও, লিংক বের করো, আবার করো — কিন্তু ওয়েব বিশাল ও ফাঁদে ভরা, তাই আসল কাজ: <b>URL Frontier (politeness + priority), deduplication, robustness।</b></p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
এখানে সাধারণ BFS-কে বাস্তবের সীমায় (অন্যের সার্ভারকে বিরক্ত না করা, অগ্রাধিকার, ডুপ্লিকেট, অনন্ত লুপ) বদলানো শেখা যায়। আপনার কাজে লাগে: দাম ট্র্যাকিং, tender সংগ্রহ, RAG-এর জন্য ওয়েব ingestion (<a href="vectordb.html" style="color:var(--accent2)">Vector DB কোর্স</a>)।</div>

<h3>৯.১ ধাপ ১ — Scope ও হিসাব</h3>
<p><b>ধরে নেওয়া:</b> উদ্দেশ্য search indexing; মাসে ১০০ কোটি পাতা; শুধু HTML; নতুন ও সম্পাদিত পাতা ধরব; HTML ৫ বছর রাখব; ডুপ্লিকেট কনটেন্ট বাদ।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>অর্থ</th></tr>
<tr><td>Scalability</td><td>শত কোটি পাতা — parallelization অপরিহার্য</td></tr>
<tr><td>Robustness</td><td>ভাঙা HTML, সাড়াহীন সার্ভার, ক্ষতিকর লিংক সামলানো</td></tr>
<tr><td>Politeness</td><td>এক সাইটে অল্প সময়ে অসংখ্য request নয়</td></tr>
<tr><td>Extensibility</td><td>নতুন কনটেন্ট-ধরন (ছবি/PDF) সহজে যোগ</td></tr>
</table>
<pre>
QPS       = 1B ÷ 30 ÷ 86,400 ≈ 386 ≈ 400 পাতা/সেকেন্ড      Peak ≈ 800
Storage   = 1B × 500 KB = 500 TB/মাস  →  × 12 × 5 = 30 PB
<span class="c">// বইয়ের বাইরে</span>
Bandwidth = 400 × 0.5 MB = 200 MB/s ≈ 1.6 Gbps
Concurrency (Little's law) = 400 × ~1 s ≈ 400 একযোগে connection
</pre>
<p><b>সিদ্ধান্ত:</b> ৩০ PB ⇒ object storage + compression; ~৪০০ একযোগে connection ⇒ async I/O; ~১.৬ Gbps ⇒ বহু সার্ভার ও ভৌগোলিক locality।</p>

<h3>৯.২ ধাপ ২ — High-Level Design</h3>
<div class="diagram"><pre>
 Seed URLs ─► [ URL Frontier ] ─► [ HTML Downloader ] ◄─► [ DNS Resolver (cache) ]
                   ▲                     ▼
                   │              [ Content Parser ]  (ভাঙা পাতা বাদ)
                   │                     ▼
                   │              [ Content Seen? ] ─হ্যাঁ─► ফেলে দাও
                   │                     │ না ──► [ Content Storage ]
                   │                     ▼
                   │              [ URL Extractor ] ─► [ URL Filter ]
                   │                                       ▼
                   └─────────────── নতুন ◄────────── [ URL Seen? ] ─► [ URL Storage ]
</pre></div>
<table>
<tr><th>Component</th><th>কাজ</th></tr>
<tr><td>Seed URLs</td><td>শুরুর বিন্দু; পুরো ওয়েবের জন্য অঞ্চল বা বিষয় ধরে ভাগ করা (open-ended — জোরে ভাবুন)</td></tr>
<tr><td>URL Frontier</td><td>"নামাতে বাকি" URL-এর সংগ্রহ; priority ও politeness এখানেই</td></tr>
<tr><td>HTML Downloader / DNS Resolver</td><td>পাতা নামায়; hostname → IP</td></tr>
<tr><td>Content Parser</td><td>পাতা বৈধ কিনা যাচাই; আলাদা component (crawl ধীর না করতে)</td></tr>
<tr><td>Content Seen?</td><td>~২৯% পাতা ডুপ্লিকেট; পাতার <b>hash</b> তুলনা করে বাদ</td></tr>
<tr><td>URL Extractor / Filter</td><td>লিংক বের করা (relative → absolute); অবাঞ্ছিত ধরন, error, blacklist বাদ</td></tr>
<tr><td>URL Seen?</td><td>আগে দেখা URL ধরে লুপ ও বাড়তি load ঠেকায় — Bloom filter বা hash table</td></tr>
</table>

<h3>৯.৩ ধাপ ৩ — Deep Dive</h3>
<h4>BFS ও URL Frontier</h4>
<p>ওয়েব = directed graph। DFS অতল গভীরে ডোবে; তাই <b>BFS (FIFO queue)</b>। কিন্তু সরল FIFO-র দুই সমস্যা: (১) একই host-এর হাজার URL পরপর বসে — সমান্তরালে নামালে সেই সার্ভারে request-বন্যা (<b>impolite</b>); (২) সব পাতার গুরুত্ব সমান নয়। সমাধান <b>URL Frontier</b>:</p>
<div class="diagram"><pre>
 URL ─► [Prioritizer] ─► Front Queues  f1(high) … fn(low)     ← কোনটা আগে (priority)
                              │  পক্ষপাতী র‍্যান্ডম নির্বাচন (উচ্চ queue বেশি সম্ভাবনায়)
                              ▼
        Queue Router (host → queue ম্যাপ) ─► Back Queues  b1 b2 … bm   ← কখন/কত ঘন (politeness)
                              │   প্রতি queue-তে শুধু এক host-এর URL, একটাই worker
                              ▼
                       Worker threads ─► HTML Downloader   (প্রতি নামানোর মাঝে delay)
</pre></div>
<table>
<tr><th>লক্ষ্য</th><th>কৌশল</th></tr>
<tr><td><b>Politeness</b></td><td>একই host থেকে একবারে একটা পাতা + delay। Delay-র জনপ্রিয় নিয়ম: গত download-সময়ের ~১০ গুণ; <code>robots.txt</code>-এর <code>Crawl-delay</code> মানা; ৪২৯/৫০৩-এ backoff।</td></tr>
<tr><td><b>Priority</b></td><td>PageRank, সাইট-traffic, আপডেট-ঘনত্বে URL-এর স্কোর; উচ্চ queue বেশি সম্ভাবনায় নির্বাচিত (কড়া নয়, নইলে নিচেরটা starve করে)।</td></tr>
<tr><td><b>Freshness</b></td><td>পরিবর্তনের ইতিহাস দেখে recrawl; গুরুত্বপূর্ণ পাতা বেশি ঘন। <b>Conditional GET</b> (<code>If-None-Match</code>/<code>If-Modified-Since</code>) — অপরিবর্তিত পাতায় ৩০৪, ৫০০ KB নামাতে হয় না।</td></tr>
<tr><td><b>Storage</b></td><td>Frontier-এ শত কোটি URL। সব RAM = অস্থায়ী/ব্যয়বহুল; সব disk = ধীর। <b>Hybrid:</b> বেশিরভাগ disk-এ, enqueue/dequeue-র জন্য RAM বাফার।</td></tr>
</table>

<h4>HTML Downloader</h4>
<p><b>robots.txt:</b> কোনো সাইট crawl-এর আগে তার <code>/robots.txt</code> নামিয়ে নিয়ম মানতে হবে; ফল cache করে পর্যায়ক্রমে রিফ্রেশ। নিজের <code>User-Agent</code>-এ পরিচয় দিন; সাইটের শর্ত ও ব্যক্তিগত তথ্য আইন মনে রাখুন।</p>
<table>
<tr><th>Optimization</th><th>ব্যাখ্যা</th></tr>
<tr><td>Distributed crawl</td><td>URL-স্পেস ভাগ। <b>Host-hash দিয়ে ভাগ</b> করলে একই host একই সার্ভারে — politeness স্থানীয়ভাবে সামলানো যায়।</td></tr>
<tr><td>DNS cache</td><td>DNS ১০–২০০ ms; অনেক interface synchronous (একটা আটকালে সবাই আটকায়)। নিজস্ব cache — বাস্তবে এটাই বড় bottleneck।</td></tr>
<tr><td>Locality</td><td>Crawl সার্ভার target-এর কাছাকাছি ছড়ান</td></tr>
<tr><td>Short timeout</td><td>ধীর host-এ অনন্ত অপেক্ষা নয়; পেরোলে ছেড়ে অন্য পাতায়</td></tr>
</table>
<pre>
public async Task&lt;string?&gt; FetchAsync(HostQueue q, CancellationToken ct)
{
    var wait = q.NextAllowed - DateTimeOffset.UtcNow;
    if (wait &gt; TimeSpan.Zero) await Task.Delay(wait, ct);              <span class="c">// politeness</span>

    var url = q.Urls.Dequeue();
    if (!await _robots.IsAllowedAsync(url, "MyCrawler", ct)) return null; <span class="c">// robots.txt</span>

    var sw = Stopwatch.StartNew();
    try
    {
        using var cts = CancellationTokenSource.CreateLinkedTokenSource(ct);
        cts.CancelAfter(TimeSpan.FromSeconds(10));                        <span class="c">// short timeout</span>
        using var res = await _http.GetAsync(url, HttpCompletionOption.ResponseHeadersRead, cts.Token);
        if (!res.IsSuccessStatusCode
            || res.Content.Headers.ContentType?.MediaType != "text/html") return null;
        return await res.Content.ReadAsStringAsync(cts.Token);
    }
    catch (Exception ex) when (ex is HttpRequestException or TaskCanceledException) { return null; } <span class="c">// crash নয়</span>
    finally { q.NextAllowed = DateTimeOffset.UtcNow + TimeSpan.FromTicks(Math.Max(sw.Elapsed.Ticks * 10, TimeSpan.TicksPerSecond)); }
}
</pre>

<h4>Duplicate শনাক্তকরণ</h4>
<div class="grid2">
<div class="box"><b>Content Seen?</b><p>পাতার SHA-256 hash আগে আছে কিনা। অক্ষর-ধরে তুলনার চেয়ে অনেক দ্রুত। সীমা: একটা অক্ষর আলাদা হলেই hash আলাদা; near-duplicate-এ SimHash/MinHash (বইয়ের বাইরে)।</p></div>
<div class="box"><b>URL Seen?</b><p>Bloom filter (কম memory; false positive সম্ভব, false negative নয়) বা hash table। আগে URL <b>normalize</b> করুন: fragment/default port বাদ, host lowercase, query parameter sort, tracking param (<code>utm_*</code>) বাদ।</p></div>
</div>
<div class="callout behind"><span class="tag">Bloom filter-এর ভুল কতটা মূল্যবান?</span>
False positive = একটা নতুন URL ভুল করে "দেখা" ধরা, তাই crawl হলো না — ১% হারে সহনীয় (ওয়েবে বিকল্প পথ প্রচুর)। উল্টোটা কখনো হয় না, তাই অনন্ত লুপ নেই। ১০০ কোটি URL-এ ~১% ভুলের জন্য ≈ ১.২ GB।</div>

<h4>Robustness, Extensibility ও সমস্যাজনক কনটেন্ট</h4>
<table>
<tr><th>বিষয়</th><th>কৌশল</th></tr>
<tr><td>Robustness</td><td>Consistent hashing-এ downloader যোগ/বাদ (অধ্যায় ৫); crawl state স্থায়ী storage-এ (checkpoint, পুনরায় শুরু); exception ধরে এগোনো; data validation</td></tr>
<tr><td>Extensibility</td><td>প্লাগেবল মডিউল — নতুন কনটেন্টে (PNG downloader, Web Monitor) পাইপলাইন বদলায় না। C#-এ <code>IContentHandler { CanHandle(mediaType); HandleAsync(...); }</code> ও DI-তে নিবন্ধন।</td></tr>
<tr><td><b>Spider trap</b></td><td>অনন্ত লুপের URL-কাঠামো (<code>/foo/bar/foo/bar/…</code>, অনন্ত ক্যালেন্ডার, প্রতিবার নতুন session-ID)। প্রতিকার: সর্বোচ্চ URL দৈর্ঘ্য, depth ও প্রতি host-এ পাতা-budget, পুনরাবৃত্ত segment শনাক্তকরণ; অস্বাভাবিক বেশি পাতার host মানুষ যাচাই করে বাদ দেয়।</td></tr>
<tr><td>Data noise</td><td>বিজ্ঞাপন, স্প্যাম URL — anti-spam/quality filter</td></tr>
</table>

<h3>৯.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. BFS কেন, DFS নয়? তারপরও FIFO কেন যথেষ্ট নয়?</b>
<p>ওয়েব অসীম-গভীর, DFS ডুবে যায়। সরল BFS-এ politeness ও priority নেই; তাই Frontier-এ front queues (priority) ও back queues (politeness)।</p></div>
<div class="card"><b>প্র২. Politeness কীভাবে নিশ্চিত করবেন?</b>
<p>Host → queue ম্যাপ, এক queue-তে এক host ও একটাই worker, দুই download-এর মাঝে delay। Host-hash দিয়ে ভাগ করলে সমন্বয় ছাড়াই স্থানীয় নিয়ন্ত্রণ।</p></div>
<div class="card"><b>প্র৩. Duplicate URL ও content কীভাবে ঠেকান?</b>
<p>URL normalize করে Bloom filter; content-এর hash (SHA-256), near-duplicate-এ SimHash। Bloom-এর false positive-এ কিছু URL মিস হয়, লুপ হয় না।</p></div>
<div class="card"><b>প্র৪. Spider trap কী ও কীভাবে এড়ান?</b>
<p>অনন্ত পাতা-উৎপাদক কাঠামো। URL দৈর্ঘ্য/depth/প্রতি-host budget, পুনরাবৃত্ত segment শনাক্ত; সন্দেহজনক host মানুষ যাচাই করে বাদ দেয়।</p></div>
<div class="card"><b>প্র৫. পুরোনো পাতা কখন আবার crawl করবেন?</b>
<p>পরিবর্তন-ইতিহাস ও গুরুত্ব অনুযায়ী; Conditional GET-এ ৩০৪ পেয়ে bandwidth বাঁচান; sitemap-এর lastmod।</p></div>
<div class="card"><b>প্র৬. সবচেয়ে বড় bottleneck কী?</b>
<p>সাধারণত DNS ও নেটওয়ার্ক — DNS cache, async I/O, locality, timeout। তারপর Frontier-এর disk I/O।</p></div>
</template>
