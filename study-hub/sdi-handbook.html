<h3>১০.২ ধাপ ২ — High-Level Design</h3>
<h4>প্রতিটা channel কীভাবে কাজ করে</h4>
<table>
<tr><th>Channel</th><th>প্রবাহ</th></tr>
<tr><td>iOS push</td><td><b>Provider</b> (আপনার সার্ভার) → <b>APNs</b> (Apple) → iOS device। Provider দেয়: <b>device token</b> (ডিভাইসের unique ID) + <b>payload</b> (JSON)</td></tr>
<tr><td>Android push</td><td>একই ধারা, মাঝে <b>FCM</b> (Firebase Cloud Messaging)</td></tr>
<tr><td>SMS</td><td>তৃতীয় পক্ষ gateway (Twilio, Nexmo; বাংলাদেশে স্থানীয় SMS gateway)</td></tr>
<tr><td>Email</td><td>নিজস্ব সার্ভার সম্ভব, তবে SendGrid/Mailchimp-এর মতো সেবায় delivery rate ও analytics ভালো</td></tr>
</table>
<div class="callout best"><span class="tag">Extensibility</span>
তৃতীয় পক্ষ বদলাতে পারে (FCM চীনে অনুপলব্ধ — সেখানে Jpush ইত্যাদি)। তাই প্রতিটা provider একটা <b>interface-এর</b> পেছনে রাখুন (<code>INotificationSender</code>), যাতে প্লাগ/আনপ্লাগ সহজ হয়।</div>

<h4>Contact info সংগ্রহ</h4>
<p>App install বা signup-এর সময় API সার্ভার device token, phone, email সংগ্রহ করে DB-তে রাখে। একজন user-এর <b>একাধিক device</b> থাকতে পারে — তাই আলাদা <code>device</code> টেবিল (push সব device-এ যাবে)।</p>
<pre>
user (user_id, email, country_code, phone_number, ...)
device (device_id, device_token, user_id, platform, last_logged_in_at)
notification_setting (user_id, channel, opt_in)
</pre>

<h4>প্রথম খসড়া ও তার তিন সমস্যা</h4>
<p>Service 1…N → <b>একটা notification সার্ভার</b> → তৃতীয় পক্ষ → device। সমস্যা: <b>SPOF</b>, <b>scale করা কঠিন</b> (DB/cache/প্রসেসিং আলাদা করে বাড়ানো যায় না), <b>performance bottleneck</b> (HTML তৈরি ও তৃতীয় পক্ষের উত্তরের অপেক্ষা)।</p>

<h4>উন্নত design</h4>
<div class="diagram"><pre>
 Service 1..N ─► [ Notification Servers ] (API, auth, validation, rate limit; auto-scale)
                     │ cache/DB থেকে user, device, setting, template আনে
                     ▼
        ┌──────── Message Queues (প্রতি channel আলাদা) ────────┐
        │  iOS PN queue │ Android PN queue │ SMS queue │ Email queue │
        └──────┬────────────────┬──────────────┬────────────┬──────┘
               ▼                ▼              ▼            ▼
           Workers          Workers        Workers      Workers
               ▼                ▼              ▼            ▼
             APNs              FCM         SMS gateway   Email service ─► Users
</pre></div>
<p><b>মূল সিদ্ধান্ত:</b> প্রতি channel-এর আলাদা queue — একটা তৃতীয় পক্ষ (ধরুন SMS gateway) ডাউন হলে অন্য channel অক্ষত থাকে; queue spike শুষে নেয়; worker আলাদা scale হয় (queue লম্বা হলে worker বাড়ান)। Notification server-এর API শুধু ভেতরের service বা যাচাইকৃত client-এর জন্য (spam ঠেকাতে)।</p>

<h3>১০.৩ ধাপ ৩ — Deep Dive</h3>
<h4>Reliability — হারানো যাবে না, ডুপ্লিকেট কমাতে হবে</h4>
<table>
<tr><th>প্রশ্ন</th><th>উত্তর</th></tr>
<tr><td>ডেটা হারানো ঠেকানো?</td><td>Notification দেরি বা ক্রম-ভঙ্গ হতে পারে, <b>কিন্তু হারাতে পারে না</b>। প্রতিটা notification আগে <b>notification log DB-তে persist</b> করুন, তারপর queue/retry।</td></tr>
<tr><td>ঠিক একবারই পৌঁছাবে?</td><td><b>না।</b> Distributed সিস্টেমে exactly-once delivery বাস্তবে সম্ভব নয় — retry-তে ডুপ্লিকেট হতে পারে। তাই <b>at-least-once + dedupe</b>: event ID আগে দেখা থাকলে বাদ।</td></tr>
</table>
<pre>
public async Task HandleAsync(NotificationEvent e, CancellationToken ct)
{
    <span class="c">// ১. Dedupe: event ID প্রথমবার হলেই SET NX সফল (TTL সহ)</span>
    if (!await _redis.StringSetAsync($"notif:seen:{e.EventId}", "1", TimeSpan.FromDays(1), When.NotExists))
        return;                                                      <span class="c">// আগেই প্রক্রিয়া হয়েছে</span>

    <span class="c">// ২. User-এর opt-in ও rate limit</span>
    if (!await _settings.IsOptedInAsync(e.UserId, e.Channel, ct)) return;
    if (!await _limiter.AllowAsync($"notif:{e.UserId}:{e.Channel}", ct)) return;   <span class="c">// frequency cap (অধ্যায় ৪)</span>

    try { await _sender.SendAsync(e, ct); await _log.MarkSentAsync(e.EventId, ct); }
    catch (Exception) when (e.Attempt &lt; 5)
    {
        await _redis.KeyDeleteAsync($"notif:seen:{e.EventId}");       <span class="c">// retry-র জন্য দরজা খোলা</span>
        await _queue.RequeueAsync(e with { Attempt = e.Attempt + 1 },
            delay: TimeSpan.FromSeconds(Math.Pow(2, e.Attempt)));     <span class="c">// exponential backoff</span>
    }                                                                  <span class="c">// ৫ বার ব্যর্থ ⇒ dead-letter queue + alert</span>
}
</pre>

<h4>অতিরিক্ত উপাদান</h4>
<table>
<tr><th>উপাদান</th><th>ভূমিকা</th></tr>
<tr><td><b>Template</b></td><td>লক্ষ notification-এর বেশিরভাগ একই ছাঁচের — preformatted ছাঁচে parameter (<code>{ITEM}</code>, <code>{DATE}</code>) বসানো। সুবিধা: ধারাবাহিকতা, কম ভুল, সময় সাশ্রয়।</td></tr>
<tr><td><b>Notification setting</b></td><td>User-ভিত্তিক channel opt-in (<code>user_id, channel, opt_in</code>)। পাঠানোর আগে <b>সবসময়</b> চেক।</td></tr>
<tr><td><b>Rate limiting</b></td><td>অতিরিক্ত পাঠালে user সব notification বন্ধ করে দেবে — প্রতি user-এ frequency cap (অধ্যায় ৪)।</td></tr>
<tr><td><b>Retry</b></td><td>তৃতীয় পক্ষ ব্যর্থ হলে queue-তে ফেরত; সীমা-সংখ্যক পর dead-letter + developer alert।</td></tr>
<tr><td><b>Security</b></td><td>appKey/appSecret — শুধু যাচাইকৃত client notification API ডাকতে পারে।</td></tr>
<tr><td><b>Queue monitoring</b></td><td>Queue-তে জমা সংখ্যা মূল metric — বেশি হলে worker অপর্যাপ্ত, বাড়ান।</td></tr>
<tr><td><b>Event tracking</b></td><td>sent/delivered/opened/clicked — analytics সেবার সঙ্গে সংযোগ।</td></tr>
</table>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span>
(১) Queue-তে ঢোকানোর আগে DB-তে না রেখে শুধু memory/queue-র ভরসায় থাকা — crash-এ হারায়। (২) Retry-তে idempotency না রেখে OTP/পেমেন্ট SMS দুবার পাঠানো। (৩) Opt-out বা "রাত ১০টা–সকাল ৮টা" quiet hours না মানা। (৪) সব channel এক queue-তে রাখা — SMS gateway ধীর হলে push-ও আটকায়।</div>

<h4>চূড়ান্ত design-এ যা যোগ হলো</h4>
<p>Notification server-এ <b>authentication ও rate limiting</b>; ব্যর্থতায় queue-তে ফেরত গিয়ে <b>নির্দিষ্ট সংখ্যক retry</b>; <b>template</b>; এবং <b>monitoring ও tracking</b>।</p>

<h3>১০.৪ ধাপ ৪ — Wrap Up</h3>
<table>
<tr><th>বিষয়</th><th>কথা</th></tr>
<tr><td>Reliability</td><td>Notification log + retry + dedupe</td></tr>
<tr><td>Security</td><td>appKey/appSecret, শুধু ভেতরের/যাচাইকৃত client</td></tr>
<tr><td>Respect settings</td><td>Opt-out, frequency cap, quiet hours</td></tr>
<tr><td>Provider failover</td><td>এক SMS gateway ডাউন হলে দ্বিতীয়টায় fallback; কিছু ক্ষেত্রে channel fallback (push না পৌঁছালে SMS)</td></tr>
<tr><td>Priority</td><td>OTP/পেমেন্ট নিশ্চিতকরণ আলাদা high-priority queue-তে, marketing আলাদা — marketing-এর স্রোত যেন OTP আটকে না দেয়</td></tr>
</table>

<li>উপরের <code>HandleAsync</code>-এ dedupe key মুছে retry করার ঝুঁকি কী? (দুটো worker একই event একসাথে ধরলে?)</li>
<li>OTP ও marketing-এর জন্য আলাদা queue/worker-pool-এর ডায়াগ্রাম আঁকুন।</li>
</ol>

<h3>১০.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. প্রতি channel-এর আলাদা queue কেন?</b>
<p>এক provider ডাউন/ধীর হলে অন্য channel প্রভাবিত হয় না; spike buffer হয়; worker আলাদা scale করা যায়।</p></div>
<div class="card"><b>প্র২. Exactly-once কেন সম্ভব নয়, কী করেন?</b>
<p>Network/ack হারালে sender জানে না পৌঁছেছে কিনা, তাই retry করতে হয় ⇒ ডুপ্লিকেট সম্ভব। তাই at-least-once + event-ID দিয়ে dedupe (Redis SET NX)।</p></div>
<div class="card"><b>প্র৩. Notification হারানো ঠেকান কীভাবে?</b>
<p>আগে notification log DB-তে persist, durable queue, ack-এর পর মুছা, retry + exponential backoff, শেষে dead-letter queue ও alert।</p></div>
<div class="card"><b>প্র৪. User-কে বিরক্ত না করতে কী করবেন?</b>
<p>Per-channel opt-in, প্রতি user-এ frequency cap, quiet hours, সম্মিলিত (batched/digest) notification।</p></div>
<div class="card"><b>প্র৫. OTP ও marketing একই পথে গেলে কী সমস্যা?</b>
<p>Marketing-এর বিপুল স্রোত OTP আটকে দেয়। আলাদা priority queue ও worker pool, এবং OTP-তে কড়া latency লক্ষ্য।</p></div>
<div class="card"><b>প্র৬. তৃতীয় পক্ষ ডাউন হলে?</b>
<p>Retry + backoff, circuit breaker, বিকল্প provider-এ failover (interface-ভিত্তিক বলে সহজ), queue-তে জমে থাকা notification পরে চলে। Provider-এর delivery metric দেখে alert।</p></div>

<h2 class="title">১১. Design a News Feed System</h2>
<p class="lead">Facebook home page, Instagram feed, Twitter timeline — সবার প্রশ্ন একটাই: <i>"আমি যাদের follow করি, তাদের সাম্প্রতিক পোস্ট দ্রুত দেখাও।"</i> এর ভেতরে লুকিয়ে আছে বিখ্যাত trade-off: <b>কাজটা write-এর সময় করবেন, নাকি read-এর সময়?</b></p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
<b>Fanout</b> (এক ঘটনা → বহু প্রাপক) notification, group chat, activity feed — সবখানে লাগে। আর "Celebrity সমস্যা" (একজনের কারণে সিস্টেম ধীর) বোঝা মানে hotspot-এর সাধারণ সমাধান বোঝা।</div>

<h3>১১.১ Scope ও হিসাব</h3>
<p>ধরে নিলাম: Web + Mobile; পোস্ট করা ও বন্ধুদের feed দেখা; feed <b>reverse chronological</b> (ranking বাদ); সর্বোচ্চ ৫,০০০ বন্ধু; ১ কোটি DAU; ছবি/ভিডিও আছে।</p>
<pre>
<span class="c">// ধারণা: প্রতিজন দিনে ১০ বার feed খোলে, ১টা পোস্ট করে, গড় ২০০ follower; feed cache-এ ৫০০ ID × ৮ byte</span>
Feed read QPS   = 10M × 10 ÷ 86,400      ≈ 1,160   (peak ×3 ≈ 3,500)
Post write QPS  = 10M × 1  ÷ 86,400      ≈ 116
Fanout write/s  = 116 × 200              ≈ 23,200  ← write amplification!
Feed cache      = 10M × 500 × 8 B        = 40 GB
</pre>
<div class="callout best"><span class="tag">হিসাব থেকে সিদ্ধান্ত</span>
Read কম, কিন্তু ১ পোস্ট = ২০০ cache write — তাই fanout <b>asynchronous (queue)</b>। Cache-এ <b>শুধু ID</b> (৪০ GB; পুরো object হলে ১০০ গুণ)। Celebrity-র ৫০ লাখ follower হলে ১ পোস্ট = ৫০ লাখ write — গড়ের হিসাব সেখানে অচল।</div>

<h3>১১.২ High-Level Design — দুটো প্রবাহ</h3>
<pre>
POST /v1/me/feed                           <span class="c">// body: { "content": "Hello" }</span>
GET  /v1/me/feed?limit=20&amp;cursor=&lt;last&gt;     <span class="c">// token Authorization header-এ; cursor pagination (offset নয়)</span>
</pre>
<div class="diagram"><pre>
 PUBLISH:  User ─► LB ─► Web Server (auth + rate limit) ─► Post Service ─► Post DB + Cache
                                         └─► Fanout Service ─► বন্ধুদের Feed Cache-এ post_id
                                         └─► Notification Service

 RETRIEVE: User ─► LB ─► Web Server ─► News Feed Service ─► Feed Cache (post_id তালিকা)
                                          └─► Post/User Cache থেকে "hydrate" ─► JSON    (media ◄─ CDN)
</pre></div>

<h3>১১.৩ Deep Dive — Fanout: Push বনাম Pull</h3>
<div class="diagram"><pre>
 Fanout on WRITE (Push)                      Fanout on READ (Pull)
 Alice পোস্ট করল → ২০০ জনের feed cache-এ    Bob feed খুলল → ৩০০ বন্ধুর পোস্ট টেনে merge-sort
 Read: ১টা lookup, অতি দ্রুত                 Write: ১টা row, সহজ; Read: ধীর
</pre></div>
<table>
<tr><th></th><th>Push (write-এ)</th><th>Pull (read-এ)</th></tr>
<tr><td>Read latency</td><td>✅ অতি দ্রুত</td><td>❌ ধীর</td></tr>
<tr><td>Write খরচ</td><td>❌ followers × write</td><td>✅ ন্যূনতম</td></tr>
<tr><td>Celebrity (hotkey)</td><td>❌ ৫০ লাখ write, দেরি</td><td>✅ সমস্যা নেই</td></tr>
<tr><td>নিষ্ক্রিয় user</td><td>❌ অপচয়</td><td>✅ অপচয় নেই</td></tr>
</table>
<p><b>Hybrid (বাস্তব উত্তর):</b> সাধারণ user-এর পোস্ট <b>push</b> (read দ্রুত রাখতে); বেশি-follower অ্যাকাউন্টের পোস্ট <b>pull</b>। Read-এ নিজের feed cache + যে celebrity-দের follow করি তাদের সাম্প্রতিক পোস্ট <b>merge</b>। Threshold (ধরুন ১ লাখ follower) অনুমানে নয়, fanout queue lag ও p99 দেখে ঠিক করুন।</p>
<div class="callout behind"><span class="tag">পর্দার পেছনে</span>
বইয়ে hotkey-তে consistent hashing-এর কথা আছে; তবে সেটা key-কে <i>ছড়ায়</i>, <b>একটাই hot key</b>-কে নয়। Hot key-র জন্য আলাদা সমাধান: pull মডেল, বা key-কে একাধিক ভাগে split ও replicate।</div>

<h4>Fanout Service-এর ধাপ</h4>
<div class="diagram"><pre>
 নতুন পোস্ট (post_id, author)
  ১. Social Graph থেকে friend IDs        ২. User Cache থেকে সেটিং — mute/block ছেঁকে ফেলো
  ৩. (friend_ids, post_id) ─► Message Queue
  ৪. Fanout Workers ─► প্রতিটা বন্ধুর Feed Cache-এ post_id  (সীমা: সর্বশেষ ৫০০টা)
</pre></div>
<p>Queue-র কারণে পোস্টকারী সঙ্গে সঙ্গে উত্তর পায়; বন্ধুর feed-এ কয়েক সেকেন্ড দেরিতে দেখালে ক্ষতি নেই — <b>eventual consistency</b>। সীমা (৫০০) রাখায় cache ছোট থাকে; কেউ হাজার পোস্ট স্ক্রল করে না, তাই miss কম।</p>

<h4>C# — Redis Sorted Set দিয়ে Feed Cache</h4>
<pre>
public sealed class FeedCache(IConnectionMultiplexer redis)
{
    private const int Max = 500;
    private IDatabase Db =&gt; redis.GetDatabase();
    private static string Key(long uid) =&gt; $"feed:{uid}";

    public async Task PushAsync(long followerId, long postId, DateTimeOffset at)   <span class="c">// fanout worker ডাকে</span>
    {
        await Db.SortedSetAddAsync(Key(followerId), postId, at.ToUnixTimeMilliseconds());
        await Db.SortedSetRemoveRangeByRankAsync(Key(followerId), 0, -(Max + 1));  <span class="c">// নতুন ৫০০টা রেখে ছাঁটো</span>
    }

    public async Task&lt;IReadOnlyList&lt;long&gt;&gt; PageAsync(long uid, double? cursor, int limit = 20)
    {
        var items = await Db.SortedSetRangeByScoreAsync(Key(uid), double.NegativeInfinity,
            cursor ?? double.PositiveInfinity, Exclude.Stop, Order.Descending, take: limit);
        return items.Select(i =&gt; (long)i).ToList();
    }
}</pre>
<h4>C# — Hybrid Read (push + celebrity pull merge)</h4>
<pre>
public async Task&lt;IReadOnlyList&lt;long&gt;&gt; BuildFeedAsync(long uid, int limit = 20)
{
    var pushed = await _feedCache.PageWithScoreAsync(uid, limit);               <span class="c">// (postId, score) — সাধারণ বন্ধুদের</span>
    var celebs = await _graph.GetFollowedCelebritiesAsync(uid);                 <span class="c">// ধরুন ≤ ২০ জন</span>
    var pulled = await Task.WhenAll(celebs.Select(c =&gt; _postCache.RecentAsync(c, limit)));

    return pushed.Concat(pulled.SelectMany(x =&gt; x))
                 .OrderByDescending(p =&gt; p.Score)                               <span class="c">// সময় অনুযায়ী merge</span>
                 .Take(limit).Select(p =&gt; p.PostId).ToList();                   <span class="c">// তারপর hydrate</span>
}</pre>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span>
(১) Fanout synchronous করা — পোস্ট API ঝুলে যায়। (২) cache-এ পুরো post object রাখা — edit/delete ২০০ জায়গায়। (৩) Delete হলে hydrate-এ "পাওয়া যায়নি" চুপচাপ বাদ না দেওয়া (lazy cleanup)।</div>

<h3>১১.৪ Retrieval ও Cache স্তর</h3>
<p>Feed cache থেকে ID নিয়ে <b>hydrate</b>: Post, User, Counter cache থেকে <code>MGET</code>/pipeline-এ একবারে (২০টা আলাদা call নয়); miss হলে DB থেকে এনে cache ভরা। Cache পাঁচ স্তরে:</p>
<table>
<tr><th>স্তর</th><th>রাখে</th></tr>
<tr><td>News Feed</td><td>প্রতি user-এর post_id তালিকা</td></tr>
<tr><td>Content</td><td>পোস্টের তথ্য (জনপ্রিয়গুলো hot cache)</td></tr>
<tr><td>Social Graph</td><td>কে কাকে follow করে</td></tr>
<tr><td>Action</td><td>আমি কোন পোস্ট like/reply করেছি</td></tr>
<tr><td>Counters</td><td>like/reply/follower সংখ্যা (<code>INCR</code>, <code>COUNT(*)</code> নয়)</td></tr>
</table>
<p>বিস্তারিত: <a href="systemdesign.html" style="color:var(--accent2)">Caching অধ্যায়</a>, <a href="redis.html" style="color:var(--accent2)">Redis কোর্স</a>।</p>

<h3>১১.৫ Wrap Up — Failure ও আলোচনা</h3>
<table>
<tr><th>পরিস্থিতি</th><th>করণীয়</th></tr>
<tr><td>Fanout queue lag</td><td>Lag-এ alert, worker auto-scale, বড় অ্যাকাউন্টের আলাদা queue</td></tr>
<tr><td>Feed cache node মরল</td><td>Pull দিয়ে feed পুনর্নির্মাণ (fallback); replica রাখুন</td></tr>
<tr><td>Delete/Block/Unfollow</td><td>Hydrate-এ ফিল্টার + background cache cleanup</td></tr>
</table>
<p>বাড়তি পয়েন্ট: DB replica/sharding, stateless web tier, multi-DC, queue দিয়ে decoupling; metric — peak QPS, feed latency p99, fanout lag, cache hit ratio।</p>

<h3>১১.৬ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Push না Pull — কীভাবে বাছবেন?</b>
<p>Read-heavy ও latency মুখ্য হলে push; কিন্তু বেশি follower-এ push ব্যয়বহুল, সেখানে pull। বাস্তবে hybrid: সাধারণ → push, celebrity → pull, read-এ merge।</p></div>
<div class="card"><b>প্র২. Celebrity সমস্যা কী ও সমাধান?</b>
<p>এক পোস্টে লক্ষ-কোটি feed আপডেট করতে queue/cache ওভারলোড হয়। Celebrity-র জন্য push বন্ধ, সাম্প্রতিক পোস্ট hot cache-এ, read-এ merge।</p></div>
<div class="card"><b>প্র৩. Cache-এ ID রাখি কেন, পুরো post নয়?</b>
<p>মেমরি অনেক কম, আর edit/delete এক জায়গায়। বিনিময়: hydration লাগে — batch করে খরচ কমে।</p></div>
<div class="card"><b>প্র৪. Cursor বনাম offset?</b>
<p>Cursor। নতুন পোস্ট এলে offset সরে যায় — duplicate/হারানো পোস্ট দেখা যায়।</p></div>
<div class="card"><b>প্র৫. পোস্ট delete হলে বন্ধুদের feed থেকে সরবে কীভাবে?</b>
<p>২০০ cache ঘেঁটে মোছা ব্যয়বহুল; hydrate-এ deleted বাদ (lazy), পরে async cleanup।</p></div>
<div class="card"><b>প্র৬. Ranked (ML) feed যোগ করলে কী বদলাবে?</b>
<p>Candidate (কয়েকশো) তুলে ranking service-এ score করে সাজাতে হয় — read-path ভারী হয়, latency বাজেট কড়া; pre-computation ও caching আরও জরুরি।</p></div>

<h2 class="title">১২. Design a Chat System</h2>
<p class="lead">WhatsApp, Messenger, Slack, Discord — সবাই "chat app", কিন্তু সমস্যা আলাদা। তাই প্রথমে ঠিক করুন <b>কোন ধরনের chat</b>। এই অধ্যায়ের নতুন শিক্ষা: <b>persistent connection (WebSocket)</b>, <b>stateful service</b> আর <b>message ordering</b>।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
এতদিন client চেয়েছে, server দিয়েছে। Chat-এ <b>server নিজে থেকে client-কে ঠেলে দেয়</b> — live dashboard, ride tracking, trading ticker সবখানে একই ধারণা। আর "stateless web tier" নীতির সবচেয়ে বড় ব্যতিক্রম এখানে।</div>

<h3>১২.১ Scope ও হিসাব</h3>
<p>1-1 ও group (সর্বোচ্চ ১০০ জন); web + mobile; ৫ কোটি DAU; শুধু text (&lt; ১ লাখ অক্ষর); online indicator, multi-device, push notification; history চিরকাল।</p>
<pre>
<span class="c">// ধারণা: ৪০ মেসেজ/user/দিন, ১০০ byte; peak concurrent = DAU-র ২০%; connection ≈ ১০ KB, এক সার্ভারে ১ লাখ</span>
Message / দিন = 50M × 40          = 2 × 10^9        QPS ≈ 23,000 (peak ≈ 46,000)
Storage       = 2×10^9 × 100 B    = 200 GB/দিন  ≈ 73 TB/বছর
Connection    = 10M × 10 KB       = 100 GB RAM     Chat server = 10M ÷ 100K = ~100 টা
Heartbeat     = 10M ÷ 5s = 2,000,000/s ;  ÷ 30s ≈ 333,000/s
</pre>
<div class="callout best"><span class="tag">সিদ্ধান্ত</span>
মেসেজ QPS বড় নয়; কঠিন হলো <b>১ কোটি স্থায়ী connection ধরে রাখা</b>। Heartbeat-এর ফ্রিকোয়েন্সিও সরাসরি লোড — ৫ সেকেন্ড বিপজ্জনক, ৩০ সেকেন্ড সহনীয়।</div>

<h3>১২.২ Client-Server যোগাযোগ: Polling → Long Polling → WebSocket</h3>
<p>Sender-এর দিকে সাধারণ HTTP চলে; সমস্যা receiver-এর দিকে — HTTP-তে server নিজে থেকে পাঠাতে পারে না।</p>
<table>
<tr><th></th><th>Polling</th><th>Long Polling</th><th>WebSocket</th></tr>
<tr><td>কীভাবে</td><td>client বারবার জিজ্ঞেস করে</td><td>মেসেজ না আসা পর্যন্ত connection খোলা রাখে</td><td>একটা স্থায়ী দ্বিমুখী connection</td></tr>
<tr><td>দুর্বলতা</td><td>বেশিরভাগ উত্তর "না" — অপচয়</td><td>sender-receiver ভিন্ন server-এ পড়তে পারে; disconnect ধরা কঠিন</td><td>connection management জটিল (stateful)</td></tr>
<tr><td>Latency</td><td>ব্যবধান পর্যন্ত</td><td>ভালো</td><td>সর্বোত্তম</td></tr>
</table>
<div class="diagram"><pre>
 Client ──HTTP Upgrade──► Server ──101 Switching Protocols──► ═══ স্থায়ী দ্বিমুখী WebSocket ═══
 (পোর্ট ৮০/৪৪৩ — firewall সমস্যা কম;  sender ও receiver দুই দিকেই ব্যবহার করা যায়)
</pre></div>
<div class="callout behind"><span class="tag">পর্দার পেছনে</span>
ASP.NET Core SignalR <b>transport negotiation</b> করে: WebSocket → Server-Sent Events → Long Polling। Proxy WebSocket আটকালেও আপনার কোড একই থাকে। Mobile app background-এ গেলে connection কাটে — তখন push notification-ই ভরসা।</div>

<h3>১২.৩ High-Level Design</h3>
<p>সব WebSocket নয় — login/signup/profile সাধারণ HTTP। তিন বিভাগ:</p>
<div class="diagram"><pre>
 Client ──HTTP──► LB ─► API Servers (stateless: login, profile, group)  ─► Service Discovery
 Client ══WebSocket══► [ Chat Servers ] (stateful: প্রতি client-এর স্থায়ী connection)
                          ├─► [ Presence Servers ]            online/offline
                          ├─► [ Message Sync Queue ] ─► [ KV Store: chat history ]
                          └─► [ Notification Servers ] ─► APNs / FCM
</pre></div>
<p><b>Storage:</b> profile/বন্ধু/group-সদস্য → relational DB। <b>Chat history</b> → KV/wide-column (Cassandra, HBase, DynamoDB, Cosmos DB): বিপুল ডেটা, শুধু সাম্প্রতিক চ্যাট ঘনঘন পড়া (long tail), read:write ≈ ১:১, সহজ horizontal scaling। ছোট scale-এ PostgreSQL-ও দিব্যি চলে — scale দিয়ে যুক্তি দিন।</p>
<pre>
<span class="c">-- Cassandra স্টাইল: একটা channel-এর সব মেসেজ একই partition-এ, message_id দিয়ে সাজানো</span>
CREATE TABLE messages (channel_id bigint, message_id bigint, sender_id bigint, body text,
  PRIMARY KEY (channel_id, message_id)) WITH CLUSTERING ORDER BY (message_id DESC);
<span class="c">-- আগের পাতা:  SELECT * FROM messages WHERE channel_id=? AND message_id &lt; ? LIMIT 50;</span></pre>

<h3>১২.৪ Message ID — ক্রমের চাবিকাঠি</h3>
<p><code>created_at</code> দিয়ে ক্রম হয় না (একই মিলিসেকেন্ডে দুটো মেসেজ)। <code>message_id</code> হতে হবে <b>unique ও time-sortable</b>:</p>
<table>
<tr><th>উপায়</th><th>মন্তব্য</th></tr>
<tr><td>DB <code>auto_increment</code></td><td>বেশিরভাগ NoSQL-এ নেই</td></tr>
<tr><td>Global 64-bit generator (Snowflake — অধ্যায় ৭)</td><td>Unique + time-sortable, সমন্বয় ছাড়া</td></tr>
<tr><td>Local sequence (প্রতি channel-এ)</td><td>আমাদের শুধু channel-এর <i>ভেতরের</i> ক্রম দরকার; Redis <code>INCR seq:{channelId}</code> দিয়ে সহজ</td></tr>
</table>

<h3>১২.৫ Deep Dive</h3>
<h4>Service Discovery ও 1-1 flow</h4>
<div class="diagram"><pre>
 Login ─► API Server ─► Service Discovery (ZooKeeper/etcd/Consul): "সেরা chat server?" ─► A connect করে chat-server-2

 A ─মেসেজ─► Chat Server 1 ─১. ID নাও ─২. Sync Queue ─৩. KV Store-এ সংরক্ষণ
                    ├─ B online  → Chat Server 2 ═WebSocket═► B
                    └─ B offline → Notification Server ─► push (APNs/FCM)
</pre></div>
<p><b>মূল নিয়ম: আগে durable store, তারপর deliver</b> — B offline থাকলেও মেসেজ হারায় না। Chat Server 1 কীভাবে জানে B কোথায়? Redis-এ <code>user → server</code> registry বা pub/sub।</p>
<h4>Delivery ও duplicate</h4>
<p>Client প্রতি মেসেজে <b>client-generated ID (idempotency key)</b> পাঠায়; server ACK দেয়; ACK না এলে retry; server <code>(sender, client_msg_id)</code> দেখে duplicate ঠেকায়। অর্থাৎ <b>at-least-once + idempotent</b>। Client <code>message_id</code> দিয়ে সাজায়, arrival-order দিয়ে নয়।</p>
<h4>Multi-device sync</h4>
<p>প্রতি device নিজের <code>cur_max_message_id</code> রাখে। Reconnect-এ "recipient = আমি ও message_id &gt; cur_max_message_id" মেসেজ KV store থেকে টেনে আনে — ঘুমন্ত device নিজেই ধরে ফেলে।</p>
<h4>Group chat</h4>
<p>ছোট group (≤ ১০০): প্রতি সদস্যের <b>inbox queue-তে কপি</b> (fanout on write) — client শুধু নিজের inbox দেখে, sync সরল। ১ লাখ সদস্যের channel-এ ১ মেসেজ = ১ লাখ কপি অচল — সেখানে একটা কপি, সদস্যরা pull (অধ্যায় ১১-এর celebrity সমাধানের মতো)।</p>
<h4>Online presence — Heartbeat</h4>
<p>Disconnect-এ সঙ্গে সঙ্গে offline করলে green dot ঝিকমিক করে (টানেলে ঢুকলেই)। তাই <b>heartbeat</b>: client নির্দিষ্ট বিরতিতে পাঠায়; <b>x সেকেন্ড</b> না পেলে তবেই offline। Redis-এ সুন্দর বাস্তবায়ন: প্রতি heartbeat-এ <code>SET presence:{userId} 1 EX 60</code> — heartbeat থামলে key নিজে মুছে যায়। বন্ধুদের জানাতে pub/sub (প্রতি জুটির channel); বড় group-এ push নয়, দেখার সময় pull।</p>

<h3>১২.৬ .NET — ASP.NET Core SignalR</h3>
<pre>
builder.Services.AddSignalR().AddStackExchangeRedis("localhost:6379");  <span class="c">// backplane: ভিন্ন server-এর user-এর কাছেও পৌঁছায়</span>
app.MapHub&lt;ChatHub&gt;("/chat");

[Authorize]
public sealed class ChatHub(IMessageStore store, IPresenceService presence, INotifier push) : Hub
{
    public override async Task OnConnectedAsync()
    { await presence.TouchAsync(Context.UserIdentifier!); await base.OnConnectedAsync(); }

    public Task Heartbeat() =&gt; presence.TouchAsync(Context.UserIdentifier!);   <span class="c">// SET presence:{id} EX 60</span>

    public async Task SendDirect(string toUserId, string text, string clientMsgId)
    {
        var msg = await store.SaveIdempotentAsync(Context.UserIdentifier!, toUserId, text, clientMsgId); <span class="c">// ১. আগে সংরক্ষণ</span>
        await Clients.Caller.SendAsync("Ack", clientMsgId, msg.Id);                                       <span class="c">// ২. ACK</span>
        if (await presence.IsOnlineAsync(toUserId))
            await Clients.User(toUserId).SendAsync("ReceiveMessage", msg);                                <span class="c">// ৩a. সব device-এ</span>
        else
            await push.SendAsync(toUserId, "নতুন মেসেজ");                                                  <span class="c">// ৩b. push</span>
    }

    public Task&lt;IReadOnlyList&lt;ChatMessage&gt;&gt; SyncSince(long curMaxMessageId)       <span class="c">// reconnect / multi-device</span>
        =&gt; store.GetNewForUserAsync(Context.UserIdentifier!, curMaxMessageId);
}</pre>
<div class="callout mistake"><span class="tag">সতর্কতা</span>
Redis backplane সব server-এ প্রতিটা মেসেজ পাঠায় — বিশাল scale-এ বাড়তি traffic; তখন Azure SignalR Service বা user→server registry দিয়ে targeted routing। আর Hub-এ <b>authorization</b> (group সদস্যপদ যাচাই) ও <b>rate limit</b> (অধ্যায় ৪) ভুলবেন না।</div>

<h3>১২.৭ Wrap Up</h3>
<table>
<tr><th>বিষয়</th><th>নোট</th></tr>
<tr><td>Chat server crash</td><td>Client auto-reconnect (exponential backoff + jitter — নইলে thundering herd); service discovery নতুন server দেয়; <code>SyncSince</code> দিয়ে মিস করা মেসেজ</td></tr>
<tr><td>Media</td><td>Object storage + CDN, compression, thumbnail; chat-এ শুধু URL</td></tr>
<tr><td>E2E encryption</td><td>Server শুধু ciphertext দেখে — server-side search/spam-filter কঠিন</td></tr>
<tr><td>Monitoring</td><td>Connected user, p99 send→deliver latency, ACK failure, push delivery, queue lag</td></tr>
</table>

<h3>১২.৮ নিজে করুন</h3>
<ol>
<li>ছোট SignalR chat বানান (দুই browser tab) ও Redis TTL দিয়ে presence যোগ করুন।</li>
<li>Heartbeat ২০ সেকেন্ড, ৫০ লাখ concurrent user — প্রতি সেকেন্ডে heartbeat load? (<code>5,000,000 ÷ 20 = 250,000/s</code>)</li>
<li>১০ কোটি মেসেজ/দিন, ১২০ byte, ৩ বছর, ৩× replication — মোট storage? (<code>12 GB × 1095 ≈ 13.1 TB; ×3 ≈ 39.4 TB</code>)</li>
</ol>

<h3>১২.৯ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Chat-এ WebSocket কেন, polling নয়?</b>
<p>Server-কে client-এ ঠেলতে হয়; polling অধিকাংশ সময় "কিছু নেই" উত্তরে সম্পদ নষ্ট করে ও দেরি বাড়ায়। WebSocket কম latency ও overhead দেয়; বিনিময়ে stateful connection সামলাতে হয়।</p></div>
<div class="card"><b>প্র২. Stateful chat server scale করবেন কীভাবে?</b>
<p>Connection-ক্ষমতা অনুযায়ী horizontal; service discovery-তে load-সচেতন বণ্টন; cross-server delivery-র জন্য pub/sub বা registry; deploy-এ graceful drain; history/presence বাইরের store-এ।</p></div>
<div class="card"><b>প্র৩. মেসেজের ক্রম কীভাবে নিশ্চিত করবেন?</b>
<p><code>created_at</code> নয়; time-sortable <code>message_id</code> (Snowflake) বা channel-ভিত্তিক sequence। Channel-এর ভেতরের ক্রমই যথেষ্ট।</p></div>
<div class="card"><b>প্র৪. Offline user-এর মেসেজ?</b>
<p>আগে durable store; online হলে WebSocket push, নইলে push notification; reconnect-এ <code>cur_max_message_id</code> থেকে pull।</p></div>
<div class="card"><b>প্র৫. Online status-এ flicker এড়াবেন কীভাবে?</b>
<p>Heartbeat + timeout (grace period); সময়ের মধ্যে ফিরলে status অপরিবর্তিত। Redis TTL এটা সহজ করে।</p></div>
<div class="card"><b>প্র৬. "Exactly once" delivery সম্ভব?</b>
<p>নেটওয়ার্কে নয়; at-least-once + idempotent processing (client ID, ACK, retry, server-এ duplicate শনাক্ত)। দেখুন <a href="distsys.html" style="color:var(--accent2)">Distributed Systems কোর্স</a>।</p></div>

<h2 class="title">১৩. Design a Search Autocomplete System</h2>
<p class="lead">Google বা Daraz-এ টাইপ করতেই নিচে suggestion আসে — একে autocomplete, typeahead বা "Design Top-K" প্রশ্ন বলে। এটা যত না system design, তত <b>data structure (Trie)</b> ও <b>latency-র</b> গল্প: ১০০ ms-এর মধ্যে উত্তর না এলে টাইপ করতে করতে UI "আটকে" যায়।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
এখানে দুটো বড় শিক্ষা: (১) <b>Space দিয়ে time কেনা</b> — প্রতিটা node-এ আগে থেকে top-K রেখে query O(1) করা; (২) <b>Read path ও Write path আলাদা করা</b> — query সার্ভিস দ্রুত read করে, আর trie বানানো হয় অফলাইনে। সার্চ box, tag-suggestion, command palette — সবখানে লাগে।</div>

<h3>১৩.১ Scope ও হিসাব</h3>
<p>ধরে নিলাম: শুধু <b>prefix</b> মিল (শুরু থেকে); ৫টা suggestion; ক্রম = ঐতিহাসিক জনপ্রিয়তা (query frequency); spell-check নেই; ইংরেজি lowercase; ১ কোটি DAU; উত্তর ≤ ১০০ ms; high availability।</p>
<pre>
<span class="c">// ধারণা: ১০ search/user/দিন; ২০ অক্ষর/query; প্রতি অক্ষরে একটা request</span>
QPS       = 10M × 10 × 20 ÷ 86,400   ≈ 23,000   (বই ~২৪,০০০ ধরেছে)   peak ×2 ≈ 46,000
নতুন ডেটা = 10M × 10 × 20 B × 20%     = 400 MB/দিন  (২০% query নতুন)

<div class="callout best"><span class="tag">সিদ্ধান্ত</span>
৪৬K peak QPS database-এ সরাসরি মারা যাবে না — <b>in-memory trie/cache</b> লাগবে। আবার প্রতি অক্ষরে request মানে বাড়তি ২০× load; client-এ <b>debounce</b> (~১৫০-৩০০ ms থামলে তবেই request) এটা ৩-৫ গুণ কমায়।</div>

<h3>১৩.২ High-Level Design — দুই সার্ভিস</h3>
<div class="diagram"><pre>
 Data Gathering Service: ব্যবহারকারীর query সংগ্রহ → frequency table  (query, frequency)
 Query Service         : prefix দিলে সবচেয়ে বেশি-searched ৫টা ফেরত

 প্রাথমিক (SQL): SELECT query FROM freq WHERE query LIKE 'tw%' ORDER BY frequency DESC LIMIT 5;
 → ছোট ডেটায় চলে; বড় ডেটায় database bottleneck।  সমাধান: Trie।
</pre></div>

<h3>১৩.৩ Trie ও Top-K Cache</h3>
<p><b>Trie (prefix tree)</b>: root = খালি string; প্রতিটা node একটা অক্ষর; root থেকে node পর্যন্ত পথ = prefix; শব্দের শেষ node চিহ্নিত ও তাতে frequency।</p>
<div class="diagram"><pre>
        (root)
        /    \
       t      w                 query: tree(10) try(29) true(35) toy(14) wish(25) win(50)
      / \      \
     r   o      i
    /|\   \    / \
   e u y   y  s   n
   e e        h
 প্রতিটা node-এ আগে থেকে সংরক্ষিত top-5:   node "tr" → [true:35, try:29, tree:10]
</pre></div>
<p><b>Naive অ্যালগরিদম</b> (k = top-k সংখ্যা): prefix খোঁজো <code>O(p)</code> → subtree-র সব valid শব্দ ঘোরো <code>O(c)</code> → sort করো <code>O(c log c)</code>। Worst case পুরো trie ঘুরতে হয় — অতি ধীর।</p>
<table>
<tr><th>Optimization</th><th>ফল</th><th>খরচ</th></tr>
<tr><td>Prefix-এর দৈর্ঘ্য সীমিত (যেমন ৫০ অক্ষর)</td><td>"prefix খোঁজা" ⇒ O(1) (ধ্রুবক)</td><td>লম্বা query-র suggestion নেই (কেউ চায়ও না)</td></tr>
<tr><td><b>প্রতি node-এ top-K cache</b></td><td>"top-K আনা" ⇒ O(1)</td><td>বেশি memory — <b>space দিয়ে time কেনা</b></td></tr>
</table>

<h4>C# — Top-K cached Trie</h4>
<pre>
public sealed class AutocompleteTrie(int k = 5)
{
    private sealed class Node
    {
        public readonly Dictionary&lt;char, Node&gt; Next = new();
        public readonly List&lt;(string Query, long Freq)&gt; Top = new();   <span class="c">// এই prefix-এর top-K</span>
    }
    private readonly Node _root = new();

    public void Upsert(string query, long freq)             <span class="c">// workers trie বানানোর সময় ডাকে</span>
    {
        var node = _root; Touch(node, query, freq);
        foreach (var ch in query)
        {
            if (!node.Next.TryGetValue(ch, out var child)) node.Next[ch] = child = new Node();
            node = child;
            Touch(node, query, freq);                       <span class="c">// প্রতিটা ancestor-এর top-K আপডেট</span>
        }
    }

    private void Touch(Node n, string q, long f)
    {
        var i = n.Top.FindIndex(x =&gt; x.Query == q);
        if (i &gt;= 0) n.Top[i] = (q, f); else n.Top.Add((q, f));
        n.Top.Sort((a, b) =&gt; b.Freq.CompareTo(a.Freq));
        if (n.Top.Count &gt; k) n.Top.RemoveRange(k, n.Top.Count - k);
    }

    public IReadOnlyList&lt;string&gt; Suggest(string prefix)    <span class="c">// O(p) — p ছোট, তাই কার্যত O(1)</span>
    {
        var node = _root;
        foreach (var ch in prefix)
            if (!node.Next.TryGetValue(ch, out node)) return Array.Empty&lt;string&gt;();
        return node.Top.Select(t =&gt; t.Query).ToList();
    }
}</pre>
<div class="callout mistake"><span class="tag">সীমা</span>
এই কোড frequency <b>বাড়াতে</b> ঠিক; কিন্তু কোনো query-র frequency কমে (বা delete হলে) top-K-তে অন্য query-কে ফিরিয়ে আনতে node-এর পুরো subtree আবার দেখতে হবে। তাই বাস্তবে trie <b>সম্পূর্ণ নতুন করে বানিয়ে</b> বদলানো হয় (১৩.৪), node ধরে ধরে আপডেট নয়।</div>

<h3>১৩.৪ Deep Dive — Data Gathering (Write Path)</h3>
<p>প্রতিটা query-তে real-time trie আপডেট অব্যবহারিক: দিনে বিলিয়ন query, আর top suggestion ঘনঘন বদলায় না। তাই:</p>
<div class="diagram"><pre>
 Search logs ─► [ Analytics Log ] (append-only, raw)
                    │  Aggregators (সাপ্তাহিক; Twitter-ধরনে মিনিটে মিনিটে)
                    ▼
            [ Aggregated Data: query, week, frequency ]
                    │  Workers (নির্ধারিত সময়ে trie বানায়)
                    ▼
     [ Trie DB: snapshot বা key-value ] ──► [ Trie Cache (distributed, in-memory) ]
</pre></div>
<ul>
<li><b>Trie DB-র দুই রূপ:</b> (১) <b>Document store</b> — trie serialize করে snapshot (MongoDB); (২) <b>Key-value</b> — প্রতিটা prefix একটা key, node-এর top-K একটা value: <code>"tr" → ["true:35","try:29",...]</code> — Redis/DynamoDB-তে সরাসরি lookup।</li>
<li><b>Update:</b> সাপ্তাহিক নতুন trie বানিয়ে পুরোনোটা বদলে দিন (পছন্দের পথ); বা node ধরে আপডেট (ধীর; আপডেট হলে root পর্যন্ত সব ancestor বদলাতে হয়)।</li>
<li><b>Delete/Filter:</b> আপত্তিকর/বিপজ্জনক suggestion সরাতে cache-এর সামনে <b>filter layer</b> (rule বদলানো সহজ), আর পরের trie build-এ ডেটা থেকেও মুছে ফেলা।</li>
<li><b>Data sampling:</b> প্রতি N-তম query log করলেই জনপ্রিয়তা বোঝা যায় — storage ও processing বাঁচে।</li>
</ul>

<h3>১৩.৫ Deep Dive — Query Service (Read Path)</h3>
<div class="diagram"><pre>
 Browser ─► LB ─► API Server ─► Trie Cache (prefix key) ──hit──► ৫টা suggestion ─► Filter ─► ফেরত
                                    └─ miss/মরেছে ─► Trie DB থেকে এনে cache ভরো
</pre></div>
<p>গতি বাড়ানোর কৌশল: <b>AJAX</b> (পেজ রিফ্রেশ ছাড়া), <b>Browser caching</b> (সাময়িক জনপ্রিয় suggestion একই ঘণ্টায় বদলায় না — Google <code>private, max-age=3600</code> দেয়), <b>debounce</b>, আর CDN/edge-এ জনপ্রিয় prefix।</p>
<pre>
<span class="c">// ASP.NET Core minimal API — client-এ ১ ঘণ্টা cache (Cache-Control: private, max-age=3600)</span>

{

<h3>১৩.৬ Storage Scale — Trie Sharding</h3>
<p>Trie এক সার্ভারে না ধরলে shard করতে হয়। সরল উপায়: <b>প্রথম অক্ষর</b> দিয়ে (a–m, n–z; ২৬ সার্ভার পর্যন্ত; তারপর দ্বিতীয় অক্ষর)। কিন্তু 'c' দিয়ে শুরু শব্দ 'x'-এর চেয়ে অনেক বেশি — <b>অসম বণ্টন</b>।</p>
<div class="callout best"><span class="tag">সমাধান — Shard Map Manager</span>
ঐতিহাসিক query বণ্টন বিশ্লেষণ করে ঠিক করুন: ধরুন 's' একাই একটা shard, আর 'u'–'z' মিলে আরেকটা। একটা <b>shard map</b> (lookup) বলে দেয় কোন prefix কোন সার্ভারে। প্রতি shard-এ replica রাখুন।</div>

<h3>১৩.৯ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. SQL <code>LIKE 'tw%'</code> কেন যথেষ্ট নয়?</b>
<p>বিশাল ডেটায় প্রতি অক্ষরে sort/scan ব্যয়বহুল; ৪৬K QPS-এ DB বসে যায়। Trie + in-memory cache prefix lookup-কে O(1)-এর কাছাকাছি আনে।</p></div>
<div class="card"><b>প্র২. প্রতি node-এ top-K রাখার ট্রেড-অফ?</b>
<p>Memory বাড়ে, কিন্তু query O(1)। Response time-ই এখানে মূল লক্ষ্য, তাই space দিয়ে time কেনা যুক্তিযুক্ত।</p></div>
<div class="card"><b>প্র৩. Trie real-time আপডেট না করে অফলাইনে বানাই কেন?</b>
<p>বিলিয়ন query প্রতিটা আপডেট query service ধীর করত; আর top-K ঘনঘন বদলায় না। Aggregate করে নির্ধারিত বিরতিতে নতুন trie বানিয়ে atomically বদলানো সস্তা ও নিরাপদ।</p></div>
<div class="card"><b>প্র৪. আপত্তিকর suggestion কীভাবে সরাবেন?</b>
<p>Cache-এর সামনে filter layer (দ্রুত, নমনীয়); একই সাথে source ডেটা থেকে মুছে পরের build-এ স্থায়ী সমাধান।</p></div>
<div class="card"><b>প্র৫. Trie shard করার সময় কী সমস্যা?</b>
<p>প্রথম-অক্ষর ভিত্তিতে অসম বণ্টন। ঐতিহাসিক ডেটা দেখে shard map manager দিয়ে ভারসাম্য; hot shard-এ replica।</p></div>
<div class="card"><b>প্র৬. Latency আরও কমাবেন কীভাবে?</b>
<p>Client debounce, browser cache (<code>Cache-Control</code>), edge/CDN-এ জনপ্রিয় prefix, Trie Cache-এ replica, সংক্ষিপ্ত payload, geo-কাছের server।</p></div>

<h2 class="title">১৪. Design YouTube — Video Streaming Platform</h2>
<p class="lead">YouTube বাইরে সরল: আপলোড করুন, play চাপুন। ভেতরে আছে <b>transcoding</b>, <b>adaptive streaming</b>, CDN-এর বিপুল খরচ ও নিরাপত্তা। এই নকশা Netflix-ধরনের যেকোনো video platform-এ খাটে। আমরা ৪ ধাপ (অধ্যায় <a href="#" data-go="framework">৩</a>) মেনে এগোব।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
এটা "বড় ফাইল + বিশাল read traffic + খরচ" সমস্যার সেরা পাঠ: কখন cloud service কিনবেন (blob storage, CDN), কীভাবে ভারী কাজকে <b>DAG</b>-এ ভেঙে সমান্তরালে চালাবেন, আর কেন <b>খরচ</b>ও একটা design requirement।</div>

<h3>১৪.১ Scope ও Estimation</h3>
<p><b>Scope:</b> ভিডিও আপলোড ও দেখা; mobile/web/smart TV; ৫০ লক্ষ DAU; আন্তর্জাতিক ব্যবহারকারী; সব resolution/format; encryption; সর্বোচ্চ ১ GB; cloud ব্যবহার করা যাবে। লক্ষ্য: দ্রুত upload, মসৃণ streaming, quality পরিবর্তন, কম খরচ, high availability।</p>
<p><b>ধারণা:</b> প্রতিজন দিনে ৫টা ভিডিও দেখে; ১০% দিনে ১টা আপলোড করে; গড় ভিডিও ৩০০ MB; CDN ≈ $০.০২/GB।</p>
<pre>
Upload / দিন   = 5M × 10% = 500,000  → ≈ 6/সেকেন্ড   (চাপ QPS-এ নয়, ফাইলের আকারে)
Storage / দিন  = 500,000 × 300 MB = 150 TB   → বছরে ≈ 55 PB (শুধু original)
Streaming/দিন  = 5M × 5 × 0.3 GB = 7.5M GB = 7.5 PB
CDN খরচ/দিন    = 7.5M GB × $0.02 = $150,000   (≈ $54.75M/বছর)
</pre>
<div class="callout best"><span class="tag">সিদ্ধান্ত</span>
ভিডিও DB-তে নয় — <b>blob storage</b>। সবচেয়ে বড় খরচ <b>CDN</b> — তাই cost optimization গভীর আলোচনার অংশ।</div>

<h3>১৪.২ High-Level Design</h3>
<p>Blob storage ও CDN আমরা <b>কিনে নেব</b> — Netflix AWS ব্যবহার করে, Facebook Akamai। Interview-তে "কোথায় কী কিনব" বলাই যথেষ্ট, ভেতরের নকশা নয়। ভিডিও streaming বাদে সব কাজ <b>API server</b>-এ (stateless)।</p>
<div class="diagram"><pre>
 প্রবাহ ক: আপলোড
  Client ─(১)─► Original Storage (blob)
                  │ (২)
                  ▼
           Transcoding Servers ─(৩ক)─► Transcoded Storage ─► CDN
                  └─(৩খ)─► [Completion Queue] ─► Completion Handler ─► Metadata DB + Cache
  API Server ─(৪)─► Client: "আপলোড সম্পন্ন, streaming-এর জন্য প্রস্তুত"

 প্রবাহ খ (সমান্তরালে): Client ─► API Server ─► Metadata (নাম, আকার, format) DB + Cache
</pre></div>
<p><b>Streaming:</b> পুরো ফাইল নামানো নয়; ডিভাইস CDN-এর নিকটতম edge থেকে একটু একটু করে পায় ও সঙ্গে সঙ্গে চালায়। Protocol: <b>HLS</b> (Apple), <b>MPEG-DASH</b> — ভিডিও ২-১০ সেকেন্ডের segment-এ ভেঙে HTTP-তে পাঠানো হয়; protocol ভেদে সমর্থিত encoding/player আলাদা।</p>
<div class="callout behind"><span class="tag">Adaptive Bitrate (ABR)</span>
প্রতিটা ভিডিও একাধিক quality-তে (২৪০p ~০.৪ Mbps … ১০৮০p ~৫-৮ Mbps, আনুমানিক) থাকে। Player প্রতিটা segment নামানোর বেগ মাপে: বেগ কমলে পরের segment নিচের quality-র, বাড়লে উপরের — buffering ছাড়াই।
<pre style="margin:8px 0 0">
#EXTM3U                                  <span class="c"># master.m3u8 (HLS)</span>
#EXT-X-STREAM-INF:BANDWIDTH=800000,RESOLUTION=640x360
360p/index.m3u8
#EXT-X-STREAM-INF:BANDWIDTH=2800000,RESOLUTION=1280x720
720p/index.m3u8</pre></div>

<h3>১৪.৩ Deep Dive ১ — Transcoding</h3>
<p>ক্যামেরার raw ভিডিও সরাসরি দেওয়া যায় না: (১) আকার বিশাল; (২) ডিভাইসভেদে সমর্থিত format আলাদা; (৩) bandwidth অনুযায়ী quality দরকার; (৪) নেটওয়ার্ক বদলালে quality বদলাতে হয়। Format-এর দুই অংশ: <b>Container</b> (ঝুড়ি: <code>.mp4</code>, <code>.mov</code> — ভিডিও+অডিও+metadata) ও <b>Codec</b> (সংকোচন algorithm: H.264, VP9, HEVC, AV1)।</p>
<p>হিসাব: ১০ মিনিট ভিডিও ২.৫ Mbps-এ = 2.5×10<sup>6</sup> × 600 ÷ 8 ≈ <b>১৮৭.৫ MB</b>; ৫ Mbps-এ ≈ ৩৭৫ MB — প্রতিটা rendition storage বাড়ায়।</p>

<h4>DAG model</h4>
<p>Creator-ভেদে চাহিদা আলাদা (watermark, নিজের thumbnail, HD) — তাই pipeline হয় <b>Directed Acyclic Graph</b>: node = task, edge = নির্ভরতা; নির্ভরতাহীন task <b>সমান্তরালে</b> চলে।</p>
<div class="diagram"><pre>
 ধাপ ১: Original ─► split ─► video / audio / metadata
 ধাপ ২:  video ─► inspection ─► (video-encoding ∥ thumbnail ∥ watermark)    audio ─► audio-encoding
 ধাপ ৩:  packaging (HLS/DASH segment + manifest) ─► Transcoded Storage ─► CDN
</pre></div>
<table>
<tr><th>Component</th><th>দায়িত্ব</th></tr>
<tr><td>Preprocessor</td><td>ভিডিওকে <b>GOP</b> (স্বাধীনভাবে চলা কয়েক সেকেন্ডের frame-গুচ্ছ) chunk-এ ভাগ; config থেকে DAG তৈরি; chunk ও metadata temp storage-এ cache — ব্যর্থ হলে retry-র জন্য</td></tr>
<tr><td>DAG Scheduler</td><td>DAG-কে stage-এ ভেঙে task queue-তে দেয়</td></tr>
<tr><td>Resource Manager</td><td>Task queue (priority), Worker queue, Running queue; Task Scheduler সেরা task↔worker জোড়া মেলায়</td></tr>
<tr><td>Task Workers</td><td>আসল কাজ (ভিন্ন worker ভিন্ন task)</td></tr>
<tr><td>Temporary Storage</td><td>metadata → memory/cache; ভিডিও-অডিও → blob; শেষে মুছে ফেলা হয়</td></tr>
</table>
<pre>
public record VideoTask(string Name, string[] DependsOn, Func&lt;CancellationToken, Task&gt; Run);

public static async Task RunDagAsync(IReadOnlyList&lt;VideoTask&gt; tasks, CancellationToken ct)
{
    var done = new HashSet&lt;string&gt;();
    var remaining = tasks.ToList();
    while (remaining.Count &gt; 0)
    {
        var stage = remaining.Where(t =&gt; t.DependsOn.All(done.Contains)).ToList();
        if (stage.Count == 0) throw new InvalidOperationException("চক্র আছে — এটা DAG নয়");
        await Task.WhenAll(stage.Select(t =&gt; t.Run(ct)));        <span class="c">// stage-এর সবাই একসাথে</span>
        foreach (var t in stage) { done.Add(t.Name); remaining.Remove(t); }
    }
}</pre>
<p>বাস্তবে এটা worker pool + queue দিয়ে চলে; ছোট দলের জন্য Azure Media Services/AWS MediaConvert-এর মতো <b>managed transcoding</b> বেছে নেওয়াই বুদ্ধিমানের কাজ।</p>

<h3>১৪.৪ Deep Dive ২ — Speed, Safety, Cost</h3>
<table>
<tr><th>লক্ষ্য</th><th>কৌশল</th><th>ব্যাখ্যা</th></tr>
<tr><td rowspan="3">Speed</td><td>Chunked, resumable upload</td><td>client ভিডিওকে chunk-এ ভেঙে সমান্তরালে পাঠায়; ছিঁড়লে শুধু ব্যর্থ chunk। ১ GB ÷ ৮ MB = ১২৮ chunk; ২০ Mbps-এ একটানা ≈ ৪০০ সেকেন্ড (৬.৭ মিনিট), ৯০% পরে ছিঁড়লে শুরু থেকে নয়।</td></tr>
<tr><td>কাছের upload center</td><td>CDN-কেই upload endpoint করা; এশিয়ার ব্যবহারকারী এশিয়ার center-এ।</td></tr>
<tr><td>Message queue দিয়ে loose coupling</td><td>"download → encode → upload" শৃঙ্খলে প্রতিটা ধাপ আগেরটার অপেক্ষায় থাকত; queue বসালে ধাপগুলো স্বাধীনভাবে সমান্তরালে চলে (<a href="kafka-mastery-bangla.html" style="color:var(--accent2)">Kafka</a>, <a href="rabbitmq.html" style="color:var(--accent2)">RabbitMQ</a>)।</td></tr>
<tr><td>Safety</td><td>Pre-signed URL / SAS</td><td>API server শুধু ছোট-আয়ুর, নির্দিষ্ট blob-এ শুধু-write URL দেয়; client সরাসরি storage-এ আপলোড — বড় ফাইল API server দিয়ে ঘোরে না।</td></tr>
<tr><td>Safety</td><td>ভিডিও সুরক্ষা</td><td><b>DRM</b> (FairPlay, Widevine, PlayReady — সবচেয়ে শক্ত), <b>AES encryption</b> + authorization, <b>visual watermark</b> (চুরি ঠেকায় না, উৎস শনাক্ত করে)।</td></tr>
<tr><td>Cost</td><td>Long-tail অনুযায়ী CDN</td><td>অল্প ভিডিও বেশিরভাগ view পায়: জনপ্রিয়গুলো CDN-এ, বাকি নিজস্ব storage server-এ; কম-দেখা ভিডিওর সব rendition না রেখে on-demand encode; আঞ্চলিক জনপ্রিয় ভিডিও শুধু সেই region-এ; খুব বড় হলে ISP-র সঙ্গে নিজস্ব CDN (Netflix Open Connect)।</td></tr>
</table>
<pre>
<span class="c">// Azure Blob — ১৫ মিনিটের write-only SAS URL</span>
public Uri CreateUploadUri(string videoId)
{
    var blob = _container.GetBlobClient($"originals/{videoId}.mp4");
    var sas = new BlobSasBuilder { BlobContainerName = _container.Name, BlobName = blob.Name,
                                   Resource = "b", ExpiresOn = DateTimeOffset.UtcNow.AddMinutes(15) };
    sas.SetPermissions(BlobSasPermissions.Create | BlobSasPermissions.Write);
    return blob.GenerateSasUri(sas);
}</pre>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span>
(১) CDN-এর খরচ পরিমাপ না করেই optimization — আগে view pattern বিশ্লেষণ করুন। (২) আপলোডের পর ফাইল যাচাই না করা — pre-signed URL যেকোনো ফাইল তুলতে দেয়, তাই inspection task-এ ধরন/আকার/malware দেখুন। (৩) Retry-তে ডুপ্লিকেট কাজ — task <b>idempotent</b> রাখুন (নির্ধারিত আউটপুট নাম: <code>videoId/720p/seg-0007.ts</code>)।</div>

<h3>১৪.৫ Error Handling ও Wrap Up</h3>
<p><b>Recoverable</b> (একটা segment transcode হয়নি) → কয়েকবার retry; <b>Non-recoverable</b> (বিকৃত ফাইল) → ওই ভিডিওর সব task থামিয়ে error code।</p>
<table>
<tr><th>ব্যর্থ অংশ</th><th>পদক্ষেপ</th></tr>
<tr><td>Upload / Transcoding error</td><td>Retry (শুধু ব্যর্থ chunk/segment)</td></tr>
<tr><td>Preprocessor / DAG scheduler</td><td>DAG আবার তৈরি / task পুনরায় schedule</td></tr>
<tr><td>Task worker ডাউন</td><td>অন্য worker-এ retry</td></tr>
<tr><td>Resource manager queue ডাউন</td><td>Replica ব্যবহার</td></tr>
<tr><td>API server ডাউন</td><td>Stateless — LB অন্যটায় পাঠায়</td></tr>
<tr><td>Metadata cache / DB</td><td>Replica; primary মরলে replica promote</td></tr>
</table>
<p><b>Wrap-up:</b> API tier stateless (সহজ scale); DB replication/sharding; <b>live streaming</b> আলাদা (কম latency → ভিন্ন protocol, কম parallelism, দ্রুত error handling); video takedown (কপিরাইট/অবৈধ কনটেন্ট — আপলোডে fingerprint বা user report)।</p>

<h3>১৪.৭ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. Transcoding কেন লাগে?</b>
<p>raw ভিডিও বিশাল; ডিভাইসভেদে format আলাদা; bandwidth অনুযায়ী quality দরকার; নেটওয়ার্ক বদলালে adaptive bitrate-এর জন্য একই ভিডিওর একাধিক rendition ও ছোট segment লাগে।</p></div>
<div class="card"><b>প্র২. Pipeline-এ DAG কেন?</b>
<p>Creator-ভেদে প্রসেসিং আলাদা, তাই কনফিগারযোগ্য pipeline দরকার। DAG-এ নির্ভরতাহীন task সমান্তরালে চলে, নতুন task যোগ সহজ, ব্যর্থ task আলাদাভাবে retry করা যায়।</p></div>
<div class="card"><b>প্র৩. ভিডিও API server দিয়ে না ঘুরিয়ে সরাসরি storage-এ আপলোড কেন? নিরাপত্তা?</b>
<p>বড় ফাইল API server-এর bandwidth/CPU খায়। Pre-signed URL/SAS-এ সার্ভার শুধু অনুমতি দেয় (ছোট আয়ু, নির্দিষ্ট blob, শুধু write); আপলোডের পর inspection দিয়ে যাচাই করতে হবে।</p></div>
<div class="card"><b>প্র৪. CDN-এর খরচ কীভাবে কমাবেন?</b>
<p>Long-tail: জনপ্রিয় ভিডিও CDN-এ, বাকি নিজস্ব storage-এ; কম-দেখা ভিডিওর সব rendition না রাখা; আঞ্চলিক বিতরণ; বড় হলে ISP-partnered CDN। আগে view data মাপুন।</p></div>
<div class="card"><b>প্র৫. Adaptive bitrate কীভাবে কাজ করে?</b>
<p>ভিডিও একাধিক quality-তে ছোট segment-এ থাকে, manifest সেগুলো তালিকাভুক্ত করে। Player প্রতি segment-এর ডাউনলোড-বেগ মেপে পরের segment-এর quality বাছে। Segment সাধারণ HTTP, তাই CDN ক্যাশ কাজ করে।</p></div>
<div class="card"><b>প্র৬. Upload ছিঁড়ে গেলে ও transcoding task ব্যর্থ হলে?</b>
<p>Chunked upload-এ সার্ভার জানে কোন chunk এসেছে — client শুধু বাকিগুলো পাঠায় (অধ্যায় <a href="#" data-go="googledrive">১৫</a>-এও এই কৌশল)। Task ব্যর্থ হলে temp storage-এর GOP থেকে অন্য worker-এ retry; task idempotent; বারবার ব্যর্থ হলে non-recoverable ধরে error code ও dead-letter queue।</p></div>

<h2 class="title">১৫. Design Google Drive — File Storage ও Sync</h2>
<p class="lead">Google Drive, Dropbox, OneDrive — ফাইল ক্লাউডে রাখে ও সব ডিভাইসে <b>সিঙ্ক</b> করে। এখানে একটা ভুল মানে <b>ডেটা হারানো</b>, তাই reliability সবার আগে। এই অধ্যায়ে আমরা <b>এক সার্ভার</b> থেকে শুরু করে ধাপে ধাপে high-level design-এ পৌঁছাব (অধ্যায় <a href="#" data-go="scale">১</a>-এর বাস্তব প্রয়োগ)।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
এখানে একসাথে আসে <b>block-level storage, delta sync, strong consistency, conflict resolution, long polling, deduplication</b>। আপনার ERP-র document attachment ও backup-এও এগুলো সরাসরি কাজে লাগে।</div>

<h3>১৫.১ Scope ও Estimation</h3>
<p><b>Scope:</b> ফাইল আপলোড/ডাউনলোড, একাধিক ডিভাইসে sync, revision history, শেয়ার, পরিবর্তনের notification; mobile+web; যেকোনো ফাইল (সর্বোচ্চ ১০ GB, storage-এ encrypted); ১ কোটি DAU। <b>Out of scope:</b> Google Docs-এর real-time co-editing। <b>Non-functional:</b> reliability, দ্রুত sync, কম bandwidth, scalability, availability।</p>
<pre>
Quota মোট        = 50M user × 10 GB = 500 PB         (আসল ব্যবহার অনেক কম)
Upload/দিন       = 10M × 2 = 20M ফাইল;   QPS = 20M ÷ 86,400 ≈ 230   (peak ≈ 2×)
নতুন ডেটা/দিন   = 20M × 500 KB = 10 TB  → বছরে ≈ 3.65 PB (৩ কপিতে ≈ 11 PB)
</pre>
<div class="callout best"><span class="tag">সিদ্ধান্ত</span>
QPS ছোট — চ্যালেঞ্জ <b>স্থায়িত্ব, ডেটার আকার ও sync-দক্ষতা</b>। ফাইল object storage-এ; metadata relational DB-তে।</div>

<h3>১৫.২ এক সার্ভার থেকে বড় করা</h3>
<p>শুরুতে: web server + DB (metadata) + ডিস্ক (<code>drive/</code> ডিরেক্টরি; প্রতি ব্যবহারকারীর একটা <b>namespace</b>)। তিনটা API: <b>Upload</b> (simple ও <b>resumable</b> — (১) resumable URL নিন, (২) ডেটা পাঠান, (৩) ছিঁড়লে সার্ভারকে জিজ্ঞেস করে চালিয়ে যান), <b>Download</b> (path দিয়ে), <b>List revisions</b>। সবই authenticated ও HTTPS।</p>
<div class="diagram"><pre>
 ডিস্ক ভরল ─► user_id দিয়ে shard ─► তবু সার্ভার মরলে ডেটা হারানোর ঝুঁকি
            ─► Object Storage (S3 / Azure Blob): same-region + cross-region replication, উচ্চ durability
 + Load Balancer + আলাদা Metadata DB (replica/shard) ⇒ web, metadata, storage — তিনটাই স্বাধীন
</pre></div>

<h4>Sync Conflict</h4>
<p>দুজন একসাথে একই ফাইল বদলালে: <b>যার request আগে প্রক্রিয়া হয় সে জেতে</b>; পরেরজন conflict পায় ও দুটো কপি দেখে — <b>merge</b> বা <b>override</b> করে (Dropbox "conflicted copy" রাখে: ডেটা হারানোর চেয়ে ডুপ্লিকেট ভালো)।</p>
<pre>
<span class="c">-- Optimistic concurrency: rows affected = 0 ⇒ কেউ আগে আপডেট করেছে ⇒ 409 Conflict</span>
UPDATE file SET latest_version = @expected + 1, checksum = @checksum, updated_at = now()
WHERE  id = @id AND latest_version = @expected;
<span class="c">-- EF Core: [Timestamp] RowVersion + DbUpdateConcurrencyException → 409</span></pre>

<h3>১৫.৩ High-Level Design</h3>
<div class="diagram"><pre>
 Client ─(file)──────► Block Servers ─► Cloud Storage (S3) ─(পুরোনো)─► Cold Storage
   │
   ├─(metadata)──► LB ─► API Servers ─► Metadata Cache ─► Metadata DB
   └─(long poll)◄── Notification Service      (client অফলাইন ⇒ Offline Backup Queue)
</pre></div>
<table>
<tr><th>Component</th><th>কাজ</th></tr>
<tr><td>Block Servers</td><td>ফাইল → <b>৪ MB block</b> (Dropbox-অনুসারী) → compress → encrypt → upload। প্রতিটা block-এর অনন্য hash metadata DB-তে; ফাইল = block-গুলো ক্রমে জোড়া।</td></tr>
<tr><td>Metadata DB / Cache</td><td>ইউজার, ফাইল, block, version। ফাইলের আসল ডেটা নয়।</td></tr>
<tr><td>Notification Service</td><td>Pub/Sub; ফাইল বদলালে client-কে জানায় যাতে সে পরিবর্তন pull করে</td></tr>
<tr><td>Offline Backup Queue</td><td>অফলাইন client-এর জন্য পরিবর্তন জমা রাখে</td></tr>
</table>

<h3>১৫.৪ Deep Dive</h3>
<h4>Block Server — Delta Sync ও Compression</h4>
<div class="diagram"><pre>
 ১০০ MB ফাইল = ২৫ block;  ২ ও ৫ নং বদলেছে
   পুরোনো: [b1][b2][b3][b4][b5]…     নতুন: [b1][b2*][b3][b4][b5*]…
   শুধু b2*, b5* আপলোড = ৮ MB (১০০ MB নয়) ⇒ ৯২% সাশ্রয়
</pre></div>
<div class="callout mistake"><span class="tag">সূক্ষ্ম সমস্যা</span>
<b>স্থির আকারের</b> block-এ ফাইলের শুরুতে ১ byte ঢুকালে পরের সব byte সরে যায় ⇒ প্রতিটা block-ই বদলে যায়, delta sync বেকার। সমাধান: <b>content-defined chunking</b> (rolling hash দিয়ে ডেটার ভেতর থেকে block-সীমা ঠিক — rsync/Dropbox)।</div>
<pre>
public sealed record Block(int Order, string Hash, byte[] Data);

public static async IAsyncEnumerable&lt;Block&gt; SplitAsync(Stream file,
    [EnumeratorCancellation] CancellationToken ct = default)
{
    var buf = new byte[4 * 1024 * 1024];
    for (int order = 0; ; order++)
    {
        int total = 0, n;
        while (total &lt; buf.Length &amp;&amp; (n = await file.ReadAsync(buf.AsMemory(total), ct)) &gt; 0) total += n;
        if (total == 0) yield break;
        var data = buf.AsSpan(0, total).ToArray();
        yield return new Block(order, Convert.ToHexString(SHA256.HashData(data)), data);
    }
}
<span class="c">// Delta: serverHashes (order→hash) এর সাথে মিলিয়ে শুধু বদলানো block পাঠাও</span>
await foreach (var b in SplitAsync(stream, ct))
    if (!(serverHashes.TryGetValue(b.Order, out var h) &amp;&amp; h == b.Hash))
        await storage.UploadBlockAsync(b.Hash, Compress(b.Data), ct);   <span class="c">// Brotli/gzip; তারপর AES-GCM encrypt</span></pre>

<h4>Strong Consistency ও Metadata Schema</h4>
<p>একই ফাইল দুই ডিভাইসে দুই রকম দেখানো অগ্রহণযোগ্য ⇒ metadata-য় <b>strong consistency</b>: Relational DB (ACID), লেখার সময় cache <b>invalidate</b>। (ডিফল্ট NoSQL-এ ACID নেই।) Thumbnail/search index-এ eventual চলে।</p>
<pre>
user(id, email…)   device(id, user_id, push_id)   namespace(id, user_id, root_path)
file(id, namespace_id, path, latest_version, checksum, status[pending|uploaded])
file_version(id, file_id, version, size, created_at)   <span class="c">-- append-only: ইতিহাস অপরিবর্তনীয়</span>
block(id, file_version_id, block_order, hash)          <span class="c">-- hash-এ index; dedup-এর ভিত্তি</span></pre>

<h4>Upload ও Download Flow</h4>
<div class="diagram"><pre>
 UPLOAD (Client 1) — দুটো request সমান্তরালে
  ক) metadata পাঠায় ─► DB-তে status="pending" ─► Notification ─► Client 2: "ফাইল আসছে"
  খ) Block Server-এ ফাইল ─► block ভাগ/compress/encrypt ─► Cloud Storage
       ─► callback ─► status="uploaded" ─► Notification ─► Client 2: "সম্পূর্ণ"

 DOWNLOAD (Client 2)
  Notification (অনলাইন) বা অনলাইনে ফিরে নিজে pull (অফলাইন) ─► API: "cursor X-এর পর কী বদলেছে?"
  ─► metadata + block hash তালিকা ─► যে block নেই শুধু সেগুলো নামায় ─► ফাইল পুনর্গঠন
</pre></div>
<p>প্রতিটা ডিভাইস শেষ দেখা <b>change cursor</b> মনে রাখে — অনলাইন/অফলাইন দুই ক্ষেত্রেই একই pull; notification শুধু "এখনই pull করো" ইঙ্গিত।</p>

<h4>Notification — Long Polling কেন, WebSocket নয়?</h4>
<table>
<tr><th></th><th>Long Polling</th><th>WebSocket</th></tr>
<tr><td>দিক</td><td>সার্ভার → client (একমুখী)</td><td>দ্বিমুখী</td></tr>
<tr><td>উপযুক্ত</td><td>বিরল, ছোট notification (Drive/Dropbox)</td><td>ঘনঘন দ্বিমুখী বার্তা (Chat — অধ্যায় <a href="#" data-go="chat">১২</a>)</td></tr>
<tr><td>অবকাঠামো</td><td>সাধারণ HTTP</td><td>বিশেষ সমর্থন</td></tr>
</table>
<pre>
app.MapGet("/sync/poll", async (long cursor, ClaimsPrincipal user, IChangeFeed feed, CancellationToken ct) =&gt;
{
    using var cts = CancellationTokenSource.CreateLinkedTokenSource(ct);
    cts.CancelAfter(TimeSpan.FromSeconds(55));          <span class="c">// proxy/LB idle timeout-এর নিচে</span>
    try   { return Results.Ok(await feed.WaitForChangesAsync(user.GetNamespaceId(), cursor, cts.Token)); }
    catch (OperationCanceledException) when (!ct.IsCancellationRequested) { return Results.NoContent(); }
});   <span class="c">// client সঙ্গে সঙ্গে আবার poll খোলে</span></pre>
<div class="callout mistake"><span class="tag">Reconnection Storm</span>
Notification server মরলে সব client একসাথে পুনঃসংযোগ চাইবে (এক মেশিনে ১০ লাখ+ সংযোগ হতে পারে; সবার reconnect ধীর)। প্রতিকার: client-এ <b>jitter + exponential backoff</b>, সার্ভারে নতুন-সংযোগ rate limit (অধ্যায় <a href="#" data-go="ratelimiter">৪</a>)। অনুমান: ২০ লক্ষ একসাথে অনলাইন ÷ সার্ভারপ্রতি ১ লক্ষ = ২০টা সার্ভার।</div>

<h4>Storage বাঁচানো ও Failure Handling</h4>
<table>
<tr><th>কৌশল</th><th>বিবরণ</th></tr>
<tr><td>Block <b>deduplication</b></td><td>একই hash-এর block একবারই রাখা। অ্যাকাউন্ট-স্তরই নিরাপদ — cross-user dedup-এ "এই hash আছে কি?" থেকে অন্যের ফাইলের উপস্থিতি অনুমান করা যায় (side-channel)। উদাহরণ: ১০০ MB ফাইলের ২০ version, প্রতিবার ১ block (৪ MB) বদলালে: ২,০০০ MB-র বদলে ১০০ + ১৯×৪ = <b>১৭৬ MB</b>।</td></tr>
<tr><td>Version নীতি</td><td>সংখ্যা-সীমা; সাম্প্রতিক version বেশি রাখা (গত ২৪ ঘণ্টায় সব, গত সপ্তাহে দৈনিক একটা…)</td></tr>
<tr><td>Cold storage</td><td>মাস/বছর অব্যবহৃত ডেটা S3 Glacier/Azure Archive-এ — সস্তা, কিন্তু ফেরত আনতে সময়/ফি</td></tr>
</table>
<table>
<tr><th>ব্যর্থ অংশ</th><th>সামাল</th></tr>
<tr><td>Load Balancer</td><td>Secondary + heartbeat</td></tr>
<tr><td>Block Server</td><td>অন্য সার্ভার pending কাজ নেয় (block-স্তরে idempotent)</td></tr>
<tr><td>Cloud Storage</td><td>অন্য region থেকে</td></tr>
<tr><td>API Server / Cache / DB</td><td>Stateless / replica / replica promote</td></tr>
<tr><td>Notification / Offline queue</td><td>অন্য সার্ভারে reconnect (backoff সহ) / queue replica</td></tr>
</table>
<div class="callout best"><span class="tag">ডেটা হারানো ঠেকানো</span>
metadata <code>pending</code> ⇒ সব block পৌঁছালে তবেই <code>uploaded</code>; পুরোনো version কখনো ওভাররাইট নয়; hash দিয়ে অখণ্ডতা যাচাই। ক্র্যাশে আগের বৈধ অবস্থা অক্ষত।</div>

<h3>১৫.৭ Interview প্রশ্নোত্তর</h3>
<div class="card"><b>প্র১. ফাইল block-এ ভাঙা হয় কেন?</b>
<p>Delta sync (শুধু বদলানো block), resumable/সমান্তরাল আপলোড, deduplication, আর block-কে স্বাধীন object হিসেবে S3-তে রাখা সহজ।</p></div>
<div class="card"><b>প্র২. Metadata DB আর file storage আলাদা কেন?</b>
<p>Metadata ছোট, ঘনঘন লেখা, ACID ও strong consistency চায় (relational); ফাইল ডেটা বিশাল, অপরিবর্তনীয়, durability ও খরচ-দক্ষতা চায় (object storage)। আলাদা হলে আলাদা scale হয়।</p></div>
<div class="card"><b>প্র৩. Conflict কীভাবে শনাক্ত ও সমাধান করেন?</b>
<p>প্রতিটা ফাইলে version; client "N থেকে বদলেছি" বলে; সার্ভার compare-and-swap করে, N সর্বশেষ না হলে 409। সমাধান: দুটো কপি রাখা, merge/override বা conflicted copy। ডেটা হারানো এড়ানোই নীতি।</p></div>
<div class="card"><b>প্র৪. Long polling না WebSocket?</b>
<p>এখানে notification একমুখী ও বিরল ⇒ long polling সরল ও HTTP-বান্ধব। ঘনঘন দ্বিমুখী বার্তায় WebSocket; একমুখী বিকল্প SSE-ও।</p></div>
<div class="card"><b>প্র৫. Deduplication-এর ঝুঁকি?</b>
<p>Cross-user dedup-এ side-channel (অন্যের ফাইলের অস্তিত্ব অনুমান); আর per-user encryption key থাকলে একই ডেটা আলাদা ciphertext ⇒ dedup অকার্যকর। তাই অ্যাকাউন্ট-স্তর dedup; মোছার সময় block-এর <b>reference count</b> দেখে garbage collect।</p></div>
<div class="card"><b>প্র৬. আপলোডের মাঝে সার্ভার ক্র্যাশ করলে ডেটা নষ্ট হয়?</b>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
