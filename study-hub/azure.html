<tr><th>বিষয়</th><th>Basic SKU</th><th>Standard SKU</th></tr>
<tr><td>Zone redundancy</td><td>নেই</td><td>আছে — একটা zone ডাউন হলেও LB নিজেই চালু থাকে</td></tr>
<tr><td>SLA</td><td>নেই</td><td>৯৯.৯৯% guaranteed</td></tr>
<tr><td>Backend pool size</td><td>সীমিত (৩০০ instance)</td><td>বড় (১০০০ instance পর্যন্ত)</td></tr>
<tr><td>Security default</td><td>ডিফল্টে outbound খোলা</td><td>ডিফল্টে সব inbound বন্ধ — explicit NSG লাগে</td></tr>
<tr><td>বর্তমান অবস্থা</td><td>Microsoft কর্তৃক retire হচ্ছে</td><td>নতুন সব ডিপ্লয়মেন্টে বাধ্যতামূলক default</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — নতুন কাজে সবসময় Standard SKU</span>
Basic SKU এখন কার্যত deprecated পথে — Microsoft এটাকে পর্যায়ক্রমে retire করছে, আর zone redundancy ও SLA ছাড়া production workload চালানো ঝুঁকিপূর্ণ। নতুন যেকোনো architecture-এ শুরু থেকেই Standard SKU বেছে নেওয়া উচিত, পরে migrate করা অনেক বেশি ঝক্কির।</div>

<h3>Application Gateway — Listener ও URL Path-based Routing</h3>
<p>Application Gateway-এর <span class="kw">Listener</span> একটা নির্দিষ্ট port/protocol-এ শোনে (যেমন 443-এ HTTPS), আর তার ভেতরে <span class="kw">Routing Rule</span> path বা host অনুযায়ী আলাদা আলাদা Backend Pool-এ ট্রাফিক পাঠায়।</p>
<pre>Listener: https-listener (port 443, host: shop.example.com)

Rule 1: path  /api/*        → backend-pool-api
Rule 2: path  /images/*     → backend-pool-static
Rule 3: path  /*  (default) → backend-pool-frontend

<span class="c">// WAF policy একই Application Gateway-তে attach করা থাকে</span>
<span class="c">// প্রতিটা rule-এর আগেই request WAF-এর মধ্য দিয়ে যায়</span></pre>
<p>এই path-based routing-এর কারণেই একটাই Application Gateway দিয়ে একাধিক microservice সার্ভ করা সম্ভব — প্রতিটার জন্য আলাদা load balancer লাগে না।</p>

<h3>VM Scale Sets (VMSS) — Model বনাম Instance</h3>
<p><span class="kw">VM Scale Set</span> একগুচ্ছ identical VM ম্যানেজ করে, যেন সবসময় নির্দিষ্ট সংখ্যক healthy instance চলমান থাকে। প্রতিটা instance ঠিক কেমন হবে (image, VM size, extension, custom script) তা আসে একটা <span class="kw">Model</span> থেকে — এটা একরকম ব্লুপ্রিন্ট, যেখান থেকে বাস্তব <span class="kw">Instance</span>-গুলো তৈরি হয়।</p>
<div class="callout behind"><span class="tag">গভীরে — Model বদলালে চলমান Instance আপনা-আপনি বদলায় না</span>
Model আপডেট করলে (যেমন নতুন image version) সেটা শুধু ভবিষ্যতে তৈরি হওয়া নতুন instance-এ প্রযোজ্য হয় — আগে থেকে চলমান instance-গুলো পুরনো configuration-এই থেকে যায়, যতক্ষণ না আপনি explicitly <code>Upgrade</code> চালান বা rolling upgrade policy সেট করেন। এই কারণে অনেকে ভাবে model বদলালেই সব instance আপডেট হয়ে গেছে, কিন্তু বাস্তবে upgrade mode (Manual/Automatic/Rolling) না বুঝলে drift তৈরি হয়ে যায়।</div>

<h3>Autoscale Rule — Metric-based ও Schedule-based</h3>
<table>
<tr><th>Rule ধরন</th><th>কীভাবে কাজ করে</th><th>কখন ব্যবহার</th></tr>
<tr><td>Metric-based</td><td>CPU/Memory/Queue length-এর মতো metric থ্রেশহোল্ড পার হলে scale out/in করে (AWS-এর Target Tracking/Step Scaling-এর সমতুল্য যুক্তি)</td><td>অনির্দিষ্ট, ওঠানামা করা ট্রাফিক</td></tr>
<tr><td>Schedule-based</td><td>নির্দিষ্ট সময়ে instance count সরাসরি সেট করে দেয়, কোনো metric দেখে না</td><td>predictable প্যাটার্ন — অফিস আওয়ার, sale event, রাতের low-traffic window</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — দুটো একসাথে ব্যবহার করুন</span>
Metric-based rule বেস হিসেবে রেখে, জানা peak সময়ের জন্য Schedule-based rule দিয়ে আগে থেকেই minimum capacity বাড়িয়ে রাখা কার্যকর — যাতে reactive scaling-এর অপেক্ষা না করে নতুন instance বুট হয়ে যাওয়ার সময়টুকু আগে থেকেই কভার হয়ে যায়।</div>

<h3>Scale-in Policy — কোন Instance আগে সরানো হবে</h3>
<table>
<tr><th>Policy</th><th>আচরণ</th></tr>
<tr><td>Default (Balanced)</td><td>Availability Zone/fault domain জুড়ে balance বজায় রেখে instance বেছে নেয়</td></tr>
<tr><td>OldestVM</td><td>সবচেয়ে পুরনো instance আগে সরায়</td></tr>
<tr><td>NewestVM</td><td>সবচেয়ে নতুন instance আগে সরায় — সদ্য তৈরি হওয়া, এখনও warm-up না হওয়া instance বাদ দিতে কাজে লাগে</td></tr>
</table>

<h3>Application Gateway + VMSS একসাথে — সম্পূর্ণ চিত্র</h3>
<div class="diagram"><pre>
                     ┌─────────────────────────┐
  Internet ────────► │  Application Gateway     │  ← WAF policy attach থাকে
                     │  (Listener + Rule + Probe)│
                     └────────────┬─────────────┘
                                  │ path-based routing + health probe
                                  ▼
                     ┌─────────────────────────┐
                     │      Backend Pool        │
                     └────────────┬─────────────┘
              ┌────────────────────┼────────────────────┐
              ▼                    ▼                    ▼
        VM (zone 1)          VM (zone 2)          VM (zone 3)
              ▲                    ▲                    ▲
              └────────────────────┴────────────────────┘
                          VM Scale Set
                 (Autoscale rule অনুযায়ী instance যোগ/বাদ করে,
                  নতুন instance নিজে থেকেই Backend Pool-এ যুক্ত হয়)
</pre></div>
<div class="callout why"><span class="tag">কেন নতুন instance তাৎক্ষণিকভাবে ট্রাফিক পায় না</span>
VMSS নতুন instance তৈরি করে Backend Pool-এ যোগ করে দিলেও, Application Gateway সেই instance-কে তখনই ট্রাফিক পাঠায় না — প্রথমে health probe pass করতে হয়। তাই scale-out-এর সময় সামান্য ল্যাগ থাকা স্বাভাবিক — এটা bug না, half-booted instance ট্রাফিক না পাওয়ার জন্যই এই safety mechanism।</div>
</template>

<template data-page="dns">
<h2 class="title">১০. Azure DNS ও Traffic Manager</h2>
<p class="lead">DNS এখানেও ইন্টারনেটের ফোনবুক, কিন্তু Azure-এ একটা আলাদা সার্ভিস আছে যেটা DNS-কে শুধু "নাম থেকে IP" ছাড়িয়ে বুদ্ধিমান রাউটিং-এর হাতিয়ার বানিয়ে দেয় — Traffic Manager।</p>

<h3>Azure DNS Zone — Public ও Private (সংক্ষিপ্ত রিক্যাপ)</h3>
<p><span class="kw">Azure DNS Zone</span> একটা ডোমেইনের record হোস্ট করার জায়গা। <span class="kw">Public Zone</span> ইন্টারনেটে সবার কাছে resolve হয় (যেমন পাবলিক ওয়েবসাইট বা API-এর জন্য), আর <span class="kw">Private Zone</span> শুধু নির্দিষ্ট VNet-এর ভেতর থেকেই resolve হয় — internal service discovery-র জন্য (যেমন <code>db.internal.company.com</code>), যাতে internal hostname বাইরে ফাঁস না হয়।</p>

<h3>Record Type — সংক্ষিপ্ত টেবিল</h3>
<table>
<tr><th>Record</th><th>কী resolve করে</th><th>মূল ব্যবহার</th></tr>
<tr><td>A</td><td>hostname → IPv4 address</td><td>সরাসরি সার্ভারের IP</td></tr>
<tr><td>CNAME</td><td>hostname → আরেকটা hostname</td><td>subdomain-কে অন্য সার্ভিসে পয়েন্ট করা</td></tr>
<tr><td>Alias record</td><td>hostname → Azure resource (Public IP, Traffic Manager profile, Front Door endpoint)</td><td>zone apex-এ Azure resource পয়েন্ট করা</td></tr>
</table>
<div class="callout why"><span class="tag">কেন zone apex-এ CNAME চলে না, Alias লাগে</span>
DNS প্রোটোকলের নিয়মেই <b>zone apex</b>-এ (যেমন খালি <code>example.com</code>, কোনো subdomain ছাড়া) CNAME রাখা যায় না — apex-এ SOA/NS record থাকতে হয়, আর CNAME অন্য কোনো record টাইপের সাথে coexist করতে পারে না। ঠিক Route 53-এর মতোই একই সমস্যা এখানেও আছে, আর সমাধানও একই ধাঁচের — Azure DNS-এর <span class="kw">Alias record</span> DNS লেভেলে A record-এর মতো আচরণ করে (তাই apex-এ বসতে পারে), কিন্তু ভেতরে টার্গেট resource-এর IP বদলালেও নিজে থেকেই আপডেট থাকে।</div>

<h3>Traffic Manager — এটা আসলে কী স্তরে কাজ করে</h3>
<p>এখানেই সবচেয়ে গুরুত্বপূর্ণ ধারণাটা আসে। <span class="kw">Traffic Manager</span> একটা <b>DNS-level</b> রাউটিং সার্ভিস — মানে এটা কোনো ট্রাফিক প্রক্সি করে না, প্যাকেট দেখে না, সরাসরি ডেটা ফরওয়ার্ডও করে না। এটা শুধু DNS query-র জবাবে <b>ভিন্ন ভিন্ন client-কে ভিন্ন ভিন্ন endpoint-এর IP address ফেরত দেয়</b> — তারপর client নিজেই সরাসরি সেই IP-তে connect করে, Traffic Manager-এর সাথে সেই connection-এর আর কোনো সম্পর্ক থাকে না।</p>
<div class="diagram"><pre>
Client  ──DNS query──►  Traffic Manager (DNS-level decision)
   ▲                            │
   │                    routing method অনুযায়ী
   │                    সিদ্ধান্ত নেয় কোন endpoint-এর
   │                    IP ফেরত দেবে
   │                            ▼
   └─────IP address ফেরত─── (যেমন 20.51.x.x — Region A-এর origin)

Client এখন সরাসরি 20.51.x.x-এ connect করে
Traffic Manager-এর ভূমিকা এখানেই শেষ — সে আর প্যাকেট দেখে না
</pre></div>
<div class="callout why"><span class="tag">কেন এটা "শুধু DNS" হওয়াটাই একটা সীমাবদ্ধতা</span>
Traffic Manager কখনো HTTP request বা TLS handshake দেখতেই পায় না — তার কাজ শেষ হয়ে যায় DNS resolution-এর মুহূর্তেই। তাই এটা SSL terminate করতে পারে না, header দেখে route করতে পারে না, caching করতে পারে না। এই সীমাবদ্ধতা bug না — এটাই DNS-based routing-এর মৌলিক প্রকৃতি, আর এই কারণেই Azure-এ আলাদা একটা HTTP-level প্রোডাক্ট (Front Door) লাগে, যেটা পরের চ্যাপ্টারে বিস্তারিত আলোচনা হবে।</div>

<h3>Routing Method — তুলনা</h3>
<table>
<tr><th>Method</th><th>আচরণ</th><th>বাস্তব উদাহরণ</th></tr>
<tr><td>Priority</td><td>Primary endpoint healthy থাকলে সবসময় সেখানেই পাঠায়, না হলে পরবর্তী priority-তে</td><td>Active-passive disaster recovery</td></tr>
<tr><td>Weighted</td><td>শতাংশ অনুপাতে একাধিক endpoint-এ ট্রাফিক ভাগ করে</td><td>Canary/blue-green deployment</td></tr>
<tr><td>Performance</td><td>client যেখান থেকে query করছে, তার কাছে network latency-র হিসেবে সবচেয়ে কাছের endpoint বেছে নেয়</td><td>multi-region deployment, response time optimize করা</td></tr>
<tr><td>Geographic</td><td>client-এর ভৌগোলিক অবস্থান (দেশ/অঞ্চল) অনুযায়ী নির্দিষ্ট endpoint-এ পাঠায়</td><td>data residency compliance, দেশভিত্তিক কনটেন্ট</td></tr>
<tr><td>MultiValue</td><td>একাধিক healthy IP একসাথে ফেরত দেয়, client নিজে বেছে নেয়</td><td>সাধারণ round-robin + health-aware ফলব্যাক</td></tr>
<tr><td>Subnet</td><td>client-এর IP range অনুযায়ী নির্দিষ্ট endpoint ম্যাপ করে</td><td>corporate network-ভিত্তিক split routing, A/B টেস্টিং</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Traffic Manager-কে load balancer ভেবে ভুল প্রত্যাশা রাখা</span>
অনেকে ভাবে Traffic Manager Application Gateway বা Front Door-এর মতোই ট্রাফিক প্রক্সি করবে, তাই WAF বা SSL offload-এর প্রত্যাশা করে বসে — কিন্তু Traffic Manager কখনোই প্যাকেটের ভেতরে ঢোকে না। এটা শুধু DNS resolution-এর মুহূর্তে সিদ্ধান্ত নেয়, তারপর client একাই বাকি কাজ করে। এই ভুল প্রত্যাশাই সবচেয়ে সাধারণ Azure networking বিভ্রান্তির একটা।</div>

<h3>Endpoint Monitoring — Health Check কীভাবে কাজ করে</h3>
<p>Traffic Manager নিয়মিত interval-এ প্রতিটা endpoint-এ (HTTP/HTTPS/TCP) probe পাঠিয়ে যাচাই করে সেটা সাড়া দিচ্ছে কিনা। পরপর কয়েকবার fail করলে endpoint-কে <b>Degraded</b> মার্ক করে DNS answer থেকে বাদ দেওয়া হয় — এই মনিটরিং না থাকলে Priority routing-এর মতো method একদমই অচল হয়ে যেত, কারণ Traffic Manager-এর জানারই কোনো উপায় থাকত না কোন endpoint আসলে ডাউন।</p>
<div class="callout best"><span class="tag">Best practice — DNS TTL কম রাখুন failover দ্রুত করতে</span>
Traffic Manager নিজে instant failover ঘটাতে পারে না যদি resolver-রা পুরনো IP অনেকক্ষণ ধরে cache করে রাখে — কারণ decision তো DNS resolution-এর সময়ই নেওয়া হয়, এরপর client পুরনো cached IP-তেই লেগে থাকে। তাই DNS TTL কম (যেমন ৩০-৬০ সেকেন্ড) রাখলে failover-এর সময় client-রা দ্রুত নতুন IP পায়, নাহলে outage-এর পরেও অনেকক্ষণ পুরনো, ডাউন হয়ে যাওয়া endpoint-এই ট্রাফিক আটকে থাকে।</div>
</template>

<template data-page="cdn">
<h2 class="title">১১. Azure CDN ও Front Door</h2>
<p class="lead">Origin সার্ভার পৃথিবীর এক কোণে বসে থাকলেও কনটেন্ট ইউজারের কাছাকাছি নিয়ে আসা — কিন্তু Azure-এ Front Door শুধু একটা CDN না, এটা একটা global HTTP load balancer, CDN আর WAF-কে একসাথে মিলিয়ে দেওয়া একটা প্রোডাক্ট।</p>

<h3>Azure CDN — Edge Caching-এর মৌলিক ধারণা</h3>
<p><span class="kw">Azure CDN</span> বিশ্বজুড়ে ছড়িয়ে থাকা <span class="kw">Edge Location (POP)</span>-এ static কনটেন্টের কপি রেখে দেয়, যাতে ইউজারের request origin পর্যন্ত না গিয়ে সবচেয়ে কাছের edge থেকেই সার্ভ হয়ে যায়। Azure-এ CDN কয়েকটা provider tier-এ পাওয়া যায় — Microsoft-এর নিজস্ব CDN, এবং partner হিসেবে Akamai ও Verizon-এর network, প্রতিটার নিজস্ব edge coverage ও feature set আলাদা। তবে আধুনিক architecture-এ এই standalone CDN-এর বদলে বেশিরভাগ ক্ষেত্রেই এখন Front Door বেছে নেওয়া হয়, কারণ সেটা একই সাথে অনেক বেশি কাজ করে।</p>

<h3>Front Door — কেন এটা শুধু CDN-এর চেয়ে বেশি</h3>
<p><span class="kw">Azure Front Door</span> একটা single প্রোডাক্টে <b>global HTTP(S) Load Balancer + CDN + WAF</b> একসাথে মিলিয়ে দিয়েছে। এটা edge caching করে (CDN-এর কাজ), একাধিক region-এর origin-এর মধ্যে health-aware রাউটিং করে (global load balancer-এর কাজ), আর একই সাথে WAF rule দিয়ে আক্রমণ ফিল্টার করে।</p>
<div class="callout behind"><span class="tag">গভীরে — AWS যা দুই প্রোডাক্টে ভাগ করেছে, Azure এখানে এক প্রোডাক্টে দিয়েছে</span>
AWS-এ এই কাজটা দুটো আলাদা সার্ভিসে ভাগ করা — CloudFront (caching + edge delivery) আর Global Accelerator (anycast IP দিয়ে global TCP/UDP routing, non-cacheable ট্রাফিকের জন্য)। Azure Front Door এই দুটো দায়িত্বকেই একটা প্রোডাক্টে মিলিয়ে দিয়েছে — cacheable static content আর dynamic API রাউটিং, দুটোই একই Front Door profile-এর ভেতর থেকে হ্যান্ডল হয়। এই ডিজাইন পার্থক্যটা মূলত architectural philosophy-র — AWS প্রতিটা concern আলাদা প্রোডাক্টে রেখে composability দেয়, Azure একটা integrated প্রোডাক্টে দিয়ে operational simplicity দেয়। কোনোটাই "ভুল" না, দুটোই ভিন্ন trade-off।</div>

<h3>Front Door কীভাবে সত্যিকারের ট্রাফিক প্রক্সি করে</h3>
<p>Front Door <span class="kw">anycast</span> IP ব্যবহার করে — একটাই IP address পৃথিবীর সব POP থেকে announce করা হয়, তাই client নিজে থেকেই নেটওয়ার্ক-লেভেলে সবচেয়ে কাছের POP-এ রাউট হয়ে যায় (BGP routing-এর স্বাভাবিক আচরণ, কোনো DNS ম্যাজিক লাগে না)। এরপর সেই POP client-এর সাথে connection টার্মিনেট করে (TLS handshake, HTTP parse — সবকিছু), এবং origin পর্যন্ত বাকি পথটুকু যায় Microsoft-এর নিজস্ব প্রাইভেট backbone network দিয়ে, পাবলিক ইন্টারনেটের unpredictable routing দিয়ে না।</p>
<div class="diagram"><pre>
Client (Dhaka) ──► নিকটতম Front Door POP (anycast IP-তে স্বাভাবিকভাবেই রাউট হয়)
                        │
                  TLS terminate + HTTP parse এখানেই হয়
                        │
                  Cache HIT? ──► হ্যাঁ ──► সরাসরি রিটার্ন
                        │
                        ▼ না
              Microsoft backbone network দিয়ে
                        │
                        ▼
                  Origin (যেকোনো region)
</pre></div>
<div class="callout why"><span class="tag">কেন এটা শুধু ইন্টারনেট রাউটিং-এর চেয়ে দ্রুত</span>
পাবলিক ইন্টারনেটে ট্রাফিক একাধিক ISP-এর মধ্য দিয়ে যায়, যেখানে congestion, suboptimal routing path, ও packet loss সাধারণ ঘটনা। POP থেকে origin পর্যন্ত Microsoft-এর নিজস্ব backbone ব্যবহার করলে সেই অনিশ্চয়তা এড়ানো যায় — এটা অনেকটা মহাসড়কের বদলে একটা প্রাইভেট এক্সপ্রেসওয়ে ব্যবহার করার মতো, যেখানে ট্রাফিক নিয়ন্ত্রণ পুরোপুরি এক হাতে।</div>

<h3>Traffic Manager বনাম Front Door — সবচেয়ে গুরুত্বপূর্ণ পার্থক্য</h3>
<p>এই দুইটা সার্ভিস দেখতে একই কাজ করে মনে হয় (একাধিক region-এর মধ্যে ট্রাফিক ভাগ করা), কিন্তু তারা সম্পূর্ণ ভিন্ন <b>স্তরে</b> কাজ করে — আর এই পার্থক্যটাই Azure networking-এর সবচেয়ে বেশি ভুল বোঝা বিষয়গুলোর একটা।</p>
<div class="diagram"><pre>
── Traffic Manager (DNS-level) ──
Client → DNS query → Traffic Manager সিদ্ধান্ত নেয় → IP address ফেরত দেয়
                                                          │
                                          Client সরাসরি সেই IP-তে connect করে
                                          Traffic Manager-এর ভূমিকা এখানেই শেষ
                                          (packet/HTTP কিছুই দেখে না)

── Front Door (HTTP-level) ──
Client → Front Door-এর নিজের IP-তে connect করে (TLS handshake Front Door-এর সাথেই হয়)
              │
        Front Door নিজে HTTP request পড়ে, cache/WAF/routing decision নেয়
              │
        Front Door নিজে আলাদা connection খুলে origin-এর সাথে কথা বলে
              │
        Response client-কে ফেরত পাঠায় (Front Door এখনও connection-এর মাঝেই আছে)
</pre></div>
<table>
<tr><th>বিষয়</th><th>Traffic Manager</th><th>Front Door</th></tr>
<tr><td>কাজ করে কোন স্তরে</td><td>DNS resolution-এর সময়</td><td>প্রতিটা HTTP(S) request-এর সময়</td></tr>
<tr><td>Connection টার্মিনেট করে?</td><td>না — client সরাসরি origin-এর IP-তে connect করে</td><td>হ্যাঁ — Front Door নিজেই client connection টার্মিনেট করে</td></tr>
<tr><td>SSL/TLS termination</td><td>সম্ভব না (প্যাকেট দেখতেই পায় না)</td><td>হ্যাঁ, Front Door-এই TLS terminate হয়</td></tr>
<tr><td>WAF/header-based routing</td><td>সম্ভব না</td><td>হ্যাঁ — HTTP header, path, cookie দেখে route করতে পারে</td></tr>
<tr><td>Caching</td><td>সম্ভব না</td><td>হ্যাঁ, edge-এ response cache করে</td></tr>
<tr><td>Failover-এর গতি</td><td>DNS TTL-এর উপর নির্ভরশীল, ধীর হতে পারে</td><td>প্রতিটা request-এই live health জেনে দ্রুত route করে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এই পার্থক্যটা মৌলিক, শুধু ফিচারের তালিকা না</span>
Traffic Manager DNS resolution-এর মুহূর্তেই তার কাজ শেষ করে ফেলে — এরপর client আর Traffic Manager-এর মধ্যে কোনো সম্পর্কই থাকে না, client একাই সরাসরি origin-এর সাথে কথা বলে। তাই Traffic Manager কখনোই SSL terminate, WAF rule apply, বা header দেখে route করতে পারবে না — কারণ এসব করতে হলে আসল HTTP packet-টা দেখতে হয়, আর Traffic Manager প্যাকেট দেখেই না, শুধু নাম আর IP-র ম্যাপিং জানে। Front Door উল্টো — এটা নিজেই client-এর connection টার্মিনেট করে বসে থাকে (একটা proxy-র মতো), তাই তার হাতে পুরো HTTP request থাকে, ফলে caching/WAF/SSL/header routing সবকিছুই সম্ভব হয়ে যায়। এটা "কোনটা ভালো" প্রশ্ন না — এটা দুটো ভিন্ন layer-এর ভিন্ন সীমাবদ্ধতা।</div>

<h3>Cache Purge</h3>
<p>Origin-এ ফাইল বদলালেও edge-এ থাকা পুরনো কপি TTL শেষ না হওয়া পর্যন্ত সার্ভ হতে থাকে — ঠিক যেকোনো CDN-এর মতোই। Front Door-এ <span class="kw">Purge</span> রিকোয়েস্ট দিয়ে জোর করে নির্দিষ্ট path বা পুরো cache খালি করা যায়, কিন্তু এটা সব edge POP-এ propagate হতে কিছুটা সময় নেয় — instant গ্যারান্টি নেই।</p>
<div class="callout mistake"><span class="tag">Common mistake — একই ফাইলনাম বারবার আপডেট করে purge-এর উপর নির্ভর করা</span>
বারবার একই URL-এর কনটেন্ট বদলে প্রতিবার purge চালানো ব্যয়বহুল এবং সব POP-এ propagate হওয়ার আগে কিছু ইউজার পুরনো ভার্সনই পেতে থাকে। সঠিক practice হলো versioned/hash-ভিত্তিক ফাইলনাম (যেমন <code>app.a1b2c3.js</code>) ব্যবহার করা, যাতে নতুন কনটেন্টের জন্য নতুন URL তৈরি হয় এবং পুরনো cache-এর সাথে কোনো conflict-ই না থাকে।</div>

<h3>Custom Domain ও HTTPS</h3>
<p>Front Door-এ নিজের ডোমেইন (যেমন <code>shop.example.com</code>) যুক্ত করে সেটার জন্য ফ্রি, managed certificate ব্যবহার করা যায় — Front Door নিজেই certificate provision ও renew করে দেয়, ম্যানুয়াল renewal-এর ঝক্কি থাকে না।</p>
<div class="callout best"><span class="tag">Best practice — origin-কে সরাসরি ইন্টারনেটে expose করবেন না</span>
Origin-এর public endpoint-এ যদি সরাসরি অ্যাক্সেস সম্ভব হয়, তাহলে Front Door বাইপাস করে WAF, caching, DDoS protection সবকিছু ফাঁকি দেওয়া যায়। Origin firewall/NSG-তে শুধু Front Door-এর নির্দিষ্ট IP range বা <code>X-Azure-FDID</code> header যাচাই করে ট্রাফিক গ্রহণ করা উচিত, যাতে Front Door-ই একমাত্র প্রবেশপথ থাকে।</div>

<h2 class="title">১২. Azure Functions ও Serverless</h2>
<p class="lead">সার্ভার প্রভিশন, প্যাচ, স্কেল করার দায়িত্ব থেকে মুক্তি — কোড লিখুন, চালান, শুধু ব্যবহারের জন্যই পে করুন। Azure Functions-এ এই মডেলের একটা বাড়তি স্তর আছে — Binding — যেটা AWS Lambda-র চেয়ে সত্যিকারের ভিন্ন একটা ধারণা।</p>

<h3>Azure App Service — প্রথমে PaaS Web Hosting-এর ভিত্তিটা বোঝা দরকার</h3>
<p>Functions-এ ঢোকার আগে <span class="kw">Azure App Service</span> বোঝা জরুরি, কারণ এটাই Azure-এর মূল PaaS web-hosting প্ল্যাটফর্ম এবং Functions-এর কিছু hosting মডেল সরাসরি এর উপরেই দাঁড়িয়ে আছে। App Service দিয়ে একটা ওয়েব অ্যাপ, REST API, বা মোবাইল ব্যাকএন্ড হোস্ট করা যায় — কোনো VM প্রভিশন, OS প্যাচিং, বা load balancer সেটআপ ছাড়াই। আপনি শুধু কোড (বা container image) দেন, Azure বাকি ইনফ্রাস্ট্রাকচার (compute, networking, patching, SSL) সামলায়।</p>
<p>এর কেন্দ্রীয় ধারণা হলো <span class="kw">App Service Plan</span> — এটা আসলে একগুচ্ছ VM resource (নির্দিষ্ট size, region, ও pricing tier) যার উপরে এক বা একাধিক App Service app চলে। একই Plan-এর নিচে একাধিক app রাখলে তারা compute resource শেয়ার করে (অনেকটা SQL Elastic Pool-এর মতোই যুক্তি — আলাদা আলাদা app-এর peak load ভিন্ন সময়ে হলে একসাথে রাখা সাশ্রয়ী)।</p>

<h3>Deployment Slot — Zero-downtime Release</h3>
<p>Standard/Premium tier-এ <span class="kw">Deployment Slot</span> ব্যবহার করে একটা আলাদা, লাইভ কিন্তু production-এর বাইরে থাকা environment (যেমন <code>staging</code>) তৈরি করা যায় — এটা প্রায় production-এর হুবহু কপি, নিজস্ব URL-সহ, কিন্তু কোনো লাইভ ট্রাফিক পায় না। নতুন ভার্সন প্রথমে staging slot-এ ডিপ্লয় করে যাচাই করা হয়, তারপর একটা <span class="kw">Swap</span> অপারেশন দিয়ে staging ও production-এর মধ্যে তাৎক্ষণিকভাবে জায়গা বদলে ফেলা হয়।</p>
<div class="diagram"><pre>
আগে:  [ staging: v2 (নতুন) ]     [ production: v1 (পুরনো, লাইভ ট্রাফিক) ]
                    │  Swap  │
পরে:   [ staging: v1 (পুরনো) ]   [ production: v2 (নতুন, লাইভ ট্রাফিক) ]
</pre></div>
<div class="callout why"><span class="tag">কেন Swap সত্যিকারের zero-downtime দেয়</span>
Swap আসলে নতুন কোড কপি করে না — এটা শুধু দুই slot-এর ভেতরের রাউটিং কনফিগারেশন অদলবদল করে, এবং তার আগে নতুন slot-এ একটা "warm-up" রিকোয়েস্ট পাঠিয়ে নিশ্চিত করে অ্যাপ্লিকেশন ইতিমধ্যে বুট হয়ে রেডি আছে। ফলে সুইচের মুহূর্তে ব্যবহারকারী কোনো cold-start বা ডাউনটাইম টের পায় না — নতুন ভার্সন চালু হওয়ার অপেক্ষায় থাকতে হয় না, কারণ সেটা swap হওয়ার আগেই warm অবস্থায় প্রস্তুত ছিল। যদি নতুন ভার্সনে সমস্যা ধরা পড়ে, একই কারণে আবার Swap চালিয়ে সাথে সাথে আগের ভার্সনে ফিরে যাওয়া (rollback) সম্ভব।</div>

<h3>Scale Up বনাম Scale Out</h3>
<p><span class="kw">Scale Up</span> মানে App Service Plan-এর tier বদলে বড় VM (বেশি CPU/RAM) দেওয়া — vertical scaling। <span class="kw">Scale Out</span> মানে একই tier-এ instance সংখ্যা বাড়ানো — horizontal scaling, autoscale rule দিয়ে metric বা schedule-ভিত্তিক স্বয়ংক্রিয়ভাবেও করা যায় (৯ নম্বর অধ্যায়ে VMSS autoscale-এর মতোই যুক্তি)।</p>
<div class="callout behind"><span class="tag">App Service ও Functions-এর সম্পর্ক</span>
১২ নম্বর অধ্যায়ের নিচের অংশে Functions-এর "Dedicated (App Service Plan)" hosting option দেখবেন — এটা কোনো কাকতালীয় নামকরণ না। Functions আসলে App Service-এরই একটা রানটাইম মডেল হিসেবে শুরু হয়েছিল, আর Dedicated plan-এ Function app সরাসরি একটা App Service Plan-এর উপর চলে, ঠিক একটা Web App-এর মতোই — শুধু কোড চলে ভিন্নভাবে (event-driven function হিসেবে, request-response web app হিসেবে না)। এই কারণেই App Service-এর ধারণা আগে বুঝে নিলে Functions-এর hosting model অনেক স্পষ্ট হয়ে যায়।</div>

<h3>Function Anatomy — একটা HTTP Trigger উদাহরণ</h3>
<p>প্রতিটা Azure Function-এর একটা entry point থাকে, যেটা কোনো একটা event ঘটলে চলে। নিচে একটা HTTP trigger function-এর গঠন দেখানো হলো:</p>
<pre>module.exports = async function (context, req) {
    const name = req.query.name || (req.body &amp;&amp; req.body.name);

    context.res = {
        status: 200,
        body: `Hello, ${name}`
    };
};

<span class="c">// function.json — declarative বাইন্ডিং কনফিগারেশন</span>
{
  "bindings": [
    { "type": "httpTrigger", "direction": "in", "name": "req", "methods": ["get", "post"] },
    { "type": "http", "direction": "out", "name": "$return" }
  ]
}</pre>

<h3>Trigger ও Binding — Azure Functions-এর সবচেয়ে ভিন্ন ধারণা</h3>
<p><span class="kw">Trigger</span> নির্ধারণ করে function কখন চলবে — HTTP request, Timer (cron), Queue-তে message আসা, Blob upload হওয়া, ইত্যাদি। প্রতিটা function-এ ঠিক একটাই trigger থাকে। কিন্তু <span class="kw">Binding</span> সম্পূর্ণ আলাদা একটা ধারণা — এটা ঘোষণামূলকভাবে (declaratively) function-কে input/output ডেটা সোর্সের সাথে জুড়ে দেয়, কোনো client SDK initialize বা connection-string দিয়ে হাতে-কলমে কল করা ছাড়াই।</p>
<pre><span class="c">// function.json — Cosmos DB input ও output binding declaratively বলে দেওয়া</span>
{
  "bindings": [
    { "type": "httpTrigger", "direction": "in", "name": "req" },
    {
      "type": "cosmosDB",
      "direction": "in",
      "name": "inputDoc",
      "databaseName": "shopdb",
      "collectionName": "orders",
      "id": "{Query.id}",
      "connectionStringSetting": "CosmosDBConnection"
    },
    {
      "type": "cosmosDB",
      "direction": "out",
      "name": "outputDoc",
      "databaseName": "shopdb",
      "collectionName": "orders",
      "connectionStringSetting": "CosmosDBConnection"
    }
  ]
}</pre>
<pre>module.exports = async function (context, req, inputDoc) {
    <span class="c">// inputDoc আগে থেকেই Cosmos DB থেকে পড়া হয়ে গেছে — কোনো SDK client লেখা লাগেনি</span>
    const updated = { ...inputDoc, status: "shipped" };

    context.bindings.outputDoc = updated; <span class="c">// এটা সেভ হয়ে যাবে Cosmos DB-তে, কোনো .save() কল ছাড়াই</span>
    context.res = { status: 200, body: updated };
};</pre>
<div class="callout why"><span class="tag">কেন এটা AWS Lambda-র চেয়ে ভিন্ন</span>
AWS Lambda-তে DynamoDB থেকে ডেটা পড়তে হলে কোডের ভেতরেই AWS SDK import করে client initialize করতে হয়, তারপর <code>GetItem</code>/<code>PutItem</code> কল লিখতে হয় — এই বয়লারপ্লেট প্রতিটা function-এ বারবার লিখতে হয়। Azure Functions-এ Binding-এর মাধ্যমে এই পুরো ইন্টিগ্রেশন কোডটাই <code>function.json</code>-এ (বা attribute হিসেবে) ঘোষণা করে দেওয়া হয়, আর Azure Functions runtime নিজেই সেই read/write সম্পন্ন করে function চলার আগে/পরে। ফলাফল — একই কাজের জন্য অনেক কম কোড, কিন্তু trade-off হলো logic-টা এখন `function.json`-এর configuration আর runtime-এর ভেতরে "লুকানো", যেটা debug করা মাঝে মাঝে কঠিন হতে পারে কারণ ঠিক কী হচ্ছে তা কোডে সরাসরি দেখা যায় না।</div>
<div class="callout behind"><span class="tag">গভীরে — Trigger আসলে একটা বিশেষ ধরনের Input Binding</span>
টেকনিক্যালি Trigger নিজেও একটা Binding-ই, শুধু বিশেষ এই অর্থে যে এটাই function invoke করার কারণ হয়ে দাঁড়ায় (direction "in" এবং invocation-trigger উভয়ই)। বাকি সব Binding শুধু ডেটা ইন/আউট করে, কিন্তু নিজে থেকে function চালায় না — এই পার্থক্যটাই বুঝলে "কেন একটা function-এ একাধিক trigger থাকতে পারে না, কিন্তু একাধিক input/output binding থাকতে পারে" প্রশ্নের উত্তর স্পষ্ট হয়ে যায়।</div>

<h3>Hosting Plan — Consumption vs Premium vs Dedicated</h3>
<table>
<tr><th>Plan</th><th>বৈশিষ্ট্য</th><th>Cold Start</th><th>কখন ব্যবহার</th></tr>
<tr><td>Consumption</td><td>pure serverless, pay-per-execution, ব্যবহার না হলে শূন্য খরচ</td><td>সবচেয়ে বেশি — instance idle থাকলে সম্পূর্ণভাবে deallocate হয়ে যায়</td><td>ইনফ্রিকোয়েন্ট বা spiky ট্রাফিক, খরচ সংবেদনশীল ওয়ার্কলোড</td></tr>
<tr><td>Premium</td><td>pre-warmed instance always ready, VNet integration সাপোর্ট করে</td><td>কম — কিছু instance আগে থেকেই "গরম" রাখা হয়</td><td>latency-sensitive API, VNet-এর ভেতরে resource access লাগলে</td></tr>
<tr><td>Dedicated (App Service Plan)</td><td>সবসময় চলমান VM-এর মতো instance, নির্দিষ্ট মাসিক খরচ</td><td>নেই</td><td>predictable, উচ্চ ও স্থির ট্রাফিক — কিন্তু তখন serverless-এর pay-per-use সুবিধাটাই হারিয়ে যায়</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Consumption Plan-এ VNet integration আশা করা</span>
Consumption Plan-এ পূর্ণ VNet integration নেই (সীমিত সাপোর্ট আছে regional VNet integration দিয়ে, কিন্তু private endpoint-এর মতো কিছু ফিচার Premium/Dedicated ছাড়া কাজ করে না) — যদি Function-কে private database বা internal API-তে VNet-এর মাধ্যমে কানেক্ট করতে হয় ও পুরোপুরি network isolation দরকার হয়, Premium Plan-এ যেতে হবে। Consumption-এর সস্তা দামে সব ফিচার আশা করাটাই ভুল প্রত্যাশা।</div>

<h3>Durable Functions — Long-running, Stateful Orchestration</h3>
<p>একটা single Function ভালো ছোট, stateless কাজের জন্য, কিন্তু বাস্তব ওয়ার্কফ্লো প্রায়ই একাধিক ধাপ, condition, retry, fan-out/fan-in নিয়ে গঠিত। <span class="kw">Durable Functions</span> এই ধরনের multi-step orchestration-কে সরাসরি <b>কোড দিয়েই</b> লেখার সুযোগ দেয় — AWS Step Functions-এর সমতুল্য ধারণা, কিন্তু সেখানে JSON-ভিত্তিক state machine ডিজাইন করতে হয়, এখানে সাধারণ প্রোগ্রামিং ভাষার loop/condition ব্যবহার করেই workflow লেখা যায়।</p>
<pre>const df = require("durable-functions");

module.exports = df.orchestrator(function* (context) {
    const orderId = context.df.getInput();

    yield context.df.callActivity("ChargePayment", orderId);
    yield context.df.callActivity("UpdateInventory", orderId);
    yield context.df.callActivity("SendConfirmationEmail", orderId);

    <span class="c">// runtime নিজেই এই orchestration-এর state persist রাখে,</span>
    <span class="c">// process মাঝপথে ক্র্যাশ করলেও ঠিক যেখানে ছিল সেখান থেকেই আবার শুরু হয়</span>
});</pre>
<div class="callout behind"><span class="tag">গভীরে — কীভাবে orchestrator function "মাঝপথ থেকে" আবার চলতে পারে</span>
Durable Functions-এর runtime প্রতিটা <code>yield</code>-এর ফলাফল event history হিসেবে persist করে রাখে (event sourcing প্যাটার্ন)। orchestrator function যখন আবার re-invoke হয় (checkpoint-এর পর, বা crash recovery-তে), পুরো ফাংশনটা প্রথম থেকেই আবার চলে, কিন্তু ইতিমধ্যে সম্পন্ন হওয়া activity-গুলোর ফলাফল history থেকে সরাসরি "replay" হয় — নতুন করে সেই activity আবার চলে না। এই কারণেই orchestrator function-এর ভেতরে non-deterministic কোড (যেমন <code>Date.now()</code> বা random) লেখা নিষেধ, কারণ replay-এর সময় সেটা ভিন্ন ফলাফল দিতে পারে এবং পুরো state history-র সাথে অসামঞ্জস্য তৈরি করবে।</div>

<h3>Logic Apps — Low-code Alternative</h3>
<p><span class="kw">Logic Apps</span> Functions-এর মতোই workflow orchestration করে, কিন্তু একদম ভিন্ন পদ্ধতিতে — এটা একটা visual, drag-and-drop workflow designer, যেখানে কোড লেখার বদলে কানেক্টর যুক্ত করে workflow বানানো হয়। শত শত built-in connector আছে (Office 365, Salesforce, SAP, Twitter, SQL, ইত্যাদি), যেগুলো Function-এ হাতে লিখতে হলে অনেক বেশি সময় লাগত।</p>
<table>
<tr><th>বিষয়</th><th>Azure Functions</th><th>Logic Apps</th></tr>
<tr><td>ডেভেলপমেন্ট মডেল</td><td>কোড লেখা (JS/C#/Python/...)</td><td>Visual designer, low-code/no-code</td></tr>
<tr><td>উপযুক্ত টিম</td><td>ডেভেলপার</td><td>ডেভেলপার ও non-developer উভয়ই</td></tr>
<tr><td>Complex logic/algorithm</td><td>সহজ — যেকোনো প্রোগ্রামিং লজিক লেখা যায়</td><td>সীমিত — জটিল conditional/loop logic লিখতে অসুবিধা</td></tr>
<tr><td>Third-party integration</td><td>নিজে কোড লিখে SDK/API কল করতে হয়</td><td>শত শত built-in connector রেডি</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — টিমের দক্ষতা ও কাজের ধরন দেখে বেছে নিন</span>
জটিল business logic বা custom algorithm-নির্ভর কাজে Functions ভালো, কারণ পূর্ণ প্রোগ্রামিং ভাষার ক্ষমতা পাওয়া যায়। কিন্তু "SharePoint-এ ফাইল এলে Teams-এ notification পাঠাও, তারপর Excel-এ log রাখো"-জাতীয় সাধারণ integration workflow-এর জন্য Logic Apps অনেক দ্রুত বানানো যায় ও maintain করা সহজ — বিশেষত non-developer stakeholder-রাও workflow দেখে বুঝতে পারে।</div>

<h3>Cold Start — সংক্ষিপ্ত রিক্যাপ</h3>
<p>Request না এলে Consumption Plan-এ কোনো compute বরাদ্দ থাকে না — request এলেই নতুন execution environment provision হয়, কোড লোড হয়, runtime বুট হয়, তারপর handler চলে। এই প্রভিশনিং সময়টাই <span class="kw">Cold Start</span>, যেটা universal serverless concept — AWS Lambda-তেও একই কারণে ঘটে। ধারাবাহিক ট্রাফিকে বেশিরভাগ request "warm" (পুরনো environment reuse) হিসেবে সার্ভ হয়, cold start শুধু নতুন স্পাইক বা দীর্ঘ নিষ্ক্রিয়তার পরেই দেখা দেয়।</p>
</template>

<template data-page="apim">
<h2 class="title">১৩. API Management</h2>
<p class="lead">যখন একটা organization-এ অনেকগুলো backend API থাকে — কিছু internal team-এর বানানো, কিছু legacy, কিছু নতুন microservice — তখন client-দের জন্য এগুলোকে সরাসরি expose করা বিশৃঙ্খল হয়ে যায়। <span class="kw">Azure API Management (APIM)</span> এই backend API-গুলোর সামনে একটা managed gateway layer বসায়, যেখানে versioning, security, throttling আর documentation একজায়গায় কেন্দ্রীভূত থাকে।</p>

<h3>APIM আসলে কী সমস্যা সমাধান করে</h3>
<p>ধরুন আপনার কাছে ১০টা মাইক্রোসার্ভিস আছে, প্রতিটা আলাদা টিমের বানানো, আলাদা authentication scheme, আলাদা error format। client অ্যাপকে যদি সরাসরি এই ১০টা backend-এর সাথে কথা বলতে হয়, তাহলে backend-এর যেকোনো পরিবর্তনে client-ও ভেঙে যাবে। APIM এই backend-গুলোর সামনে একটা <b>একক, স্থিতিশীল facade</b> তৈরি করে দেয় — client শুধু APIM-এর একটা consistent URL আর contract-এর সাথে কথা বলে, backend যেভাবেই বদলাক না কেন।</p>
<div class="callout why"><span class="tag">কেন gateway layer দরকার — decoupling</span> APIM ছাড়া প্রতিটা backend সার্ভিসকে নিজে নিজে authentication, rate-limiting, logging ইমপ্লিমেন্ট করতে হতো। APIM এই cross-cutting concern-গুলোকে backend কোড থেকে আলাদা করে একটা কেন্দ্রীয় layer-এ নিয়ে আসে — backend developer শুধু business logic নিয়ে ভাবে, বাকিটা policy দিয়ে হ্যান্ডেল হয়।</div>

<h3>মূল Component: API, Product, Subscription</h3>
<p>APIM-এ একটা <span class="kw">API</span> মানে হলো কোনো backend-এর একটা definition বা wrapper — এতে operation (GET /users, POST /orders ইত্যাদি), schema, এবং কোন backend URL-এ এটা route হবে তা সংজ্ঞায়িত থাকে। কিন্তু client-কে সরাসরি API expose করা হয় না — এর বদলে একাধিক API-কে একসাথে গ্রুপ করে একটা <span class="kw">Product</span> তৈরি করা হয়।</p>
<p>Product হলো subscription-যোগ্য একটা বান্ডেল। যেমন আপনি "Free Tier" নামে একটা Product বানাতে পারেন যাতে Weather API আর News API আছে, rate limit ১০০ call/দিন — আর "Premium" Product-এ একই API-গুলো আছে কিন্তু rate limit ১০,০০০ call/দিন এবং কিছু অতিরিক্ত API যুক্ত। এভাবে একই backend API-কে ভিন্ন ভিন্ন commercial tier-এ বিক্রি করা যায় কোনো backend কোড না ছুঁয়ে।</p>

<h3>Subscription Key — client অ্যাক্সেস নিয়ন্ত্রণ</h3>
<p>যখন কোনো client কোনো Product-এ subscribe করে, তাকে একটা <span class="kw">Subscription Key</span> ইস্যু করা হয় (অন্য gateway-তে যেটাকে API Key/Usage Plan বলা হয়, সেই সমতুল্য)। প্রতিটা request-এ এই key পাঠাতে হয় (সাধারণত <code>Ocp-Apim-Subscription-Key</code> header-এ), APIM এই key দিয়ে চিহ্নিত করে কোন client, কোন Product, তাই কোন rate limit প্রযোজ্য।</p>
<div class="callout mistake"><span class="tag">Common mistake — Subscription Key-কে authentication মনে করা</span> Subscription Key client-কে <b>শনাক্ত ও metering</b> করে, কিন্তু এটা নিজে strong authentication না। production-এ এর সাথে অবশ্যই OAuth 2.0/JWT validation policy যোগ করা উচিত — নাহলে key leak হলে যে কেউ Product ব্যবহার করতে পারবে।</div>

<h3>Policy — APIM-এর সবচেয়ে শক্তিশালী ফিচার</h3>
<p>APIM-এর আসল ক্ষমতা লুকানো আছে <span class="kw">Policy</span>-তে। এটা একটা XML-ভিত্তিক pipeline যেখানে চারটা section থাকে — <code>inbound</code> (request backend-এ যাওয়ার আগে), <code>backend</code> (backend call করার সময়), <code>outbound</code> (response client-এ ফেরত যাওয়ার আগে), আর <code>on-error</code> (কোনো ধাপে ব্যর্থ হলে)। এই pipeline-এ কোনো backend কোড না ছুঁয়েই rate-limiting, JWT validation, caching, IP filtering, request/response rewrite ইনজেক্ট করা যায়।</p>
<pre>&lt;policies&gt;
  &lt;inbound&gt;
    &lt;base /&gt;
    <span class="c">&lt;!-- প্রতি সাবস্ক্রিপশন key-তে মিনিটে ৫টা call, বার্স্ট ১০ পর্যন্ত --&gt;</span>
    &lt;rate-limit-by-key calls="5" renewal-period="60"
        counter-key="@(context.Subscription.Id)" /&gt;
    &lt;validate-jwt header-name="Authorization"
        failed-validation-httpcode="401"&gt;
      &lt;openid-config url="https://login.microsoftonline.com/common/.well-known/openid-configuration" /&gt;
    &lt;/validate-jwt&gt;
  &lt;/inbound&gt;
  &lt;backend&gt;
    &lt;base /&gt;
  &lt;/backend&gt;
  &lt;outbound&gt;
    &lt;base /&gt;
    <span class="c">&lt;!-- response header থেকে backend-এর internal সার্ভার নাম মুছে ফেলা --&gt;</span>
    &lt;set-header name="X-Powered-By" exists-action="delete" /&gt;
  &lt;/outbound&gt;
  &lt;on-error&gt;
    &lt;base /&gt;
  &lt;/on-error&gt;
&lt;/policies&gt;</pre>
<div class="callout best"><span class="tag">Best practice — policy scope layering</span> Policy Global, Product, API, বা individual Operation level-এ বসানো যায়, আর <code>&lt;base /&gt;</code> ট্যাগ দিয়ে parent scope-এর policy inherit করা যায়। সাধারণ নিয়ম: JWT validation ও rate-limit Global/Product level-এ রাখুন, আর operation-specific caching/rewrite নিচের level-এ রাখুন — এতে duplication কমে।</div>

<h3>Developer Portal</h3>
<p>APIM প্রতিটা instance-এর সাথে স্বয়ংক্রিয়ভাবে একটা <span class="kw">Developer Portal</span> তৈরি করে দেয় — এটা একটা interactive, browsable ডকুমেন্টেশন সাইট যেখানে যেকোনো ডেভেলপার আপনার publish করা API দেখতে, নিজের Subscription Key দিয়ে সরাসরি ব্রাউজার থেকে test call করতে, এমনকি code sample (cURL, C#, Python ইত্যাদি) auto-generate করতে পারে।</p>
<div class="callout behind"><span class="tag">কেন এটা বড় productivity সুবিধা</span> সাধারণত API ডকুমেন্টেশন লেখা আর maintain করা backend team-এর জন্য বাড়তি বোঝা, আর প্রায়ই পুরনো হয়ে যায়। Developer Portal API definition (OpenAPI/Swagger schema) থেকে সরাসরি ডকুমেন্টেশন জেনারেট করে, তাই কোড আর ডকুমেন্টেশন কখনো out-of-sync হয় না — self-service onboarding-এর সময় অনেক কমে যায়।</div>

<h3>Gateway Tier ও Self-hosted Gateway</h3>
<p>APIM-এর managed gateway Azure-এর নিজস্ব region-এ চলে, কিন্তু কিছু organization-এর দরকার হয় on-premises বা অন্য cloud-এ থাকা backend-কেও একই policy/security মডেলের আওতায় আনতে। এজন্য APIM-এর <span class="kw">Self-hosted Gateway</span> ফিচার আছে — এটা একটা containerized gateway যা আপনার নিজের infrastructure-এ (Kubernetes cluster, on-prem VM) চালানো যায়, কিন্তু control plane, policy configuration, analytics সবই কেন্দ্রীয়ভাবে Azure APIM instance থেকেই ম্যানেজ হয়।</p>

<h2 class="title">১৪. Service Bus, Event Grid ও Event Hub</h2>
<p class="lead">Azure-এ messaging আর eventing-এর জন্য চারটা ভিন্ন সার্ভিস আছে — Storage Queue, Service Bus, Event Grid, আর Event Hub — এবং প্রতিটা একদম আলাদা সমস্যা সমাধানের জন্য ডিজাইন করা। নাম দেখে গুলিয়ে ফেলা সহজ, তাই এই পার্থক্যগুলো interview আর production দুই জায়গাতেই ভীষণ গুরুত্বপূর্ণ।</p>

<h3>Storage Queue vs Service Bus Queue — কেন দুইটা আলাদা queue প্রোডাক্ট</h3>
<p>AWS-এ queue-এর জন্য একটাই সার্ভিস — SQS। কিন্তু Azure-এ দুইটা সম্পূর্ণ আলাদা queue প্রোডাক্ট আছে, এবং এটা কোনো accident না — দুইটা ভিন্ন ব্যবহারের ধরনের জন্য দুইটা ভিন্ন design trade-off।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>Storage Queue</th><th>Service Bus Queue</th></tr>
<tr><td>উদ্দেশ্য</td><td>সাধারণ, সহজ background task queue</td><td>Enterprise messaging pattern</td></tr>
<tr><td>মূল্য</td><td>খুবই সস্তা</td><td>তুলনামূলক দামি</td></tr>
<tr><td>Capacity</td><td>একটা queue-তে ৫০০ TB পর্যন্ত</td><td>queue প্রতি সীমিত (৮০ GB পর্যন্ত, partitioning ছাড়া)</td></tr>
<tr><td>Message ordering</td><td>নিশ্চিত না (best-effort)</td><td>Session ব্যবহার করলে strict FIFO সম্ভব</td></tr>
<tr><td>Session</td><td>নেই</td><td>আছে — related message group-কে একসাথে, ক্রমানুসারে প্রসেস করা যায়</td></tr>
<tr><td>Dead-lettering</td><td>নিজে নেই (poison message ম্যানুয়ালি হ্যান্ডেল করতে হয়)</td><td>বিল্ট-ইন Dead Letter Queue</td></tr>
<tr><td>Duplicate Detection</td><td>নেই</td><td>আছে — নির্দিষ্ট সময় window-এ duplicate message বাতিল</td></tr>
<tr><td>Transaction</td><td>নেই</td><td>আছে — একাধিক অপারেশন atomically commit/rollback</td></tr>
<tr><td>Max message size</td><td>৬৪ KB (base64 encode করলে আরও কম)</td><td>২৫৬ KB (Premium tier-এ ১০০ MB পর্যন্ত)</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Azure-এ দুইটা queue আছে</span> Storage Queue আসলে Azure Storage-এরই একটা অংশ — এটা সস্তা, বিশাল স্কেলে সাধারণ "কাজ পরে করব" টাইপের background job-এর জন্য যথেষ্ট। কিন্তু enterprise integration pattern-এ (যেমন ব্যাংকিং transaction, order processing pipeline) দরকার হয় strict ordering, duplicate না হওয়ার গ্যারান্টি, আর transactional আচরণ — এইজন্য Microsoft একদম আলাদা, ভারী messaging broker হিসেবে Service Bus বানিয়েছে, যা মূলত পুরনো enterprise message broker (MSMQ) ঐতিহ্যের উত্তরসূরি। দুইটা এক সার্ভিসে মেশালে সাধারণ ব্যবহারকারীকে অহেতুক জটিলতা আর খরচ বহন করতে হতো।</div>
<div class="callout mistake"><span class="tag">Common mistake — সব জায়গায় Service Bus বেছে নেওয়া</span> "enterprise" নাম শুনে অনেকে সব ক্ষেত্রে Service Bus ব্যবহার করেন, যদিও একটা সাধারণ background email-sending queue-এর জন্য Storage Queue-ই যথেষ্ট এবং অনেক সস্তা। উল্টো দিকে, related message-এর strict ordering দরকার হলে Storage Queue দিয়ে তা implement করা কষ্টকর — সেখানে Service Bus Session-ই সঠিক সমাধান।</div>

<h3>Service Bus Topic ও Subscription — Pub-Sub</h3>
<p>Service Bus শুধু point-to-point queue না, এতে <span class="kw">Topic</span> ও <span class="kw">Subscription</span> মডেলও আছে — pub-sub/fan-out-এর জন্য (SNS-এর সমতুল্য ধারণা)। একজন publisher একটা Topic-এ message পাঠায়, আর একাধিক Subscription স্বাধীনভাবে সেই একই message-এর একটা কপি পায়। প্রতিটা Subscription নিজের <span class="kw">SQL Filter</span> বা Correlation Filter রাখতে পারে, তাই একটা Subscription শুধু নির্দিষ্ট শর্ত পূরণ করা message-ই গ্রহণ করবে।</p>
<div class="diagram"><pre>
                         ┌──────────────────────┐
                         │  Subscription: "Orders>1000" │──▶ High-value পাইপলাইন
                         │  Filter: Amount > 1000        │
Publisher ──▶ [ Topic ] ─┤──────────────────────┤
                         │  Subscription: "AllOrders"     │──▶ Analytics সার্ভিস
                         │  Filter: (none)                │
                         ├──────────────────────┤
                         │  Subscription: "Region=BD"     │──▶ Regional handler
                         │  Filter: Region = 'BD'          │
                         └──────────────────────┘
</pre></div>

<h3>Event Grid — Event Routing</h3>
<p><span class="kw">Event Grid</span> একটা event routing সার্ভিস — কোনো source-এ (যেমন Blob Storage-এ একটা নতুন ফাইল আপলোড, বা resource group-এ কোনো resource তৈরি) event ঘটলে, Event Grid সেই discrete event-টা subscription-ভিত্তিক ফিল্টার করে এক বা একাধিক handler-এ push করে দেয় (EventBridge-এর সমতুল্য ধারণা)। এটা push-based, near-real-time, আর latency খুবই কম — সাধারণত সেকেন্ডের ভগ্নাংশের মধ্যে handler-এ পৌঁছে যায়।</p>

<h3>Event Hub — High-throughput Streaming Ingestion</h3>
<p><span class="kw">Event Hub</span> সম্পূর্ণ ভিন্ন সমস্যার সমাধান — এটা লক্ষ লক্ষ device বা source থেকে আসা continuous data stream ingest করার জন্য ডিজাইন করা (Kinesis Data Streams-এর সমতুল্য ধারণা), যেমন IoT sensor telemetry বা clickstream analytics। এখানে প্রতিটা event আলাদা "ঘটনা" না, বরং বিশাল আয়তনের ধারাবাহিক ডেটা।</p>
<p>Event Hub-এর মূল ধারণা হলো <span class="kw">Partition</span> ও <span class="kw">Consumer Group</span>। একটা Event Hub একাধিক Partition-এ ভাগ করা থাকে, প্রতিটা partition-এ event ordered sequence হিসেবে জমা হয় (অনেকটা append-only log)। <span class="kw">Consumer Group</span> হলো এক ধরনের independent "view" — প্রতিটা Consumer Group সম্পূর্ণ স্বাধীনভাবে পুরো stream পড়তে পারে নিজের গতিতে, নিজের checkpoint (কোন offset পর্যন্ত পড়া হয়েছে) রেখে। ডেটা কনজিউম করলেও মুছে যায় না — retention period (যেমন ১ থেকে ৭ দিন, বা Capture-এ আরও বেশি) পর্যন্ত থেকে যায়, ঠিক Kinesis-এর cursor/checkpoint মডেলের মতোই।</p>
<div class="diagram"><pre>
Producer ──▶ Event Hub
              ┌─ Partition 0: [e1][e4][e7]... ─┐
              ├─ Partition 1: [e2][e5][e8]... ─┤
              └─ Partition 2: [e3][e6][e9]... ─┘
                       │                │
              ┌────────┴──────┐  ┌──────┴─────────┐
              │ Consumer Group:  │  │ Consumer Group:   │
              │ "real-time-dash" │  │ "analytics-batch"  │
              │ offset: latest   │  │ offset: ১ ঘণ্টা পিছনে │
              └──────────────┘  └────────────────┘
</pre></div>
<div class="callout why"><span class="tag">কেন Event Grid আর Event Hub আলাদা করে বোঝা জরুরি</span> <b>Event Grid</b> হলো reactive routing — "একটা নির্দিষ্ট জিনিস ঘটেছে" এই তথ্য push করে এক বা একাধিক handler-কে জানানো, প্রতিটা event আলাদাভাবে গুরুত্বপূর্ণ। <b>Event Hub</b> হলো continuous ingestion — "প্রচুর ডেটা ক্রমাগত আসছে" পরিস্থিতির জন্য, individual event তেমন গুরুত্বপূর্ণ না, গুরুত্বপূর্ণ হলো পুরো stream-এর throughput আর পরে batch/analytics pipeline-এ প্রসেস করার সক্ষমতা। একটাকে অন্যটার বদলে ব্যবহার করলে হয় latency বেড়ে যায় (Event Hub দিয়ে discrete event route করলে), নয়তো throughput bottleneck হয় (Event Grid দিয়ে millions/sec telemetry ingest করার চেষ্টা করলে)।</div>
<div class="callout mistake"><span class="tag">Common mistake — নাম দেখে গুলিয়ে ফেলা</span> Interview-এ সবচেয়ে বেশি ভুল হওয়া প্রশ্নগুলোর একটা এই দুইটার পার্থক্য। মনে রাখার সহজ উপায়: Event <b>Grid</b> = রাউটিং গ্রিড, event ছড়িয়ে দেয়। Event <b>Hub</b> = কেন্দ্রীয় streaming হাব, বিশাল ডেটার স্রোত জমা করে।</div>

<h3>সিদ্ধান্ত সারসংক্ষেপ</h3>
<table>
<tr><th>প্রয়োজন</th><th>সঠিক সার্ভিস</th></tr>
<tr><td>সাধারণ, সস্তা background job queue</td><td>Storage Queue</td></tr>
<tr><td>Ordering, dead-letter, duplicate detection, transaction দরকার</td><td>Service Bus Queue</td></tr>
<tr><td>একই message একাধিক consumer-কে filter-ভিত্তিক পাঠানো (pub-sub)</td><td>Service Bus Topic/Subscription</td></tr>
<tr><td>"কিছু একটা ঘটলো" — discrete event একাধিক handler-এ route করা</td><td>Event Grid</td></tr>
<tr><td>লক্ষ লক্ষ device/source থেকে continuous telemetry/log stream ingest</td><td>Event Hub</td></tr>
</table>

<template data-page="containers">
<h2 class="title">১৫. AKS, Container Instances ও Containers</h2>
<p class="lead">Container চালানোর জন্য Azure-এ একাধিক স্তরের সার্ভিস আছে — সবচেয়ে সহজ serverless single-container থেকে শুরু করে পূর্ণাঙ্গ Kubernetes orchestration পর্যন্ত। কোন স্তর বাছাই করবেন তা নির্ভর করে team-এর operational maturity আর workload pattern-এর উপর।</p>

<h3>Container Orchestration কেন প্রয়োজন</h3>
<p>একটা container চালানো সহজ, কিন্তু production-এ শত শত container-কে scale, health-check, service-discovery, rolling update করানো — এটাই orchestration-এর কাজ। এই concept সার্বজনীন (Docker/Kubernetes course-এ বিস্তারিত আলোচিত), Azure-এ মূল প্রশ্ন হলো — এই orchestration নিজে ম্যানেজ করবেন, নাকি Azure-কে করতে দেবেন, নাকি একদমই দরকার নেই।</p>

<h3>Azure Container Instances (ACI) — সবচেয়ে সহজ পথ</h3>
<p><span class="kw">Azure Container Instances (ACI)</span> হলো সার্ভারলেস container চালানোর সবচেয়ে সহজ উপায় — কোনো VM বা cluster provision/manage করতে হয় না, একটা কমান্ডে একটা single container বা container group সরাসরি চালানো যায় (AWS Fargate-এর সমতুল্য ধারণা)। বিলিং হয় per-second, তাই short-lived বা burst workload-এ (batch job, CI pipeline-এর একটা ধাপ) এটা খুবই সাশ্রয়ী।</p>
<pre>az container create \
  --resource-group myRG \
  --name mytask \
  --image myregistry.azurecr.io/worker:v1 \
  --cpu 1 --memory 1.5 \
  --restart-policy Never</pre>
<div class="callout why"><span class="tag">কেন ACI cluster ছাড়াই কাজ করে</span> ACI-তে Azure নিজেই underlying compute host, networking, scheduling সব লুকিয়ে ম্যানেজ করে — আপনি শুধু "এই image এই resource দিয়ে চালাও" বলেন। এটা একটা single-purpose abstraction, তাই Kubernetes-এর মতো self-healing/service-discovery/rolling-update ফিচার এখানে নেই — দরকারও নেই যদি কাজটা এক-বার-চালাও-শেষ টাইপের হয়।</div>

<h3>Azure Kubernetes Service (AKS) — Managed Control Plane</h3>
<p><span class="kw">AKS</span> হলো Azure-এর managed Kubernetes অফারিং — AWS EKS-এর মতোই, Azure নিজে Kubernetes control plane (API server, etcd, scheduler) হোস্ট ও ম্যানেজ করে, বিনামূল্যে (শুধু node-এর জন্য চার্জ), আর node pool-এর দায়িত্ব গ্রাহকের।</p>
<p>AKS-এ <span class="kw">Node Pool</span> একটা গুরুত্বপূর্ণ ধারণা — প্রতিটা cluster-এ কমপক্ষে একটা <b>system node pool</b> থাকে যেখানে Kubernetes-এর core system component (CoreDNS, metrics-server ইত্যাদি) চলে, আর ঐচ্ছিকভাবে এক বা একাধিক <b>user node pool</b> যেখানে আপনার application workload চলে।</p>
<div class="callout why"><span class="tag">কেন system আর user node pool আলাদা রাখা হয়</span> system node pool-এ যদি আপনার application workload-ও চলে, আর সেই workload হঠাৎ node-এর সব resource খেয়ে ফেলে (noisy neighbor), তাহলে DNS resolution বা metrics collection-এর মতো critical system component-ও ব্যর্থ হতে পারে, পুরো cluster অস্থির হয়ে যাবে। আলাদা user node pool রাখলে application-এর resource চাহিদা (GPU node, spot instance, ভিন্ন VM size) system-এর থেকে স্বাধীনভাবে scale করা যায়, এবং node pool-ভিত্তিক upgrade/drain আলাদাভাবে করা যায়।</div>
<div class="callout best"><span class="tag">Best practice — production cluster-এ workload isolate করুন</span> কখনো application pod-কে system node pool-এ schedule হতে দেবেন না — <code>CriticalAddonsOnly</code> taint ব্যবহার করে system pool-কে সংরক্ষিত রাখুন, আর application-এর জন্য আলাদা user node pool বানান, প্রয়োজনে node pool-ভিত্তিক autoscaler কনফিগার করুন।</div>

<h3>Azure Container Registry (ACR) — Private Image Registry</h3>
<p><span class="kw">Azure Container Registry (ACR)</span> হলো আপনার container image-এর জন্য private registry। এতে geo-replication সাপোর্ট আছে — একটা image push করলে একাধিক region-এ automatically replicate হয়ে যায়, ফলে বিভিন্ন region-এর AKS cluster কাছের registry থেকে দ্রুত image pull করতে পারে।</p>
<p>ACR আর AKS-এর মধ্যে integration হয় <span class="kw">Managed Identity</span> দিয়ে — AKS cluster তৈরির সময় ACR attach করে দিলে, node-গুলো কোনো hardcoded docker credential ছাড়াই সরাসরি image pull করতে পারে।</p>
<div class="callout why"><span class="tag">কেন managed identity নিরাপত্তার দিক থেকে ভালো</span> সাধারণ পদ্ধতিতে ACR-এর username/password বা service principal secret কোথাও (Kubernetes secret, CI variable) সংরক্ষণ করতে হয়, যা leak হওয়ার ঝুঁকি রাখে আর নিয়মিত rotate করতে হয়। Managed Identity ব্যবহার করলে কোনো credential-ই কোথাও store করতে হয় না — Azure AD নিজেই node-এর identity যাচাই করে অস্থায়ী token ইস্যু করে, credential leak-এর ঝুঁকি একদমই থাকে না।</div>

<h3>App Service for Containers</h3>
<p><span class="kw">App Service for Containers</span> একটা single container-কে PaaS web app হিসেবে চালানোর উপায় — deployment খুবই সহজ (একটা image দিন, Azure বাকিটা করে), কিন্তু এতে multi-container orchestration, custom scheduling, বা complex networking ফিচার নেই। এটা মূলত সেই application-এর জন্য যেগুলোর জন্য একটা single web/API container যথেষ্ট।</p>
<div class="diagram"><pre>
সহজ ─────────────────────────────────────────▶ জটিল/নমনীয়

 App Service         ACI                  AKS
 for Containers    (serverless          (full
 (single web app,   single container/    orchestration,
  auto-scale সীমিত)  group, per-second     node pool,
                     billing)             self-healing)
</pre></div>

<h3>ACI vs AKS vs App Service for Containers — সিদ্ধান্ত টেবিল</h3>

<tr><th>বিবেচ্য বিষয়</th><th>ACI</th><th>AKS</th><th>App Service for Containers</th></tr>
<tr><td>Team-এর Kubernetes অভিজ্ঞতা</td><td>দরকার নেই</td><td>প্রয়োজন</td><td>দরকার নেই</td></tr>

<template data-page="iac">
<h2 class="title">১৬. ARM, Bicep ও IaC</h2>
<p class="lead">Infrastructure as Code (IaC)-এর মূল ধারণা সার্বজনীন — infrastructure-কে কোড হিসেবে সংজ্ঞায়িত করে version control, review, আর পুনরাবৃত্তিযোগ্য deployment সম্ভব করা। Azure-এ এই কাজের জন্য প্রধান দুইটা টুল — ARM Template ও তার আধুনিক উত্তরসূরি Bicep।</p>

<h3>ARM Template — JSON-ভিত্তিক Declarative Foundation</h3>
<p><span class="kw">ARM Template (Azure Resource Manager Template)</span> হলো Azure-এর native declarative infrastructure format — JSON-এ লেখা, যেখানে আপনি বলে দেন "শেষ পর্যন্ত অবস্থা কেমন হওয়া উচিত", কীভাবে সেখানে পৌঁছাতে হবে তা Azure Resource Manager নিজেই বের করে। এতে চারটা মূল section থাকে — <code>parameters</code> (input value), <code>variables</code> (reusable expression), <code>resources</code> (আসল resource definition), আর <code>outputs</code> (deployment শেষে ফেরত দেওয়া value)।</p>
<pre>{
  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
  "contentVersion": "1.0.0.0",
  "parameters": {
    "storageAccountName": { "type": "string" }
  },
  "resources": [
    {
      "type": "Microsoft.Storage/storageAccounts",
      "apiVersion": "2023-01-01",
      "name": "[parameters('storageAccountName')]",
      "location": "[resourceGroup().location]",
      "sku": { "name": "Standard_LRS" },
      "kind": "StorageV2"
    }
  ]
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — ARM JSON-এর verbosity underestimate করা</span> উপরের ছোট উদাহরণেও দেখা যাচ্ছে একটা মাত্র storage account-এর জন্য কতটা boilerplate লাগে। বাস্তব প্রজেক্টে যখন একাধিক resource, nested template, conditional logic যোগ হয়, তখন ARM JSON পড়া আর maintain করা কঠিন হয়ে যায় — string-এর ভেতরে function call (<code>"[parameters('x')]"</code>) লেখার syntax স্বাভাবিকভাবেই error-prone।</div>

<h3>Bicep — Transparent Abstraction Layer</h3>
<p>এই সমস্যা সমাধানের জন্য Microsoft বানিয়েছে <span class="kw">Bicep</span> — Azure-এর নিজস্ব declarative DSL (Domain-Specific Language), যা লেখার পর <b>transpile/compile হয়ে ARM JSON-এ পরিণত হয়</b>। এখানে জোর দেওয়া জরুরি একটা বিষয়: Bicep নিজে একটা declarative language, AWS CDK-এর মতো general-purpose প্রোগ্রামিং ভাষা (TypeScript/Python) না — এতে loop/condition-এর মতো সীমিত কিছু construct আছে, কিন্তু এটা মূলত "কী resource চাই" বলার একটা পরিষ্কার syntax, প্রোগ্রামিং না।</p>
<div class="callout why"><span class="tag">কেন Bicep-এ আলাদা state file বা deployment engine নেই</span> AWS CDK যেমন synthesize হয়ে CloudFormation template তৈরি করে, আর CloudFormation-ই deployment engine হিসেবে কাজ করে (state Cloud নিজে রাখে) — ঠিক একই যুক্তিতে Bicep শুধু ARM JSON-এ transpile হয়, deployment ঘটায় সেই একই পুরনো Azure Resource Manager engine, একই idempotency আর deployment history মেকানিজম দিয়ে। ফলে Bicep গ্রহণ করার জন্য নতুন কোনো backend/state-management ইনফ্রাস্ট্রাকচার লাগে না — শুধু syntax বদলায়, engine একই থাকে।</div>
<p>একই storage account Bicep-এ কতটা সংক্ষিপ্ত হয়ে যায় দেখুন:</p>
<pre>param storageAccountName string

resource storage 'Microsoft.Storage/storageAccounts@2023-01-01' = {
  name: storageAccountName
  location: resourceGroup().location
  sku: {
    name: 'Standard_LRS'
  }
  kind: 'StorageV2'
}</pre>
<div class="callout behind"><span class="tag">সংক্ষিপ্ততার পেছনের কারণ</span> Bicep-এ কোনো <code>"[parameters('x')]"</code> string-function syntax নেই — সরাসরি variable reference করা যায়, type-checking compile time-এই হয়, আর IDE-তে IntelliSense/auto-complete কাজ করে কারণ Bicep resource schema-গুলো strongly typed। এই কারণেই একই resource প্রায় অর্ধেকেরও কম লাইনে লেখা সম্ভব হয়।</div>

<h3>Deployment Stack ও What-If</h3>
<p>Deploy করার আগে ঠিক কী change হতে যাচ্ছে তা preview করা জরুরি (production-এ কোনো accidental resource delete বা recreate এড়াতে)। এজন্য Azure দেয় <span class="kw">What-If</span> অপারেশন — এটা template apply না করেই বর্তমান state আর desired state তুলনা করে দেখায় কোন resource তৈরি হবে, কোনটা modify হবে, কোনটা delete হবে (CloudFormation-এর Change Set-এর সমতুল্য যুক্তি)।</p>
<pre>az deployment group what-if \
  --resource-group myRG \
  --template-file main.bicep \
  --parameters storageAccountName=mystorageacct01</pre>
<p><span class="kw">Deployment Stack</span> হলো একধাপ এগিয়ে — এটা একাধিক deployment-কে একটা logical unit হিসেবে group করে ট্র্যাক করে, এবং একটা গুরুত্বপূর্ণ ফিচার দেয়: <b>deny settings</b> ও automatic cleanup — যদি নতুন deployment থেকে কোনো resource সরিয়ে ফেলা হয়, Deployment Stack স্বয়ংক্রিয়ভাবে সেই এতিম (orphaned) resource detect করে delete করতে পারে, যা আলাদা deployment-এ ম্যানুয়ালি ট্র্যাক করতে হতো।</p>
<div class="callout best"><span class="tag">Best practice — সবসময় What-If দিয়ে review করুন</span> CI/CD pipeline-এ production deploy-এর আগে অবশ্যই What-If ধাপ যোগ করুন এবং output manually বা approval gate-এ review করুন — বিশেষ করে যখন resource property change দেখাচ্ছে "delete then recreate" (যেমন storage account-এর কিছু immutable property বদলালে), কারণ এতে ডেটা loss হতে পারে।</div>

<h3>Bicep vs Terraform</h3>
<p>Bicep আর Terraform দুটোই declarative IaC টুল, কিন্তু scope আর state management-এ মৌলিক পার্থক্য আছে।</p>
<table>
<tr><th>বিষয়</th><th>Bicep / ARM</th><th>Terraform</th></tr>
<tr><td>Scope</td><td>শুধু Azure-only</td><td>Multi-cloud (Azure, AWS, GCP, on-prem ইত্যাদি)</td></tr>
<tr><td>State management</td><td>আলাদা state file নেই — Azure Resource Manager নিজেই deployment history রাখে</td><td>নিজস্ব state file রাখে (local বা remote backend, যেমন blob storage)</td></tr>
<tr><td>ভাষা</td><td>Azure-specific declarative DSL, ARM JSON-এ compile হয়</td><td>HCL (HashiCorp Configuration Language), provider-ভিত্তিক</td></tr>
<tr><td>Provider ecosystem</td><td>শুধু Azure resource</td><td>শত শত third-party provider (Datadog, GitHub, Cloudflare ইত্যাদি)</td></tr>
<tr><td>State drift সমস্যা</td><td>কম — কারণ কোনো local state file sync রাখতে হয় না</td><td>থাকতে পারে যদি state file হারিয়ে যায় বা বাইরে থেকে resource পরিবর্তন হয়</td></tr>
</table>
<div class="callout why"><span class="tag">কেন state file-এর পার্থক্য গুরুত্বপূর্ণ</span> Terraform-কে জানতে হয় বর্তমান বাস্তব অবস্থা কী, তাই এটা নিজের state file-এ সব resource-এর তথ্য ট্র্যাক রাখে — এই state file হারালে বা corrupt হলে Terraform confuse হয়ে যায় ("resource আছে কিন্তু state-এ নেই" জাতীয় সমস্যা)। Bicep/ARM-এ এই সমস্যা নেই কারণ Azure নিজেই deployment engine এবং resource-এর প্রকৃত মালিক — তাই "state" বলে আলাদা কিছু sync রাখার দরকার পড়ে না, যা multi-team পরিবেশে অপারেশনাল ঝুঁকি কমায় কিন্তু multi-cloud নমনীয়তা কমায়।</div>

</template>

<h2 class="title">১৭. Azure Monitor ও Observability</h2>
<p class="lead">প্রোডাকশনে একটা সিস্টেম "চলছে" মানেই যথেষ্ট না — কে কবে কী পরিবর্তন করলো, অ্যাপ্লিকেশন ভেতরে কোথায় ধীর হচ্ছে, আর সমস্যা হওয়ার আগেই কীভাবে সংকেত পাওয়া যায় — এই তিনটা প্রশ্নের উত্তর একসাথে দেয় Azure-এর observability স্ট্যাক, যার ছাতা হলো <span class="kw">Azure Monitor</span>।</p>

<h3>Azure Monitor — একটা umbrella platform</h3>
<p>Azure Monitor নিজে একটা আলাদা "সার্ভিস" না, বরং একটা প্ল্যাটফর্ম যেটা Azure-এর প্রায় প্রতিটা resource থেকে দুই ধরনের টেলিমেট্রি সংগ্রহ করে — <b>Metrics</b> (সময়ের সাথে বদলানো সংখ্যা, যেমন CPU % বা রিকোয়েস্ট কাউন্ট, লাইটওয়েট এবং প্রায় রিয়েল-টাইম) আর <b>Logs</b> (গঠনবিহীন বা semi-structured ইভেন্ট রেকর্ড, যেমন এক্সসেপশন স্ট্যাক ট্রেস বা রিসোর্স ক্রিয়েশন ইভেন্ট)। এই দুইটা ডেটা টাইপ ভিন্ন storage ও query ইঞ্জিনে থাকে বলেই Azure Monitor-এর ভেতরে একাধিক sub-component দেখা যায় — Metrics Explorer, Log Analytics, Application Insights, Alerts, Workbooks — সবগুলো একই ছাতার নিচে কিন্তু আলাদা আলাদা কাজের জন্য অপ্টিমাইজড।</p>

<div class="diagram"><pre>
   Azure Resource (VM/App/DB)         ARM / Resource Provider
        │  metrics + resource logs          │  every control-plane API call
        ▼                                   ▼
   Monitor Logs (Log Analytics Wksp)    Activity Log (subscription-level)
        │  KQL query                        │  export / diagnostic setting
        ▼                                   ▼
   Alerts ─ Workbooks ─ App Insights    Log Analytics / SIEM / Event Hub
</pre></div>

<h3>Activity Log vs Monitor Logs/Log Analytics — সবচেয়ে বেশি গুলিয়ে যাওয়া পার্থক্য</h3>
<p><span class="kw">Activity Log</span> হলো <b>control-plane audit trail</b> — subscription-এর ওপর কে, কখন, কোন ARM API call করলো (VM create করলো, NSG rule বদলালো, resource delete করলো) তার রেকর্ড। এটা AWS-এর <b>CloudTrail</b>-এর সমতুল্য। এর বিপরীতে <span class="kw">Monitor Logs</span> (যেটা <span class="kw">Log Analytics Workspace</span>-এ জমা হয়) হলো <b>data-plane</b> টেলিমেট্রি — অ্যাপ্লিকেশনের নিজের লগ লাইন, VM-এর perf counter, resource-এর diagnostic log। দুইটাই "লগ" শব্দটা ব্যবহার করে বলে নতুনরা প্রায়ই ভাবে এরা একই জিনিস — বাস্তবে এরা সম্পূর্ণ ভিন্ন উদ্দেশ্যে তৈরি, ভিন্ন retention default, এমনকি ভিন্ন query ইন্টারফেস।</p>

<table>
<tr><th>বিষয়</th><th>Activity Log</th><th>Monitor Logs / Log Analytics</th></tr>
<tr><td>স্তর</td><td>Control-plane (ARM API)</td><td>Data-plane (resource/app এর নিজের আচরণ)</td></tr>
<tr><td>উদাহরণ ইভেন্ট</td><td>"কে VM stop/delete করলো", "NSG rule কে বদলালো"</td><td>অ্যাপ্লিকেশনের এক্সসেপশন, VM CPU metric history, SQL slow query log</td></tr>
<tr><td>Scope</td><td>Subscription-wide, সবসময় automatic, অফ করা যায় না</td><td>Resource-ভিত্তিক, Diagnostic Settings দিয়ে opt-in করতে হয়</td></tr>
<tr><td>Default retention</td><td>৯০ দিন (বিনামূল্যে)</td><td>Workspace-এর প্ল্যান অনুযায়ী (৩০ দিন ডিফল্ট, বাড়ানো যায়)</td></tr>
<tr><td>Query ভাষা</td><td>Portal filter / Azure CLI</td><td>KQL (Kusto Query Language)</td></tr>
<tr><td>AWS সমতুল্য</td><td>CloudTrail</td><td>CloudWatch Logs / Logs Insights</td></tr>
</table>

<div class="callout mistake"><span class="tag">Common mistake — "আমার তো Activity Log দেখছি, লগ তো আছে!"</span> Activity Log-এ কখনোই অ্যাপ্লিকেশনের নিজের এক্সসেপশন বা ৫০০ error দেখা যাবে না — সেটা শুধু কে API call করলো তার রেকর্ড রাখে। কোনো অ্যাপ কেন ক্র্যাশ করছে তা ডিবাগ করতে হলে অবশ্যই Monitor Logs/Application Insights ঘাঁটতে হবে, Activity Log সেখানে কোনো কাজেই আসবে না।</div>

<h3>Log Analytics Workspace ও KQL (Kusto Query Language)</h3>
<p><span class="kw">Log Analytics Workspace</span> হলো সেই কেন্দ্রীয় ডেটা স্টোর যেখানে VM, App Service, AKS, Application Insights ইত্যাদির লগ ও মেট্রিক জমা হয় টেবিল আকারে (যেমন <code>AppTraces</code>, <code>AppExceptions</code>, <code>Perf</code>, <code>AzureDiagnostics</code>)। এই ডেটা query করার ভাষা হলো <span class="kw">KQL</span> — SQL-এর মতো declarative কিন্তু pipe (<code>|</code>) দিয়ে ধাপে ধাপে ডেটা ফিল্টার/ট্রান্সফর্ম করার স্টাইল, অনেকটা CloudWatch Logs Insights-এর সাথে তুলনীয়। নিচে একটা বাস্তব উদাহরণ — গত ১ ঘণ্টায় প্রতি ৫ মিনিটের উইন্ডোতে কতগুলো error লগ এসেছে তা গুনে সবচেয়ে বেশি error হওয়া সময়সীমা বের করা:</p>

<pre>traces
| where timestamp &gt; ago(1h)
| where severityLevel &gt;= 3          <span class="c">// 3=Error, 4=Critical</span>
| summarize ErrorCount = count() by bin(timestamp, 5m)
| order by ErrorCount desc
| take 5</pre>

<p><code>bin()</code> ফাংশনটা টাইমস্ট্যাম্পকে ৫ মিনিটের bucket-এ ভাগ করে দেয়, তারপর <code>summarize ... by</code> প্রতিটা bucket-এ কাউন্ট করে, শেষে সবচেয়ে বেশি error-প্রবণ সময় ওপরে আনে। একই প্যাটার্ন দিয়ে P99 latency, ইউনিক ইউজার কাউন্ট, বা কাস্টম বিজনেস মেট্রিক — সবই বের করা যায়, কারণ KQL মূলত একটা টাইম-সিরিজ-অপ্টিমাইজড analytical query ইঞ্জিন।</p>

<div class="callout why"><span class="tag">কেন — KQL আলাদা ভাষা কেন লাগলো</span> SQL রিলেশনাল ডেটার জন্য অপ্টিমাইজড, কিন্তু টেলিমেট্রি ডেটা মূলত append-only, বিপুল ভলিউমের, টাইম-সিরিজ। KQL-এর ইঞ্জিন (Kusto) কলামভিত্তিক স্টোরেজে সেকেন্ডে বিলিয়ন রো স্ক্যান করতে পারে বলেই লগ অ্যানালাইসিসে এটা এত দ্রুত — যেটা সাধারণ রিলেশনাল SQL ইঞ্জিনে ব্যবহারিকভাবে সম্ভব না।</div>

<h3>Application Insights — APM ও distributed tracing</h3>
<p><span class="kw">Application Insights</span> হলো Azure Monitor-এর APM (Application Performance Monitoring) অংশ — কোডে একটা SDK/agent বসিয়ে দিলে এটা নিজে থেকে request, dependency call (DB, HTTP, queue), exception, এবং performance counter ধরে ফেলে। এর সবচেয়ে গুরুত্বপূর্ণ ফিচার <b>distributed tracing</b> — একটা রিকোয়েস্ট যদি একাধিক মাইক্রোসার্ভিস দিয়ে যায়, প্রতিটা হপ একটা কমন <code>operation_Id</code> দিয়ে যুক্ত থাকে, ফলে পুরো dependency chain এক জায়গায় দেখা যায় (এই ধারণাটা AWS X-Ray-এর মতো)। তবে Application Insights শুধু ট্রেসিং না — এর সাথে বিল্ট-ইন <b>Availability Test</b> (বাইরে থেকে পিরিয়ডিক্যালি এন্ডপয়েন্ট hit করে uptime চেক), Live Metrics Stream, এবং কাস্টম ইভেন্ট/মেট্রিক ট্র্যাকিং যুক্ত থাকে — তাই এটা X-Ray-এর চেয়ে ব্যাপ্তিতে বড়।</p>

<div class="callout behind"><span class="tag">Application Insights আসলে Log Analytics Workspace-এর ওপর বসানো</span> নতুন ভার্সনে (workspace-based Application Insights) সব টেলিমেট্রি সরাসরি একটা Log Analytics Workspace-এ জমা হয় — তাই একই KQL query language দিয়ে <code>requests</code>, <code>dependencies</code>, <code>exceptions</code> টেবিল ক্যোয়ারি করা যায়। এর মানে Application Insights আলাদা কোনো স্টোরেজ ইঞ্জিন না, বরং Monitor Logs-এর ওপর একটা APM-স্পেসিফিক লেয়ার।</div>

<h3>Alert: Metric Alert vs Log Alert, এবং Action Group</h3>
<p><span class="kw">Metric Alert</span> একটা সংখ্যাসূচক থ্রেশহোল্ডের ওপর কাজ করে (যেমন "CPU গড়ে ৮০%-এর বেশি ৫ মিনিট ধরে") — এটা near-real-time (১ মিনিটের গ্রানুলারিটিতে), কম খরচ, কিন্তু কমপ্লেক্স লজিক করতে পারে না। <span class="kw">Log Alert</span> একটা KQL query চালিয়ে ফলাফলের ভিত্তিতে ট্রিগার করে (যেমন উপরের error-count query যদি কোনো bucket-এ ৫০-এর বেশি হয়) — এটা যেকোনো জটিল শর্ত এক্সপ্রেস করতে পারে কিন্তু query চলতে সময় লাগে বলে সাধারণত ৫-১৫ মিনিট গ্রানুলারিটিতে চলে।</p>
<p>অ্যালার্ট ট্রিগার হলে কী হবে সেটা নির্ধারণ করে <span class="kw">Action Group</span> — এটা একটা reusable রিসিভার লিস্ট (ইমেইল, SMS, Webhook, Azure Function, Logic App, ITSM ইন্টিগ্রেশন) যেটা একাধিক অ্যালার্ট রুলে সংযুক্ত করা যায়। Action Group-কে অ্যালার্ট রুল থেকে আলাদা রাখা হয়েছে যাতে "কাকে জানাবো" আর "কখন জানাবো" এই দুইটা কনসার্ন ডিকাপল থাকে — একটা টিমের অন-কল রোটেশন বদলালে সব অ্যালার্ট রুল না ছুঁয়ে শুধু একটা Action Group আপডেট করলেই চলে।</p>

<div class="callout best"><span class="tag">Best practice — Log Alert-কে ঘন ঘন চালাবেন না</span> Log Alert প্রতিবার একটা KQL query রান করে, আর Log Analytics-এ query চালানোর একটা cost থাকে (ইনজেস্টেড ডেটার পরিমাণ অনুযায়ী)। যেসব শর্ত সাধারণ থ্রেশহোল্ডে এক্সপ্রেস করা যায় (CPU, মেমরি, HTTP 5xx কাউন্ট) সেগুলোর জন্য Metric Alert ব্যবহার করুন — শুধু জটিল multi-condition বা cross-resource লজিকের জন্য Log Alert রাখুন।</div>

<h2 class="title">১৮. Security — Key Vault, Defender, WAF ও DDoS Protection</h2>
<p class="lead">অ্যাপ্লিকেশন কোডে সিক্রেট হার্ডকোড করা, কে কোন রিসোর্সে অ্যাক্সেস পাচ্ছে তা না জানা, আর নেটওয়ার্ক লেয়ারে অরক্ষিত থাকা — এই তিনটা ফাঁক বন্ধ করার জন্য Azure-এর সিকিউরিটি স্ট্যাক তৈরি। এই চ্যাপ্টারে সিক্রেট ম্যানেজমেন্ট থেকে শুরু করে থ্রেট ডিটেকশন আর নেটওয়ার্ক-লেভেল প্রোটেকশন পর্যন্ত পুরো চিত্র দেখবো।</p>

<h3>Azure Key Vault — Secret, Key, Certificate তিনটা আলাদা object</h3>
<p><span class="kw">Azure Key Vault</span> একটা কেন্দ্রীভূত, hardware-backed vault যেখানে তিন ধরনের অবজেক্ট আলাদাভাবে ম্যানেজ হয় — এদের একই জিনিস ভাবাটা একটা সাধারণ ভুল ধারণা।</p>
<table>
<tr><th>Object type</th><th>কী রাখে</th><th>বৈশিষ্ট্য</th></tr>
<tr><td><b>Secret</b></td><td>যেকোনো সাধারণ string ভ্যালু — DB connection string, API key, পাসওয়ার্ড</td><td>Encrypt হয়ে সফটওয়্যার-লেভেলে স্টোর হয়, get/set করা যায় প্লেইনটেক্সট হিসেবে</td></tr>
<tr><td><b>Key</b></td><td>Cryptographic key (RSA/EC), যা encrypt/decrypt/sign/verify করতে ব্যবহার হয়</td><td>চাইলে HSM-backed (FIPS 140-2 Level 2/3) — key material কখনো vault-এর বাইরে বের হয় না, শুধু operation (sign, encrypt) vault-এর ভেতরে করা হয়</td></tr>
<tr><td><b>Certificate</b></td><td>পূর্ণাঙ্গ X.509 সার্টিফিকেট (public + private key)</td><td>Key Vault পুরো lifecycle ম্যানেজ করে — auto-renewal, CA integration, expiry notification</td></tr>
</table>
<p>মূল পার্থক্যটা এইখানে: Secret হলো "একটা মান যা আমি ফেরত চাই", Key হলো "একটা ক্রিপ্টো অপারেশন যা vault-এর ভেতরেই ঘটবে, key কখনো বের হবে না", আর Certificate হলো Key + মেটাডেটা + lifecycle automation একসাথে।</p>

<div class="diagram"><pre>
  App (Managed Identity)
        │  1. token request (no credential in code)
        ▼
  Microsoft Entra ID  ──── 2. access token issued
        │
        ▼
  Key Vault  ──── 3. token দেখিয়ে Secret/Key/Cert চাওয়া
        │
        ├─ Secret  → প্লেইনটেক্সট মান রিটার্ন
        ├─ Key     → vault-এর ভেতরেই sign/encrypt করে শুধু ফলাফল রিটার্ন

<h3>Managed Identity + Key Vault — কেন কোনো credential হার্ডকোড লাগে না</h3>
<p>২ নম্বর অধ্যায়ে দেখা <span class="kw">Managed Identity</span>-র আসল শক্তি বোঝা যায় এই জায়গাতেই। একটা VM বা App Service-কে যদি একটা System-assigned Managed Identity দেওয়া হয়, আর সেই identity-কে Key Vault-এ অ্যাক্সেস দেওয়া হয়, তাহলে অ্যাপ্লিকেশন কোডে কোনো connection string, client secret, বা API key হার্ডকোড না করেই Key Vault থেকে সিক্রেট আনতে পারে — Azure SDK নিজে থেকে Entra ID-তে token রিকোয়েস্ট করে, সেই token দিয়ে Key Vault-এ কল করে। এর মানে "সিক্রেট আনার জন্য একটা সিক্রেট লাগবে" — এই chicken-and-egg সমস্যাটা সম্পূর্ণভাবে দূর হয়ে যায়।</p>

<div class="callout why"><span class="tag">কেন — এটাই "zero hardcoded credential" এর মূল ভিত্তি</span> Managed Identity credential rotate করা লাগে না (Azure নিজে ম্যানেজ করে), কখনো সোর্স কোড বা CI/CD variable-এ এক্সপোজড হয় না, এবং resource ডিলিট হলে identity-ও স্বয়ংক্রিয়ভাবে চলে যায়। এই তিনটা বৈশিষ্ট্যই একটা static service principal secret দিয়ে অর্জন করা প্রায় অসম্ভব — কারণ static secret কোথাও না কোথাও স্টোর করতেই হয়।</div>

<h3>Access Policy vs Azure RBAC for Key Vault</h3>
<p>Key Vault-এ অ্যাক্সেস দেওয়ার দুইটা মডেল আছে। পুরনো <span class="kw">Access Policy</span> মডেলে vault-লেভেলে একটা লিস্টে বলা হয় কোন identity কোন operation (get secret, list key, ইত্যাদি) করতে পারবে — কিন্তু এটা vault-এর নিজস্ব একটা সিস্টেম, Azure-এর কেন্দ্রীয় RBAC-এর বাইরে, ফলে granular scope (যেমন শুধু একটা নির্দিষ্ট secret-এ অ্যাক্সেস) দেওয়া যায় না এবং audit trail Activity Log-এ পূর্ণাঙ্গভাবে ধরা পড়ে না। নতুন <span class="kw">Azure RBAC</span> মডেলে Key Vault একটা সাধারণ Azure resource-এর মতোই আচরণ করে — <code>Key Vault Secrets User</code>, <code>Key Vault Crypto Officer</code>-এর মতো built-in role assign করা যায় Management Group/Subscription/Resource Group/resource যেকোনো স্কোপে, এবং এটা বাকি সব Azure resource-এর মতোই একই RBAC ইঞ্জিন ব্যবহার করে।</p>

<div class="callout best"><span class="tag">Best practice — নতুন প্রজেক্টে RBAC মডেল বেছে নিন</span> Access Policy মডেলে একটা ভুল হলো এটা vault-wide — কাউকে একটা মাত্র secret দেখার অনুমতি দিতে চাইলেও পুরো vault-এর ওপর policy বসাতে হয়। RBAC মডেলে granular scope, centralized audit (Activity Log-এ ধরা পড়ে), এবং deny assignment সাপোর্ট থাকে — তাই Microsoft নিজেই নতুন vault-এ RBAC মডেল ডিফল্ট করে দিয়েছে।</div>

<h3>Microsoft Defender for Cloud — দুই সার্ভিসের কাজ এক প্রোডাক্টে</h3>
<div class="callout behind"><span class="tag">AWS-এ যা দুই সার্ভিসে ভাগ, Azure-এ এক প্রোডাক্টে</span> AWS-এ থ্রেট ডিটেকশনের জন্য GuardDuty আর সিকিউরিটি পোস্চার/কমপ্লায়েন্স অ্যাগ্রিগেশনের জন্য Security Hub — দুইটা আলাদা সার্ভিস। Azure-এ <span class="kw">Microsoft Defender for Cloud</span> এই দুইটা কাজই একটা প্রোডাক্টে করে, দুই স্তরের প্ল্যান দিয়ে।</div>
<table>
<tr><th>প্ল্যান</th><th>কাজ</th><th>মূল্য</th><th>AWS সমতুল্য</th></tr>

<tr><td><b>Defender plans</b></td><td>প্রতিটা resource type-এর জন্য active threat detection (Defender for Servers, Storage, SQL, Containers, Key Vault ইত্যাদি) — anomaly detection, malware scan, brute-force alert</td><td>Per-resource, পেইড</td><td>GuardDuty + resource-স্পেসিফিক গার্ড</td></tr>

<h3>Secure Score — শুধু একটা সংখ্যা না, একটা checklist</h3>
<p><span class="kw">Secure Score</span>-কে অনেকে ভুলভাবে "একটা গ্রেড" ভাবে, কিন্তু আসল ভ্যালু এর পেছনের actionable recommendation লিস্টে — প্রতিটা রেকমেন্ডেশনের একটা weight (কতটুকু স্কোর বাড়াবে) এবং একটা "quick fix" অপশন থাকে যা এক ক্লিকে বা একটা স্ক্রিপ্টে ফিক্স করা যায়। তাই Secure Score-কে প্রায়োরিটাইজেশন টুল হিসেবে ব্যবহার করাই সঠিক — সবচেয়ে বেশি ওয়েটের রেকমেন্ডেশনগুলো আগে ঠিক করলে সবচেয়ে কম effort-এ সবচেয়ে বেশি ঝুঁকি কমে।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু স্কোর বাড়ানোর জন্য দৌড়ানো</span> কিছু রেকমেন্ডেশন প্রোডাকশনে প্রয়োগ করলে অ্যাপ্লিকেশন ভেঙে যেতে পারে (যেমন কঠোর NSG rule বা forced TLS version)। স্কোর বাড়ানোর আগে প্রতিটা রেকমেন্ডেশনের ব্লাস্ট রেডিয়াস বুঝে নেওয়া দরকার, নাহলে "সিকিউরিটি ফিক্স" নিজেই একটা আউটেজ হয়ে দাঁড়াতে পারে।</div>

<h3>WAF (Web Application Firewall)</h3>
<p><span class="kw">WAF</span> Application Gateway বা Front Door-এর সামনে বসে HTTP(S) ট্র্যাফিক পরীক্ষা করে — SQL injection, XSS, এবং OWASP-এর <b>Core Rule Set (CRS)</b>-এ তালিকাভুক্ত সাধারণ অ্যাটাক প্যাটার্ন ব্লক করে। এটা নেটওয়ার্ক লেয়ারের NSG থেকে সম্পূর্ণ ভিন্ন স্তরে কাজ করে — NSG শুধু IP/পোর্ট দেখে, WAF আসলে HTTP রিকোয়েস্ট বডি ও হেডার পার্স করে অ্যাটাক প্যাটার্ন খোঁজে। WAF Detection মোডে (শুধু লগ করে) বা Prevention মোডে (ব্লক করে) চালানো যায় — নতুন rule সেট প্রোডাকশনে বসানোর আগে Detection মোডে false-positive যাচাই করে নেওয়াই নিরাপদ পথ।</p>

<h3>DDoS Protection — Basic vs Standard</h3>
<table>
<tr><th>প্ল্যান</th><th>বৈশিষ্ট্য</th><th>মূল্য</th></tr>
<tr><td><b>Basic</b></td><td>প্রতিটা Azure public IP-তে স্বয়ংক্রিয়ভাবে বিল্ট-ইন, network-layer volumetric অ্যাটাক থেকে সুরক্ষা</td><td>ফ্রি</td></tr>
<tr><td><b>Standard</b></td><td>Adaptive tuning (নিজের VNet-এর ট্রাফিক প্যাটার্ন শিখে থ্রেশহোল্ড ঠিক করে), attack analytics/telemetry, cost protection (স্কেলিং-জনিত বাড়তি বিল কভার), এবং DDoS Rapid Response টিমের সাপোর্ট</td><td>পেইড (VNet-লেভেলে সাবস্ক্রাইব করতে হয়)</td></tr>
</table>
<p>ধারণাটা AWS Shield Standard (সবার জন্য ফ্রি বিল্ট-ইন) vs Shield Advanced (পেইড, adaptive + cost protection + response team)-এর সাথে প্রায় হুবহু মেলে — শুধু নামকরণ ভিন্ন।</p>

<h2 class="title">১৯. Cost Management ও Well-Architected Framework</h2>
<p class="lead">ক্লাউডে কারিগরিভাবে সঠিক ডিজাইন যথেষ্ট না — খরচ নিয়ন্ত্রণে না রাখলে বা কোনো কাঠামোবদ্ধ চেকলিস্ট ছাড়া আর্কিটেকচার বানালে প্রোডাকশনে ধাক্কা খেতে হয়। এই চ্যাপ্টারে কস্ট ম্যানেজমেন্ট টুলিং, Well-Architected Framework-এর পাঁচ পিলার, আর ডিজাস্টার রিকভারি প্যাটার্ন — এই তিনটা একসাথে দেখবো।</p>

<h3>Pricing model — সংক্ষিপ্ত রিক্যাপ</h3>
<p>৩ নম্বর অধ্যায়ে বিস্তারিত আলোচনা হয়েছে বলে এখানে শুধু সারসংক্ষেপ:</p>

<h3>Azure Cost Management + Billing</h3>
<p><span class="kw">Cost Management + Billing</span> হলো Azure-এর কেন্দ্রীয় কস্ট ভিজিবিলিটি টুল — <b>Cost Analysis</b> ভিউতে resource, resource group, tag, বা সময় অনুযায়ী খরচ ব্রেকডাউন দেখা যায়, আর কোথায় হঠাৎ খরচ বেড়েছে তা ট্রেন্ড হিসেবে ধরা যায়। এর সাথে <span class="kw">Budget</span> সেট করে একটা থ্রেশহোল্ড (যেমন মাসিক $৫০০) বেঁধে দেওয়া যায়, আর সেটার ৮০%/১০০%/ফোরকাস্টেড ওভাররান-এ Action Group-এর মাধ্যমে অ্যালার্ট পাঠানো যায়। বাজেট অ্যালার্ট প্রোঅ্যাক্টিভ হওয়াটা জরুরি কারণ বিল সাধারণত মাস শেষে আসে — ততক্ষণে ওভারস্পেন্ড হয়ে গেলে সেটা আর ফেরত পাওয়া যায় না, তাই সমস্যা যত আগে ধরা যায় ক্ষতি তত কম।</p>

<h3>Tagging strategy</h3>
<p>প্রতিটা resource-এ <code>environment</code>, <code>team</code>, <code>cost-center</code>, <code>project</code>-এর মতো ট্যাগ বসানো একটা সার্বজনীন ক্লাউড প্র্যাক্টিস — এটা শুধু organization-এর জন্য না, Cost Analysis-এ ট্যাগ অনুযায়ী ফিল্টার করে কোন টিম বা প্রজেক্ট কতটা খরচ করছে তা নির্ভুলভাবে বের করার একমাত্র উপায়। Azure Policy দিয়ে ট্যাগ বাধ্যতামূলক করে দেওয়া যায়, যাতে কেউ ট্যাগ ছাড়া resource তৈরি করতে না পারে।</p>

<div class="callout mistake"><span class="tag">Common mistake — ট্যাগিং পরে করবো ভেবে ফেলে রাখা</span> হাজার হাজার resource তৈরির পর রেট্রোঅ্যাকটিভলি ট্যাগ বসানো একটা বিশাল ম্যানুয়াল কাজ, আর ততদিনে কোন resource কার জন্য তৈরি হয়েছিল তা ভুলে যাওয়া হয়। Resource তৈরির প্রথম দিন থেকেই Azure Policy দিয়ে ট্যাগ enforcement বসিয়ে দেওয়াই সঠিক পথ।</div>

<h3>Azure Advisor — ব্যক্তিগতকৃত সুপারিশ ইঞ্জিন</h3>
<p><span class="kw">Azure Advisor</span> আপনার পুরো subscription স্ক্যান করে পাঁচটা ক্যাটাগরিতে actionable সুপারিশ দেয় — Cost (over-provisioned/idle resource চিহ্নিত করে Reserved Instance বা right-sizing সাজেস্ট করা), Security (Defender for Cloud-এর সাথে সরাসরি যুক্ত), Reliability, Operational Excellence, এবং Performance — লক্ষ করুন এই পাঁচটা ক্যাটাগরি ঠিক Well-Architected Framework-এর পাঁচটা pillar-এর সাথে হুবহু মিলে যায়, কারণ Advisor আসলে সেই framework-কেই স্বয়ংক্রিয় স্ক্যানিং টুল হিসেবে বাস্তবায়ন করে।</p>
<div class="callout why"><span class="tag">কেন Advisor ও Well-Architected রিভিউ একসাথে ব্যবহার করা উচিত</span>
Well-Architected রিভিউ একটা ম্যানুয়াল, প্রশ্ন-ভিত্তিক প্রক্রিয়া (আর্কিটেক্ট নিজে চিন্তা করে "আমার সিস্টেম এই প্রশ্নের উত্তরে কেমন করছে")। Advisor সেই একই পাঁচ pillar-এর উপর ভিত্তি করে automatically, continuously প্রতিটা resource স্ক্যান করে সুনির্দিষ্ট, resource-স্পেসিফিক সুপারিশ দেয় (যেমন "VM-xyz গত ৩০ দিনে গড়ে ৫% CPU ব্যবহার করেছে, ছোট SKU-তে নামিয়ে আনুন")। ম্যানুয়াল রিভিউ বড় ছবি ও দিকনির্দেশনা দেয়, Advisor সেই দিকনির্দেশনাকে দৈনন্দিন, নির্দিষ্ট কাজে রূপান্তর করে — দুটো একসাথে ব্যবহার করাই সবচেয়ে কার্যকর।</div>

<h3>Azure Well-Architected Framework — পাঁচটা Pillar</h3>
<p>Microsoft-এর <b>Azure Well-Architected Framework</b>-এ পাঁচটা পিলার আছে — প্রতিটা একটা কোয়ালিটি এট্রিবিউট প্রতিনিধিত্ব করে, আর প্রতিটার একটা নির্দিষ্ট গাইডিং প্রশ্ন আছে যা আর্কিটেকচার রিভিউতে জিজ্ঞাসা করা হয়।</p>

<div class="callout why"><span class="tag">কেন — Azure-এ ৫টা পিলার, AWS-এ ৬টা</span> AWS-এর Well-Architected Framework-এ Sustainability একটা আলাদা টপ-লেভেল পিলার হিসেবে আছে। Azure-এর মূল Well-Architected Framework-এ আলাদা টপ-লেভেল Sustainability পিলার নেই — যদিও Microsoft "Sustainable workloads" নামে আলাদা একটা গাইডেন্স ডকুমেন্ট দেয়, সেটা এই পাঁচ-পিলার কাঠামোর অংশ না। ইন্টারভিউতে এই সংখ্যাগত পার্থক্যটা (৫ বনাম ৬) ভুলভাবে বলাটা একটা কমন ভুল, কারণ দুই ক্লাউডের ডকুমেন্টেশন একে অপরের প্রভাবে তৈরি হলেও কাঠামোয় হুবহু এক না।</div>

<h3>Disaster Recovery</h3>
<p>DR-এর দুইটা মূল মেট্রিক সংক্ষেপে রিক্যাপ করা যাক — <b>RTO (Recovery Time Objective)</b>: বিপর্যয়ের পর সার্ভিস আবার চালু হতে সর্বোচ্চ কতক্ষণ লাগতে পারে; <b>RPO (Recovery Point Objective)</b>: সর্বোচ্চ কতটুকু ডেটা হারানো মেনে নেওয়া যায় (শেষ ব্যাকআপ/রেপ্লিকেশনের পর থেকে)। Azure-এ এই DR অর্কেস্ট্রেশনের মূল টুল হলো <span class="kw">Azure Site Recovery (ASR)</span> — এটা VM-লেভেল রেপ্লিকেশন করে (এক রিজিওন থেকে আরেক রিজিওনে) এবং একটা পুরো ফেইলওভার প্ল্যান (কোন VM কোন অর্ডারে উঠবে) অর্কেস্ট্রেট করে।</p>
<p>চারটা সার্বজনীন DR প্যাটার্ন Azure-প্রেক্ষাপটে:</p>
<ul>
<li><b>Backup & Restore</b> — শুধু Azure Backup দিয়ে নিয়মিত স্ন্যাপশট নেওয়া থাকে, বিপর্যয়ে নতুন resource প্রভিশন করে restore করা হয়। সবচেয়ে সস্তা, RTO/RPO সবচেয়ে বেশি (ঘণ্টা-দিন)।</li>
<li><b>Pilot Light</b> — সেকেন্ডারি রিজিওনে ন্যূনতম কোর কম্পোনেন্ট (যেমন একটা ছোট DB replica) সবসময় চালু থাকে, ASR-এ বাকি VM-গুলো "replicated কিন্তু বন্ধ" অবস্থায় থাকে, ফেইলওভারে দ্রুত স্কেল-আপ করা হয়।</li>
<li><b>Warm Standby</b> — সেকেন্ডারি রিজিওনে একটা ছোট আকারের কিন্তু সম্পূর্ণ কার্যকরী কপি সবসময় চলমান থাকে, ফেইলওভারে শুধু স্কেল-আপ করলেই চলে — RTO অনেক কম।</li>
<li><b>Multi-Site Active-Active</b> — দুই রিজিওনেই একসাথে লাইভ ট্রাফিক সার্ভ হয় (Traffic Manager/Front Door দিয়ে রাউটিং), একটা রিজিওন হারালে অন্যটা পুরো লোড নেয় কোনো ম্যানুয়াল ফেইলওভার ছাড়াই — সবচেয়ে কম RTO/RPO, কিন্তু সবচেয়ে ব্যয়বহুল ও জটিল।</li>
</ul>

<div class="callout best"><span class="tag">Best practice — RTO/RPO আগে ঠিক করুন, তারপর প্যাটার্ন বেছে নিন</span> ব্যবসার প্রয়োজন না জেনে সরাসরি Multi-Site Active-Active বেছে নেওয়া একটা সাধারণ ওভার-ইঞ্জিনিয়ারিং ভুল। প্রথমে বিজনেস স্টেকহোল্ডারদের সাথে RTO/RPO সংখ্যায় ঠিক করুন, তারপর সেই সংখ্যার সাথে সবচেয়ে কম খরচের প্যাটার্ন মিলিয়ে বেছে নিন।</div>
