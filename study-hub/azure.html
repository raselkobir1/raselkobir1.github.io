<h2 class="title">২০. Interview প্রশ্নোত্তর</h2>
<p class="lead">Azure ইন্টারভিউতে বারবার আসা প্রশ্ন — প্রতিটা আগের চ্যাপ্টারের রেফারেন্স দিয়ে।</p>

<h3>১) Management Group, Subscription, ও Resource Group-এর hierarchy এবং RBAC scope inheritance কীভাবে কাজ করে?</h3>
<p><b>উত্তর:</b> Azure-এর রিসোর্স হায়ারার্কি চার স্তরের — Management Group (একাধিক subscription গ্রুপ করার জন্য) → Subscription (বিলিং ও কোটার সীমানা) → Resource Group (লজিক্যাল গ্রুপিং, একটা প্রজেক্টের সব রিসোর্স একসাথে ম্যানেজ/ডিলিট করার ইউনিট) → Resource। RBAC role যেকোনো স্তরে assign করা যায়, আর সেটা নিচের সব স্তরে স্বয়ংক্রিয়ভাবে ইনহেরিট হয় — Management Group-এ একটা role দিলে সেটার নিচের সব Subscription, Resource Group, Resource-এ প্রযোজ্য হয়ে যায়। এই hierarchy ও ইনহেরিটেন্স ১ নম্বর অধ্যায়ে বিস্তারিত আলোচিত হয়েছে।</p>

<h3>২) RBAC vs Azure Policy — এই দুটার মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> RBAC ঠিক করে "কে কী করতে পারবে" (identity-ভিত্তিক অথোরাইজেশন — কে VM তৈরি করতে পারবে, কে ডিলিট করতে পারবে), আর Azure Policy ঠিক করে "কী তৈরি করা যাবে ও কী নিয়মে" (resource-এর কনফিগারেশন নিয়ম — যেমন শুধু নির্দিষ্ট রিজিওনে resource তৈরি করা যাবে, বা প্রতিটা resource-এ ট্যাগ থাকতে হবে), এমনকি যাদের RBAC পারমিশন আছে তাদের ওপরও। এই দুটো একসাথে কাজ করে কিন্তু সম্পূর্ণ ভিন্ন স্তরে — একটা identity নিয়ন্ত্রণ করে, আরেকটা resource-এর কমপ্লায়েন্স নিয়ন্ত্রণ করে। ১ নম্বর অধ্যায়ে এই পার্থক্য বিস্তারিত হয়েছে।</p>

<h3>৩) Managed Identity-এর System-assigned ও User-assigned টাইপের মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> System-assigned identity একটা নির্দিষ্ট resource-এর (VM/App Service) সাথে জীবনচক্র বাঁধা থাকে — resource ডিলিট হলে identity-ও সাথে সাথে ডিলিট হয়, এবং এক resource-এর সাথে শুধু একটাই এমন identity থাকতে পারে। User-assigned identity একটা স্বাধীন Azure resource হিসেবে তৈরি হয়, একাধিক VM/App Service-এর সাথে সংযুক্ত করা যায়, এবং কোনো resource ডিলিট হলেও identity নিজে টিকে থাকে। একাধিক resource-এ একই পারমিশন সেট শেয়ার করতে চাইলে User-assigned বেছে নেওয়া হয়। এটা ২ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>৪) NSG-তে Allow এবং Deny দুটোই থাকে, কিন্তু AWS Security Group-এ শুধু Allow — এর প্রভাব কী?</h3>
<p><b>উত্তর:</b> AWS Security Group স্টেটফুল এবং implicit-deny-only (শুধু allow rule লেখা যায়, deny লেখা যায় না — না লেখা মানেই deny)। Azure NSG-তে explicit Deny rule লেখা যায়, যার ফলে একটা broader Allow rule-এর ভেতরে নির্দিষ্ট একটা সোর্স/পোর্ট আলাদাভাবে ব্লক করা সম্ভব — priority নম্বর অনুযায়ী rule ইভ্যালুয়েট হয় (কম নম্বর আগে চেক হয়)। এই নমনীয়তার একটা ঝুঁকিও আছে — priority ভুল সাজালে একটা intended Allow rule একটা higher-priority Deny rule-এর কারণে কখনো এক্সিকিউটই হয় না। এটা ৪ নম্বর অধ্যায়ে আলোচিত হয়েছে।</p>

<h3>৫) Availability Set ও Availability Zone-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Availability Set একই ডেটা সেন্টারের ভেতরে VM-গুলোকে আলাদা আলাদা physical rack (fault domain) ও আলাদা host update batch (update domain)-এ ছড়িয়ে দেয় — এটা rack-level বা host-reboot-level ফেইলিওর থেকে রক্ষা করে, কিন্তু পুরো ডেটা সেন্টার ডাউন হলে কোনো সুরক্ষা দেয় না। Availability Zone সম্পূর্ণ আলাদা, ফিজিক্যালি বিচ্ছিন্ন ডেটা সেন্টার (নিজস্ব পাওয়ার, কুলিং, নেটওয়ার্ক)-এ resource ছড়িয়ে দেয়, ফলে পুরো একটা ডেটা সেন্টার হারালেও অ্যাপ চালু থাকে। Zone সবসময় বেশি রেজিলিয়েন্ট, তবে সব রিজিওনে Zone সাপোর্ট থাকে না। এটা ৩ ও ৯ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>৬) VM Stopped ও Stopped (Deallocated) অবস্থার মধ্যে বিলিং-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> শুধু OS থেকে "Stop" করলে (যেমন গেস্ট OS-এর ভেতর থেকে shutdown) VM-টা এখনো একটা ফিজিক্যাল হোস্টে কম্পিউট রিসোর্স ধরে রাখে, তাই compute বিলিং চলতেই থাকে। Azure Portal/CLI থেকে "Stop (Deallocated)" করলে VM-এর কম্পিউট রিসোর্স সম্পূর্ণভাবে হোস্ট থেকে মুক্ত করে দেওয়া হয়, ফলে compute বিলিং বন্ধ হয়ে যায় (শুধু disk/IP-এর মতো persistent resource-এর বিলিং চলতে থাকে)। এই পার্থক্যটা না জানার কারণে অনেকে VM "বন্ধ করেছি" ভেবেও বিল পেয়ে অবাক হন। এটা ৩ নম্বর অধ্যায়ে আলোচিত হয়েছে।</p>

<h3>৭) Storage Account, Container, ও Blob-এর hierarchy ব্যাখ্যা করুন।</h3>
<p><b>উত্তর:</b> Storage Account হলো সবচেয়ে ওপরের নেমস্পেস (একটা গ্লোবালি ইউনিক নাম, যা এন্ডপয়েন্ট URL-এর অংশ হয়ে যায়), এর ভেতরে একাধিক Container থাকে (ফাইল সিস্টেমের ফোল্ডারের মতো, কিন্তু nested container সাপোর্ট করে না — flat নেমস্পেস), আর প্রতিটা Container-এর ভেতরে Blob (আসল ফাইল/অবজেক্ট) থাকে। ব্লবের নামে স্ল্যাশ (/) ব্যবহার করে "ভার্চুয়াল ফোল্ডার"-এর মতো দেখানো যায়, কিন্তু আসলে সেটা একটা ফ্ল্যাট কী-ভ্যালু নেমস্পেস, প্রকৃত নেস্টেড ফোল্ডার না। এটা ৫ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>৮) Blob storage-এর রিডানডেন্সি অপশনগুলো (LRS/ZRS/GRS/RA-GRS) কী কী?</h3>
<p><b>উত্তর:</b> LRS (Locally Redundant Storage) একই ডেটা সেন্টারে তিনটা কপি রাখে — শুধু ডিস্ক ফেইলিওর থেকে রক্ষা করে। ZRS (Zone Redundant Storage) একই রিজিওনের তিনটা Availability Zone-এ কপি ছড়িয়ে রাখে — একটা ডেটা সেন্টার হারালেও ডেটা টিকে থাকে। GRS (Geo Redundant Storage) প্রাইমারি রিজিওনে LRS-এর সাথে একটা দূরবর্তী secondary রিজিওনে অ্যাসিঙ্ক্রোনাসলি কপি রাখে (পুরো রিজিওন হারালে রক্ষা করে, কিন্তু secondary কপি সরাসরি read করা যায় না ফেইলওভারের আগে)। RA-GRS (Read-Access GRS) একই কিন্তু secondary রিজিওনের কপি সবসময় read-only অ্যাক্সেসযোগ্য একটা আলাদা এন্ডপয়েন্টে। এটা ৫ ও ৬ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>৯) SAS (Shared Access Signature) টোকেনের প্রকারভেদ কী কী?</h3>
<p><b>উত্তর:</b> Account SAS পুরো Storage Account-এর একাধিক সার্ভিস (Blob, Queue, Table, File) জুড়ে পারমিশন দেয় — সবচেয়ে ব্রড স্কোপ। Service SAS একটা নির্দিষ্ট সার্ভিসের (যেমন শুধু Blob) একটা নির্দিষ্ট resource (একটা container বা blob)-এ পারমিশন দেয় — Storage Account key দিয়ে সাইন হয়। User Delegation SAS সবচেয়ে নিরাপদ, কারণ এটা Storage Account key দিয়ে না বরং একটা Microsoft Entra ID identity-র মাধ্যমে সাইন হয় (Managed Identity সহ ব্যবহারযোগ্য), ফলে অ্যাকাউন্ট key কখনো এক্সপোজ হয় না এবং RBAC-এর মাধ্যমে গ্রানুলার কন্ট্রোল পাওয়া যায়। এটা ৫ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১০) Azure SQL-এর DTU ও vCore মডেলের পার্থক্য কী?</h3>
<p><b>উত্তর:</b> DTU (Database Transaction Unit) মডেলে CPU, মেমরি, ও IO-কে একটা একক বান্ডলড সংখ্যায় প্যাকেজ করা হয় — সরল কিন্তু কোন রিসোর্স আসলে bottleneck সেটা আলাদাভাবে বোঝা যায় না। vCore মডেলে CPU কোর ও মেমরি আলাদাভাবে নির্দিষ্ট করা যায়, Azure Hybrid Benefit প্রযোজ্য হয়, এবং on-prem SQL Server-এর সাথে সাইজিং তুলনা করা সহজ হয়। নতুন প্রজেক্টে vCore মডেল সুপারিশ করা হয় কারণ এটা বেশি স্বচ্ছ ও নমনীয়। এটা ৭ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১১) Azure SQL-এর ডিপ্লয়মেন্ট অপশনগুলোর স্পেকট্রাম কী?</h3>
<p><b>উত্তর:</b> স্পেকট্রামের এক প্রান্তে SQL Server on VM — পুরো OS ও DB ইঞ্জিন নিজে ম্যানেজ করতে হয়, সর্বোচ্চ কন্ট্রোল কিন্তু সর্বোচ্চ ম্যানেজমেন্ট ওভারহেড। মাঝখানে Managed Instance — প্রায় পুরো SQL Server-এর ফিচার প্যারিটি (cross-database query, SQL Agent, CLR) পাওয়া যায় কিন্তু প্যাচিং/ব্যাকআপ Azure ম্যানেজ করে। আরেকটু কম কন্ট্রোলে Single Database ও Elastic Pool — সম্পূর্ণ PaaS, একটা মাত্র ডাটাবেসের জন্য (Single) বা একাধিক ডাটাবেস মিলে রিসোর্স শেয়ার করার জন্য (Elastic Pool, যেখানে আলাদা আলাদা DB-র পিক লোড ভিন্ন সময়ে হয়)। এটা ৭ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১২) Cosmos DB-এর consistency level-গুলো কী কী এবং কেন এত গুরুত্বপূর্ণ?</h3>
<p><b>উত্তর:</b> Cosmos DB পাঁচটা সুনির্দিষ্ট consistency level অফার করে, যা Strong (সবচেয়ে কড়া — সবসময় সর্বশেষ লেখা ডেটা পড়া যাবে, কিন্তু latency বেশি ও multi-region এ availability কম) থেকে Eventual (সবচেয়ে হালকা — সবচেয়ে কম latency, কিন্তু পুরনো ডেটা পড়ার সম্ভাবনা থাকে) পর্যন্ত একটা স্পেকট্রামে সাজানো: Strong, Bounded Staleness (staleness-এর একটা upper bound গ্যারান্টিযুক্ত, সময় বা ভার্সন-ল্যাগ দিয়ে নির্দিষ্ট), Session (একই ক্লায়েন্ট সেশনের ভেতর নিজের লেখা সবসময় পড়তে পারবে — "read your own writes", ডিফল্ট ও সবচেয়ে বহুল ব্যবহৃত), Consistent Prefix (ডেটা পুরনো হতে পারে কিন্তু লেখার অর্ডার কখনো এলোমেলো দেখাবে না), এবং Eventual। এই পাঁচটা লেভেল আসলে CAP থিওরির trade-off-কে একটা কন্টিনিউয়াম হিসেবে এক্সপোজ করে — ডেভেলপারকে প্রতিটা ওয়ার্কলোডের জন্য latency/availability বনাম consistency-র মধ্যে সচেতন সিদ্ধান্ত নিতে দেয়, একটা বাইনারি চয়েস না দিয়ে। এটা ৮ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৩) Cosmos DB-এর Request Unit (RU) কী?</h3>
<p><b>উত্তর:</b> RU হলো Cosmos DB-এর নরমালাইজড থ্রুপুট কারেন্সি — একটা 1KB আইটেমের সিম্পল point read করতে ঠিক ১ RU লাগে, আর যেকোনো অপারেশন (write, query, stored procedure) এর জটিলতা ও ডেটার আকার অনুযায়ী কম-বেশি RU খরচ করে। এই abstraction-এর সুবিধা হলো আন্ডারলাইং হার্ডওয়্যার (CPU/IO/মেমরি) নিয়ে চিন্তা না করে শুধু "কত RU/সেকেন্ড দরকার" ভেবে প্রভিশনিং করা যায় — Provisioned Throughput মোডে আগে থেকে RU/s বেঁধে দেওয়া হয়, Serverless মোডে যতটুকু ব্যবহার ততটুকু বিল হয়। এটা ৮ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৪) Load Balancer, Application Gateway, ও Front Door-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Azure Load Balancer একটা Layer 4 (TCP/UDP) রিজিওনাল লোড ব্যালান্সার — এটা শুধু IP/পোর্ট দেখে ট্রাফিক ছড়ায়, HTTP কনটেন্ট বোঝে না। Application Gateway একটা Layer 7 রিজিওনাল লোড ব্যালান্সার — URL path-ভিত্তিক রাউটিং, SSL termination, এবং বিল্ট-ইন WAF সাপোর্ট করে। Front Door একটা Layer 7 গ্লোবাল (multi-region) এন্ট্রি পয়েন্ট — Microsoft-এর এজ নেটওয়ার্ক থেকে ট্রাফিক নিয়ে সবচেয়ে কাছের/স্বাস্থ্যবান রিজিওনে রাউট করে, সাথে CDN ক্যাশিং ও WAF-ও দেয়। এই তিনটাকে স্তর অনুযায়ী সাজালে: Front Door (গ্লোবাল এন্ট্রি) → Application Gateway (রিজিওনাল, HTTP-aware) → Load Balancer (রিজিওনাল, TCP-level)। এটা ৯ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৫) Traffic Manager ও Front Door-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Traffic Manager DNS-লেভেলে কাজ করে — ক্লায়েন্ট DNS রিজলভ করার সময় কোন রিজিওনের IP পাবে সেটা ঠিক করে দেয়, কিন্তু তারপর ক্লায়েন্ট সরাসরি সেই রিজিওনের সাথে কানেক্ট করে, ট্রাফিক Traffic Manager দিয়ে পাস হয় না। Front Door HTTP(S)-লেভেলে কাজ করে — প্রতিটা রিকোয়েস্ট আসলেই Microsoft-এর এজ নেটওয়ার্ক দিয়ে পাস হয়, ফলে path-ভিত্তিক রাউটিং, real-time health probe অনুযায়ী দ্রুত ফেইলওভার (DNS TTL/ক্যাশিং-এর অপেক্ষা ছাড়াই), এবং SSL termination সম্ভব হয়। এই DNS-level বনাম HTTP-level পার্থক্যটাই সবচেয়ে বেশি গুলিয়ে যায় — Traffic Manager দ্রুত ফেইলওভার দিতে পারে না কারণ ক্লায়েন্ট/রিজলভার DNS ক্যাশ করে রাখে। এটা ১০ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৬) Azure Functions-এর trigger ও binding-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Trigger হলো সেই ইভেন্ট যা একটা ফাংশন এক্সিকিউশন শুরু করে — প্রতিটা ফাংশনের ঠিক একটা trigger থাকে (HTTP request, Timer, Queue message, Blob upload ইত্যাদি)। Binding হলো ডেটা সোর্সের সাথে declarative সংযোগ — input binding ফাংশন শুরুর আগে অতিরিক্ত ডেটা লোড করে দেয় (যেমন একটা ID দিয়ে DB থেকে রেকর্ড আনা), আর output binding ফাংশনের রিটার্ন ভ্যালুকে অটোমেটিক্যালি কোথাও লিখে দেয় (যেমন একটা Queue-তে মেসেজ পাঠানো) — কোনো SDK কোড না লিখেই। এটা ১২ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৭) Durable Functions ও Logic Apps-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Durable Functions কোড-ফার্স্ট — একটা orchestrator ফাংশন সাধারণ প্রোগ্রামিং ভাষায় (C#/Python/JS) লেখা হয়, জটিল কন্ডিশনাল লজিক, লুপ, বা ডাইনামিক ফ্যান-আউট/ফ্যান-ইন প্যাটার্ন লেখার জন্য উপযুক্ত। Logic Apps লো-কোড/no-code — একটা ভিজুয়াল ডিজাইনারে ৪০০+ কানেক্টর দিয়ে ওয়ার্কফ্লো বানানো হয়, বিজনেস ইউজার বা কম টেকনিক্যাল টিমের জন্য সহজবোধ্য, কিন্তু জটিল কাস্টম লজিকে সীমাবদ্ধ হয়ে যায়। মূল সিদ্ধান্ত: যদি জটিল কোড-লজিক লাগে তাহলে Durable Functions, যদি প্রধানত এক্সিস্টিং সার্ভিসগুলো জুড়ে দেওয়া (SaaS ইন্টিগ্রেশন) লাগে তাহলে Logic Apps। এটা ১২ ও ১৪ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৮) Storage Queue ও Service Bus Queue-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Storage Queue সরল, সস্তা, বড় ভলিউমের বেসিক মেসেজ পাসিং-এর জন্য (৬৪KB পর্যন্ত মেসেজ, at-least-once ডেলিভারি) — সাধারণ ব্যাকগ্রাউন্ড টাস্ক কিউয়িং-এ যথেষ্ট। Service Bus Queue এন্টারপ্রাইজ মেসেজিং ফিচার দেয় — FIFO অর্ডারিং (session ব্যবহার করে), dead-letter queue, duplicate detection, transaction সাপোর্ট, larger message size (up to 100MB with premium), এবং topic/subscription দিয়ে pub-sub প্যাটার্ন। জটিল এন্টারপ্রাইজ ওয়ার্কফ্লো বা গ্যারান্টিযুক্ত অর্ডারিং লাগলে Service Bus, সাধারণ decoupling-এ Storage Queue। এটা ১৪ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>১৯) Event Grid ও Event Hub-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Event Grid ডিসক্রিট, লো-ভলিউম "কিছু একটা ঘটলো" টাইপ ইভেন্টের জন্য (যেমন "একটা blob আপলোড হলো", "একটা resource তৈরি হলো") — reactive/event-driven আর্কিটেকচারে push-ভিত্তিক ডেলিভারি, ফিল্টারিং সহ multiple subscriber-এ রাউট করা। Event Hub উচ্চ-ভলিউম, high-throughput টেলিমেট্রি/স্ট্রিমিং ডেটার জন্য (প্রতি সেকেন্ডে লক্ষ লক্ষ ইভেন্ট, যেমন IoT সেন্সর ডেটা বা ক্লিকস্ট্রিম) — Kafka-কম্প্যাটিবল, consumer নিজে থেকে pull করে পড়ে এবং partition-ভিত্তিক অর্ডারিং বজায় থাকে। মূল পার্থক্য: Event Grid ইভেন্ট নোটিফিকেশনের জন্য, Event Hub ডেটা স্ট্রিমিং পাইপলাইনের জন্য। এটা ১৪ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২০) ACI, AKS, ও App Service for Containers — কখন কোনটা ব্যবহার করবেন?</h3>
<p><b>উত্তর:</b> ACI (Azure Container Instances) সবচেয়ে সরল — কোনো অর্কেস্ট্রেশন ছাড়াই একক বা কয়েকটা কন্টেইনার সরাসরি চালানো, সেকেন্ডে স্পিন-আপ, শর্ট-লিভড ব্যাচ জব বা বার্স্ট ক্যাপাসিটির জন্য উপযুক্ত। App Service for Containers একটা PaaS ওয়েব হোস্টিং মডেল যেখানে কাস্টম কন্টেইনার ইমেজ ডিপ্লয় করা যায় কিন্তু স্কেলিং/নেটওয়ার্কিং প্ল্যাটফর্ম ম্যানেজ করে — সাধারণ ওয়েব অ্যাপের জন্য সবচেয়ে কম অপারেশনাল ওভারহেড। AKS (Azure Kubernetes Service) পূর্ণাঙ্গ Kubernetes অর্কেস্ট্রেশন দেয় — মাল্টি-কন্টেইনার মাইক্রোসার্ভিস, কাস্টম স্কেলিং লজিক, সার্ভিস মেশ, বা মাল্টি-ক্লাউড পোর্টেবিলিটি দরকার হলে এটাই সঠিক পছন্দ, তবে কন্ট্রোল বেশি মানে অপারেশনাল জটিলতাও বেশি। এটা ১৫ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২১) Bicep ও ARM Template-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> ARM Template হলো JSON-ভিত্তিক native IaC ফরম্যাট — verbose, নেস্টেড ব্র্যাকেট বেশি, ম্যানুয়ালি লেখা কষ্টকর। Bicep হলো একটা DSL (Domain Specific Language) যা ARM Template-এর ওপর একটা abstraction layer — সিনট্যাক্স অনেক পরিষ্কার, টাইপ-চেকিং ও intellisense সাপোর্ট ভালো, আর কম্পাইল করলে সরাসরি ARM JSON-এ রূপান্তরিত হয় (তাই আন্ডারলাইং ডিপ্লয়মেন্ট ইঞ্জিন একই)। যেহেতু Bicep শুধু একটা সিনট্যাক্স সুবিধা এবং কোনো নতুন রানটাইম ক্যাপাবিলিটি যোগ করে না, Microsoft নিজেই নতুন IaC কাজে Bicep-কে ডিফল্ট সুপারিশ করে। এটা ১৬ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২২) Key Vault-এ Secret, Key, ও Certificate-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Secret একটা সাধারণ string ভ্যালু যা প্লেইনটেক্সট হিসেবে ফেরত পাওয়া যায় (যেমন connection string)। Key একটা cryptographic key যা encrypt/decrypt/sign/verify অপারেশনের জন্য ব্যবহার হয়, এবং চাইলে HSM-backed করে key material vault-এর বাইরে কখনো বের না হতে দেওয়া যায়। Certificate একটা পূর্ণাঙ্গ X.509 সার্টিফিকেট, যেখানে Key Vault পুরো lifecycle (auto-renewal, CA integration) ম্যানেজ করে। এই তিনটা আলাদা object type কারণ এদের সিকিউরিটি মডেল ও ব্যবহারের প্যাটার্ন ভিন্ন। এটা ১৮ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৩) Microsoft Defender for Cloud কীভাবে AWS-এর GuardDuty ও Security Hub-এর কাজ একসাথে করে?</h3>
<p><b>উত্তর:</b> AWS-এ থ্রেট ডিটেকশন (GuardDuty) ও পোস্চার/কমপ্লায়েন্স অ্যাগ্রিগেশন (Security Hub) দুইটা আলাদা সার্ভিস। Microsoft Defender for Cloud এই দুইটা কাজই একটা প্রোডাক্টে করে দুই স্তরের প্ল্যান দিয়ে — Foundational CSPM (ফ্রি, সব resource স্ক্যান করে recommendation ও Secure Score দেয়, Security Hub-এর সমতুল্য) এবং Defender plans (পেইড, প্রতিটা resource type-এর জন্য active threat detection — GuardDuty-এর সমতুল্য)। এই মার্জিং না বুঝলে ইন্টারভিউতে ভুল করে দুইটা আলাদা Azure সার্ভিসের নাম খোঁজার চেষ্টা করা হয়, যেখানে বাস্তবে একটাই প্রোডাক্ট। এটা ১৮ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৪) Activity Log ও Monitor Logs-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Activity Log হলো control-plane audit trail — কে, কখন, কোন ARM API call করলো (VM তৈরি/ডিলিট, NSG rule বদল) তার রেকর্ড, এবং এটা AWS CloudTrail-এর সমতুল্য। Monitor Logs (Log Analytics Workspace-এ) হলো data-plane টেলিমেট্রি — অ্যাপ্লিকেশনের নিজের লগ লাইন, resource-এর diagnostic log ও metric, যা KQL দিয়ে query করা যায়। এই দুইটাকে একই জিনিস ভাবা একটা সাধারণ ভুল — Activity Log-এ কখনো অ্যাপ্লিকেশনের এক্সসেপশন দেখা যাবে না, শুধু কে কী API call করলো তা দেখা যাবে। এটা ১৭ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৫) Well-Architected Framework-এ Azure-এর ৫টা পিলার AWS-এর ৬টা পিলার থেকে কীভাবে ভিন্ন?</h3>
<p><b>উত্তর:</b> AWS Well-Architected Framework-এ ছয়টা পিলার আছে — Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, এবং আলাদা টপ-লেভেল Sustainability পিলার। Azure Well-Architected Framework-এ পাঁচটা পিলার — Reliability, Security, Cost Optimization, Operational Excellence, Performance Efficiency — আলাদা টপ-লেভেল Sustainability পিলার নেই (Microsoft এটা "Sustainable workloads" নামে আলাদা গাইডেন্স হিসেবে দেয়, মূল ফ্রেমওয়ার্কের অংশ না)। ইন্টারভিউতে এই সংখ্যাগত পার্থক্যটা সঠিকভাবে বলতে পারা গুরুত্বপূর্ণ, কারণ ভুলভাবে "Azure-এও ৬টা পিলার" বলাটা একটা কমন ভুল যা ইন্টারভিউয়ারের কাছে ধরা পড়ে যায়। এটা ১৯ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৬) RTO/RPO কী এবং DR স্ট্র্যাটেজি প্যাটার্নগুলো কী কী?</h3>
<p><b>উত্তর:</b> RTO (Recovery Time Objective) হলো বিপর্যয়ের পর সার্ভিস আবার চালু হতে সর্বোচ্চ কতক্ষণ লাগতে পারে তার সীমা, আর RPO (Recovery Point Objective) হলো সর্বোচ্চ কতটুকু ডেটা হারানো মেনে নেওয়া যায় তার সীমা। চারটা মূল DR প্যাটার্ন — Backup & Restore (সস্তা, সবচেয়ে বেশি RTO/RPO, শুধু ব্যাকআপ থেকে restore), Pilot Light (ন্যূনতম কোর কম্পোনেন্ট সবসময় চালু, বাকিটা দ্রুত স্কেল-আপ), Warm Standby (একটা ছোট কিন্তু সম্পূর্ণ কার্যকরী কপি সবসময় চলমান), এবং Multi-Site Active-Active (দুই রিজিওনেই একসাথে লাইভ ট্রাফিক, সবচেয়ে কম RTO/RPO কিন্তু সবচেয়ে ব্যয়বহুল)। Azure-এ এই অর্কেস্ট্রেশনের মূল টুল Azure Site Recovery, যা VM-লেভেল রেপ্লিকেশন ও ফেইলওভার প্ল্যান পরিচালনা করে। এটা ১৯ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৭) Azure App Service-এ Deployment Slot ও Swap কীভাবে zero-downtime deployment দেয়?</h3>
<p><b>উত্তর:</b> Deployment Slot একটা আলাদা, স্বাধীন URL-যুক্ত environment (যেমন staging) তৈরি করে যেখানে নতুন ভার্সন প্রথমে ডিপ্লয় ও যাচাই করা যায়, লাইভ ট্রাফিক না পেয়ে। Swap অপারেশন আসলে কোনো কোড কপি করে না — এটা শুধু routing configuration অদলবদল করে, এবং তার আগে নতুন slot-এ একটা warm-up request পাঠিয়ে নিশ্চিত করে অ্যাপ্লিকেশন আগে থেকেই বুট হয়ে রেডি আছে। ফলে সুইচের মুহূর্তে ব্যবহারকারী কোনো downtime বা cold-start টের পায় না, এবং সমস্যা হলে একই কারণে তাৎক্ষণিক rollback-ও সম্ভব (আবার swap করে)। এটা ১২ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৮) Azure Functions-এর "Dedicated (App Service Plan)" hosting option-টা আসলে কী?</h3>
<p><b>উত্তর:</b> এটা কোনো কাকতালীয় নামকরণ না — Azure Functions আসলে App Service প্ল্যাটফর্মেরই একটা রানটাইম মডেল, আর Dedicated plan-এ একটা Function App সরাসরি একটা App Service Plan-এর উপর চলে, ঠিক একটা সাধারণ Web App-এর মতোই একই compute infrastructure শেয়ার করে — পার্থক্য শুধু কোড কীভাবে ইনভোক হয় (event-driven function বনাম request-response web app)। এই কারণে App Service-এর concept (App Service Plan, tier, scaling) আগে বুঝে নিলে Functions-এর hosting model অনেক স্পষ্ট হয়ে যায়। এটা ১২ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>২৯) NSG Flow Logs, IP Flow Verify, ও Connection Troubleshoot-এর মধ্যে সম্পর্ক কী?</h3>
<p><b>উত্তর:</b> এই তিনটাই আসলে একটা বড় umbrella সার্ভিসের অংশ — Network Watcher, যা প্রতিটা region-এ স্বয়ংক্রিয়ভাবে সক্রিয় থাকে। NSG Flow Logs পুরনো IP ট্রাফিকের একটা historical মেটাডেটা লগ রাখে (post-hoc analysis-এর জন্য), যেখানে IP Flow Verify তাৎক্ষণিকভাবে একটা নির্দিষ্ট source/destination/port-এর ট্রাফিক allow/deny হচ্ছে কিনা এবং ঠিক কোন NSG rule দায়ী তা বলে দেয়, আর Connection Troubleshoot দুইটা resource-এর মধ্যে end-to-end কানেক্টিভিটি টেস্ট করে সমস্যার উৎস (NSG/route/DNS) চিহ্নিত করে। এই টুলগুলো জানা থাকলে ম্যানুয়ালি প্রতিটা NSG rule হাতে-কলমে চেক করার বদলে সরাসরি নির্দিষ্ট উত্তর পাওয়া যায়। এটা ৪ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

<h3>৩০) Azure Advisor কী, এবং এটা Well-Architected Framework-এর সাথে কীভাবে সম্পর্কিত?</h3>
<p><b>উত্তর:</b> Azure Advisor পুরো subscription স্ক্যান করে পাঁচটা ক্যাটাগরিতে (Cost, Security, Reliability, Operational Excellence, Performance) actionable, resource-স্পেসিফিক সুপারিশ দেয় — এই পাঁচটা ক্যাটাগরি ঠিক Well-Architected Framework-এর পাঁচটা pillar-এর সাথেই মেলে, কারণ Advisor সেই framework-কে স্বয়ংক্রিয় continuous scanning টুল হিসেবে বাস্তবায়ন করে। Well-Architected রিভিউ একটা ম্যানুয়াল, প্রশ্ন-ভিত্তিক প্রক্রিয়া যেখানে আর্কিটেক্ট বড় ছবি বিচার করেন, আর Advisor সেই একই দিকনির্দেশনাকে দৈনন্দিন, নির্দিষ্ট resource-ভিত্তিক কাজে রূপান্তর করে — দুটো পরিপূরক, একটা আরেকটার বিকল্প না। এটা ১৯ নম্বর অধ্যায়ে বিস্তারিত হয়েছে।</p>

</template>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
