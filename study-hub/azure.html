<h2 class="title">১. Cloud Computing ও Azure Foundation</h2>
<p class="lead">Azure শেখার আগে জেনে নেওয়া দরকার cloud computing-এর মূল ধারণাগুলো Azure-এ ঠিক কীভাবে বাস্তবায়িত হয়েছে — কারণ concept সবখানে এক হলেও প্রতিটা cloud provider-এর নিজস্ব vocabulary ও hierarchy আছে।</p>

<h3>Cloud Computing মডেল — সংক্ষিপ্ত রিক্যাপ</h3>
<p>Cloud computing-এর মূল প্রতিশ্রুতি হলো <b>CapEx থেকে OpEx-এ</b> সরে যাওয়া — নিজে সার্ভার কিনে ডেটা সেন্টারে বসানোর বিশাল আগাম বিনিয়োগের বদলে, প্রয়োজন অনুযায়ী ব্যবহার করে মাসিক বিলে টাকা দেওয়া। এর সাথে যুক্ত <span class="kw">elasticity</span> — চাহিদা বাড়লে resource স্বয়ংক্রিয়ভাবে বাড়ানো, কমলে কমিয়ে ফেলা, যাতে অলস (idle) resource-এর জন্য টাকা না যায়। এই দুটো ধারণা প্রায় সব cloud provider-এর মার্কেটিং-এর কেন্দ্রে থাকে, এবং Azure-ও ব্যতিক্রম না। যেহেতু এই সিরিজের অনেক পাঠক ইতিমধ্যে AWS কোর্স শেষ করেছেন, এখানে এই বেসিক concept নিয়ে বেশি সময় না দিয়ে সরাসরি Azure-এর নিজস্ব কাঠামোতে ঢুকে যাচ্ছি।</p>

<h3>Azure Global Infrastructure — Region, Availability Zone, Region Pair</h3>
<p><span class="kw">Region</span> হলো পৃথিবীর একটা নির্দিষ্ট ভৌগোলিক এলাকা যেখানে Microsoft-এর একগুচ্ছ ডেটা সেন্টার আছে (যেমন <code>East US</code>, <code>Southeast Asia</code>)। প্রতিটা region-এর ভেতরে থাকতে পারে একাধিক <span class="kw">Availability Zone (AZ)</span> — প্রতিটা AZ আলাদা পাওয়ার, কুলিং ও নেটওয়ার্কিং-যুক্ত একটা বা একাধিক ফিজিক্যাল ডেটা সেন্টার, যাতে একটা zone-এ বিদ্যুৎ বা হার্ডওয়্যার ব্যর্থতা হলেও অন্য zone প্রভাবিত না হয়।</p>
<p>Azure-এর একটা নিজস্ব ধারণা হলো <span class="kw">Region Pair</span> — Microsoft প্রতিটা region-কে একই ভৌগোলিক এলাকার (সাধারণত একই মহাদেশ, কিন্তু ভিন্ন ফল্ট লাইন/বিদ্যুৎ গ্রিডে) একটা নির্দিষ্ট দ্বিতীয় region-এর সাথে পূর্ব থেকেই জোড়া বেঁধে রাখে (যেমন <code>East US</code> ↔ <code>West US</code>)। এই pairing নিজে থেকেই কিছু গ্যারান্টি বহন করে — বড় region-ওয়াইড দুর্যোগের সময় Microsoft একই সাথে দুইটা paired region-এ প্ল্যানড মেইনটেন্যান্স চালায় না (যাতে দুটোই একসাথে ডাউন না থাকে), এবং কিছু geo-redundant storage সার্ভিস (যেমন GRS) স্বয়ংক্রিয়ভাবে ডেটা paired region-এ রেপ্লিকেট করে।</p>
<div class="callout why"><span class="tag">কেন Region Pair AWS-এ ঠিক এইভাবে নেই</span> AWS-এ disaster recovery region পুরোপুরি আপনার নিজের সিদ্ধান্ত — আপনি যেকোনো দুইটা region বেছে DR ডিজাইন করেন, কিন্তু provider-লেভেলে কোনো পূর্ব-নির্ধারিত pairing গ্যারান্টি নেই। Azure-এ Microsoft নিজেই এই সিদ্ধান্ত আংশিকভাবে নিয়ে রেখেছে — প্রতিটা region-এর একটা ডিফল্ট partner region আছে, এবং এই pairing অনেক geo-replication ফিচারের ভিত্তি। এটা সুবিধা (কম সিদ্ধান্ত নিতে হয়) এবং সীমাবদ্ধতা (আপনি সবসময় নিজের ইচ্ছামতো pair বেছে নিতে পারেন না) — দুটোই।</div>

<h3>Resource Hierarchy — Management Group → Subscription → Resource Group → Resource</h3>
<p>Azure-এর সবকিছু একটা চার-স্তরের hierarchy-তে সাজানো থাকে। এই hierarchy শুধু organization-এর জন্য না — এটাই RBAC ও Policy প্রয়োগের ভিত্তি, কারণ যেকোনো স্তরে assign করা role বা policy নিচের সব স্তরে <b>inherit</b> হয়।</p>
<div class="diagram"><pre>
        Management Group  (একাধিক subscription-এর উপর centralized policy/RBAC)
              │
              ▼
         Subscription      (billing boundary + quota boundary)
              │
              ▼
        Resource Group     (লাইফসাইকেল/লজিক্যাল কনটেইনার)
              │
              ▼
           Resource         (VM, Storage Account, VNet ...)
</pre></div>
<p>প্রতিটা স্তরের নিজস্ব উদ্দেশ্য আছে, এবং এগুলো গুলিয়ে ফেললে ভুল আর্কিটেকচার হয়:</p>
<ul>
<li><b>Subscription</b> হলো <span class="kw">billing boundary</span> — একটা subscription-এর ভেতরের সব খরচ একটাই ইনভয়েসে আসে, এবং কিছু hard quota (যেমন per-region vCPU limit) subscription-ভিত্তিক। এজন্য অনেক প্রতিষ্ঠান প্রোডাকশন আর ডেভেলপমেন্টের জন্য আলাদা subscription ব্যবহার করে — শুধু নিরাপত্তার জন্য না, বরং খরচ আলাদাভাবে ট্র্যাক করার জন্যও।</li>
<li><b>Resource Group</b> একটা লজিক্যাল কনটেইনার যার ভেতরের রিসোর্সগুলোর একটা common লাইফসাইকেল থাকার কথা — অর্থাৎ এরা একসাথে তৈরি হয়, একসাথে ডিলিট হয়। এটা geographic কনটেইনার না (এক resource group-এ ভিন্ন region-এর রিসোর্স রাখা যায়), এটা organizational কনটেইনার।</li>
<li><b>Management Group</b> তখনই দরকার হয় যখন একটা organization-এর একাধিক subscription আছে এবং সবগুলোর উপর একই RBAC বা Policy একবারে প্রয়োগ করতে চান — যেমন "সব subscription-এ নির্দিষ্ট region-এর বাইরে resource তৈরি বন্ধ" নিয়ম একটাই Management Group-এ বসিয়ে দিলে সব subscription-এ কার্যকর হয়ে যায়।</li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake — Resource Group ডিলিট করার আগে না ভাবা</span> Resource Group ডিলিট করলে তার ভেতরের <b>সব</b> রিসোর্স ক্যাসকেড হয়ে ডিলিট হয়ে যায় — কোনো নিশ্চিতকরণ প্রম্পট প্রতিটা রিসোর্সের জন্য আলাদাভাবে আসে না। প্রোডাকশনে ভুলবশত একটা টেস্ট Resource Group ডিলিট করতে গিয়ে আসল ডেটাবেস উড়িয়ে দেওয়ার ঘটনা বিরল না। এই কারণে গুরুত্বপূর্ণ resource group-এ <code>CanNotDelete</code> বা <code>ReadOnly</code> ধরনের <span class="kw">Resource Lock</span> বসিয়ে রাখা উচিত।</div>

<h3>Azure Resource Manager (ARM) — একটাই নিয়ন্ত্রণ-পথ</h3>
<p>আপনি Portal থেকে ক্লিক করেন, বা Azure CLI-তে কমান্ড লেখেন, বা PowerShell ব্যবহার করেন, বা একটা ARM Template/Bicep ফাইল ডিপ্লয় করেন — সবকিছুই শেষমেশ একই <span class="kw">Azure Resource Manager (ARM)</span> REST API-তে গিয়ে পড়ে। এর মানে হলো, RBAC ও Policy যেভাবেই ইন্টারঅ্যাক্ট করেন না কেন, একইভাবে প্রয়োগ হয় — কোনো "backdoor" পথ নেই যেটা RBAC এড়িয়ে যেতে পারে।</p>
<div class="diagram"><pre>
   Portal    Azure CLI    PowerShell    ARM/Bicep Template    SDK
     │           │             │                │              │
     └───────────┴──────┬──────┴────────────────┴──────────────┘
                         ▼
              Azure Resource Manager (ARM)
                  REST API — একই entry point
                         │
          ┌──────────────┼──────────────┐
          ▼              ▼              ▼
      RBAC চেক      Policy চেক     Resource Provider
     (কে করতে      (state         (আসল রিসোর্স
      পারবে?)       বৈধ?)          তৈরি/পরিবর্তন)
</pre></div>
<div class="callout why"><span class="tag">কেন এই একক এন্ট্রি পয়েন্ট গুরুত্বপূর্ণ</span> যেহেতু সব রিকোয়েস্ট ARM-এর মধ্য দিয়ে যায়, তাই RBAC ও Policy কেন্দ্রীয়ভাবে একবার সংজ্ঞায়িত করলেই তা Portal, CLI, Template — সবখানে সমানভাবে কার্যকর হয়। এটা declarative infrastructure-as-code (ARM Template/Bicep/Terraform) নির্ভরযোগ্য হওয়ার মূল কারণ — টুল যাই হোক, ফলাফল predictable, কারণ নিয়ন্ত্রণ layer একটাই।</div>

<h3>অ্যাক্সেসের পথ</h3>
<p>Azure ব্যবহারের জন্য প্রধানত চারটা ইন্টারফেস আছে: <b>Azure Portal</b> (ব্রাউজার-ভিত্তিক GUI, শেখা ও এক্সপ্লোর করার জন্য ভালো), <b>Azure CLI</b> (ক্রস-প্ল্যাটফর্ম কমান্ড-লাইন, স্ক্রিপ্টিং/CI-CD-তে জনপ্রিয়), <b>Azure PowerShell</b> (PowerShell cmdlet-ভিত্তিক, Windows-কেন্দ্রিক টিমে বেশি ব্যবহৃত), এবং <b>Azure Cloud Shell</b> (ব্রাউজার থেকেই একটা free, pre-configured shell — Bash বা PowerShell — যেখানে CLI আগে থেকেই ইনস্টল করা থাকে, নিজের মেশিনে কিছু সেটআপ না করেই)।</p>
<pre>

  --resource-group rg-demo \
  --location eastus \

<h3>Azure Free Account</h3>
<p>নতুন ব্যবহারকারীদের জন্য Azure একটা Free Account অফার করে — কিছু নির্দিষ্ট ডলার ক্রেডিট ৩০ দিনের জন্য, প্লাস কিছু সার্ভিসের সীমিত ব্যবহার সবসময় ফ্রি (যেমন নির্দিষ্ট saইজের একটা Linux/Windows VM প্রতি মাসে ৭৫০ ঘণ্টা পর্যন্ত)। শেখার সময় বাজেট নিয়ন্ত্রণে রাখতে <span class="kw">Budget Alert</span> ও <span class="kw">Cost Management</span> সেট করে রাখা উচিত, কারণ ফ্রি ক্রেডিট শেষ হয়ে গেলে বা ফ্রি টিয়ারের বাইরে গেলে স্বয়ংক্রিয়ভাবে বিলিং শুরু হয়ে যায়।</p>

<h3>Shared Responsibility Model</h3>

<h3>Azure Well-Architected Framework</h3>
<p>Azure একটা কাঠামোগত গাইডলাইন দেয় ভালো আর্কিটেকচার ডিজাইনের জন্য, যাকে বলে <span class="kw">Well-Architected Framework</span>, যা পাঁচটা pillar-এ বিভক্ত:</p>
<ul>
<li><b>Reliability</b> — সিস্টেম ব্যর্থতার পরও চালু থাকতে ও রিকভার করতে পারা।</li>
<li><b>Security</b> — ডেটা ও সিস্টেমকে হুমকি থেকে রক্ষা করা।</li>
<li><b>Cost Optimization</b> — সর্বোচ্চ মূল্য সর্বনিম্ন খরচে পাওয়া।</li>
<li><b>Operational Excellence</b> — ডিপ্লয়মেন্ট, মনিটরিং ও অপারেশন প্রক্রিয়া দক্ষ রাখা।</li>
<li><b>Performance Efficiency</b> — চাহিদার সাথে সামঞ্জস্য রেখে কার্যকরভাবে resource ব্যবহার করা।</li>
</ul>
<p>লক্ষণীয়, Azure-এর মূল framework-এ ঠিক পাঁচটা pillar আছে — AWS-এর ছয়-pillar Well-Architected Framework-এ (যেখানে আলাদা একটা Sustainability pillar আছে) থেকে সংখ্যায় এটা ভিন্ন। কনসেপ্টগত ওভারল্যাপ অনেক, কিন্তু গঠন হুবহু এক না।</p>

<h2 class="title">২. Microsoft Entra ID ও RBAC</h2>
<p class="lead">Identity হলো cloud security-এর ভিত্তি — কে কে, এবং সে কী করতে পারবে, এই দুই প্রশ্নের উত্তর ছাড়া কোনো অ্যাক্সেস নিয়ন্ত্রণ সম্ভব না।</p>

<h3>Microsoft Entra ID কী</h3>
<p><span class="kw">Microsoft Entra ID</span> (আগের নাম <code>Azure Active Directory</code> বা Azure AD — নাম বদলালেও প্রযুক্তি একই) হলো Microsoft-এর cloud-native identity ও access management সার্ভিস। এটা traditional on-premises <code>Active Directory Domain Services (AD DS)</code> থেকে গঠনগতভাবে সম্পূর্ণ আলাদা — এই পার্থক্যটা বোঝা জরুরি কারণ নাম একই রকম শোনালেও এরা দুই ভিন্ন জগতের প্রযুক্তি।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>Traditional AD DS (on-premises)</th><th>Microsoft Entra ID (cloud)</th></tr>
<tr><td>প্রোটোকল</td><td>LDAP, Kerberos, NTLM</td><td>REST API, OAuth 2.0, OIDC, SAML</td></tr>
<tr><td>গঠন</td><td>Organizational Unit (OU), Group Policy</td><td>Flat directory, Group, Conditional Access</td></tr>
<tr><td>মূল ব্যবহার</td><td>Domain-joined Windows মেশিন, on-prem রিসোর্স</td><td>Cloud/SaaS অ্যাপ, API, মোবাইল/ওয়েব সাইন-ইন</td></tr>
<tr><td>নেটওয়ার্ক নির্ভরতা</td><td>ভৌগোলিকভাবে একই নেটওয়ার্কের কাছাকাছি হওয়া দরকার</td><td>ইন্টারনেট থেকে যেকোনো জায়গা থেকে অ্যাক্সেসযোগ্য</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এই পার্থক্য শুধু "নতুন সংস্করণ" না</span> AD DS ডিজাইন হয়েছিল ১৯৯০-এর দশকে, corporate নেটওয়ার্কের ভেতরে থাকা মেশিনদের জন্য — এর প্রোটোকল (LDAP/Kerberos) ধরে নেয় ক্লায়েন্ট ও সার্ভার একই ট্রাস্টেড নেটওয়ার্কে আছে। Entra ID ডিজাইন হয়েছে ইন্টারনেট-নেটিভ যুগে — এখানে প্রতিটা সাইন-ইন request একটা untrusted নেটওয়ার্ক (পাবলিক ইন্টারনেট) থেকে আসে ধরে নিয়েই টোকেন-ভিত্তিক (JWT) প্রমাণীকরণ করা হয়। এই কারণেই দুটো একই কোম্পানির প্রোডাক্ট হলেও কোডবেস ও আর্কিটেকচার সম্পূর্ণ ভিন্ন।</div>

<h3>Tenant, User, Group, Service Principal, Managed Identity</h3>
<p>একটা <span class="kw">Tenant</span> হলো একটা প্রতিষ্ঠানের জন্য নিবেদিত, বিচ্ছিন্ন Entra ID directory instance — সব User, Group, Application registration এই tenant-এর ভেতরে থাকে। একই Azure subscription একটামাত্র tenant-এর সাথে যুক্ত থাকে (যদিও এক tenant একাধিক subscription চালাতে পারে)।</p>
<p>একটা অ্যাপ্লিকেশনকে যখন Azure রিসোর্সের সাথে ইন্টারঅ্যাক্ট করতে হয় (যেমন একটা স্ক্রিপ্ট যেটা Storage Account থেকে ফাইল পড়ে), তখন সেই অ্যাপ্লিকেশনেরও একটা identity দরকার — মানুষ ইউজারের মতো লগইন করানো যায় না। এই identity-কে বলে <span class="kw">Service Principal</span> — এটা মূলত একটা application registration-এর জন্য directory-তে তৈরি করা identity, যার নিজস্ব credential (client secret বা certificate) থাকে।</p>
<p>সমস্যা হলো, Service Principal-এর credential ম্যানুয়ালি তৈরি, রোটেট ও সংরক্ষণ করতে হয় — আর কোথাও না কোথাও এই secret কোডে বা কনফিগ ফাইলে embed করার প্রলোভন থাকে, যা একটা বড় নিরাপত্তা ঝুঁকি। এই সমস্যা সমাধানের জন্য এসেছে <span class="kw">Managed Identity</span> — Azure নিজে থেকেই একটা resource-এর (যেমন একটা VM বা App Service) জন্য Entra ID-তে একটা identity তৈরি করে ও তার credential সম্পূর্ণভাবে নিজে ব্যবস্থাপনা করে, কখনো কোনো secret আপনাকে দেখতে বা সংরক্ষণ করতে হয় না।</p>

<tr><th>ধরন</th><th>বর্ণনা</th><th>লাইফসাইকেল</th></tr>
<tr><td>System-assigned Managed Identity</td><td>একটা নির্দিষ্ট resource-এর সাথে সরাসরি বাঁধা, স্বয়ংক্রিয়ভাবে তৈরি হয়</td><td>resource ডিলিট হলে identity-ও ডিলিট হয়ে যায়</td></tr>
<tr><td>User-assigned Managed Identity</td><td>স্বাধীনভাবে তৈরি একটা identity, একাধিক resource-এ সংযুক্ত করা যায়</td><td>resource ডিলিট হলেও identity টিকে থাকে, আলাদাভাবে ম্যানেজ হয়</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — credential embed করবেন না</span> কোনো কোডে, কনফিগ ফাইলে, বা environment variable-এ সরাসরি secret/password/connection string embed করা কখনো উচিত না। যেখানেই Azure resource-এর মধ্যে (VM → Storage, Function → Key Vault, ইত্যাদি) যোগাযোগ দরকার, সেখানে Managed Identity ব্যবহার করুন। এটা conceptually AWS-এর <b>IAM Role</b>-এর (EC2 Instance Profile) সমতুল্য ধারণা — credential-বিহীন identity — কিন্তু implementation ভিন্ন, কারণ Managed Identity Entra ID-এর token-ভিত্তিক মডেলের উপর দাঁড়িয়ে আছে।</div>

<h3>RBAC — তিনটা উপাদান</h3>
<p>Azure-এর <span class="kw">Role-Based Access Control (RBAC)</span> তিনটা জিনিসের সমন্বয়ে একটা <span class="kw">Role Assignment</span> তৈরি করে:</p>
<div class="diagram"><pre>
   Security Principal  +  Role Definition  +  Scope   =  Role Assignment
   (কে — User/Group/       (কী করতে         (কোথায় —
    Service Principal/       পারবে —          Management Group/
    Managed Identity)        permission-এর     Subscription/
                              তালিকা)           Resource Group/Resource)
</pre></div>
<p>উদাহরণ: যদি একটা User-কে <code>Contributor</code> role দিয়ে একটা নির্দিষ্ট Resource Group-এর scope-এ assign করা হয়, তাহলে সে ঠিক সেই Resource Group-এর ভেতরের রিসোর্স তৈরি/পরিবর্তন করতে পারবে — এর বাইরে কিছু না।</p>

<h3>Scope Inheritance — উপর থেকে নিচে</h3>
<p>RBAC-এর সবচেয়ে গুরুত্বপূর্ণ আচরণ হলো — যেকোনো স্তরে দেওয়া role assignment তার নিচের সব স্তরে স্বয়ংক্রিয়ভাবে <span class="kw">inherit</span> হয়। যদি Management Group-এর scope-এ কাউকে <code>Reader</code> role দেওয়া হয়, সে সেই Management Group-এর অধীনস্থ প্রতিটা Subscription, প্রতিটা Resource Group, প্রতিটা Resource-এ Reader অ্যাক্সেস পেয়ে যাবে — আলাদা করে প্রতিটা subscription-এ আবার assign করার দরকার নেই।</p>
<div class="diagram"><pre>
Management Group "Contoso-Prod"  ← Role: Reader assign করা হলো এখানে
   │
   ├── Subscription A  ─────────────► Reader (inherited)
   │      └── RG-web  ──────────────► Reader (inherited)
   │             └── VM-01  ────────► Reader (inherited)
   │
   └── Subscription B  ─────────────► Reader (inherited)
          └── RG-db  ───────────────► Reader (inherited)
</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — উঁচু স্তরে বেশি ক্ষমতা দিয়ে ফেলা</span> একজন ডেভেলপারকে দ্রুত অ্যাক্সেস দেওয়ার তাড়াহুড়ায় Subscription-লেভেলে <code>Owner</code> দিয়ে দেওয়া একটা খুবই সাধারণ ভুল — এতে সে subscription-এর সব resource group-এর সব resource-এ পূর্ণ নিয়ন্ত্রণ পেয়ে যায়, যদিও তার দরকার ছিল শুধু একটা নির্দিষ্ট resource group। সবসময় <span class="kw">least privilege</span> মেনে সবচেয়ে নিচের প্রয়োজনীয় scope-এ role assign করুন।</div>

<h3>Built-in Role vs Custom Role</h3>
<table>
<tr><th>Role</th><th>কী করতে পারে</th></tr>
<tr><td>Owner</td><td>সব রিসোর্সে পূর্ণ অ্যাক্সেস, এবং অন্যদের role assign করার ক্ষমতাও আছে</td></tr>
<tr><td>Contributor</td><td>সব রিসোর্স তৈরি/পরিবর্তন/ডিলিট করতে পারে, কিন্তু অন্যকে role assign করতে পারে না</td></tr>
<tr><td>Reader</td><td>সব রিসোর্স দেখতে পারে, কিন্তু কোনো পরিবর্তন করতে পারে না</td></tr>
<tr><td>User Access Administrator</td><td>রিসোর্স পরিবর্তন করতে পারে না, কিন্তু অন্যদের অ্যাক্সেস (role assignment) ব্যবস্থাপনা করতে পারে</td></tr>
</table>
<p>এই built-in role গুলো বেশিরভাগ পরিস্থিতির জন্য যথেষ্ট। যখন এগুলোর কোনোটাই ঠিক মিলে না — যেমন "শুধু VM restart করতে পারবে, কিন্তু ডিলিট করতে পারবে না" — তখন <span class="kw">Custom Role</span> তৈরি করা যায়, যেখানে নির্দিষ্ট <code>Actions</code> ও <code>NotActions</code> তালিকা দিয়ে সূক্ষ্মভাবে permission সংজ্ঞায়িত করা হয়।</p>

<h3>Azure Policy — RBAC থেকে ভিন্ন স্তরের টুল</h3>
<p>RBAC ও Policy প্রায়ই গুলিয়ে ফেলা হয়, কিন্তু এরা সম্পূর্ণ ভিন্ন প্রশ্নের উত্তর দেয়:</p>
<div class="grid2">
<div class="box"><b>RBAC</b> — "এই identity কী <u>করতে</u> পারবে?" (Action-ভিত্তিক অনুমতি)</div>
<div class="box"><b>Azure Policy</b> — "এই resource-এর <u>অবস্থা</u> কেমন হতে হবে?" (State/compliance-ভিত্তিক নিয়ম)</div>
</div>
<p>একজন ইউজারের হয়তো RBAC অনুযায়ী নতুন Storage Account তৈরি করার পূর্ণ অনুমতি (Contributor) আছে, কিন্তু Policy বলতে পারে "সব Storage Account-এ HTTPS-only এনফোর্সড থাকতে হবে" — এই দুইটা একসাথে কাজ করে, একটা আরেকটার বিকল্প না।</p>
<pre>
{
  "if": {
    "allOf": [
      {
        "field": "type",
        "equals": "Microsoft.Storage/storageAccounts"
      },
      {
        "field": "Microsoft.Storage/storageAccounts/supportsHttpsTrafficOnly",
        "notEquals": "true"
      }
    ]
  },
  "then": {
    "effect": "deny"
  }
}
</pre>
<p>এই policy definition-এ <code>effect: "deny"</code> মানে — HTTPS-only চালু না থাকলে সেই Storage Account তৈরিই হতে দেওয়া হবে না। যদি <code>effect: "audit"</code> ব্যবহার করা হতো, তাহলে non-compliant resource তৈরি হতে দেওয়া হতো, শুধু compliance রিপোর্টে flag করা হতো।</p>
<div class="callout why"><span class="tag">কেন Deny আর Audit দুইটাই দরকার</span> নতুন নিয়ম চালু করার সময় সরাসরি <code>Deny</code> বসিয়ে দিলে বিদ্যমান pipeline হঠাৎ ভেঙে যেতে পারে। এজন্য প্রথমে <code>Audit</code> দিয়ে বোঝা হয় কতগুলো resource আসলে non-compliant, তারপর ধীরে ধীরে ঠিক করে শেষে <code>Deny</code>-তে upgrade করা হয় — এটা Azure Policy রোলআউটের একটা প্রমাণিত প্র্যাকটিস।</div>

<h3>Conditional Access</h3>
<p><span class="kw">Conditional Access</span> হলো "if-then" নিয়মের একটা ইঞ্জিন যা সাইন-ইন সময়ে নির্দিষ্ট শর্ত পরীক্ষা করে অতিরিক্ত নিরাপত্তা বাধ্যতামূলক করে — যেমন "যদি ইউজার অফিসের বাইরের নেটওয়ার্ক থেকে বা অপরিচিত ডিভাইস থেকে সাইন-ইন করে, তাহলে MFA বাধ্যতামূলক" অথবা "যদি sign-in risk score উচ্চ হয় (Entra ID-এর নিজস্ব risk-detection অনুযায়ী), তাহলে পাসওয়ার্ড পরিবর্তন বাধ্যতামূলক"।</p>

<h3>Privileged Identity Management (PIM)</h3>
<p><span class="kw">PIM</span> একটা <span class="kw">just-in-time (JIT)</span> অ্যাক্সেস মডেল বাস্তবায়ন করে — একজন ইউজার সবসময় Owner/Contributor role নিয়ে বসে না থেকে, প্রয়োজনের সময় নির্দিষ্ট সময়ের জন্য (যেমন ২ ঘণ্টা) সেই role <span class="kw">activate</span> করে, প্রায়ই একটা approval workflow বা MFA-এর মধ্য দিয়ে। সময় শেষ হলে role স্বয়ংক্রিয়ভাবে নিষ্ক্রিয় হয়ে যায়।</p>
<div class="callout best"><span class="tag">Best practice — Standing Access-এর বদলে PIM</span> সবসময় সক্রিয় থাকা (standing) privileged অ্যাক্সেস একটা বড় আক্রমণ-পৃষ্ঠ তৈরি করে — যদি সেই ইউজারের অ্যাকাউন্ট কোনোভাবে compromise হয়, আক্রমণকারী সাথে সাথেই পূর্ণ privileged অ্যাক্সেস পেয়ে যায়। PIM দিয়ে privileged role-কে ডিফল্টভাবে নিষ্ক্রিয় (eligible কিন্তু active না) রাখলে, compromise হওয়া অ্যাকাউন্টেরও activation ছাড়া কোনো ক্ষমতা থাকে না — এটা attack window বহুলাংশে কমিয়ে দেয়।</div>

<h3>Azure AD B2C / Microsoft Entra External ID</h3>
<p>এতক্ষণ যা আলোচনা হলো তা মূলত <b>কর্মচারী/অভ্যন্তরীণ</b> identity-এর জন্য একটা tenant। কিন্তু যখন একটা অ্যাপ্লিকেশনের গ্রাহকদের (customer-facing) জন্য সাইন-আপ/সাইন-ইন দরকার — যেমন একটা ই-কমার্স সাইটের লক্ষ লক্ষ ব্যবহারকারী — তখন প্রতিষ্ঠানের অভ্যন্তরীণ tenant ব্যবহার করা উচিত না, কারণ ভিন্ন স্কেল, ভিন্ন সাইন-ইন অভিজ্ঞতা (social login, custom branding), ও ভিন্ন সিকিউরিটি বিবেচনা প্রয়োজন। এই জন্যই আলাদা <span class="kw">Azure AD B2C</span> (এখন <code>Microsoft Entra External ID</code> নামে বিবর্তিত) tenant টাইপ ব্যবহার করা হয় — এটা সম্পূর্ণ আলাদাভাবে ব্যবস্থাপিত, যাতে গ্রাহক-identity ও কর্মচারী-identity কখনো মিশে না যায়।</p>

<h2 class="title">৩. Virtual Machines</h2>
<p class="lead">Virtual Machine হলো Azure-এর IaaS স্তরের ভিত্তি — নিজের OS, নিজের কনফিগারেশন নিয়ন্ত্রণ করার সবচেয়ে নমনীয় (কিন্তু সবচেয়ে বেশি রক্ষণাবেক্ষণ-নির্ভর) উপায়।</p>

<h3>VM Size নামকরণ পদ্ধতি</h3>
<p>Azure VM-এর সাইজ নাম প্রথম দেখায় দুর্বোধ্য মনে হতে পারে, কিন্তু এটা একটা নির্দিষ্ট প্যাটার্ন মেনে চলে যা একবার বুঝে গেলে যেকোনো সাইজ পড়া সহজ হয়ে যায়।</p>
<div class="diagram"><pre>
        Standard_D2s_v5
        │       │ │  │
        │       │ │  └── Version — v5 = পঞ্চম জেনারেশন হার্ডওয়্যার
        │       │ └───── Additional capability — 's' = Premium Storage সাপোর্ট
        │       └─────── vCPU সংখ্যা — 2 vCPU
        └─────────────── Series/Family — D = general purpose
</pre></div>
<p>Family লেটার নির্দেশ করে ব্যবহারের ধরন — যেমন <code>D</code>-সিরিজ general purpose, <code>E</code>-সিরিজ memory-optimized, <code>F</code>-সিরিজ compute-optimized, <code>N</code>-সিরিজ GPU-যুক্ত। Additional capability লেটার (<code>s</code>) থাকলে বোঝায় সেই VM Premium SSD ব্যবহার করতে পারবে; না থাকলে শুধু Standard storage সাপোর্ট করে।</p>

<h3>VM Power State — Stopped vs Stopped (Deallocated)</h3>
<p>এটা Azure-এর সবচেয়ে ভুল-বোঝাবুঝির জায়গাগুলোর একটা। VM-এর দুইটা ভিন্ন "বন্ধ" অবস্থা আছে, এবং বিলিং-এর দিক থেকে এদের পার্থক্য বিশাল:</p>
<table>
<tr><th>অবস্থা</th><th>মানে</th><th>Compute বিল</th><th>Public IP</th></tr>
<tr><td>Stopped</td><td>OS-এর ভেতর থেকে shutdown করা হয়েছে (guest OS shutdown), কিন্তু Azure hardware allocation এখনো ধরে রেখেছে</td><td>এখনো চলে</td><td>থেকে যায়</td></tr>
<tr><td>Stopped (Deallocated)</td><td>Azure Portal/CLI থেকে সরাসরি "Stop" করা হয়েছে — underlying hardware সম্পূর্ণ ছেড়ে দেওয়া হয়েছে</td><td>বন্ধ (শুধু disk-এর বিল থাকে)</td><td>ছেড়ে দেওয়া হতে পারে (dynamic হলে)</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — OS থেকে shutdown করে বিল বন্ধ ভাবা</span> অনেকে Windows/Linux-এর ভেতর থেকে <code>shutdown</code> কমান্ড চালিয়ে ভাবেন compute বিল বন্ধ হয়ে গেছে — কিন্তু তা হয় না, কারণ Azure তখনো সেই VM-এর জন্য হার্ডওয়্যার বরাদ্দ ধরে রাখে (যাতে আপনি তাৎক্ষণিকভাবে আবার বুট করতে পারেন)। compute বিল সত্যিকার অর্থে বন্ধ করতে VM-কে অবশ্যই Azure Portal/CLI থেকে Stop করতে হবে, যা VM-কে <b>Deallocated</b> অবস্থায় নিয়ে যায়। AWS-এর EC2-তে "stop" করলেই সাধারণত compute বিল বন্ধ হয়ে যায় — এই সূক্ষ্ম পার্থক্যটা না জানলে Azure বিলে অপ্রত্যাশিত চার্জ দেখে অবাক হতে হয়।</div>

<h3>Availability Set vs Availability Zone</h3>
<p>Azure-এ high availability-এর জন্য দুইটা ভিন্ন স্তরের সমাধান আছে, এবং এরা ভিন্ন ধরনের ব্যর্থতা থেকে রক্ষা করে:</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>Availability Set</th><th>Availability Zone</th></tr>
<tr><td>স্কোপ</td><td>একই datacenter-এর ভেতরে</td><td>একই region-এর ভিন্ন, ফিজিক্যালি বিচ্ছিন্ন datacenter</td></tr>
<tr><td>রক্ষা করে</td><td>হার্ডওয়্যার র‍্যাক/সার্ভার ব্যর্থতা, প্ল্যানড মেইনটেন্যান্স</td><td>সম্পূর্ণ datacenter-লেভেল দুর্যোগ (আগুন, বন্যা, বিদ্যুৎ বিভ্রাট)</td></tr>
<tr><td>মেকানিজম</td><td>Fault Domain (হার্ডওয়্যার গ্রুপিং) + Update Domain (মেইনটেন্যান্স গ্রুপিং)</td><td>Zone 1 / 2 / 3 — আলাদা পাওয়ার, কুলিং, নেটওয়ার্ক</td></tr>
<tr><td>ল্যাটেন্সি</td><td>খুবই কম (একই ডেটা সেন্টার)</td><td>সামান্য বেশি (আলাদা ডেটা সেন্টার, কিন্তু নিম্ন-ল্যাটেন্সি লিংকে যুক্ত)</td></tr>
</table>
<div class="callout why"><span class="tag">কেন দুইটা ভিন্ন স্তরের সমাধান দরকার</span> Availability Set আপনাকে "সব VM একসাথে maintenance-এর জন্য রিবুট হয়ে যাওয়া" বা "একটা র‍্যাকের পাওয়ার সাপ্লাই ব্যর্থ হয়ে সব VM একসাথে বন্ধ হয়ে যাওয়া" থেকে রক্ষা করে — কিন্তু পুরো ডেটা সেন্টার ধ্বংস হয়ে গেলে Availability Set-এর সব VM-ই হারিয়ে যাবে, কারণ এরা একই ফিজিক্যাল বিল্ডিং-এ। Availability Zone সেই ঝুঁকি কভার করে সম্পূর্ণ ভিন্ন বিল্ডিং-এ replica রেখে। প্রোডাকশন workload-এ যেখানে region-এর মধ্যে সর্বোচ্চ resiliency দরকার, সেখানে Availability Zone অগ্রাধিকার পায়; যেখানে শুধু একই datacenter-এর মধ্যে হার্ডওয়্যার-লেভেল redundancy যথেষ্ট, সেখানে Availability Set ব্যবহার করা যায়।</div>

<h3>Managed Disk এবং NSG — সংক্ষিপ্ত মেনশন</h3>
<p>প্রতিটা VM-এর OS ও ডেটা <span class="kw">Managed Disk</span>-এ সংরক্ষিত থাকে — Azure নিজে storage account ব্যবস্থাপনা করে, আপনাকে শুধু সাইজ ও পারফরম্যান্স টিয়ার (Standard HDD, Standard SSD, Premium SSD, Ultra Disk) বেছে নিতে হয়। এর বিস্তারিত পরের চ্যাপ্টারে আলোচনা হবে। একইভাবে, VM-এর নেটওয়ার্ক ট্রাফিক নিয়ন্ত্রণ করে <span class="kw">Network Security Group (NSG)</span> — এর বিস্তারিত তুলনা (বিশেষ করে AWS Security Group-এর সাথে পার্থক্য) পরের VNet চ্যাপ্টারে বিস্তারিতভাবে আলোচনা হবে।</p>

<h3>Azure Bastion</h3>
<p>ঐতিহ্যগতভাবে একটা VM-এ RDP/SSH করতে হলে VM-এর একটা public IP লাগত, অথবা একটা নিজস্ব "jump box"/bastion host চালাতে হতো যার নিজেরই একটা public IP ও open port থাকত — যা নিজেই একটা আক্রমণ-পৃষ্ঠ। <span class="kw">Azure Bastion</span> এই সমস্যা সমাধান করে — এটা একটা fully-managed PaaS সার্ভিস যা Azure Portal-এর ব্রাউজার থেকেই সরাসরি RDP/SSH সেশন খুলে দেয়, VM-এ কোনো public IP বা open port 22/3389 ছাড়াই, TLS-এর মাধ্যমে।</p>
<div class="callout why"><span class="tag">কেন এটা নিজে bastion host চালানোর চেয়ে নিরাপদ</span> নিজে একটা bastion VM চালালে সেটা নিজেই patch করতে হয়, নিজেই harden করতে হয়, এবং তার public IP/port নিজেই একটা টার্গেট হয়ে যায়। Azure Bastion Microsoft-এর ব্যবস্থাপিত সার্ভিস — এটা কখনো public internet-এ port 22/3389 এক্সপোজ করে না, ট্রাফিক Azure-এর নিজস্ব backbone দিয়ে যায়। এই ধারণা conceptually AWS-এর <b>Systems Manager Session Manager</b>-এর সমতুল্য — উভয়ই "কোনো ইনবাউন্ড পোর্ট খোলা ছাড়াই সিকিউর অ্যাক্সেস" সমাধান করে।</div>

<h3>Custom Script Extension ও cloud-init</h3>
<p>VM বুট হওয়ার সময় স্বয়ংক্রিয়ভাবে সফটওয়্যার ইনস্টল বা কনফিগারেশন চালানোর জন্য দুইটা প্রধান পদ্ধতি আছে — Windows-এ <span class="kw">Custom Script Extension</span>, আর Linux-এ প্রায়ই <span class="kw">cloud-init</span> ব্যবহার করা হয়।</p>
<pre>
#cloud-config
package_upgrade: true
packages:
  - nginx
runcmd:
  - systemctl enable nginx
  - systemctl start nginx
<span class="c"># VM প্রথমবার বুট হওয়ার সময় স্বয়ংক্রিয়ভাবে nginx ইনস্টল ও চালু হয়ে যাবে</span>
</pre>
<div class="callout best"><span class="tag">Best practice — Golden Image + Minimal Bootstrap</span> প্রতিবার বুটে ভারী ইনস্টলেশন চালানোর বদলে, ভালো প্র্যাকটিস হলো আগে থেকেই সব সফটওয়্যার ইনস্টল করা একটা কাস্টম VM Image (Azure Image Builder দিয়ে তৈরি) ব্যবহার করা, আর cloud-init/Custom Script Extension শুধু runtime configuration (environment variable, secret fetch) এর জন্য ব্যবহার করা। এতে বুট টাইম দ্রুত হয় ও নির্ভরযোগ্যতা বাড়ে।</div>

<h3>VM Scale Sets — সংক্ষিপ্ত মেনশন</h3>
<p>একাধিক identical VM instance স্বয়ংক্রিয়ভাবে scale up/down করার জন্য Azure-এর সমাধান হলো <span class="kw">Virtual Machine Scale Sets (VMSS)</span> — এর বিস্তারিত আলোচনা হবে ৯ নম্বর অধ্যায়ে।</p>

<h3>Pricing মডেল</h3>

<h3>Boot Diagnostics</h3>
<p><span class="kw">Boot Diagnostics</span> চালু থাকলে VM বুট প্রক্রিয়ার স্ক্রিনশট ও সিরিয়াল লগ Azure Storage-এ সংরক্ষিত হয় — VM বুট না হলে বা RDP/SSH-এ কানেক্ট করা না গেলে এই লগ দেখেই সমস্যা নির্ণয় করা যায়, যেহেতু তখন VM-এর ভেতরে ঢোকার আর কোনো উপায় থাকে না।</p>

<h2 class="title">৪. Virtual Network ও Networking</h2>
<p class="lead">Azure-এর যেকোনো সিরিয়াস ডিপ্লয়মেন্টের নেটওয়ার্কিং লেয়ার সঠিকভাবে বোঝা মানেই অর্ধেক সিকিউরিটি ও পারফরম্যান্স সমস্যা এড়ানো।</p>

<h3>VNet, Subnet, CIDR</h3>
<p><span class="kw">Virtual Network (VNet)</span> হলো Azure-এর ভেতরে আপনার নিজের আইসোলেটেড, প্রাইভেট নেটওয়ার্ক স্পেস, যা একটা CIDR ব্লক (যেমন <code>10.0.0.0/16</code>) দিয়ে সংজ্ঞায়িত। এই VNet-কে ছোট ছোট <span class="kw">Subnet</span>-এ ভাগ করা হয় (যেমন <code>10.0.1.0/24</code>) — সাধারণত লেয়ার অনুযায়ী (web, app, data)। CIDR concept সার্বজনীন এবং AWS/অন্য যেকোনো নেটওয়ার্কিং-এর সাথে একই, তাই এখানে বিস্তারিত না বলে সরাসরি Azure-নির্দিষ্ট ফিচারে যাচ্ছি।</p>

<h3>Network Security Group (NSG) — Allow এবং Deny দুটোই</h3>
<p>NSG হলো subnet বা individual Network Interface (NIC)-এর স্তরে বসানো একটা virtual firewall। এটা <span class="kw">stateful</span> — মানে ইনবাউন্ড rule দিয়ে কোনো কানেকশন অনুমোদিত হলে তার রিটার্ন ট্রাফিক স্বয়ংক্রিয়ভাবে অনুমোদিত হয়ে যায়, আলাদা আউটবাউন্ড rule লিখতে হয় না। কিন্তু NSG-এর একটা গুরুত্বপূর্ণ বৈশিষ্ট্য হলো, এটা <b>Allow ও Deny — দুই ধরনের rule-ই সমর্থন করে</b>, এবং প্রতিটা rule-এর একটা <span class="kw">priority number</span> থাকে (১০০ থেকে ৪০৯৬) — সবচেয়ে কম সংখ্যার rule আগে evaluate হয় এবং জিতে যায়।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>AWS Security Group</th><th>AWS NACL</th><th>Azure NSG</th></tr>
<tr><td>Stateful?</td><td>হ্যাঁ</td><td>না (stateless)</td><td>হ্যাঁ</td></tr>
<tr><td>Allow rule</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>হ্যাঁ</td></tr>
<tr><td>Deny rule</td><td>না (সমর্থন করে না)</td><td>হ্যাঁ</td><td>হ্যাঁ</td></tr>
<tr><td>প্রয়োগের স্তর</td><td>শুধু instance/NIC</td><td>শুধু subnet</td><td>subnet এবং NIC — দুই স্তরেই</td></tr>
</table>
<div class="callout behind"><span class="tag">NSG আসলে SG + NACL-এর একটা hybrid</span> AWS-এ Security Group (stateful, allow-only, instance-level) ও NACL (stateless, allow+deny, subnet-level) দুইটা আলাদা টুল হিসেবে কাজ করে বলে আপনাকে দুইটা ভিন্ন মানসিক মডেল রাখতে হয়। Azure NSG এই দুইটার বৈশিষ্ট্য একসাথে নিয়ে একটাই টুলে একত্র করেছে — stateful থেকেছে (NACL-এর মতো stateless না), কিন্তু Deny rule-ও যোগ করেছে (traditional SG-তে যা ছিল না), এবং একইসাথে subnet ও NIC দুই স্তরেই প্রয়োগ করার সুবিধা দিয়েছে। এই কারণে Azure-এ আলাদা "NACL"-সদৃশ কিছু নেই — NSG একাই দুটোর কাজ করে।</div>
<div class="callout why"><span class="tag">কেন Priority Number-এর ক্রম গুরুত্বপূর্ণ</span> একই NSG-তে যদি priority ১০০-তে একটা Allow rule এবং priority ২০০-তে একটা Deny rule একই ট্রাফিকের জন্য প্রযোজ্য হয়, priority ১০০-এর Allow rule আগে evaluate হয়ে জিতে যাবে — Deny rule কখনো evaluate হবে না। এই কারণে rule লেখার সময় priority number নিয়ে সতর্ক থাকা জরুরি, বিশেষ করে যখন একটা broad Deny rule দিয়ে বাকি সব ট্রাফিক ব্লক করে রাখতে চান কিন্তু নির্দিষ্ট কিছু ব্যতিক্রম Allow করতে চান — ব্যতিক্রম rule-গুলোকে অবশ্যই ছোট (আগে evaluate হওয়া) priority number দিতে হবে।</div>

<h3>Application Security Group (ASG)</h3>
<p>বড় ইনফ্রাস্ট্রাকচারে NSG rule IP address দিয়ে লিখলে (যেমন "10.0.1.5 থেকে 10.0.2.10-এ পোর্ট 443 allow") সার্ভার যোগ/বাদ হওয়ার সাথে সাথে rule আপডেট করতে হয়, যা রক্ষণাবেক্ষণ দুঃসহ করে তোলে। <span class="kw">Application Security Group (ASG)</span> এই সমস্যা সমাধান করে — VM-এর NIC-কে একটা লজিক্যাল গ্রুপে (যেমন <code>WebServers</code>, <code>DbServers</code>) যুক্ত করা যায়, এবং NSG rule IP-এর বদলে সরাসরি এই গ্রুপের নাম রেফারেন্স করে লেখা যায় ("WebServers থেকে DbServers-এ পোর্ট 1433 allow")। নতুন VM যোগ হলে শুধু তাকে সঠিক ASG-তে যুক্ত করলেই হয়, NSG rule পরিবর্তনের দরকার হয় না।</p>

<h3>Public IP vs Private IP</h3>
<p>Azure-এ প্রতিটা resource-এর একটা <span class="kw">Private IP</span> থাকতে পারে VNet-এর ভেতরের যোগাযোগের জন্য, আর ঐচ্ছিকভাবে একটা <span class="kw">Public IP</span> ইন্টারনেট থেকে সরাসরি অ্যাক্সেসের জন্য। Production ডিজাইনে সাধারণত যতটা সম্ভব কম resource-এ সরাসরি public IP রাখার নীতি অনুসরণ করা হয় — সামনে Load Balancer/Application Gateway/Firewall বসিয়ে একক entry point তৈরি করা হয়।</p>

<h3>Route Table / User Defined Route (UDR)</h3>
<p>প্রতিটা subnet-এ একটা <span class="kw">System Route</span> ডিফল্টভাবে থাকে (যেমন VNet-এর ভেতরে সরাসরি রাউটিং, ইন্টারনেটে সরাসরি রাউটিং)। কিন্তু অনেক সময় ডিফল্ট রাউটিং যথেষ্ট না — যেমন আপনি চান সব আউটবাউন্ড ট্রাফিক প্রথমে একটা কেন্দ্রীয় <span class="kw">Network Virtual Appliance (NVA)</span> (একটা firewall বা inspection ডিভাইস) দিয়ে পাস করুক, তারপর ইন্টারনেটে যাক। এই জন্য <span class="kw">User Defined Route (UDR)</span> দিয়ে কাস্টম রাউট সংজ্ঞায়িত করা হয়, যা system route-কে override করে।</p>
<div class="diagram"><pre>
                     ┌────────────────┐
   Spoke VNet A ────►│                │
   (App Tier)        │   Hub VNet     │────► Internet
                      │  (NVA/Firewall)│
   Spoke VNet B ────►│                │
   (Data Tier)        └────────────────┘

   UDR প্রতিটা spoke subnet-এ বসানো — সব বহির্গামী ট্রাফিক
   বাধ্যতামূলকভাবে Hub-এর NVA দিয়ে যেতে হবে, সরাসরি ইন্টারনেটে না
</pre></div>
<p>এই প্যাটার্নই <span class="kw">hub-spoke architecture</span>-এর ভিত্তি — কেন্দ্রীয় hub VNet-এ শেয়ার্ড সার্ভিস (firewall, VPN Gateway) রেখে একাধিক spoke VNet তার সাথে peer করা।</p>

<h3>NAT Gateway ও VNet Peering</h3>
<p><span class="kw">NAT Gateway</span> একটা subnet-এর সব outbound ট্রাফিকের জন্য একটা স্থিতিশীল, predictable public IP দেয় — যাতে বাইরের সার্ভিস আপনার ট্রাফিক allowlist করতে পারে নির্দিষ্ট IP দিয়ে, VM-লেভেলে আলাদা public IP ছাড়াই। <span class="kw">VNet Peering</span> দুইটা VNet-কে (এমনকি ভিন্ন region-এও) সরাসরি সংযুক্ত করে, যাতে তাদের মধ্যে ট্রাফিক Azure-এর ব্যাকবোন নেটওয়ার্ক দিয়ে প্রবাহিত হয়, পাবলিক ইন্টারনেট দিয়ে না — কম ল্যাটেন্সি, বেশি নিরাপত্তা।</p>

<h3>Azure Firewall vs NSG</h3>
<p>NSG একটা basic, stateless-rule-সদৃশ packet filter (IP/port/protocol ভিত্তিক), কিন্তু এটা কোনো centralized logging, threat intelligence, বা application-layer (FQDN/URL-ভিত্তিক) filtering দেয় না। <span class="kw">Azure Firewall</span> একটা fully-managed, stateful firewall-as-a-service যা এই ফাঁক পূরণ করে — এটা একটা কেন্দ্রীয় জায়গা থেকে সব VNet-এর জন্য পলিসি প্রয়োগ করতে পারে, Microsoft-এর নিজস্ব threat intelligence feed দিয়ে পরিচিত ম্যালিশাস IP ব্লক করতে পারে, এবং FQDN-ভিত্তিক নিয়ম লিখতে দেয় (যেমন "শুধু <code>*.windowsupdate.com</code>-এ আউটবাউন্ড অনুমোদিত")।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>NSG</th><th>Azure Firewall</th></tr>
<tr><td>স্তর</td><td>Subnet/NIC — distributed</td><td>Hub-এ কেন্দ্রীভূত, সাধারণত VNet/region-ওয়াইড</td></tr>
<tr><td>Filtering</td><td>IP, Port, Protocol</td><td>IP/Port + FQDN + Application-layer</td></tr>
<tr><td>Threat Intelligence</td><td>নেই</td><td>Microsoft-এর threat feed দিয়ে স্বয়ংক্রিয় ব্লক</td></tr>
<tr><td>Logging</td><td>Flow Log (আলাদা করে চালু করতে হয়)</td><td>বিল্ট-ইন কেন্দ্রীয় লগিং ও রিপোর্টিং</td></tr>
<tr><td>খরচ</td><td>ফ্রি</td><td>ঘণ্টাভিত্তিক + ডেটা প্রসেসিং চার্জ</td></tr>
</table>

<h3>VPN Gateway vs ExpressRoute</h3>
<p>on-premises ডেটা সেন্টারকে Azure VNet-এর সাথে যুক্ত করার দুইটা প্রধান পথ আছে। <span class="kw">VPN Gateway</span> পাবলিক ইন্টারনেটের উপর দিয়ে একটা IPsec-এনক্রিপ্টেড টানেল তৈরি করে — দ্রুত সেটআপ করা যায়, তুলনামূলক সস্তা, কিন্তু ল্যাটেন্সি ও bandwidth পাবলিক ইন্টারনেটের উপর নির্ভরশীল। <span class="kw">ExpressRoute</span> একটা dedicated, প্রাইভেট কানেকশন — কোনো পাবলিক ইন্টারনেট ব্যবহার হয় না, তাই অনেক বেশি নির্ভরযোগ্য ব্যান্ডউইথ ও কম, predictable ল্যাটেন্সি পাওয়া যায়, কিন্তু সেটআপ করতে সময় বেশি লাগে (ISP পার্টনারের মাধ্যমে) এবং খরচও বেশি।</p>
<p>এটা ঠিক AWS-এর <b>Site-to-Site VPN</b> (ইন্টারনেট-ভিত্তিক, দ্রুত সেটআপ) বনাম <b>Direct Connect</b> (dedicated প্রাইভেট লিংক)-এর সমতুল্য ধারণা — নাম ভিন্ন, ট্রেড-অফ একই।</p>

<h3>Private Endpoint vs Service Endpoint</h3>
<p>দুইটাই একটা সাধারণ সমস্যা সমাধানের চেষ্টা করে — PaaS resource-কে (যেমন Storage Account, Azure SQL Database) VNet-এর ভেতরের ট্রাফিক দিয়ে অ্যাক্সেস করা, ইন্টারনেট দিয়ে না — কিন্তু দুইটার পদ্ধতি ভিন্ন এবং নিরাপত্তার মাত্রাও ভিন্ন।</p>
<div class="diagram"><pre>
Service Endpoint:
  VNet Subnet ──(অপ্টিমাইজড রুট, কিন্তু PaaS resource এখনো public IP-তে)──► Storage Account (public IP)

Private Endpoint:
  VNet Subnet ──► [Private IP: 10.0.1.5] ──(VNet-এর ভেতরেই)──► Storage Account
                   (এটা এখন VNet-এর একটা সদস্য, সম্পূর্ণ প্রাইভেট)
</pre></div>
<p><span class="kw">Service Endpoint</span> শুধু রাউটিং অপ্টিমাইজ করে (Azure ব্যাকবোন দিয়ে যায়, ইন্টারনেট দিয়ে না) এবং subnet-ভিত্তিক অ্যাক্সেস নিয়ন্ত্রণ যোগ করে, কিন্তু টার্গেট PaaS resource-এর নিজস্ব public IP এখনো বজায় থাকে। <span class="kw">Private Endpoint</span> সম্পূর্ণ ভিন্ন — এটা টার্গেট resource-এর জন্য আপনার VNet-এর ভেতরে একটা প্রকৃত প্রাইভেট IP তৈরি করে দেয়, যাতে সেই resource কার্যত VNet-এরই একটা সদস্যের মতো আচরণ করে, এবং প্রায়ই public endpoint সম্পূর্ণভাবে বন্ধ করে দেওয়া যায়।</p>
<div class="callout why"><span class="tag">কেন Private Endpoint বেশি নিরাপদ</span> Service Endpoint ব্যবহার করলেও টার্গেট resource-এর public IP এখনো ইন্টারনেট থেকে (যদি firewall rule allow করে) পৌঁছানো সম্ভব — নিরাপত্তা নির্ভর করে সঠিক firewall rule বজায় রাখার উপর। Private Endpoint-এ resource-এর কোনো public endpoint নাও থাকতে পারে, ফলে DNS exfiltration বা misconfigured firewall rule-এর কারণে ডেটা leak হওয়ার ঝুঁকি অনেক কমে যায় — আক্রমণের পৃষ্ঠতলই কাঠামোগতভাবে ছোট হয়ে যায়, শুধু নিয়ম-নির্ভর না থেকে।</div>
<div class="callout best"><span class="tag">Best practice — Production-এ সবসময় Private Endpoint</span> নতুন প্রোডাকশন আর্কিটেকচারে যেখানেই সম্ভব Private Endpoint ব্যবহার করা উচিত এবং সেই সাথে Storage/SQL-এর "Public network access" সম্পূর্ণ বন্ধ (Disabled) করে দেওয়া উচিত। Service Endpoint এখনো ব্যবহৃত হয় legacy সেটআপে বা যেখানে খরচ/জটিলতা কম রাখার প্রয়োজন, কিন্তু নতুন ডিজাইনে এটা দ্বিতীয় পছন্দ।</div>

<h3>NSG Flow Logs</h3>
<p><span class="kw">NSG Flow Logs</span> প্রতিটা NSG rule-এর মাধ্যমে যাওয়া IP ট্রাফিকের মেটাডেটা (source/destination IP, port, protocol, allow/deny সিদ্ধান্ত, বাইট কাউন্ট) ক্যাপচার করে JSON ফরম্যাটে Storage Account-এ সংরক্ষণ করে — এটা AWS-এর VPC Flow Logs-এর সমতুল্য ধারণা। ট্রাবলশুটিং ("কেন এই কানেকশন ব্লক হচ্ছে") এবং সিকিউরিটি অ্যানালাইসিস ("কোন IP থেকে অস্বাভাবিক ট্রাফিক আসছে") উভয়ের জন্যই এটা অপরিহার্য।</p>
<div class="callout behind"><span class="tag">কেন এটা payload ক্যাপচার করে না</span> Flow Log ইচ্ছাকৃতভাবে শুধু মেটাডেটা রাখে, প্যাকেটের ভেতরের প্রকৃত ডেটা (payload) না — কারণ payload ক্যাপচার করলে বিশাল স্টোরেজ খরচ হতো এবং সংবেদনশীল ডেটা (যেমন পাসওয়ার্ড, ব্যক্তিগত তথ্য) অনিচ্ছাকৃতভাবে সংরক্ষিত হয়ে একটা নতুন কমপ্লায়েন্স ও নিরাপত্তা ঝুঁকি তৈরি করত। মেটাডেটা-ভিত্তিক লগিং ট্রাফিক প্যাটার্ন বিশ্লেষণের জন্য যথেষ্ট এবং সেই সাথে হালকা, স্কেলযোগ্য থাকে।</div>

<h3>Network Watcher — নেটওয়ার্ক ডায়াগনস্টিকসের ছাতা</h3>
<p>NSG Flow Logs আসলে <span class="kw">Network Watcher</span> নামের একটা বড় ডায়াগনস্টিক প্ল্যাটফর্মের একটা ফিচার মাত্র — প্রতিটা region-এ এটা স্বয়ংক্রিয়ভাবে সক্রিয় থাকে এবং নেটওয়ার্ক-সম্পর্কিত সমস্যা ডিবাগ করার একগুচ্ছ টুল দেয়।</p>
<table>
<tr><th>টুল</th><th>কী করে</th></tr>
<tr><td>IP Flow Verify</td><td>একটা নির্দিষ্ট source/destination/port-এর ট্রাফিক allow না deny হচ্ছে তা তাৎক্ষণিক পরীক্ষা করে বলে দেয়, ঠিক কোন NSG rule দায়ী তা-ও দেখায়</td></tr>
<tr><td>Connection Troubleshoot</td><td>দুইটা resource-এর মধ্যে end-to-end কানেক্টিভিটি টেস্ট করে, ঠিক কোথায় (NSG/route/DNS) সমস্যা হচ্ছে তা চিহ্নিত করে</td></tr>
<tr><td>Packet Capture</td><td>একটা VM-এ নির্দিষ্ট সময়ের জন্য দূর থেকে packet capture চালু করে, VM-এ সরাসরি tcpdump ইনস্টল করার দরকার হয় না</td></tr>
<tr><td>NSG Flow Logs</td><td>উপরে আলোচিত IP ট্রাফিক মেটাডেটা লগিং</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এটা আলাদা করে জানা দরকার</span>
নতুনরা প্রায়ই "কেন আমার VM-এ কানেক্ট করা যাচ্ছে না" এই প্রশ্নের উত্তর খুঁজতে ম্যানুয়ালি প্রতিটা NSG rule, route table এন্ট্রি হাতে-কলমে চেক করেন — যেখানে IP Flow Verify বা Connection Troubleshoot সরাসরি একটা নির্দিষ্ট উত্তর দিয়ে দেয় ("port 443-এ blocked, কারণ NSG rule priority 200")। Network Watcher-এর টুলগুলো জানা থাকলে নেটওয়ার্ক ডিবাগিং-এর সময় বহুলাংশে কমে যায়, ম্যানুয়াল অনুসন্ধানের বদলে।</div>

<h2 class="title">৫. Blob Storage</h2>
<p class="lead">Azure-এ যেকোনো unstructured data — ছবি, ভিডিও, লগ ফাইল, ব্যাকআপ, VM disk — রাখার মূল সার্ভিস হলো Blob Storage। কিন্তু এখানে ঢোকার আগে Azure-এর storage hierarchy বুঝে নেওয়া জরুরি, কারণ এটা S3-এর চেয়ে গঠনগতভাবে আলাদা।</p>

<h3>Storage Account — সবকিছুর মূল পাত্র</h3>
<p>AWS-এ S3-তে সরাসরি একটা <code>bucket</code> তৈরি করলেই কাজ শুরু হয়ে যায় — bucket নিজেই top-level entity। Azure-এ এটা তিন স্তরে ভাগ করা: প্রথমে একটা <span class="kw">Storage Account</span> তৈরি করতে হয়, যেটার নাম গ্লোবালি ইউনিক হতে হবে (কারণ এটাই DNS endpoint-এর অংশ হয়ে যায়, যেমন <code>mystorageacct.blob.core.windows.net</code>), এবং এটা একটা নির্দিষ্ট region-এ বসে। এই Storage Account-এর ভেতরে একাধিক <span class="kw">Container</span> তৈরি হয় (S3-এর bucket-এর সমতুল্য), আর প্রতিটা Container-এর ভেতরে থাকে আসল <span class="kw">Blob</span> ফাইলগুলো।</p>

<div class="diagram"><pre>
Storage Account (mystorageacct)          &lt;- globally unique নাম, নির্দিষ্ট region
   │
   ├── Container: images
   │      ├── Blob: profile1.jpg
   │      └── Blob: logo.png
   │
   ├── Container: logs
   │      └── Blob: app-2026-07.log   (Append Blob)
   │
   └── Container: vm-disks
          └── Blob: osdisk.vhd        (Page Blob)
</pre></div>

<div class="callout why"><span class="tag">কেন — এক্সট্রা স্তর কেন দরকার</span> Storage Account শুধু একটা namespace না — এটাই সেই ইউনিট যেখানে redundancy option (LRS/GRS ইত্যাদি), access tier default, encryption key, network rule (firewall/VNet) এবং performance tier (Standard/Premium) সেট করা হয়। একই account-এর নিচে থাকা সব container সেই সেটিংস শেয়ার করে, তাই একটা অ্যাপ্লিকেশনের জন্য একাধিক লজিক্যাল গ্রুপিং দরকার হলে সাধারণত একাধিক Storage Account ব্যবহার করা হয়, শুধু একাধিক container না।</div>

<h3>তিন ধরনের Blob — S3-তে যা নেই</h3>
<p>S3-তে সব অবজেক্টই সমান — শুধু একটা immutable byte stream, পুরোটা replace করা ছাড়া আপডেট করার উপায় নেই। Azure Blob Storage-এ তিনটা আলাদা blob type আছে, প্রতিটার নিজস্ব write pattern:</p>

<table>
<tr><th>Blob Type</th><th>Write আচরণ</th><th>Use Case</th></tr>
<tr><td>Block Blob</td><td>ফাইল ছোট ছোট ব্লকে ভাগ হয়ে আপলোড হয়, তারপর commit হয়ে একটা ফাইল হিসেবে দাঁড়ায়। আংশিক আপডেটে পুরো ব্লক-লিস্ট আবার commit করতে হয়।</td><td>সাধারণ ফাইল — ছবি, ভিডিও, ডকুমেন্ট, ব্যাকআপ। ৯৯% ব্যবহারের ক্ষেত্র এটাই।</td></tr>
<tr><td>Append Blob</td><td>শুধু ফাইলের <b>শেষে</b> ব্লক যোগ করা যায় (append-only), মাঝের কোনো অংশ পরিবর্তন বা ওভাররাইট করা যায় না।</td><td>Log file — একাধিক সার্ভার instance একই লগ ফাইলে concurrent-ভাবে নতুন লাইন যোগ করতে পারে, race condition ছাড়াই।</td></tr>
<tr><td>Page Blob</td><td>৫১২-বাইট "page" এককে random read/write সম্ভব — মাঝখানের যেকোনো অংশ সরাসরি overwrite করা যায়, একদম disk sector-এর মতো।</td><td>VM disk-এর ভিত্তি — একটা <code>.vhd</code> ফাইল আসলে একটা Page Blob। ৮ TiB পর্যন্ত size সাপোর্ট করে।</td></tr>
</table>

<div class="callout behind"><span class="tag">গভীরে — Page Blob-ই কেন VM disk</span> VM-এর disk-এ OS যখন একটা ফাইলের মাঝখানের কোনো ব্লক পরিবর্তন করে, পুরো disk image আবার আপলোড করা অসম্ভব — GB-এর পর GB ডেটা। Page Blob এই সমস্যাটাই সমাধান করে random-access sparse write সাপোর্ট করে, তাই Azure Managed Disk-এর ভেতরে আসলে একটা Page Blob-ই কাজ করছে।</div>

<h3>Access Tier — খরচ বনাম access-frequency</h3>
<p>একই Block Blob-এর জন্য চারটা tier বেছে নেওয়া যায়, storage cost ও retrieval cost-এর মধ্যে ট্রেড-অফ করে:</p>

<table>
<tr><th>Tier</th><th>Storage Cost</th><th>Access/Retrieval Cost</th><th>Early-deletion Penalty</th><th>উপযুক্ত</th></tr>
<tr><td>Hot</td><td>বেশি</td><td>সবচেয়ে কম</td><td>নেই</td><td>ঘন ঘন অ্যাক্সেস হওয়া ডেটা</td></tr>
<tr><td>Cool</td><td>কম</td><td>বেশি</td><td>৩০ দিনের আগে delete/move করলে penalty</td><td>মাসে কয়েকবার অ্যাক্সেস হওয়া ডেটা</td></tr>
<tr><td>Cold</td><td>আরও কম</td><td>আরও বেশি</td><td>৯০ দিন</td><td>কালেভদ্রে অ্যাক্সেস হওয়া ডেটা</td></tr>
<tr><td>Archive</td><td>সবচেয়ে কম</td><td>সবচেয়ে বেশি + rehydration লাগে (ঘণ্টার হিসেবে)</td><td>১৮০ দিন</td><td>Compliance archive, দীর্ঘমেয়াদি ব্যাকআপ</td></tr>
</table>

<div class="callout mistake"><span class="tag">Common mistake — Archive সরাসরি read করা যায় না</span> Archive tier-এর একটা blob সরাসরি download করা যায় না — প্রথমে "rehydrate" (Hot/Cool-এ ফিরিয়ে আনা) করতে হয়, যেটাতে standard priority-তে সাধারণত কয়েক ঘণ্টা লাগে। জরুরি রিপোর্টের জন্য Archive থেকে তাৎক্ষণিক ডেটা আশা করা একটা খুবই সাধারণ ভুল।</div>

<h3>Lifecycle Management — স্বয়ংক্রিয় Tiering</h3>
<p>ম্যানুয়ালি tier বদলানোর বদলে একটা policy লিখে দেওয়া যায় যা নিয়মিত চলে:</p>

<pre>{
  <span class="c">// ৩০ দিন না ছুঁলে Cool-এ, ৯০ দিনে Archive-এ, ৩৬৫ দিনে delete</span>
  "rules": [
    {
      "name": "archiveOldLogs",
      "enabled": true,
      "type": "Lifecycle",
      "definition": {
        "filters": { "blobTypes": ["blockBlob"], "prefixMatch": ["logs/"] },
        "actions": {
          "baseBlob": {
            "tierToCool":    { "daysAfterLastAccessTimeGreaterThan": 30 },
            "tierToArchive": { "daysAfterLastAccessTimeGreaterThan": 90 },
            "delete":        { "daysAfterLastAccessTimeGreaterThan": 365 }
          }
        }
      }
    }
  ]
}</pre>

<h3>Redundancy — কেন এত অপশন</h3>
<p>S3 নিজে থেকেই একাধিক Availability Zone-এ ডেটা রাখে — ব্যবহারকারীর কোনো পছন্দ নেই। Azure এখানে সচেতনভাবে ব্যবহারকারীর হাতে নিয়ন্ত্রণ ছেড়ে দিয়েছে, যাতে durability ও cost-এর মধ্যে নিজের ট্রেড-অফ বেছে নেওয়া যায়:</p>

<table>
<tr><th>Option</th><th>পুরো নাম</th><th>কীভাবে কাজ করে</th><th>Secondary সরাসরি read?</th></tr>
<tr><td>LRS</td><td>Locally Redundant Storage</td><td>একই datacenter-এর মধ্যে ৩টা কপি রাখে</td><td>প্রযোজ্য না</td></tr>
<tr><td>ZRS</td><td>Zone Redundant Storage</td><td>একই region-এর ভিন্ন ভিন্ন Availability Zone-জুড়ে ৩টা কপি</td><td>প্রযোজ্য না (এক region-এই)</td></tr>
<tr><td>GRS</td><td>Geo Redundant Storage</td><td>LRS + secondary (দূরবর্তী) region-এ asynchronous কপি</td><td>না — ফেইলওভার না হলে পড়া যায় না</td></tr>
<tr><td>RA-GRS</td><td>Read-Access GRS</td><td>GRS-এর মতোই, কিন্তু secondary region থেকে read-only অ্যাক্সেস দেওয়া হয়</td><td>হ্যাঁ, সবসময়</td></tr>
<tr><td>GZRS</td><td>Geo-Zone Redundant Storage</td><td>ZRS (primary region-এ multi-zone) + secondary region-এ কপি</td><td>ঐচ্ছিকভাবে (RA-GZRS হলে হ্যাঁ)</td></tr>
</table>

<div class="callout why"><span class="tag">কেন — GRS-এ secondary সরাসরি পড়া যায় না</span> GRS-এর replication asynchronous, তাই secondary region সবসময় সামান্য পিছিয়ে থাকতে পারে (Recovery Point Objective কয়েক মিনিট)। ডিফল্টভাবে সেটা read-locked রাখা হয় যাতে অ্যাপ্লিকেশন ভুলবশত stale ডেটা না পড়ে ফেলে; RA-GRS explicitly এই ঝুঁকিটা মেনে নিয়ে read অ্যাক্সেস খুলে দেয়, তাই সেটা একটা সচেতন সিদ্ধান্ত হওয়া উচিত, ডিফল্ট নয়।</div>

<h3>SAS Token — নিয়ন্ত্রিত সাময়িক অ্যাক্সেস</h3>
<p>S3-এর presigned URL-এর ধারণার সাথে সাদৃশ্য থাকলেও Azure-এর <span class="kw">SAS (Shared Access Signature)</span> Token অনেক বেশি গ্রানুলার। তিন স্তরের SAS আছে:</p>
<ul>
<li><b>Account SAS</b> — পুরো Storage Account-এর একাধিক service (Blob, Queue, Table, File) জুড়ে permission দেয়, সবচেয়ে বেশি scope।</li>
<li><b>Service SAS</b> — একটা নির্দিষ্ট container/blob-এর জন্য, নির্দিষ্ট permission (read/write/delete/list) সহ।</li>
<li><b>User Delegation SAS</b> — Azure AD identity দিয়ে সাইন করা হয় (storage account key দিয়ে নয়), তাই key leak হওয়ার ঝুঁকি নেই — সবচেয়ে নিরাপদ ও recommended।</li>
</ul>
<p>প্রতিটা SAS-এ expiry time, allowed IP range, এবং allowed protocol (শুধু HTTPS) সেট করা যায়।</p>

<div class="callout best"><span class="tag">Best practice — User Delegation SAS ব্যবহার করুন</span> Account/Service SAS storage account key দিয়ে সাইন হয় — সেই key leak হলে key revoke না করা পর্যন্ত সব পুরনো SAS token বাতিল করার উপায় নেই। User Delegation SAS Azure AD token-ভিত্তিক হওয়ায় নির্দিষ্ট সময়ে expire হয় ও granular RBAC-এর সাথে যুক্ত থাকে।</div>

<h3>Encryption ও Immutable Storage</h3>
<p>Blob Storage-এর সব ডেটা ডিফল্টভাবে rest-এ এনক্রিপ্টেড — হয় Microsoft-managed key দিয়ে, অথবা নিজের Azure Key Vault-এ রাখা Customer-managed key দিয়ে (যেটা rotate/revoke করার নিয়ন্ত্রণ পুরোপুরি নিজের হাতে থাকে)। এছাড়া <span class="kw">Blob Versioning</span> চালু করলে প্রতিটা overwrite/delete-এ আগের version রক্ষা পায়, আর <span class="kw">Immutable Storage (WORM — Write Once Read Many)</span> policy দিয়ে একটা নির্দিষ্ট সময়ের জন্য blob-কে সম্পূর্ণ delete/modify-প্রতিরোধী করে রাখা যায় — legal hold ও compliance (যেমন financial record retention) দরকার হলে এটা জরুরি।</p>

<h3>Static Website Hosting</h3>
<p>একটা Storage Account-এ <code>$web</code> নামের বিশেষ container চালু করে সরাসরি static HTML/CSS/JS হোস্ট করা যায় — কোনো VM বা App Service ছাড়াই, index document ও custom 404 page সেট করার সুবিধাসহ। ছোট প্রজেক্ট বা marketing landing page-এর জন্য এটা সবচেয়ে সস্তা হোস্টিং পদ্ধতি।</p>

<h2 class="title">৬. Managed Disks, Files ও Storage Options</h2>
<p class="lead">Blob Storage ছাড়াও Azure-এ VM-এর ডিস্ক এবং শেয়ার্ড ফাইল সিস্টেমের জন্য আলাদা storage primitive আছে — এদের পার্থক্য বোঝা architecture ডিজাইনের জন্য জরুরি।</p>

<h3>Managed Disk — কেন নামের আগে "Managed"</h3>
<p>Azure-এর শুরুর দিকে VM-এর disk আসলে নিজের একটা Storage Account-এর ভেতরে একটা Page Blob হিসেবেই রাখতে হতো — একে <b>unmanaged disk</b> বলা হতো। সমস্যা ছিল: একটা Storage Account-এর একটা IOPS/throughput সীমা আছে, আর সেই account-এর নিচে অনেকগুলো VM disk রাখলে সবাই মিলে সেই সীমা ভাগ করত (noisy neighbor সমস্যা নিজের VM-এর মধ্যেই), সাথে ব্যাকআপ/scaling-এর জন্য নিজেকেই account ম্যানেজ করতে হতো।</p>
<p><span class="kw">Managed Disk</span> চালু হওয়ার পর Azure নিজেই আন্ডারলাইং storage account (এবং তার সব ডিটেইল) পুরোপুরি আড়াল করে দেয় — ব্যবহারকারী শুধু disk size ও performance tier বেছে নেয়, বাকিটা Azure সামলায়। এখন প্রায় সব নতুন deployment-এ Managed Disk ব্যবহার হয়; unmanaged disk legacy।</p>

<table>
<tr><th>Disk Type</th><th>IOPS (আনুমানিক)</th><th>Throughput</th><th>Latency</th><th>Use Case</th></tr>
<tr><td>Standard HDD</td><td>কম (~৫০০)</td><td>কম</td><td>বেশি (কয়েক ms)</td><td>Backup, infrequent-access, dev/test</td></tr>
<tr><td>Standard SSD</td><td>মাঝারি (~৬,০০০)</td><td>মাঝারি</td><td>মাঝারি</td><td>Web server, low-IOPS app, dev/test</td></tr>
<tr><td>Premium SSD</td><td>বেশি (~২০,০০০)</td><td>বেশি</td><td>কম (sub-ms)</td><td>Production database, latency-sensitive workload</td></tr>
<tr><td>Ultra Disk</td><td>সবচেয়ে বেশি (~১,৬০,০০০+)</td><td>সবচেয়ে বেশি, dynamically adjustable</td><td>সাব-মিলিসেকেন্ড, সবচেয়ে কম</td><td>SAP HANA, বড় transactional DB, IOPS-critical workload</td></tr>
</table>

<div class="callout why"><span class="tag">কেন Ultra Disk-এ IOPS/throughput আলাদা করে সেট করা যায়</span> অন্য টায়ারে disk size অনুযায়ী IOPS বাঁধা থাকে (বড় disk = বেশি IOPS)। Ultra Disk এই দুটোকে decouple করে — চাইলে ছোট disk-এও অনেক বেশি IOPS বরাদ্দ করা যায়, এবং downtime ছাড়াই on-the-fly পরিবর্তন করা যায়। এটা এমন workload-এর জন্য দরকার যেখানে storage capacity কম লাগে কিন্তু IOPS demand অনেক বেশি (উদাহরণ: in-memory DB-এর log disk)।</div>

<h3>Incremental Snapshot</h3>
<p>একটা Managed Disk-এর <span class="kw">Snapshot</span> নিলে প্রথমবার পুরো ডেটার একটা কপি তৈরি হয়। কিন্তু তার পরের প্রতিটা snapshot <b>incremental</b> — শুধু আগের snapshot-এর পর যে ব্লকগুলো পরিবর্তিত হয়েছে সেগুলোই সংরক্ষণ করা হয়। এতে দ্বিতীয় snapshot থেকে প্রতিটা snapshot অনেক দ্রুত সম্পন্ন হয় এবং storage cost অনেক কম হয়, যদিও প্রতিটা snapshot restore করার সময় একটা সম্পূর্ণ, স্বাধীন disk হিসেবেই ব্যবহারযোগ্য থাকে (Azure ভেতরে ভেতরে chain ম্যানেজ করে)।</p>

<div class="callout best"><span class="tag">Best practice — নিয়মিত incremental snapshot + Azure Backup</span> প্রোডাকশন disk-এর জন্য ম্যানুয়াল snapshot-এর বদলে Azure Backup vault ব্যবহার করে schedule অনুযায়ী incremental snapshot নেওয়া উচিত — এতে retention policy, application-consistent backup, এবং cross-region restore স্বয়ংক্রিয়ভাবে ম্যানেজড হয়।</div>

<h3>Azure Files — শেয়ার্ড ফাইল সিস্টেম</h3>
<p>একটা Managed Disk একই সময়ে শুধু একটা VM-এ attach করা যায় (block-level device) — এটা fundamentally একাধিক client concurrently mount করার জন্য ডিজাইন করা না। যখন একাধিক VM বা App Service instance-এর একই ফাইল সিস্টেমে concurrent read/write দরকার হয়, তখন দরকার <span class="kw">Azure Files</span> — একটা fully managed file share যা <b>SMB</b> এবং <b>NFS</b> প্রোটোকল সাপোর্ট করে এবং একাধিক ক্লায়েন্ট একই সাথে mount করতে পারে (ঠিক AWS-এর EFS-এর মতো যুক্তি — network file system বনাম block device)।</p>

                Azure Files Share
             (একই ফাইল উভয়ে দেখে/লেখে)
</pre></div>

<h3>Azure NetApp Files</h3>
<p>যেসব enterprise workload-এ অতি-উচ্চ IOPS ও অতি-নিম্ন latency সহ file storage দরকার (যেমন SAP, high-performance computing, বড় media rendering farm), সেখানে <span class="kw">Azure NetApp Files</span> ব্যবহার হয় — এটা NetApp-এর ডেডিকেটেড হার্ডওয়্যারের উপর চলা একটা প্রিমিয়াম, enterprise-grade managed file service, Azure Files-এর চেয়ে অনেক বেশি performance headroom দেয়, কিন্তু cost-ও বেশি।</p>

<h2 class="title">৭. Azure SQL Database</h2>
<p class="lead">রিলেশনাল ডেটাবেসের জন্য Azure একাধিক deployment মডেল দেয়, যেখানে প্রতিটা মডেল কন্ট্রোল ও ম্যানেজমেন্ট-ওভারহেডের মধ্যে ভিন্ন একটা পয়েন্টে দাঁড়িয়ে আছে।</p>

<h3>Deployment Spectrum — কন্ট্রোল বনাম ম্যানেজমেন্ট ওভারহেড</h3>

<h3>DTU বনাম vCore Purchasing Model</h3>
<p>Azure SQL Database-এ রিসোর্স কেনার দুটো ভিন্ন মডেল আছে:</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>DTU (Database Transaction Unit)</th><th>vCore</th></tr>
<tr><td>ইউনিট</td><td>Compute + Storage + IO একসাথে বান্ডল করা একটা single normalized সংখ্যা</td><td>CPU core, memory, storage, IO প্রতিটা আলাদাভাবে বেছে নেওয়া যায়</td></tr>
<tr><td>স্বচ্ছতা</td><td>কম — ঠিক কতটা CPU/memory পাচ্ছেন তা অস্পষ্ট</td><td>বেশি — সরাসরি hardware generation ও core সংখ্যা নির্দিষ্ট করা যায়</td></tr>
<tr><td>Independent scaling</td><td>না — compute বাড়াতে হলে পুরো tier-ই বদলাতে হয়</td><td>হ্যাঁ — শুধু compute বা শুধু storage আলাদাভাবে scale করা যায়</td></tr>
<tr><td>Reserved capacity/AHB discount</td><td>প্রযোজ্য না</td><td>Azure Hybrid Benefit ও Reserved Instance discount পাওয়া যায় (existing SQL license থাকলে সাশ্রয়ী)</td></tr>
<tr><td>কখন ব্যবহার</td><td>সাধারণ, ছোট, predictable workload — সহজ simple pricing</td><td>প্রোডাকশন workload, existing license থাকলে, granular control দরকার হলে</td></tr>
</table>

<div class="callout why"><span class="tag">কেন vCore-এ independent scaling সম্ভব</span> vCore মডেলে compute ও storage সম্পূর্ণ আলাদা resource হিসেবে provision হয় — storage বাড়ালে compute-এর দাম বদলায় না, আর compute tier বদলালে ডেটা সরাতে হয় না। DTU মডেলে যেহেতু তিনটা জিনিস একটা single bundled সংখ্যায় মেশানো, compute দরকার হলেও পুরো bundle-সহ tier আপগ্রেড করতে হয়, এমনকি storage দরকার না থাকলেও।</div>

<h3>Elastic Pool — একাধিক Database-এর মধ্যে রিসোর্স শেয়ারিং</h3>
<p>ধরুন একটা multi-tenant SaaS অ্যাপ্লিকেশনে প্রতিটা customer-এর জন্য আলাদা database আছে — কিন্তু প্রতিটা database-এর peak usage সময় ভিন্ন ভিন্ন (কেউ সকালে বেশি ব্যবহার করে, কেউ রাতে)। যদি প্রতিটা database আলাদাভাবে provision করা হয়, প্রতিটাকেই তার নিজের সর্বোচ্চ peak-এর জন্য প্রভিশন করতে হবে — এবং বেশিরভাগ সময় সেই ক্যাপাসিটি অব্যবহৃত পড়ে থাকবে।</p>
<p><span class="kw">Elastic Pool</span> একটা shared resource pool তৈরি করে যেখানে একাধিক database একসাথে থাকে এবং প্রয়োজন অনুযায়ী কম্পিউট নিজেদের মধ্যে ভাগ করে নেয় — একটা database-এর কম ব্যবহারের সময় সেই ক্যাপাসিটি অন্য database ব্যবহার করতে পারে।</p>

<div class="callout best"><span class="tag">Best practice — multi-tenant SaaS-এ Elastic Pool</span> প্রতিটা customer-এর জন্য আলাদা database (isolation-এর জন্য) কিন্তু সবগুলো একটা Elastic Pool-এ রাখলে per-tenant isolation ও cost efficiency দুটোই একসাথে পাওয়া যায় — প্রতিটাকে আলাদা provision করার চেয়ে এটা উল্লেখযোগ্য পরিমাণ সাশ্রয়ী হয়।</div>

<h3>Active Geo-Replication বনাম Auto-failover Group</h3>
<p><span class="kw">Active Geo-Replication</span>-এ একটা primary database-এর জন্য সর্বোচ্চ ৪টা readable secondary অন্য region-এ তৈরি করা যায়, কিন্তু failover ম্যানুয়াল ও প্রতিটা database-ভিত্তিক আলাদা করে করতে হয়। <span class="kw">Auto-failover Group</span> এর উপরে একটা লেয়ার যোগ করে — একাধিক database-এর জন্য একটা single listener endpoint (একটা DNS নাম) দেয় যা automatically সঠিক region-এ point করে, এবং region আউটেজ হলে automatic failover ঘটায় অ্যাপ্লিকেশন কোড পরিবর্তন ছাড়াই।</p>

<div class="callout behind"><span class="tag">RDS-এর যুক্তির প্রতিফলন</span> AWS RDS-এ Read Replica (ম্যানুয়াল, readable, async) বনাম Multi-AZ (automatic failover, সাধারণত readable না) — এই একই যুক্তি এখানেও প্রযোজ্য: Geo-Replication হলো readable কিন্তু ম্যানুয়াল-failover মডেল, আর Auto-failover Group হলো automatic-failover মডেল যা transparent endpoint দেয়।</div>

<h3>Zone Redundant Configuration ও Backup</h3>
<p><span class="kw">Zone Redundant Configuration</span> চালু করলে Azure SQL Database-এর replica একই region-এর ভিন্ন ভিন্ন Availability Zone-এ ছড়িয়ে থাকে, ফলে একটা পুরো datacenter আউটেজেও database available থাকে — এটা region-level নয়, zone-level protection। এছাড়া প্রতিটা Azure SQL Database-এর জন্য <span class="kw">Automated Backup</span> ডিফল্টভাবেই চালু থাকে (full + differential + transaction log backup, কনফিগারযোগ্য retention পর্যন্ত ৩৫ দিন, Long-Term Retention চালু করলে বছরের পর বছর), এবং <span class="kw">Point-in-Time Restore</span> দিয়ে retention window-এর ভেতরে যেকোনো মুহূর্তের অবস্থায় একটা নতুন database হিসেবে restore করা যায় — ভুলবশত DELETE/DROP হয়ে যাওয়া ডেটা উদ্ধারের প্রধান উপায়।</p>

<div class="callout mistake"><span class="tag">Common mistake — Point-in-Time Restore-কে "undo" ভাবা</span> Restore করলে একটা সম্পূর্ণ <b>নতুন</b> database তৈরি হয় — এটা আসল database-এর ভেতরে গিয়ে সরাসরি ডেটা ফিরিয়ে দেয় না। Restore-এর পর নতুন database থেকে প্রয়োজনীয় ডেটা কপি করে আনতে হবে, অথবা অ্যাপ্লিকেশনের connection string বদলাতে হবে — এই ধাপটা অনেকে মিস করে ফেলে।</div>
</template>

<template data-page="cosmosdb">
<h2 class="title">৮. Cosmos DB — NoSQL Database</h2>
<p class="lead">Cosmos DB Azure-এর globally-distributed, multi-model NoSQL ডেটাবেস — এবং এর সবচেয়ে গুরুত্বপূর্ণ, সবচেয়ে বেশি ভুল বোঝা যায় এমন ফিচার হলো এর পাঁচ-স্তরের consistency model।</p>

<h3>Multi-Model — একই ইঞ্জিন, একাধিক API</h3>
<p>Cosmos DB-এর ভেতরের ইঞ্জিন (ATOM-Record-Sequence ভিত্তিক) একটাই, কিন্তু সেটাকে একাধিক API-এর মাধ্যমে অ্যাক্সেস করা যায়:</p>
<table>
<tr><th>API</th><th>ডেটা মডেল</th><th>ব্যবহার</th></tr>
<tr><td>Core (SQL) API</td><td>JSON document, SQL-এর মতো query syntax</td><td>Cosmos DB-এর নেটিভ, সবচেয়ে বেশি ফিচার-সম্পন্ন API</td></tr>
<tr><td>API for MongoDB</td><td>BSON document</td><td>বিদ্যমান MongoDB ড্রাইভার/অ্যাপ্লিকেশন প্রায় কোনো কোড পরিবর্তন ছাড়াই মাইগ্রেট করা</td></tr>
<tr><td>Cassandra API</td><td>Wide-column</td><td>বিদ্যমান Cassandra অ্যাপ্লিকেশন migrate করা</td></tr>
<tr><td>Gremlin API</td><td>Graph (node/edge)</td><td>সম্পর্ক-ভিত্তিক query — সোশ্যাল নেটওয়ার্ক, recommendation engine</td></tr>
<tr><td>Table API</td><td>Key-value</td><td>Azure Table Storage থেকে migrate করে বেশি throughput/global distribution পাওয়া</td></tr>
</table>

<div class="callout why"><span class="tag">কেন multi-model migration-এর জন্য সুবিধাজনক</span> একটা টিমের যদি ইতিমধ্যে MongoDB-তে লেখা একটা অ্যাপ্লিকেশন থাকে, তারা driver connection string বদলেই Cosmos DB-এর MongoDB API-তে সুইচ করতে পারে — নিচের ইঞ্জিন Cosmos DB হলেও উপরের অ্যাপ্লিকেশন কোড প্রায় অপরিবর্তিত থাকে। এতে vendor lock-in-এর ভয় কমে এবং migration cost অনেক কমে যায়।</div>

<h3>Partition Key ডিজাইন — সংক্ষিপ্ত পুনরালোচনা</h3>
<p>DynamoDB-এর মতোই Cosmos DB-তেও প্রতিটা item একটা <span class="kw">Partition Key</span>-এর হ্যাশ অনুযায়ী নির্দিষ্ট একটা logical partition-এ রাখা হয়। একই সমস্যাগুলো এখানেও প্রযোজ্য — কম cardinality-র key (যেমন <code>status</code>, মাত্র দুই-তিনটা মান) বেছে নিলে সব ডেটা কয়েকটা partition-এ কেন্দ্রীভূত হয়ে যাবে এবং সেই <b>hot partition</b>-এর throughput সীমা ছাড়িয়ে যাওয়ার ঝুঁকি থাকবে। তাই high-cardinality, evenly-distributed key (যেমন <code>userId</code> বা <code>tenantId</code>) বেছে নেওয়া উচিত।</p>

<h3>Request Unit (RU) — একীভূত ক্যাপাসিটি মুদ্রা</h3>
<p>Cosmos DB-তে CPU, memory, IOPS — এসব আলাদা আলাদা করে প্রভিশন করতে হয় না। বরং সবকিছু একটা একক, normalized সংখ্যায় abstract করা হয়েছে যাকে বলে <span class="kw">Request Unit (RU)</span>। একটা ১ KB সাইজের item point-read (key দিয়ে সরাসরি lookup) করতে বেসলাইন হিসেবে প্রায় <b>১ RU</b> লাগে — write, query, বা বড় item-এর জন্য এর চেয়ে বেশি RU খরচ হয়।</p>

<div class="callout behind"><span class="tag">গভীরে — RU আসলে কী মাপে</span> RU হলো CPU, memory ও IOPS-এর একটা যৌগিক (composite) নরমালাইজড ইউনিট — item-এর size, indexing-এর জটিলতা, query-এর filter/sort জটিলতা সব মিলিয়ে RU খরচ নির্ধারিত হয়। এর সুবিধা হলো, ডেভেলপারকে ভাবতে হয় না ঠিক কতটা CPU বা IOPS লাগবে — শুধু জানতে হয় operation প্রতি RU খরচ কত, আর সে অনুযায়ী capacity প্ল্যান করতে হয়।</div>

<h3>Throughput Mode — Provisioned বনাম Serverless বনাম Autoscale</h3>

<tr><th>Mode</th><th>কীভাবে কাজ করে</th><th>উপযুক্ত</th></tr>
<tr><td>Standard (Manual) Provisioned</td><td>একটা নির্দিষ্ট RU/s আগে থেকে বরাদ্দ করা থাকে, স্থির খরচ</td><td>Predictable, steady traffic</td></tr>
<tr><td>Autoscale</td><td>একটা সর্বোচ্চ সীমার মধ্যে RU/s চাহিদা অনুযায়ী স্বয়ংক্রিয়ভাবে ওঠানামা করে (সাধারণত ১০%-১০০% রেঞ্জে)</td><td>Variable/spiky traffic, কিন্তু ধারনার একটা upper bound আছে</td></tr>

</table>

<h3>Consistency Level — পাঁচটা স্তর</h3>
<p>এটাই Cosmos DB-এর সবচেয়ে গুরুত্বপূর্ণ এবং সবচেয়ে বেশি পরীক্ষায়/ইন্টারভিউতে জিজ্ঞাসিত বিষয়। CAP theorem বলে consistency ও availability/latency-এর মধ্যে একটা ট্রেড-অফ আছে — কিন্তু বেশিরভাগ ডেটাবেস এটাকে শুধু একটা বাইনারি চয়েস (strong বা eventual) হিসেবে দেখায়। Cosmos DB এই ট্রেড-অফটাকে একটা <b>continuous spectrum</b> হিসেবে দেখায় এবং পাঁচটা সুনির্দিষ্ট স্তর অফার করে, যেখানে DynamoDB-তে মাত্র দুটো (Eventually Consistent ও Strongly Consistent) আছে।</p>

<div class="diagram"><pre>
কড়া/ধীর/কম-availability                       ঢিলা/দ্রুত/বেশি-availability
◄──────────────────────────────────────────────────────────────►
   Strong    Bounded Staleness    Session    Consistent Prefix    Eventual
</pre></div>

<table>
<tr><th>স্তর</th><th>গ্যারান্টি</th><th>বাস্তব উদাহরণ</th></tr>
<tr><td>Strong</td><td>সবসময় সর্বশেষ committed write-ই দেখা যাবে, কোনো stale read নেই — কিন্তু এর জন্য বেশি latency ও কম availability মেনে নিতে হয় (majority quorum-এর অপেক্ষা)</td><td>ব্যাংকিং লেনদেনের ব্যালেন্স — লেনদেনের সাথে সাথেই সঠিক ব্যালেন্স দেখাতে হবে</td></tr>
<tr><td>Bounded Staleness</td><td>read সবসময় write-এর পেছনে থাকতে পারে, কিন্তু একটা নির্দিষ্ট সময় (যেমন ৫ সেকেন্ড) বা নির্দিষ্ট সংখ্যক version-এর (যেমন ১০০০ আপডেট) বেশি পিছিয়ে যাবে না — একটা guaranteed উইন্ডো</td><td>Leaderboard/স্কোরবোর্ড — সামান্য দেরি মেনে নেওয়া যায়, কিন্তু সীমাহীন দেরি নয়</td></tr>
<tr><td>Session (ডিফল্ট)</td><td>একই client (একই session token) নিজের করা write নিজে সবসময় পড়তে পারবে — "read-your-own-writes" গ্যারান্টি। অন্য client-এর জন্য eventual-এর মতো আচরণ করতে পারে।</td><td>ব্যবহারকারী নিজের প্রোফাইল আপডেট করার পর সাথে সাথে নিজের আপডেট দেখতে চায়, কিন্তু অন্যরা একটু দেরিতে দেখলেও সমস্যা নেই — সোশ্যাল মিডিয়া পোস্ট, ই-কমার্স কার্ট</td></tr>
<tr><td>Consistent Prefix</td><td>write-এর আসল ক্রম কখনো উল্টে যাবে না (যদি A তারপর B লেখা হয়, কেউ কখনো B আগে, A পরে দেখবে না), কিন্তু কতটা দেরি হবে তার কোনো নিশ্চয়তা নেই</td><td>চ্যাট মেসেজ থ্রেড — মেসেজের ক্রম ঠিক থাকা জরুরি, কিন্তু সামান্য delay মেনে নেওয়া যায়</td></tr>
<tr><td>Eventual</td><td>সবচেয়ে ঢিলা — কোনো ক্রম বা সময়ের গ্যারান্টি নেই, কিন্তু সবচেয়ে কম latency ও সবচেয়ে বেশি availability/throughput</td><td>পোস্টের "লাইক" সংখ্যা গণনা — সামান্য দেরিতে আপডেট হলেও কোনো ব্যবসায়িক ক্ষতি নেই</td></tr>
</table>

<div class="callout why"><span class="tag">কেন DynamoDB-এর দুটোর বদলে Cosmos DB-তে পাঁচটা স্তর</span> CAP theorem-এর ট্রেড-অফ বাস্তবে একটা বাইনারি সুইচ নয় — বেশিরভাগ real-world অ্যাপ্লিকেশনের প্রয়োজন Strong ও Eventual-এর মাঝামাঝি কোথাও। Cosmos DB এই middle-ground-কে স্পষ্টভাবে সংজ্ঞায়িত তিনটা অতিরিক্ত স্তরে ভাগ করে দিয়েছে (Bounded Staleness, Session, Consistent Prefix), যাতে ডেভেলপার নিজের অ্যাপ্লিকেশনের ঠিক প্রয়োজন অনুযায়ী latency/availability এবং সঠিকতার মধ্যে নিখুঁত ব্যালেন্স বেছে নিতে পারে, বাইনারি চয়েসে আটকে না থেকে।</div>

<div class="callout mistake"><span class="tag">Common mistake — Session-কে "দুর্বল consistency" ভাবা</span> Session consistency ডিফল্ট এবং সবচেয়ে বেশি ব্যবহৃত হওয়ার একটা কারণ আছে — বেশিরভাগ ব্যবহারকারী-কেন্দ্রিক অ্যাপ্লিকেশনে "নিজের করা পরিবর্তন নিজে সাথে সাথে দেখা"-ই যথেষ্ট, এবং এটা Strong-এর তুলনায় অনেক কম latency ও বেশি throughput দেয়। একে দুর্বল মনে করে সবসময় Strong বেছে নেওয়া অনেক ক্ষেত্রে অপ্রয়োজনীয় latency ও cost যোগ করে।</div>

<h3>Global Distribution</h3>
<p>Azure Portal-এ এক ক্লিকে একটা Cosmos DB অ্যাকাউন্টকে যেকোনো সংখ্যক Azure region-এ replicate করা যায় — কোনো কাস্টম replication পাইপলাইন লেখা লাগে না। ডিফল্টভাবে একটা region-ই write গ্রহণ করে (single-region write), কিন্তু <span class="kw">Multi-region Write</span> চালু করলে একাধিক region একই সময়ে write গ্রহণ করতে পারে, প্রতিটা region-এর ব্যবহারকারীর জন্য কাছাকাছি region-এ লেখা-পড়া করে সর্বনিম্ন latency নিশ্চিত করে। কনফ্লিক্ট হলে Cosmos DB নিজস্ব conflict-resolution policy (last-writer-wins বা custom resolver) দিয়ে তা সমাধান করে।</p>

<div class="callout best"><span class="tag">Best practice — global অ্যাপ্লিকেশনে region priority ঠিক রাখা</span> Multi-region অ্যাকাউন্টে failover priority list ঠিকভাবে সাজিয়ে রাখা উচিত, যাতে একটা region আউটেজ হলে Cosmos DB পূর্বনির্ধারিত ক্রম অনুযায়ী পরবর্তী region-এ স্বয়ংক্রিয়ভাবে failover করে, এবং SDK-তে <code>ApplicationRegion</code> সেট করে ক্লায়েন্টকে সবসময় সবচেয়ে কাছের region-এ রুট করা উচিত।</div>

<h2 class="title">৯. Load Balancing ও Scale Sets</h2>
<p class="lead">একটা VM কখনোই একা "যথেষ্ট" না — ট্রাফিক বাড়লে বা কোনো instance আচমকা ক্র্যাশ করলে সিস্টেম যেন নিজে থেকেই সামলে নিতে পারে। AWS-এ এই দায়িত্ব মূলত দুই স্তরে ভাগ করা (NLB/ALB + CloudFront), কিন্তু Azure এটাকে তিন স্তরে ভাগ করেছে — প্রতিটা স্তর একদম আলাদা সমস্যার সমাধান করে।</p>

<h3>তিন স্তরের Load Balancing স্পেকট্রাম</h3>
<p>Azure-এ ট্রাফিক ডিস্ট্রিবিউট করার তিনটা প্রধান সার্ভিস আছে, আর এদের মধ্যে সবচেয়ে বড় বিভ্রান্তি হয় "কোনটা কখন" নিয়ে। মূল পার্থক্যটা তৈরি হয় দুইটা axis দিয়ে — <b>OSI layer</b> (৪ না ৭) আর <b>scope</b> (একটা region না পুরো পৃথিবী)।</p>
<table>
<tr><th>বিষয়</th><th><span class="kw">Load Balancer</span></th><th><span class="kw">Application Gateway</span></th><th>Front Door</th></tr>
<tr><td>OSI Layer</td><td>Layer 4 (TCP/UDP)</td><td>Layer 7 (HTTP/HTTPS)</td><td>Layer 7 (HTTP/HTTPS)</td></tr>
<tr><td>Scope</td><td>Regional</td><td>Regional</td><td>Global (anycast edge)</td></tr>
<tr><td>Routing ভিত্তি</td><td>IP + port, কোনো HTTP parsing নেই</td><td>URL path, host header, query string</td><td>URL path/host + global anycast routing</td></tr>
<tr><td>WAF</td><td>নেই</td><td>আছে (built-in add-on)</td><td>আছে (built-in)</td></tr>
<tr><td>Performance</td><td>extreme — সবচেয়ে কম latency, সবচেয়ে বেশি throughput</td><td>মাঝারি overhead (HTTP parse করে)</td><td>global — নিকটতম POP থেকেই সার্ভ</td></tr>
<tr><td>সাধারণ use case</td><td>internal backend LB, gaming/IoT, extreme low-latency TCP</td><td>path-based microservice routing, single-region web app + WAF</td><td>multi-region global app + CDN + WAF একসাথে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন একটা প্রোডাক্টে সব মিলিয়ে দেওয়া হলো না</span>
Layer 4-তে HTTP বোঝার কোনো দরকারই নেই — শুধু packet ফরওয়ার্ড করলেই চলে, তাই <span class="kw">Load Balancer</span> (AWS-এর NLB-এর সমতুল্য) parsing স্কিপ করে extreme throughput পায়। কিন্তু path-based routing বা WAF করতে হলে packet-এর ভেতরে HTTP request বুঝতেই হবে, সেখানে <span class="kw">Application Gateway</span> (AWS-এর ALB-এর সমতুল্য) লাগে। আবার একটা region-এর ভেতরে ভালো কাজ করা জিনিস, পুরো পৃথিবীতে anycast edge দিয়ে ট্রাফিক নেওয়ার জন্য যথেষ্ট না — সেই কাজটা করে Front Door, যেটার বিস্তারিত পরের চ্যাপ্টারে। তিনটা আলাদা প্রোডাক্ট রাখার কারণ হলো "সব কাজের জন্য একই টুল" আসলে কোনো কাজেই optimal হয় না।</div>

<h3>Backend Pool ও Health Probe</h3>
<p>Load Balancer বা Application Gateway সরাসরি কোনো VM-কে "চেনে" না — ট্রাফিক পাঠানো হয় একটা <span class="kw">Backend Pool</span>-এর কাছে, যেটা VM/VMSS instance-এর একটা লিস্ট রাখে এবং নিয়মিত <span class="kw">Health Probe</span> দিয়ে তাদের অবস্থা যাচাই করে।</p>
<div class="diagram"><pre>
Client → Frontend IP → LB Rule → Backend Pool
                                      │
                    ┌─────────────────┼─────────────────┐
                    ▼                 ▼                 ▼
              VM Instance A     VM Instance B     VM Instance C
              (healthy)         (healthy)         (UNHEALTHY)
                    ▲                 ▲
                    └── Health Probe (interval, unhealthy threshold) ──┘
                          Instance C ট্রাফিক থেকে বাদ পড়ে
</pre></div>
<p>Probe একটা নির্দিষ্ট <code>interval</code>-এ (যেমন ১৫ সেকেন্ডে একবার) প্রতিটা instance-এ request পাঠায় (TCP handshake বা HTTP GET)। পরপর কয়েকবার (<code>unhealthy threshold</code>) fail করলে সেই instance পুল থেকে সাময়িকভাবে বাদ পড়ে যায় — VM টার্মিনেট হয় না, শুধু নতুন ট্রাফিক পাওয়া বন্ধ হয়ে যায়।</p>
<div class="callout mistake"><span class="tag">Common mistake — probe path অ্যাপ্লিকেশনের বাস্তব অবস্থা প্রতিফলিত না করা</span>
Health probe-এর path যদি এমন কিছু হয় যা DB কল করে বা ভারী authentication চায়, তাহলে DB সামান্য স্লো হলেই পুরো fleet "unhealthy" দেখাবে এবং সব ট্রাফিক বন্ধ হয়ে যাবে। আলাদা lightweight <code>/health</code> endpoint বানানো উচিত যা শুধু "process বেঁচে আছে কিনা" যাচাই করে, downstream dependency-র উপর নির্ভর করে না।</div>
