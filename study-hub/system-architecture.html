<h3>Distributed Rate Limiting</h3>
<p>যখন API Gateway বা service নিজেই horizontal ভাবে scaled (একাধিক instance), rate limit counter শুধু একটা instance-এর মেমোরিতে রাখলে চলবে না — একজন client ভিন্ন ভিন্ন instance-এ request পাঠিয়ে সীমা এড়িয়ে যেতে পারবে। তাই counter একটা <b>shared, centralized store</b>-এ (সাধারণত Redis) রাখতে হয়। এখানেও concurrency অধ্যায়ে আলোচিত race condition-এর ঝুঁকি থাকে — তাই counter বৃদ্ধি এবং সীমা যাচাই একটা <b>atomic operation</b>-এ (Redis-এর <code>INCR</code> + <code>EXPIRE</code>, অথবা একটা Lua script দিয়ে পুরো check-and-increment একসাথে atomic করে) করতে হয়।</p>

<div class="callout why"><span class="tag">কেন Redis Lua Script এখানে গুরুত্বপূর্ণ</span>
"counter পড়ো, সীমার সাথে তুলনা করো, বাড়াও" — এই তিনটা ধাপ আলাদাভাবে করলে দুইটা concurrent request race condition-এ পড়ে সীমা ছাড়িয়ে যেতে পারে। Redis-এ একটা Lua script পাঠালে পুরো লজিকটা Redis সার্ভারের ভেতরে একটা atomic, single-threaded operation হিসেবে চলে — কোনো race condition সম্ভব না।</div>

<h3>Response Semantics — Client-কে সঠিকভাবে জানানো</h3>
<p>একটা ভালো rate-limited API নিচের header-গুলো response-এ পাঠায়, যাতে client নিজে থেকেই তার ব্যবহার নিয়ন্ত্রণ করতে পারে —</p>
<ul>
<li><code>X-RateLimit-Limit</code> — মোট অনুমোদিত সীমা।</li>
<li><code>X-RateLimit-Remaining</code> — বর্তমান উইন্ডোতে বাকি থাকা request সংখ্যা।</li>
<li><code>X-RateLimit-Reset</code> — কখন উইন্ডো রিসেট হবে (timestamp)।</li>
<li><code>Retry-After</code> — সীমা ছাড়ালে, কত সেকেন্ড পর আবার চেষ্টা করা উচিত।</li>
</ul>

<h3>Per-User, Per-IP ও Per-API-Key Limiting</h3>
<p>সীমা একক গ্লোবাল না হয়ে সাধারণত বিভিন্ন dimension-এ প্রয়োগ করা হয় — <b>Per-IP</b> (অ্যানোনিমাস traffic-এর জন্য, কিন্তু NAT-এর পেছনে একাধিক ইউজার একই IP শেয়ার করলে সমস্যা হতে পারে), <b>Per-User/Per-Account</b> (login করা ইউজারের জন্য), এবং <b>Per-API-Key/Per-Client</b> (partner/third-party integration-এর জন্য, প্রায়ই <b>tiered limit</b>-এর সাথে যুক্ত — Free tier ১০০ req/min, Paid tier ১০,০০০ req/min)।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু IP-ভিত্তিক rate limiting-এ নির্ভর করা</span>
Corporate NAT বা mobile carrier NAT-এর পেছনে হাজার হাজার প্রকৃত ইউজার একই public IP শেয়ার করতে পারে — শুধু IP দেখে সীমা বসালে বৈধ ইউজাররা একে অপরের কারণে ব্লক হয়ে যেতে পারে। যেখানেই সম্ভব, authenticated ইউজার/API key-ভিত্তিক সীমা IP-ভিত্তিক সীমার সাথে যুক্ত করে ব্যবহার করা উচিত।</div>

<div class="callout best"><span class="tag">Best practice — Rate Limit যত সম্ভব সামনের দিকে (Edge/Gateway) প্রয়োগ করুন</span>
Rate limit চেক যত আগে (CDN/Edge বা API Gateway-তে) করা যায়, তত কম রিসোর্স নষ্ট হয় — একটা প্রত্যাখ্যাত request-এর জন্য পুরো backend সার্ভিস, ডাটাবেস কানেকশন খরচ করার দরকার নেই। "যত দ্রুত সম্ভব প্রত্যাখ্যান করো" নীতিটা সিস্টেমের সামগ্রিক resilience-এ বড় পার্থক্য তৈরি করে।</div>
</template>

<template data-page="infra-deployment">
<h2 class="title">৩০. Infrastructure ও Deployment Architecture</h2>
<p class="lead">কোড যত ভালোই হোক, সেটা কোথায় চলে, কীভাবে ডিপ্লয় হয় এবং কীভাবে রোলব্যাক হয় — এই infrastructure সিদ্ধান্তগুলোও সিস্টেম আর্কিটেকচারের অবিচ্ছেদ্য অংশ।</p>

<h3>Application Architecture বনাম Infrastructure Architecture</h3>
<p>আগের অধ্যায়গুলোতে আমরা <span class="kw">application-level</span> স্টাইল (Monolith, Microservices, Event-Driven) দেখেছি। <span class="kw">System Architecture</span>-এ এর সাথে যুক্ত হয় এই প্রশ্নগুলো — সার্ভিসগুলো কোন নেটওয়ার্কে বসবে? কয়টা Region/Availability Zone-এ চলবে? Compute হবে VM, Container নাকি Serverless? Environment (Dev/Staging/Prod) কীভাবে আলাদা থাকবে? একই কোড ভিন্ন infrastructure-এ সম্পূর্ণ ভিন্ন availability ও cost দেয়, তাই এটা আর্কিটেকচারের অংশ।</p>

<h3>Compute মডেল বেছে নেওয়া</h3>
<table>
<tr><th>মডেল</th><th>কখন উপযুক্ত</th><th>ট্রেড-অফ</th></tr>
<tr><td>VM (IaaS)</td><td>Legacy অ্যাপ, OS-level নিয়ন্ত্রণ দরকার</td><td>Patching ও scaling নিজের দায়িত্ব</td></tr>
<tr><td>Container + Orchestrator (Kubernetes)</td><td>অনেক সার্ভিস, portable deployment, auto-scaling</td><td>Operational জটিলতা, শেখার খরচ বেশি</td></tr>
<tr><td>PaaS (App Service, Elastic Beanstalk)</td><td>ছোট-মাঝারি টিম, দ্রুত ডিপ্লয়</td><td>কম নিয়ন্ত্রণ, vendor-এর সীমা</td></tr>
<tr><td>Serverless (Functions)</td><td>Spiky/event-driven workload</td><td>Cold start, execution সীমা, vendor lock-in</td></tr>
</table>

<div class="callout why"><span class="tag">কেন সবসময় Kubernetes নয়</span>
Kubernetes শক্তিশালী, কিন্তু একটা ছোট টিমের জন্য cluster চালানোর operational খরচ প্রায়ই অ্যাপের জটিলতার চেয়ে বেশি হয়ে যায়। দুইটা সার্ভিস আর তিনজনের টিমের জন্য PaaS বা managed container সার্ভিস (যেমন Azure Container Apps, AWS App Runner) সাধারণত যথেষ্ট। জটিলতা তখনই আনুন যখন সমস্যাটা সত্যিই আছে।</div>

<h3>Network Topology — একটা সাধারণ Layered Layout</h3>
<div class="diagram"><pre>
Internet
   │
[CDN / WAF]            ← Edge: caching, DDoS ও common attack ফিল্টার
   │
[Load Balancer]        ← Public subnet
   │
┌──┴───────────────┐
│ App Servers/Pods │   ← Private subnet (সরাসরি internet access নেই)
└──┬───────────────┘
   │
[DB / Cache / Queue]   ← Isolated data subnet (শুধু app subnet থেকে access)
</pre></div>
<p>মূল নীতি হলো <b>defense in depth</b> — Database কখনোই public subnet-এ থাকবে না; শুধু Load Balancer/Gateway বাইরে থেকে দেখা যাবে, বাকি সব private।</p>

<h3>Multi-AZ ও Multi-Region</h3>
<ul>
<li><b>Multi-AZ:</b> একই Region-এর একাধিক data center-এ সার্ভিস ছড়িয়ে রাখা — একটা AZ ডাউন হলেও সিস্টেম চলে। প্রোডাকশনের জন্য প্রায় বাধ্যতামূলক ন্যূনতম স্তর।</li>
<li><b>Multi-Region:</b> পুরো Region ব্যর্থ হলেও টিকে থাকা এবং ইউজারের কাছাকাছি latency কমানো। কিন্তু data replication, consistency ও খরচ নাটকীয়ভাবে বাড়ে — তাই RTO/RPO দাবি না থাকলে এড়িয়ে চলা ভালো।</li>
</ul>

<h3>Deployment Strategy — ঝুঁকি কমিয়ে রিলিজ</h3>
<table>
<tr><th>Strategy</th><th>কীভাবে কাজ করে</th><th>Rollback</th></tr>
<tr><td>Rolling</td><td>ধীরে ধীরে একটা একটা instance নতুন ভার্সনে বদলায়</td><td>মাঝারি গতি</td></tr>
<tr><td>Blue-Green</td><td>পুরো নতুন (Green) environment তৈরি করে traffic সুইচ করা</td><td>সঙ্গে সঙ্গে (traffic ফিরিয়ে দিন)</td></tr>
<tr><td>Canary</td><td>প্রথমে ৫% ট্র্যাফিক নতুন ভার্সনে, মেট্রিক ঠিক থাকলে বাড়ানো</td><td>দ্রুত, blast radius ছোট</td></tr>
<tr><td>Feature Flag</td><td>কোড ডিপ্লয় আর ফিচার চালু আলাদা করা</td><td>ডিপ্লয় ছাড়াই flag বন্ধ</td></tr>
</table>

<div class="callout mistake"><span class="tag">Common mistake — Database migration ও কোড একসাথে ভাঙা</span>
কোড রোলব্যাক সহজ, কিন্তু schema রোলব্যাক কঠিন। তাই migration সবসময় <b>backward-compatible</b> রাখুন (expand → migrate → contract) — আগে নতুন column যোগ করুন, দুই ভার্সনই চালানোর সময় দিন, তারপর পুরনোটা সরান। নাহলে Blue-Green বা Canary রোলব্যাক অর্থহীন হয়ে যায়।</div>

<h3>Infrastructure as Code (IaC)</h3>
<p>হাতে কনসোলে ক্লিক করে বানানো infrastructure পুনরুৎপাদনযোগ্য না এবং কেউ জানে না কী বদলেছে। <span class="kw">Terraform</span>, <span class="kw">Bicep</span>, <span class="kw">CloudFormation</span>-এর মতো টুলে infrastructure কোড হিসেবে লিখলে সেটা version control-এ থাকে, review হয়, এবং একই setup Dev/Staging/Prod-এ নির্ভরযোগ্যভাবে তৈরি করা যায়।</p>
<pre>
<span class="c"># Terraform-এর ধারণা — infrastructure-ও কোডের মতো declare করা হয়</span>
resource "aws_db_instance" "orders" {
  engine         = "postgres"
  instance_class = "db.t3.medium"
  multi_az       = true            <span class="c"># প্রোডাকশনে Multi-AZ</span>
  publicly_accessible = false      <span class="c"># Database কখনো public না</span>
}
</pre>

<div class="callout best"><span class="tag">Best practice</span>
সব environment একই IaC টেমপ্লেট থেকে তৈরি করুন (শুধু ভ্যারিয়েবল আলাদা), Secret কখনো কোডে রাখবেন না (Key Vault/Secrets Manager), এবং CI/CD pipeline-ই হোক ডিপ্লয়ের একমাত্র পথ। "Staging-এ চলে কিন্তু Prod-এ চলে না" সমস্যার বড় অংশ environment drift থেকে আসে।</div>
</template>

<template data-page="data-architecture">
<h2 class="title">৩১. Data Architecture — Storage, Consistency ও Data Flow</h2>
<p class="lead">অনেক সিস্টেমে প্রকৃত bottleneck ও সবচেয়ে ব্যয়বহুল ভুল থাকে data layer-এ — তাই কোন ডেটা কোথায় থাকবে এবং কীভাবে প্রবাহিত হবে সেই সিদ্ধান্ত আর্কিটেকচারের কেন্দ্রে।</p>

<h3>Polyglot Persistence — একটাই Database সব কাজে নয়</h3>
<p>বিভিন্ন ধরনের ডেটার চাহিদা ভিন্ন, তাই বাস্তব সিস্টেমে সাধারণত একাধিক storage ব্যবহার হয় —</p>
<table>
<tr><th>ডেটার ধরন</th><th>উপযুক্ত Storage</th><th>উদাহরণ</th></tr>
<tr><td>Transactional (অর্ডার, পেমেন্ট)</td><td>Relational DB (ACID)</td><td>PostgreSQL, SQL Server</td></tr>
<tr><td>Cache, Session, Counter</td><td>In-memory Key-Value</td><td>Redis</td></tr>
<tr><td>Flexible document, catalog</td><td>Document DB</td><td>MongoDB, Cosmos DB</td></tr>
<tr><td>Full-text search</td><td>Search Engine</td><td>Elasticsearch</td></tr>
<tr><td>File, ছবি, ভিডিও</td><td>Object Storage</td><td>S3, Azure Blob</td></tr>
<tr><td>Analytics, Reporting</td><td>Data Warehouse / Columnar</td><td>BigQuery, Snowflake</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — প্রতিটা ফ্যাশনেবল DB একসাথে ব্যবহার</span>
প্রতিটা নতুন Database মানে নতুন operational বোঝা (backup, monitoring, expertise, sync)। "PostgreSQL দিয়ে হবে কি না" আগে ভাবুন — আধুনিক PostgreSQL JSON, full-text search ও অনেক কিছুই ভালোভাবে সামলায়। আলাদা store তখনই আনুন যখন স্পষ্ট প্রয়োজন প্রমাণিত।</div>

<h3>OLTP বনাম OLAP — Operational ও Analytical ডেটা আলাদা রাখা</h3>
<p><span class="kw">OLTP</span> সিস্টেম অনেক ছোট read/write দ্রুত সামলায় (অর্ডার তৈরি)। <span class="kw">OLAP</span> সিস্টেম বিশাল ডেটার ওপর ভারী aggregate query চালায় ("গত বছরের region-ভিত্তিক বিক্রি")। ভারী analytics query সরাসরি production OLTP database-এ চালালে পুরো অ্যাপ ধীর হয়ে যায়। তাই ডেটা সাধারণত একটা pipeline দিয়ে আলাদা analytical store-এ কপি করা হয়।</p>
<div class="diagram"><pre>
[App] → [OLTP DB] ──CDC/ETL──▶ [Data Lake / Warehouse] ──▶ [BI Dashboard, ML]
            │
            └──▶ Event Stream (Kafka) ──▶ [Search Index, Cache, অন্য সার্ভিস]
</pre></div>

<h3>Consistency — কোথায় Strong, কোথায় Eventual</h3>
<ul>
<li><b>Strong consistency:</b> ব্যাংক ব্যালেন্স, ইনভেন্টরি কমানো — ভুল ডেটা পড়া অগ্রহণযোগ্য।</li>
<li><b>Eventual consistency:</b> লাইক কাউন্ট, ফিড, search index — কয়েক সেকেন্ড পুরনো ডেটা গ্রহণযোগ্য, বিনিময়ে অনেক বেশি scale ও availability।</li>
</ul>
<p>এই সিদ্ধান্ত পুরো সিস্টেমে একরকম হওয়ার দরকার নেই — <b>প্রতিটা use case-এর ব্যবসায়িক ঝুঁকি অনুযায়ী</b> ঠিক করুন। বিস্তারিত ধারণা Distributed Systems কোর্সে (CAP, Quorum) আছে।</p>

<h3>Data Ownership ও Microservices</h3>
<p>Microservices-এ প্রতিটা সার্ভিস নিজের ডেটার মালিক — অন্য সার্ভিসের database সরাসরি পড়া নিষিদ্ধ, শুধু API বা event-এর মাধ্যমে। এতে coupling কমে, কিন্তু cross-service query ও transaction কঠিন হয়। সমাধানগুলো —</p>
<ul>
<li><b>API Composition:</b> একাধিক সার্ভিস কল করে gateway/BFF-এ ডেটা জোড়া দেওয়া।</li>
<li><b>CQRS / Read Model:</b> event শুনে পড়ার জন্য আলাদা denormalized view রাখা।</li>
<li><b>Saga:</b> distributed transaction-এর বদলে compensating action-সহ ধাপে ধাপে কাজ।</li>
</ul>

<h3>Outbox Pattern — Database ও Event-এর সামঞ্জস্য</h3>
<p>সমস্যা: অর্ডার DB-তে সেভ করলাম, কিন্তু event পাঠানোর আগেই অ্যাপ ক্র্যাশ করল — ডেটা আছে অথচ কেউ জানল না। সমাধান: একই transaction-এ business ডেটা ও "outbox" টেবিলে event লিখুন, তারপর আলাদা প্রসেস outbox থেকে পড়ে broker-এ পাঠায়।</p>
<pre>
<span class="c">// একই transaction-এ অর্ডার ও পাঠানোর জন্য event — দুটোই হবে, নয়তো কোনোটাই না</span>
using var tx = await db.Database.BeginTransactionAsync();
db.Orders.Add(order);
db.Outbox.Add(new OutboxMessage {
    Type = "OrderPlaced",
    Payload = JsonSerializer.Serialize(new { order.Id, order.Total })
});
await db.SaveChangesAsync();
await tx.CommitAsync();
<span class="c">// আলাদা background worker Outbox পড়ে Kafka/RabbitMQ-তে publish করে ও মার্ক করে</span>
</pre>
<div class="callout best"><span class="tag">Best practice</span>
Consumer-কে idempotent বানান (Outbox "at-least-once" ডেলিভারি দেয়, তাই duplicate আসতে পারে), প্রতিটা ডেটার একজন স্পষ্ট মালিক সার্ভিস রাখুন, এবং backup restore কখনো পরীক্ষা না করা পর্যন্ত backup আছে বলে ধরে নেবেন না।</div>
</template>

<template data-page="security-architecture">
<h2 class="title">৩২. Security Architecture</h2>
<p class="lead">Security শেষে জুড়ে দেওয়ার ফিচার নয় — সেটা এমন একটা quality attribute যা শুরু থেকেই আর্কিটেকচারে বোনা না থাকলে পরে ঠিক করা প্রায় অসম্ভব।</p>

<h3>মূল নীতিগুলো</h3>
<ul>
<li><b>Defense in Depth:</b> একটা স্তর ভাঙলেও যেন পরের স্তর আটকায় — WAF, Gateway auth, service-level auth, DB permission।</li>
<li><b>Least Privilege:</b> প্রতিটা সার্ভিস/ইউজার শুধু ততটুকু অনুমতি পাবে যতটুকু দরকার (যে সার্ভিস শুধু পড়ে তার DB ইউজারকে write দেবেন না)।</li>
<li><b>Zero Trust:</b> "ভেতরের নেটওয়ার্ক মানেই নিরাপদ" ধারণা বাদ — প্রতিটা request, এমনকি internal সার্ভিস-থেকে-সার্ভিসও যাচাই হবে।</li>
<li><b>Secure by Default:</b> ডিফল্ট কনফিগারেশন যেন নিরাপদ হয়, নিরাপত্তা খুলতে হলে সচেতন সিদ্ধান্ত লাগে।</li>
</ul>

<h3>Authentication বনাম Authorization</h3>
<p><span class="kw">Authentication (AuthN)</span> = "আপনি কে?"; <span class="kw">Authorization (AuthZ)</span> = "আপনি কী করতে পারবেন?"। দুটো গুলিয়ে ফেলা খুব সাধারণ ভুল — লগইন করা ইউজার অন্য ইউজারের অর্ডার দেখতে পারলে সেটা AuthZ ব্যর্থতা (IDOR)।</p>

<h3>Microservices-এ Identity Flow</h3>
<div class="diagram"><pre>
[Client] ──login──▶ [Identity Provider (OIDC)] ──▶ Access Token (JWT)
   │
   │  Authorization: Bearer &lt;JWT&gt;
   ▼
[API Gateway]  ← token যাচাই (signature, expiry, audience), rate limit
   │  (token অথবা internal identity forward)
   ▼
[Order Service] ← নিজেও scope/role যাচাই করে (gateway-কে অন্ধভাবে বিশ্বাস নয়)
   │  mTLS
   ▼
[Payment Service]
</pre></div>
<p>সাধারণ আর্কিটেকচার: কেন্দ্রীয় Identity Provider (Keycloak, Entra ID, Auth0) token ইস্যু করে; Gateway প্রথম যাচাই করে; প্রতিটা সার্ভিসও নিজের authorization নিয়ম প্রয়োগ করে। বিস্তারিত OAuth2/OIDC/JWT Auth কোর্সে আছে।</p>

<h3>Data Protection</h3>
<ul>
<li><b>In Transit:</b> সব জায়গায় TLS; internal সার্ভিসের মধ্যে <span class="kw">mTLS</span> (service mesh দিয়ে স্বয়ংক্রিয় করা যায়)।</li>
<li><b>At Rest:</b> Database/Disk/Blob encryption; সংবেদনশীল ফিল্ড (কার্ড নম্বর, NID) আলাদা field-level encryption।</li>
<li><b>Secrets:</b> কোড বা repo-তে কখনো না — Key Vault / Secrets Manager, নিয়মিত rotation।</li>
<li><b>Data Minimization:</b> যে ডেটা রাখার দরকার নেই তা সংগ্রহই করবেন না — যা নেই তা চুরি হয় না।</li>
</ul>

<h3>Threat Modeling — STRIDE</h3>
<table>
<tr><th>Threat</th><th>অর্থ</th><th>প্রতিরোধ</th></tr>
<tr><td>Spoofing</td><td>অন্যের পরিচয় নেওয়া</td><td>Strong auth, MFA</td></tr>
<tr><td>Tampering</td><td>ডেটা বদলে ফেলা</td><td>Signature, integrity check, TLS</td></tr>
<tr><td>Repudiation</td><td>"আমি করিনি" অস্বীকার</td><td>Audit log</td></tr>
<tr><td>Information Disclosure</td><td>ডেটা ফাঁস</td><td>Encryption, access control</td></tr>
<tr><td>Denial of Service</td><td>সার্ভিস অচল করা</td><td>Rate limit, WAF, autoscale</td></tr>
<tr><td>Elevation of Privilege</td><td>অনুমতির বেশি পাওয়া</td><td>Least privilege, input validation</td></tr>
</table>
<p>ডিজাইনের সময় data flow diagram-এর প্রতিটা boundary পার হওয়ার জায়গায় এই ছয়টা প্রশ্ন করাকেই <span class="kw">Threat Modeling</span> বলে — কোড লেখার আগে ধরা ভুল সবচেয়ে সস্তা।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু Gateway-তে auth করে বাকি সার্ভিস খোলা রাখা</span>
Gateway পার হওয়ার পর যদি internal সার্ভিসগুলো কোনো যাচাই ছাড়া সবকিছু মেনে নেয়, তাহলে একটা সার্ভিস compromised হলেই পুরো নেটওয়ার্ক খোলা। প্রতিটা সার্ভিসে অন্তত token/identity যাচাই রাখুন।</div>
<div class="callout best"><span class="tag">Best practice</span>
Dependency ও container image নিয়মিত scan করুন, OWASP Top 10 অনুযায়ী review করুন, সব sensitive action-এর audit log রাখুন, এবং security incident-এর জন্য একটা প্রস্তুত response plan রাখুন।</div>
</template>

<template data-page="resilience-observability">
<h2 class="title">৩৩. Resilience, Observability ও Disaster Recovery</h2>
<p class="lead">বড় সিস্টেমে "কিছু একটা ভাঙবে" নিশ্চিত — ভালো আর্কিটেকচার ব্যর্থতা এড়ানোর চেষ্টা করে না, বরং ব্যর্থতা সহ্য করে এবং দ্রুত বুঝতে পারে কী ভেঙেছে।</p>

<h3>Resilience Patterns — Failure ছড়ানো আটকানো</h3>
<table>
<tr><th>Pattern</th><th>কাজ</th></tr>
<tr><td>Timeout</td><td>অন্য সার্ভিসের জন্য অনির্দিষ্টকাল অপেক্ষা না করা</td></tr>
<tr><td>Retry + Exponential Backoff + Jitter</td><td>সাময়িক ব্যর্থতায় আবার চেষ্টা, কিন্তু ক্রমশ বেশি বিরতিতে (idempotent অপারেশনে)</td></tr>
<tr><td>Circuit Breaker</td><td>ক্রমাগত ব্যর্থ সার্ভিসে কল বন্ধ রেখে দ্রুত fail করা, যাতে সে সেরে উঠতে পারে</td></tr>
<tr><td>Bulkhead</td><td>এক ডিপেন্ডেন্সির সমস্যা যেন সব thread/connection শেষ না করে — resource আলাদা পুলে ভাগ করা</td></tr>
<tr><td>Fallback / Graceful Degradation</td><td>recommendation ডাউন হলে ডিফল্ট লিস্ট দেখানো, পুরো পেজ ভাঙা নয়</td></tr>
</table>
<pre>
<span class="c">// .NET-এ Polly দিয়ে Retry + Circuit Breaker + Timeout</span>
var policy = Policy.WrapAsync(
    Policy.TimeoutAsync(TimeSpan.FromSeconds(2)),
    Policy.Handle&lt;HttpRequestException&gt;()
          .CircuitBreakerAsync(5, TimeSpan.FromSeconds(30)),   <span class="c">// ৫ বার ব্যর্থ → ৩০ সেকেন্ড বন্ধ</span>
    Policy.Handle&lt;HttpRequestException&gt;()
          .WaitAndRetryAsync(3, i => TimeSpan.FromMilliseconds(200 * Math.Pow(2, i))));
</pre>
<div class="callout mistake"><span class="tag">Common mistake — Retry Storm</span>
সবাই একই সময়ে retry করলে ইতিমধ্যে দুর্বল সার্ভিসের ওপর আরও চাপ পড়ে, ডাউন হওয়া দীর্ঘ হয়। Backoff ও random jitter ছাড়া, এবং non-idempotent অপারেশনে (পেমেন্ট) idempotency key ছাড়া retry বিপজ্জনক — Idempotency অধ্যায়গুলো দেখুন।</div>

<h3>Availability ও SLA/SLO/SLI</h3>
<ul>
<li><b>SLI:</b> আসলে যা মাপা হয় (যেমন সফল request-এর শতাংশ, p99 latency)।</li>
<li><b>SLO:</b> অভ্যন্তরীণ লক্ষ্য (যেমন ৯৯.৯% সফল)।</li>
<li><b>SLA:</b> গ্রাহকের সাথে চুক্তি, ভঙ্গ করলে জরিমানা।</li>
</ul>
<table>
<tr><th>Availability</th><th>বছরে সর্বোচ্চ Downtime</th></tr>
<tr><td>৯৯%</td><td>~৩.৬৫ দিন</td></tr>
<tr><td>৯৯.৯%</td><td>~৮.৭৬ ঘণ্টা</td></tr>
<tr><td>৯৯.৯৯%</td><td>~৫২ মিনিট</td></tr>
<tr><td>৯৯.৯৯৯%</td><td>~৫ মিনিট</td></tr>
</table>
<p>প্রতিটা বাড়তি "নাইন" খরচ ও জটিলতা নাটকীয়ভাবে বাড়ায়। আরও মনে রাখুন, সিরিজে যুক্ত ডিপেন্ডেন্সির availability গুণ হয় — ৯৯.৯% এর তিনটা সার্ভিস সিরিজে থাকলে মোট প্রায় ৯৯.৭%।</p>

<h3>Observability — তিন স্তম্ভ</h3>
<ul>
<li><b>Logs:</b> কী ঘটেছে (structured JSON, correlation ID সহ)।</li>
<li><b>Metrics:</b> কতটা ঘটছে — latency, error rate, throughput, saturation (Prometheus/Grafana)।</li>
<li><b>Traces:</b> একটা request অনেক সার্ভিস পেরিয়ে কোথায় কত সময় নিল (OpenTelemetry, Jaeger)।</li>
</ul>
<div class="callout why"><span class="tag">কেন Monitoring-এর চেয়ে Observability বেশি</span>
Monitoring আপনাকে জানায় "কিছু ভেঙেছে" (আগে থেকে ঠিক করা ড্যাশবোর্ড)। Observability দেয় এমন ডেটা যা দিয়ে আগে কল্পনা না করা সমস্যাও "কেন" প্রশ্ন করে খুঁজে বের করা যায়। Microservices-এ distributed tracing ছাড়া একটা ধীর request-এর কারণ খোঁজা অন্ধকারে হাতড়ানোর মতো।</div>

<h3>Disaster Recovery — RTO ও RPO</h3>
<ul>
<li><b>RPO (Recovery Point Objective):</b> সর্বোচ্চ কতটা ডেটা হারানো সহনীয় (যেমন ৫ মিনিট)।</li>
<li><b>RTO (Recovery Time Objective):</b> সর্বোচ্চ কতক্ষণে সিস্টেম ফিরে আসতে হবে।</li>
</ul>
<table>
<tr><th>DR Strategy</th><th>RTO</th><th>খরচ</th></tr>
<tr><td>Backup & Restore</td><td>ঘণ্টা-দিন</td><td>সবচেয়ে কম</td></tr>
<tr><td>Pilot Light</td><td>দশ মিনিট-ঘণ্টা</td><td>কম</td></tr>
<tr><td>Warm Standby</td><td>মিনিট</td><td>মাঝারি</td></tr>
<tr><td>Active-Active (Multi-Region)</td><td>প্রায় শূন্য</td><td>সর্বোচ্চ</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
RTO/RPO ব্যবসার সাথে বসে ঠিক করুন (প্রযুক্তিগত সিদ্ধান্ত না, ব্যবসায়িক সিদ্ধান্ত), নিয়মিত restore drill করুন, এবং Chaos Engineering-এর মাধ্যমে ইচ্ছাকৃতভাবে ব্যর্থতা ঘটিয়ে আপনার resilience দাবি প্রমাণ করুন — পরীক্ষা না করা DR প্ল্যান আসলে অনুমান।</div>
</template>

<h2 class="title">৩৪. Reference Architectures — বাস্তব সিস্টেমে সব মিলিয়ে দেখা</h2>
<p class="lead">আলাদা আলাদা প্যাটার্ন শেখা সহজ; কঠিন হলো একটা বাস্তব সমস্যায় কোন প্যাটার্ন কোথায় বসবে সেটা জানা। এই অধ্যায়ে তিনটা সিস্টেম ধাপে ধাপে বিশ্লেষণ করা হলো।</p>

<h3>পদ্ধতি — যেকোনো সিস্টেম আর্কিটেকচার করার ধাপ</h3>
<ol>
<li><b>Requirements ও Quality Attributes</b> স্পষ্ট করুন (২ ও ৩৬ নম্বর অধ্যায়ের চিন্তা)।</li>
<li><b>Scale অনুমান</b> করুন — user, request/sec, ডেটার আকার।</li>
<li><b>Application style</b> বেছে নিন (Modular Monolith নাকি Microservices?)।</li>
<li><b>Data ও consistency</b> ঠিক করুন (কোথায় strong, কোথায় eventual)।</li>
<li><b>Traffic path</b> সাজান (CDN → LB → Gateway → সার্ভিস)।</li>
<li><b>Resilience, Security, Observability</b> যোগ করুন।</li>
<li><b>সিদ্ধান্তগুলো ADR-এ</b> লিখে রাখুন।</li>
</ol>

<h3>উদাহরণ ১ — ছোট স্টার্টআপ (E-commerce MVP)</h3>
<div class="diagram"><pre>
[Browser/Mobile] → [CDN] → [Load Balancer]
                                │
                        ┌───────┴────────┐
                        │ Modular Monolith│  (.NET, একটাই deployable)
                        │ Catalog|Order|  │
                        │ Payment|Users   │
                        └───┬────────┬───┘
                      [PostgreSQL]  [Redis]    [S3: ছবি]
</pre></div>
<p><b>কেন:</b> টিম ছোট, product-market fit এখনো অনিশ্চিত — গতি ও সরলতাই সবচেয়ে বড় quality attribute। Modular Monolith-এ module boundary পরিষ্কার রাখলে পরে প্রয়োজনে একটা একটা module আলাদা সার্ভিসে বের করা যায়। Multi-AZ managed DB ও ডিপ্লয় pipeline থাকলেই শুরুর জন্য যথেষ্ট।</p>

<h3>উদাহরণ ২ — বড় স্কেলের E-commerce</h3>
<div class="diagram"><pre>
[Clients] → [CDN/WAF] → [Global LB] → [API Gateway (auth, rate limit)]
                                           │
        ┌─────────────┬──────────────┬─────┴───────┬───────────────┐
   [Catalog]      [Search]       [Order]       [Payment]      [Inventory]
   MongoDB      Elasticsearch   PostgreSQL    PostgreSQL     PostgreSQL+Redis
        │                           │ (Outbox)      │
        └───────────── Event Bus (Kafka) ───────────┘
                          │
        [Notification] [Analytics → Data Warehouse] [Recommendation]
</pre></div>
<ul>
<li><b>Microservices:</b> ভিন্ন টিম, ভিন্ন scale (Search/Catalog অনেক বেশি read)।</li>
<li><b>Event-Driven:</b> Order → Inventory → Payment → Notification Saga দিয়ে সমন্বয়, Outbox দিয়ে নির্ভরযোগ্য event।</li>
<li><b>Polyglot data:</b> প্রতিটা সার্ভিসের জন্য উপযুক্ত store।</li>
<li><b>Idempotency:</b> Payment-এ Idempotency Key; Flash sale-এ Rate Limit ও queue-based load leveling।</li>
<li><b>Resilience:</b> Circuit breaker, fallback (recommendation ডাউন হলেও checkout চলবে)।</li>
</ul>

<h3>উদাহরণ ৩ — Real-time Notification/Chat ধরনের সিস্টেম</h3>
<div class="diagram"><pre>
[Clients] ⇄ WebSocket ⇄ [Gateway Nodes (stateful connection)]
                              │
                        [Redis Pub/Sub / Kafka]  ← node-গুলোর মধ্যে message ফরোয়ার্ড
                              │
                   [Message Service] → [Cassandra/Scylla: message store]
                              │
                      [Push Service → FCM/APNs] (offline ইউজারের জন্য)
</pre></div>
<p><b>মূল সিদ্ধান্ত:</b> WebSocket connection stateful, তাই Load Balancer-এ sticky/consistent routing বা pub/sub দিয়ে node-ভিত্তিক delivery লাগে — এখানেই stateless scaling-এর সাধারণ নিয়ম ভাঙে এবং আলাদা কৌশল দরকার হয়। বিস্তারিত System Design Case Studies ও Interview Handbook কোর্সে আছে।</p>

<h3>Architecture Decision Record (ADR): সিদ্ধান্তের প্রাতিষ্ঠানিক স্মৃতি</h3>
<p><span class="kw">Architecture Decision Record (ADR)</span> হলো একটা হালকা, version-controlled নথি — সাধারণত একটা ছোট Markdown ফাইল, প্রতিটা গুরুত্বপূর্ণ আর্কিটেকচারাল সিদ্ধান্তের জন্য একটা করে, কোডের সাথেই একই repository-তে commit করা। ADR-এর মূল বৈশিষ্ট্য হলো এটা সিদ্ধান্ত নেওয়ার সাথে সাথেই লেখা হয় — পরে স্মৃতি থেকে পুনর্গঠন করা না। একটা সাধারণ ADR-এর কাঠামো নিচের মতো।</p>

<pre>
# ADR-০০১২: Order Service-এ Event-Driven Update ব্যবহার

## Status
Accepted (২০২৬-০৩-১৫)

## Context
Order Service থেকে Inventory Service-এ synchronous REST call করা হতো
stock আপডেট করার জন্য। পিক আওয়ারে Inventory Service একটু ধীর হলেই
পুরো checkout flow ব্লক হয়ে যাচ্ছিল, cascading timeout তৈরি হচ্ছিল।

## Decision
Order confirmation-এর পর একটা "OrderPlaced" event publish করা হবে
message broker-এ; Inventory Service সেটা asynchronously consume করে
stock আপডেট করবে।

+ Checkout latency Inventory Service-এর health থেকে decouple হলো।
+ Inventory Service ডাউন থাকলেও order নেওয়া বন্ধ হবে না।
- Stock eventually consistent হবে — সাময়িকভাবে oversell-এর সম্ভাবনা আছে।
- ডিবাগিং জটিল — একাধিক সার্ভিস ও broker log দেখতে হবে।

<p>Status ফিল্ডটা গুরুত্বপূর্ণ কারণ একটা ADR স্থায়ী সত্য না — এটা proposed অবস্থা থেকে accepted হতে পারে, পরে deprecated হতে পারে, অথবা নতুন কোনো ADR এসে সেটাকে superseded করতে পারে। এই status-চেইনটাই আর্কিটেকচারের evolution-এর একটা readable ইতিহাস তৈরি করে।</p>

<h3>ADR কেন ডায়াগ্রামের চেয়েও বেশি গুরুত্বপূর্ণ</h3>
<p>C4 ডায়াগ্রাম দেখায় সিস্টেমটা এখন কেমন দেখতে — কিন্তু কেন এই আকৃতিটা এলো, সেই প্রশ্নের উত্তর ডায়াগ্রামে থাকে না। ছয় মাস পর একজন নতুন ইঞ্জিনিয়ার প্রশ্ন তোলেন — "আমরা এখানে Postgres না নিয়ে একটা document store কেন নিলাম না?"। যদি ADR না থাকে, তাহলে সেই প্রসঙ্গ চিরতরে হারিয়ে যায় — আর এর চেয়েও বিপজ্জনক ব্যাপার হলো, কেউ হয়তো সরল উদ্দেশ্যে সেই "অদ্ভুত" সিদ্ধান্তটাকে "ঠিক করে" ফেলবেন, ঠিক সেই সমস্যাটাই আবার ফিরিয়ে আনবেন যেটা এড়ানোর জন্য মূল সিদ্ধান্তটা সচেতনভাবে নেওয়া হয়েছিল।</p>

<div class="callout behind"><span class="tag">বাস্তবতা — একই "ভুল" বারবার ফিরে আসা</span>
প্রোডাকশন সিস্টেমে এটা অস্বাভাবিক না যে একটা টিম একটা deliberate trade-off (যেমন eventual consistency মেনে নেওয়া) নিয়ে ভালোভাবেই আলোচনা করে সিদ্ধান্তে পৌঁছেছিল, কিন্তু ছয়-নয় মাস পর নতুন কেউ যোগ দিয়ে ভাবেন এটা একটা bug, আর "fix" করতে গিয়ে সেই পুরনো সমস্যাটাই ফিরিয়ে আনেন। ADR না থাকলে এই ইতিহাস পুনরাবৃত্তি ঠেকানোর কোনো উপায় নেই।</div>

<h3>Migration Path — Modular Monolith থেকে Microservices, ধাপে ধাপে</h3>
<p>এই কোর্সে বারবার একটা সুপারিশ ফিরে এসেছে — একটা সুশৃঙ্খল <span class="kw">Modular Monolith</span> দিয়ে শুরু করা, তারপর প্রমাণিত প্রয়োজনে নির্দিষ্ট module extract করা। এই এক্সট্র্যাকশন প্রক্রিয়ার প্রচলিত নাম <span class="kw">Strangler Fig</span> — একটা গাছকে (পুরনো monolith) ধীরে ধীরে একটা লতা (নতুন সার্ভিস) জড়িয়ে ধরে, একদিন লতাটাই একা দাঁড়িয়ে থাকে, কিন্তু কখনোই একদিনে পুরনো গাছ কেটে ফেলা হয় না। ব্যবহারিকভাবে এর মানে — প্রথমে module boundary-কে code-এর ভেতরে perfect করা (যদি এখনো করা না থাকে), তারপর সেই module-এর জন্য একটা আলাদা database প্রস্তুত করা এবং dual-write বা event-ভিত্তিক sync দিয়ে ডেটা migrate করা, এরপর ট্র্যাফিকের একটা ছোট অংশ নতুন সার্ভিসে রুট করে যাচাই করা, আর সবশেষে পুরনো monolith থেকে সেই module-এর কোড সম্পূর্ণ সরিয়ে ফেলা। প্রতিটা ধাপে সিস্টেম সচল থাকে, আর যেকোনো ধাপে সমস্যা দেখা দিলে আগের ধাপে ফিরে যাওয়া সম্ভব — একটা "বিগ ব্যাং" rewrite-এর বিপরীতে, যেখানে মাসের পর মাস কাজ করার পর একদিনে সবকিছু সুইচ করতে হয় এবং ব্যর্থ হলে ফিরে যাওয়ার পথ প্রায়ই থাকে না।</p>

একটা module extract করার আগে যদি সত্যিকারের মেট্রিক (আলাদা scaling দরকার, আলাদা deployment cadence দরকার, আলাদা টিম দরকার) না থাকে, তাহলে পুরো এক্সট্র্যাকশন প্রক্রিয়ার খরচ (network latency, distributed transaction, আলাদা monitoring) কোনো প্রকৃত সুবিধার বিনিময়ে আসে না — এটাই আগের অধ্যায়গুলোতে আলোচিত "resume-driven microservices" আর "distributed monolith" সমস্যার মূল উৎস। Extract করার সিদ্ধান্ত সবসময় একটা নির্দিষ্ট, পরিমাপযোগ্য pain point থেকে আসা উচিত, "এটা তো industry best practice" থেকে না।</div>

<h3>Big Design Up Front বনাম Evolutionary Architecture</h3>
<p>উপরের পুরো migration path আসলে একটা বৃহত্তর দার্শনিক অবস্থানের বাস্তব প্রয়োগ, যাকে বলা হয় <span class="kw">Evolutionary Architecture</span> — এই ধারণা অনুযায়ী আর্কিটেকচার একটা এককালীন, সামনে থেকে সম্পূর্ণভাবে পরিকল্পিত সিদ্ধান্ত না (একে বলা হয় <span class="kw">Big Design Up Front (BDUF)</span> — শুরুতেই প্রতিটা module boundary, প্রতিটা service, প্রতিটা ডেটা মডেল বিস্তারিতভাবে ডিজাইন করে ফেলার প্রচেষ্টা), বরং সময়ের সাথে সাথে প্রকৃত ব্যবহার ও প্রকৃত bottleneck দেখে ক্রমান্বয়ে বদলাতে থাকা একটা জীবন্ত কাঠামো। BDUF-এর সমস্যা হলো — একটা সিস্টেমের শুরুতে ভবিষ্যতের সব requirement, সব scale bottleneck নির্ভুলভাবে অনুমান করা প্রায় অসম্ভব; ভুল অনুমানের ওপর আগে থেকে তৈরি করা জটিল কাঠামো (যেমন অপ্রয়োজনীয় microservices split) পরে বাতিল করা তার তৈরি করার চেয়েও বেশি ব্যয়বহুল হয়ে দাঁড়ায়। Evolutionary Architecture এর বিপরীতে বলে — একটা simple, কিন্তু পরিবর্তনযোগ্য কাঠামো (Modular Monolith) দিয়ে শুরু করো, আর architectural fitness function (৬ নম্বর অধ্যায়ে দেখা module boundary enforcement-এর মতো automated চেক) ব্যবহার করে নিশ্চিত করো যে প্রতিটা পরিবর্তনের পরও সিস্টেমের গুরুত্বপূর্ণ বৈশিষ্ট্য (module boundary, quality attribute) অক্ষত থাকছে। এই পুরো কোর্সের সুপারিশ — Modular Monolith দিয়ে শুরু, প্রমাণিত প্রয়োজনে Strangler Fig দিয়ে ক্রমান্বয়ে extract — Evolutionary Architecture-এর একটা প্রত্যক্ষ উদাহরণ, BDUF-এর বিপরীত।</p>

<div class="callout mistake"><span class="tag">Common mistake — একই সিদ্ধান্ত প্রতিটা module-এর জন্য একইভাবে প্রয়োগ করা</span>
একটা সাধারণ ভুল হলো, একবার microservices-এ migrate করার সিদ্ধান্ত নিলে প্রতিটা module-কেই সমান আগ্রহে ভেঙে ফেলা — এমনকি যেগুলোর কোনো স্বাধীন স্কেলিং দরকার নেই। বাস্তবে সিদ্ধান্তটা module-বাই-module ভিত্তিতে নেওয়া উচিত — কিছু module (core billing) হয়তো চিরকালই monolith-এর ভেতরে থাকা ভালো, আর শুধু নির্দিষ্ট hot-spot module (notification, image processing) আলাদা করা হয়। "সব-অথবা-কিছু-না" চিন্তা এখানে ক্ষতিকর।</div>

<div class="callout best"><span class="tag">Best practice — প্রতিটা বড় আর্কিটেকচারাল সিদ্ধান্তে ADR লিখুন</span>
৩৫ নম্বর অধ্যায়ে আলোচিত Architecture Decision Record ঠিক এই ধরনের সিদ্ধান্তের জন্যই সবচেয়ে বেশি মূল্যবান — "কেন আমরা এই মুহূর্তে Notifications module extract করছি, বাকিগুলো না" এই যুক্তিটা লিখে রাখলে ভবিষ্যতে (যখন হয়তো দলের অর্ধেক মানুষ বদলে গেছে) এই সিদ্ধান্ত পুনরায় ন্যায্যতা প্রমাণ করার প্রয়োজন পড়ে না, আর কেউ ভুল করে "সবকিছু একসাথে মাইক্রোসার্ভিস করি" বলে আগের সুচিন্তিত সীমানা ভেঙে ফেলে না।</div>

<h3>বাস্তবতা — বেশিরভাগ বড় কোম্পানি বিশুদ্ধ কোনো একটা Style-এ নেই</h3>
<p>পাঠ্যবইয়ের ডায়াগ্রামে যেমন দেখানো হয়, বাস্তবে প্রায় কোনো বড় প্রতিষ্ঠানের সিস্টেমই "বিশুদ্ধ মাইক্রোসার্ভিস" বা "বিশুদ্ধ মনোলিথ" না। একটা টিপিক্যাল বড় সিস্টেমে একসাথে দেখা যায় — একটা core modular monolith (বেশিরভাগ ব্যবসায়িক লজিক), তার পাশে হাতে গোনা কয়েকটা প্রকৃতপক্ষে extract করা microservice (যেগুলোর সত্যিই স্বাধীন scaling প্রমাণিত হয়েছে), একটা event-driven layer কিছু নির্দিষ্ট cross-cutting flow-এর জন্য (notification, analytics), হয়তো একটা space-based component একটা নির্দিষ্ট high-burst ফিচারের জন্য (flash sale), আর কিছু serverless function ছোট, স্বল্প-ফ্রিকোয়েন্সি টাস্কের জন্য (scheduled report, webhook handler)। এই হাইব্রিড বাস্তবতা কোনো ব্যর্থতা না — এটাই পরিণত আর্কিটেকচারাল চিন্তার লক্ষণ, যেখানে প্রতিটা style তার সবচেয়ে উপযুক্ত জায়গায় প্রয়োগ করা হয়েছে, কোনো একটা "সিলভার বুলেট" সবকিছুতে চাপিয়ে দেওয়া হয়নি।</p>

<div class="callout behind"><span class="tag">বাস্তবতা — বড় কোম্পানির আর্কিটেকচার কপি করা একটা ফাঁদ, দ্বিতীয়বার বলা প্রয়োজন</span>
প্রথম অধ্যায়ে যা বলা হয়েছিল তা এই অধ্যায়ে পুনরাবৃত্তি করার মতোই গুরুত্বপূর্ণ — Netflix বা Uber-এর আর্কিটেকচার বছরের পর বছর evolution আর বিপুল অপারেশনাল বিনিয়োগের ফলাফল। এই কোর্সের প্রতিটা style আলাদা আলাদা trade-off বহন করে, আর "কোনটা সঠিক" প্রশ্নের উত্তর সবসময় নির্ভর করবে আপনার নিজের টিম, নিজের স্কেল, আর নিজের constraint-এর উপর — অন্য কারও গল্পের উপর না।</div>

<p class="lead">আর্কিটেকচার ইন্টারভিউতে বারবার আসা প্রশ্ন — প্রতিটা আগের চ্যাপ্টারের রেফারেন্স দিয়ে।</p>

<h3>১) একটা low-level design সিদ্ধান্ত আর একটা architectural সিদ্ধান্তের মধ্যে পার্থক্য কীভাবে করবেন?</h3>
<p><b>উত্তর:</b> ১ নম্বর অধ্যায়ে দেখা মূল টেস্ট হলো <span class="kw">reversibility</span> — সিদ্ধান্তটা বদলাতে কয়টা টিম, কয়টা সার্ভিস, আর কতগুলো প্রোডাকশন ডেটাসেট ছুঁতে হবে। ভ্যারিয়েবলের নাম বদলানো বা একটা algorithm পাল্টানো একটা ফাইলের মধ্যেই সীমাবদ্ধ থাকে — এটা low-level design। কিন্তু সার্ভিসের সংখ্যা, primary data store, বা communication pattern (sync/async) বদলাতে হলে গোটা কোডবেস, deployment pipeline, আর লাইভ ডেটা জড়িয়ে যায় — এটা architectural সিদ্ধান্ত, আর এই ধরনের সিদ্ধান্তে ভুল হলে "Cost of Change Curve" অনুযায়ী পরে ঠিক করার খরচ exponentially বেড়ে যায়।</p>

<h3>২) দুইটা quality attribute একে অপরের বিপরীতে থাকলে (যেমন consistency বনাম availability) কীভাবে সিদ্ধান্ত নেবেন?</h3>
<p><b>উত্তর:</b> ২ নম্বর অধ্যায়ে দেখা ATAM চিন্তাভাবনা অনুযায়ী, প্রথমে বুঝতে হবে এই নির্দিষ্ট সিস্টেমের জন্য কোন attribute non-negotiable আর কোনটাতে ছাড় দেওয়া যাবে — এই সিদ্ধান্ত ব্যবসার প্রেক্ষাপট থেকে আসা উচিত, প্রযুক্তিগত পছন্দ থেকে না। একটা ব্যাংকিং লেজারে consistency জেতে (ভুল ব্যালেন্স বিপর্যয়কর), কিন্তু একটা সোশ্যাল ফিডে availability জেতে (কয়েক সেকেন্ড stale ডেটা কেউ খেয়াল করবে না, কিন্তু ধীর লোড ইউজার হারায়)। কোনো একটা "সঠিক" উত্তর নেই — শুধু একটা সচেতন, ব্যাখ্যাযোগ্য অগ্রাধিকার আছে।</p>

<h3>৩) Layered Architecture-এ "layer skipping" কী, আর এটা কেন বিপজ্জনক?</h3>
<p><b>উত্তর:</b> ৩ নম্বর অধ্যায়ে দেখা এই অ্যান্টি-প্যাটার্নে presentation layer সরাসরি data access layer-কে কল করে ফেলে, business logic layer বাইপাস করে — সাধারণত "এটা তো শুধু একটা সহজ read" যুক্তিতে। সমস্যা হলো এই শর্টকাট থামানো কঠিন হয়ে যায়, আর ধীরে ধীরে ব্যবসায়িক নিয়ম (authorization check, soft-delete filter) কিছু path-এ থাকে, কিছুতে না — কোন read কোন rule মেনে চলছে তা ট্র্যাক করা অসম্ভব হয়ে যায়।</p>

<h3>৪) Thick client-এ কেন security-critical validation রাখা উচিত না?</h3>
<p><b>উত্তর:</b> ৪ নম্বর অধ্যায়ে দেখা মূল কারণ — client-সাইড কোড ব্যবহারকারীর নিয়ন্ত্রণে থাকা একটা device-এ চলে, তাই সেখানে থাকা যেকোনো validation বা authorization logic browser devtools দিয়ে বা modified request পাঠিয়ে bypass করা সম্ভব। ক্লায়েন্ট-সাইড validation ভালো UX দেয় (তাৎক্ষণিক feedback), কিন্তু server-কে সবসময় সেই একই validation স্বাধীনভাবে আবার করতে হবে — client-কে বিশ্বাস না করে।</p>

<h3>৫) "Monolith" আর "Big Ball of Mud" কি সমার্থক শব্দ?</h3>
<p><b>উত্তর:</b> না — ৫ নম্বর অধ্যায়ে দেখা এই একটা গুরুত্বপূর্ণ পার্থক্য। Monolith মানে শুধু একটামাত্র deployment ইউনিট। "Big Ball of Mud" মানে কোডের ভেতরে কোনো discipline বা boundary নেই, যেকোনো ফাইল যেকোনো ফাইলকে সরাসরি কল করতে পারে। একটা monolith সুশৃঙ্খল internal module boundary নিয়েও বানানো যায় (Modular Monolith), অথবা সম্পূর্ণ বিশৃঙ্খলভাবেও বানানো যায় — সমস্যাটা deployment ইউনিট একটা হওয়া না, সমস্যা হলো internal discipline-এর অভাব।</p>

<h3>৬) একটা Modular Monolith-এ module boundary কীভাবে বলবৎ করা হয়, শুধু নিয়ম লিখে রাখলে কী সমস্যা হয়?</h3>
<p><b>উত্তর:</b> ৬ নম্বর অধ্যায়ে দেখা মূল সমস্যা — অলিখিত নিয়ম ("আমরা module-এর ভেতরে ঢুকব না") ডেডলাইনের চাপে ভেঙে পড়ে, একজন একটা shortcut নেয় আর সেটা precedent হয়ে যায়। সমাধান হলো boundary-কে বিল্ড-টাইমে automated enforcement দিয়ে বলবৎ করা — ভাষাগত visibility (Java package-private, .NET internal) অথবা ArchUnit/dependency-cruiser-এর মতো architecture test দিয়ে, যা violation হলে CI pipeline-এ বিল্ড ব্যর্থ করে দেয়।</p>

<h3>৭) SOA-তে Enterprise Service Bus (ESB) কেন নিজেই একটা bottleneck হয়ে দাঁড়ায়?</h3>
<p><b>উত্তর:</b> ৭ নম্বর অধ্যায়ে দেখা কারণ — routing, transformation, আর orchestration-এর সব জ্ঞান ESB-এর ভেতরে কেন্দ্রীভূত থাকত, যা একটা আলাদা, বিশেষায়িত টিম পরিচালনা করত। প্রতিটা টিমের প্রতিটা পরিবর্তনের অনুরোধ এই একই টিমের কাছে গিয়ে জমা হতো — এই একটা টিমের ক্যাপাসিটিই পুরো প্রতিষ্ঠানের ডেলিভারি গতির সিলিং হয়ে দাঁড়াত, ঠিক সেই সমন্বয়-বাধা যা SOA সার্ভিস-স্তরে সমাধান করতে চেয়েছিল তা ইন্টিগ্রেশন-স্তরে পুনরায় তৈরি হতো।</p>

<h3>৮) Monolith থেকে Microservices-এ যাওয়ার সিদ্ধান্ত কোন signal-এর ভিত্তিতে নেওয়া উচিত?</h3>
<p><b>উত্তর:</b> ৮ ও ৩৬ নম্বর অধ্যায়ে দেখা মূল কথা — এই সিদ্ধান্ত অনুমান থেকে না, প্রমাণিত প্রয়োজন থেকে আসা উচিত। তিনটা concrete signal দেখা যায়: (১) একটা নির্দিষ্ট module-এর scaling চাহিদা বাকি সিস্টেম থেকে স্পষ্টভাবে ভিন্ন; (২) একাধিক টিম একই কোডবেসে কাজ করে merge conflict-এ আটকে যাচ্ছে, আর টিম-বিভাজন ইতিমধ্যে স্পষ্ট business domain অনুযায়ী; (৩) একটা module-এর reliability/release cadence চাহিদা বাকিদের থেকে আলাদা। এই signal ছাড়া শুধু "microservices আধুনিক" ভেবে split করলে distributed monolith-এ পরিণত হওয়ার ঝুঁকি থাকে।</p>

<h3>৯) Conway's Law কী, আর এটা কীভাবে "distributed monolith" তৈরি করে?</h3>
<p><b>উত্তর:</b> ৮ নম্বর অধ্যায়ে দেখা Conway's Law বলে, একটা সংগঠন যে সিস্টেম ডিজাইন করে তা অনিবার্যভাবে সেই সংগঠনের যোগাযোগ-কাঠামোর প্রতিলিপি হয়ে দাঁড়ায়। যদি টিম-কাঠামো এখনো কেন্দ্রীভূত/coupled থাকে (সবাইকে সবসময় একে অপরের সাথে সমন্বয় করতে হয়), সেই একই সংগঠন microservices split করলেও সার্ভিসগুলো একে অপরের সাথে ঘনিষ্ঠভাবে জড়িয়ে থাকে — ফলাফল একটা distributed monolith, যেখানে network hop-এর latency ও অপারেশনাল জটিলতা যোগ হয়, কিন্তু স্বাধীন deployability-র সুবিধা পাওয়া যায় না।</p>

<h3>১০) Event-Driven Architecture একটা সিস্টেমকে ডিবাগ করা কঠিন করে তোলে কেন, এবং এটা কীভাবে সামলানো হয়?</h3>
<p><b>উত্তর:</b> Synchronous call chain-এ একটা request কোন পথে গিয়েছে তা একটামাত্র stack trace থেকেই বোঝা যায়। কিন্তু ৯ নম্বর অধ্যায়ে দেখা Event-Driven সিস্টেমে একটা event publish হওয়ার পর producer জানেও না কোন consumer কখন সেটা প্রসেস করবে — একটা bug রিপোর্ট এলে একাধিক service-এর আলাদা log একসাথে মেলাতে হয়। সমাধান হলো প্রতিটা event-এর সাথে একটা <code>correlation ID</code> প্রতিটা event/request-এর সাথে propagate করা এবং centralized distributed tracing tool (Jaeger, Zipkin) ব্যবহার করা।</p>

<h3>১১) Choreography আর Orchestration-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> ৯ নম্বর অধ্যায়ে দেখা — Choreography-তে কোনো কেন্দ্রীয় নিয়ন্ত্রক নেই, প্রতিটা service নিজের event শুনে নিজের কাজ করে পরের event publish করে; পুরো flow emergent, decoupling বেশি কিন্তু বোঝা কঠিন। Orchestration-এ একটা কেন্দ্রীয় orchestrator প্রতিটা ধাপ স্পষ্টভাবে নির্দেশ দেয় ও ক্রম নিয়ন্ত্রণ করে — বুঝতে সহজ, error-handling কেন্দ্রীভূত, কিন্তু orchestrator নিজে একটা কেন্দ্রীয় নির্ভরতা হয়ে দাঁড়ায়।</p>

<h3>১২) Ports & Adapters প্যাটার্নে কেন ইন্টারফেসটা domain layer-এ সংজ্ঞায়িত হয়, infrastructure layer-এ না?</h3>
<p><b>উত্তর:</b> ১০ নম্বর অধ্যায়ে দেখা মূল কারণ — এটাই Dependency Inversion Principle-এর architectural প্রয়োগ। যদি <code>OrderRepository</code> ইন্টারফেসটা infrastructure layer-এ ডিফাইন করা হতো, ডোমেইন কোডকে সেই infrastructure প্যাকেজ ইমপোর্ট করতে হতো, অর্থাৎ dependency বাইরের দিকে যেত — The Dependency Rule ভেঙে যেত। ইন্টারফেসের মালিকানা domain-এর হাতে রাখাই নিশ্চিত করে dependency সবসময় ভেতরের দিকে থাকে, আর একটা fake/in-memory adapter বসিয়ে domain logic কে ডেটাবেস-মুক্তভাবে টেস্ট করা যায়।</p>

<h3>১৩) Pipe-and-Filter আর্কিটেকচারে "backpressure" কেন জরুরি, বিশেষ করে streaming variant-এ?</h3>
<p><b>উত্তর:</b> ১১ নম্বর অধ্যায়ে দেখা কারণ — যদি একটা ডাউনস্ট্রিম filter আপস্ট্রিম filter-এর চেয়ে ধীরে ডেটা প্রসেস করে, আউটপুট বাফারে জমতে থাকে, আর সেই বাফার সসীম মেমরিতে চলা একটা প্রসেসকে একসময় আউট-অফ-মেমরি করে ফেলবে। Backpressure একটা মেকানিজম যাতে ধীর filter আপস্ট্রিমকে সংকেত দিতে পারে "একটু ধীরে দাও" — batch pipeline-এ এই সমস্যা কম গুরুত্বপূর্ণ (জব শেষ হতে দেরি হয় মাত্র), কিন্তু অবিরাম চলা streaming pipeline-এ এটা ছাড়া সিস্টেম ক্র্যাশ করবে।</p>

<h3>১৪) Space-Based Architecture কেন সাধারণ CRUD অ্যাপ্লিকেশনের জন্য উপযুক্ত না?</h3>
<p><b>উত্তর:</b> ১২ নম্বর অধ্যায়ে দেখা কারণ — এই প্যাটার্নের মূল্য আসে এমন পরিস্থিতিতে যেখানে ট্র্যাফিক extreme ও bursty (ফ্ল্যাশ সেল, টিকিট বিক্রি) এবং একটা কেন্দ্রীয় database প্রকৃতই ভেঙে পড়ার ঝুঁকিতে থাকে। একটা সাধারণ, predictable ট্র্যাফিকের CRUD অ্যাপ্লিকেশনে distributed in-memory data grid চালানোর অতিরিক্ত অপারেশনাল জটিলতা আর eventual consistency-র ঝুঁকি কোনো বাস্তব সুবিধা দেয় না — একটা সাধারণ database-কেন্দ্রিক আর্কিটেকচার সহজ ও যথেষ্ট।</p>

<h3>১৫) P2P সিস্টেমে বেশি peer যোগ দিলে throughput কমার বদলে বাড়ে কেন?</h3>
<p><b>উত্তর:</b> ১৩ নম্বর অধ্যায়ে দেখা কারণ — প্রচলিত client-server মডেলে বেশি client মানে একটা নির্দিষ্ট server-এর রিসোর্সের ওপর বেশি চাপ। কিন্তু BitTorrent-এর মতো P2P সিস্টেমে প্রতিটা নতুন peer শুধু চাহিদা যোগ করে না, নিজের upload bandwidth-ও নেটওয়ার্কে যোগ করে — তাই সামগ্রিক ক্যাপাসিটি চাহিদার সাথে সাথেই বাড়তে থাকে, এটাই P2P-এর সবচেয়ে বড় স্ট্রাকচারাল সুবিধা।</p>

<h3>১৬) Serverless-এ "cold start" কী, আর কোন ধরনের workload-এ এটা সবচেয়ে বেশি সমস্যা করে?</h3>
<p><b>উত্তর:</b> ১৪ নম্বর অধ্যায়ে দেখা — যেহেতু idle থাকা অবস্থায় কোনো function instance চলমান থাকে না, একটা নতুন invocation এলে প্ল্যাটফর্মকে প্রথমে একটা নতুন execution environment তৈরি করতে হয় (কনটেইনার বুট, runtime initialize) — এই বিলম্বই cold start। এটা সবচেয়ে বেশি সমস্যা করে latency-sensitive, ক্রমাগত-চালু workload-এ (উচ্চ-ট্রাফিক API-র p99 latency), কিন্তু স্পাইকি বা বিরল-ফ্রিকোয়েন্সি workload-এ এই খরচ cost efficiency-র বিনিময়ে গ্রহণযোগ্য।</p>

<h3>১৭) C4 Model-এ Level ৪ (Code diagram) হাতে আঁকা কেন অপচয় বলে বিবেচিত হয়?</h3>
<p><b>উত্তর:</b> ৩৫ নম্বর অধ্যায়ে দেখা কারণ — class-level diagram সবচেয়ে দ্রুত stale হয়ে যায়, একটা রিফ্যাক্টরেই ভুল হয়ে যেতে পারে। যেহেতু এই তথ্য কোডেই সম্পূর্ণভাবে বিদ্যমান, আধুনিক IDE সরাসরি বাস্তব কোড থেকে on-demand class diagram জেনারেট করতে পারে — তাই বেশিরভাগ টিম Level ৩ (Component) পর্যন্ত হাতে বানায়, Level ৪ প্রয়োজনে টুল দিয়ে জেনারেট করে নেয়।</p>

<h3>১৮) একটা ADR-এ "Status" ফিল্ড কেন গুরুত্বপূর্ণ?</h3>
<p><b>উত্তর:</b> ৩৫ নম্বর অধ্যায়ে দেখা কারণ — একটা ADR স্থায়ী সত্য না, এটা proposed থেকে accepted হতে পারে, পরে deprecated হতে পারে, বা নতুন কোনো ADR এসে সেটাকে superseded করতে পারে। এই status-চেইনটাই আর্কিটেকচারের evolution-এর একটা readable ইতিহাস তৈরি করে — কেউ একটা পুরনো ADR পড়ে বুঝতে পারেন এটা এখনও বলবৎ কিনা, আর বলবৎ না হলে কোন নতুন ADR সেটা replace করেছে।</p>

<h3>১৯) "Strangler Fig" migration pattern কী, আর এটা "বিগ ব্যাং rewrite"-এর চেয়ে কেন নিরাপদ?</h3>
<p><b>উত্তর:</b> ৩৬ নম্বর অধ্যায়ে দেখা এই পদ্ধতিতে একটা module ধাপে ধাপে বের করে আনা হয় — প্রথমে boundary perfect করা, তারপর আলাদা database প্রস্তুত করে dual-write/event দিয়ে sync করা, এরপর ট্র্যাফিকের একটা অংশ নতুন সার্ভিসে রুট করে যাচাই করা, সবশেষে পুরনো কোড সরানো। প্রতিটা ধাপে সিস্টেম সচল থাকে এবং সমস্যা হলে আগের ধাপে ফিরে যাওয়া সম্ভব — একটা বিগ ব্যাং rewrite-এ মাসের পর মাস কাজ করার পর একদিনে সব সুইচ করতে হয়, ব্যর্থ হলে ফিরে যাওয়ার পথ প্রায়ই থাকে না।</p>

<h3>২০) একজন ইন্টারভিউয়ার যদি জিজ্ঞাসা করেন "আপনি কোন আর্কিটেকচার বেছে নেবেন?", সবচেয়ে ভালো উত্তরের কাঠামো কী?</h3>
<p><b>উত্তর:</b> সবচেয়ে দুর্বল উত্তর একটা নির্দিষ্ট style-এর নাম বলে থেমে যাওয়া। সবচেয়ে শক্তিশালী উত্তরের কাঠামো (২ ও ৩৬ নম্বর অধ্যায়ে দেখা) হলো — প্রথমে স্পষ্ট করা কোন quality attribute এই সিস্টেমের জন্য সবচেয়ে গুরুত্বপূর্ণ (এবং কেন), তারপর সেই অগ্রাধিকারের সাথে কোন style সবচেয়ে ভালো মেলে তা বলা, এবং সবশেষে স্বীকার করা এই সিদ্ধান্তে কী ছাড় দেওয়া হচ্ছে ও ভবিষ্যতে কোন signal দেখলে সিদ্ধান্ত পুনর্বিবেচনা করা হবে। এই কাঠামোটাই দেখায় যে আপনি একটা মুখস্থ উত্তর দিচ্ছেন না, বরং সত্যিকারের trade-off reasoning করছেন — এবং শেষ পর্যন্ত এটাই এই পুরো কোর্সের কেন্দ্রীয় শিক্ষা।</p>

<h2 class="title">৩৯. Interview প্রশ্নোত্তর — Scalability ও Traffic Management</h2>
<p class="lead">এই টপিকগুলো নিয়ে ইন্টারভিউতে বারবার আসা প্রশ্ন — সংক্ষিপ্ত, সরাসরি উত্তরসহ।</p>

<h3>১) Vertical আর Horizontal Scaling-এর মধ্যে আপনি কীভাবে সিদ্ধান্ত নেবেন কোনটা ব্যবহার করবেন?</h3>
<p>প্রথমে vertical scaling দিয়ে শুরু করা উচিত কারণ এটা সহজ এবং কম জটিল। যখন হার্ডওয়্যার সীমায় পৌঁছে যাবেন, downtime এড়াতে চাইবেন, বা fault tolerance দরকার হবে, তখন horizontal scaling-এ যাওয়া উচিত — কিন্তু তার আগে সার্ভিসকে stateless বানানো একটা পূর্বশর্ত।</p>

<h3>২) Sticky Session কেন সাধারণত এড়িয়ে চলা উচিত?</h3>
<p>এটা horizontal scaling-এর মূল সুবিধা (যেকোনো request যেকোনো server-এ যেতে পারা) নষ্ট করে দেয়, load unevenly বিতরণ করতে পারে, এবং সেই নির্দিষ্ট server ডাউন হলে ইউজার সেশন হারিয়ে ফেলে। এর বদলে centralized session store (Redis) বা token-based auth (JWT) ব্যবহার করা উচিত।</p>

<h3>৩) Layer 4 আর Layer 7 Load Balancing-এর মধ্যে মূল পার্থক্য কী, এবং কখন কোনটা বেছে নেবেন?</h3>
<p>L4 শুধু IP/port দেখে রুট করে (দ্রুত, কম CPU), L7 HTTP content (URL, header, cookie) দেখে রুট করে (স্মার্ট routing, বেশি CPU)। Microservices-এ path-based routing দরকার হলে L7 আবশ্যক; উচ্চ-throughput, প্রোটোকল-অজ্ঞেয় (protocol-agnostic) ট্র্যাফিকে L4 যথেষ্ট।</p>

<h3>৪) Consistent Hashing কী সমস্যা সমাধান করে?</h3>
<p>সাধারণ modulo hashing-এ backend সংখ্যা বদলালে প্রায় সব key নতুন backend-এ চলে যায় (cache-এর ক্ষেত্রে বিপর্যয়কর)। Consistent Hashing একটা hash ring ব্যবহার করে node যোগ/বাদ দিলে শুধু আশেপাশের সামান্য অংশ প্রভাবিত হয়, বাকি সব key তাদের আগের mapping-এই থাকে।</p>

<h3>৫) API Gateway আর Load Balancer-এর মধ্যে পার্থক্য কী?</h3>
<p>Load Balancer একাধিক identical backend instance-এর মধ্যে ট্র্যাফিক বিতরণ করে — এটা backend-এর business logic সম্পর্কে সচেতন না। API Gateway একটা উঁচু স্তরের abstraction — এটা রুট, auth, rate limit, aggregation-এর মতো API-level concern সামলায়, এবং একাধিক ভিন্ন সার্ভিসের মধ্যে সিদ্ধান্ত নেয় কোনটা কোথায় যাবে।</p>

<h3>৬) API Gateway আর Service Mesh একসাথে কেন ব্যবহার করা হয়?</h3>
<p>Gateway North-South ট্র্যাফিক (বাইরে থেকে ভেতরে) সামলায়, Service Mesh East-West ট্র্যাফিক (সার্ভিস-টু-সার্ভিস) সামলায় — mTLS, internal retry, internal load balancing, observability। দুটো ভিন্ন সমস্যার সমাধান, তাই একসাথে থাকা স্বাভাবিক, একে অপরের বিকল্প না।</p>

<h3>৭) একটা URI ডিজাইন করার সময় কোন কোন নীতি মেনে চলা উচিত?</h3>
<p>URI resource (noun) নির্দেশ করবে, action (verb) না — action HTTP method দিয়ে প্রকাশ হয় (<code>GET /orders/42</code>, <code>getOrder?id=42</code> না)। Plural resource নাম, সীমিত nesting depth (৩ স্তরের বেশি না), এবং filtering/sorting query parameter দিয়ে করা উচিত, আলাদা path দিয়ে না।</p>

<h3>৮) Offset-based আর Cursor-based Pagination-এর মধ্যে পার্থক্য কী, এবং বড় স্কেলে কোনটা ভালো?</h3>
<p>Offset-based pagination (<code>?offset=100&limit=20</code>) ডেটাবেসকে প্রতিবার শুরু থেকে গণনা করে বাদ দিতে হয়, তাই বড় offset-এ ধীর হয়ে যায় এবং concurrent insert-এ item দ্বৈত/অনুপস্থিত দেখাতে পারে। Cursor-based pagination একটা indexed reference থেকে পরের সেট খুঁজে বের করে, যা ডেটার আকার নির্বিশেষে দ্রুত ও স্থিতিশীল — এই কারণেই বড় স্কেলের সিস্টেমে এটা পছন্দনীয়।</p>

<h3>৯) কোন পরিবর্তন একটা API-তে "breaking" হিসেবে গণ্য হয়, আর কোনটা না?</h3>
<p>নতুন optional ফিল্ড বা endpoint যোগ করা non-breaking — পুরনো client সেটা উপেক্ষা করবে। বিদ্যমান ফিল্ড মুছে ফেলা, ফিল্ডের নাম/টাইপ বদলানো, একটা optional ফিল্ডকে required করা, বা কোনো endpoint সরিয়ে ফেলা — এগুলো breaking, কারণ পুরনো client-এর কোড এসবের ওপর নির্ভর করে থাকতে পারে এবং crash করতে পারে।</p>

<h3>১০) API Versioning-এর চারটা প্রধান কৌশল কী কী, এবং বাস্তবে কোনটা সবচেয়ে বেশি ব্যবহৃত হয়?</h3>
<p>URI Path (<code>/v2/orders</code>), Query Parameter (<code>?version=2</code>), Custom Header (<code>Api-Version: 2</code>), এবং Media Type/Content Negotiation (<code>Accept: application/vnd.company.v2+json</code>)। বাস্তবে URI Path versioning সবচেয়ে বেশি ব্যবহৃত হয় কারণ এটা স্পষ্ট, ডিবাগ করা সহজ, এবং Gateway routing-এ সরাসরি ব্যবহার করা যায় — যদিও Media Type versioning সবচেয়ে "খাঁটি" RESTful পদ্ধতি হিসেবে বিবেচিত হয়।</p>

<h3>১১) একটা পুরনো API ভার্সন responsibly deprecate করার প্রক্রিয়া কী?</h3>
<p><code>Deprecation</code> header দিয়ে ঘোষণা করা, <code>Sunset</code> header দিয়ে (RFC 8594) সুনির্দিষ্ট বন্ধ হওয়ার তারিখ জানানো, যথেষ্ট migration সময় দেওয়া, sunset-এর আগে পুরনো ভার্সনের actual ব্যবহার monitor করা, এবং একটা স্পষ্ট migration guide প্রকাশ করা — হঠাৎ বন্ধ না করে।</p>

<h3>১২) কেন POST স্বভাবতই idempotent না, কিন্তু PUT idempotent?</h3>
<p>PUT পুরো resource প্রতিস্থাপন করে — একই ডেটা দিয়ে একাধিকবার PUT করলে একই ফলাফল হয়। POST সাধারণত একটা নতুন resource তৈরি করে, প্রতিবার নতুন unique ID জেনারেট করে — তাই দুইবার একই POST চালালে দুইটা ভিন্ন resource তৈরি হয়ে যায়।</p>

<h3>১৩) Idempotency Key pattern কীভাবে কাজ করে, একটা duplicate request কীভাবে ধরা পড়ে?</h3>
<p>Client একটা unique key জেনারেট করে request-এর সাথে পাঠায়; retry হলেও একই key ব্যবহার করে। Server প্রথমবার সেই key-এর সাথে response সংরক্ষণ করে; একই key দিয়ে পরের request এলে business logic আবার না চালিয়ে সংরক্ষিত response ফেরত দেয়। Key-lookup ও reservation অবশ্যই atomic হতে হবে, নাহলে দুইটা concurrent duplicate একসাথে "key নেই" দেখে দুইবারই প্রসেস করে ফেলতে পারে।</p>

<h3>১৪) Optimistic আর Pessimistic Concurrency Control-এর মধ্যে পার্থক্য কী, এবং কখন কোনটা বেছে নেবেন?</h3>
<p>Pessimistic locking আগে থেকেই row lock করে রাখে (<code>SELECT FOR UPDATE</code>) — high-conflict পরিস্থিতিতে নির্ভরযোগ্য কিন্তু throughput কমায়। Optimistic locking একটা version কলাম দিয়ে conflict শুধু update-এর সময় যাচাই করে, conflict কম থাকলে ভালো throughput দেয় কিন্তু high-conflict-এ বারবার retry লাগে।</p>

<h3>১৫) Database Isolation Level-গুলো কী কী সমস্যা প্রতিরোধ করে?</h3>
<p>Read Uncommitted কিছুই প্রতিরোধ করে না; Read Committed dirty read প্রতিরোধ করে; Repeatable Read এর সাথে non-repeatable read-ও প্রতিরোধ করে; Serializable সব anomaly (dirty, non-repeatable, phantom read) প্রতিরোধ করে কিন্তু সবচেয়ে বেশি concurrency খরচ করে।</p>

<h3>১৬) Distributed Lock-এ TTL এবং fencing token কেন দরকার?</h3>
<p>TTL না থাকলে lock ধারণকারী process crash করলে lock চিরস্থায়ী আটকে থাকবে (deadlock)। Fencing token GC pause বা network delay-এর কারণে একটা "পুরনো" lock holder ভুলবশত এখনও কাজ চালিয়ে যাওয়া থেকে রক্ষা করে — resource শুধু সর্বশেষ, সবচেয়ে বড় token গ্রহণ করে।</p>

<h3>১৭) Event Loop (Node.js/async মডেল) কেন থ্রেড-পার-রিকোয়েস্ট মডেলের চেয়ে বেশি concurrent connection সামলাতে পারে?</h3>
<p>বেশিরভাগ ওয়েব রিকোয়েস্ট I/O-bound — বেশিরভাগ সময় network/DB response-এর জন্য অপেক্ষায় কাটে। Thread-per-request মডেলে সেই অপেক্ষার সময় থ্রেড অলসভাবে ব্লক থাকে, মেমোরি নষ্ট করে। Event loop মডেলে সেই সময়ে একই থ্রেড অন্য শত শত request এগিয়ে নেয়, তাই একই হার্ডওয়্যারে অনেক বেশি concurrent connection সামলানো যায়।</p>

<h3>১৮) Token Bucket আর Leaky Bucket rate limiting অ্যালগরিদমের পার্থক্য কী?</h3>
<p>Token Bucket burst traffic সহ্য করতে পারে (বালতি ভরা থাকলে একসাথে অনেক request পাস হতে পারে), গড় হার নিয়ন্ত্রণ করে। Leaky Bucket output rate সম্পূর্ণ constant/smooth রাখে, burst সহ্য করে না — downstream-এ predictable rate পাঠানোর জন্য উপযুক্ত।</p>

<h3>১৯) Fixed Window rate limiting-এর boundary burst সমস্যা কী, এবং কীভাবে সমাধান হয়?</h3>
<p>একজন client উইন্ডোর শেষে এবং পরের উইন্ডোর শুরুতে দ্রুত পরপর রিকোয়েস্ট পাঠিয়ে কার্যত দ্বিগুণ সীমা ব্যবহার করে ফেলতে পারে। Sliding Window Log (নির্ভুল কিন্তু মেমোরি-ভারী) বা Sliding Window Counter (আনুমানিক কিন্তু হালকা) দিয়ে এই সমস্যা সমাধান করা হয়।</p>

<h3>২০) Distributed Rate Limiting-এ কেন একটা shared store (যেমন Redis) দরকার, এবং সেখানে race condition কীভাবে এড়ানো হয়?</h3>
<p>সার্ভিস horizontal ভাবে scaled হলে প্রতিটা instance-এর আলাদা in-memory counter দিয়ে client ভিন্ন instance-এ request পাঠিয়ে সীমা এড়িয়ে যেতে পারবে। তাই counter Redis-এর মতো shared store-এ রাখতে হয়, এবং "চেক + বৃদ্ধি" ধাপ Lua script দিয়ে atomic করে race condition এড়ানো হয়।</p>

<h3>২১) একটা "place order" API-তে scaling, load balancing, gateway, idempotency, concurrency, আর rate limiting — এই ছয়টা concept একসাথে কীভাবে কাজ করে, সংক্ষেপে বলুন।</h3>
<p>Gateway auth ও rate limit যাচাই করে সঠিক সার্ভিসে রুট করে; Load Balancer সেই সার্ভিসের একাধিক stateless instance-এর মধ্যে ট্র্যাফিক ভাগ করে; সার্ভিস idempotency key দিয়ে duplicate retry ঠেকায়; stock update-এর সময় optimistic locking দিয়ে concurrent request-এর race condition এড়ায়; আর পুরো সিস্টেম horizontal scaling ও caching/replication দিয়ে বাড়তে থাকা ট্র্যাফিক সামলায়।</p>
</template>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
<script src="progress.js"></script>
</body>
</html>
