<h3>Page Cache</h3>
<p>Read-write দুই-ই RAM (page cache) থেকে হয় বেশিরভাগ সময়। Recent data সবসময় cache-এ, তাই consumer disk hit করে না। (Storage ট্যাব দেখুন।)</p>

<h3>Batching ও Compression</h3>
<p>Producer batch করে network round-trip কমায়; compressed batch broker-এ compressed অবস্থায়ই থাকে, disk+network দুটোই বাঁচে; consumer নিজে decompress করে — broker CPU বাঁচে।</p>

<h3>Partition Parallelism</h3>
<p>Throughput scale করে partition দিয়ে। বেশি partition = বেশি parallel producer/consumer/disk। কিন্তু অতিরিক্ত partition = বেশি open file, বেশি metadata, ধীর leader election — তাই ভারসাম্য দরকার।</p>

<h3>Network ও Memory Optimization</h3>
<ul>
<li><b>Long polling fetch:</b> consumer <code>fetch.min.bytes</code>/<code>fetch.max.wait.ms</code> দিয়ে ছোট ছোট request না পাঠিয়ে বড় batch আনে।</li>
<li><b>Binary protocol:</b> কাস্টম efficient TCP protocol, কম overhead।</li>
<li><b>Off-heap page cache:</b> JVM GC pressure কম (data heap-এ না থাকায়)।</li>
</ul>
<div class="callout best"><span class="tag">Tuning cheat-sheet</span>
Throughput চাইলে: বড় <code>batch.size</code>, <code>linger.ms&gt;0</code>, <code>compression=lz4/zstd</code>, <code>fetch.min.bytes</code> বাড়ান, partition বাড়ান। Latency চাইলে: <code>linger.ms=0</code>, <code>fetch.min.bytes=1</code>, ছোট batch।</div>
</template>

<template data-page="reliability">
<h2 class="title">৯. Reliability — Delivery Guarantees</h2>
<p class="lead">At-most-once, at-least-once, exactly-once — Kafka internally কীভাবে অর্জন করে।</p>

<h3>At-Most-Once</h3>
<p>Message ০ বা ১ বার — কখনো duplicate না, কিন্তু হারাতে পারে।</p>
<ul>
<li><b>Producer:</b> <code>acks=0</code> বা <code>1</code>, retry কম/নেই।</li>
<li><b>Consumer:</b> process-এর <b>আগে</b> offset commit → crash হলে message process ছাড়াই বাদ।</li>
</ul>
<p>ব্যবহার: metrics, log, যেখানে দু-একটা message হারালেও সমস্যা নেই।</p>

<h3>At-Least-Once (সবচেয়ে বেশি ব্যবহৃত)</h3>
<p>Message কমপক্ষে ১ বার — কখনো হারায় না, কিন্তু duplicate হতে পারে।</p>
<ul>
<li><b>Producer:</b> <code>acks=all</code> + retries।</li>
<li><b>Consumer:</b> process-এর <b>পরে</b> offset commit → crash হলে reprocess (তাই duplicate)।</li>
</ul>
<div class="callout best"><span class="tag">সবচেয়ে practical পথ</span>
At-least-once + <b>idempotent consumer</b> = কার্যত exactly-once effect, কিন্তু full Kafka transaction-এর জটিলতা ছাড়া। Accounting system-এ এটাই সাধারণত সেরা (Production ট্যাব দেখুন)।</div>

<h3>Exactly-Once (EOS)</h3>
<p>Message ঠিক ১ বার effect ফেলে — না হারায়, না duplicate। Kafka এটা অর্জন করে দুটো জিনিস দিয়ে:</p>
<ol>
<li><b>Idempotent producer</b> (<code>enable.idempotence=true</code>) — retry-তে broker duplicate write বাদ দেয়।</li>
<li><b>Transactions</b> — read-process-write atomic। Consumer offset commit আর output produce একই transaction-এ। <code>isolation.level=read_committed</code> consumer শুধু committed message পড়ে।</li>
</ol>
<div class="diagram"><pre>
Consume-Transform-Produce (Exactly-Once within Kafka):

  producer.initTransactions()
  while(true):
    records = consumer.poll()
    producer.beginTransaction()
      process(records) → producer.send(outputTopic, result)
      producer.sendOffsetsToTransaction(offsets, groupId)  ← offset ও output একসাথে
    producer.commitTransaction()   // সব atomic — নয়তো abort
</pre></div>
<div class="callout behind"><span class="tag">commitTransaction() abort হলে output topic-এ কী থাকে?</span>
স্বাভাবিক ধারণা হলো abort হলে লেখা message-গুলো "মুছে" যায় — বাস্তবে তা হয় <b>না</b>, Kafka log append-only, কিছুই মাঝপথে মুছে না। <code>commitTransaction()</code>/<code>abortTransaction()</code> শেষে broker প্রতিটা involved partition-এ একটা ছোট <span class="kw">control record</span> (COMMIT বা ABORT marker) লেখে। Transaction-এর ভেতরের data record আগে থেকেই log-এ physically বসে থাকে — marker শুধু বলে সেগুলো valid নাকি বাতিল। <code>isolation.level=read_committed</code> consumer এই marker না দেখা পর্যন্ত সেই transaction-এর record buffer করে রাখে, ABORT marker পেলে সেগুলো skip করে, COMMIT marker পেলে deliver করে — এজন্যই read_committed-এ সামান্য বাড়তি latency লাগে (marker-এর অপেক্ষা)। Default <code>read_uncommitted</code> consumer marker-ই বোঝে না — commit/abort নির্বিশেষে সব data record সাথে সাথে দেখে, তাই financial pipeline-এ read_committed ছাড়া exactly-once ভাঙে।</div>
<div class="callout mistake"><span class="tag">গুরুত্বপূর্ণ সীমাবদ্ধতা</span>
Kafka-র exactly-once শুধু <b>Kafka-থেকে-Kafka</b> (Kafka Streams) ক্ষেত্রে পুরোপুরি কাজ করে। যদি output একটা <b>external system</b> (যেমন PostgreSQL) হয়, তাহলে Kafka transaction একা যথেষ্ট নয় — external side-এ idempotency (unique key) বা Inbox/Outbox pattern লাগবে। এটাই আপনার accounting integration-এর মূল বিষয়।</div>

<table>
<tr><th>Guarantee</th><th>Producer</th><th>Consumer</th><th>ব্যবহার</th></tr>
<tr><td>At-most-once</td><td>acks=0/1</td><td>commit before process</td><td>metrics, logs</td></tr>
<tr><td>At-least-once</td><td>acks=all + retries</td><td>commit after process</td><td>বেশিরভাগ business event</td></tr>
<tr><td>Exactly-once</td><td>idempotent + txn</td><td>read_committed + txn offset</td><td>financial (Kafka-to-Kafka)</td></tr>
</table>
</template>

<template data-page="scaling">
<h2 class="title">১০. Scaling — Kafka কীভাবে বড় হয়</h2>
<p class="lead">Broker, partition, producer, consumer যোগ করলে internally কী ঘটে।</p>

<h3>Adding Brokers</h3>
<p>নতুন broker cluster-এ join করলে সে খালি আসে — পুরনো partition আপনাআপনি তার উপর যায় না। <code>kafka-reassign-partitions</code> দিয়ে কিছু partition/replica নতুন broker-এ move করতে হয়। তখন সেই broker follower হয়ে data replicate করে নেয়, তারপর ভার ভাগ করে।</p>
<div class="callout mistake"><span class="tag">Common mistake</span>
নতুন broker যোগ করে ভাবা যে load নিজে থেকেই ভাগ হবে — হয় না। Reassignment না করলে নতুন broker শুধু নতুন topic/partition-এর কাজ পাবে, পুরনো hot partition-এ কিছু হবে না।</div>

<h3>Adding Partitions</h3>
<p>Partition বাড়ানো যায় (<code>kafka-topics --alter --partitions</code>), কিন্তু:</p>
<ul>
<li>Partition <b>কমানো যায় না</b>।</li>
<li>Partition বাড়ালে key→partition mapping (<code>hash%N</code>) বদলে যায় → একই key নতুন message-এ ভিন্ন partition-এ যেতে পারে → <b>ordering guarantee ভাঙে</b>।</li>
</ul>
<div class="callout best"><span class="tag">Best practice</span>
শুরুতেই ভবিষ্যতের throughput ধরে বেশি partition রাখুন (over-provision), যাতে পরে বাড়াতে না হয়। ordering গুরুত্বপূর্ণ হলে partition count বদলানো এড়িয়ে চলুন।</div>

<h4>কতগুলো Partition? — একটা কাজের formula</h4>
<p>Partition count মূলত দুটো জিনিসের সর্বোচ্চটা দিয়ে ঠিক হয় — throughput চাহিদা আর দরকারি consumer parallelism:</p>
<div class="callout"><b>Partitions ≈ max( T/p<sub>p</sub> , T/c<sub>p</sub> )</b><br>
এখানে <code>T</code> = target throughput, <code>p<sub>p</sub></code> = একটা partition-এ producer যত দ্রুত লিখতে পারে, <code>c<sub>p</sub></code> = একটা consumer যত দ্রুত process করতে পারে।</div>
<p><b>Worked example (accounting):</b> ধরুন target <code>T = 60,000 msg/s</code>। একটা consumer আপনার DB-write সহ process করতে পারে <code>c<sub>p</sub> = 5,000 msg/s</code>। তাহলে অন্তত <code>60,000 / 5,000 = 12</code> partition লাগবে (১২টা consumer parallel চালানোর জন্য)। ভবিষ্যতে ২× বৃদ্ধির কথা ভেবে <b>24</b> রাখা যুক্তিসঙ্গত।</p>
<table>
<tr><th>বিবেচ্য</th><th>নির্দেশনা</th></tr>
<tr><td>খুব কম partition</td><td>consumer parallelism সীমিত → throughput আটকে যায়</td></tr>
<tr><td>খুব বেশি partition</td><td>বেশি open file/memory, ধীর leader election, বেশি end-to-end latency, বড় rebalance</td></tr>
<tr><td>বাস্তব সীমা</td><td>প্রতি broker কয়েক হাজার partition পর্যন্ত ঠিক (KRaft-এ আরও বেশি); cluster-wide lakhs সম্ভব</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
"যত বেশি partition তত ভালো" ভাবা। অতিরিক্ত partition end-to-end latency বাড়ায় (প্রতিটার replication/flush overhead) আর broker fail হলে recovery ধীর করে। প্রয়োজনের চেয়ে সামান্য বেশি রাখুন, অগণিত নয়।</div>

<h3>Consumer Scaling</h3>
<p>একই group-এ consumer বাড়িয়ে parallel processing scale করা যায় — সর্বোচ্চ partition সংখ্যা পর্যন্ত। এর বেশি consumer idle। তাই effective consumer parallelism = partition count।</p>

<h3>Producer Scaling</h3>
<p>Producer stateless-ish, অনেকগুলো instance একসাথে চালানো যায়। Broker leader-ভিত্তিক load ভাগ হয় partition দিয়ে। Producer scale করতে সাধারণত partition যথেষ্ট থাকলেই হয়।</p>

<h3>Rebalancing (scaling-এর সময়)</h3>
<p>Consumer add/remove করলে rebalance হয়ে partition পুনর্বণ্টন হয়। Cooperative Sticky Assignor ব্যবহার করলে এই rebalance-এ downtime কম (Consumer ট্যাব দেখুন)।</p>

<div class="diagram"><pre>
Scaling summary:
  বেশি throughput?   → বেশি partition + বেশি consumer (group-এ)
  বেশি storage/HA?   → বেশি broker + reassignment
  Hot partition?     → key design বদলান বা partition বাড়ান (ordering trade-off সহ)
</pre></div>
</template>

<template data-page="failure">
<h2 class="title">১১. Failure Scenarios — internally কী ঘটে</h2>
<p class="lead">প্রতিটা failure-এ Kafka ঠিক কী করে, আর কীভাবে recover করে।</p>

<h3>Producer crash করলে</h3>
<p>In-flight, un-acked message হারাতে পারে। Idempotent producer + <code>acks=all</code> থাকলে যেগুলো ack পেয়েছে সেগুলো durable। App restart হলে আবার শুরু করে। Transaction চললে incomplete transaction abort হয়।</p>

<h3>Broker crash করলে</h3>
<p>সেই broker-এর leader partition-গুলোর জন্য ISR থেকে নতুন leader (Replication ট্যাবে বিস্তারিত)। <code>UnderReplicatedPartitions</code> বাড়ে যতক্ষণ না broker ফিরে catch-up করে। RF≥3 + minISR=2 থাকলে service চলতে থাকে।</p>

<h3>Consumer crash করলে</h3>
<p><code>session.timeout.ms</code>-এর মধ্যে heartbeat না পেলে coordinator তাকে dead ধরে rebalance ট্রিগার করে — তার partition বাকি consumer-দের মধ্যে ভাগ হয়। শেষ commit করা offset থেকে নতুন consumer শুরু করে (তাই at-least-once-এ কিছু reprocess হতে পারে)।</p>

<h3>Leader crash করলে</h3>
<p>Controller তাৎক্ষণিক ISR থেকে নতুন leader করে। HW-এর নিচের data safe। HW-এর উপরের (uncommitted) data হারাতে পারে — কিন্তু consumer সেগুলো কখনো দেখেইনি, তাই consistency ভাঙে না।</p>

<h3>Network partition (split-brain ঝুঁকি)</h3>
<p>Controller quorum (KRaft) majority ধরে রাখা অংশ কাজ চালায়; minority অংশ leader হতে পারে না। ISR shrink হয়; minISR পূর্ণ না হলে সেই partition-এ write reject। এতে দুই দিকে দুই leader (split-brain) হওয়া ঠেকানো হয়।</p>

<h3>Disk full হলে</h3>
<p>Broker সেই log directory-তে write করতে পারে না → সেই disk-এর partition offline। ISR থেকে বাদ, অন্য broker-এ leader shift। প্রতিরোধ: retention ঠিক রাখা, disk usage alert, একাধিক log dir।</p>

<h3>Broker restart হলে</h3>
<p>Broker উঠে log recovery করে (শেষ segment-এর integrity check, unflushed data verify)। তারপর follower হিসেবে rejoin, catch-up, ISR-এ ফেরে। Graceful shutdown হলে leadership আগেই সরিয়ে নেওয়া হয় (কম disruption)।</p>

<h3>ISR minimum-এর নিচে নামলে — write blocked (কিন্তু read চলে)</h3>
<p>যথেষ্ট broker down হয়ে ISR যদি <code>min.insync.replicas</code>-এর নিচে নামে (যেমন RF=3, minISR=2, কিন্তু ২টা broker down → ISR=1), তখন <code>acks=all</code> producer <code>NotEnoughReplicasException</code> পায় — <b>write আটকে যায়</b>। কিন্তু consumer পড়তে পারে (partition readable)। এটা ইচ্ছাকৃত ডিজাইন: Kafka data হারানোর চেয়ে write থামানো পছন্দ করে। Recovery: broker ফিরে ISR পূর্ণ হলে write আবার চালু।</p>

<h3>Consumer offset out of range — data মেয়াদ শেষে হারানো</h3>
<p>Consumer অনেকক্ষণ down থাকলে বা এত পিছিয়ে পড়লে যে তার next offset-এর data ইতিমধ্যে retention-এ মুছে গেছে — তখন সে <code>OffsetOutOfRangeException</code> পায়। এরপর <code>auto.offset.reset</code> ঠিক করে কী হবে: <code>latest</code> হলে মাঝের সব unconsumed data <b>skip</b> (নীরব data loss!), <code>earliest</code> হলে একদম শুরু থেকে (বিশাল reprocess)।</p>
<div class="callout mistake"><span class="tag">নীরব data loss</span>
Retention &lt; consumer এর সম্ভাব্য downtime হলে data চুপচাপ হারায়। প্রতিরোধ: consumer lag monitor + alert (Operations ট্যাব), retention যথেষ্ট বড় রাখা, দীর্ঘ downtime এড়ানো।</div>

<h3>Coordinator failure (group / transaction)</h3>
<p>প্রতিটা consumer group-এর একটা broker <span class="kw">group coordinator</span> — যে broker ঐ group-এর <code>__consumer_offsets</code> partition-এর leader। সেই broker down হলে offset commit সাময়িক ব্যর্থ হয়, নতুন coordinator নির্বাচিত হওয়া পর্যন্ত (কয়েক সেকেন্ড)। একইভাবে transaction-এর <span class="kw">transaction coordinator</span> (<code>__transaction_state</code>)। Recovery স্বয়ংক্রিয় — client metadata refresh করে নতুন coordinator খুঁজে নেয়।</p>

<h3>Producer buffer full — backpressure</h3>
<p>Broker ধীর বা down হলে producer-এর <code>buffer.memory</code> ভরে যায়। তখন <code>send()</code> <code>max.block.ms</code> পর্যন্ত block করে, এরপর <code>TimeoutException</code> throw করে। এটা backpressure signal — broker আপনার produce rate ধরতে পারছে না। সমাধান: capacity বাড়ান (partition/broker) বা producer rate কমান/retry-backoff দিন।</p>

<h3>Message too large</h3>
<p>Message client-এর <code>max.request.size</code> বা topic-এর <code>max.message.bytes</code>-এর বেশি হলে <code>RecordTooLargeException</code> — reject। বড় payload (file/image/big JSON) Kafka-তে সরাসরি পাঠাবেন না; object storage (S3)-এ রেখে শুধু reference/URL পাঠান — এটাই <span class="kw">claim-check pattern</span>।</p>

<h3>Poison message — partition আটকে যাওয়া (head-of-line blocking)</h3>
<p>একটা message বারবার process fail করলে (bad schema, business rule violation) consumer যদি offset commit না করে অসীম retry করে, তাহলে সেই partition-এর পেছনের <b>সব</b> message আটকে থাকে — একটা খারাপ message পুরো partition থামিয়ে দেয়। সমাধান: নির্দিষ্টবার retry-র পর message DLQ-তে পাঠিয়ে offset এগিয়ে নিন (Production ট্যাব দেখুন)।</p>

<h3>Producer retries exhausted → message dropped</h3>
<p><code>delivery.timeout.ms</code>-এর মধ্যে retry-র পরও ack না এলে producer message drop করে delivery callback-এ error দেয়। এই error ignore করলে <b>নীরব data loss</b>। সবসময় callback/exception handle করুন — DLQ বা local persist করে পরে re-send করুন।</p>

<h3>পুরো Zone / Cluster outage — Disaster Recovery</h3>
<p>একটা broker নয়, পুরো availability zone বা data center down হলে?</p>
<ul>
<li><b>Rack awareness</b> (<code>broker.rack</code>): Kafka replica-গুলো আলাদা rack/AZ-তে ছড়ায়, যাতে এক AZ down হলেও প্রতিটা partition-এর অন্তত এক replica বাঁচে। Multi-AZ cluster-এ এটা must।</li>
<li><b>Multi-region DR</b>: <span class="kw">MirrorMaker 2</span> (বা Confluent Replicator) দিয়ে অন্য region-এ async replicate করুন — primary region হারালে DR region-এ failover।</li>
</ul>
<div class="callout best"><span class="tag">Financial-এ RPO/RTO</span>
ঠিক করুন কতটা data হারানো সহনীয় (<b>RPO</b>) আর কত দ্রুত ফিরতে হবে (<b>RTO</b>)। Accounting-এ সাধারণত multi-AZ minimum; critical ledger data হলে multi-region async replication + নিয়মিত DR drill।</div>

<h3>Controller quorum loss (KRaft)</h3>
<p>KRaft-এ controller quorum majority হারালে (যেমন ৩ controller-এর ২টা down) কোনো <b>metadata পরিবর্তন</b> সম্ভব নয় — leader election, topic create, config change থেমে যায় (control plane freeze)। তবে existing leader-রা data serve করতে থাকে (data plane চলে)। Recovery: controller quorum majority ফিরলে স্বাভাবিক। প্রতিরোধ: controller-দের আলাদা AZ-তে রাখুন।</p>

<h3>Rebalance storm</h3>
<p>Consumer বারবার <code>max.poll.interval.ms</code> পার করলে (ধীর processing) coordinator তাকে বারবার remove করে → অবিরাম rebalance, group কার্যত থমকে যায়। সমাধান: <code>max.poll.records</code> কমান, processing দ্রুত/async করুন, CooperativeStickyAssignor + static membership ব্যবহার করুন (Consumer ট্যাব)।</p>

<h3>সারসংক্ষেপ</h3>
<table>
<tr><th>Failure</th><th>প্রভাব</th><th>Recovery / প্রতিরোধ</th></tr>
<tr><td>Producer crash</td><td>un-acked হারাতে পারে</td><td>restart + idempotence</td></tr>
<tr><td>Broker crash</td><td>leader shift, under-replicated</td><td>ISR election, catch-up</td></tr>
<tr><td>Consumer crash</td><td>rebalance, কিছু reprocess</td><td>last committed offset থেকে</td></tr>
<tr><td>Leader crash</td><td>uncommitted হারাতে পারে</td><td>ISR থেকে নতুন leader</td></tr>
<tr><td>Network partition</td><td>minority-তে write reject</td><td>quorum-ভিত্তিক, split-brain রোধ</td></tr>
<tr><td>Disk full</td><td>partition offline</td><td>disk clear + rejoin</td></tr>
<tr><td>ISR &lt; minISR</td><td>write blocked (read চলে)</td><td>broker ফিরে ISR পূর্ণ হলে</td></tr>
<tr><td>Offset out of range</td><td>নীরব data loss / massive replay</td><td>lag monitor + বড় retention</td></tr>
<tr><td>Coordinator failure</td><td>commit সাময়িক ব্যর্থ</td><td>স্বয়ংক্রিয় re-election</td></tr>
<tr><td>Producer buffer full</td><td>send() block → timeout</td><td>capacity বাড়ান / rate কমান</td></tr>
<tr><td>Message too large</td><td>reject</td><td>claim-check (object storage)</td></tr>
<tr><td>Poison message</td><td>partition আটকে যায়</td><td>retry limit + DLQ</td></tr>
<tr><td>Retries exhausted</td><td>নীরব data loss (callback ignore করলে)</td><td>callback handle + DLQ</td></tr>
<tr><td>Zone/cluster outage</td><td>বড় unavailability</td><td>rack awareness + MirrorMaker DR</td></tr>
<tr><td>Controller quorum loss</td><td>control plane freeze</td><td>quorum ফিরলে; controllers আলাদা AZ</td></tr>
<tr><td>Rebalance storm</td><td>group থমকে যায়</td><td>poll tune + static membership</td></tr>
</table>
</template>

<template data-page="ecosystem">
<h2 class="title">১২. Ecosystem — Kafka শুধু broker নয়</h2>
<p class="lead">Kafka Connect, Debezium/CDC, Kafka Streams, ksqlDB, আর Schema Registry — production-এ এগুলোই Kafka-কে সম্পূর্ণ করে। আপনার DB-driven accounting-এর জন্য বিশেষভাবে প্রাসঙ্গিক।</p>

<h3>Kafka Connect</h3>
<p><span class="kw">Kafka Connect</span> হলো external system-এর সাথে Kafka যুক্ত করার একটা framework — কোড না লিখেই। দুই ধরনের connector:</p>
<ul>
<li><b>Source connector:</b> external system → Kafka (যেমন PostgreSQL → topic)।</li>
<li><b>Sink connector:</b> Kafka → external system (যেমন topic → Elasticsearch/S3/DB)।</li>
</ul>
<div class="callout why"><span class="tag">কেন কোডের বদলে Connect?</span>
Scaling, offset management, retry, fault tolerance, schema handling — সব Connect framework সামলায় (distributed worker mode)। নিজে producer/consumer লিখলে এগুলো বারবার নিজে করতে হয়। তবে custom business logic দরকার হলে নিজের consumer-ই ভালো।</div>

<h3>MirrorMaker 2 — Cross-cluster Replication ও DR</h3>
<p>Failure ট্যাবে "Zone/Cluster outage"-এর সমাধানে <span class="kw">MirrorMaker 2</span>-র নাম এসেছিল — এখানে দেখুন এটা আসলে কী। MirrorMaker 2 নিজেও একটা Kafka Connect-based tool: এটা এক cluster-এর topic (data + configs + ACL + consumer offset) ক্রমাগত পড়ে অন্য cluster-এ produce করে — অর্থাৎ cross-cluster replication।</p>
<table>
<tr><th>মডেল</th><th>কীভাবে</th><th>ব্যবহার</th></tr>
<tr><td><span class="kw">Active-Passive</span></td><td>Primary cluster-এ সব traffic; DR cluster শুধু replica হিসেবে বসে থাকে</td><td>সাধারণ disaster recovery</td></tr>
<tr><td><span class="kw">Active-Active</span></td><td>দুই cluster-ই traffic নেয়, একে অপরকে mirror করে</td><td>geo-distributed low-latency access</td></tr>
</table>
<div class="callout mistake"><span class="tag">Offset Translation — সবচেয়ে ভুল বোঝা অংশ</span>
সাধারণ ধারণা: DR cluster-এ failover করলে consumer সেখানে গিয়ে ঠিক আগের মতোই offset থেকে পড়া শুরু করবে। বাস্তবে <b>না</b> — target cluster-এ প্রতিটা partition আলাদাভাবে, আলাদা offset-এ replicate হয় (source-এর offset 5000 মানে target-এ ঠিক 5000 নয়)। MirrorMaker 2 এই mapping একটা <code>__consumer_offsets</code>-সদৃশ internal topic-এ রাখে আর <code>RemoteClusterUtils</code>/checkpoint দিয়ে translate করতে হয়। এটা না জেনে সরাসরি একই offset দিয়ে target cluster-এ consume শুরু করলে হয় data miss হয়, নয়তো বিশাল duplicate reprocess হয়।</div>

<h3>Debezium ও CDC (Change Data Capture)</h3>
<p><span class="kw">CDC</span> মানে database-এর প্রতিটা row change (insert/update/delete) ধরে event বানানো। <span class="kw">Debezium</span> একটা জনপ্রিয় source connector যা PostgreSQL-এর <span class="kw">WAL (Write-Ahead Log)</span> পড়ে প্রতিটা DB change-কে Kafka topic-এ পাঠায় — <b>polling ছাড়াই, near real-time</b>।</p>
<div class="diagram"><pre>
PostgreSQL  ──WAL──►  Debezium (Kafka Connect source)  ──►  Kafka topic
 (ledger table)         (logical replication slot)          (dbserver.public.ledger)

আপনার app শুধু DB-তে লেখে; event stream আপনাআপনি তৈরি হয়।
</pre></div>
<div class="callout best"><span class="tag">Accounting-এ CDC কেন গুরুত্বপূর্ণ</span>
Dual-write সমস্যা (DB + Kafka দুটোতে আলাদা লেখা) এড়ানোর একটা উপায় — শুধু DB-তে লিখুন, Debezium সেটা থেকে event বানাবে। এটাই Outbox pattern-এর ভিত্তি (Production ট্যাবে বিস্তারিত)।</div>

<h3>Schema Registry</h3>
<p>Producer আর consumer message format নিয়ে একমত থাকা দরকার। <span class="kw">Schema Registry</span> (Confluent) Avro/Protobuf/JSON schema কেন্দ্রীয়ভাবে রাখে; message-এ পুরো schema না পাঠিয়ে শুধু একটা ছোট <b>schema ID</b> পাঠানো হয়।</p>
<h4>Compatibility modes — schema evolution</h4>
<table>
<tr><th>Mode</th><th>মানে</th><th>নিরাপদ পরিবর্তন</th></tr>
<tr><td><code>BACKWARD</code></td><td>নতুন schema দিয়ে পুরনো data পড়া যায়</td><td>field বাদ, optional field যোগ</td></tr>
<tr><td><code>FORWARD</code></td><td>পুরনো schema দিয়ে নতুন data পড়া যায়</td><td>field যোগ, optional field বাদ</td></tr>
<tr><td><code>FULL</code></td><td>দুই দিকেই compatible</td><td>শুধু optional field যোগ/বাদ</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
Schema Registry ছাড়া JSON string পাঠানো, তারপর producer field-এর নাম বদলালে সব consumer ভেঙে যায়। Financial data-তে <code>FULL</code> বা <code>BACKWARD</code> compatibility enforce করুন।</div>

<h3>Kafka Streams</h3>
<p><span class="kw">Kafka Streams</span> একটা Java library — Kafka-থেকে-Kafka stream processing-এর জন্য (filter, join, aggregate, windowing)। এটা আলাদা cluster লাগে না, আপনার app-এর ভেতরেই চলে। stateful operation-এর জন্য <span class="kw">state store</span> (RocksDB) + changelog topic ব্যবহার করে, আর exactly-once (EOS) সমর্থন করে।</p>
<p>উদাহরণ: প্রতি account-এর running balance real-time হিসাব করা, বা fraud detection window। <b>নোট:</b> এটা JVM-কেন্দ্রিক; .NET-এ সরাসরি নেই — .NET-এ সাধারণত নিজের consumer + DB দিয়ে aggregation করা হয়।</p>
<div class="callout why"><span class="tag">changelog topic কেন লাগে</span>
State store (RocksDB) app instance-এর নিজের local disk-এ থাকে — সেই disk হারালে (crash, pod reschedule নতুন node-এ) running balance/window state-ও হারিয়ে যেত। তাই Streams state store-এ প্রতিটা change একই সাথে একটা internal <span class="kw">changelog topic</span>-এও লেখে — এটা অনেকটা database-এর WAL-এর মতো। Instance crash করে নতুন জায়গায় উঠলে খালি RocksDB নিয়ে শুরু না করে changelog topic থেকে replay করে আগের state পুনর্গঠন করে নেয়। এজন্যই Streams-এর "local" state আসলে হারায় না — এটা durable, শুধু recovery-তে সময় লাগে (topic যত বড়, replay তত দীর্ঘ)।</div>

<h3>ksqlDB</h3>
<p><span class="kw">ksqlDB</span> দিয়ে SQL-এর মতো ভাষায় stream processing করা যায় — <code>CREATE STREAM ... SELECT ... FROM ... WHERE ...</code>। Kafka Streams-এর উপরে বসা একটা layer, দ্রুত prototyping-এর জন্য ভালো।</p>

<div class="diagram"><pre>
পুরো ছবিতে Kafka ecosystem:

  [DB/App]──Connect(source)──►[ KAFKA ]──Connect(sink)──►[Warehouse/ES/DB]
                                  │
                         Streams / ksqlDB (process, join, aggregate)
                                  │
                          Schema Registry (format contract)
</pre></div>
</template>

<template data-page="security">
<h2 class="title">১৩. Security — financial data-র জন্য অপরিহার্য</h2>
<p class="lead">Security একটা স্তর নয় — <b>defense in depth</b>: network → transport → authentication → authorization → encryption at rest → payload encryption → governance। Financial/accounting data-তে প্রতিটা স্তর দরকার, কারণ যেকোনো একটা স্তর বাদ পড়লে data উন্মুক্ত।</p>

<h3>Defense in Depth — স্তরে স্তরে সুরক্ষা</h3>
<p>নিচের diagram-এ দেখুন প্রতিটা control কোন স্তরে বসে। বাইরের স্তরগুলো (network, TLS) সাধারণ; কিন্তু ভেতরের স্তর — বিশেষ করে <b>payload (field-level) encryption</b> — প্রায়ই বাদ পড়ে, অথচ এটাই broker/insider থেকে সবচেয়ে বড় সুরক্ষা।</p>

<h3>১. Encryption in Transit — SSL/TLS</h3>
<p>Default-এ Kafka traffic plaintext — কেউ network-এ আড়ি পাতলে সব transaction দেখতে পারবে। <span class="kw">SSL/TLS</span> চালু করলে broker ও client-এর মধ্যে সব যোগাযোগ encrypted। এটা on-wire encryption; disk-এ data encrypt করে না (তার জন্য disk-level encryption যেমন LUKS/dm-crypt লাগবে)।</p>

<h3>২. Authentication — কে সংযোগ করছে?</h3>
<table>
<tr><th>পদ্ধতি</th><th>বিবরণ</th><th>কখন</th></tr>
<tr><td><span class="kw">SASL/SCRAM</span></td><td>username/password (salted, hashed)</td><td>বেশিরভাগ setup-এ ভালো ডিফল্ট</td></tr>
<tr><td><span class="kw">mTLS</span> (SSL auth)</td><td>client certificate দিয়ে পরিচয়</td><td>service-to-service, কড়া নিরাপত্তা</td></tr>
<tr><td><span class="kw">SASL/GSSAPI</span></td><td>Kerberos</td><td>enterprise/AD পরিবেশে</td></tr>
<tr><td><span class="kw">SASL/OAUTHBEARER</span></td><td>OAuth2 token</td><td>modern token-based auth</td></tr>
<tr><td><code>SASL/PLAIN</code></td><td>plain username/password</td><td>শুধু TLS-এর সাথে (নাহলে অরক্ষিত)</td></tr>
</table>

<h3>৩. Authorization — কে কী করতে পারবে? (ACL)</h3>
<p><span class="kw">ACL (Access Control List)</span> দিয়ে ঠিক করা হয় কোন principal কোন topic-এ read/write/create করতে পারবে। যেমন: <code>billing-service</code> শুধু <code>accounting.*</code> topic পড়তে পারবে, লিখতে পারবে না।</p>
<pre><span class="c"># উদাহরণ ACL: শুধু read অনুমতি</span>
kafka-acls --add \
  --allow-principal User:billing-service \
  --operation Read --topic accounting.invoice.created \
  --group billing-service</pre>

<h3>৪. Encryption at Rest</h3>
<p>Kafka নিজে disk-এ data encrypt করে না — broker-এর log segment plaintext bytes হিসেবে থাকে। সমাধান <span class="kw">volume/disk-level encryption</span>: LUKS/dm-crypt, অথবা cloud-এ AWS EBS encryption / GCP CMEK / Azure disk encryption। এতে disk চুরি হলে, snapshot leak হলে, বা hardware decommission হলে data অরক্ষিত থাকে না।</p>
<div class="callout mistake"><span class="tag">গুরুত্বপূর্ণ সীমাবদ্ধতা</span>
Volume encryption broker process-এর কাছে <b>transparent</b> — অর্থাৎ broker (ও যার broker/OS access আছে: ops, cloud admin, বা broker compromise করা attacker) তখনও plaintext দেখে। এটা "disk চুরি" ঠেকায়, কিন্তু insider বা compromised broker ঠেকায় না। সেজন্য পরের স্তর দরকার।</div>

<h3>৫. Field-level / End-to-End Encryption — সবচেয়ে গুরুত্বপূর্ণ (প্রায়ই বাদ পড়ে)</h3>
<p>TLS (in transit) + volume encryption (at rest) — দুটোই থাকলেও data broker-এর RAM (page cache) আর log-এ <b>plaintext</b>। যার broker/disk access আছে, সে account number, PII পড়তে পারে। PCI-DSS/PII compliance-এ এটা যথেষ্ট নয়।</p>
<p>সমাধান: sensitive field গুলো <b>producer-এ encrypt</b> করে পাঠান, <b>consumer-এ decrypt</b> করুন — broker মাঝখানে শুধু ciphertext দেখে (true end-to-end)।</p>
<div class="diagram"><pre>
Producer: encrypt(account_no) ─► [ Broker শুধু ciphertext দেখে ] ─► Consumer: decrypt(account_no)
                    ▲                                                          ▲
              data key (per-message)  ◄──── KMS master key দিয়ে wrap/unwrap ───►
              (envelope encryption)          (AWS KMS / Vault / GCP KMS)
</pre></div>
<p><span class="kw">Envelope encryption</span>: প্রতি message-এর জন্য একটা data key দিয়ে field encrypt করা হয়, সেই data key আবার KMS-এর master key দিয়ে wrap করে message-এর সাথে পাঠানো হয়। Consumer KMS থেকে master key দিয়ে data key unwrap করে decrypt করে।</p>
<div class="callout best"><span class="tag">Best practice</span>
<ul style="margin:4px 0">
<li>পুরো payload নয় — শুধু sensitive field (account no, card, NID) encrypt করুন, যাতে routing/analytics-এর জন্য বাকি field ব্যবহারযোগ্য থাকে।</li>
<li>.NET-এ AES-GCM (authenticated encryption) + AWS KMS/Azure Key Vault দিয়ে নিজে করা যায়; Confluent-এ built-in <span class="kw">CSFLE (Client-Side Field Level Encryption)</span> আছে।</li>
<li>Key rotation policy রাখুন; কখনো encryption key কোডে/repo-তে রাখবেন না।</li>
</ul></div>

<h3>৬. Inter-broker ও Component Security</h3>
<p>Client↔broker secure করাই যথেষ্ট নয় — কয়েকটা প্রায়ই ভুলে যাওয়া পথ:</p>
<ul>
<li><b>Broker↔broker replication:</b> follower একই sensitive data টেনে নেয়। <code>security.inter.broker.protocol=SSL</code> (বা SASL_SSL) সেট করুন।</li>
<li><b>KRaft controller quorum:</b> controller traffic-ও secure listener-এ রাখুন।</li>
<li><b>Schema Registry / Kafka Connect / REST Proxy:</b> প্রতিটার নিজস্ব TLS + auth দরকার — এগুলোও data দেখে/সরায়।</li>
<li><b>Connect secrets:</b> connector config-এ password থাকে — <code>config.providers</code> দিয়ে externalize করুন (Vault/env), plaintext config-এ নয়।</li>
</ul>

<h3>৭. Client Quotas — abuse ও DoS ঠেকান</h3>
<p>একটা rogue বা buggy client পুরো cluster saturate করে বাকিদের starve করতে পারে — availability-ও security-র অংশ। <span class="kw">Quota</span> দিয়ে per-principal produce/fetch/request rate সীমিত করুন।</p>
<pre><span class="c"># billing-service কে সর্বোচ্চ 10 MB/s produce + 10 MB/s fetch এ সীমাবদ্ধ</span>
kafka-configs --alter --add-config \
  'producer_byte_rate=10485760,consumer_byte_rate=10485760' \
  --entity-type clients --entity-name billing-service --bootstrap-server broker:9092</pre>

<h3>৮. Data Governance ও Compliance (GDPR / PII)</h3>
<p>Kafka append-only ও immutable — তাই একজন ব্যক্তির data "মুছে ফেলা" (GDPR right to be forgotten) কঠিন। কৌশল:</p>
<table>
<tr><th>কৌশল</th><th>কীভাবে</th></tr>
<tr><td>কম retention</td><td>PII topic-এ retention ছোট রাখুন — নিজে থেকেই মুছে যায়</td></tr>
<tr><td>Tombstone + compaction</td><td>key-ভিত্তিক compacted topic-এ ঐ key-তে <code>null</code> value পাঠান → key মুছে যায়</td></tr>
<tr><td><span class="kw">Crypto-shredding</span></td><td>প্রতি subject/user-এর data আলাদা key দিয়ে encrypt; delete করতে হলে সেই key মুছুন → ciphertext চিরতরে অপাঠ্য (immutable log-এও কার্যকর "delete")</td></tr>
<tr><td>Data classification</td><td>কোন topic-এ PII/financial data আছে ট্যাগ করুন, সেই অনুযায়ী control প্রয়োগ করুন</td></tr>
</table>
<div class="callout best"><span class="tag">Accounting-এ</span>
Audit/ledger data প্রায়ই regulatory কারণে বছরের পর বছর রাখতে হয় — কিন্তু তার মধ্যে থাকা PII আলাদা key দিয়ে encrypt করুন, যাতে দরকারে crypto-shred করা যায় অথচ financial record অক্ষত থাকে।</div>

<h3>৯. Network Segmentation ও Listeners</h3>
<p>Broker-কে private subnet/VPC-তে রাখুন — public internet-এ কখনো expose করবেন না। Internal (inter-broker) আর external (client) traffic-এর জন্য আলাদা <code>listeners</code> (আলাদা port + protocol) ব্যবহার করুন, আর firewall/security group দিয়ে শুধু পরিচিত client CIDR allow করুন।</p>

<h3>Client config উদাহরণ (SASL/SCRAM + TLS, .NET)</h3>
<pre>var config = new ConsumerConfig {
    BootstrapServers = "broker:9093",
    SecurityProtocol = SecurityProtocol.SaslSsl,   <span class="c">// TLS + SASL</span>
    SaslMechanism    = SaslMechanism.ScramSha512,
    SaslUsername     = "billing-service",
    SaslPassword     = Environment.GetEnvironmentVariable("KAFKA_PASSWORD"),
    SslCaLocation    = "/etc/kafka/ca.pem",
    GroupId          = "billing-service",
};</pre>

<div class="callout best"><span class="tag">Financial-grade best practices</span>
<ul style="margin:4px 0">
<li>সবসময় <code>SASL_SSL</code> — TLS ছাড়া SASL/PLAIN কখনো নয়; inter-broker traffic-ও secure করুন।</li>
<li>প্রতি service-এর আলাদা principal + least-privilege ACL (শুধু যা দরকার) + quota।</li>
<li>Password/secret কোডে নয় — env var / secret manager (Vault, AWS Secrets Manager); Connect-এ config providers।</li>
<li>Sensitive field (PII, account number) <b>field-level encrypt</b> করুন — broker যেন শুধু ciphertext দেখে।</li>
<li>Audit log রাখুন — কে কখন কোন topic access করল (authorizer log)।</li>
<li>TLS certificate rotation policy রাখুন (expiry monitor + auto-renew); mTLS-এ short-lived cert ভালো।</li>
<li>PII-এর জন্য crypto-shredding-এর সুযোগ রাখুন (per-subject key), যাতে GDPR delete সম্ভব হয়।</li>
</ul></div>
<div class="callout mistake"><span class="tag">Common mistake</span>
Dev-এ security ছাড়া চালিয়ে production-এ deploy করে ভুলে যাওয়া। Financial system-এ open (PLAINTEXT) broker মানে যে কেউ সব transaction পড়তে/লিখতে পারবে।</div>
</template>

<template data-page="production">
<h2 class="title">১৫. Production-Grade Accounting Integration (.NET + PostgreSQL)</h2>
<p class="lead">আপনার background (.NET, PostgreSQL, event-driven accounting) ধরে — একটা reliable Kafka integration কীভাবে ডিজাইন করবেন: Inbox Pattern, idempotency, retry, DLQ, offset management।</p>

<h3>মূল সমস্যা: dual-write</h3>
<p>Accounting-এ আপনি প্রায়ই Kafka থেকে event পড়ে PostgreSQL-এ ledger/transaction লেখেন। বিপদ: "DB-তে লিখলাম কিন্তু offset commit হলো না" (→ duplicate) বা "offset commit হলো কিন্তু DB লেখা fail" (→ data loss)। দুটো আলাদা system atomic-ভাবে update করা যায় না।</p>

<h3>সমাধান: Inbox Pattern + Idempotency</h3>
<div class="diagram"><pre>
Consumer flow (at-least-once + idempotent):

 Kafka poll(record with unique event_id / key)
        │
        ▼
 BEGIN TRANSACTION (PostgreSQL)
   ① INSERT INTO inbox(event_id) -- PRIMARY KEY / UNIQUE
        │
        ├─ conflict (already exists)? → duplicate, skip business logic
        │
   ② business logic: INSERT INTO ledger / update balance
 COMMIT TRANSACTION
        │
        ▼
 commitSync(offset)  -- DB commit হওয়ার পরেই
</pre></div>
<p>মূল ধারণা: প্রতিটা event-এর একটা <b>unique key</b> (event_id) থাকে। সেটা <code>inbox</code> table-এ PRIMARY KEY। একই event দুবার এলে দ্বিতীয়বার <code>INSERT</code> conflict করবে → আপনি জানেন এটা duplicate, business logic skip করবেন। এভাবে at-least-once delivery-ও <b>effectively exactly-once</b> হয়ে যায় DB-র দিক থেকে।</p>

<div class="callout best"><span class="tag">কেন Inbox, Kafka transaction নয়?</span>
Kafka-র exactly-once transaction PostgreSQL-এ পৌঁছায় না (external system)। DB-তে unique-key idempotency অনেক সহজ, debuggable, এবং আপনার existing PostgreSQL transaction-এর সাথেই atomic। এটাই accounting-এ standard।</div>

<h4>Code — Idempotent Inbox Consumer (.NET + PostgreSQL)</h4>
<pre>while (!ct.IsCancellationRequested) {
    var cr = consumer.Consume(ct);
    var eventId = cr.Message.Key;                 <span class="c">// unique event id</span>

    await using var tx = await conn.BeginTransactionAsync(ct);

    <span class="c">// ① idempotency guard — একই event আগে এলে rowsAffected = 0</span>
    var rows = await conn.ExecuteAsync(
        "INSERT INTO inbox(event_id, processed_at) VALUES(@id, now()) " +
        "ON CONFLICT (event_id) DO NOTHING",
        new { id = eventId }, tx);

    if (rows == 1) {                              <span class="c">// নতুন event — business logic চালাও</span>
        var invoice = JsonSerializer.Deserialize&lt;Invoice&gt;(cr.Message.Value);
        await ApplyToLedgerAsync(invoice, conn, tx);
    }
    <span class="c">// rows == 0 → duplicate, skip (নিরাপদে)</span>

    await tx.CommitAsync(ct);                      <span class="c">// DB atomic commit</span>
    consumer.Commit(cr);                           <span class="c">// তারপরেই offset commit</span>
}</pre>
<div class="callout behind"><span class="tag">Crash হলে কী হয়</span>
DB commit হয়েছে কিন্তু <code>consumer.Commit()</code>-এর আগে crash → পরের বার একই message আসবে → কিন্তু <code>inbox</code>-এ <code>event_id</code> আগে থেকেই আছে → <code>rows = 0</code> → business logic skip। ফলে ledger-এ double-entry হয় না। এটাই at-least-once-কে effectively exactly-once বানায়।</div>

<h3>Offset Management — সঠিক ক্রম</h3>
<ol>
<li><code>enable.auto.commit=false</code> — কখনো auto-commit নয় financial-এ।</li>
<li>DB transaction <b>COMMIT সফল হওয়ার পরে</b> <code>commitSync()</code>।</li>
<li>DB commit ও offset commit-এর মাঝে crash হলে? → message reprocess হবে, কিন্তু inbox unique-key তা duplicate হিসেবে ধরে skip করবে। নিরাপদ।</li>
</ol>

<h3>Outbox Pattern — event <b>publish</b> করার নিরাপদ উপায়</h3>
<p>Inbox pattern হলো <b>consume</b> করার সময় idempotency-র জন্য। এর উল্টোটা — যখন আপনার accounting service নিজে event <b>publish</b> করে (যেমন "invoice paid") — তখন আসে সেই dual-write সমস্যাই: "DB-তে ledger লিখলাম কিন্তু Kafka-তে publish fail" বা উল্টো। <span class="kw">Outbox pattern</span> এটা সমাধান করে।</p>
<div class="diagram"><pre>
এক-ই PostgreSQL transaction এর ভেতরে:

 BEGIN TRANSACTION
   ① INSERT INTO ledger(...)             -- business data
   ② INSERT INTO outbox(id, topic, key, payload, created_at)  -- event ও একই txn এ
 COMMIT                                   -- দুটো একসাথে atomic (একই DB)

 তারপর আলাদা relay:
   Debezium (CDC) / polling publisher  outbox row পড়ে ──► Kafka topic
                                        ──► published হলে row delete/mark
</pre></div>
<div class="callout why"><span class="tag">কেন কাজ করে</span>
Business data আর event একই DB transaction-এ যায় — হয় দুটোই commit, নয় দুটোই rollback। কখনো "DB আছে কিন্তু event নেই" হয় না। এরপর relay (Debezium বা একটা background publisher) outbox থেকে Kafka-তে at-least-once পাঠায়। Consumer-এর দিকে Inbox/idempotency থাকায় duplicate নিরাপদ। <b>Outbox (publish) + Inbox (consume) = পুরো chain-এ zero data loss।</b></div>

<h3>Retry Strategy</h3>
<ul>
<li><b>Transient error</b> (DB deadlock, temporary network): কয়েকবার in-place retry (exponential backoff)।</li>
<li><b>Non-transient / poison message</b> (bad schema, business rule fail): infinite retry করবেন না — নাহলে পুরো partition আটকে যাবে ("head-of-line blocking")।</li>
<li>Pattern: <b>retry topic</b> — fail হলে message একটা <code>orders.retry</code> topic-এ পাঠান, delay দিয়ে আবার চেষ্টা; নির্দিষ্ট বার fail করলে DLQ-তে।</li>
</ul>

<h3>Dead Letter Queue (DLQ)</h3>
<p>যে message নির্দিষ্টবার retry-র পরও process হয় না, সেটা একটা <code>orders.dlq</code> topic-এ পাঠান — original payload + error reason + stack trace + timestamp সহ। এতে main flow আটকায় না, আর আপনি পরে DLQ inspect/replay করতে পারেন।</p>
<div class="diagram"><pre>
 orders ──poll──► process
                    │ fail (transient)
                    ├──────────────► orders.retry (delay, backoff) ──► আবার process
                    │ fail (retries exhausted / poison)
                    └──────────────► orders.dlq (manual review + replay)
</pre></div>

<h3>Recommended Config (financial-grade)</h3>
<pre><span class="c"># Producer (যদি আপনি event publish-ও করেন)</span>
acks=all
enable.idempotence=true
retries=Integer.MAX
max.in.flight.requests.per.connection=5
compression.type=lz4

<span class="c"># Topic</span>
replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false   <span class="c"># durability &gt; availability</span>

<span class="c"># Consumer</span>
enable.auto.commit=false
isolation.level=read_committed
partition.assignment.strategy=CooperativeStickyAssignor
max.poll.records=100                    <span class="c"># DB batch এর সাথে মানানসই</span></pre>

<h3>.NET-নির্দিষ্ট টিপস</h3>
<ul>
<li>Client: <b>Confluent.Kafka</b> (librdkafka-based) — production-ready, .NET-এ standard।</li>
<li>Consume loop-এ DB write আর <code>consumer.Commit(offset)</code> নিজে হাতে করুন (manual)।</li>
<li>Idempotency store: PostgreSQL <code>inbox</code> table + <code>INSERT ... ON CONFLICT DO NOTHING</code> দিয়ে duplicate detection।</li>
<li>Graceful shutdown: <code>SIGTERM</code>-এ চলমান batch শেষ করে, offset commit করে, তারপর <code>consumer.Close()</code> — যাতে rebalance পরিষ্কার হয়।</li>
</ul>

<h3>১) Partition কী, আর একটা topic-এ একাধিক partition কেন লাগে?</h3>
<p><b>ব্যাখ্যা:</b> Topic একটা logical stream; সেটা ভাগ হয় কয়েকটা <span class="kw">partition</span>-এ — প্রতিটা independent, ordered, append-only log (Architecture ট্যাব)। Partition-ই parallelism-এর একক: producer একাধিক partition-এ একসাথে লিখতে পারে, আর একটা consumer group-এর একাধিক consumer partition ভাগ করে নিয়ে parallel পড়তে পারে। Ordering guarantee শুধু একটা partition-এর ভেতরে থাকে — পুরো topic জুড়ে নয়।</p>

<h3>২) Offset কী, আর এটা কে track করে — broker না consumer?</h3>
<p><b>ব্যাখ্যা:</b> Offset হলো একটা partition-এ প্রতিটা message-এর sequential position। Traditional queue-তে broker consumer-এর progress track করে; Kafka-তে উল্টো — <span class="kw">consumer নিজে</span> তার offset track করে এবং <code>__consumer_offsets</code> internal topic-এ commit করে (Foundation ও Consumer ট্যাব)। এই ডিজাইনের কারণেই একাধিক consumer group একই data স্বাধীনভাবে, নিজের নিজের গতিতে পড়তে পারে এবং প্রয়োজনে পুরনো offset-এ ফিরে গিয়ে data <b>replay</b> করা যায়।</p>

<h3>৩) Consumer group কীভাবে কাজ করে — একটা partition একসাথে দুইজন consumer পড়তে পারে কি?</h3>
<p><b>ব্যাখ্যা:</b> না। একই <code>group.id</code>-এর মধ্যে একটা partition ঠিক <b>একটা</b> consumer পড়ে — এভাবেই কাজ ভাগ (load balancing) হয় (Consumer ট্যাব)। তবে ভিন্ন group-এর consumer একই partition স্বাধীনভাবে পড়তে পারে (fan-out)। Consumer সংখ্যা partition সংখ্যার বেশি হলে অতিরিক্ত consumer idle বসে থাকে, কারণ ভাগ করার মতো আর partition অবশিষ্ট থাকে না।</p>
<pre>Topic orders (4 partitions), Group billing (2 consumers)
  Consumer A → P0, P1
  Consumer B → P2, P3
  <span class="c">// ৩য় consumer যোগ করলে rebalance হয়ে ভাগ পুনর্বণ্টন হবে, কমপক্ষে একটা consumer এখনো ২টা partition পাবে</span></pre>

<h3>৪) acks=0, acks=1, আর acks=all-এর মধ্যে পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> <code>acks</code> ঠিক করে producer কখন একটা write "সফল" ধরবে (Producer ও Internal Working ট্যাব)। <code>acks=0</code>-এ কোনো confirmation ছাড়াই সফল ধরা হয় — সবচেয়ে দ্রুত কিন্তু data হারানোর ঝুঁকি সবচেয়ে বেশি। <code>acks=1</code>-এ শুধু leader লিখলেই যথেষ্ট — leader replicate করার আগে crash করলে message হারায়। <code>acks=all</code> (<code>-1</code>)-এ সব ISR replica লিখলে তবেই সফল — সবচেয়ে নিরাপদ, <code>min.insync.replicas</code>-এর সাথে মিলিয়ে ব্যবহার করা হয়।</p>

<h3>৫) ISR (In-Sync Replicas) কী, আর min.insync.replicas ঠিক কী করে?</h3>
<p><b>ব্যাখ্যা:</b> <span class="kw">ISR</span> হলো সেই follower-দের সেট যারা leader-এর সাথে <code>replica.lag.time.max.ms</code>-এর মধ্যে sync আছে (Replication ট্যাব)। <code>min.insync.replicas=2</code> (RF=3-এ) মানে <code>acks=all</code> write সফল হতে অন্তত ২টা replica (leader সহ) লেখা লাগবে। ISR এই সংখ্যার নিচে নামলে producer <code>NotEnoughReplicasException</code> পায় — Kafka নীরবে data হারানোর চেয়ে write আটকে দেওয়া পছন্দ করে।</p>

<h3>৬) High Watermark (HW) কী, আর consumer কেন এর বেশি offset পড়তে পারে না?</h3>
<pre>Leader:      [0][1][2][3][4][5]   ← LEO = 6 (leader-এর শেষ offset)
Follower1:   [0][1][2][3][4]
Follower2:   [0][1][2][3]
                          ▲
                 High Watermark = 4 (সব ISR-এ replicate হওয়া সর্বোচ্চ offset)
<span class="c">// consumer শুধু offset 0-3 পড়তে পারে; 4,5 এখনো "uncommitted"</span></pre>
<p><b>ব্যাখ্যা:</b> HW হলো সেই সর্বোচ্চ offset যা সব ISR replica-তে পৌঁছেছে (Replication ট্যাব)। Consumer শুধু HW পর্যন্তই পড়তে পারে, কারণ এর নিচের data guaranteed durable — leader crash করলেও নতুন leader (কোনো ISR replica) সেই data-সহই আসবে। HW-এর ওপরের data consumer কখনো দেখেই না, তাই leader crash হয়ে সেটা হারালেও consistency ভাঙে না।</p>

<h3>৭) Leader epoch কী, আর এটা কোন সমস্যা সমাধান করে?</h3>
<p><b>ব্যাখ্যা:</b> Leader বদলানোর সময় পুরনো Kafka-তে follower নিজের log leader-এর HW পর্যন্ত blindly truncate করত — কিন্তু বিরল crash-sequence-এ (leader দ্রুত পরপর বদলালে) এটা replica-দের মধ্যে silent log divergence ঘটাতে পারত (Replication ট্যাব)। <span class="kw">Leader epoch</span> সমাধান দেয়: প্রতিবার নতুন leader নির্বাচিত হলে একটা monotonically increasing সংখ্যা বাড়ে, আর leader প্রতিটা offset range ঠিক কোন epoch-এ লেখা হয়েছে সেটা <code>leader-epoch-checkpoint</code> ফাইলে track করে। Follower rejoin করার সময় <code>OffsetsForLeaderEpoch</code> API দিয়ে leader-কে জিজ্ঞেস করে ঠিক কোথায় নিরাপদে truncate করা যাবে — blind truncation নয়।</p>

<h3>৮) Unclean leader election কী, আর financial data-তে এটা off রাখা হয় কেন?</h3>
<p><b>ব্যাখ্যা:</b> Leader ও সব ISR down হয়ে গেলে, <code>unclean.leader.election.enable=true</code> থাকলে একটা out-of-sync replica-কে জোর করে leader বানানো হয় — availability ফেরে কিন্তু ISR-এ না-থাকা কিছু committed data হারাতে পারে (Replication ট্যাব)। Accounting/financial system-এ <code>unclean.leader.election.enable=false</code> রাখা হয়, কারণ এখানে data হারানোর চেয়ে সাময়িক unavailability অনেক কম ক্ষতিকর — durability, availability-এর ওপরে অগ্রাধিকার পায়।</p>

<h3>৯) Idempotent producer কীভাবে duplicate message ঠেকায়?</h3>
<pre>① send (PID=42, seq=5) → broker log-এ লেখে ✓
② ack broker → producer পথে হারালো (network glitch)
③ producer retry — আবার (PID=42, seq=5) পাঠায়
   broker দেখে "seq=5 তো আগেই লিখেছি" → আবার লেখে না, শুধু ack ফেরত</pre>
<p><b>ব্যাখ্যা:</b> <code>enable.idempotence=true</code> দিলে প্রতিটা producer একটা <span class="kw">Producer ID (PID)</span> পায় এবং প্রতি partition-এ একটা বাড়তে থাকা <span class="kw">sequence number</span> পাঠায় (Producer ট্যাব)। Broker প্রতিটা <code>(PID, partition, sequence)</code> মনে রাখে; ack হারিয়ে producer retry করলেও একই sequence দ্বিতীয়বার এলে broker সেটা silently dedup করে — ফলে retry নিরাপদ, log-এ কখনো duplicate লেখা হয় না। এটাই <b>exactly-once per partition write</b>, তবে এটা শুধু producer→broker লেখার duplicate ঠেকায়, পুরো end-to-end exactly-once নয়।</p>

<h3>১০) Kafka-তে exactly-once semantics (EOS) ঠিক কীভাবে অর্জন হয়?</h3>
<p><b>ব্যাখ্যা:</b> দুটো জিনিসের সমন্বয়ে (Reliability ট্যাব): (১) <b>idempotent producer</b> — retry-তে broker-side duplicate write বাদ দেয়; (২) <b>transactions</b> — <code>beginTransaction()</code>/<code>commitTransaction()</code> দিয়ে একাধিক partition/topic-এ atomic write, আর <code>sendOffsetsToTransaction()</code> দিয়ে consumer offset commit ও output produce একই transaction-এ বাঁধা থাকে (Consume-Transform-Produce pattern)। <code>isolation.level=read_committed</code> consumer শুধু COMMIT marker পাওয়া data-ই দেখে, ABORT হওয়া record skip করে। গুরুত্বপূর্ণ সীমাবদ্ধতা: এটা শুধু Kafka-থেকে-Kafka ক্ষেত্রে সম্পূর্ণ কাজ করে — output একটা external DB হলে (যেমন PostgreSQL) Kafka transaction একা যথেষ্ট নয়, তখন Inbox pattern লাগে (Production ট্যাব)।</p>

<h3>১১) commitTransaction() abort হলে output topic-এ লেখা data-র কী হয়?</h3>
<p><b>ব্যাখ্যা:</b> সেগুলো "মুছে" যায় না — Kafka append-only log, মাঝপথে কিছু delete করে না (Reliability ট্যাব)। Transaction শেষে broker প্রতিটা involved partition-এ একটা ছোট <span class="kw">control record</span> (COMMIT বা ABORT marker) লেখে। Data record আগে থেকেই physically log-এ বসে থাকে; marker শুধু বলে দেয় সেগুলো valid কিনা। <code>read_committed</code> consumer marker না দেখা পর্যন্ত ঐ transaction-এর record buffer করে রাখে — ABORT পেলে skip করে, COMMIT পেলে deliver করে।</p>

<h3>১২) Consumer rebalance কী, আর কখন ট্রিগার হয়?</h3>
<p><b>ব্যাখ্যা:</b> <span class="kw">Rebalance</span> হলো consumer group-এর মধ্যে partition-এর পুনর্বণ্টন — নতুন consumer যোগ হলে, কেউ বিদায় নিলে, crash করলে, বা কেউ <code>max.poll.interval.ms</code>-এর মধ্যে <code>poll()</code> না ডাকলে (dead ধরে নেওয়া হয়) ঘটে (Consumer ট্যাব)। Consumer background-এ <code>heartbeat.interval.ms</code>-এ heartbeat পাঠায়; <code>session.timeout.ms</code>-এর মধ্যে না পেলে coordinator তাকে dead ধরে group থেকে বাদ দেয় এবং rebalance শুরু করে।</p>

<h3>১৩) Eager আর Cooperative Sticky rebalance-এর পার্থক্য কী?</h3>
<table>
<tr><th></th><th>Eager (পুরনো)</th><th>Cooperative Sticky (আধুনিক)</th></tr>
<tr><td>রীতি</td><td>সব consumer সব partition ছেড়ে দেয় ("stop-the-world"), তারপর নতুন করে বণ্টন</td><td>শুধু যেসব partition আসলে move হবে সেগুলোই ছাড়ে</td></tr>
<tr><td>প্রভাব</td><td>পুরো group কিছুক্ষণ থমকে যায়</td><td>বাকি consumer-রা কাজ চালিয়ে যায়</td></tr>
</table>
<p><b>ব্যাখ্যা:</b> Eager rebalance-এ প্রতিটা rebalance-এ পুরো group-এর সব partition ownership আগে ছেড়ে (revoke) তারপর নতুন করে বণ্টন হয় — সংক্ষিপ্ত সময়ের জন্য পুরো group থেমে যায় (Consumer ট্যাব)। <code>CooperativeStickyAssignor</code>-এ শুধু যেটুকু নড়াচড়া দরকার ততটুকুই হয়, বাকি consumer নিজের আগের partition ধরে রেখেই কাজ চালিয়ে যায় — downtime অনেক কমে। এই কারণে production-এ এখন cooperative sticky-ই সাধারণ default choice।</p>

<h3>১৪) Static membership কেন দরকার, আর group.instance.id কী করে?</h3>
<p><b>ব্যাখ্যা:</b> Kubernetes-এ rolling deploy বা pod restart-এ প্রতিটা consumer কয়েক সেকেন্ডের জন্য চলে যায় ও ফেরে — সাধারণভাবে প্রতিবারই একটা rebalance ট্রিগার হয়, ১০টা pod restart মানে ১০+ বার group থমকে যাওয়া (Consumer ট্যাব)। <span class="kw">Static membership</span>-এ প্রতিটা consumer-কে একটা স্থায়ী <code>group.instance.id</code> দেওয়া হয়; coordinator তখন জানে "এই instance ফিরে আসবে" এবং <code>session.timeout.ms</code>-এর মধ্যে ফিরলে rebalance ছাড়াই তাকে আগের partition ফেরত দেয়। এতে rolling deploy-তে অপ্রয়োজনীয় rebalance storm এড়ানো যায়।</p>

<h3>১৫) Auto commit বনাম manual commit — কোনটায় কী ঝুঁকি?</h3>
<p><b>ব্যাখ্যা:</b> <code>enable.auto.commit=true</code>-তে নির্দিষ্ট interval-এ offset automatic commit হয় — process করার আগেই commit হয়ে গেলে crash-এ ঐ message আর প্রসেস না হয়েই বাদ যায় (data loss)। Manual <code>commitSync()</code> business logic <b>process করার পরে</b> ডাকলে at-least-once নিশ্চিত হয় — কিন্তু commit-এর আগে crash হলে message পুনরায় আসতে পারে (duplicate), তাই consumer-কে idempotent হতে হয় (Consumer ও Production ট্যাব)। Financial/accounting pipeline-এ তাই সবসময় <code>enable.auto.commit=false</code> + process-পরবর্তী manual commit + DB-side idempotency (Inbox pattern) ব্যবহার করা হয়।</p>
</template>

<script>
// ================= RENDER =================
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  // build nav + pages
  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    // footer nav
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    main.scrollTo?main.scrollTo(0,0):null;
    window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  // open from hash
  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
</body>
</html>
