<template data-page="foundation">
<h2 class="title">১. Foundation — কেন Kafka তৈরি হলো?</h2>
<p class="lead">এই অংশে আমরা শুধু "Kafka কী" শিখব না — বরং <b>কেন</b> এটা বানানো হলো, <b>কোন সমস্যা</b> সমাধান করে, <b>ভেতরে কীভাবে</b> কাজ করে, আর <b>কেন এই ডিজাইন</b> বেছে নেওয়া হলো — সেটা বুঝব।</p>

<h3>Kafka আসলে কী?</h3>
<p>Apache Kafka একটা <span class="kw">distributed event streaming platform</span>. সহজ ভাষায় — এটা একটা বিশাল, distributed, append-only <span class="kw">log</span> (লগবই), যেখানে অসংখ্য producer ডেটা লিখে আর অসংখ্য consumer সেই ডেটা পড়ে। এটা LinkedIn-এ ২০১০ সালের দিকে তৈরি হয়, পরে Apache-এ open-source হয়।</p>
<p>মনে রাখবেন — Kafka একটা সাধারণ <span class="kw">message queue</span> নয়। এটা একটা <span class="kw">durable, replayable commit log</span>। এই একটা পার্থক্যই এর পুরো ডিজাইন ব্যাখ্যা করে।</p>

<h3>কেন তৈরি হলো? — কোন সমস্যা?</h3>
<p>LinkedIn-এর সমস্যাটা ছিল <span class="kw">data integration</span>-এর। কল্পনা করুন আপনার অনেকগুলো system আছে — website activity, database, metrics, logs, search index, cache, data warehouse। প্রতিটা system-কে প্রতিটার সাথে যুক্ত করতে গেলে <b>N × M</b> সংখ্যক point-to-point connection লাগে। এটা একটা "spaghetti architecture"।</p>
<div class="diagram"><pre>
Before Kafka (N x M chaos):          After Kafka (N + M):

 App1 ─┬─→ DB                          App1 ─┐
 App2 ─┼─→ Search                      App2 ─┼─→ [ KAFKA ] ─┬─→ DB
 App3 ─┼─→ Cache                       App3 ─┘   (log)      ├─→ Search
       └─→ Warehouse                                        ├─→ Cache
  (প্রতিটা তীর আলাদা integration)                            └─→ Warehouse
</pre></div>
<p>Kafka মাঝখানে একটা <span class="kw">central nervous system</span> হিসেবে বসে। প্রত্যেকে শুধু Kafka-র সাথে কথা বলে — একে অপরের সাথে না। এতে integration সংখ্যা <b>N×M থেকে N+M</b>-এ নেমে আসে।</p>

<div class="callout why"><span class="tag">Why designed this way</span>
Kafka message পড়ে ফেললে delete করে না (traditional queue-র মতো)। ডেটা একটা retention period পর্যন্ত disk-এ থেকে যায়। ফলে একই ডেটা অনেক consumer আলাদা আলাদা গতিতে, আলাদা সময়ে পড়তে পারে — এমনকি পুরনো ডেটা <span class="kw">replay</span> করা যায়। এই "replayable log" ধারণাই Kafka-কে RabbitMQ/ActiveMQ থেকে আলাদা করে।</div>

<h3>Kafka vs Traditional Message Queue</h3>
<table>
<tr><th>বিষয়</th><th>Traditional Queue (RabbitMQ)</th><th>Kafka</th></tr>
<tr><td>Message পড়ার পর</td><td>delete হয়ে যায়</td><td>retention পর্যন্ত থাকে (replayable)</td></tr>
<tr><td>Consumer position</td><td>broker track করে</td><td><span class="kw">consumer</span> নিজে offset track করে</td></tr>
<tr><td>Throughput</td><td>মাঝারি</td><td>অত্যন্ত high (millions/sec)</td></tr>
<tr><td>Storage model</td><td>in-memory + queue</td><td>append-only log on disk</td></tr>
<tr><td>Ordering</td><td>সীমিত</td><td>per-partition strict ordering</td></tr>
</table>

<h3>ভেতরে কীভাবে কাজ করে (high level)</h3>
<ul>
<li>Producer একটা <span class="kw">topic</span>-এ message পাঠায়।</li>
<li>Topic ভাগ হয় অনেকগুলো <span class="kw">partition</span>-এ — প্রতিটা partition একটা independent, ordered log।</li>
<li>প্রতিটা partition কোনো একটা <span class="kw">broker</span>-এ leader হিসেবে থাকে, disk-এ append হয়।</li>
<li>Consumer একটা <span class="kw">consumer group</span>-এর মধ্যে থেকে partition পড়ে, আর নিজের <span class="kw">offset</span> track করে।</li>
</ul>

<div class="callout behind"><span class="tag">Behind the scenes</span>
Kafka-র সব performance-এর রহস্য একটাই সিদ্ধান্তে: <b>ডেটাকে sequential append-only log হিসেবে disk-এ রাখা এবং OS-এর page cache ব্যবহার করা</b>। random disk I/O না করে sequential I/O করায় HDD-তেও এটা অসম্ভব দ্রুত। (বিস্তারিত Storage ও Performance ট্যাবে।)</div>

<h3>Real production examples</h3>
<ul>
<li><b>LinkedIn:</b> দিনে ৭ trillion+ message — activity tracking, metrics।</li>
<li><b>Uber:</b> real-time trip, pricing, fraud detection pipeline।</li>
<li><b>Netflix:</b> সব microservice-এর event backbone।</li>
<li><b>Banking/Accounting:</b> transaction event stream, audit log, ledger updates (আপনার ক্ষেত্রে সবচেয়ে প্রাসঙ্গিক — শেষ ট্যাব দেখুন)।</li>
</ul>

<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li>Kafka-কে database ভাবা — এটা primary datastore নয়, event log।</li>
<li>একটা topic-এ শুধু ১টা partition রেখে পরে scale করতে না পারা।</li>
<li>Message size বড় (MB scale) রাখা — Kafka ছোট message-এর জন্য optimized।</li>
</ul></div>
<div class="callout best"><span class="tag">Best practices</span>
<ul style="margin:4px 0">
<li>শুরুতেই partition count নিয়ে ভাবুন (কমানো যায় না, বাড়ানো ordering ভাঙে)।</li>
<li>Schema management-এ <span class="kw">Schema Registry</span> (Avro/Protobuf) ব্যবহার করুন।</li>
<li>Topic naming convention ঠিক করুন: <code>domain.entity.event</code> — যেমন <code>accounting.invoice.created</code>।</li>
</ul></div>

<h3>Broker</h3>
<p><span class="kw">Broker</span> হলো একটা একক Kafka server (একটা JVM process)। এটা partition-এর data disk-এ রাখে, producer থেকে write নেয়, consumer-কে read দেয়, আর replication চালায়। প্রতিটা broker-এর একটা unique <code>broker.id</code> থাকে।</p>

<h3>Cluster</h3>
<p>একাধিক broker মিলে একটা <span class="kw">cluster</span>। Cluster-ই fault tolerance আর scalability দেয়। একটা broker down হলে অন্য broker-এ থাকা replica কাজ চালিয়ে নেয়।</p>

<h3>Kafka কোন Protocol ব্যবহার করে?</h3>
<p>Kafka কোনো standard protocol (AMQP/HTTP/MQTT) ব্যবহার করে <b>না</b> — এর আছে নিজস্ব একটা <span class="kw">custom binary protocol over TCP</span> (সাধারণভাবে "Kafka wire protocol")। Client ও broker এই protocol-এ length-prefixed binary request/response আদান-প্রদান করে। এটাই RabbitMQ (যা standard AMQP ব্যবহার করে)-র সাথে মৌলিক পার্থক্য।</p>
<ul>
<li><b>TCP-ভিত্তিক, binary:</b> প্রতিটা request length-prefixed — কম overhead, দ্রুত parse।</li>
<li><b>Request/response API:</b> প্রতিটা operation একটা "API" — যেমন <code>Produce</code>, <code>Fetch</code>, <code>Metadata</code>, <code>ListOffsets</code>, <code>OffsetCommit</code>/<code>OffsetFetch</code>, আর consumer group-এর <code>JoinGroup</code>/<code>SyncGroup</code>/<code>Heartbeat</code>।</li>
<li><b>API versioning:</b> প্রতি request-এ একটা API key + version থাকে; client ও broker version negotiate করে — তাই পুরনো client নতুন broker-এর সাথে চলে (backward/forward compatibility)।</li>
<li><b>Batching ও pipelining:</b> একটা connection-এ একাধিক request pipeline করা যায়; produce/fetch batch-এ হয় → high throughput।</li>
<li><b>Long-lived connection:</b> client broker-এর সাথে persistent TCP connection রাখে, প্রতি request-এ নতুন খোলে না।</li>
</ul>
<div class="callout behind"><span class="tag">Behind the scenes — কেন custom protocol</span>
Kafka-র লক্ষ্য বিশাল throughput। Custom binary protocol batching, <code>sendfile()</code> zero-copy (Performance ট্যাব), আর কম per-message overhead সম্ভব করে — যা generic protocol-এ কঠিন। Client প্রথমে যেকোনো broker-কে <code>Metadata</code> request পাঠিয়ে জেনে নেয় কোন partition-এর leader কোন broker-এ, তারপর সরাসরি সেই leader broker-এ produce/fetch করে।</div>
<h4>Security listener ও port</h4>
<table>
<tr><th>Listener protocol</th><th>কী</th></tr>
<tr><td><code>PLAINTEXT</code></td><td>encryption/auth ছাড়া (শুধু dev), default port <code>9092</code></td></tr>
<tr><td><code>SSL</code></td><td>TLS encryption (+ ঐচ্ছিক mTLS auth)</td></tr>
<tr><td><code>SASL_PLAINTEXT</code></td><td>SASL auth, কিন্তু encryption নেই</td></tr>
<tr><td><code>SASL_SSL</code></td><td>SASL auth + TLS — production-এ এটাই</td></tr>
</table>
<p>SASL mechanism: <code>PLAIN</code>, <code>SCRAM-SHA-256/512</code>, <code>GSSAPI</code> (Kerberos), <code>OAUTHBEARER</code> — বিস্তারিত Security ট্যাবে।</p>
<div class="callout why"><span class="tag">RabbitMQ (AMQP) বনাম Kafka (custom)</span>
RabbitMQ standard <b>AMQP 0-9-1</b> ব্যবহার করে, তাই routing বুদ্ধি (exchange/binding) protocol-এই সংজ্ঞায়িত। Kafka-র custom protocol শুধু log-এ append ও offset-ভিত্তিক fetch-এ কেন্দ্রীভূত — routing বুদ্ধি client-এ। এজন্যই AMQP client দিয়ে Kafka-তে সংযোগ করা যায় না (উল্টোটাও নয়) — প্রতিটার আলাদা client library লাগে।</div>

<h3>Controller ও KRaft</h3>
<p>Cluster-এ একটা broker <span class="kw">Controller</span>-এর ভূমিকা পালন করে। এর কাজ: partition leader election, broker join/leave handle করা, metadata manage করা।</p>
<p><span class="kw">KRaft</span> (Kafka Raft) হলো নতুন metadata management mode (Kafka 2.8+, 3.3-এ production-ready, 4.0-এ default)। এখানে metadata নিজেই একটা internal Kafka topic (<code>__cluster_metadata</code>)-এ Raft consensus দিয়ে রাখা হয়। কয়েকটা broker <span class="kw">controller quorum</span> তৈরি করে।</p>
<div class="callout why"><span class="tag">Why KRaft replaced ZooKeeper</span>
ZooKeeper আলাদা একটা system — আলাদা deploy, tune, monitor করতে হতো। বড় cluster-এ ZooKeeper-এ metadata scale করত না (partition বাড়লে metadata operation ধীর হতো)। KRaft সব এক জায়গায় আনে — কম moving parts, দ্রুত failover (controller failover সেকেন্ডে), millions of partition support।</div>

<h4>ZooKeeper (legacy)</h4>
<p>পুরনো Kafka-তে <span class="kw">ZooKeeper</span> metadata (topic config, ACL, broker membership, controller election) রাখত। নতুন কাজে KRaft ব্যবহার করুন; ZooKeeper Kafka 4.0-এ সম্পূর্ণ বাদ।</p>

<h3>Topic, Partition, Replica</h3>
<p><span class="kw">Topic</span> একটা logical stream/category (যেমন <code>orders</code>)। প্রতিটা topic ভাগ হয় <span class="kw">partition</span>-এ। Partition-ই আসল unit — parallelism, ordering, storage সব partition level-এ।</p>
<p>প্রতিটা partition-এর কয়েকটা কপি থাকে — এদের বলে <span class="kw">replica</span>। <code>replication.factor=3</code> মানে প্রতিটা partition-এর ৩টা কপি ৩টা আলাদা broker-এ।</p>

<div class="diagram"><pre>
Topic "orders" (partitions=3, replication.factor=3)

 Partition 0:  [0][1][2][3][4]...   ← offset বাড়ে, append-only
 Partition 1:  [0][1][2][3]...
 Partition 2:  [0][1][2][3][4][5]...

 প্রতিটা partition একটা independent ordered log.
 Ordering guarantee শুধু একটা partition-এর ভেতরে — পুরো topic জুড়ে নয়!
</pre></div>

<h3>Leader, Follower, ISR</h3>
<p>প্রতিটা partition-এর replica-গুলোর একটা <span class="kw">leader</span>, বাকিরা <span class="kw">follower</span>। সব read/write leader-এর মাধ্যমে হয়; follower শুধু leader থেকে copy করে (replicate)।</p>
<p><span class="kw">ISR (In-Sync Replicas)</span> হলো সেই follower-দের সেট যারা leader-এর সাথে "যথেষ্ট আপ-টু-ডেট"। leader down হলে শুধু ISR থেকেই নতুন leader হয় (default-এ)। বিস্তারিত Replication ট্যাবে।</p>

<h3>Segment Files, Index Files, Log Storage</h3>
<p>প্রতিটা partition disk-এ একটা directory। সেই directory-তে log ভাগ করা থাকে ছোট ছোট <span class="kw">segment file</span>-এ (default ~1GB বা <code>log.segment.bytes</code>)। প্রতিটা segment-এর সাথে থাকে <span class="kw">index file</span> (offset→physical position) আর <span class="kw">time index</span> (timestamp→offset)। এটা Storage ট্যাবে গভীরভাবে দেখানো হয়েছে।</p>

<div class="callout best"><span class="tag">Production sizing example</span>
একটা accounting system-এর জন্য: <code>orders</code> topic — partitions=12, replication.factor=3, min.insync.replicas=2, retention=7 days। এতে সর্বোচ্চ 12 consumer parallel পড়তে পারবে, আর ২টা broker fail করলেও data থাকবে।</div>
<div class="callout mistake"><span class="tag">Common mistake</span>
<code>replication.factor=1</code> রাখা (এক কপি) — broker down হলেই data হারায়। Production-এ সবসময় ≥3 রাখুন এবং <code>min.insync.replicas=2</code>।</div>

<h3>Step ১ — Serialization</h3>
<p>Producer object (key, value) কে <span class="kw">serializer</span> দিয়ে <code>byte[]</code>-এ রূপান্তর করে। Kafka শুধু bytes বোঝে। Production-এ Avro/Protobuf + Schema Registry ব্যবহার হয় যাতে schema evolution safe থাকে।</p>

<h3>Step ২ — Partition Selection</h3>
<ul>
<li>Key দিলে: <code>partition = hash(key) % numPartitions</code> → একই key সবসময় একই partition-এ (ordering guarantee)।</li>
<li>Key না দিলে: sticky partitioner — একটা batch ভরা পর্যন্ত একটা partition-এই পাঠায় (batching efficient হয়)।</li>
</ul>

<h3>Step ৩ — Batching (RecordAccumulator)</h3>
<p>Message সাথে সাথে যায় না। একটা in-memory buffer (<code>buffer.memory</code>)-এ per-partition batch জমা হয়। <code>batch.size</code> ভরলে অথবা <code>linger.ms</code> সময় হলে একটা background <span class="kw">Sender thread</span> সেই batch broker-এ পাঠায়। এতে network call কমে, throughput বাড়ে।</p>

<h3>Step ৪–৫ — Leader broker-এ write</h3>
<p>Sender thread partition-এর <b>leader</b> broker-এ <code>ProduceRequest</code> পাঠায়। Broker record-গুলো partition-এর active segment-এ append করে — আসলে প্রথমে <span class="kw">OS page cache</span>-এ লেখে (RAM), সরাসরি disk-এ flush নয়।</p>
<div class="callout behind"><span class="tag">Behind the scenes</span>
Kafka নিজে <code>fsync</code> জোর করে না প্রতি message-এ। এটা page cache-এ লিখে OS-কে flush-এর দায়িত্ব দেয়। Durability আসে <b>replication</b> থেকে — একাধিক broker-এর RAM/disk-এ থাকা থেকে — শুধু single disk flush থেকে নয়। এজন্যই এত দ্রুত।</div>

<h3>Step ৬ — Replication</h3>
<p>Follower broker-রা leader-এর কাছে নিজে থেকে <code>FetchRequest</code> পাঠিয়ে নতুন data টেনে নেয় (pull model)। যেসব follower up-to-date, তারা <span class="kw">ISR</span>-এ থাকে।</p>

<h3>Step ৭–৮ — Acknowledgement (acks)</h3>
<table>
<tr><th>acks</th><th>কখন ack</th><th>Guarantee</th></tr>
<tr><td><code>0</code></td><td>পাঠানোর সাথে সাথে (leader-ও confirm করে না)</td><td>data হারাতে পারে</td></tr>
<tr><td><code>1</code></td><td>leader লিখলেই</td><td>leader crash হলে হারাতে পারে</td></tr>
<tr><td><code>all</code>/<code>-1</code></td><td>সব ISR লিখলে</td><td>সবচেয়ে নিরাপদ (min.insync.replicas সহ)</td></tr>
</table>

<h3>Step ৯–১১ — Consumer side</h3>
<p>Consumer <code>poll()</code> কল করলে assigned partition-এর leader থেকে <code>FetchRequest</code> দিয়ে batch টেনে আনে (নিজের offset থেকে)। Record process করার পর <span class="kw">offset commit</span> করে — এই offset জমা হয় internal <code>__consumer_offsets</code> topic-এ।</p>

<div class="callout mistake"><span class="tag">Common mistake — এখানে কী fail করতে পারে</span>
<ul style="margin:4px 0">
<li>Process করার <b>আগেই</b> offset commit → crash হলে message হারায় (data loss)।</li>
<li>Process করার পর commit-এর আগে crash → message আবার process হয় (duplicate)। এজন্য <b>idempotent consumer</b> দরকার (Production ট্যাব)।</li>
</ul></div>
</template>

<template data-page="storage">
<h2 class="title">৪. Storage Internals — Kafka এত দ্রুত কেন?</h2>
<p class="lead">Kafka-র performance-এর মূল রহস্য এই অংশে। append-only log, segment, index, page cache — সব।</p>

<h3>Disk নাকি RAM? — Kafka ঠিক কোথায় data রাখে</h3>
<p>সরাসরি উত্তর: <b>Kafka সব data physical disk-এ (persistent log file-এ) রাখে — RAM-এ নয়।</b> এটা Redis-এর মতো কোনো in-memory store নয়; broker restart করলেও data থাকে, কারণ সেটা disk-এ লেখা। তাহলে "তবু এত দ্রুত কীভাবে?" — কারণ Kafka disk আর RAM-কে <b>একসাথে</b> চালাকির সাথে ব্যবহার করে: durability-র জন্য disk, আর গতির জন্য OS <span class="kw">page cache</span> (RAM)।</p>
<div class="diagram"><pre>
Producer ─write─►  OS Page Cache (RAM)  ─background flush─►  Physical Disk (.log segment)
                        ▲                                     (source of truth, persistent)
Consumer ─read──────────┘   ← সাম্প্রতিক data page cache থেকেই আসে (RAM speed, disk touch নয়)
</pre></div>
<p><b>Write যখন হয়:</b> producer-এর message broker প্রথমে OS page cache (RAM)-এ append করে — এটা প্রায় মুহূর্তেই "লেখা হয়েছে" হিসেবে ধরা হয়; তারপর OS নিজের সুবিধামতো background-এ physical disk-এ flush করে। অর্থাৎ write path-এ Kafka disk-এর জন্য বসে থাকে না।</p>
<div class="callout why"><span class="tag">তাহলে durability আসে কোথা থেকে?</span>
বেশিরভাগ database প্রতিটা write-এ <code>fsync</code> করে (disk-এ পাকাপাকি লেখা নিশ্চিত করতে) — যা ধীর। Kafka <b>প্রতি message-এ fsync করে না</b> (default)। বদলে durability আসে <span class="kw">replication</span> থেকে — message একাধিক broker-এ copy হয় (<code>acks=all</code>)। একটা broker crash করে তার page cache হারালেও অন্য replica-তে data আছে। এভাবে Kafka fsync-এর ধীরগতি এড়িয়েও data নিরাপদ রাখে — এটাই Kafka-র মূল design বাজি।</div>
<p><b>Read যখন হয়:</b> consumer সাধারণত সবচেয়ে সাম্প্রতিক message পড়ে — যা এইমাত্র লেখা হয়েছে, তাই তখনও page cache (RAM)-এ "গরম"। ফলে read-ও RAM থেকে, কোনো disk seek ছাড়াই। শুধু অনেক পুরনো data (যা page cache থেকে evict হয়ে গেছে) চাইলে disk থেকে আসে — তাও sequential read, random seek নয়।</p>
<table>
<tr><th>অপারেশন</th><th>প্রথমে কোথায়</th><th>ফলাফল</th></tr>
<tr><td>Write</td><td>OS page cache (RAM); পরে disk-এ flush</td><td>disk-এর জন্য অপেক্ষা নেই → দ্রুত</td></tr>
<tr><td>Read (সাম্প্রতিক)</td><td>page cache (RAM) থেকেই — cache hit</td><td>disk touch করে না → RAM-speed</td></tr>
<tr><td>Read (পুরনো)</td><td>disk থেকে (cache miss), কিন্তু sequential</td><td>seek নেই → তবুও দ্রুত</td></tr>
<tr><td>Durability</td><td>disk + একাধিক broker-এ replication</td><td>crash-এও data টেকে</td></tr>
</table>
<div class="callout behind"><span class="tag">Behind the scenes — disk কেন bottleneck নয়</span>
"Disk মানেই ধীর" — এটা শুধু <b>random</b> access-এর জন্য সত্য। Kafka append-only বলে সব I/O <b>sequential</b>, আর sequential disk throughput (HDD-তেও ~600 MB/s, SSD-তে আরও বেশি) network bandwidth-এর কাছাকাছি বা বেশি — তাই bottleneck সাধারণত disk নয়, বরং network/CPU। উপরন্তু read-এ <code>sendfile()</code> (zero-copy — Performance ট্যাব) data-কে page cache থেকে সরাসরি network socket-এ পাঠায়, application memory বা JVM heap ছোঁয়ও না।</div>

<h3>কেন Append-only Log?</h3>
<p>Kafka কখনো data-র মাঝখানে update/delete করে না — শুধু শেষে <span class="kw">append</span> করে। কারণ:</p>
<ul>
<li><b>Sequential write</b> — disk head একদিকে চলে, random seek নেই। HDD-তেও sequential write ~600MB/s, random write ~100KB/s। পার্থক্য ৬০০০ গুণ!</li>
<li>Immutable data → concurrency সহজ, corruption কম।</li>
<li>Consumer শুধু offset বাড়িয়ে পড়ে — pointer সরানোর মতো সহজ।</li>
</ul>

<h3>Segment Files</h3>
<p>একটা partition-এর log এক ফাইলে থাকে না — ভাগ থাকে <span class="kw">segment</span>-এ। শুধু শেষেরটা "active" (এখানে append হয়)। পুরনো segment read-only।</p>
<div class="diagram"><pre>
/kafka-logs/orders-0/          ← partition 0 এর directory
  00000000000000000000.log     ← segment (base offset 0)
  00000000000000000000.index   ← offset index
  00000000000000000000.timeindex← time index
  00000000000000170520.log     ← পরের segment (base offset 170520)
  00000000000000170520.index
  00000000000000170520.timeindex
  leader-epoch-checkpoint
</pre></div>
<div class="callout why"><span class="tag">Why segments?</span>
পুরো log এক ফাইল হলে retention (পুরনো data delete) করতে গেলে ফাইলের শুরু থেকে কাটতে হতো — ব্যয়বহুল। Segment থাকায় পুরো পুরনো segment ফাইল <b>এক অপারেশনে delete</b> করা যায়। Log compaction-ও segment-ভিত্তিক।</div>

<h3>Index Files — Offset Index ও Time Index</h3>
<p>Consumer offset 170525 চাইলে পুরো log scan করা যাবে না। <span class="kw">Offset index</span> রাখে <code>(relative offset → physical byte position)</code> mapping — sparse (প্রতিটা নয়, কিছু কিছু entry)। Kafka index-এ binary search করে কাছের position পায়, তারপর সেখান থেকে scan করে।</p>
<p><span class="kw">Time index</span> রাখে <code>(timestamp → offset)</code> — "গত ১ ঘণ্টার data দাও" ধরনের query আর retention-এর জন্য।</p>

<h3>Retention</h3>
<p>ডেটা কতদিন রাখা হবে: <code>retention.ms</code> (সময়ভিত্তিক, default 7 দিন) বা <code>retention.bytes</code> (সাইজভিত্তিক)। মেয়াদ শেষ হলে পুরো segment delete।</p>
<div class="callout"><b>Retention sizing উদাহরণ:</b> topic-এ ঢুকছে 5 MB/s, retention 7 দিন, replication.factor=3 →
disk ≈ 5 MB/s × 604,800 s × 3 ≈ <b>~9 TB</b>। অর্থাৎ retention আর replication factor সরাসরি disk খরচ নির্ধারণ করে — planning-এ এই হিসাব করুন।</div>

<h4>Tiered Storage (আধুনিক Kafka — 3.9/4.0)</h4>
<p>দীর্ঘ retention (মাস/বছর) রাখতে গেলে broker-এর local disk ব্যয়বহুল হয়ে যায়। <span class="kw">Tiered Storage</span> (KIP-405) সাম্প্রতিক ("hot") segment broker-এর local disk-এ রাখে, আর পুরনো ("cold") segment স্বয়ংক্রিয়ভাবে সস্তা object storage (S3/GCS)-এ সরিয়ে দেয়। Consumer পুরনো data চাইলে Kafka transparently object storage থেকে এনে দেয়।</p>
<div class="callout best"><span class="tag">কেন কাজের</span>
Broker-এর disk ছোট রাখা যায় (দ্রুত recovery, সস্তা), অথচ compliance/audit-এর জন্য accounting event মাস-বছর ধরে সংরক্ষণ সম্ভব। আগে এর জন্য আলাদা data lake-এ dump করতে হতো; এখন Kafka নিজেই সামলায়।</div>

<h3>Log Compaction</h3>
<p>সময়ভিত্তিক delete-এর বিকল্প। <code>cleanup.policy=compact</code> দিলে Kafka প্রতিটা <b>key</b>-এর শুধু সর্বশেষ value রাখে, পুরনো duplicate key মুছে দেয়। "current state"-ধরনের topic-এর জন্য আদর্শ (যেমন user-profile, latest-balance)।</p>

<h3>Page Cache ও Sequential Write — কেন দ্রুত</h3>
<p>Kafka write সরাসরি disk-এ না গিয়ে যায় OS-এর <span class="kw">page cache</span> (RAM)-এ। Consumer সাধারণত সাম্প্রতিক data পড়ে, যা তখনও page cache-এ থাকে — ফলে read-ও RAM থেকে, disk touch করাই লাগে না।</p>
<div class="callout behind"><span class="tag">Behind the scenes</span>
Kafka JVM heap-এ data cache করে না — এটা OS page cache-এর উপর নির্ভর করে। ফলে ৬৪GB RAM-এর machine-এ Kafka JVM-কে মাত্র ~৫-৬GB heap দিলেই চলে, বাকিটা OS page cache হিসেবে data serve করে। GC pressure কম, RAM-এর সর্বোচ্চ ব্যবহার।</div>
<div class="callout best"><span class="tag">Best practices</span>
<ul style="margin:4px 0">
<li>Kafka broker-এ heap ছোট রাখুন (~6GB), বাকি RAM OS-কে দিন page cache-এর জন্য।</li>
<li>Broker-এ অন্য memory-heavy app চালাবেন না — page cache eviction হয়।</li>
<li>SSD ভালো কিন্তু sequential access-এর কারণে ভালো HDD-ও কাজ চালায়।</li>
</ul></div>
</template>

<template data-page="producer">
<h2 class="title">৫. Producer Internals</h2>
<p class="lead">একটা record কীভাবে producer-এর ভেতরে ভ্রমণ করে — serializer থেকে delivery guarantee পর্যন্ত।</p>

<h3>একটা Record-এর গঠন (Anatomy)</h3>
<p>Kafka-তে যা পাঠান সেটা শুধু "value" নয় — একটা <span class="kw">record</span>-এর কয়েকটা অংশ:</p>
<div class="diagram"><pre>
┌─────────────────────────────────────────────┐
│ Kafka Record                                  │
│  key        → partition ঠিক করে (ordering)    │
│  value      → আসল payload (JSON/Avro bytes)   │
│  headers    → metadata (traceId, source, …)   │  ← routing/tracing এ কাজে লাগে
│  timestamp  → event time / ingest time        │
│  ── broker যোগ করে ──                          │
│  offset     → partition এ position             │
│  partition  → কোন partition                    │
└─────────────────────────────────────────────┘
</pre></div>
<p><b>Headers</b> খুব কাজের — যেমন distributed tracing-এর <code>traceId</code>, event schema version, বা source system। Value-তে না মিশিয়ে header-এ রাখলে consumer payload deserialize না করেও routing decision নিতে পারে।</p>

<h3>Serializer</h3>
<p>Key ও value কে bytes-এ রূপান্তর করে। <code>StringSerializer</code>, <code>ByteArraySerializer</code>, বা Avro/Protobuf/JSON serializer। Production-এ Schema Registry + Avro — backward/forward compatible schema evolution-এর জন্য (Ecosystem ট্যাব দেখুন)।</p>

<h3>Partitioner</h3>
<ul>
<li>Key থাকলে: <code>murmur2(key) % partitions</code> → deterministic, একই key → একই partition।</li>
<li>Key না থাকলে: <span class="kw">Sticky Partitioner</span> — একটা batch পূর্ণ না হওয়া পর্যন্ত একটাই partition ব্যবহার, তারপর পরের partition।</li>
<li>Custom partitioner লেখা যায় (যেমন tenant-ভিত্তিক routing)।</li>
</ul>

<h4>Partition Key কীভাবে বাছবেন? — সবচেয়ে গুরুত্বপূর্ণ ডিজাইন সিদ্ধান্ত</h4>
<p>Key বাছাই দুটো জিনিস একসাথে ঠিক করে: <b>(১) ordering</b> — একই key একই partition-এ যায়, তাই ঐ key-এর সব event ক্রম বজায় রাখে; আর <b>(২) load distribution</b> — key-গুলো partition-এ কতটা সমানভাবে ছড়ায়।</p>
<p><b>Accounting উদাহরণ:</b> ধরুন প্রতি account-এর transaction event পাঠাচ্ছেন। Key = <code>account_id</code> রাখলে একটা account-এর deposit/withdraw সবসময় ক্রমে (একই partition-এ) process হবে — balance হিসাব ঠিক থাকবে। Key না দিলে round-robin হয়ে event এলোমেলো partition-এ ছড়াবে → একই account-এর withdraw, deposit-এর আগে process হয়ে balance ভুল হতে পারে।</p>
<div class="callout mistake"><span class="tag">Hot Partition সমস্যা</span>
Key খারাপ হলে একটা partition-এ অসম load পড়ে। যেমন key = <code>country</code> রাখলে "Bangladesh"-এর সব traffic একটা partition-এ — সেই partition/consumer overload, বাকিরা idle। অথবা একটা বিশাল corporate account পুরো traffic-এর ৮০% হলে সেই account-এর partition hot হবে।</div>
<div class="callout best"><span class="tag">সমাধান ও নিয়ম</span>
<ul style="margin:4px 0">
<li>এমন key নিন যার <b>cardinality বেশি</b> ও distribution সমান — <code>account_id</code> ভালো, <code>country</code>/<code>status</code> খারাপ।</li>
<li>Hot key থাকলে <b>composite key</b>: <code>account_id + "#" + (hash % 10)</code> — একই account ১০ partition-এ ছড়ায় (কিন্তু তখন per-account ordering হারায়, তাই sub-key ordering লাগলে সাবধান)।</li>
<li>Ordering দরকার না হলে key = null রাখুন — sticky partitioner সবচেয়ে ভালো batching দেবে।</li>
<li>মনে রাখুন: partition সংখ্যা পরে বাড়ালে <code>hash % N</code> বদলে যায় → একই key নতুন partition-এ যেতে পারে (Scaling ট্যাব দেখুন)।</li>
</ul></div>

<h3>Batching, Buffer Memory, Compression</h3>
<table>
<tr><th>Config</th><th>কাজ</th><th>Trade-off</th></tr>
<tr><td><code>batch.size</code></td><td>প্রতি partition batch-এর সর্বোচ্চ bytes</td><td>বড় = throughput↑, latency↑</td></tr>
<tr><td><code>linger.ms</code></td><td>batch ভরার জন্য কত ms অপেক্ষা</td><td>0 = low latency, বেশি = ভালো batching</td></tr>
<tr><td><code>buffer.memory</code></td><td>মোট send buffer size</td><td>ভরে গেলে send() block করে</td></tr>
<tr><td><code>compression.type</code></td><td>lz4/zstd/snappy/gzip</td><td>CPU↑ কিন্তু network+disk↓</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
High-throughput-এ: <code>linger.ms=5-20</code>, <code>batch.size=32KB-64KB</code>, <code>compression.type=lz4</code> (বা zstd)। compression পুরো batch-এ হয় — তাই batch বড় হলে compression ratio ভালো।</div>

<h3>Idempotent Producer</h3>
<p><code>enable.idempotence=true</code> দিলে producer প্রতিটা message-এ একটা <span class="kw">sequence number</span> + <span class="kw">producer ID (PID)</span> যোগ করে। Broker duplicate sequence detect করে বাদ দেয়। ফলে retry হলেও একই message দুবার log-এ লেখা হয় না — <b>exactly-once per partition write</b>।</p>
<div class="callout behind"><span class="tag">Behind the scenes</span>
Retry ছাড়া: network glitch-এ ack হারালে producer আবার পাঠায় → duplicate। Idempotence-এ broker <code>(PID, partition, sequence)</code> মনে রাখে, একই sequence আবার এলে silently accept করে কিন্তু আবার লেখে না। Kafka 3.0+ এ এটা default।</div>
<p><b>একটা concrete উদাহরণে দেখুন:</b> producer msg পাঠাল <code>seq=5</code>, broker লিখল কিন্তু ack ফেরার পথে network drop। producer ভাবল fail, আবার পাঠাল <code>seq=5</code>। idempotence না থাকলে দুবার লেখা হতো (duplicate)। idempotence থাকায় broker দেখে "seq=5 তো আগেই লিখেছি" → আবার না লিখে শুধু ack ফেরত দেয়।</p>

<h3>Transactions</h3>
<p>একাধিক partition/topic-এ atomic write-এর জন্য। <code>transactional.id</code> সেট করে <code>beginTransaction() → send()... → commitTransaction()</code>। হয় সব message commit হয়, নয় সব abort। <span class="kw">Consume-Transform-Produce</span> pattern-এ (read → process → write + offset commit একসাথে atomic) exactly-once দেয়।</p>

<h3>Retry ও Delivery Guarantee</h3>
<ul>
<li><code>retries</code> + <code>delivery.timeout.ms</code> — কতক্ষণ/কতবার retry।</li>
<li><code>max.in.flight.requests.per.connection</code> — idempotence ছাড়া >1 রাখলে retry-তে ordering ভাঙতে পারে; idempotence থাকলে ≤5 পর্যন্ত ordering safe।</li>
<li>Delivery guarantee: acks + idempotence + retries মিলে ঠিক হয় (Reliability ট্যাব)।</li>
</ul>

<h3 id="prod-grade">Production-grade Producer — গভীরে</h3>
<p class="lead">উপরের feature-গুলো জানার পর আসল প্রশ্ন: production-এ কোন config, কোন value, আর কেন? নিচে durability, timeout, tuning, error handling, shutdown ও monitoring — এক এক করে।</p>

<h4>acks — durability-র মূল সুইচ</h4>
<p><code>acks</code> ঠিক করে producer কখন একটা write-কে "সফল" ধরবে — এটাই latency বনাম data-safety-র সবচেয়ে বড় নির্ধারক।</p>
<table>
<tr><th><code>acks</code></th><th>কখন সফল ধরে</th><th>ঝুঁকি / ব্যবহার</th></tr>
<tr><td><code>0</code></td><td>পাঠিয়েই "সফল" — কোনো confirm নয়</td><td>সবচেয়ে দ্রুত, কিন্তু broker না পেলেও জানবেন না → data loss। শুধু metric/log যেখানে কিছু হারালে চলে।</td></tr>
<tr><td><code>1</code></td><td>শুধু <b>leader</b> লিখলেই</td><td>leader replicate-এর আগে crash করলে ঐ message হারায়। "মোটামুটি নিরাপদ" ভেবে ভুল ধরা হয় সবচেয়ে বেশি।</td></tr>
<tr><td><code>all</code> (<code>-1</code>)</td><td>leader + সব <b>in-sync</b> replica লিখলে</td><td>সবচেয়ে নিরাপদ। <code>min.insync.replicas</code>-এর সাথে মিলে কাজ করে। Production default।</td></tr>
</table>
<div class="callout why"><span class="tag">acks=all একা যথেষ্ট নয়</span>
<code>acks=all</code> মানে "সব ISR", কিন্তু ISR-এ যদি মাত্র ১টা replica থাকে (বাকিরা পিছিয়ে বাদ পড়েছে) তাহলে ঐ ১টাই যথেষ্ট ধরা হয় — আবার single point। তাই broker/topic-এ <code>min.insync.replicas=2</code> (RF=3-এ) সেট করুন: ISR ২-এর নিচে নামলে producer <code>NotEnoughReplicas</code> error পায় ও write আটকে যায় — নীরবে হারানোর চেয়ে জোরে fail করা ভালো (Replication ট্যাব)।</div>

<h4>Timeout ও Retry-র hierarchy — কে কার ভেতরে</h4>
<p>Production-এ সবচেয়ে বেশি বিভ্রান্তি এই timeout-গুলো নিয়ে। এরা nested — একটার ভেতর আরেকটা:</p>
<div class="diagram"><pre>
send() ───────────────────────────────────────────────► success / hard-fail
   │
   ├─ linger.ms .............. batch ভরার অপেক্ষা (throughput এর জন্য)
   │
   ├─ প্রতিটা attempt:
   │     └─ request.timeout.ms .. এই একটা request এ broker response এর অপেক্ষা
   │
   ├─ attempt ব্যর্থ → retry.backoff.ms বিরতি → আবার attempt (retries যতবার)
   │
   └─ delivery.timeout.ms .... উপরের সব মিলিয়ে সর্বোচ্চ সময়;
                               এটা পেরোলে আর retry নয় → হাতে error আসে
</pre></div>
<div class="callout behind"><span class="tag">Behind the scenes</span>
<code>delivery.timeout.ms</code> হলো একমাত্র "সত্যিকারের deadline" — <code>send()</code> থেকে চূড়ান্ত সিদ্ধান্ত পর্যন্ত। <code>retries</code> কতবার তা এর ভেতরেই bound হয়, তাই <code>retries</code> বড় (এমনকি <code>int.MaxValue</code>) রেখে বাস্তব সীমা <code>delivery.timeout.ms</code> দিয়ে নিয়ন্ত্রণ করাই আধুনিক প্র্যাকটিস। নিয়ম: <code>delivery.timeout.ms ≥ linger.ms + request.timeout.ms</code>।</div>

<h4>Production-grade Config — reference</h4>
<p>একটা নিরাপদ, high-throughput producer-এর শুরু-বিন্দু (Kafka config নাম; বন্ধনীতে .NET/Confluent সমতুল্য):</p>
<table>
<tr><th>Config</th><th>Production মান</th><th>কেন</th></tr>
<tr><td><code>acks</code> (<code>Acks</code>)</td><td><code>all</code></td><td>leader+ISR নিশ্চিত — durability</td></tr>
<tr><td><code>enable.idempotence</code></td><td><code>true</code></td><td>retry-তে duplicate/reorder রোধ; নিচের কয়েকটা auto-tune করে</td></tr>
<tr><td><code>min.insync.replicas</code> <span class="c">(broker/topic)</span></td><td><code>2</code> (RF=3)</td><td>ISR কমলে নীরবে না হারিয়ে write fail</td></tr>
<tr><td><code>retries</code> (<code>MessageSendMaxRetries</code>)</td><td>বড় / <code>int.MaxValue</code></td><td>transient error auto-recover; সীমা delivery.timeout দেয়</td></tr>
<tr><td><code>delivery.timeout.ms</code></td><td><code>120000</code></td><td>মোট চেষ্টার আসল deadline</td></tr>
<tr><td><code>max.in.flight.requests.per.connection</code></td><td><code>5</code></td><td>idempotence-এ ordering safe রেখেও throughput</td></tr>
<tr><td><code>linger.ms</code> (<code>LingerMs</code>)</td><td><code>5–20</code></td><td>batching → throughput↑, সামান্য latency</td></tr>
<tr><td><code>batch.size</code></td><td><code>32–64 KB</code></td><td>বড় batch → ভালো compression ও কম request</td></tr>
<tr><td><code>compression.type</code></td><td><code>lz4</code> / <code>zstd</code></td><td>network+disk↓ (CPU↑)</td></tr>
<tr><td><code>buffer.memory</code></td><td><code>32–64 MB</code></td><td>traffic burst শোষণ করে</td></tr>
<tr><td><code>max.block.ms</code></td><td><code>60000</code></td><td>buffer ভরে গেলে <code>send()</code> কতক্ষণ block করবে, তারপর throw</td></tr>
<tr><td><code>request.timeout.ms</code></td><td><code>30000</code></td><td>প্রতি request-এ broker response অপেক্ষা</td></tr>
<tr><td><code>client.id</code></td><td>অর্থপূর্ণ নাম</td><td>broker-side metrics, quota ও log এ চিহ্নিত করতে</td></tr>
</table>
<div class="callout best"><span class="tag">Idempotence যা free-তে ঠিক করে</span>
<code>enable.idempotence=true</code> দিলে Kafka নিজেই <code>acks=all</code>, <code>retries&gt;0</code>, আর <code>max.in.flight≤5</code> নিশ্চিত করে — এগুলোর কোনোটা এর বিপরীতে সেট করলে producer শুরুতেই error দেয়। তাই idempotence অন রেখে বাকিগুলো নিয়ে আলাদা দুশ্চিন্তা কমে।</div>

<h4>তিনটা tuning profile — কোন কাজে কোনটা</h4>
<p>"সেরা config" বলে কিছু নেই — আপনার priority (latency / throughput / durability) অনুযায়ী বদলায়:</p>
<table>
<tr><th></th><th>Latency-first</th><th>Throughput-first</th><th>Durability-first</th></tr>
<tr><td><code>acks</code></td><td><code>1</code> বা <code>all</code></td><td><code>all</code></td><td><code>all</code> + minISR=2</td></tr>
<tr><td><code>linger.ms</code></td><td><code>0</code></td><td><code>20–50</code></td><td><code>10</code></td></tr>
<tr><td><code>batch.size</code></td><td>ছোট</td><td><code>64–128 KB</code></td><td>মাঝারি</td></tr>
<tr><td><code>compression</code></td><td>none / lz4</td><td><code>zstd</code></td><td><code>lz4</code></td></tr>
<tr><td>idempotence / txn</td><td>idempotent</td><td>idempotent</td><td>idempotent + transaction</td></tr>
<tr><td>উপযুক্ত</td><td>interactive / realtime API</td><td>log, clickstream, analytics ingest</td><td>payment, ledger, order</td></tr>
</table>

<h4>Error handling — retriable বনাম fatal, আর DLQ</h4>
<p>সব error এক নয়; কোনটায় কী করবেন সেটাই production-quality কোডের পার্থক্য:</p>
<table>
<tr><th>ধরন</th><th>উদাহরণ</th><th>করণীয়</th></tr>
<tr><td><span class="kw">Retriable</span> (transient)</td><td><code>LeaderNotAvailable</code>, <code>NotEnoughReplicas</code>, network/<code>RequestTimedOut</code></td><td>producer নিজেই retry করে (delivery.timeout-এর মধ্যে) — আপনার সাধারণত কিছু করার নেই</td></tr>
<tr><td><span class="kw">Fatal</span> (non-retriable)</td><td><code>RecordTooLarge</code>, serialization fail, <code>AuthorizationFailed</code></td><td>retry অর্থহীন — catch করে DLQ + alert; message ঠিক করুন</td></tr>
<tr><td><span class="kw">Producer-fenced</span></td><td><code>OutOfOrderSequence</code>, fencing (idempotence/txn)</td><td>এই producer instance আর ব্যবহারযোগ্য নয় → নতুন producer বানান</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
retries শেষ হলে বা fatal error-এ message নীরবে <b>drop</b> করা (বা শুধু log করে এগিয়ে যাওয়া)। Production-এ ব্যর্থ message + error metadata একটা <span class="kw">Dead Letter Queue</span> (<code>&lt;topic&gt;.DLQ</code>) topic-এ পাঠান — পরে reprocess/অডিট করা যায়। Silent drop = নীরব data loss।</div>

<h4>Graceful shutdown ও Flush</h4>
<p>Producer async — <code>ProduceAsync()</code>/<code>Produce()</code> সাথে সাথে পাঠায় না, buffer-এ জমিয়ে batch করে। তাই process হঠাৎ থামলে buffer-এ বসে থাকা (এখনো না-পাঠানো) message হারায়। Shutdown-এর আগে <code>Flush()</code> দিয়ে সব pending send সম্পূর্ণ করা <b>বাধ্যতামূলক</b>।</p>
<pre>AppDomain.CurrentDomain.ProcessExit += (_, _) =&gt; {
    producer.Flush(TimeSpan.FromSeconds(10));   <span class="c">// buffered সব message পাঠানো শেষ করো</span>
};
<span class="c">// SIGTERM (K8s pod stop) এলেও একইভাবে Flush → তারপর exit</span></pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
K8s <code>SIGTERM</code>-এ Flush ছাড়া pod বন্ধ করা → shutdown-এর মুহূর্তে buffer-এ থাকা message হারায়, অথচ producer কখনো error দেয়নি। <code>terminationGracePeriodSeconds</code> Flush timeout-এর চেয়ে বড় রাখুন।</div>

<h4>কী monitor করবেন — Producer metrics</h4>
<table>
<tr><th>Metric</th><th>কী বলে</th><th>Alarm কখন</th></tr>
<tr><td><code>record-error-rate</code></td><td>delivery fail/sec</td><td>&gt; 0 হলেই তদন্ত</td></tr>
<tr><td><code>record-retry-rate</code></td><td>retry/sec</td><td>বেড়ে গেলে → broker/network অসুস্থ</td></tr>
<tr><td><code>request-latency-avg</code> / p99</td><td>broker round-trip</td><td>spike = broker overload</td></tr>
<tr><td><code>buffer-available-bytes</code></td><td>ফাঁকা buffer</td><td>0-র দিকে নামলে → backpressure, <code>send()</code> block হবে</td></tr>
<tr><td><code>batch-size-avg</code></td><td>গড় batch bytes</td><td>খুব ছোট = batching হচ্ছে না (throughput নষ্ট)</td></tr>
<tr><td><code>compression-rate-avg</code></td><td>compression ratio</td><td>খারাপ হলে batch/codec পুনর্বিবেচনা</td></tr>
</table>

<h3>Code Example — Producer (.NET / Confluent.Kafka)</h3>
<pre><span class="c">// dotnet add package Confluent.Kafka</span>
var config = new ProducerConfig {
    BootstrapServers      = "broker1:9092,broker2:9092,broker3:9092",
    Acks                  = Acks.All,          <span class="c">// সব ISR confirm</span>
    EnableIdempotence     = true,              <span class="c">// duplicate/reorder রোধ</span>
    CompressionType       = CompressionType.Lz4,
    LingerMs              = 10,                 <span class="c">// batching এর জন্য একটু অপেক্ষা</span>
    MessageSendMaxRetries = int.MaxValue,
};

using var producer = new ProducerBuilder&lt;string, string&gt;(config).Build();

var msg = new Message&lt;string, string&gt; {
    Key     = invoiceId,                       <span class="c">// একই invoice → একই partition (ordering)</span>
    Value   = JsonSerializer.Serialize(invoice),
    Headers = new Headers { { "traceId", Encoding.UTF8.GetBytes(traceId) } }
};

try {
    var dr = await producer.ProduceAsync("accounting.invoice.created", msg);
    Console.WriteLine($"Delivered → {dr.TopicPartitionOffset}");  <span class="c">// topic-partition-offset</span>
}
catch (ProduceException&lt;string, string&gt; ex) {
    Console.WriteLine($"Failed: {ex.Error.Reason}");  <span class="c">// error handle করুন, চেপে যাবেন না</span>
}</pre>

<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li><code>acks=1</code> রেখে "data হারাবে না" ধরে নেওয়া — leader crash হলে হারায়।</li>
<li><code>retries</code> সেট কিন্তু idempotence off → duplicate + reordering।</li>
<li><code>ProduceAsync()</code>-এর result/exception ignore করা — error চাপা পড়ে যায়। await/try-catch দিয়ে handle করুন।</li>
<li>প্রতিটা message-এ নতুন producer তৈরি করা — producer heavyweight, একটাই বানিয়ে reuse করুন (thread-safe)।</li>
</ul></div>
</template>

<h4>একটা group আসলে কোন সমস্যা সমাধান করে?</h4>
<p>একটা topic-এ দিনে কোটি message এলে <b>একটা</b> consumer একা পড়তে গেলে দুটো সমস্যা: (১) throughput সীমিত — যত দ্রুত process করা যায় ততটুকুই, আর (২) ঐ consumer crash করলে পুরো pipeline থেমে যায় (single point of failure)। Consumer group একই কাজ একাধিক consumer-এ <b>ভাগ</b> করে দেয় — partition-গুলো members-দের মধ্যে বণ্টন হয়, ফলে <span class="kw">horizontal scaling</span> (consumer বাড়ালে throughput বাড়ে) আর <span class="kw">fault tolerance</span> (একটা মরলে তার partition অন্যরা নিয়ে নেয়) — দুটোই একসাথে পাওয়া যায়। এই দুটোই group abstraction-এর মূল কারণ।</p>

<h4>Consumer ও Consumer Group কীভাবে define করবেন</h4>
<p>মনে রাখার মতো ব্যাপার: consumer group আলাদা কোনো admin command দিয়ে "বানাতে" হয় না। আপনি শুধু একটা consumer-এ <code>group.id</code> সেট করেন — প্রথম <code>poll()</code>-এ সে coordinator-এ register হয় আর তখনই group-টা অস্তিত্বে আসে। একই <code>group.id</code>-তে আরও process চালালে তারা <b>একই</b> group-এ যোগ দেয় (কাজ ভাগ), ভিন্ন <code>group.id</code> দিলে <b>আলাদা</b> group (স্বাধীন copy)।</p>
<pre>var config = new ConsumerConfig {
    BootstrapServers = "broker:9092",
    GroupId          = "billing-service",   <span class="c">// এই এক লাইনই group define করে</span>
    AutoOffsetReset  = AutoOffsetReset.Earliest,
    EnableAutoCommit = false,
};
using var consumer = new ConsumerBuilder&lt;string, string&gt;(config).Build();
consumer.Subscribe("orders");   <span class="c">// group-managed: auto partition assignment</span>
<span class="c">// এই instance এখন billing-service group এর সদস্য।</span>
<span class="c">// একই GroupId দিয়ে আরও replica চালালে partition আপনাআপনি ভাগ হয়।</span></pre>
<div class="callout behind"><span class="tag">Subscribe বনাম Assign</span>
<code>Subscribe()</code> = group-managed — coordinator partition বণ্টন করে, rebalance হয়, offset <code>__consumer_offsets</code>-এ commit হয় (তাই <code>group.id</code> লাগে)। বিপরীতে <code>Assign()</code>-এ আপনি নিজে নির্দিষ্ট partition পিন করেন — কোনো group coordination বা rebalance নেই। এক consumer-কে সব partition পড়ানো বা ad-hoc debugging tool ছাড়া প্রায় সবসময় <code>Subscribe</code>।</div>

<h4>কখন Group, কখন একটা Consumer যথেষ্ট — আর best option</h4>
<p>মূল প্রশ্ন দুটো: "কতগুলো process একই কাজ ভাগ করবে?" আর "একই data কতজন স্বাধীনভাবে দরকার?" — উত্তর অনুযায়ী:</p>
<table>
<tr><th>যা দরকার</th><th>সমাধান</th><th>কীভাবে</th></tr>
<tr><td>একাধিক instance-এ কাজ ভাগ করে throughput বাড়ানো</td><td>Group (একাধিক member)</td><td>একই <code>group.id</code> + বেশি partition</td></tr>
<tr><td>Fault tolerance — একটা মরলে অন্যে দখল নিক</td><td>Group (২+ member/standby)</td><td>একই <code>group.id</code></td></tr>
<tr><td>একই data একাধিক ভিন্ন কাজে</td><td>একাধিক group (fan-out)</td><td>প্রতি service আলাদা <code>group.id</code></td></tr>
<tr><td>কম volume, এক process-ই যথেষ্ট</td><td>এক-সদস্যের group</td><td>একটা consumer + একটা <code>group.id</code></td></tr>
<tr><td>প্রতিটা instance-কে <b>সব</b> message পেতে হবে (broadcast)</td><td>প্রতি instance আলাদা group</td><td><code>group.id = "cache-" + hostname</code></td></tr>
<tr><td>এক reader সব partition পড়বে / ad-hoc tool</td><td>Group ছাড়া standalone</td><td><code>Assign()</code> manual partition</td></tr>
</table>
<div class="callout best"><span class="tag">Best option</span>
Production-এ প্রায় সবসময় <b>Subscribe + একটা <code>group.id</code></b> — এমনকি এখন একটাই consumer চললেও। কারণ group থাকলে offset persist হয় (restart-এ যেখানে ছিল সেখান থেকেই শুরু) আর পরে instance বাড়ালেই বিনা code-পরিবর্তনে scale + failover পাওয়া যায়। "একটাই consumer, group লাগবে না" ভেবে <code>Assign</code> দিয়ে শুরু করলে scaling-এ আটকে যাবেন — তাই <code>Assign</code> শুধু সত্যিকারের standalone দরকারে।</div>

<h4>Real example — তিনটা বাস্তব সিদ্ধান্ত</h4>
<p><b>১) Order / Billing service — group লাগবেই।</b> <code>orders</code> topic-এ সেকেন্ডে হাজারো order, invoice বানাতে হবে, service থামলে চলবে না। → <code>group.id=billing-service</code>, topic-এ 12 partition, Kubernetes-এ 6 replica। Load ভাগ হয়, একটা pod মরলে বাকিরা তার partition নিয়ে নেয়, peak-এ replica ১২ পর্যন্ত বাড়ানো যায়।</p>
<p><b>২) একই order থেকে analytics + audit — fan-out, আলাদা group।</b> একই <code>orders</code> data billing invoice বানায়, analytics metric গোনে, audit লগ রাখে — কেউ কারো offset টানে না। → তিনটা আলাদা <code>group.id</code> (উপরের fan-out ছবি)।</p>
<p><b>৩) Config / feature-flag broadcast — প্রতি instance আলাদা group।</b> একটা <code>feature-flags</code> (compacted) topic; প্রতিটা app instance-কে <b>সব</b> flag পেতে হবে যাতে নিজের in-memory cache আপডেট রাখতে পারে — load ভাগ করলে চলবে না। → প্রতিটা instance-এ unique <code>group.id</code> (যেমন <code>flags-&lt;hostname&gt;</code>), যাতে সবাই পুরো stream পায়।</p>
<div class="callout mistake"><span class="tag">Common mistake</span>
Broadcast (সবাই সব চায়) দরকারে ভুল করে সব instance-কে <b>একই</b> <code>group.id</code> দেওয়া — তখন Kafka load-balance করে, প্রতিটা message মাত্র একটা instance পায়, বাকিদের cache পুরনো থেকে যায়। মনে রাখুন: broadcast = প্রতি consumer আলাদা group; work-share = একই group।</div>

<h4>কে ও কীভাবে partition সংখ্যা ঠিক করে</h4>
<p>জরুরি ব্যাপার: partition সংখ্যা <b>topic-এর property</b> — producer বা consumer এটা ঠিক করে না, তারা শুধু cluster metadata থেকে সংখ্যাটা <b>জেনে নেয়</b>। সংখ্যাটা নির্ধারণ করে <b>topic-এর owner</b> (সাধারণত platform/DevOps team), topic তৈরির সময়। Application developer কয়টা দরকার হিসাব করে দেয় (উপরের consumer-parallelism অনুযায়ী), আর platform team সেই topic provision করে।</p>
<p><b>১) CLI দিয়ে (সবচেয়ে প্রচলিত):</b></p>
<pre><span class="c"># তৈরির সময়ই partition সংখ্যা ঠিক হয়</span>
kafka-topics --create --topic orders \
  --partitions 12 --replication-factor 3 \
  --bootstrap-server broker:9092</pre>
<p><b>২) Admin API দিয়ে (কোড থেকে — .NET / Confluent.Kafka):</b></p>
<pre>using var admin = new AdminClientBuilder(
    new AdminClientConfig { BootstrapServers = "broker:9092" }).Build();

await admin.CreateTopicsAsync(new[] {
    new TopicSpecification {
        Name              = "orders",
        NumPartitions     = 12,      <span class="c">// এখানেই partition সংখ্যা</span>
        ReplicationFactor = 3
    }
});</pre>
<div class="callout behind"><span class="tag">Mental model</span>
<code>Topic</code> → <b>N</b> partition (owner ঠিক করে, create-এর সময়)। <code>Producer</code> N জেনে <code>key % N</code>-এ partition বাছে। <code>Consumer group</code> N জেনে সেই N partition নিজেদের মধ্যে ভাগ করে। পরে <code>--alter --partitions</code> দিয়ে শুধু <b>বাড়ানো</b> যায় (কমানো যায় না), আর বাড়ালে <code>key → partition</code> mapping বদলে per-key ordering ভাঙে — তাই শুরুতেই ঠিকমতো নিন।</div>

<h4>তাহলে কতগুলো partition বানাবো? — consumer-এর দৃষ্টিতে</h4>
<p>যেহেতু একটা group-এ কার্যকর consumer-এর সর্বোচ্চ সংখ্যা = partition সংখ্যা, তাই partition কয়টা বানাবেন সেটা মূলত নির্ভর করে "সর্বোচ্চ কতজন consumer একসাথে parallel চালাতে হবে" তার ওপর। উল্টো দিক থেকে ভাবুন — <b>আগে consumer-এর দরকার হিসাব করুন, তারপর partition ঠিক ততগুলো</b> (বা সামান্য বেশি) রাখুন।</p>
<p>দ্রুত হিসাব:</p>
<div class="callout"><b>partition ≥ target throughput ÷ এক consumer যত process করতে পারে</b></div>
<p>যেমন peak <code>60,000 msg/s</code>, আর একটা consumer (DB-write সহ) সামলায় <code>5,000 msg/s</code> → অন্তত <code>60000 ÷ 5000 = 12</code> consumer লাগবে → topic-এ অন্তত <b>12 partition</b> বানাতে হবে। (পূর্ণ formula ও trade-off Scaling ট্যাবে।)</p>
<p>Consumer-দিক থেকে আরও দুটো বিবেচনা:</p>
<ul>
<li><b>Fan-out থাকলে সবচেয়ে ভারী group ধরে size করুন।</b> একই topic-এর <code>analytics</code> group যদি <code>billing</code>-এর চেয়ে ধীরে process করে ও বেশি consumer চায়, partition সংখ্যা সেই বড় চাহিদা মেটাতে হবে — কারণ প্রতিটা group একই partition সংখ্যায় bound।</li>
<li><b>Headroom রাখুন।</b> partition শুধু <b>বাড়ানো</b> যায়, কমানো যায় না; আর বাড়ালে একই key নতুন partition-এ যেতে পারে → per-key ordering ভাঙে। তাই শুরুতেই ২–৩× ভবিষ্যৎ peak ধরে রাখুন।</li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake</span>
"পরে consumer বাড়ালেই তো scale হবে" ভেবে topic-এ কম partition (যেমন 3) দিয়ে শুরু করা। পরে ১০টা consumer deploy করলেও মাত্র 3টা কাজ করবে, বাকি 7টা <b>idle</b> — throughput আর বাড়বে না। তখন partition বাড়াতে হবে, যা চলন্ত অবস্থায় ordering ঝুঁকিসহ। তাই partition সংখ্যা <b>আগেই</b> ঠিকমতো নিন।</div>

<h4>DevOps নতুন instance deploy করলে কী ঘটে — scaling বাস্তবে</h4>
<p><b>হ্যাঁ — আপনার বোঝা ঠিক।</b> DevOps যখন নতুন একটা consumer instance deploy করে আর তাতে <b>একই <code>group.id</code></b> সেট থাকে, সেই instance আপনাআপনি ঐ একই consumer group-এ যোগ দেয়। আলাদা কোনো "member যোগ করো" command লাগে না — process চালু হয়ে coordinator-কে <b>JoinGroup</b> পাঠালেই সে group-এর সদস্য। বাকি consumer-দের কোড বদলানো বা restart করাও লাগে না।</p>
<p>ধাপে ধাপে:</p>
<ol>
<li>নতুন pod একই <code>group.id</code> নিয়ে চালু → প্রথম <code>poll()</code>-এ coordinator-কে <b>JoinGroup</b>।</li>
<li>Coordinator একটা <span class="kw">rebalance</span> শুরু করে — partition-গুলো এখন পুরনো + নতুন সব member-এর মধ্যে নতুন করে ভাগ হয়।</li>
<li>নতুন member কিছু partition পায়, প্রতি member-এর ভাগ কমে → মোট throughput বাড়ে।</li>
</ol>
<p>উদাহরণে (topic-এ 6 partition):</p>
<table>
<tr><th>অবস্থা</th><th>Member সংখ্যা</th><th>Partition বণ্টন</th></tr>
<tr><td>Deploy-এর আগে</td><td>3 pod</td><td>প্রতি pod 2 (6 ÷ 3)</td></tr>
<tr><td>নতুন 1টা pod deploy-এর পরে</td><td>4 pod</td><td>2, 2, 1, 1 (rebalance করে)</td></tr>
<tr><td>আরও বাড়িয়ে</td><td>6 pod</td><td>প্রতি pod 1 — সর্বোচ্চ parallelism</td></tr>
<tr><td>৭ম pod</td><td>7 pod</td><td>6টা কাজ করে, 1টা <b>idle</b> standby</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
এই deploy-scaling মসৃণ রাখতে <code>CooperativeStickyAssignor</code> + static membership (নিচে দেখুন) ব্যবহার করুন — নাহলে প্রতিবার deploy-এ "stop-the-world" rebalance-এ কিছুক্ষণ পুরো group থমকে যায়। rolling deploy-এ একাধিক pod পরপর গেলে/এলে যেন rebalance storm না হয়, সেজন্যই static membership (স্থায়ী <code>group.instance.id</code>)।</div>
<div class="callout mistake"><span class="tag">Common mistake</span>
নতুন instance-এ <code>group.id</code> <b>হুবহু</b> এক হতে হবে — extra space, typo, বা ভিন্ন environment variable থেকে অন্য value এলে সে আলাদা একটা group বানিয়ে ফেলবে। তখন load ভাগ না হয়ে ঐ instance <b>পুরো topic আবার শুরু থেকে</b> পড়া শুরু করবে (duplicate processing)। আর মনে রাখুন: instance সংখ্যা partition-এর বেশি দিলে extra-গুলো শুধু idle বসে থাকবে (Scaling ট্যাবও দেখুন)।</div>

<h4>Offset কেন group-ভিত্তিক</h4>
<p>Committed offset <code>__consumer_offsets</code> topic-এ জমা হয় <b>(group.id, topic, partition)</b> key-তে। তাই প্রতিটা group-এর অগ্রগতি সম্পূর্ণ স্বাধীন — <code>billing</code> group offset 5000-এ থাকলেও <code>analytics</code> group একই partition-এ 200-এ পিছিয়ে থাকতে পারে, কেউ কাউকে প্রভাবিত করে না। এজন্যই একটা group-এর offset reset (নিচের CLI ট্যাবে) করলে অন্য group অক্ষত থাকে, আর নতুন <code>group.id</code> দিলে সে <code>auto.offset.reset</code> অনুযায়ী শূন্য থেকে শুরু করে।</p>
<div class="callout mistake"><span class="tag">Common mistake</span>
পুরনো data আবার process করতে বিদ্যমান group-এর offset reset না করে চট করে <code>group.id</code> বদলে ফেলা — এতে ঐ নতুন group-এর জন্য <code>__consumer_offsets</code>-এ কিছু থাকে না, তাই <code>auto.offset.reset</code>-এর ওপর নির্ভর করতে হয়; <code>latest</code> থাকলে পুরনো কিছুই আসবে না। ইচ্ছাকৃত reprocessing হলে বরং একই group-এ <code>--reset-offsets --to-earliest</code> ব্যবহার করুন।</div>

<h3>Offset, Commit, Auto vs Manual</h3>
<p><span class="kw">Offset</span> = consumer কোন position পর্যন্ত পড়েছে। এটা commit হয় <code>__consumer_offsets</code> topic-এ।</p>
<table>
<tr><th>Mode</th><th>কীভাবে</th><th>ঝুঁকি</th></tr>
<tr><td><span class="kw">Auto commit</span></td><td><code>enable.auto.commit=true</code>, প্রতি <code>auto.commit.interval.ms</code></td><td>process-এর আগে commit হয়ে গেলে data loss / বা duplicate</td></tr>
<tr><td><span class="kw">Manual sync</span></td><td><code>commitSync()</code> process-এর পর</td><td>নিরাপদ কিন্তু blocking</td></tr>
<tr><td><span class="kw">Manual async</span></td><td><code>commitAsync()</code></td><td>দ্রুত কিন্তু retry নেই; শেষে sync দিন</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
At-least-once চাইলে: <code>enable.auto.commit=false</code>, message <b>process করার পরে</b> <code>commitSync()</code>। তারপর consumer-কে idempotent বানান (Production ট্যাব)।</div>

<h4>auto.offset.reset — প্রথমবার কোথা থেকে পড়বে?</h4>
<p>যখন consumer group-এর কোনো committed offset <b>নেই</b> (একদম নতুন group), অথবা saved offset আর নেই (retention-এ মুছে গেছে), তখন কোথা থেকে শুরু করবে সেটা এই config ঠিক করে:</p>
<table>
<tr><th>মান</th><th>আচরণ</th><th>কখন</th></tr>
<tr><td><code>earliest</code></td><td>partition-এর একদম শুরু থেকে সব পড়ে</td><td>পুরনো data-ও process করা দরকার (accounting reprocessing)</td></tr>
<tr><td><code>latest</code> (default)</td><td>শুধু নতুন আসা message থেকে</td><td>শুধু "এখন থেকে" event দরকার</td></tr>
<tr><td><code>none</code></td><td>offset না থাকলে error throw</td><td>কড়া control চাইলে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
নতুন consumer group deploy করে <code>latest</code>-এ রেখে "কেন পুরনো message পাচ্ছি না?" — কারণ latest শুধু deploy-এর পরের message দেয়। পুরনো data চাইলে <code>earliest</code>।</div>

<h3>poll() — heart of the consumer</h3>
<p><code>poll(timeout)</code> শুধু data-ই আনে না — এটাই consumer-এর liveness signal, rebalance participation, heartbeat coordination সব চালায়। দুই <code>poll()</code>-এর মাঝে <code>max.poll.interval.ms</code>-এর বেশি সময় লাগলে consumer "dead" ধরে নেওয়া হয় → rebalance।</p>

<h3>Rebalance, Heartbeat, Session Timeout</h3>
<p>Consumer জোড়া/বিদায় নিলে বা crash করলে partition পুনর্বণ্টন হয় — এটাই <span class="kw">rebalance</span>। Consumer background-এ <span class="kw">heartbeat</span> পাঠায় (<code>heartbeat.interval.ms</code>) group coordinator-কে। <code>session.timeout.ms</code>-এর মধ্যে heartbeat না পেলে consumer dead ধরা হয়।</p>

<h4>Eager vs Cooperative (Sticky) Rebalance</h4>
<table>
<tr><th></th><th>Eager (পুরনো)</th><th>Cooperative Sticky (নতুন)</th></tr>
<tr><td>রীতি</td><td>সব consumer সব partition ছাড়ে ("stop-the-world"), তারপর নতুন করে বণ্টন</td><td>শুধু যেসব partition move হবে সেগুলোই ছাড়ে</td></tr>
<tr><td>প্রভাব</td><td>পুরো group কিছুক্ষণ থেমে যায়</td><td>বাকি consumer কাজ চালিয়ে যায়</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
<code>partition.assignment.strategy=CooperativeStickyAssignor</code> ব্যবহার করুন — rebalance-এ downtime অনেক কমে। <span class="kw">Sticky</span> assignment consumer-কে যতটা সম্ভব আগের partition-ই রাখতে চেষ্টা করে (state/cache নষ্ট হয় না)।</div>

<h4>Static Membership — rolling restart-এ অপ্রয়োজনীয় rebalance ঠেকান</h4>
<p>বাস্তব সমস্যা: Kubernetes-এ deploy করলে বা pod restart করলে প্রতিটা consumer কয়েক সেকেন্ডের জন্য চলে যায় আর ফেরে — প্রতিবার একটা করে rebalance ট্রিগার হয়। ১০টা consumer-এর rolling restart = ১০+ rebalance, প্রতিবার processing থমকে যায়।</p>
<p><span class="kw">Static membership</span> এর সমাধান দেয়: প্রতিটা consumer-কে একটা স্থায়ী <code>group.instance.id</code> দিন (যেমন <code>billing-0</code>, <code>billing-1</code>)। তখন coordinator জানে "এই instance-টা ফিরে আসবে" — <code>session.timeout.ms</code>-এর মধ্যে ফিরলে <b>rebalance হয় না</b>, একই partition আবার পায়।</p>
<pre><span class="c">// প্রতি pod এ আলাদা, কিন্তু restart এর পরও একই থাকতে হবে</span>
GroupInstanceId = "billing-" + Environment.GetEnvironmentVariable("POD_ORDINAL"),
SessionTimeoutMs = 45000,   <span class="c">// restart এর সময়ের চেয়ে বেশি রাখুন</span></pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
সব pod-এ একই <code>group.instance.id</code> দেওয়া → coordinator বিভ্রান্ত হয় (duplicate instance), fencing error। প্রতিটা instance-এর id অবশ্যই unique <b>এবং</b> restart-এর পরও একই হতে হবে (তাই random GUID নয়, StatefulSet ordinal ব্যবহার করুন)।</div>

<h3>Code Example — Consumer (.NET / Confluent.Kafka)</h3>
<pre>var config = new ConsumerConfig {
    BootstrapServers            = "broker1:9092,broker2:9092",
    GroupId                     = "billing-service",   <span class="c">// একই group.id = load ভাগ</span>
    EnableAutoCommit            = false,                <span class="c">// আমরা নিজে commit করব</span>
    AutoOffsetReset             = AutoOffsetReset.Earliest,
    IsolationLevel              = IsolationLevel.ReadCommitted,  <span class="c">// শুধু committed txn</span>
    PartitionAssignmentStrategy = PartitionAssignmentStrategy.CooperativeSticky,
    MaxPollIntervalMs           = 300000,
};

using var consumer = new ConsumerBuilder&lt;string, string&gt;(config).Build();
consumer.Subscribe("accounting.invoice.created");

while (!ct.IsCancellationRequested) {
    var cr = consumer.Consume(ct);          <span class="c">// poll — data + heartbeat + rebalance</span>
    try {
        await HandleAsync(cr.Message);      <span class="c">// business logic (idempotent!)</span>
        consumer.Commit(cr);                <span class="c">// process করার পরেই commit</span>
    }
    catch (TransientException) {
        <span class="c">// commit করবেন না → পরের poll এ আবার এই offset আসবে (retry)</span>
    }
}
consumer.Close();  <span class="c">// graceful — offset commit + পরিষ্কার rebalance</span></pre>

<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li>poll loop-এ ভারী/ধীর কাজ করা → <code>max.poll.interval.ms</code> পার → বারবার rebalance ("rebalance storm")। সমাধান: <code>max.poll.records</code> কমান বা কাজ async করুন।</li>
<li>Consumer সংখ্যা partition-এর বেশি রেখে "scale করছি" ভাবা — অতিরিক্তগুলো idle।</li>
<li>Shutdown-এ <code>Close()</code> না করা → coordinator session timeout পর্যন্ত অপেক্ষা করে, rebalance দেরি হয়।</li>
</ul></div>

<h3>Dead Letter Queue (DLQ) — poison message সামলানো</h3>
<p>কিছু message কখনোই সফলভাবে process হয় না — ভুল format, deserialize error, বা এমন business condition যা কোড হ্যান্ডল করতে পারে না। এদের বলে <span class="kw">poison message</span>। এদের নিয়ে আগে থেকে পরিকল্পনা না থাকলে বিপদ: consumer একই message-এ বারবার fail করে, offset commit হয় না, ঐ partition <b>আটকে</b> যায় — পেছনের সব ভালো message দাঁড়িয়ে থাকে (<span class="kw">head-of-line blocking</span>)। সমাধান: ব্যর্থ message-কে একটা আলাদা জায়গায় সরিয়ে দিন যাতে মূল প্রবাহ চলতে থাকে — এটাই <b>DLQ</b>।</p>

<div class="callout behind"><span class="tag">Kafka-তে DLX নেই — শুধু DLQ (নিজে বানাতে হয়)</span>
<b>Dead Letter Exchange (DLX)</b> আসলে <b>RabbitMQ</b>-র ধারণা — সেখানে message reject/expire/TTL শেষ হলে broker <b>স্বয়ংক্রিয়ভাবে</b> একটা DLX (আর তার পেছনের dead-letter queue)-এ পাঠিয়ে দেয়। Kafka-তে exchange বলে কিছু নেই, আর <b>কোনো built-in DLX/DLQ-ও নেই</b>। Kafka-তে DLQ মানে নিছক একটা <b>আলাদা topic</b> (যেমন <code>orders.DLQ</code>) — আপনার consumer কোড (বা framework) ব্যর্থ message সেখানে produce করে দেয়। অর্থাৎ Kafka-তে DLQ একটা <b>pattern</b>, feature নয়। (RabbitMQ ট্যাবে DLX আলাদাভাবে আসবে।)</div>

<h4>প্রবাহ — retry, তারপর DLQ</h4>
<div class="diagram"><pre>
orders topic ─► Consumer ─try─► process ✅ ─► offset commit
                   │
                   └─ fail ─► কয়েকবার retry (transient হলে কেটে যায়)
                                  │
                              এখনো fail (poison)?
                                  │
                                  ▼
                        orders.DLQ topic  ◄─ ব্যর্থ message + কারণ (headers)
                                  │
                                  ▼
                        আলাদা করে দেখা / alert / fix করে replay
</pre></div>
<p>মূল ধারণা: <b>transient</b> error (যেমন DB সাময়িক down) হলে অল্প কয়েকবার retry করুন — কেটে যাবে। কিন্তু message নিজেই <b>খারাপ</b> হলে (retry-তে কখনো ঠিক হবে না) সেটাকে DLQ-তে সরিয়ে offset commit করে দিন — তাহলে মূল partition আর আটকাবে না।</p>

<h4>DLQ message-এ কী কী রাখবেন</h4>
<p>শুধু payload পাঠালে পরে debug করা কঠিন। ব্যর্থতার প্রসঙ্গ <b>header</b>-এ রাখুন:</p>
<ul>
<li>মূল <code>topic</code>, <code>partition</code>, <code>offset</code> — message কোথা থেকে এসেছিল।</li>
<li>Exception টাইপ ও বার্তা — কেন fail করল।</li>
<li>কতবার retry হয়েছিল, আর কখন fail করল (timestamp)।</li>
<li>মূল key ও payload <b>অক্ষত</b> রাখুন — পরে replay করার জন্য।</li>
</ul>

<h4>Code — DLQ producer সহ consumer (.NET / Confluent.Kafka)</h4>
<pre>using var dlq = new ProducerBuilder&lt;string, string&gt;(producerConfig).Build();

while (!ct.IsCancellationRequested) {
    var cr = consumer.Consume(ct);
    try {
        await HandleAsync(cr.Message);        <span class="c">// business logic</span>
        consumer.Commit(cr);                  <span class="c">// সফল → এগিয়ে যাও</span>
    }
    catch (TransientException) {
        <span class="c">// commit করবেন না → পরের poll এ আবার আসবে (retry)।</span>
        <span class="c">// retry count সীমা পেরোলে একে poison ধরে নিচের DLQ পথে দিন।</span>
    }
    catch (Exception ex) {                     <span class="c">// poison — retry অর্থহীন</span>
        var msg = new Message&lt;string, string&gt; {
            Key     = cr.Message.Key,          <span class="c">// key + payload অক্ষত</span>
            Value   = cr.Message.Value,
            Headers = new Headers {
                { "x-origin-topic",     Encoding.UTF8.GetBytes(cr.Topic) },
                { "x-origin-partition", Encoding.UTF8.GetBytes(cr.Partition.Value.ToString()) },
                { "x-origin-offset",    Encoding.UTF8.GetBytes(cr.Offset.Value.ToString()) },
                { "x-error",            Encoding.UTF8.GetBytes(ex.Message) },
                { "x-failed-at",        Encoding.UTF8.GetBytes(DateTimeOffset.UtcNow.ToString("o")) },
            }
        };
        await dlq.ProduceAsync("orders.DLQ", msg);   <span class="c">// সরিয়ে দাও</span>
        consumer.Commit(cr);                   <span class="c">// DLQ তে গেছে → offset এগিয়ে দাও (partition আর আটকাবে না)</span>
    }
}</pre>

<div class="callout best"><span class="tag">Best practice</span>
<ul style="margin:4px 0">
<li><b>retry ও DLQ আলাদা রাখুন:</b> transient error → কয়েকবার retry (in-place বা আলাদা <code>orders.retry</code> topic-এ); শুধু permanent/poison → DLQ।</li>
<li>Framework থাকলে হাতে না লিখে সেটাই ব্যবহার করুন: Kafka Connect-এ <code>errors.tolerance=all</code> + <code>errors.deadletterqueue.topic.name</code>; Spring Kafka-তে <code>DeadLetterPublishingRecoverer</code>।</li>
<li>DLQ থেকে <b>replay</b> করার একটা flow/tool রাখুন — bug fix করার পর message আবার মূল topic-এ ফেরত পাঠানো।</li>
<li>DLQ-তে message এলে <b>alert</b> দিন (যেমন DLQ lag &gt; 0)।</li>
</ul></div>
<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li>poison message-এ <b>অসীম retry</b> → partition চিরতরে আটকে, পেছনের সব message দাঁড়িয়ে থাকে।</li>
<li>DLQ-তে ফেলে offset <b>commit না করা</b> → পরের poll-এ আবার সেই message → আবার DLQ → infinite loop (আর DLQ-তে duplicate)।</li>
<li>DLQ-তে শুধু payload পাঠানো, কোনো error/origin metadata ছাড়া → পরে কেন fail করল বোঝা অসম্ভব।</li>
<li>DLQ কখনো <b>monitor না করা</b> → নীরবে message জমে থাকা মানে নীরব data loss-এর সমান।</li>
</ul></div>
</template>

<h2 class="title">৭. Replication — গভীরভাবে</h2>
<p class="lead">Leader, follower, ISR, high watermark, leader election — আর broker crash করলে ঠিক কী হয়।</p>

<h3>Leader ও Follower</h3>
<p>প্রতিটা partition-এর একটা replica <span class="kw">leader</span> — সব produce/consume এর মধ্য দিয়ে যায়। বাকি replica <span class="kw">follower</span>, যারা leader থেকে continuously fetch করে copy রাখে। Follower client-কে serve করে না (কিছু নতুন সংস্করণে follower-fetch আছে, তবে default leader থেকেই)।</p>

<h3>ISR (In-Sync Replicas)</h3>
<p>যেসব follower leader-এর সাথে <code>replica.lag.time.max.ms</code>-এর মধ্যে sync আছে, তারা ISR-এ। পিছিয়ে পড়লে ISR থেকে বাদ, আবার ধরে ফেললে ফিরে আসে।</p>

<h3>High Watermark (HW)</h3>
<p><span class="kw">High watermark</span> = সেই offset পর্যন্ত যা সব ISR-এ replicate হয়ে গেছে। Consumer শুধু HW পর্যন্তই পড়তে পারে — কারণ এর নিচের data নিশ্চিতভাবে durable। HW-এর উপরের (শুধু leader-এ আছে, follower-এ যায়নি) data consumer দেখতে পায় না।</p>

</figure>

<h3>min.insync.replicas</h3>
<p><code>acks=all</code>-এর সাথে <code>min.insync.replicas=2</code> মানে: write সফল হতে হলে অন্তত ২টা replica (leader সহ) লিখতে হবে। ISR ২-এর নিচে নামলে producer <code>NotEnoughReplicas</code> error পায় — অর্থাৎ Kafka data হারানোর চেয়ে write reject করা পছন্দ করে।</p>
<div class="callout why"><span class="tag">Why RF=3 + minISR=2 জনপ্রিয়</span>
RF=3 হলে ১টা broker down হলেও minISR=2 পূর্ণ থাকে → write চলে + data safe। এটা availability আর durability-র মধ্যে সেরা ভারসাম্য।</div>

<h3>Leader Election ও Unclean Leader Election</h3>
<p>Leader broker down হলে Controller ISR থেকে একটা follower-কে নতুন leader বানায় (clean election — কোনো data loss নেই)।</p>
<p><span class="kw">Unclean leader election</span>: যদি সব ISR-ও down থাকে এবং <code>unclean.leader.election.enable=true</code> হয়, তবে একটা out-of-sync replica-কে leader বানানো হয় — এতে availability ফেরে কিন্তু কিছু committed data হারাতে পারে।</p>
<div class="callout best"><span class="tag">Best practice</span>
Accounting/financial data-তে <code>unclean.leader.election.enable=false</code> রাখুন — availability-র চেয়ে durability গুরুত্বপূর্ণ। data হারানোর চেয়ে কিছুক্ষণ unavailable থাকা ভালো।</div>

<div class="callout behind"><span class="tag">Leader Epoch — কেন leader-epoch-checkpoint ফাইল দরকার</span>
Storage ট্যাবে segment directory-তে <code>leader-epoch-checkpoint</code> ফাইলটা দেখেছেন — এখানে তার কারণ। পুরনো Kafka-তে leader বদলালে follower নিজের log leader-এর high watermark পর্যন্ত blindly truncate করত — কিন্তু কিছু বিরল crash-sequence-এ (leader পরপর দ্রুত বদলালে) এই truncation ভুল জায়গায় হয়ে replica-দের মধ্যে <b>silent log divergence</b> (এমনকি data loss) ঘটাতে পারত। সমাধান: <span class="kw">Leader Epoch</span> — প্রতিবার নতুন leader নির্বাচিত হলে একটা monotonically increasing সংখ্যা বাড়ে, আর leader প্রতিটা offset range ঠিক কোন epoch-এ লেখা হয়েছে তা track করে (এটাই checkpoint ফাইলে থাকে)। Follower rejoin করার সময় blindly truncate না করে leader-কে জিজ্ঞেস করে "আমার শেষ epoch-এ তোমার log ঠিক কোথায় শেষ হয়েছে" (<code>OffsetsForLeaderEpoch</code> API) — ঠিক সেই নিরাপদ point-এ truncate করে। ফলে leader change-এর পরও replica-দের মধ্যে log consistency নিশ্চিত থাকে।</div>

<h3>Replication Lag</h3>
<p>Follower কতটা পিছিয়ে (offset difference বা time)। Lag বাড়লে follower ISR থেকে পড়ে যায় → availability ঝুঁকি। কারণ: slow disk, network, বা overloaded broker। Monitor করুন <code>UnderReplicatedPartitions</code> metric।</p>

<h3>Broker crash করলে কী হয়? — step by step</h3>
<ol>
<li>Broker-এর heartbeat বন্ধ → Controller detect করে।</li>
<li>সেই broker-এ থাকা যেসব partition <b>leader</b> ছিল, সেগুলোর জন্য ISR থেকে নতুন leader নির্বাচন।</li>
<li>Producer/consumer metadata refresh করে নতুন leader-এর broker-এ redirect হয় (কয়েক সেকেন্ডের glitch)।</li>
<li>Broker ফিরে এলে follower হিসেবে rejoin করে, পিছিয়ে থাকা data catch-up করে ISR-এ ফেরে।</li>
<li>ঐচ্ছিকভাবে <code>preferred leader election</code>-এ leader ভারসাম্য ফেরানো হয়।</li>
</ol>
<div class="callout why"><span class="tag">Preferred Leader Election — কেন দরকার</span>
লক্ষ্য করুন ধাপ ৪-এ broker ফিরে এলেও সে আবার leader হয়ে যায় <b>না</b> — শুধু follower হিসেবে rejoin করে, নতুন leader-ই থেকে যায়। বারবার এমন failover হতে থাকলে কিছু broker সময়ের সাথে বেশি leader জমিয়ে ফেলে, বাকিরা কম — এই অসমতাই <b>leader imbalance</b> (কিছু broker-এ load বেশি, কিছুতে কম)। প্রতিটা partition তৈরির সময় replica list-এর প্রথম broker-কে <span class="kw">preferred leader</span> ধরা হয়; broker সুস্থভাবে ফিরে এলে <code>preferred leader election</code> (auto — <code>auto.leader.rebalance.enable=true</code>, অথবা <code>kafka-leader-election</code> CLI দিয়ে manual) leadership আবার সেই preferred broker-এ ফিরিয়ে দেয়, যাতে load সব broker-এ সমান থাকে।</div>
</template>
