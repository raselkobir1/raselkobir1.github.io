<h2 class="title">১. Scaling কী, কেন এবং Vertical vs Horizontal Scaling</h2>
<p class="lead">একটা সিস্টেম ১০০ জন ইউজারের জন্য নিখুঁতভাবে কাজ করতে পারে, আর ১০ লাখ ইউজারে গিয়ে সম্পূর্ণ ভেঙে পড়তে পারে — Scaling হলো সেই ব্যবধান ঘোচানোর বিজ্ঞান।</p>

<h3>Scaling কী এবং কেন দরকার</h3>
<p><span class="kw">Scaling</span> মানে হলো একটা সিস্টেমকে এমনভাবে তৈরি করা যাতে ট্র্যাফিক, ডেটার পরিমাণ বা কম্পিউটেশনের চাহিদা বাড়লেও সিস্টেম একই গতিতে (বা কাছাকাছি গতিতে) সাড়া দিতে পারে। প্রতিটা সার্ভারের একটা সীমা আছে — নির্দিষ্ট পরিমাণ CPU, RAM, disk I/O, এবং network bandwidth। একটা নির্দিষ্ট সংখ্যক concurrent request-এর পরে সেই সার্ভার হয় ধীর হয়ে যায় (latency বেড়ে যায়), অথবা রিকোয়েস্ট প্রত্যাখ্যান করতে শুরু করে, অথবা crash করে। Scaling স্ট্র্যাটেজি ঠিক করে এই সীমা অতিক্রম করার আগেই সিস্টেম কীভাবে অতিরিক্ত ক্যাপাসিটি যোগ করবে।</p>

<h3>Vertical Scaling (Scale Up)</h3>
<p><span class="kw">Vertical Scaling</span> মানে একটা একক সার্ভারের রিসোর্স বাড়ানো — বেশি CPU core, বেশি RAM, দ্রুত SSD। এটা সবচেয়ে সহজ scaling পদ্ধতি, কারণ কোডে কোনো পরিবর্তন লাগে না, শুধু বড় instance-এ migrate করলেই হয়।</p>
<ul>
<li><b>সুবিধা:</b> বাস্তবায়ন সহজ, কোনো distributed system জটিলতা নেই, data consistency নিয়ে চিন্তা করতে হয় না।</li>
<li><b>সীমাবদ্ধতা:</b> একটা হার্ডওয়্যার ceiling আছে — যত টাকাই খরচ করুন, একটা মেশিনের ক্ষমতা অসীম না। খরচও linear না, বরং exponential — সবচেয়ে বড় instance টাইপ প্রায়ই অসামঞ্জস্যপূর্ণভাবে ব্যয়বহুল। এবং এটা <b>single point of failure</b> — সেই একটা মেশিন ডাউন হলে পুরো সার্ভিস ডাউন।</li>
</ul>

<h3>Horizontal Scaling (Scale Out)</h3>
<p><span class="kw">Horizontal Scaling</span> মানে একটা মেশিনের ক্ষমতা না বাড়িয়ে আরও অনেকগুলো ছোট মেশিন যোগ করা, এবং তাদের মধ্যে ট্র্যাফিক ভাগ করে দেওয়া। এখানেই <span class="kw">Load Balancer</span> (পরের অধ্যায়ে বিস্তারিত) আবশ্যক হয়ে পড়ে — কারণ একাধিক সার্ভার থাকলে কেউ একজন ঠিক করে দিতে হয় কোন রিকোয়েস্ট কোন সার্ভারে যাবে।</p>
<ul>
<li><b>সুবিধা:</b> তাত্ত্বিকভাবে প্রায় unlimited ক্যাপাসিটি — চাহিদা বাড়লে আরও instance যোগ করা যায়। Fault tolerance ভালো — একটা instance ডাউন হলে বাকিগুলো ট্র্যাফিক সামলাতে পারে। Auto-scaling এর মাধ্যমে ট্র্যাফিক অনুযায়ী instance সংখ্যা কমানো-বাড়ানো যায়, ফলে কম ট্র্যাফিকের সময় খরচ বাঁচে।</li>
<li><b>চ্যালেঞ্জ:</b> সার্ভিসকে <b>stateless</b> হতে হয় (পরের অধ্যায়ে বিস্তারিত), একাধিক সার্ভারে ডেটা consistency বজায় রাখা কঠিন হয়ে যায়, এবং distributed system-এর সাধারণ জটিলতাগুলো (network failure, partial failure, coordination) সামনে চলে আসে।</li>
</ul>

<h3>Scalability-এর প্রকারভেদ</h3>
<p>শুধু ট্র্যাফিক লোড না, স্কেলেবিলিটির আরও কিছু মাত্রা আছে যেগুলো ইন্টারভিউ ও ডিজাইনে গুরুত্বপূর্ণ — <b>Load Scalability</b> (বেশি রিকোয়েস্ট/ব্যবহারকারী সামলানো), <b>Geographic Scalability</b> (বিভিন্ন অঞ্চলের ইউজারদের কাছাকাছি low-latency service দেওয়া, multi-region deployment), এবং <b>Administrative Scalability</b> (একাধিক টিম বা সংস্থা একই সিস্টেমে নির্বিঘ্নে কাজ করতে পারা — microservices ও API Gateway এই মাত্রাতেই গুরুত্বপূর্ণ ভূমিকা রাখে)।</p>

<div class="callout why"><span class="tag">কেন প্রথমে Vertical, তারপর Horizontal</span>
বাস্তব অভিজ্ঞতা বলে, প্রথম দিকে vertical scaling দিয়েই বেশিরভাগ সমস্যার সমাধান হয়ে যায় — একটা মাঝারি ট্র্যাফিকের অ্যাপ একটা বড় instance-এই আরামে চলে। Horizontal scaling-এর জটিলতা (statelessness, distributed session, data consistency) আগেভাগে ইনভেস্ট করার মতো খরচ না, যতক্ষণ না প্রকৃত প্রয়োজন দেখা দেয়।</div>

<div class="callout mistake"><span class="tag">Common mistake — Day 1 থেকেই "Netflix-scale" আর্কিটেকচার বানানো</span>
১০০ জন ইউজারের একটা স্টার্টআপ যদি শুরু থেকেই ৫০টা microservice, multi-region deployment আর জটিল sharding স্ট্র্যাটেজি নিয়ে বসে, তারা মূল প্রোডাক্ট বানানোর বদলে অপারেশনাল জটিলতায় ডুবে যায়। Scaling decision নেওয়া উচিত measured data এবং প্রকৃত bottleneck দেখে, অনুমান করে না।</div>

<div class="callout best"><span class="tag">Best practice — Stateless থেকে শুরু করুন, এমনকি ছোট স্কেলেও</span>
Vertical scaling দিয়ে শুরু করলেও, অ্যাপ্লিকেশন লজিককে stateless রাখা একটা সস্তা বিনিয়োগ যা ভবিষ্যতে horizontal scaling-এ যাওয়া সহজ করে দেয়। এটা একটা এমন সিদ্ধান্ত যা শুরুতেই নেওয়া সহজ, পরে রিফ্যাক্টর করা কঠিন।</div>

<h2 class="title">২. Application Layer Scaling — Statelessness, Session ও Auto-Scaling</h2>
<p class="lead">Horizontal scaling তখনই কাজ করে যখন যেকোনো রিকোয়েস্ট যেকোনো সার্ভার সামলাতে পারে — আর সেটা নিশ্চিত করে একটাই নীতি: statelessness।</p>

<h3>Stateless Design — Horizontal Scaling-এর ভিত্তি</h3>
<p>একটা <span class="kw">stateless service</span> কোনো request-এর তথ্য পরবর্তী request-এর জন্য নিজের মেমোরিতে সংরক্ষণ করে না — প্রতিটা request নিজের মধ্যেই সম্পূর্ণ (client identity, auth token, প্রয়োজনীয় ডেটা)। এর ফলে Load Balancer যেকোনো একটা healthy instance-এ যেকোনো request পাঠাতে পারে, কারণ কোনো instance-এর ওপর নির্ভরতা নেই। বিপরীতে, একটা <span class="kw">stateful service</span> যদি একজন ইউজারের সেশন ডেটা নিজের RAM-এ রাখে, তাহলে সেই ইউজারের পরবর্তী প্রতিটা রিকোয়েস্ট ঠিক সেই একই instance-এ যেতে হবে — এটাই horizontal scaling-এর সবচেয়ে বড় বাধা।</p>

<h3>Session হ্যান্ডলিং — তিনটা সমাধান</h3>
<table>
<tr><th>পদ্ধতি</th><th>কীভাবে কাজ করে</th><th>সমস্যা</th></tr>
<tr><td>Sticky Session (Session Affinity)</td><td>LB একজন ইউজারের সব request একই server-এ পাঠায় (cookie/IP hash দিয়ে)</td><td>Load unevenly বিতরণ হতে পারে; সেই server ডাউন হলে ইউজার লগ-আউট হয়ে যায়</td></tr>
<tr><td>Centralized Session Store</td><td>Session data Redis/Memcached-এর মতো shared store-এ রাখা হয়, যেকোনো server সেখান থেকে পড়ে</td><td>প্রতিটা request-এ extra network hop; session store নিজেই bottleneck/SPOF হতে পারে (তাই সেটাও redundant করতে হয়)</td></tr>
<tr><td>Token-based (Stateless Auth)</td><td>JWT-এর মতো self-contained token client-এ থাকে, সার্ভার কোনো session state রাখে না</td><td>Token revoke করা কঠিন (blacklist দরকার হতে পারে); token বড় হলে প্রতি request-এ বাড়তি ডেটা</td></tr>
</table>
<p>Production সিস্টেমে সাধারণত <b>Centralized Session Store</b> অথবা <b>Token-based Auth</b> ব্যবহার হয়, কারণ দুটোই সত্যিকারের stateless horizontal scaling সাপোর্ট করে — sticky session কে সাধারণত একটা anti-pattern হিসেবে দেখা হয়, কারণ এটা মূল সমস্যাটা (statefulness) সমাধান না করে আড়াল করে রাখে।</p>

<div class="diagram"><pre>
Stateless Architecture:

  [Client] ──▶ [Load Balancer] ──▶ [App Server 1] ──┐
                     │             [App Server 2] ──┼──▶ [Redis: Session/Cache]
                     └────────────▶ [App Server 3] ──┘         │
                                                          [Database]
  যেকোনো request যেকোনো App Server-এ যেতে পারে —
  কারণ সেশন ডেটা server-এ না, shared store-এ থাকে।
</pre></div>

<h3>Auto-Scaling — চাহিদা অনুযায়ী instance বাড়ানো-কমানো</h3>
<p><span class="kw">Auto-Scaling</span> হলো একটা পদ্ধতি যেখানে real-time মেট্রিক্স (CPU utilization, memory, request count, queue depth) দেখে স্বয়ংক্রিয়ভাবে instance সংখ্যা বাড়ানো বা কমানো হয়।</p>
<ul>
<li><b>Reactive/Target Tracking Scaling:</b> একটা target metric ঠিক করে দেওয়া হয় (যেমন average CPU 60%) — সিস্টেম সেই টার্গেট ধরে রাখার জন্য instance যোগ/বাদ দেয়।</li>
<li><b>Step Scaling:</b> নির্দিষ্ট threshold ক্রস করলে ধাপে ধাপে instance বাড়ানো (৭০% CPU-তে +২টা, ৯০%-এ +৫টা)।</li>
<li><b>Scheduled Scaling:</b> পূর্বানুমানযোগ্য ট্র্যাফিক প্যাটার্নের জন্য (যেমন প্রতিদিন সকাল ৯টায় ট্র্যাফিক বাড়ে) আগে থেকেই instance বাড়ানো।</li>
<li><b>Predictive Scaling:</b> ঐতিহাসিক ডেটা থেকে ML মডেল দিয়ে ট্র্যাফিক পূর্বাভাস দিয়ে আগেভাগে scale করা।</li>
</ul>
<p>একটা গুরুত্বপূর্ণ ধারণা হলো <b>cooldown period</b> — একটা scaling action নেওয়ার পর কিছু সময় অপেক্ষা করা, যাতে নতুন instance বুট হয়ে metrics স্থিতিশীল হওয়ার আগেই আরেকটা scaling action ট্রিগার না হয়ে যায়। এই সুরক্ষা না থাকলে <b>scaling flapping</b> হতে পারে — বারবার instance বাড়ানো-কমানো, যা resource নষ্ট করে এবং সিস্টেমকে অস্থির করে তোলে।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু CPU দেখে scale করা</span>
অনেক সার্ভিস CPU-bound না, বরং I/O-bound (ডেটাবেস কল, external API কল অপেক্ষা করা) — সেক্ষেত্রে CPU কম থাকলেও request queue জমে যেতে পারে এবং latency বেড়ে যেতে পারে। সঠিক scaling policy সেই মেট্রিক দেখা উচিত যা প্রকৃতপক্ষে bottleneck নির্দেশ করে — request latency, queue depth, বা concurrent connection সংখ্যা।</div>

<div class="callout best"><span class="tag">Best practice — Scale out আগে, Scale in সাবধানে</span>
ট্র্যাফিক বাড়লে দ্রুত scale out করা উচিত (aggressive), কিন্তু ট্র্যাফিক কমলে ধীরে scale in করা উচিত (conservative) — কারণ ভুলভাবে দ্রুত instance কমিয়ে ফেললে হঠাৎ ট্র্যাফিক spike এলে সিস্টেম overload হয়ে যেতে পারে।</div>
</template>

<h2 class="title">৩. Database ও Caching Scaling — Replication, Sharding, Cache, CDN</h2>
<p class="lead">অ্যাপ্লিকেশন সার্ভার scale করা তুলনামূলক সহজ কারণ সেগুলো stateless করা যায় — কিন্তু ডেটাবেস স্বভাবতই stateful, তাই এখানেই স্কেলিং সবচেয়ে কঠিন এবং গুরুত্বপূর্ণ।</p>

<h3>Read Scaling — Replication (Leader-Follower)</h3>
<p>বেশিরভাগ সিস্টেমে read traffic write traffic-এর চেয়ে অনেক গুণ বেশি (যেমন ৯০% read, ১০% write)। <span class="kw">Read Replica</span> বা <span class="kw">Leader-Follower Replication</span>-এ একটা primary/leader ডাটাবেস সব write গ্রহণ করে, এবং সেই পরিবর্তন asynchronously একাধিক follower/replica-তে propagate হয়। সব read query replica থেকে সার্ভ করা হয়, ফলে leader-এর ওপর চাপ কমে এবং read throughput horizontal ভাবে বাড়ানো যায়।</p>
<div class="callout why"><span class="tag">Replication Lag — একটা গুরুত্বপূর্ণ trade-off</span>
Replica asynchronously sync হয় বলে সামান্য দেরি (lag) থাকে — একটা write করার পরপরই সেই replica থেকে read করলে পুরনো ডেটা দেখা যেতে পারে (eventual consistency)। এই কারণেই "write করার পরপরই নিজের করা write দেখতে পাওয়া" (read-your-writes) দরকার হলে সেই নির্দিষ্ট read leader থেকে করতে হয়, replica থেকে না।
</div>

<h3>Write Scaling — Sharding / Partitioning</h3>
<p>Replication read স্কেল করে, কিন্তু write সবসময় leader-এই যায় — একটা নির্দিষ্ট পয়েন্টের পর leader একাই সব write সামলাতে পারে না। <span class="kw">Sharding</span> ডেটাকে একাধিক independent ডাটাবেসে ভাগ করে দেয়, যেখানে প্রতিটা shard ডেটার একটা অংশের মালিক।</p>
<ul>
<li><b>Range-based Sharding:</b> একটা key range অনুযায়ী ভাগ (যেমন user_id 1-1M shard-1, 1M-2M shard-2) — সহজ কিন্তু hotspot তৈরি হতে পারে যদি একটা range-এ বেশি activity হয়।</li>
<li><b>Hash-based Sharding:</b> key-এর hash অনুযায়ী shard নির্ধারণ — লোড সমানভাবে ছড়ায়, কিন্তু range query কঠিন হয়ে যায়।</li>
<li><b>Geographic/Directory-based Sharding:</b> ব্যবহারকারীর অঞ্চল বা একটা lookup table অনুযায়ী শার্ড নির্ধারণ — ভালো data locality, কিন্তু lookup layer নিজেই একটা extra dependency।</li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake — ভুল shard key বেছে নেওয়া</span>
একটা খারাপ shard key (যেমন এমন একটা কলাম যেখানে ৮০% ট্র্যাফিক একটা মাত্র value-তে জমা হয়) পুরো sharding-এর উদ্দেশ্যই নষ্ট করে দেয় — একটা shard hot হয়ে যায় আর বাকিগুলো অলস বসে থাকে। Resharding (পরে shard key বদলানো) production ডেটাতে করা অত্যন্ত ব্যয়বহুল এবং ঝুঁকিপূর্ণ, তাই এই সিদ্ধান্ত আগেভাগে সতর্কতার সাথে নেওয়া উচিত।
</div>

<h3>Caching — ডাটাবেসের ওপর চাপ কমানো</h3>
<p><span class="kw">Cache</span> (Redis/Memcached) হলো একটা দ্রুত in-memory লেয়ার যা বারবার একই ডেটা পড়া থেকে ডাটাবেসকে বাঁচায়।</p>
<table>
<tr><th>প্যাটার্ন</th><th>কীভাবে কাজ করে</th></tr>
<tr><td>Cache-Aside (Lazy Loading)</td><td>অ্যাপ্লিকেশন প্রথমে cache চেক করে; miss হলে DB থেকে পড়ে cache-এ বসিয়ে দেয়</td></tr>
<tr><td>Write-Through</td><td>প্রতিটা write একই সাথে cache ও DB-তে যায় — cache সবসময় up-to-date</td></tr>
<tr><td>Write-Behind (Write-Back)</td><td>write আগে cache-এ যায়, পরে asynchronously DB-তে flush হয় — দ্রুত কিন্তু ডেটা হারানোর ঝুঁকি</td></tr>
</table>
<p>Cache-এর সবচেয়ে কঠিন সমস্যা হলো <b>cache invalidation</b> — যখন আসল ডেটা বদলায়, cache-এর পুরনো কপি সরানো বা আপডেট করা। এজন্য সাধারণত একটা TTL (Time To Live) সেট করে রাখা হয়, যাতে stale ডেটা একটা নির্দিষ্ট সময় পর নিজে থেকেই মুছে যায়।</p>

<h3>CDN — Origin সার্ভার থেকে দূরে সরানো</h3>
<p><span class="kw">Content Delivery Network (CDN)</span> স্ট্যাটিক অ্যাসেট (image, CSS, JS, video) এবং কখনও কখনও API response ব্যবহারকারীর কাছাকাছি geographically distributed edge server-এ cache করে রাখে। এটা শুধু latency কমায় না, origin সার্ভারে পৌঁছানো ট্র্যাফিকের পরিমাণও নাটকীয়ভাবে কমিয়ে দেয় — স্কেলিং-এর প্রথম এবং সবচেয়ে cost-effective স্তর।</p>

<div class="diagram"><pre>
[User] ──▶ [CDN Edge (কাছের অঞ্চল)] ──cache hit──▶ ব্যবহারকারীকে সরাসরি রেসপন্স
                    │
                cache miss
                    ▼
             [Load Balancer] ──▶ [App Servers] ──▶ [Cache: Redis] ──▶ [DB Leader]
                                                                          │
                                                                   [Read Replicas]
</pre></div>

<div class="callout best"><span class="tag">Best practice — Cache প্রথমে, Sharding শেষে</span>
Caching এবং read replica অপেক্ষাকৃত সহজ এবং কম ঝুঁকিপূর্ণ, তাই এগুলো আগে চেষ্টা করা উচিত। Sharding সবচেয়ে জটিল এবং সবচেয়ে বেশি অপারেশনাল ঝুঁকিপূর্ণ (resharding, cross-shard query, distributed transaction) — তাই এটা তখনই করা উচিত যখন প্রকৃতপক্ষে একটা একক ডাটাবেসের write ক্ষমতা bottleneck হয়ে দাঁড়ায়, অন্য কোনো বিকল্প না থাকলে।</div>

<h2 class="title">৪. Load Balancer Fundamentals — কী, কেন, Layer 4 vs Layer 7</h2>
<p class="lead">Horizontal scaling-এ একাধিক সার্ভার তৈরি করাই যথেষ্ট না — কেউ একজন ঠিক করে দিতে হয় কোন request কোন সার্ভারে যাবে, এবং ঠিক এই কাজটাই করে Load Balancer।</p>

<h3>Load Balancer কী এবং কেন দরকার</h3>
<p><span class="kw">Load Balancer (LB)</span> হলো এমন একটা component যা incoming network traffic একাধিক backend server-এর মধ্যে বিতরণ করে দেয়। এটা চারটা মূল উদ্দেশ্য সাধন করে —</p>
<ul>
<li><b>Load Distribution:</b> কোনো একটা সার্ভার overload না হয়ে ট্র্যাফিক সমানভাবে ছড়িয়ে যায়।</li>
<li><b>High Availability:</b> একটা সার্ভার ডাউন হলে LB স্বয়ংক্রিয়ভাবে সেই সার্ভারে ট্র্যাফিক পাঠানো বন্ধ করে দেয় (health check-এর মাধ্যমে), ইউজার কিছু টের পায় না।</li>
<li><b>Scalability সক্ষম করা:</b> নতুন সার্ভার যোগ করলে LB স্বয়ংক্রিয়ভাবে সেখানে ট্র্যাফিক পাঠানো শুরু করে — এটাই horizontal scaling-এর ভিত্তি।</li>
<li><b>একটাই entry point:</b> Client-দের একটাই ঠিকানা (single IP/domain) মনে রাখতে হয়, backend-এ কতগুলো সার্ভার আছে তা জানার দরকার হয় না।</li>
</ul>

<h3>Reverse Proxy বনাম Load Balancer</h3>
<p>দুটো শব্দ প্রায়ই একে অপরের বদলে ব্যবহৃত হয়, কারণ প্রযুক্তিগতভাবে একই সফটওয়্যার (Nginx, HAProxy) দুটো কাজই করতে পারে। পার্থক্যটা মূলত উদ্দেশ্যে — <span class="kw">Reverse Proxy</span> একটা মাত্র backend-এর সামনে বসে client থেকে backend সরিয়ে রাখে (security, SSL termination, caching, compression-এর জন্য), যেখানে <span class="kw">Load Balancer</span>-এর মূল কাজ একাধিক backend-এর মধ্যে ট্র্যাফিক বিতরণ করা। বাস্তবে একটা LB প্রায় সবসময় reverse proxy-এর কাজও করে (client থেকে backend-এর আসল ঠিকানা আড়াল করে)।</p>

<h3>Layer 4 (Transport Layer) Load Balancing</h3>
<p><span class="kw">L4 Load Balancer</span> OSI মডেলের Transport Layer-এ কাজ করে — এটা শুধু IP address এবং TCP/UDP port দেখে সিদ্ধান্ত নেয়, request-এর ভেতরের কনটেন্ট (HTTP header, URL, cookie) দেখে না। এটা একটা TCP connection নিয়ে সরাসরি একটা backend-এ forward করে দেয় (NAT বা direct routing-এর মাধ্যমে), প্যাকেট পড়ে বা পার্স করে না।</p>

<h3>Layer 7 (Application Layer) Load Balancing</h3>
<p><span class="kw">L7 Load Balancer</span> HTTP/HTTPS request-এর ভেতরের কনটেন্ট দেখে সিদ্ধান্ত নেয় — URL path (<code>/api/users</code> বনাম <code>/api/orders</code>), HTTP header, cookie, বা এমনকি request body দেখে ভিন্ন ভিন্ন backend-এ route করতে পারে। এর জন্য LB-কে পুরো HTTP request terminate ও পার্স করতে হয়, তাই এটা L4-এর চেয়ে বেশি CPU ব্যবহার করে, কিন্তু অনেক বেশি smart routing সম্ভব।</p>

<table>
<tr><th>দিক</th><th>Layer 4 (L4)</th><th>Layer 7 (L7)</th></tr>
<tr><td>দেখে কী</td><td>IP + Port (TCP/UDP)</td><td>HTTP header, URL, cookie, body</td></tr>
<tr><td>গতি</td><td>দ্রুত, কম overhead</td><td>ধীর (তুলনামূলক), বেশি CPU লাগে</td></tr>
<tr><td>Routing ক্ষমতা</td><td>শুধু IP/port ভিত্তিক</td><td>content-based routing, path-based, cookie-based</td></tr>
<tr><td>SSL Termination</td><td>সাধারণত করে না (pass-through)</td><td>করতে পারে</td></tr>
<tr><td>ব্যবহার</td><td>উচ্চ-throughput, low-latency প্রয়োজন (gaming, streaming)</td><td>ওয়েব API, microservices routing</td></tr>
</table>

<div class="diagram"><pre>
                         ┌─────────────────────┐
[Client] ──HTTPS──▶      │   Load Balancer      │
                         │  (SSL terminate,     │
                         │   L7 routing)        │
                         └──────────┬───────────┘
              /api/users            │            /api/orders
                 ▼                  │                 ▼
          [User Service]            │          [Order Service]
                                    ▼
                             [Payment Service]
</pre></div>

<div class="callout why"><span class="tag">কেন বেশিরভাগ ওয়েব সিস্টেম L7 ব্যবহার করে</span>
আধুনিক microservices আর্কিটেকচারে একই ডোমেইনের বিভিন্ন path বিভিন্ন সার্ভিসে যেতে হয় — এটা শুধু L7-এই সম্ভব, কারণ L4 request-এর ভেতরের URL দেখতেই পারে না। L4 তখনই যথেষ্ট যখন backend homogeneous (সব সার্ভার একই কাজ করে) এবং raw throughput সবচেয়ে গুরুত্বপূর্ণ।</div>

<div class="callout mistake"><span class="tag">Common mistake — Load Balancer আর API Gateway গুলিয়ে ফেলা</span>
LB মূলত traffic distribution আর health-based routing-এ ফোকাসড, কিন্তু authentication, rate limiting, request transformation-এর মতো কাজ সাধারণত এর দায়িত্ব না — সেটা API Gateway-এর কাজ (৬ষ্ঠ অধ্যায়ে বিস্তারিত)। আধুনিক আর্কিটেকচারে দুটো প্রায়ই একসাথে থাকে, একে অপরের বদলি না।</div>
</template>

<template data-page="lb-advanced">
<h2 class="title">৫. Load Balancer Algorithms, Health Check ও Global Load Balancing</h2>
<p class="lead">"কোন সার্ভারে পরের request যাবে" — এই সিদ্ধান্তটাই Load Balancer-এর মূল অ্যালগরিদম, আর সেই সিদ্ধান্ত ভুল হলে পুরো scaling-এর সুবিধা নষ্ট হয়ে যায়।</p>

<h3>Load Balancing Algorithms</h3>
<table>
<tr><th>Algorithm</th><th>কীভাবে কাজ করে</th><th>কখন উপযুক্ত</th></tr>
<tr><td>Round Robin</td><td>প্রতিটা backend-এ পালাক্রমে request পাঠানো</td><td>সব backend সমান ক্ষমতার হলে</td></tr>
<tr><td>Weighted Round Robin</td><td>প্রতিটা backend-এর ক্ষমতা অনুযায়ী weight দিয়ে ভাগ করা</td><td>backend-গুলোর হার্ডওয়্যার ক্ষমতা ভিন্ন হলে</td></tr>
<tr><td>Least Connections</td><td>যে backend-এ বর্তমানে সবচেয়ে কম active connection, সেখানে পাঠানো</td><td>request-এর processing time ভিন্ন ভিন্ন হলে</td></tr>
<tr><td>Least Response Time</td><td>সবচেয়ে কম latency + কম connection থাকা backend বেছে নেওয়া</td><td>latency-sensitive সিস্টেমে</td></tr>
<tr><td>IP Hash</td><td>client IP-এর hash অনুযায়ী নির্দিষ্ট backend fix করা</td><td>session affinity দরকার হলে</td></tr>
<tr><td>Consistent Hashing</td><td>hash ring-এ ম্যাপ করে; backend যোগ/বাদ দিলে ন্যূনতম re-mapping হয়</td><td>caching layer বা distributed system-এ, node পরিবর্তনে minimal disruption দরকার হলে</td></tr>
</table>

<div class="callout why"><span class="tag">কেন Consistent Hashing বিশেষভাবে গুরুত্বপূর্ণ</span>
সাধারণ hash (<code>hash(key) % N</code>) ব্যবহার করলে backend সংখ্যা (N) পরিবর্তন হলে প্রায় সব key-ই নতুন backend-এ চলে যায় — cache-এর ক্ষেত্রে এটা প্রায় সম্পূর্ণ cache invalidation ঘটায়। Consistent Hashing একটা hash ring ব্যবহার করে যেখানে একটা node যোগ/বাদ দিলে শুধু তার আশেপাশের অংশটুকু প্রভাবিত হয়, বাকি সব key তাদের আগের backend-এই থেকে যায়।</div>

<h3>Health Check — Unhealthy Backend সরিয়ে রাখা</h3>
<p>Load Balancer নিয়মিতভাবে প্রতিটা backend-এর স্বাস্থ্য পরীক্ষা করে —</p>
<ul>
<li><b>Active Health Check:</b> LB নিজে থেকে একটা নির্দিষ্ট endpoint-এ (যেমন <code>/health</code>) পিরিয়ডিক request পাঠায়; সাড়া না পেলে বা error এলে সেই backend-কে রোটেশন থেকে বাদ দেয়।</li>
<li><b>Passive Health Check:</b> স্বাভাবিক ট্র্যাফিকের response monitor করে — একটা backend থেকে ধারাবাহিকভাবে timeout বা 5xx error এলে সেটাকে unhealthy চিহ্নিত করা হয়।</li>
</ul>
<p>Unhealthy backend recover করলে (পরবর্তী সফল health check-এ) LB স্বয়ংক্রিয়ভাবে আবার সেখানে ট্র্যাফিক পাঠানো শুরু করে।</p>

<h3>Sticky Session (Session Affinity)</h3>
<p>কখনও কখনও একজন ইউজারের সব request একই backend-এ পাঠানো দরকার হয় (legacy in-memory session থাকলে) — LB একটা cookie সেট করে (যেমন <code>AWSALB</code>) যা দিয়ে পরবর্তী request-গুলো একই backend-এ রুট করে। যদিও ৪র্থ অধ্যায়ে আলোচিত হয়েছে stateless architecture-ই পছন্দনীয়, sticky session একটা fallback হিসেবে থাকে যখন legacy সিস্টেম রিফ্যাক্টর করা এখনও সম্ভব হয়নি।</p>

<h3>SSL/TLS Termination</h3>
<p>LB প্রায়ই client থেকে HTTPS connection গ্রহণ করে, সেটা decrypt করে, এবং backend-এর সাথে plain HTTP (বা internal network-এ সরলীকৃত TLS) ব্যবহার করে — একে <span class="kw">SSL Termination</span> বলে। এতে প্রতিটা backend সার্ভারে আলাদা করে certificate ম্যানেজ করতে হয় না, এবং backend সার্ভার শুধু plain HTTP handle করলেই চলে, ফলে কম CPU ব্যয় হয়।</p>

<h3>Global Load Balancing</h3>
<p>একটা একক অঞ্চলের LB শুধু সেই region-এর backend-এর মধ্যে ভাগ করতে পারে — বিশ্বব্যাপী ব্যবহারকারীদের জন্য <span class="kw">Global/Geo Load Balancing</span> দরকার হয়।</p>
<ul>
<li><b>DNS-based (GeoDNS):</b> DNS query-এর ভিত্তিতে ব্যবহারকারীর ভৌগোলিক অবস্থান অনুযায়ী কাছের region-এর IP ফেরত দেওয়া (যেমন AWS Route 53, Azure Traffic Manager)।</li>
<li><b>Anycast:</b> একই IP address একাধিক location থেকে announce করা হয়; network routing (BGP) নিজেই ব্যবহারকারীর কাছাকাছি location-এ রুট করে দেয় — CDN ও DDoS প্রতিরোধে ব্যাপকভাবে ব্যবহৃত হয়।</li>
<li><b>GSLB (Global Server Load Balancing):</b> একাধিক region-এর health ও latency দেখে সবচেয়ে ভালো region-এ ট্র্যাফিক পাঠানো, এবং একটা পুরো region ডাউন হলে অন্য region-এ failover করা।</li>
</ul>

<h3>Load Balancer নিজেই যাতে Single Point of Failure না হয়</h3>
<p>একটা মজার বাস্তবতা হলো, LB নিজেই একটা single point of failure হয়ে দাঁড়াতে পারে যদি শুধু একটা LB instance থাকে। এজন্য production-এ সাধারণত <b>Active-Passive LB Pair</b> (VRRP/keepalived দিয়ে একটা floating IP শেয়ার করা, primary ডাউন হলে secondary টেক ওভার করে) অথবা cloud-managed LB (যা নিজেই internally redundant, যেমন AWS ALB/NLB) ব্যবহার করা হয়।</p>

<div class="callout mistake"><span class="tag">Common mistake — LB-কে "সেট করে ভুলে যাওয়া" component ভাবা</span>
LB নিজেই ভুল কনফিগার করা health check, ভুল timeout, বা একক instance হিসেবে থাকার কারণে পুরো সিস্টেমের bottleneck বা outage-এর কারণ হতে পারে। LB-এর নিজস্ব monitoring, redundancy এবং capacity planning ঠিক ততটাই গুরুত্বপূর্ণ যতটা backend সার্ভারের।</div>

<div class="callout best"><span class="tag">Best practice — Health check timeout ও threshold সাবধানে ঠিক করুন</span>
খুব aggressive health check (যেমন ১ সেকেন্ড interval, ১ বার ফেইল হলেই বাদ) একটা সাময়িক network glitch-এর কারণে সুস্থ সার্ভারকেও রোটেশন থেকে বাদ দিতে পারে (false positive), যা বাকি সার্ভারগুলোতে অতিরিক্ত চাপ ফেলে। সাধারণত কয়েকবার ধারাবাহিক ব্যর্থতার (consecutive failures) পরই একটা backend-কে unhealthy ঘোষণা করা হয়।</div>
</template>

<template data-page="gateway-basics">
<h2 class="title">৬. API Gateway Fundamentals — কী, কেন এবং দায়িত্ব</h2>
<p class="lead">একটা microservices সিস্টেমে যদি প্রতিটা client সরাসরি প্রতিটা সার্ভিসের সাথে কথা বলে, তাহলে auth, rate limiting, logging-এর মতো cross-cutting concern প্রতিটা সার্ভিসে আলাদা করে লিখতে হয় — API Gateway এই সমস্যার সমাধান।</p>

<h3>API Gateway কী</h3>
<p><span class="kw">API Gateway</span> হলো client এবং backend সার্ভিসগুলোর মধ্যে একটা single entry point — সব external request প্রথমে gateway-তে আসে, এবং gateway সিদ্ধান্ত নেয় সেটা কোন internal সার্ভিসে পাঠাতে হবে। Client-দের কাছে পুরো microservices আর্কিটেকচার একটাই coherent API হিসেবে দেখা যায়, ভেতরে কতগুলো সার্ভিস আছে তা জানার দরকার হয় না।</p>

<h3>API Gateway-এর মূল দায়িত্ব</h3>
<ul>
<li><b>Routing:</b> URL path/header অনুযায়ী সঠিক microservice-এ request পাঠানো।</li>
<li><b>Authentication ও Authorization:</b> প্রতিটা সার্ভিসে আলাদা করে auth লজিক না লিখে, একটা কেন্দ্রীয় জায়গায় token যাচাই করা।</li>
<li><b>Rate Limiting ও Throttling:</b> প্রতিটা client/API key-এর জন্য request সীমা বলবৎ করা (১২-১৩ অধ্যায়ে বিস্তারিত)।</li>
<li><b>Request/Response Transformation:</b> প্রোটোকল রূপান্তর (যেমন REST ↔ gRPC), পুরনো client-দের জন্য response reshape করা।</li>
<li><b>Aggregation/Composition:</b> একটা client request-এর জন্য একাধিক backend সার্ভিস কল করে একত্র করে একটাই response দেওয়া।</li>
<li><b>Logging, Monitoring, Tracing:</b> সব ট্র্যাফিকের একটা কেন্দ্রীয় দৃশ্যমানতা (visibility) দেওয়া।</li>
<li><b>SSL Termination ও Caching:</b> LB-এর মতো একই সুবিধা।</li>
</ul>

<h3>API Gateway বনাম Load Balancer বনাম Reverse Proxy</h3>
<p>এই তিনটা শব্দ প্রায়ই ওভারল্যাপ করে কারণ কার্যত একই ধরনের infrastructure component (Nginx, Envoy, Kong) দিয়ে তিনটাই বানানো সম্ভব — পার্থক্যটা মূলত <b>abstraction level ও intent</b>-এ।</p>
<table>
<tr><th>Component</th><th>মূল ফোকাস</th><th>Layer সচেতনতা</th></tr>
<tr><td>Reverse Proxy</td><td>backend আড়াল করা, SSL/caching</td><td>backend সংখ্যা সম্পর্কে সচেতন না হলেও চলে</td></tr>
<tr><td>Load Balancer</td><td>একাধিক identical backend-এ traffic বিতরণ</td><td>backend instance সচেতন, কিন্তু business logic সচেতন না</td></tr>
<tr><td>API Gateway</td><td>একাধিক ভিন্ন সার্ভিসের জন্য একক entry point, cross-cutting concern</td><td>API/route/business-level সচেতন — কোন path কোন সার্ভিসের</td></tr>
</table>

<h3>BFF — Backend for Frontend Pattern</h3>
<p>একটা বড় সিস্টেমে web, mobile, এবং third-party partner — প্রতিটা client-এর ডেটার প্রয়োজন ভিন্ন হতে পারে। <span class="kw">BFF (Backend for Frontend)</span> প্যাটার্নে একটা সাধারণ API Gateway-এর বদলে প্রতিটা client টাইপের জন্য আলাদা, উদ্দেশ্য-নির্দিষ্ট gateway/aggregation layer রাখা হয় — মোবাইল অ্যাপের জন্য কম, compact response, ওয়েব ড্যাশবোর্ডের জন্য বিস্তারিত response, ইত্যাদি। এতে প্রতিটা client টিম নিজের প্রয়োজন অনুযায়ী তাদের BFF স্বাধীনভাবে পরিবর্তন করতে পারে, মূল সার্ভিসগুলোতে হাত না দিয়ে।</p>

<div class="diagram"><pre>
   [Web Client]     [Mobile Client]    [Partner API]
        │                  │                 │
        ▼                  ▼                 ▼
   [Web BFF]          [Mobile BFF]     [Partner Gateway]
        └──────────────────┼─────────────────┘
                            ▼
                     [API Gateway core]
              ┌─────────────┼─────────────┐
              ▼             ▼             ▼
        [User Service] [Order Service] [Payment Service]
</pre></div>

<div class="callout why"><span class="tag">কেন microservices-এ API Gateway প্রায় অবশ্যম্ভাবী</span>
Microservices আর্কিটেকচারে সার্ভিসের সংখ্যা যত বাড়ে, প্রতিটা সার্ভিসে আলাদা করে auth/rate-limiting/logging লেখা তত বেশি ডুপ্লিকেশন তৈরি করে, আর client-দের internal service topology সম্পর্কে জানতে হয় — যা coupling বাড়ায়। API Gateway এই দুটো সমস্যাই একসাথে সমাধান করে একটা কেন্দ্রীভূত, প্রতিস্থাপনযোগ্য লেয়ারে।</div>

<div class="callout mistake"><span class="tag">Common mistake — Gateway-তে business logic ঢুকিয়ে দেওয়া</span>
API Gateway-কে routing ও cross-cutting concern-এর জায়গা হিসেবে রাখা উচিত, ডোমেইন-নির্দিষ্ট business logic (যেমন "অর্ডার ভ্যালিড কি না" যাচাই) নয়। এই সীমা অতিক্রম করলে gateway ধীরে ধীরে একটা দৈত্যাকার monolith-এ পরিণত হয় যা প্রতিটা সার্ভিস পরিবর্তনের সাথে জড়িয়ে যায় — মূল উদ্দেশ্যটাই ব্যর্থ হয়ে যায়।</div>
</template>

<h2 class="title">৭. API Gateway Advanced Patterns, Tools ও Service Mesh তুলনা</h2>
<p class="lead">API Gateway যখন শুধু routing না, বরং পুরো microservices-এর ট্রাফিক কন্ট্রোল প্লেন হয়ে ওঠে, তখন কিছু advanced pattern এবং সীমা বোঝা জরুরি হয়ে পড়ে।</p>

<h3>API Composition / Aggregation Pattern</h3>
<p>একটা mobile অ্যাপের হোমপেজ যদি user profile, recent orders, এবং notification — এই তিনটা আলাদা সার্ভিস থেকে ডেটা দরকার হয়, তাহলে client-কে তিনটা আলাদা request পাঠাতে বাধ্য করার বদলে API Gateway নিজে তিনটা backend সার্ভিস কল করে (সমান্তরালে), একত্র করে, একটাই response পাঠাতে পারে। এতে client-এর network round trip কমে, বিশেষ করে high-latency মোবাইল নেটওয়ার্কে এটা বড় পার্থক্য তৈরি করে।</p>

<h3>Circuit Breaker Integration</h3>
<p>যদি একটা downstream সার্ভিস ধীর হয়ে যায় বা fail করতে থাকে, Gateway-তে বসানো <span class="kw">Circuit Breaker</span> সেই সার্ভিসে বারবার request পাঠানো বন্ধ করে দিয়ে দ্রুত fallback response (বা error) দিতে পারে, যাতে একটা সার্ভিসের ব্যর্থতা পুরো সিস্টেমে cascading failure না ছড়ায়। এটা concurrency অধ্যায়ে আলোচিত backpressure ধারণার সাথে সরাসরি সম্পর্কিত।</p>

<h3>API Gateway বনাম Service Mesh</h3>
<p>এই দুটো প্রায়ই গুলিয়ে ফেলা হয়, কিন্তু তারা ভিন্ন ট্র্যাফিক দিক সামলায়। <span class="kw">API Gateway</span> সামলায় <b>North-South traffic</b> — বাইরের client থেকে ভেতরের সিস্টেমে আসা request। <span class="kw">Service Mesh</span> (যেমন Istio, Linkerd) সামলায় <b>East-West traffic</b> — একটা internal সার্ভিস থেকে আরেকটা internal সার্ভিসের মধ্যে যোগাযোগ (retry, mTLS, internal load balancing, observability)। বড় microservices সিস্টেমে দুটোই একসাথে থাকতে পারে — Gateway বাইরের entry point হিসেবে, Mesh ভেতরের সার্ভিস-টু-সার্ভিস যোগাযোগ পরিচালনার জন্য।</p>

<table>
<tr><th>দিক</th><th>API Gateway</th><th>Service Mesh</th></tr>
<tr><td>ট্র্যাফিক দিক</td><td>North-South (client → system)</td><td>East-West (service → service)</td></tr>
<tr><td>প্রধান উদ্বেগ</td><td>Auth, rate limit, routing, aggregation</td><td>mTLS, retry, internal LB, observability</td></tr>
<tr><td>Deployment</td><td>একটা কেন্দ্রীয় (বা কয়েকটা) instance</td><td>প্রতিটা সার্ভিসের পাশে sidecar proxy</td></tr>
</table>

<h3>জনপ্রিয় API Gateway টুল</h3>
<ul>
<li><b>Kong / Tyk:</b> ওপেন-সোর্স, Nginx-ভিত্তিক, plugin architecture দিয়ে সহজে auth/rate-limit যোগ করা যায়।</li>
<li><b>AWS API Gateway:</b> সম্পূর্ণ managed, Lambda/serverless-এর সাথে গভীর ইন্টিগ্রেশন।</li>
<li><b>Envoy / Ambassador:</b> উচ্চ-পারফরম্যান্স proxy, service mesh (Istio)-এর ভেতরেও data plane হিসেবে ব্যবহৃত হয়।</li>
<li><b>NGINX / NGINX Plus:</b> reverse proxy হিসেবে সুপরিচিত, gateway হিসেবেও ব্যাপকভাবে কনফিগার করা হয়।</li>
<li><b>Spring Cloud Gateway / Zuul:</b> Java/Spring ইকোসিস্টেমে জনপ্রিয়।</li>
</ul>

<h3>API Versioning Gateway-তে</h3>
<p>API-এর নতুন ভার্সন পুরনো client না ভেঙে রোল আউট করতে Gateway-তে সাধারণত দুইভাবে versioning হয় — <b>URL-based</b> (<code>/v1/orders</code> বনাম <code>/v2/orders</code>, স্পষ্ট কিন্তু URL প্রোলিফারেট করে) এবং <b>Header-based</b> (<code>Accept: application/vnd.api.v2+json</code>, URL পরিষ্কার থাকে কিন্তু ডিবাগ করা একটু কঠিন)। Gateway physically সিদ্ধান্ত নেয় <code>v1</code> request কোন সার্ভিস instance-এ যাবে আর <code>v2</code> request কোন instance-এ — versioning strategy-এর পূর্ণ তুলনা এবং deprecation policy পরের দুইটা অধ্যায়ে বিস্তারিত আলোচনা করা হয়েছে।</p>

<div class="callout behind"><span class="tag">বাস্তবতা — Gateway একটা bottleneck ও SPOF হতে পারে</span>
সব ট্র্যাফিক একটা কেন্দ্রীয় Gateway দিয়ে যাওয়ার মানে হলো, এই লেয়ারটা যদি ধীর হয়ে যায় বা ডাউন হয়, পুরো সিস্টেম প্রভাবিত হয়। তাই production Gateway-কে নিজেই horizontally scaled (একাধিক instance + তার সামনে একটা LB) এবং stateless রাখতে হয়, ঠিক যেভাবে অন্য যেকোনো critical সার্ভিসকে রাখা হয়।</div>

<div class="callout mistake"><span class="tag">Common mistake — সব microservices-এর জন্য একটাই দৈত্যাকার Gateway config</span>
সময়ের সাথে একটা মনোলিথিক Gateway configuration ফাইল শত শত রুট, custom plugin, এবং business-নির্দিষ্ট নিয়মে ভরে যেতে পারে — যা নিজেই একটা "distributed monolith" তৈরি করে, যেখানে যেকোনো ছোট পরিবর্তনে পুরো Gateway redeploy করতে হয়। বড় সংস্থায় প্রায়ই domain অনুযায়ী একাধিক Gateway instance বা routing tier আলাদা রাখা হয়।</div>

<template data-page="api-design">
<h2 class="title">৮. API Design Fundamentals — REST Principles, HTTP Semantics, Pagination ও Error Handling</h2>
<p class="lead">একটা API-এর আসল মান বোঝা যায় তার consistency আর predictability-তে — একজন নতুন developer ডকুমেন্টেশন না পড়েই অনুমান করতে পারা উচিত পরবর্তী endpoint-টা দেখতে কেমন হবে।</p>

<h3>API ও REST কী</h3>
<p><span class="kw">API (Application Programming Interface)</span> হলো দুইটা সিস্টেমের মধ্যে একটা চুক্তি (contract) — client কী পাঠাতে পারবে, সার্ভার কী ফেরত দেবে, এবং কোন নিয়মে। <span class="kw">REST (Representational State Transfer)</span> একটা architectural style যা এই চুক্তিকে কয়েকটা constraint দিয়ে সংজ্ঞায়িত করে —</p>
<ul>
<li><b>Statelessness:</b> প্রতিটা request নিজের মধ্যেই সম্পূর্ণ, সার্ভার client-এর আগের request মনে রাখে না (২য় অধ্যায়ে বিস্তারিত আলোচিত horizontal scaling-এর পূর্বশর্ত)।</li>
<li><b>Resource-based:</b> সবকিছুকে একটা "resource" হিসেবে দেখা হয় (user, order, product), এবং প্রতিটা resource-এর একটা URI থাকে।</li>
<li><b>Uniform Interface:</b> একই HTTP method, status code, এবং representation format (JSON) সবখানে সামঞ্জস্যপূর্ণভাবে ব্যবহৃত হয়।</li>
<li><b>Cacheability:</b> response স্পষ্টভাবে বলে দেয় সেটা cache করা যাবে কি না, এবং কতক্ষণ।</li>
<li><b>Layered System:</b> client জানে না সে সরাসরি সার্ভারের সাথে কথা বলছে না মাঝে LB/Gateway/CDN আছে (৪-৭ অধ্যায়ে আলোচিত)।</li>
</ul>

<h3>Resource-Oriented URI Design</h3>
<p>একটা ভালো URI একটা resource-কে (noun) নির্দেশ করে, একটা action (verb)-কে না — action HTTP method দিয়ে প্রকাশ করা হয়। URI-তে সাধারণত bare plural noun ব্যবহার করা হয়, এবং nesting তিন স্তরের বেশি গভীর না রাখাই ভালো (খুব গভীর nesting পড়া ও maintain করা কঠিন করে তোলে)।</p>
<table>
<tr><th>ভালো ডিজাইন</th><th>খারাপ ডিজাইন</th><th>কেন</th></tr>
<tr><td><code>GET /orders/42</code></td><td><code>GET /getOrder?id=42</code></td><td>URI resource নির্দেশ করে, action না — action GET method দিয়েই বোঝা যায়</td></tr>
<tr><td><code>POST /orders</code></td><td><code>POST /createNewOrder</code></td><td>একই resource-এ POST মানেই "নতুন তৈরি করো", আলাদা verb দরকার নেই</td></tr>
<tr><td><code>GET /users/7/orders</code></td><td><code>GET /orders/user/7/all/list</code></td><td>স্পষ্ট, সংক্ষিপ্ত nesting; গভীর nesting এড়ানো হয়েছে</td></tr>
<tr><td><code>GET /orders?status=shipped</code></td><td><code>GET /orders/shipped</code></td><td>Filtering-এর জন্য query parameter, আলাদা path না — নাহলে প্রতিটা filter-এর জন্য নতুন route লাগবে</td></tr>
</table>

<h3>HTTP Method-এর সঠিক ব্যবহার</h3>
<p>প্রতিটা HTTP method-এর একটা নির্দিষ্ট semantic উদ্দেশ্য আছে, এবং সেই semantic ভাঙলে caching, retry, এবং tooling (browser, proxy, monitoring) ভুলভাবে আচরণ করতে পারে।</p>
<table>
<tr><th>Method</th><th>উদ্দেশ্য</th><th>Request Body</th></tr>
<tr><td>GET</td><td>Resource পড়া (read-only)</td><td>না</td></tr>
<tr><td>POST</td><td>নতুন resource তৈরি করা, বা একটা action ট্রিগার করা</td><td>হ্যাঁ</td></tr>
<tr><td>PUT</td><td>পুরো resource প্রতিস্থাপন করা</td><td>হ্যাঁ (সম্পূর্ণ resource)</td></tr>
<tr><td>PATCH</td><td>resource-এর আংশিক আপডেট</td><td>হ্যাঁ (শুধু পরিবর্তিত ফিল্ড)</td></tr>
<tr><td>DELETE</td><td>Resource মুছে ফেলা</td><td>সাধারণত না</td></tr>
</table>
<p>এই method-গুলোর মধ্যে কোনটা <b>safe</b> (কোনো state বদলায় না) এবং কোনটা <b>idempotent</b> (একাধিকবার চালালেও একই ফলাফল) — এই গুরুত্বপূর্ণ পার্থক্যটা এবং এর ব্যবহারিক প্রভাব (retry-এর সময় কেন গুরুত্বপূর্ণ) পরের অংশে, Idempotency অধ্যায়ে গভীরভাবে আলোচনা করা হয়েছে।</p>

<h3>HTTP Status Code — সঠিকভাবে ব্যবহার করা</h3>
<table>
<tr><th>Range</th><th>অর্থ</th><th>সাধারণ কোড</th></tr>
<tr><td>2xx — Success</td><td>Request সফল হয়েছে</td><td><code>200 OK</code>, <code>201 Created</code>, <code>202 Accepted</code>, <code>204 No Content</code></td></tr>
<tr><td>3xx — Redirection</td><td>আরও পদক্ষেপ দরকার</td><td><code>301 Moved Permanently</code>, <code>304 Not Modified</code></td></tr>
<tr><td>4xx — Client Error</td><td>Client-এর ভুল request</td><td><code>400 Bad Request</code>, <code>401 Unauthorized</code>, <code>403 Forbidden</code>, <code>404 Not Found</code>, <code>409 Conflict</code>, <code>422 Unprocessable Entity</code>, <code>429 Too Many Requests</code></td></tr>
<tr><td>5xx — Server Error</td><td>সার্ভারের ভুল</td><td><code>500 Internal Server Error</code>, <code>502 Bad Gateway</code>, <code>503 Service Unavailable</code>, <code>504 Gateway Timeout</code></td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সবকিছুতে 200 ফেরত দেওয়া, error body-তে জানানো</span>
কিছু API ডিজাইনে ভুল হলেও HTTP status <code>200</code> রাখা হয় এবং response body-তে <code>{"success": false, "error": "..."}</code> পাঠানো হয়। এতে HTTP-লেভেল tooling (monitoring, caching, retry logic, load balancer health check) ভুল বোঝে যে request সফল হয়েছে — error rate monitoring, automatic retry, এবং caching সবকিছুই ভুল আচরণ করে। Status code-কেই সত্যিকারের অর্থ বহন করতে দিতে হবে।
</div>

<h3>স্ট্যান্ডার্ডাইজড Error Response Format</h3>
<p>প্রতিটা error response-এর গঠন সামঞ্জস্যপূর্ণ হওয়া উচিত, যাতে client একটাই error-parsing লজিক দিয়ে সব endpoint সামলাতে পারে। <span class="kw">RFC 7807 (Problem Details for HTTP APIs)</span> একটা জনপ্রিয় স্ট্যান্ডার্ড —</p>
<div class="diagram"><pre>
HTTP/1.1 422 Unprocessable Entity
Content-Type: application/problem+json

{
  "type": "https://api.example.com/errors/validation-failed",
  "title": "Validation Failed",
  "status": 422,
  "detail": "ফিল্ড 'email' একটা বৈধ ইমেইল ঠিকানা হতে হবে",
  "instance": "/orders/42",
  "errors": [
    { "field": "email", "message": "invalid format" }
  ]
}
</pre></div>

<h3>Pagination Strategies</h3>
<table>
<tr><th>পদ্ধতি</th><th>কীভাবে কাজ করে</th><th>সীমাবদ্ধতা</th></tr>
<tr><td>Offset-based (<code>?offset=100&limit=20</code>)</td><td>নির্দিষ্ট সংখ্যক row স্কিপ করে পরের সেট ফেরত দেওয়া</td><td>বড় offset-এ ডাটাবেস ধীর হয়ে যায় (সব স্কিপ করা row স্ক্যান করতে হয়); পেজিনেশনের মাঝে নতুন row insert হলে item দ্বৈত/অনুপস্থিত দেখাতে পারে</td></tr>
<tr><td>Cursor/Keyset-based (<code>?after=cursor_xyz</code>)</td><td>শেষ দেখা item-এর একটা reference (cursor) দিয়ে পরের সেট চাওয়া হয়</td><td>Concurrent insert-এও স্থিতিশীল ও নির্ভরযোগ্য, ডাটাবেস index ব্যবহার করে দ্রুত — কিন্তু নির্দিষ্ট পেজ নম্বরে সরাসরি লাফ দেওয়া কঠিন</td></tr>
</table>
<div class="callout why"><span class="tag">কেন বড় স্কেলে Cursor-based Pagination পছন্দনীয়</span>
Offset-based pagination-এ ডাটাবেসকে প্রতিবার শুরু থেকে <code>offset</code> সংখ্যক row গণনা করে বাদ দিতে হয় — data বাড়ার সাথে সাথে এটা ক্রমশ ধীর হয়ে যায় (O(offset) খরচ)। Cursor-based pagination একটা indexed কলাম (যেমন <code>id</code> বা <code>created_at</code>) ব্যবহার করে সরাসরি "এর পরের row" খুঁজে বের করে, যা ডেটার আকার নির্বিশেষে প্রায় constant-time থাকে — এই কারণেই বড় স্কেলের social media feed বা log API-গুলো cursor-based pagination ব্যবহার করে।
</div>

<h3>Filtering, Sorting ও Field Selection</h3>
<p>Query parameter দিয়ে filtering (<code>?status=active</code>), sorting (<code>?sort=-created_at</code>), এবং response-এ কোন ফিল্ড আসবে তা নিয়ন্ত্রণ (<code>?fields=id,name,email</code>) করা সাধারণ conventions — এগুলো client-কে প্রয়োজনীয় ডেটাই আনতে দেয়, over-fetching কমায় এবং response payload ছোট রাখে।</p>

<h3>HATEOAS ও Richardson Maturity Model</h3>
<p><span class="kw">Richardson Maturity Model</span> একটা API কতটা "সত্যিকারের RESTful" তা ৪টা স্তরে ভাগ করে — Level 0 (একটা মাত্র endpoint, সব কিছু POST দিয়ে), Level 1 (আলাদা resource URI কিন্তু একটাই HTTP method), Level 2 (সঠিক HTTP method ও status code ব্যবহার — বেশিরভাগ production API এখানেই থাকে), এবং Level 3 — <span class="kw">HATEOAS (Hypermedia as the Engine of Application State)</span>, যেখানে response-এর ভেতরেই পরবর্তী সম্ভাব্য action-এর লিংক থাকে (যেমন একটা অর্ডার response-এ <code>"cancel": {"href": "/orders/42/cancel"}</code>), ফলে client-কে URL হার্ডকোড করতে হয় না। বাস্তবে বেশিরভাগ API Level 2-তেই থামে, কারণ HATEOAS-এর ব্যবহারিক সুবিধা প্রায়ই এর অতিরিক্ত জটিলতার তুলনায় কম মনে হয়।</p>

<h3>API Contract ও Documentation</h3>
<p><span class="kw">OpenAPI (Swagger)</span> স্পেসিফিকেশন দিয়ে একটা API-এর প্রতিটা endpoint, request/response schema, এবং error case machine-readable ভাবে ডকুমেন্ট করা হয় — এটা থেকে স্বয়ংক্রিয়ভাবে client SDK, ডকুমেন্টেশন সাইট, এবং এমনকি mock server জেনারেট করা যায়। <b>Schema-first</b> পদ্ধতিতে আগে OpenAPI স্পেক লেখা হয়, তারপর কোড; <b>code-first</b>-এ কোড থেকে স্পেক জেনারেট হয়। বড় দল যেখানে একাধিক টিম একই API নিয়ে সমান্তরালে কাজ করে, সেখানে schema-first প্রায়ই ভালো কাজ করে কারণ backend সম্পূর্ণ হওয়ার আগেই frontend টিম contract অনুযায়ী কাজ শুরু করতে পারে।</p>

<div class="callout best"><span class="tag">Best practice — Contract আগে ঠিক করুন, তারপর implement করুন</span>
একটা API endpoint লেখার আগে তার request/response schema, status code, এবং error case নিয়ে টিমের মধ্যে সম্মতি তৈরি করা উচিত (OpenAPI স্পেক দিয়ে)। এতে frontend ও backend টিম সমান্তরালে কাজ করতে পারে, এবং পরে বড় ধরনের ডিজাইন পরিবর্তনের প্রয়োজন কমে যায় — যা পরের অধ্যায়ে আলোচিত ব্যয়বহুল versioning এড়াতে সাহায্য করে।</div>
</template>

<h2 class="title">৯. API Versioning — Strategies, Semantic Versioning ও Deprecation Policy</h2>
<p class="lead">একবার একটা API production-এ বাস্তব consumer পেয়ে গেলে, প্রতিটা পরিবর্তনই একটা প্রতিশ্রুতি ভঙ্গ করার ঝুঁকি বহন করে — Versioning সেই ঝুঁকি নিয়ন্ত্রিতভাবে সামলানোর কৌশল।</p>

<h3>কেন Versioning দরকার — Breaking বনাম Non-breaking পরিবর্তন</h3>
<p>একটা internal function বদলালে সব caller একসাথে আপডেট করা যায়, কিন্তু একটা পাবলিক API-এর consumer আলাদা টিম, আলাদা সংস্থা, এমনকি অচেনা third-party হতে পারে — তাদের কোড একই সময়ে আপডেট করা সম্ভব না। তাই প্রতিটা পরিবর্তনকে দুইভাগে ভাগ করে বোঝা জরুরি —</p>
<table>
<tr><th>পরিবর্তনের ধরন</th><th>উদাহরণ</th><th>Breaking কি না</th></tr>
<tr><td>নতুন optional ফিল্ড যোগ করা</td><td>response-এ নতুন <code>"nickname"</code> ফিল্ড যোগ</td><td>Non-breaking — পুরনো client ফিল্ডটা উপেক্ষা করবে</td></tr>
<tr><td>নতুন optional endpoint যোগ করা</td><td>নতুন <code>GET /orders/summary</code></td><td>Non-breaking</td></tr>
<tr><td>বিদ্যমান ফিল্ড মুছে ফেলা</td><td>response থেকে <code>"phone"</code> ফিল্ড সরানো</td><td>Breaking — client-এর কোড crash করতে পারে</td></tr>
<tr><td>ফিল্ডের নাম বা টাইপ বদলানো</td><td><code>"price": "10"</code> (string) থেকে <code>"price": 10</code> (number)</td><td>Breaking — parsing ব্যর্থ হবে</td></tr>
<tr><td>একটা optional ফিল্ডকে required করা</td><td>request-এ <code>"email"</code> বাধ্যতামূলক করা</td><td>Breaking — পুরনো client সেই ফিল্ড ছাড়াই request পাঠাচ্ছিল</td></tr>
<tr><td>কোনো endpoint সম্পূর্ণ সরিয়ে ফেলা</td><td><code>DELETE /v1/legacy-orders</code> বাদ দেওয়া</td><td>Breaking</td></tr>
</table>

<h3>Semantic Versioning (SemVer) — API-তে প্রয়োগ</h3>
<p><span class="kw">Semantic Versioning</span> একটা <code>MAJOR.MINOR.PATCH</code> সংখ্যা প্যাটার্ন — <b>MAJOR</b> বাড়ে breaking change-এ, <b>MINOR</b> বাড়ে নতুন backward-compatible ফিচারে, <b>PATCH</b> বাড়ে backward-compatible বাগ ফিক্সে। পাবলিক REST API-তে সাধারণত শুধু MAJOR ভার্সনটাই client-facing ভাবে প্রকাশ করা হয় (<code>/v1/</code>, <code>/v2/</code>) — MINOR/PATCH পরিবর্তন non-breaking হওয়ায় client নোটিশ ছাড়াই সেগুলো গ্রহণ করে নেয়।</p>

<h3>Versioning Strategies</h3>
<table>
<tr><th>Strategy</th><th>উদাহরণ</th><th>সুবিধা</th><th>অসুবিধা</th></tr>
<tr><td>URI Path Versioning</td><td><code>/v2/orders/42</code></td><td>সবচেয়ে স্পষ্ট, সহজে দেখা ও ডিবাগ করা যায়, browser-এ সরাসরি টেস্ট করা যায়, Gateway routing সহজ</td><td>প্রযুক্তিগতভাবে একই resource-এর একাধিক URI তৈরি করে (REST purist-দের মতে uniform resource identifier নীতির লঙ্ঘন)</td></tr>
<tr><td>Query Parameter Versioning</td><td><code>/orders/42?version=2</code></td><td>বাস্তবায়ন সহজ, URI path পরিষ্কার থাকে</td><td>Caching layer-এর জন্য কম স্পষ্ট, ভুলে parameter বাদ পড়লে অনিশ্চিত ভার্সন সার্ভ হতে পারে</td></tr>
<tr><td>Custom Header Versioning</td><td><code>Api-Version: 2</code></td><td>URI সম্পূর্ণ পরিষ্কার থাকে, resource identity অপরিবর্তিত</td><td>Header চোখে সহজে দেখা যায় না, browser-এ সরাসরি টেস্ট করা কঠিন, ডকুমেন্টেশন ছাড়া বোঝা কঠিন</td></tr>
<tr><td>Media Type (Content Negotiation) Versioning</td><td><code>Accept: application/vnd.company.v2+json</code></td><td>সবচেয়ে "খাঁটি" RESTful পদ্ধতি — resource এক থাকে, শুধু representation ভিন্ন</td><td>বাস্তবায়ন ও ডিবাগ সবচেয়ে জটিল, tooling সাপোর্ট কম</td></tr>
</table>
<p>বাস্তবে বেশিরভাগ পাবলিক API (Stripe, GitHub, Twitter) URI Path বা Header versioning ব্যবহার করে, কারণ simplicity এবং tooling সহজলভ্যতা প্রায়ই REST purity-এর চেয়ে বেশি গুরুত্বপূর্ণ বিবেচিত হয়।</p>

<h3>API Gateway-তে Versioning বাস্তবায়ন</h3>
<p>যেভাবে ৭ম অধ্যায়ে আলোচিত হয়েছে, Version নির্ধারণ ও routing-এর প্রকৃত কাজ সাধারণত <span class="kw">API Gateway</span>-তে হয় — Gateway request-এর path/header দেখে <code>v1</code> ট্র্যাফিক পুরনো সার্ভিস instance-এ এবং <code>v2</code> ট্র্যাফিক নতুন instance-এ (অথবা একই সার্ভিসের ভেতরে ভিন্ন কোড পাথে) রাউট করে দেয়। এতে দুইটা ভার্সন একই সাথে প্রোডাকশনে সচল থাকতে পারে, এবং client-রা নিজেদের সময়মতো নতুন ভার্সনে migrate করতে পারে।</p>

<h3>Deprecation ও Sunset Policy</h3>
<p>একটা পুরনো ভার্সন চিরকাল চালু রাখা যায় না — কিন্তু হঠাৎ বন্ধ করাও consumer-দের সাথে বিশ্বাসভঙ্গ। একটা দায়িত্বশীল deprecation প্রক্রিয়ায় —</p>
<ul>
<li><b>Deprecation ঘোষণা:</b> response-এ <code>Deprecation: true</code> header এবং ডকুমেন্টেশনে স্পষ্ট নোটিশ যোগ করা।</li>
<li><b>Sunset তারিখ জানানো:</b> <code>Sunset: Sat, 31 Dec 2026 23:59:59 GMT</code> header (RFC 8594) দিয়ে ঠিক কবে endpoint বন্ধ হবে তা machine-readable ভাবে জানানো।</li>
<li><b>যথেষ্ট migration সময় দেওয়া:</b> সাধারণত কয়েক মাস থেকে এক-দুই বছর, API-এর গুরুত্ব ও consumer সংখ্যা অনুযায়ী।</li>
<li><b>ব্যবহার monitor করা:</b> sunset-এর আগে পুরনো ভার্সনের actual traffic দেখে বোঝা — কোন consumer এখনও migrate করেনি, এবং প্রয়োজনে সরাসরি যোগাযোগ করা।</li>
<li><b>Migration guide দেওয়া:</b> পুরনো থেকে নতুন ভার্সনে কীভাবে যেতে হবে তার স্পষ্ট, উদাহরণসহ ডকুমেন্টেশন।</li>
</ul>

<h3>Microservices-এ Versioning-এর বাড়তি জটিলতা</h3>
<p>একটা মনোলিথে একটা মাত্র API ভার্সন করা তুলনামূলক সহজ, কিন্তু microservices-এ প্রতিটা সার্ভিস স্বাধীনভাবে evolve করে — একটা সার্ভিসের change আরেকটা downstream সার্ভিসকে ভেঙে দিতে পারে, প্রায়ই কারো অজান্তেই। এই সমস্যা কমাতে —</p>
<ul>
<li><b>Consumer-Driven Contract Testing</b> (যেমন Pact): প্রতিটা consumer তাদের প্রত্যাশা একটা "contract" হিসেবে লিখে রাখে; provider সার্ভিস deploy করার আগে সব consumer-এর contract-এর বিপরীতে টেস্ট চালিয়ে নিশ্চিত হয় কোনো breaking change ঘটেনি।</li>
<li><b>Schema Registry</b> (event-driven সিস্টেমে, Avro/Protobuf-এর সাথে): message schema-এর একটা কেন্দ্রীয় রেজিস্ট্রি রাখা হয় যা backward/forward compatibility স্বয়ংক্রিয়ভাবে যাচাই করে, একটা producer-এর schema change যাতে অজান্তে consumer-দের ভেঙে না দেয়।</li>
</ul>

<h3>Versioning এড়ানোর কৌশল — Tolerant Reader Pattern</h3>
<p>সবচেয়ে ভালো versioning হলো যতটা সম্ভব versioning এড়ানো — এটা সম্ভব হয় যদি প্রতিটা পরিবর্তন কঠোরভাবে additive এবং backward-compatible রাখা হয় (নতুন ফিল্ড যোগ করা, পুরনো কিছু না সরানো), এবং client-দের <span class="kw">Tolerant Reader Pattern</span> মেনে চলতে উৎসাহিত করা হয় — অর্থাৎ client অচেনা নতুন ফিল্ড উপেক্ষা করবে, শুধু প্রয়োজনীয় ফিল্ড পড়বে, কড়াকড়ি schema validation দিয়ে পুরো response reject করবে না। এই নীতিকে প্রায়ই <b>Postel's Law</b> ("নিজে যা পাঠান তাতে রক্ষণশীল হোন, অন্যের কাছ থেকে যা গ্রহণ করেন তাতে উদার হোন") দিয়ে বর্ণনা করা হয়।</p>

      v1 client                         v2 client
          │                                 │
          ▼                                 ▼
   Accept: v1                        Accept: v2
          │                                 │
          └──────────────┬──────────────────┘
                          ▼
                  [API Gateway]
                  version দেখে routing
              ┌───────────┴───────────┐
              ▼                       ▼

</pre></div>

<div class="callout why"><span class="tag">কেন পাবলিক API-এর versioning internal সার্ভিসের চেয়ে ভিন্ন গুরুত্বের</span>
একটা internal মাইক্রোসার্ভিসের সব caller একই সংস্থার আওতায়, তাই coordination করে একসাথে আপডেট করা সম্ভব — versioning-এর প্রয়োজন কম, contract testing দিয়েই যথেষ্ট। কিন্তু একটা পাবলিক/partner-facing API-এর consumer অজানা, অসংখ্য, এবং তাদের নিজস্ব রিলিজ সময়সূচি আছে — তাই সেখানে formal versioning ও দীর্ঘ deprecation window কার্যত অপরিহার্য।</div>

<div class="callout mistake"><span class="tag">Common mistake — সামান্য পরিবর্তনেও Major Version বাড়ানো, অথবা পুরনো ভার্সন কখনও বন্ধ না করা</span>
প্রতিটা ছোট পরিবর্তনে নতুন major version তৈরি করলে দ্রুত একাধিক ভার্সন সমান্তরালে maintain করতে হয়, যা অপারেশনাল বোঝা বাড়িয়ে দেয় — তাই সত্যিকারের breaking change ছাড়া version বাড়ানো উচিত না। উল্টো দিকে, deprecated ভার্সন কখনও বন্ধ না করাও একটা সাধারণ ভুল — পুরনো ভার্সন চিরস্থায়ী রাখলে টেক-ডেট বাড়তেই থাকে, এবং প্রতিটা নতুন ফিচার একাধিক ভার্সনে বাস্তবায়ন করতে হয়।</div>

<div class="callout best"><span class="tag">Best practice — যেখানে সম্ভব, versioning-এর বদলে backward-compatible evolution বেছে নিন</span>
প্রতিটা API পরিবর্তনের আগে নিজেকে জিজ্ঞেস করুন — "এটা কি শুধু additive করে করা সম্ভব?" যদি হ্যাঁ হয়, নতুন major version না বানিয়ে existing ভার্সনেই backward-compatible পরিবর্তন যোগ করুন। নতুন major version তৈরি করা তখনই যুক্তিসঙ্গত যখন সত্যিকারের breaking change অনিবার্য, এবং তখন থেকেই deprecation timeline পরিষ্কারভাবে ঘোষণা করে দিন।</div>
</template>

<template data-page="idempotency-basics">
<h2 class="title">১০. Idempotency Fundamentals — কী, কেন এবং HTTP Method Semantics</h2>
<p class="lead">Distributed system-এ network কখনও ১০০% নির্ভরযোগ্য না — একটা request timeout হলে ক্লায়েন্ট জানতেই পারে না request আসলে সফল হয়েছিল কি না, আর সেই অনিশ্চয়তা থেকেই idempotency-এর প্রয়োজন জন্ম নেয়।</p>

<h3>Idempotency কী</h3>
<p><span class="kw">Idempotency</span> মানে হলো — একটা অপারেশন একবার করলে যে ফলাফল হয়, সেটা একাধিকবার (দুর্ঘটনাক্রমে) করলেও ঠিক একই ফলাফল হয়, কোনো অতিরিক্ত side-effect ছাড়া। গাণিতিকভাবে বলতে গেলে, <code>f(f(x)) = f(x)</code>। বাস্তব উদাহরণ — লিফটের বোতাম একাধিকবার চাপলেও লিফট একবারই ডাকা হয়; কিন্তু একটা "$100 ট্রান্সফার করো" অপারেশন দুইবার চালালে যদি $200 ট্রান্সফার হয়ে যায়, সেটা idempotent না।</p>

<h3>কেন Idempotency দরকার — Network Retry-এর অনিশ্চয়তা</h3>
<p>একটা client একটা API call করার পর যদি নির্দিষ্ট সময়ের মধ্যে response না পায় (timeout), তিনটা সম্ভাবনা থাকে — (১) request-ই সার্ভারে পৌঁছায়নি, (২) request পৌঁছেছে, প্রসেস হয়েছে, কিন্তু response client-এ ফিরে আসার আগেই connection কেটে গেছে, অথবা (৩) request এখনও প্রসেস হচ্ছে। Client-এর পক্ষে এই তিনটার মধ্যে পার্থক্য বোঝার কোনো উপায় নেই — তাই সাধারণত সবচেয়ে নিরাপদ পদক্ষেপ হলো request আবার পাঠানো (retry)। কিন্তু যদি আসল request আসলে সফল হয়ে থাকে (সম্ভাবনা ২), তাহলে retry একই অপারেশন দ্বিতীয়বার ঘটাবে — যেমন একই অর্ডার দুইবার তৈরি হওয়া, বা একই পেমেন্ট দুইবার কাটা হওয়া।</p>

<div class="diagram"><pre>
[Client]                         [Server]
   │──POST /payment ($100)───────▶│
   │                              │  ✅ পেমেন্ট প্রসেস হলো, DB-তে সেভ হলো
   │◀────── (টাইমআউট, কোনো ────────│  ❌ কিন্তু response client পর্যন্ত পৌঁছায়নি
   │         response আসেনি)       │
   │                              │
   │── (client retry করলো) ───────▶│
   │──POST /payment ($100)───────▶│  ⚠️ Idempotency ছাড়া: দ্বিতীয়বার পেমেন্ট কাটা হবে!
</pre></div>

<h3>HTTP Method-এর Idempotency Semantics (স্পেসিফিকেশন অনুযায়ী)</h3>
<table>
<tr><th>HTTP Method</th><th>Safe (কোনো state বদলায় না)</th><th>Idempotent</th><th>মন্তব্য</th></tr>
<tr><td>GET</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>শুধু read, কোনো side-effect নেই</td></tr>
<tr><td>HEAD</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>GET-এর মতো, শুধু header ফেরত দেয়</td></tr>
<tr><td>PUT</td><td>না</td><td>হ্যাঁ</td><td>পুরো resource প্রতিস্থাপন করে — একবার বা দশবার চালালে একই ফলাফল</td></tr>
<tr><td>DELETE</td><td>না</td><td>হ্যাঁ</td><td>resource মুছে ফেলে — দ্বিতীয়বার চালালে "already deleted" (একই state)</td></tr>
<tr><td>POST</td><td>না</td><td><b>না</b></td><td>সাধারণত নতুন resource তৈরি করে — দুইবার চালালে দুইটা resource তৈরি হয়</td></tr>
<tr><td>PATCH</td><td>না</td><td>নির্ভর করে</td><td>partial update — যদি "field-কে X ভ্যালু সেট করো" হয় তবে idempotent, কিন্তু "counter-কে +১ করো" হলে idempotent না</td></tr>
</table>

<div class="callout why"><span class="tag">কেন POST স্বভাবতই idempotent না</span>
POST সাধারণত ব্যবহৃত হয় "একটা নতুন resource তৈরি করো" জাতীয় অপারেশনের জন্য — যেমন <code>POST /orders</code>। সার্ভার প্রতিবার একটা নতুন unique ID জেনারেট করে একটা নতুন resource তৈরি করে, তাই একই request দুইবার পাঠালে দুইটা ভিন্ন resource তৈরি হয়ে যায়। এই কারণেই POST-ভিত্তিক API-গুলোতে (payment, order creation) idempotency আলাদা করে ডিজাইন করে দিতে হয় — এটা এমনি এমনি আসে না।</div>

<div class="callout mistake"><span class="tag">Common mistake — শুধু "GET/PUT/DELETE idempotent" মুখস্থ করা, কেন তা না বোঝা</span>
Idempotency HTTP method-এর একটা নিয়ম না, এটা resource-এর ওপর অপারেশনের প্রভাবের একটা ফলাফল। একটা PUT endpoint যদি ভেতরে "কাউন্টার +১ করো" জাতীয় non-idempotent লজিক লিখে ফেলা হয়, সেটা HTTP method PUT হওয়া সত্ত্বেও idempotent থাকবে না। তাই প্রতিটা endpoint ডিজাইন করার সময় নিজেকে জিজ্ঞেস করতে হয় — "এই অপারেশন দুইবার চালালে কি একই ফলাফল হবে?", শুধু method নাম দেখে ধরে নেওয়া উচিত না।</div>

<div class="callout best"><span class="tag">Best practice — যেকোনো state-পরিবর্তনকারী, retry-প্রবণ অপারেশনে idempotency ভাবুন</span>
Payment, order creation, email/notification sending — এই ধরনের অপারেশন, যেখানে duplicate execution বাস্তব ক্ষতির (টাকা, স্প্যাম) কারণ হতে পারে, সবসময় idempotency-কে ডিজাইনের প্রথম দিন থেকেই বিবেচনায় রাখা উচিত, পরে প্যাচ করার বদলে। পরের অধ্যায়ে এই বাস্তবায়নের প্যাটার্ন বিস্তারিত আলোচনা করা হয়েছে।</div>
</template>

<template data-page="idempotency-advanced">
<h2 class="title">১১. Idempotency Key Pattern — Implementation ও Race Condition হ্যান্ডলিং</h2>
<p class="lead">POST-এর মতো স্বভাবতই non-idempotent অপারেশনকে নিরাপদে retry-যোগ্য বানানোর সবচেয়ে প্রচলিত পদ্ধতি হলো Idempotency Key।</p>

<h3>Idempotency-Key Header Pattern</h3>
<p>Client প্রতিটা state-পরিবর্তনকারী request পাঠানোর আগে একটা unique key (সাধারণত একটা UUID) জেনারেট করে, এবং সেটা <code>Idempotency-Key</code> header-এ পাঠায়। যদি network failure-এর কারণে client retry করে, সেই একই key দিয়েই retry করে (নতুন key জেনারেট করে না)। Server সেই key দেখে বুঝতে পারে এটা একটা নতুন request নাকি আগের একটা request-এর retry।</p>

<div class="diagram"><pre>
প্রথম request:
  POST /payments
  Idempotency-Key: 7f9c2a1e-...
  → Server: key নতুন → প্রসেস করো → রেজাল্ট store করো (key + response) → response ফেরত দাও

Retry (নেটওয়ার্ক টাইমআউটের কারণে):
  POST /payments
  Idempotency-Key: 7f9c2a1e-...  (একই key)
  → Server: key আগে থেকেই আছে → দ্বিতীয়বার প্রসেস না করে
             আগের সংরক্ষিত response-ই আবার ফেরত দাও
</pre></div>

<h3>Server-Side বাস্তবায়ন ধাপ</h3>
<ol>
<li>Request আসলে প্রথমে <code>Idempotency-Key</code> একটা storage-এ (ডাটাবেস টেবিল বা Redis) lookup করো।</li>
<li>Key না থাকলে — একটা atomic operation দিয়ে key-কে "in-progress" স্ট্যাটাসে ইনসার্ট করো, তারপর প্রকৃত business logic চালাও, শেষে result key-এর সাথে সংরক্ষণ করো।</li>
<li>Key আগে থেকেই "completed" থাকলে — সংরক্ষিত response সরাসরি ফেরত দাও, নতুন করে business logic চালিও না।</li>
<li>Key "in-progress" অবস্থায় থাকলে (নিচে বিস্তারিত) — সাবধানে হ্যান্ডল করো।</li>
</ol>

<h3>Storage বিকল্প</h3>
<table>
<tr><th>পদ্ধতি</th><th>বিবরণ</th></tr>
<tr><td>Database Unique Constraint</td><td>একটা টেবিলে <code>idempotency_key</code>-এর ওপর UNIQUE constraint — দ্বিতীয়বার একই key দিয়ে insert করলে DB নিজেই constraint violation error দেয়, যা atomic এবং নির্ভরযোগ্য</td></tr>
<tr><td>Redis SETNX + TTL</td><td><code>SET key value NX EX ttl</code> — atomic ভাবে শুধু key না থাকলেই সেট হয়; দ্রুত, কিন্তু business result-এর জন্য আলাদা persistent storage-ও দরকার হতে পারে</td></tr>
</table>
<p>Key-এর সাথে একটা যুক্তিসঙ্গত <b>TTL (Time To Live)</b> রাখা হয় (সাধারণত ২৪ ঘণ্টা) — ধরে নেওয়া হয় client এর বেশি সময় পরে আর retry করবে না, তাই এরপর storage থেকে key মুছে ফেলা যায় (নাহলে storage অসীমভাবে বাড়তে থাকবে)।</p>

<h3>Race Condition — দুইটা concurrent request একই Key নিয়ে</h3>
<p>একটা সূক্ষ্ম কিন্তু গুরুত্বপূর্ণ সমস্যা — client কখনও কখনও network layer-এই দুইটা identical request পাঠিয়ে ফেলতে পারে (যেমন একটা buggy retry mechanism, বা ইউজার দ্রুত দুইবার বাটনে ক্লিক করা) যা সার্ভারে প্রায় একই সময়ে পৌঁছায়। যদি "key আছে কি না চেক করো, না থাকলে প্রসেস করো" — এই দুইটা ধাপ atomic না হয়, তাহলে দুইটা request-ই "key নেই" দেখতে পারে এবং দুইবারই business logic চালিয়ে ফেলতে পারে — idempotency ব্যর্থ হয়ে যায়।</p>
<div class="callout why"><span class="tag">কেন এখানে atomic check-and-set আবশ্যক</span>
এই race condition এড়াতে "চেক করা" এবং "রিজার্ভ করা" — এই দুটো একটা একক atomic অপারেশনে করতে হয়, যেমন database-এর <code>INSERT ... ON CONFLICT DO NOTHING</code> (PostgreSQL) বা <code>SETNX</code> (Redis)। যদি insert সফল হয়, এই request-ই "বিজয়ী" এবং সে প্রসেস করবে; ব্যর্থ হলে (conflict), অন্য একটা concurrent request ইতিমধ্যে দখল করে ফেলেছে বুঝে এই request-কে অপেক্ষা করতে হবে বা পুরনো result দেখাতে হবে।
</div>

<h3>"In-Progress" অবস্থার হ্যান্ডলিং</h3>
<p>যদি একটা key "in-progress" অবস্থায় থাকে (প্রথম request এখনও প্রসেস হচ্ছে, শেষ হয়নি) এবং একই key দিয়ে দ্বিতীয় request আসে, দুটো সাধারণ কৌশল আছে — (১) <code>409 Conflict</code> বা <code>425 Too Early</code> স্ট্যাটাস ফেরত দিয়ে client-কে একটু পরে আবার জিজ্ঞেস করতে বলা, অথবা (২) সংক্ষিপ্ত সময়ের জন্য polling/wait করে প্রথম request শেষ হওয়ার জন্য অপেক্ষা করা এবং তার result ফেরত দেওয়া। কোনটা বেছে নেওয়া হবে তা নির্ভর করে ব্যবসায়িক প্রয়োজনের ওপর — কতটা latency মেনে নেওয়া যায় তার ওপর।</p>

<h3>Natural Idempotency — Client-Generated ID দিয়ে ডিজাইন এড়ানো</h3>
<p>একটা সম্পূর্ণ ভিন্ন পদ্ধতি হলো POST-এর বদলে <b>PUT with client-generated resource ID</b> ব্যবহার করা। যেমন <code>POST /orders</code> (সার্ভার নতুন ID জেনারেট করে) এর বদলে <code>PUT /orders/{client-generated-uuid}</code> ব্যবহার করলে, resource-টাই idempotency key হয়ে যায় — একই UUID দিয়ে দুইবার PUT করলে একই resource-ই তৈরি/আপডেট হবে, আলাদা করে idempotency-key স্টোরেজ দরকার হয় না। এই পদ্ধতি ডিজাইন-সময়ে idempotency অন্তর্ভুক্ত করে দেয়, retrofit করার বদলে।</p>

<div class="callout mistake"><span class="tag">Common mistake — Idempotency Key-কে শুধু "logging" এর মতো ট্রিট করা</span>
কিছু বাস্তবায়নে ডেভেলপাররা idempotency key শুধু সংরক্ষণ করেন কিন্তু duplicate request-এর সময় সংরক্ষিত response ফেরত দেওয়ার বদলে আবার পুরো business logic চালিয়ে ফেলেন, বা শুধু একটা log entry তৈরি করেন — এতে idempotency guarantee বাস্তবে কোনো কাজেই আসে না। Key শুধু track করলে চলবে না, সেটা দিয়ে duplicate execution আসলেই বন্ধ করতে হবে।</div>

<div class="callout best"><span class="tag">Best practice — Idempotency-কে business logic-এর সাথে না, transaction boundary-এর সাথে জড়ান</span>
Idempotency key-এর status আপডেট এবং প্রকৃত business operation (যেমন balance deduct করা) একটা একক database transaction-এর মধ্যে করা উচিত — যাতে business logic সফল হওয়ার পর যদি key status আপডেট করতে গিয়ে ব্যর্থ হয় (বা উল্টোটা), সিস্টেম একটা অসামঞ্জস্যপূর্ণ অবস্থায় না থাকে।</div>

<h2 class="title">১২. Concurrent Request Handling — Thread, Process ও Event Loop</h2>
<p class="lead">একটা সার্ভার একইসাথে হাজার হাজার request কীভাবে সামলায় — এই প্রশ্নের উত্তরই ঠিক করে দেয় একটা সিস্টেম কতটা efficient এবং কতটা predictable ভাবে scale করবে।</p>

<h3>Concurrency বনাম Parallelism</h3>
<p><span class="kw">Concurrency</span> মানে একাধিক কাজ একই সময়সীমার মধ্যে অগ্রসর হওয়া (নিশ্চিতভাবে একসাথে না-ও হতে পারে, দ্রুত পালাক্রমে হতে পারে) — যেমন একজন ব্যক্তি একসাথে রান্না করা আর ফোনে কথা বলা (মাঝে মাঝে সুইচ করছেন)। <span class="kw">Parallelism</span> মানে সত্যিকারের একই মুহূর্তে একাধিক কাজ চলা, যা একাধিক CPU core দরকার হয়। একটা single-core মেশিনেও concurrency সম্ভব (context switching দিয়ে), কিন্তু true parallelism দরকার হয় একাধিক core।</p>

<h3>Process-based Model</h3>
<p>প্রতিটা request (বা connection)-এর জন্য একটা আলাদা OS process spawn করা (যেমন পুরনো Apache prefork মডেল)। প্রতিটা process-এর নিজস্ব মেমোরি স্পেস থাকে বলে একটা process crash করলে অন্যদের প্রভাবিত করে না (ভালো isolation), কিন্তু process তৈরি করা এবং মেমোরি বরাদ্দ করা ব্যয়বহুল — হাজার হাজার concurrent connection-এর জন্য হাজার হাজার process ব্যবহারিক না।</p>

<h3>Thread-based Model</h3>
<p>একটা process-এর ভেতরে একাধিক thread চালানো (Java Tomcat, .NET-এর thread pool মডেল) — thread process-এর চেয়ে হালকা (কম মেমোরি, দ্রুত তৈরি), এবং একই process-এর মেমোরি শেয়ার করে। প্রতিটা incoming request একটা thread pool থেকে একটা thread বরাদ্দ পায়, request শেষ হলে thread pool-এ ফিরে যায়। সমস্যা হলো, threads শেয়ার্ড মেমোরি ব্যবহার করে বলে race condition-এর ঝুঁকি থাকে (পরের অধ্যায়ে বিস্তারিত), এবং প্রতিটা blocking I/O operation (যেমন ডাটাবেস কল) একটা পুরো thread-কে আটকে রাখে যতক্ষণ না response আসে।</p>

<h3>Event Loop / Non-blocking I/O Model</h3>
<p>Node.js, Nginx, বা .NET-এর async/await মডেল একটা সীমিত সংখ্যক thread (প্রায়ই একটা মাত্র মূল thread) দিয়ে হাজার হাজার connection সামলায়। যখন একটা operation I/O-এর জন্য অপেক্ষা করে (ডাটাবেস, ফাইল, নেটওয়ার্ক), thread ব্লক না হয়ে সেই কাজটাকে "pending" রেখে অন্য request প্রসেস করতে চলে যায়; I/O সম্পন্ন হলে একটা callback/continuation ট্রিগার হয়ে বাকি কাজ শেষ হয়।</p>

<h3>Blocking বনাম Non-blocking I/O</h3>
<p><span class="kw">Blocking I/O</span>-তে একটা thread একটা I/O operation শুরু করার পর সেই operation শেষ না হওয়া পর্যন্ত থেমে থাকে, অন্য কোনো কাজ করতে পারে না। <span class="kw">Non-blocking I/O</span>-তে thread operation শুরু করে সাথে সাথেই ফিরে আসে (বা একটা future/promise ফেরত দেয়), এবং I/O সম্পন্ন হলে আলাদাভাবে notify করা হয় — এই সময়ে thread অন্য কাজ করতে পারে। এই পার্থক্যটাই ঠিক করে দেয় একটা সীমিত সংখ্যক thread দিয়ে কতগুলো concurrent connection সামলানো সম্ভব।</p>

<h3>Thread Pool ও Connection Pool Sizing</h3>
<p>Thread তৈরি করা এবং ধ্বংস করা ব্যয়বহুল, তাই প্রতিটা request-এ নতুন thread তৈরি না করে একটা <span class="kw">Thread Pool</span> থেকে পুনরায় ব্যবহারযোগ্য thread ধার নেওয়া হয়। একইভাবে, প্রতিটা request-এ নতুন ডাটাবেস connection তৈরি করা ব্যয়বহুল বলে <span class="kw">Connection Pool</span> ব্যবহার করা হয় — একটা নির্দিষ্ট সংখ্যক connection আগে থেকেই তৈরি রেখে সেগুলো ভাগ করে ব্যবহার করা হয়। Pool-এর আকার ভুল হলে সমস্যা হয় — খুব ছোট হলে request queue জমে যায় (latency বাড়ে), খুব বড় হলে backend resource (যেমন ডাটাবেসের max connection limit) ছাপিয়ে যেতে পারে।</p>

<h3>C10K সমস্যা</h3>
<p>ঐতিহাসিকভাবে "একই সময়ে ১০,০০০ connection সামলানো" একটা প্রকৌশল চ্যালেঞ্জ ছিল (thread-per-connection মডেলে হাজার হাজার thread মেমোরি ও context-switching খরচে সিস্টেমকে ধীর করে দিত) — এটাকেই <span class="kw">C10K Problem</span> বলা হয়। Event-driven, non-blocking I/O মডেল (epoll/kqueue-এর মতো OS primitive ব্যবহার করে) এই সমস্যার মূল সমাধান, এবং এখন আধুনিক সার্ভারগুলো লাখ লাখ concurrent connection সামলাতে পারে।</p>

<div class="callout why"><span class="tag">কেন I/O-bound সার্ভিসে Event Loop প্রায়ই thread-per-request-এর চেয়ে ভালো</span>
বেশিরভাগ ওয়েব API মূলত I/O-bound — বেশিরভাগ সময় ডাটাবেস বা external service-এর response-এর জন্য অপেক্ষা করে কাটে, CPU সক্রিয়ভাবে কাজ করে না। এই সময়ে thread-per-request মডেলে thread টা অলসভাবে ব্লক হয়ে বসে থাকে, মেমোরি নষ্ট করে। Event loop মডেলে সেই একই সময়ে thread অন্য শত শত request-এর কাজ এগিয়ে নিতে পারে — তাই একই হার্ডওয়্যারে অনেক বেশি concurrent request সামলানো যায়।</div>

<div class="callout mistake"><span class="tag">Common mistake — Async/Event-loop মডেলে blocking কল করে ফেলা</span>
Node.js বা async .NET কোডে যদি ভুলবশত একটা synchronous/blocking কল (যেমন synchronous file read বা CPU-heavy loop) ঢুকিয়ে ফেলা হয়, সেটা পুরো event loop-কেই ব্লক করে দেয় — শুধু সেই একটা request না, বরং সেই সময়ে অপেক্ষারত সব request একসাথে থেমে যায়। Event-loop মডেলে "কখনও blocking call করা যাবে না" — এই নিয়মটা কঠোরভাবে মানতে হয়।</div>

<h2 class="title">১৩. Concurrency Advanced — Lock, Isolation Level, Distributed Lock ও Backpressure</h2>
<p class="lead">একাধিক request যখন একই ডেটা একসাথে পড়তে-লিখতে চায়, তখনই আসল concurrency সমস্যা শুরু হয় — আর এই অধ্যায়ে সেই সমস্যার শাস্ত্রীয় সমাধানগুলো।</p>

<h3>Race Condition — একটা ক্লাসিক উদাহরণ</h3>
<p>ধরা যাক দুইটা concurrent request একটা প্রোডাক্টের stock count ১ কমাতে চায় (বর্তমান stock = ৫)। দুইটা request-ই প্রায় একই সময়ে stock পড়ে (দুইটাই ৫ দেখে), দুইটাই নিজের হিসেবে ১ বিয়োগ করে (৪), এবং দুইটাই ৪ লিখে ফেলে — যদিও প্রকৃতপক্ষে দুইটা বিক্রয় হয়েছে, stock-এর ৩ হওয়া উচিত ছিল। এটাই <span class="kw">Race Condition</span> — ফলাফল নির্ভর করে অপারেশনগুলোর সময়ক্রম (timing)-এর ওপর, যা predictable না।</p>

<h3>Lock, Mutex ও Semaphore — মৌলিক ধারণা</h3>
<ul>
<li><b>Mutex (Mutual Exclusion Lock):</b> একটা সময়ে শুধু একটা thread/process একটা critical section-এ ঢুকতে পারে — বাকিদের অপেক্ষা করতে হয়।</li>
<li><b>Semaphore:</b> mutex-এর একটা সাধারণীকরণ — একটা নির্দিষ্ট সংখ্যক (N) thread একসাথে একটা resource ব্যবহার করতে পারে (যেমন connection pool-এর সাইজ সীমাবদ্ধ করা)।</li>
</ul>

<h3>Optimistic বনাম Pessimistic Concurrency Control</h3>
<table>
<tr><th>দিক</th><th>Pessimistic Locking</th><th>Optimistic Locking</th></tr>
<tr><td>ধারণা</td><td>ধরে নেওয়া হয় conflict হবেই — তাই আগে থেকে lock নিয়ে নেওয়া হয়</td><td>ধরে নেওয়া হয় conflict কম হবে — কাজ শেষে যাচাই করা হয়</td></tr>
<tr><td>বাস্তবায়ন</td><td><code>SELECT ... FOR UPDATE</code> — row lock করে অন্যদের অপেক্ষা করানো</td><td>প্রতিটা row-তে একটা <code>version</code>/timestamp কলাম রাখা; update করার সময় version মিলিয়ে দেখা, না মিললে retry</td></tr>
<tr><td>সুবিধা</td><td>Conflict বেশি হলে সহজ ও নির্ভরযোগ্য</td><td>Lock-এর জন্য অপেক্ষা করতে হয় না, বেশি throughput</td></tr>
<tr><td>সীমাবদ্ধতা</td><td>বেশি lock contention হলে throughput কমে যায়, deadlock-এর ঝুঁকি</td><td>Conflict বেশি হলে বারবার retry করতে হয়, worst-case-এ ধীর</td></tr>
</table>

<h3>Database Isolation Level ও Anomalies</h3>
<p>একই ডাটাবেস transaction-এ একাধিক concurrent transaction চললে বিভিন্ন ধরনের অসামঞ্জস্য (anomaly) ঘটতে পারে — <b>Dirty Read</b> (এখনও commit না হওয়া ডেটা পড়ে ফেলা), <b>Non-repeatable Read</b> (একই transaction-এর মধ্যে একই row দুইবার পড়লে ভিন্ন ভ্যালু পাওয়া), এবং <b>Phantom Read</b> (একই query দুইবার চালালে ভিন্ন সংখ্যক row ফেরত আসা)। SQL Standard চারটা isolation level সংজ্ঞায়িত করে যা এই anomaly-গুলো কতটা প্রতিরোধ করে তার ভিত্তিতে —</p>
<table>
<tr><th>Isolation Level</th><th>Dirty Read</th><th>Non-repeatable Read</th><th>Phantom Read</th></tr>
<tr><td>Read Uncommitted</td><td>সম্ভব</td><td>সম্ভব</td><td>সম্ভব</td></tr>
<tr><td>Read Committed</td><td>প্রতিরোধ হয়</td><td>সম্ভব</td><td>সম্ভব</td></tr>
<tr><td>Repeatable Read</td><td>প্রতিরোধ হয়</td><td>প্রতিরোধ হয়</td><td>সম্ভব (DB-নির্ভর)</td></tr>
<tr><td>Serializable</td><td>প্রতিরোধ হয়</td><td>প্রতিরোধ হয়</td><td>প্রতিরোধ হয়</td></tr>
</table>
<p>যত উঁচু isolation level, ততই বেশি নিরাপত্তা কিন্তু ততই বেশি lock contention এবং কম concurrency throughput — এটাও একটা trade-off, absolute সঠিক উত্তর নেই।</p>

<h3>Distributed Locks — একাধিক Instance-এর মধ্যে Coordination</h3>
<p>যখন একটা সার্ভিস horizontal ভাবে scaled (একাধিক instance চলছে), সাধারণ in-memory lock কাজ করে না — কারণ প্রতিটা instance-এর নিজস্ব মেমোরি আলাদা। তখন দরকার হয় <span class="kw">Distributed Lock</span> — একটা shared, external system-এ lock রাখা যা সব instance দেখতে পায়।</p>
<ul>
<li><b>Redis-based (Redlock):</b> Redis-এ <code>SET key value NX EX ttl</code> দিয়ে একটা lock অর্জন করা, কাজ শেষে মুছে ফেলা। TTL থাকা জরুরি, নাহলে lock ধারণকারী process crash করলে lock চিরস্থায়ী আটকে থাকবে (deadlock)।</li>
<li><b>ZooKeeper / etcd:</b> এগুলো consensus-ভিত্তিক (Raft/ZAB) সিস্টেম, Redis-এর চেয়ে বেশি guarantee দেয় (network partition-এও সঠিক আচরণ), কিন্তু বেশি latency ও অপারেশনাল জটিলতা।</li>
</ul>
<div class="callout why"><span class="tag">কেন Distributed Lock-এ TTL এবং fencing token জরুরি</span>
একটা process lock নেওয়ার পর যদি অস্বাভাবিকভাবে ধীর হয়ে যায় (GC pause, network delay) এবং TTL শেষ হয়ে lock অন্য কাউকে দিয়ে দেওয়া হয়, তারপর প্রথম process "জেগে উঠে" মনে করে তার কাছে এখনও lock আছে — দুইটা process একই resource-এ কাজ করতে পারে। এই সমস্যা এড়াতে প্রতিটা lock acquisition-এর সাথে একটা monotonically বাড়তে থাকা <b>fencing token</b> যুক্ত করা হয়, এবং resource-কে বলা হয় শুধু সর্বশেষ token-ওয়ালা operation গ্রহণ করতে।
</div>

<h3>Backpressure ও Thundering Herd</h3>
<p>যখন একটা সিস্টেমে incoming request-এর হার তার প্রসেসিং ক্ষমতার চেয়ে বেশি হয়ে যায়, <span class="kw">Backpressure</span> মেকানিজম দরকার হয় — queue-এর একটা সীমা রাখা, সীমা ছাড়ালে নতুন request প্রত্যাখ্যান করা (<b>load shedding</b>), অথবা upstream client-কে ধীর হতে বলা। এটা না থাকলে queue অসীমভাবে বেড়ে মেমোরি শেষ করে ফেলতে পারে, অথবা সব request এত ধীরে প্রসেস হবে যে কার্যত পুরো সিস্টেমই অকেজো হয়ে যাবে। <span class="kw">Thundering Herd</span> সমস্যা তখন ঘটে যখন একসাথে অনেক client (বা retry) হঠাৎ করে একটা সার্ভিসে ঝাঁপিয়ে পড়ে (যেমন cache expire হওয়ার পরপরই সবাই একসাথে origin-এ রিকোয়েস্ট পাঠায়) — এটা এড়াতে <b>jittered/randomized retry backoff</b>, request coalescing, এবং circuit breaker ব্যবহার করা হয়।</p>

<div class="callout mistake"><span class="tag">Common mistake — Retry করার সময় সবাই একই বিলম্বে আবার চেষ্টা করা</span>
যদি সব client ব্যর্থ request-এর পর ঠিক একই fixed delay-তে retry করে, তারা সবাই আবার একসাথে সার্ভারে আঘাত করবে — সমস্যা আরও খারাপ হবে। <b>Exponential Backoff with Jitter</b> (প্রতিটা retry-তে দেরি বাড়ানো + একটা এলোমেলো র‍্যান্ডম উপাদান যোগ করা) এই সমস্যা প্রতিরোধ করে, retry-গুলোকে সময়ে ছড়িয়ে দেয়।</div>

<div class="callout best"><span class="tag">Best practice — যেখানে সম্ভব Optimistic Locking, প্রয়োজনে Pessimistic</span>
বেশিরভাগ ওয়েব অ্যাপ্লিকেশন workload-এ conflict rate কম থাকে (দুইজন ইউজার একই সময়ে একই row edit করা বিরল), তাই optimistic locking সাধারণত ভালো throughput দেয়। শুধু উচ্চ-conflict, financial-critical অপারেশনে (যেমন একটা shared counter বা account balance) pessimistic locking বা serializable isolation বিবেচনা করা উচিত।</div>
</template>

<h2 class="title">১৪. Rate Limiting Fundamentals — কী, কেন এবং Throttling</h2>
<p class="lead">Scaling infrastructure যতই শক্তিশালী হোক না কেন, একটা misbehaving client বা আক্রমণকারী যদি সীমাহীন request পাঠাতে থাকে, পুরো সিস্টেম চাপে পড়ে যাবে — Rate Limiting এই সীমা বলবৎ করার প্রথম প্রতিরক্ষা।</p>

<h3>Rate Limiting কী এবং কেন দরকার</h3>
<p><span class="kw">Rate Limiting</span> একটা নির্দিষ্ট সময়সীমার মধ্যে একজন client (বা IP, API key, ইউজার) কতগুলো request পাঠাতে পারবে তার একটা সীমা বলবৎ করে। এর প্রধান উদ্দেশ্যগুলো —</p>
<ul>
<li><b>Abuse ও DDoS প্রতিরোধ:</b> একটা malicious client পুরো সিস্টেমকে overwhelm করতে না পারে।</li>
<li><b>Fair Usage নিশ্চিত করা:</b> একজন heavy client যাতে বাকি সবার সার্ভিস মান নষ্ট না করে।</li>
<li><b>Downstream সার্ভিস রক্ষা করা:</b> ডাটাবেস বা external API-এর সীমিত ক্ষমতা যাতে ছাপিয়ে না যায়।</li>
<li><b>খরচ নিয়ন্ত্রণ:</b> Pay-per-use external API বা cloud resource-এর খরচ নিয়ন্ত্রণে রাখা।</li>
<li><b>ব্যবসায়িক নীতি বলবৎ করা:</b> Free tier বনাম Paid tier-এর জন্য ভিন্ন request quota।</li>
</ul>

<h3>Rate Limiting বনাম Throttling বনাম Quota</h3>
<table>
<tr><th>শব্দ</th><th>অর্থ</th></tr>
<tr><td>Rate Limiting</td><td>একটা সময় উইন্ডোতে সর্বোচ্চ কতগুলো request গ্রহণযোগ্য — সীমা ছাড়ালে সরাসরি প্রত্যাখ্যান (৪২৯)</td></tr>
<tr><td>Throttling</td><td>সীমা ছাড়ালে request প্রত্যাখ্যান না করে ধীর/delay করে প্রসেস করা (queue-তে রাখা)</td></tr>
<tr><td>Quota</td><td>সাধারণত অনেক বড় সময়সীমায় (দৈনিক/মাসিক) সর্বমোট ব্যবহারের সীমা, ব্যবসায়িক প্ল্যানের সাথে যুক্ত</td></tr>
</table>

<h3>Rate Limiting কোথায় প্রয়োগ করা হয়</h3>
<ul>
<li><b>Client-side:</b> SDK/client লাইব্রেরিতে নিজে থেকেই request rate সীমিত রাখা (ভালো নাগরিকত্ব, কিন্তু নির্ভরযোগ্য না — client bypass করতে পারে)।</li>
<li><b>API Gateway-তে:</b> সবচেয়ে সাধারণ জায়গা — কেন্দ্রীভূতভাবে সব ট্র্যাফিকের ওপর নীতি বলবৎ করা যায়, ৬-৭ অধ্যায়ে আলোচিত Gateway-এর একটা মূল দায়িত্ব।</li>
<li><b>Individual Service-এ:</b> একটা নির্দিষ্ট downstream সার্ভিস (যেমন একটা external payment API) নিজেকে রক্ষা করার জন্য নিজস্ব সীমা রাখতে পারে।</li>
</ul>

<h3>প্রাথমিক অ্যালগরিদম — Fixed Window Counter</h3>
<p>সবচেয়ে সহজ পদ্ধতি — একটা নির্দিষ্ট সময় উইন্ডো (যেমন প্রতি মিনিট) সংজ্ঞায়িত করে, সেই উইন্ডোতে একটা counter রাখা হয়, প্রতিটা request-এ counter বাড়ানো হয়, এবং সীমা ছাড়ালে request প্রত্যাখ্যান করা হয়; পরবর্তী উইন্ডো শুরু হলে counter রিসেট হয়ে যায়।</p>
<div class="callout mistake"><span class="tag">Fixed Window-এর Boundary Burst সমস্যা</span>
Fixed Window-এর একটা সূক্ষ্ম সমস্যা আছে — যদি সীমা "প্রতি মিনিটে ১০০ request" হয়, একজন client উইন্ডোর শেষ সেকেন্ডে ১০০টা request পাঠাতে পারে, এবং পরের উইন্ডোর প্রথম সেকেন্ডে আরও ১০০টা — অর্থাৎ মাত্র ২ সেকেন্ডে ২০০ request পাস হয়ে যায়, যদিও গড়ে "প্রতি মিনিটে ১০০" নীতি লঙ্ঘিত হয়নি বলে মনে হয়। এই সমস্যার সমাধান পরের অধ্যায়ে আলোচিত Sliding Window পদ্ধতিতে।
</div>

<div class="callout why"><span class="tag">কেন rate limit-কে ৪২৯ status code দিয়ে জানানো জরুরি</span>
একটা client যদি বুঝতেই না পারে সে rate-limited হয়েছে (যেমন generic ৫০০ error পেলে), সে ভুলভাবে ধরে নিতে পারে সার্ভার ভেঙে গেছে, এবং আরও আক্রমণাত্মকভাবে retry করতে শুরু করতে পারে — যা সমস্যাটাকে আরও খারাপ করে। HTTP <code>429 Too Many Requests</code> status code এবং <code>Retry-After</code> header ব্যবহার করে client-কে স্পষ্টভাবে জানানো উচিত ঠিক কী ঘটেছে এবং কখন আবার চেষ্টা করা উচিত।</div>

<h2 class="title">১৫. Rate Limiting Algorithms — Token Bucket, Sliding Window ও Distributed Rate Limiting</h2>
<p class="lead">Fixed Window-এর সীমাবদ্ধতা কাটিয়ে ওঠার জন্য তৈরি হয়েছে আরও কিছু পরিশীলিত অ্যালগরিদম, যেগুলো production সিস্টেমে সবচেয়ে বেশি ব্যবহৃত হয়।</p>

<h3>Token Bucket</h3>
<p>একটা "বালতি" কল্পনা করুন যাতে token থাকে, নির্দিষ্ট হারে (যেমন প্রতি সেকেন্ডে ১০টা) নতুন token যোগ হয়, এবং বালতির একটা সর্বোচ্চ ধারণক্ষমতা (capacity) আছে। প্রতিটা incoming request একটা token খরচ করে; token থাকলে request পাস, না থাকলে প্রত্যাখ্যান। এই পদ্ধতি <b>burst traffic</b> সহ্য করতে পারে — যদি বালতি ভরা থাকে, একসাথে অনেকগুলো request (বালতির ক্ষমতা পর্যন্ত) পাস হতে পারে, তারপর ধীর refill rate অনুযায়ী সীমাবদ্ধ হয়ে যায়। এটাই আজকের সবচেয়ে জনপ্রিয় rate-limiting অ্যালগরিদম, কারণ এটা গড় হার এবং burst — দুটোই নিয়ন্ত্রণ করতে দেয়।</p>

<h3>Leaky Bucket</h3>
<p>Token Bucket-এর বিপরীত ধারণা — request একটা queue (বালতি)-তে জমা হয়, এবং একটা constant, fixed rate-এ (যেমন প্রতি সেকেন্ডে ৫টা) বালতি থেকে "leak" (প্রসেস) হয়। বালতি ভর্তি হয়ে গেলে নতুন request প্রত্যাখ্যান হয়। এটা output rate-কে সম্পূর্ণ smooth এবং constant রাখে, burst-কে সহ্য করে না — downstream সার্ভিসকে predictable, ধ্রুবক rate-এ traffic পাঠানোর জন্য উপযুক্ত।</p>

<h3>Sliding Window Log</h3>
<p>প্রতিটা request-এর timestamp একটা log-এ সংরক্ষণ করা হয়। নতুন request এলে, বর্তমান সময় থেকে window size পিছিয়ে যত পুরনো timestamp আছে সব বাদ দিয়ে, বাকি entry সংখ্যা গণনা করে সীমা যাচাই করা হয়। এটা সবচেয়ে <b>accurate</b> পদ্ধতি (Fixed Window-এর boundary burst সমস্যা নেই), কিন্তু প্রতিটা client-এর জন্য প্রতিটা request-এর timestamp সংরক্ষণ করতে হয় বলে <b>মেমোরি খরচ বেশি</b>।</p>

<h3>Sliding Window Counter</h3>
<p>Fixed Window-এর সরলতা এবং Sliding Window Log-এর accuracy-এর মধ্যে একটা ব্যবহারিক ভারসাম্য — বর্তমান এবং আগের উইন্ডোর counter রাখা হয়, এবং বর্তমান সময় আগের উইন্ডোর কতটা ভেতরে আছে তার অনুপাত হিসেবে আগের counter-এর একটা weighted অংশ যোগ করে আনুমানিক (approximate) কিন্তু যথেষ্ট নির্ভুল একটা সীমা হিসাব করা হয়। মেমোরি খরচ কম (শুধু দুইটা counter), এবং boundary burst সমস্যা অনেকাংশে প্রশমিত হয়।</p>

<tr><th>অ্যালগরিদম</th><th>Burst সহ্য করে</th><th>মেমোরি খরচ</th><th>Accuracy</th></tr>
<tr><td>Fixed Window Counter</td><td>হ্যাঁ (boundary-তে সমস্যাযুক্ত)</td><td>খুবই কম</td><td>কম</td></tr>

</table>

<h3>Distributed Rate Limiting</h3>
<p>যখন API Gateway বা service নিজেই horizontal ভাবে scaled (একাধিক instance), rate limit counter শুধু একটা instance-এর মেমোরিতে রাখলে চলবে না — একজন client ভিন্ন ভিন্ন instance-এ request পাঠিয়ে সীমা এড়িয়ে যেতে পারবে। তাই counter একটা <b>shared, centralized store</b>-এ (সাধারণত Redis) রাখতে হয়। এখানেও concurrency অধ্যায়ে আলোচিত race condition-এর ঝুঁকি থাকে — তাই counter বৃদ্ধি এবং সীমা যাচাই একটা <b>atomic operation</b>-এ (Redis-এর <code>INCR</code> + <code>EXPIRE</code>, অথবা একটা Lua script দিয়ে পুরো check-and-increment একসাথে atomic করে) করতে হয়।</p>

<div class="callout why"><span class="tag">কেন Redis Lua Script এখানে গুরুত্বপূর্ণ</span>
"counter পড়ো, সীমার সাথে তুলনা করো, বাড়াও" — এই তিনটা ধাপ আলাদাভাবে করলে দুইটা concurrent request race condition-এ পড়ে সীমা ছাড়িয়ে যেতে পারে। Redis-এ একটা Lua script পাঠালে পুরো লজিকটা Redis সার্ভারের ভেতরে একটা atomic, single-threaded operation হিসেবে চলে — কোনো race condition সম্ভব না।</div>

<h3>Response Semantics — Client-কে সঠিকভাবে জানানো</h3>
<p>একটা ভালো rate-limited API নিচের header-গুলো response-এ পাঠায়, যাতে client নিজে থেকেই তার ব্যবহার নিয়ন্ত্রণ করতে পারে —</p>
<ul>
<li><code>X-RateLimit-Limit</code> — মোট অনুমোদিত সীমা।</li>
<li><code>X-RateLimit-Remaining</code> — বর্তমান উইন্ডোতে বাকি থাকা request সংখ্যা।</li>
<li><code>X-RateLimit-Reset</code> — কখন উইন্ডো রিসেট হবে (timestamp)।</li>
<li><code>Retry-After</code> — সীমা ছাড়ালে, কত সেকেন্ড পর আবার চেষ্টা করা উচিত।</li>
</ul>

<h3>Per-User, Per-IP ও Per-API-Key Limiting</h3>
<p>সীমা একক গ্লোবাল না হয়ে সাধারণত বিভিন্ন dimension-এ প্রয়োগ করা হয় — <b>Per-IP</b> (অ্যানোনিমাস traffic-এর জন্য, কিন্তু NAT-এর পেছনে একাধিক ইউজার একই IP শেয়ার করলে সমস্যা হতে পারে), <b>Per-User/Per-Account</b> (login করা ইউজারের জন্য), এবং <b>Per-API-Key/Per-Client</b> (partner/third-party integration-এর জন্য, প্রায়ই <b>tiered limit</b>-এর সাথে যুক্ত — Free tier ১০০ req/min, Paid tier ১০,০০০ req/min)।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু IP-ভিত্তিক rate limiting-এ নির্ভর করা</span>
Corporate NAT বা mobile carrier NAT-এর পেছনে হাজার হাজার প্রকৃত ইউজার একই public IP শেয়ার করতে পারে — শুধু IP দেখে সীমা বসালে বৈধ ইউজাররা একে অপরের কারণে ব্লক হয়ে যেতে পারে। যেখানেই সম্ভব, authenticated ইউজার/API key-ভিত্তিক সীমা IP-ভিত্তিক সীমার সাথে যুক্ত করে ব্যবহার করা উচিত।</div>

<div class="callout best"><span class="tag">Best practice — Rate Limit যত সম্ভব সামনের দিকে (Edge/Gateway) প্রয়োগ করুন</span>
Rate limit চেক যত আগে (CDN/Edge বা API Gateway-তে) করা যায়, তত কম রিসোর্স নষ্ট হয় — একটা প্রত্যাখ্যাত request-এর জন্য পুরো backend সার্ভিস, ডাটাবেস কানেকশন খরচ করার দরকার নেই। "যত দ্রুত সম্ভব প্রত্যাখ্যান করো" নীতিটা সিস্টেমের সামগ্রিক resilience-এ বড় পার্থক্য তৈরি করে।</div>
