<h2 class="title">১৭. Interview প্রশ্নোত্তর</h2>
<p class="lead">এই টপিকগুলো নিয়ে ইন্টারভিউতে বারবার আসা প্রশ্ন — সংক্ষিপ্ত, সরাসরি উত্তরসহ।</p>

<h3>১) Vertical আর Horizontal Scaling-এর মধ্যে আপনি কীভাবে সিদ্ধান্ত নেবেন কোনটা ব্যবহার করবেন?</h3>
<p>প্রথমে vertical scaling দিয়ে শুরু করা উচিত কারণ এটা সহজ এবং কম জটিল। যখন হার্ডওয়্যার সীমায় পৌঁছে যাবেন, downtime এড়াতে চাইবেন, বা fault tolerance দরকার হবে, তখন horizontal scaling-এ যাওয়া উচিত — কিন্তু তার আগে সার্ভিসকে stateless বানানো একটা পূর্বশর্ত।</p>

<h3>২) Sticky Session কেন সাধারণত এড়িয়ে চলা উচিত?</h3>
<p>এটা horizontal scaling-এর মূল সুবিধা (যেকোনো request যেকোনো server-এ যেতে পারা) নষ্ট করে দেয়, load unevenly বিতরণ করতে পারে, এবং সেই নির্দিষ্ট server ডাউন হলে ইউজার সেশন হারিয়ে ফেলে। এর বদলে centralized session store (Redis) বা token-based auth (JWT) ব্যবহার করা উচিত।</p>

<h3>৩) Layer 4 আর Layer 7 Load Balancing-এর মধ্যে মূল পার্থক্য কী, এবং কখন কোনটা বেছে নেবেন?</h3>
<p>L4 শুধু IP/port দেখে রুট করে (দ্রুত, কম CPU), L7 HTTP content (URL, header, cookie) দেখে রুট করে (স্মার্ট routing, বেশি CPU)। Microservices-এ path-based routing দরকার হলে L7 আবশ্যক; উচ্চ-throughput, প্রোটোকল-অজ্ঞেয় (protocol-agnostic) ট্র্যাফিকে L4 যথেষ্ট।</p>

<h3>৪) Consistent Hashing কী সমস্যা সমাধান করে?</h3>
<p>সাধারণ modulo hashing-এ backend সংখ্যা বদলালে প্রায় সব key নতুন backend-এ চলে যায় (cache-এর ক্ষেত্রে বিপর্যয়কর)। Consistent Hashing একটা hash ring ব্যবহার করে node যোগ/বাদ দিলে শুধু আশেপাশের সামান্য অংশ প্রভাবিত হয়, বাকি সব key তাদের আগের mapping-এই থাকে।</p>

<h3>৫) API Gateway আর Load Balancer-এর মধ্যে পার্থক্য কী?</h3>
<p>Load Balancer একাধিক identical backend instance-এর মধ্যে ট্র্যাফিক বিতরণ করে — এটা backend-এর business logic সম্পর্কে সচেতন না। API Gateway একটা উঁচু স্তরের abstraction — এটা রুট, auth, rate limit, aggregation-এর মতো API-level concern সামলায়, এবং একাধিক ভিন্ন সার্ভিসের মধ্যে সিদ্ধান্ত নেয় কোনটা কোথায় যাবে।</p>

<h3>৬) API Gateway আর Service Mesh একসাথে কেন ব্যবহার করা হয়?</h3>
<p>Gateway North-South ট্র্যাফিক (বাইরে থেকে ভেতরে) সামলায়, Service Mesh East-West ট্র্যাফিক (সার্ভিস-টু-সার্ভিস) সামলায় — mTLS, internal retry, internal load balancing, observability। দুটো ভিন্ন সমস্যার সমাধান, তাই একসাথে থাকা স্বাভাবিক, একে অপরের বিকল্প না।</p>

<h3>৭) একটা URI ডিজাইন করার সময় কোন কোন নীতি মেনে চলা উচিত?</h3>
<p>URI resource (noun) নির্দেশ করবে, action (verb) না — action HTTP method দিয়ে প্রকাশ হয় (<code>GET /orders/42</code>, <code>getOrder?id=42</code> না)। Plural resource নাম, সীমিত nesting depth (৩ স্তরের বেশি না), এবং filtering/sorting query parameter দিয়ে করা উচিত, আলাদা path দিয়ে না।</p>

<h3>৮) Offset-based আর Cursor-based Pagination-এর মধ্যে পার্থক্য কী, এবং বড় স্কেলে কোনটা ভালো?</h3>
<p>Offset-based pagination (<code>?offset=100&limit=20</code>) ডেটাবেসকে প্রতিবার শুরু থেকে গণনা করে বাদ দিতে হয়, তাই বড় offset-এ ধীর হয়ে যায় এবং concurrent insert-এ item দ্বৈত/অনুপস্থিত দেখাতে পারে। Cursor-based pagination একটা indexed reference থেকে পরের সেট খুঁজে বের করে, যা ডেটার আকার নির্বিশেষে দ্রুত ও স্থিতিশীল — এই কারণেই বড় স্কেলের সিস্টেমে এটা পছন্দনীয়।</p>

<h3>৯) কোন পরিবর্তন একটা API-তে "breaking" হিসেবে গণ্য হয়, আর কোনটা না?</h3>
<p>নতুন optional ফিল্ড বা endpoint যোগ করা non-breaking — পুরনো client সেটা উপেক্ষা করবে। বিদ্যমান ফিল্ড মুছে ফেলা, ফিল্ডের নাম/টাইপ বদলানো, একটা optional ফিল্ডকে required করা, বা কোনো endpoint সরিয়ে ফেলা — এগুলো breaking, কারণ পুরনো client-এর কোড এসবের ওপর নির্ভর করে থাকতে পারে এবং crash করতে পারে।</p>

<h3>১০) API Versioning-এর চারটা প্রধান কৌশল কী কী, এবং বাস্তবে কোনটা সবচেয়ে বেশি ব্যবহৃত হয়?</h3>
<p>URI Path (<code>/v2/orders</code>), Query Parameter (<code>?version=2</code>), Custom Header (<code>Api-Version: 2</code>), এবং Media Type/Content Negotiation (<code>Accept: application/vnd.company.v2+json</code>)। বাস্তবে URI Path versioning সবচেয়ে বেশি ব্যবহৃত হয় কারণ এটা স্পষ্ট, ডিবাগ করা সহজ, এবং Gateway routing-এ সরাসরি ব্যবহার করা যায় — যদিও Media Type versioning সবচেয়ে "খাঁটি" RESTful পদ্ধতি হিসেবে বিবেচিত হয়।</p>

<h3>১১) একটা পুরনো API ভার্সন responsibly deprecate করার প্রক্রিয়া কী?</h3>
<p><code>Deprecation</code> header দিয়ে ঘোষণা করা, <code>Sunset</code> header দিয়ে (RFC 8594) সুনির্দিষ্ট বন্ধ হওয়ার তারিখ জানানো, যথেষ্ট migration সময় দেওয়া, sunset-এর আগে পুরনো ভার্সনের actual ব্যবহার monitor করা, এবং একটা স্পষ্ট migration guide প্রকাশ করা — হঠাৎ বন্ধ না করে।</p>

<h3>১২) কেন POST স্বভাবতই idempotent না, কিন্তু PUT idempotent?</h3>
<p>PUT পুরো resource প্রতিস্থাপন করে — একই ডেটা দিয়ে একাধিকবার PUT করলে একই ফলাফল হয়। POST সাধারণত একটা নতুন resource তৈরি করে, প্রতিবার নতুন unique ID জেনারেট করে — তাই দুইবার একই POST চালালে দুইটা ভিন্ন resource তৈরি হয়ে যায়।</p>

<h3>১৩) Idempotency Key pattern কীভাবে কাজ করে, একটা duplicate request কীভাবে ধরা পড়ে?</h3>
<p>Client একটা unique key জেনারেট করে request-এর সাথে পাঠায়; retry হলেও একই key ব্যবহার করে। Server প্রথমবার সেই key-এর সাথে response সংরক্ষণ করে; একই key দিয়ে পরের request এলে business logic আবার না চালিয়ে সংরক্ষিত response ফেরত দেয়। Key-lookup ও reservation অবশ্যই atomic হতে হবে, নাহলে দুইটা concurrent duplicate একসাথে "key নেই" দেখে দুইবারই প্রসেস করে ফেলতে পারে।</p>

<h3>১৪) Optimistic আর Pessimistic Concurrency Control-এর মধ্যে পার্থক্য কী, এবং কখন কোনটা বেছে নেবেন?</h3>
<p>Pessimistic locking আগে থেকেই row lock করে রাখে (<code>SELECT FOR UPDATE</code>) — high-conflict পরিস্থিতিতে নির্ভরযোগ্য কিন্তু throughput কমায়। Optimistic locking একটা version কলাম দিয়ে conflict শুধু update-এর সময় যাচাই করে, conflict কম থাকলে ভালো throughput দেয় কিন্তু high-conflict-এ বারবার retry লাগে।</p>

<h3>১৫) Database Isolation Level-গুলো কী কী সমস্যা প্রতিরোধ করে?</h3>
<p>Read Uncommitted কিছুই প্রতিরোধ করে না; Read Committed dirty read প্রতিরোধ করে; Repeatable Read এর সাথে non-repeatable read-ও প্রতিরোধ করে; Serializable সব anomaly (dirty, non-repeatable, phantom read) প্রতিরোধ করে কিন্তু সবচেয়ে বেশি concurrency খরচ করে।</p>

<h3>১৬) Distributed Lock-এ TTL এবং fencing token কেন দরকার?</h3>
<p>TTL না থাকলে lock ধারণকারী process crash করলে lock চিরস্থায়ী আটকে থাকবে (deadlock)। Fencing token GC pause বা network delay-এর কারণে একটা "পুরনো" lock holder ভুলবশত এখনও কাজ চালিয়ে যাওয়া থেকে রক্ষা করে — resource শুধু সর্বশেষ, সবচেয়ে বড় token গ্রহণ করে।</p>

<h3>১৭) Event Loop (Node.js/async মডেল) কেন থ্রেড-পার-রিকোয়েস্ট মডেলের চেয়ে বেশি concurrent connection সামলাতে পারে?</h3>
<p>বেশিরভাগ ওয়েব রিকোয়েস্ট I/O-bound — বেশিরভাগ সময় network/DB response-এর জন্য অপেক্ষায় কাটে। Thread-per-request মডেলে সেই অপেক্ষার সময় থ্রেড অলসভাবে ব্লক থাকে, মেমোরি নষ্ট করে। Event loop মডেলে সেই সময়ে একই থ্রেড অন্য শত শত request এগিয়ে নেয়, তাই একই হার্ডওয়্যারে অনেক বেশি concurrent connection সামলানো যায়।</p>

<h3>১৮) Token Bucket আর Leaky Bucket rate limiting অ্যালগরিদমের পার্থক্য কী?</h3>
<p>Token Bucket burst traffic সহ্য করতে পারে (বালতি ভরা থাকলে একসাথে অনেক request পাস হতে পারে), গড় হার নিয়ন্ত্রণ করে। Leaky Bucket output rate সম্পূর্ণ constant/smooth রাখে, burst সহ্য করে না — downstream-এ predictable rate পাঠানোর জন্য উপযুক্ত।</p>

<h3>১৯) Fixed Window rate limiting-এর boundary burst সমস্যা কী, এবং কীভাবে সমাধান হয়?</h3>
<p>একজন client উইন্ডোর শেষে এবং পরের উইন্ডোর শুরুতে দ্রুত পরপর রিকোয়েস্ট পাঠিয়ে কার্যত দ্বিগুণ সীমা ব্যবহার করে ফেলতে পারে। Sliding Window Log (নির্ভুল কিন্তু মেমোরি-ভারী) বা Sliding Window Counter (আনুমানিক কিন্তু হালকা) দিয়ে এই সমস্যা সমাধান করা হয়।</p>

<h3>২০) Distributed Rate Limiting-এ কেন একটা shared store (যেমন Redis) দরকার, এবং সেখানে race condition কীভাবে এড়ানো হয়?</h3>
<p>সার্ভিস horizontal ভাবে scaled হলে প্রতিটা instance-এর আলাদা in-memory counter দিয়ে client ভিন্ন instance-এ request পাঠিয়ে সীমা এড়িয়ে যেতে পারবে। তাই counter Redis-এর মতো shared store-এ রাখতে হয়, এবং "চেক + বৃদ্ধি" ধাপ Lua script দিয়ে atomic করে race condition এড়ানো হয়।</p>

<h3>২১) একটা "place order" API-তে scaling, load balancing, gateway, idempotency, concurrency, আর rate limiting — এই ছয়টা concept একসাথে কীভাবে কাজ করে, সংক্ষেপে বলুন।</h3>
<p>Gateway auth ও rate limit যাচাই করে সঠিক সার্ভিসে রুট করে; Load Balancer সেই সার্ভিসের একাধিক stateless instance-এর মধ্যে ট্র্যাফিক ভাগ করে; সার্ভিস idempotency key দিয়ে duplicate retry ঠেকায়; stock update-এর সময় optimistic locking দিয়ে concurrent request-এর race condition এড়ায়; আর পুরো সিস্টেম horizontal scaling ও caching/replication দিয়ে বাড়তে থাকা ট্র্যাফিক সামলায়।</p>
</template>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
</html>
