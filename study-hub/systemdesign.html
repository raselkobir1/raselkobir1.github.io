<h3>Unique ID Generation — মূল আকর্ষণ</h3>
<p>প্রতিটা দীর্ঘ URL-এর জন্য একটা ইউনিক, ছোট identifier বানানোই এই সিস্টেমের সবচেয়ে চিন্তাশীল অংশ। তিনটা approach তুলনা করা যাক।</p>
<table>
<tr><th>Approach</th><th>কীভাবে কাজ করে</th><th>সমস্যা</th></tr>
<tr><td>Auto-increment ID + Base62</td><td>ডেটাবেসের auto-increment integer ID-কে Base62 (a-z, A-Z, ০-9) এনকোড করে ছোট স্ট্রিং বানানো</td><td>Single DB-তে auto-increment একটা bottleneck; ID sequential ও predictable (নিরাপত্তা ও privacy ঝুঁকি — কেউ ID গুনে গুনে অন্যদের URL অনুমান করতে পারে)</td></tr>
<tr><td>Hash (MD5/SHA) truncate</td><td>মূল URL হ্যাশ করে প্রথম ৭টা character নেওয়া</td><td>Collision সম্ভব — দুইটা আলাদা URL একই ৭-character hash দিতে পারে; collision হলে একটা salt যুক্ত করে আবার hash করতে হয় (retry loop)</td></tr>
<tr><td>Distributed ID Generator (Snowflake-স্টাইল)</td><td>64-bit ID = timestamp + machine ID + sequence counter, কোনো central coordination ছাড়াই</td><td>Clock drift-এর ওপর নির্ভরশীল, এবং machine ID assignment একটু জটিল সেটআপ প্রয়োজন করে</td></tr>
</table>
<p>প্রথম দুই approach-এর সীমাবদ্ধতার কারণে বড় স্কেলে <span class="kw">Snowflake-এর মতো Distributed ID Generator</span> সবচেয়ে জনপ্রিয় সমাধান। এটার মূল ধারণা — একটা 64-bit integer-কে তিনটা অংশে ভাগ করা:</p>

<div class="callout why"><span class="tag">কেন এটা কোনো central coordination ছাড়াই globally unique</span>
প্রতিটা মেশিনের নিজের ফিক্সড machine ID আছে (একবার সেটআপে assign করা), এবং প্রতিটা মেশিন স্বাধীনভাবে নিজের ঘড়ি ও নিজের sequence counter ব্যবহার করে ID বানায়। যেহেতু (timestamp, machine ID, sequence) তিনটার combination আলাদা আলাদা মেশিনে কখনো একসাথে মিলবে না (machine ID অংশটাই আলাদা করে দেয়), তাই কোনো central lock বা coordinator লাগে না — প্রতিটা মেশিন সম্পূর্ণ parallel-এ, নিজের মধ্যেই কাজ করে ইউনিক ID বানাতে পারে। এবং timestamp সবার আগে থাকায় ID-গুলো roughly time-sortable — সময় অনুযায়ী sort করলে তৈরি হওয়ার ক্রম প্রায় বজায় থাকে।</div>
<div class="callout mistake"><span class="tag">Common mistake — Hash approach-এ collision হ্যান্ডলিং ভুলে যাওয়া</span>
অনেকে ইন্টারভিউতে "URL hash করে ৭ character নিয়ে নেব" বলে থেমে যান, কিন্তু collision handling না বললে ডিজাইন অসম্পূর্ণ থেকে যায় — birthday paradox অনুযায়ী যথেষ্ট বড় স্কেলে (কোটি কোটি URL) কম bit-এর hash truncation-এ collision অনিবার্য। সঠিক উত্তর: collision চেক করে, হলে একটা salt/counter যুক্ত করে re-hash করার retry loop রাখা।</div>

               └────────────────────────────────────────┘
</pre></div>
<p>Write path: Client → App Server (URL validate করে, distributed ID generator থেকে ID নিয়ে Base62-এ এনকোড করে) → Database-এ (short_code, long_url) সেভ → Client-কে short URL রিটার্ন। Read/redirect path: Client short URL-এ ভিজিট করে → App server প্রথমে Cache চেক করে (hot URL হলে বেশিরভাগ সময় cache hit) → miss হলে Database থেকে lookup → HTTP redirect response পাঠানো।</p>

<h3>Deep Dive — Redirect-এ 301 বনাম 302</h3>
<div class="callout behind"><span class="tag">301 (Permanent) বনাম 302 (Temporary) — একটা ছোট সিদ্ধান্ত, বড় প্রভাব</span>
HTTP <b>301</b> redirect ব্রাউজার cache করে রাখে — একবার redirect হওয়ার পর ভবিষ্যতে সেই short URL-এ ক্লিক করলে ব্রাউজার সরাসরি long URL-এ চলে যায়, সার্ভারে আর রিকোয়েস্টই আসে না। এতে সার্ভার লোড কমে, কিন্তু প্রতিটা ক্লিকের analytics (কতবার ক্লিক হলো, কখন, কোথা থেকে) ট্র্যাক করা কঠিন হয়ে যায় কারণ সার্ভার সেই পরের ক্লিকগুলো দেখতেই পায় না। HTTP <b>302</b> redirect প্রতিবার সার্ভারে আসে (browser cache করে না), তাই প্রতিটা ক্লিক ট্র্যাক করা সহজ, কিন্তু সার্ভারে বেশি লোড পড়ে। বেশিরভাগ প্রোডাকশন URL shortener (analytics-driven বিজনেস মডেল থাকায়) 302 বেছে নেয়, ট্রেড-অফ জেনেও।</div>

<h3>Database Choice ও Sharding Strategy</h3>
<p>এই ওয়ার্কলোড মূলত simple key-value lookup (short_code দিয়ে long_url বের করা) — কোনো জটিল query বা join লাগে না, তাই একটা NoSQL key-value store (যেমন DynamoDB বা Cassandra) সাধারণত relational DB-এর চেয়ে বেশি উপযুক্ত, কারণ এগুলো এই এক্সেস প্যাটার্নে horizontally scale করতে সহজ।</p>
<p>Sharding-এর জন্য <code>short_code</code> নিজেই সবচেয়ে স্বাভাবিক partition key — কারণ প্রতিটা read/write ঠিক এই key দিয়েই হয়, তাই partition key হিসেবে ব্যবহার করলে প্রতিটা lookup ঠিক একটা শার্ডে গিয়ে সরাসরি পাওয়া যায়, কোনো cross-shard query লাগে না।</p>
<div class="callout best"><span class="tag">Best practice — hot key এড়াতে সতর্ক থাকুন</span>
কোনো একটা short URL যদি ভাইরাল হয়ে যায় (যেমন একটা সোশ্যাল মিডিয়া পোস্টে হাজার হাজার ক্লিক), তাহলে সেই একটা shard-এই সব ট্রাফিক পড়তে পারে — একে hot key/hot shard বলা হয়। এই সমস্যা কমাতে হট URL-গুলো cache layer-এ (Redis) রাখা হয়, যাতে ডেটাবেস শার্ডের ওপর সরাসরি চাপ না পড়ে।</div>
</template>

<template data-page="ratelimiter">
<h2 class="title">১২. Case Study — Rate Limiter (Production-grade Design)</h2>
<p class="lead">আগের অধ্যায়ে শেখা rate-limiting algorithm-গুলো single-server-এ ভালো কাজ করে, কিন্তু একাধিক app server থাকলে সেগুলো নিজেই একটা নতুন সমস্যার জন্ম দেয় — এই case study সেই সমস্যাটা সমাধান করবে।</p>

<h3>Requirements</h3>
<p><b>Functional Requirements:</b></p>
<ul>
<li>Per-user, per-IP, বা per-API-key ভিত্তিতে রিকোয়েস্ট limit করা।</li>
<li>বিভিন্ন endpoint-এর জন্য বিভিন্ন rule সাপোর্ট করা (যেমন লগইন endpoint-এ কড়া limit, static asset-এ ঢিলা limit)।</li>
<li>Limit ছাড়ালে client-কে স্পষ্টভাবে জানানো, যাতে সে বুঝে কখন আবার চেষ্টা করা উপযুক্ত।</li>
</ul>
<p><b>Non-functional Requirements:</b></p>
<ul>
<li>Rate limiter নিজেই যাতে সিস্টেমে অতিরিক্ত latency যোগ না করে — এটা প্রতিটা রিকোয়েস্টে বসে থাকা critical-path কম্পোনেন্ট, তাই খুব দ্রুত হতে হবে।</li>
<li>Accurate হতে হবে, কিন্তু distributed environment-এ কাজ করতে হবে — এটাই এই ডিজাইনের মূল চ্যালেঞ্জ। আগের অধ্যায়ে শেখা algorithm (token bucket, sliding window ইত্যাদি) সিঙ্গেল-সার্ভার প্রসঙ্গে সঠিক ফল দেয়, কিন্তু একাধিক app server instance-এর ক্ষেত্রে সরাসরি প্রয়োগ করলে ভেঙে যায়।</li>
</ul>

<h3>কেন Distributed Rate Limiting আলাদা সমস্যা</h3>
<p>ধরুন একটা সিস্টেমে ৫টা app server instance আছে, এবং একটা load balancer সেগুলোর মধ্যে round-robin-এ ট্রাফিক ভাগ করে দেয়। যদি প্রতিটা instance নিজের নিজের in-memory counter দিয়ে rate limit ট্র্যাক করে (যেমন "প্রতি মিনিটে ১০০ রিকোয়েস্ট"), তাহলে একজন ব্যবহারকারীর রিকোয়েস্ট যদি এই ৫টা সার্ভারেই ছড়িয়ে যায়, প্রতিটা সার্ভার তার নিজের ১০০-এর কোটা আলাদা আলাদাভাবে গণনা করবে।</p>
<div class="diagram"><pre>
                          ┌────────────────┐
      User ── round-robin ▶ Server 1: count=100/100 (limit hit!)
                          └────────────────┘
                          ┌────────────────┐
      User ── round-robin ▶ Server 2: count=100/100 (limit hit!)
                          └────────────────┘
                          ┌────────────────┐
      User ── round-robin ▶ Server 3: count=100/100 (limit hit!)
                          └────────────────┘
                                  ...
      মোট = ৫ × ১০০ = ৫০০ রিকোয়েস্ট পাস হয়ে গেল, প্রকৃত ইচ্ছা ছিল ১০০!
</pre></div>
<p>ফলাফল — ব্যবহারকারী প্রকৃত সীমার ৫× বেশি রিকোয়েস্ট পাঠাতে পারছে, কারণ প্রতিটা সার্ভার একে অপরের counter সম্পর্কে সম্পূর্ণ অজানা।</p>
<div class="callout why"><span class="tag">কেন এর সমাধান শুধু একটাই — shared, centralized store</span>
এই সমস্যার মূল কারণ হলো counter-এর state সার্ভার-লোকাল হওয়া। সমাধান তাই একটাই দিকে যায় — counter অবশ্যই সব app server instance-এর মধ্যে <b>shared</b> একটা কেন্দ্রীয় স্টোরে (যেমন Redis) রাখতে হবে, প্রতিটা instance আলাদা মেমরিতে না। তাহলে user যে সার্ভারেই যাক, সবাই একই counter-এর বিরুদ্ধে চেক করবে, এবং সীমা global ভাবে সঠিকভাবে প্রয়োগ হবে।</div>

<h3>Redis-ভিত্তিক Token Bucket Implementation</h3>
<p>ডিজাইন — Redis-এ প্রতিটা user/API-key-এর জন্য একটা key (যেমন <code>ratelimit:user:1234</code>), যেখানে current count রাখা হয়, এবং একটা TTL (window duration) সেট করা থাকে। প্রতিটা রিকোয়েস্টে <code>INCR</code> করে counter বাড়ানো হয়, প্রথমবার key তৈরি হলে <code>EXPIRE</code> সেট করা হয় window শেষ হলে counter নিজে থেকে reset হওয়ার জন্য।</p>
<div class="callout mistake"><span class="tag">Common mistake — check ও increment আলাদা দুইটা ধাপে করা</span>
যদি লজিক এমন লেখা হয় "প্রথমে GET করে count দেখি, তারপর যদি limit-এর নিচে থাকে তবে INCR করি" — এই দুইটা আলাদা Redis command-এর মাঝখানে একটা <b>race condition</b> তৈরি হয়। দুইটা রিকোয়েস্ট একই সময়ে GET করে দুইটাই দেখে count এখনো limit-এর নিচে, দুইটাই INCR করে ফেলে — ফলে limit ছাড়িয়ে যায়। check-and-increment অবশ্যই একটা <b>atomic operation</b> হতে হবে।</div>
<p>এই atomicity নিশ্চিত করতে একটা Lua script ব্যবহার করা হয়, যা Redis-এ একটা single atomic unit হিসেবে চলে (Redis-এর single-threaded execution model-এর কারণে একটা Lua script চলাকালীন অন্য কোনো command মাঝখানে ঢুকতে পারে না):</p>
<pre>
-- Redis Lua script: atomic check-and-increment
local key = KEYS[1]
local limit = tonumber(ARGV[1])
local window = tonumber(ARGV[2])   <span class="c">-- সেকেন্ডে window duration</span>

local current = redis.call("INCR", key)
if current == 1 then
    redis.call("EXPIRE", key, window)  <span class="c">-- প্রথম রিকোয়েস্টেই TTL সেট করা</span>
end

if current &gt; limit then
    return 0   <span class="c">-- reject</span>
else
    return 1   <span class="c">-- allow</span>
end
</pre>
<p>এই script <code>EVALSHA</code>/<code>EVAL</code> দিয়ে চালানো হয় — পুরো check-increment-expire লজিক একটাই atomic round-trip-এ ঘটে, তাই দুইটা concurrent রিকোয়েস্ট একে অপরের মাঝে "ফাঁক" খুঁজে পায় না।</p>

<h3>Client-কে জানানো — HTTP 429 ও Headers</h3>
<p>Limit ছাড়ালে সার্ভার HTTP <code>429 Too Many Requests</code> status code রিটার্ন করে। এর সাথে standard header দিয়ে client-কে সাহায্য করা হয়:</p>
<table>
<tr><th>Header</th><th>অর্থ</th></tr>
<tr><td><code>X-RateLimit-Limit</code></td><td>এই window-এ সর্বোচ্চ কতটা রিকোয়েস্ট অনুমোদিত</td></tr>
<tr><td><code>X-RateLimit-Remaining</code></td><td>বর্তমান window-এ আর কতটা রিকোয়েস্ট বাকি আছে</td></tr>
<tr><td><code>Retry-After</code></td><td>কত সেকেন্ড পরে আবার চেষ্টা করলে সফল হওয়ার সম্ভাবনা আছে</td></tr>
</table>

<h3>High-Level Design</h3>
<div class="diagram"><pre>
   Client ───▶ API Gateway / Middleware ───▶ Redis (shared counter)
                 (rate limiter check)         key: ratelimit:user:1234
                        │                      atomic INCR + EXPIRE
                        │
              allow (count ≤ limit)
                        │
                        ▼
                Backend Service
                        │
              reject (count &gt; limit)
                        │
                        ▼
              HTTP 429 + Retry-After
</pre></div>
<p>এখানে rate limiter middleware layer-টা সাধারণত API Gateway-তে বা একটা shared middleware-এ বসানো হয় — যাতে প্রতিটা মাইক্রোসার্ভিসকে আলাদা আলাদা করে rate-limiting লজিক ইমপ্লিমেন্ট করতে না হয়, একটা কেন্দ্রীয় জায়গায় policy enforce করা যায়।</p>

<h3>Clock Synchronization সমস্যা</h3>
<div class="callout behind"><span class="tag">Clock drift window-based algorithm-এ ছোট inaccuracy তৈরি করে</span>
Distributed system-এ প্রতিটা সার্ভারের ঘড়ি সামান্য ভিন্ন হতে পারে (NTP sync থাকলেও কয়েক মিলিসেকেন্ড থেকে কয়েক সেকেন্ড drift থাকতে পারে)। Fixed-window বা sliding-window rate limiting যেহেতু window boundary নির্ধারণে সময়ের ওপর নির্ভর করে, সামান্য clock drift-এর কারণে window-এর সীমানা ঠিক এক মিলিসেকেন্ড এদিক-ওদিক হতে পারে — ফলে সীমানার আশেপাশে হওয়া কিছু রিকোয়েস্ট সামান্য ভুল window-এ গণনা হতে পারে। প্র্যাকটিক্যালি এটা এমন ক্ষুদ্র একটা inaccuracy যে rate limiting-এর মূল উদ্দেশ্য (abuse প্রতিরোধ, fair usage) ক্ষতিগ্রস্ত হয় না — তাই এটা একটা acceptable trade-off হিসেবে গণ্য করা হয়, perfect precision-এর জন্য জটিলতা বাড়ানো বেশিরভাগ ক্ষেত্রে যুক্তিযুক্ত নয়।</div>

<h3>Trade-offs — সংক্ষিপ্ত সারাংশ</h3>
<table>
<tr><th>সিদ্ধান্ত</th><th>সুবিধা</th><th>খরচ</th></tr>
<tr><td>Centralized Redis counter</td><td>সঠিক, consistent global limit</td><td>Redis নিজেই একটা critical dependency ও latency source হয়ে যায়</td></tr>
<tr><td>Lua script দিয়ে atomicity</td><td>Race condition সম্পূর্ণ দূর হয়</td><td>Script maintain করা ও debug করা তুলনামূলক জটিল</td></tr>
<tr><td>Fixed/sliding window (clock-ভিত্তিক)</td><td>বাস্তবায়ন সহজ, কম মেমরি</td><td>Clock drift-জনিত ক্ষুদ্র inaccuracy, boundary-তে burst সম্ভব</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — Redis-কেও নিজে redundant রাখুন</span>
যেহেতু rate limiter পুরো সিস্টেমের critical path-এ বসে, Redis instance নিজেই single point of failure হয়ে যেতে পারে। প্রোডাকশনে Redis Cluster বা Sentinel দিয়ে replication/failover রাখা হয়, এবং Redis সম্পূর্ণ unavailable হলে rate limiter "fail open" (সব রিকোয়েস্ট পাস করে দেওয়া) নাকি "fail closed" (সব রিকোয়েস্ট রিজেক্ট করা) করবে — এই সিদ্ধান্তও ব্যবসায়িক প্রেক্ষাপট অনুযায়ী স্পষ্টভাবে নেওয়া উচিত।</div>
</template>


<template data-page="distcache">
<h2 class="title">১৩. Case Study — Distributed Cache / Key-Value Store</h2>
<p class="lead">Redis Cluster বা Memcached-এর মতো একটা distributed in-memory key-value store শুরু থেকে শেষ পর্যন্ত কীভাবে ডিজাইন করবেন — এই কোর্সের আগের অধ্যায়গুলোর concept-গুলো এখানে একসাথে বাস্তবে প্রয়োগ হবে।</p>

<h3>Requirements</h3>
<p><b>Functional requirements:</b></p>
<ul>
<li><code>PUT(key, value)</code> — একটা key-value pair সংরক্ষণ করা।</li>
<li><code>GET(key)</code> — key দিয়ে value ফেরত দেওয়া।</li>
<li><code>DELETE(key)</code> — key মুছে ফেলা।</li>
<li>ঐচ্ছিক: প্রতিটা key-এর জন্য <b>TTL (Time-To-Live)</b> সেট করা যাবে, যেটা পার হলে key নিজে থেকেই invalid হয়ে যাবে।</li>
</ul>
<p><b>Non-functional requirements:</b></p>
<ul>
<li><b>Low latency</b> — সাধারণত single-digit millisecond, অনেক ক্ষেত্রে sub-millisecond। এটাই cache-এর মূল উদ্দেশ্য — database access-এর চেয়ে বহুগুণ দ্রুত হওয়া।</li>
<li><b>High availability</b> — একটা node down হলেও পুরো সিস্টেম কাজ করা বন্ধ করবে না।</li>
<li><b>Horizontal scalability</b> — ট্রাফিক বা ডেটা বাড়লে সহজে নতুন node যুক্ত করা যাবে, downtime ছাড়া।</li>
<li><b>Consistency নিয়ে ছাড়</b> — cache-এ eventual consistency গ্রহণযোগ্য; strong consistency চাইলে latency-র বিনিময়ে কেনা লাগবে, যা cache-এর মূল purpose-কেই নষ্ট করে।</li>
</ul>

<h3>Estimation — কেন Distributed দরকার</h3>
<p>ধরা যাক আমাদের hot dataset ৫০০ GB, এবং peak-এ ১০ লাখ (1M) GET request/সেকেন্ড আসছে, গড় object সাইজ ~১ KB।</p>
<ul>
<li>একটা সাধারণ সার্ভারে RAM সাধারণত ৬৪–২৫৬ GB পর্যন্ত থাকে। ৫০০ GB ডেটা একটা মেশিনের RAM-এ ধরবে না — এমনকি ধরলেও, single machine-এ ১M QPS handle করা network I/O এবং CPU-বাউন্ড সীমার কারণে বাস্তবসম্মত নয়।</li>
<li>তাই ডেটাকে ভাগ করে একাধিক node-এ রাখতে হবে (sharding), এবং প্রতিটা node আলাদাভাবে request সার্ভ করবে — এতে aggregate throughput বহুগুণ বেড়ে যায়।</li>
<li>৫০০ GB-কে যদি প্রতি node-এ ~৬৪ GB ধরে ভাগ করি, তাহলে ন্যূনতম ~৮টা shard লাগবে। Availability-র জন্য প্রতিটা shard-এর অন্তত একটা replica রাখলে node সংখ্যা দ্বিগুণ, অর্থাৎ ~১৬টা।</li>
</ul>
<div class="callout why"><span class="tag">কেন cache "single source of truth" নয়</span>
Cache সবসময় একটা secondary, disposable ডেটা স্টোর — মূল ডেটা থাকে database-এ। এই কারণেই cache node হারিয়ে গেলে সেটাকে খালি অবস্থা থেকে আবার populate করা সম্ভব; এটা persistence-এর মতো critical durability guarantee দাবি করে না, এবং এই সরলীকরণই cache-কে এত দ্রুত ও সস্তা করে রাখে।</div>

<h3>High-Level Design</h3>
<p>মূল উপাদান তিনটা: (১) একটা client-side routing/hashing library যা জানে কোন key কোন node-এ যাবে, (২) cache node-গুলোর একটা cluster (ring), এবং (৩) প্রতিটা node-এর একটা replica।</p>
<div class="diagram"><pre>
                        ┌─────────────┐
                        │   Client    │
                        │ Application │
                        └──────┬──────┘
                               │  key = "user:42"
                               ▼
                     ┌───────────────────┐
                     │  Hashing / Routing │
                     │      Library       │
                     └─────────┬──────────┘
                               │ hash(key) → node
         ┌─────────────────────┼─────────────────────┐
         ▼                     ▼                     ▼
   ┌───────────┐         ┌───────────┐         ┌───────────┐
   │  Node A    │◄──sync─►│  Node B    │◄──sync─►│  Node C    │
   │ (primary)  │         │ (primary)  │         │ (primary)  │
   └─────┬─────┘         └─────┬─────┘         └─────┬─────┘
         │ replicate            │ replicate            │ replicate
         ▼                      ▼                      ▼
   ┌───────────┐         ┌───────────┐         ┌───────────┐
   │ Replica A' │         │ Replica B' │         │ Replica C' │
   └───────────┘         └───────────┘         └───────────┘
</pre></div>

<h3>Deep Dive ১ — Consistent Hashing-এর বাস্তব প্রয়োগ</h3>
<p>৬ নম্বর অধ্যায়ে <span class="kw">Consistent Hashing</span> বিস্তারিত শেখা হয়েছে — এখানে সংক্ষেপে recap করে দেখি এটা এই সিস্টেমে ঠিক কীভাবে কাজ করে।</p>
<p>প্রতিটা node-কে hash ring-এর উপর একাধিক পয়েন্টে (virtual node) বসানো হয়। একটা key আসলে, তার hash বের করে ring-এ clockwise দিকে প্রথম যে node পড়ে, সেটাই সেই key-এর মালিক।</p>
<pre>function getNode(key):
    h = hashFunction(key)
    <span class="c">// ring হলো sorted hash-value → node ম্যাপিং</span>
    node = ring.findFirstClockwise(h)
    return node</pre>
<p>এর সবচেয়ে বড় সুবিধা হলো — একটা node যুক্ত বা বিয়োগ হলে গোটা keyspace re-shuffle হয় না, কেবল তার আশেপাশের ছোট একটা অংশের key স্থানান্তরিত হয়। সাধারণ <code>hash(key) % N</code> পদ্ধতিতে N বদলালে প্রায় সব key-এর মালিকানা বদলে যায় — যা distributed cache-এ প্রতিবার scale করার সময় বিপর্যয়কর হতো।</p>

<h3>Deep Dive ২ — Cluster-এর ভেতরে Replication</h3>
<p>প্রতিটা primary node-এর সাথে অন্তত একটা replica রাখা হয়, এবং replica সাধারণত আলাদা physical rack বা availability zone-এ থাকে।</p>
<div class="callout why"><span class="tag">কেন replica ছাড়া চলে না</span>
Consistent hashing শুধু বলে দেয় কোন key কোন node-এ যাবে — কিন্তু সেই node crash করলে ওই shard-এর সব ডেটা মুহূর্তে হারিয়ে যাবে, কারণ ডেটা RAM-এ। Replica না থাকলে একটা node-এর ব্যর্থতা মানেই সেই shard-এর সব key-এর জন্য পুরোপুরি cache miss — downstream database-এর উপর আকস্মিক পুরো ট্রাফিকের চাপ পড়বে (thundering herd), যা database-কেও ফেলে দিতে পারে।
</div>
<p>Primary-তে write হলে asynchronously replica-তে propagate হয়। Primary down হলে একটা replica promote হয়ে নতুন primary হয় — এই promotion সাধারণত একটা coordination service (যেমন gossip protocol বা external orchestrator) দিয়ে হয়।</p>

<h3>Deep Dive ৩ — Memory Management ও Eviction</h3>
<p>RAM সীমিত, তাই নতুন ডেটার জন্য জায়গা করতে পুরনো/কম-ব্যবহৃত ডেটা সরাতে হয়। ৪ নম্বর অধ্যায়ে <span class="kw">LRU (Least Recently Used)</span> বিস্তারিত আলোচনা হয়েছে; এখানে দেখি বাস্তবে কোন policy কখন কাজে লাগে।</p>
<table>
<tr><th>Eviction Policy</th><th>যেভাবে কাজ করে</th><th>কখন উপযোগী</th></tr>
<tr><td>LRU</td><td>সবচেয়ে দীর্ঘদিন access না-হওয়া key সরানো হয়</td><td>General-purpose — বেশিরভাগ ক্ষেত্রে ডিফল্ট পছন্দ</td></tr>
<tr><td>LFU</td><td>সবচেয়ে কম-ফ্রিকোয়েন্সিতে access হওয়া key সরানো হয়</td><td>Access pattern-এ বারবার ফিরে-আসা "hot" key স্পষ্ট থাকলে</td></tr>
<tr><td>TTL-based</td><td>নির্দিষ্ট সময় পার হলে স্বয়ংক্রিয়ভাবে expire</td><td>Session token, OTP-এর মতো সময়সীমা-বাঁধা ডেটা</td></tr>
<tr><td>Random</td><td>Randomly key সরানো হয়</td><td>Overhead কম রাখতে চাইলে, খুব বড় স্কেলে যেখানে LRU tracking-এর CPU cost গুরুত্বপূর্ণ</td></tr>
</table>

<h3>Client-side Hashing বনাম Proxy-based Routing</h3>
<p>Client কীভাবে সঠিক node খুঁজে পাবে তার দুইটা মূল স্থাপত্য আছে।</p>
<table>
<tr><th>বিষয়</th><th>Client-side Hashing</th><th>Proxy-based Routing</th></tr>
<tr><td>কীভাবে কাজ করে</td><td>Client নিজেই hashing library দিয়ে node নির্ধারণ করে সরাসরি connect করে</td><td>একটা middle-layer proxy সব request receive করে, ভেতরে ভেতরে সঠিক node-এ ফরওয়ার্ড করে</td></tr>
<tr><td>Latency</td><td>কম — extra network hop নেই</td><td>বেশি — একটা অতিরিক্ত hop যুক্ত হয়</td></tr>
<tr><td>Client জটিলতা</td><td>বেশি — প্রতিটা client-কে cluster topology জানতে হয়, ring পরিবর্তন হলে sync রাখতে হয়</td><td>কম — client শুধু proxy-র address জানে, বাকিটা proxy-র দায়িত্ব</td></tr>
<tr><td>Node যুক্ত/অপসারণ</td><td>সব client-কে নতুন ring জানাতে হয় (broadcast/refresh প্রয়োজন)</td><td>শুধু proxy layer আপডেট করলেই যথেষ্ট</td></tr>
<tr><td>উদাহরণ</td><td>Memcached (client library-ভিত্তিক), Redis Cluster (client redirect করে)</td><td>Twemproxy, Envoy-ভিত্তিক cache proxy</td></tr>
</table>
<div class="callout best"><span class="tag">বাস্তবে যা বেছে নেওয়া হয়</span>
Latency-sensitive সিস্টেমে client-side hashing পছন্দ করা হয়, কারণ extra hop-এর cost বড় স্কেলে জমতে জমতে উল্লেখযোগ্য হয়ে ওঠে। কিন্তু বহু ভাষার (polyglot) client থাকলে proxy-based routing সহজ — প্রতিটা ভাষায় আলাদা hashing library maintain করার বদলে একটাই proxy লজিক maintain করলে চলে।
</div>

<h3>Cache Warm-up সমস্যা</h3>
<div class="callout mistake"><span class="tag">নতুন node যোগ করলেই বিপদ শুরু</span>
Cluster-এ নতুন node যুক্ত হওয়ার সাথে সাথে সে খালি অবস্থায় শুরু করে — consistent hashing-এর কারণে কিছু key তার responsibility-তে চলে আসে, কিন্তু তার কাছে সেই key-গুলোর ডেটা নেই। ফলে ওই node-এর জন্য প্রথম দিকে সব request cache miss হয়ে database-এ যায় — একটা "miss storm" তৈরি হয়, যা achieve করার কথা ছিল সেই database load-শেডিং-এর ঠিক বিপরীত ফল দেয়। সমাধান দুইভাবে করা যায়: (১) নতুন node-কে ধীরে ধীরে ট্রাফিক দেওয়া (gradual traffic shifting, আগের owner node থেকে ক্রমান্বয়ে কিছু কিছু key সরানো), বা (২) migration-এর সময় old owner থেকে নতুন node-এ প্রাসঙ্গিক key সরাসরি copy করে দেওয়া (pre-population), যাতে ownership বদলের মুহূর্তেই ডেটা সেখানে প্রস্তুত থাকে।
</div>

<h3>Trade-offs</h3>
<ul>
<li><b>Consistency বনাম Availability:</b> Async replication মানে replica সাময়িকভাবে stale থাকতে পারে — কিন্তু cache-এর জন্য এটা গ্রহণযোগ্য, কারণ সামান্য পুরনো ডেটা পাওয়া database down হয়ে যাওয়ার চেয়ে ভালো বিকল্প।</li>
<li><b>Memory বনাম Hit Rate:</b> বেশি RAM মানে বেশি key ধরে রাখা যায়, hit rate বাড়ে — কিন্তু cost লিনিয়ারলি বাড়ে, তাই TTL ও eviction policy টিউন করে সীমিত memory-তে সর্বোচ্চ hit rate বের করে আনতে হয়।</li>
<li><b>Simplicity বনাম Flexibility:</b> Client-side hashing দ্রুত কিন্তু client-দের ওপর নির্ভরতা বাড়ায়; proxy layer flexible কিন্তু নিজেই একটা নতুন scaling bottleneck হতে পারে।</li>
</ul>

<h2 class="title">১৪. Case Study — News Feed (Twitter/Instagram)</h2>
<p class="lead">যখন কোটি কোটি মানুষ একসাথে পোস্ট করছে আর একসাথে ফিড দেখছে, তখন "কে কার পোস্ট কবে দেখবে" এই সহজ প্রশ্নটাই System Design-এর সবচেয়ে চর্চিত সমস্যাগুলোর একটা হয়ে ওঠে।</p>

<h3>Requirements</h3>
<p><b>Functional:</b></p>
<ul>
<li>একজন ব্যবহারকারী পোস্ট তৈরি করতে পারবে (text/image/video)।</li>
<li>একজন ব্যবহারকারী আরেকজনকে follow/unfollow করতে পারবে।</li>
<li>একজন ব্যবহারকারী তার feed/timeline দেখতে পারবে — যেখানে সে follow করে এমন সবার সাম্প্রতিক পোস্ট দেখা যাবে, সময়ানুক্রমে বা ranked আকারে।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>Feed পড়া (read) অত্যন্ত ঘন ঘন হয় — write-এর তুলনায় read অনেক বেশি (read-heavy system)।</li>
<li>Feed লোড হতে হবে দ্রুত (few hundred ms-এর মধ্যে) — ব্যবহারকারী app খুললেই প্রথম যা দেখে সেটাই এটা।</li>
<li>Eventual consistency গ্রহণযোগ্য — কেউ পোস্ট করার সাথে সাথে সব follower-এর feed-এ instant না দেখালেও (কয়েক সেকেন্ড দেরি) কোনো সমস্যা নেই।</li>
</ul>

<h3>Estimation</h3>
<ul>
<li>ধরা যাক DAU (Daily Active Users) = ২০ কোটি, গড়ে প্রতিজন ২০০ জনকে follow করে।</li>
<li>প্রতিদিন পোস্ট সংখ্যা ~৫ কোটি, কিন্তু feed read request প্রতিদিন ~৫০০ কোটি (প্রতি ব্যবহারকারী দিনে একাধিকবার feed refresh করে)।</li>
<li>এই read:write ratio (~১০০:১) থেকেই স্পষ্ট — সিস্টেমের optimization focus হওয়া উচিত <b>read path-কে দ্রুত করা</b>, এমনকি তার জন্য write path-এ কিছুটা বাড়তি কাজ (extra writes) মেনে নিতে হলেও।</li>
</ul>

<h3>High-Level Design</h3>
<div class="diagram"><pre>

<h3>Deep Dive — Fan-out-on-Write বনাম Fan-out-on-Read</h3>
<p>এই সিস্টেমের সবচেয়ে গুরুত্বপূর্ণ সিদ্ধান্ত — একটা পোস্ট কবে কম্পিউট হবে: পোস্ট করার সময়, নাকি ফিড পড়ার সময়?</p>
<div class="diagram"><pre>
Fan-out-on-Write (Push):
  User posts ──► Fan-out Worker ──► write to Follower1 feed cache
                                 ├─► write to Follower2 feed cache
                                 ├─► write to Follower3 feed cache
                                 └─► ... (প্রতিটা follower-এর জন্য একটা write)
  Feed পড়া = শুধু cache থেকে read (দ্রুত, pre-computed)

Fan-out-on-Read (Pull):
  User posts ──► শুধু Post Storage-এ save (একটা মাত্র write)
  Feed পড়া = follow করা প্রতিজনের সাম্প্রতিক পোস্ট ফেচ করে merge + sort
             (read-time-এ ভারী কাজ)
</pre></div>
<table>
<tr><th>বিষয়</th><th>Fan-out-on-Write (Push)</th><th>Fan-out-on-Read (Pull)</th></tr>
<tr><td>Write cost</td><td>বেশি — একটা পোস্টে N follower-এর জন্য N write</td><td>কম — একটাই write (post storage-এ)</td></tr>
<tr><td>Read cost</td><td>কম — feed cache থেকে সরাসরি read</td><td>বেশি — বহু জনের পোস্ট merge/sort করতে হয় প্রতিবার</td></tr>
<tr><td>কখন ভালো</td><td>Read-heavy pattern, normal follower count</td><td>Write-heavy বা অতি উচ্চ follower-count account-এর জন্য</td></tr>
<tr><td>মূল ঝুঁকি</td><td>Celebrity problem (নিচে দেখুন)</td><td>Feed load latency বেশি, বিশেষত অনেক follow করা user-দের জন্য</td></tr>
</table>

<div class="callout mistake"><span class="tag">Celebrity Problem</span>
Fan-out-on-Write সরল মনে হলেও একটা কেসে ভেঙে পড়ে: যদি একজন সেলিব্রিটির ১ কোটি follower থাকে, তার একটা পোস্টেই fan-out worker-কে ১ কোটি feed cache write ট্রিগার করতে হবে — এই "thundering write" latency-তে বিশাল spike তৈরি করে এবং worker queue-কে জমাট বাঁধিয়ে দিতে পারে, যার প্রভাব অন্য সব সাধারণ ব্যবহারকারীর পোস্টেও ফ্যানআউট-ডিলে হিসেবে পড়ে। মূল কারণ — write cost follower-সংখ্যার সাথে linear, আর follower distribution বাস্তবে power-law (কিছু account-এর follower বাকিদের চেয়ে কয়েক লক্ষ গুণ বেশি) — তাই একটাই policy দিয়ে সব account cover করা যায় না।
</div>

<h3>সমাধান — Hybrid Approach</h3>
<p>বাস্তব সিস্টেমে (যেমন Twitter) দুইটা মডেল মিশিয়ে ব্যবহার করা হয়:</p>
<ul>
<li><b>সাধারণ ব্যবহারকারী</b> (কম follower) — Fan-out-on-Write। তাদের পোস্টে fan-out cost কম, তাই সাথে সাথে সব follower-এর cache-এ push করা সস্তা এবং feed read দ্রুত থাকে।</li>
<li><b>Celebrity/high-follower account</b> — Fan-out-on-Read। তাদের পোস্ট fan-out করা হয় না; বরং feed পড়ার সময় "আমি কোন কোন celebrity follow করি" তালিকার সাম্প্রতিক পোস্ট আলাদাভাবে fetch করে normal fan-out feed-এর সাথে merge করা হয়।</li>
</ul>
<div class="callout best"><span class="tag">কেন hybrid-ই বাস্তবসম্মত সমাধান</span>
এই ডিজাইন প্রতিটা কেসের জন্য সঠিক trade-off বেছে নেয় — বেশিরভাগ ব্যবহারকারীর জন্য write cost গ্রহণযোগ্য বলে push মডেল রাখা হয় (read দ্রুত রাখতে), কিন্তু outlier (celebrity) কেসে push-এর cost অসহনীয় হয়ে যায় বলে pull মডেলে সরিয়ে নেওয়া হয়। একটাই "one-size-fits-all" মডেল বেছে নিলে হয় normal user-দের read slow হতো, নয়তো celebrity পোস্টে সিস্টেম ভেঙে পড়ত — hybrid এই দুটোই এড়ায়।
</div>

<h3>Feed Ranking — সংক্ষেপে</h3>
<p>দুই ধরনের ranking দেখা যায়: <b>Chronological</b> (সবচেয়ে নতুন পোস্ট আগে — সহজ, predictable) এবং <b>Engagement-based ranking</b> (like/comment/watch-time অনুযায়ী কোন পোস্ট বেশি গুরুত্বপূর্ণ তা একটা ML মডেল দিয়ে score করে সাজানো)। দ্বিতীয়টা engagement বাড়ায় কিন্তু জটিল ML pipeline দরকার — এই কোর্সের scope-এর বাইরে; System Design ইন্টারভিউতে সাধারণত এটা mention করে "feed ranking service একটা আলাদা downstream স্তর" বলে সরিয়ে রাখাই যথেষ্ট।</p>

<h3>Storage Design — সংক্ষেপে</h3>
<ul>
<li><b>Post Store:</b> Post ID দিয়ে sharded (৬ নম্বর অধ্যায়ের sharding ধারণার প্রয়োগ) — প্রতিটা পোস্ট তার নিজস্ব ID অনুযায়ী কোনো shard-এ যায়, যাতে write load সমানভাবে ছড়িয়ে থাকে।</li>
<li><b>Follow Graph Store:</b> Graph-আকৃতির ডেটা (কে কাকে follow করে) — সাধারণত user ID দিয়ে sharded, কারণ query pattern-এর বেশিরভাগই "এই user কাদের follow করে" বা "এই user-এর follower কারা" জিজ্ঞাসা করে।</li>
</ul>

<h3>Trade-offs</h3>
<ul>
<li><b>Write amplification বনাম Read latency:</b> Fan-out-on-Write বেশি write করে কিন্তু read সহজ করে দেয় — read:write ratio বেশি হলে এই বিনিময় লাভজনক।</li>
<li><b>Freshness বনাম Complexity:</b> Hybrid মডেল সঠিক ফল দেয় কিন্তু দুইটা আলাদা কোড পাথ maintain করতে হয়, এবং একটা account কখন "celebrity" থ্রেশহোল্ড পার করে সেই সিদ্ধান্তও নিতে হয়।</li>
<li><b>Chronological বনাম Ranked:</b> Ranked feed বেশি engagement দেয় কিন্তু ব্যবহারকারীর কাছে কম predictable মনে হতে পারে ("আমার friend-এর পোস্ট কেন দেখা যাচ্ছে না")।</li>
</ul>

<h2 class="title">১৫. Case Study — Chat System (WhatsApp/Messenger)</h2>
<p class="lead">Real-time মেসেজিং সিস্টেমে সবচেয়ে গুরুত্বপূর্ণ প্রশ্ন হলো — সার্ভার কীভাবে জানবে ব্যবহারকারী মেসেজ পাঠানোর জন্য "এখনো সংযুক্ত" আছে কিনা, এবং কেউ অফলাইন থাকলে মেসেজটা কোথায় যাবে।</p>

<h3>Requirements</h3>
<p><b>Functional:</b></p>
<ul>
<li>1-on-1 chat এবং group chat সাপোর্ট।</li>
<li>Online/offline status দেখানো (presence)।</li>
<li>Message delivery guarantee — sent → delivered → read স্ট্যাটাস ট্র্যাক করা।</li>
<li>Offline ব্যবহারকারীর জন্য মেসেজ স্টোর করে রাখা, online হলে deliver করা।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>Real-time বা near-real-time delivery (কয়েক শ মিলিসেকেন্ডের মধ্যে)।</li>
<li>একই conversation-এর মেসেজ chronological order বজায় রেখে দেখাতে হবে।</li>
<li>উচ্চ concurrency — লক্ষ লক্ষ ব্যবহারকারী একইসাথে সংযুক্ত থাকতে হবে।</li>
</ul>

<h3>Estimation</h3>
<ul>
<li>ধরা যাক ২০ কোটি DAU, তাদের ৩০% যেকোনো মুহূর্তে অনলাইন — অর্থাৎ ~৬ কোটি concurrent WebSocket connection।</li>
<li>প্রতিদিন মেসেজ সংখ্যা ~১০০ কোটি — অর্থাৎ গড়ে সেকেন্ডে ~১১,৫০০ মেসেজ, পিক আওয়ারে কয়েকগুণ বেশি।</li>
<li>এই বিশাল concurrent connection সংখ্যার কারণেই একটা মাত্র চ্যাট সার্ভার এই connection ধরে রাখতে পারবে না — connection-গুলো অনেকগুলো chat server-এর মধ্যে ভাগ হবে, এবং কোন user কোন server-এ সংযুক্ত তা ট্র্যাক রাখা দরকার হবে।</li>
</ul>

<h3>Deep Dive ১ — Real-time Delivery মেকানিজম</h3>
<p>Client-server-এর মধ্যে instant, bi-directional যোগাযোগের জন্য কোন transport ব্যবহার করব তা প্রথম সিদ্ধান্ত।</p>
<table>
<tr><th>মেকানিজম</th><th>যেভাবে কাজ করে</th><th>সীমাবদ্ধতা</th></tr>
<tr><td>Long Polling</td><td>Client request পাঠায়, সার্ভার নতুন ডেটা না আসা পর্যন্ত response আটকে রাখে, তারপর client আবার request করে</td><td>প্রতিটা round-trip-এ HTTP overhead, বেশি connection churn, সত্যিকারের real-time নয়</td></tr>
<tr><td>Server-Sent Events (SSE)</td><td>একটা persistent HTTP connection দিয়ে সার্ভার client-কে one-way stream করে</td><td>শুধু server→client; chat-এ client-কেও পাঠাতে হয়, তাই একা যথেষ্ট না</td></tr>
<tr><td>WebSocket</td><td>একটা persistent, bidirectional, full-duplex connection — উভয় দিকেই যখনই প্রয়োজন ডেটা পাঠানো যায়</td><td>প্রতিটা open connection সার্ভারে state/memory ধরে রাখে, তাই connection সংখ্যা অনুযায়ী সার্ভার resource প্ল্যান করতে হয়</td></tr>
</table>
<div class="callout why"><span class="tag">কেন WebSocket-ই সঠিক পছন্দ</span>
Chat-এ উভয়মুখী instant যোগাযোগ দরকার — আমি টাইপ করছি এটা তুমি দেখবে, তুমি reply দিলে আমি সাথে সাথে দেখব। SSE একমুখী বলে এখানে অসম্পূর্ণ। Long Polling দুইমুখী কাজ করানো সম্ভব, কিন্তু প্রতিটা মেসেজের জন্য নতুন HTTP request/response ওভারহেড তৈরি করে, যা scale-এ latency ও সার্ভার লোড দুটোই বাড়ায়। WebSocket একবার handshake করে connection persistent রাখে — তারপর মেসেজ পাঠানো মাত্র একটা ছোট frame লেখা, তাই এটাই chat-এর জন্য de facto স্ট্যান্ডার্ড।
</div>

<p>প্রতিটা chat server তার সাথে connect থাকা client-দের জন্য একটা in-memory session map রাখে (কোন user কোন connection-এ আছে)। দুই ইউজার আলাদা server-এ connect থাকলে, মেসেজ পাঠানোর সময় server-দের মধ্যে internal routing দরকার হয় (কে কোন server-এ আছে জানার জন্য একটা lookup service)।</p>

<h3>Deep Dive ২ — Message Storage ও Delivery Guarantee</h3>
<p>প্রতিটা conversation-এর মেসেজ <b>conversation ID</b> দিয়ে shard করা হয় — এতে একই চ্যাটের সব মেসেজ একই shard-এ থাকে, ফলে chronological order বজায় রাখা এবং একটা conversation-এর history fetch করা সহজ ও fast হয় (একটাই shard-এ query, cross-shard merge লাগে না)।</p>

<h3>Presence/Online Status Service</h3>
<p>৯ নম্বর অধ্যায়ে শেখা <span class="kw">heartbeat-ভিত্তিক failure detection</span>-এর সরাসরি প্রয়োগ এখানে দেখা যায় — প্রতিটা client নিয়মিত বিরতিতে সার্ভারকে heartbeat/ping পাঠায়; একাধিক heartbeat miss হলে client-কে offline ধরা হয়।</p>
<div class="callout behind"><span class="tag">কেন Presence আলাদা, eventually-consistent সার্ভিস</span>
লক্ষ লক্ষ ব্যবহারকারীর status প্রতি কয়েক সেকেন্ডে বদলায় — এটা একটা extremely high-write workload। কিন্তু এই status-এর জন্য strong consistency-র কোনো practical প্রয়োজন নেই: আমি কারো "online" স্ট্যাটাস কয়েক সেকেন্ড দেরিতে দেখলেও বাস্তব ক্ষতি নেই। তাই Presence Service-কে মূল মেসেজ delivery path থেকে সম্পূর্ণ আলাদা রাখা হয় — এটা তার নিজস্ব lightweight, high-throughput, eventually-consistent স্টোর ব্যবহার করে, যেখানে সামান্য stale ডেটা মূল্য দিয়ে অনেক বেশি write throughput কেনা হয়।
</div>

<div class="callout mistake"><span class="tag">সব মেসেজ synchronous guarantee দিয়ে ডিজাইন করার ভুল</span>
একটা সাধারণ ভুল হলো প্রতিটা মেসেজ পাঠানোর সময় sender-কে ততক্ষণ অপেক্ষা করানো যতক্ষণ না receiver পর্যন্ত পুরো delivery guarantee confirm হয়। এতে sender-এর experience receiver-এর network/availability-র উপর নির্ভরশীল হয়ে পড়ে — receiver অফলাইন থাকলে বা তার network slow থাকলে sender-এর UI-ও আটকে যায়, latency ও availability উভয়ই ক্ষতিগ্রস্ত হয়। বাস্তবে সমাধান হলো eventual delivery — sender থেকে মেসেজ সার্ভারে পৌঁছালেই sender-কে সাথে সাথে "sent" acknowledge করা হয়, তারপর ব্যাকগ্রাউন্ডে asynchronously delivered/read status client-side retry ও ack দিয়ে আপডেট হয়।
</div>

<h3>Trade-offs</h3>
<ul>
<li><b>Consistency বনাম Latency:</b> Message ordering guarantee করার জন্য conversation-ভিত্তিক sharding প্রয়োজন, কিন্তু cross-device sync-এ সামান্য eventual consistency মেনে নিতে হয়।</li>
<li><b>Connection state বনাম Statelessness:</b> WebSocket-ভিত্তিক chat server স্বভাবতই stateful (কে কোন connection-এ) — এটা load balancing ও horizontal scaling-কে জটিল করে, sticky session বা external session-lookup দরকার হয়।</li>
<li><b>Presence accuracy বনাম Write cost:</b> সবসময় সম্পূর্ণ accurate presence দেখাতে গেলে write cost অসহনীয় হয়ে যায় — কয়েক সেকেন্ডের staleness মেনে নেওয়াই ব্যবহারিক সমাধান।</li>
</ul>
</template>

<h2 class="title">১৬. Case Study — Notification System</h2>
<p class="lead">Push notification, email, SMS — ভিন্ন ভিন্ন channel-এ কোটি কোটি notification পাঠানোর একটা সিস্টেম, যেখানে reliability আর rate control-ই মূল চ্যালেঞ্জ।</p>

<h3>Requirements</h3>
<p><b>Functional:</b></p>
<ul>
<li>একাধিক channel সাপোর্ট — mobile push notification, email, SMS।</li>
<li>একাধিক source সার্ভিস (order service, marketing service, security service ইত্যাদি) থেকে notification ট্রিগার হতে পারবে।</li>
<li>User preference মেনে চলা — কে কোন channel-এ, কোন ধরনের notification পেতে চায় তা respect করা।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>উচ্চ throughput এবং burst handling — যেমন একটা breaking news সবাইকে একসাথে পাঠানো হলে হঠাৎ millions notification generate হতে পারে।</li>
<li>Reliability — গুরুত্বপূর্ণ (transactional) notification যেন হারিয়ে না যায়।</li>
<li>3rd-party gateway (APNs, FCM, SendGrid, Twilio)-এর rate limit ও সাময়িক downtime সহ্য করার সক্ষমতা।</li>
</ul>

<h3>Estimation</h3>
<ul>
<li>প্রতিদিন গড়ে ৫০ কোটি notification পাঠানো হয় ধরলে, গড় rate ~৫,৮০০/সেকেন্ড।</li>
<li>কিন্তু peak burst (breaking news, flash sale) মুহূর্তে এই সংখ্যা কয়েক লাখ/সেকেন্ডে পৌঁছাতে পারে — অর্থাৎ সিস্টেমকে average load-এর জন্য না, বরং <b>burst-এর জন্য</b> ডিজাইন করতে হবে।</li>
<li>এই বিশাল পার্থক্য (average বনাম peak) থেকেই বোঝা যায় — সরাসরি synchronous call করলে চলবে না, buffering/queueing অপরিহার্য।</li>
</ul>

<h3>High-Level Design</h3>
<div class="diagram"><pre>

<h3>Deep Dive ১ — কেন Queue-based Architecture</h3>
<p>৭ নম্বর অধ্যায়ে শেখা <span class="kw">decoupling ও buffering</span> ধারণার সরাসরি প্রয়োগ এখানে সবচেয়ে স্পষ্ট। Notification Service সরাসরি APNs/SendGrid/Twilio-কে sync call করলে দুটো সমস্যা হবে:</p>
<ul>
<li>এই 3rd-party gateway-গুলোর নিজস্ব rate limit আছে — একসাথে লাখ লাখ call পাঠালে সেগুলো throttle/reject করবে।</li>
<li>এই gateway-গুলো সাময়িক downtime বা slow response দিতে পারে — sync call হলে সেই ধীরগতি আমাদের নিজের সার্ভিসে propagate করে পুরো request pipeline block করে দিতে পারে।</li>
</ul>
<div class="callout why"><span class="tag">Queue কীভাবে ধাক্কা শুষে নেয়</span>
একটা message queue Notification Service আর 3rd-party gateway-এর মধ্যে একটা বাফার হিসেবে কাজ করে। Source service থেকে notification আসা মাত্র queue-তে enqueue হয়ে যায় এবং সাথে সাথেই caller-কে "accepted" respond করা যায় — gateway আসলে কবে/কতটা দ্রুত সেটা পাঠাবে তার সাথে caller-এর response time-কে decouple করে দেওয়া হয়। Worker-রা নিজেদের গতিতে (gateway-এর rate limit মেনে) queue থেকে টেনে টেনে পাঠায়। ফলে হঠাৎ burst এলে queue দৈর্ঘ্যে বাড়ে (temporary lag), কিন্তু সিস্টেম ভেঙে পড়ে না বা caller-কে block করে না।
</div>

<h3>Priority Queue</h3>
<p>সব notification সমান জরুরি না — একটা OTP মেসেজ দেরি হলে ব্যবহারকারী লগইন করতে পারবে না, কিন্তু একটা promotional discount notification কয়েক মিনিট দেরি হলে কোনো সমস্যা নেই। তাই আলাদা priority-র queue রাখা হয়:</p>
<table>
<tr><th>ধরন</th><th>উদাহরণ</th><th>Queue/Priority</th></tr>
<tr><td>Transactional/Urgent</td><td>OTP, password reset, payment confirmation</td><td>Urgent Queue — সবচেয়ে বেশি worker allocation, সর্বোচ্চ অগ্রাধিকার</td></tr>
<tr><td>Promotional/Marketing</td><td>Discount offer, newsletter, feature announcement</td><td>Promotional Queue — কম অগ্রাধিকার, স্বল্প worker</td></tr>
</table>
<p>এই বিভাজন ছাড়া, একটা marketing campaign-এর ১ কোটি promotional notification একসাথে queue-তে ঢুকলে সেগুলো একই queue-তে থাকা OTP-এর মতো urgent মেসেজকেও পেছনে ফেলে দেরি করাতে পারত — আলাদা queue এই "noisy neighbor" সমস্যা এড়ায়।</p>

<h3>Deep Dive ২ — Idempotency ও Deduplication</h3>
<p>একটা concrete সমস্যা: worker যখন একটা notification process করার সময় crash করে, queue তার at-least-once delivery guarantee-র কারণে সেই মেসেজটা আবার অন্য worker-কে দেবে (retry)। কিন্তু যদি আগের worker আসলে gateway-কে পাঠানো পর্যন্ত করে ফেলেছিল আর crash হয়েছিল ঠিক তার পরে (acknowledge করার আগে), তাহলে notification-টা <b>দুইবার</b> পাঠানো হয়ে যাবে — ব্যবহারকারী একই OTP বা একই মেসেজ দুইবার পাবে।</p>
<div class="callout best"><span class="tag">সমাধান — Idempotency Key</span>
৭ নম্বর অধ্যায়ে শেখা <span class="kw">idempotency</span> ধারণার সরাসরি প্রয়োগ — প্রতিটা notification তৈরির সময় একটা ইউনিক notification ID generate করা হয় এবং সেটা একটা "sent-log" store-এ track করা হয়। Worker gateway-কে পাঠানোর আগে চেক করে — এই ID কি আগে সফলভাবে পাঠানো হয়েছে? হয়ে থাকলে দ্বিতীয়বার পাঠানো হয় না, শুধু success acknowledge করে দেওয়া হয়। এভাবে retry নিরাপদ হয়ে যায় — একই অপারেশন যতবারই চালানো হোক, ফলাফল একবার পাঠানোর সমানই থাকে।
</div>

<h3>User Preference ও Per-user Rate Limiting</h3>
<p>৮ নম্বর অধ্যায়ে শেখা <span class="kw">rate limiting</span>-এর একটা ভিন্ন প্রেক্ষিতে প্রয়োগ এখানে দেখা যায় — কিন্তু এখানে limit করা হয় API-এর ইনকামিং ট্রাফিক নয়, বরং একজন নির্দিষ্ট ব্যবহারকারী কতগুলো (বিশেষত promotional) notification ঘণ্টায়/দিনে পেতে পারবে তার সীমা। এটা দুই কারণে জরুরি — (১) ব্যবহারকারী notification-এ অতিষ্ঠ হয়ে app uninstall বা opt-out করে ফেলতে পারে, এবং (২) এটা user preference respect করারও একটা অংশ — একজন ব্যবহারকারী "দিনে সর্বোচ্চ ২টা promotional notification" সেট করে রাখলে সিস্টেমকে সেটা মেনে চলতে হবে, বাকিগুলো drop বা delay করতে হবে।</p>

<div class="callout best"><span class="tag">Retry-এ Exponential Backoff</span>
3rd-party gateway সাময়িক down বা rate-limited থাকলে worker সাথে সাথে বারবার retry করলে সমস্যা আরও বাড়ে — gateway যদি ইতিমধ্যে overload-এ থাকে, তাহলে তাৎক্ষণিক পুনঃচেষ্টার ঝড় (retry storm) তাকে আরও চাপে ফেলে, এবং recovery-র সময়ও দীর্ঘায়িত করে। এর বদলে exponential backoff ব্যবহার করা হয় — প্রথম retry কিছুক্ষণ পর, দ্বিতীয় retry তার দ্বিগুণ পর, এভাবে ক্রমবর্ধমান বিরতিতে — যাতে gateway সুস্থ হয়ে ওঠার সময় ও সুযোগ পায়, এবং worker pool-এর সম্পদও অপ্রয়োজনীয় দ্রুত retry-তে অপচয় না হয়।
</div>

<h3>Trade-offs</h3>
<ul>
<li><b>Reliability বনাম Latency:</b> Idempotency check ও sent-log lookup প্রতিটা send-এর সাথে একটু বাড়তি latency যুক্ত করে, কিন্তু duplicate notification এড়ানোর নিরাপত্তা তার বিনিময়ে মূল্যবান।</li>
<li><b>Fairness বনাম Throughput:</b> Priority queue urgent notification-কে অগ্রাধিকার দেয়, কিন্তু বড় promotional burst-এর সময় সেই queue-র throughput কমে যেতে পারে — এটা ইচ্ছাকৃত trade-off।</li>
<li><b>User experience বনাম Business goal:</b> Marketing টিম যত বেশি সম্ভব notification পাঠাতে চাইবে, কিন্তু per-user rate limiting ইচ্ছাকৃতভাবে সেই push-কে সীমিত রাখে যাতে দীর্ঘমেয়াদে ব্যবহারকারী হারিয়ে না যায়।</li>
</ul>
</template>

<h2 class="title">১৭. Case Study — Ride-Sharing System (Uber)</h2>
<p class="lead">এই কেস স্টাডিতে এমন একটা সিস্টেম ডিজাইন করব যেখানে হাজার হাজার driver আর rider প্রতি মুহূর্তে নড়াচড়া করছে, আর সিস্টেমকে প্রতি সেকেন্ডে একজন rider-এর জন্য সবচেয়ে কাছের উপলভ্য driver বের করতে হচ্ছে — এই "কাছের কে?" প্রশ্নটাই এই চ্যাপ্টারের মূল প্রযুক্তিগত চ্যালেঞ্জ।</p>

<h3>Requirements</h3>
<p><b>Functional:</b></p>
<ul>
<li>Rider একটা pickup ও destination location দিয়ে ride request করবে।</li>
<li>সিস্টেম rider-এর আশেপাশের উপলভ্য driver খুঁজে বের করবে এবং একজনকে ride-টা match করবে।</li>
<li>Ride চলাকালীন driver-এর live location rider (ও সিস্টেম) ট্র্যাক করতে পারবে।</li>
<li>Ride শেষে fare হিসাব করা হবে (দূরত্ব, সময়, আর demand অনুযায়ী)।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>Matching latency খুব কম হতে হবে — rider request করার সেকেন্ডখানেকের মধ্যে driver পাওয়া উচিত।</li>
<li>Location update-এর throughput বিশাল — লাখো driver, প্রতিজন প্রতি কয়েক সেকেন্ডে একটা update পাঠাচ্ছে।</li>
<li>High availability — একটা শহরের matching service down হয়ে গেলে পুরো শহরে ride বন্ধ হয়ে যায়, তাই এটা critical path।</li>
<li>Consistency নিয়ে কড়াকড়ির দরকার নেই এক্ষেত্রে — একজন driver-এর location সেকেন্ড কয়েক পুরনো হলেও matching-এর জন্য যথেষ্ট, তাই এখানে strong consistency-র বদলে low latency অগ্রাধিকার পায়।</li>
</ul>

<h3>Estimation (সংক্ষিপ্ত)</h3>
<p>ধরা যাক একটা বড় শহরে একসাথে ২ লাখ driver active আছে, আর প্রতিটা driver প্রতি ৪ সেকেন্ডে একবার তার location পাঠায়। তাহলে সেই একটা শহরেই প্রতি সেকেন্ডে location write হবে —</p>
<pre>২,০০,০০০ driver / ৪ সেকেন্ড ≈ ৫০,০০০ location write/সেকেন্ড (শুধু এক শহরে)

<span class="c">// বহু শহর মিলিয়ে গ্লোবাল স্কেলে এটা কয়েক লাখ write/সেকেন্ডে গিয়ে দাঁড়ায়</span></pre>
<p>এই সংখ্যাটাই বলে দেয় কেন এই সিস্টেমের সবচেয়ে বড় ইঞ্জিনিয়ারিং চাপ read-heavy কোনো ডেটাবেস কুয়েরি নয় — বরং একটা <b>অতি উচ্চ-throughput, ক্ষণস্থায়ী (ephemeral) write workload</b> যেটাকে দ্রুত এমন একটা কাঠামোয় সংগঠিত রাখতে হয় যেখান থেকে "এই বিন্দুর আশেপাশে কে আছে" প্রশ্নের উত্তর মিলিসেকেন্ডে পাওয়া যায়।</p>

<h3>Deep Dive — Geospatial Indexing</h3>
<p>এই সিস্টেমের সবচেয়ে গুরুত্বপূর্ণ ও ইন্টারভিউতে সবচেয়ে বেশি জিজ্ঞাসিত অংশ এটাই: rider-এর অবস্থান দেওয়া থাকলে, লাখো driver-এর মধ্যে থেকে "কাছের" কয়েকজনকে কীভাবে দ্রুত খুঁজে বের করা যায়।</p>
<p><b>কেন Brute-Force কাজ করে না।</b> সরল সমাধান — সব driver-এর location নিয়ে rider-এর অবস্থান থেকে প্রতিটার distance হিসাব করে sort করা, তারপর সবচেয়ে কাছের কয়েকজন নেওয়া। এই পদ্ধতির খরচ প্রতি query-তে <code>O(n)</code>, যেখানে <code>n</code> হলো শহরের মোট active driver সংখ্যা। একটা শহরে যদি ২ লাখ driver থাকে, আর প্রতি সেকেন্ডে হাজার হাজার rider request আসে, তাহলে প্রতিটা request-এ ২ লাখ distance calculation করা — CPU-এর দিক থেকে সম্পূর্ণ অচল। সমস্যাটা মূলত এটাই: এখানে আমাদের এমন একটা ডেটা স্ট্রাকচার লাগবে যা location-কে এমনভাবে সাজিয়ে রাখে যাতে "কাছাকাছি কারা" প্রশ্নের উত্তর পুরো dataset স্ক্যান না করেই মেলে — ঠিক যেমন ৯ নম্বর অধ্যায়ে দেখা bloom filter পুরো dataset স্ক্যান না করেই "membership" প্রশ্নের উত্তর দেয়, এখানেও লক্ষ্য একই রকম — সার্চ স্পেস আগে থেকেই এমনভাবে ভাগ করে রাখা যাতে রানটাইমে শুধু প্রাসঙ্গিক অংশটুকু দেখতে হয়।</p>

<h4>Geohash</h4>
<p><span class="kw">Geohash</span> পুরো পৃথিবীর মানচিত্রকে recursively ছোট ছোট আয়তাকার cell-এ ভাগ করে, আর প্রতিটা cell-কে একটা base-32 string code দেয়। একটা location-এর geohash হিসাব করা মানে — latitude/longitude-কে ইন্টারলিভ করে বিট-বিট করে ভাগ করে যাওয়া, প্রতিটা ভাগে string-এ একটা নতুন character যুক্ত হয়। এর মূল ধর্ম: <b>কাছাকাছি দুটো location-এর geohash string-এর শুরুর কয়েকটা character (prefix) একই থাকে</b> — string যত লম্বা prefix share করে, location দুটো বাস্তবে তত কাছাকাছি।</p>
<pre>rider location  → geohash: wx4g0<span class="c">bcd</span>
nearby driver-1 → geohash: wx4g0<span class="c">bce</span>   <span class="c">// প্রথম ৬ character মিলে যায় → কাছাকাছি</span>
nearby driver-2 → geohash: wx4g0<span class="c">1zz</span>   <span class="c">// প্রথম ৫ character মিলে যায় → একটু দূরে হলেও একই বড় এলাকায়</span>
far driver-3    → geohash: tj9k2xyz          <span class="c">// কোনো prefix মেলে না → বহু দূরে</span></pre>
<p>ব্যবহারিকভাবে "rider-এর কাছের driver খোঁজা" মানে হয়ে যায় — rider-এর geohash-এর একটা নির্দিষ্ট prefix-length ধরে, একই prefix থাকা driver-দের একটা sorted structure (যেমন sorted set) থেকে range query করা। কোনো tree traverse করার দরকার নেই — geohash একটা <b>stateless, pre-computed string</b>, যেকোনো database-এর ইনডেক্স-এ সরাসরি sort করে রাখা যায় (Redis-এর <code>GEOADD</code>/<code>GEORADIUS</code> ঠিক এই কৌশলেই কাজ করে)।</p>
<div class="callout mistake"><span class="tag">Geohash-এর Edge-Boundary সমস্যা</span>
Geohash cell-গুলো grid-এর মতো নির্দিষ্ট সীমানায় কাটা, তাই দুটো driver বাস্তবে মাত্র কয়েক মিটার দূরে থাকলেও একজন একটা cell-এর একদম শেষ প্রান্তে আর আরেকজন প্রতিবেশী cell-এর শুরুতে পড়লে তাদের geohash prefix সম্পূর্ণ ভিন্ন হয়ে যেতে পারে। বাস্তব বাস্তবায়নে এই সমস্যা এড়াতে rider-এর geohash cell-এর পাশাপাশি তার ৮টা প্রতিবেশী cell-ও (neighbor cells) query করা হয়, শুধু একটা cell না।
</div>
<p>Geohash string যত লম্বা হয়, cell তত ছোট (তত নির্দিষ্ট এলাকা) হয় — matching query-তে কতটা lookup precision লাগবে তা string-এর length বেছে নেওয়ার মাধ্যমে নিয়ন্ত্রণ করা যায়।</p>
<table>
<tr><th>Geohash Length</th><th>আনুমানিক Cell আকার</th><th>ব্যবহারিক প্রাসঙ্গিকতা</th></tr>
<tr><td>৪ character</td><td>≈ ৩৯ কিমি × ২০ কিমি</td><td>খুব বড় এলাকা — পুরো শহরের একটা অংশ, matching-এর জন্য অনেক কম নির্দিষ্ট</td></tr>
<tr><td>৬ character</td><td>≈ ১.২ কিমি × ০.৬ কিমি</td><td>একটা এলাকা/মহল্লার আকার — ride-matching-এর জন্য বাস্তবসম্মত শুরুর বিন্দু</td></tr>

</table>
<div class="callout behind"><span class="tag">কেন prefix মিললে কাছাকাছি হয় — বিট ইন্টারলিভিং</span>
Geohash গণনা করার সময় latitude ও longitude-এর প্রতিটাকে আলাদাভাবে বাইনারি সার্চের মতো ভাগ করা হয় (এই অর্ধেকে আছে না ওই অর্ধেকে, প্রতিটা বিটে একটা সিদ্ধান্ত), তারপর দুই অক্ষের বিটগুলো পরপর ইন্টারলিভ (interleave) করে একটা বাইনারি স্ট্রিং তৈরি হয়, যেটাকে base-32 এনকোড করে অক্ষরে রূপান্তর করা হয়। যেহেতু প্রথম কয়েকটা বিট সবচেয়ে বড় (coarse) বিভাজন প্রতিনিধিত্ব করে আর পরের বিটগুলো ধীরে ধীরে সূক্ষ্ম (fine) বিভাজন, দুটো কাছাকাছি লোকেশনের প্রথম কয়েকটা বিট (আর তাই এনকোড হওয়া প্রথম কয়েকটা character) প্রায় সবসময় মিলে যায় — এটাই prefix-matching-এর গাণিতিক ভিত্তি।
</div>

<h4>Quadtree</h4>
<p><span class="kw">Quadtree</span> ভিন্ন দৃষ্টিভঙ্গি নেয় — এটা একটা এলাকাকে সমান, fixed-size grid-এ ভাগ করে না, বরং <b>recursively একটা এলাকাকে ৪টা সমান ভাগে ভাগ করতে থাকে যতক্ষণ না প্রতিটা ভাগে থাকা driver সংখ্যা একটা threshold-এর (যেমন ১০০) নিচে নেমে আসে</b>। ফলাফল — শহরের ঘনবসতিপূর্ণ কেন্দ্রে (যেখানে driver ঘনসন্নিবিষ্ট) অনেক ছোট ছোট cell তৈরি হয়, আর জনবিরল গ্রামীণ এলাকায় (যেখানে driver কম) মাত্র একটা বড় cell-ই যথেষ্ট থাকে।</p>
<div class="diagram"><pre>
শহরের কেন্দ্র (dense)                  শহরতলি/গ্রাম (sparse)
┌─────┬─────┬───────────┐              ┌───────────────────────┐
│ ●●● │ ●●  │           │              │                       │
├──┬──┼──┬──┤           │              │           ●           │
│●●│● │●●│●●│           │              │                       │
├──┼──┼──┼──┤    ●●●     │              │       (একটাই বড় cell,  │
│● │●●│● │● │           │              │        driver কম হওয়ায়│
├──┴──┼──┴──┤           │              │        ভাগ করার দরকার  │
│  ●● │  ●  │           │              │        নেই)            │
└─────┴─────┴───────────┘              └───────────────────────┘

<p>একটা nearby-driver query করতে হলে root থেকে শুরু করে tree-তে নেমে সেই leaf node(গুলো)-এ পৌঁছাতে হয় যেখানে rider-এর location পড়ে, তারপর সেই leaf-এর (ও প্রয়োজনে প্রতিবেশী leaf-এর) driver list রিটার্ন করতে হয়।</p>

<h4>Geohash বনাম Quadtree</h4>
<table>
<tr><th>বিবেচনা</th><th>Geohash</th><th>Quadtree</th></tr>
<tr><td>গঠন</td><td>Fixed-size grid, cell-এর আকার সব জায়গায় সমান</td><td>Dynamic grid — dense এলাকায় ছোট cell, sparse এলাকায় বড় cell</td></tr>
<tr><td>Uneven density (শহর বনাম গ্রাম)</td><td>অদক্ষ — dense এলাকায় একটা cell-এ হাজার হাজার driver থেকে যেতে পারে, ফলে সেই cell-এর ভেতরে আবারও sort/filter লাগে</td><td>দক্ষ — dense এলাকা নিজে থেকেই ছোট ছোট cell-এ ভেঙে যায়, তাই প্রতিটা leaf-এর driver সংখ্যা সব জায়গায় প্রায় সমান ও ছোট</td></tr>
<tr><td>বাস্তবায়নের জটিলতা</td><td>সহজ — string prefix operation, কোনো tree maintain করার দরকার নেই, stateless</td><td>জটিল — driver যোগ/বিয়োগ হলে (বা এক জায়গা থেকে আরেক জায়গায় সরলে) tree node split/merge করে আপডেট রাখতে হয়, stateful</td></tr>
<tr><td>Storage</td><td>যেকোনো sorted structure/DB ইনডেক্সে সরাসরি বসে (Redis geo commands)</td><td>নিজস্ব in-memory tree structure লাগে, custom rebalancing logic দরকার</td></tr>
<tr><td>উদাহরণ ব্যবহার</td><td>Redis <code>GEOADD</code>, MongoDB geospatial index, S2/Uber-এর কিছু legacy অংশ</td><td>Uber-এর H3-পূর্ব সময়ের internal geo-index, Google-এর কিছু geospatial সিস্টেম</td></tr>

<div class="callout why"><span class="tag">তাহলে কোনটা বেছে নেওয়া উচিত?</span>
এখানে classic trade-off হলো <b>সরলতা বনাম density-অভিযোজন</b>। যদি driver density শহর জুড়ে মোটামুটি সমান থাকত, Geohash-ই যথেষ্ট হতো — সহজ, stateless, maintain করার কিছু নেই। কিন্তু বাস্তব শহরে ঘনবসতি খুবই অসম (downtown-এ প্রতি বর্গ কিলোমিটারে শত শত driver, উপশহরে হাতে-গোনা কয়েকজন) — তাই একটা fixed-granularity grid-এ কেন্দ্রীয় এলাকার cell-গুলো অতিরিক্ত ঠাসা হয়ে যায় এবং সেখানে আবারও ফিল্টার করার বাড়তি খরচ লাগে। Quadtree এই density-কে নিজেই প্রতিফলিত করে বলে বড় শহরের জন্য এটাই বেশি efficient পছন্দ, বিনিময়ে একটা stateful tree maintain করার অপারেশনাল জটিলতা মেনে নিতে হয়।
</div>
<div class="card">
<b>বাস্তব জগতে — Uber-এর H3</b><br>
বাস্তবে Uber নিজে geohash আর quadtree দুটোর সীমাবদ্ধতা এড়াতে <span class="kw">H3</span> নামের একটা hexagonal hierarchical grid সিস্টেম তৈরি করে ওপেন-সোর্স করেছে। ষড়ভুজ (hexagon) ব্যবহারের কারণ — এর প্রতিটা প্রতিবেশী cell-এর দূরত্ব সমান (বর্গাকার cell-এ diagonal প্রতিবেশী বেশি দূরে, পাশের প্রতিবেশীর চেয়ে), যা "neighbor cell" খোঁজাকে আরও নির্ভুল করে এবং geohash-এর edge-boundary সমস্যাটা অনেকটাই কমায়। ইন্টারভিউয়ের জন্য geohash/quadtree-এর মূল trade-off বোঝাই যথেষ্ট — H3-এর কথা জানা একটা ভালো "extra depth" পয়েন্ট হিসেবে উল্লেখ করা যায়।
</div>

<h3>Location Update Handling</h3>
<p>প্রতিটা driver প্রতি কয়েক সেকেন্ডে একটা location update পাঠায় — যা এই সিস্টেমের সবচেয়ে বড় write volume তৈরি করে (আগের estimation অনুযায়ী একটা শহরেই প্রতি সেকেন্ডে হাজার হাজার write)। এই লোড একটা traditional durable ডেটাবেসে সরাসরি লিখলে সেই ডেটাবেস দ্রুত bottleneck হয়ে যাবে — আর তার দরকারও নেই, কারণ ৩০ সেকেন্ড আগের driver location matching বা tracking-এর জন্য কোনো কাজেই লাগে না, driver ইতিমধ্যে অন্য কোথাও চলে গেছে। এই কারণে driver location সাধারণত একটা <b>in-memory store</b>-এ (যেমন Redis) একটা ছোট TTL-সহ রাখা হয় — নতুন update পুরনোটাকে overwrite করে দেয়, আর পুরনো/অচল driver স্বয়ংক্রিয়ভাবে ইনডেক্স থেকে বাদ পড়ে যায় (TTL expire হয়ে)। এটা মূলত ৪ নম্বর অধ্যায়ে শেখা caching-এর একই যুক্তি — সাম্প্রতিক, ক্ষণস্থায়ী ডেটার জন্য durable persistence-এর খরচ না নিয়ে দ্রুত read/write পাওয়া।</p>
<div class="callout best"><span class="tag">Trip history আলাদা, Live location আলাদা</span>
লক্ষ্য করুন — driver-এর <b>বর্তমান</b> location (matching-এর জন্য) আর একটা সম্পন্ন হওয়া trip-এর সম্পূর্ণ route history (রসিদ, বিরোধ নিরসন, analytics-এর জন্য) সম্পূর্ণ ভিন্ন প্রয়োজনীয়তার ডেটা। প্রথমটা ephemeral, in-memory। দ্বিতীয়টা durable, একটা trip শেষ হওয়ার পর Trip Service সেই route-টুকু ব্যাচে Trip DB-তে লিখে রাখে। দুটোকে একই storage-এ মেশানো একটা সাধারণ ভুল — এতে ephemeral write load durable ডেটাবেসের ওপর অকারণে চাপ ফেলে।
</div>

<h3>Matching Service (সংক্ষেপে)</h3>
<p>Location Service থেকে rider-এর আশেপাশের candidate driver-দের একটা তালিকা পাওয়ার পর, Matching Service সেই candidate-দের মধ্যে থেকে একজনকে বেছে নেয় — কেবল সবচেয়ে কাছের জনকে নয়। বাস্তবে ranking-এ একসাথে বিবেচনা করা হয়: distance/ETA (রাস্তার প্রকৃত route ধরে, সরলরৈখিক দূরত্ব নয়), driver rating, driver কতক্ষণ idle আছে (fairness-এর জন্য), আর driver-এর গন্তব্য-পছন্দ (কিছু সিস্টেমে)।</p>
<pre><span class="c">// Offer waterfall — candidate list থেকে একজনকে ধাপে ধাপে অফার করা</span>
candidates = rankByScore(getNearbyDrivers(riderLocation))
<span class="kw">for</span> driver <span class="kw">in</span> candidates:
    accepted = sendOffer(driver, timeout=<span class="c">১০সে</span>)
    <span class="kw">if</span> accepted:
        <span class="kw">return</span> driver          <span class="c">// matched, বাকি candidate-দের আর জানানো হয় না</span>
    <span class="c">// timeout বা reject হলে waterfall পরের candidate-এ যায়</span>
<span class="kw">return</span> NO_DRIVER_AVAILABLE</pre>
<div class="callout mistake"><span class="tag">একসাথে সবাইকে অফার পাঠানো কেন সমস্যা</span>
একটা naive বিকল্প হলো একসাথে top-৫ candidate-কে অফার পাঠিয়ে যে প্রথমে accept করে তাকে নেওয়া (broadcast offer) — এতে matching দ্রুত হয় মনে হলেও, একাধিক driver একই সময়ে "accept" পাঠাতে পারে, আর তখন race condition সামলে ঠিক একজনকেই confirm করা (আর বাকিদের বাতিল করে জানানো) বাড়তি জটিলতা তৈরি করে, driver-দের কাছে বারবার "sorry, ride নিয়ে গেছে" বার্তা পাঠানো খারাপ অভিজ্ঞতা দেয়। এই কারণে অধিকাংশ বাস্তব সিস্টেম sequential waterfall-কেই প্রাধান্য দেয় — একটু বেশি latency-র বিনিময়ে সরল, deterministic সিদ্ধান্ত প্রক্রিয়া।
</div>

<h4>Greedy বনাম Batch Matching</h4>
<p>উপরের waterfall একটা <b>greedy</b> পদ্ধতি — প্রতিটা rider request আসার সাথে সাথে তাকে সবচেয়ে ভালো candidate-এর সাথে match করে ফেলা হয়। এটা সরল ও দ্রুত, কিন্তু একটা সূক্ষ্ম সমস্যা আছে: rider-A ও rider-B যদি একই মুহূর্তে কাছাকাছি জায়গায় request করে, আর একজন driver দুজনের জন্যই সবচেয়ে কাছের হয়, তাহলে যে আগে request করেছে সে-ই সেই driver পেয়ে যায়, অন্যজনকে একটা কম-optimal driver নিতে হয় — অথচ globally optimal বণ্টনে হয়তো উল্টোটা করলে দুজনের মোট wait time কম হতো। এই কারণে কিছু সিস্টেম <b>batch matching</b> ব্যবহার করে — কয়েক সেকেন্ডের একটা ছোট window-এ আসা সব pending request ও available driver একসাথে জমা করে, তারপর একটা bipartite-matching-জাতীয় optimization চালিয়ে (যেমন সামগ্রিক wait time বা distance কম করার লক্ষ্যে) সবাইকে একসাথে match করা হয়।</p>
<div class="callout why"><span class="tag">Trade-off — Greedy বনাম Batch</span>
Greedy matching-এর সুবিধা হলো ন্যূনতম latency (rider সাথে সাথে driver পায়) ও সরল বাস্তবায়ন, কিন্তু globally সাব-অপটিমাল বণ্টন দিতে পারে। Batch matching সামগ্রিকভাবে ভালো বণ্টন দেয় (কম মোট wait time, driver-দের মধ্যে সমান কাজ ভাগ), কিন্তু window-এর জন্য অপেক্ষা করাতে rider-এর perceived latency কিছুটা বাড়ে এবং optimization নিজে computationally ভারী। বেশিরভাগ বড় ride-sharing প্ল্যাটফর্ম কম-ট্রাফিক এলাকায়/সময়ে greedy আর high-density এলাকায়/সময়ে (যেমন rush hour-এ শহরের কেন্দ্র) ছোট batch window ব্যবহার করে — একটাই কৌশল সব পরিস্থিতিতে সেরা নয়।
</div>

<h3>Trip State Machine (সংক্ষেপে)</h3>
<p>একটা ride-এর পুরো জীবনচক্র একটা সরল state machine দিয়ে মডেল করা হয়, যা Trip Service maintain করে — এটাই বিভিন্ন সময়ে rider app, driver app, ও pricing service কী দেখবে তা নির্ধারণ করে।</p>
<div class="diagram"><pre>
REQUESTED → MATCHED → DRIVER_ARRIVING → IN_PROGRESS → COMPLETED
    │                                                       │
    └────────────────────▶ CANCELLED ◀─────────────────────┘
       (rider/driver যেকোনো সময় বাতিল করতে পারে,
        কিন্তু IN_PROGRESS-এর পরে বাতিল করা যায় না)
</pre></div>
<p>প্রতিটা state transition-এ প্রাসঙ্গিক event নির্গত হয় (Trip Service থেকে), যা location tracking শুরু/বন্ধ করা, বা fare হিসাব শুরু করার মতো downstream কাজ ট্রিগার করে — এটা ৭ নম্বর অধ্যায়ে দেখা event-driven যোগাযোগের একটা ব্যবহারিক প্রয়োগ।</p>

<h3>Pricing / Surge (সংক্ষেপে)</h3>
<p>Fare মূলত দূরত্ব ও সময়ের ওপর ভিত্তি করে একটা base rate থেকে হিসাব হয়, কিন্তু তার ওপর একটা <span class="kw">surge multiplier</span> যুক্ত হয় যখন একটা এলাকায় ride request-এর সংখ্যা (demand) উপলভ্য driver সংখ্যার (supply) তুলনায় বেড়ে যায় — এই demand/supply ratio প্রতিটা geospatial cell-এর জন্য আলাদাভাবে ট্র্যাক করা হয়, তাই surge একটা শহরের একটা অংশে বেশি, আরেক অংশে কম হতে পারে। এই dynamic pricing মডেলের বিস্তারিত গাণিতিক দিকটা এই কোর্সের scope-এর বাইরে — এখানে মূল বার্তা হলো, Pricing Service Trip Service থেকে আলাদা রাখা হয় যাতে fare-নির্ধারণ যুক্তি স্বাধীনভাবে বদলানো/পরীক্ষা করা যায়, trip-এর মূল state machine না ছুঁয়ে।</p>
<pre><span class="c">// একটা cell-এর জন্য সরলীকৃত surge হিসাব</span>
surgeMultiplier(cell) = <span class="kw">max</span>(১.০, pendingRequests(cell) / availableDrivers(cell))

<span class="c">// উদাহরণ: downtown cell-এ ৮০টা pending request, ২০ জন driver উপলভ্য</span>
surgeMultiplier = ৮০ / ২০ = ৪.০x   <span class="c">// fare স্বাভাবিকের ৪ গুণ</span></pre>

<p>এই সিস্টেমের প্রতিটা component-এর ডেটার প্রকৃতি ভিন্ন, তাই তাদের consistency/availability চাহিদাও ভিন্ন — একই নীতি সব জায়গায় প্রয়োগ করা ভুল।</p>

<h3>Trade-offs — সারসংক্ষেপ</h3>
<div class="callout best"><span class="tag">এই চ্যাপ্টারের মূল সিদ্ধান্তগুলো</span>
এই সিস্টেমের ডিজাইন জুড়ে একটা ধারাবাহিক থিম দেখা যায় — <b>latency ও throughput-কে strong consistency আর durability-র ওপরে অগ্রাধিকার দেওয়া</b>, যেখানে ডেটা ক্ষণস্থায়ী (driver location)। বড় শহরে Quadtree তার density-অভিযোজিত গঠনের কারণে Geohash-এর চেয়ে বেশি efficient, কিন্তু ছোট বা কম dynamic সিস্টেমে Geohash-এর সরলতা (stateless, কোনো tree maintain নেই) প্রায়ই যথেষ্ট এবং বেছে নেওয়ার মতো ভালো বিকল্প। Location update-এর জন্য in-memory/short-TTL store durable ডেটাবেসের চেয়ে সঠিক পছন্দ, কারণ পুরনো location ডেটা মূল্যহীন। আর সবচেয়ে গুরুত্বপূর্ণ শিক্ষা — একটা "nearest neighbor" ধাঁচের সমস্যায় brute-force <code>O(n)</code> স্কেল করে না; দরকার এমন একটা ইনডেক্স যা সার্চ স্পেসকেই আগে থেকে সংগঠিত করে রাখে।

<h3>Deep Dive ১ — Video Processing Pipeline</h3>
<p>প্রথম প্রশ্ন — একটা video আপলোড হওয়ার পরপরই সেটা সরাসরি viewer-দের সার্ভ করা হয় না কেন? কারণ uploader যে raw ফাইলটা পাঠায় সেটা একটামাত্র resolution/bitrate/format-এ থাকে (উদাহরণস্বরূপ একটা ফোনের ক্যামেরা থেকে ১০৮০p H.264)। কিন্তু viewer-দের ডিভাইস আর network condition বিশাল বৈচিত্র্যপূর্ণ — একজন স্লো মোবাইল ডেটায় ২৪০p দেখতে চায়, আরেকজন ফাইবার সংযোগে থাকা স্মার্ট TV-তে ৪K দেখতে চায়। একটামাত্র raw ফাইল দিয়ে এই সব চাহিদা মেটানো সম্ভব না — তাই <span class="kw">transcoding</span> লাগে: raw video-কে একাধিক resolution (২৪০p, ৪৮০p, ৭২০p, ১০৮০p, ৪K) ও format-এ রূপান্তর করা, যাতে প্রতিটা viewer তার উপযুক্ত ভার্সন পায়।</p>
<p>এই কাজ ভারী এবং সময়সাপেক্ষ — একটা এক ঘণ্টার video-কে পাঁচটা resolution-এ transcode করা একটা single-threaded প্রসেসে কয়েক ঘণ্টা লাগিয়ে দিতে পারে। এই ভারী গণনার কারণ, প্রতিটা resolution-এর জন্য পুরো video পুনরায় decode → resize → re-encode করতে হয় — এটা মূলত একটা CPU/GPU-ইনটেনসিভ কাজ, disk I/O-ইনটেনসিভ নয়, তাই transcoding worker-দের জন্য সাধারণত compute-optimized মেশিন বেছে নেওয়া হয়, যেখানে বাকি সিস্টেমের অংশগুলো (যেমন metadata service) memory/IO-optimized মেশিনে থাকতে পারে। যদি এই কাজ upload request-এর সাথে <b>synchronous</b> করা হতো (uploader-কে ততক্ষণ অপেক্ষা করানো যতক্ষণ transcoding শেষ না হয়), তাহলে upload connection কয়েক ঘণ্টা ধরে খোলা রাখতে হতো — অবাস্তব, এবং একটাও worker crash করলে পুরো upload নষ্ট হয়ে যেত।</p>
<div class="callout why"><span class="tag">৭ নম্বর অধ্যায়ের সরাসরি প্রয়োগ — Queue-Driven Background Pipeline</span>
সমাধান হলো transcoding-কে একটা asynchronous, queue-driven pipeline-এ সরিয়ে নেওয়া — ঠিক যেমন ৭ নম্বর অধ্যায়ে শেখা হয়েছিল "ভারী কাজ যা তাৎক্ষণিক response-এর প্রয়োজন নেই, তাকে queue-তে ফেলে একটা worker pool-কে asynchronously প্রসেস করতে দেওয়া উচিত"। এখানে Upload Service raw ফাইল storage-এ রেখে সাথে সাথেই uploader-কে একটা response ফিরিয়ে দেয় ("upload সফল, processing চলছে") এবং একটা job queue-তে একটা task push করে। একটা horizontally-scaled worker pool queue থেকে job টেনে নিয়ে transcoding চালায় — worker কম পড়লে আরও worker যোগ করাই যথেষ্ট, uploader request-এর সাথে এর কোনো সরাসরি সংযোগ নেই। প্রসেসিং শেষ হলে ১৬ নম্বর অধ্যায়ের notification system ব্যবহার করে uploader-কে জানানো হয় video প্রস্তুত।
</div>
<p>এই সময় uploader-এর ড্যাশবোর্ডে video-র status "Processing..." দেখানো হয় — একটা সাধারণ state machine (<code>uploading → processing → ready → failed</code>) দিয়ে ট্র্যাক করা, যা worker প্রতিটা ধাপ শেষে আপডেট করে।</p>
<div class="callout mistake"><span class="tag">একটা transcoding job-কে একটামাত্র বড় task ধরে নেওয়া ভুল</span>
একটা সাধারণ ভুল হলো পুরো video-র transcoding-কে একটামাত্র বিশাল job হিসেবে একটা worker-কে দিয়ে দেওয়া — একটা দুই ঘণ্টার video-র জন্য একটা worker একাই ৫টা resolution তৈরি করতে ঘণ্টার পর ঘণ্টা ব্যস্ত থাকে, আর সেই worker crash করলে পুরো কাজ থেকে শুরু করতে হয়। বাস্তব pipeline video-কে ছোট ছোট সময়-খণ্ডে ভাগ করে প্রতিটা খণ্ড আলাদা job হিসেবে বিভিন্ন worker-কে দেয় (parallel transcoding) — একটা worker fail করলে শুধু তার খণ্ডটুকু retry করলেই চলে, পুরো video নতুন করে প্রসেস করতে হয় না।
</div>

<h3>Deep Dive ২ — Adaptive Bitrate Streaming</h3>
<p>Transcoding শেষে video একাধিক resolution-এ থাকলেও, প্রশ্ন থেকে যায় — viewer চলাকালীন যদি network speed বদলে যায় (যেমন মোবাইলে হাঁটতে হাঁটতে সিগন্যাল দুর্বল হয়ে যাওয়া), তাহলে কী হবে? এখানেই <span class="kw">Adaptive Bitrate Streaming</span> (HLS/DASH প্রোটোকলের মূল ধারণা) কাজ করে।</p>
<p>প্রতিটা video-কে ছোট ছোট (সাধারণত ২-১০ সেকেন্ডের) <b>chunk/segment</b>-এ ভাগ করা হয়, এবং প্রতিটা chunk <b>একাধিক bitrate/resolution-এ পুনরায় এনকোড করে</b> রাখা হয় — একটা "bitrate ladder" (২৪০p, ৪৮০p, ৭২০p, ১০৮০p...)। viewer-এর player প্রতিটা পরের chunk request করার আগে তার বর্তমান download speed মেপে সিদ্ধান্ত নেয় কোন bitrate-এর chunk আনবে।</p>
<div class="diagram"><pre>
Video timeline (২ সেকেন্ড প্রতি chunk):
  chunk-1   chunk-2   chunk-3   chunk-4   chunk-5
┌─────────┬─────────┬─────────┬─────────┬─────────┐
│         │         │         │         │         │
└─────────┴─────────┴─────────┴─────────┴─────────┘
প্রতিটা chunk-এর জন্য bitrate ladder (pre-encoded, সবই ready থাকে):

  chunk-3 (উদাহরণ):
    ┌────────────┐  ┌────────────┐  ┌────────────┐  ┌────────────┐
    │ 240p/400kbps│  │480p/1Mbps  │  │720p/2.5Mbps│  │1080p/5Mbps │
    └────────────┘  └────────────┘  └────────────┘  └────────────┘

  Player এর সিদ্ধান্ত (network speed অনুযায়ী):
  সময় ০-৪সে: network ভালো  → 1080p chunk আনে
  সময় ৪-৬সে: network কমে যায় → player স্বয়ংক্রিয়ভাবে 480p chunk-এ নেমে যায়
  সময় ৬সে+ : network ফিরে আসে → player আবার 1080p-এ উঠে যায়
  ⇒ playback কখনো থামে না (buffering এড়ানো), viewer শুধু resolution
    পরিবর্তন লক্ষ্য করে, কোনো interruption হয় না
</pre></div>
<p>এই কৌশলের মূল সুবিধা — সিদ্ধান্তটা <b>client-side</b>-এ নেওয়া হয়, প্রতিটা player তার নিজের real-time network condition অনুযায়ী adapt করে, আর সার্ভারের কোনো central coordination লাগে না (প্রতিটা chunk আগে থেকেই সব bitrate-এ ready হয়ে বসে থাকে)।</p>
<div class="callout mistake"><span class="tag">ভুল ধারণা — একটাই resolution ঠিক করে দেওয়া ভালো</span>
একটা সাধারণ ভুল ধারণা হলো, viewer-কে upload-এর সময়ের resolution-ই (বা সবচেয়ে উচ্চমানের ভার্সন) সরাসরি সার্ভ করা উচিত এবং network slow হলে player নিজে থেকেই বাফার করে অপেক্ষা করবে। বাস্তবে এটা করলে খারাপ network-এ playback বারবার থেমে buffer করবে — ব্যবহারকারীর অভিজ্ঞতা ধ্বংস হয়ে যায়। Adaptive bitrate streaming ঠিক এই সমস্যা এড়ানোর জন্যই ডিজাইন করা — playback continuity-কে সর্বোচ্চ resolution-এর চেয়ে বেশি গুরুত্ব দেওয়া।
</div>

<h4>Manifest File — Player কীভাবে জানে কোন chunk কোথায়</h4>

<h3>Storage Tiering (সংক্ষেপে)</h3>
<p>প্রতিটা video-র সব resolution একই "গরম" storage-এ রাখা ব্যয়বহুল, কারণ বেশিরভাগ video আপলোডের পর কিছুদিনের মধ্যেই ভিউ কমে যায় (viral video ছাড়া)। এই কোর্সের Cloud-সম্পর্কিত ধারণা অনুযায়ী — নতুন বা viral video <span class="kw">hot storage</span>-এ (দ্রুত access, বেশি খরচ) রাখা হয়, আর পুরনো, কম-ভিউ পাওয়া video ধীরে ধীরে <span class="kw">cold/cheap storage</span>-এ সরিয়ে নেওয়া হয় (ধীর access, কম খরচ) — একটা background job নিয়মিত access pattern পর্যবেক্ষণ করে এই migration চালায়।</p>
<div class="callout best"><span class="tag">সব resolution সব video-র জন্য জরুরি নয়</span>
একটা ব্যবহারিক অপ্টিমাইজেশন — কম-ভিউ পাওয়া video-র জন্য শুরুতেই ৫টা resolution-এ transcode না করে, শুধু ২-৩টা সাধারণ resolution (যেমন ৪৮০p, ৭২০p) তৈরি করে রাখা এবং ১০৮০p/৪K শুধু তখনই তৈরি করা (transcode-on-demand) যখন প্রথম কোনো viewer সেই higher resolution চায়। এতে বহু কম-ভিউ video-র জন্য অপ্রয়োজনীয় transcoding compute ও storage বাঁচে, বিনিময়ে প্রথম high-resolution request-এ একটু বাড়তি অপেক্ষা করতে হয় — একটা classic lazy-computation trade-off।
</div>
<h4>Live Streaming বনাম VOD (সংক্ষেপে)</h4>
<p>এই চ্যাপ্টার মূলত <span class="kw">VOD</span> (Video on Demand — আগে থেকে আপলোড করা video) নিয়ে, যেখানে পুরো transcoding pipeline upload-এর পর একবার চলে ও ফলাফল cache/CDN-এ বসে থাকে। <span class="kw">Live streaming</span> ভিন্ন সমস্যা — video তৈরি হচ্ছে ঠিক এই মুহূর্তে, তাই transcoding প্রায় real-time-এ (কয়েক সেকেন্ড delay-তে) চলতে হয় এবং chunk তৈরি হওয়ার সাথে সাথেই manifest-এ যুক্ত হয়ে viewer-দের কাছে পৌঁছাতে হয় — batch processing-এর সুযোগ নেই, প্রতিটা ধাপে latency budget অনেক কড়া।</p>

<h3>CDN-Heavy Delivery Model (সংক্ষেপে)</h3>
<p>এই ধরনের প্ল্যাটফর্মের সবচেয়ে বড় ট্রাফিক ও খরচ আসে video চাংক ডেলিভারি থেকে, আর সেই ডেলিভারির সিংহভাগ <span class="kw">CDN</span> (৪ নম্বর অধ্যায়ে বিস্তারিত দেখা) দিয়ে হওয়া উচিত, origin server থেকে সরাসরি নয়। একটা viral video-র লাখো viewer যদি সবাই origin storage থেকে সরাসরি chunk আনতে যায়, origin সেই লোড সামলাতে পারবে না; কিন্তু CDN-এর edge node ভৌগোলিকভাবে viewer-এর কাছে থাকায় জনপ্রিয় chunk-গুলো edge-এই cache হয়ে থাকে ও সেখান থেকেই সার্ভ হয় — origin-এ hit করে কেবল প্রথমবার, বা cache miss হলে। এই কারণেই video streaming ব্যবসায় CDN খরচ প্রায়ই সবচেয়ে বড় infrastructure line-item।</p>

<h3>Metadata ও Search (সংক্ষেপে)</h3>
<p>Video-র title, description, tag, uploader তথ্য একটা আলাদা <b>Metadata Service</b>-এ (সাধারণত একটা relational বা document ডেটাবেসে) সংরক্ষণ করা হয় — এটা video ফাইলের বাইনারি ডেটার সম্পূর্ণ ভিন্ন storage layer, যেখানে ছোট, structured record রাখা হয় ও নিয়মিত query করা হয়। সার্চ ফিচার এই metadata-র ওপর একটা inverted-index-ভিত্তিক সার্চ ইঞ্জিন চালায় (title/description/tag ম্যাচ করে video খুঁজে বের করা) — এই ইনডেক্সিং কৌশলের বিস্তারিত এই কোর্সের scope-এর বাইরে, তবে মূল কথা হলো সার্চ ইনডেক্স ও video চাংক storage সম্পূর্ণ আলাদা সিস্টেম, একসাথে মেশানো হয় না।</p>

<h3>Component-ভিত্তিক Consistency চাহিদা</h3>
<table>
<tr><th>Component</th><th>Consistency চাহিদা</th><th>কারণ</th></tr>
<tr><td>Raw/Processed Video Chunk</td><td>Eventual — CDN propagate হতে সামান্য দেরি চলবে</td><td>একবার লেখা হয় (write-once), বারবার পড়া হয় — সামান্য propagation delay viewer-এর কাছে অদৃশ্য</td></tr>

<tr><td>Processing Status</td><td>Strong (uploader-কে ভুল status দেখানো যাবে না)</td><td>"Ready" দেখিয়ে ফেলার পর viewer broken video পেলে খারাপ অভিজ্ঞতা হয়</td></tr>
</table>

<h3>Trade-offs — সারসংক্ষেপ</h3>
<div class="callout best"><span class="tag">এই চ্যাপ্টারের মূল সিদ্ধান্তগুলো</span>

<p class="lead">এই চ্যাপ্টারে দুইটা ছোট, স্বাধীন কেস স্টাডি — একটা crawler যাকে গোটা ওয়েবের স্কেলে ভদ্রভাবে (politely) আচরণ করতে হয়, আর একটা autocomplete সিস্টেম যাকে প্রতিটা কিস্ট্রোকে মিলিসেকেন্ডের মধ্যে সাড়া দিতে হয়।</p>

<h3>অংশ ১ — Web Crawler</h3>
<h4>Requirements</h4>
<p><b>Functional:</b></p>
<ul>
<li>নির্দিষ্ট সিড URL (বা পুরো ওয়েব) থেকে শুরু করে page ডাউনলোড করে ইনডেক্স করার জন্য সংরক্ষণ করা।</li>
<li>প্রতিটা ওয়েবসাইটের <code>robots.txt</code>-এ বলে দেওয়া নিয়ম সম্মান করা (কোন path crawl করা নিষেধ, কত delay রাখা উচিত)।</li>
<li>Duplicate content/URL এড়ানো — একই page একাধিকবার crawl করে সময়/সম্পদ অপচয় না করা।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>Scalability — কোটি কোটি page crawl করতে হতে পারে, তাই fetcher horizontally scale করা উচিত।</li>
<li>Politeness — কোনো একটা ওয়েবসাইটের ওপর crawler-এর কারণে অতিরিক্ত চাপ পড়া চলবে না।</li>
<li>Extensibility — নতুন content type (PDF, ছবি) বা নতুন parsing rule যুক্ত করা সহজ হওয়া উচিত।</li>
</ul>

<h4>Deep Dive — Politeness ও Duplicate Detection</h4>
<p><b>Politeness।</b> একটা naive crawler যদি একটা domain-এ যত দ্রুত সম্ভব parallel request পাঠাতে থাকে, সেটা কার্যত সেই ওয়েবসাইটের সার্ভারকে একটা অনিচ্ছাকৃত <span class="kw">DDoS</span> attack-এর মতো overload করে ফেলতে পারে — ছোট বা মাঝারি সাইট এই ধরনের আকস্মিক ট্রাফিক স্পাইক সামলাতে পারে না, এবং crawler নিজেই সেই সাইটের IP থেকে ব্লক হয়ে যেতে পারে। সমাধান দুই স্তরে —</p>
<ul>
<li><b>Per-domain rate limiting/delay</b> — ৮ নম্বর অধ্যায়ে শেখা rate limiting ধারণার সরাসরি প্রয়োগ, তবে এখানে limit প্রতিটা <b>domain-এর জন্য আলাদাভাবে</b> রাখা হয় (crawler নিজেই client, ওয়েবসাইট হলো protected resource) — একটা domain-এ পরপর দুই request-এর মাঝে একটা নির্দিষ্ট delay (কয়েক সেকেন্ড) মেনে চলা হয়।</li>
<li><b><code>robots.txt</code> মেনে চলা</b> — প্রতিটা crawl শুরুর আগে সাইটের <code>robots.txt</code> পড়ে কোন path crawl করা নিষেধ এবং সাইট নিজে কী <code>Crawl-delay</code> চায় তা মেনে নেওয়া।</li>
</ul>
<div class="callout mistake"><span class="tag">Politeness ছাড়া Crawler একটা দায়বদ্ধতা, ফিচার নয়</span>
Politeness-কে অনেকে ঐচ্ছিক optimization মনে করে ভুল করে, কিন্তু এটা crawler-এর মৌলিক দায়িত্ব। Politeness ছাড়া একটা crawler লক্ষ লক্ষ ছোট ওয়েবসাইটের জন্য বাস্তবিক ক্ষতির কারণ হতে পারে (সার্ভার ডাউন, hosting bill বেড়ে যাওয়া) এবং সেই crawler-কে আইনগত/নৈতিক সমস্যায় ফেলতে পারে — এই কারণেই প্রতিটা প্রোডাকশন-গ্রেড crawler-এর ডিজাইনেই per-domain rate limiting একটা non-negotiable component, optional feature নয়।
</div>
<p><b>Duplicate URL Detection।</b> একটা বড়-স্কেল crawl-এ কোটি কোটি URL visited হয়ে যায়, আর প্রতিটা নতুন extract হওয়া link-এর জন্য প্রশ্ন করতে হয় — "এই URL কি আগে crawl হয়েছে?" এই প্রশ্নের উত্তর একটা exact set (যেমন hash set) দিয়ে দেওয়া সম্ভব, কিন্তু কোটি কোটি URL-এর প্রতিটার পূর্ণ string মেমরিতে রাখা বিশাল RAM খরচ করে ফেলে।</p>
<div class="callout why"><span class="tag">৯ নম্বর অধ্যায়ের সরাসরি প্রয়োগ — Bloom Filter</span>
এই সমস্যাটাই ঠিক সেই প্যাটার্ন যেখানে <span class="kw">Bloom Filter</span> (৯ নম্বর অধ্যায়ে শেখা) কাজে আসে — "এই URL কি set-এ আছে?" প্রশ্নের প্রায়-নির্ভুল উত্তর সামান্য মেমরিতে দেওয়া, exact set-এর তুলনায় বহু গুণ কম জায়গায়। এখানে false positive-এর প্রভাব সম্পূর্ণ গ্রহণযোগ্য: যদি একটা <b>নতুন</b> URL ভুলবশত "আগে crawled" বলে ধরে নেওয়া হয় (false positive), সেই একটা URL crawl মিস হবে — গোটা ওয়েবের তুলনায় একটা URL মিস হওয়া নগণ্য ক্ষতি। কিন্তু Bloom Filter কখনো <b>false negative</b> দেয় না (একটা সত্যিই আগে-দেখা URL-কে "নতুন" বলে ভুল করা কখনো ঘটে না) — তাই একই URL বারবার re-crawl হয়ে সময়/সম্পদ অপচয় হওয়ার ঝুঁকি নেই। এই এক-দিকের error guarantee-টাই Bloom Filter-কে এই নির্দিষ্ট use case-এর জন্য নিরাপদ করে তোলে।
</div>
<table>
<tr><th>Error type</th><th>এখানে কী ঘটে</th><th>প্রভাব</th></tr>
<tr><td>False positive</td><td>নতুন URL-কে ভুলে "আগে crawled" বলে ধরে নেওয়া</td><td>সেই একটা page মিস হয় — গোটা ওয়েবের তুলনায় নগণ্য</td></tr>
<tr><td>False negative</td><td>Bloom Filter-এর গঠনগত গ্যারান্টি অনুযায়ী এটা কখনো ঘটে না</td><td>প্রভাব নেই — এই কারণেই এই ব্যবহার নিরাপদ</td></tr>
</table>
<p>মেমরির পার্থক্যটা বাস্তবেই বিশাল — এক বিলিয়ন URL-এর একটা exact hash set রাখতে (গড়ে প্রতিটা URL ৫০-১০০ বাইট ধরলে) কয়েক গিগাবাইট থেকে কয়েক দশ গিগাবাইট RAM লাগে, যেখানে একই এক বিলিয়ন URL-এর জন্য ~১% false-positive-rate-এর একটা Bloom Filter মাত্র ~১.২ গিগাবাইট-এর কাছাকাছি জায়গায় ধরে যায় (কারণ Bloom Filter প্রতিটা item-এর জন্য পূর্ণ ডেটা না রেখে মাত্র কয়েক বিট রাখে)। এই বিশাল সাশ্রয়ই একটা সামান্য false-positive-rate মেনে নেওয়ার মূল প্রেরণা।</p>

<p><b>Duplicate Content Detection।</b> URL dedup আলাদা একটা সমস্যা থেকে duplicate <b>content</b> detection — একই page ভিন্ন ভিন্ন URL-এ পাওয়া অস্বাভাবিক না (যেমন <code>?utm_source=</code> query parameter যুক্ত URL, বা mirror সাইট)। এখানে URL মেলে না, কিন্তু page-এর প্রকৃত বিষয়বস্তু হুবহু একই — তাই Bloom Filter দিয়ে URL চেক করলে ধরা পড়বে না। সমাধান — page-এর HTML content-এর একটা hash (যেমন MD5/SHA) হিসাব করে সেই hash-টাকে "দেখা হয়েছে" set-এ (ফের একটা Bloom Filter বা exact set-এ) রাখা; দুটো URL ভিন্ন হলেও তাদের content-hash এক হলে সেটাকে duplicate ধরে নেওয়া হয় এবং দ্বিতীয়বার ইনডেক্স করা হয় না।</p>

<h4>Distributed Crawling (সংক্ষেপে)</h4>
<p>একাধিক Fetcher worker parallel-এ চালানো হয় থ্রুপুট বাড়ানোর জন্য, কিন্তু URL Frontier-কে যদি এলোমেলোভাবে worker-দের মধ্যে ভাগ করা হয়, তাহলে একই domain-এর URL ভিন্ন ভিন্ন worker-এর কাছে চলে যেতে পারে — আর তখন per-domain rate limit মেনে চলা কঠিন হয়ে যায় (প্রতিটা worker আলাদাভাবে delay মানলেও সম্মিলিতভাবে সেই domain-এ অতিরিক্ত রিকোয়েস্ট চলে যেতে পারে)। ব্যবহারিক সমাধান — URL Frontier-কে <b>domain অনুযায়ী shard</b> করা (৬ নম্বর অধ্যায়ের consistent hashing-এর একটা প্রয়োগ), যাতে একই domain-এর সব URL সবসময় একই worker (বা worker-দের একটা নির্দিষ্ট গ্রুপ) crawl করে — তখন politeness delay একটা মাত্র জায়গায় track করলেই যথেষ্ট হয়।</p>

<h3>অংশ ২ — Search Autocomplete</h3>
<h4>Requirements</h4>
<p><b>Functional:</b></p>
<ul>
<li>ব্যবহারকারী একটা সার্চ বক্সে টাইপ করার সাথে সাথে (প্রতিটা কিস্ট্রোকে) top-K জনপ্রিয় suggestion দেখানো।</li>
<li>Suggestion গুলো সাম্প্রতিক জনপ্রিয়তা প্রতিফলিত করবে (trending query উঠে আসা উচিত)।</li>
</ul>
<p><b>Non-functional:</b></p>
<ul>
<li>Latency অত্যন্ত কম হতে হবে (single-digit মিলিসেকেন্ড স্কেলে) — টাইপ করার গতির সাথে তাল মিলিয়ে suggestion আসতে হবে, নাহলে ফিচারটাই অর্থহীন হয়ে যায়।</li>
<li>Read-heavy — প্রতিটা কিস্ট্রোকে একটা read হয়, যেখানে নতুন query যুক্ত হওয়া (write) তুলনামূলক অনেক কম ঘটে।</li>
</ul>
<h4>Estimation (সংক্ষিপ্ত)</h4>
<pre>ধরা যাক প্রতিদিন ১০ কোটি সার্চ হয়, প্রতিটা query গড়ে ১০ character লম্বা
→ প্রতিটা কিস্ট্রোকে একটা autocomplete request ধরলে,
   প্রতিদিন ≈ ১০ কোটি × ১০ = ১০০ কোটি autocomplete request
পিক সময়ে প্রতি সেকেন্ডে কয়েক হাজার request — কিন্তু প্রতিটা request-এর কাজ
শুধু একটা precomputed cache lookup (নিচে দেখুন), তাই এই throughput সহজেই সামলানো যায়</pre>

<h4>Trie — Prefix-ভিত্তিক গঠন</h4>
<p><span class="kw">Trie</span> একটা tree structure যেখানে root থেকে একটা path-এর প্রতিটা node একটা character represent করে, আর root থেকে কোনো একটা node পর্যন্ত path মিলিয়ে একটা prefix তৈরি হয়। এই গঠনের সুবিধা — একই prefix শেয়ার করা সব শব্দ tree-তে একই path শেয়ার করে, তাই "এই prefix দিয়ে শুরু হওয়া সব শব্দ" খোঁজা মানে শুধু সেই prefix-এর node পর্যন্ত নেমে তার নিচের subtree ঘুরে দেখা।</p>
<div class="diagram"><pre>
শব্দ: "car", "cat", "card", "care"

                 root
                  │
                  c
                  │
                  a
                ╱   ╲
               r     t*      ("cat" → t থেকে শেষ, * = word শেষ চিহ্ন)
             ╱ │ ╲
            *  d*  e*         ("car"* , "card"* , "care"*)

"ca" prefix দিয়ে শুরু হওয়া সব শব্দ খুঁজতে root→c→a পর্যন্ত নেমেই
তার নিচের পুরো subtree (r-শাখা ও t-শাখা) থেকে সব সম্পূর্ণ শব্দ পাওয়া যায় —
বাকি ডেটাসেটের সাথে কোনো সম্পর্ক নেই, স্ক্যান করার দরকার নেই।
</pre></div>

<h4>Top-K Caching — প্রতিটা Node-এ Precomputed Suggestion</h4>
<p>শুধু Trie থাকলেই যথেষ্ট নয় — যদি প্রতিটা কিস্ট্রোকে সেই prefix-এর নিচের পুরো subtree traverse করে সব সম্ভাব্য শব্দ জোগাড় করে popularity দিয়ে sort করতে হয়, তাহলে বড় subtree-তে এই কাজ ধীর হয়ে যাবে — বিশেষ করে জনপ্রিয় ছোট prefix (যেমন <code>"a"</code>) এর subtree-তে হাজার হাজার শব্দ থাকতে পারে। সমাধান হলো <b>প্রতিটা Trie node-এ তার নিজের subtree-র top-K সবচেয়ে জনপ্রিয় suggestion আগে থেকেই precompute করে cache করে রাখা</b>। তখন একটা কিস্ট্রোকে সাড়া দেওয়া মানে শুধু সেই prefix-এর node-এ পৌঁছে তার cached list সরাসরি রিটার্ন করা — real-time traverse ও sort করার কোনো দরকার নেই, লেটেন্সি node lookup-এর সমান, subtree-র আকারের ওপর নির্ভর করে না।</p>
<div class="diagram"><pre>
node "ca" — cached top-৩ (precomputed, popularity অনুযায়ী sorted):
┌─────────────────────────────┐
│ ১. "car"   (৮.২M search)     │
│ ২. "care"  (৩.১M search)     │
│ ৩. "card"  (২.৪M search)     │
└─────────────────────────────┘
ব্যবহারকারী "ca" টাইপ করলে সরাসরি এই cached list রিটার্ন হয় —
subtree-র বাকি হাজারো কম-জনপ্রিয় শব্দ (carbon, cabin, ...) ছুঁতেও হয় না।
</pre></div>
<div class="callout why"><span class="tag">Space-Time Trade-off</span>
প্রতিটা node-এ top-K cache রাখা মানে প্রতিটা node কিছুটা বাড়তি মেমরি খরচ করে (K-টা করে entry), আর একই শব্দ একাধিক ancestor node-এর cache-এ পুনরাবৃত্তি হতে পারে (যেমন "car" শব্দটা "c", "ca", "car" — প্রতিটা node-এর cache-এ থাকতে পারে)। এটা একটা সচেতন <b>space-time trade-off</b> — কিছু বাড়তি মেমরি খরচ করে read latency-কে subtree-র আকার থেকে সম্পূর্ণ স্বাধীন করে দেওয়া, যা এই ফিচারের core non-functional requirement (অতি কম latency) সরাসরি পূরণ করে।
</div>

<h4>Real-Time Update Challenge</h4>
<p>একটা জনপ্রিয় query রাতারাতি trending হয়ে গেলে (যেমন একটা ব্রেকিং নিউজ), সেই প্রশ্নটার top-K list-এ জায়গা পাওয়া উচিত — কিন্তু cached top-K list তো precomputed, তাই এটা আপডেট হবে কীভাবে?</p>
<div class="callout mistake"><span class="tag">প্রতিটা কিস্ট্রোকে rebuild করা অপ্রয়োজনীয় ও costly</span>
প্রতিটা নতুন search query আসার সাথে সাথে সংশ্লিষ্ট সব prefix node-এর top-K cache তাৎক্ষণিকভাবে rebuild করা technically সম্ভব, কিন্তু ব্যবহারিকভাবে অপ্রয়োজনীয় — একটামাত্র নতুন query popularity-র ranking-এ সাধারণত সামান্যই প্রভাব ফেলে, আর প্রতিটা query-তে বহু node-এর cache আপডেট করা write path-কে অনেক ভারী করে তোলে। বাস্তব সিস্টেম বরং query log জমা রাখে এবং একটা <b>periodic batch job</b> (যেমন প্রতি কয়েক ঘণ্টায়) সেই লগ থেকে popularity গুনে পুরো Trie-র top-K cache পুনর্নির্মাণ করে।
</div>
<p>এখানে trade-off স্পষ্ট — top-K list সবসময় একদম "এই মুহূর্তের" trend প্রতিফলিত করবে না (কয়েক ঘণ্টার সামান্য delay থাকবে), কিন্তু বিনিময়ে read path (যেটা প্রতিটা কিস্ট্রোকে ঘটে, তাই সবচেয়ে বেশি ট্রাফিক পায়) সবসময় দ্রুত ও সরল থাকে। এটা এই কোর্স জুড়ে দেখা একটা পরিচিত প্যাটার্ন — যে path-টা বেশি ঘন ঘন ঘটে (read) তাকে সহজ ও দ্রুত রাখা, আর যে path কম ঘন ঘন ঘটে (write/update) তাকে ভারী কাজ বহন করতে দেওয়া।</p>

<h3>Trade-offs — সারসংক্ষেপ</h3>
<div class="callout best"><span class="tag">এই চ্যাপ্টারের মূল সিদ্ধান্তগুলো</span>
