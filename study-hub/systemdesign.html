<h2 class="title">২০. Interview প্রশ্নোত্তর</h2>
<p class="lead">System Design ইন্টারভিউতে বারবার আসা প্রশ্ন — প্রতিটা আগের চ্যাপ্টারের রেফারেন্স দিয়ে।</p>

<h3>১) একটা ওপেন-এন্ডেড System Design প্রশ্ন (যেমন "Design Twitter") পেলে ঠিক কীভাবে এগোনো উচিত?</h3>
<p><b>উত্তর:</b> প্রথমেই সরাসরি ডিজাইন করতে বসে যাওয়া সবচেয়ে সাধারণ ভুল। ১ নম্বর অধ্যায়ে শেখা framework অনুযায়ী প্রথমে requirements স্পষ্ট করা উচিত — functional (কী কী ফিচার আসলে দরকার, সব ফিচার না) ও non-functional (কতজন ব্যবহারকারী, read-heavy না write-heavy, latency/consistency-র চাহিদা কী)। এরপর সংক্ষিপ্ত estimation করে স্কেল বোঝা, তারপর একটা high-level diagram এঁকে মূল component-গুলো বসানো, আর সবশেষে ইন্টারভিউয়ার যেদিকে আগ্রহ দেখায় সেই একটা-দুটো অংশে গভীরে যাওয়া। পুরো সময় একটামাত্র অংশে (যেমন ডেটাবেস স্কিমা) আটকে থাকলে বাকি সিস্টেমের ছবি অসম্পূর্ণ থেকে যায়, যা ইন্টারভিউয়ারের কাছে negative signal।</p>

<h3>২) Back-of-envelope estimation কেন করতে হয়, নির্দিষ্ট নির্ভুল সংখ্যা কেন গুরুত্বপূর্ণ নয়?</h3>
<p><b>উত্তর:</b> ২ নম্বর অধ্যায়ে দেখা এই চর্চার আসল উদ্দেশ্য নির্ভুল সংখ্যা বের করা না, বরং <b>order of magnitude</b> বোঝা — সিস্টেমটা হাজার, লাখ, নাকি কোটি স্কেলে চলবে, কারণ এই স্কেলের ওপর নির্ভর করেই স্থাপত্যগত সিদ্ধান্ত বদলে যায় (একটা single database যথেষ্ট, নাকি sharding লাগবে; in-memory cache যথেষ্ট, নাকি distributed cache লাগবে)। একটা ভুল স্কেল ধরে নিয়ে ডিজাইন শুরু করলে পুরো আলোচনা ভুল দিকে চলে যেতে পারে — যেমন একটা ১ হাজার ব্যবহারকারীর সিস্টেমের জন্য Kafka-স্টাইল distributed queue প্রস্তাব করা over-engineering, আবার কোটি ব্যবহারকারীর সিস্টেমের জন্য একটা single MySQL instance under-engineering।</p>

<h3>৩) Vertical scaling আর horizontal scaling-এর মধ্যে পার্থক্য কী, এবং কেন একটা পর্যায়ে vertical scaling যথেষ্ট হয় না?</h3>
<p><b>উত্তর:</b> Vertical scaling (৩ নম্বর অধ্যায়) মানে একটা মেশিনের CPU/RAM/ডিস্ক বাড়ানো — সহজ, কোনো architecture বদলাতে হয় না, কিন্তু একটা হার্ডওয়্যার সীমার পর আর সম্ভব হয় না এবং একটামাত্র মেশিন ডাউন হলে পুরো সিস্টেম ডাউন (single point of failure)। Horizontal scaling মানে আরও মেশিন যোগ করা — তাত্ত্বিকভাবে সীমাহীন স্কেল দেয় ও redundancy তৈরি করে, কিন্তু load balancing, data partitioning, ও distributed coordination-এর জটিলতা যুক্ত করে। বাস্তব সিস্টেম সাধারণত দুটোই ব্যবহার করে — একটা যুক্তিসঙ্গত সীমা পর্যন্ত vertical scale করে, তারপর horizontal scaling শুরু করে।</p>

<h3>৪) Load balancing-এর সাধারণ algorithm গুলো কী কী, এবং কখন কোনটা বেছে নেওয়া উচিত?</h3>
<p><b>উত্তর:</b> ৩ নম্বর অধ্যায়ে দেখা কয়েকটা মূল কৌশল — <span class="kw">Round Robin</span> (পালাক্রমে প্রতিটা সার্ভারে request পাঠানো, সহজ কিন্তু সার্ভারের বর্তমান লোড বিবেচনা করে না), <span class="kw">Least Connections</span> (যে সার্ভারে সবচেয়ে কম active connection আছে তাকে পাঠানো, request-এর সময়কাল বিচিত্র হলে বেশি কার্যকর), আর <span class="kw">Consistent Hashing</span>-ভিত্তিক routing (একই client/key বারবার একই সার্ভারে যায় — session affinity বা cache locality প্রয়োজন হলে)। সাধারণ, uniform-duration request-এ Round Robin যথেষ্ট; দীর্ঘ-স্থায়ী, বিচিত্র connection-এ Least Connections ভালো; আর caching/stateful backend-এ consistent hashing দরকার।</p>

<h3>৫) Stateless আর stateful service-এর পার্থক্য কী, এবং কেন stateless service স্কেল করা সহজ?</h3>
<p><b>উত্তর:</b> একটা stateless service কোনো request-এর মধ্যেকার তথ্য নিজের ভেতরে (in-memory) ধরে রাখে না — প্রতিটা request স্বনির্ভর, প্রয়োজনীয় সব context request-এর সাথেই আসে বা একটা শেয়ার্ড external store (ডেটাবেস/cache) থেকে আসে। এই কারণে কোনো একটা instance-এ request পাঠালেই চলে, load balancer কোনো বিশেষ affinity ছাড়াই যেকোনো instance-এ route করতে পারে, এবং instance যোগ/বিয়োগ করা তুচ্ছ ব্যাপার (৩ নম্বর অধ্যায়)। Stateful service (যেমন একটা in-memory session store) instance-নির্দিষ্ট ডেটা ধরে রাখে, তাই সেই client-কে বারবার একই instance-এ পাঠাতে হয় (sticky session) — এটা load balancing ও failover-কে জটিল করে তোলে, তাই যেখানেই সম্ভব service-কে stateless রাখার চেষ্টা করা হয়।</p>

<h3>৬) Cache-aside আর write-through caching strategy-র মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> <span class="kw">Cache-aside</span>-এ (৪ নম্বর অধ্যায়) অ্যাপ্লিকেশন নিজে cache manage করে — read-এ প্রথমে cache দেখে, miss হলে ডেটাবেস থেকে পড়ে cache-এ ভরে; write সরাসরি ডেটাবেসে যায়, cache invalidate/update করা হয় আলাদাভাবে। এতে cache শুধু যা read হয়েছে তাই ধরে রাখে (lazy loading), কিন্তু প্রথম read সবসময় miss হয়। <span class="kw">Write-through</span>-এ প্রতিটা write একই সাথে cache আর ডেটাবেস দুটোতেই লেখা হয় (synchronously), তাই cache সবসময় up-to-date থাকে এবং read সবসময় hit হয়, কিন্তু প্রতিটা write-এর latency বাড়ে (দুই জায়গায় লিখতে হয়) এবং কম-পড়া (rarely read) ডেটার জন্যও cache স্পেস খরচ হয়।</p>

<h3>৭) Cache invalidation কেন এত কঠিন সমস্যা?</h3>
<p><b>উত্তর:</b> সমস্যা হলো underlying ডেটা বদলে গেলে cache-এ থাকা পুরনো কপিটা "stale" হয়ে যায়, আর সিস্টেমের কোনো এক জায়গায় নির্ভরযোগ্যভাবে জানতে হয় ঠিক <b>কোন</b> cache entry-গুলো এখন invalid এবং তা ঠিক কখন invalidate করতে হবে (৪ নম্বর অধ্যায়)। একটা distributed সিস্টেমে একই ডেটা একাধিক cache layer/node-এ থাকতে পারে, আর একটা write একসাথে সবগুলোতে propagate না হলে ভিন্ন ভিন্ন client ভিন্ন ভিন্ন সময়ে ভিন্ন উত্তর দেখতে পারে। এই কারণেই একটা প্রচলিত উক্তি আছে যে কম্পিউটার সায়েন্সে সবচেয়ে কঠিন দুটো সমস্যার একটা হলো cache invalidation — সহজ সমাধান (short TTL) কিছুটা staleness মেনে নেয়, নির্ভুল সমাধান (explicit invalidation on every write) অপারেশনালি জটিল ও error-prone।</p>

<h3>৮) Cache stampede (thundering herd) সমস্যা কী, এবং এটা কীভাবে ঠেকানো হয়?</h3>
<p><b>উত্তর:</b> Cache stampede ঘটে যখন একটা খুব জনপ্রিয় cache key expire হয়ে যায় (বা cold start-এ প্রথমবার মিস হয়) এবং তার ঠিক পরপর একসাথে হাজার হাজার concurrent request সেই একই key-র জন্য cache-এ miss পেয়ে সবাই একসাথে ডেটাবেসে গিয়ে হিট করে — ডেটাবেসকে একটা আকস্মিক লোড স্পাইকে ফেলে দেয় (৪ নম্বর অধ্যায়)। সাধারণ সমাধান — একটা distributed lock/mutex রাখা যাতে একটামাত্র request ডেটাবেসে গিয়ে ডেটা আনে, বাকিরা অপেক্ষা করে সেই একটা ফলাফল থেকেই cache পুনরায় ভরে নেয় (request coalescing); অথবা key expire হওয়ার আগেই proactively refresh করা (early recomputation), যাতে কখনোই সবাই একসাথে miss না পায়।</p>

<h3>৯) SQL আর NoSQL-এর মধ্যে বেছে নেওয়ার সময় কোন factor গুলো বিবেচনা করা উচিত?</h3>
<p><b>উত্তর:</b> মূল প্রশ্নগুলো (৫ নম্বর অধ্যায়) — ডেটার মধ্যে কতটা relational structure ও multi-record transaction দরকার (থাকলে SQL, যেখানে ACID ও জটিল join native), স্কিমা কতটা evolve করবে (frequently বদলালে NoSQL-এর schema-flexibility সুবিধাজনক), আর write/read স্কেল কতটা বিশাল ও horizontally distribute করতে হবে কিনা (NoSQL সাধারণত horizontal scaling ও eventual consistency মেনে নিয়ে বেশি throughput দেয়)। এটা "কোনটা ভালো" প্রশ্ন নয় — access pattern ও consistency চাহিদার সাথে মিলিয়ে বেছে নেওয়ার প্রশ্ন, এবং বাস্তব সিস্টেম প্রায়ই দুটোই একসাথে ব্যবহার করে (polyglot persistence), যেমন transactional ডেটা SQL-এ আর session/cache ডেটা NoSQL-এ।</p>

<h3>১০) Database replication-এ synchronous আর asynchronous-এর পার্থক্য কী, আর trade-off কী?</h3>
<p><b>উত্তর:</b> Synchronous replication-এ (৫ নম্বর অধ্যায়) primary একটা write-কে commit ঘোষণা করার আগে অন্তত একটা replica-র acknowledgment অপেক্ষা করে — এতে replica সবসময় primary-র সাথে সমান থাকার গ্যারান্টি থাকে (কোনো ডেটা হারানোর ঝুঁকি নেই), কিন্তু write latency বেড়ে যায় এবং replica ধীর/অনুপলভ্য হলে পুরো write path ব্লক হয়ে যেতে পারে। Asynchronous replication-এ primary replica-র জন্য অপেক্ষা করে না — write দ্রুত commit হয়, কিন্তু primary crash করলে যে writes এখনো replica-তে propagate হয়নি সেগুলো হারিয়ে যেতে পারে। এই trade-off মূলত durability বনাম latency-র একটা প্রকাশ, আর অনেক সিস্টেম একটা মাঝামাঝি পথ নেয় (semi-synchronous — অন্তত একটা replica sync, বাকিগুলো async)।</p>

<h3>১১) Sharding key ভুল বেছে নিলে কী সমস্যা হয়? "Hot shard" কীভাবে তৈরি হয়?</h3>
<p><b>উত্তর:</b> একটা ভালো sharding key (৬ নম্বর অধ্যায়) ডেটা ও ট্রাফিককে সব shard জুড়ে সমানভাবে ছড়িয়ে দেয়। ভুল বেছে নিলে — যেমন একটা multi-tenant সিস্টেমে <code>tenant_id</code> দিয়ে shard করলে, যদি একটা বড় tenant-এর ট্রাফিক বাকি সবার তুলনায় বহুগুণ বেশি হয়, তার shard একাই বাকি সব shard-এর তুলনায় disproportionate লোড বহন করে — এটাই <span class="kw">hot shard</span>। বাকি shard-গুলো underutilized থেকে যায় অথচ একটা shard bottleneck হয়ে পুরো সিস্টেমের latency নষ্ট করে। সমাধান একাধিক — বড় tenant-কে নিজের একাধিক sub-shard-এ ভাগ করা, অথবা key-এর সাথে একটা secondary randomizing factor যুক্ত করা যাতে একটা single logical entity-র লোড একটা মাত্র shard-এ না জমে।</p>

<h3>১২) সাধারণ modulo hashing (<code>hash(key) % N</code>) কেন distributed system-এ যথেষ্ট নয়? Consistent hashing এটা কীভাবে সমাধান করে?</h3>
<pre><span class="c">// Naive: node সংখ্যা N বদলালে প্রায় সব key remap হয়</span>
owner = hash(key) % N     <span class="c">// N=৩ থেকে N=৪ হলে প্রায় ৭৫% key ভিন্ন node-এ চলে যায়</span>

<span class="c">// Consistent hashing: node ও key দুটোই একটা circular hash space-এ বসানো,
// প্রতিটা key তার clockwise-এ প্রথম যে node পায় তার মালিকানায় যায়</span></pre>
<p><b>উত্তর:</b> এটা এই কোর্সের একটা কেন্দ্রীয় প্রশ্ন (৬ নম্বর অধ্যায়)। সমস্যা হলো — modulo hashing-এ <code>N</code> (node সংখ্যা) সামান্য বদলালেই (একটা নোড যোগ বা বিয়োগ) প্রায় প্রতিটা key-র <code>hash % N</code>-এর মান বদলে যায়, কারণ modulo operation-এর ফলাফল N-এর ওপর সম্পূর্ণভাবে নির্ভরশীল। এর মানে একটা নোড যোগ করলেই প্রায় পুরো dataset নতুন করে নেটওয়ার্কে সরাতে হয় — production-এ এই "data-movement storm" cluster-কে সাময়িকভাবে অকেজো করে দিতে পারে, অথচ node সংখ্যা বদলানো (scale-out, failure replace) একটা নিয়মিত ঘটনা। Consistent hashing সমাধান করে node আর key দুটোকেই একই circular hash space-এ hash করে বসিয়ে — একটা key তার hash অবস্থান থেকে clockwise-এ প্রথম যে node পায় তারই মালিকানায় যায়। একটা নোড যোগ/বিয়োগ হলে শুধু তার প্রতিবেশী arc-এর key-গুলোই সরে (গড়ে <code>K/n</code>-টা, মোট key-র একটা ক্ষুদ্র ভগ্নাংশ), বাকি সব node-এর mapping অপরিবর্তিত থাকে। এর ওপর virtual nodes যুক্ত করে লোড আরও সমানভাবে ছড়ানো হয়, কারণ শুধু কয়েকটা physical node-কে সরাসরি ring-এ বসালে random বণ্টনে কেউ বড়, কেউ ছোট arc পেয়ে যেতে পারে।</p>

<h3>১৩) Message queue ব্যবহারের সাধারণ use case কী কী, আর idempotency কেন গুরুত্বপূর্ণ?</h3>
<p><b>উত্তর:</b> Message queue (৭ নম্বর অধ্যায়) মূলত তিনটা কাজে ব্যবহার হয় — asynchronous processing (ভারী কাজ background-এ সরানো, যেমন video transcoding), service decoupling (producer আর consumer একে অপরকে জানার দরকার নেই, একে অপরের availability-র ওপর নির্ভরশীল নয়), আর load leveling/buffering (আকস্মিক ট্রাফিক স্পাইককে queue শোষণ করে, downstream service একটা স্থির গতিতে প্রসেস করতে পারে)। বেশিরভাগ queue system at-least-once delivery গ্যারান্টি দেয় — মানে একই message একাধিকবার deliver হতে পারে (retry-এর কারণে)। তাই consumer-এর processing logic <span class="kw">idempotent</span> হওয়া জরুরি — একই message দুইবার প্রসেস হলেও ফলাফল একবার প্রসেস করার সমান হওয়া উচিত (যেমন একটা unique message ID দিয়ে ডুপ্লিকেট চেক করে স্কিপ করা), নাহলে duplicate processing ভুল ফলাফল তৈরি করবে (যেমন একটা পেমেন্ট দুইবার চার্জ হওয়া)।</p>

<h3>১৪) Token bucket আর sliding window rate limiting algorithm-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> <span class="kw">Token bucket</span>-এ (৮/১২ নম্বর অধ্যায়) একটা bucket ধীরে ধীরে fixed rate-এ token ভরতে থাকে, প্রতিটা request একটা token খরচ করে; bucket খালি হলে request ব্লক হয়। এটা সংক্ষিপ্ত burst-কে সহনশীলভাবে allow করে (bucket ভরা থাকলে একসাথে অনেক request যেতে পারে), যতক্ষণ গড় rate সীমার মধ্যে থাকে। <span class="kw">Sliding window</span> একটা নির্দিষ্ট সময় windows-এ (যেমন গত ৬০ সেকেন্ড) কতটা request গেছে গুনে রাখে এবং window এগিয়ে যাওয়ার সাথে সাথে পুরনো count বাদ দেয় — এটা fixed window-এর boundary সমস্যা (window-এর শেষ ও পরের শুরুতে দ্বিগুণ burst) এড়ায়, কিন্তু প্রতিটা request-এর timestamp ট্র্যাক করা (বা তার approximation) দরকার হয়, যা token bucket-এর তুলনায় বেশি memory/computation খরচ করে।</p>

<h3>১৫) একটা single-node rate limiter সহজ, কিন্তু distributed system-এ rate limiting কেন কঠিন হয়ে যায়?</h3>
<p><b>উত্তর:</b> একটা single instance-এ rate limiter-এর counter/bucket সহজেই in-memory রাখা যায়, কারণ সব request একই process-এ আসে। কিন্তু একটা সার্ভিস যখন horizontally scaled (একাধিক instance load balancer-এর পেছনে), তখন প্রতিটা instance যদি নিজের আলাদা in-memory counter রাখে, তাহলে global limit ভুলভাবে instance সংখ্যা দিয়ে গুণ হয়ে যায় (৮/১২ নম্বর অধ্যায়) — একটা client প্রতিটা instance-কে আলাদাভাবে সীমা পর্যন্ত হিট করে কার্যত N গুণ বেশি request পাঠাতে পারে। সমাধান হলো counter-কে একটা শেয়ার্ড, দ্রুত external store-এ (যেমন Redis) রাখা যাতে সব instance একই count-এ atomic increment করে — কিন্তু এতে প্রতিটা request-এর জন্য একটা network round-trip যুক্ত হয়, যা latency বাড়ায়, তাই বাস্তব সিস্টেম প্রায়ই local approximation + periodic sync-এর একটা মাঝামাঝি কৌশল নেয়।</p>

<h3>১৬) Bloom Filter-এ false positive সম্ভব কিন্তু false negative অসম্ভব কেন? এটা কোন ধরনের use case-এ উপযোগী?</h3>
<p><b>উত্তর:</b> Bloom Filter (৯ নম্বর অধ্যায়) একটা bit array আর কয়েকটা hash function দিয়ে কাজ করে — একটা item যোগ করার সময় তার কয়েকটা hash অবস্থানের bit "1" সেট করা হয়; membership চেক করতে সেই একই অবস্থানগুলো দেখা হয়। যদি সব bit "1" থাকে, item "সম্ভবত আছে" বলা হয় — কিন্তু অন্য item-দের হ্যাশ মিলে গিয়ে সেই bit-গুলো "1" হয়ে থাকতে পারে (hash collision), তাই এটা <b>false positive</b> দিতে পারে। কিন্তু যদি item সত্যিই যোগ করা হয়ে থাকে, তার সব bit নিশ্চিতভাবে "1" থাকবে — তাই কখনো <b>false negative</b> হয় না (গঠনগত নিশ্চয়তা)। এই এক-দিকের error-এর কারণে এটা সেই সব ক্ষেত্রে উপযোগী যেখানে "সম্ভবত আগে দেখা গেছে" ভুল বললে সামান্য (বা গ্রহণযোগ্য) ক্ষতি হয়, কিন্তু "আগে দেখা যায়নি" ভুল বলা চলবে না — যেমন web crawler-এ duplicate URL detection (১৯ নম্বর অধ্যায়)।</p>

<h3>১৭) Quorum-ভিত্তিক replication-এ <code>W + R &gt; N</code> শর্তটা কেন যথেষ্ট, এবং এর ব্যবহারিক প্রভাব কী?</h3>
<p><b>উত্তর:</b> Leaderless replication-এ (৯ নম্বর অধ্যায়) <code>N</code> মোট replica সংখ্যা, <code>W</code> একটা write সফল হতে যতগুলো replica-র acknowledgment লাগে, আর <code>R</code> একটা read-এ যতগুলো replica-কে জিজ্ঞাসা করা হয়। <code>W + R &gt; N</code> শর্ত নিশ্চিত করে — pigeonhole principle অনুযায়ী যেকোনো write-set আর read-set-এর মধ্যে অন্তত একটা common replica থাকবেই, তাই read সবসময় সাম্প্রতিকতম write-এর অন্তত একটা কপি দেখতে পাবে। ব্যবহারিকভাবে <code>W</code> ও <code>R</code> ছোট রাখলে latency কমে কিন্তু stale replica পাওয়ার সম্ভাবনা বাড়ে (একাধিক ভার্সনের মধ্যে সাম্প্রতিকতম কোনটা বাছাই করতে হয়); বড় রাখলে নিশ্চয়তা বাড়ে কিন্তু latency বাড়ে ও কিছু replica অনুপলভ্য হলে অপারেশন ব্যর্থ হওয়ার ঝুঁকি বাড়ে।</p>

<h3>১৮) CAP theorem বাস্তব সিস্টেম ডিজাইনে কীভাবে প্রয়োগ হয়? "C আর A-র মধ্যে বেছে নাও" মানেটা আসলে কী?</h3>
<p><b>উত্তর:</b> CAP theorem বলে, network partition ঘটলে Consistency আর Availability দুটো একসাথে পুরোপুরি রাখা যায় না — একটা ছাড় দিতে হয়; Partition Tolerance ঐচ্ছিক নয়, বাস্তব নেটওয়ার্কে partition ঘটবেই। ব্যবহারিকভাবে এর মানে — একটা সিস্টেম ডিজাইনের সময় স্থির করতে হয় নেটওয়ার্ক বিচ্ছিন্ন হলে সিস্টেম কী করবে: কিছু node stale/পুরনো ডেটা দিয়ে হলেও চালু (availability-favoring, AP, যেমন DNS বা shopping cart) নাকি অনিশ্চিত হলে পুরোপুরি রিজেক্ট করা (consistency-favoring, CP, যেমন ব্যাংকিং ledger)। এই সিদ্ধান্ত business requirement থেকে আসে, প্রযুক্তি থেকে নয় — একটা social feed-এ কয়েক সেকেন্ড stale লাইক-কাউন্ট সহনীয়, কিন্তু একটা account balance-এ নয়।</p>

<h3>১৯) URL Shortener-এ unique short ID তৈরির প্রধান পদ্ধতি কী কী, আর Snowflake-এর কাজ কীভাবে?</h3>
<p><b>উত্তর:</b> ১১ নম্বর অধ্যায়ে দেখা কয়েকটা কৌশল — একটা কেন্দ্রীয় auto-increment counter (সহজ, কিন্তু single point of contention/failure), pre-generated random ID-র pool (collision চেক করা লাগে), আর <span class="kw">Snowflake</span>-স্টাইল distributed ID generation। Snowflake একটা ৬৪-বিট ID-কে কয়েকটা ভাগে ভাগ করে — একটা timestamp অংশ (roughly সময়ানুক্রমিক, যা database index-এর জন্য ভালো), একটা machine/worker ID অংশ (কোন generator তৈরি করেছে তা আলাদা করে, তাই কোনো centralized coordination লাগে না), আর একটা sequence number অংশ (একই মিলিসেকেন্ডে একই worker একাধিক ID দিলে সেগুলো আলাদা করার জন্য)। এভাবে একাধিক machine সম্পূর্ণ স্বাধীনভাবে, কোনো central lock ছাড়াই globally unique ও roughly-sorted ID তৈরি করতে পারে — horizontal scale করা সহজ।</p>

<h3>২০) Fan-out-on-write আর fan-out-on-read-এর পার্থক্য কী? "Celebrity problem" কেন সমস্যা তৈরি করে?</h3>
<p><b>উত্তর:</b> News feed সিস্টেমে (১৪ নম্বর অধ্যায়) <span class="kw">fan-out-on-write</span> মানে একজন ব্যবহারকারী পোস্ট করার সাথে সাথে সেই পোস্ট তার সব ফলোয়ারের feed-এ push করে দেওয়া (write-time-এ ভারী কাজ, read দ্রুত — পাঠক শুধু নিজের precomputed feed পড়ে)। <span class="kw">Fan-out-on-read</span> মানে পোস্ট কোথাও push না করে, একজন ব্যবহারকারী feed খুললে তার সব ফলোয়িং-এর পোস্ট তখন একত্র করে দেখানো (write সহজ, read ভারী)। সমস্যা হয় যখন একজন সেলিব্রিটির কোটি ফলোয়ার থাকে — fan-out-on-write ব্যবহার করলে একটা পোস্টে কোটি write ট্রিগার হয়ে যায় (<span class="kw">celebrity problem</span>), যা অসম্ভব ধীর ও রিসোর্স-খরুচে। ব্যবহারিক সমাধান একটা hybrid model — সাধারণ ব্যবহারকারীর জন্য fan-out-on-write, কিন্তু বিপুল-ফলোয়ার একাউন্টের পোস্ট fan-out না করে read-time-এ merge করা।</p>

<h3>২১) Chat সিস্টেমে real-time মেসেজ ডেলিভারির জন্য WebSocket-কে long polling-এর চেয়ে কেন প্রাধান্য দেওয়া হয়?</h3>
<p><b>উত্তর:</b> Long polling-এ (১৫ নম্বর অধ্যায়) client একটা HTTP request পাঠায় ও সার্ভার সেটা নতুন ডেটা না আসা পর্যন্ত খোলা রাখে, তারপর respond করে, ক্লায়েন্ট আবার নতুন request পাঠায় — প্রতিটা রাউন্ডে একটা নতুন HTTP connection ও তার overhead (header, TCP handshake সম্ভাবনা) লাগে। <span class="kw">WebSocket</span> একটা একক TCP connection-এর ওপর একটা persistent, full-duplex চ্যানেল তৈরি করে — একবার handshake হয়ে গেলে সার্ভার ও client দুই দিক থেকেই যখনই দরকার তখনই মেসেজ পাঠাতে পারে, কোনো নতুন connection বা repeated header overhead ছাড়া। উচ্চ-ফ্রিকোয়েন্সি, দ্বি-মুখী যোগাযোগে (chat, live notification) এটা latency ও সার্ভার রিসোর্স দুটোতেই অনেক কার্যকর, যদিও এর জন্য সার্ভারকে প্রতিটা connection-এর জন্য একটা persistent state ধরে রাখতে হয় (stateful, তাই connection-aware load balancing দরকার)।</p>

<h3>২২) Ride-sharing-এ nearby driver খোঁজার জন্য geohash আর quadtree-র মধ্যে কীভাবে সিদ্ধান্ত নেওয়া হয়?</h3>
<p><b>উত্তর:</b> দুটোই brute-force <code>O(n)</code> distance calculation এড়ানোর জন্য ব্যবহৃত geospatial indexing কৌশল (১৭ নম্বর অধ্যায়)। <span class="kw">Geohash</span> পুরো এলাকাকে fixed-size grid cell-এ ভাগ করে প্রতিটাকে একটা string code দেয় — সহজ, stateless, কোনো tree maintain করার দরকার নেই, সরাসরি sorted structure-এ বসে। <span class="kw">Quadtree</span> recursively এলাকা ভাগ করে যতক্ষণ প্রতিটা অংশে driver সংখ্যা একটা threshold-এর নিচে না আসে — dense এলাকায় ছোট cell, sparse এলাকায় বড় cell। বড়, অসমান-ঘনত্বের শহরে (downtown ঘন, উপশহর পাতলা) quadtree বেশি efficient কারণ এটা density-র সাথে নিজেই খাপ খায়, কিন্তু বিনিময়ে একটা stateful tree maintain করার অপারেশনাল জটিলতা নিতে হয় — geohash সরল ও যথেষ্ট যখন ঘনত্ব মোটামুটি সমান বা সিস্টেম ছোট স্কেলে থাকে।</p>

<h3>২৩) Adaptive Bitrate Streaming (HLS/DASH) কীভাবে খারাপ network condition-এ playback বন্ধ হওয়া থেকে বাঁচায়?</h3>
<p><b>উত্তর:</b> Video streaming-এ (১৮ নম্বর অধ্যায়) video-কে ছোট ছোট (কয়েক সেকেন্ডের) chunk-এ ভাগ করে প্রতিটা chunk একাধিক bitrate/resolution-এ প্রি-এনকোড করে রাখা হয় — একটা "bitrate ladder"। Player প্রতিটা পরের chunk request করার আগে তার বর্তমান download speed মেপে সিদ্ধান্ত নেয় কোন bitrate আনবে; network speed কমে গেলে player স্বয়ংক্রিয়ভাবে নিচের resolution-এ নেমে যায় mid-stream, আর network ফিরে এলে আবার উপরে ওঠে। যেহেতু প্রতিটা chunk সব bitrate-এই আগে থেকে ready থাকে এবং সিদ্ধান্তটা client-side-এ নেওয়া হয়, viewer resolution পরিবর্তন লক্ষ্য করতে পারে কিন্তু playback কখনো থেমে buffer করে না — এটাই মূল লক্ষ্য, সর্বোচ্চ resolution নিশ্চিত করা না, বরং নিরবচ্ছিন্ন playback নিশ্চিত করা।</p>

<h3>২৪) Graceful degradation আর circuit breaker pattern রিলায়েবিলিটির জন্য কীভাবে কাজ করে?</h3>
<p><b>উত্তর:</b> একটা বড় সিস্টেমে একটা downstream dependency (যেমন একটা recommendation service) ধীর বা down হয়ে গেলে, তার জন্য অপেক্ষা করতে থাকা calling service-এর thread/connection pool-ও আটকে যেতে পারে এবং সেই ব্যর্থতা upstream-এ ছড়িয়ে পড়তে পারে (cascading failure, ১০ নম্বর অধ্যায়)। <span class="kw">Circuit breaker</span> pattern একটা failure threshold পার হলে সেই dependency-কে কল করা বন্ধ করে দেয় (fail fast) এবং একটা cooldown-এর পর সীমিতভাবে পুনরায় চেষ্টা করে দেখে dependency ফিরে এসেছে কিনা। <span class="kw">Graceful degradation</span> এর পরিপূরক — circuit open থাকলে সিস্টেম সম্পূর্ণ ব্যর্থ না হয়ে একটা কমপক্ষে-কার্যকরী ফলব্যাক দেখায় (যেমন personalized recommendation না দেখিয়ে generic popular item দেখানো) — মূল ফিচার সম্পূর্ণ কাজ না করলেও ব্যবহারকারীর কাছে সিস্টেম আংশিকভাবে চালু থাকে, পুরোপুরি ভেঙে পড়ে না।</p>
</template>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
</html>
