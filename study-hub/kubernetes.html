<template data-page="gitops">
<h2 class="title">১৪. GitOps · Argo CD/Flux · CI/CD Tooling</h2>
<p class="lead">এই ডকুমেন্ট এতক্ষণ ধরে নিয়েছে <code>kubectl apply</code>/<code>helm upgrade</code> হাতে চালানো হচ্ছে। বাস্তব প্রোডাকশন টিমে deploy করা স্বয়ংক্রিয়, audit-যোগ্য একটা pipeline-এর অংশ হয় — এই চ্যাপ্টার সেই বাস্তব DevOps টুলচেইন নিয়ে।</p>

<h3>GitOps — Git-ই একমাত্র সত্য</h3>
<div class="callout why"><span class="tag">Push বনাম Pull deployment মডেল</span>
প্রথাগত CI pipeline (Jenkins/GitHub Actions) নিজেই cluster credential নিয়ে সরাসরি <code>kubectl apply</code>/<code>helm upgrade</code> চালায় — এটা <b>push</b> মডেল: CI-এর হাতে cluster-এ write করার ক্ষমতা থাকে। <span class="kw">GitOps</span> এটা উল্টে দেয় — cluster-এর ভেতরে একটা controller (Argo CD/Flux) ক্রমাগত একটা Git repo (যেখানে YAML/Helm chart/Kustomize overlay-এ কাঙ্ক্ষিত অবস্থা লেখা আছে) পর্যবেক্ষণ করে, আর নিজেই সেটার সাথে cluster-কে মিলিয়ে দেয় — এটা <b>pull</b> মডেল। এটা ঠিক Foundation চ্যাপ্টারের সেই control loop-এর নীতিই — শুধু এবার "কাঙ্ক্ষিত অবস্থা" এক YAML ফাইলে না থেকে একটা পুরো Git repo-তে থাকে।</div>
<table>
<tr><th></th><th>Push (traditional CI deploy)</th><th>Pull (GitOps)</th></tr>
<tr><td>Cluster credential কার হাতে</td><td>CI system-এর হাতে (বাইরের)</td><td>শুধু in-cluster controller-এর হাতে</td></tr>
<tr><td>সত্যের উৎস</td><td>CI pipeline-এর যা রান হলো তাই</td><td>Git repo — সবসময় দেখা যায় কী deploy হওয়ার কথা</td></tr>
<tr><td>Drift (কেউ manual <code>kubectl edit</code> করলে)</td><td>ধরা পড়ে না</td><td>পরের sync-এ controller নিজে থেকেই আগের অবস্থায় ফিরিয়ে দেয়</td></tr>
<tr><td>Rollback</td><td>পুরনো pipeline run খুঁজে আবার চালানো</td><td><code>git revert</code> — Argo CD/Flux বাকিটা করে</td></tr>
</table>

<h3>Argo CD — সবচেয়ে জনপ্রিয় GitOps টুল</h3>
<p><span class="kw">Argo CD</span> নিজেই cluster-এর ভেতর চলা একটা Kubernetes controller — একটা <code>Application</code> object দিয়ে বলে দেওয়া হয় কোন Git repo/path পর্যবেক্ষণ করবে, আর কোন cluster/namespace-এ সেটা sync করবে।</p>
<pre>apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapi
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/mycompany/myapi-manifests.git
    targetRevision: main
    path: overlays/production        <span class="c"># Kustomize overlay বা Helm chart path</span>
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true                    <span class="c"># Git থেকে সরানো resource cluster থেকেও মুছে দেবে</span>
      selfHeal: true                  <span class="c"># manual drift ধরা পড়লেই আবার Git-এর অবস্থায় ফেরাবে</span></pre>
<div class="callout best"><span class="tag">Argo CD-এর UI যা দেখায়</span>
Argo CD-এর dashboard প্রতিটা <code>Application</code>-এর জন্য দুটো অবস্থা পাশাপাশি দেখায়: <b>Synced</b>/<b>OutOfSync</b> (Git বনাম live cluster মিলছে কিনা) আর <b>Healthy</b>/<b>Degraded</b> (Deployment/Pod আসলে সুস্থভাবে চলছে কিনা)। কোনো deploy আটকে গেলে ঠিক কোন resource-এ কী পার্থক্য আছে তা visually diff হিসেবে দেখা যায় — <code>kubectl diff</code>-এর মতোই, কিন্তু পুরো app-এর জন্য একসাথে।</div>

<h3>Flux — বিকল্প GitOps টুল</h3>
<p><span class="kw">Flux</span> একই GitOps দর্শন অনুসরণ করে, তবে হালকা, পুরোপুরি CLI/CRD-চালিত (আলাদা ভারী UI ছাড়া), আর Helm/Kustomize-এর সাথে নেটিভভাবে বেশি গভীরভাবে যুক্ত। দুটোর মধ্যে choice মূলত টিমের পছন্দ — দুটোই একই সমস্যা সমাধান করে।</p>

<h3>CI বনাম CD — আলাদা দুই দায়িত্ব</h3>
<div class="callout behind"><span class="tag">GitOps pipeline-এ আসলে কী ঘটে</span>
১) Developer কোড push করে। ২) CI (GitHub Actions/Jenkins) — build, test, নতুন image tag build করে registry-তে push করে। ৩) CI তারপর <b>শুধু</b> manifest repo-তে image tag বদলে একটা commit করে (cluster স্পর্শ করে না)। ৪) Argo CD/Flux সেই commit দেখে, নতুন tag-সহ Deployment cluster-এ apply করে। এভাবে "কোড বিল্ড করা" (CI) আর "cluster বদলানো" (CD) সম্পূর্ণ আলাদা সিস্টেম, আলাদা credential — CI pipeline compromise হলেও সরাসরি cluster-এ write করার ক্ষমতা তার হাতে থাকে না।</div>

<h3>Secrets — GitOps-এ Base64 Secret আর যথেষ্ট নয়</h3>
<p>যেহেতু GitOps-এ <b>সবকিছুই</b> Git-এ থাকে, Config চ্যাপ্টারে দেখা base64-encoded Secret সরাসরি commit করা মানেই পুরো secret leak — Git history থেকে চিরকালের জন্য মুছে ফেলাও কঠিন। দুটো সাধারণ সমাধান:</p>
<table>
<tr><th>টুল</th><th>পদ্ধতি</th></tr>
<tr><td><span class="kw">Sealed Secrets</span> (Bitnami)</td><td>Secret-কে client-side asymmetric key দিয়ে এনক্রিপ্ট করে একটা <code>SealedSecret</code> object বানানো হয় — এনক্রিপ্টেড ব্লবটাই Git-এ commit করা নিরাপদ, শুধু cluster-এর ভেতরের controller-ই সেটা decrypt করতে পারে</td></tr>
<tr><td><span class="kw">External Secrets Operator</span></td><td>Git-এ শুধু একটা <b>reference</b> থাকে (কোন Vault/AWS Secrets Manager/Azure Key Vault পাথ থেকে আনতে হবে) — আসল মান কখনো Git-এ যায় না, controller লাইভ external store থেকে টেনে এনে একটা সাধারণ Kubernetes Secret বানিয়ে দেয়</td></tr>
</table>

<h3>Policy Enforcement — নিয়ম মানুষ মনে রাখা নয়, cluster বাধ্য করা</h3>
<p>এই ডকুমেন্টের বিভিন্ন চ্যাপ্টারে "Common mistake" callout-এ যেসব ভুল এড়াতে বলা হয়েছে (resources.requests না দেওয়া, root user-এ চালানো, <code>:latest</code> tag ব্যবহার) — সেগুলো মানুষ মনে রাখার বদলে <span class="kw">admission policy</span> দিয়ে cluster-স্তরেই বাধ্যতামূলক করা যায়:</p>
<table>
<tr><th>টুল</th><th>কাজ</th></tr>
<tr><td><span class="kw">OPA Gatekeeper</span></td><td>Open Policy Agent-ভিত্তিক — Rego ভাষায় নীতি লিখে, নিয়ম-বহির্ভূত resource তৈরির চেষ্টা হলেই admission webhook সেটা reject করে</td></tr>
<tr><td><span class="kw">Kyverno</span></td><td>একই কাজ, কিন্তু নীতি plain YAML-এ লেখা যায় (আলাদা ভাষা শেখার দরকার নেই) — Kubernetes টিমের কাছে সাধারণত সহজবোধ্য</td></tr>
</table>
<div class="callout mistake"><span class="tag">Policy না থাকলে কী হয়</span>
Policy engine ছাড়া, "resources.requests সবসময় দিন" শুধুই একটা code-review checklist আইটেম — কেউ ভুলে গেলে বা তাড়াহুড়ায় বাদ দিলে, সেই Pod cluster-এ ঢুকে যায় ধরা ছাড়াই, আর Scheduling চ্যাপ্টারে দেখা BestEffort QoS সমস্যা তখন প্রোডাকশনে ধরা পড়ে। Gatekeeper/Kyverno policy থাকলে এমন Deployment API Server-স্তরেই reject হয়ে যায়, deploy হওয়ার আগেই।</div>

<h3>Infrastructure as Code — Cluster নিজেই কীভাবে তৈরি হয়</h3>
<p>এই পুরো ডকুমেন্ট ধরে নিয়েছে cluster-টা ইতিমধ্যে আছে। বাস্তবে cluster, node pool, load balancer, database-এর মতো cloud resource নিজেই <span class="kw">Terraform</span> (বা Pulumi) দিয়ে declaratively সংজ্ঞায়িত ও তৈরি হয় — ঠিক Kubernetes YAML-এর মতোই declarative, কিন্তু এক স্তর নিচে (Kubernetes-এর <b>ভেতরের</b> resource নয়, Kubernetes <b>যার উপর চলে</b> সেই infrastructure)।</p>

<h3>সম্পূর্ণ Toolchain — একসাথে সাজিয়ে দেখা</h3>
<div class="diagram"><pre>
Developer কোড push করে
      │
      ▼
CI (GitHub Actions)  ── build/test/push image ──▶ Container Registry
      │
      └── manifest repo-তে নতুন image tag commit করে (cluster ছোঁয় না)
                              │
                              ▼
                    Argo CD / Flux (in-cluster)
                    Git দেখে, cluster-এর সাথে diff করে, sync করে
                              │
                              ▼
                         Kubernetes Cluster
              (Terraform দিয়ে provision করা, Kyverno policy-সুরক্ষিত,
               External Secrets দিয়ে secret injected)
                              │
                              ▼
              Prometheus/Grafana + Loki + OpenTelemetry
                     (Observability চ্যাপ্টারের টুল দিয়ে monitor)
</pre></div>
<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
GitOps মূলত Foundation চ্যাপ্টারের সেই মূল নীতিরই সম্প্রসারণ — declarative state + reconciliation loop — শুধু "state" এখন একটা Git repo, আর "reconciler" এখন Argo CD/Flux। বাকি সব টুল (Terraform, Sealed Secrets/External Secrets, Kyverno, Prometheus stack) একেকটা নির্দিষ্ট উদ্বেগ (infrastructure, secret, policy, observability)-কে এই একই declarative মডেলে নিয়ে আসে।</div>
</template>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
</body>
