Class-level diagram সবচেয়ে দ্রুত stale হয়ে যায় — একটা রিফ্যাক্টরে দুইটা method যোগ হলেই হাতে আঁকা ছবি ভুল হয়ে যায়। যেহেতু এই তথ্য কোডেই সম্পূর্ণভাবে বিদ্যমান, তাই এটা হাতে ডুপ্লিকেট না করে IDE-কে জেনারেট করতে দেওয়াই যুক্তিসঙ্গত।</div>

<h3>Architecture Decision Record (ADR): সিদ্ধান্তের প্রাতিষ্ঠানিক স্মৃতি</h3>
<p><span class="kw">Architecture Decision Record (ADR)</span> হলো একটা হালকা, version-controlled নথি — সাধারণত একটা ছোট Markdown ফাইল, প্রতিটা গুরুত্বপূর্ণ আর্কিটেকচারাল সিদ্ধান্তের জন্য একটা করে, কোডের সাথেই একই repository-তে commit করা। ADR-এর মূল বৈশিষ্ট্য হলো এটা সিদ্ধান্ত নেওয়ার সাথে সাথেই লেখা হয় — পরে স্মৃতি থেকে পুনর্গঠন করা না। একটা সাধারণ ADR-এর কাঠামো নিচের মতো।</p>

<pre>
# ADR-০০১২: Order Service-এ Event-Driven Update ব্যবহার

## Status
Accepted (২০২৬-০৩-১৫)

## Context
Order Service থেকে Inventory Service-এ synchronous REST call করা হতো
stock আপডেট করার জন্য। পিক আওয়ারে Inventory Service একটু ধীর হলেই
পুরো checkout flow ব্লক হয়ে যাচ্ছিল, cascading timeout তৈরি হচ্ছিল।

## Decision
Order confirmation-এর পর একটা "OrderPlaced" event publish করা হবে
message broker-এ; Inventory Service সেটা asynchronously consume করে
stock আপডেট করবে।

## Consequences
+ Checkout latency Inventory Service-এর health থেকে decouple হলো।
+ Inventory Service ডাউন থাকলেও order নেওয়া বন্ধ হবে না।
- Stock eventually consistent হবে — সাময়িকভাবে oversell-এর সম্ভাবনা আছে।
- ডিবাগিং জটিল — একাধিক সার্ভিস ও broker log দেখতে হবে।
</pre>

<p>Status ফিল্ডটা গুরুত্বপূর্ণ কারণ একটা ADR স্থায়ী সত্য না — এটা proposed অবস্থা থেকে accepted হতে পারে, পরে deprecated হতে পারে, অথবা নতুন কোনো ADR এসে সেটাকে superseded করতে পারে। এই status-চেইনটাই আর্কিটেকচারের evolution-এর একটা readable ইতিহাস তৈরি করে।</p>

<h3>ADR কেন ডায়াগ্রামের চেয়েও বেশি গুরুত্বপূর্ণ</h3>
<p>C4 ডায়াগ্রাম দেখায় সিস্টেমটা এখন কেমন দেখতে — কিন্তু কেন এই আকৃতিটা এলো, সেই প্রশ্নের উত্তর ডায়াগ্রামে থাকে না। ছয় মাস পর একজন নতুন ইঞ্জিনিয়ার প্রশ্ন তোলেন — "আমরা এখানে Postgres না নিয়ে একটা document store কেন নিলাম না?"। যদি ADR না থাকে, তাহলে সেই প্রসঙ্গ চিরতরে হারিয়ে যায় — আর এর চেয়েও বিপজ্জনক ব্যাপার হলো, কেউ হয়তো সরল উদ্দেশ্যে সেই "অদ্ভুত" সিদ্ধান্তটাকে "ঠিক করে" ফেলবেন, ঠিক সেই সমস্যাটাই আবার ফিরিয়ে আনবেন যেটা এড়ানোর জন্য মূল সিদ্ধান্তটা সচেতনভাবে নেওয়া হয়েছিল।</p>

<div class="callout behind"><span class="tag">বাস্তবতা — একই "ভুল" বারবার ফিরে আসা</span>
প্রোডাকশন সিস্টেমে এটা অস্বাভাবিক না যে একটা টিম একটা deliberate trade-off (যেমন eventual consistency মেনে নেওয়া) নিয়ে ভালোভাবেই আলোচনা করে সিদ্ধান্তে পৌঁছেছিল, কিন্তু ছয়-নয় মাস পর নতুন কেউ যোগ দিয়ে ভাবেন এটা একটা bug, আর "fix" করতে গিয়ে সেই পুরনো সমস্যাটাই ফিরিয়ে আনেন। ADR না থাকলে এই ইতিহাস পুনরাবৃত্তি ঠেকানোর কোনো উপায় নেই।</div>

<h3>Diagrams-as-code: ডকুমেন্টেশনকে code-এর মতো treat করা</h3>
<p>একটা GUI টুলে (draw.io, Visio) হাতে আঁকা ডায়াগ্রাম একটা static image হিসেবে উইকিতে পেস্ট হয়ে যায়, আর architecture বদলানোর মুহূর্তেই সেটা নীরবে ভুল হয়ে যায়। এর বিপরীতে <span class="kw">diagrams-as-code</span> পদ্ধতিতে ডায়াগ্রামের definition একটা টেক্সট ফাইল — Mermaid বা PlantUML সিনট্যাক্স, অথবা C4-এর জন্য বিশেষভাবে বানানো Structurizr DSL। এই টেক্সট ফাইলগুলো কোড আর ADR-এর ঠিক পাশেই একই repository-তে থাকে, git দিয়ে version হয়, pull request-এ code-এর মতোই review করা যায়, আর দরকার হলেই render করে নতুন ছবি জেনারেট করা যায়।</p>

<div class="callout best"><span class="tag">Best practice — ডায়াগ্রাম, ADR, কোড — একসাথে থাকুক</span>
একটা repository-তে docs/architecture/ নামে একটা ফোল্ডার রাখা ভালো অভ্যাস, যেখানে diagrams-as-code ফাইল (.mmd বা .puml) আর ADR মার্কডাউন ফাইলগুলো একসাথে থাকে। এতে একটা নতুন feature-এর PR-এ কোড পরিবর্তনের সাথে সাথেই যদি container বাউন্ডারি বদলায়, সেই একই PR-এ diagram ফাইল আর প্রয়োজনে একটা নতুন ADR যোগ করা স্বাভাবিক অভ্যাসে পরিণত হয়।</div>

<h3>Migration Path — Modular Monolith থেকে Microservices, ধাপে ধাপে</h3>
<p>এই কোর্সে বারবার একটা সুপারিশ ফিরে এসেছে — একটা সুশৃঙ্খল <span class="kw">Modular Monolith</span> দিয়ে শুরু করা, তারপর প্রমাণিত প্রয়োজনে নির্দিষ্ট module extract করা। এই এক্সট্র্যাকশন প্রক্রিয়ার প্রচলিত নাম <span class="kw">Strangler Fig</span> — একটা গাছকে (পুরনো monolith) ধীরে ধীরে একটা লতা (নতুন সার্ভিস) জড়িয়ে ধরে, একদিন লতাটাই একা দাঁড়িয়ে থাকে, কিন্তু কখনোই একদিনে পুরনো গাছ কেটে ফেলা হয় না। ব্যবহারিকভাবে এর মানে — প্রথমে module boundary-কে code-এর ভেতরে perfect করা (যদি এখনো করা না থাকে), তারপর সেই module-এর জন্য একটা আলাদা database প্রস্তুত করা এবং dual-write বা event-ভিত্তিক sync দিয়ে ডেটা migrate করা, এরপর ট্র্যাফিকের একটা ছোট অংশ নতুন সার্ভিসে রুট করে যাচাই করা, আর সবশেষে পুরনো monolith থেকে সেই module-এর কোড সম্পূর্ণ সরিয়ে ফেলা। প্রতিটা ধাপে সিস্টেম সচল থাকে, আর যেকোনো ধাপে সমস্যা দেখা দিলে আগের ধাপে ফিরে যাওয়া সম্ভব — একটা "বিগ ব্যাং" rewrite-এর বিপরীতে, যেখানে মাসের পর মাস কাজ করার পর একদিনে সবকিছু সুইচ করতে হয় এবং ব্যর্থ হলে ফিরে যাওয়ার পথ প্রায়ই থাকে না।</p>

<div class="callout why"><span class="tag">কেন "প্রমাণিত প্রয়োজন" ছাড়া extract করা বিপজ্জনক</span>
একটা module extract করার আগে যদি সত্যিকারের মেট্রিক (আলাদা scaling দরকার, আলাদা deployment cadence দরকার, আলাদা টিম দরকার) না থাকে, তাহলে পুরো এক্সট্র্যাকশন প্রক্রিয়ার খরচ (network latency, distributed transaction, আলাদা monitoring) কোনো প্রকৃত সুবিধার বিনিময়ে আসে না — এটাই আগের অধ্যায়গুলোতে আলোচিত "resume-driven microservices" আর "distributed monolith" সমস্যার মূল উৎস। Extract করার সিদ্ধান্ত সবসময় একটা নির্দিষ্ট, পরিমাপযোগ্য pain point থেকে আসা উচিত, "এটা তো industry best practice" থেকে না।</div>

<div class="callout mistake"><span class="tag">Common mistake — একই সিদ্ধান্ত প্রতিটা module-এর জন্য একইভাবে প্রয়োগ করা</span>
একটা সাধারণ ভুল হলো, একবার microservices-এ migrate করার সিদ্ধান্ত নিলে প্রতিটা module-কেই সমান আগ্রহে ভেঙে ফেলা — এমনকি যেগুলোর কোনো স্বাধীন স্কেলিং দরকার নেই। বাস্তবে সিদ্ধান্তটা module-বাই-module ভিত্তিতে নেওয়া উচিত — কিছু module (core billing) হয়তো চিরকালই monolith-এর ভেতরে থাকা ভালো, আর শুধু নির্দিষ্ট hot-spot module (notification, image processing) আলাদা করা হয়। "সব-অথবা-কিছু-না" চিন্তা এখানে ক্ষতিকর।</div>

<div class="callout best"><span class="tag">Best practice — প্রতিটা বড় আর্কিটেকচারাল সিদ্ধান্তে ADR লিখুন</span>
১৫ নম্বর অধ্যায়ে আলোচিত Architecture Decision Record ঠিক এই ধরনের সিদ্ধান্তের জন্যই সবচেয়ে বেশি মূল্যবান — "কেন আমরা এই মুহূর্তে Notifications module extract করছি, বাকিগুলো না" এই যুক্তিটা লিখে রাখলে ভবিষ্যতে (যখন হয়তো দলের অর্ধেক মানুষ বদলে গেছে) এই সিদ্ধান্ত পুনরায় ন্যায্যতা প্রমাণ করার প্রয়োজন পড়ে না, আর কেউ ভুল করে "সবকিছু একসাথে মাইক্রোসার্ভিস করি" বলে আগের সুচিন্তিত সীমানা ভেঙে ফেলে না।</div>

<h3>বাস্তবতা — বেশিরভাগ বড় কোম্পানি বিশুদ্ধ কোনো একটা Style-এ নেই</h3>
<p>পাঠ্যবইয়ের ডায়াগ্রামে যেমন দেখানো হয়, বাস্তবে প্রায় কোনো বড় প্রতিষ্ঠানের সিস্টেমই "বিশুদ্ধ মাইক্রোসার্ভিস" বা "বিশুদ্ধ মনোলিথ" না। একটা টিপিক্যাল বড় সিস্টেমে একসাথে দেখা যায় — একটা core modular monolith (বেশিরভাগ ব্যবসায়িক লজিক), তার পাশে হাতে গোনা কয়েকটা প্রকৃতপক্ষে extract করা microservice (যেগুলোর সত্যিই স্বাধীন scaling প্রমাণিত হয়েছে), একটা event-driven layer কিছু নির্দিষ্ট cross-cutting flow-এর জন্য (notification, analytics), হয়তো একটা space-based component একটা নির্দিষ্ট high-burst ফিচারের জন্য (flash sale), আর কিছু serverless function ছোট, স্বল্প-ফ্রিকোয়েন্সি টাস্কের জন্য (scheduled report, webhook handler)। এই হাইব্রিড বাস্তবতা কোনো ব্যর্থতা না — এটাই পরিণত আর্কিটেকচারাল চিন্তার লক্ষণ, যেখানে প্রতিটা style তার সবচেয়ে উপযুক্ত জায়গায় প্রয়োগ করা হয়েছে, কোনো একটা "সিলভার বুলেট" সবকিছুতে চাপিয়ে দেওয়া হয়নি।</p>

প্রথম অধ্যায়ে যা বলা হয়েছিল তা এই শেষ অধ্যায়ে পুনরাবৃত্তি করার মতোই গুরুত্বপূর্ণ — Netflix বা Uber-এর আর্কিটেকচার বছরের পর বছর evolution আর বিপুল অপারেশনাল বিনিয়োগের ফলাফল। এই কোর্সের প্রতিটা style আলাদা আলাদা trade-off বহন করে, আর "কোনটা সঠিক" প্রশ্নের উত্তর সবসময় নির্ভর করবে আপনার নিজের টিম, নিজের স্কেল, আর নিজের constraint-এর উপর — অন্য কারও গল্পের উপর না।</div>

<h2 class="title">১৭. Interview প্রশ্নোত্তর</h2>
<p class="lead">আর্কিটেকচার ইন্টারভিউতে বারবার আসা প্রশ্ন — প্রতিটা আগের চ্যাপ্টারের রেফারেন্স দিয়ে।</p>

<h3>১) একটা low-level design সিদ্ধান্ত আর একটা architectural সিদ্ধান্তের মধ্যে পার্থক্য কীভাবে করবেন?</h3>
<p><b>উত্তর:</b> ১ নম্বর অধ্যায়ে দেখা মূল টেস্ট হলো <span class="kw">reversibility</span> — সিদ্ধান্তটা বদলাতে কয়টা টিম, কয়টা সার্ভিস, আর কতগুলো প্রোডাকশন ডেটাসেট ছুঁতে হবে। ভ্যারিয়েবলের নাম বদলানো বা একটা algorithm পাল্টানো একটা ফাইলের মধ্যেই সীমাবদ্ধ থাকে — এটা low-level design। কিন্তু সার্ভিসের সংখ্যা, primary data store, বা communication pattern (sync/async) বদলাতে হলে গোটা কোডবেস, deployment pipeline, আর লাইভ ডেটা জড়িয়ে যায় — এটা architectural সিদ্ধান্ত, আর এই ধরনের সিদ্ধান্তে ভুল হলে "Cost of Change Curve" অনুযায়ী পরে ঠিক করার খরচ exponentially বেড়ে যায়।</p>

<h3>২) দুইটা quality attribute একে অপরের বিপরীতে থাকলে (যেমন consistency বনাম availability) কীভাবে সিদ্ধান্ত নেবেন?</h3>
<p><b>উত্তর:</b> ২ নম্বর অধ্যায়ে দেখা ATAM চিন্তাভাবনা অনুযায়ী, প্রথমে বুঝতে হবে এই নির্দিষ্ট সিস্টেমের জন্য কোন attribute non-negotiable আর কোনটাতে ছাড় দেওয়া যাবে — এই সিদ্ধান্ত ব্যবসার প্রেক্ষাপট থেকে আসা উচিত, প্রযুক্তিগত পছন্দ থেকে না। একটা ব্যাংকিং লেজারে consistency জেতে (ভুল ব্যালেন্স বিপর্যয়কর), কিন্তু একটা সোশ্যাল ফিডে availability জেতে (কয়েক সেকেন্ড stale ডেটা কেউ খেয়াল করবে না, কিন্তু ধীর লোড ইউজার হারায়)। কোনো একটা "সঠিক" উত্তর নেই — শুধু একটা সচেতন, ব্যাখ্যাযোগ্য অগ্রাধিকার আছে।</p>

<h3>৩) Layered Architecture-এ "layer skipping" কী, আর এটা কেন বিপজ্জনক?</h3>
<p><b>উত্তর:</b> ৩ নম্বর অধ্যায়ে দেখা এই অ্যান্টি-প্যাটার্নে presentation layer সরাসরি data access layer-কে কল করে ফেলে, business logic layer বাইপাস করে — সাধারণত "এটা তো শুধু একটা সহজ read" যুক্তিতে। সমস্যা হলো এই শর্টকাট থামানো কঠিন হয়ে যায়, আর ধীরে ধীরে ব্যবসায়িক নিয়ম (authorization check, soft-delete filter) কিছু path-এ থাকে, কিছুতে না — কোন read কোন rule মেনে চলছে তা ট্র্যাক করা অসম্ভব হয়ে যায়।</p>

<h3>৪) Thick client-এ কেন security-critical validation রাখা উচিত না?</h3>
<p><b>উত্তর:</b> ৪ নম্বর অধ্যায়ে দেখা মূল কারণ — client-সাইড কোড ব্যবহারকারীর নিয়ন্ত্রণে থাকা একটা device-এ চলে, তাই সেখানে থাকা যেকোনো validation বা authorization logic browser devtools দিয়ে বা modified request পাঠিয়ে bypass করা সম্ভব। ক্লায়েন্ট-সাইড validation ভালো UX দেয় (তাৎক্ষণিক feedback), কিন্তু server-কে সবসময় সেই একই validation স্বাধীনভাবে আবার করতে হবে — client-কে বিশ্বাস না করে।</p>

<h3>৫) "Monolith" আর "Big Ball of Mud" কি সমার্থক শব্দ?</h3>
<p><b>উত্তর:</b> না — ৫ নম্বর অধ্যায়ে দেখা এই একটা গুরুত্বপূর্ণ পার্থক্য। Monolith মানে শুধু একটামাত্র deployment ইউনিট। "Big Ball of Mud" মানে কোডের ভেতরে কোনো discipline বা boundary নেই, যেকোনো ফাইল যেকোনো ফাইলকে সরাসরি কল করতে পারে। একটা monolith সুশৃঙ্খল internal module boundary নিয়েও বানানো যায় (Modular Monolith), অথবা সম্পূর্ণ বিশৃঙ্খলভাবেও বানানো যায় — সমস্যাটা deployment ইউনিট একটা হওয়া না, সমস্যা হলো internal discipline-এর অভাব।</p>

<h3>৬) একটা Modular Monolith-এ module boundary কীভাবে বলবৎ করা হয়, শুধু নিয়ম লিখে রাখলে কী সমস্যা হয়?</h3>
<p><b>উত্তর:</b> ৬ নম্বর অধ্যায়ে দেখা মূল সমস্যা — অলিখিত নিয়ম ("আমরা module-এর ভেতরে ঢুকব না") ডেডলাইনের চাপে ভেঙে পড়ে, একজন একটা shortcut নেয় আর সেটা precedent হয়ে যায়। সমাধান হলো boundary-কে বিল্ড-টাইমে automated enforcement দিয়ে বলবৎ করা — ভাষাগত visibility (Java package-private, .NET internal) অথবা ArchUnit/dependency-cruiser-এর মতো architecture test দিয়ে, যা violation হলে CI pipeline-এ বিল্ড ব্যর্থ করে দেয়।</p>

<h3>৭) SOA-তে Enterprise Service Bus (ESB) কেন নিজেই একটা bottleneck হয়ে দাঁড়ায়?</h3>
<p><b>উত্তর:</b> ৭ নম্বর অধ্যায়ে দেখা কারণ — routing, transformation, আর orchestration-এর সব জ্ঞান ESB-এর ভেতরে কেন্দ্রীভূত থাকত, যা একটা আলাদা, বিশেষায়িত টিম পরিচালনা করত। প্রতিটা টিমের প্রতিটা পরিবর্তনের অনুরোধ এই একই টিমের কাছে গিয়ে জমা হতো — এই একটা টিমের ক্যাপাসিটিই পুরো প্রতিষ্ঠানের ডেলিভারি গতির সিলিং হয়ে দাঁড়াত, ঠিক সেই সমন্বয়-বাধা যা SOA সার্ভিস-স্তরে সমাধান করতে চেয়েছিল তা ইন্টিগ্রেশন-স্তরে পুনরায় তৈরি হতো।</p>

<h3>৮) Monolith থেকে Microservices-এ যাওয়ার সিদ্ধান্ত কোন signal-এর ভিত্তিতে নেওয়া উচিত?</h3>
<p><b>উত্তর:</b> ৮ ও ১৬ নম্বর অধ্যায়ে দেখা মূল কথা — এই সিদ্ধান্ত অনুমান থেকে না, প্রমাণিত প্রয়োজন থেকে আসা উচিত। তিনটা concrete signal দেখা যায়: (১) একটা নির্দিষ্ট module-এর scaling চাহিদা বাকি সিস্টেম থেকে স্পষ্টভাবে ভিন্ন; (২) একাধিক টিম একই কোডবেসে কাজ করে merge conflict-এ আটকে যাচ্ছে, আর টিম-বিভাজন ইতিমধ্যে স্পষ্ট business domain অনুযায়ী; (৩) একটা module-এর reliability/release cadence চাহিদা বাকিদের থেকে আলাদা। এই signal ছাড়া শুধু "microservices আধুনিক" ভেবে split করলে distributed monolith-এ পরিণত হওয়ার ঝুঁকি থাকে।</p>

<h3>৯) Conway's Law কী, আর এটা কীভাবে "distributed monolith" তৈরি করে?</h3>
<p><b>উত্তর:</b> ৮ নম্বর অধ্যায়ে দেখা Conway's Law বলে, একটা সংগঠন যে সিস্টেম ডিজাইন করে তা অনিবার্যভাবে সেই সংগঠনের যোগাযোগ-কাঠামোর প্রতিলিপি হয়ে দাঁড়ায়। যদি টিম-কাঠামো এখনো কেন্দ্রীভূত/coupled থাকে (সবাইকে সবসময় একে অপরের সাথে সমন্বয় করতে হয়), সেই একই সংগঠন microservices split করলেও সার্ভিসগুলো একে অপরের সাথে ঘনিষ্ঠভাবে জড়িয়ে থাকে — ফলাফল একটা distributed monolith, যেখানে network hop-এর latency ও অপারেশনাল জটিলতা যোগ হয়, কিন্তু স্বাধীন deployability-র সুবিধা পাওয়া যায় না।</p>

<h3>১০) Event-Driven Architecture একটা সিস্টেমকে ডিবাগ করা কঠিন করে তোলে কেন, এবং এটা কীভাবে সামলানো হয়?</h3>
<p><b>উত্তর:</b> Synchronous call chain-এ একটা request কোন পথে গিয়েছে তা একটামাত্র stack trace থেকেই বোঝা যায়। কিন্তু ৯ নম্বর অধ্যায়ে দেখা Event-Driven সিস্টেমে একটা event publish হওয়ার পর producer জানেও না কোন consumer কখন সেটা প্রসেস করবে — একটা bug রিপোর্ট এলে একাধিক service-এর আলাদা log একসাথে মেলাতে হয়। সমাধান হলো প্রতিটা event-এর সাথে একটা <code>correlation ID</code> প্রতিটা event/request-এর সাথে propagate করা এবং centralized distributed tracing tool (Jaeger, Zipkin) ব্যবহার করা।</p>

<h3>১১) Choreography আর Orchestration-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> ৯ নম্বর অধ্যায়ে দেখা — Choreography-তে কোনো কেন্দ্রীয় নিয়ন্ত্রক নেই, প্রতিটা service নিজের event শুনে নিজের কাজ করে পরের event publish করে; পুরো flow emergent, decoupling বেশি কিন্তু বোঝা কঠিন। Orchestration-এ একটা কেন্দ্রীয় orchestrator প্রতিটা ধাপ স্পষ্টভাবে নির্দেশ দেয় ও ক্রম নিয়ন্ত্রণ করে — বুঝতে সহজ, error-handling কেন্দ্রীভূত, কিন্তু orchestrator নিজে একটা কেন্দ্রীয় নির্ভরতা হয়ে দাঁড়ায়।</p>

<h3>১২) Ports & Adapters প্যাটার্নে কেন ইন্টারফেসটা domain layer-এ সংজ্ঞায়িত হয়, infrastructure layer-এ না?</h3>
<p><b>উত্তর:</b> ১০ নম্বর অধ্যায়ে দেখা মূল কারণ — এটাই Dependency Inversion Principle-এর architectural প্রয়োগ। যদি <code>OrderRepository</code> ইন্টারফেসটা infrastructure layer-এ ডিফাইন করা হতো, ডোমেইন কোডকে সেই infrastructure প্যাকেজ ইমপোর্ট করতে হতো, অর্থাৎ dependency বাইরের দিকে যেত — The Dependency Rule ভেঙে যেত। ইন্টারফেসের মালিকানা domain-এর হাতে রাখাই নিশ্চিত করে dependency সবসময় ভেতরের দিকে থাকে, আর একটা fake/in-memory adapter বসিয়ে domain logic কে ডেটাবেস-মুক্তভাবে টেস্ট করা যায়।</p>

<h3>১৩) Pipe-and-Filter আর্কিটেকচারে "backpressure" কেন জরুরি, বিশেষ করে streaming variant-এ?</h3>
<p><b>উত্তর:</b> ১১ নম্বর অধ্যায়ে দেখা কারণ — যদি একটা ডাউনস্ট্রিম filter আপস্ট্রিম filter-এর চেয়ে ধীরে ডেটা প্রসেস করে, আউটপুট বাফারে জমতে থাকে, আর সেই বাফার সসীম মেমরিতে চলা একটা প্রসেসকে একসময় আউট-অফ-মেমরি করে ফেলবে। Backpressure একটা মেকানিজম যাতে ধীর filter আপস্ট্রিমকে সংকেত দিতে পারে "একটু ধীরে দাও" — batch pipeline-এ এই সমস্যা কম গুরুত্বপূর্ণ (জব শেষ হতে দেরি হয় মাত্র), কিন্তু অবিরাম চলা streaming pipeline-এ এটা ছাড়া সিস্টেম ক্র্যাশ করবে।</p>

<h3>১৪) Space-Based Architecture কেন সাধারণ CRUD অ্যাপ্লিকেশনের জন্য উপযুক্ত না?</h3>
<p><b>উত্তর:</b> ১২ নম্বর অধ্যায়ে দেখা কারণ — এই প্যাটার্নের মূল্য আসে এমন পরিস্থিতিতে যেখানে ট্র্যাফিক extreme ও bursty (ফ্ল্যাশ সেল, টিকিট বিক্রি) এবং একটা কেন্দ্রীয় database প্রকৃতই ভেঙে পড়ার ঝুঁকিতে থাকে। একটা সাধারণ, predictable ট্র্যাফিকের CRUD অ্যাপ্লিকেশনে distributed in-memory data grid চালানোর অতিরিক্ত অপারেশনাল জটিলতা আর eventual consistency-র ঝুঁকি কোনো বাস্তব সুবিধা দেয় না — একটা সাধারণ database-কেন্দ্রিক আর্কিটেকচার সহজ ও যথেষ্ট।</p>

<h3>১৫) P2P সিস্টেমে বেশি peer যোগ দিলে throughput কমার বদলে বাড়ে কেন?</h3>
<p><b>উত্তর:</b> ১৩ নম্বর অধ্যায়ে দেখা কারণ — প্রচলিত client-server মডেলে বেশি client মানে একটা নির্দিষ্ট server-এর রিসোর্সের ওপর বেশি চাপ। কিন্তু BitTorrent-এর মতো P2P সিস্টেমে প্রতিটা নতুন peer শুধু চাহিদা যোগ করে না, নিজের upload bandwidth-ও নেটওয়ার্কে যোগ করে — তাই সামগ্রিক ক্যাপাসিটি চাহিদার সাথে সাথেই বাড়তে থাকে, এটাই P2P-এর সবচেয়ে বড় স্ট্রাকচারাল সুবিধা।</p>

<h3>১৬) Serverless-এ "cold start" কী, আর কোন ধরনের workload-এ এটা সবচেয়ে বেশি সমস্যা করে?</h3>
<p><b>উত্তর:</b> ১৪ নম্বর অধ্যায়ে দেখা — যেহেতু idle থাকা অবস্থায় কোনো function instance চলমান থাকে না, একটা নতুন invocation এলে প্ল্যাটফর্মকে প্রথমে একটা নতুন execution environment তৈরি করতে হয় (কনটেইনার বুট, runtime initialize) — এই বিলম্বই cold start। এটা সবচেয়ে বেশি সমস্যা করে latency-sensitive, ক্রমাগত-চালু workload-এ (উচ্চ-ট্রাফিক API-র p99 latency), কিন্তু স্পাইকি বা বিরল-ফ্রিকোয়েন্সি workload-এ এই খরচ cost efficiency-র বিনিময়ে গ্রহণযোগ্য।</p>

<h3>১৭) C4 Model-এ Level ৪ (Code diagram) হাতে আঁকা কেন অপচয় বলে বিবেচিত হয়?</h3>
<p><b>উত্তর:</b> ১৫ নম্বর অধ্যায়ে দেখা কারণ — class-level diagram সবচেয়ে দ্রুত stale হয়ে যায়, একটা রিফ্যাক্টরেই ভুল হয়ে যেতে পারে। যেহেতু এই তথ্য কোডেই সম্পূর্ণভাবে বিদ্যমান, আধুনিক IDE সরাসরি বাস্তব কোড থেকে on-demand class diagram জেনারেট করতে পারে — তাই বেশিরভাগ টিম Level ৩ (Component) পর্যন্ত হাতে বানায়, Level ৪ প্রয়োজনে টুল দিয়ে জেনারেট করে নেয়।</p>

<h3>১৮) একটা ADR-এ "Status" ফিল্ড কেন গুরুত্বপূর্ণ?</h3>
<p><b>উত্তর:</b> ১৫ নম্বর অধ্যায়ে দেখা কারণ — একটা ADR স্থায়ী সত্য না, এটা proposed থেকে accepted হতে পারে, পরে deprecated হতে পারে, বা নতুন কোনো ADR এসে সেটাকে superseded করতে পারে। এই status-চেইনটাই আর্কিটেকচারের evolution-এর একটা readable ইতিহাস তৈরি করে — কেউ একটা পুরনো ADR পড়ে বুঝতে পারেন এটা এখনও বলবৎ কিনা, আর বলবৎ না হলে কোন নতুন ADR সেটা replace করেছে।</p>

<h3>১৯) "Strangler Fig" migration pattern কী, আর এটা "বিগ ব্যাং rewrite"-এর চেয়ে কেন নিরাপদ?</h3>
<p><b>উত্তর:</b> ১৬ নম্বর অধ্যায়ে দেখা এই পদ্ধতিতে একটা module ধাপে ধাপে বের করে আনা হয় — প্রথমে boundary perfect করা, তারপর আলাদা database প্রস্তুত করে dual-write/event দিয়ে sync করা, এরপর ট্র্যাফিকের একটা অংশ নতুন সার্ভিসে রুট করে যাচাই করা, সবশেষে পুরনো কোড সরানো। প্রতিটা ধাপে সিস্টেম সচল থাকে এবং সমস্যা হলে আগের ধাপে ফিরে যাওয়া সম্ভব — একটা বিগ ব্যাং rewrite-এ মাসের পর মাস কাজ করার পর একদিনে সব সুইচ করতে হয়, ব্যর্থ হলে ফিরে যাওয়ার পথ প্রায়ই থাকে না।</p>

<h3>২০) একজন ইন্টারভিউয়ার যদি জিজ্ঞাসা করেন "আপনি কোন আর্কিটেকচার বেছে নেবেন?", সবচেয়ে ভালো উত্তরের কাঠামো কী?</h3>
<p><b>উত্তর:</b> সবচেয়ে দুর্বল উত্তর একটা নির্দিষ্ট style-এর নাম বলে থেমে যাওয়া। সবচেয়ে শক্তিশালী উত্তরের কাঠামো (২ ও ১৬ নম্বর অধ্যায়ে দেখা) হলো — প্রথমে স্পষ্ট করা কোন quality attribute এই সিস্টেমের জন্য সবচেয়ে গুরুত্বপূর্ণ (এবং কেন), তারপর সেই অগ্রাধিকারের সাথে কোন style সবচেয়ে ভালো মেলে তা বলা, এবং সবশেষে স্বীকার করা এই সিদ্ধান্তে কী ছাড় দেওয়া হচ্ছে ও ভবিষ্যতে কোন signal দেখলে সিদ্ধান্ত পুনর্বিবেচনা করা হবে। এই কাঠামোটাই দেখায় যে আপনি একটা মুখস্থ উত্তর দিচ্ছেন না, বরং সত্যিকারের trade-off reasoning করছেন — এবং শেষ পর্যন্ত এটাই এই পুরো কোর্সের কেন্দ্রীয় শিক্ষা।</p>
</template>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
