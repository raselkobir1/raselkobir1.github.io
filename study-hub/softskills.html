<h2 class="title">১. Soft Skills কী, কেন গুরুত্বপূর্ণ এবং Hard Skills বনাম Soft Skills</h2>
<p class="lead">একজন ইঞ্জিনিয়ারের ক্যারিয়ার একটা নির্দিষ্ট পর্যায়ের পরে আর শুধু কোড লেখার দক্ষতা দিয়ে এগোয় না — এগোয় তিনি কতটা স্পষ্টভাবে বোঝাতে পারেন, কতটা ভালোভাবে অন্যের সাথে কাজ করতে পারেন, এবং কতটা বিশ্বাস অর্জন করতে পারেন তার ওপর।</p>

<h3>Hard Skills বনাম Soft Skills</h3>
<p><span class="kw">Hard Skills</span> হলো measurable, teachable, নির্দিষ্ট টুল বা টেকনিক-ভিত্তিক দক্ষতা — যেমন C#, SQL, Docker, System Design। এগুলো একটা সার্টিফিকেট বা টেস্ট দিয়ে যাচাই করা যায়। <span class="kw">Soft Skills</span> হলো মানুষের সাথে কাজ করার, চিন্তা প্রকাশ করার, এবং সিদ্ধান্ত নেওয়ার দক্ষতা — যেমন Communication, Emotional Intelligence, Negotiation, Time Management। এগুলো পরিমাপ করা কঠিন কিন্তু প্রভাব বিশাল — একটা দুর্দান্ত সমাধান যদি ঠিকভাবে যোগাযোগ করা না যায়, সেটা কখনও বাস্তবায়িত হয় না।</p>

<h3>কেন সিনিয়র লেভেলে Soft Skills বেশি গুরুত্বপূর্ণ হয়ে ওঠে</h3>
<p>ক্যারিয়ারের শুরুতে একজন ইঞ্জিনিয়ারের কাজ মূলত ব্যক্তিগত — একটা টিকিট নেওয়া, কোড লেখা, টেস্ট পাস করানো। কিন্তু সিনিয়রিটি বাড়ার সাথে সাথে কাজের প্রকৃতি বদলে যায় — এখন কাজ হয়ে ওঠে অন্যদের প্রভাবিত করা, সঠিক সিদ্ধান্তে পৌঁছাতে সাহায্য করা, এবং টিমকে align রাখা। এই রূপান্তরে hard skills প্রয়োজনীয় থাকে কিন্তু আর যথেষ্ট থাকে না।</p>
<table>

</table>

<h3>Soft Skills-এর মূল ক্যাটাগরি — এই কোর্সের ম্যাপ</h3>
<ul>
<li><b>Communication:</b> স্পষ্টভাবে বোঝানো ও শোনা — ২য়-৪র্থ অধ্যায়ে বিস্তারিত।</li>
<li><b>Emotional Intelligence:</b> নিজেকে ও অন্যকে বোঝা — ৫ম অধ্যায়ে।</li>
<li><b>Teamwork ও Feedback:</b> একসাথে কাজ করা, মতপার্থক্য সামলানো — ৬ষ্ঠ-৭ম অধ্যায়ে।</li>
<li><b>Time Management:</b> সময় ও অগ্রাধিকার নিয়ন্ত্রণ — ৮ম অধ্যায়ে।</li>
<li><b>Interview Skills:</b> নিজেকে উপস্থাপন করা — ৯ম-১১শ অধ্যায়ে।</li>
<li><b>Negotiation:</b> নিজের মূল্য আদায় করা — ১২শ-১৩শ অধ্যায়ে।</li>
<li><b>Networking ও Career Growth:</b> দীর্ঘমেয়াদী ক্যারিয়ার নির্মাণ — ১৪শ-১৫শ অধ্যায়ে।</li>
</ul>

<div class="callout mistake"><span class="tag">Common mistake — "আমার কোড নিজেই কথা বলে" ভাবা</span>
অনেক ইঞ্জিনিয়ার মনে করেন প্রযুক্তিগত দক্ষতা যথেষ্ট, এবং কমিউনিকেশন বা রিলেশনশিপ-বিল্ডিং সময় নষ্ট। বাস্তবে একটা চমৎকার প্রযুক্তিগত সিদ্ধান্ত যদি stakeholder-দের বোঝানো না যায়, সেটা approve হয় না, বাস্তবায়িত হয় না, এবং কৃতিত্বও পাওয়া যায় না। Promotion committee কোড কোয়ালিটি না, impact এবং influence দেখে — আর influence আসে communication থেকে।</div>

<div class="callout why"><span class="tag">কেন Soft Skills-কে "practice" হিসেবে দেখা উচিত</span>
DSA বা System Design যেমন ইচ্ছাকৃত অনুশীলনের (deliberate practice) মাধ্যমে উন্নত হয়, Soft Skills-ও ঠিক তেমনই — এটা জন্মগত ব্যক্তিত্বের বিষয় না, বরং শেখা যায় এমন একটা দক্ষতাসেট। এই কোর্সের প্রতিটা অধ্যায়কে একটা framework হিসেবে দেখুন, যা বাস্তব পরিস্থিতিতে সচেতনভাবে প্রয়োগ করে অনুশীলন করতে হবে।</div>

<div class="callout best"><span class="tag">Best practice — প্রতিটা মিটিং/কনভারসেশনকে একটা অনুশীলনের সুযোগ হিসেবে দেখুন</span>
প্রতিটা স্ট্যান্ডআপ, কোড রিভিউ কমেন্ট, বা ইন্টারভিউ প্রস্তুতি একটা সুযোগ এই কোর্সে শেখা টেকনিকগুলো প্রয়োগ করার। ছোট ছোট, নিয়মিত অনুশীলনই বড় পরিবর্তন আনে — একটা একক "নিখুঁত" চেষ্টার চেয়ে।</div>

<template data-page="communication-basics">
<h2 class="title">২. Communication Fundamentals — Active Listening, Clarity ও Non-verbal Communication</h2>
<p class="lead">যোগাযোগ শুধু কথা বলা না — এটা এমনভাবে বার্তা পাঠানো যাতে অন্যপক্ষ ঠিক সেটাই বোঝে যা আপনি বোঝাতে চেয়েছেন।</p>

<h3>Communication Model — Sender, Message, Channel, Receiver, Feedback</h3>
<p>যেকোনো যোগাযোগে পাঁচটা উপাদান থাকে — একজন <b>sender</b> যিনি একটা <b>message</b> তৈরি করেন, একটা <b>channel</b> (মুখে, লিখিত, ভিডিও কল) দিয়ে পাঠান, একজন <b>receiver</b> সেটা গ্রহণ করেন এবং নিজের মতো ব্যাখ্যা করেন, এবং তারপর <b>feedback</b> দিয়ে নিশ্চিত করেন তিনি ঠিক বুঝেছেন কি না। বেশিরভাগ যোগাযোগ ব্যর্থতা ঘটে কারণ sender ধরে নেন receiver ঠিক তার মতোই বুঝবেন — অথচ receiver-এর প্রেক্ষাপট, পূর্ব-জ্ঞান, এবং মনোযোগ সম্পূর্ণ ভিন্ন হতে পারে।</p>

<div class="diagram"><pre>
  [Sender]  ──message──▶  [Channel]  ──▶  [Receiver]
     ▲                                        │
     │                                        │
     └───────────── feedback ─────────────────┘

  ভুল বোঝাবুঝি এড়াতে feedback loop বন্ধ করা আবশ্যক —
  "বুঝেছেন?" জিজ্ঞেস করার বদলে receiver-কে নিজের ভাষায় repeat করতে বলা ভালো।
</pre></div>

<h3>Active Listening — শুধু শোনা না, বোঝার জন্য শোনা</h3>
<p><span class="kw">Active Listening</span> মানে পরবর্তী কী বলবেন তা চিন্তা করার বদলে সম্পূর্ণ মনোযোগ দিয়ে অন্যপক্ষের কথা শোনা। এর কয়েকটা মূল কৌশল —</p>
<ul>
<li><b>Paraphrasing:</b> অন্যপক্ষ কথা শেষ করার পর নিজের ভাষায় সংক্ষেপে বলা "তার মানে আপনি বলছেন..." — এতে ভুল বোঝাবুঝি সাথে সাথে ধরা পড়ে।</li>
<li><b>মাঝপথে না থামানো:</b> কেউ কথা বলার সময় বাধা দেওয়া মানে হলো তার চিন্তা সম্পূর্ণভাবে না শোনাই সিদ্ধান্ত নেওয়া।</li>
<li><b>Clarifying Questions:</b> অস্পষ্ট থাকলে অনুমান না করে সরাসরি জিজ্ঞেস করা — "আপনি বলতে চাইছেন X, নাকি Y?"</li>
<li><b>Body Language দিয়ে সাড়া দেওয়া:</b> মাথা নাড়ানো, চোখে চোখ রাখা — যা দেখায় আপনি সত্যিই শুনছেন।</li>
</ul>

<h3>Clarity ও Conciseness — কম শব্দে বেশি বোঝানো</h3>
<p>প্রযুক্তিগত আলোচনায় সবচেয়ে সাধারণ সমস্যা হলো অতিরিক্ত বিস্তারিত দিয়ে মূল বিষয় হারিয়ে ফেলা। <span class="kw">BLUF (Bottom Line Up Front)</span> নীতি — আগে সিদ্ধান্ত/উপসংহার বলুন, তারপর প্রয়োজনে বিস্তারিত ব্যাখ্যা দিন। এটা বিশেষভাবে গুরুত্বপূর্ণ যখন শ্রোতা ব্যস্ত (ম্যানেজার, stakeholder) — তারা প্রথম বাক্যেই জানতে চান "কী সিদ্ধান্ত নিতে হবে" বা "কী করতে হবে", পুরো প্রেক্ষাপট পরে।</p>

<h3>Non-verbal Communication ও Tone</h3>
<p>শব্দের বাইরেও অনেক কিছু বার্তা বহন করে — <b>tone of voice</b> (একই বাক্য উষ্ণ বা রুক্ষ শোনাতে পারে), <b>facial expression</b>, এবং <b>body language</b>। ভিডিও কলে ক্যামেরা বন্ধ রাখা বা স্ক্রিনে অন্য কিছু দেখা receiver-কে "মনোযোগ নেই" বার্তা দেয়, এমনকি অনিচ্ছাকৃতভাবেও। লিখিত যোগাযোগে (Slack, ইমেইল) tone হারিয়ে যাওয়ার ঝুঁকি বেশি — একটা সংক্ষিপ্ত বার্তা রুক্ষ মনে হতে পারে, যেখানে উদ্দেশ্য ছিল শুধু efficient হওয়া।</p>

<div class="callout mistake"><span class="tag">Common mistake — শোনার বদলে উত্তর প্রস্তুত করা</span>
মিটিং-এ অনেকে অন্যপক্ষ কথা বলার সময় নিজের পরবর্তী বক্তব্য নিয়ে চিন্তা করতে থাকেন, ফলে আসল কথাটাই মিস করে ফেলেন। এতে conversation টা দুটো সমান্তরাল মনোলগে পরিণত হয়, প্রকৃত সংলাপে না।</div>

<div class="callout best"><span class="tag">Best practice — লেখার আগে "আমার শ্রোতা কে, তার কী দরকার" ভাবুন</span>
যেকোনো বার্তা পাঠানোর আগে এক মুহূর্ত থেমে ভাবুন — এই বার্তা কে পড়বে, তাদের কতটা প্রেক্ষাপট আছে, এবং তারা ঠিক কী জানতে/করতে চাইবে। এই ছোট অভ্যাসটাই সবচেয়ে বেশি যোগাযোগ-দক্ষতা উন্নত করে।</div>

<h2 class="title">৩. Workplace Communication — Standup, Async Communication ও Documentation</h2>
<p class="lead">অফিসের যোগাযোগের নিজস্ব নিয়ম আছে — একটা স্ট্যান্ডআপ, একটা Slack মেসেজ, বা একটা কোড রিভিউ কমেন্ট ভুলভাবে করলে টিমের গতি কমে যায়, ঠিকভাবে করলে টিম দ্রুত এগোয়।</p>

<h3>Daily Standup — সংক্ষিপ্ত ও কার্যকর</h3>
<p>স্ট্যান্ডআপ status report না, এটা coordination টুল — মূল উদ্দেশ্য হলো টিমকে জানানো কে কী করছে এবং কার সাহায্য দরকার। একটা ভালো স্ট্যান্ডআপ আপডেট সংক্ষিপ্ত (৩০-৬০ সেকেন্ড) এবং তিনটা প্রশ্নে কেন্দ্রীভূত — গতকাল কী করলাম, আজ কী করব, এবং কোনো blocker আছে কি না। বিস্তারিত ডিবাগিং আলোচনা স্ট্যান্ডআপের পরে আলাদাভাবে করা উচিত ("parking lot")।</p>

<h3>Async Communication — Slack/Email Etiquette</h3>
<p>Distributed/remote টিমে বেশিরভাগ যোগাযোগ <span class="kw">asynchronous</span> — অর্থাৎ পাঠানোর সাথে সাথে উত্তর আশা করা যায় না। এতে কয়েকটা নীতি গুরুত্বপূর্ণ —</p>
<ul>
<li><b>স্ব-সম্পূর্ণ বার্তা লিখুন:</b> "একটা প্রশ্ন আছে?" এর বদলে সরাসরি পুরো প্রশ্নটা লিখুন — এতে receiver-কে "হ্যাঁ" বলার জন্য অপেক্ষা করতে হয় না, একটা রাউন্ড-ট্রিপ বেঁচে যায়।</li>
<li><b>প্রেক্ষাপট দিন:</b> "এটা ভাঙা" এর বদলে "প্রোডাকশনে checkout API ৫০০ error দিচ্ছে, লিংক: [log], শুরু হয়েছে আনুমানিক ১০টায়"।</li>
<li><b>Urgency স্পষ্ট করুন:</b> সবকিছু জরুরি মনে হলে receiver অগ্রাধিকার বুঝতে পারেন না — সত্যিই জরুরি হলে সরাসরি বলুন, নাহলে "জরুরি না, সুবিধামতো দেখুন" লিখুন।</li>
<li><b>টাইমজোন সম্মান করুন:</b> ভিন্ন টাইমজোনের সহকর্মীর কাছ থেকে তাৎক্ষণিক উত্তর প্রত্যাশা না করা।</li>
</ul>

<h3>Code Review-এ যোগাযোগ</h3>
<p>কোড রিভিউ কমেন্ট লেখার ধরন টিমের সংস্কৃতি নির্ধারণ করে। মন্তব্য যতটা সম্ভব ব্যক্তিকে না, কোডকে target করা উচিত ("এই ফাংশনে..." না "তুমি ভুল করেছ...")। প্রশ্ন আকারে মন্তব্য করলে (যেমন "এখানে null check দরকার নেই কি?") এটা আদেশের বদলে সংলাপের সুযোগ তৈরি করে। রিভিউ গ্রহণ করার সময়ও defensively react না করে প্রতিটা কমেন্টকে কোড ভালো করার সুযোগ হিসেবে দেখা উচিত।</p>

<h3>Documentation — লেখা একটা Force Multiplier</h3>
<p>একবার লেখা একটা ভালো README, Architecture Decision Record (ADR), বা runbook বারবার একই প্রশ্নের উত্তর দেওয়া থেকে বাঁচায় — এটা এক ধরনের "asynchronous মেন্টরিং" যা টিম স্কেল করার সাথে সাথে আরও মূল্যবান হয়ে ওঠে। ভালো ডকুমেন্টেশন "কী" এর চেয়ে "কেন" ব্যাখ্যা করে বেশি (কোড থেকেই "কী" বোঝা যায়)।</p>

<h2 class="title">৪. Public Speaking ও Presentation Skills</h2>
<p class="lead">একটা দুর্দান্ত প্রযুক্তিগত কাজও যদি আত্মবিশ্বাসের সাথে উপস্থাপন করা না যায়, তার প্রভাব হারিয়ে যায় — Public Speaking শেখা যায়, এটা জন্মগত প্রতিভা না।</p>

<h3>Stage Fear কাটিয়ে ওঠা</h3>
<p>নার্ভাসনেস সবারই হয় — অভিজ্ঞ বক্তারাও অনুভব করেন, পার্থক্য হলো তারা সেটা সামলাতে শিখেছেন। কয়েকটা কার্যকর কৌশল — পর্যাপ্ত <b>প্রস্তুতি ও অনুশীলন</b> (জোরে জোরে বলে অনুশীলন করা, শুধু মনে মনে না), প্রথম কয়েকটা বাক্য মুখস্থ রাখা (শুরুটা সবচেয়ে কঠিন), এবং নার্ভাসনেসকে "excitement" হিসেবে reframe করা (শারীরিক লক্ষণ একই, ব্যাখ্যা ভিন্ন)।</p>

<h3>একটা টক গঠন করা</h3>
<p>একটা কার্যকর উপস্থাপনার একটা সহজ কাঠামো থাকে — <b>Hook</b> (প্রথম ৩০ সেকেন্ডে মনোযোগ ধরা — একটা প্রশ্ন, একটা চমকপ্রদ তথ্য, বা একটা সমস্যা), <b>Body</b> (মূল বিষয়বস্তু, সাধারণত ৩টার বেশি মূল পয়েন্টে না রাখা — <span class="kw">Rule of Three</span>), এবং <b>Conclusion</b> (সংক্ষিপ্ত সারমর্ম ও clear call-to-action/next step)।</p>

<h3>Tech Talk ও Demo — বাস্তব ঝুঁকি ব্যবস্থাপনা</h3>

<h3>Self-awareness — প্রথম ধাপ</h3>
<p>নিজের আবেগীয় trigger চেনা EQ-এর ভিত্তি। যেমন, একজন ইঞ্জিনিয়ার হয়তো লক্ষ্য করেন যে তার কোড সমালোচিত হলে তিনি সাথে সাথে defensive হয়ে যান। এই প্যাটার্ন চেনা মানেই তা নিয়ন্ত্রণ করার প্রথম পদক্ষেপ — পরের বার সেই অনুভূতি এলে, প্রতিক্রিয়া জানানোর আগে একটা মুহূর্ত থামা যায়।</p>

<h3>Self-regulation — চাপের মধ্যে শান্ত থাকা</h3>
<p>প্রোডাকশন incident, কঠোর সমালোচনা, বা tight deadline-এর মতো উচ্চ-চাপের পরিস্থিতিতে আবেগ দ্রুত বিচার-বিবেচনাকে ছাপিয়ে যেতে পারে। কার্যকর কৌশল হলো প্রতিক্রিয়া জানানোর আগে একটা সংক্ষিপ্ত বিরতি নেওয়া (কয়েকটা গভীর শ্বাস, বা "আমাকে ৫ মিনিট ভাবতে দিন" বলা) — এতে impulsive প্রতিক্রিয়ার বদলে চিন্তাশীল প্রতিক্রিয়া সম্ভব হয়।</p>

<h3>Empathy — অন্যের দৃষ্টিকোণ থেকে দেখা</h3>
<p>Empathy মানে অন্যের সাথে একমত হওয়া না, বরং তাদের পরিস্থিতি ও অনুভূতি বোঝা। একজন প্রোডাক্ট ম্যানেজার একটা "সাধারণ" ফিচারের জন্য চাপ দিচ্ছেন কারণ তিনি একটা ক্লায়েন্ট commitment-এর চাপে আছেন — এই প্রেক্ষাপট বোঝা একটা কথোপকথনকে "না, এটা সম্ভব না" থেকে "চলুন একসাথে একটা বাস্তবসম্মত সময়সীমা খুঁজি" দিকে নিয়ে যেতে পারে।</p>

<div class="callout why"><span class="tag">কেন EQ ক্যারিয়ারের প্রভাবকে বহুগুণ করে</span>
উচ্চ IQ থাকা সত্ত্বেও কম EQ-সম্পন্ন একজন ইঞ্জিনিয়ার প্রায়ই "কঠিন মানুষ" হিসেবে পরিচিত হন — তার সমাধান সঠিক হলেও মানুষ তার সাথে কাজ করতে দ্বিধা বোধ করে। বিপরীতে, উচ্চ EQ একজন গড় প্রযুক্তিগত দক্ষতার ইঞ্জিনিয়ারকেও একটা বিশ্বস্ত, প্রভাবশালী টিম সদস্যে পরিণত করতে পারে, কারণ মানুষ তার সাথে কাজ করা সহজ মনে করে।</div>

<p>Google-এর <b>Project Aristotle</b> গবেষণায় দেখা গেছে, একটা হাই-পারফর্মিং টিমের সবচেয়ে গুরুত্বপূর্ণ বৈশিষ্ট্য হলো <span class="kw">Psychological Safety</span> — এমন একটা পরিবেশ যেখানে টিম সদস্যরা প্রশ্ন করতে, ভুল স্বীকার করতে, বা দ্বিমত পোষণ করতে ভয় পান না, উপহাস বা শাস্তির আশঙ্কা ছাড়াই। একটা টিম লিড হিসেবে (বা যেকোনো সদস্য হিসেবে) নিজের ভুল প্রকাশ্যে স্বীকার করা psychological safety তৈরির সবচেয়ে কার্যকর উপায়।</p>

<p class="lead">ফিডব্যাক দেওয়া এবং নেওয়া একটা দক্ষতা — ভুলভাবে করলে সম্পর্ক নষ্ট হয়, ঠিকভাবে করলে টিম দ্রুত উন্নতি করে।</p>

<h3>SBI মডেল — Situation, Behavior, Impact</h3>
<p>অস্পষ্ট ফিডব্যাক ("তুমি ভালো communicate করো না") অকার্যকর কারণ এটা actionable না। <span class="kw">SBI মডেল</span> ফিডব্যাককে নির্দিষ্ট করে — <b>Situation</b> (কখন, কোথায় ঘটেছে), <b>Behavior</b> (ঠিক কী করা হয়েছিল, পর্যবেক্ষণযোগ্য আচরণ, ব্যাখ্যা না), এবং <b>Impact</b> (তার ফলাফল কী হয়েছিল)। যেমন — "গতকালের ডিজাইন রিভিউতে (Situation), তুমি অন্যরা কথা শেষ করার আগেই তিনবার থামিয়ে দিয়েছ (Behavior), যার ফলে দুইজন টিম সদস্য পরে আর মতামত দেননি (Impact)।"</p>

<h3>Radical Candor — Care Personally + Challenge Directly</h3>
<p>Kim Scott-এর <span class="kw">Radical Candor</span> ফ্রেমওয়ার্ক দুইটা মাত্রায় ফিডব্যাককে ম্যাপ করে — আপনি ব্যক্তি হিসেবে কতটা যত্নশীল (Care Personally), এবং আপনি কতটা সরাসরি challenge করেন (Challenge Directly)। দুটোই একসাথে থাকলেই Radical Candor হয়; একটা বাদ দিলে সমস্যা হয়।</p>

<div class="diagram"><pre>
                     উচ্চ Challenge Directly
                            │
   Obnoxious Aggression     │      Radical Candor
   ("তুমি এটা ভুল করেছ,     │      ("আমি তোমার উন্নতি চাই,
    বোকার মতো")             │       তাই সরাসরি বলছি...")
                            │
  ──────────────────────────┼──────────────────────────  Care Personally →
                            │
   Manipulative Insincerity │      Ruinous Empathy
   (মিথ্যা প্রশংসা,          │      ("সব ঠিক আছে" বলা,
    পেছনে সমালোচনা)          │       আসল সমস্যা এড়িয়ে যাওয়া)
                            │
                     নিম্ন Challenge Directly
</pre></div>
<p>বেশিরভাগ ম্যানেজার/সহকর্মী অজান্তেই <b>Ruinous Empathy</b>-তে পড়ে যান — খারাপ লাগানোর ভয়ে সত্যিকারের সমস্যা এড়িয়ে যান, যা আসলে দীর্ঘমেয়াদে বেশি ক্ষতিকর, কারণ সমস্যা সমাধান হয় না।</p>

<h3>Feedback গ্রহণ করা</h3>
<p>ফিডব্যাক পাওয়ার সময় প্রথম প্রতিক্রিয়া প্রায়ই defensive হয়ে ওঠে। কার্যকর পদ্ধতি হলো — প্রথমে শুধু শোনা (৩য় অধ্যায়ের active listening), সাথে সাথে justify না করা, "ধন্যবাদ, এটা নিয়ে ভাবতে হবে" বলা, এবং পরে শান্ত মাথায় বিশ্লেষণ করা এটা সত্য কি না।</p>

<h3>কঠিন কথোপকথন পরিচালনা করা</h3>
<p>একটা কঠিন কথোপকথনের (যেমন একজন সহকর্মীর বারবার একই ভুল করা, বা একটা সিদ্ধান্তে দ্বিমত) আগে প্রস্তুতি গুরুত্বপূর্ণ — নির্দিষ্ট উদাহরণ (SBI) প্রস্তুত রাখা, ব্যক্তিগত আক্রমণ এড়িয়ে আচরণে ফোকাস করা, এবং একটা সমাধান-কেন্দ্রিক সুর রাখা ("আমরা কীভাবে এটা এগিয়ে নিতে পারি" — অভিযোগের বদলে)।</p>

<div class="callout mistake"><span class="tag">Common mistake — "Feedback Sandwich" এর ওপর অতিরিক্ত নির্ভরতা</span>
প্রশংসা-সমালোচনা-প্রশংসা কাঠামো (sandwich) মাঝে মাঝে কার্যকর হলেও, অতিরিক্ত ব্যবহারে receiver শিখে যায় যে "মাঝের অংশটাই" আসল বার্তা, ফলে শুরু ও শেষের প্রশংসা বিশ্বাসযোগ্যতা হারায়। সরাসরি কিন্তু যত্নশীল ভাষায় ফিডব্যাক দেওয়া বেশি কার্যকর।</div>

<div class="callout best"><span class="tag">Best practice — Feedback দিন সময়মতো, দেরি না করে</span>
একটা সমস্যা ঘটার সাথে সাথেই (বা দ্রুত পরে) ফিডব্যাক দিন। মাসের পর মাস জমিয়ে রেখে একটা annual review-এ একসাথে বলা receiver-কে অবাক ও রক্ষণাত্মক করে তোলে, কারণ তার সংশোধনের কোনো সুযোগ ছিল না।</div>
</template>

<h2 class="title">৮. Time Management, Prioritization ও Deep Work</h2>
<p class="lead">সময় একটা fixed resource — একে বাড়ানো যায় না, শুধু ভালোভাবে বরাদ্দ করা যায়।</p>

<h3>Eisenhower Matrix — Urgent বনাম Important</h3>
<p>প্রতিটা টাস্ককে দুইটা মাত্রায় ভাগ করা যায় — কতটা <b>জরুরি</b> (তাৎক্ষণিক মনোযোগ দরকার) এবং কতটা <b>গুরুত্বপূর্ণ</b> (দীর্ঘমেয়াদী লক্ষ্যের সাথে সম্পর্কিত)। বেশিরভাগ মানুষ ভুলবশত "জরুরি" টাস্কে সময় ব্যয় করেন, "গুরুত্বপূর্ণ কিন্তু জরুরি না" টাস্ক (যেমন technical debt কমানো, শেখা, রিলেশনশিপ বিল্ডিং) অবহেলিত থেকে যায়।</p>

</table>

<h3>Deep Work — গভীর মনোযোগের সময় রক্ষা করা</h3>
<p>Cal Newport-এর <span class="kw">Deep Work</span> ধারণা অনুযায়ী, জটিল প্রযুক্তিগত কাজ (ডিজাইন, ডিবাগিং, লেখা) মনোযোগহীনভাবে ছোট ছোট টুকরায় করা যায় না — এর জন্য নিরবচ্ছিন্ন, একনাগাড়ে সময় দরকার। প্রতিটা interruption (Slack notification, মিটিং) মনোযোগ পুনরায় ফিরে পেতে উল্লেখযোগ্য সময় নেয় ("context switching cost")। কার্যকর ইঞ্জিনিয়াররা ইচ্ছাকৃতভাবে notification বন্ধ রেখে, ক্যালেন্ডারে "Focus Time" ব্লক করে গভীর কাজের সময় রক্ষা করেন।</p>

<h3>না বলতে শেখা</h3>
<p>প্রতিটা অনুরোধে "হ্যাঁ" বলা scope creep এবং burnout-এর দিকে নিয়ে যায়। একটা যুক্তিসঙ্গত "না" (বা "এখন না, পরে") বলার দক্ষতা — বিশেষ করে trade-off স্পষ্ট করে ("আমি এটা করতে পারি, কিন্তু তাহলে X দেরি হবে") — একটা গুরুত্বপূর্ণ professional দক্ষতা, শুধু impolite মনে হওয়ার ভয়ে সবকিছুতে রাজি হওয়ার চেয়ে ভালো।</p>

<h3>Procrastination এড়ানো</h3>
<p>বড়, অস্পষ্ট টাস্ক প্রায়ই procrastination-এর কারণ হয় — মস্তিষ্ক "কোথা থেকে শুরু করব" বুঝতে না পেরে এড়িয়ে যায়। এটা কাটাতে টাস্ককে ছোট, নির্দিষ্ট, শুরু করা সহজ এমন ধাপে ভাগ করা কার্যকর (যেমন "ফিচার তৈরি করো" এর বদলে "প্রথম API endpoint-এর স্কিমা লিখি")।</p>

<div class="callout mistake"><span class="tag">Common mistake — Busy থাকা মানেই productive ভাবা</span>
সারাদিন মিটিং আর মেসেজে ব্যস্ত থাকা প্রায়ই প্রকৃত অগ্রগতির চেয়ে "ব্যস্ততার অনুভূতি" তৈরি করে। প্রকৃত productivity মাপা উচিত outcome দিয়ে (কী সম্পন্ন হলো), activity দিয়ে না (কতগুলো মিটিং করলাম)।</div>

<div class="callout best"><span class="tag">Best practice — দিনের শুরুতে সবচেয়ে গুরুত্বপূর্ণ কাজ প্রথমে করুন</span>
মানসিক শক্তি সাধারণত দিনের শুরুতে সবচেয়ে বেশি থাকে। ইমেইল/Slack চেক করে দিন শুরু করার বদলে, সেই সময়টা দিনের সবচেয়ে গুরুত্বপূর্ণ (এবং কঠিন) কাজে ব্যবহার করুন, রুটিন কাজ পরে করুন।</div>

<h3>Resume — Impact কে Quantify করা</h3>
<p>একটা কার্যকর resume দায়িত্ব তালিকা করে না, <b>impact</b> দেখায়। "API তৈরি করেছি" এর বদলে "একটা API তৈরি করেছি যা checkout latency ৪০% কমিয়েছে, যা মাসিক ৫০ হাজার ট্রানজেকশন সামলায়" — এভাবে সংখ্যা ও ফলাফল যোগ করা resume-কে অনেক বেশি বিশ্বাসযোগ্য করে তোলে। Buzzword-ভরা কিন্তু ফাঁপা বাক্য ("passionate team player", "results-driven") এড়িয়ে চলা উচিত — এগুলো কোনো তথ্য দেয় না।</p>

<h3>Company Research</h3>
<p>ইন্টারভিউর আগে কোম্পানির প্রোডাক্ট, সাম্প্রতিক সংবাদ, এবং টেক স্ট্যাক নিয়ে গবেষণা করা দুইটা কাজ করে — এটা দেখায় আপনি সত্যিই আগ্রহী, এবং এটা আপনাকে প্রাসঙ্গিক, চিন্তাশীল প্রশ্ন করার সুযোগ দেয় (ইন্টারভিউ শেষে "আপনার কোনো প্রশ্ন আছে?" — এই মুহূর্তটা কাজে লাগানো)।</p>

<h3>Mock Interview-এর মূল্য</h3>
<p>একা একা প্রস্তুতি নেওয়া এবং সত্যিকারের চাপের মধ্যে (একজন অচেনা মানুষের সামনে, সময়ের চাপে) কথা বলা সম্পূর্ণ ভিন্ন অভিজ্ঞতা। একজন বন্ধু বা মেন্টরের সাথে mock interview অনুশীলন করলে সেই চাপের পরিস্থিতিতে চিন্তাভাবনা প্রকাশ করার অভ্যাস তৈরি হয়, যা আসল ইন্টারভিউতে nervousness কমায়।</p>

<div class="callout mistake"><span class="tag">Common mistake — শুধু প্রযুক্তিগত প্রস্তুতি নেওয়া, কমিউনিকেশন অনুশীলন না করা</span>

<h3>সাধারণ Behavioral প্রশ্নের ক্যাটাগরি</h3>
<ul>

<li><b>Failure:</b> "একটা প্রজেক্ট ব্যর্থ হয়েছিল, কী শিখলেন।"</li>

<li><b>Ambiguity:</b> "অস্পষ্ট requirement নিয়ে কাজ করতে হয়েছিল এমন পরিস্থিতি।"</li>
<li><b>Prioritization:</b> "একসাথে একাধিক জরুরি কাজের মধ্যে অগ্রাধিকার ঠিক করেছিলেন।"</li>

<p class="lead">Negotiation একটা confrontation না — এটা একটা যৌথ সমস্যা সমাধান প্রক্রিয়া, যেখানে দুইপক্ষই একটা গ্রহণযোগ্য ফলাফল খুঁজছে।</p>

<h3>কেন ইঞ্জিনিয়াররা প্রায়ই কম Negotiate করেন</h3>
<p>অনেক ইঞ্জিনিয়ার negotiation-কে আক্রমণাত্মক বা লোভী মনে করেন, এবং প্রথম অফারই মেনে নেন। বাস্তবে বেশিরভাগ কোম্পানি প্রথম অফারে কিছুটা "নেগোশিয়েশন রুম" রেখেই দেয় — negotiate না করা মানে সেই সুযোগ স্বেচ্ছায় ছেড়ে দেওয়া। Negotiation একবার করলেই বেতনের ভিত্তি (base) বেড়ে যায়, যা প্রতিটা ভবিষ্যৎ raise ও bonus-এর হিসাবেও প্রভাব ফেলে (compounding effect)।</p>

<h3>BATNA — Best Alternative to a Negotiated Agreement</h3>
<p><span class="kw">BATNA</span> মানে হলো, যদি এই নির্দিষ্ট আলোচনা ব্যর্থ হয়, আপনার কাছে সবচেয়ে ভালো বিকল্প কী। একটা শক্তিশালী BATNA (যেমন হাতে আরেকটা অফার, বা বর্তমান চাকরিতে সন্তুষ্ট থাকা) আপনাকে আলোচনায় প্রকৃত ক্ষমতা দেয় — আপনি জানেন আপনি "যেকোনো শর্তে রাজি" হতে বাধ্য না। BATNA দুর্বল হলে (জরুরি ভাবে চাকরি দরকার) আলোচনার সুযোগ সীমিত হয়ে যায়, তাই সম্ভব হলে একাধিক বিকল্প তৈরি রাখা কৌশলগতভাবে গুরুত্বপূর্ণ।</p>

<h3>Anchoring Effect — কে প্রথমে সংখ্যা বলে</h3>
<p><span class="kw">Anchoring</span> একটা cognitive bias — আলোচনায় প্রথম উল্লেখিত সংখ্যা পরবর্তী পুরো আলোচনার একটা মানসিক রেফারেন্স পয়েন্ট হয়ে যায়, এমনকি যদি সেটা arbitrary হয়। সাধারণ নীতি হলো — যদি আপনার কাছে বাজার-গবেষণা ভালো থাকে এবং আপনি বেশি আশা করেন, প্রথমে সংখ্যা বলা সুবিধাজনক (উচ্চ anchor সেট করা)। কিন্তু আপনার কাছে পর্যাপ্ত তথ্য না থাকলে, নিয়োগকর্তাকে আগে range বলতে বলা নিরাপদ ("আপনাদের বাজেট রেঞ্জ কী?")।</p>

<h3>Research — আলোচনার আগে হোমওয়ার্ক</h3>
<p>Negotiation-এ leverage মূলত তথ্য থেকে আসে। আলোচনার আগে জানা উচিত — একই রোলের বাজার-বেতন রেঞ্জ (levels.fyi, Glassdoor-এর মতো সোর্স থেকে), কোম্পানির funding/financial অবস্থা, এবং নিজের unique value proposition (এমন কোনো দক্ষতা যা এই টিমের জন্য বিশেষভাবে মূল্যবান)।</p>

<p>একটা conference বা মিটআপে একবার কথা বলাই যথেষ্ট না — যোগাযোগের তথ্য বিনিময় করে পরবর্তীতে একটা সংক্ষিপ্ত ফলো-আপ বার্তা পাঠানো ("আজকের কথোপকথন উপভোগ করেছি, LinkedIn-এ সংযুক্ত হতে চাই") সেই মুহূর্তের পরিচয়কে একটা দীর্ঘমেয়াদী সংযোগে পরিণত করে।</p>

<h3>৩) BLUF (Bottom Line Up Front) নীতি কী, এবং কেন এটা কার্যকর?</h3>

<h3>৫) SBI ফিডব্যাক মডেলের তিনটা অংশ কী?</h3>

<h3>৬) Psychological Safety কী, এবং এটা কেন হাই-পারফর্মিং টিমের জন্য গুরুত্বপূর্ণ?</h3>
<p>Psychological Safety হলো এমন একটা পরিবেশ যেখানে টিম সদস্যরা ভুল স্বীকার করতে, প্রশ্ন করতে, বা দ্বিমত পোষণ করতে ভয় পান না। Google-এর Project Aristotle গবেষণা অনুযায়ী এটাই হাই-পারফর্মিং টিমের সবচেয়ে গুরুত্বপূর্ণ বৈশিষ্ট্য, কারণ এটা খোলামেলা যোগাযোগ ও দ্রুত শেখাকে সম্ভব করে।</p>

<h3>৭) Eisenhower Matrix কীভাবে কাজ করে?</h3>

<h3>৮) Deep Work কী, এবং কেন context switching ক্ষতিকর?</h3>
<p>Deep Work মানে নিরবচ্ছিন্ন, গভীর মনোযোগের সময় যা জটিল কাজের জন্য প্রয়োজন। প্রতিটা interruption মনোযোগ ফিরে পেতে উল্লেখযোগ্য সময় নেয় — তাই ঘন ঘন context switching সামগ্রিক productivity উল্লেখযোগ্যভাবে কমিয়ে দেয়, এমনকি কাজের সময় একই থাকলেও।</p>

<h3>৯) STAR method-এর চারটা অংশ কী, এবং কোন অংশে সবচেয়ে বেশি সময় দেওয়া উচিত?</h3>
<p>Situation, Task, Action, Result। Action অংশে সবচেয়ে বেশি সময় দেওয়া উচিত — কারণ ইন্টারভিউয়ার মূলত জানতে চান আপনি ঠিক কী সিদ্ধান্ত নিয়েছিলেন ও কী করেছিলেন, শুধু পরিস্থিতি না।</p>

<h3>১০) টেকনিক্যাল ইন্টারভিউতে নীরবে কোড লেখা কেন একটা ঝুঁকিপূর্ণ কৌশল?</h3>
<p>ইন্টারভিউয়ার শুধু সঠিক উত্তর না, চিন্তা প্রক্রিয়াও মূল্যায়ন করেন। নীরবে কোড লিখলে তারা ভুল দিকে গেলে গাইড করতে পারেন না, এবং আপনার সমস্যা-সমাধান পদ্ধতি সম্পর্কে কিছুই বুঝতে পারেন না — যা প্রায়ই "সঠিক উত্তর"-এর চেয়ে বেশি গুরুত্বপূর্ণ মূল্যায়ন বিষয়।</p>

<h3>১১) BATNA কী, এবং এটা negotiation-এ কীভাবে সাহায্য করে?</h3>
<p>BATNA (Best Alternative to a Negotiated Agreement) মানে আলোচনা ব্যর্থ হলে আপনার সবচেয়ে ভালো বিকল্প। একটা শক্তিশালী BATNA (যেমন আরেকটা অফার) আপনাকে আলোচনায় প্রকৃত ক্ষমতা দেয়, কারণ আপনি জানেন যেকোনো শর্তে রাজি হতে বাধ্য নন।</p>

<h3>১২) Anchoring effect কী, এবং salary আলোচনায় কে আগে সংখ্যা বলা উচিত?</h3>
<p>Anchoring মানে আলোচনায় প্রথম উল্লেখিত সংখ্যা একটা মানসিক রেফারেন্স পয়েন্ট হয়ে যাওয়া। ভালো বাজার-গবেষণা থাকলে প্রথমে সংখ্যা বলা (উচ্চ anchor সেট করা) সুবিধাজনক; পর্যাপ্ত তথ্য না থাকলে নিয়োগকর্তাকে আগে বলতে বলা নিরাপদ।</p>

<h3>১৩) বেতনের বাইরে আর কী কী নিয়ে negotiate করা যায়?</h3>
<p>Signing bonus, equity/stock, title, remote work/flexibility, start date, এবং vacation/PTO — এগুলোর প্রতিটাই কোম্পানির জন্য base salary-এর চেয়ে নমনীয় হতে পারে, বিশেষ করে budget band-এর সীমাবদ্ধতা থাকলে।</p>

<h3>১৪) "আপনার বর্তমান বেতন কত" প্রশ্নের ভালো উত্তর কী?</h3>
<p>সরাসরি সংখ্যা না দিয়ে ভবিষ্যতের বাজার-উপযুক্ত প্রত্যাশার দিকে কথা ফেরানো ভালো — "আমি বাজার-গবেষণা অনুযায়ী এই রোলের জন্য X-Y রেঞ্জ প্রত্যাশা করছি।" এটা negotiating leverage রক্ষা করে।</p>

<h3>১৫) কেন নেটওয়ার্কিং শুধু চাকরি খোঁজার সময় করলে কম কার্যকর হয়?</h3>
<p>সম্পর্ক তৈরি হতে সময় লাগে এবং বিশ্বাস আগে থেকেই থাকা দরকার। শুধু জরুরি প্রয়োজনের সময় যোগাযোগ করলে (বছরের পর বছর নীরব থেকে) তা অস্বস্তিকর এবং কম কার্যকর হয় — নেটওয়ার্কিং একটা চলমান, "give before you ask" অভ্যাস হওয়া উচিত।</p>

<h3>১৬) IC Track আর Management Track-এর মধ্যে পার্থক্য কী?</h3>
<p>IC (Individual Contributor) ট্র্যাক গভীর প্রযুক্তিগত নেতৃত্বের দিকে যায় (Staff/Principal Engineer), Management ট্র্যাক মানুষ ও প্রক্রিয়া নেতৃত্বের দিকে (Engineering Manager)। কোনোটাই "উঁচু" না — ব্যক্তিগত সন্তুষ্টি ও কার্যকারিতার ওপর ভিত্তি করে বেছে নেওয়া উচিত।</p>

<h3>১৭) কেন শুধু "ভালো কাজ করা" promotion নিশ্চিত করে না?</h3>
<p>কাজের impact যদি ম্যানেজার বা promotion committee-র কাছে দৃশ্যমান না হয় (কারণ যোগাযোগ করা হয়নি), তা growth-এ প্রতিফলিত হয় না। impact নিয়মিত ডকুমেন্ট করা এবং স্পষ্টভাবে যোগাযোগ করা তাই "ভালো কাজ"-এর সমান গুরুত্বপূর্ণ।</p>
</template>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
</html>
