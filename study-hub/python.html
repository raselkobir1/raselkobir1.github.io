    assert r.status_code == 200</pre>
<p><b>ব্যাখ্যা:</b> সাধারণ <code>TestClient</code> sync test-এর জন্য যথেষ্ট (ভেতরে async endpoint-ও চালায়)। test নিজেই <code>async</code> হতে হলে (যেমন async DB ব্যবহার, event loop-এর সাথে সরাসরি কাজ) <code>httpx.AsyncClient</code> + <code>ASGITransport</code> ও anyio/pytest-asyncio ব্যবহার করুন। সার্ভার চালানো লাগে না।</p>

<h3>৬০) দুটো request একসাথে একই balance বদলালে race condition কীভাবে ঠেকাবেন?</h3>
<pre>from sqlalchemy import select

def withdraw(db: Session, acc_id: int, amount: Decimal):
    acc = db.scalar(select(Account).where(Account.id == acc_id).with_for_update())  <span class="c"># row lock</span>
    if acc.balance &lt; amount:
        raise HTTPException(409, "insufficient balance")
    acc.balance -= amount
    db.commit()                                  <span class="c"># commit-এ lock ছাড়ে</span></pre>
<p><b>ব্যাখ্যা:</b> read → check → write ধাপের মাঝে অন্য request ঢুকে গেলে দুবার টাকা তোলা যেতে পারে। সমাধান: <code>SELECT ... FOR UPDATE</code> (pessimistic lock) বা <code>version</code> column দিয়ে optimistic concurrency, অথবা একটা atomic SQL <code>UPDATE ... WHERE balance &gt;= :amt</code>। সঙ্গে client-retry-র জন্য idempotency key। Python-এর <code>threading.Lock</code> একাধিক worker/সার্ভারে কাজ করে না — DB-স্তরেই সমাধান দরকার।</p>

<h3>৬১) FastAPI-তে rate limiting কীভাবে করবেন?</h3>
<pre><span class="c"># pip install slowapi</span>
from fastapi import FastAPI, Request
from slowapi import Limiter, _rate_limit_exceeded_handler
from slowapi.util import get_remote_address
from slowapi.errors import RateLimitExceeded

limiter = Limiter(key_func=get_remote_address)
app = FastAPI()
app.state.limiter = limiter
app.add_exception_handler(RateLimitExceeded, _rate_limit_exceeded_handler)

@app.post("/auth/token")
@limiter.limit("5/minute")                 <span class="c"># প্রতি IP-তে মিনিটে ৫টা</span>
def login(request: Request): ...           <span class="c"># slowapi-র জন্য request parameter আবশ্যক</span></pre>
<p><b>ব্যাখ্যা:</b> লগইন/OTP-র মতো endpoint-এ brute-force রোধে জরুরি। একাধিক worker/সার্ভারে সঠিক গণনার জন্য counter Redis-এ রাখতে হয়। বাস্তবে API gateway/reverse proxy (Nginx, Kong, cloud WAF) স্তরেও rate limit রাখা হয়; user/API-key ভিত্তিক সীমা IP-র চেয়ে নির্ভরযোগ্য (NAT-এর পেছনে অনেক user একই IP)।</p>

<h3>৬২) WebSocket-এ authentication কীভাবে করবেন?</h3>
<pre>from fastapi import WebSocket, WebSocketDisconnect, status

@app.websocket("/ws")
async def ws_endpoint(ws: WebSocket, token: str | None = None):    <span class="c"># ?token=...</span>
    user = verify_token_or_none(token)
    if user is None:
        await ws.close(code=status.WS_1008_POLICY_VIOLATION)        <span class="c"># accept-এর আগেই প্রত্যাখ্যান</span>
        return
    await ws.accept()
    try:
        while True:
            msg = await ws.receive_text()
            await ws.send_text(f"{user}: {msg}")
    except WebSocketDisconnect:
        pass</pre>
<p><b>ব্যাখ্যা:</b> browser-এর WebSocket API-তে custom header পাঠানো যায় না, তাই token সাধারণত query parameter, cookie বা সংযোগের প্রথম বার্তায় পাঠানো হয়। <code>accept()</code>-এর আগেই যাচাই করে বন্ধ করুন। query-তে token URL/লগে ধরা পড়তে পারে — তাই স্বল্পমেয়াদী token বা প্রথম-বার্তা পদ্ধতি বিবেচনা করুন; সবসময় <code>wss://</code>।</p>

<h3>৬৩) প্রতিটা request-এ request-id ও structured log কীভাবে যোগ করবেন?</h3>
<pre>import uuid, logging, contextvars
request_id_var = contextvars.ContextVar("request_id", default="-")

class RequestIdFilter(logging.Filter):
    def filter(self, record):
        record.request_id = request_id_var.get()
        return True

@app.middleware("http")
async def add_request_id(request: Request, call_next):
    rid = request.headers.get("X-Request-ID", str(uuid.uuid4()))
    token = request_id_var.set(rid)
    try:
        response = await call_next(request)
    finally:
        request_id_var.reset(token)
    response.headers["X-Request-ID"] = rid
    return response

<span class="c"># log format-এ  %(request_id)s  যোগ করলে প্রতিটা লাইনে ID আসে</span></pre>
<p><b>ব্যাখ্যা:</b> distributed system-এ একটা request-এর সব log এক ID দিয়ে খুঁজে পাওয়ার জন্য। <code>contextvars</code> async কোডেও request-প্রতি আলাদা মান ধরে রাখে (global variable নয়)। upstream (gateway) থেকে আসা ID থাকলে সেটাই ব্যবহার করুন, আর response-এ ফেরত দিন।</p>

<h3>৬৪) Pagination response-এ total সহ envelope কীভাবে বানাবেন (generic model)?</h3>
<pre>from typing import Generic, TypeVar
from pydantic import BaseModel

T = TypeVar("T")

class Page(BaseModel, Generic[T]):
    items: list[T]
    total: int
    skip: int
    limit: int

@app.get("/expenses", response_model=Page[ExpenseRead])
def list_expenses(db: DB, skip: int = 0, limit: int = 20):
    total = db.scalar(select(func.count()).select_from(Expense))
    rows = db.scalars(select(Expense).offset(skip).limit(limit)).all()
    return {"items": rows, "total": total, "skip": skip, "limit": limit}</pre>
<p><b>ব্যাখ্যা:</b> Pydantic v2-এর generic <code>BaseModel</code> দিয়ে যেকোনো resource-এর জন্য একই envelope (<code>Page[UserRead]</code>, <code>Page[ExpenseRead]</code>) পুনর্ব্যবহার হয়, আর docs-এও সঠিক schema দেখায়। বড় টেবিলে <code>COUNT(*)</code> ব্যয়বহুল হতে পারে — তখন cursor-based pagination বা আনুমানিক total বিবেচনা করুন।</p>

<h3>৬৫) File upload-এ আকার ও type কীভাবে সীমিত করবেন?</h3>
<pre>from fastapi import UploadFile, HTTPException
import shutil, uuid
from pathlib import Path

MAX_BYTES = 5 * 1024 * 1024
ALLOWED = {"image/png", "image/jpeg", "application/pdf"}

@app.post("/upload")
async def upload(file: UploadFile):
    if file.content_type not in ALLOWED:
        raise HTTPException(415, "ফাইলের ধরন অনুমোদিত নয়")
    dest = Path("uploads") / f"{uuid.uuid4()}{Path(file.filename).suffix}"   <span class="c"># ব্যবহারকারীর দেওয়া নাম সরাসরি নয়</span>
    size = 0
    with dest.open("wb") as out:
        while chunk := await file.read(1024 * 1024):          <span class="c"># ১MB করে</span>
            size += len(chunk)
            if size &gt; MAX_BYTES:
                out.close(); dest.unlink(missing_ok=True)
                raise HTTPException(413, "ফাইল বড় (সর্বোচ্চ ৫MB)")
            out.write(chunk)
    return {"saved_as": dest.name, "size": size}</pre>
<p><b>ব্যাখ্যা:</b> <code>content_type</code> client-নির্ধারিত, তাই জালিয়াতিযোগ্য — গুরুত্বপূর্ণ ক্ষেত্রে ফাইলের আসল বিষয়বস্তু (magic bytes) যাচাই করুন। ফাইলের নাম UUID দিয়ে বদলান (path traversal/overwrite এড়াতে), chunk করে পড়ুন (মেমরি বাঁচাতে), এবং proxy/Nginx স্তরেও body size সীমা রাখুন। বড় ফাইল সরাসরি object storage-এ (S3 presigned URL) পাঠানো ভালো।</p>

<h3>৬৬) ML/AI মডেল বা ভারী resource একবার load করে সব request-এ কীভাবে ব্যবহার করবেন?</h3>
<pre>from contextlib import asynccontextmanager
from fastapi import FastAPI, Request

@asynccontextmanager
async def lifespan(app: FastAPI):
    app.state.model = load_heavy_model()      <span class="c"># startup-এ একবার (প্রতি worker-এ)</span>
    yield
    app.state.model = None

app = FastAPI(lifespan=lifespan)

@app.post("/predict")
def predict(request: Request, text: str):
    model = request.app.state.model
    return {"label": model.predict(text)}</pre>
<p><b>ব্যাখ্যা:</b> প্রতি request-এ মডেল load করলে অসম্ভব ধীর। <code>lifespan</code>-এ একবার load করে <code>app.state</code>-এ রাখা হয়। মনে রাখুন প্রতিটা worker process-এর নিজস্ব কপি থাকে (মেমরি = মডেল × worker সংখ্যা)। inference ভারী/blocking হলে সাধারণ <code>def</code> endpoint বা thread/process pool ব্যবহার করুন।</p>

<h3>৬৭) দীর্ঘ-সময়ের কাজ (যেমন বড় রিপোর্ট) API-তে কীভাবে সামলাবেন?</h3>
<pre>@app.post("/reports", status_code=202)             <span class="c"># 202 Accepted — কাজ গ্রহণ করা হলো</span>
def create_report(params: ReportIn):
    job_id = enqueue_report_job(params)             <span class="c"># Celery/RQ/queue-তে পাঠানো</span>
    return {"job_id": job_id, "status_url": f"/reports/{job_id}"}

@app.get("/reports/{job_id}")
def report_status(job_id: str):
    job = get_job(job_id)
    if job.state == "done":
        return {"status": "done", "download_url": job.url}
    return {"status": job.state}                    <span class="c"># pending / running / failed</span></pre>
<p><b>ব্যাখ্যা:</b> HTTP request-এ মিনিট ধরে অপেক্ষা করালে timeout ও সম্পদ নষ্ট হয়। সঠিক প্যাটার্ন: <code>202 Accepted</code> + job ID ফেরত দিয়ে কাজ queue ও আলাদা worker-এ চালানো; client status endpoint polling করে (বা WebSocket/webhook-এ জানানো হয়)। এটা <code>BackgroundTasks</code>-এর চেয়ে নির্ভরযোগ্য — retry, persistence, scale পাওয়া যায়।</p>

<h3>৬৮) OAuth2 scope দিয়ে সূক্ষ্ম অনুমতি (fine-grained permission) কীভাবে দেবেন?</h3>
<pre>from fastapi import Security
from fastapi.security import OAuth2PasswordBearer, SecurityScopes

oauth2 = OAuth2PasswordBearer(
    tokenUrl="auth/token",
    scopes={"expenses:read": "খরচ পড়া", "expenses:write": "খরচ বদলানো"},
)

def current_user(scopes: SecurityScopes, token: Annotated[str, Depends(oauth2)]):
    payload = decode_token(token)                       <span class="c"># token-এ "scopes": [...] থাকে</span>
    granted = set(payload.get("scopes", []))
    if not set(scopes.scopes) &lt;= granted:
        raise HTTPException(403, "পর্যাপ্ত scope নেই")
    return payload["sub"]

@app.delete("/expenses/{eid}")
def delete(eid: int, user=Security(current_user, scopes=["expenses:write"])): ...</pre>
<p><b>ব্যাখ্যা:</b> role (admin/user) মোটা দাগের; scope প্রতিটা কাজের আলাদা অনুমতি (<code>expenses:read</code> বনাম <code>expenses:write</code>)। login-এর সময় ব্যবহারকারী/ক্লায়েন্টের জন্য অনুমোদিত scope token-এ বসে, আর endpoint প্রয়োজনীয় scope দাবি করে। তৃতীয়-পক্ষ client-কে সীমিত অ্যাক্সেস দিতে (OAuth2) বিশেষ উপযোগী।</p>

<h3>৬৯) FastAPI sub-application ও static file কীভাবে mount করবেন?</h3>
<pre>from fastapi import FastAPI
from fastapi.staticfiles import StaticFiles

app = FastAPI()
admin_app = FastAPI(title="Admin API")          <span class="c"># সম্পূর্ণ আলাদা app (নিজস্ব docs/dependency)</span>

app.mount("/admin", admin_app)                   <span class="c"># /admin/... এখন admin_app সামলায়, docs: /admin/docs</span>
app.mount("/static", StaticFiles(directory="static"), name="static")</pre>
<p><b>ব্যাখ্যা:</b> <code>mount</code> দিয়ে অন্য ASGI app (আরেকটা FastAPI, Starlette, এমনকি WSGI-wrapped Flask) একটা path-এর নিচে বসানো যায় — প্রতিটার নিজস্ব middleware ও OpenAPI থাকে। সাধারণ feature-ভাগের জন্য <code>APIRouter</code> যথেষ্ট; <code>mount</code> ব্যবহার করুন যখন সত্যিই আলাদা, স্বতন্ত্র sub-app দরকার। প্রোডাকশনে static ফাইল সাধারণত Nginx/CDN থেকে দেওয়া ভালো।</p>

<h3>৭০) PUT আর PATCH-এর পার্থক্য FastAPI-তে কীভাবে বাস্তবায়ন করবেন?</h3>
<pre>class ItemIn(BaseModel):                 <span class="c"># PUT — সব field আবশ্যক (পুরো resource বদল)</span>
    name: str
    price: float

class ItemPatch(BaseModel):              <span class="c"># PATCH — সব ঐচ্ছিক</span>
    name: str | None = None
    price: float | None = None

@app.put("/items/{iid}")
def replace(iid: int, item: ItemIn):
    store[iid] = item.model_dump()
    return store[iid]

@app.patch("/items/{iid}")
def patch(iid: int, item: ItemPatch):
    store[iid].update(item.model_dump(exclude_unset=True))   <span class="c"># শুধু পাঠানো field বদলাবে</span>
    return store[iid]</pre>
<p><b>ব্যাখ্যা:</b> PUT পুরো resource প্রতিস্থাপন করে (idempotent), PATCH আংশিক পরিবর্তন। PATCH-এ <code>exclude_unset=True</code> জরুরি — নইলে client যে field পাঠায়নি তা <code>None</code> হয়ে ডেটা মুছে ফেলবে। কেউ স্পষ্টভাবে <code>null</code> পাঠালে সেটা "set" ধরা হয় — আর <code>exclude_unset</code> এই পার্থক্য বোঝে।</p>

<h2 class="title" style="font-size:22px;margin-top:30px">ঙ. Python — আরও প্রশ্ন</h2>

<h3>৭১) MRO কী? Diamond inheritance-এ <code>super()</code> কীভাবে কাজ করে?</h3>
<pre>class A:
    def hi(self): print("A")
class B(A):
    def hi(self): print("B"); super().hi()
class C(A):
    def hi(self): print("C"); super().hi()
class D(B, C):
    def hi(self): print("D"); super().hi()

D().hi()                              <span class="c"># D B C A</span>
print([c.__name__ for c in D.__mro__])  <span class="c"># ['D', 'B', 'C', 'A', 'object']</span></pre>
<p><b>ব্যাখ্যা:</b> Method Resolution Order (C3 linearization) ঠিক করে attribute/method কোন class-এ কোন ক্রমে খোঁজা হবে। <code>super()</code> "সরাসরি parent" নয়, বরং <b>MRO-তে পরের class</b>-কে ডাকে — তাই diamond-এ <code>A</code> একবারই চলে। multiple inheritance-এ <code>super()</code> সবসময় সহযোগী (cooperative) ভাবে লেখা উচিত।</p>

<h3>৭২) <code>__slots__</code> কী, কখন কাজে লাগে?</h3>
<pre>class P:
    __slots__ = ("x", "y")
    def __init__(self, x, y): self.x, self.y = x, y

p = P(1, 2)
<span class="c"># p.z = 3     # AttributeError</span>
print(hasattr(p, "__dict__"))     <span class="c"># False — প্রতি object-এ dict নেই, তাই মেমরি কম</span></pre>
<p><b>ব্যাখ্যা:</b> ডিফল্টে প্রতিটা object-এ <code>__dict__</code> থাকে (নমনীয় কিন্তু মেমরি-খরচ)। <code>__slots__</code> attribute-এর নাম আগে ঘোষণা করে তা সরিয়ে দেয় — লক্ষ লক্ষ ছোট object-এ মেমরি ও attribute-access দ্রুততা বাড়ে, কিন্তু নতুন attribute যোগ করা যায় না। বেশিরভাগ অ্যাপে দরকার হয় না।</p>

<h3>৭৩) <code>__call__</code> কী? "callable" মানে কী?</h3>
<pre>class Counter:
    def __init__(self): self.n = 0
    def __call__(self):
        self.n += 1
        return self.n

c = Counter()
print(c(), c(), callable(c))     <span class="c"># 1 2 True</span></pre>
<p><b>ব্যাখ্যা:</b> যে object-কে <code>obj()</code> লিখে ডাকা যায় সেটা callable — function, lambda, class (instance বানায়) এবং <code>__call__</code> থাকা object। state ধরে রাখা function-এর মতো আচরণ (class-ভিত্তিক decorator, strategy) বানাতে কাজে লাগে।</p>

<h3>৭৪) Thread-এ race condition কী, GIL থাকতেও কেন হয়?</h3>
<pre>import threading
count = 0
lock = threading.Lock()

def inc():
    global count
    for _ in range(100_000):
        with lock:                <span class="c"># lock ছাড়া count += 1 নিরাপদ নয়</span>
            count += 1

ts = [threading.Thread(target=inc) for _ in range(4)]
[t.start() for t in ts]; [t.join() for t in ts]
print(count)                      <span class="c"># 400000</span></pre>
<p><b>ব্যাখ্যা:</b> <code>count += 1</code> আসলে read → add → write, কয়েকটা bytecode; GIL এগুলোর মাঝখানে thread বদলাতে পারে, ফলে আপডেট হারায়। shared state-এ <code>Lock</code> ব্যবহার করুন, বা ডেটা <code>queue.Queue</code> দিয়ে পাঠিয়ে sharing এড়ান।</p>

<h3>৭৫) <code>asyncio.gather</code>, <code>create_task</code> আর সরাসরি <code>await</code>-এর পার্থক্য?</h3>
<pre>import asyncio

async def job(n):
    await asyncio.sleep(1); return n

async def main():
    a = await job(1); b = await job(2)                     <span class="c"># ক্রমানুসারে — ~২ সেকেন্ড</span>

    r = await asyncio.gather(job(1), job(2))               <span class="c"># একসাথে — ~১ সেকেন্ড</span>
    t1 = asyncio.create_task(job(1)); t2 = asyncio.create_task(job(2))   <span class="c"># এখনই শুরু</span>
    print(await t1, await t2)                              <span class="c"># ~১ সেকেন্ড</span>

asyncio.run(main())</pre>
<p><b>ব্যাখ্যা:</b> শুধু <code>await coro()</code> কাজটা শেষ হওয়া পর্যন্ত অপেক্ষা করে — পরপর লিখলে ক্রমানুসারে চলে। <code>gather</code> একাধিক coroutine একসাথে চালিয়ে ফল জমা দেয়। <code>create_task</code> coroutine-কে সাথে সাথে event loop-এ schedule করে (পরে await করা যায়)। আধুনিক পছন্দ <code>TaskGroup</code> (3.11+) — ব্যর্থতা ও বাতিল ঠিকমতো সামলায়।</p>

<h3>৭৬) <code>eval()</code> ও <code>pickle</code> কেন বিপজ্জনক? বিকল্প কী?</h3>
<pre>import ast, json
user_input = "__import__('os').system('echo hacked')"
<span class="c"># eval(user_input)                # সরাসরি কোড চালায় — কখনো নয়!</span>
print(ast.literal_eval("[1, 2, 3]"))   <span class="c"># শুধু literal — নিরাপদ</span>
print(json.loads('{"a": 1}'))          <span class="c"># ডেটা বিনিময়ে JSON</span></pre>
<p><b>ব্যাখ্যা:</b> <code>eval/exec</code> স্ট্রিংকে কোড হিসেবে চালায়, আর <code>pickle.load</code> deserialize করার সময় যেকোনো কোড চালাতে পারে — অবিশ্বস্ত ইনপুটে দুটোই remote code execution-এর রাস্তা। ডেটা বিনিময়ে JSON/Pydantic, আর literal parse-এ <code>ast.literal_eval</code>।</p>

<h3>৭৭) <code>round(2.5)</code> কেন <code>2</code> হয়? টাকার হিসাবে কী করবেন?</h3>
<pre>print(round(2.5), round(3.5), round(2.675, 2))     <span class="c"># 2 4 2.67</span>

from decimal import Decimal, ROUND_HALF_UP
print(Decimal("2.675").quantize(Decimal("0.01"), rounding=ROUND_HALF_UP))   <span class="c"># 2.68</span></pre>
<p><b>ব্যাখ্যা:</b> Python 3 "banker's rounding" (round-half-to-even) ব্যবহার করে — ঠিক .5 হলে জোড় সংখ্যার দিকে যায়, যাতে পরিসংখ্যানগত পক্ষপাত কমে। এর উপর float-এর binary অসম্পূর্ণতা (<code>2.675</code> আসলে সামান্য কম) যোগ হয়ে <code>2.67</code> আসে। আর্থিক হিসাবে <code>Decimal</code> ও স্পষ্ট rounding mode।</p>

<h3>৭৮) "শীর্ষ N" বা priority queue Python-এ কীভাবে করবেন?</h3>
<pre>import heapq

scores = [("A", 50), ("B", 90), ("C", 70), ("D", 85)]
print(heapq.nlargest(2, scores, key=lambda t: t[1]))   <span class="c"># [('B', 90), ('D', 85)]</span>

pq = []
heapq.heappush(pq, (2, "email")); heapq.heappush(pq, (1, "payment"))
print(heapq.heappop(pq))                               <span class="c"># (1, 'payment') — ক্ষুদ্রতম priority আগে</span></pre>
<p><b>ব্যাখ্যা:</b> <code>heapq</code> min-heap দেয় — push/pop O(log n)। পুরো list sort না করে শীর্ষ k বের করতে <code>nlargest/nsmallest</code> কার্যকর। max-heap দরকার হলে মান ঋণাত্মক করে রাখুন। thread-safe priority queue-র জন্য <code>queue.PriorityQueue</code>।</p>

<h3>৭৯) <code>sqlite3</code>-তে SQL injection কীভাবে ঠেকাবেন?</h3>
<pre>import sqlite3
con = sqlite3.connect(":memory:")
con.execute("CREATE TABLE u (name TEXT)")
name = "x'; DROP TABLE u; --"

<span class="c"># con.execute(f"SELECT * FROM u WHERE name = '{name}'")      # বিপজ্জনক</span>
con.execute("SELECT * FROM u WHERE name = ?", (name,))        <span class="c"># parameter binding</span></pre>
<p><b>ব্যাখ্যা:</b> মান SQL টেক্সটের সাথে জোড়া না দিয়ে placeholder (<code>?</code> বা <code>%s</code>/<code>:name</code>) দিয়ে আলাদাভাবে পাঠালে driver তাকে ডেটা হিসেবেই ধরে, কোড হিসেবে নয়। ORM (SQLAlchemy) ও FastAPI-তেও একই নীতি — raw SQL-এ <code>text("... :id")</code> ও bind parameter।</p>

<h3>৮০) <code>functools.partial</code> কী, কখন কাজে লাগে?</h3>
<pre>from functools import partial

def log(level, msg): print(f"[{level}] {msg}")
error = partial(log, "ERROR")
error("ডিস্ক ভর্তি")               <span class="c"># [ERROR] ডিস্ক ভর্তি</span>

<span class="c"># callback-এ argument বেঁধে পাঠানো</span>
nums = list(map(partial(pow, 2), [1, 2, 3]))   <span class="c"># 2**1, 2**2, 2**3 → [2, 4, 8]</span></pre>
<p><b>ব্যাখ্যা:</b> একটা function-এর কিছু argument আগে বেঁধে নতুন function বানায় — lambda-র চেয়ে স্পষ্ট ও picklable। callback, thread-pool-এ extra argument পাঠানো, বা closure late-binding সমস্যা (প্রশ্ন ২১) এড়াতে উপযোগী।</p>

<h3>৮১) Python-এর data structure-এর time complexity মুখস্থ কী কী?</h3>
<pre>import timeit
setup = "data = list(range(100_000)); s = set(data)"
print(timeit.timeit("99_999 in data", setup=setup, number=1000))   <span class="c"># list: O(n) — ধীর</span>
print(timeit.timeit("99_999 in s",    setup=setup, number=1000))   <span class="c"># set: O(1) — অনেক দ্রুত</span></pre>
<table>
<tr><th>অপারেশন</th><th>list</th><th>dict / set</th><th>deque</th></tr>
<tr><td>index/key দিয়ে পড়া</td><td>O(1)</td><td>O(1) গড়ে</td><td>মাঝখানে O(n)</td></tr>
<tr><td><code>in</code> (খোঁজা)</td><td>O(n)</td><td>O(1) গড়ে</td><td>O(n)</td></tr>

<tr><td>শুরুতে insert/pop</td><td>O(n)</td><td>—</td><td>O(1)</td></tr>
<tr><td>sort</td><td>O(n log n)</td><td>—</td><td>—</td></tr>
</table>
<p><b>ব্যাখ্যা:</b> বারবার membership test করলে list-কে set/dict-এ বদলান; দুই প্রান্তে যোগ/মোছায় <code>deque</code>। ইন্টারভিউয়ে "এটা O(n²) কে O(n)-এ নামানো যায়?" প্রশ্নের উত্তর প্রায়ই dict/set।</p>

<h3>৮২) Python-এ <code>is</code> কখনো কখনো কেন <code>True</code> দেয় (ছোট int/string)?</h3>
<pre>a, b = 256, 256
print(a is b)               <span class="c"># True  — ছোট int (-5..256) cached</span>
x, y = 1000, 1000           <span class="c"># একই লাইন/ফাইলে compile-time-এ একসাথে হতে পারে</span>
print(int("1000") is int("1000"))   <span class="c"># False — আলাদা object</span>
print(None is None)         <span class="c"># True — is-এর সঠিক ব্যবহার; string/সংখ্যা তুলনায় is নয়, ==</span></pre>
<p><b>ব্যাখ্যা:</b> CPython কিছু immutable মান (ছোট int, কিছু string, <code>None</code>/<code>True</code>/<code>False</code>) পুনর্ব্যবহার (interning) করে, তাই <code>is</code> আকস্মিকভাবে True হয় — এটা implementation detail, ভাষার নিশ্চয়তা নয়। মান তুলনায় সবসময় <code>==</code>; <code>is</code> শুধু <code>None</code>/sentinel-এর জন্য।</p>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>

  });

</script>
