<template data-page="intro">
<h2 class="title">১. Python পরিচিতি, Setup ও প্রথম প্রোগ্রাম</h2>
<p class="lead">Python একটা সহজপাঠ্য, বহুমুখী programming language — web backend (FastAPI/Django), automation, data, AI/ML, scripting — সবখানেই এর ব্যবহার। এই কোর্সে একদম basic থেকে শুরু করে advanced Python এবং FastAPI পর্যন্ত যাওয়া হবে; প্রতিটা অধ্যায়ে ছোট, নিজে চালিয়ে দেখার মতো কোড আছে।</p>

<h3>Python কেন শিখবেন</h3>
<table>
<tr><th>বৈশিষ্ট্য</th><th>মানে কী</th></tr>
<tr><td><span class="kw">Readable syntax</span></td><td>curly brace নয়, indentation দিয়ে block বোঝানো হয় — কোড পড়তে ইংরেজির কাছাকাছি</td></tr>
<tr><td><span class="kw">Interpreted</span></td><td>আলাদা compile ধাপ ছাড়াই সরাসরি চালানো যায় (ভেতরে bytecode-এ রূপান্তর হয়)</td></tr>
<tr><td><span class="kw">Dynamically typed</span></td><td>variable-এর type আগে ঘোষণা করতে হয় না; runtime-এ নির্ধারিত হয়</td></tr>
<tr><td>বিশাল ecosystem</td><td>PyPI-তে লক্ষাধিক package — FastAPI, NumPy, pandas, requests, pytest, AI SDK সবই</td></tr>
<tr><td>AI/Data-র de-facto ভাষা</td><td>AI ও data science-এর প্রায় সব tool/SDK আগে Python-এ আসে</td></tr>
</table>

<h3>.NET/C# developer-এর জন্য দ্রুত তুলনা</h3>
<table>
<tr><th>বিষয়</th><th>C#</th><th>Python</th></tr>
<tr><td>Typing</td><td>static, compile-time</td><td>dynamic (optional type hint আছে — অধ্যায় ১২)</td></tr>
<tr><td>Block</td><td><code>{ }</code></td><td>indentation (সাধারণত ৪ space)</td></tr>

<tr><td>null</td><td><code>null</code></td><td><code>None</code></td></tr>

<h3>Install ও যাচাই</h3>
<p>python.org থেকে সর্বশেষ stable Python 3 নামিয়ে install করুন (Windows-এ "Add Python to PATH" টিক দিন)। Python 2 বহু আগেই বন্ধ — এখন শুধু Python 3।</p>
<pre>python --version        <span class="c"># Python 3.12.x (আপনার সংস্করণ দেখাবে)</span>
python                 <span class="c"># interactive REPL চালু হয়; বের হতে exit() বা Ctrl+Z (Windows)</span>
&gt;&gt;&gt; 2 + 3
5
&gt;&gt;&gt; print("Hello")
Hello</pre>

<h3>প্রথম প্রোগ্রাম</h3>
<pre><span class="c"># hello.py</span>
name = input("আপনার নাম কী? ")
print(f"হ্যালো, {name}!")          <span class="c"># f-string: {} এর ভেতরে যেকোনো expression</span>
print("2 + 3 =", 2 + 3)

<span class="c"># চালান:  python hello.py</span></pre>

<h3>Virtual Environment — প্রতিটা প্রজেক্ট আলাদা</h3>
<p>এক প্রজেক্টের package-সংস্করণ অন্য প্রজেক্টের সাথে যেন না গুলোয়, সেজন্য প্রতিটা প্রজেক্টের জন্য আলাদা <span class="kw">virtual environment</span> বানানো Python-এর স্ট্যান্ডার্ড অভ্যাস (বিস্তারিত অধ্যায় ৮)।</p>
<pre>python -m venv .venv                  <span class="c"># .venv নামে environment তৈরি</span>
.venv\Scripts\activate                <span class="c"># Windows (cmd/PowerShell)</span>
source .venv/bin/activate             <span class="c"># macOS / Linux</span>
pip install requests                  <span class="c"># শুধু এই environment-এ install হয়</span>
pip freeze &gt; requirements.txt         <span class="c"># dependency তালিকা সংরক্ষণ</span></pre>

<div class="callout best"><span class="tag">শেখার পরিকল্পনা</span>
কোথা থেকে শুরু করবেন ও কোন ক্রমে এগোবেন বুঝতে না পারলে অধ্যায় ২৫-এর <a href="#" data-go="roadmap" style="color:var(--accent2)">৬ সপ্তাহের Roadmap</a> দেখুন — প্রতি সপ্তাহের exercise-এর সম্পূর্ণ সমাধানসহ।</div>

<h3>Syntax-এর মৌলিক নিয়ম</h3>
<pre><span class="c"># এটা একটা comment (লাইনের শুরুতে #)</span>
x = 10

if x &gt; 5:                 <span class="c"># কোলন দিয়ে block শুরু</span>
    print("বড়")           <span class="c"># ৪ space indentation = block-এর ভেতরে</span>
else:
    print("ছোট")

def main():
    print("শুরু")

if __name__ == "__main__":   <span class="c"># ফাইলটা সরাসরি চালালে main() চলবে, import করলে নয়</span>
    main()</pre>
<div class="callout mistake"><span class="tag">Common mistake — Tab ও Space মেশানো</span>
Python indentation দিয়ে block বোঝে, তাই একই ফাইলে tab আর space মিশালে <code>IndentationError</code> আসে। Editor-কে সবসময় ৪ space ব্যবহার করতে সেট করুন (VS Code-এ ডিফল্টে তাই)।</div>
<div class="callout best"><span class="tag">Best practice — PEP 8</span>
Python-এর অফিসিয়াল style guide <span class="kw">PEP 8</span>: variable/function <code>snake_case</code>, class <code>PascalCase</code>, constant <code>UPPER_CASE</code>, লাইন সাধারণত ≤ ৮৮–৯৯ অক্ষর। <code>ruff</code> বা <code>black</code> দিয়ে স্বয়ংক্রিয় formatting/lint করুন।</div>

<template data-page="types">
<h2 class="title">২. Variable, Data Type ও Operator</h2>
<p class="lead">Python-এ সবকিছুই একটা object, আর variable হলো সেই object-এর একটা নাম (label)। এই ধারণাটা বুঝলে mutable/immutable, copy, function argument — সব সহজ হয়ে যায়।</p>

<h3>মৌলিক Data Type</h3>
<table>
<tr><th>Type</th><th>উদাহরণ</th><th>মন্তব্য</th></tr>
<tr><td><code>int</code></td><td><code>42</code>, <code>-7</code>, <code>10**30</code></td><td>আকারের সীমা নেই (arbitrary precision)</td></tr>
<tr><td><code>float</code></td><td><code>3.14</code>, <code>1e-3</code></td><td>binary floating point — সামান্য precision ভুল থাকে</td></tr>
<tr><td><code>bool</code></td><td><code>True</code>, <code>False</code></td><td><code>int</code>-এর subclass (<code>True == 1</code>)</td></tr>
<tr><td><code>str</code></td><td><code>"হ্যালো"</code>, <code>'hi'</code></td><td>immutable Unicode text</td></tr>
<tr><td><code>None</code></td><td><code>None</code></td><td>"মান নেই" — C#-এর <code>null</code></td></tr>
</table>
<pre>age = 25                  <span class="c"># int</span>
price = 99.5              <span class="c"># float</span>
is_active = True          <span class="c"># bool</span>
name = "Rasel"            <span class="c"># str</span>
nothing = None            <span class="c"># NoneType</span>

print(type(age))              <span class="c"># &lt;class 'int'&gt;</span>
print(isinstance(age, int))   <span class="c"># True  — type যাচাইয়ের পছন্দের উপায়</span>
print(10 ** 30)               <span class="c"># 1000000000000000000000000000000 (overflow নেই)</span>
print(0.1 + 0.2)              <span class="c"># 0.30000000000000004  — float precision</span></pre>
<div class="callout best"><span class="tag">টাকা-পয়সার হিসাবে float নয়, Decimal</span>
Accounting/finance-এ <code>float</code> কখনো নয় — সামান্য precision ভুলও জমে বড় হয়। <code>decimal.Decimal</code> ব্যবহার করুন এবং string থেকে বানান:
<pre>from decimal import Decimal
total = Decimal("0.1") + Decimal("0.2")
print(total)        <span class="c"># 0.3</span></pre></div>

<h3>Dynamic Typing ও Object Model</h3>
<pre>x = 10          <span class="c"># x এখন int object-এর নাম</span>
x = "দশ"        <span class="c"># এখন একই নাম str object-কে নির্দেশ করছে — error নেই</span>
print(type(x))  <span class="c"># &lt;class 'str'&gt;</span>

a = [1, 2]
b = a           <span class="c"># b একই list-এর আরেকটা নাম — কপি নয়!</span>
b.append(3)
print(a)        <span class="c"># [1, 2, 3]</span></pre>

<h3>match-case (Python 3.10+) — structural pattern matching</h3>
<pre>def handle(cmd):

<p class="lead">Python-এ function হলো first-class object — variable-এ রাখা যায়, argument হিসেবে পাঠানো যায়, return করা যায়। এটাই decorator, callback ও functional প্যাটার্নের ভিত্তি।</p>

<h3>Function সংজ্ঞা ও Argument-এর ধরন</h3>
<pre>def greet(name, greeting="Hello"):        <span class="c"># default value</span>
    """একজনকে শুভেচ্ছা জানায়।"""          <span class="c"># docstring</span>

print(greet("Rasel"))                      <span class="c"># Hello, Rasel!</span>
print(greet("Rasel", greeting="হ্যালো"))   <span class="c"># keyword argument</span>

<h3>*args ও **kwargs</h3>
<pre>def total(*args):                  <span class="c"># যেকোনো সংখ্যক positional → tuple</span>
    return sum(args)

def show(**kwargs):                <span class="c"># যেকোনো সংখ্যক keyword → dict</span>
    for k, v in kwargs.items():
        print(k, "=", v)

print(total(1, 2, 3))              <span class="c"># 6</span>
show(city="Dhaka", zip=1207)

<span class="c"># unpack করে পাঠানো</span>

total(*nums); show(**opts)

<span class="c"># keyword-only (* এর পরে) ও positional-only (/ এর আগে)</span>

    return a + b + c
f(1, 2, c=3)                       <span class="c"># f(1, 2, 3) → TypeError</span></pre>

<h3>Mutable Default Argument — Python-এর কুখ্যাত ফাঁদ</h3>
<pre>def add_item(item, bucket=[]):     <span class="c"># ভুল! [] একবারই তৈরি হয়, সব call শেয়ার করে</span>
    bucket.append(item)
    return bucket

print(add_item(1))   <span class="c"># [1]</span>
print(add_item(2))   <span class="c"># [1, 2]  ← অপ্রত্যাশিত</span>

def add_item_ok(item, bucket=None):    <span class="c"># সঠিক</span>

<h3>Scope — LEGB নিয়ম</h3>
<p>নাম খোঁজা হয় এই ক্রমে: <span class="kw">L</span>ocal → <span class="kw">E</span>nclosing (বাইরের function) → <span class="kw">G</span>lobal (module) → <span class="kw">B</span>uilt-in।</p>
<pre>count = 0
def inc():
    global count          <span class="c"># module-level variable বদলাতে চাইলে</span>
    count += 1

def outer():
    n = 0
    def inner():
        nonlocal n        <span class="c"># বাইরের function-এর variable বদলাতে</span>
        n += 1
        return n
    return inner

c = outer(); print(c(), c())   <span class="c"># 1 2</span></pre>

<h3>Lambda ও Higher-order Function</h3>
<pre>square = lambda x: x * x            <span class="c"># ছোট, নামহীন function (একটা expression)</span>

nums = [1, 2, 3, 4, 5]
print(list(map(lambda x: x * 2, nums)))        <span class="c"># [2, 4, 6, 8, 10]</span>
print(list(filter(lambda x: x % 2 == 0, nums)))# [2, 4]

users = [{"n": "B", "age": 30}, {"n": "A", "age": 25}]
print(sorted(users, key=lambda u: u["age"]))   <span class="c"># age অনুযায়ী sort</span></pre>

জটিল লজিকে lambda না লিখে নামসহ <code>def</code> লিখুন। সরল transform-এ <code>map/filter</code>-এর চেয়ে list comprehension (অধ্যায় ১০) সাধারণত বেশি পঠনযোগ্য।</div>

<h3>Recursion — function নিজেকে ডাকা</h3>
<pre>def factorial(n):
    if n &lt;= 1:                  <span class="c"># base case — না থাকলে অসীম recursion</span>
        return 1
    return n * factorial(n - 1)

print(factorial(5))             <span class="c"># 120</span>

import sys
print(sys.getrecursionlimit())  <span class="c"># সাধারণত 1000</span>
<span class="c"># factorial(5000)               # RecursionError: maximum recursion depth exceeded</span>

def factorial_loop(n):          <span class="c"># গভীর হলে loop-ই নিরাপদ</span>
    r = 1
    for i in range(2, n + 1):
        r *= i
    return r</pre>
<div class="callout why"><span class="tag">Python-এ গভীর recursion কেন সমস্যা</span>
Python tail-call optimization করে না এবং recursion depth সীমিত (ডিফল্ট ~১০০০)। গাছ/গ্রাফের মতো স্বাভাবিকভাবে recursive সমস্যায় recursion ঠিক আছে, কিন্তু লক্ষ ধাপের কাজে loop বা explicit stack ব্যবহার করুন। <code>sys.setrecursionlimit</code> বাড়ানো ঝুঁকিপূর্ণ (stack overflow/crash)।</div>

<template data-page="errors">
<h2 class="title">৭. Error ও Exception Handling</h2>
<p class="lead">প্রোগ্রাম ভুল পথে গেলে Python exception raise করে। সেটা সুন্দরভাবে ধরা, বোঝা ও নিজের exception বানানো — নির্ভরযোগ্য কোডের মূল ভিত্তি।</p>

<h3>try / except / else / finally</h3>
<pre>def divide(a, b):
    try:
        result = a / b
    except ZeroDivisionError:
        print("০ দিয়ে ভাগ করা যায় না")
        return None
    except (TypeError, ValueError) as e:     <span class="c"># একাধিক ধরন, e-তে exception object</span>
        print("ভুল ইনপুট:", e)
        return None
    else:
        return result                         <span class="c"># exception না হলে চলে</span>
    finally:
        print("সবসময় চলে (cleanup)")          <span class="c"># return হলেও চলে</span>

print(divide(10, 2))     <span class="c"># সবসময় চলে... তারপর 5.0</span>
print(divide(1, 0))</pre>

<h3>Exception raise করা ও নিজের Exception</h3>
<pre>class InsufficientBalance(Exception):
    def __init__(self, balance, amount):
        super().__init__(f"balance {balance}, কিন্তু {amount} চাওয়া হয়েছে")
        self.balance = balance
        self.amount = amount

def withdraw(balance, amount):
    if amount &lt;= 0:
        raise ValueError("amount ধনাত্মক হতে হবে")
    if amount &gt; balance:
        raise InsufficientBalance(balance, amount)
    return balance - amount

try:
    withdraw(100, 500)
except InsufficientBalance as e:
    print(e)             <span class="c"># balance 100, কিন্তু 500 চাওয়া হয়েছে</span></pre>

<h3>Exception chaining — মূল কারণ হারাবেন না</h3>
<pre>import json
try:
    json.loads("{bad json}")
except json.JSONDecodeError as e:
    raise ValueError("config ফাইল অবৈধ") from e   <span class="c"># মূল কারণ সংযুক্ত থাকে</span></pre>

<h3>সাধারণ Exception</h3>
<table>
<tr><th>Exception</th><th>কখন হয়</th></tr>
<tr><td><code>ValueError</code></td><td>ঠিক type, কিন্তু অবৈধ মান — <code>int("abc")</code></td></tr>
<tr><td><code>TypeError</code></td><td>ভুল type — <code>"a" + 1</code></td></tr>
<tr><td><code>KeyError</code> / <code>IndexError</code></td><td>dict key / list index নেই</td></tr>
<tr><td><code>AttributeError</code></td><td>object-এ এমন attribute নেই</td></tr>
<tr><td><code>FileNotFoundError</code></td><td>ফাইল নেই</td></tr>
<tr><td><code>ZeroDivisionError</code></td><td>০ দিয়ে ভাগ</td></tr>
<tr><td><code>ImportError</code></td><td>module পাওয়া যায়নি</td></tr>
</table>

<h3>EAFP বনাম LBYL</h3>
<pre><span class="c"># LBYL — আগে যাচাই করো</span>
if "email" in user:
    send(user["email"])

<span class="c"># EAFP — আগে চেষ্টা করো, ব্যর্থ হলে ধরো (Python-এ বেশি idiomatic)</span>
try:
    send(user["email"])
except KeyError:
    pass</pre>
<div class="callout mistake"><span class="tag">Common mistake — bare except</span>
<pre>try:
    risky()
except:            <span class="c"># সবকিছু গিলে ফেলে, Ctrl+C-ও! কখনো নয়</span>
    pass

try:
    risky()
except Exception as e:      <span class="c"># অন্তত নির্দিষ্ট ধরন, আর লগ করুন</span>
    import logging
    logging.exception("risky() ব্যর্থ")   <span class="c"># stack trace সহ লগ</span>
    raise                                  <span class="c"># প্রয়োজনে আবার ছুড়ুন</span></pre></div>

<template data-page="modules">
<h2 class="title">৮. Module, Package, venv ও pip</h2>
<p class="lead">কোড একটা ফাইলে না রেখে module-এ ভাগ করা, package হিসেবে সাজানো, আর নির্ভরতা (dependency) নিয়ন্ত্রণে রাখা — প্রোজেক্ট বড় হলে এগুলোই সুশৃঙ্খলতা আনে।</p>

<h3>Module ও Import</h3>
<pre><span class="c"># utils.py</span>
def add(a, b):
    return a + b
PI = 3.14159

<span class="c"># main.py</span>
import utils
print(utils.add(2, 3))

from utils import add, PI          <span class="c"># নির্দিষ্ট নাম</span>
from utils import add as plus      <span class="c"># alias</span>
import math, random, os, sys       <span class="c"># standard library</span>
print(math.sqrt(16), random.randint(1, 6))</pre>
<div class="callout best"><span class="tag">Best practice</span>
<code>from module import *</code> এড়িয়ে চলুন — কোন নাম কোথা থেকে এলো বোঝা যায় না এবং নাম সংঘর্ষ হয়। Import সবসময় ফাইলের শুরুতে: standard library → third-party → নিজের module, প্রতিটা গ্রুপ আলাদা।</div>

<h3>Package — ফোল্ডার হিসেবে module</h3>
<pre>myapp/
├── pyproject.toml
├── requirements.txt
├── app/
│   ├── __init__.py          <span class="c"># এই ফোল্ডারকে package বানায় (খালি হতে পারে)</span>
│   ├── main.py
│   ├── models.py
│   └── services/
│       ├── __init__.py
│       └── billing.py
└── tests/
    └── test_billing.py

<span class="c"># app/main.py থেকে</span>
from app.services.billing import calculate
from .models import User            <span class="c"># relative import (একই package-এর ভেতরে)</span></pre>

<h3>pip ও Dependency ব্যবস্থাপনা</h3>
<pre>python -m pip install requests              <span class="c"># install</span>
python -m pip install "fastapi==0.115.*"    <span class="c"># সংস্করণ নির্দিষ্ট</span>
python -m pip install -r requirements.txt   <span class="c"># তালিকা থেকে সব</span>
python -m pip list                          <span class="c"># installed package</span>
python -m pip uninstall requests
pip freeze &gt; requirements.txt               <span class="c"># বর্তমান সংস্করণসহ সংরক্ষণ</span></pre>
<div class="callout why"><span class="tag">কেন "python -m pip"</span>
<code>python -m pip</code> নিশ্চিত করে যে <b>যে Python চালাচ্ছেন সেটারই</b> pip ব্যবহার হচ্ছে — একাধিক Python install থাকলে ভুল environment-এ package যাওয়ার সমস্যা এড়ায়।</div>

<h3>pyproject.toml ও আধুনিক টুল</h3>
<p>আধুনিক প্রজেক্টে dependency ও metadata <code>pyproject.toml</code>-এ রাখা হয়। <span class="kw">uv</span>, <span class="kw">Poetry</span>, <span class="kw">pip-tools</span> জাতীয় টুল সংস্করণ lock করে reproducible install দেয় — টিম ও deployment-এ এগুলো কাজে লাগে। (টুলগুলো দ্রুত বদলায়, ব্যবহারের আগে বর্তমান ডকুমেন্টেশন দেখুন।)</p>
<pre><span class="c"># pyproject.toml (সরল উদাহরণ)</span>
[project]
name = "myapp"
version = "0.1.0"
requires-python = "&gt;=3.11"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy&gt;=2.0",
]</pre>

<h3>Environment Variable ও Config</h3>
<pre>import os

DB_URL = os.environ.get("DATABASE_URL", "sqlite:///dev.db")   <span class="c"># না থাকলে default</span>
SECRET = os.environ["SECRET_KEY"]       <span class="c"># না থাকলে KeyError — আবশ্যিক কনফিগের জন্য ভালো</span>

<span class="c"># .env ফাইল থেকে: pip install python-dotenv</span>
<span class="c"># from dotenv import load_dotenv; load_dotenv()</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — secret কোডে বা Git-এ রাখা</span>
API key, password, DB URL কখনো কোডে hardcode বা <code>.env</code> Git-এ commit করবেন না। <code>.gitignore</code>-এ <code>.env</code> ও <code>.venv/</code> যোগ করুন; production-এ secret manager/environment variable ব্যবহার করুন।</div>

<h3>Import-এর ভেতরের কথা — sys.path, __all__ ও circular import</h3>
<pre>import sys
print(sys.path[:3])          <span class="c"># Python এই ক্রমে ফোল্ডারে module খোঁজে (current dir প্রথমে)</span>

<span class="c"># utils.py — "from utils import *" এ কী কী আসবে তা নিয়ন্ত্রণ</span>
__all__ = ["add", "PI"]      <span class="c"># _private নাম বা অন্যান্য নাম বাদ</span>

<span class="c"># module নিজের নাম</span>
print(__name__, __file__)    <span class="c"># import করা হলে module-এর নাম; সরাসরি চালালে "__main__"</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — নিজের ফাইলের নাম standard module-এর মতো রাখা</span>
<code>random.py</code>, <code>json.py</code>, <code>email.py</code> নামে ফাইল বানালে আপনার ফাইলই আগে import হয় এবং আসল module ঢাকা পড়ে (অদ্ভুত error)। নামে সতর্ক থাকুন।</div>
<pre><span class="c"># Circular import — a.py ও b.py একে অপরকে import করলে ImportError</span>
<span class="c"># a.py:  from b import g      # b.py:  from a import f   →  সমস্যা</span>

<span class="c"># সমাধান ১: ভেতরের function-এ import (lazy)</span>
def f():
    from b import g
    return g()
<span class="c"># সমাধান ২ (ভালো): সাধারণ অংশ তৃতীয় module-এ সরানো — নির্ভরতা একমুখী রাখা</span></pre>

<template data-page="oop">
<h2 class="title">৯. OOP — Class, Inheritance ও dataclass</h2>
<p class="lead">Python পুরোপুরি object-oriented — তবে boilerplate কম। Class, inheritance, property, dunder method ও আধুনিক <code>dataclass</code> বুঝলে বড় প্রোজেক্টের কাঠামো সহজ হয়।</p>

<h3>Class, Object ও self</h3>
<pre>class BankAccount:
    bank = "MyBank"                       <span class="c"># class attribute — সব object-এ শেয়ার</span>

    def __init__(self, owner, balance=0): <span class="c"># constructor</span>
        self.owner = owner                <span class="c"># instance attribute</span>
        self.balance = balance

    def deposit(self, amount):            <span class="c"># instance method (প্রথম parameter self)</span>
        self.balance += amount
        return self.balance

acc = BankAccount("Rasel", 1000)
acc.deposit(500)
print(acc.owner, acc.balance, acc.bank)   <span class="c"># Rasel 1500 MyBank</span></pre>

<h3>classmethod, staticmethod ও property</h3>
<pre>class Temperature:
    def __init__(self, celsius):
        self._celsius = celsius            <span class="c"># _ prefix = "internal" (কনভেনশন)</span>

    @property
    def celsius(self):                     <span class="c"># getter — attribute-এর মতো পড়া যায়</span>
        return self._celsius

    @celsius.setter
    def celsius(self, value):              <span class="c"># setter — validation বসানো যায়</span>
        if value &lt; -273.15:
            raise ValueError("absolute zero-এর নিচে নয়")
        self._celsius = value

    @property
    def fahrenheit(self):                  <span class="c"># computed property</span>
        return self._celsius * 9 / 5 + 32

    @classmethod
    def from_fahrenheit(cls, f):           <span class="c"># alternative constructor</span>
        return cls((f - 32) * 5 / 9)

    @staticmethod
    def is_valid(c):                       <span class="c"># self/cls লাগে না — utility</span>
        return c &gt;= -273.15

t = Temperature.from_fahrenheit(212)
print(t.celsius, t.fahrenheit)             <span class="c"># 100.0 212.0</span></pre>

<h3>Inheritance, super() ও Polymorphism</h3>
<pre>class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        raise NotImplementedError

class Dog(Animal):
    def speak(self):
        return f"{self.name}: Woof"

class Cat(Animal):
    def __init__(self, name, indoor=True):
        super().__init__(name)             <span class="c"># parent-এর __init__ চালানো</span>
        self.indoor = indoor
    def speak(self):
        return f"{self.name}: Meow"

for a in [Dog("Tommy"), Cat("Kitty")]:    <span class="c"># polymorphism / duck typing</span>
    print(a.speak())

print(isinstance(Dog("x"), Animal))       <span class="c"># True</span></pre>
<div class="callout best"><span class="tag">Best practice — Composition over Inheritance</span>
গভীর inheritance hierarchy ভঙ্গুর হয়। "is-a" সম্পর্ক পরিষ্কার না হলে একটা object-কে আরেকটার ভেতরে রাখুন (has-a) — যেমন <code>Order</code>-এর ভেতরে <code>PaymentProcessor</code> object।</div>

<h3>Dunder (Magic) Method</h3>
<pre>class Money:
    def __init__(self, amount, currency="BDT"):
        self.amount, self.currency = amount, currency

    def __repr__(self):                    <span class="c"># ডেভেলপারের জন্য (debug)</span>
        return f"Money({self.amount!r}, {self.currency!r})"
    def __str__(self):                     <span class="c"># ব্যবহারকারীর জন্য (print)</span>
        return f"{self.amount:,.2f} {self.currency}"
    def __eq__(self, other):
        return (self.amount, self.currency) == (other.amount, other.currency)
    def __add__(self, other):
        return Money(self.amount + other.amount, self.currency)
    def __lt__(self, other):
        return self.amount &lt; other.amount

a, b = Money(100), Money(250)
print(a + b)          <span class="c"># 350.00 BDT</span>
print(a &lt; b)          <span class="c"># True</span>
print(repr(a))        <span class="c"># Money(100, 'BDT')</span></pre>

<h3>dataclass — boilerplate ছাড়া data class</h3>
<pre>from dataclasses import dataclass, field

@dataclass
class Product:
    name: str
    price: float
    tags: list[str] = field(default_factory=list)   <span class="c"># mutable default এভাবেই</span>

p = Product("Pen", 12.5)
print(p)                       <span class="c"># Product(name='Pen', price=12.5, tags=[])</span>
print(p == Product("Pen", 12.5))   <span class="c"># True — __eq__ নিজে তৈরি</span>

@dataclass(frozen=True, order=True)    <span class="c"># immutable ও তুলনাযোগ্য</span>
class Version:
    major: int
    minor: int

print(Version(1, 2) &lt; Version(1, 5))   <span class="c"># True</span></pre>

<h3>Abstract Base Class ও Enum</h3>
<pre>from abc import ABC, abstractmethod
from enum import Enum

class PaymentMethod(ABC):
    @abstractmethod
    def pay(self, amount: float) -&gt; str: ...

class Card(PaymentMethod):
    def pay(self, amount: float) -&gt; str:
        return f"card দিয়ে {amount} পরিশোধ"

<span class="c"># PaymentMethod() সরাসরি বানালে TypeError — abstract method বাকি</span>

class Status(Enum):
    PENDING = "pending"
    PAID = "paid"

print(Status.PAID.value, Status("pending"))   <span class="c"># paid Status.PENDING</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — mutable class attribute শেয়ার</span>
<pre>class Bad:
    items = []             <span class="c"># সব object একই list শেয়ার করে!</span>
class Good:
    def __init__(self):
        self.items = []    <span class="c"># প্রতিটা object-এর নিজস্ব</span></pre></div>

<h3>Multiple Inheritance ও MRO (Method Resolution Order)</h3>
<pre>class A:
    def hi(self): print("A")

class B(A):
    def hi(self):
        print("B"); super().hi()

class C(A):
    def hi(self):
        print("C"); super().hi()

class D(B, C):                      <span class="c"># diamond inheritance</span>
    def hi(self):
        print("D"); super().hi()

D().hi()                            <span class="c"># D B C A  — প্রতিটা class একবারই</span>
print([k.__name__ for k in D.__mro__])   <span class="c"># ['D', 'B', 'C', 'A', 'object']</span></pre>
<p><b>MRO</b> (C3 linearization) ঠিক করে method কোন ক্রমে খোঁজা হবে; <code>super()</code> "parent" নয়, বরং <b>MRO-র পরের class</b>-কে ডাকে — তাই diamond-এ <code>A</code> দুবার চলে না। <code>Class.__mro__</code> বা <code>Class.mro()</code> দিয়ে ক্রম দেখা যায়।</p>
<div class="callout best"><span class="tag">Mixin — multiple inheritance-এর নিরাপদ ব্যবহার</span>
Mixin ছোট, একটা নির্দিষ্ট আচরণ যোগ করা class (নিজে সাধারণত instance বানানো হয় না):
<pre>class JsonMixin:
    def to_json(self):
        import json
        return json.dumps(self.__dict__, ensure_ascii=False)

class User(JsonMixin):
    def __init__(self, name): self.name = name

print(User("রাসেল").to_json())      <span class="c"># {"name": "রাসেল"}</span></pre></div>

<h3>__slots__ — মেমরি বাঁচানো ও attribute সীমিত করা</h3>
<pre>class Point:
    __slots__ = ("x", "y")          <span class="c"># এই দুটো ছাড়া attribute নয়; প্রতি object-এ __dict__ নেই</span>
    def __init__(self, x, y): self.x, self.y = x, y

p = Point(1, 2)
<span class="c"># p.z = 3          # AttributeError — নতুন attribute যোগ করা যায় না</span></pre>
<p>লাখ লাখ ছোট object বানালে <code>__slots__</code> মেমরি উল্লেখযোগ্য কমায়। তবে dynamic attribute ও কিছু inheritance-সংক্রান্ত নমনীয়তা হারায় — সাধারণ প্রজেক্টে দরকার হয় না।</p>

<h3>Callable Object ও Container Protocol</h3>
<pre>class Multiplier:
    def __init__(self, n): self.n = n
    def __call__(self, x):              <span class="c"># object-কে function-এর মতো ডাকা যায়</span>
        return x * self.n

triple = Multiplier(3)
print(triple(5), callable(triple))      <span class="c"># 15 True</span>

class Playlist:
    def __init__(self, songs): self._songs = list(songs)
    def __len__(self): return len(self._songs)
    def __getitem__(self, i): return self._songs[i]       <span class="c"># index ও slice</span>
    def __iter__(self): return iter(self._songs)
    def __contains__(self, s): return s in self._songs

pl = Playlist(["a", "b", "c"])
print(len(pl), pl[0], pl[1:], "b" in pl, list(pl))   <span class="c"># 3 a ['b', 'c'] True ['a', 'b', 'c']</span></pre>
<div class="callout why"><span class="tag">Python-এর "data model"</span>
<code>len(x)</code>, <code>x[i]</code>, <code>for ... in x</code>, <code>in</code>, <code>x()</code> — সবই বিশেষ (dunder) method-এর সাথে বাঁধা। নিজের class-এ এগুলো দিলে সেটা built-in type-এর মতোই ব্যবহারযোগ্য হয় — এটাই Python-এর ডিজাইনের মূল ধারণা।</div>

<h3>Descriptor — property আসলে কীভাবে কাজ করে</h3>
<pre>class Positive:
    def __set_name__(self, owner, name):
        self.name = "_" + name
    def __get__(self, obj, objtype=None):
        return getattr(obj, self.name)
    def __set__(self, obj, value):
        if value &lt;= 0:
            raise ValueError("ধনাত্মক হতে হবে")
        setattr(obj, self.name, value)

class Product:
    price = Positive()                  <span class="c"># descriptor — attribute access নিয়ন্ত্রণ করে</span>
    qty = Positive()
    def __init__(self, price, qty):
        self.price, self.qty = price, qty

p = Product(10, 2)
<span class="c"># Product(-5, 1)      # ValueError — validation এক জায়গায়, একাধিক field-এ পুনর্ব্যবহারযোগ্য</span></pre>
<p>যে object-এ <code>__get__</code>/<code>__set__</code> থাকে সেটাই descriptor। <code>@property</code>, method binding, <code>@classmethod</code> সবই descriptor দিয়ে চলে। একই validation বহু attribute-এ লাগলে (যেমন "positive number") descriptor <code>@property</code>-এর চেয়ে কম পুনরাবৃত্তি দেয়।</p>

<h3>__init_subclass__ ও Metaclass (সংক্ষেপে)</h3>
<pre><span class="c"># সহজ plugin registry — metaclass ছাড়াই</span>
class Plugin:
    registry = {}
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        Plugin.registry[cls.__name__.lower()] = cls     <span class="c"># subclass বানানোর সময় নিজে register</span>

class Csv(Plugin): ...
class Json(Plugin): ...
print(list(Plugin.registry))        <span class="c"># ['csv', 'json']</span>

<span class="c"># class নিজেও একটা object, যা "type" দিয়ে বানানো</span>
Dynamic = type("Dynamic", (), {"hello": lambda self: "hi"})
print(Dynamic().hello())            <span class="c"># hi</span>
print(type(Dynamic), type(int))     <span class="c"># &lt;class 'type'&gt; &lt;class 'type'&gt;</span></pre>
<div class="callout best"><span class="tag">Metaclass কখন</span>
Metaclass হলো "class-এর class" — class তৈরির প্রক্রিয়া নিয়ন্ত্রণ করে (ORM/framework নির্মাতারা ব্যবহার করেন, যেমন Django model)। সাধারণ অ্যাপ কোডে প্রায় কখনো দরকার হয় না; বেশিরভাগ ক্ষেত্রে <code>__init_subclass__</code>, class decorator বা dataclass যথেষ্ট। "যদি ভাবেন metaclass লাগবে, সম্ভবত লাগবে না।"</div>

<h3>Design Pattern — Python-ধাঁচে</h3>
<pre><span class="c"># Singleton — Python-এ module নিজেই singleton</span>
<span class="c"># config.py:   settings = Settings()      →  অন্য সব জায়গায়  from config import settings</span>

<span class="c"># Factory — dict দিয়ে সরল</span>
handlers = {"csv": CsvExporter, "json": JsonExporter}
def make_exporter(kind): return handlers[kind]()

<span class="c"># Strategy — function-ই object, class লাগে না</span>
def pay_card(a): ...
def pay_bkash(a): ...
strategies = {"card": pay_card, "bkash": pay_bkash}
strategies["bkash"](500)</pre>
<p>Python-এ function first-class হওয়ায় অনেক Java/C#-ধাঁচের pattern (Strategy, Command, Factory) সরল function/dict-এ নেমে আসে — অকারণে class-hierarchy বানাবেন না।</p>
</template>

<template data-page="iterators">
<h2 class="title">১০. Comprehension, Iterator ও Generator</h2>
<p class="lead">Python-এর সবচেয়ে "Pythonic" অংশ — compact data transform আর lazy (প্রয়োজনমতো) মান তৈরি, যা বিশাল ডেটাতেও মেমরি বাঁচায়।</p>

<h3>Comprehension</h3>
<pre>nums = [1, 2, 3, 4, 5]

squares = [n * n for n in nums]                 <span class="c"># list comprehension</span>
evens = [n for n in nums if n % 2 == 0]         <span class="c"># শর্তসহ</span>
labels = ["even" if n % 2 == 0 else "odd" for n in nums]
pairs = [(x, y) for x in range(2) for y in range(2)]   <span class="c"># নেস্টেড</span>

word_len = {w: len(w) for w in ["py", "java"]}  <span class="c"># dict comprehension</span>
unique = {n % 3 for n in nums}                  <span class="c"># set comprehension</span>

print(squares)      <span class="c"># [1, 4, 9, 16, 25]</span>
print(word_len)     <span class="c"># {'py': 2, 'java': 4}</span></pre>
<div class="callout best"><span class="tag">কখন ব্যবহার করবেন না</span>
Comprehension সরল transform/filter-এর জন্য। দুইয়ের বেশি ভেতরের loop বা জটিল শর্ত হলে সাধারণ <code>for</code> loop বেশি পঠনযোগ্য।</div>

<h3>Iterator Protocol</h3>
<p>যেকোনো object <code>for</code> loop-এ চলে যদি তার <code>__iter__</code> ও <code>__next__</code> থাকে। <code>list</code>, <code>dict</code>, <code>str</code>, ফাইল — সব iterable।</p>
<pre>it = iter([10, 20])
print(next(it))     <span class="c"># 10</span>
print(next(it))     <span class="c"># 20</span>
<span class="c"># next(it)          # StopIteration — শেষ</span>

class Countdown:
    def __init__(self, n): self.n = n
    def __iter__(self): return self
    def __next__(self):
        if self.n &lt;= 0:
            raise StopIteration
        self.n -= 1
        return self.n + 1

print(list(Countdown(3)))     <span class="c"># [3, 2, 1]</span></pre>

<h3>Generator — yield দিয়ে lazy sequence</h3>
<pre>def countdown(n):
    while n &gt; 0:
        yield n            <span class="c"># মান দিয়ে থামে, পরের next()-এ এখান থেকে চলে</span>
        n -= 1

for x in countdown(3):
    print(x)               <span class="c"># 3 2 1</span>

<span class="c"># বিশাল ফাইল — একবারে একটা লাইন মেমরিতে</span>
def read_lines(path):
    with open(path, encoding="utf-8") as f:
        for line in f:
            yield line.rstrip("\n")

<span class="c"># generator expression — () দিয়ে, lazy</span>
total = sum(x * x for x in range(1_000_000))   <span class="c"># পুরো list বানায় না</span>
print(total)

def chain(*its):
    for it in its:
        yield from it       <span class="c"># অন্য iterable-এর সব মান দেওয়া</span>
print(list(chain([1, 2], "ab")))   <span class="c"># [1, 2, 'a', 'b']</span></pre>
<div class="callout why"><span class="tag">Generator কেন গুরুত্বপূর্ণ</span>
<code>[x for x in range(10**8)]</code> মেমরিতে ১০ কোটি মান রাখে; <code>(x for x in range(10**8))</code> একবারে একটা। বড় ডেটা প্রসেসিং, streaming response ও pipeline-এ generator অপরিহার্য। মনে রাখুন: generator একবারই iterate করা যায়।</div>

<h3>itertools — কাজের টুলবক্স</h3>
<pre>from itertools import islice, chain, product, groupby, count

print(list(islice(count(1), 5)))                 <span class="c"># [1, 2, 3, 4, 5]</span>
print(list(product("ab", [1, 2])))               <span class="c"># [('a',1),('a',2),('b',1),('b',2)]</span>
print(list(chain([1, 2], [3])))                  <span class="c"># [1, 2, 3]</span>

data = [("a", 1), ("a", 2), ("b", 3)]
for key, grp in groupby(data, key=lambda t: t[0]):   <span class="c"># আগে sort থাকতে হবে</span>
    print(key, [v for _, v in grp])              <span class="c"># a [1, 2]  /  b [3]</span></pre>

<template data-page="decorators">
<h2 class="title">১১. Decorator, Closure ও Context Manager</h2>
<p class="lead">এই তিনটা ধারণা Python-কে advanced স্তরে নিয়ে যায় — FastAPI-র route (<code>@app.get</code>), caching, logging, retry, <code>with</code> statement — সবকিছুর পেছনে এগুলোই।</p>

<h3>Closure — ভেতরের function বাইরের variable মনে রাখে</h3>
<pre>def make_multiplier(n):
    def multiply(x):
        return x * n          <span class="c"># n বাইরের scope থেকে "ধরে রাখা"</span>
    return multiply

double = make_multiplier(2)
triple = make_multiplier(3)
print(double(5), triple(5))   <span class="c"># 10 15</span></pre>

<h3>Decorator — function-কে মুড়ে নতুন আচরণ যোগ</h3>
<pre>import time
from functools import wraps

def timer(func):
    @wraps(func)                       <span class="c"># মূল function-এর নাম/docstring ধরে রাখে</span>
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        print(f"{func.__name__} নিল {time.perf_counter() - start:.4f}s")
        return result
    return wrapper

@timer                                 <span class="c"># slow = timer(slow) এর সংক্ষিপ্ত রূপ</span>
def slow(n):
    return sum(range(n))

slow(1_000_000)    <span class="c"># slow নিল 0.0xxxs</span></pre>

<h3>Argument-সহ Decorator</h3>
<pre>from functools import wraps

def retry(times=3):
    def decorator(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            for attempt in range(1, times + 1):
                try:
                    return func(*args, **kwargs)
                except Exception as e:
                    print(f"চেষ্টা {attempt} ব্যর্থ: {e}")
                    if attempt == times:
                        raise
        return wrapper
    return decorator

@retry(times=3)
def flaky():
    raise RuntimeError("network error")</pre>
<div class="callout mistake"><span class="tag">Common mistake — @wraps ভুলে যাওয়া</span>
<code>@wraps(func)</code> ছাড়া decorated function-এর <code>__name__</code>, docstring ও signature হারিয়ে যায় — debugging ও FastAPI-র মতো introspection-নির্ভর framework-এ সমস্যা হয়।</div>

<h3>বিল্ট-ইন কাজের decorator</h3>
<pre>from functools import lru_cache, cache

@lru_cache(maxsize=128)         <span class="c"># একই argument-এ ফলাফল মনে রাখে (memoization)</span>
def fib(n):
    return n if n &lt; 2 else fib(n - 1) + fib(n - 2)

print(fib(80))                  <span class="c"># দ্রুত — cache ছাড়া অসম্ভব ধীর</span>
print(fib.cache_info())</pre>

<h3>Context Manager — with statement-এর পেছনের রহস্য</h3>
<pre><span class="c"># class দিয়ে</span>
class Timer:
    def __enter__(self):
        import time; self.t = time.perf_counter(); return self
    def __exit__(self, exc_type, exc, tb):
        import time; print(f"{time.perf_counter() - self.t:.3f}s")
        return False            <span class="c"># False = exception চাপা দেয় না</span>

with Timer():
    sum(range(1_000_000))

<span class="c"># contextlib দিয়ে (সহজ)</span>
from contextlib import contextmanager

@contextmanager
def opened(path):
    f = open(path, encoding="utf-8")
    try:
        yield f                 <span class="c"># with-এর ভেতরে এটা পাওয়া যায়</span>
    finally:
        f.close()               <span class="c"># exception হলেও cleanup</span></pre>
<div class="callout why"><span class="tag">FastAPI-তে এগুলোর ব্যবহার</span>
Route decorator (<code>@app.get("/")</code>) function-কে router-এ register করে; <code>yield</code>-যুক্ত dependency (DB session) আসলে context manager-এর মতো setup/cleanup চালায় (অধ্যায় ১৯ ও ২০)।</div>

<h3>Class-ভিত্তিক Decorator ও Class-এ Decorator</h3>
<pre>class CountCalls:
    def __init__(self, func):
        self.func = func
        self.calls = 0
    def __call__(self, *args, **kwargs):      <span class="c"># object-কে function-এর মতো ডাকা</span>
        self.calls += 1
        return self.func(*args, **kwargs)

@CountCalls
def hello(): return "hi"

hello(); hello()
print(hello.calls)                           <span class="c"># 2</span>

<span class="c"># class-কে decorate করা — register করার প্যাটার্ন</span>
REGISTRY = {}
def register(cls):
    REGISTRY[cls.__name__] = cls
    return cls

@register
class Handler: ...
print(REGISTRY)                              <span class="c"># {'Handler': &lt;class '...Handler'&gt;}</span>

<span class="c"># একাধিক decorator — নিচেরটা আগে প্রয়োগ হয়</span>
@timer
@retry(times=2)
def job(): ...           <span class="c"># job = timer(retry(times=2)(job))</span></pre>

<h3>functools-এর কাজের টুল</h3>
<pre>from functools import partial, reduce, singledispatch, cached_property, cache

<span class="c"># partial — কিছু argument আগে বেঁধে নতুন function</span>
def power(base, exp): return base ** exp
square = partial(power, exp=2)
print(square(7))                              <span class="c"># 49</span>

<span class="c"># reduce — ক্রমান্বয়ে জমা</span>
print(reduce(lambda a, b: a * b, [1, 2, 3, 4]))   <span class="c"># 24</span>

<span class="c"># singledispatch — type অনুযায়ী আলাদা implementation</span>
@singledispatch
def show(x): return f"অজানা: {x}"
@show.register
def _(x: int): return f"int: {x}"
@show.register
def _(x: list): return f"list of {len(x)}"
print(show(5), show([1, 2]), show("a"))      <span class="c"># int: 5  list of 2  অজানা: a</span>

<span class="c"># cached_property — প্রথমবার হিসাব, পরে মনে রাখে</span>
class Report:
    @cached_property
    def heavy(self):
        print("হিসাব চলছে...")
        return sum(range(10**6))
r = Report(); r.heavy; r.heavy               <span class="c"># "হিসাব চলছে..." একবারই</span></pre>
<div class="callout best"><span class="tag">Best practice</span>
Decorator সবসময় <code>@wraps</code> ব্যবহার করুন, আর side-effect ও state (counter, cache) থাকলে thread-safety ভাবুন। জটিল cross-cutting কাজ (auth, retry, logging) decorator-এ দিলে business লজিক পরিষ্কার থাকে — কিন্তু অতিরিক্ত stacking ডিবাগ কঠিন করে।</div>
</template>

<template data-page="typing">
<h2 class="title">১২. Type Hints ও Static Typing</h2>
<p class="lead">Python runtime-এ type জোর করে না, কিন্তু type hint কোডকে ডকুমেন্টেড করে, IDE-তে autocomplete দেয়, <code>mypy</code>/<code>pyright</code>-এ ভুল ধরে — আর FastAPI ও Pydantic তো type hint-এর উপরেই দাঁড়িয়ে।</p>

<h3>মৌলিক Type Hint</h3>
<pre>def add(a: int, b: int) -&gt; int:
    return a + b

name: str = "Rasel"
scores: list[int] = [90, 80]                 <span class="c"># 3.9+: list[int] (typing.List নয়)</span>
user: dict[str, int] = {"age": 30}
point: tuple[int, int] = (3, 4)
maybe: int | None = None                      <span class="c"># 3.10+: Optional[int]-এর বদলে</span>

def find(users: list[str], name: str) -&gt; str | None:
    return name if name in users else None</pre>
<div class="callout why"><span class="tag">Hint শুধু "হিন্ট" — runtime-এ কিছু আটকায় না</span>
<code>add("a", "b")</code> লিখলেও Python চালাবে (<code>"ab"</code>)। ভুল ধরতে <code>mypy</code> বা <code>pyright</code> চালান; আর FastAPI/Pydantic hint ব্যবহার করে <b>runtime validation</b>-ও করে — এটাই তাদের শক্তি।</div>

<h3>টাইপিং-এর কাজের টুল</h3>
<pre>from typing import Any, Callable, Literal, TypedDict, Optional, Annotated
from collections.abc import Iterable, Sequence

Mode = Literal["r", "w", "a"]                <span class="c"># শুধু এই মানগুলো</span>

class UserDict(TypedDict):                   <span class="c"># নির্দিষ্ট key-সহ dict</span>
    id: int
    name: str

def apply(f: Callable[[int], int], xs: Iterable[int]) -&gt; list[int]:
    return [f(x) for x in xs]

print(apply(lambda x: x + 1, [1, 2]))        <span class="c"># [2, 3]</span>

<span class="c"># Generic function (3.12 syntax)</span>
def first[T](items: Sequence[T]) -&gt; T:
    return items[0]</pre>

<h3>Protocol — structural typing (duck typing-এর type-safe রূপ)</h3>
<pre>from typing import Protocol

class SupportsClose(Protocol):
    def close(self) -&gt; None: ...

def shutdown(res: SupportsClose) -&gt; None:
    res.close()                 <span class="c"># close() আছে এমন যেকোনো object চলবে, inheritance ছাড়াই</span></pre>

<h3>mypy চালানো</h3>
<pre>pip install mypy
mypy app/                       <span class="c"># type ভুল রিপোর্ট করে</span>
<span class="c"># অথবা pyright / VS Code-এর Pylance</span></pre>
<div class="callout best"><span class="tag">Best practice</span>
নতুন কোডে function signature-এ সবসময় type hint দিন (parameter ও return)। CI-তে <code>mypy</code> বা <code>pyright</code> চালালে অনেক bug runtime-এর আগেই ধরা পড়ে।</div>
</template>

<h2 class="title">১৩. Standard Library — যেসব built-in module প্রতিদিন লাগে</h2>
<p class="lead">Python-এর "batteries included" দর্শন — অনেক কাজের জন্য আলাদা package install না করেই চলে। সবচেয়ে বেশি কাজে লাগা module-গুলো এখানে।</p>

<h3>collections — বিশেষায়িত container</h3>
<pre>from collections import Counter, defaultdict, deque, namedtuple, OrderedDict

print(Counter("banana"))                 <span class="c"># Counter({'a': 3, 'n': 2, 'b': 1})</span>
print(Counter("banana").most_common(1))  <span class="c"># [('a', 3)]</span>

groups = defaultdict(list)               <span class="c"># key না থাকলে নিজে list বানায়</span>
for word in ["apple", "ant", "bat"]:
    groups[word[0]].append(word)
print(dict(groups))                      <span class="c"># {'a': ['apple', 'ant'], 'b': ['bat']}</span>

q = deque([1, 2, 3], maxlen=3)           <span class="c"># দুই প্রান্তে O(1) যোগ/মোছা</span>
q.append(4)                              <span class="c"># বাঁ প্রান্তের 1 পড়ে যায়</span>
print(q)                                 <span class="c"># deque([2, 3, 4], maxlen=3)</span>

Point = namedtuple("Point", "x y")
print(Point(1, 2).x)                     <span class="c"># 1</span></pre>

<h3>datetime — তারিখ ও সময়</h3>
<pre>from datetime import datetime, date, timedelta, timezone

now = datetime.now(timezone.utc)                       <span class="c"># timezone-aware (সুপারিশকৃত)</span>
print(now.isoformat())
d = date(2026, 1, 15)
print(d + timedelta(days=30))                          <span class="c"># 2026-02-14</span>
print(d.strftime("%d-%m-%Y"))                          <span class="c"># 15-01-2026</span>
parsed = datetime.strptime("2026-01-15 10:30", "%Y-%m-%d %H:%M")
print((datetime(2026, 3, 1) - datetime(2026, 1, 1)).days)   <span class="c"># 59</span></pre>
<div class="callout best"><span class="tag">Best practice</span>
সার্ভারে সময় সংরক্ষণে সবসময় UTC ও timezone-aware datetime ব্যবহার করুন; শুধু দেখানোর সময় লোকাল timezone-এ রূপান্তর করুন। Python 3.9+-এ <code>zoneinfo</code> দিয়ে timezone সামলানো যায়।</div>

<h3>re — Regular Expression</h3>
<pre>import re

text = "যোগাযোগ: rasel@example.com, 01712-345678"
print(re.findall(r"[\w.]+@[\w.]+", text))             <span class="c"># ['rasel@example.com']</span>

<h3>logging — print-এর বদলে</h3>
<pre>import logging

logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s %(levelname)s %(name)s: %(message)s",
)

log.info("সার্ভার চালু")
log.warning("ডিস্ক ৮০% ভর্তি")

<div class="callout why"><span class="tag">কেন print নয়</span>
logging-এ level (DEBUG/INFO/WARNING/ERROR) ঠিক করা যায়, ফাইল/service-এ পাঠানো যায়, timestamp ও module নাম আসে, আর production-এ বন্ধ/চালু করা যায়। প্রতিটা module-এ <code>logging.getLogger(__name__)</code> ব্যবহার করুন।</div>

<h3>argparse, subprocess, shutil, uuid, secrets, hashlib</h3>
<pre>import argparse, subprocess, uuid, secrets, hashlib

<h2 class="title">১৪. Concurrency — Thread, Process ও asyncio</h2>
<p class="lead">একসাথে একাধিক কাজ চালানোর তিনটা পথ আছে, আর কোনটা কখন — তা নির্ভর করে কাজটা I/O-bound নাকি CPU-bound-এর উপর। এটা না বুঝলে "async করলাম তবু ধীর" জাতীয় ভুল হয়।</p>

<h3>I/O-bound বনাম CPU-bound</h3>
<table>
<tr><th>ধরন</th><th>উদাহরণ</th><th>সেরা সমাধান</th></tr>
<tr><td><span class="kw">I/O-bound</span></td><td>HTTP call, DB query, ফাইল পড়া — বেশিরভাগ সময় অপেক্ষায় কাটে</td><td><code>asyncio</code> বা threading</td></tr>
<tr><td><span class="kw">CPU-bound</span></td><td>ছবি প্রসেসিং, বড় গণনা, compression</td><td><code>multiprocessing</code> (আলাদা process)</td></tr>
</table>

<h3>GIL — Global Interpreter Lock</h3>
<p>CPython-এ একটা মুহূর্তে শুধু একটা thread Python bytecode চালাতে পারে — এটাই <span class="kw">GIL</span>। ফলে CPU-heavy কাজে thread দিয়ে একাধিক core ব্যবহার হয় না। কিন্তু I/O-তে অপেক্ষার সময় GIL ছেড়ে দেওয়া হয়, তাই I/O-bound কাজে thread/asyncio কার্যকর। CPU-bound কাজে আলাদা process (প্রতিটার নিজস্ব GIL) ব্যবহার করুন। (সাম্প্রতিক Python সংস্করণে free-threaded বিল্ড নিয়ে কাজ চলছে — বর্তমান অবস্থা ডকুমেন্টেশনে দেখুন।)</p>

<h3>threading — I/O-bound কাজে সহজ concurrency</h3>
<pre>from concurrent.futures import ThreadPoolExecutor
import time

def fetch(i):
    time.sleep(1)               <span class="c"># নেটওয়ার্ক অপেক্ষার প্রতীক</span>
    return f"result {i}"

start = time.perf_counter()
with ThreadPoolExecutor(max_workers=5) as ex:
    results = list(ex.map(fetch, range(5)))
print(results, f"{time.perf_counter() - start:.1f}s")   <span class="c"># ~1s, ৫s নয়</span></pre>

<h3>multiprocessing — CPU-bound কাজ</h3>
<pre>from concurrent.futures import ProcessPoolExecutor

def heavy(n):
    return sum(i * i for i in range(n))

if __name__ == "__main__":          <span class="c"># Windows-এ বাধ্যতামূলক গার্ড</span>
    with ProcessPoolExecutor() as ex:
        print(list(ex.map(heavy, [10**6, 10**6, 10**6])))</pre>

<h3>asyncio — একটা thread-এ হাজারো I/O কাজ</h3>
<pre>import asyncio

async def fetch(i):
    await asyncio.sleep(1)          <span class="c"># await-এ থামলে event loop অন্য কাজ চালায়</span>
    return f"result {i}"

async def main():
    results = await asyncio.gather(*(fetch(i) for i in range(5)))   <span class="c"># একসাথে</span>
    print(results)

asyncio.run(main())                 <span class="c"># ~1s</span></pre>

<div class="callout mistake"><span class="tag">Common mistake — async function-এর ভেতরে blocking call</span>
<pre>async def bad():

<code>async def</code> নিজে কিছু দ্রুত করে না — শুধু <code>await</code>-এর জায়গায় অন্য কাজ করতে দেয়। ভেতরে blocking কোড থাকলে পুরো সার্ভার জমে যায় (FastAPI-তে এটা খুব গুরুত্বপূর্ণ — অধ্যায় ২২)।</div>

<h3>Thread-এ Race Condition ও Lock</h3>
<pre>import threading

counter = 0
lock = threading.Lock()

def work():
    global counter
    for _ in range(100_000):
        with lock:                 <span class="c"># একসময়ে একটা thread-ই এই অংশে</span>
            counter += 1           <span class="c"># read → +1 → write — atomic নয়!</span>

threads = [threading.Thread(target=work) for _ in range(4)]
for t in threads: t.start()
for t in threads: t.join()
print(counter)                     <span class="c"># 400000 — lock ছাড়া কম আসতে পারে</span></pre>
<div class="callout why"><span class="tag">GIL থাকলেও Lock কেন লাগে</span>
GIL একটা bytecode instruction-কে নিরাপদ করে, কিন্তু <code>counter += 1</code> কয়েকটা instruction (পড়া, যোগ, লেখা) — মাঝপথে thread বদলে গেলে আপডেট হারায়। shared mutable state-এ <code>Lock</code>, অথবা আরও ভালো: thread-দের মধ্যে ডেটা <code>queue.Queue</code> দিয়ে পাঠান।</div>

<h3>Producer–Consumer — queue.Queue</h3>
<pre>import queue, threading

q = queue.Queue(maxsize=10)        <span class="c"># thread-safe</span>

def producer():

        q.put(i)

def consumer():

        print("প্রসেস:", item)
        q.task_done()

threading.Thread(target=producer).start()
c = threading.Thread(target=consumer); c.start(); c.join()</pre>

<h3>asyncio — Task, TaskGroup ও Timeout</h3>
<pre>import asyncio

async def fetch(n, delay):
    await asyncio.sleep(delay)
    if n == 3:
        raise ValueError("fail")
    return n

async def main():
    <span class="c"># create_task — coroutine-কে এখনই background-এ চালু করে</span>
    t1 = asyncio.create_task(fetch(1, 1))
    t2 = asyncio.create_task(fetch(2, 1))
    print(await t1, await t2)                          <span class="c"># 1 2 — মোট ~১ সেকেন্ড</span>

    <span class="c"># gather — সব ফল একসাথে; return_exceptions=True হলে ব্যর্থতা exception object হিসেবে আসে</span>
    res = await asyncio.gather(fetch(1, 0.1), fetch(3, 0.1), return_exceptions=True)
    print(res)                                         <span class="c"># [1, ValueError('fail')]</span>

    <span class="c"># TaskGroup (3.11+) — structured concurrency: একটা ব্যর্থ হলে বাকিগুলো বাতিল</span>
    try:
        async with asyncio.TaskGroup() as tg:
            tg.create_task(fetch(1, 0.1))
            tg.create_task(fetch(3, 0.1))
    except* ValueError as eg:                          <span class="c"># ExceptionGroup (3.11+)</span>
        print("ব্যর্থ:", eg.exceptions)

    <span class="c"># Timeout</span>
    try:
        async with asyncio.timeout(0.5):               <span class="c"># 3.11+</span>
            await asyncio.sleep(5)
    except TimeoutError:
        print("সময় শেষ")
        <span class="c"># পুরনো সংস্করণ: await asyncio.wait_for(coro, timeout=0.5)</span>

asyncio.run(main())</pre>

<h3>Async Queue ও Async Generator</h3>
<pre>import asyncio

async def producer(q):
    for i in range(3):
        await q.put(i)
        await asyncio.sleep(0.1)
    await q.put(None)

async def consumer(q):
    while (item := await q.get()) is not None:
        print("পেলাম:", item)

async def ticker(n):                  <span class="c"># async generator</span>
    for i in range(n):
        await asyncio.sleep(0.1)
        yield i

async def main():
    q = asyncio.Queue()
    await asyncio.gather(producer(q), consumer(q))
    async for t in ticker(3):         <span class="c"># async for</span>
        print("tick", t)

asyncio.run(main())</pre>
<div class="callout mistake"><span class="tag">Common mistake — create_task-এর reference হারানো ও exception গিলে ফেলা</span>
<code>asyncio.create_task(coro())</code> ফল variable-এ না রাখলে task garbage-collected হয়ে যেতে পারে, আর ভেতরের exception কেউ <code>await</code> না করলে চুপচাপ হারায়। task-গুলো সংগ্রহ করে <code>await</code>/<code>gather</code> করুন, অথবা <code>TaskGroup</code> ব্যবহার করুন (3.11+)।</div>

<h3>Request কীভাবে প্রসেস হয়</h3>
<div class="diagram"><pre>
Client → Uvicorn (ASGI server) → Middleware → Router (path মেলানো)
       → Dependency (Depends) → Validation (Pydantic: path/query/body)
       → আপনার endpoint function → return মান → response_model দিয়ে serialize → JSON Response
       (validation ব্যর্থ হলে endpoint চলার আগেই 422 Unprocessable Entity)
</pre></div>

<h3>Path Parameter</h3>
<pre>@app.get("/users/{user_id}")
def get_user(user_id: int):            <span class="c"># int না হলে স্বয়ংক্রিয় 422 error</span>
    return {"user_id": user_id}

<span class="c"># GET /users/42     → {"user_id": 42}</span>
<span class="c"># GET /users/abc    → 422 (int parse ব্যর্থ)</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — route-এর ক্রম</span>
FastAPI উপর থেকে নিচে মেলায়। <code>/users/{user_id}</code> আগে লিখলে <code>/users/me</code> সেটাতেই ধরা পড়ে (<code>"me"</code> int নয় → 422)। নির্দিষ্ট path (<code>/users/me</code>) আগে, parameter-যুক্ত path পরে লিখুন।
<pre>@app.get("/users/me")
def me(): return {"user": "current"}

@app.get("/users/{user_id}")
def get_user(user_id: int): return {"user_id": user_id}</pre></div>

<h3>Query Parameter ও Validation</h3>
<pre>from typing import Annotated
from fastapi import Query

@app.get("/items")
def list_items(
    skip: int = 0,                                    <span class="c"># ?skip=10  (ডিফল্ট আছে → ঐচ্ছিক)</span>
    limit: Annotated[int, Query(ge=1, le=100)] = 10,  <span class="c"># 1..100 এর মধ্যে</span>
    q: str | None = None,                             <span class="c"># ঐচ্ছিক string</span>
    tags: Annotated[list[str] | None, Query()] = None <span class="c"># ?tags=a&amp;tags=b</span>
):
    return {"skip": skip, "limit": limit, "q": q, "tags": tags}

<span class="c"># GET /items?skip=5&amp;limit=20&amp;q=pen</span></pre>

def by_category(cat: Category):                       <span class="c"># শুধু food/travel গ্রহণযোগ্য</span>

@app.get("/orders/{order_id}")
def order(order_id: Annotated[int, Path(gt=0, description="অর্ডার ID")]):

<h3>ASP.NET Core থেকে FastAPI — ধারণা-মানচিত্র</h3>
<table>
<tr><th>ASP.NET Core (C#)</th><th>FastAPI (Python)</th></tr>
<tr><td>Controller / Minimal API endpoint</td><td><code>APIRouter</code> / <code>@app.get(...)</code> function</td></tr>
<tr><td>DTO / ViewModel + DataAnnotations/FluentValidation</td><td>Pydantic <code>BaseModel</code> + <code>Field</code>, <code>@field_validator</code></td></tr>
<tr><td>Model binding (<code>[FromBody]</code>, <code>[FromQuery]</code>)</td><td>parameter-এর type/অবস্থান থেকে স্বয়ংক্রিয় (<code>Body</code>, <code>Query</code>, <code>Path</code>)</td></tr>
<tr><td>Dependency Injection container</td><td><code>Depends()</code> (function-ভিত্তিক)</td></tr>
<tr><td>Middleware pipeline</td><td><code>@app.middleware("http")</code> / Starlette middleware</td></tr>
<tr><td><code>appsettings.json</code> + Options pattern</td><td><code>.env</code> + <code>pydantic-settings</code> (<code>BaseSettings</code>)</td></tr>
<tr><td>Entity Framework Core</td><td>SQLAlchemy (বা SQLModel)</td></tr>
<tr><td>EF Migrations</td><td>Alembic</td></tr>
<tr><td>Swagger/Swashbuckle (সেটআপ লাগে)</td><td>built-in <code>/docs</code>, <code>/redoc</code></td></tr>
<tr><td><code>[Authorize]</code> + JWT Bearer</td><td><code>Depends(get_current_user)</code> + <code>OAuth2PasswordBearer</code></td></tr>
<tr><td>Exception filter / <code>ProblemDetails</code></td><td><code>exception_handler</code>, <code>HTTPException</code></td></tr>
<tr><td><code>IHostedService</code> / BackgroundService</td><td><code>lifespan</code>, <code>BackgroundTasks</code>, Celery</td></tr>
<tr><td>xUnit + <code>WebApplicationFactory</code></td><td>pytest + <code>TestClient</code> + <code>dependency_overrides</code></td></tr>
<tr><td>Kestrel</td><td>Uvicorn (ASGI server)</td></tr>

<div class="callout why"><span class="tag">মূল পার্থক্যটা কোথায়</span>
C#-এ type compile-time-এ জোর করা হয়; Python/FastAPI-তে type hint <b>runtime-এ Pydantic দিয়ে validation</b> হিসেবে কাজ করে। DI-তে container-registration নেই — dependency সরাসরি function parameter-এ <code>Depends</code> দিয়ে ঘোষণা করা হয়। lifetime (scoped/singleton) মূলত <code>yield</code> dependency, <code>lru_cache</code> বা <code>app.state</code> দিয়ে নিয়ন্ত্রিত হয়।</div>

<template data-page="fastapi-models">
<h2 class="title">১৮. FastAPI — Pydantic, Request Body ও Response Model</h2>
<p class="lead">JSON body পাওয়া, validate করা, আর ঠিক যতটুকু ডেটা ফেরত দেওয়া দরকার ততটুকুই পাঠানো (যেমন password কখনো না) — এই কাজগুলোর কেন্দ্রে Pydantic model।</p>

<h3>Request Body</h3>
<pre>from decimal import Decimal
from datetime import date
from pydantic import BaseModel, Field
from fastapi import FastAPI

app = FastAPI()

class ExpenseCreate(BaseModel):
    title: str = Field(min_length=2, max_length=100)
    amount: Decimal = Field(gt=0, max_digits=12, decimal_places=2)
    category: str = "general"
    spent_on: date | None = None

@app.post("/expenses", status_code=201)
def create_expense(body: ExpenseCreate):       <span class="c"># JSON → validated object</span>
    return {"saved": body.model_dump(mode="json")}

<span class="c"># POST /expenses   {"title":"Lunch","amount":"250.50"}</span>
<span class="c"># amount ঋণাত্মক বা title ছোট হলে → 422 + কোথায় ভুল তার বিস্তারিত</span></pre>
<p>validation ব্যর্থ হলে FastAPI স্বয়ংক্রিয়ভাবে এরকম response দেয়:</p>
<pre>{
  "detail": [
    {"type": "greater_than", "loc": ["body", "amount"],
     "msg": "Input should be greater than 0", "input": "-5"}
  ]
}</pre>

<h3>Nested Model ও List</h3>
<pre>class Line(BaseModel):
    account: str
    debit: Decimal = Decimal("0")
    credit: Decimal = Decimal("0")

class Voucher(BaseModel):
    narration: str
    lines: list[Line] = Field(min_length=2)       <span class="c"># কমপক্ষে ২টা line</span>

@app.post("/vouchers")
def post_voucher(v: Voucher):
    return {"lines": len(v.lines)}</pre>

<h3>Custom Validation</h3>
<pre>from pydantic import field_validator, model_validator

class Voucher(BaseModel):
    narration: str
    lines: list[Line] = Field(min_length=2)

    @field_validator("narration")
    @classmethod
    def not_blank(cls, v: str) -&gt; str:
        if not v.strip():
            raise ValueError("narration খালি হবে না")
        return v.strip()

    @model_validator(mode="after")
    def balanced(self):                              <span class="c"># পুরো object যাচাই</span>
        d = sum(l.debit for l in self.lines)
        c = sum(l.credit for l in self.lines)
        if d != c:
            raise ValueError(f"debit ({d}) ও credit ({c}) সমান নয়")
        return self</pre>
<div class="callout best"><span class="tag">Accounting-এর উদাহরণ কেন</span>
"Debit = Credit" এই ব্যবসায়িক নিয়ম model-এর ভেতরেই রাখলে endpoint পর্যন্ত ভুল ডেটা পৌঁছায়ই না — validation এক জায়গায়, পুনর্ব্যবহারযোগ্য।</div>

<h3>Response Model — ভেতরের ডেটা ফাঁস না করা</h3>
<pre>from pydantic import BaseModel, EmailStr   <span class="c"># EmailStr-এর জন্য: pip install email-validator</span>

class UserCreate(BaseModel):
    email: EmailStr
    password: str = Field(min_length=8)

class UserRead(BaseModel):                    <span class="c"># password নেই!</span>
    id: int
    email: EmailStr

@app.post("/users", response_model=UserRead, status_code=201)
def create_user(data: UserCreate):
    saved = {"id": 1, "email": data.email, "password_hash": "xxxx"}
    return saved        <span class="c"># response_model শুধু id ও email ছাঁকনি দিয়ে পাঠায়</span></pre>
<div class="callout why"><span class="tag">কেন আলাদা Create/Read/Update schema</span>
একটাই model সব জায়গায় ব্যবহার করলে client-এর পাঠানো <code>id</code>, বা response-এ <code>password_hash</code> ফাঁসের ঝুঁকি থাকে। প্রতিটা উদ্দেশ্যে আলাদা schema (<code>XCreate</code>, <code>XUpdate</code>, <code>XRead</code>) রাখা নিরাপদ ও স্পষ্ট।</div>

<h3>PUT বনাম PATCH — আংশিক আপডেট</h3>
<pre>class ExpenseUpdate(BaseModel):
    title: str | None = None
    amount: Decimal | None = None
    category: str | None = None

fake_db = {1: {"title": "Lunch", "amount": Decimal("250"), "category": "food"}}

@app.patch("/expenses/{eid}")
def patch_expense(eid: int, body: ExpenseUpdate):
    if eid not in fake_db:
        raise HTTPException(404, "পাওয়া যায়নি")
    changes = body.model_dump(exclude_unset=True)   <span class="c"># শুধু client যা পাঠিয়েছে</span>
    fake_db[eid].update(changes)
    return fake_db[eid]</pre>

<h3>ORM object থেকে সরাসরি — from_attributes</h3>
<pre>from pydantic import ConfigDict

class ExpenseRead(BaseModel):
    model_config = ConfigDict(from_attributes=True)   <span class="c"># SQLAlchemy object পড়তে পারবে</span>
    id: int
    title: str
    amount: Decimal

<span class="c"># return করলে (ORM object) → ExpenseRead-এ রূপান্তর</span>
<span class="c"># ExpenseRead.model_validate(orm_obj)</span></pre>

<h3>Form ও File Upload</h3>
<pre>from fastapi import Form, UploadFile, File   <span class="c"># pip install python-multipart (fastapi[standard]-তে আছে)</span>

@app.post("/login-form")
def login(username: Annotated[str, Form()], password: Annotated[str, Form()]):
    return {"user": username}

@app.post("/upload")
async def upload(file: UploadFile):
    content = await file.read()
    return {"name": file.filename, "type": file.content_type, "size": len(content)}</pre>
<div class="callout mistake"><span class="tag">Common mistake — বিশাল ফাইল পুরোটা মেমরিতে পড়া</span>
<code>await file.read()</code> পুরো ফাইল RAM-এ আনে। বড় ফাইলে chunk করে পড়ুন (<code>await file.read(1024*1024)</code> লুপে) এবং আকার/type সীমা যাচাই করুন।</div>

<h3>Custom Exception Handler</h3>
<pre>from fastapi import Request
from fastapi.responses import JSONResponse

class InsufficientFunds(Exception):
    def __init__(self, need): self.need = need

@app.exception_handler(InsufficientFunds)
async def handle(request: Request, exc: InsufficientFunds):

<template data-page="fastapi-di">
<h2 class="title">১৯. FastAPI — Dependency Injection, Router ও Project Structure</h2>
<p class="lead"><code>Depends()</code> FastAPI-র সবচেয়ে শক্তিশালী ফিচার — DB session, লগইন করা user, pagination, settings — সব পুনর্ব্যবহারযোগ্যভাবে endpoint-এ "inject" হয়। .NET-এর DI container-এর কাছাকাছি, কিন্তু function-ভিত্তিক।</p>

<h3>Depends — সবচেয়ে সরল রূপ</h3>
<pre>from typing import Annotated
from fastapi import Depends, FastAPI

app = FastAPI()

def pagination(skip: int = 0, limit: int = 20):
    return {"skip": skip, "limit": min(limit, 100)}

Page = Annotated[dict, Depends(pagination)]       <span class="c"># পুনর্ব্যবহারযোগ্য alias</span>

@app.get("/items")
def items(page: Page):
    return page

@app.get("/users")
def users(page: Page):                           <span class="c"># একই লজিক, কোড-পুনরাবৃত্তি নেই</span>
    return page</pre>

<h3>yield — setup ও cleanup (DB session-এর প্যাটার্ন)</h3>
<pre>def get_db():
    db = SessionLocal()          <span class="c"># সংযোগ খোলা</span>
    try:
        yield db                 <span class="c"># endpoint-এ এটা পাঠানো হয়</span>
    finally:
        db.close()               <span class="c"># response শেষে সবসময় বন্ধ (error হলেও)</span>

DB = Annotated[Session, Depends(get_db)]

@app.get("/expenses")
def list_expenses(db: DB):
    return db.query(...).all()</pre>

<h3>Sub-dependency ও Class dependency</h3>
<pre>def get_token(authorization: Annotated[str | None, Header()] = None):
    if not authorization:
        raise HTTPException(401, "token নেই")
    return authorization.removeprefix("Bearer ")

def get_current_user(token: Annotated[str, Depends(get_token)]):   <span class="c"># অন্য dependency-র উপর নির্ভর</span>
    return {"user": decode(token)}

class Pager:                                      <span class="c"># class-ও dependency হতে পারে</span>
    def __init__(self, skip: int = 0, limit: int = 20):
        self.skip, self.limit = skip, limit

@app.get("/things")
def things(p: Annotated[Pager, Depends()]):
    return {"skip": p.skip, "limit": p.limit}</pre>

<h3>APIRouter — endpoint ভাগ করা</h3>
<pre><span class="c"># app/routers/expenses.py</span>
from fastapi import APIRouter, Depends

router = APIRouter(
    prefix="/expenses",
    tags=["expenses"],                            <span class="c"># docs-এ গ্রুপ</span>
    dependencies=[Depends(get_current_user)],     <span class="c"># এই router-এর সব endpoint-এ লগইন বাধ্যতামূলক</span>
)

@router.get("/")
def list_expenses(): ...

@router.post("/", status_code=201)
def create_expense(): ...

<span class="c"># app/main.py</span>
from fastapi import FastAPI
from app.routers import expenses, users

app = FastAPI()
app.include_router(expenses.router, prefix="/api/v1")    <span class="c"># /api/v1/expenses/</span>
app.include_router(users.router, prefix="/api/v1")</pre>

<h3>প্রস্তাবিত Project Structure</h3>
<pre>project/
├── app/
│   ├── main.py                <span class="c"># FastAPI app, router include, lifespan</span>
│   ├── config.py              <span class="c"># settings (pydantic-settings)</span>
│   ├── database.py            <span class="c"># engine, SessionLocal, Base, get_db</span>
│   ├── models/                <span class="c"># SQLAlchemy ORM model</span>
│   │   └── expense.py
│   ├── schemas/               <span class="c"># Pydantic schema (Create/Read/Update)</span>
│   │   └── expense.py
│   ├── routers/               <span class="c"># endpoint (HTTP স্তর)</span>
│   │   └── expenses.py
│   ├── services/              <span class="c"># ব্যবসায়িক লজিক</span>
│   │   └── expense_service.py
│   ├── repositories/          <span class="c"># DB অ্যাক্সেস (ঐচ্ছিক স্তর)</span>
│   └── deps.py                <span class="c"># সাধারণ dependency (get_db, current_user)</span>
├── tests/
├── alembic/                   <span class="c"># migration</span>
├── .env
├── requirements.txt
└── Dockerfile</pre>
<div class="callout best"><span class="tag">Best practice — স্তর আলাদা রাখুন</span>
Router শুধু HTTP (parameter পড়া, status code) সামলাবে; ব্যবসায়িক লজিক <code>services</code>-এ; DB query <code>repositories</code>/service-এ। এতে লজিক HTTP ছাড়াই টেস্ট করা যায় — .NET-এর Controller → Service → Repository ধারণার মতোই।</div>

<h3>Settings — pydantic-settings</h3>
<pre><span class="c"># pip install pydantic-settings</span>
from functools import lru_cache
from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    model_config = SettingsConfigDict(env_file=".env")
    database_url: str = "sqlite:///dev.db"
    secret_key: str                        <span class="c"># .env বা environment variable থেকে আসতে হবে</span>
    access_token_minutes: int = 30

@lru_cache                                  <span class="c"># একবারই তৈরি হয়</span>
def get_settings() -&gt; Settings:
    return Settings()

@app.get("/info")
def info(s: Annotated[Settings, Depends(get_settings)]):
    return {"minutes": s.access_token_minutes}</pre>

<h3>Lifespan — startup ও shutdown</h3>
<pre>from contextlib import asynccontextmanager
import httpx

@asynccontextmanager
async def lifespan(app: FastAPI):
    app.state.http = httpx.AsyncClient()     <span class="c"># startup: একবার বানানো, সব request শেয়ার করে</span>
    yield
    await app.state.http.aclose()            <span class="c"># shutdown: পরিষ্কার</span>

app = FastAPI(lifespan=lifespan)</pre>

<h3>Test-এ Dependency বদলানো</h3>
<pre>def override_get_db():
    yield test_session

app.dependency_overrides[get_db] = override_get_db     <span class="c"># test চলাকালীন আসল DB-র বদলে</span>
<span class="c"># শেষে: app.dependency_overrides.clear()</span></pre>
<div class="callout why"><span class="tag">DI-র সুবিধা</span>
DB, লগইন user, settings — সব "বাইরে থেকে আসে", endpoint-এর ভেতরে তৈরি হয় না। তাই test-এ সহজেই নকল (override) করা যায় এবং একই লজিক বারবার লিখতে হয় না।</div>
</template>

<template data-page="fastapi-db">
<h2 class="title">২০. FastAPI — Database (SQLAlchemy) ও CRUD</h2>
<p class="lead">বাস্তব API ডাটাবেস ছাড়া অসম্পূর্ণ। এই অধ্যায়ে SQLAlchemy 2.0 দিয়ে model, session, CRUD, pagination ও Alembic migration — একটা "Expense" API হিসেবে।</p>

<h3>Install ও Setup</h3>
<pre>pip install sqlalchemy alembic
pip install "psycopg[binary]"          <span class="c"># PostgreSQL driver (সংস্করণ ও নাম আপনার পরিবেশ অনুযায়ী যাচাই করুন)</span></pre>
<pre><span class="c"># app/database.py</span>
from sqlalchemy import create_engine
from sqlalchemy.orm import sessionmaker, DeclarativeBase

DATABASE_URL = "postgresql+psycopg://user:pass@localhost:5432/mydb"
<span class="c"># দ্রুত শুরুর জন্য: "sqlite:///./dev.db"  (SQLite হলে connect_args={"check_same_thread": False})</span>

engine = create_engine(DATABASE_URL, pool_pre_ping=True)
SessionLocal = sessionmaker(bind=engine, autoflush=False, expire_on_commit=False)

class Base(DeclarativeBase):
    pass

def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()</pre>

<h3>ORM Model (SQLAlchemy 2.0 style)</h3>
<pre><span class="c"># app/models/expense.py</span>
from datetime import datetime

<h3>CRUD Endpoint</h3>
<pre><span class="c"># app/routers/expenses.py</span>
from fastapi import APIRouter, Depends, HTTPException, status
from sqlalchemy import select
from sqlalchemy.orm import Session
from app.database import get_db
from app.models.expense import Expense
from app.schemas.expense import ExpenseCreate, ExpenseRead, ExpenseUpdate

router = APIRouter(prefix="/expenses", tags=["expenses"])

@router.post("/", response_model=ExpenseRead, status_code=status.HTTP_201_CREATED)
def create(data: ExpenseCreate, db: Session = Depends(get_db)):
    obj = Expense(**data.model_dump())
    db.add(obj)
    db.commit()
    db.refresh(obj)                    <span class="c"># DB-তৈরি মান (id, created_at) পড়ে নেওয়া</span>
    return obj

@router.get("/", response_model=list[ExpenseRead])
def list_(skip: int = 0, limit: int = 20, db: Session = Depends(get_db)):
    stmt = select(Expense).order_by(Expense.id.desc()).offset(skip).limit(min(limit, 100))
    return db.scalars(stmt).all()

@router.get("/{eid}", response_model=ExpenseRead)
def get(eid: int, db: Session = Depends(get_db)):
    obj = db.get(Expense, eid)
    if obj is None:
        raise HTTPException(404, "expense পাওয়া যায়নি")
    return obj

@router.patch("/{eid}", response_model=ExpenseRead)
def update(eid: int, data: ExpenseUpdate, db: Session = Depends(get_db)):
    obj = db.get(Expense, eid)
    if obj is None:
        raise HTTPException(404, "expense পাওয়া যায়নি")
    for k, v in data.model_dump(exclude_unset=True).items():
        setattr(obj, k, v)
    db.commit()
    db.refresh(obj)
    return obj

@router.delete("/{eid}", status_code=status.HTTP_204_NO_CONTENT)
def delete(eid: int, db: Session = Depends(get_db)):
    obj = db.get(Expense, eid)
    if obj is None:
        raise HTTPException(404, "expense পাওয়া যায়নি")
    db.delete(obj)
    db.commit()</pre>
<div class="callout best"><span class="tag">Best practice — Table তৈরি Alembic দিয়ে</span>

<h3>Filter, Search ও Aggregate</h3>
<pre>from sqlalchemy import func, and_

@router.get("/search", response_model=list[ExpenseRead])
def search(min_amount: Decimal | None = None, q: str | None = None, db: Session = Depends(get_db)):
    stmt = select(Expense)
    if min_amount is not None:
        stmt = stmt.where(Expense.amount &gt;= min_amount)
    if q:
        stmt = stmt.where(Expense.title.ilike(f"%{q}%"))
    return db.scalars(stmt).all()

@router.get("/summary")
def summary(db: Session = Depends(get_db)):
    rows = db.execute(
        select(Expense.category_id, func.sum(Expense.amount).label("total"))
        .group_by(Expense.category_id)
    ).all()
    return [{"category_id": r.category_id, "total": r.total} for r in rows]</pre>

<h2 class="title">২১. FastAPI — Authentication (JWT), Middleware ও Security</h2>
<p class="lead">নিরাপত্তা শেষে যোগ করার জিনিস নয়। এই অধ্যায়ে password hashing, JWT দিয়ে লগইন, role-ভিত্তিক অনুমতি, CORS ও middleware।</p>

<h3>পুরো প্রবাহ</h3>
<div class="diagram"><pre>
১. POST /auth/token (username + password)
        → password hash যাচাই → JWT access token তৈরি → client-কে ফেরত
২. পরবর্তী request: Authorization: Bearer &lt;token&gt;
        → get_current_user dependency token decode/যাচাই → user বের করে endpoint-এ দেয়
৩. endpoint role/permission যাচাই করে কাজ করে
</pre></div>

<h3>Password Hashing — কখনো plain text নয়</h3>
<pre>pip install pwdlib[argon2] pyjwt
<span class="c"># (library-র নাম/পছন্দ সময়ের সাথে বদলায় — FastAPI-র বর্তমান security tutorial-এর সাথে মিলিয়ে নিন)</span></pre>
<pre>from pwdlib import PasswordHash

password_hash = PasswordHash.recommended()        <span class="c"># আধুনিক algorithm (Argon2)</span>

hashed = password_hash.hash("my-secret-pass")
print(password_hash.verify("my-secret-pass", hashed))   <span class="c"># True</span>
print(password_hash.verify("wrong", hashed))            <span class="c"># False</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — SHA/MD5 দিয়ে password hash</span>
<code>hashlib.sha256(password)</code> password সংরক্ষণের জন্য অনুপযুক্ত (খুব দ্রুত, brute-force সহজ)। Argon2/bcrypt-এর মতো ইচ্ছাকৃতভাবে ধীর, salt-সহ algorithm ব্যবহার করুন।</div>

<h3>JWT তৈরি ও যাচাই</h3>
<pre>import jwt                      <span class="c"># PyJWT</span>
from datetime import datetime, timedelta, timezone

SECRET_KEY = "environment variable থেকে নিন — কোডে লিখবেন না"
ALGORITHM = "HS256"

def create_access_token(sub: str, minutes: int = 30) -&gt; str:
    payload = {
        "sub": sub,                                            <span class="c"># কার token</span>
        "exp": datetime.now(timezone.utc) + timedelta(minutes=minutes),   <span class="c"># মেয়াদ</span>
    }
    return jwt.encode(payload, SECRET_KEY, algorithm=ALGORITHM)

def decode_token(token: str) -&gt; dict:
    return jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM])   <span class="c"># মেয়াদোত্তীর্ণ/ভুল হলে exception</span></pre>

<h3>Login endpoint ও get_current_user</h3>
<pre>from typing import Annotated
from fastapi import Depends, FastAPI, HTTPException, status
from fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm

app = FastAPI()
oauth2_scheme = OAuth2PasswordBearer(tokenUrl="auth/token")    <span class="c"># docs-এ "Authorize" বাটন আসে</span>

@app.post("/auth/token")
def login(form: Annotated[OAuth2PasswordRequestForm, Depends()], db: DB):
    user = db.scalar(select(User).where(User.email == form.username))
    if not user or not password_hash.verify(form.password, user.password_hash):
        raise HTTPException(status.HTTP_401_UNAUTHORIZED, "email বা password ভুল",
                            headers={"WWW-Authenticate": "Bearer"})
    return {"access_token": create_access_token(str(user.id)), "token_type": "bearer"}

def get_current_user(token: Annotated[str, Depends(oauth2_scheme)], db: DB) -&gt; User:
    err = HTTPException(status.HTTP_401_UNAUTHORIZED, "অবৈধ token",
                        headers={"WWW-Authenticate": "Bearer"})
    try:
        payload = decode_token(token)
    except jwt.InvalidTokenError:          <span class="c"># মেয়াদোত্তীর্ণ, signature ভুল ইত্যাদি</span>
        raise err
    user = db.get(User, int(payload["sub"]))
    if user is None:
        raise err
    return user

CurrentUser = Annotated[User, Depends(get_current_user)]

@app.get("/me")
def me(user: CurrentUser):                  <span class="c"># লগইন ছাড়া 401</span>
    return {"id": user.id, "email": user.email}</pre>

Access token ছোট মেয়াদের (১৫–৩০ মিনিট), দীর্ঘ মেয়াদের জন্য আলাদা refresh token; সবসময় HTTPS; secret key ও algorithm environment/secret manager থেকে; token-এ সংবেদনশীল তথ্য (password) রাখবেন না (payload encode করা, encrypt নয়); logout/revoke দরকার হলে token blacklist বা short expiry।</div>

<h3>নিজের Middleware</h3>
<pre>import time, logging
from fastapi import Request

@app.middleware("http")
async def timing(request: Request, call_next):
    start = time.perf_counter()
    response = await call_next(request)               <span class="c"># পরের স্তরে (endpoint) যাওয়া</span>
    ms = (time.perf_counter() - start) * 1000
    response.headers["X-Process-Time-ms"] = f"{ms:.1f}"
    logging.info("%s %s %s %.1fms", request.method, request.url.path, response.status_code, ms)
    return response</pre>

<template data-page="fastapi-adv">
<h2 class="title">২২. FastAPI — Async, Background Task, WebSocket ও Streaming</h2>
<p class="lead">FastAPI-র আসল কর্মক্ষমতা ও নমনীয়তা পেতে <code>def</code> বনাম <code>async def</code>, background কাজ, real-time (WebSocket) ও streaming বুঝতে হয়।</p>

<h3>def বনাম async def — সবচেয়ে গুরুত্বপূর্ণ নিয়ম</h3>
<table>
<tr><th>Endpoint</th><th>FastAPI কীভাবে চালায়</th><th>কখন</th></tr>
<tr><td><code>def</code> (সাধারণ)</td><td>আলাদা <b>thread pool</b>-এ — event loop আটকায় না</td><td>blocking library ব্যবহার করলে (sync SQLAlchemy, requests, ফাইল I/O)</td></tr>
<tr><td><code>async def</code></td><td>সরাসরি <b>event loop</b>-এ</td><td>ভেতরে সব কিছু <code>await</code>-যোগ্য (httpx, asyncpg, async client) হলে</td></tr>
</table>
<pre>import time, asyncio, httpx

@app.get("/sync")
def sync_ep():
    time.sleep(2)                 <span class="c"># ঠিক আছে — thread pool-এ চলে, অন্য request আটকায় না</span>
    return {"ok": True}

@app.get("/async-good")
async def async_good():
    await asyncio.sleep(2)        <span class="c"># ঠিক — event loop মুক্ত থাকে</span>
    async with httpx.AsyncClient() as c:
        r = await c.get("https://example.com")
    return {"status": r.status_code}

@app.get("/async-bad")
async def async_bad():
    time.sleep(2)                 <span class="c"># ভুল! event loop আটকে যায় — পুরো সার্ভার ২ সেকেন্ড জমে থাকে</span>
    return {"ok": False}</pre>
<div class="callout mistake"><span class="tag">Common mistake — async def লিখে ভেতরে blocking কল</span>
সবচেয়ে বড় FastAPI পারফরম্যান্স ভুল। দ্বিধা থাকলে সাধারণ <code>def</code> লিখুন — FastAPI নিজে thread pool-এ চালাবে। <code>async def</code> শুধু তখনই, যখন ভেতরের সব I/O <code>await</code> দিয়ে হয়। CPU-heavy কাজ endpoint-এ নয় — worker/process-এ পাঠান।</div>

<h3>BackgroundTasks — response দেওয়ার পরে ছোট কাজ</h3>
<pre>from fastapi import BackgroundTasks

def send_email(to: str, body: str):
    ...                                   <span class="c"># ধীর কাজ</span>

@app.post("/register")
def register(email: str, bg: BackgroundTasks):
    <span class="c"># ইউজার তৈরি...</span>
    bg.add_task(send_email, email, "স্বাগতম!")     <span class="c"># response আগে যাবে, পরে চলবে</span>
    return {"status": "registered"}</pre>
<div class="callout why"><span class="tag">BackgroundTasks বনাম Celery/Queue</span>
<code>BackgroundTasks</code> একই প্রসেসের ভেতরে চলে — ছোট, হারালেও ক্ষতি নেই এমন কাজের জন্য (ইমেইল, লগ)। সার্ভার restart হলে কাজ হারায়, retry নেই। গুরুত্বপূর্ণ বা ভারী কাজ (report তৈরি, payment) Celery/RQ বা message queue (RabbitMQ/Kafka) + আলাদা worker দিয়ে করুন।</div>

<h3>WebSocket — দ্বিমুখী real-time যোগাযোগ</h3>
<pre>from fastapi import WebSocket, WebSocketDisconnect

class Hub:
    def __init__(self): self.clients: list[WebSocket] = []
    async def connect(self, ws: WebSocket):
        await ws.accept(); self.clients.append(ws)
    def remove(self, ws: WebSocket): self.clients.remove(ws)
    async def broadcast(self, msg: str):
        for c in self.clients:
            await c.send_text(msg)

hub = Hub()

@app.websocket("/ws")
async def chat(ws: WebSocket):
    await hub.connect(ws)
    try:
        while True:
            text = await ws.receive_text()
            await hub.broadcast(text)
    except WebSocketDisconnect:
        hub.remove(ws)</pre>

<h3>Streaming Response — বড় বা ক্রমিক ডেটা</h3>
<pre>from fastapi.responses import StreamingResponse
import asyncio

async def numbers():
    for i in range(5):

        await asyncio.sleep(1)

@app.get("/stream")
async def stream():

def report():

<h3>Caching (Redis) — ধীর কাজের ফল মনে রাখা</h3>

r = redis.from_url("redis://localhost:6379/0", decode_responses=True)

async def rates(ccy: str):

@app.get("/feed")
def feed(db: DB, after_id: int = 0, limit: int = 20):
