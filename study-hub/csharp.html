<h2 class="title">১৩. Concurrency ও Parallelism</h2>
<p class="lead">আগের চ্যাপ্টারগুলোতে <span class="kw">async</span>/<span class="kw">await</span> নিয়ে যা শিখেছি সেটা মূলত I/O-bound concurrency — একটা logical thread wait করার সময় অন্য কাজ করতে দেওয়া, single thread-এ efficiently সময় ভাগ করে নেওয়া। এই চ্যাপ্টার সম্পূর্ণ ভিন্ন একটা সমস্যা নিয়ে কথা বলবে: CPU-bound parallelism — যেখানে সত্যিই একাধিক CPU core একসাথে কাজ করে, আর তার সাথে আসা shared-state thread safety-র ঝামেলা।</p>

<h3>১২.১ Thread vs Task vs ThreadPool</h3>
<p>এই তিনটা concept আসলে একই জিনিসের ভিন্ন ভিন্ন abstraction layer। সবচেয়ে নিচে আছে <span class="kw">Thread</span> — এটা সরাসরি OS-level থ্রেড, প্রতিটা <span class="kw">Thread</span> তৈরি করা মানে operating system-কে নতুন execution context বানাতে বলা, যেটা costly (নিজস্ব stack memory, kernel scheduling overhead)। এজন্য আজকাল সরাসরি <span class="kw">new Thread(...)</span> লেখা খুব কম দরকার হয়।</p>
<p>এর উপরে আছে <span class="kw">ThreadPool</span> — runtime একগাদা worker thread আগে থেকেই তৈরি করে রাখে আর পুনর্ব্যবহার করে, যাতে প্রতিটা ছোট কাজের জন্য নতুন OS thread তৈরির খরচ না লাগে। আর সবচেয়ে উপরে আছে <span class="kw">Task</span> — এটা কাজের একটা lightweight unit, যেটা schedule হয়ে যায় <span class="kw">ThreadPool</span>-এর কোনো worker thread-এ। আজকের দিনে <span class="kw">Task</span>-ই হলো default abstraction, বেশিরভাগ ক্ষেত্রে <span class="kw">Thread</span> বা <span class="kw">ThreadPool</span> নিয়ে সরাসরি কাজ করার দরকার হয় না।</p>
<pre>Task.Run(() =&gt;
{
    <span class="c">// এই কোড ThreadPool-এর কোনো এক worker thread-এ চলবে</span>
    DoHeavyComputation();
});</pre>
<table>
<tr><th>কখন ব্যবহার করবেন</th><th>Abstraction</th><th>কারণ</th></tr>
<tr><td>Short-lived CPU-bound কাজ</td><td><code>Task.Run</code></td><td>ThreadPool থেকে thread ধার নেয়, কাজ শেষে ফেরত যায়; overhead কম</td></tr>
<tr><td>Long-running dedicated background worker</td><td><code>new Thread(...)</code></td><td>ThreadPool-এর thread block করে রাখলে অন্য কাজের জন্য pool ফাঁকা থাকবে না; নিজস্ব dedicated thread ভালো</td></tr>
<tr><td>UI বা ব্যবহারকারীর interaction চলাকালীন প্রতিটা ছোট কাজ</td><td><code>Task</code></td><td>Scheduling, cancellation, continuation সবকিছুর built-in support আছে</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — abstraction level বেছে নেওয়া</span> প্রায় সবসময় <code>Task</code>/<code>Task.Run</code> দিয়েই শুরু করুন। <span class="kw">Thread</span> সরাসরি ব্যবহার করার দরকার হয় শুধু তখনই যখন কাজটা সত্যিই দীর্ঘ সময় ধরে চলবে এবং একটা dedicated thread দরকার (যেমন একটা background listener যা কখনো শেষ হয় না)।</div>

<h3>১২.২ Task Parallel Library (TPL) — CPU-bound কাজের জন্য</h3>
<p>যখন একই ধরনের কাজ অনেকবার করতে হয় আর প্রতিটা independent (একটার result আরেকটার উপর নির্ভর করে না), তখন <span class="kw">Parallel.For</span> আর <span class="kw">Parallel.ForEach</span> ব্যবহার করে সেই কাজ একাধিক CPU core-এ ভাগ করে দেওয়া যায়।</p>
<pre>int[] numbers = Enumerable.Range(1, 1_000_000).ToArray();
long[] results = new long[numbers.Length];

Parallel.For(0, numbers.Length, i =&gt;
{
    results[i] = HeavyMath(numbers[i]); <span class="c">// প্রতিটা index independent</span>
});

Parallel.ForEach(customerList, customer =&gt;
{
    ProcessCustomer(customer);
});</pre>
<p>LINQ-এর সাথে পরিচিত হলে <b>PLINQ</b> (<span class="kw">.AsParallel()</span>) আরেকটা সহজ বিকল্প — সাধারণ LINQ query-কে parallel execution-এ রূপান্তর করে দেয়:</p>
<pre>var result = numbers.AsParallel()
                    .Where(n =&gt; IsPrime(n))
                    .Select(n =&gt; n * n)
                    .ToArray();</pre>
<div class="callout why"><span class="tag">async ও Parallel — গুলিয়ে ফেলবেন না</span> <span class="kw">async</span>/<span class="kw">await</span> হলো <b>wait করার</b> জন্য — thread কে idle না রেখে অন্য কাজে ছেড়ে দেওয়া (I/O-bound)। আর <span class="kw">Parallel</span>/TPL হলো <b>computation</b>-এর জন্য — একই সাথে একাধিক CPU core ব্যবহার করে কাজ দ্রুত শেষ করা (CPU-bound)। একটা ফাইল ডাউনলোড করার জন্য <span class="kw">Parallel.For</span> ব্যবহার করা যেমন ভুল, তেমনি হাজার হাজার সংখ্যার উপর ভারী গণনা চালানোর জন্য শুধু <span class="kw">await</span> দিয়ে কোনো লাভ নেই — সেখানে কোনো thread আসলে idle বসে থাকছে না, বরং কাজ করছে।</div>

<h3>১২.৩ Race Condition সমস্যা</h3>
<p>একাধিক thread যখন একই shared variable-এ read আর write করে, তখন race condition তৈরি হতে পারে। সবচেয়ে ক্লাসিক উদাহরণ — একটা shared counter একাধিক thread থেকে increment করা:</p>
<pre>int counter = 0;

Parallel.For(0, 100_000, i =&gt;
{
    counter++; <span class="c">// আপাতদৃষ্টিতে নিরীহ, কিন্তু atomic নয়!</span>
});

Console.WriteLine(counter); <span class="c">// প্রায় সবসময় ১,০০,০০০ এর চেয়ে কম আসবে</span></pre>
<p><span class="kw">counter++</span> দেখতে একটা single statement মনে হলেও আসলে এটা তিনটা ধাপে ঘটে: (১) <span class="kw">counter</span>-এর current value read করা, (২) সেই value এক বাড়ানো, (৩) নতুন value আবার <span class="kw">counter</span>-এ write করা। এই read-modify-write সিকোয়েন্স atomic নয়। ধরুন থ্রেড A এবং থ্রেড B একই সময়ে <span class="kw">counter</span>-এর value ৫ পড়ল, দুজনেই সেটাকে ৬ বানিয়ে লিখল — অথচ আসলে counter ৭ হওয়ার কথা ছিল। এভাবে বহু update হারিয়ে যায়, আর ফলাফল আসে অপ্রত্যাশিতভাবে ভুল ও প্রতিবার আলাদা।</p>
<div class="callout mistake"><span class="tag">Common mistake — "এটা তো একলাইনের কোড, atomic হবে ধরে নেওয়া"</span> C#-এ কোনো single-line statement দেখতে simple মনে হলেও তার মানে এই না যে সেটা thread-safe। <span class="kw">counter++</span>, <span class="kw">list.Add(x)</span>, এমনকি <span class="kw">dictionary[key] = value</span>-ও multiple CPU instruction-এ ভাঙে; shared state-এর উপর এসব operation একাধিক thread থেকে চালানোর আগে সবসময় thread-safety যাচাই করে নিন।</div>

<h3>১২.৪ Synchronization Primitives</h3>
<p>Race condition ঠেকানোর জন্য C# কয়েকটা synchronization tool দেয়, প্রতিটার ব্যবহারের জায়গা আলাদা:</p>
<table>
<tr><th>Primitive</th><th>কী কাজে</th><th>মূল বৈশিষ্ট্য</th></tr>
<tr><td><code>lock</code> / <code>Monitor</code></td><td>একটা critical section-এ একসাথে শুধু একটা thread ঢুকতে দেওয়া</td><td>একই process-এর ভেতরে mutual exclusion; সবচেয়ে সাধারণ ও সস্তা</td></tr>
<tr><td><code>SemaphoreSlim</code></td><td>একসাথে সর্বোচ্চ N-সংখ্যক thread কে কোনো resource access করতে দেওয়া</td><td>Mutual exclusion নয়, বরং একটা "কতজন একসাথে ঢুকতে পারবে" এর সীমা; <code>async</code>-friendly (<code>WaitAsync</code>)</td></tr>
<tr><td><code>Mutex</code></td><td>একাধিক process জুড়ে mutual exclusion</td><td>OS-level, cross-process synchronization; একই process-এর ভেতরের কাজের জন্য <code>lock</code>-এর চেয়ে ভারী</td></tr>
<tr><td><code>ReaderWriterLockSlim</code></td><td>অনেক reader একসাথে পড়তে পারবে, কিন্তু writer এলে exclusive access লাগবে</td><td>Read-heavy, write-rare পরিস্থিতিতে plain <code>lock</code>-এর চেয়ে বেশি concurrency দেয়</td></tr>
</table>
<p>আগের race condition-এর উদাহরণটা <span class="kw">lock</span> দিয়ে ঠিক করলে:</p>
<pre>int counter = 0;
object counterLock = new object();

Parallel.For(0, 100_000, i =&gt;
{
    lock (counterLock)
    {
        counter++; <span class="c">// এখন একসময় শুধু একটা thread-ই এখানে ঢুকতে পারবে</span>
    }
});

Console.WriteLine(counter); <span class="c">// সবসময় ঠিক ১,০০,০০০</span></pre>
<p><span class="kw">lock</span> ভেতরে ভেতরে <span class="kw">Monitor.Enter</span> আর <span class="kw">Monitor.Exit</span>-এর syntactic sugar — try/finally সহ, যাতে exception হলেও lock ঠিকভাবে release হয়।</p>

<h3>১২.৫ Interlocked ও volatile</h3>
<p>শুধু একটা simple variable-এর উপর atomic operation দরকার হলে পুরো <span class="kw">lock</span> নেওয়া বাড়াবাড়ি হতে পারে। এই ক্ষেত্রে <span class="kw">Interlocked</span> class lock-free, hardware-level atomic operation দেয়:</p>
<pre>int counter = 0;

Parallel.For(0, 100_000, i =&gt;
{
    Interlocked.Increment(ref counter); <span class="c">// lock ছাড়াই atomic increment</span>
});

<span class="c">// শর্তসাপেক্ষে update করতে চাইলে</span>
Interlocked.CompareExchange(ref counter, newValue, expectedValue);</pre>
<p><span class="kw">Interlocked</span> সাধারণত <span class="kw">lock</span>-এর চেয়ে দ্রুত, কারণ এটা OS-level blocking ছাড়াই CPU-র atomic instruction ব্যবহার করে। তবে এটা শুধু একক variable-এর simple operation-এর জন্যই কাজে লাগে, একাধিক variable একসাথে আপডেট করতে হলে <span class="kw">lock</span>-ই দরকার।</p>
<p><span class="kw">volatile</span> keyword আলাদা একটা সমস্যা সমাধান করে — atomicity নয়, বরং <b>visibility</b>। compiler বা CPU optimization-এর কারণে এক thread-এর লেখা value অন্য thread cache থেকে পুরনো (stale) value পড়তে পারে। <span class="kw">volatile</span> field মার্ক করলে প্রতিবার সরাসরি memory থেকে পড়া/লেখা হয়, ফলে সব thread সবসময় সর্বশেষ value দেখে। এটা race condition ঠেকায় না, শুধু নিশ্চিত করে যে সব thread একই value দেখছে।</p>

<h3>১২.৬ Concurrent Collections</h3>
<p>plain <span class="kw">Dictionary&lt;TKey, TValue&gt;</span> বা <span class="kw">Queue&lt;T&gt;</span> thread-safe নয়। একাধিক thread থেকে concurrent access দরকার হলে <span class="kw">System.Collections.Concurrent</span> namespace-এর ready-made collection ব্যবহার করা উচিত — যেমন <span class="kw">ConcurrentDictionary&lt;TKey, TValue&gt;</span> আর <span class="kw">ConcurrentQueue&lt;T&gt;</span>:</p>
<pre>ConcurrentDictionary&lt;string, int&gt; cache = new ConcurrentDictionary&lt;string, int&gt;();

Parallel.ForEach(keys, key =&gt;
{
    cache.AddOrUpdate(key, 1, (k, oldValue) =&gt; oldValue + 1);
});

ConcurrentQueue&lt;string&gt; jobQueue = new ConcurrentQueue&lt;string&gt;();
jobQueue.Enqueue("job-1");

if (jobQueue.TryDequeue(out string job))
{
    Process(job);
}</pre>
<div class="callout best"><span class="tag">Best practice — নিজে lock বসানোর বদলে concurrent collection ব্যবহার</span> প্রতিটা <span class="kw">Dictionary</span> access-এর চারপাশে হাতে <span class="kw">lock</span> বসানো দুই দিক থেকেই খারাপ: এক, ভুল করার সুযোগ বেশি (কোথাও lock নিতে ভুলে গেলেই আবার race condition ফিরে আসে); দুই, সাধারণত পারফরম্যান্সেও খারাপ — কারণ পুরো collection-এর জন্য একটাই coarse lock পুরো collection-কে সিরিয়ালাইজ করে ফেলে। <span class="kw">ConcurrentDictionary</span>-র মতো collection ভেতরে ভেতরে fine-grained locking বা lock-free technique ব্যবহার করে, তাই বেশিরভাগ ক্ষেত্রে এটাই বেশি সঠিক ও দ্রুত সমাধান।</div>

<h3>১২.৭ Lock Contention ও Performance</h3>
<p>Synchronization ঠিকভাবে না করলে যেমন race condition হয়, তেমনি বেশি synchronization করলেও performance নষ্ট হয়। যখন অনেক thread একই lock-এর জন্য অপেক্ষা করতে থাকে, তখন সেটাকে বলে <b>lock contention</b> — যে কাজ parallel করার কথা ছিল, সেটাই আসলে একটার পর একটা (serialized) হয়ে যায়, কারণ যেকোনো মুহূর্তে শুধু একটা thread-ই critical section-এ ঢুকতে পারে।</p>
<pre>lock (bigLock)
{
    <span class="c">// পুরো collection নিয়ে ভারী কাজ lock-এর ভেতরে —</span>
    <span class="c">// এতক্ষণ ধরে lock ধরে রাখলে অন্য সব thread শুধু বসে থাকবে</span>
    foreach (var item in hugeCollection)
    {
        ExpensiveProcessing(item);
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — একটামাত্র বড় lock, বা lock অনেকক্ষণ ধরে রাখা</span> পুরো method বা পুরো collection-এর চারপাশে একটাই coarse-grained lock বসিয়ে দেওয়া, অথবা lock-এর ভেতরে ভারী/ধীর কাজ (I/O, ভারী computation) রেখে দেওয়া — দুটোই lock contention বাড়িয়ে দেয়। ফলে অনেক thread ব্যবহার করেও performance single-threaded কোডের চেয়ে সামান্য ভালো, বা কখনো কখনো খারাপও হতে পারে (context-switching overhead যোগ হয়ে)।</div>
<div class="callout best"><span class="tag">Best practice — critical section ছোট রাখা, granularity মিলিয়ে নেওয়া</span> lock-এর ভেতরে শুধু ততটুকু কোড রাখুন যতটুকু সত্যিই shared state touch করে; ভারী গণনা lock-এর বাইরে করুন। সেই সাথে lock-এর granularity প্রকৃত contention-এর সাথে মিলিয়ে নিন — যেমন একটা dictionary-র প্রতিটা key-র জন্য আলাদা lock (বা <span class="kw">ConcurrentDictionary</span>) ব্যবহার করলে পুরো dictionary-র জন্য একটা global lock রাখার চেয়ে অনেক বেশি প্রকৃত parallelism পাওয়া যায়।</div>

<h3>১২.৮ Deadlock — একাধিক lock-এর মধ্যে চক্রাকার অপেক্ষা</h3>
<p>Lock contention-এ thread-রা শুধু ধীরে ধীরে একে একে critical section-এ ঢোকে — কাজ শেষ পর্যন্ত এগোয়, শুধু ধীরে। কিন্তু এর চেয়েও খারাপ একটা পরিস্থিতি আছে, যেখানে কাজ আদৌ এগোয়ই না — একে বলে <span class="kw">Deadlock</span>। এটা তখন ঘটে যখন দুই (বা তার বেশি) thread একাধিক lock নেয়, কিন্তু প্রতিটা thread ভিন্ন ভিন্ন ক্রমে সেগুলো নেওয়ার চেষ্টা করে।</p>
<pre>object lockA = new object();
object lockB = new object();

<span class="c">// Thread 1</span>
lock (lockA)
{
    Thread.Sleep(50);
    lock (lockB)   <span class="c">// lockB-এর জন্য অপেক্ষা করছে, যেটা Thread 2 ধরে বসে আছে</span>
    {
        <span class="c">// ...</span>
    }
}

<span class="c">// Thread 2 (একই সময়ে, উল্টো ক্রমে)</span>
lock (lockB)
{
    Thread.Sleep(50);
    lock (lockA)   <span class="c">// lockA-এর জন্য অপেক্ষা করছে, যেটা Thread 1 ধরে বসে আছে</span>
    {
        <span class="c">// ...</span>
    }
}</pre>
<div class="diagram"><pre>
Thread 1: lockA ধরে আছে ──▶ lockB-এর জন্য অপেক্ষা করছে
                                     ▲
                                     │   চক্রাকার অপেক্ষা (circular wait) —
                                     │   কেউই আর সামনে এগোতে পারবে না
                                     ▼
Thread 2: lockB ধরে আছে ──▶ lockA-এর জন্য অপেক্ষা করছে
</pre></div>
<p>Thread 1 <code>lockA</code> ধরে রেখে <code>lockB</code> চাইছে, ঠিক একই সময়ে Thread 2 <code>lockB</code> ধরে রেখে <code>lockA</code> চাইছে। দুজনেই একে অপরের ধরে রাখা lock ছাড়ার অপেক্ষায় চিরকালের জন্য থমকে থাকে — কোনো exception ছোঁড়া হয় না, প্রোগ্রাম শুধু নীরবে hang করে যায়।</p>
<div class="callout mistake"><span class="tag">Common mistake — একাধিক lock ভিন্ন ভিন্ন ক্রমে নেওয়া</span> কোডবেসের ভিন্ন ভিন্ন জায়গায় একাধিক lock নেওয়া হলে, কিন্তু প্রতিটা জায়গায় সেগুলো নেওয়ার ক্রম আলাদা হলে circular wait তৈরি হওয়ার ঝুঁকি থাকে। এই bug ধরাও কঠিন, কারণ এটা সবসময় ঘটে না — শুধু নির্দিষ্ট timing-এ দুই thread একসাথে বিপরীত ক্রমে lock চাইলেই ঘটে, তাই প্রায়ই টেস্টে ধরা পড়ে না, শুধু প্রোডাকশনে মাঝেমধ্যে ঘটা random hang হিসেবে দেখা দেয়।</div>
<div class="callout best"><span class="tag">Best practice — সবসময় একই, সুনির্দিষ্ট ক্রমে lock নাও</span> কোডের যেকোনো জায়গায় একাধিক lock একসাথে নিতে হলে সবসময় একই পূর্বনির্ধারিত ক্রমে নাও (যেমন সবসময় lockA-এর পর lockB, কখনো উল্টো নয়) — এতে circular wait তৈরি হওয়ার সুযোগই থাকে না। আরও ভালো সমাধান হলো ডিজাইন এমনভাবে করা যাতে একসাথে একাধিক lock নেওয়ার দরকারই না পড়ে।</div>

<h2 class="title">১৪. Performance — Span, Memory, Native AOT</h2>
<p class="lead">Memory Management অধ্যায়ে আমরা দেখেছিলাম heap allocation বেশি হলে GC-এর উপর চাপ পড়ে, আর Foundation অধ্যায়ে Native AOT নিয়ে একটা ছোট্ট ইঙ্গিত দেওয়া হয়েছিল। এই অধ্যায়ে সেই দুটো সুতোই টেনে ধরছি — কীভাবে <span class="kw">Span&lt;T&gt;</span>, <span class="kw">stackalloc</span>, আর <span class="kw">ArrayPool&lt;T&gt;</span> দিয়ে allocation কমানো যায়, আর কীভাবে Native AOT পুরো startup model-টাই বদলে দেয়।</p>

<h3>১. Span&lt;T&gt; ও Memory&lt;T&gt; — জিরো-অ্যালোকেশন view</h3>
<p>সাধারণভাবে একটা string-এর অংশ বিশেষ নিতে হলে আমরা <code>Substring</code> ব্যবহার করি — কিন্তু এটা প্রতিবার একটা নতুন string allocate করে, পুরনো মেমোরি থেকে ডেটা কপি করে। বড় লুপে বারবার এটা করলে অসংখ্য ছোট ছোট allocation তৈরি হয়, যা GC-কে ব্যস্ত রাখে। <span class="kw">Span&lt;T&gt;</span> হলো একটা <b>stack-only</b> (<span class="kw">ref struct</span>) টাইপ, যেটা বিদ্যমান মেমোরির (array, string, stack-allocated buffer) একটা <b>view</b> মাত্র — কোনো কপি না করেই। Slicing মানে শুধু pointer আর length সমন্বয় করা, allocation শূন্য।</p>
<pre><span class="c">// আগে — Substring প্রতিবার নতুন string allocate করে</span>
string s = "Hello, World!";
string sub = s.Substring(7, 5); <span class="c">// heap-এ নতুন "World" string তৈরি হলো</span>

<span class="c">// পরে — AsSpan শুধু existing মেমোরির উপর view তৈরি করে</span>
ReadOnlySpan&lt;char&gt; span = s.AsSpan(7, 5); <span class="c">// কোনো allocation নেই</span>
Console.WriteLine(span.ToString()); <span class="c">// দরকার হলে এখানেই একবার string বানানো হয়</span></pre>
<div class="callout why"><span class="tag">কেন এটা কাজে লাগে</span> parsing, string splitting, বা array slicing যেখানে বারবার হয় — যেমন CSV পার্স করা বা network buffer প্রসেস করা — সেখানে <span class="kw">Span&lt;T&gt;</span> ব্যবহার করলে প্রতিটা ধাপে নতুন allocation এড়ানো যায়, ফলে GC-এর কাজ অনেক কমে যায়।</div>

<h3>২. ref struct এর সীমাবদ্ধতা এবং Memory&lt;T&gt;</h3>
<p><span class="kw">Span&lt;T&gt;</span> ইচ্ছাকৃতভাবে একটা <span class="kw">ref struct</span> — এর মানে এটা সবসময় stack-এ থাকে, কখনো heap-এ যায় না। এই ডিজাইনের কারণেই কিছু কড়াকড়ি আছে: এটা <b>box</b> করা যায় না, কোনো class-এর field হতে পারে না (শুধু local variable বা method parameter হিসেবে থাকতে পারে), আর — সবচেয়ে গুরুত্বপূর্ণ — async method-এর ভেতরে কোনো <code>await</code>-এর আগে-পরে জীবিত থাকতে পারে না।</p>
<p>কারণটা compiler-এর কাজের সাথে সম্পর্কিত। একটা async method-কে compiler ভেতরে ভেতরে একটা state machine (একটা class বা struct)-এ রূপান্তর করে, যেটা heap-এ থাকতে পারে যাতে <code>await</code>-এর পরে execution আবার সেই state থেকে চালিয়ে যাওয়া যায়। যেহেতু <span class="kw">ref struct</span> কখনো heap-এ থাকতে পারে না, সেটা এই state machine-এর অংশ হতে পারে না — তাই compiler <code>await</code> boundary পার হওয়া <span class="kw">Span&lt;T&gt;</span> variable-কে কম্পাইল-টাইমেই আটকে দেয়।</p>
<p>এই সমস্যার সমাধান হলো <span class="kw">Memory&lt;T&gt;</span> — এটা একটা সাধারণ (heap-friendly) struct, যেটা class-এর field হতে পারে, async method-এ পাস করা যায়, <code>await</code> boundary পার হতে পারে নিরাপদে। সিঙ্ক্রোনাস কাজের সময় প্রয়োজনে <code>.Span</code> property দিয়ে সেটাকে <span class="kw">Span&lt;T&gt;</span>-এ রূপান্তর করা যায়।</p>
<pre><span class="c">// এটা কম্পাইল হবে না — ref struct কে class field রাখা যায় না</span>
class Buffer
{
    private Span&lt;byte&gt; _data; <span class="c">// CS0610-এর মতো compile error</span>
}

<span class="c">// Memory&lt;T&gt; ব্যবহার করলে ঠিক আছে — field ও async-safe</span>
class Buffer
{
    private Memory&lt;byte&gt; _data;

    async Task ProcessAsync()
    {
        await Task.Delay(10);
        Span&lt;byte&gt; span = _data.Span; <span class="c">// await এর পরে সিঙ্ক্রোনাস কাজের জন্য Span বের করা হলো</span>
        span[0] = 1;
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — Span কে field বানানোর চেষ্টা</span> অনেকে performance-এর কথা ভেবে <span class="kw">Span&lt;T&gt;</span>-কে সরাসরি class-এর field বানাতে চান, কিন্তু compiler সেটা প্রথমেই আটকে দেয়। এই ধরনের কেসে <span class="kw">Memory&lt;T&gt;</span> field রেখে, ব্যবহারের সময় local variable হিসেবে <code>.Span</code> নেওয়াই সঠিক পথ।</div>

<h3>৩. stackalloc — স্ট্যাকে সাময়িক বাফার</h3>
<p>খুব ছোট, স্বল্পস্থায়ী বাফারের জন্য <span class="kw">stackalloc</span> ব্যবহার করা যায় — এটা সরাসরি stack-এ মেমোরি বরাদ্দ করে, GC এর মধ্যে এই বাফার কখনো আসে না, method শেষ হলেই মেমোরি নিজে থেকে মুক্ত হয়ে যায়। এটা সাধারণত <span class="kw">Span&lt;T&gt;</span>-এর সাথে মিলিয়ে ব্যবহার হয়।</p>
<pre>void FormatSmallNumber(int value)
{
    Span&lt;char&gt; buffer = stackalloc char[16]; <span class="c">// স্ট্যাকে বরাদ্দ, GC-এর আওতার বাইরে</span>
    if (value.TryFormat(buffer, out int written))
    {
        ReadOnlySpan&lt;char&gt; result = buffer.Slice(0, written);
        Console.WriteLine(result.ToString());
    }
}</pre>
<div class="callout why"><span class="tag">কেন ছোট বাফারের জন্যই</span> <span class="kw">stackalloc</span> stack size-এর সীমার মধ্যে কাজ করে (সাধারণত থ্রেড প্রতি ১ MB এর মতো) — বড় বা variable-size বাফারের জন্য এটা ব্যবহার করলে <code>StackOverflowException</code>-এর ঝুঁকি থাকে, তাই এটা শুধু ছোট, নিশ্চিত-সাইজের, স্বল্পস্থায়ী বাফারের জন্যই।</div>

<h3>৪. ArrayPool&lt;T&gt; — বাফার পুনর্ব্যবহার</h3>
<p>বড় সাইজের বাফার যেগুলো বারবার দরকার হয় (যেমন network I/O buffer, image processing buffer), সেগুলোর জন্য প্রতিবার <code>new byte[size]</code> করলে প্রচুর short-lived large object তৈরি হয় যেগুলো Large Object Heap-এ যেতে পারে। <span class="kw">ArrayPool&lt;T&gt;.Shared</span> একটা shared pool থেকে বাফার <b>rent</b> করে দেয়, কাজ শেষে সেটা <b>return</b> করলে পরবর্তী rent-এ পুনরায় ব্যবহার হয় — নতুন allocation লাগে না।</p>
<pre>byte[] buffer = ArrayPool&lt;byte&gt;.Shared.Rent(4096); <span class="c">// pool থেকে ধার নেওয়া, নতুন allocation নাও হতে পারে</span>
try
{
    int bytesRead = stream.Read(buffer, 0, 4096);
    Process(buffer, bytesRead);
}
finally
{
    ArrayPool&lt;byte&gt;.Shared.Return(buffer); <span class="c">// finally-তে return নিশ্চিত করা</span>
}</pre>
<div class="callout best"><span class="tag">Best practice — সবসময় finally-তে Return করো</span> <code>Rent</code> করা বাফার যদি exception-এর কারণে কখনো <code>Return</code> না হয়, সেটা memory leak না হলেও pool-এর কার্যকারিতা নষ্ট করে — বারবার নতুন array allocate হতে বাধ্য হয়। তাই <code>try/finally</code> দিয়ে return নিশ্চিত করা উচিত, আর মনে রাখা দরকার rent করা array-এর বাইরের অংশে পুরনো ডেটা থাকতে পারে (buffer পুরোপুরি zero করা থাকে না ডিফল্টে)।</div>

<h3>৫. Native AOT — JIT ছাড়াই সরাসরি native কোড</h3>
<p>স্বাভাবিক .NET অ্যাপ প্রথমে IL (Intermediate Language)-এ কম্পাইল হয়, তারপর রানটাইমে CLR-এর ভেতরে JIT compiler সেই IL-কে native machine code-এ রূপান্তর করে — প্রতিটা method প্রথমবার চলার সময় এই JIT খরচ হয়। <span class="kw">Native AOT</span> (<code>dotnet publish -p:PublishAot=true</code>) পুরো প্রক্রিয়াটাই বিল্ড-টাইমে সম্পন্ন করে ফেলে — পুরো অ্যাপ সরাসরি native machine code-এ কম্পাইল হয়ে যায়, রানটাইমে কোনো JIT লাগে না, এমনকি পুরো CLR runtime-ও দরকার হয় না।</p>
<p>ফলাফল হলো নাটকীয়ভাবে দ্রুত cold start এবং ছোট মেমোরি footprint — কনটেইনার বা serverless পরিবেশে এটা খুবই মূল্যবান, যেখানে প্রতিটা মিলিসেকেন্ড startup time গুরুত্বপূর্ণ (Kubernetes-এর HPA scale-up-এর মতো পরিস্থিতিতে নতুন instance দ্রুত রেডি হওয়া মানে ব্যবহারকারীর কাছে দ্রুত সাড়া পৌঁছানো)।</p>
<pre><span class="c">// .csproj-এ Native AOT চালু করা</span>
&lt;PropertyGroup&gt;
  &lt;PublishAot&gt;true&lt;/PublishAot&gt;
&lt;/PropertyGroup&gt;

<span class="c">// publish কমান্ড</span>
dotnet publish -c Release -r linux-x64 -p:PublishAot=true</pre>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> Native AOT আসলে trimming আর ahead-of-time compilation একসাথে করে — বিল্ড-টাইমে পুরো অ্যাপের reachable code বিশ্লেষণ করে অব্যবহৃত অংশ ফেলে দেয় এবং বাকি অংশ সরাসরি native instruction-এ রূপান্তর করে, তাই আউটপুট একটা স্ট্যান্ডঅ্যালোন native executable — কোনো <code>.dll</code> + <code>dotnet.exe</code> কম্বিনেশন লাগে না।</div>

<h3>৬. Native AOT এর সীমাবদ্ধতা ও Source Generator</h3>
<p>Native AOT-এর মূল শর্ত হলো — সবকিছু কম্পাইল-টাইমেই জানা থাকতে হবে (trimming analysis)। যে কোডগুলো রানটাইমে dynamically নতুন টাইপ তৈরি করে বা reflection দিয়ে যা-খুশি ঘুরে দেখে, সেগুলো এই মডেলের সাথে সহজে মেলে না। বিশেষভাবে সমস্যা হয়:</p>
<ul>
<li>ভারী <b>reflection</b>-নির্ভর কোড, যেখানে টাইপের নাম string দিয়ে dynamically খোঁজা হয়।</li>
<li><code>System.Reflection.Emit</code> দিয়ে dynamic code generation — রানটাইমে নতুন IL তৈরি করা AOT-তে সম্ভব না, কারণ তখন আর কোনো JIT নেই।</li>
<li>কিছু serialization প্যাটার্ন যেগুলো রানটাইম reflection দিয়ে object-এর property স্বয়ংক্রিয়ভাবে আবিষ্কার করে।</li>
</ul>
<p>এর আধুনিক সমাধান হলো <b>Source Generator</b> — কম্পাইল-টাইমে (রানটাইমে নয়) প্রয়োজনীয় কোড স্বয়ংক্রিয়ভাবে তৈরি করে দেওয়ার একটা প্রক্রিয়া। যেমন <code>System.Text.Json</code>-এর source generator বিল্ড-টাইমেই সিরিয়ালাইজেশন কোড জেনারেট করে দেয়, তাই রানটাইমে আর reflection লাগে না — এটা Native AOT-এর সাথে পুরোপুরি সামঞ্জস্যপূর্ণ। Source Generator নিয়ে বিস্তারিত পরের Reflection অধ্যায়ে।</p>
<div class="callout mistake"><span class="tag">Common mistake — পুরনো reflection-ভিত্তিক লাইব্রেরি নিয়ে AOT-তে যাওয়া</span> অনেক জনপ্রিয় লাইব্রেরি (বিশেষত পুরনো serialization বা DI লাইব্রেরি) ভারী reflection ব্যবহার করে — এগুলো Native AOT publish-এর সময় trimming warning বা রানটাইম exception দিতে পারে। AOT-তে যাওয়ার আগে প্রতিটা dependency AOT-compatible কিনা যাচাই করা জরুরি।</div>

<h3>৭. ReadyToRun — মাঝামাঝি একটা বিকল্প</h3>
<p>যদি Native AOT-এর কড়াকড়ি (reflection সীমাবদ্ধতা, dynamic code বন্ধ) মেনে নেওয়া কঠিন হয়, কিন্তু তবুও startup-এর JIT খরচ কিছুটা কমাতে চান, তাহলে <span class="kw">ReadyToRun</span> (R2R) একটা মাঝামাঝি সমাধান। এখানে precompiled native code IL-এর পাশাপাশি একই assembly-তে বান্ডিল করা থাকে — রানটাইমে CLR সরাসরি সেই precompiled কোড ব্যবহার করতে পারে, ফলে বেশিরভাগ method-এর জন্য JIT-এর কাজ কমে যায়, অথচ পুরো CLR runtime ও reflection সাপোর্ট আগের মতোই থাকে।</p>

<h3>৮. BenchmarkDotNet দিয়ে পরিমাপ</h3>
<p>এই অধ্যায়ের সব কৌশলই তাত্ত্বিকভাবে দ্রুত মনে হয়, কিন্তু বাস্তবে কতটা পার্থক্য হচ্ছে সেটা <b>অনুমান না করে মাপা</b> উচিত। এর জন্য .NET ইকোসিস্টেমের প্রমাণিত টুল হলো <b>BenchmarkDotNet</b> — এটা warm-up, multiple iteration, memory allocation পরিমাপ ইত্যাদি নিয়ন্ত্রণ করে নির্ভরযোগ্য সংখ্যা দেয়, যা সাধারণ <code>Stopwatch</code> দিয়ে মাপলে পাওয়া যায় না।</p>
<pre>[MemoryDiagnoser]
public class StringBenchmarks
{
    private readonly string _s = "Hello, World!";

    [Benchmark(Baseline = true)]
    public string UsingSubstring() =&gt; _s.Substring(7, 5);

    [Benchmark]
    public string UsingSpan() =&gt; _s.AsSpan(7, 5).ToString();
}

<span class="c">// চালানো হয়: BenchmarkRunner.Run&lt;StringBenchmarks&gt;();</span></pre>

<template data-page="reflection">
<h2 class="title">১৫. Reflection · Attributes · Source Generators</h2>
<p class="lead">Foundation চ্যাপ্টারে বলা হয়েছিল যে প্রতিটি .NET assembly তার নিজের metadata বহন করে — টাইপ, মেথড, প্রপার্টির বর্ণনা assembly ফাইলের ভেতরেই থাকে। এই চ্যাপ্টারে দেখব সেই metadata ব্যবহার করে <span class="kw">Reflection</span> কীভাবে রানটাইমে কোড সম্পর্কে জানতে পারে, কেন সেটার একটা performance cost আছে, এবং কম্পাইল-টাইমে একই কাজ করার আধুনিক বিকল্প <span class="kw">Source Generators</span> কীভাবে কাজ করে।</p>

<h3>১. Reflection আসলে কী</h3>
<p><span class="kw">Reflection</span> হলো রানটাইমে একটা প্রোগ্রাম নিজের (বা অন্য কোনো লোড করা assembly-র) টাইপ, মেথড, প্রপার্টি সম্পর্কে জানার ক্ষমতা — এমনকি সেই টাইপ কম্পাইল-টাইমে না জানা থাকলেও। যেমন একটা প্লাগইন সিস্টেমে তুমি একটা assembly ফাইল রানটাইমে লোড করছ, কিন্তু জানো না তার ভেতরে ঠিক কোন ক্লাস আছে — শুধু জানো যে কোনো ক্লাস একটা নির্দিষ্ট <b>interface</b> ইমপ্লিমেন্ট করবে। Reflection দিয়ে তুমি সেই assembly-র সব টাইপ ঘুরে দেখতে পারো, কোনটা ইন্টারফেস ইমপ্লিমেন্ট করছে সেটা বের করতে পারো, এমনকি <span class="kw">Activator.CreateInstance</span> দিয়ে instance বানিয়ে মেথড কলও করতে পারো — সব কিছু স্ট্রিং নাম আর <span class="kw">Type</span> অবজেক্ট দিয়ে, কোনো compile-time reference ছাড়াই।</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> এটা সম্ভব হয় কারণ প্রতিটি assembly-তে IL কোডের পাশাপাশি একটা metadata টেবিল থাকে — টাইপের নাম, মেম্বার সিগনেচার, attribute সব এখানে সংরক্ষিত। CLR এই metadata পড়েই Reflection API-কে ডেটা সাপ্লাই করে; তাই Reflection চালাতে সোর্স কোড নয়, শুধু assembly ফাইলটাই লাগে।</div>

<h3>২. Type, GetProperties, GetValue দিয়ে ডায়নামিক ইনস্পেকশন</h3>
<p>সবচেয়ে সাধারণ শুরুর বিন্দু হলো একটা <span class="kw">Type</span> অবজেক্ট পাওয়া — কম্পাইল-টাইমে টাইপ জানা থাকলে <span class="kw">typeof</span>, আর একটা instance থেকে জানতে চাইলে <span class="kw">GetType()</span>। এরপর <span class="kw">GetProperties()</span> দিয়ে সব প্রপার্টি লিস্ট করা যায়, আর প্রতিটা <span class="kw">PropertyInfo</span>-এর <span class="kw">GetValue()</span> কল করে সেই প্রপার্টির আসল মান পড়া যায় — কম্পাইল-টাইমে প্রপার্টির নাম না জেনেই।</p>
<pre>public class Product
{
    public string Name { get; set; }
    public decimal Price { get; set; }
}

Product p = new Product { Name = "Keyboard", Price = 1500m };

<span class="c">// কম্পাইল-টাইমে টাইপ জানা থাকলে typeof, না জানলে GetType()</span>
Type type = p.GetType();

foreach (PropertyInfo prop in type.GetProperties())
{
    object value = prop.GetValue(p);
    Console.WriteLine($"{prop.Name} = {value}");
}
<span class="c">// আউটপুট: Name = Keyboard, Price = 1500</span></pre>
<p>লক্ষ করো, এই লুপ প্রপার্টির নাম না জেনেই চলছে — <b>Product</b> ক্লাসে নতুন প্রপার্টি যোগ করলেও এই কোড না পাল্টেই সেটা ধরে ফেলবে। এটাই Reflection-এর মূল শক্তি: generic, ডেটা-চালিত কোড লেখা যায় যেটা যেকোনো টাইপের সাথে কাজ করে।</p>
<div class="callout why"><span class="tag">কেন এটা দরকার হয়</span> Serialization লাইব্রেরি, dependency injection container, ORM — এদের সবার একই সমস্যা: রানটাইমে না জানা টাইপের প্রপার্টি পড়তে বা সেট করতে হয়। Reflection ছাড়া এসব লাইব্রেরি প্রতিটা সম্ভাব্য টাইপের জন্য আলাদা কোড লিখতে বাধ্য হতো।</div>

<h3>৩. Reflection-এর পারফরম্যান্স খরচ</h3>
<p><span class="kw">GetValue()</span>, <span class="kw">Invoke()</span>-এর মতো Reflection কলগুলো সরাসরি কম্পাইল করা কোডের তুলনায় লক্ষণীয়ভাবে ধীর। কারণ প্রতিটা কলে CLR-কে টাইপ চেক, মেম্বার লুকআপ, আর dynamic dispatch — এই ধাপগুলো রানটাইমে পার হতে হয়, যেখানে সরাসরি <code>p.Price</code> লেখা কোডে এসব compile-time-এই ঠিক হয়ে যায় এবং সরাসরি মেমরি অ্যাক্সেসে রূপান্তরিত হয়।</p>
<div class="callout mistake"><span class="tag">Common mistake — hot loop-এ Reflection</span> একটা টাইট লুপে হাজার হাজার বার <span class="kw">MethodInfo.Invoke()</span> কল করা একটা ভারী পারফরম্যান্স সমস্যা — প্রতিটা কল সরাসরি মেথড কলের তুলনায় বহুগুণ ধীর হতে পারে। এক-বারের startup-time কাজ (যেমন DI কন্টেইনার অ্যাপ চালু হওয়ার সময় constructor খুঁজে বের করা) এর জন্য এই খরচ সম্পূর্ণ গ্রহণযোগ্য, কিন্তু request-প্রতি বারবার চলা কোডে এটা এড়িয়ে চলা উচিত।</div>
<div class="callout best"><span class="tag">Best practice — যদি Reflection লাগেই</span> <span class="kw">PropertyInfo</span>/<span class="kw">MethodInfo</span> অবজেক্টগুলো একবার লুকআপ করে ক্যাশ (static ডিকশনারিতে) করে রাখো, প্রতিবার নতুন করে লুকআপ কোরো না। আরও ভালো হলে <b>compiled delegate</b> (<span class="kw">Delegate.CreateDelegate</span>) বা <span class="kw">Expression Trees</span> ব্যবহার করে একবার একটা দ্রুত delegate কম্পাইল করে বারবার সেটা কল করো।</div>

<h3>৪. Custom Attributes বানানো ও পড়া</h3>
<p>নিজের অ্যাট্রিবিউট বানাতে <span class="kw">Attribute</span> ক্লাস থেকে ইনহেরিট করা একটা ক্লাস লিখতে হয়, তারপর সেটা কোনো ক্লাস, প্রপার্টি বা মেথডের উপর বসানো যায়। Reflection দিয়ে পরে সেই অ্যাট্রিবিউট পড়ে তার ভিত্তিতে সিদ্ধান্ত নেওয়া যায় — যেমন নিচের উদাহরণে একটা সাধারণ validation অ্যাট্রিবিউট।</p>
<pre>[AttributeUsage(AttributeTargets.Property)]
public class MaxLengthAttribute : Attribute
{
    public int Length { get; }
    public MaxLengthAttribute(int length) =&gt; Length = length;
}

public class Customer
{
    [MaxLength(50)]
    public string Name { get; set; }
}

<span class="c">// Reflection দিয়ে অ্যাট্রিবিউট পড়ে validate করা</span>
public static void Validate(object obj)
{
    foreach (PropertyInfo prop in obj.GetType().GetProperties())
    {
        var attr = prop.GetCustomAttribute&lt;MaxLengthAttribute&gt;();
        if (attr != null &amp;&amp; prop.GetValue(obj) is string s &amp;&amp; s.Length &gt; attr.Length)
        {
            throw new ValidationException($"{prop.Name} সর্বোচ্চ {attr.Length} অক্ষরের হতে পারে।");
        }
    }
}</pre>
<p>এখানে <span class="kw">GetCustomAttribute&lt;T&gt;()</span> রানটাইমে প্রপার্টির উপর বসানো অ্যাট্রিবিউট খুঁজে বের করছে এবং তার <b>Length</b> প্রপার্টি পড়ে validation চালাচ্ছে — এভাবেই ASP.NET Core-এর মডেল ভ্যালিডেশন, EF Core-এর কলাম ম্যাপিং, এবং অনেক লাইব্রেরি অ্যাট্রিবিউট-চালিত আচরণ তৈরি করে।</p>

<h3>৫. Expression Trees — কোড হিসেবে নয়, ডেটা হিসেবে কোড</h3>
<p>একটা সাধারণ <span class="kw">Func&lt;T,bool&gt;</span> কম্পাইল হয়ে সরাসরি এক্সিকিউটেবল IL কোডে পরিণত হয় — সেটাকে শুধু কল করা যায়, ভেতরে কী আছে দেখা যায় না। কিন্তু <span class="kw">Expression&lt;Func&lt;T,bool&gt;&gt;</span> একদম ভিন্ন জিনিস: এটা সেই একই লজিককে একটা <b>ট্রি স্ট্রাকচার হিসেবে ডেটা রূপে</b> সংরক্ষণ করে — "একটা প্যারামিটার, একটা তুলনা অপারেটর, একটা কনস্ট্যান্ট" — যা রানটাইমে ইনস্পেক্ট করা যায়, বিশ্লেষণ করা যায়, এমনকি অন্য কিছুতে রূপান্তর করা যায়।</p>
<pre>Func&lt;int, bool&gt; compiledFunc = x =&gt; x &gt; 10;
bool result = compiledFunc(20); <span class="c">// সরাসরি এক্সিকিউট হয়, result = true</span>

Expression&lt;Func&lt;int, bool&gt;&gt; expressionTree = x =&gt; x &gt; 10;
<span class="c">// এটা সরাসরি কল করা যায় না, কারণ এটা কোড নয়, কোডের বর্ণনা (ডেটা)</span>
<span class="c">// expressionTree(20); // কম্পাইল এরর</span>

Func&lt;int, bool&gt; compiled = expressionTree.Compile(); <span class="c">// এখন এটাকে IL-এ কম্পাইল করা হলো</span>
bool result2 = compiled(20); <span class="c">// এখন কল করা যায়, result2 = true</span></pre>
<p>এই ধারণাটাই LINQ চ্যাপ্টারে আলোচিত <span class="kw">IQueryable&lt;T&gt;</span>-এর পেছনের আসল রহস্য। যখন তুমি EF Core-এ <code>db.Customers.Where(c =&gt; c.Age &gt; 18)</code> লেখো, এই lambda কম্পাইল হয়ে সরাসরি চলে না — বরং একটা Expression Tree হিসেবে তৈরি হয়। EF Core provider এই ট্রি হেঁটে দেখে ("Age প্রপার্টি, তারপর &gt; অপারেটর, তারপর 18") এবং সেটাকে <b>SQL কোয়েরিতে অনুবাদ</b> করে — তোমার C# কোড আসলে কখনো ইন-মেমরি রান হয়ই না, শুধু তার বর্ণনা পড়ে ডাটাবেজে পাঠানো হয়।</p>
<div class="callout why"><span class="tag">কেন Expression আর Func আলাদা রাখা হয়েছে</span> যদি LINQ শুধু <span class="kw">Func</span> ব্যবহার করত, EF Core কখনো জানতেই পারত না কোয়েরির ভেতরে কী আছে — সে শুধু একটা কম্পাইল করা ব্ল্যাক-বক্স ডেলিগেট পেত, যা শুধু in-memory চালানো যায়। <span class="kw">Expression&lt;TDelegate&gt;</span> ব্যবহার করে কম্পাইলার lambda-টাকে ডেটা-স্ট্রাকচার হিসেবে তৈরি করে, যা provider-কে বিশ্লেষণের সুযোগ দেয়।</div>

<h3>৬. Source Generators — কম্পাইল-টাইমে কোড তৈরি</h3>
<p>Performance চ্যাপ্টারে উল্লেখ করা হয়েছিল যে <span class="kw">Source Generators</span> হলো reflection-ভিত্তিক runtime কোড-জেনারেশনের AOT-বান্ধব আধুনিক বিকল্প। একটা source generator Roslyn কম্পাইলারের সাথে প্লাগ-ইন হিসেবে যুক্ত হয়ে তোমার এক্সিস্টিং কোড (যেমন ক্লাস, অ্যাট্রিবিউট) বিশ্লেষণ করে এবং <b>কম্পাইল-টাইমে</b> নতুন C# সোর্স ফাইল জেনারেট করে দেয় — যা তারপর সাধারণ কোডের মতোই কম্পাইল হয়ে যায়।</p>
<p>মূল পার্থক্যটা এখানে: reflection-ভিত্তিক পদ্ধতিতে অ্যাপ রানটাইমে প্রতিবার অ্যাট্রিবিউট আর প্রপার্টি স্ক্যান করে "কী করতে হবে" বের করে। Source generator পদ্ধতিতে এই "কী করতে হবে"-র উত্তর কম্পাইল-টাইমেই বের করে সরাসরি কোড আকারে লিখে দেওয়া হয় — রানটাইমে আর কোনো স্ক্যানিং বা লুকআপ লাগে না, শুধু আগে থেকে লেখা সাধারণ কোড চলে।</p>
<p>সবচেয়ে বড় বাস্তব উদাহরণ হলো <span class="kw">System.Text.Json</span>-এর source-generated সিরিয়ালাইজার। <code>[JsonSerializable(typeof(Product))]</code>-এর মতো একটা অ্যাট্রিবিউট বসালে generator কম্পাইল-টাইমেই <b>Product</b>-এর জন্য সরাসরি serialize/deserialize কোড লিখে দেয় — কোনো রানটাইম reflection ছাড়াই। এর ফলে এটা reflection-ভিত্তিক সিরিয়ালাইজেশনের চেয়ে দ্রুত, এবং যেহেতু কোনো রানটাইম reflection নেই, তাই এটা <b>Native AOT</b>-এর সাথে সম্পূর্ণ সামঞ্জস্যপূর্ণ — যেখানে সাধারণ reflection-ভিত্তিক সিরিয়ালাইজেশন প্রায়ই ভেঙে পড়ে বা trimming-এ সমস্যা করে।</p>

<h3>৭. কখন কোনটা — Reflection বনাম Source Generator</h3>
<p>দুটোই "কম্পাইল-টাইমে না জানা গঠনের ভিত্তিতে কোড আচরণ ঠিক করা" সমস্যার সমাধান করে, কিন্তু সম্পূর্ণ ভিন্ন সময়ে ও ভিন্ন খরচে।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>Reflection</th><th>Source Generator</th></tr>
<tr><td>কখন কাজ করে</td><td>রানটাইমে, প্রতিবার</td><td>কম্পাইল-টাইমে, একবার</td></tr>
<tr><td>গতি</td><td>ধীর (runtime lookup/dispatch)</td><td>দ্রুত (সাধারণ কম্পাইল করা কোডের সমান)</td></tr>
<tr><td>Native AOT সাপোর্ট</td><td>প্রায়ই ভাঙে বা সীমিত</td><td>সম্পূর্ণ সামঞ্জস্যপূর্ণ</td></tr>
<tr><td>নমনীয়তা</td><td>খুব বেশি — না জানা টাইপেও কাজ করে</td><td>সীমিত — যা কম্পাইল-টাইমে বিশ্লেষণযোগ্য শুধু তাই</td></tr>
<tr><td>লেখার জটিলতা</td><td>ব্যবহার করা সহজ</td><td>নিজে লেখা কঠিন (Roslyn API, incremental generator pipeline)</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — অপ্রয়োজনে Reflection বেছে নেওয়া</span> "না জানা টাইপ নিয়ে কাজ করতে হবে" মনে হলেই সরাসরি Reflection-এ ঝাঁপ দেওয়া একটা সাধারণ ভুল। অনেক ক্ষেত্রে একটা ভালো ডিজাইন করা <b>interface</b> বা ইতিমধ্যে থাকা একটা source generator (যেমন <span class="kw">System.Text.Json</span>-এর) একই কাজ কম্পাইল-টাইমে, দ্রুত এবং AOT-বান্ধবভাবে করে দিতে পারে — বিশেষ করে সিরিয়ালাইজেশনের মতো সাধারণ কাজে।</div>
<div class="callout best"><span class="tag">Best practice — consumer থাকো, author নয়</span> বাস্তবে বেশিরভাগ ডেভেলপার নিজে source generator লেখে না — তারা <span class="kw">System.Text.Json</span>, <span class="kw">Regex</span> সোর্স জেনারেটরের মতো এক্সিস্টিং জেনারেটরের <b>consumer</b> হিসেবেই এদের সুবিধা নেয়, শুধু একটা অ্যাট্রিবিউট বসিয়ে। নিজে source generator লেখা তখনই যুক্তিসঙ্গত যখন তুমি একটা লাইব্রেরি বানাচ্ছ যা বহু ব্যবহারকারীর কম্পাইল-টাইম কোড-জেনারেশন প্রয়োজন মেটাবে — অ্যাপ্লিকেশন-লেভেল কোডে এটা সাধারণত অতিরিক্ত জটিলতা।</div>

<h2 class="title">১৬. Dependency Injection ও Design Patterns</h2>
<p class="lead">এই অধ্যায়ে আমরা দেখব কেন একটা ক্লাস নিজের dependency নিজে তৈরি না করে বাইরে থেকে গ্রহণ করা ভালো, ASP.NET Core-এর built-in DI container কীভাবে কাজ করে, তিনটি service lifetime-এর পার্থক্য, একটা খুব সাধারণ কিন্তু বিপজ্জনক bug — captive dependency, এবং কিছু জনপ্রিয় design pattern-এর সংক্ষিপ্ত পরিচয়।</p>

<h3>১৫.১ Dependency Injection কেন দরকার — Inversion of Control</h3>
<p><span class="kw">Dependency Injection</span> (DI) হলো একটা <span class="kw">Inversion of Control</span> (IoC) নীতির বাস্তবায়ন। সাধারণ approach-এ একটা ক্লাস তার প্রয়োজনীয় object নিজেই <code>new</code> করে তৈরি করে। এতে ক্লাসটি সরাসরি একটা নির্দিষ্ট implementation-এর সাথে tightly coupled হয়ে যায়। DI-এর মূল ধারণা হলো — dependency তৈরি করার দায়িত্ব ক্লাসের নিজের না রেখে বাইরে থেকে (সাধারণত constructor-এর মাধ্যমে) সরবরাহ করা।</p>
<pre>
<span class="c">// Before — tightly coupled, নিজেই dependency তৈরি করছে</span>
public class OrderService
{
    private readonly SqlOrderRepository _repository = new SqlOrderRepository();

    public void PlaceOrder(Order order)
    {
        _repository.Save(order);
    }
}
</pre>
<p>এই কোডে <code>OrderService</code> সরাসরি <code>SqlOrderRepository</code> ক্লাসের সাথে বাঁধা। Unit test লিখতে গেলে আসল ডাটাবেজ ছাড়া কোনো উপায় নেই, এবং ভবিষ্যতে যদি অন্য কোনো storage (যেমন MongoDB) ব্যবহার করতে হয়, তাহলে <code>OrderService</code>-এর কোড পরিবর্তন করতে হবে।</p>
<pre>
<span class="c">// After — constructor injection, interface-এর উপর নির্ভরশীল</span>
public interface IOrderRepository
{
    void Save(Order order);
}

public class OrderService
{
    private readonly IOrderRepository _repository;

    public OrderService(IOrderRepository repository)
    {
        _repository = repository;
    }

    public void PlaceOrder(Order order)
    {
        _repository.Save(order);
    }
}
</pre>
<p>এখন <code>OrderService</code> শুধু জানে যে তার একটা <code>IOrderRepository</code> দরকার — কে সেটা বাস্তবায়ন করছে তা নিয়ে মাথা ঘামায় না। এতে দুটো সরাসরি সুবিধা পাওয়া যায়ঃ testability — test-এর সময় একটা fake বা mock repository পাঠানো যায়; এবং flexibility — implementation পরিবর্তন করলেও <code>OrderService</code>-এর কোড স্পর্শ করতে হয় না।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> Dependency Injection ছাড়া বড় অ্যাপ্লিকেশনে unit test লেখা প্রায় অসম্ভব হয়ে যায়, কারণ প্রতিটা ক্লাস তার সব dependency-সহ (ডাটাবেজ, নেটওয়ার্ক কল ইত্যাদি) টেনে আনে। DI এই dependency-গুলোকে abstract করে test করা সহজ করে দেয়।</div>

<h3>১৫.২ ASP.NET Core-এর Built-in DI Container</h3>
<p>ASP.NET Core-এ একটা built-in DI container আছে যা <code>Program.cs</code>-এ <code>builder.Services</code>-এর মাধ্যমে service register করার সুযোগ দেয়। Registration-এর সময় একটা interface-কে কোন concrete class দিয়ে resolve করতে হবে তা বলে দেওয়া হয়, আর framework নিজেই constructor দেখে প্রয়োজনীয় dependency automatically inject করে দেয় — এটাকে বলে <span class="kw">constructor injection</span>।</p>
<pre>
<span class="c">// Program.cs — service registration</span>
var builder = WebApplication.CreateBuilder(args);

builder.Services.AddScoped&lt;IOrderRepository, SqlOrderRepository&gt;();
builder.Services.AddScoped&lt;OrderService&gt;();

var app = builder.Build();
</pre>
<pre>
<span class="c">// Controller — constructor-এ interface চাইলেই DI container সেটা resolve করে দেয়</span>
public class OrdersController : ControllerBase
{
    private readonly OrderService _orderService;

    public OrdersController(OrderService orderService)
    {
        _orderService = orderService;
    }

    [HttpPost]
    public IActionResult Create(Order order)
    {
        _orderService.PlaceOrder(order);
        return Ok();
    }
}
</pre>
<p>এখানে কোথাও <code>new OrdersController(...)</code> বা <code>new SqlOrderRepository()</code> লেখা হয়নি — framework request আসার সময় পুরো dependency chain automatically তৈরি করে দেয়।</p>

<h3>১৫.৩ Service Lifetime — Transient, Scoped, Singleton</h3>
<p>DI container-এ service register করার সময় তার <span class="kw">lifetime</span> ঠিক করে দিতে হয় — অর্থাৎ একটা instance কতক্ষণ বেঁচে থাকবে এবং কতবার নতুন করে তৈরি হবে। এটা DI-এর সবচেয়ে গুরুত্বপূর্ণ এবং সবচেয়ে বেশি ভুল হওয়া অংশ।</p>
<table>
<tr><th>Lifetime</th><th>Instance তৈরির নিয়ম</th><th>উদাহরণ</th></tr>
<tr><td><span class="kw">Transient</span></td><td>প্রতিবার request করলেই নতুন instance তৈরি হয়</td><td>Stateless helper, lightweight calculation class</td></tr>
<tr><td><span class="kw">Scoped</span></td><td>একই scope (ASP.NET Core-এ সাধারণত একটা HTTP request)-এর মধ্যে একটাই instance, নতুন request এলে নতুন instance</td><td><code>DbContext</code>, request-নির্ভর business service</td></tr>
<tr><td><span class="kw">Singleton</span></td><td>পুরো অ্যাপ্লিকেশনের জীবনকালে মাত্র একটা instance, প্রথমবার তৈরি হয়ে বাকি সব request-এ পুনর্ব্যবহৃত হয়</td><td>Configuration cache, stateless calculation service, in-memory cache</td></tr>
</table>
<p><code>DbContext</code>-কে অবশ্যই <span class="kw">Scoped</span> রাখতে হবে, কখনো Singleton নয় — কারণ <code>DbContext</code> thread-safe নয়। যদি এটাকে Singleton বানানো হয়, তাহলে একই instance একাধিক concurrent request থেকে একসাথে ব্যবহৃত হবে, যা data corruption বা exception ঘটাতে পারে। অন্যদিকে যদি কোনো service সম্পূর্ণ stateless হয় (যেমন শুধু গণনা করে, কোনো instance-level state রাখে না), তাহলে সেটাকে Singleton বানিয়ে বারবার নতুন object তৈরির খরচ বাঁচানো যায়।</p>
<div class="callout best"><span class="tag">Best practice — সঠিক lifetime বাছাই</span> যদি নিশ্চিত না হন কোন lifetime ব্যবহার করবেন, ডিফল্ট হিসেবে <code>Scoped</code> বেছে নিন — বিশেষ করে যদি service-টি সরাসরি বা পরোক্ষভাবে <code>DbContext</code>-এর উপর নির্ভরশীল হয়।</div>

<h3>১৫.৪ Captive Dependency — একটা মারাত্মক সাধারণ ভুল</h3>
<p>একটা খুব সাধারণ কিন্তু ভয়ংকর bug হলো <span class="kw">captive dependency</span>। এটা তখন ঘটে যখন একটা <span class="kw">Singleton</span> service-এর constructor-এ কোনো <span class="kw">Scoped</span> (বা <span class="kw">Transient</span>) service সরাসরি inject করা হয়।</p>
<p>সমস্যাটা এখানে — Singleton service একবারই তৈরি হয়, পুরো অ্যাপ্লিকেশনের জীবনকালে। তার মানে constructor-এ যে Scoped instance প্রথমবার resolve করে দেওয়া হয়, সেটাই চিরকালের জন্য Singleton-এর ভিতরে আটকে (captured) থেকে যায়। ফলে পরবর্তী প্রতিটা নতুন HTTP request নিজের আলাদা Scoped instance না পেয়ে সেই একই পুরনো, প্রথমবার তৈরি হওয়া instance-টিই বারবার ব্যবহার করতে বাধ্য হয়। যদি সেই Scoped dependency একটা <code>DbContext</code> হয়, তাহলে একাধিক ভিন্ন ভিন্ন request একই সময়ে (concurrently) একই <code>DbContext</code> instance ব্যবহার করবে — যা thread-safety bug এবং পুরনো/ভুল (stale) ডেটা read হওয়ার মতো সমস্যা তৈরি করে।</p>
<pre>
<span class="c">// ভাঙা registration — Singleton-এর মধ্যে Scoped dependency সরাসরি inject করা হয়েছে</span>
public class ReportCache
{
    private readonly AppDbContext _dbContext;

    public ReportCache(AppDbContext dbContext) <span class="c">// captured! সবসময় প্রথম request-এর instance</span>
    {
        _dbContext = dbContext;
    }
}

builder.Services.AddSingleton&lt;ReportCache&gt;();
builder.Services.AddScoped&lt;AppDbContext&gt;();
</pre>
<div class="callout mistake"><span class="tag">Common mistake — Captive Dependency</span> Singleton service-এর constructor-এ Scoped service সরাসরি inject করলে সেই Scoped instance চিরস্থায়ীভাবে আটকে যায় এবং সব request এটা share করে — একাধিক request একসাথে একই <code>DbContext</code> ব্যবহার করলে race condition ও ভুল ডেটা দেখা দিতে পারে। কিছু কিছু ক্ষেত্রে ডিফল্ট container রান-টাইমে এই ভুল ধরে exception ছুঁড়ে দেয়, কিন্তু সবসময় নয়।</div>
<p>সমাধান হলো — সরাসরি constructor-এ Scoped dependency inject না করে, Singleton-এর ভিতরে যখন প্রয়োজন হয় তখন <code>IServiceScopeFactory</code> বা <code>IServiceProvider</code> ব্যবহার করে নিজে থেকে একটা নতুন scope তৈরি করা এবং সেই scope থেকে dependency resolve করা।</p>
<pre>
<span class="c">// সঠিক সমাধান — প্রয়োজনের সময় নতুন scope তৈরি করা হচ্ছে</span>
public class ReportCache
{
    private readonly IServiceScopeFactory _scopeFactory;

    public ReportCache(IServiceScopeFactory scopeFactory)
    {
        _scopeFactory = scopeFactory;
    }

    public void RefreshReport()
    {
        using var scope = _scopeFactory.CreateScope();
        var dbContext = scope.ServiceProvider.GetRequiredService&lt;AppDbContext&gt;();
        <span class="c">// এই dbContext শুধু এই scope-এর জন্যই তৈরি, request-এর মতো নিরাপদ</span>
    }
}
</pre>

<h3>১৫.৫ Design Pattern — Singleton ও Factory</h3>
<p>DI lifetime ছাড়াও C#-এ কিছু classic design pattern প্রায়ই ব্যবহৃত হয়। প্রথমেই <span class="kw">Singleton</span> pattern — আধুনিক C#/.NET-এ classic GoF style-এর static-instance singleton (যেমন <code>private static readonly Instance</code> field সহ একটা ক্লাস) লেখার বদলে সাধারণত DI container-এর <code>Singleton</code> lifetime ব্যবহার করাই বেশি প্রচলিত এবং সুপারিশকৃত, কারণ এতে testability ও lifetime management container-এর হাতে থাকে।</p>
<pre>
<span class="c">// DI-ভিত্তিক Singleton — এটাই আধুনিক C#-এ প্রাধান্য পায়</span>
builder.Services.AddSingleton&lt;IConfigCache, ConfigCache&gt;();
</pre>
<p><span class="kw">Factory</span> pattern-এ object তৈরি করার সিদ্ধান্তটা একটা আলাদা method বা ক্লাসের মধ্যে সরিয়ে নেওয়া হয়, যাতে "কী তৈরি হবে" এই সিদ্ধান্তটা ব্যবহারকারী কোড থেকে আলাদা থাকে।</p>
<pre>
public interface INotifier
{
    void Send(string message);
}

public class NotifierFactory
{
    public INotifier Create(string channel)
    {
        return channel switch
        {
            "email" =&gt; new EmailNotifier(),
            "sms" =&gt; new SmsNotifier(),
            _ =&gt; throw new ArgumentException("Unknown channel")
        };
    }
}
</pre>

<h3>১৫.৬ Design Pattern — Repository ও Strategy</h3>
<p><span class="kw">Repository</span> pattern আগেই আমরা দেখেছি — ডেটা access করার লজিককে একটা interface-এর পেছনে লুকিয়ে রাখা হয়, যাতে ব্যবসায়িক লজিক (business logic) জানে না ডেটা আসলে SQL Server থেকে আসছে নাকি অন্য কোনো উৎস থেকে।</p>
<pre>
public interface IOrderRepository
{
    Order? GetById(int id);
    void Save(Order order);
}
</pre>
<p><span class="kw">Strategy</span> pattern-এ একই কাজের জন্য একাধিক algorithm-কে একটা common interface-এর মধ্যে রাখা হয়, এবং প্রয়োজন অনুযায়ী নির্দিষ্ট implementation-টা inject করে দেওয়া হয় — algorithm পরিবর্তন করতে হলে ব্যবহারকারী ক্লাসের কোড স্পর্শ করতে হয় না।</p>
<pre>
public interface IDiscountStrategy
{
    decimal Apply(decimal price);
}

public class SeasonalDiscount : IDiscountStrategy
{
    public decimal Apply(decimal price) =&gt; price * 0.9m;
}

public class CheckoutService
{
    private readonly IDiscountStrategy _discountStrategy;

    public CheckoutService(IDiscountStrategy discountStrategy)
    {
        _discountStrategy = discountStrategy;
    }
}
</pre>

<h3>১৫.৭ Design Pattern — Decorator</h3>
<p><span class="kw">Decorator</span> pattern দিয়ে একটা existing implementation-এর কোড পরিবর্তন না করেই তার উপর নতুন behavior যোগ করা যায়। যেমন — একটা repository-র চারপাশে একটা caching layer বসিয়ে দেওয়া, মূল repository ক্লাস স্পর্শ না করেই।</p>
<pre>
public class CachedOrderRepository : IOrderRepository
{
    private readonly IOrderRepository _inner;
    private readonly Dictionary&lt;int, Order&gt; _cache = new();

    public CachedOrderRepository(IOrderRepository inner)
    {
        _inner = inner;
    }

    public Order? GetById(int id)
    {
        if (_cache.TryGetValue(id, out var cached))
            return cached; <span class="c">// cache hit — মূল repository-কে ছোঁয়া লাগে না</span>

        var order = _inner.GetById(id);
        if (order != null) _cache[id] = order;
        return order;
    }

    public void Save(Order order) =&gt; _inner.Save(order);
}
</pre>
<p>এভাবে <code>CachedOrderRepository</code>, মূল <code>SqlOrderRepository</code>-কে wrap করে নতুন behavior (caching) যোগ করছে, কিন্তু <code>SqlOrderRepository</code>-এর কোড একটুও পরিবর্তন করতে হয়নি।</p>

<h3>১৫.৮ আরেকটা সাধারণ ভুল — Service Locator Anti-pattern</h3>
<p>DI ব্যবহার করার সময় অনেক ডেভেলপার constructor injection বাদ দিয়ে কোডের ভেতরে যেখানে-সেখানে সরাসরি <code>IServiceProvider.GetService&lt;T&gt;()</code> কল করে service resolve করেন। এটাকে বলে <span class="kw">Service Locator</span> anti-pattern।</p>
<pre>
<span class="c">// Anti-pattern — dependency লুকিয়ে ফেলা হচ্ছে</span>
public class OrderService
{
    private readonly IServiceProvider _provider;

    public OrderService(IServiceProvider provider)
    {
        _provider = provider;
    }

    public void PlaceOrder(Order order)
    {
        var repository = _provider.GetService&lt;IOrderRepository&gt;();
        repository?.Save(order);
    }
}
</pre>
<div class="callout mistake"><span class="tag">Common mistake — Service Locator ব্যবহার</span> <code>IServiceProvider</code> সরাসরি inject করে ভেতরে ভেতরে <code>GetService</code> কল করলে ক্লাসের প্রকৃত dependency constructor signature থেকে দেখা যায় না — অর্থাৎ কোন কোন dependency আসলে দরকার তা লুকিয়ে থাকে। এতে unit test লেখা কঠিন হয়ে যায়, কারণ কোন dependency mock করতে হবে তা বাইরে থেকে বোঝা যায় না। এর বদলে যে dependency সত্যিই দরকার সেটা সরাসরি constructor-এ ঘোষণা করাই সঠিক পদ্ধতি।</div>
<div class="callout best"><span class="tag">Best practice — Constructor Injection-কে অগ্রাধিকার দিন</span> একটা ক্লাসের সব dependency তার constructor parameter-এ স্পষ্টভাবে প্রকাশিত থাকা উচিত। Service Locator শুধুমাত্র খুব বিশেষ পরিস্থিতিতে (যেমন dynamic plugin loading) ব্যবহার করা যেতে পারে, সাধারণ business logic-এ নয়।</div>
</template>

<h2 class="title">১৭. App Architecture Essentials — Configuration, Logging, Background Services, Caching</h2>
<p class="lead">আগের DI চ্যাপ্টারে আমরা শিখেছি কীভাবে constructor injection আর service lifetime দিয়ে dependency-গুলো manage করতে হয়। এখন সেই একই DI container-এ বাস্তব অ্যাপ্লিকেশনের জন্য দরকারি কিছু building block রেজিস্টার করা শিখব — Configuration, Logging, Background Services, HTTP client, আর Caching। এই সব service-ই পরের ASP.NET Core চ্যাপ্টারে যে ওয়েব অ্যাপ্লিকেশন বানানো হবে তার মেরুদণ্ড হিসেবে কাজ করবে।</p>

<h3>১৭.১ Configuration ও IConfiguration বেসিক্স</h3>
<p>প্রায় প্রতিটি .NET অ্যাপ্লিকেশনেরই কিছু না কিছু সেটিংস দরকার হয় — connection string, API URL, feature flag ইত্যাদি। এই সেটিংসগুলো সাধারণত <code>appsettings.json</code> ফাইলে রাখা হয়, এবং <span class="kw">IConfiguration</span> ইন্টারফেস দিয়ে সেগুলো read করা যায়।</p>
<pre>{
  "MySection": {
    "ApiUrl": "https://api.example.com",
    "TimeoutSeconds": 30,
    "RetryCount": 3
  }
}</pre>
<p>Environment variable দিয়েও একই key override করা যায় — যেমন production সার্ভারে <code>MySection__ApiUrl</code> নামের environment variable সেট করলে সেটা <code>appsettings.json</code>-এর মান ছাপিয়ে যাবে। এভাবে সংবেদনশীল তথ্য (secret, connection string) কোডে হার্ডকোড না করে deployment environment থেকে ইনজেক্ট করা যায়।</p>
<p>সরাসরি <span class="kw">IConfiguration</span> ইনজেক্ট করে string key দিয়ে পড়া যায়, যেমন <code>configuration["MySection:ApiUrl"]</code> — কিন্তু এটা বাস্তব প্রজেক্টে একটা সমস্যার জন্ম দেয়, যা পরের সেকশনে দেখব।</p>

<h3>১৭.২ Options Pattern — Strongly-Typed Configuration</h3>
<p>string key দিয়ে scattered lookup-এর বদলে .NET-এর প্রস্তাবিত পদ্ধতি হলো <b>Options Pattern</b> — একটা POCO ক্লাসে configuration section-কে bind করা, এবং সেটা <span class="kw">IOptions&lt;T&gt;</span> এর মাধ্যমে constructor injection দিয়ে নেওয়া, ঠিক যেভাবে DI চ্যাপ্টারে আমরা constructor injection দিয়ে অন্য যেকোনো dependency নিতাম।</p>
<pre>public class MyOptions
{
    public string ApiUrl { get; set; } = string.Empty;
    public int TimeoutSeconds { get; set; }
    public int RetryCount { get; set; }
}</pre>
<p>Program.cs-এ registration:</p>
<pre>builder.Services.Configure&lt;MyOptions&gt;(
    builder.Configuration.GetSection("MySection"));</pre>
<p>এখন যেকোনো সার্ভিস constructor-এ <span class="kw">IOptions&lt;MyOptions&gt;</span> চেয়ে নিলেই DI container সেটা resolve করে দেবে:</p>
<pre>public class ApiClientService
{
    private readonly MyOptions _options;

    public ApiClientService(IOptions&lt;MyOptions&gt; options)
    {
        _options = options.Value; <span class="c">// .Value থেকে actual POCO পাওয়া যায়</span>
    }

    public void Connect()
    {
        Console.WriteLine($"Connecting to {_options.ApiUrl} with timeout {_options.TimeoutSeconds}s");
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — IConfiguration সরাসরি ইনজেক্ট করা</span> business service-এর constructor-এ সরাসরি <span class="kw">IConfiguration</span> নিয়ে ভেতরে <code>config["Some:Key"]</code> string lookup ছড়িয়ে রাখা একটা খুবই সাধারণ ভুল। এতে key-এর বানান ভুল হলে compile-time-এ ধরা পড়ে না, রানটাইমে null বা default value চুপচাপ ফেরত আসে। এছাড়া সার্ভিসটার constructor দেখে বোঝাই যায় না ঠিক কোন কোন configuration value তার দরকার — এটা অনেকটা DI চ্যাপ্টারে দেখা Service Locator anti-pattern-এর মতোই সমস্যা: dependency-গুলো একটা generic lookup-এর আড়ালে লুকানো থাকে, explicit typed contract হিসেবে দেখা যায় না। POCO options class ব্যবহার করলে সার্ভিসটার constructor-ই ডকুমেন্টেশন হয়ে যায়।</div>

<h3>১৭.৩ IOptionsSnapshot&lt;T&gt; বনাম IOptions&lt;T&gt;</h3>
<p><span class="kw">IOptions&lt;T&gt;</span> মান একবার resolve হয়ে Singleton-এর মতো ধরে রাখা হয় — অ্যাপ চলাকালীন appsettings.json পরিবর্তন হলেও সেই মান আপডেট হয় না, restart লাগে। যদি <code>reloadOnChange: true</code> সেট করা থাকে ফাইল-based configuration provider-এ, আর runtime-এ কনফিগ বদলানোর সুবিধা দরকার হয়, তাহলে <span class="kw">IOptionsSnapshot&lt;T&gt;</span> ব্যবহার করা যায় — এটা প্রতিটা scope-এ নতুন করে config পড়ে।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th>IOptions&lt;T&gt;</th><th>IOptionsSnapshot&lt;T&gt;</th></tr>
<tr><td>Lifetime</td><td>Singleton — একবারই resolve হয়</td><td>Scoped — প্রতি request/scope-এ রিফ্রেশ হয়</td></tr>
<tr><td>Runtime reload</td><td>না, restart দরকার</td><td>হ্যাঁ, config change ধরতে পারে</td></tr>
<tr><td>ব্যবহারের জায়গা</td><td>স্থির configuration, background service</td><td>web request-scoped সার্ভিস, dynamic settings</td></tr>
<tr><td>Overhead</td><td>নগণ্য</td><td>সামান্য বেশি (প্রতি scope-এ rebind)</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span> সাধারণ static configuration-এর জন্য <span class="kw">IOptions&lt;T&gt;</span>-ই যথেষ্ট। শুধু তখনই <span class="kw">IOptionsSnapshot&lt;T&gt;</span> ব্যবহার করো যখন সত্যিই runtime-এ config পরিবর্তনের প্রয়োজন আছে — কারণ Singleton সার্ভিসে <span class="kw">IOptionsSnapshot&lt;T&gt;</span> ইনজেক্ট করলে captive dependency সমস্যা হতে পারে (Scoped সার্ভিস Singleton-এর ভেতরে আটকে যাওয়া), ঠিক যেমনটা DI চ্যাপ্টারে discuss করা হয়েছিল।</div>

<h3>১৭.৩.১ IOptionsMonitor&lt;T&gt; — Singleton-এর ভেতরেও নিরাপদ live reload</h3>
<p>উপরের callout একটা প্রশ্ন খোলা রাখলো — যদি ঠিক একটা Singleton service বা background worker-এর ভেতরেই runtime config change ধরতে হয়, কিন্তু <span class="kw">IOptionsSnapshot&lt;T&gt;</span> Scoped বলে সরাসরি Singleton-এ inject করলে captive dependency-এর ঝুঁকি আছে, তাহলে উপায় কী? এখানেই কাজে লাগে <span class="kw">IOptionsMonitor&lt;T&gt;</span> — এটা নিজেই Singleton হিসেবে register হয় (তাই যেকোনো Singleton-এর constructor-এ নিরাপদে inject করা যায়, কোনো captive dependency তৈরি হয় না), অথচ এর <code>.CurrentValue</code> প্রপার্টি প্রতিবার পড়ার সময় সবসময় সর্বশেষ config মান দেয়। এছাড়া এটা <code>.OnChange(...)</code> দিয়ে একটা callback subscribe করারও সুযোগ দেয়, যা config বদলানোর মুহূর্তেই ট্রিগার হয়।</p>
<pre>public class PricingWorker
{
    private readonly IOptionsMonitor&lt;MyOptions&gt; _monitor;

    public PricingWorker(IOptionsMonitor&lt;MyOptions&gt; monitor)
    {
        _monitor = monitor;
        _monitor.OnChange(updated =&gt;
            Console.WriteLine($"Config বদলে গেছে, নতুন ApiUrl: {updated.ApiUrl}"));
    }

    public void DoWork()
    {
        var current = _monitor.CurrentValue; <span class="c">// সবসময় সর্বশেষ মান, Singleton হয়েও</span>
        Console.WriteLine(current.ApiUrl);
    }
}

builder.Services.AddSingleton&lt;PricingWorker&gt;(); <span class="c">// এখানে IOptionsMonitor injection সম্পূর্ণ নিরাপদ</span></pre>

<tr><td>Singleton-এ inject নিরাপদ?</td><td>হ্যাঁ</td><td>না — captive dependency</td><td>হ্যাঁ</td></tr>
<tr><td>Runtime reload</td><td>না</td><td>হ্যাঁ, প্রতি scope-এ</td><td>হ্যাঁ, তাৎক্ষণিক (<code>.CurrentValue</code>)</td></tr>
<tr><td>Change callback</td><td>নেই</td><td>নেই</td><td><code>.OnChange(...)</code> আছে</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — কোনটা কখন</span> Scoped/web-request নির্ভর সার্ভিসে সাধারণত <span class="kw">IOptionsSnapshot&lt;T&gt;</span> যথেষ্ট এবং সহজ। কিন্তু Singleton service বা background worker-এ যদি runtime config change দরকার হয়, তাহলে <span class="kw">IOptionsSnapshot&lt;T&gt;</span> নয় — সবসময় <span class="kw">IOptionsMonitor&lt;T&gt;</span> ব্যবহার করো, এটাই captive dependency ছাড়াই এই দুই প্রয়োজন একসাথে মেটায়।</div>

<h3>১৭.৪ Logging — ILogger&lt;T&gt; ও Log Levels</h3>
<p>.NET-এর built-in logging system <span class="kw">ILogger&lt;T&gt;</span> ইন্টারফেসের মাধ্যমে যেকোনো ক্লাসে constructor injection দিয়ে ঢুকে যায়। generic parameter <code>T</code> সাধারণত ক্লাসটা নিজেই হয় — এটা log-এর "category" নির্ধারণ করে, যাতে পরে filter করে বোঝা যায় কোন ক্লাস থেকে কোন log এসেছে।</p>
<pre>public class OrderService
{
    private readonly ILogger&lt;OrderService&gt; _logger;

    public OrderService(ILogger&lt;OrderService&gt; logger)
    {
        _logger = logger;
    }
}</pre>

<tr><td>Debug</td><td>ডেভেলপমেন্টে সমস্যা খুঁজতে সহায়ক তথ্য, production-এ কম দরকার</td></tr>

<h3>১৭.৫ Structured Logging — Message Template ব্যবহার করো, String Interpolation নয়</h3>
<p>লগ লেখার সময় সবচেয়ে গুরুত্বপূর্ণ নিয়ম হলো — message template ব্যবহার করা, string interpolation নয়।</p>
<pre>_logger.LogInformation("Order {OrderId} placed by {CustomerId}", orderId, customerId);

<span class="c">// ভুল পদ্ধতি — string interpolation দিয়ে</span>
_logger.LogInformation($"Order {orderId} placed by {customerId}");</pre>
<p>দেখতে প্রায় একইরকম মনে হলেও এই দুটোর মধ্যে বিশাল পার্থক্য আছে। প্রথম উদাহরণে <code>{OrderId}</code> আর <code>{CustomerId}</code> placeholder থেকে যায় এবং orderId, customerId আলাদা structured field হিসেবে log event-এর সাথে সংরক্ষিত হয়। Loki, Elasticsearch, বা Application Insights-এর মতো log aggregation সিস্টেমে গেলে এই field-গুলো দিয়ে সরাসরি ফিল্টার বা কুয়েরি করা যায় — যেমন "সব log দেখাও যেখানে OrderId = 12345"। দ্বিতীয় উদাহরণে ($ দিয়ে interpolation) মান আগে থেকেই string-এ বসে যায়, ফলে পুরো লগ মেসেজটা একটা plain unstructured text হয়ে যায় — এখান থেকে OrderId দিয়ে filter করা কার্যত অসম্ভব বা শুধু regex দিয়ে করতে হয়।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> প্রোডাকশন সিস্টেমে হাজার হাজার log line-এর মধ্যে থেকে নির্দিষ্ট একটা OrderId বা CustomerId-এর সব activity খুঁজে বের করা রোজকার কাজ। message template ব্যবহার করলে log backend সেই field-গুলোকে index করতে পারে, dashboard বানাতে পারে, alert সেট করতে পারে। string interpolation করলে সেই সুবিধা পুরোপুরি হারিয়ে যায় — লগ থাকলেও সেটা কার্যত "searchable" না, শুধু "readable"।</div>

<h3>১৭.৬ Background Services — IHostedService ও BackgroundService</h3>
<p>HTTP request-response সাইকেলের বাইরে অনেক সময় long-running কাজ করতে হয় — queue থেকে message process করা, periodic cleanup job, একটা message consumer চালানো। এর জন্য .NET দেয় <span class="kw">IHostedService</span> ইন্টারফেস, যেখানে <code>StartAsync</code> আর <code>StopAsync</code> মেথড override করতে হয় — অ্যাপ শুরু ও শেষ হওয়ার সময় এই মেথডগুলো host কল করে।</p>
<p>বেশিরভাগ ক্ষেত্রে <span class="kw">IHostedService</span> সরাসরি implement না করে এর abstract base class <span class="kw">BackgroundService</span> ব্যবহার করাই সহজ — এখানে শুধু একটা মেথড, <code>ExecuteAsync(CancellationToken)</code>, override করলেই হয়।</p>
<pre>public class CleanupWorker : BackgroundService
{
    private readonly ILogger&lt;CleanupWorker&gt; _logger;

    public CleanupWorker(ILogger&lt;CleanupWorker&gt; logger)
    {
        _logger = logger;
    }

    protected override async Task ExecuteAsync(CancellationToken stoppingToken)
    {
        while (!stoppingToken.IsCancellationRequested)
        {
            _logger.LogInformation("Cleanup ran at {Time}", DateTimeOffset.UtcNow);
            await Task.Delay(TimeSpan.FromMinutes(5), stoppingToken);
        }
    }
}</pre>
<p>Registration হয় Program.cs-এ:</p>
<pre>builder.Services.AddHostedService&lt;CleanupWorker&gt;();</pre>
<p>এখানে <code>stoppingToken</code>-টাই আগের CancellationToken চ্যাপ্টারের cooperative cancellation ধারণার প্রয়োগ — host যখন gracefully shut down হতে চায় (deployment restart, container stop ইত্যাদি), তখন এই token signal করে যে কাজ বন্ধ করে বেরিয়ে আসতে হবে। <code>Task.Delay</code>-তে token pass করা তাই জরুরি, নইলে shutdown-এর সময় পুরো delay শেষ হওয়া পর্যন্ত অপেক্ষা করতে হতো।</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> <span class="kw">BackgroundService</span> নিজেই <span class="kw">IHostedService</span> implement করে — এর <code>StartAsync</code> ভেতরে ভেতরে <code>ExecuteAsync</code>-কে একটা fire-and-forget Task হিসেবে শুরু করে দেয়, আর <code>StopAsync</code> internal CancellationTokenSource cancel করে সেই Task শেষ হওয়ার জন্য অপেক্ষা করে। তাই BackgroundService আসলে IHostedService-এর উপর একটা convenience layer মাত্র।</div>

<h3>১৭.৭ IHttpClientFactory — HttpClient সঠিকভাবে ব্যবহার করা</h3>
<p>আগের Async চ্যাপ্টারে আমরা সরাসরি <code>new HttpClient()</code> ব্যবহার করে দেখিয়েছিলাম, কিন্তু বাস্তব অ্যাপ্লিকেশনে এই প্যাটার্নে দুটো লুকানো সমস্যা আছে।</p>
<p>প্রথমত, প্রতিটা request-এ নতুন <code>HttpClient</code> তৈরি করে ব্যবহারের পর Dispose করলে underlying socket সাথে সাথে রিলিজ হয় না — সেটা কিছু সময় <code>TIME_WAIT</code> অবস্থায় পড়ে থাকে। উচ্চ ট্র্যাফিকে বারবার এটা করলে সার্ভারে available socket ফুরিয়ে যায় — একে বলে <b>socket exhaustion</b>।</p>
<p>দ্বিতীয়ত, এর উল্টো সমাধান — একটা static/singleton <code>HttpClient</code> চিরস্থায়ীভাবে ধরে রাখা — সেটাও সমস্যাজনক, কারণ <code>HttpClient</code> একবার DNS resolve করলে সেই connection-এর জীবনকাল জুড়ে সেই resolution cache করে রাখে। কোনো টার্গেট সার্ভারের IP failover হলেও static client সেটা ধরতে পারে না।</p>
<p><span class="kw">IHttpClientFactory</span> এই দুই সমস্যারই সমাধান দেয় — এটা ভেতরে ভেতরে একটা <span class="kw">HttpMessageHandler</span> pool ম্যানেজ করে, যেগুলো নির্দিষ্ট সময় পরপর rotate হয় (fresh DNS resolution পাওয়া যায়), কিন্তু handler-গুলো share/reuse হওয়ায় socket exhaustion হয় না।</p>
<pre>builder.Services.AddHttpClient&lt;WeatherApiClient&gt;(client =&gt;
{
    client.BaseAddress = new Uri("https://api.weather.example.com");
});</pre>
<pre>public class WeatherApiClient
{
    private readonly HttpClient _httpClient;

    public WeatherApiClient(HttpClient httpClient)
    {
        _httpClient = httpClient; <span class="c">// factory এর তৈরি, DI দিয়ে ইনজেক্টেড</span>
    }

    public async Task&lt;string&gt; GetForecastAsync(CancellationToken ct)
    {
        return await _httpClient.GetStringAsync("/forecast", ct);
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — HttpClient সরাসরি new করা</span> loop-এর ভেতরে বা প্রতিটা request handler-এ <code>using var client = new HttpClient();</code> লেখা — এটা প্রোডাকশনে ধীরে ধীরে socket exhaustion ঘটায় এবং হঠাৎ "SocketException: address already in use" জাতীয় error দিতে শুরু করে উচ্চ লোডে। সবসময় <span class="kw">IHttpClientFactory</span>-এর মাধ্যমে HttpClient নাও।</div>

<h3>১৭.৮ Caching — IMemoryCache ও IDistributedCache</h3>
<p>DI চ্যাপ্টারে Decorator pattern দিয়ে caching-এর ধারণাগত উদাহরণ দেখানো হয়েছিল — এখানে দেখব .NET-এর প্রকৃত built-in caching API।</p>
<p><span class="kw">IMemoryCache</span> একটা single process-এর মেমোরিতে key-value ডেটা রাখে — দ্রুত, সহজ, কিন্তু multiple app instance/replica-এর মধ্যে শেয়ার হয় না। <span class="kw">IDistributedCache</span> (সাধারণত Redis-backed) একটা external cache store ব্যবহার করে, তাই একাধিক instance/replica একই cache ডেটা দেখতে পায়।</p>
<table>
<tr><th>বিষয়</th><th>IMemoryCache</th><th>IDistributedCache</th></tr>
<tr><td>সংরক্ষণস্থল</td><td>অ্যাপ প্রসেসের নিজস্ব মেমোরি</td><td>বাহ্যিক store (যেমন Redis)</td></tr>
<tr><td>Multi-instance sharing</td><td>না — প্রতিটা instance-এর নিজস্ব cache</td><td>হ্যাঁ — সব instance একই cache দেখে</td></tr>
<tr><td>Speed</td><td>সবচেয়ে দ্রুত (in-process)</td><td>network round-trip লাগে, তুলনামূলক ধীর</td></tr>
<tr><td>উপযুক্ত ক্ষেত্র</td><td>single-instance অ্যাপ বা instance-নির্দিষ্ট ডেটা</td><td>load-balanced/multi-replica deployment</td></tr>
</table>
<p><span class="kw">IMemoryCache</span> ব্যবহারের উদাহরণ:</p>
<pre>public class ProductService
{
    private readonly IMemoryCache _cache;

    public ProductService(IMemoryCache cache)
    {
        _cache = cache;
    }

    public Product GetProduct(int id)
    {
        return _cache.GetOrCreate($"product-{id}", entry =&gt;
        {
            entry.AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(10);
            return LoadProductFromDatabase(id);
        });
    }
}</pre>
<p><span class="kw">IDistributedCache</span> ব্যবহারের উদাহরণ:</p>
<pre>public class SessionService
{
    private readonly IDistributedCache _cache;

    public SessionService(IDistributedCache cache)
    {
        _cache = cache;
    }

    public async Task&lt;string?&gt; GetSessionAsync(string sessionId, CancellationToken ct)
    {
        return await _cache.GetStringAsync(sessionId, ct);
    }

    public async Task SetSessionAsync(string sessionId, string data, CancellationToken ct)
    {
        await _cache.SetStringAsync(sessionId, data,
            new DistributedCacheEntryOptions
            {
                AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(30)
            }, ct);
    }
}</pre>
<div class="callout best"><span class="tag">Best practice</span> single-instance বা development environment-এ <span class="kw">IMemoryCache</span> দিয়েই শুরু করো — সহজ ও দ্রুত। যখন অ্যাপ multiple instance/replica-তে (যেমন Kubernetes-এ scale out) চলবে, তখন <span class="kw">IDistributedCache</span>-এ স্যুইচ করা দরকার, নইলে প্রতিটা instance আলাদা cache রাখবে আর ব্যবহারকারী ভিন্ন instance-এ গেলে stale বা অসামঞ্জস্যপূর্ণ ডেটা দেখতে পারে।</div>

<h2 class="title">১৮. ASP.NET Core Fundamentals</h2>
<p class="lead">এখন পর্যন্ত আমরা C# ভাষা আর .NET runtime নিয়ে কথা বলেছি — এই চ্যাপ্টারে দেখব সেই ভাষা দিয়ে কীভাবে একটা ওয়েব অ্যাপ্লিকেশন/API তৈরি হয়। ASP.NET Core হলো Microsoft-এর cross-platform web framework, যেখানে hosting, middleware pipeline, routing, model binding — সব কিছুই আগের চ্যাপ্টারগুলোর concept (top-level statements, DI, reflection)-এর উপর দাঁড়িয়ে।</p>

<h3>Hosting Model — WebApplicationBuilder ও Kestrel</h3>
<p>মডার্ন C#-এর <span class="kw">top-level statements</span> ফিচারটার কথা মনে আছে? ASP.NET Core-এর <b>minimal hosting model</b> ঠিক সেটাই ব্যবহার করে — কোনো <code>Startup.cs</code> ক্লাস, কোনো explicit <code>Main</code> মেথড ছাড়াই পুরো অ্যাপ্লিকেশন <code>Program.cs</code>-এর মধ্যে একটানা লেখা যায়। ভেতরে থাকে <code>WebApplicationBuilder</code>, যেটা তিনটা কাজ একসাথে করে — configuration লোড করা, dependency injection container সাজানো, ও logging সেটআপ করা।</p>
<p>এই hosting model-এর নিচে যে ওয়েব সার্ভার আসলে HTTP request গ্রহণ করে, সেটা হলো <b>Kestrel</b> — Microsoft-এর নিজস্ব, cross-platform (Windows/Linux/macOS), হালকা ও দ্রুত web server, যেটা .NET-এর সাথেই বিল্ট-ইন আসে। Production-এ প্রায়ই Kestrel-এর সামনে Nginx বা IIS-এর মতো একটা reverse proxy রাখা হয়, কিন্তু HTTP request আসলে হ্যান্ডল করে Kestrel-ই।</p>
<pre><span class="c">// Program.cs — top-level statements, কোনো class/Main দরকার নেই</span>
var builder = WebApplication.CreateBuilder(args);

<span class="c">// ১) Services registration — DI container-এ সব সার্ভিস যোগ করা</span>
builder.Services.AddControllers();
builder.Services.AddScoped&lt;IOrderService, OrderService&gt;();
builder.Services.AddEndpointsApiExplorer();

var app = builder.Build();

<span class="c">// ২) Middleware pipeline সাজানো</span>
app.UseHttpsRedirection();
app.UseAuthorization();
app.MapControllers();

<span class="c">// ৩) Kestrel চালু করে request শোনা শুরু করা</span>
app.Run();</pre>
<div class="callout why"><span class="tag">builder → services → app → middleware → run — কেন এই ক্রম</span>
<code>WebApplicationBuilder</code> প্রথমে configuration ও DI container প্রস্তুত করে (<code>builder.Services...</code>), তারপর <code>builder.Build()</code> কল করলে একটা immutable <code>WebApplication</code> instance তৈরি হয়। এই instance-এর উপরেই middleware pipeline সাজানো হয় (<code>app.Use...</code>), আর সবশেষে <code>app.Run()</code> কল করলে Kestrel প্রকৃতপক্ষে port-এ bind করে request শোনা শুরু করে। এই ধাপগুলো উল্টে দিলে কম্পাইল টাইমেই এরর আসবে, কারণ <code>app</code> object তৈরি হওয়ার আগে middleware বসানো সম্ভব না।</div>

<h3>Middleware Pipeline — একটার পর একটা ধাপ</h3>
<p>প্রতিটা incoming HTTP request একটা <b>ordered chain of middleware</b>-এর ভেতর দিয়ে যায়। প্রতিটা middleware চাইলে request-কে সামনে পাঠানোর <b>আগে</b> কিছু করতে পারে, আবার পরের middleware কল করার (<code>next()</code> delegate invoke করার) <b>পরে</b> response নিয়েও কিছু করতে পারে — অনেকটা nested function call-এর মতো। এটা <code>app.Use(async (context, next) =&gt; { ... await next(); ... })</code> দিয়ে লেখা যায়, অথবা বিল্ট-ইন <code>UseXxx()</code> extension method দিয়ে।</p>
<div class="diagram"><pre>
Request  ─▶ ExceptionHandler ─▶ HttpsRedirect ─▶ Routing ─▶ Authentication ─▶ Authorization ─▶ Endpoint
                                                                                                  │
Response ◀─ ExceptionHandler ◀─ HttpsRedirect ◀─ Routing ◀─ Authentication ◀─ Authorization ◀─────┘
</pre></div>
<p>লক্ষ্য করুন — request যাওয়ার সময় pipeline যে ক্রমে চলে, response ফেরার সময় ঠিক তার <b>উল্টো ক্রমে</b> ফিরে আসে। প্রতিটা middleware তার "before" অংশ চালায়, <code>next()</code>-কে ভেতরের middleware-এ pass করে, আর <code>next()</code> রিটার্ন করার পর তার "after" অংশ চালায়। এই জন্যই <b>order matters</b> — কোন middleware আগে বসবে সেটা কেবল style-এর প্রশ্ন না, এটা functional correctness-এর প্রশ্ন (নিচে mistake callout-এ বিস্তারিত)।</p>
<pre><span class="c">// একটা custom middleware — timing log রাখছে</span>
app.Use(async (context, next) =&gt;
{
    var sw = Stopwatch.StartNew();
    await next();                         <span class="c">// পরের middleware/endpoint কল হচ্ছে এখানে</span>
    Console.WriteLine($"{context.Request.Path} → {sw.ElapsedMilliseconds}ms");
});</pre>

<h3>Common Built-in Middleware</h3>
<p>ASP.NET Core টিম কিছু সাধারণ, বহুল-ব্যবহৃত middleware রেডিমেড extension method হিসেবে দিয়ে রাখে, যাতে বার বার একই কোড লিখতে না হয়।</p>
<table>
<tr><th>Middleware</th><th>কাজ</th></tr>
<tr><td><code>UseExceptionHandler</code></td><td>Pipeline-এর যেকোনো জায়গায় uncaught exception ধরে একটা সুশৃঙ্খল error response (JSON/page) রিটার্ন করে</td></tr>
<tr><td><code>UseHttpsRedirection</code></td><td>HTTP request-কে স্বয়ংক্রিয়ভাবে HTTPS-এ redirect করে</td></tr>
<tr><td><code>UseRouting</code></td><td>URL match করে বুঝে নেয় কোন endpoint/controller action এই request-টা হ্যান্ডল করবে</td></tr>
<tr><td><code>UseAuthentication</code></td><td>Request-এর সাথে আসা credential/token যাচাই করে <code>User</code> (ClaimsPrincipal) সেট করে — "তুমি কে" প্রশ্নের উত্তর</td></tr>
<tr><td><code>UseAuthorization</code></td><td>যাচাই করা identity-র উপর ভিত্তি করে <code>[Authorize]</code> নিয়ম প্রয়োগ করে — "তুমি এটা করতে পারবে কিনা" প্রশ্নের উত্তর</td></tr>
<tr><td><code>UseStaticFiles</code></td><td><code>wwwroot</code> ফোল্ডার থেকে সরাসরি CSS/JS/image-এর মতো static file serve করে</td></tr>
</table>

<h3>Routing — Minimal APIs বনাম Controllers</h3>
<p>একই endpoint দুইভাবে লেখা যায় — .NET 6+ থেকে আসা সংক্ষিপ্ত <b>Minimal APIs</b> স্টাইলে, অথবা চিরাচরিত <b>Controller-based</b> স্টাইলে।</p>
<pre><span class="c">// Minimal API — কম বয়লারপ্লেট, ছোট সার্ভিসের জন্য দারুণ</span>
app.MapGet("/orders/{id}", async (int id, IOrderService svc) =&gt;
{
    var order = await svc.GetByIdAsync(id);
    return order is not null ? Results.Ok(order) : Results.NotFound();
});</pre>
<pre><span class="c">// Controller-based — বড়, convention-heavy API-র জন্য</span>
[ApiController]
[Route("orders")]
public class OrdersController : ControllerBase
{
    private readonly IOrderService _svc;
    public OrdersController(IOrderService svc) =&gt; _svc = svc;   <span class="c">// constructor injection</span>

    [HttpGet("{id}")]
    public async Task&lt;IActionResult&gt; GetById(int id)
    {
        var order = await _svc.GetByIdAsync(id);
        return order is not null ? Ok(order) : NotFound();
    }
}</pre>
<p>দুটোই ফাংশনালিটির দিক থেকে সমতুল্য। <b>Minimal APIs</b> ছোট মাইক্রোসার্ভিস বা কয়েকটা endpoint-ওয়ালা সার্ভিসের জন্য বেশি সংক্ষিপ্ত ও পড়তে সহজ। কিন্তু <b>Controllers</b> স্কেল করে ভালো যখন অনেক endpoint, ভাগাভাগি করা filter, convention-based model binding, বা বড় দলের মধ্যে একটা কনসিস্টেন্ট structure দরকার হয় — কারণ Controller ক্লাসে attribute-driven cross-cutting concern (filter, versioning ইত্যাদি) সহজেই এক জায়গায় জড়ো করা যায়।</p>

<h3>Model Binding ও Validation</h3>
<p>একটা incoming JSON request body ASP.NET Core নিজে থেকেই একটা C# parameter বা DTO ক্লাসে <b>bind</b> করে দেয় — একে <b>model binding</b> বলে। Reflection চ্যাপ্টারে দেখা attribute-driven approach-এর মতোই, এখানে validation rule <code>[Required]</code>, <code>[MaxLength]</code>-এর মতো data annotation attribute দিয়ে ঘোষণা করা হয়, আর framework রানটাইমে reflection ব্যবহার করেই সেই attribute-গুলো পড়ে property-ভিত্তিক validation চালায়।</p>
<pre>public class CreateOrderDto
{
    [Required]
    public string CustomerName { get; set; } = "";

    [MaxLength(200)]
    public string? Note { get; set; }

    [Range(1, 100)]
    public int Quantity { get; set; }
}</pre>
<pre><span class="c">// Controller-এ — ModelState.IsValid ম্যানুয়ালি চেক করা</span>
[HttpPost]
public IActionResult Create(CreateOrderDto dto)
{
    if (!ModelState.IsValid)          <span class="c">// data annotation ফেইল করলে false</span>
        return BadRequest(ModelState);
    <span class="c">// ... বিজনেস লজিক ...</span>
    return Ok();
}</pre>
<p>[ApiController] attribute থাকলে Controller-এ validation ফেইল করলেই স্বয়ংক্রিয়ভাবে একটা <code>400 Bad Request</code> রিটার্ন হয় — <code>ModelState.IsValid</code> ম্যানুয়ালি চেক না করলেও চলে। Minimal APIs-এ একই আচরণ পেতে <code>[AsParameters]</code> দিয়ে গ্রুপড parameter বাইন্ড করা যায়, অথবা validation filter/endpoint filter যোগ করে একই স্বয়ংক্রিয় 400 response তৈরি করা যায়।</p>

<h3>Common mistake — Middleware-এর ভুল ক্রম</h3>
<div class="callout mistake"><span class="tag">Common mistake — Authorization, Routing-এর আগে বসানো</span>
<pre><span class="c">// ভুল — Authorization Routing-এর আগে</span>
app.UseAuthorization();
app.UseRouting();
app.MapControllers();</pre>
এখানে <code>UseAuthorization()</code> চলার সময় routing এখনো কোনো endpoint match করেনি — তাই authorization middleware জানেই না কোন endpoint-এর জন্য কোন <code>[Authorize]</code> policy প্রযোজ্য। ফলাফল: হয় authorization চেক পুরোপুরি স্কিপ হয়ে যায়, অথবা রানটাইমে exception ছোঁড়ে। একই সমস্যা হয় <code>UseCors()</code>-কে ভুল জায়গায় বসালে — Routing-এর পরে ও Authorization/endpoint execution-এর আগে না বসালে response-এ CORS header একদম যোগ হয় না, আর ব্রাউজার console-এ cryptic "CORS policy" এরর দেখা যায় যদিও সার্ভার-সাইড কোড সঠিক মনে হয়।
<pre><span class="c">// সঠিক — Routing → CORS → Authentication → Authorization → Endpoint</span>
app.UseRouting();
app.UseCors();
app.UseAuthentication();
app.UseAuthorization();
app.MapControllers();</pre>
</div>

<h3>Best practice — Endpoint/Controller পাতলা রাখা</h3>
<div class="callout best"><span class="tag">Best practice — Business logic থাকবে injected service-এ</span>
Dependency Injection চ্যাপ্টারে দেখা constructor injection প্যাটার্নটাই এখানে কাজে লাগে — Controller action বা Minimal API handler-এ database query, external API কল, বা জটিল business rule সরাসরি লেখা উচিত না। এর বদলে সেই লজিক একটা injected সার্ভিসে (যেমন <code>IOrderService</code>) রাখুন, আর endpoint/action শুধু request নেওয়া, সার্ভিস কল করা, ও response ম্যাপ করার কাজ করুক।
<pre><span class="c">// পাতলা endpoint — শুধু orchestration, কোনো business rule নেই</span>
app.MapPost("/orders", async (CreateOrderDto dto, IOrderService svc) =&gt;
{
    var result = await svc.CreateAsync(dto);   <span class="c">// আসল লজিক সার্ভিসে</span>
    return Results.Created($"/orders/{result.Id}", result);
});</pre>
এতে দুইটা সরাসরি লাভ হয় — এক, সার্ভিস ক্লাসটা ASP.NET Core pipeline ছাড়াই unit test করা যায় (Testing চ্যাপ্টারে বিস্তারিত); দুই, একই বিজনেস লজিক Minimal API ও Controller — দুই জায়গা থেকেই, এমনকি background job বা CLI থেকেও পুনর্ব্যবহার করা যায়।
</div>
