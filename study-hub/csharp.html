<h2 class="title">১. .NET Foundation — CLR, JIT ও Compilation</h2>
<p class="lead">C# শেখার আগে বোঝা দরকার .NET আসলে কী জিনিস — কারণ C# ভাষাটা একা কিছুই না, পুরো শক্তি আসে <span class="kw">CLR</span> (Common Language Runtime) আর তার চারপাশের বিশাল ecosystem থেকে। এই অধ্যায়ে আমরা দেখব আপনার লেখা <code>.cs</code> ফাইল কীভাবে ধাপে ধাপে CPU-তে চলা native instruction-এ পরিণত হয়, আর কেন .NET এই পথটা বেছে নিয়েছে।</p>

<h3>.NET কী</h3>
<p>.NET মূলত তিনটা জিনিসের সমষ্টি — একটা <span class="kw">runtime</span> (CLR, যেটা আপনার program চালায়), একটা বিশাল <span class="kw">standard library</span> (BCL — Base Class Library, যেখানে <code>List&lt;T&gt;</code>, <code>string</code>, <code>File</code>, <code>HttpClient</code>-এর মতো হাজারো ready-made টাইপ আছে), আর একাধিক ভাষা (C#, F#, VB.NET) যেগুলো সবাই একই intermediate representation-এ কম্পাইল হয়। মানে আপনি C#-এ লিখলেন, কেউ F#-এ লিখল — দুটোই শেষমেশ একই ধরনের IL কোডে পরিণত হয় এবং একে অপরকে সরাসরি কল করতে পারে।</p>
<p>ইতিহাসটা একটু জটিল, কারণ ".NET" নামটা সময়ের সাথে অর্থ বদলেছে। শুরুতে ছিল <b>.NET Framework</b> — শুধু Windows-এ চলত, আজ কার্যত legacy (নতুন প্রজেক্টে ব্যবহার করা হয় না)। এরপর Microsoft <b>.NET Core</b> আনল — সম্পূর্ণ নতুন করে লেখা, cross-platform (Windows/Linux/macOS), open-source। .NET Core 3.1-এর পর Microsoft নাম থেকে "Core" শব্দটা ফেলে দিয়ে শুধু <b>.NET 5, 6, 7, 8...</b> বলা শুরু করল — এটাই আজকের "modern .NET", প্রতি বছর একটা নতুন ভার্সন আসে (জোড় সংখ্যা যেমন 6, 8, 10 হলো <span class="kw">LTS</span> — Long Term Support)। আর <b>.NET Standard</b> সম্পূর্ণ ভিন্ন জিনিস — এটা কোনো runtime না, এটা একটা <i>API compatibility contract</i>: একটা library .NET Standard 2.0 টার্গেট করে লিখলে সেটা .NET Framework, .NET Core, Xamarin — সব জায়গায় ব্যবহারযোগ্য হয়। আধুনিক .NET-এ (.NET 5+) library-ও এখন সরাসরি <code>net8.0</code> টার্গেট করে, তাই .NET Standard-এর প্রয়োজন কমে এসেছে।</p>
<table>
<tr><th>নাম</th><th>এটা আসলে কী</th><th>Platform</th><th>আজকের অবস্থা</th></tr>
<tr><td>.NET Framework</td><td>Runtime + library (আসল, ২০০২ সাল থেকে)</td><td>শুধু Windows</td><td>Legacy — শুধু পুরনো app maintain</td></tr>
<tr><td>.NET Core</td><td>Runtime + library (পুনর্লিখিত)</td><td>Windows/Linux/macOS</td><td>নাম বদলে ".NET" (5+) হয়ে গেছে</td></tr>
<tr><td>.NET (5/6/7/8/9...)</td><td>Runtime + library — modern, unified</td><td>Windows/Linux/macOS/ARM</td><td><b>বর্তমান স্ট্যান্ডার্ড</b>, active development</td></tr>
<tr><td>.NET Standard</td><td>শুধু একটা API contract (runtime না!)</td><td>N/A</td><td>মূলত অপ্রয়োজনীয় হয়ে গেছে .NET 5+ পরে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — নাম নিয়ে বিভ্রান্তি</span>
নতুনরা প্রায়ই ভাবে ".NET Standard" মানে বুঝি নতুন কোনো runtime version। আসলে এটা কোনো runtime না — এটা শুধু একটা চুক্তি বলে "এই API গুলো ব্যবহার করলে তোমার library অনেক জায়গায় চলবে"। আজ নতুন প্রজেক্ট শুরু করলে সরাসরি সর্বশেষ <code>net8.0</code>/<code>net9.0</code> টার্গেট করাই best practice, .NET Standard নয়।</div>

<h3>Compilation Pipeline — সোর্স কোড থেকে CPU পর্যন্ত</h3>
<p>আপনি যখন <code>dotnet build</code> চালান, প্রথমে <span class="kw">Roslyn</span> (Microsoft-এর C# compiler, নিজেও C#-এ লেখা) আপনার <code>.cs</code> ফাইলগুলো পড়ে এবং সরাসরি native machine code তৈরি করে না — বরং একটা intermediate ভাষায় কম্পাইল করে, যাকে বলে <span class="kw">IL</span> (Intermediate Language, পুরো নাম CIL — Common Intermediate Language)। এই IL আর কিছু <span class="kw">metadata</span> মিলে একটা <b>assembly</b> তৈরি হয় — অর্থাৎ একটা <code>.dll</code> বা <code>.exe</code> ফাইল।</p>
<p>এই assembly কোনো নির্দিষ্ট CPU-এর জন্য না, এটা একটা abstract, portable প্রতিনিধিত্ব। আসল জাদু ঘটে যখন আপনি প্রোগ্রামটা চালান (<code>dotnet run</code> বা সরাসরি executable): CLR চালু হয়, IL লোড করে, আর প্রতিটা method প্রথমবার কল হওয়ার ঠিক আগ মুহূর্তে <span class="kw">JIT</span> (Just-In-Time compiler) সেই IL-টুকু আপনার বর্তমান CPU-এর জন্য native machine code-এ কম্পাইল করে দেয়। এরপর সেই native code cache হয়ে থাকে, তাই একই method বারবার কল হলে আবার JIT করতে হয় না।</p>
<div class="diagram"><pre>
  C# Source (.cs)
        │
        ▼
  ┌─────────────┐
  │   Roslyn    │   ← C# compiler (csc / dotnet build)
  │  Compiler   │
  └─────────────┘
        │  compiles to IL + metadata
        ▼
  Assembly (.dll / .exe)
   [ IL code | metadata | manifest ]
        │
        │   dotnet run / process start
        ▼
  ┌─────────────┐
  │     CLR     │   ← loads assembly, manages memory (GC),
  │  (runtime)  │     type-safety, exceptions
  └─────────────┘
        │  method called for the first time
        ▼
  ┌─────────────┐
  │     JIT     │   ← compiles THIS method's IL
  │  Compiler   │     → native machine code (per method)
  └─────────────┘
        │
        ▼
  Native Machine Code  →  CPU (x64 / ARM64 / ...)
</pre></div>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — method-by-method JIT</span>
JIT পুরো assembly একবারে কম্পাইল করে না। প্রতিটা method প্রথমবার call হওয়ার মুহূর্তে কম্পাইল হয়, তারপর native code cache-এ রয়ে যায়। এই কারণে .NET app-এর প্রথম রিকোয়েস্ট (cold start) একটু ধীর মনে হতে পারে — যেসব method তখনও call হয়নি সেগুলো এখনও IL-ই আছে। আধুনিক CLR-এ <span class="kw">Tiered Compilation</span> আছে: প্রথমে দ্রুত কিন্তু কম-optimized কোড জেনারেট করে (Tier 0), তারপর method বারবার call হলে ব্যাকগ্রাউন্ডে আরও optimized version (Tier 1) বানিয়ে বদলে দেয়।
</div>

<h3>কেন সরাসরি Native Code নয় — IL-এর দরকার কী</h3>
<p>এখানে স্বাভাবিক প্রশ্ন আসে: সরাসরি native machine code-এ কম্পাইল করলেই তো JIT-এর ঝামেলা লাগে না, তাহলে .NET কেন মাঝখানে IL রাখে?</p>
<p><b>১. Portability:</b> একই <code>MyApp.dll</code> ফাইল Windows x64, Linux x64, macOS ARM64 — সব জায়গায় হুবহু একই থাকে। প্ল্যাটফর্মভেদে পার্থক্য তৈরি হয় শুধু JIT-এর স্তরে, কারণ JIT জানে ঠিক কোন CPU-তে চলছে। আপনাকে আলাদা করে প্রতিটা platform-এর জন্য আলাদা build রাখতে হয় না (মূল library-এর জন্য)।</p>
<p><b>২. Language Interop:</b> C#, F#, VB.NET — সবাই একই <span class="kw">CTS</span> (Common Type System) মেনে চলে এবং একই ধরনের IL জেনারেট করে। ফলে আপনার C# প্রজেক্ট থেকে সরাসরি একটা F# library reference করে তার class/method কল করা যায় — কম্পাইলারের চোখে দুটোই একই ধরনের assembly। এটা সম্ভব হতো না যদি প্রতিটা ভাষা নিজের মতো করে সরাসরি native code বানাত।</p>
<p><b>৩. Runtime Optimization:</b> যেহেতু কম্পাইলেশন ঘটে actual চলার সময়, JIT জানে ঠিক কোন CPU feature (যেমন AVX2, SIMD) উপলব্ধ, এবং Tiered Compilation-এর মাধ্যমে কোন method বেশি ব্যবহার হচ্ছে তা দেখে আরও আক্রমণাত্মক optimization করতে পারে — এমন কিছু যা একটা ahead-of-time (AOT) native compiler চালানোর সময়ের তথ্য না জেনে করতে পারে না।</p>
<div class="callout why"><span class="tag">কেন এই তিন-স্তরের ডিজাইন</span>
IL হলো একটা "মধ্যস্থতাকারী চুক্তি" — ভাষা এবং হার্ডওয়্যারের মাঝে একটা abstraction layer। এর ফলে .NET একসাথে দুটো লক্ষ্য অর্জন করে: (ক) যেকোনো ভাষা যা এই চুক্তি মানে সে পুরো ecosystem-এ অংশ নিতে পারে, (খ) যেকোনো হার্ডওয়্যার যেখানে CLR পোর্ট করা আছে সেখানেই কোড চলে — বাড়তি রিকম্পাইল ছাড়াই।</div>

<h3>Managed বনাম Unmanaged Code</h3>
<p>.NET-কে বলা হয় একটা <span class="kw">managed</span> runtime, কারণ CLR আপনার প্রোগ্রামের জন্য অনেক কিছু নিজে থেকে সামলায়:</p>
<ul>
<li><b>Memory management:</b> আপনি <code>new</code> দিয়ে object বানান, কিন্তু কখন সেটা মুছে ফেলা হবে তা ঠিক করে <span class="kw">Garbage Collector</span> (GC) — আপনাকে ম্যানুয়ালি <code>free</code>/<code>delete</code> করতে হয় না।</li>
<li><b>Type safety:</b> CLR নিশ্চিত করে যে আপনি একটা <code>int</code>-কে জোর করে <code>string</code> হিসেবে পড়তে পারবেন না — memory-এর raw bytes মনগড়া interpret করা আটকানো হয়।</li>
<li><b>Array bounds checking:</b> <code>array[10]</code>-এর সাইজ ৫ হলে runtime সাথে সাথে <code>IndexOutOfRangeException</code> ছোঁড়ে — এলোমেলো memory-তে পড়তে দেয় না।</li>
<li><b>Uniform exception handling:</b> কোনো সমস্যা হলে (null reference, division by zero) একটা নির্দিষ্ট কাঠামোতে exception ছোঁড়া হয়, যা try/catch দিয়ে ধরা যায় — প্রোগ্রাম হুট করে crash করে মেমোরি নষ্ট করে না।</li>
</ul>
<p>এর বিপরীতে C/C++-এর মতো <span class="kw">unmanaged</span> কোডে এসবের কিছুই বিল্ট-ইন নেই — আপনি নিজে <code>malloc</code>/<code>free</code> করেন, নিজে pointer arithmetic সামলান। ভুল করলে <b>buffer overflow</b>, <b>use-after-free</b>, বা <b>memory leak</b>-এর মতো bug হয় যা ধরা কঠিন এবং নিরাপত্তা ঝুঁকিও তৈরি করে।</p>
<div class="callout best"><span class="tag">Best practice — এই trade-off কেন মূল্যবান</span>
Managed runtime-এর একটা খরচ আছে — GC মাঝে মাঝে pause করে, bounds checking সামান্য CPU cycle খরচ করে। কিন্তু বাস্তবে এই সামান্য overhead-এর বিনিময়ে পাওয়া নিরাপত্তা ও productivity প্রায় সব ধরনের business application-এর জন্য অনেক বেশি লাভজনক — বেশিরভাগ security vulnerability (buffer overflow ইত্যাদি) এখানে গোড়াতেই বন্ধ হয়ে যায়। যেখানে প্রতি মাইক্রোসেকেন্ড গুরুত্বপূর্ণ (game engine, OS kernel), সেখানেই শুধু unmanaged code-এর justification থাকে।</div>

<h3>Assembly Anatomy — .dll/.exe-এর ভেতরে কী আছে</h3>
<p>একটা compiled assembly শুধু IL কোড না — এতে তিনটা প্রধান জিনিস একসাথে থাকে:</p>
<table>
<tr><th>অংশ</th><th>কী থাকে</th></tr>
<tr><td><span class="kw">IL Code</span></td><td>প্রতিটা method-এর আসল instruction (CIL bytecode)</td></tr>
<tr><td><span class="kw">Metadata</span></td><td>সব type, method, property, field-এর সম্পূর্ণ বর্ণনা — signature, নাম, visibility (public/private) ইত্যাদি</td></tr>
<tr><td><span class="kw">Manifest</span></td><td>Assembly-র নিজের পরিচয় — নাম, version, culture, কোন কোন external assembly-র উপর নির্ভরশীল (references)</td></tr>
</table>
<p>এই metadata সবসময় assembly-র সাথেই বাঁধা থাকে বলে একটা .NET assembly নিজেকে সম্পূর্ণভাবে "বর্ণনা" করতে পারে — কোনো আলাদা header ফাইল বা IDL দরকার হয় না (C/C++-এর মতো)। এই কারণেই .NET-এ <span class="kw">Reflection</span> এত শক্তিশালী: runtime-এ যেকোনো assembly লোড করে তার ভেতরের সব type, method সম্পর্কে জিজ্ঞেস করা যায় — কারণ সেই তথ্য সবসময়ই সেখানে বিদ্যমান। Reflection নিয়ে বিস্তারিত পরের একটা অধ্যায়ে আলোচনা হবে।</p>

<h3>.NET SDK বনাম .NET Runtime</h3>
<p>ইনস্টল করার সময় দুটো ভিন্ন জিনিস দেখবেন — এই দুটো গুলিয়ে ফেলা খুব সাধারণ একটা ভুল।</p>
<table>
<tr><th></th><th>.NET SDK</th><th>.NET Runtime</th></tr>
<tr><td>কী আছে</td><td>Compiler (Roslyn) + <code>dotnet</code> CLI tools + MSBuild + Runtime</td><td>শুধু CLR + BCL — চালানোর জন্য যা লাগে</td></tr>
<tr><td>কে ব্যবহার করে</td><td>Developer, CI build machine</td><td>Production server, deployment container</td></tr>
<tr><td>সাইজ</td><td>বড় (~200-300MB+)</td><td>ছোট (~100MB বা তার কম)</td></tr>
<tr><td>দিয়ে কী করা যায়</td><td>build, run, publish, test, package তৈরি</td><td>শুধু আগে থেকে build হওয়া app চালানো</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — production image-এ SDK না</span>
Development বা CI machine-এ SDK লাগবেই (কম্পাইল করতে হয়)। কিন্তু production container image-এ SDK রাখলে অকারণে image বড় হয়, বাড়তি security surface তৈরি হয় (compiler, build tool যা কখনো চালানোর দরকারই নেই), আর deploy ধীর হয়। তাই সঠিক পদ্ধতি হলো <b>multi-stage build</b>: SDK image দিয়ে <code>dotnet publish</code> করে একটা self-contained output বানানো, তারপর সেই output ছোট <code>aspnet</code> (runtime-only) image-এ কপি করা — যা কন্টেইনার/Docker অধ্যায়ে গভীরভাবে দেখা যাবে।</div>

<h3>dotnet CLI — মৌলিক কমান্ডগুলো</h3>
<p>উপরে যে compilation pipeline দেখানো হলো, তার প্রতিটা ধাপ আসলে <code>dotnet</code> CLI-এর একেকটা কমান্ডের পেছনে ঘটে:</p>
<table>
<tr><th>কমান্ড</th><th>আসলে কী করে</th></tr>
<tr><td><code>dotnet new</code></td><td>একটা template (console, webapi, classlib...) থেকে নতুন প্রজেক্ট স্ক্যাফোল্ড তৈরি করে — <code>.csproj</code> ফাইলসহ</td></tr>
<tr><td><code>dotnet build</code></td><td>Roslyn দিয়ে সোর্স কম্পাইল করে IL + assembly (<code>.dll</code>) তৈরি করে, কিন্তু চালায় না</td></tr>
<tr><td><code>dotnet run</code></td><td>প্রয়োজনে build করে, তারপর CLR চালু করে assembly লোড করে এক্সিকিউট করে (JIT শুরু হয়)</td></tr>
<tr><td><code>dotnet test</code></td><td>টেস্ট প্রজেক্ট build করে test runner দিয়ে সব unit test চালায়</td></tr>
<tr><td><code>dotnet publish</code></td><td><code>build</code>-এর চেয়ে আলাদা — একটা সম্পূর্ণ deployable output তৈরি করে: সব dependency, runtime config, প্রয়োজনে self-contained runtime সহ, যা সরাসরি সার্ভারে বা container-এ কপি করে চালানো যায়</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — build আর publish গুলিয়ে ফেলা</span>
<code>dotnet build</code> শুধু quick compile check বা লোকাল টেস্টিং-এর জন্য — এর output ডিপ্লয়মেন্টের জন্য উপযুক্ত না (dependency resolve, trimming, self-contained bundling হয় না)। Deploy করার সময় সবসময় <code>dotnet publish -c Release</code> ব্যবহার করা উচিত, যা optimize করা, deployment-ready output দেয়।</div>

<h3>সামনে যা আসছে — JIT-ই একমাত্র পথ নয়</h3>
<p>এতক্ষণ যা দেখানো হলো তা .NET-এর ডিফল্ট, সবচেয়ে সাধারণ পথ — IL + JIT। কিন্তু কিছু ক্ষেত্রে JIT-এর "প্রথমবার কল হওয়ার সময় কম্পাইল" মডেলটাই সমস্যা, বিশেষ করে সার্ভারলেস ফাংশন বা কন্টেইনারে যেখানে startup time খুব গুরুত্বপূর্ণ। এজন্য .NET-এ এখন <span class="kw">Native AOT</span> (Ahead-Of-Time compilation) আছে — এখানে পুরো অ্যাপটাই build-time-এ সরাসরি native machine code-এ কম্পাইল হয়ে যায়, কোনো JIT বা এমনকি পুরো CLR-ও রানটাইমে দরকার হয় না, ফলে স্টার্টআপ প্রায় তাৎক্ষণিক। মাঝামাঝি একটা বিকল্পও আছে — <span class="kw">ReadyToRun</span> (R2R), যেখানে IL-এর পাশাপাশি আগে থেকে কম্পাইল করা native code-ও assembly-তে বান্ডিল থাকে, যাতে প্রথমবার JIT করার প্রয়োজনই কমে যায়, অথচ পুরোপুরি AOT-এর মতো restrictive না।</p>
<div class="callout why"><span class="tag">কেন এখনই বিস্তারিত নয়</span>
Native AOT আর ReadyToRun-এর trade-off (রিফ্লেকশন সীমাবদ্ধতা, ছোট কন্টেইনার ইমেজ, দ্রুত cold start) বোঝার জন্য আগে memory management আর reflection সম্পর্কে ভালো ধারণা দরকার — তাই এই বিষয়গুলো Performance অধ্যায়ে গভীরভাবে আলোচনা করা হবে। এখন শুধু এতটুকু মনে রাখুন: JIT হলো ডিফল্ট এবং সবচেয়ে flexible পথ, কিন্তু একমাত্র পথ নয়।</div>
</template>

<h2 class="title">২. C# Syntax Basics</h2>
<p class="lead">আগের চ্যাপ্টারে আমরা দেখেছি C# কীভাবে কম্পাইল ও রান হয় — এবার আসল কোড লেখা শুরু করি। এই চ্যাপ্টারে variable, operator, control flow, loop, method আর string handling — এই বেসিক building block গুলো কভার করব, যেগুলো ছাড়া কোনো C# প্রোগ্রামই লেখা সম্ভব না।</p>

<h3>Variables ও Types</h3>
<p>C# একটি <span class="kw">statically typed</span> language — মানে প্রতিটা variable-এর type কম্পাইল টাইমে ফিক্সড থাকে, রানটাইমে পাল্টায় না। একটা variable declare করার দুইটা মূল উপায়:</p>
<pre>int age = 25;              <span class="c">// explicit type</span>
var name = "Rasel";         <span class="c">// implicit type — compiler নিজে বুঝে নেয়</span></pre>
<p><code>var</code> নিয়ে অনেক নতুন ডেভেলপারের একটা কমন ভুল ধারণা থাকে — তারা ভাবে <code>var</code> মানে JavaScript-এর মতো dynamic typing, অর্থাৎ একই variable-এ পরে অন্য type-এর value বসানো যাবে। এটা সম্পূর্ণ ভুল। <code>var</code> শুধু compiler-কে বলে দেয় "তুমি assign করা value দেখে টাইপটা বের করে নাও" — কিন্তু একবার টাইপ বের হয়ে গেলে সেটা চিরদিনের জন্য সেই টাইপেই আটকে থাকে।</p>
<pre>var count = 10;        <span class="c">// compiler বুঝে নিল: int</span>
count = "hello";       <span class="c">// Compile Error! int-এ string বসানো যাবে না</span></pre>
<div class="callout why"><span class="tag">কেন var ব্যবহার হয়</span> <code>var</code> মূলত কোড ছোট ও readable রাখার জন্য — বিশেষ করে যখন টাইপ নাম অনেক লম্বা হয় (যেমন <code>Dictionary&lt;string, List&lt;int&gt;&gt;</code>) অথবা LINQ query থেকে anonymous type রিটার্ন হয়। এটা type safety-তে কোনো ছাড় দেয় না — সব চেক কম্পাইল টাইমেই হয়।</div>

<p>নিচে C#-এর সবচেয়ে বেশি ব্যবহৃত primitive types এর একটা সারাংশ দেওয়া হলো:</p>
<table>
<tr><th>Type</th><th>Size</th><th>ব্যবহার</th></tr>
<tr><td><code>int</code></td><td>4 bytes</td><td>সাধারণ integer গণনা, loop counter, index</td></tr>
<tr><td><code>long</code></td><td>8 bytes</td><td>বড় সংখ্যা, যেমন file size বা timestamp</td></tr>
<tr><td><code>double</code></td><td>8 bytes</td><td>বৈজ্ঞানিক/floating-point হিসাব, approximate precision যথেষ্ট এমন ক্ষেত্রে</td></tr>
<tr><td><code>decimal</code></td><td>16 bytes</td><td>টাকা-পয়সা, financial হিসাব — exact precision দরকার</td></tr>
<tr><td><code>bool</code></td><td>1 byte</td><td>true/false শর্ত</td></tr>
<tr><td><code>char</code></td><td>2 bytes</td><td>একটা মাত্র Unicode character</td></tr>
<tr><td><code>string</code></td><td>reference type</td><td>টেক্সট — অক্ষরের sequence</td></tr>
<tr><td><code>object</code></td><td>reference type</td><td>যেকোনো টাইপের সাধারণ base — সব টাইপ এখান থেকেই derive করে</td></tr>
</table>

<div class="callout mistake"><span class="tag">Common mistake — decimal vs double</span> এটা একটা ক্লাসিক ইন্টারভিউ প্রশ্ন। <code>double</code> হলো binary floating-point — এটা কিছু দশমিক সংখ্যা (যেমন 0.1) হুবহু represent করতে পারে না, ফলে টাকার হিসাবে ছোট ছোট rounding error আসতে পারে। <code>decimal</code> হলো base-10 (দশমিক ভিত্তিক) সিস্টেম, তাই financial ক্যালকুলেশনে exact precision দেয়। নিয়ম সহজ — <b>টাকা মানে decimal, বিজ্ঞান/গ্রাফিক্স মানে double</b>।</div>

<h3>Operators</h3>
<p>Arithmetic operator গুলো (<code>+ - * / %</code>) মোটামুটি সব ভাষার মতোই। Comparison operator (<code>== != &lt; &gt; &lt;= &gt;=</code>) একটা bool রিটার্ন করে। Logical operator নিয়ে একটু গুরুত্বপূর্ণ পার্থক্য আছে:</p>
<pre>bool result1 = (a &gt; 0) &amp;&amp; (b &gt; 0);   <span class="c">// short-circuit AND</span>
bool result2 = (a &gt; 0) &amp; (b &gt; 0);    <span class="c">// non-short-circuit AND</span></pre>
<p><code>&amp;&amp;</code> এবং <code>||</code> হলো <span class="kw">short-circuit</span> operator — যদি প্রথম condition দিয়েই ফলাফল নিশ্চিত হয়ে যায়, তাহলে দ্বিতীয় condition আর evaluate হয় না। আর <code>&amp;</code>/<code>|</code> সবসময় দুইপাশই evaluate করে (bitwise operator হিসেবেও এদের ব্যবহার হয়)। এই পার্থক্যটা গুরুত্বপূর্ণ হয়ে যায় যখন দ্বিতীয় condition-এর মধ্যে side-effect বা null-reference ঝুঁকি থাকে:</p>
<pre>if (obj != null &amp;&amp; obj.IsValid)   <span class="c">// নিরাপদ — obj null হলে ডানপাশ চেক-ই হবে না</span></pre>

<p>Null নিয়ে কাজ করা C#-এ এত কমন যে আলাদা কিছু operator-ই তৈরি হয়েছে শুধু এই কাজের জন্য:</p>
<table>
<tr><th>Operator</th><th>নাম</th><th>কাজ</th></tr>
<tr><td><code>??</code></td><td>Null-coalescing</td><td>বাম পাশ null হলে ডান পাশের value ব্যবহার করে</td></tr>
<tr><td><code>??=</code></td><td>Null-coalescing assignment</td><td>variable null হলে তবেই assign করে</td></tr>
<tr><td><code>?.</code></td><td>Null-conditional</td><td>object null হলে পুরো chain skip করে null রিটার্ন করে</td></tr>
<tr><td><code>?[]</code></td><td>Null-conditional index</td><td>collection null হলে indexing skip করে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এই operator গুলো এলো</span> আগে null চেক করতে অনেক verbose কোড লিখতে হতো। নিচের দুইটা উদাহরণ দেখুন — একই কাজ, কিন্তু কতটা কোড কমে গেল:</div>
<pre><span class="c">// আগে — verbose null check</span>
string city;
if (user != null &amp;&amp; user.Address != null)
    city = user.Address.City;
else
    city = "Unknown";

<span class="c">// এখন — null-conditional + null-coalescing</span>
string city = user?.Address?.City ?? "Unknown";</pre>

<h3>Control Flow — if/else ও switch</h3>
<p><code>if</code>/<code>else</code> চেনা জানা structure — কিন্তু <code>switch</code> নিয়ে C# 8.0-এর পর একটা বড় পরিবর্তন এসেছে। ক্লাসিক <code>switch</code> statement এর পাশাপাশি এখন আছে আরও compact <span class="kw">switch expression</span>।</p>
<pre><span class="c">// পুরনো ধাঁচ — switch statement</span>
string GetDayTypeOld(int day)
{
    switch (day)
    {
        case 6:
        case 7:
            return "Weekend";
        default:
            return "Weekday";
    }
}

<span class="c">// আধুনিক ধাঁচ — switch expression (C# 8+)</span>
string GetDayTypeNew(int day) => day switch
{
    6 or 7 => "Weekend",
    _      => "Weekday"
};</pre>
<table>
<tr><th>দিক</th><th>switch statement</th><th>switch expression</th></tr>
<tr><td>Syntax</td><td>বেশি verbose, প্রতি case-এ <code>break</code>/<code>return</code></td><td>সংক্ষিপ্ত, <code>=&gt;</code> দিয়ে একলাইনে value</td></tr>
<tr><td>Return</td><td>statement — নিজে থেকে value দেয় না</td><td>expression — সরাসরি একটা value produce করে</td></tr>
<tr><td>Fall-through</td><td>সম্ভব (ভুলে গেলে bug হতে পারে)</td><td>সম্ভব না — প্রতিটা arm exclusive</td></tr>
<tr><td>Default case</td><td><code>default:</code></td><td><code>_</code> (discard pattern)</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span> যেখানেই সম্ভব switch expression প্রেফার করুন — এটা কম কোডে একই কাজ করে এবং কম্পাইলার নিশ্চিত করে সব case কভার হয়েছে কিনা (exhaustiveness), যা bug কমায়।</div>

<h3>Loops</h3>
<p>C#-এ চারটা মূল loop কনস্ট্রাক্ট আছে:</p>
<pre><span class="c">// for — যখন iteration সংখ্যা জানা থাকে</span>
for (int i = 0; i &lt; 5; i++)
    Console.WriteLine(i);

<span class="c">// foreach — collection-এর প্রতিটা item-এর উপর iterate করতে</span>
foreach (var item in items)
    Console.WriteLine(item);

<span class="c">// while — condition true থাকা পর্যন্ত চলবে</span>
while (hasMoreData)
    ProcessNext();

<span class="c">// do-while — বডি অন্তত একবার রান হবেই</span>
do
{
    Retry();
} while (!success);</pre>
<p><code>break</code> লুপ থেকে সম্পূর্ণ বেরিয়ে যায়, আর <code>continue</code> শুধু বর্তমান iteration স্কিপ করে পরেরটায় চলে যায়।</p>
<div class="callout behind"><span class="tag">Behind the scenes — foreach আসলে কী করে</span> <code>foreach</code> শুধু syntactic sugar। কম্পাইলার এটাকে ভেঙে <code>IEnumerator</code> ইন্টারফেসের <code>MoveNext()</code> আর <code>Current</code> ব্যবহার করে একটা try/finally ব্লকে রূপান্তর করে (finally-তে <code>Dispose()</code> কল হয়, resource ঠিকমতো release হওয়ার জন্য)। এই মেকানিজমটাই পরবর্তী Collections ও LINQ চ্যাপ্টারে গুরুত্বপূর্ণ ভূমিকা রাখবে, যেখানে আমরা নিজেরাই custom <code>IEnumerable</code> বানাবো।</div>

<h3>Methods ও Parameter Passing</h3>
<p>C#-এ ডিফল্টভাবে সব parameter <span class="kw">by value</span> পাস হয় — মানে মেথডের ভেতরে parameter পাল্টালে caller-এর original variable এর উপর প্রভাব পড়ে না (value type-এর ক্ষেত্রে)। তবে <code>ref</code>, <code>out</code>, আর <code>in</code> keyword দিয়ে এই ডিফল্ট আচরণ পাল্টানো যায়:</p>
<table>
<tr><th>Keyword</th><th>উদ্দেশ্য</th><th>কখন caller-কে init করতে হবে</th></tr>
<tr><td><code>ref</code></td><td>by-reference পাস — মেথড ভেতরে পাল্টালে caller-এও পাল্টায়</td><td>হ্যাঁ, কল করার আগেই value থাকতে হবে</td></tr>
<tr><td><code>out</code></td><td>মেথড থেকে একাধিক value রিটার্ন করার জন্য</td><td>না, মেথডের ভেতরেই assign হতে হবে</td></tr>
<tr><td><code>in</code></td><td>by-reference কিন্তু read-only — বড় struct পাস করার performance optimization</td><td>হ্যাঁ, কিন্তু মেথড এটা পরিবর্তন করতে পারবে না</td></tr>
</table>
<pre>void Increment(ref int x) { x++; }

bool TryParse(string input, out int result)
{
    result = int.TryParse(input, out result) ? result : 0;
    return result != 0;
}

void PrintLarge(in LargeStruct data) { /* data রিড-অনলি */ }</pre>

<p>C# মেথড <span class="kw">overloading</span> সাপোর্ট করে — একই নামের একাধিক মেথড, ভিন্ন parameter signature নিয়ে:</p>
<pre>int Add(int a, int b) => a + b;
double Add(double a, double b) => a + b;</pre>
<p>Optional parameter দিয়ে default value সেট করা যায়, আর <code>params</code> দিয়ে ভ্যারিয়েবল সংখ্যক argument নেওয়া যায়:</p>
<pre>void Greet(string name, string greeting = "Hello")
    => Console.WriteLine($"{greeting}, {name}!");

int Sum(params int[] numbers)
{
    int total = 0;
    foreach (var n in numbers) total += n;
    return total;
}

Sum(1, 2, 3, 4);   <span class="c">// params array হিসেবে চলে যায়</span></pre>
<p>ছোট, single-expression মেথড আরও সংক্ষেপে লেখা যায় <span class="kw">expression-bodied member</span> দিয়ে — উপরের <code>Add</code> ও <code>Greet</code> মেথড দুটোই এভাবেই লেখা হয়েছে (<code>=&gt;</code> ব্যবহার করে <code>{ return ...; }</code> এড়ানো হয়েছে)।</p>

<h3>String Handling Basics</h3>
<p>String নিয়ে দৈনন্দিন কাজের জন্য C# দুটো সুবিধাজনক syntax দেয় — <span class="kw">interpolation</span> আর <span class="kw">verbatim string</span>:</p>
<pre>string name = "Rasel";
int age = 25;

string msg1 = $"Name: {name}, Age: {age}";      <span class="c">// interpolated string</span>
string path  = @"C:\Users\Rasel\Documents";      <span class="c">// verbatim — escape দরকার নেই</span></pre>
<p><code>$"..."</code> দিয়ে curly brace-এর ভেতরে সরাসরি expression বসানো যায়, যা পুরনো <code>string.Format</code> এর চেয়ে অনেক readable। আর <code>@"..."</code> দিয়ে backslash-কে literal হিসেবে ট্রিট করা যায় — বিশেষত file path বা regex লেখার সময় কাজে লাগে।</p>
<div class="callout why"><span class="tag">Immutability</span> C#-এ <code>string</code> immutable — অর্থাৎ একবার তৈরি হওয়া string object কখনো পরিবর্তন হয় না। <code>s += "x"</code> লিখলে আসলে একটা সম্পূর্ণ নতুন string object তৈরি হয়, পুরনোটা মেমোরিতে অব্যবহৃত অবস্থায় থেকে যায় (পরে GC পরিষ্কার করে)। এক-দুইবার concatenation-এ এটা কোনো সমস্যা না, কিন্তু loop-এর ভেতরে বহুবার concatenation করলে প্রচুর অপ্রয়োজনীয় object তৈরি হয় — তখন <code>StringBuilder</code> ব্যবহার করা উচিত। এর performance impact নিয়ে বিস্তারিত থাকবে Performance চ্যাপ্টারে।</div>

<h3>Value Type বনাম Reference Type — সংক্ষিপ্ত পরিচয়</h3>
<p>এই মুহূর্তে শুধু এতটুকু জানা দরকার যে C#-এর টাইপ দুই ভাগে বিভক্ত — <code>struct</code> দিয়ে তৈরি <span class="kw">value type</span> (যেমন <code>int</code>, <code>double</code>, <code>bool</code>) আর <code>class</code> দিয়ে তৈরি <span class="kw">reference type</span> (যেমন <code>string</code>, বা আপনার নিজের বানানো object)।</p>
<div class="callout behind"><span class="tag">এখন শুধু এতটুকু মনে রাখুন</span> value type-এর variable সরাসরি তার value ধারণ করে, আর reference type-এর variable মেমোরির একটা লোকেশনের ঠিকানা (reference) ধারণ করে। এর ফলে assignment আর copy-এর আচরণ ভিন্ন হয় — কিন্তু stack বনাম heap, boxing, আর এই পার্থক্যের performance প্রভাব নিয়ে সম্পূর্ণ গভীর আলোচনা হবে পরবর্তী <b>Memory Management</b> চ্যাপ্টারে। আপাতত এইটুকু মনে রাখলেই চলবে।</div>

<h3>সাধারণ ভুলগুলো</h3>
<p>নতুন C# ডেভেলপাররা প্রায়ই কিছু নির্দিষ্ট ভুল করে থাকেন। নিচে সবচেয়ে কমন কয়েকটা:</p>
<div class="callout mistake"><span class="tag">Common mistake — == বনাম .Equals()</span> value type-এর জন্য <code>==</code> সবসময় value compare করে। কিন্তু reference type-এর জন্য ডিফল্ট <code>==</code> reference compare করে — অর্থাৎ দুইটা object একই মেমোরি লোকেশনে আছে কিনা তা চেক করে, কনটেন্ট এক কিনা তা না। ব্যতিক্রম হলো <code>string</code> — এটার জন্য <code>==</code> ওভাররাইড করা আছে, তাই এটা content compare করে। কিন্তু কাস্টম ক্লাসের জন্য content compare করতে চাইলে <code>.Equals()</code> ওভাররাইড করতে হয় অথবা <code>record</code> ব্যবহার করতে হয় (এটা পরের Modern C# চ্যাপ্টারে আসবে)।</div>
<div class="callout mistake"><span class="tag">Common mistake — floating-point equality</span> <code>double</code> বা <code>float</code>-এর জন্য <code>==</code> দিয়ে exact equality চেক করা বিপজ্জনক, কারণ floating-point representation-এ ছোট rounding error থাকতে পারে। <code>0.1 + 0.2 == 0.3</code> লিখলে ফলাফল <code>false</code> আসতে পারে! এর বদলে একটা ছোট tolerance (epsilon) দিয়ে পার্থক্য চেক করা উচিত — <code>Math.Abs(a - b) &lt; 0.0001</code>।</div>
<div class="callout best"><span class="tag">C#-এর একটা built-in সুরক্ষা</span> C-এর মতো ভাষায় <code>if (x = 5)</code> লিখে ভুলে <code>==</code>-এর জায়গায় <code>=</code> লিখে ফেলা একটা কুখ্যাত bug source, কারণ assignment-ও একটা truthy value রিটার্ন করে। C#-এ এই সমস্যা নেই — কারণ <code>if</code> কন্ডিশনে অবশ্যই একটা <code>bool</code> এক্সপ্রেশন লাগবে, আর <code>int</code>-এ assignment একটা <code>int</code> রিটার্ন করে, <code>bool</code> না। ফলে <code>x = 5</code> লিখলে সেটা কম্পাইল-টাইম error হয়ে ধরা পড়ে যায়, রানটাইমে silent bug হয়ে থাকে না।</div>

<h2 class="title">৩. OOP — Class, Inheritance, Polymorphism, Interface</h2>
<p class="lead">Object-Oriented Programming (OOP) হলো C#-এর মূল ভিত্তি। এই chapter-এ আমরা দেখবো কীভাবে class দিয়ে object বানানো হয়, কীভাবে data হাইড করা হয় (encapsulation), কীভাবে একটা class আরেকটা class-এর behavior inherit করে, এবং কীভাবে একই method call বিভিন্ন object-এ ভিন্ন কাজ করে (polymorphism)।</p>

<h3>৩.১ Class vs Object</h3>
<p><span class="kw">Class</span> হলো একটা blueprint বা নকশা — এটা define করে দেয় কোনো জিনিসের কী কী property থাকবে আর কী কী কাজ (method) করতে পারবে। আর <span class="kw">Object</span> হলো সেই blueprint থেকে তৈরি একটা বাস্তব instance, যার নিজস্ব memory এবং state থাকে। যেমন <code>Car</code> একটা class হলে, <code>myCar</code> একটা object।</p>
<pre>class Car
{
    public string Model;
    public int Speed;
}

Car myCar = new Car();   <span class="c">// object তৈরি হলো</span>
myCar.Model = "Corolla";
myCar.Speed = 120;</pre>

<p>Object তৈরির সময় প্রতিবার একটা special method call হয় — সেটাই <span class="kw">Constructor</span>। Constructor-এর নাম class-এর নামের মতোই হয় এবং কোনো return type থাকে না। কোনো constructor না লিখলে C# নিজে একটা <b>default (parameterless) constructor</b> দিয়ে দেয়।</p>
<pre>class Car
{
    public string Model;
    public int Speed;

    <span class="c">// Default constructor</span>
    public Car()
    {
        Model = "Unknown";
    }

    <span class="c">// Parameterized constructor</span>
    public Car(string model, int speed)
    {
        Model = model;
        Speed = speed;
    }

    <span class="c">// Constructor chaining — এই constructor অন্য constructor-কে কল করছে</span>
    public Car(string model) : this(model, 0)
    {
    }
}</pre>
<p><code>: this(...)</code> ব্যবহার করলে একই class-এর অন্য constructor আগে চলে, তারপর current constructor-এর বাকি কাজ চলে। এতে duplicate initialization code লিখতে হয় না।</p>

<p>Field সরাসরি public রাখার বদলে সাধারণত <span class="kw">Property</span> ব্যবহার করা হয়। সবচেয়ে ছোট রূপ হলো <b>auto-property</b>:</p>
<pre>public string Model { get; set; }</pre>
<p>যখন get/set-এর ভেতরে custom logic (validation, calculation) দরকার হয়, তখন একটা backing field সহ <b>full property</b> লেখা হয়:</p>
<pre>private int _speed;
public int Speed
{
    get { return _speed; }
    set
    {
        if (value &lt; 0) throw new ArgumentException("Speed cannot be negative");
        _speed = value;
    }
}</pre>
<p>C# 9-এ এসেছে <span class="kw">init</span>-only setter — এটা দিয়ে property শুধু object তৈরির সময় (constructor বা object initializer-এ) সেট করা যায়, তারপর আর change করা যায় না। এটা immutable object বানাতে খুব কাজে লাগে।</p>
<pre>public class Point
{
    public int X { get; init; }
    public int Y { get; init; }
}

var p = new Point { X = 3, Y = 4 };
<span class="c">// p.X = 10;  // Error! init-only, object তৈরির পর change করা যাবে না</span></pre>

<h3>৩.২ Encapsulation ও Access Modifiers</h3>
<p><span class="kw">Encapsulation</span> মানে হলো object-এর internal data লুকিয়ে রাখা এবং শুধু নির্দিষ্ট method/property দিয়ে সেই data-তে access দেওয়া। এতে class-এর ভেতরের implementation বদলালেও বাইরের code ভাঙে না। C#-এ কোন member কোথা থেকে access করা যাবে সেটা নিয়ন্ত্রণ করে access modifier।</p>
<table>
<tr><th>Modifier</th><th>কে access করতে পারবে</th></tr>
<tr><td><span class="kw">public</span></td><td>যেকোনো জায়গা থেকে — একই project, অন্য project, সব জায়গা থেকে access করা যায়।</td></tr>
<tr><td><span class="kw">private</span></td><td>শুধু একই class-এর ভেতর থেকে। ডিফল্ট modifier (কিছু না লিখলে এটাই ধরা হয়)।</td></tr>
<tr><td><span class="kw">protected</span></td><td>একই class এবং এর যেকোনো derived (child) class থেকে, এমনকি অন্য project-এর derived class থেকেও।</td></tr>
<tr><td><span class="kw">internal</span></td><td>শুধু একই assembly (project/DLL)-এর ভেতর থেকে, যেকোনো class থেকে।</td></tr>
<tr><td><span class="kw">protected internal</span></td><td>একই assembly-এর যেকোনো জায়গা থেকে, <b>অথবা</b> অন্য assembly-এর derived class থেকে (OR শর্ত)।</td></tr>
<tr><td><span class="kw">private protected</span></td><td>শুধু একই assembly-এর ভেতরের derived class থেকে (AND শর্ত) — সবচেয়ে সীমাবদ্ধ।</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span> Field সবসময় private রাখুন, আর public property দিয়ে controlled access দিন। এতে ভবিষ্যতে validation বা logic যোগ করা সহজ হয়।</div>

<h3>৩.৩ Inheritance</h3>
<p><span class="kw">Inheritance</span> দিয়ে একটা class (derived/child) আরেকটা class (base/parent)-এর member reuse করতে পারে। C#-এ <code>:</code> চিহ্ন দিয়ে inheritance লেখা হয়।</p>
<pre>class Animal
{
    public string Name;

    public Animal(string name)
    {
        Name = name;
    }

    public virtual void MakeSound()
    {
        Console.WriteLine(Name + " makes a sound.");
    }
}

class Dog : Animal
{
    <span class="c">// base(...) দিয়ে parent class-এর constructor কল করা হচ্ছে</span>
    public Dog(string name) : base(name) { }

    public override void MakeSound()
    {
        Console.WriteLine(Name + " barks.");
    }
}</pre>
<p>Base class-এর method যদি override করার জন্য উন্মুক্ত রাখতে চান, তাহলে সেটা <span class="kw">virtual</span> দিয়ে চিহ্নিত করতে হয়। Derived class-এ <span class="kw">override</span> দিয়ে সেই method-এর নতুন implementation দেওয়া হয়। এর বিপরীতে <span class="kw">new</span> keyword দিয়ে base method-কে "hide" করা যায়, কিন্তু এতে polymorphism কাজ করে না।</p>
<table>
<tr><th>বিষয়</th><th>override</th><th>new (hiding)</th></tr>
<tr><td>Base method-এ কী দরকার</td><td><span class="kw">virtual</span> / abstract / override হতে হবে</td><td>যেকোনো method (virtual না হলেও চলে)</td></tr>
<tr><td>Runtime dispatch</td><td>Actual object type অনুযায়ী call হয় (polymorphic)</td><td>Reference type অনুযায়ী call হয় (static binding)</td></tr>
<tr><td>ব্যবহার</td><td>একই behavior-এর নতুন version — সত্যিকারের polymorphism</td><td>সম্পূর্ণ ভিন্ন, সম্পর্কহীন behavior দিয়ে base-কে ঢেকে দেওয়া</td></tr>
</table>
<p>কোনো class বা method-কে আর extend/override করতে না দিতে চাইলে <span class="kw">sealed</span> keyword ব্যবহার করা হয়।</p>
<pre>sealed class Cat : Animal
{
    public Cat(string name) : base(name) { }
}
<span class="c">// class Persian : Cat { }   // Error — sealed class inherit করা যাবে না</span>

class Base
{
    public virtual void Foo() { }
}
class Derived : Base
{
    public sealed override void Foo() { } <span class="c">// আর কেউ Foo() override করতে পারবে না</span>
}</pre>

<h3>৩.৪ Polymorphism</h3>
<p><span class="kw">Polymorphism</span> মানে "একই নাম, ভিন্ন রূপ"। এর দুই প্রকার আছে — <b>compile-time polymorphism</b> (method overloading, একই নামের method কিন্তু ভিন্ন parameter signature — আগের chapter-এ সংক্ষেপে দেখা হয়েছে) এবং <b>runtime polymorphism</b> (virtual method dispatch, যেখানে কোন method চলবে তা runtime-এ object-এর actual type দেখে ঠিক হয়)।</p>
<p>নিচের উদাহরণে একটা <code>List&lt;Animal&gt;</code>-এ <code>Dog</code> ও <code>Cat</code> object রাখা হয়েছে, কিন্তু <code>MakeSound()</code> call করলে প্রতিটা object তার নিজের override করা version চালায়:</p>
<pre>class Cat : Animal
{
    public Cat(string name) : base(name) { }
    public override void MakeSound()
    {
        Console.WriteLine(Name + " meows.");
    }
}

List&lt;Animal&gt; animals = new List&lt;Animal&gt;
{
    new Dog("Rex"),
    new Cat("Whiskers")
};

foreach (Animal a in animals)
{
    a.MakeSound();
}
<span class="c">// Output:
// Rex barks.
// Whiskers meows.</span></pre>
<div class="callout why"><span class="tag">কেন গুরুত্বপূর্ণ</span> Runtime polymorphism-এর কারণেই আমরা <code>List&lt;Animal&gt;</code>-এর মতো একটা collection-এ বিভিন্ন ধরনের object একসাথে রেখে, একই loop দিয়ে সবার জন্য সঠিক behavior পেতে পারি — টাইপ চেক করে if-else লেখার দরকার হয় না।</div>

<h3>৩.৫ Interface vs Abstract Class</h3>
<p><span class="kw">Interface</span> শুধু একটা "contract" — কী কী method/property থাকতে হবে তা বলে দেয়, কিন্তু (default implementation ছাড়া) কোনো implementation থাকে না। আর <span class="kw">Abstract class</span> partial implementation দিতে পারে, শুধু কিছু method abstract (implementation ছাড়া) রেখে বাকিগুলো সম্পূর্ণ লেখা যায়।</p>
<table>
<tr><th>বিষয়</th><th>Interface</th><th>Abstract Class</th></tr>
<tr><td>Multiple inheritance</td><td>একাধিক interface implement করা যায়</td><td>শুধু একটা class inherit করা যায়</td></tr>
<tr><td>Implementation</td><td>সাধারণত কোনো implementation থাকে না (C# 8+ এ default method সম্ভব)</td><td>method-এর সম্পূর্ণ বা আংশিক implementation থাকতে পারে</td></tr>
<tr><td>Field</td><td>instance field রাখা যায় না</td><td>field রাখা যায়</td></tr>
<tr><td>Constructor</td><td>থাকে না</td><td>থাকতে পারে</td></tr>
<tr><td>কখন ব্যবহার</td><td>ভিন্ন ভিন্ন, সম্পর্কহীন class-এর মধ্যে common capability/contract দরকার হলে</td><td>একই family-এর class-দের মধ্যে common code শেয়ার করতে চাইলে</td></tr>
</table>
<pre>interface IFlyable
{
    void Fly();

    <span class="c">// C# 8+ default interface method — implementing class override না করলে এটাই চলবে</span>
    void Land() => Console.WriteLine("Landing safely.");
}

abstract class Shape
{
    public abstract double GetArea(); <span class="c">// implementation নেই, derived class-এ বাধ্যতামূলক</span>

    public void PrintArea()
    {
        Console.WriteLine("Area: " + GetArea());
    }
}</pre>
<div class="callout best"><span class="tag">Best practice</span> "IS-A" সম্পর্ক আর code শেয়ার করতে হলে abstract class ব্যবহার করুন; শুধু "CAN-DO" ক্ষমতা বর্ণনা করতে হলে (যেমন <code>IComparable</code>, <code>IDisposable</code>) interface ব্যবহার করুন।</div>

<h3>৩.৬ Composition Over Inheritance</h3>
<p>Deep inheritance chain (যেমন <code>A → B → C → D</code>) সময়ের সাথে fragile হয়ে যায় — base class-এ একটা ছোট পরিবর্তন সব derived class-এ ঢেউ তুলতে পারে। এজন্য অনেক ক্ষেত্রে "IS-A" সম্পর্কের বদলে "HAS-A" সম্পর্ক — অর্থাৎ <span class="kw">Composition</span> — বেছে নেওয়া ভালো।</p>
<pre>class Engine
{
    public void Start() => Console.WriteLine("Engine started.");
}

class Car
{
    private Engine _engine = new Engine(); <span class="c">// Car "has-a" Engine — inheritance না, composition</span>

    public void Start()
    {
        _engine.Start();
    }
}</pre>
<div class="callout why"><span class="tag">কেন Composition ভালো</span> Composition-এ object-গুলো loosely coupled থাকে — <code>Engine</code>-এর ভেতরের পরিবর্তন <code>Car</code>-কে ভাঙে না, এবং প্রয়োজনে runtime-এ ভিন্ন Engine বসিয়ে দেওয়া যায়। গভীর inheritance hierarchy-তে এই flexibility থাকে না, কারণ derived class-গুলো base class-এর internal structure-এর সাথে শক্তভাবে জড়িয়ে যায়।</div>

<div class="callout behind"><span class="tag">সামনে যা আসছে</span> ছোট, immutable data model (যেমন শুধু কিছু property রাখা DTO বা value object) বানানোর জন্য C# 9-এ এসেছে <span class="kw">record</span> — এটা class-এর চেয়ে অনেক কম boilerplate-এ value-equality ও immutability দেয়। Record-এর বিস্তারিত আলোচনা পরবর্তী "Modern C# Features" chapter-এ করা হবে।</div>

<h3>৩.৭ সাধারণ ভুল — virtual ভুলে যাওয়া</h3>
<p>একটা খুব common এবং বিপজ্জনক ভুল হলো base class-এর method-এ <span class="kw">virtual</span> লিখতে ভুলে যাওয়া, অথচ derived class-এ <span class="kw">override</span> লেখা। এক্ষেত্রে compiler error দেয় না বরং <code>override</code>-এর জায়গায় নীরবে <code>new</code> (method hiding) ধরে নেয়, ফলে polymorphism আশানুরূপ কাজ করে না।</p>
<pre>class Animal
{
    public void MakeSound()   <span class="c">// virtual লেখা হয়নি!</span>
    {
        Console.WriteLine("Some generic sound.");
    }
}

class Dog : Animal
{
    public new void MakeSound()  <span class="c">// override লিখলে compiler warning দিয়ে new-তে বদলে নেয়</span>
    {
        Console.WriteLine("Bark!");
    }
}

Animal a = new Dog();
a.MakeSound();  <span class="c">// Output: "Some generic sound." — Dog.MakeSound() call হলো না!</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — silent method hiding</span> উপরের কোডে <code>a</code>-এর compile-time type হলো <code>Animal</code>, আর যেহেতু method virtual না, তাই call resolve হয় reference type অনুযায়ী, actual object type (<code>Dog</code>) অনুযায়ী নয়। ফলে প্রত্যাশিত "Bark!" না ছেপে "Some generic sound." ছাপা হয়। এই ভুল ধরা কঠিন কারণ code compile হয় নিখুঁতভাবে, কোনো error/exception ছাড়াই ভুল output দেয়।</div>
<div class="callout best"><span class="tag">Best practice</span> যেকোনো method যা derived class-এ override হওয়ার কথা, base class-এ সবসময় স্পষ্টভাবে <span class="kw">virtual</span> লিখুন, এবং derived class-এ Visual Studio/IDE-এর warning খেয়াল রাখুন — <code>new</code> keyword auto-add হয়ে গেলে সেটা প্রায়ই ভুলে হওয়া <code>virtual</code>-এর লক্ষণ।</div>

<h2 class="title">৪. Collections ও Generics</h2>
<p class="lead">C# প্রোগ্রামে একটার বদলে একগুচ্ছ ডেটা নিয়ে কাজ করাটাই স্বাভাবিক নিয়ম। এই chapter-এ আমরা দেখব কীভাবে array-এর সীমাবদ্ধতা থেকে <code>List&lt;T&gt;</code>, <code>Dictionary&lt;TKey,TValue&gt;</code>-এর মতো collection টাইপ তৈরি হয়েছে, কেন Generics-এর দরকার পড়েছিল, এবং কীভাবে নিজের generic method বা class লেখা যায়।</p>

<h3>৪.১ Array বনাম List&lt;T&gt;</h3>
<p>Array হলো সবচেয়ে সাধারণ collection — এটি ফিক্সড সাইজের, মানে তৈরি করার সময় যত এলিমেন্ট রাখার কথা বলা হয় ঠিক ততটাই জায়গা মেমোরিতে বরাদ্দ হয়। পরে সাইজ বাড়ানো বা কমানো যায় না।</p>
<pre>int[] numbers = new int[5];
numbers[0] = 10;
<span class="c">// numbers.Length সবসময় 5, বাড়ানো যাবে না</span></pre>
<p>বাস্তব প্রোগ্রামে আমরা প্রায়ই জানি না ঠিক কতগুলো item লাগবে — ব্যবহারকারী কতগুলো item add করবে সেটা runtime-এ ঠিক হয়। এই সমস্যার সমাধান হলো <code>List&lt;T&gt;</code>, যা প্রয়োজন অনুযায়ী নিজে থেকে বড় হতে পারে (dynamic resizing)।</p>
<pre>List&lt;int&gt; numbers = new List&lt;int&gt;();
numbers.Add(10);
numbers.Add(20);
numbers.Add(30); <span class="c">// দরকার হলে আরও add করা যাবে</span></pre>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> <code>List&lt;T&gt;</code>-এর ভেতরে আসলে একটা array-ই থাকে। যখন এই ভেতরের array পূর্ণ হয়ে যায় এবং নতুন item add করতে হয়, তখন List একটি নতুন, সাধারণত <b>দ্বিগুণ (double)</b> ক্যাপাসিটির array তৈরি করে, পুরনো সব এলিমেন্ট কপি করে নতুন array-তে নিয়ে যায়, এবং পুরনোটা বাদ দিয়ে দেয়। অর্থাৎ Capacity 4 → 8 → 16 → 32 এভাবে বাড়ে। এই কপি করার কাজটি একটা O(n) অপারেশন, তাই ঘন ঘন resize হওয়া পারফরম্যান্সের জন্য ভালো নয়।</div>

<h3>৪.২ Collection Interface Hierarchy</h3>
<p>C#-এর collection টাইপগুলো একটা layered interface hierarchy মেনে চলে — প্রতিটি লেয়ার আগেরটার উপর নতুন ক্ষমতা যোগ করে।</p>
<div class="diagram"><pre>IEnumerable&lt;T&gt;   (শুধু iterate/foreach করা যায়)
      │
      ▼
ICollection&lt;T&gt;   (+ Count, Add, Remove, Contains)
      │
      ├──▶ IList&lt;T&gt;               (+ index দিয়ে access: list[i])
      │
      └──▶ IDictionary&lt;TKey,TValue&gt;  (+ key দিয়ে access: dict[key])
</pre></div>
<table>
<tr><th>Interface</th><th>যা করা যায়</th></tr>
<tr><td><code>IEnumerable&lt;T&gt;</code></td><td>শুধু <code>foreach</code>-এ ঘুরে ঘুরে পড়া যায়, একবারে এক দিকে</td></tr>
<tr><td><code>ICollection&lt;T&gt;</code></td><td>Count, Add, Remove, Contains — সংগ্রহ পরিবর্তন করার ক্ষমতা</td></tr>
<tr><td><code>IList&lt;T&gt;</code></td><td>index number দিয়ে সরাসরি এলিমেন্ট access ও পরিবর্তন (<code>list[2]</code>)</td></tr>
<tr><td><code>IDictionary&lt;TKey,TValue&gt;</code></td><td>index-এর বদলে key দিয়ে value access (<code>dict["name"]</code>)</td></tr>
</table>
<p>এই hierarchy জানা থাকলে method signature লেখার সময় সবচেয়ে কম ক্ষমতাসম্পন্ন interface বেছে নেওয়া যায় — যেমন যদি শুধু পড়তে হয়, তাহলে <code>List&lt;T&gt;</code> এর বদলে parameter টাইপ <code>IEnumerable&lt;T&gt;</code> রাখা উচিত।</p>

<h3>৪.৩ প্রচলিত Collection Types</h3>
<p>C#-এর বিল্ট-ইন collection library-তে বিভিন্ন কাজের জন্য আলাদা আলাদা টাইপ আছে।</p>
<table>
<tr><th>Type</th><th>কবে ব্যবহার হয়</th></tr>
<tr><td><code>List&lt;T&gt;</code></td><td>Order মেনে item রাখা, index দিয়ে access প্রয়োজন হলে</td></tr>
<tr><td><code>Dictionary&lt;TKey,TValue&gt;</code></td><td>Key দিয়ে দ্রুত (O(1) auto) lookup দরকার হলে</td></tr>
<tr><td><code>HashSet&lt;T&gt;</code></td><td>শুধু unique value রাখতে হবে, duplicate বাদ দিতে হবে</td></tr>
<tr><td><code>Queue&lt;T&gt;</code></td><td>FIFO (First-In-First-Out) — যেমন task processing queue</td></tr>
<tr><td><code>Stack&lt;T&gt;</code></td><td>LIFO (Last-In-First-Out) — যেমন undo history</td></tr>
</table>
<pre>Dictionary&lt;string, int&gt; ages = new Dictionary&lt;string, int&gt;();
ages["Rasel"] = 28;
ages["Karim"] = 32;
if (ages.TryGetValue("Rasel", out int age))
{
    Console.WriteLine(age); <span class="c">// 28</span>
}</pre>
<pre>Queue&lt;string&gt; tasks = new Queue&lt;string&gt;();
tasks.Enqueue("A");
tasks.Enqueue("B");
Console.WriteLine(tasks.Dequeue()); <span class="c">// A — সবচেয়ে আগে ঢোকা item আগে বের হয়</span>

Stack&lt;string&gt; history = new Stack&lt;string&gt;();
history.Push("Page1");
history.Push("Page2");
Console.WriteLine(history.Pop()); <span class="c">// Page2 — সবচেয়ে পরে ঢোকা item আগে বের হয়</span></pre>

<h3>৪.৪ Generics কেন দরকার</h3>
<p>Generics আসার আগে .NET-এ non-generic collection যেমন <code>ArrayList</code> ব্যবহার হতো, যা যেকোনো টাইপের item রাখতে পারত কারণ এটি ভেতরে সবকিছুকে <code>object</code> হিসেবে সংরক্ষণ করত। এতে দুটো বড় সমস্যা ছিল — প্রথমত, item বের করার সময় সঠিক টাইপে <b>cast</b> করতে হতো এবং ভুল টাইপে cast করলে তা compile-time-এ ধরা পড়ত না, শুধু runtime-এ exception আসত। দ্বিতীয়ত, <code>int</code>-এর মতো value type রাখলে প্রতিবার <b>boxing</b> (heap-এ object wrapper তৈরি) ঘটত, যা performance-এর ক্ষতি করত।</p>
<pre><span class="c">// আগে: ArrayList (non-generic)</span>
ArrayList list = new ArrayList();
list.Add(10);        <span class="c">// boxing ঘটছে: int → object</span>
list.Add("hello");   <span class="c">// যেকোনো টাইপ ঢুকিয়ে দেওয়া যাচ্ছে, compiler বাধা দিচ্ছে না</span>

int x = (int)list[0];      <span class="c">// unboxing + manual cast দরকার</span>
int y = (int)list[1];      <span class="c">// runtime এ InvalidCastException!</span></pre>
<pre><span class="c">// পরে: List&lt;T&gt; (generic)</span>
List&lt;int&gt; list = new List&lt;int&gt;();
list.Add(10);
<span class="c">// list.Add("hello");   // compile-time error — টাইপ safety নিশ্চিত</span>

int x = list[0];   <span class="c">// কোনো cast লাগছে না, boxing নেই</span></pre>
<div class="callout why"><span class="tag">কেন Generics</span> <span class="kw">Generics</span> এই দুই সমস্যার সমাধান দেয় — compile-time type safety (ভুল টাইপ ঢোকালে compiler-ই ধরে ফেলে) এবং value type-এর জন্য boxing এড়ানো, ফলে কোড দ্রুত ও নিরাপদ হয়।</div>

<h3>৪.৫ নিজের Generic Method ও Class লেখা</h3>
<p>শুধু built-in collection-এই Generics সীমাবদ্ধ নয় — নিজের method বা class-ও generic লেখা যায়, যাতে একই কোড যেকোনো টাইপে reuse করা যায়।</p>
<pre><span class="c">// Generic method</span>
void Swap&lt;T&gt;(ref T a, ref T b)
{
    T temp = a;
    a = b;
    b = temp;
}

int x = 1, y = 2;
Swap&lt;int&gt;(ref x, ref y); <span class="c">// একই method int, string, যেকোনো টাইপে কাজ করবে</span></pre>
<pre><span class="c">// Generic class</span>
class Repository&lt;T&gt; where T : class, new()
{
    private List&lt;T&gt; items = new List&lt;T&gt;();

    public void Add(T item) =&gt; items.Add(item);
    public T CreateNew() =&gt; new T();
    public IEnumerable&lt;T&gt; GetAll() =&gt; items;
}</pre>
<p>এখানে <code>where T : class, new()</code> হলো একটি <span class="kw">Generic Constraint</span> — এটি T-এর উপর শর্ত বসায়, যাতে সেই টাইপ নিয়ে নির্দিষ্ট কাজ করার নিশ্চয়তা মেলে (যেমন এখানে <code>new T()</code> কল করা সম্ভব হচ্ছে কারণ constraint বলছে T-এর একটি parameterless constructor থাকতেই হবে)।</p>
<table>
<tr><th>Constraint</th><th>অর্থ</th></tr>
<tr><td><code>where T : class</code></td><td>T অবশ্যই reference type হতে হবে (class, interface, delegate)</td></tr>
<tr><td><code>where T : struct</code></td><td>T অবশ্যই value type হতে হবে (int, bool, নিজের struct ইত্যাদি)</td></tr>
<tr><td><code>where T : new()</code></td><td>T-এর একটি public parameterless constructor থাকতে হবে</td></tr>
<tr><td><code>where T : IComparable&lt;T&gt;</code></td><td>T অবশ্যই <code>IComparable&lt;T&gt;</code> implement করবে, ফলে দুটো T ভ্যালু তুলনা (sort) করা যাবে</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — নির্দিষ্ট constraint ব্যবহার</span> যতটুকু দরকার ততটুকুই constraint দিন। অতিরিক্ত কড়া constraint দিলে method-টি অপ্রয়োজনীয়ভাবে সীমিত হয়ে যায়, আবার constraint না দিলে class-এর ভেতরে সেই টাইপ নিয়ে দরকারি অপারেশন (যেমন compare বা new করা) করা যায় না।</div>

<h3>৪.৬ Covariance এবং Contravariance</h3>
<p>Generic interface-এ <code>out</code> ও <code>in</code> keyword দিয়ে টাইপ প্যারামিটারের দিক নির্দেশ করা যায়। <code>IEnumerable&lt;out T&gt;</code> হলো <span class="kw">Covariant</span> — এর মানে যদি <code>Dog</code>, <code>Animal</code>-এর subclass হয়, তাহলে <code>IEnumerable&lt;Dog&gt;</code>-কে যেখানে <code>IEnumerable&lt;Animal&gt;</code> আশা করা হচ্ছে সেখানে সরাসরি ব্যবহার করা যায়, কারণ এই interface শুধু T "output" (রিটার্ন/পড়ার জন্য) হিসেবে ব্যবহার করে, কখনো T গ্রহণ করে না।</p>
<pre>IEnumerable&lt;Dog&gt; dogs = new List&lt;Dog&gt;();
IEnumerable&lt;Animal&gt; animals = dogs; <span class="c">// Covariance — এটা বৈধ</span></pre>
<p>উল্টোদিকে <code>IComparer&lt;in T&gt;</code>-এর মতো interface হলো <span class="kw">Contravariant</span> — এখানে T শুধু input হিসেবে গ্রহণ করা হয় (compare method-এ parameter হিসেবে), তাই <code>IComparer&lt;Animal&gt;</code>-কে যেখানে <code>IComparer&lt;Dog&gt;</code> দরকার সেখানে ব্যবহার করা যায় (বেশি general একটা comparer, নির্দিষ্ট একটা টাইপের জন্যও কাজ করবে)। মূল কথা এতটুকুই মনে রাখলেই যথেষ্ট — <code>out</code> মানে আউটপুটের জন্য নমনীয়তা (child → parent), <code>in</code> মানে ইনপুটের জন্য নমনীয়তা (parent → child)।</p>

<h3>৪.৭ Capacity আগে থেকে ঠিক করার গুরুত্ব</h3>
<p>যদি আগে থেকেই জানা থাকে কত item শেষ পর্যন্ত collection-এ থাকবে, সেই সংখ্যাটা constructor-এ দিয়ে দেওয়া উচিত।</p>
<pre>List&lt;int&gt; numbers = new List&lt;int&gt;(1000); <span class="c">// প্রথম থেকেই Capacity 1000</span>
Dictionary&lt;string, int&gt; map = new Dictionary&lt;string, int&gt;(1000);</pre>
<div class="callout mistake"><span class="tag">Common mistake — Capacity সেট না করা</span> চূড়ান্ত সাইজ জানা থাকা সত্ত্বেও অনেকে খালি <code>new List&lt;T&gt;()</code> বা <code>new Dictionary&lt;TKey,TValue&gt;()</code> দিয়ে শুরু করেন এবং লুপে হাজার হাজার item add করেন। এতে আগের ৪.১ সেকশনে বর্ণিত ডাবলিং প্রক্রিয়া বারবার ঘটে — প্রতিবার নতুন array তৈরি ও পুরনো ডেটা কপি করা হয়, যা অপ্রয়োজনীয় memory allocation ও CPU সময় খরচ করে। সাইজ জানা থাকলে constructor-এ initial capacity দিয়ে দিলে এই বারবার resize হওয়া এড়ানো যায়।</div>
</template>

<h2 class="title">৫. Core Language Features — Extension Methods, Tuples, Indexers, Enums, Iterators</h2>
<p class="lead">আগের Collections চ্যাপ্টারে আমরা <code>List&lt;T&gt;</code>, <code>Dictionary&lt;TKey, TValue&gt;</code> আর generics নিয়ে কাজ করেছি। এই চ্যাপ্টারে C# এর এমন কিছু ফিচার দেখব যেগুলো দৈনন্দিন কোডে বারবার আসে, কিন্তু OOP বা Collections এর মূল আলোচনায় জায়গা পায়নি — extension methods, nullable value types, tuples, indexers, static সদস্য, flags enum, আর নিজের হাতে বানানো iterator। এই চ্যাপ্টারের সবচেয়ে গুরুত্বপূর্ণ অংশ হলো extension methods, কারণ পরের LINQ চ্যাপ্টারে যে <code>Where</code>, <code>Select</code>, <code>OrderBy</code> এর মতো মেথডগুলো দেখবেন, সেগুলো আসলে এই একই মেকানিজমের উপর দাঁড়িয়ে আছে।</p>

<h3>১. Extension Methods কী এবং কেন দরকার</h3>
<p>ধরুন আপনি চান <code>string</code> টাইপের একটা নতুন মেথড থাকুক — যেমন <code>IsValidEmail()</code> — যাতে আপনি লিখতে পারেন <code>email.IsValidEmail()</code>। কিন্তু <code>string</code> ক্লাসের সোর্স কোড তো আপনার হাতে নেই, .NET এর built-in টাইপ। এখানেই <span class="kw">Extension Method</span> কাজে লাগে — এটা আপনাকে কোনো টাইপের সোর্স কোড না ছুঁয়েই তাতে নতুন "instance method" এর মতো আচরণকারী ফাংশন যোগ করার সুযোগ দেয়।</p>
<p>নিয়মটা সহজ: একটা <span class="kw">static</span> ক্লাসের ভেতরে একটা <span class="kw">static</span> মেথড লিখতে হবে, আর তার প্রথম প্যারামিটারের টাইপের আগে <code>this</code> কিওয়ার্ড বসাতে হবে। এই <code>this</code>-ই কম্পাইলারকে বলে দেয় যে এই মেথডটা ওই টাইপের উপর extension হিসেবে কাজ করবে।</p>
<pre>public static class StringExtensions
{
    public static bool IsValidEmail(this string input)
    {
        if (string.IsNullOrWhiteSpace(input))
            return false;

        return input.Contains("@") &amp;&amp; input.Contains(".");
    }
}

<span class="c">// ব্যবহার — ঠিক instance method এর মতোই দেখতে লাগে</span>
string email = "rasel@example.com";
bool valid = email.IsValidEmail(); <span class="c">// true</span></pre>
<p>লক্ষ্য করুন, <code>email.IsValidEmail()</code> লেখাটা দেখতে ঠিক <code>string</code> ক্লাসের নিজস্ব মেথডের মতোই লাগছে, কিন্তু আসলে এটা <code>StringExtensions.IsValidEmail(email)</code> — কম্পাইলার শুধু syntax টাকে সুন্দর করে দেখাচ্ছে (এটাকে বলে syntactic sugar)।</p>
<div class="callout why"><span class="tag">কেন এভাবে</span> Extension methods মূলত এমন সব টাইপে ফাংশনালিটি যোগ করার জন্য যেগুলো আপনি নিয়ন্ত্রণ করেন না — .NET এর built-in টাইপ, third-party লাইব্রেরির ক্লাস, বা sealed ক্লাস। এতে করে ইনহেরিটেন্স বা wrapper ক্লাস বানানোর ঝামেলা ছাড়াই কোড আরও readable আর fluent হয়।</div>
<p>শুধু <code>string</code> নয় — যেকোনো টাইপের উপর, এমনকি <code>interface</code> এর উপরও extension method লেখা যায়। যেমন <code>IEnumerable&lt;T&gt;</code> এর উপর একটা কাস্টম extension:</p>
<pre>public static class EnumerableExtensions
{
    public static IEnumerable&lt;T&gt; TakeEveryOther&lt;T&gt;(this IEnumerable&lt;T&gt; source)
    {
        bool keep = true;
        foreach (var item in source)
        {
            if (keep) yield return item;
            keep = !keep;
        }
    }
}

var numbers = new List&lt;int&gt; { 1, 2, 3, 4, 5, 6 };
var alternate = numbers.TakeEveryOther(); <span class="c">// 1, 3, 5</span></pre>

<h3>২. Extension Method কীভাবে খুঁজে পাওয়া যায় — Resolution Rules</h3>
<p>Extension method ব্যবহার করতে হলে দুইটা নিয়ম মনে রাখা জরুরি।</p>
<p><b>প্রথমত</b>, যে namespace-এ extension method ডিফাইন করা আছে, সেটা <code>using</code> দিয়ে ইম্পোর্ট করা না থাকলে কম্পাইলার সেটা খুঁজেই পাবে না — যদিও ক্লাসটা public এবং assembly-তে reference করা আছে।</p>
<pre>using System.Linq; <span class="c">// এই using না থাকলে .Where() মেথডটাই দেখা যাবে না</span></pre>
<p><b>দ্বিতীয়ত</b>, কোনো টাইপের নিজস্ব instance method আর extension method যদি নাম-সিগনেচারে একই হয়, তাহলে সবসময় instance method জিতবে। কম্পাইলার আগে instance member খোঁজে, শুধু না পেলে extension method এর দিকে যায়।</p>
<pre>public static class ObjectExtensions
{
    public static string Describe(this object obj) =&gt; "generic extension";
}

public class Product
{
    public string Describe() =&gt; "Product-এর নিজস্ব instance method"; <span class="c">// এটাই সবসময় জিতবে</span>
}

var p = new Product();
Console.WriteLine(p.Describe()); <span class="c">// output: Product-এর নিজস্ব instance method</span></pre>

<h3>৩. Extension Methods থেকে LINQ পর্যন্ত — আসল রহস্য উন্মোচন</h3>
<p>এতক্ষণ যা শিখলেন, তা দিয়েই এখন একটা প্রশ্নের উত্তর দেওয়া যাক: <code>List&lt;T&gt;</code> ক্লাসে তো কখনো <code>Where</code>, <code>Select</code>, বা <code>OrderBy</code> নামের কোনো মেথড লেখা হয়নি, তাহলে <code>list.Where(x =&gt; x &gt; 5)</code> কীভাবে কাজ করে? উত্তর — এগুলো সবগুলোই <span class="kw">Extension Method</span>, <code>System.Linq</code> namespace-এর <code>Enumerable</code> নামের একটা static ক্লাসের ভেতর <code>IEnumerable&lt;T&gt;</code> এর উপর ডিফাইন করা।</p>
<pre>namespace System.Linq
{
    public static class Enumerable
    {
        public static IEnumerable&lt;TSource&gt; Where&lt;TSource&gt;(
            this IEnumerable&lt;TSource&gt; source,
            Func&lt;TSource, bool&gt; predicate)
        {
            <span class="c">// ভেতরে ভেতরে iterate করে predicate মিলে যাওয়া আইটেমগুলো yield return করে</span>
        }
    }
}

List&lt;int&gt; numbers = new List&lt;int&gt; { 1, 2, 3, 4, 5 };
var evens = numbers.Where(n =&gt; n % 2 == 0); <span class="c">// List&lt;T&gt; এ Where মেথড কখনো লেখা হয়নি!</span></pre>
<p>যেহেতু <code>List&lt;T&gt;</code> নিজেই <code>IEnumerable&lt;T&gt;</code> ইমপ্লিমেন্ট করে (আগের Collections চ্যাপ্টারে দেখেছেন), তাই <code>System.Linq</code> namespace-এ ডিফাইন করা <code>Where</code>, <code>Select</code>, <code>OrderBy</code>, <code>Sum</code>, <code>Count</code> — সবকিছুই স্বয়ংক্রিয়ভাবে <code>List&lt;T&gt;</code>, <code>array</code>, <code>Dictionary</code> এর values, এমনকি নিজের বানানো যেকোনো <code>IEnumerable&lt;T&gt;</code> টাইপের উপর ব্যবহারযোগ্য হয়ে যায়। পরের LINQ চ্যাপ্টারে এই মেথডগুলোর ব্যবহার বিস্তারিতভাবে দেখবেন — এখন শুধু এটুকু জেনে রাখুন যে LINQ এর পুরো সিনট্যাক্স-সুবিধা আসলে extension method এর উপর দাঁড়িয়ে থাকা একটা কৌশল, নতুন কোনো ভাষার ফিচার নয়।</p>
<div class="callout mistake"><span class="tag">Common mistake — Business logic কে extension method বানানো</span> Extension method দিয়ে কোনো টাইপে "ফিচার যোগ করা" সহজ লাগে বলেই অনেকে ডোমেইন-নির্ভর ব্যবসায়িক লজিক (যেমন <code>order.CalculateDiscount()</code> যেখানে ডিসকাউন্ট নীতি জটিল এবং ডাটাবেজ/কনফিগ নির্ভর) সরাসরি extension method এ লিখে ফেলেন। সমস্যা হলো, extension method কোনো state রাখতে পারে না (constructor injection নেই, field নেই), আর এভাবে লজিক ক্লাসের বাইরে ছড়িয়ে গেলে খুঁজে বের করা কঠিন হয়ে যায়। Extension methods রাখুন ছোট, stateless, ব্যাপকভাবে পুনর্ব্যবহারযোগ্য helper এর জন্য — যেমন ফরম্যাটিং, ভ্যালিডেশন, ছোট রূপান্তর। মূল ডোমেইন লজিক থাকা উচিত একটা যথাযথ service বা ক্লাসে।</div>
<div class="callout best"><span class="tag">Best practice</span> নিজের team-এর জন্য extension methods লেখার আগে ভাবুন — এই ফাংশনটা কি সত্যিই টাইপ-নিরপেক্ষ, ছোট, আর সহজে টেস্টযোগ্য একটা helper? হলে extension method ঠিক আছে। আর যদি এটার নিজস্ব dependency, state, বা ব্যবসায়িক নিয়ম থাকে, তাহলে সাধারণ ক্লাসে মেথড হিসেবে রাখাই ভালো।</div>

<h3>৪. Nullable Value Types — <code>int?</code> ও <code>Nullable&lt;T&gt;</code></h3>
<p>Modern C# চ্যাপ্টারে <span class="kw">Nullable Reference Types</span> (<code>string?</code>) নিয়ে আলোচনা হয়েছিল — মনে রাখা জরুরি, ওটা শুধুই একটা কম্পাইল-টাইম অ্যানোটেশন। <code>string?</code> লিখলে রানটাইমে <code>string</code> এর কোনো পরিবর্তন হয় না, শুধু কম্পাইলার null-চেক না করলে warning দেখায়।</p>
<p><code>Nullable&lt;T&gt;</code> (শর্টহ্যান্ডে <code>int?</code>, <code>bool?</code>, <code>DateTime?</code>) সম্পূর্ণ ভিন্ন জিনিস। <code>int</code>, <code>bool</code>, <code>struct</code> এর মতো value type স্বাভাবিকভাবে কখনো <code>null</code> হতে পারে না — এদের সবসময় একটা মান থাকতেই হয়। <code>Nullable&lt;T&gt;</code> হলো একটা আসল রানটাইম wrapper struct, যার ভেতরে সত্যিকারের <code>.HasValue</code> (bool) আর <code>.Value</code> (T) প্রপার্টি থাকে।</p>
<pre>int? age = null;

if (age.HasValue)
{
    Console.WriteLine(age.Value);
}
else
{
    Console.WriteLine("বয়স জানা নেই");
}

int actualAge = age ?? 0; <span class="c">// age null হলে 0 ব্যবহার হবে</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — HasValue চেক না করে .Value ব্যবহার</span> <code>age.Value</code> সরাসরি অ্যাক্সেস করার আগে <code>HasValue</code> চেক না করলে, যদি ভেতরে সত্যিই <code>null</code> থাকে, তাহলে <code>InvalidOperationException</code> থ্রো হবে। এটা <code>NullReferenceException</code> নয় — সম্পূর্ণ আলাদা এক্সসেপশন, কারণ <code>Nullable&lt;T&gt;</code> নিজেই একটা struct, reference নয়। তাই সবসময় <code>HasValue</code> চেক করুন অথবা <code>??</code> operator ব্যবহার করুন।</div>

<h3>৫. Tuples ও Deconstruction</h3>
<p>মাঝেমধ্যে একটা মেথড থেকে একাধিক মান রিটার্ন করা দরকার হয়, কিন্তু শুধু সেই একটা কাজের জন্য আলাদা একটা DTO ক্লাস বানানো বাড়াবাড়ি মনে হতে পারে। এখানে <span class="kw">ValueTuple</span> কাজে লাগে — <code>(int, string)</code> এর মতো লিটারেল সিনট্যাক্স দিয়ে সরাসরি একাধিক মান একসাথে গ্রুপ করা যায়, চাইলে প্রতিটা এলিমেন্টের একটা নামও দেওয়া যায়।</p>
<pre>(int Id, string Name) GetUser()
{
    return (1, "Rasel");
}

var user = GetUser();
Console.WriteLine(user.Id);   <span class="c">// named element সরাসরি ব্যবহার করা যায়</span>
Console.WriteLine(user.Name);

<span class="c">// deconstruction — একসাথে আলাদা variable এ ভেঙে ফেলা</span>
var (id, name) = GetUser();
Console.WriteLine($"{id} - {name}");</pre>
<p>শুধু tuple-ই নয়, যেকোনো ক্লাস বা <span class="kw">record</span> চাইলে নিজস্ব <code>Deconstruct</code> মেথড লিখে deconstruction সিনট্যাক্স সাপোর্ট করাতে পারে:</p>
<pre>public class Point
{
    public int X { get; }
    public int Y { get; }

    public Point(int x, int y) =&gt; (X, Y) = (x, y);

    public void Deconstruct(out int x, out int y)
    {
        x = X;
        y = Y;
    }
}

var p = new Point(3, 4);
var (px, py) = p; <span class="c">// Deconstruct মেথড থাকায় এভাবে ভাঙা সম্ভব</span></pre>
<p>Tuple সবচেয়ে বেশি কাজে লাগে ছোট, private/internal হেল্পার মেথডের রিটার্ন টাইপ হিসেবে, যেখানে একটা পূর্ণাঙ্গ ক্লাস বানানো অপ্রয়োজনীয় ওভারহেড মনে হয়। কিন্তু পাবলিক API বা বড় ডোমেইন মডেলের ক্ষেত্রে একটা যথাযথ নামসহ ক্লাস/রেকর্ডই বেশি readable ও maintainable থাকে।</p>

<h3>৬. Indexers — <code>[]</code> সিনট্যাক্স দিয়ে কাস্টম ক্লাস অ্যাক্সেস</h3>
<p><span class="kw">Indexer</span> দিয়ে আপনার নিজের বানানো ক্লাসকে array বা dictionary এর মতো <code>[]</code> ব্র্যাকেট দিয়ে অ্যাক্সেস করার সুবিধা দেওয়া যায়। এটা লেখা হয় <code>this[...]</code> সিনট্যাক্স দিয়ে, ভেতরে সাধারণ প্রপার্টির মতোই <code>get</code>/<code>set</code> থাকে।</p>
<pre>public class WeekSchedule
{
    private readonly Dictionary&lt;DayOfWeek, string&gt; _tasks = new();

    public string this[DayOfWeek day]
    {
        get =&gt; _tasks.TryGetValue(day, out var task) ? task : "কোনো কাজ নেই";
        set =&gt; _tasks[day] = value;
    }
}

var schedule = new WeekSchedule();
schedule[DayOfWeek.Monday] = "Client meeting";
Console.WriteLine(schedule[DayOfWeek.Monday]); <span class="c">// array এর মতোই [] ব্যবহার হচ্ছে</span></pre>
<p>ইন্টারনালি <code>WeekSchedule</code> একটা <code>Dictionary&lt;DayOfWeek, string&gt;</code> মোড়ানো (wrap করা) ছাড়া কিছুই না, কিন্তু বাইরে থেকে ব্যবহারকারীর কাছে এটা array-এর মতোই সহজ ইন্টারফেস দেখায়। চাইলে একাধিক প্যারামিটার নিয়েও indexer লেখা যায় (যেমন <code>this[int row, int col]</code> — গ্রিড বা ম্যাট্রিক্স টাইপ ক্লাসে দরকার হয়)।</p>

<h3>৭. Static Classes, Members ও Static Constructor</h3>
<p><span class="kw">static class</span> এমন একটা ক্লাস যা কখনো <code>new</code> দিয়ে instantiate করা যায় না — এর সব মেম্বার অবশ্যই static হতে হবে। এটা ব্যবহার হয় pure utility/helper ফাংশনের সংগ্রহ হিসেবে, যেমন .NET এর নিজস্ব <code>Math</code> ক্লাস।</p>
<pre>public static class MathHelper
{
    public static int Square(int x) =&gt; x * x;
}

<span class="c">// MathHelper কখনো instantiate করা যাবে না — new MathHelper() কম্পাইল এরর দেবে</span>
int result = MathHelper.Square(5);</pre>
<p>সাধারণ (non-static) ক্লাসেও instance member এর পাশাপাশি static member রাখা যায়। Instance member প্রতিটা object এর জন্য আলাদা কপি থাকে, static member পুরো টাইপের জন্য একটাই কপি — সব object মিলে শেয়ার করে।</p>
<p><span class="kw">Static Constructor</span> — <code>static ClassName() { }</code> — একটা বিশেষ কনস্ট্রাক্টর যেটা .NET runtime স্বয়ংক্রিয়ভাবে ঠিক একবার চালায়, আর সেটাও ওই টাইপ প্রথমবার ব্যবহারের ঠিক আগে (কোনো instance বানানোর আগেই, বা কোনো static member প্রথমবার অ্যাক্সেস করার আগে)। এটা খরচসাপেক্ষ static field initialization এর জন্য খুবই কাজের।</p>
<pre>public class ConfigLoader
{
    public static readonly string AppName;

    static ConfigLoader()
    {
        AppName = LoadFromFile(); <span class="c">// প্রথমবার ব্যবহারের ঠিক আগে একবারই রান হয়</span>
    }

    private static string LoadFromFile() =&gt; "StudyHub";
}</pre>
<div class="callout why"><span class="tag">কেন static constructor</span> সাধারণ constructor প্রতিবার <code>new</code> করলেই চলে, কিন্তু static constructor গ্যারান্টি দেয় যে কোনো এক্সপেন্সিভ initialization (ফাইল পড়া, কনফিগ লোড করা) পুরো অ্যাপ্লিকেশন লাইফটাইমে ঠিক একবারই হবে, তাও lazily — টাইপটা আসলেই ব্যবহার না হলে static constructor কখনো চলবেই না।</div>

<h3>৮. Enums এবং <code>[Flags]</code></h3>
<p>মৌলিক enum তো আগেই পরিচিত — একটা নামযুক্ত ধ্রুবক সেট, যেমন <code>enum Status { Pending, Active, Closed }</code>। এখানে ফোকাস করব একটু বিশেষ ব্যবহারে — এমন enum যেখানে একইসাথে একাধিক অপশন বিটওয়াইজভাবে কম্বাইন করা দরকার, যেমন ফাইল পারমিশন।</p>
<pre>[Flags]
public enum Permissions
{
    None = 0,
    Read = 1,
    Write = 2,
    Execute = 4
}

var perms = Permissions.Read | Permissions.Write;

bool canWrite = perms.HasFlag(Permissions.Write); <span class="c">// true</span>
bool canExecute = perms.HasFlag(Permissions.Execute); <span class="c">// false</span></pre>
<p><code>[Flags]</code> অ্যাট্রিবিউট নিজে থেকে বিটওয়াইজ কম্বিনেশন তৈরি করে না — এটা মূলত <code>ToString()</code> কে বলে দেয় কম্বাইন্ড ভ্যালু কীভাবে সুন্দরভাবে দেখাতে হবে (যেমন <code>"Read, Write"</code>)। আসল কাজটা করে প্রতিটা মেম্বারের মান যেন আলাদা আলাদা বিট পজিশনে থাকে — অর্থাৎ ২ এর ঘাত (powers of two)।</p>
<table>
<tr><th>Member</th><th>Decimal</th><th>Binary</th></tr>
<tr><td>None</td><td>0</td><td>000</td></tr>
<tr><td>Read</td><td>1</td><td>001</td></tr>
<tr><td>Write</td><td>2</td><td>010</td></tr>
<tr><td>Execute</td><td>4</td><td>100</td></tr>
</table>
<div class="callout why"><span class="tag">কেন powers of two দরকার</span> প্রতিটা মান আলাদা বিট পজিশনে থাকলেই <code>|</code> (OR) দিয়ে কম্বাইন করা মানগুলো একে অপরের সাথে সংঘর্ষ (collision) ছাড়াই যোগ হয় — <code>Read | Write</code> = <code>001 | 010</code> = <code>011</code> = 3, যেখান থেকে <code>HasFlag</code> নির্ভুলভাবে বলে দিতে পারে কোন কোন বিট সেট আছে। যদি ভুলে <code>Write = 3</code> দেওয়া হতো, তাহলে <code>011</code> এর ভেতর <code>Read</code> এর বিটও (<code>001</code>) মিশে যেত, আর <code>HasFlag(Read)</code> ভুলভাবে true দিয়ে দিত।</div>
<div class="callout mistake"><span class="tag">Common mistake — Flags enum এ ক্রমিক সংখ্যা দেওয়া</span> সাধারণ enum এর অভ্যাসে <code>0, 1, 2, 3</code> এভাবে ক্রমিক মান দিয়ে ফেললে <code>[Flags]</code> enum এ বিটওয়াইজ কম্বিনেশন ভেঙে যায়। সবসময় মান হতে হবে 1, 2, 4, 8, 16... এভাবে — অথবা আগের মানগুলোকে <code>|</code> দিয়ে কম্বাইন করে (যেমন <code>ReadWrite = Read | Write</code>)।</div>

<h3>৯. কাস্টম Iterator — <code>yield return</code></h3>
<p>আগের Collections চ্যাপ্টারে <code>IEnumerable&lt;T&gt;</code> নিয়ে আলোচনা হয়েছিল, কিন্তু নিজে হাতে একটা iterator বানানো তখন দেখানো হয়নি। <span class="kw">yield return</span> ঠিক সেই সুযোগটাই দেয় — এটা দিয়ে এমন একটা মেথড লেখা যায় যেটা <code>IEnumerable&lt;T&gt;</code> রিটার্ন করে, কিন্তু পুরো কালেকশন একসাথে মেমরিতে বানিয়ে রাখে না। বরং প্রতিটা <code>foreach</code> এর প্রতিটা <code>MoveNext()</code> কলে একটা করে মান "yield" (উৎপন্ন) করে দেয়।</p>
<p>যখন কম্পাইলার <code>yield return</code> দেখে, তখন পুরো মেথডটাকে ভেতরে ভেতরে একটা state machine এ রূপান্তর করে ফেলে — অনেকটা Modern C# চ্যাপ্টারে দেখা <code>async</code>/<code>await</code> কীভাবে কম্পাইলার-জেনারেটেড state machine ব্যবহার করে, ঠিক একই ধরনের কৌশল, শুধু উদ্দেশ্য ভিন্ন — এখানে মান lazily একে একে উৎপন্ন করাই লক্ষ্য।</p>
<pre>public static IEnumerable&lt;int&gt; Fibonacci()
{
    int a = 0, b = 1;

    while (true)
    {
        yield return a;
        (a, b) = (b, a + b);
    }
}

foreach (var num in Fibonacci())
{
    if (num &gt; 50) break;
    Console.WriteLine(num);
}</pre>
<p>লক্ষ্য করুন, <code>Fibonacci()</code> মেথডে <code>while (true)</code> — মানে তাত্ত্বিকভাবে অসীম সংখ্যক ভ্যালু উৎপন্ন করতে পারে, কিন্তু এটা কখনো memory উপচে ফেলে না, কারণ প্রতিটা মান দরকার হওয়ার মুহূর্তেই তৈরি হয়, আগে থেকে পুরো লিস্ট বানানো হয় না। <code>foreach</code> লুপে <code>break</code> দেওয়ার সাথে সাথেই বাকি সব ক্যালকুলেশন বন্ধ হয়ে যায়।</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> কম্পাইলার <code>yield return</code> থাকা মেথডটাকে একটা লুকানো ক্লাসে রূপান্তর করে যেটা <code>IEnumerator&lt;T&gt;</code> ইমপ্লিমেন্ট করে, আর প্রতিটা <code>MoveNext()</code> কলে ঠিক পরের <code>yield return</code> পর্যন্ত এক্সিকিউট করে থামে, অবস্থা (local variable, কোথায় থামল) মনে রাখে, তারপর পরের কলে সেখান থেকেই আবার শুরু করে। এই "মাঝপথে থেমে, অবস্থা মনে রেখে, পরে আবার চালু হওয়া" ধারণাটা <code>async</code>/<code>await</code> এর state machine এর সাথে দর্শনগতভাবে একই পরিবারের।</div>
<p>এই lazy, এক-এক-করে-উৎপন্ন-হওয়া আচরণটাই পরের LINQ চ্যাপ্টারের <span class="kw">Deferred Execution</span> ধারণার নিকট আত্মীয় — LINQ এর <code>Where</code>, <code>Select</code> ইত্যাদির ভেতরেও ঠিক এই <code>yield return</code> কৌশলই ব্যবহার করা হয়, ফলে পুরো chain টা ততক্ষণ কিছুই কম্পিউট করে না যতক্ষণ না আপনি আসলে ফলাফল iterate করেন (যেমন <code>foreach</code> বা <code>ToList()</code> দিয়ে)।</p>
</template>
