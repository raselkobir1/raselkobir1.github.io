<h2 class="title">৬. LINQ — Query ও Method Syntax</h2>
<p class="lead">LINQ (Language Integrated Query) হলো C#-এর একটা বিল্ট-ইন ফিচার, যেটা দিয়ে আমরা সরাসরি C# কোডের ভেতরে SQL-এর মতো ডিক্লারেটিভ স্টাইলে কালেকশন query করতে পারি। কোনো <code>List&lt;T&gt;</code>, array, বা অন্য যেকোনো <code>IEnumerable&lt;T&gt;</code> থেকে filter, sort, group, join করা — সবকিছুই এখন loop আর if-condition দিয়ে ম্যানুয়ালি লেখার বদলে একটামাত্র expressive statement দিয়ে করা যায়।</p>

<h3>১. LINQ কী এবং কেন দরকার</h3>
<p>LINQ ছাড়া একটা লিস্ট ফিল্টার করে sort করতে হলে আমাদের <span class="kw">foreach</span> লুপ, temporary লিস্ট, আর manual comparison লজিক লিখতে হতো। LINQ এই পুরো প্যাটার্নটাকে standard operator-এর একটা সেটে (<code>Where</code>, <code>Select</code>, <code>OrderBy</code> ইত্যাদি) প্যাক করে দিয়েছে, যেগুলো যেকোনো <code>IEnumerable&lt;T&gt;</code>-এর উপর কাজ করে।</p>
<p>LINQ মূলত দুই ধরনের ডেটা সোর্সের উপর কাজ করে —</p>
<ul>
<li><b>IEnumerable&lt;T&gt;</b> — in-memory কালেকশন (List, Array, Dictionary...)। এখানে query কম্পাইল হয়ে সাধারণ C# delegate/lambda-তে পরিণত হয় এবং সরাসরি মেমোরিতে execute হয়।</li>
<li><b>IQueryable&lt;T&gt;</b> — যেমন Entity Framework Core-এর DbSet। এখানে query একটা <b>expression tree</b>-তে রূপান্তরিত হয়, যেটা পরে provider (EF Core) SQL-এ ট্রান্সলেট করে ডাটাবেজে পাঠায়। এই টপিকটা নিয়ে বিস্তারিত আলোচনা হবে পরের EF Core চ্যাপ্টারে।</li>
</ul>
<div class="callout why"><span class="tag">কেন গুরুত্বপূর্ণ</span> LINQ শুধু কোড ছোট করে না — এটা কোডকে declarative বানায়, মানে আপনি বলছেন "আমার <b>কী</b> দরকার", "<b>কীভাবে</b> বের করবে" সেটা runtime নিজে বুঝে নেয়। ফলে কোড পড়া, টেস্ট করা এবং maintain করা অনেক সহজ হয়।</div>

<h3>২. Query Syntax বনাম Method Syntax</h3>
<p>একই query দুইভাবে লেখা যায় — SQL-এর মতো দেখতে <span class="kw">query syntax</span>, অথবা lambda-ভিত্তিক <span class="kw">method syntax</span>। কম্পাইলার query syntax-কে ভেতরে ভেতরে method syntax-এই রূপান্তর করে ফেলে — দুটো আসলে সম্পূর্ণ identical IL কোড তৈরি করে।</p>
<p><b>Query syntax</b>:</p>
<pre>var result = from p in products
             where p.Price &gt; 100
             orderby p.Name
             select p.Name;</pre>
<p><b>ঠিক একই কাজের Method syntax</b>:</p>
<pre>var result = products
    .Where(p =&gt; p.Price &gt; 100)
    .OrderBy(p =&gt; p.Name)
    .Select(p =&gt; p.Name);</pre>
<div class="callout behind"><span class="tag">ভেতরে কী ঘটে</span> কম্পাইলার query syntax দেখলে সেটাকে <code>Where</code>, <code>OrderBy</code>, <code>Select</code>-এর chained method call-এ রূপান্তর করে দেয় — দুটো ব্লক থেকে একদম একই IL কোড জেনারেট হয়। তাই performance-এ কোনো পার্থক্য নেই।</div>
<p>বাস্তব প্রজেক্টে <b>method syntax</b> বেশি ব্যবহৃত হয়, কারণ এটা chaining-friendly, IntelliSense ভালো সাপোর্ট করে, এবং <code>GroupBy</code>-এর পরে আরেকটা operator চেইন করা query syntax-এর চেয়ে সহজ। query syntax সাধারণত জটিল <code>join</code> বা multiple <code>from</code>-এর ক্ষেত্রে বেশি readable হয়।</p>

<h3>৩. প্রচলিত LINQ অপারেটরসমূহ</h3>
<table>
<tr><th>Operator</th><th>কাজ</th></tr>
<tr><td><code>Where</code></td><td>শর্ত অনুযায়ী ফিল্টার করে</td></tr>
<tr><td><code>Select</code></td><td>প্রতিটা আইটেমকে নতুন shape/টাইপে ম্যাপ করে (projection)</td></tr>
<tr><td><code>OrderBy</code> / <code>OrderByDescending</code></td><td>ascending/descending sort করে</td></tr>
<tr><td><code>GroupBy</code></td><td>কোনো key অনুযায়ী গ্রুপ করে</td></tr>
<tr><td><code>Join</code></td><td>দুটো সিকোয়েন্সকে key মিলিয়ে জোড়া লাগায় (SQL INNER JOIN-এর মতো)</td></tr>
<tr><td><code>Aggregate</code></td><td>কাস্টম accumulator দিয়ে পুরো সিকোয়েন্সকে একটা মানে রিডিউস করে</td></tr>
<tr><td><code>First</code> / <code>FirstOrDefault</code></td><td>প্রথম মিলে যাওয়া আইটেম রিটার্ন করে (খালি হলে যথাক্রমে exception বা default)</td></tr>
<tr><td><code>Single</code> / <code>SingleOrDefault</code></td><td>ঠিক একটাই মিল আশা করে — একের বেশি মিললে exception</td></tr>
<tr><td><code>Any</code> / <code>All</code></td><td>কোনো/সব আইটেম শর্ত পূরণ করে কিনা বুল চেক করে</td></tr>
<tr><td><code>Count</code></td><td>মোট আইটেম সংখ্যা গোনে</td></tr>
<tr><td><code>Sum</code> / <code>Average</code> / <code>Max</code> / <code>Min</code></td><td>সংখ্যাগত হিসাব (যোগফল, গড়, সর্বোচ্চ, সর্বনিম্ন)</td></tr>
</table>
<p><b>GroupBy উদাহরণ</b> — পণ্যকে ক্যাটাগরি অনুযায়ী গ্রুপ করা:</p>
<pre>var groups = products.GroupBy(p =&gt; p.Category);
foreach (var g in groups)
{
    Console.WriteLine($"{g.Key}: {g.Count()} items");
}</pre>
<p><b>Join উদাহরণ</b> — orders আর customers কে জোড়া লাগানো:</p>
<pre>var query = orders.Join(customers,
    o =&gt; o.CustomerId,
    c =&gt; c.Id,
    (o, c) =&gt; new { c.Name, o.Total });</pre>
<p><b>Aggregate উদাহরণ</b> — কমা দিয়ে জোড়া লাগানো স্ট্রিং তৈরি:</p>
<pre>var csv = names.Aggregate((acc, n) =&gt; acc + ", " + n);</pre>

<h3>৪. Deferred Execution বনাম Immediate Execution</h3>
<p>LINQ-এর সবচেয়ে গুরুত্বপূর্ণ এবং সবচেয়ে বেশি ভুল বোঝা concept হলো <span class="kw">Deferred Execution</span>। <code>Where</code>, <code>Select</code>, <code>OrderBy</code> ইত্যাদি operator দিয়ে যখন একটা query তৈরি করা হয়, তখন query তৎক্ষণাৎ execute হয় না — শুধু query-টার একটা "প্ল্যান" তৈরি হয়ে থাকে। এটা আসলে চলে তখনই, যখন আপনি এটাকে enumerate করেন — অর্থাৎ <span class="kw">foreach</span> দিয়ে ঘুরান, অথবা <code>.ToList()</code>, <code>.ToArray()</code>, <code>.Count()</code>, <code>.First()</code>-এর মতো কোনো materializing call করেন।</p>
<pre>var numbers = new List&lt;int&gt; { 1, 2, 3 };

<span class="c">// query এখানে define হলো, কিন্তু এখনো চলেনি</span>
var query = numbers.Where(n =&gt; n &gt; 1);

numbers.Add(4); <span class="c">// underlying list পরিবর্তন করা হলো</span>

foreach (var n in query)
{
    Console.WriteLine(n); <span class="c">// আউটপুট: 2, 3, 4 — Add(4) সহ!</span>
}</pre>
<p>লক্ষ্য করুন — <code>query</code> define করার পরে <code>numbers</code>-এ <code>4</code> যোগ করা হয়েছে, তবুও ফলাফলে <code>4</code> চলে এসেছে। কারণ <code>foreach</code> চালানোর মুহূর্তেই query আসলে execute হয়েছে, define করার সময় নয়।</p>
<div class="callout behind"><span class="tag">ভেতরে কী ঘটে</span> <code>Where</code>, <code>Select</code>-এর মতো operator গুলো ভেতরে ভেতরে একটা iterator (state machine) রিটার্ন করে, যেটা লজিক মনে রাখে কিন্তু কিছুই এক্সিকিউট করে না — যতক্ষণ না কেউ <code>MoveNext()</code> কল করে (যা <code>foreach</code> নিজে থেকেই করে)। এটাই deferred execution-এর আসল প্রক্রিয়া।</div>

<h3>৫. Multiple Enumeration-এর ফাঁদ</h3>
<p>Deferred execution-এর একটা বিপজ্জনক দিক হলো — যদি একই deferred query দুইবার enumerate করা হয় (যেমন একবার <code>.Any()</code> দিয়ে চেক করা, তারপর <code>foreach</code>-এ আবার ঘুরানো), তাহলে পুরো pipeline প্রতিবারই শুরু থেকে আবার চলে। ইন-মেমোরি লিস্টের জন্য এটা তেমন সমস্যা না হলেও, যদি সোর্স হয় একটা ধীরগতির computed sequence, external API call, অথবা ডাটাবেজ query (IQueryable), তাহলে এটা মারাত্মক পারফরম্যান্স সমস্যা তৈরি করে — কারণ পুরো ব্যয়বহুল অপারেশনটা একাধিকবার রান হয়।</p>
<pre>var expensiveQuery = data.Where(x =&gt; SlowCheck(x));

if (expensiveQuery.Any())         <span class="c">// পুরো pipeline ১ম বার চললো</span>
{
    foreach (var item in expensiveQuery) <span class="c">// পুরো pipeline আবার ২য় বার চললো</span>
    {
        Process(item);
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — multiple enumeration</span> একই deferred query একাধিকবার ব্যবহার করলে প্রতিবার পুরো ফিল্টার/ম্যাপ লজিক নতুন করে চলে — শুধু performance loss-ই না, সোর্স ডেটা যদি এর মধ্যে বদলে যায় (যেমন উপরের উদাহরণের মতো), তাহলে দুইবার আলাদা ফলাফলও পেতে পারেন।</div>
<div class="callout best"><span class="tag">Best practice — একবার materialize করুন</span> যখনই কোনো query-এর ফলাফল একাধিকবার ব্যবহার করতে হবে, তখন <code>.ToList()</code> বা <code>.ToArray()</code> দিয়ে একবার materialize করে ফেলুন, তারপর সেই materialized লিস্ট নিয়ে যত খুশি কাজ করুন — pipeline আর দ্বিতীয়বার চলবে না।
<pre>var results = data.Where(x =&gt; SlowCheck(x)).ToList(); <span class="c">// একবারই execute হলো</span>

if (results.Any())
{
    foreach (var item in results) Process(item);
}</pre>
</div>

<h3>৬. IEnumerable বনাম IQueryable</h3>
<p><code>IEnumerable&lt;T&gt;</code> এবং <code>IQueryable&lt;T&gt;</code> দেখতে প্রায় একই রকম মনে হলেও এদের execution model একদম আলাদা, আর এটা বুঝতে না পারলে অজান্তেই বড় পারফরম্যান্স সমস্যা তৈরি হতে পারে।</p>
<ul>
<li><b>IEnumerable&lt;T&gt;</b> — operator গুলো কম্পাইল হয় সাধারণ delegate-এ, এবং সব লজিক মেমোরিতে, ইতিমধ্যে load হওয়া ডেটার উপর চলে।</li>
<li><b>IQueryable&lt;T&gt;</b> — operator গুলো তৈরি করে একটা <b>expression tree</b>, যেটা কোনো provider (যেমন EF Core) পড়ে সমতুল্য SQL-এ ট্রান্সলেট করে এবং শুধু প্রয়োজনীয় ডেটাটুকু ডাটাবেজ থেকে নিয়ে আসে।</li>
</ul>
<p>পার্থক্যটা practical দিক থেকে খুব গুরুত্বপূর্ণ: <code>IQueryable</code>-এর উপর <code>.Where()</code> কল করলে ফিল্টারিং হয় ডাটাবেজের ভেতরে (WHERE clause হিসেবে), কিন্তু সেই একই ডেটা যদি আগেই <code>.ToList()</code> দিয়ে <code>IEnumerable</code>-এ নামিয়ে আনা হয়, তাহলে <code>.Where()</code> চলে সব রো মেমোরিতে আনার পরে — অর্থাৎ পুরো টেবিল মেমোরিতে লোড হয়ে যায়, তারপর ফিল্টার হয়।</p>
<div class="callout behind"><span class="tag">সামনে যা আসছে</span> <code>IQueryable</code>-এর expression tree translation, এবং এখান থেকে তৈরি হওয়া কুখ্যাত <b>N+1 query problem</b> নিয়ে বিস্তারিত আলোচনা হবে EF Core চ্যাপ্টারে।</div>

<h3>৭. সাধারণ ভুলগুলো</h3>
<p>নতুন এবং অভিজ্ঞ দুই ধরনের ডেভেলপারই কিছু নির্দিষ্ট LINQ ভুল বারবার করে থাকেন।</p>
<div class="callout mistake"><span class="tag">Common mistake — Count() আর ToList() দুইবার execute</span> একই ব্যয়বহুল query-এর উপর প্রথমে <code>.Count()</code> কল করে তারপর আবার <code>.ToList()</code> কল করলে পুরো query pipeline দুইবার চলে। সমাধান — আগে <code>.ToList()</code> দিয়ে materialize করুন, তারপর সেই লিস্টের উপর <code>.Count</code> প্রপার্টি ব্যবহার করুন।
<pre>var list = query.ToList();
int total = list.Count; <span class="c">// আর query আবার চলবে না</span></pre>
</div>
<div class="callout mistake"><span class="tag">Common mistake — First() বনাম FirstOrDefault()</span> <code>.First()</code> কালেকশন খালি হলে <span class="kw">InvalidOperationException</span> থ্রো করে, আর <code>.FirstOrDefault()</code> খালি হলে <code>default(T)</code> রিটার্ন করে — reference type-এর জন্য যেটা <span class="kw">null</span>। ভুলটা হয় যখন ডেভেলপার <code>FirstOrDefault()</code>-এর রেজাল্ট null চেক না করে সরাসরি ব্যবহার করে ফেলেন, ফলে পরে <span class="kw">NullReferenceException</span> পড়েন।
<pre>var user = users.FirstOrDefault(u =&gt; u.Id == id);
Console.WriteLine(user.Name); <span class="c">// user null হলে এখানেই crash</span></pre>
</div>
<p>নিয়ম মনে রাখা সহজ: যখন আপনি নিশ্চিত যে ফলাফল থাকবেই, <code>.First()</code>/<code>.Single()</code> ব্যবহার করুন যাতে সমস্যা হলে দ্রুত fail হয়ে যায়; যখন না-থাকাটাও একটা স্বাভাবিক সম্ভাবনা, তখন <code>.FirstOrDefault()</code> ব্যবহার করুন — কিন্তু সাথে সাথেই null চেক করে নিন।</p>
</template>

<template data-page="delegates">
<h2 class="title">৭. Delegate · Event · Lambda</h2>
<p class="lead">Delegate হলো C#-এর টাইপ-সেফ ফাংশন পয়েন্টার — একটি ভ্যারিয়েবল যেটা কোনো মেথডের রেফারেন্স ধরে রাখে এবং পরে সেই মেথডকে কল করতে পারে। এই ধারণার উপর ভিত্তি করেই তৈরি হয়েছে lambda expression, LINQ, আর event — এই অধ্যায়ে আমরা এই তিনটে জিনিস কীভাবে একসাথে কাজ করে সেটা দেখব।</p>

<h3>১. Delegate কী — টাইপ-সেফ ফাংশন পয়েন্টার</h3>
<p><span class="kw">Delegate</span> হলো এমন একটা টাইপ যেটা নির্দিষ্ট সিগনেচারের (return type + parameter list) মেথড রেফারেন্স রাখতে পারে। C++-এর ফাংশন পয়েন্টারের মতো হলেও এটা টাইপ-সেফ — ভুল সিগনেচারের মেথড অ্যাসাইন করলে কম্পাইল টাইমেই এরর দেবে।</p>
<pre><span class="c">// delegate টাইপ ডিক্লেয়ার করা</span>
public delegate int Calculator(int a, int b);

public class MathOps
{
    public static int Add(int a, int b) =&gt; a + b;
    public static int Multiply(int a, int b) =&gt; a * b;
}

<span class="c">// ব্যবহার</span>
Calculator op = MathOps.Add;   <span class="c">// মেথড অ্যাসাইন করা হলো</span>
int result = op(3, 4);         <span class="c">// invoke — result = 7</span>

op = MathOps.Multiply;         <span class="c">// একই ভ্যারিয়েবলে অন্য মেথড</span>
result = op(3, 4);             <span class="c">// result = 12</span></pre>
<p>লক্ষ্য করুন — <code>op</code> ভ্যারিয়েবলটা কোনো ডেটা ধরে রাখছে না, ধরে রাখছে একটা মেথডের রেফারেন্স। <span class="kw">Delegate</span> multicast-ও হতে পারে — <code>+=</code> দিয়ে একাধিক মেথড একসাথে জুড়ে দেওয়া যায়, invoke করলে সবগুলো ক্রমানুসারে কল হয়।</p>

<h3>২. Built-in delegate টাইপ — Func, Action, Predicate</h3>
<p>প্রতিটা কাজের জন্য নতুন <span class="kw">delegate</span> টাইপ ডিক্লেয়ার করা এখন প্রায় দরকারই হয় না, কারণ .NET-এ তিনটা জেনেরিক delegate টাইপ আগে থেকেই দেওয়া আছে।</p>
<table>
<tr><th>টাইপ</th><th>রিটার্ন ভ্যালু</th><th>ব্যবহার</th></tr>
<tr><td><code>Action&lt;T&gt;</code></td><td>নেই (void)</td><td>শুধু কোনো কাজ করবে, কিছু ফেরত দেবে না</td></tr>
<tr><td><code>Func&lt;T, TResult&gt;</code></td><td>আছে</td><td>ইনপুট নিয়ে একটা ভ্যালু হিসাব করে ফেরত দেবে</td></tr>
<tr><td><code>Predicate&lt;T&gt;</code></td><td><code>bool</code></td><td>একটা কন্ডিশন/শর্ত টেস্ট করবে (true/false)</td></tr>
</table>
<pre>Action&lt;string&gt; greet = name =&gt; Console.WriteLine($"হ্যালো, {name}");
greet("রাসেল");                      <span class="c">// কিছু রিটার্ন করে না</span>

Func&lt;int, int, int&gt; add = (a, b) =&gt; a + b;
int sum = add(5, 7);                  <span class="c">// sum = 12, রিটার্ন ভ্যালু আছে</span>

Predicate&lt;int&gt; isEven = n =&gt; n % 2 == 0;
bool check = isEven(10);              <span class="c">// true — শর্ত টেস্ট</span></pre>
<div class="callout why"><span class="tag">কেন এভাবে</span> <code>Func</code>, <code>Action</code>, <code>Predicate</code> জেনেরিক বলে যেকোনো প্যারামিটার/রিটার্ন টাইপের জন্য পুনর্ব্যবহারযোগ্য — তাই আলাদা <span class="kw">delegate</span> টাইপ ডিক্লেয়ার করার দরকার প্রায় শেষ হয়ে গেছে। শুধু যখন কাস্টম নাম, অতিরিক্ত সেমান্টিক অর্থ, অথবা <code>ref</code>/<code>out</code> প্যারামিটার দরকার হয়, তখনই কাস্টম delegate ডিক্লেয়ার করা হয়।</div>

<h3>৩. Lambda expression — সংক্ষিপ্ত সিনট্যাক্স-এর বিবর্তন</h3>
<p>প্রথমে ছিল anonymous method, তারপর এলো আরও সংক্ষিপ্ত lambda expression। দুটোই একই জিনিস করে — নাম ছাড়া একটা মেথড বডি তৈরি করে delegate-এ অ্যাসাইন করা।</p>
<pre><span class="c">// পুরনো ধাঁচ: anonymous method (C# 2.0)</span>
Func&lt;int, int&gt; doubleOld = delegate(int x) { return x * 2; };

<span class="c">// নতুন ধাঁচ: lambda expression (C# 3.0+)</span>
Func&lt;int, int&gt; doubleNew = x =&gt; x * 2;

<span class="c">// মাল্টি-লাইন lambda বডি</span>
Func&lt;int, int, string&gt; describe = (a, b) =&gt;
{
    int sum = a + b;
    return $"যোগফল: {sum}";
};</pre>
<p>আগের LINQ অধ্যায়ে আমরা দেখেছি <code>Where</code>, <code>Select</code>, <code>OrderBy</code>-এর মতো মেথডগুলো আসলে <code>Func&lt;T, bool&gt;</code> বা <code>Func&lt;T, TResult&gt;</code> টাইপের delegate প্যারামিটার নেয়। lambda expression সেই delegate-গুলোকে ইনলাইনে, সংক্ষিপ্তভাবে লেখার উপায়:</p>
<pre>var adults = people.Where(p =&gt; p.Age &gt;= 18)
                    .Select(p =&gt; p.Name);</pre>

<h3>৪. Closure — এনক্লোজিং স্কোপের ভ্যারিয়েবল ধরে রাখা</h3>
<p>একটা lambda তার চারপাশের (enclosing) স্কোপের কোনো ভ্যারিয়েবল ব্যবহার করলে, সেই lambda সেই ভ্যারিয়েবলটাকে "ক্যাপচার" করে — একে বলে <span class="kw">closure</span>। ফলাফল হলো, ঐ ভ্যারিয়েবল যতক্ষণ delegate-টা বেঁচে থাকে ততক্ষণ বেঁচে থাকে, এমনকি যে মেথডে ভ্যারিয়েবলটা ডিক্লেয়ার হয়েছিল সেটা রিটার্ন করে গেলেও।</p>
<pre>Func&lt;int&gt; MakeCounter()
{
    int count = 0;
    return () =&gt; ++count;   <span class="c">// count কে ক্যাপচার করলো</span>
}

var counter = MakeCounter();
Console.WriteLine(counter()); <span class="c">// 1</span>
Console.WriteLine(counter()); <span class="c">// 2 — count এখনো বেঁচে আছে!</span></pre>
<p><b>ক্লাসিক লুপ গোচা:</b> পুরনো C#-এ <code>for</code> লুপের ইনডেক্স ভ্যারিয়েবল একটাই ইনস্ট্যান্স হিসেবে শেয়ার হতো, তাই লুপের ভেতর তৈরি সব lambda একই ভ্যারিয়েবল ক্যাপচার করতো:</p>
<pre><span class="c">// foreach: C# 5.0 থেকে প্রতি ইটারেশনে নতুন ভ্যারিয়েবল, তাই এটা ঠিকঠাক কাজ করে</span>
var actions1 = new List&lt;Action&gt;();
foreach (var i in new[] { 1, 2, 3 })
    actions1.Add(() =&gt; Console.WriteLine(i));
foreach (var a in actions1) a();
<span class="c">// আউটপুট: 1  2  3  (প্রত্যাশিত মতোই)</span>

<span class="c">// for লুপ: index একটাই শেয়ার্ড ভ্যারিয়েবল — সবাই একে ক্যাপচার করে</span>
var actions2 = new List&lt;Action&gt;();
for (int i = 0; i &lt; 3; i++)
    actions2.Add(() =&gt; Console.WriteLine(i));
foreach (var a in actions2) a();
<span class="c">// আউটপুট: 3  3  3  (গোচা! i শেষে 3 হয়ে থেমেছিল, সবাই সেই একই i ক্যাপচার করেছে)</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — for লুপে শেয়ার্ড index ক্যাপচার</span> C# 5.0 থেকে <code>foreach</code>-এর লুপ ভ্যারিয়েবল প্রতি ইটারেশনে নতুন করে স্কোপ হয় বলে সেখানে ক্যাপচার সমস্যা হয় না, কিন্তু <code>for</code> লুপে ঘোষিত index ভ্যারিয়েবল পুরো লুপ জুড়ে একটাই ইনস্ট্যান্স থেকে যায়। সমাধান হলো লুপের ভেতরে একটা লোকাল কপি বানানো: <code>for (int i = 0; i &lt; 3; i++) { int local = i; actions2.Add(() =&gt; Console.WriteLine(local)); }</code></div>

<h3>৫. Event — publisher/subscriber প্যাটার্ন</h3>
<p><span class="kw">Event</span> হলো delegate-ভিত্তিক একটা মেকানিজম যেখানে একটা ক্লাস (publisher) নোটিফিকেশন পাঠায়, আর অন্য ক্লাস (subscriber) সেই নোটিফিকেশন শোনে। কনভেনশন অনুযায়ী <code>EventHandler</code> বা <code>EventHandler&lt;TEventArgs&gt;</code> ব্যবহার করা হয়, যেখানে হ্যান্ডলারের সিগনেচার সবসময় <code>(object sender, TEventArgs e)</code>।</p>
<pre>public class OrderEventArgs : EventArgs
{
    public string OrderId { get; init; } = "";
}

public class OrderProcessor
{
    <span class="c">// event keyword দিয়ে ঘোষণা</span>
    public event EventHandler&lt;OrderEventArgs&gt;? OrderCompleted;

    public void Process(string orderId)
    {
        Console.WriteLine($"অর্ডার প্রসেস হচ্ছে: {orderId}");
        <span class="c">// ইভেন্ট রেইজ করা — সাবস্ক্রাইবার থাকলে তবেই কল হবে</span>
        OrderCompleted?.Invoke(this, new OrderEventArgs { OrderId = orderId });
    }
}

<span class="c">// Subscriber</span>
var processor = new OrderProcessor();
processor.OrderCompleted += (sender, e) =&gt;
    Console.WriteLine($"নোটিফিকেশন: অর্ডার {e.OrderId} সম্পন্ন হয়েছে");

processor.Process("ORD-101");
<span class="c">// unsubscribe করতে হলে:
// processor.OrderCompleted -= handlerMethod;</span></pre>

<h3>৬. event কেন — শুধু delegate ফিল্ড যথেষ্ট নয় কেন</h3>
<p>প্রশ্ন উঠতে পারে — <code>public EventHandler OrderCompleted;</code> সরাসরি public delegate ফিল্ড হিসেবে রাখলেই তো হতো, আলাদা <span class="kw">event</span> কিওয়ার্ড কেন দরকার?</p>
<div class="callout why"><span class="tag">event কিওয়ার্ডের আসল কারণ</span> একটা public delegate ফিল্ড এক্সপোজ করলে বাইরের যেকোনো কোড <code>Invoke()</code> সরাসরি কল করে ইভেন্ট রেইজ করতে পারবে (যেটা শুধু publisher-এর করার কথা), এবং আরও খারাপ — <code>obj.OrderCompleted = someHandler;</code> লিখে <code>=</code> দিয়ে সব বিদ্যমান সাবস্ক্রাইবারকে মুছে নিজের হ্যান্ডলার বসিয়ে দিতে পারবে। <code>event</code> কিওয়ার্ড এই ফিল্ডকে এনক্যাপসুলেট করে — ক্লাসের বাইরে থেকে শুধু <code>+=</code> আর <code>-=</code> ব্যবহার করা যায়, <code>Invoke()</code> কল করা বা <code>=</code> দিয়ে ওভাররাইট করা যায় না।</div>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> কম্পাইলার <code>event</code> ফিল্ডের জন্য প্রাইভেট backing delegate ফিল্ড আর পাবলিক <code>add</code>/<code>remove</code> অ্যাক্সেসর জেনারেট করে — অনেকটা প্রপার্টির <code>get</code>/<code>set</code>-এর মতো, শুধু এখানে অ্যাক্সেসরগুলোর নাম <code>add</code>/<code>remove</code> আর ভেতরে থ্রেড-সেফ combine/remove লজিক থাকে।</div>

<h3>৭. Common mistake — unsubscribe না করার কারণে memory leak</h3>
<p>Event subscribe করার পর যদি subscriber অবজেক্টের লাইফটাইম শেষ হয়ে যায় কিন্তু <code>-=</code> দিয়ে unsubscribe না করা হয়, তাহলে publisher ক্লাসটা এখনো সেই subscriber-এর রেফারেন্স ধরে রাখে (delegate-এর ভেতরে)। গার্বেজ কালেক্টর একটা অবজেক্টকে কালেক্ট করতে পারে না যতক্ষণ তার দিকে কোনো লাইভ রেফারেন্স থাকে — এটাই .NET-এর ক্লাসিক event memory leak প্যাটার্ন।</p>
<pre>public class Subscriber : IDisposable
{
    private readonly OrderProcessor _processor;

    public Subscriber(OrderProcessor processor)
    {
        _processor = processor;
        _processor.OrderCompleted += OnOrderCompleted;
    }

    private void OnOrderCompleted(object? sender, OrderEventArgs e) { /* ... */ }

    public void Dispose()
    {
        _processor.OrderCompleted -= OnOrderCompleted;  <span class="c">// জরুরি!</span>
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — event unsubscribe ভুলে যাওয়া</span> যদি Subscriber বাতিল করে দেওয়া হয় কিন্তু publisher দীর্ঘদিন বেঁচে থাকে (যেমন singleton বা static event), তাহলে subscriber কখনোই GC হবে না — কারণ publisher-এর delegate তালিকায় এখনো তার রেফারেন্স আছে। এভাবে একের পর এক ফেলে দেওয়া অবজেক্ট মেমরিতে জমতে থাকে।</div>
<div class="callout best"><span class="tag">Best practice — লাইফসাইকেল মেনে unsubscribe</span> <code>IDisposable</code> ইমপ্লিমেন্ট করে <code>Dispose()</code>-এর ভেতর <code>-=</code> কল করুন, অথবা short-lived subscriber-এর জন্য weak event প্যাটার্ন (যেমন WPF-এর <code>WeakEventManager</code>) ব্যবহার করুন যেটা weak reference রাখে বলে subscriber GC হতে বাধা দেয় না।</div>
</template>
<template data-page="exceptions">
<h2 class="title">৮. Exception Handling</h2>
<p class="lead">প্রোগ্রামে সবসময় সবকিছু পরিকল্পনামতো চলে না — ফাইল না পাওয়া যেতে পারে, নেটওয়ার্ক কল ফেইল করতে পারে, ইউজার ভুল ইনপুট দিতে পারে। C# এ এই অপ্রত্যাশিত পরিস্থিতিগুলো সামলানোর জন্য আছে <span class="kw">try/catch/finally</span> এবং <span class="kw">Exception</span> hierarchy। এই chapter এ আমরা দেখব কীভাবে সঠিকভাবে exception handle করতে হয়, কোন common mistake গুলো এড়াতে হয়, এবং কখন exception ব্যবহারই করা উচিত না।</p>

<h3>৭.১ try/catch/finally — বেসিক গঠন</h3>
<p><span class="kw">try</span> block এ আমরা এমন কোড রাখি যেখানে exception হওয়ার সম্ভাবনা আছে। <span class="kw">catch</span> block সেই exception ধরে এবং handle করে। আর <span class="kw">finally</span> block সবসময় execute হয় — exception হোক বা না হোক, এমনকি <span class="kw">try</span> বা <span class="kw">catch</span> এর ভেতরে <span class="kw">return</span> statement থাকলেও।</p>
<pre>static string ReadFirstLine(string path)
{
    try
    {
        var reader = new System.IO.StreamReader(path);
        return reader.ReadLine(); <span class="c">// try তে return থাকলেও finally চলবে</span>
    }
    catch (System.IO.FileNotFoundException ex)
    {
        Console.WriteLine($"ফাইল পাওয়া যায়নি: {ex.Message}");
        return null;
    }
    finally
    {
        Console.WriteLine("এই লাইনটি সবসময় প্রিন্ট হবে");
    }
}</pre>
<p>মনে রাখা জরুরি — যদি কোনো exception catch না হয় (কোনো matching <span class="kw">catch</span> block না থাকে), তবুও <span class="kw">finally</span> block আগে execute হয়ে যাবে, তারপর exception টি উপরের caller এর দিকে propagate করবে। <span class="kw">finally</span> মূলত resource cleanup (file close, connection close ইত্যাদি) এর জন্য ব্যবহৃত হয়।</p>
<div class="callout why"><span class="tag">কেন এমন</span> finally গ্যারান্টি দেয় যে cleanup code বাদ পড়বে না — চাই সফলভাবে কাজ শেষ হোক, exception আসুক, বা try/catch এ return থাকুক। এটাই এর মূল উদ্দেশ্য।</div>

<h3>৭.২ Exception hierarchy এবং common built-in exceptions</h3>
<p>C# এর সব exception <span class="kw">System.Exception</span> ক্লাস থেকে inherit করে। .NET framework এ অনেক built-in exception type আছে যেগুলো নির্দিষ্ট পরিস্থিতির জন্য ব্যবহৃত হয়।</p>
<table>
<tr><th>Exception</th><th>কখন throw হয়</th></tr>
<tr><td><code>ArgumentException</code></td><td>method এ ভুল argument পাঠানো হলে</td></tr>
<tr><td><code>ArgumentNullException</code></td><td>argument হিসেবে null পাঠানো হলে, যেখানে null গ্রহণযোগ্য নয়</td></tr>
<tr><td><code>InvalidOperationException</code></td><td>object এর বর্তমান state এ operation টি বৈধ না হলে</td></tr>
<tr><td><code>NullReferenceException</code></td><td>null reference এর উপর member access করার চেষ্টা করলে</td></tr>
<tr><td><code>IndexOutOfRangeException</code></td><td>array/collection এর বৈধ সীমার বাইরে index access করলে</td></tr>
</table>
<p>নিজস্ব business logic এর জন্য custom exception class বানানো যায়, যা <span class="kw">Exception</span> থেকে inherit করে এবং base constructor call করে:</p>
<pre>public class InsufficientBalanceException : Exception
{
    public decimal Shortfall { get; }

    public InsufficientBalanceException(string message, decimal shortfall)
        : base(message) <span class="c">// base constructor কে message পাঠানো হচ্ছে</span>
    {
        Shortfall = shortfall;
    }
}

<span class="c">// ব্যবহার</span>
if (balance &lt; amount)
{
    throw new InsufficientBalanceException("পর্যাপ্ত ব্যালেন্স নেই", amount - balance);
}</pre>
<div class="callout best"><span class="tag">Best practice — নামকরণ</span> custom exception ক্লাসের নাম সবসময় <code>Exception</code> দিয়ে শেষ করুন এবং কমপক্ষে একটি constructor রাখুন যা <code>base(message)</code> call করে, যাতে <code>.Message</code> property ঠিকমতো কাজ করে।</div>

<h3>৭.৩ নির্দিষ্ট vs সাধারণ exception catch করা</h3>
<p>অনেকেই সহজ সমাধান হিসেবে সবসময় <span class="kw">catch (Exception ex)</span> লিখে ফেলেন, ভেবে নেন এতে "সব সমস্যা" ধরা পড়বে। কিন্তু এটি প্রায়ই ভুল approach — এটি এমন bug ও গিলে ফেলে যেগুলো আপনি প্রত্যাশাই করেননি, ফলে আসল সমস্যা লুকিয়ে যায় এবং debug করা কঠিন হয়ে পড়ে।</p>
<p>এর বদলে, আপনি যে exception type গুলো নিয়ে অর্থপূর্ণভাবে কিছু করতে পারবেন শুধু সেগুলোই catch করুন, আর বাকি সব উপরে propagate হতে দিন — কারণ caller বা logging middleware হয়তো সেগুলো আরও ভালোভাবে handle করতে পারবে।</p>
<pre>try
{
    var config = LoadConfigFile(path);
}
catch (System.IO.FileNotFoundException)
{
    config = GetDefaultConfig(); <span class="c">// এই নির্দিষ্ট কেস নিয়ে আমরা কিছু করতে পারি</span>
}
<span class="c">// অন্য যেকোনো exception (যেমন OutOfMemoryException) স্বাভাবিকভাবেই propagate হবে</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — সব ধরে ফেলা</span> <code>catch (Exception ex) { }</code> এর মতো খালি বা শুধু log করা catch block লেখা মানে হলো bug কে silent করে দেওয়া। প্রোগ্রাম চলতে থাকে ভুল state নিয়ে, যা পরবর্তীতে আরও জটিল সমস্যা তৈরি করে।</div>

<h3>৭.৪ throw vs throw ex — Stack Trace সংরক্ষণ</h3>
<p>catch block এর ভেতর exception টি re-throw করার সময় দুইটি উপায় আছে, আর এই দুটোর মধ্যে পার্থক্য বোঝা অত্যন্ত গুরুত্বপূর্ণ — এটি একটি classic gotcha যা অনেক ডেভেলপার জানেন না।</p>
<pre>void ProcessData()
{
    try
    {
        ParseInput();
    }
    catch (FormatException ex)
    {
        LogError(ex);
        throw; <span class="c">// ✅ bare throw — original stack trace সংরক্ষিত থাকে</span>
    }
}

void ProcessDataBad()
{
    try
    {
        ParseInput();
    }
    catch (FormatException ex)
    {
        LogError(ex);
        throw ex; <span class="c">// ❌ stack trace রিসেট হয়ে যায় এখান থেকে</span>
    }
}</pre>
<p><span class="kw">throw;</span> (কোনো কিছু ছাড়াই) originial exception টিকে তার সম্পূর্ণ stack trace সহ re-throw করে — অর্থাৎ exception টি আসলে কোথায় প্রথম ঘটেছিল, সেই তথ্য বজায় থাকে। কিন্তু <span class="kw">throw ex;</span> লিখলে stack trace এই <span class="kw">throw ex</span> লাইন থেকে নতুন করে শুরু হয় — মূল error টি ঠিক কোথায় ঘটেছিল সেই তথ্য হারিয়ে যায়, যা debugging কে অনেক কঠিন করে তোলে, বিশেষ করে production log এ।</p>
<div class="callout best"><span class="tag">Best practice</span> catch block এর ভেতর exception re-throw করার সময় প্রায় সবসময় <code>throw;</code> ব্যবহার করুন, <code>throw ex;</code> না। শুধুমাত্র নতুন wrapped exception বানাতে চাইলে (inner exception হিসেবে original টি পাস করে) <code>throw ex</code> এর মতো syntax দরকার হতে পারে।</div>

<h3>৭.৫ Exception Filters — when clause</h3>
<p><span class="kw">catch</span> block এর সাথে <span class="kw">when</span> clause যোগ করে আমরা শর্তসাপেক্ষে exception catch করতে পারি — exception এর কোনো property চেক করে দেখা যায় সেটা আসলেই handle করা উচিত কিনা, তা না হলে সেটা আপনাআপনি propagate হয়ে যায়, catch-and-rethrow ম্যানুয়ালি করতে হয় না।</p>
<pre>try
{
    await CallExternalApiAsync();
}
catch (HttpRequestException ex) when (ex.StatusCode == System.Net.HttpStatusCode.TooManyRequests)
{
    await Task.Delay(1000);
    await RetryAsync(); <span class="c">// শুধু 429 status code হলেই এই catch চলবে</span>
}
<span class="c">// অন্য যেকোনো HttpRequestException (যেমন 500) এই catch এড়িয়ে propagate হবে</span></pre>
<div class="callout why"><span class="tag">কেন এমন</span> exception filter ব্যবহারের সুবিধা হলো — filter শর্ত মিথ্যা হলে exception এর original stack trace অক্ষুণ্ণ থাকে, কারণ এখানে catch-then-rethrow করার দরকার হয় না।</div>

<h3>৭.৬ using / IDisposable এবং finally এর সম্পর্ক</h3>
<p>যেসব object unmanaged resource (file handle, database connection, network socket) ব্যবহার করে, তারা সাধারণত <span class="kw">IDisposable</span> interface implement করে। <span class="kw">using</span> আসলে <span class="kw">try/finally</span> এর syntactic sugar — এটি নিশ্চিত করে যে exception হলেও <span class="kw">Dispose()</span> call হবেই।</p>
<pre>using (var connection = new SqlConnection(connectionString))
{
    connection.Open();
    RunQuery(connection);
} <span class="c">// এখানে connection.Dispose() automatically call হয়, exception হলেও</span>

<span class="c">// উপরের কোডটি ঠিক এই কোডের মতোই আচরণ করে:</span>
var connection2 = new SqlConnection(connectionString);
try
{
    connection2.Open();
    RunQuery(connection2);
}
finally
{
    connection2.Dispose();
}</pre>
<p>C# 8.0 থেকে <span class="kw">using declaration</span> সিনট্যাক্স এসেছে, যেখানে আলাদা block দরকার হয় না — enclosing scope (সাধারণত method) শেষ হলেই <span class="kw">Dispose()</span> চলে:</p>
<pre>void ProcessFile(string path)
{
    using var reader = new System.IO.StreamReader(path); <span class="c">// C# 8 using declaration</span>
    var content = reader.ReadToEnd();
    Console.WriteLine(content);
} <span class="c">// method শেষে reader.Dispose() automatically call হবে</span></pre>
<div class="callout behind"><span class="tag">Compiler যা করে</span> compiler উভয় ফর্মকেই ভেতরে ভেতরে <code>try/finally</code> ব্লকে রূপান্তরিত করে — <code>Dispose()</code> call সবসময় <code>finally</code> block এর ভেতর থাকে, তাই exception হলেও resource cleanup গ্যারান্টিযুক্ত।</div>

<h3>৭.৭ Best Practice: Control Flow এর জন্য Exception ব্যবহার না করা</h3>
<p>Exception throw করা তুলনামূলকভাবে ব্যয়বহুল অপারেশন — এতে stack trace capture করা, unwinding ইত্যাদি জড়িত থাকে। তাই normal, প্রত্যাশিত পরিস্থিতির জন্য (যেমন input validation) exception ব্যবহার না করে সরাসরি check করাই ভালো।</p>
<pre><span class="c">// ❌ খারাপ — normal validation এর জন্য exception ব্যবহার করা হচ্ছে</span>
int ParseAgeBad(string input)
{
    try
    {
        return int.Parse(input);
    }
    catch (FormatException)
    {
        return -1;
    }
}

<span class="c">// ✅ ভালো — TryParse ব্যবহার করে exception এড়ানো হচ্ছে</span>
int ParseAgeGood(string input)
{
    if (int.TryParse(input, out int result))
    {
        return result;
    }
    return -1;
}</pre>
<p>ইউজার যদি প্রায়ই ভুল ফরম্যাটে ইনপুট দেয় (যেমন একটি web form এ), তাহলে <span class="kw">int.Parse</span> + <span class="kw">catch (FormatException)</span> ব্যবহার করলে প্রতিবার exception throw হবে — hot path এ এটি performance এর উপর লক্ষণীয় প্রভাব ফেলতে পারে। <span class="kw">int.TryParse</span> কোনো exception throw না করেই একই কাজ করে দেয়, তাই এটি অনেক দ্রুত।</p>
<div class="callout mistake"><span class="tag">Common mistake — expected case এ exception</span> exception শুধুমাত্র সত্যিকারের ব্যতিক্রমী, অপ্রত্যাশিত পরিস্থিতির জন্য ব্যবহার করুন। যদি কোনো condition নিয়মিত ঘটবে বলে জানা থাকে (যেমন ইউজার ইনপুট validation), সেটার জন্য সবসময় boolean-return পদ্ধতি (<code>TryParse</code>, <code>TryGetValue</code> ইত্যাদি) খুঁজুন।</div>
</template>

<template data-page="async">
<h2 class="title">৯. Async/Await ও Task-based Programming</h2>
<p class="lead">মডার্ন সার্ভার অ্যাপ্লিকেশনের বেশিরভাগ কাজ হলো অপেক্ষা করা — ডেটাবেজ query শেষ হওয়ার অপেক্ষা, external API-র response আসার অপেক্ষা, ফাইল সিস্টেম I/O শেষ হওয়ার অপেক্ষা। এই অধ্যায়ে দেখব কেন <span class="kw">async</span>/<span class="kw">await</span> এই অপেক্ষার সময়টাকে কাজে লাগিয়ে thread খরচ কমায়, কীভাবে compiler এর পেছনে state machine তৈরি করে, এবং কোন কোন classic ভুলে পড়লে deadlock বা silent bug তৈরি হয়।</p>

<h3>১. কেন Async জরুরি — I/O-bound স্কেলিং সমস্যা</h3>
<p>ধরা যাক একটি web server-এ প্রতিটি request একটি ডেটাবেজ query করে। যদি এই query synchronous ভাবে করা হয়, তাহলে যে thread request handle করছে সে পুরোপুরি ব্লকড হয়ে বসে থাকে — CPU-তে কোনো কাজ না করেই। ThreadPool-এ থ্রেড সংখ্যা সীমিত, তাই হাজার হাজার concurrent request এলে সব থ্রেড ব্লকড হয়ে যায় এবং নতুন request গুলো queue-তে আটকে থাকে, যদিও CPU প্রায় idle।</p>
<p><span class="kw">async</span>/<span class="kw">await</span> ব্যবহার করলে I/O অপারেশন শুরু হওয়ার পর thread-টি ThreadPool-এ ফেরত পাঠানো হয় — সে অন্য request সার্ভ করতে পারে। I/O শেষ হলে (যেমন ডেটাবেজ থেকে response আসলে), যেকোনো available thread কাজটি আবার চালিয়ে নেয়। ফলে একই সংখ্যক থ্রেড দিয়ে অনেক বেশি concurrent I/O-bound request সামলানো যায়।</p>
<div class="diagram"><pre>
Synchronous (blocking) কল:
Thread-1: [--- request কাজ ---][######## DB কলের জন্য ব্লকড ########][--- বাকি কাজ ---]
                                  (এই সময় Thread-1 আর কিছুই করতে পারছে না)

Asynchronous (await) কল:
Thread-1: [--- request কাজ ---][await শুরু, thread রিলিজ]      [continuation চলে অন্য thread-এ]
ThreadPool:                                    ↳ Thread-1 এখন request-2, 3, 4 সার্ভ করছে
                                                ↳ DB response এলে যেকোনো ফ্রি thread কাজ চালিয়ে নেয়
</pre></div>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> Async নিজে কাজটা দ্রুত করে না — একটা single request-এর latency কমায় না। এটা throughput বাড়ায়, কারণ থ্রেড অপেক্ষার সময়ে অলস বসে না থেকে অন্য request সার্ভ করতে পারে। তাই async মূলত I/O-bound workload-এর জন্য উপকারী, CPU-bound কাজের জন্য নয়।</div>

<h3>২. Async/Await এর মেকানিজম — State Machine</h3>
<p>যখন কোনো method-কে <span class="kw">async</span> কিওয়ার্ড দিয়ে মার্ক করা হয়, C# compiler পুরো method বডিটাকে একটি state machine (class বা struct) এ রূপান্তর করে। প্রতিটি <span class="kw">await</span> পয়েন্ট একটি "state" — যেখানে execution থেমে যায় এবং পরে সেই জায়গা থেকেই আবার শুরু হয়। <span class="kw">Task</span> এবং <span class="kw">Task&lt;T&gt;</span> একটি চলমান বা সম্পন্ন অপারেশনকে represent করে — অনেকটা "ভবিষ্যতে একটা ফলাফল আসবে"-এর promise।</p>
<pre>
public async Task&lt;string&gt; GetDataAsync()
{
    <span class="c">// HttpClient.GetStringAsync একটা Task&lt;string&gt; রিটার্ন করে</span>
    using var client = new HttpClient();
    string result = await client.GetStringAsync("https://api.example.com/data");

    <span class="c">// await-এর পরের কোড continuation হিসেবে চলে</span>
    return result.ToUpper();
}

public async Task CallerAsync()
{
    string data = await GetDataAsync();
    Console.WriteLine(data);
}
</pre>
<p>এখানে <span class="kw">await</span> মানে "এই Task শেষ না হওয়া পর্যন্ত অপেক্ষা করো, কিন্তু thread ব্লক করে নয় — বরং thread-টা ছেড়ে দাও এবং Task শেষ হলে continuation-টা চালাও"। মেথড রিটার্ন টাইপ <span class="kw">Task</span> বা <span class="kw">Task&lt;T&gt;</span> হয় বলেই caller এটাকে আবার await করতে পারে, exception ধরতে পারে, বা <span class="kw">Task.WhenAll</span>-এ combine করতে পারে।</p>

<h3>৩. Deadlock ফাঁদ — .Result / .Wait() এবং SynchronizationContext</h3>
<p>এটি async programming-এর সবচেয়ে ক্লাসিক ও বিপজ্জনক ভুলগুলোর একটি। যখন কোনো async Task-এর উপর সরাসরি <span class="kw">.Result</span> বা <span class="kw">.Wait()</span> কল করে synchronously অপেক্ষা করা হয়, এবং সেই কল এমন একটি context-এ ঘটে যেখানে <span class="kw">SynchronizationContext</span> আছে (যেমন পুরনো ASP.NET বা WPF/WinForms UI অ্যাপ), তখন deadlock হতে পারে।</p>
<pre>
<span class="c">// UI থ্রেড থেকে (WPF button click handler)</span>

{
    <span class="c">// এখানে .Result কল করলে UI thread ব্লক হয়ে যায়</span>
    string data = GetDataAsync().Result;  <span class="c">// DEADLOCK!</span>
}

{

    <span class="c">// await-এর পর continuation আবার UI (captured) context-এ ফিরতে চায়</span>
    return result;
}
</pre>
<p>যা ঘটে: <span class="kw">.Result</span> UI থ্রেডকে ব্লক করে ফেলে। <span class="kw">GetDataAsync</span> ভেতরের <span class="kw">await</span> সম্পন্ন হওয়ার পর তার continuation captured <span class="kw">SynchronizationContext</span>-এ (অর্থাৎ সেই একই UI থ্রেডে) ফিরে আসতে চায়। কিন্তু সেই থ্রেড তো ইতিমধ্যে <span class="kw">.Result</span>-এ ব্লকড হয়ে বসে আছে — ফলে continuation কখনো চলতে পারে না, আর <span class="kw">.Result</span>ও কখনো রিটার্ন করে না। দুইপক্ষই একে অপরের জন্য চিরকাল অপেক্ষা করে।</p>
<div class="callout mistake"><span class="tag">Common mistake — সরাসরি .Result/.Wait() কল করা</span> লাইব্রেরি বা UI কোডে async মেথডকে synchronous বানানোর জন্য <span class="kw">.Result</span> বা <span class="kw">.Wait()</span> ব্যবহার করা একটি ক্লাসিক deadlock-প্রবণ প্যাটার্ন। সবসময় <span class="kw">await</span> ব্যবহার করা উচিত, একেবারে top-level entry point ছাড়া (যেমন <span class="kw">Main</span>)।</div>
<p>এই সমস্যার ক্লাসিক সমাধান হলো লাইব্রেরি কোডে <span class="kw">ConfigureAwait(false)</span> ব্যবহার করা — এটি continuation-কে বলে দেয় যে original context-এ ফিরে আসার দরকার নেই, যেকোনো ThreadPool থ্রেডে চললেই হবে।</p>
<pre>
public async Task&lt;string&gt; GetDataAsync()
{
    <span class="c">// লাইব্রেরি কোড — UI context-এ ফিরে আসার দরকার নেই</span>
    var result = await client.GetStringAsync(url).ConfigureAwait(false);
    return result;
}
</pre>
<div class="callout behind"><span class="tag">প্রসঙ্গত</span> মডার্ন ASP.NET Core-এ কোনো <span class="kw">SynchronizationContext</span> নেই, তাই এই নির্দিষ্ট ধরনের deadlock সেখানে সাধারণত ঘটে না। তবুও লাইব্রেরি কোডে <span class="kw">ConfigureAwait(false)</span> ব্যবহার করা একটি ভালো অভ্যাস হিসেবে রয়ে গেছে — কারণ লাইব্রেরি জানে না তার caller কোন ধরনের context থেকে আসছে। WPF/WinForms-এর মতো UI অ্যাপে এই deadlock ঝুঁকি এখনো পুরোপুরি বাস্তব, তাই সেখানে সতর্ক থাকতেই হবে।</div>

<h3>৪. async void বনাম async Task</h3>
<p><span class="kw">async void</span> মেথড শুধুমাত্র UI event handler-এর মতো একেবারে top-level জায়গায় ব্যবহার করা উচিত (যেমন button click handler, যার signature framework দ্বারা নির্ধারিত), অন্য কোথাও নয়। এর কারণ দুটি বড় সমস্যা: প্রথমত, <span class="kw">async void</span> মেথডের ভেতরের exception কোনো Task-এ ধরা পড়ে না, ফলে caller তা try/catch দিয়ে ধরতে পারে না — বরং সেটি সরাসরি SynchronizationContext-এ থ্রো হয় এবং সাধারণত পুরো প্রসেস ক্র্যাশ করে দেয়। দ্বিতীয়ত, <span class="kw">async void</span> মেথডকে <span class="kw">await</span> করার কোনো উপায় নেই, তাই caller জানতেও পারে না কাজ কখন শেষ হলো।</p>
<pre>
<span class="c">// ভুল — exception ধরা যাবে না</span>
public async void ProcessOrderAsync()
{
    await Task.Delay(100);
    throw new InvalidOperationException("অর্ডার প্রসেস ব্যর্থ");
}

public void CallCode()
{
    try
    {
        ProcessOrderAsync(); <span class="c">// exception এখানে ধরা পড়বে না</span>
    }
    catch (Exception ex)
    {
        <span class="c">// এই catch ব্লক কখনো চলবে না</span>
        Console.WriteLine(ex.Message);
    }
    <span class="c">// প্রসেস ক্র্যাশ করতে পারে, অথবা exception অন্য কোথাও unhandled হিসেবে যাবে</span>
}
</pre>
<p>সঠিক পদ্ধতি হলো সবসময় <span class="kw">async Task</span> রিটার্ন করা, যাতে caller Task-টি await করে exception স্বাভাবিকভাবে ধরতে পারে:</p>
<pre>
public async Task ProcessOrderAsync()
{
    await Task.Delay(100);
    throw new InvalidOperationException("অর্ডার প্রসেস ব্যর্থ");
}

public async Task CallCode()
{
    try
    {
        await ProcessOrderAsync(); <span class="c">// এখানে exception ঠিকমতো ধরা পড়বে</span>
    }
    catch (Exception ex)
    {
        Console.WriteLine(ex.Message);
    }
}
</pre>
<table>
<tr><th>বৈশিষ্ট্য</th><th>async void</th><th>async Task</th></tr>
<tr><td>Exception handling</td><td>caller ধরতে পারে না, প্রসেস ক্র্যাশ হতে পারে</td><td>caller await করে try/catch দিয়ে ধরতে পারে</td></tr>
<tr><td>Await করা যায় কিনা</td><td>না, completion track করা যায় না</td><td>হ্যাঁ, caller await করতে পারে</td></tr>
<tr><td>উপযুক্ত ব্যবহার</td><td>শুধু UI event handler</td><td>প্রায় সব ক্ষেত্রে</td></tr>
</table>

<h3>৫. Task.WhenAll ও Task.WhenAny — সমান্তরাল এক্সিকিউশন</h3>
<p>একাধিক independent async অপারেশন একের পর এক <span class="kw">await</span> করলে তারা sequentially চলে — প্রতিটির জন্য পুরো সময় অপেক্ষা করতে হয়, যদিও তারা একে অপরের উপর নির্ভরশীল নয়। এক্ষেত্রে <span class="kw">Task.WhenAll</span> ব্যবহার করে সব অপারেশন একসাথে শুরু করা যায়, এবং সব শেষ হওয়া পর্যন্ত একবারে অপেক্ষা করা যায়।</p>
<pre>
<span class="c">// ধীর পদ্ধতি — একে একে await, মোট সময় ≈ ৩টি কলের যোগফল</span>
public async Task&lt;int&gt; GetTotalSequentialAsync()
{
    int a = await GetPriceAsync("A"); <span class="c">// ~১ সেকেন্ড</span>
    int b = await GetPriceAsync("B"); <span class="c">// ~১ সেকেন্ড</span>
    int c = await GetPriceAsync("C"); <span class="c">// ~১ সেকেন্ড</span>
    return a + b + c; <span class="c">// মোট ~৩ সেকেন্ড</span>
}

<span class="c">// দ্রুত পদ্ধতি — সব একসাথে শুরু, মোট সময় ≈ সবচেয়ে ধীর কলটির সমান</span>
public async Task&lt;int&gt; GetTotalConcurrentAsync()
{
    Task&lt;int&gt; taskA = GetPriceAsync("A");
    Task&lt;int&gt; taskB = GetPriceAsync("B");
    Task&lt;int&gt; taskC = GetPriceAsync("C");

    int[] results = await Task.WhenAll(taskA, taskB, taskC);
    return results.Sum(); <span class="c">// মোট ~১ সেকেন্ড</span>
}
</pre>
<p><span class="kw">Task.WhenAny</span> এর উদ্দেশ্য ভিন্ন — একাধিক Task-এর মধ্যে যেটি প্রথম শেষ হয়, সেটির ফলাফল নিয়ে এগিয়ে যাওয়া। এটি timeout প্যাটার্নে বা একাধিক সোর্স থেকে সবচেয়ে দ্রুত response নেওয়ার ক্ষেত্রে ব্যবহৃত হয়, যেমন একটি অপারেশন এবং একটি timeout Task-কে race করানো।</p>
<div class="callout best"><span class="tag">Best practice — independent কাজ সমান্তরালে চালান</span> যদি একাধিক async কল একে অপরের উপর নির্ভরশীল না হয়, তাহলে সবগুলো Task একসাথে শুরু করে <span class="kw">Task.WhenAll</span> দিয়ে অপেক্ষা করুন। sequential await শুধু তখনই ব্যবহার করুন যখন এক কলের ফলাফল পরের কলের ইনপুট হিসেবে দরকার।</div>

<h3>৬. Async কোডে Exception Handling</h3>
<p>যখন কোনো async মেথডের ভেতরে exception থ্রো হয়, সেটি সরাসরি থ্রো হয় না — বরং সেটি রিটার্ন করা <span class="kw">Task</span>-এর ভেতরে "সংরক্ষিত" থাকে। যখন caller সেই Task-কে <span class="kw">await</span> করে, তখনই exception unwrap হয়ে caller-এর try/catch-এ স্বাভাবিকভাবে ধরা পড়ে — ঠিক যেন এটি একটি সাধারণ synchronous থ্রো।</p>
<pre>
public async Task&lt;int&gt; DivideAsync(int a, int b)
{
    await Task.Delay(10);
    return a / b; <span class="c">// b == 0 হলে DivideByZeroException</span>
}

public async Task RunAsync()
{
    try
    {
        int result = await DivideAsync(10, 0);
    }
    catch (DivideByZeroException ex)
    {
        <span class="c">// await ব্যবহার করলে exception স্বাভাবিকভাবেই এখানে ধরা পড়ে</span>
        Console.WriteLine("ভাগ করা যায়নি: " + ex.Message);
    }
}
</pre>
<p>কিন্তু যদি <span class="kw">await</span>-এর বদলে <span class="kw">.Result</span> বা <span class="kw">.Wait()</span> ব্যবহার করা হয়, তাহলে exception টি একটি <span class="kw">AggregateException</span>-এর ভেতরে মোড়ানো (wrap) অবস্থায় আসে — কারণ একটি Task ভবিষ্যতে একাধিক exception ধারণ করতে পারে (যেমন <span class="kw">Task.WhenAll</span>-এর ক্ষেত্রে)। এর ফলে আসল exception ধরার জন্য <span class="kw">catch (AggregateException ex)</span> লিখে <span class="kw">ex.InnerException</span> বা <span class="kw">ex.Flatten()</span> চেক করতে হয় — যা কোড জটিল করে তোলে।</p>
<pre>
try
{
    int result = DivideAsync(10, 0).Result; <span class="c">// .Result ব্যবহার করা হলো</span>
}
catch (AggregateException ex)
{
    <span class="c">// আসল exception এখানে, catch (DivideByZeroException) সরাসরি কাজ করবে না</span>
    Console.WriteLine(ex.InnerException?.Message);
}
</pre>
<div class="callout why"><span class="tag">এই কারণেও .Result/.Wait() এড়ানো উচিত</span> শুধু deadlock ঝুঁকিই নয় — <span class="kw">.Result</span>/<span class="kw">.Wait()</span> ব্যবহার করলে exception <span class="kw">AggregateException</span>-এ মোড়ানো থাকে, যা catch ব্লকের লজিক জটিল করে এবং স্বাভাবিক exception টাইপ দিয়ে সরাসরি ধরা যায় না। <span class="kw">await</span> ব্যবহার করলে এই সমস্যা থাকে না — exception তার আসল টাইপেই সরাসরি প্রকাশ পায়।</div>

<h3>৭. সাধারণ ভুল — await ভুলে যাওয়া (Fire-and-Forget)</h3>
<p>একটি async মেথড কল করে যদি <span class="kw">await</span> লিখতে ভুলে যাওয়া হয়, তাহলে কোডটি compile হয়ে যায় (compiler শুধু একটি warning দেয়), কিন্তু মেথডটি "fire-and-forget" হয়ে যায় — অর্থাৎ caller ওই Task শেষ হওয়ার জন্য অপেক্ষা না করেই পরের লাইনে চলে যায়। ফলে হয়তো ডেটা এখনো সেভ হয়নি এমন অবস্থাতেই পরের কোড রান হয়ে যায়, অথবা ভেতরে exception হলে সেটি সম্পূর্ণ silently হারিয়ে যায় — কোনো catch ব্লকই কখনো এটি দেখতে পায় না।</p>
<pre>
public async Task SaveOrderAsync(Order order)
{
    <span class="c">// ভুল — await নেই, তাই SaveChangesAsync শেষ হওয়ার আগেই এগিয়ে যাওয়া হচ্ছে</span>
    _dbContext.SaveChangesAsync(); <span class="c">// SaveChangesAsync() কল হলো কিন্তু await নেই</span>

    Console.WriteLine("অর্ডার সেভ হয়েছে"); <span class="c">// আসলে সেভ শেষ হয়েছে কিনা নিশ্চিত না!</span>
}
</pre>
<div class="callout mistake"><span class="tag">Common mistake — await ভুলে যাওয়া</span> <span class="kw">async</span> মেথড কল করার সময় <span class="kw">await</span> বাদ পড়লে সেটি fire-and-forget হয়ে যায়। কাজ শেষ হওয়ার নিশ্চয়তা থাকে না, আর ভেতরের exception ধরার কোনো সুযোগ থাকে না — সেটি একেবারে silently হারিয়ে যেতে পারে। Visual Studio-তে এই ধরনের কলে সাধারণত warning (CS4014) দেখা যায়, যা কখনোই উপেক্ষা করা উচিত নয়।</div>
<p>সঠিক কোড হলো সবসময় <span class="kw">await</span> ব্যবহার করা:</p>
<pre>
public async Task SaveOrderAsync(Order order)
{
    await _dbContext.SaveChangesAsync(); <span class="c">// এখন পরের লাইন কেবল সেভ শেষ হলেই চলবে</span>

    Console.WriteLine("অর্ডার সেভ হয়েছে");
}
</pre>
<p>যদি সত্যিই ইচ্ছাকৃতভাবে fire-and-forget দরকার হয় (খুব বিরল ক্ষেত্রে), তাহলে সেটি স্পষ্টভাবে বোঝানো উচিত এবং exception handling নিজে যোগ করা উচিত, যেমন একটি সহায়ক wrapper মেথড ব্যবহার করে যা ভেতরে try/catch দিয়ে exception লগ করে — যাতে ভুলটা accidental না হয়ে ইচ্ছাকৃত সিদ্ধান্ত হিসেবে স্পষ্ট থাকে।</p>
</template>

<template data-page="memory">
<h2 class="title">১০. Memory Management — Stack, Heap, GC</h2>
<p class="lead">C# প্রোগ্রামের প্রতিটি ভ্যারিয়েবল আসলে কোথায় থাকে — সেটা বুঝলে পারফরম্যান্স বাগ, <span class="kw">NullReferenceException</span>, আর মেমরি লিকের মতো সমস্যাগুলো অনেক সহজে ধরা যায়। .NET-এ মেমরি মূলত দুই জায়গায় থাকে — <b>Stack</b> আর <b>Heap</b> — এবং এই দুটোর ব্যবস্থাপনা সম্পূর্ণ ভিন্নভাবে হয়। এই চ্যাপ্টারে আমরা দেখব কীভাবে <span class="kw">struct</span> আর <span class="kw">class</span> ভিন্নভাবে আচরণ করে, বক্সিং-আনবক্সিং কী, এবং Garbage Collector (GC) কীভাবে কাজ করে।</p>

<h3>১. Stack বনাম Heap</h3>
<p><b>Stack</b> হলো একটা LIFO (Last-In-First-Out) মেমরি এলাকা, যেখানে প্রতিটি মেথড কল করার সময় একটা নতুন <b>stack frame</b> তৈরি হয়। সেই frame-এ থাকে মেথডের লোকাল ভ্যারিয়েবল, প্যারামিটার, আর রিটার্ন অ্যাড্রেস। মেথড শেষ হয়ে গেলে পুরো frame টা তাৎক্ষণিকভাবে মুছে যায় — এখানে GC-র কোনো ভূমিকা নেই, তাই এটা অত্যন্ত দ্রুত।</p>
<p><b>Heap</b> হলো একটা অনেক বড়, শেয়ার্ড মেমরি পুল, যেখানে <span class="kw">class</span>-এর ইনস্ট্যান্স (reference type object) তৈরি হয়। heap-এর কোনো object কখন মুছে যাবে সেটা প্রোগ্রামার সরাসরি ঠিক করে না — এটা নিয়ন্ত্রণ করে <span class="kw">Garbage Collector</span>।</p>
<div class="diagram"><pre>
Stack (top → bottom, প্রতিটি ফাংশন কলের জন্য একটা frame)
┌─────────────────────────────┐
│ Main() frame                │
│   int count = 5;            │  ← value type, stack-এ সরাসরি value
│   Person p  = new Person(); │  ← reference type, stack-এ শুধু একটা ঠিকানা
│      │                      │
│      │  ঠিকানা নিচে heap-এ  │
├──────┼──────────────────────┤
│ ...   পূর্ববর্তী frame       │
└──────┼──────────────────────┘
       │
       ▼
Heap (managed, GC দ্বারা নিয়ন্ত্রিত)
┌─────────────────────────────┐
│ Person object                │
│   Name = "Rasel"             │
│   Age  = 30                  │
└─────────────────────────────┘
</pre></div>
<p>লক্ষ করুন — <span class="kw">count</span> নিজেই stack-এ বসে আছে (value type), কিন্তু <span class="kw">p</span> ভ্যারিয়েবলটা stack-এ থাকলেও এর ভেতরের ডেটা (Name, Age) heap-এ থাকা <span class="kw">Person</span> অবজেক্টে। <span class="kw">p</span> শুধু সেই অবজেক্টের একটা রেফারেন্স (ঠিকানা) ধরে রাখে।</p>

<h3>২. Value Type বনাম Reference Type: আচরণের পার্থক্য</h3>
<p><span class="kw">struct</span> হলো value type — যখনই কোনো struct ভ্যারিয়েবল অন্য একটাতে assign করা হয়, বা মেথডে পাস করা হয়, পুরো ডেটার একটা <b>স্বতন্ত্র কপি</b> তৈরি হয়। অন্যদিকে <span class="kw">class</span> হলো reference type — assignment করলে শুধু reference (ঠিকানা) কপি হয়, দুই ভ্যারিয়েবলই একই heap object-কে নির্দেশ করে।</p>
<pre>
<span class="c">// struct — value type</span>
public struct PointStruct
{
    public int X;
    public int Y;
}

PointStruct a = new PointStruct { X = 1, Y = 1 };
PointStruct b = a;          <span class="c">// পুরো ডেটার স্বতন্ত্র কপি</span>
b.X = 99;

Console.WriteLine(a.X);     <span class="c">// আউটপুট: 1  — a অপরিবর্তিত</span>
Console.WriteLine(b.X);     <span class="c">// আউটপুট: 99</span>

<span class="c">// class — reference type</span>
public class PointClass
{
    public int X;
    public int Y;
}

PointClass c = new PointClass { X = 1, Y = 1 };
PointClass d = c;           <span class="c">// শুধু reference কপি, একই object</span>
d.X = 99;

Console.WriteLine(c.X);     <span class="c">// আউটপুট: 99 — c ও d একই object-কে নির্দেশ করে</span>
Console.WriteLine(d.X);     <span class="c">// আউটপুট: 99</span>
</pre>
<div class="callout mistake"><span class="tag">Common mistake — অজান্তে শেয়ার্ড মিউটেশন</span> অনেকে ভাবেন <span class="kw">class</span> object কপি করলে আলাদা অবজেক্ট তৈরি হয়, কিন্তু আসলে reference কপি হয়। ফলে একটা ভ্যারিয়েবলে পরিবর্তন করলে অন্য সব ভ্যারিয়েবলেও (যারা একই object-কে পয়েন্ট করে) সেই পরিবর্তন দেখা যায় — এটা একটা খুবই সাধারণ বাগের উৎস।</div>

<h3>৩. Boxing এবং Unboxing</h3>
<p>যখন একটা value type (যেমন <span class="kw">int</span>, <span class="kw">struct</span>) কে <span class="kw">object</span> টাইপ বা কোনো interface টাইপের ভ্যারিয়েবলে assign করা হয়, তখন .NET একটা heap allocation করে সেই value-টাকে একটা "বাক্সে" মুড়ে ফেলে — একে বলে <b>boxing</b>। এই boxed value থেকে আবার আসল value type-এ ফেরত আনতে হলে explicit cast লাগে, আর তখন ডেটা আবার কপি হয়ে ফিরে আসে — একে বলে <b>unboxing</b>।</p>
<pre>
int number = 42;
object boxed = number;        <span class="c">// boxing — heap-এ নতুন allocation</span>

int unboxed = (int)boxed;     <span class="c">// unboxing — explicit cast, ডেটা কপি হয়ে ফেরে</span>
</pre>
<p>প্রতিটা boxing মানে একটা নতুন heap allocation, যেটা পরে GC-কে সাফ করতে হবে। এটা এক-দুইবার হলে সমস্যা না, কিন্তু লুপের ভেতরে বারবার হলে পারফরম্যান্সে বড় ধাক্কা লাগে — বিশেষ করে Collections চ্যাপ্টারে আলোচিত non-generic <span class="kw">ArrayList</span> ব্যবহার করলে, কারণ এটি সব কিছু <span class="kw">object</span> হিসেবে সংরক্ষণ করে।</p>
<pre>
ArrayList list = new ArrayList();
for (int i = 0; i &lt; 100000; i++)
{
    list.Add(i);   <span class="c">// প্রতিটি int এখানে box হচ্ছে — ১ লক্ষ heap allocation!</span>
}

<span class="c">// তুলনায়, generic List&lt;T&gt; কোনো boxing করে না</span>
List&lt;int&gt; typedList = new List&lt;int&gt;();
for (int i = 0; i &lt; 100000; i++)
{
    typedList.Add(i);   <span class="c">// int সরাসরি array-তে সংরক্ষিত, কোনো boxing নেই</span>
}
</pre>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> <span class="kw">List&lt;int&gt;</span> ব্যবহার করলে কোনো boxing হয় না বলেই এটা <span class="kw">ArrayList</span>-এর চেয়ে অনেক দ্রুত ও কম মেমরি-ভুক্ত — এই কারণেই আধুনিক C# কোডে non-generic collection প্রায় ব্যবহারই করা হয় না।</div>

<h3>৪. Garbage Collector ও Generational GC</h3>
<p>.NET-এর GC হেপে থাকা অবজেক্টগুলোকে তিনটি <b>generation</b>-এ ভাগ করে পরিচালনা করে। এর পেছনের মূল ধারণাটা হলো — <b>"most objects die young"</b> — অর্থাৎ বেশিরভাগ অবজেক্টের আয়ু খুব কম, তারা তৈরি হয়ে দ্রুতই আর প্রয়োজন থাকে না (যেমন কোনো মেথডের ভেতরে তৈরি হওয়া সাময়িক অবজেক্ট)। এই ধারণার ওপর ভিত্তি করে GC নতুন অবজেক্টগুলোকে বেশি ঘন ঘন চেক করে, আর পুরনো/দীর্ঘজীবী অবজেক্টগুলোকে কম ঘন ঘন — ফলে পুরো প্রক্রিয়াটা অনেক efficient হয়।</p>
<table>
<tr><th>Generation</th><th>Collection Frequency</th><th>সাধারণত যা থাকে</th></tr>
<tr><td>Gen 0</td><td>সবচেয়ে বেশি (সবচেয়ে সস্তা)</td><td>নতুন তৈরি, স্বল্পস্থায়ী অবজেক্ট</td></tr>
<tr><td>Gen 1</td><td>মাঝারি</td><td>Gen 0 collection-এ বেঁচে যাওয়া অবজেক্ট</td></tr>
<tr><td>Gen 2</td><td>সবচেয়ে কম (সবচেয়ে ব্যয়বহুল)</td><td>দীর্ঘজীবী অবজেক্ট (static ডেটা, cache, singleton)</td></tr>
<tr><td>LOH (Large Object Heap)</td><td>Gen 2-এর সাথে</td><td>≥ 85KB সাইজের বড় অবজেক্ট (বড় array, buffer)</td></tr>
</table>
<p>যে অবজেক্ট একটা Gen 0 collection-এ বেঁচে যায়, সেটা প্রোমোট হয়ে Gen 1-এ চলে যায়; সেখানেও বেঁচে গেলে Gen 2-এ। <b>Large Object Heap</b> আলাদা রাখা হয় কারণ বড় অবজেক্ট বারবার সরিয়ে (compact) নেওয়া ব্যয়বহুল, তাই LOH সাধারণত compact হয় না এবং কম ঘন ঘন পরিষ্কার হয়।</p>

<h3>৫. IDisposable এবং Finalizer</h3>
<p>GC শুধু <b>মেমরি</b> ম্যানেজ করে — ফাইল হ্যান্ডেল, নেটওয়ার্ক সকেট, ডাটাবেজ কানেকশন বা অন্য যেকোনো <b>unmanaged resource</b> এর দায়িত্ব GC নেয় না। এসব resource ঠিকমতো ছাড়ার জন্য C#-এ আছে <span class="kw">IDisposable</span> ইন্টারফেস, আর এর <span class="kw">Dispose()</span> মেথড — যা deterministic (নির্দিষ্ট সময়ে, প্রোগ্রামার নিয়ন্ত্রিত) cleanup করে।</p>
<pre>
public class FileLogger : IDisposable
{
    private FileStream _stream;

    public FileLogger(string path)
    {
        _stream = new FileStream(path, FileMode.Append);
    }

    public void Dispose()
    {
        _stream?.Dispose();   <span class="c">// deterministic — এখনই resource ছেড়ে দেওয়া হলো</span>
    }

    ~FileLogger()
    {
        _stream?.Dispose();   <span class="c">// finalizer — safety net, যদি Dispose() ভুলে যাওয়া হয়</span>
    }
}
</pre>
<p>ফাইনালাইজার (<span class="kw">~ClassName()</span>) একটা "শেষ ভরসা" — যদি কেউ <span class="kw">Dispose()</span> কল করতে ভুলে যায়, তবু finalizer একসময় resource ছেড়ে দেবে। কিন্তু এটা চলে একটা আলাদা <b>finalizer thread</b>-এ, একটা অনির্দিষ্ট সময়ে — এবং finalizable অবজেক্ট অন্তত একটা অতিরিক্ত GC generation পার হয়ে তবেই সম্পূর্ণভাবে collect হয়। তাই শুধু finalizer-এর ওপর নির্ভর করা <span class="kw">Dispose()</span> সরাসরি কল করার চেয়ে অনেক কম efficient।</p>
<div class="callout best"><span class="tag">Best practice — using / using var ব্যবহার করুন</span> Exceptions চ্যাপ্টারে দেখা <span class="kw">using</span> এবং <span class="kw">using var</span> স্টেটমেন্ট হলো <span class="kw">Dispose()</span> নিশ্চিতভাবে কল হওয়ার প্রমিত উপায় — এক্সেপশন হোক বা না হোক, scope শেষে <span class="kw">Dispose()</span> স্বয়ংক্রিয়ভাবে কল হবে, তাই finalizer-এর ওপর নির্ভর করার দরকার পড়ে না।</div>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> finalizer থাকা মানেই একটা অবজেক্ট সরাসরি Gen 0 থেকে মুছে যেতে পারে না — GC প্রথমে তাকে একটা বিশেষ "finalization queue"-তে রাখে, finalizer thread সেটা রান করে, তারপরই পরবর্তী কোনো collection-এ প্রকৃত মেমরি মুক্ত হয়। এই দুই-ধাপের প্রক্রিয়ার কারণেই finalizer-নির্ভর ক্লাস বেশি সময় ও মেমরি ধরে রাখে।</div>

<h3>৬. পারফরম্যান্স: Hot Loop-এ অতিরিক্ত Allocation</h3>
<p>পারফরম্যান্স-ক্রিটিক্যাল কোডে সবচেয়ে সাধারণ সমস্যাগুলোর একটা হলো এমন একটা লুপ, যেখানে প্রতিটি iteration-এ নতুন ছোট ছোট অবজেক্ট তৈরি হয় — এতে Gen 0 খুব দ্রুত ভরে যায় এবং বারবার GC pause ঘটে, যা পুরো অ্যাপ্লিকেশনের থ্রুপুট কমিয়ে দেয়।</p>
<pre>
<span class="c">// প্রতি iteration-এ নতুন string ও object তৈরি হচ্ছে — Gen 0-তে চাপ বাড়ায়</span>
for (int i = 0; i &lt; 1_000_000; i++)
{
    string message = "Item " + i + " processed";   <span class="c">// প্রতিবার নতুন string allocation</span>
    LogEntry entry = new LogEntry(message);          <span class="c">// প্রতিবার নতুন heap object</span>
}
</pre>
<div class="callout mistake"><span class="tag">Common mistake — hot loop-এ অপ্রয়োজনীয় allocation</span> লুপের ভেতরে বারবার নতুন string, array বা ছোট অবজেক্ট তৈরি করলে GC-কে বারবার Gen 0 কালেক্ট করতে হয়, যা লক্ষণীয় ল্যাটেন্সি স্পাইক তৈরি করতে পারে। পারফরম্যান্স-সংবেদনশীল কোডে allocation যতটা সম্ভব কমানোই মূল লক্ষ্য হওয়া উচিত — পরবর্তী Performance চ্যাপ্টারে আমরা <span class="kw">Span&lt;T&gt;</span> ও <span class="kw">ArrayPool&lt;T&gt;</span> দিয়ে কীভাবে এই allocation আরও কমানো যায় তা বিস্তারিত দেখব।</div>
</template>

<h2 class="title">১১. Modern C# — Records, Pattern Matching, Nullable Reference Types</h2>
<p class="lead">C# প্রতি বছর নতুন ভার্সনের সাথে ধীরে ধীরে আরও expressive আর safe হয়ে উঠেছে। এই chapter-এ আমরা দেখব তিনটা বড় modern feature — <span class="kw">Nullable Reference Types</span>, <span class="kw">record</span>, আর <span class="kw">pattern matching</span> — যেগুলো আজকের দিনের প্রায় প্রতিটা .NET codebase-এ পাওয়া যায়। এগুলো শুধু syntax sugar না, বরং কোড লেখার ধরনটাই বদলে দেয়।</p>

<h3>Nullable Reference Types কেন দরকার হলো</h3>
<p><span class="kw">NullReferenceException</span> — এটা সম্ভবত C#-এর ইতিহাসে সবচেয়ে বেশি দেখা runtime error। কারণটা সহজ: শুরু থেকেই যেকোনো reference type variable (যেমন <code>string</code>, কোনো class) default ভাবে <code>null</code> হতে পারত, আর compiler এটা নিয়ে কোনো warning দিত না। তুমি <code>customer.Name</code> লিখলে compiler ধরে নিত <code>customer</code> কখনোই null হবে না — যদিও বাস্তবে হতেই পারত।</p>
<pre>string GetCity(Customer c)
{
    <span class="c">// c null হলে এখানে crash করবে, কিন্তু compiler কিছু বলবে না</span>
    return c.Address.City;
}</pre>
<div class="callout why"><span class="tag">কেন দরকার</span> রানটাইমে crash হওয়ার আগেই যদি compiler বলে দিতে পারত "এই variable-টা null হতে পারে, চেক করো" — তাহলে হাজার হাজার production bug আগেই ধরা পড়ত। এই সমস্যা সমাধানের জন্যই C# 8-এ <span class="kw">Nullable Reference Types (NRT)</span> এসেছে।</div>

<h3>NRT ব্যবহার — <code>?</code> আর warning-ভিত্তিক নিরাপত্তা</h3>
<p>NRT enable করতে হয় প্রজেক্টের <code>.csproj</code> ফাইলে:</p>
<pre>&lt;PropertyGroup&gt;
  &lt;Nullable&gt;enable&lt;/Nullable&gt;
&lt;/PropertyGroup&gt;</pre>
<p>এটা enable করার পর টাইপ সিস্টেমের অর্থ বদলে যায়। <code>string</code> মানে এখন "এটা কখনো null হবে না" (non-nullable), আর <code>string?</code> মানে "এটা null হতে পারে" (nullable)। গুরুত্বপূর্ণ কথা হলো — compiler এখানে hard error দেয় না, শুধু <b>warning</b> দেয়, কারণ এটা একটা static analysis, রানটাইম গ্যারান্টি না।</p>
<pre>class Customer
{
    public string Name { get; set; }         <span class="c">// non-nullable, কখনো null নয় এই ধারণায়</span>
    public Address? Address { get; set; }    <span class="c">// nullable, null হতে পারে</span>
}

string GetCity(Customer c)
{
    return c.Address.City;   <span class="c">// CS8602 warning: Address null হতে পারে</span>
}</pre>
<p>এবার fix করা ভার্সন — null check অথবা <code>?.</code> operator দিয়ে:</p>
<pre>string GetCity(Customer c)
{
    if (c.Address is null)
        return "Unknown";

    return c.Address.City;   <span class="c">// এখানে warning নেই, compiler flow analysis করে জানে Address null নয়</span>
}

<span class="c">// অথবা null-conditional দিয়ে সংক্ষেপে</span>
string GetCityShort(Customer c) =&gt; c.Address?.City ?? "Unknown";</pre>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> NRT আসলে compiler-এর একটা static flow analysis — এটা প্রতিটা variable-এর "null-state" ট্র্যাক করে (may-be-null বনাম not-null) কোড পড়ার সময়। মেটাডেটাতে nullable annotation যোগ হয়, কিন্তু runtime-এ কোনো actual null-check inject হয় না — পুরোটাই compile-time সাহায্য।</div>

<h3>Record — value-based equality আর immutability</h3>
<p><span class="kw">record</span> টাইপ C# 9-এ এসেছে ডেটা-কেন্দ্রিক টাইপ লেখার জন্য, যেখানে identity নয়, ভেতরের মান (value) দিয়ে সমতা বিচার হয়। একটা positional record লিখতে মাত্র এক লাইন লাগে:</p>
<pre>public record Point(int X, int Y);

var p1 = new Point(3, 4);
var p2 = new Point(3, 4);

Console.WriteLine(p1 == p2);       <span class="c">// True — value দিয়ে তুলনা</span>
Console.WriteLine(p1);             <span class="c">// Point { X = 3, Y = 4 } — auto-generated ToString</span></pre>
<p>এখন এর সমতুল্য একটা হাতে-লেখা <code>class</code> কেমন দেখাত, সেটা তুলনা করে দেখা যাক — কতটা boilerplate লাগত:</p>
<pre>public class PointClass
{
    public int X { get; }
    public int Y { get; }

    public PointClass(int x, int y) { X = x; Y = y; }

    public override bool Equals(object? obj) =&gt;
        obj is PointClass other &amp;&amp; X == other.X &amp;&amp; Y == other.Y;

    public override int GetHashCode() =&gt; HashCode.Combine(X, Y);

    public override string ToString() =&gt; $"PointClass {{ X = {X}, Y = {Y} }}";

    public static bool operator ==(PointClass? a, PointClass? b) =&gt;
        Equals(a, b);

    public static bool operator !=(PointClass? a, PointClass? b) =&gt;
        !Equals(a, b);
}</pre>
<p><code>record</code> কম্পাইলার নিজেই এই <code>Equals</code>, <code>GetHashCode</code>, <code>ToString</code>, আর <code>==</code>/<code>!=</code> operator সব জেনারেট করে দেয়। এছাড়া record-এর একটা বিশেষ feature হলো <span class="kw">with</span> expression — non-destructive mutation, মানে মূল object অপরিবর্তিত রেখে একটা copy বানানো যেখানে শুধু নির্দিষ্ট property বদলানো হয়:</p>
<pre>var original = new Point(3, 4);
var moved = original with { Y = 10 };

Console.WriteLine(original);   <span class="c">// Point { X = 3, Y = 4 } — অপরিবর্তিত</span>
Console.WriteLine(moved);      <span class="c">// Point { X = 3, Y = 10 } — নতুন কপি</span></pre>

<h3>record বনাম record struct বনাম class</h3>
<p>আগের OOP chapter-এ আমরা দেখেছিলাম <code>class</code>-এ default <code>==</code> আর <code>.Equals()</code> reference equality করে — মানে দুইটা variable একই memory address point করছে কিনা সেটা চেক করে, ভেতরের ডেটা এক হলেও না। record এই default আচরণ উল্টে দেয়।</p>
<table>
<tr><th>বৈশিষ্ট্য</th><th><span class="kw">class</span></th><th><span class="kw">record</span></th><th><span class="kw">record struct</span></th></tr>
<tr><td>Semantics</td><td>Reference type</td><td>Reference type</td><td>Value type</td></tr>
<tr><td>Default equality</td><td>Reference equality (identity)</td><td>Value equality (property-wise)</td><td>Value equality (property-wise)</td></tr>
<tr><td>Storage</td><td>Heap</td><td>Heap</td><td>Stack (সাধারণত)</td></tr>
<tr><td><code>with</code> expression</td><td>নেই</td><td>আছে</td><td>আছে</td></tr>
<tr><td>Auto ToString/Equals</td><td>নেই, নিজে লিখতে হয়</td><td>Compiler generate করে</td><td>Compiler generate করে</td></tr>
<tr><td>সাধারণ ব্যবহার</td><td>Behavior/identity-ভিত্তিক entity</td><td>Immutable ডেটা মডেল, DTO</td><td>ছোট, ঘন ঘন copy হওয়া ডেটা</td></tr>
</table>
<div class="callout why"><span class="tag">কেন গুরুত্বপূর্ণ</span> যেখানে দুইটা object "সমান" কিনা সেটা তাদের ভেতরের ডেটার ওপর নির্ভর করা উচিত (যেমন দুইটা <code>Money</code> object একই amount আর currency হলে সমান) — সেখানে <span class="kw">record</span> ব্যবহার করলে <code>Equals</code>/<code>GetHashCode</code> নিজে লেখার দরকার পড়ে না। কিন্তু যেখানে identity গুরুত্বপূর্ণ (যেমন দুইটা আলাদা <code>Employee</code> entity, একই নাম হলেও তারা আলাদা মানুষ) — সেখানে সাধারণ <code>class</code>-ই ঠিক আছে।</div>

<h3>Pattern Matching — <code>is</code>, property pattern, relational pattern</h3>
<p>C#-এ pattern matching ধীরে ধীরে অনেক শক্তিশালী হয়েছে। শুধু টাইপ চেক নয়, এখন property-এর মান, তুলনা (relational), আর যৌক্তিক সমন্বয় (<span class="kw">and</span>/<span class="kw">or</span>/<span class="kw">not</span>) — সবকিছু এক জায়গায় লেখা যায়।</p>
<pre>object value = 25;

if (value is int n and &gt; 0)
    Console.WriteLine($"পজিটিভ integer: {n}");

<span class="c">// property pattern — object-এর ভেতরের property-র মান চেক করা</span>
if (person is { Age: &gt; 18, Country: "BD" })
    Console.WriteLine("প্রাপ্তবয়স্ক, বাংলাদেশি নাগরিক");</pre>
<p>একই ধরনের একাধিক শর্ত একসাথে switch expression-এ combine করলে কোড অনেক পরিষ্কার হয়:</p>
<pre>string Categorize(Person person) =&gt; person switch
{
    { Age: &lt; 13 }                     =&gt; "শিশু",
    { Age: &gt;= 13 and &lt; 20 }           =&gt; "কিশোর",
    { Age: &gt;= 20, Country: "BD" }     =&gt; "প্রাপ্তবয়স্ক (বাংলাদেশি)",
    { Age: &gt;= 20 } and not { Country: "BD" } =&gt; "প্রাপ্তবয়স্ক (বিদেশি)",
    _                                  =&gt; "অজানা"
};</pre>
<div class="callout best"><span class="tag">Best practice — exhaustive switch</span> switch expression-এ সবসময় শেষে <code>_</code> (discard) pattern দিয়ে একটা default case রাখো, নাহলে কোনো ইনপুট কোনো case-এ না মিললে রানটাইমে <span class="kw">SwitchExpressionException</span> ছুড়বে।</div>

<h3>Record + Pattern Matching — একসাথে ব্যবহার</h3>
<p>Record-এর positional syntax আর pattern matching-এর deconstruction ক্ষমতা একসাথে খুব স্বাভাবিকভাবে মেলে। একটা positional record-কে switch expression-এ সরাসরি ভেঙে (deconstruct করে) তার ভেতরের মান বের করে ফেলা যায় — এটা modern C#-এর একটা খুব common idiom।</p>
<pre>public record Shape;
public record Circle(double Radius) : Shape;
public record Rectangle(double Width, double Height) : Shape;

double Area(Shape shape) =&gt; shape switch
{
    Circle(var r) when r &gt; 0        =&gt; Math.PI * r * r,
    Rectangle(var w, var h)          =&gt; w * h,
    _                                 =&gt; throw new ArgumentException("অজানা shape")
};</pre>
<p>এখানে <code>Circle(var r)</code> লেখাটা record-এর positional deconstruction ব্যবহার করে সরাসরি <code>Radius</code> property-টাকে <code>r</code> নামে বের করে আনছে — আলাদা করে কোনো getter কল করতে হচ্ছে না। এই কম্বিনেশনটাই আজকাল ডেটা মডেলিং আর business logic লেখার একটা প্রচলিত ধরন হয়ে দাঁড়িয়েছে।</p>

<h3>অন্যান্য modern সুবিধা — সংক্ষেপে</h3>
<p>এগুলো গভীর concept নয়, শুধু ছোট সিনট্যাক্স সুবিধা যা কোডকে আরেকটু ঝরঝরে করে:</p>
<ul>
<li><b>Top-level statements</b> — ছোট প্রোগ্রামে আলাদা <code>class Program</code> আর <code>static void Main</code> লেখার দরকার নেই.
<pre>Console.WriteLine("Hello, World!");</pre>
</li>
<li><b>File-scoped namespace</b> — পুরো ফাইলে একটাই namespace থাকলে ব্লক ছাড়াই সেমিকোলন দিয়ে লেখা যায়।
<pre>namespace MyApp.Services;

public class OrderService { }</pre>
</li>
<li><b>Global usings</b> — একটা ফাইলে একবার লিখলে পুরো প্রজেক্টের সব ফাইলে সেই using প্রযোজ্য হয়।
<pre>global using System;
global using System.Collections.Generic;</pre>
</li>
</ul>

<div class="callout mistake"><span class="tag">Common mistake — সব warning suppress করে দেওয়া</span> অনেক বড়, পুরনো codebase-এ হঠাৎ <code>&lt;Nullable&gt;enable&lt;/Nullable&gt;</code> চালু করলে কয়েকশো বা হাজার warning একসাথে চলে আসে। এই অবস্থায় অনেকে বিরক্ত হয়ে পুরো প্রজেক্টে <code>#pragma warning disable CS8602</code> লিখে সব চুপ করিয়ে দেয় — এতে NRT-এর পুরো উদ্দেশ্যই নষ্ট হয়ে যায়, কারণ প্রকৃত null-bug গুলোও চাপা পড়ে যায়। এর বদলে ভালো উপায় হলো প্রজেক্ট বা ফাইল-ভিত্তিক ভাবে ধাপে ধাপে (incrementally) enable করা — নতুন ফাইলে <code>#nullable enable</code> দিয়ে শুরু করা, আর প্রতিটা warning-কে real signal হিসেবে দেখে আসলেই ঠিক করা, শুধু চুপ না করানো।</div>
</template>

<h2 class="title">১২. Advanced Async — ValueTask, IAsyncEnumerable, Channels</h2>
<p class="lead">আগের chapter-এ আমরা <span class="kw">Task</span>, <span class="kw">await</span>, <span class="kw">WhenAll</span>, deadlock trap আর async void vs async Task নিয়ে কাজ করেছি। এবার আরেকটু গভীরে যাব — কীভাবে হট পাথে allocation কমানো যায় (<span class="kw">ValueTask&lt;T&gt;</span>), কীভাবে একটার পর একটা আইটেম stream করা যায় (<span class="kw">IAsyncEnumerable&lt;T&gt;</span>), কীভাবে অপারেশন cooperative-ভাবে cancel করা যায় (<span class="kw">CancellationToken</span>), আর producer/consumer pattern-এর জন্য <span class="kw">Channels</span>।</p>

<h3>১. Task&lt;T&gt; এর allocation সমস্যা এবং ValueTask&lt;T&gt;</h3>
<p><span class="kw">Task&lt;T&gt;</span> একটি reference type — প্রতিবার যখন একটা নতুন <span class="kw">Task&lt;T&gt;</span> তৈরি হয়, সেটা heap-এ একটা নতুন object allocate করে। বেশিরভাগ ক্ষেত্রে এটা কোনো সমস্যা না, কারণ real I/O (ডাটাবেজ কল, HTTP request) এমনিতেই ধীর এবং এই allocation-টা নগণ্য। কিন্তু এমন কিছু hot path আছে যেখানে result প্রায়ই ইতিমধ্যে সিঙ্ক্রোনাসভাবে available থাকে — যেমন একটা in-memory cache থেকে read করা, আর শুধু cache miss হলে real async I/O কল করা। এই ধরনের হট পাথে প্রতিবার একটা নতুন <span class="kw">Task&lt;T&gt;</span> allocate করাটা অহেতুক GC pressure তৈরি করে।</p>
<p><span class="kw">ValueTask&lt;T&gt;</span> একটা struct, যেটা হয় একটা ইতিমধ্যে-গণনা-করা value ধরে রাখতে পারে, নয়তো ভেতরে একটা আসল <span class="kw">Task&lt;T&gt;</span> wrap করতে পারে। যখন result সিঙ্ক্রোনাসভাবেই পাওয়া যায়, কোনো heap allocation হয় না — কারণ struct হওয়ায় সেটা stack-এ (বা caller-এর frame-এ) থাকে।</p>
<pre>public class PriceCache
{
    private readonly Dictionary&lt;string, decimal&gt; _cache = new();

    public ValueTask&lt;decimal&gt; GetPriceAsync(string sku)
    {
        <span class="c">// cache hit হলে সরাসরি value রিটার্ন — কোনো Task allocation নেই</span>
        if (_cache.TryGetValue(sku, out var price))
        {
            return new ValueTask&lt;decimal&gt;(price);
        }

        <span class="c">// cache miss হলে আসল async কাজ — এখানে Task লাগবে</span>
        return new ValueTask&lt;decimal&gt;(FetchFromDbAndCacheAsync(sku));
    }

    private async Task&lt;decimal&gt; FetchFromDbAndCacheAsync(string sku)
    {
        var price = await database.GetPriceAsync(sku);
        _cache[sku] = price;
        return price;
    }
}</pre>
<p>ব্যবহার করার সময় কল করার দিকে কোনো পরিবর্তন লাগে না — <span class="kw">await</span> ঠিক একইভাবে কাজ করে:</p>
<pre>decimal price = await priceCache.GetPriceAsync("SKU-101");</pre>

<div class="callout why"><span class="tag">কেন এটা দরকার</span> High-throughput সার্ভিসে (যেমন প্রতি সেকেন্ডে হাজার হাজার cache lookup) প্রতিটা call-এ একটা নতুন heap object তৈরি হলে GC-কে বাড়তি কাজ করতে হয়, যা latency spike তৈরি করতে পারে। ValueTask&lt;T&gt; ব্যবহার করে সিঙ্ক্রোনাস-completion path-এ এই allocation পুরোপুরি এড়ানো যায়।</div>

<h3>২. ValueTask এর ভেতরে কী ঘটে</h3>
<p>ভেতরে <span class="kw">ValueTask&lt;T&gt;</span> struct-টা মূলত একটা discriminated union-এর মতো কাজ করে — হয় সরাসরি <span class="kw">T</span> value ধরে রাখে, নয়তো একটা <span class="kw">Task&lt;T&gt;</span> reference, নয়তো (আরও advanced ক্ষেত্রে) একটা <span class="kw">IValueTaskSource&lt;T&gt;</span> — যেটা pooled object reuse করে আরও বেশি allocation বাঁচায়। এই জটিলতার কারণেই এটার ব্যবহারে কিছু কড়া নিয়ম মেনে চলতে হয়।</p>

<div class="callout behind"><span class="tag">ভেতরে কী হচ্ছে</span> Task&lt;T&gt; একবার তৈরি হলে তার state (completed/faulted/result) হমেশার জন্য cache হয়ে থাকে, তাই যতবার খুশি await বা .Result পড়া নিরাপদ। ValueTask&lt;T&gt; কিন্তু pooled resource-এর মতো আচরণ করতে পারে — একবার consume হয়ে গেলে সেই underlying state আবার ব্যবহারের জন্য reset বা reuse হয়ে যেতে পারে।</div>

<h3>৩. ValueTask misuse — একবারের বেশি await করা যাবে না</h3>
<p>নিয়মটা সহজ কিন্তু কড়া: একটা <span class="kw">ValueTask&lt;T&gt;</span> কে শুধু <b>একবার</b> await করা যায়। দ্বিতীয়বার await করা, অথবা await করার পরে সেই একই instance-এর উপর আবার কিছু access করা — undefined behavior, এবং প্রায়ই runtime exception বা ভুল result দেয়।</p>
<pre>ValueTask&lt;int&gt; vt = GetValueAsync();

int first = await vt;   <span class="c">// ঠিক আছে</span>
int second = await vt;  <span class="c">// ভুল! একই ValueTask আবার await করা হচ্ছে</span></pre>
<p>এটা <span class="kw">Task&lt;T&gt;</span> এর সাথে সরাসরি বৈপরীত্য — <span class="kw">Task&lt;T&gt;</span> কে যতবার খুশি await বা <span class="kw">.Result</span> দিয়ে পড়া যায়, কারণ এর completed state permanently cache হয়ে থাকে। ValueTask&lt;T&gt; সেই গ্যারান্টি দেয় না।</p>

<div class="callout mistake"><span class="tag">Common mistake — ValueTask দুইবার await করা</span> কেউ যদি ধরে নেয় ValueTask&lt;T&gt; ঠিক Task&lt;T&gt; এর মতোই আচরণ করবে এবং সেটাকে একাধিকবার await করে বা variable-এ ধরে রেখে পরে reuse করার চেষ্টা করে, তাহলে সেটা silently ভুল result দিতে পারে অথবা InvalidOperationException ছুড়তে পারে। যদি একই result একাধিক জায়গায় লাগে, প্রথমেই await করে সাধারণ ভ্যারিয়েবলে রেখে দিন, অথবা প্রয়োজনে <span class="kw">.AsTask()</span> কল করে Task&lt;T&gt; এ রূপান্তর করুন।</div>

<div class="callout best"><span class="tag">Best practice</span> ডিফল্ট হিসেবে সবসময় Task&lt;T&gt; ব্যবহার করুন। ValueTask&lt;T&gt; তখনই ব্যবহার করুন যখন profiling/measurement দিয়ে প্রমাণিত হয়েছে যে কোনো নির্দিষ্ট hot path-এ Task allocation বাস্তবিকই একটা পারফরম্যান্স সমস্যা তৈরি করছে। অকারণে ValueTask ব্যবহার করলে কোডে জটিলতা আর misuse-এর ঝুঁকি বাড়ে, লাভ প্রায় শূন্য।</div>

<h3>৪. IAsyncEnumerable&lt;T&gt; এবং await foreach</h3>
<p>এতদিন আমরা <span class="kw">Task&lt;List&lt;T&gt;&gt;</span> রিটার্ন করা মেথড দেখেছি — যেখানে পুরো collection সম্পূর্ণভাবে তৈরি না হওয়া পর্যন্ত caller-কে অপেক্ষা করতে হয়। <span class="kw">IAsyncEnumerable&lt;T&gt;</span> এর সাথে এটা আলাদা — এখানে একটার পর একটা item asynchronously stream করা যায়, পুরো collection একসাথে মেমরিতে না রেখেই।</p>
<pre>public async IAsyncEnumerable&lt;string&gt; ReadLogLinesAsync(string path)
{
    using var reader = new StreamReader(path);
    string? line;
    while ((line = await reader.ReadLineAsync()) != null)
    {
        yield return line;   <span class="c">// প্রতিটা লাইন আসার সাথে সাথেই পাঠানো হয়</span>
    }
}</pre>
<p>Consumer পাশে <span class="kw">await foreach</span> দিয়ে এই stream পড়া হয় — প্রতিটা item আসামাত্র প্রসেস করা যায়, পুরো ফাইল লোড হওয়ার জন্য অপেক্ষা না করেই:</p>
<pre>await foreach (var line in ReadLogLinesAsync("app.log"))
{
    if (line.Contains("ERROR"))
    {
        Console.WriteLine(line);
    }
}</pre>
<p>এটা বিশেষভাবে দরকারী যখন data source বড় (বড় ফাইল, database cursor, streaming API) — মেমরিতে পুরোটা রাখার দরকার নেই, আর প্রথম item পাওয়ার সাথে সাথেই কাজ শুরু করা যায়।</p>

<h3>৫. CancellationToken — Cooperative Cancellation</h3>
<p>.NET-এ cancellation জোর করে থ্রেড বন্ধ করে দেওয়ার মতো কিছু না — এটা একটা <b>cooperative</b> pattern। একটা <span class="kw">CancellationTokenSource</span> হচ্ছে সেই object যেটা আসলে cancellation trigger করে (প্রায়ই একটা timeout দিয়ে, অথবা ইউজারের কোনো action দিয়ে — যেমন ব্রাউজার ট্যাব বন্ধ করা বা ASP.NET Core-এ request abort হওয়া)। সেই source থেকে একটা <span class="kw">CancellationToken</span> নিয়ে সেটাকে async কলের চেইনে নিচের দিকে পাস করে দেওয়া হয়, এবং প্রতিটা লেয়ার নিজে থেকে নিয়মিত সেটা চেক করে — হয় <span class="kw">token.ThrowIfCancellationRequested()</span> কল করে, নয়তো token-টা কোনো cancellable API-তে সরাসরি পাঠিয়ে দিয়ে।</p>
<pre>public async Task ProcessItemsAsync(IEnumerable&lt;Item&gt; items, CancellationToken token)
{
    foreach (var item in items)
    {
        token.ThrowIfCancellationRequested();  <span class="c">// প্রতি ইটারেশনে চেক</span>

        await ProcessOneAsync(item, token);    <span class="c">// token নিচের দিকে পাস করা হচ্ছে</span>
    }
}</pre>
<p>Caller পাশে timeout সহ cancellation সেটআপ করার সাধারণ প্যাটার্ন:</p>
<pre>using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(30));
try
{
    await ProcessItemsAsync(items, cts.Token);
}
catch (OperationCanceledException)
{
    <span class="c">// ৩০ সেকেন্ডের মধ্যে শেষ না হলে এখানে আসবে</span>
    logger.LogWarning("Processing timed out");
}</pre>

<h3>৬. WhenAll/WhenAny সংক্ষেপে এবং Channels</h3>
<p>আগেই আমরা দেখেছি <span class="kw">Task.WhenAll</span> একাধিক Task-এর সব কয়টা শেষ হওয়া পর্যন্ত অপেক্ষা করে, আর <span class="kw">Task.WhenAny</span> এর মধ্যে যেকোনো একটা আগে শেষ হলেই রিটার্ন করে — এগুলো fixed সংখ্যক, one-shot অপারেশনের জন্য উপযুক্ত। কিন্তু যখন একটা চলমান producer/consumer সম্পর্ক দরকার — যেখানে একটা বা একাধিক producer ধারাবাহিকভাবে item তৈরি করছে আর একটা বা একাধিক consumer সেগুলো প্রসেস করছে — তখন <span class="kw">System.Threading.Channels</span> নামস্পেসের <span class="kw">Channel&lt;T&gt;</span> কাজে আসে।</p>
<p>একটা <span class="kw">Channel&lt;T&gt;</span> মূলত একটা async-friendly queue — producer <span class="kw">ChannelWriter&lt;T&gt;</span> দিয়ে item লেখে, consumer <span class="kw">ChannelReader&lt;T&gt;</span> দিয়ে <span class="kw">await foreach</span> ব্যবহার করে সেগুলো পড়ে। এখানে producer আর consumer-এর গতি একে অপরের থেকে সম্পূর্ণ আলাদা হতে পারে — bounded channel ব্যবহার করলে built-in backpressure পাওয়া যায় (producer বেশি দ্রুত হলে সে অপেক্ষা করবে, consumer তার গতিতে কাজ করবে)।</p>
<pre>var channel = Channel.CreateUnbounded&lt;int&gt;();

<span class="c">// Producer</span>
async Task ProduceAsync()
{
    for (int i = 0; i &lt; 10; i++)
    {
        await channel.Writer.WriteAsync(i);
        await Task.Delay(100);
    }
    channel.Writer.Complete();  <span class="c">// আর কোনো item আসবে না, এটা জানানো হচ্ছে</span>
}

<span class="c">// Consumer</span>
async Task ConsumeAsync()
{
    await foreach (var item in channel.Reader.ReadAllAsync())
    {
        Console.WriteLine($"Received: {item}");
    }
}

await Task.WhenAll(ProduceAsync(), ConsumeAsync());</pre>

<tr><td>Task&lt;T&gt;</td><td>ডিফল্ট choice, প্রায় সব async মেথড</td><td>নিরাপদ, একাধিকবার await/inspect করা যায়</td></tr>

<h3>৭. কমন মিসটেক — CancellationToken চেইনে পাস না করা</h3>
<p>একটা খুব সাধারণ ভুল হলো, বাইরের মেথডে <span class="kw">CancellationToken</span> parameter থাকলেও ভেতরের কোনো async কলে সেটা পাস না করা — ফলে সেই কল implicitly <span class="kw">CancellationToken.None</span> ব্যবহার করে, এবং বাইরের অপারেশন cancel হলেও ভেতরের কাজ থেমে না গিয়ে চলতেই থাকে।</p>
<pre><span class="c">// ভুল — token গ্রহণ করছে কিন্তু নিচে পাস করছে না</span>
public async Task&lt;Data&gt; GetDataAsync(CancellationToken token)
{
    token.ThrowIfCancellationRequested();
    return await httpClient.GetFromJsonAsync&lt;Data&gt;(url);  <span class="c">// token পাস হয়নি!</span>
}</pre>
<pre><span class="c">// ঠিক — token পুরো চেইনে নিচে পর্যন্ত পাস হচ্ছে</span>
public async Task&lt;Data&gt; GetDataAsync(CancellationToken token)
{
    token.ThrowIfCancellationRequested();
    return await httpClient.GetFromJsonAsync&lt;Data&gt;(url, token);  <span class="c">// এখন cancel হলে HTTP কলও থেমে যাবে</span>
}</pre>

<div class="callout mistake"><span class="tag">Common mistake — token চেইনে হারিয়ে যাওয়া</span> যখন কোনো async মেথড আরেকটা async মেথড কল করে কিন্তু CancellationToken parameter পাস করতে ভুলে যায়, তখন বাইরের CancellationTokenSource cancel হলেও ভেতরের কাজ (HTTP call, DB query, delay) ঠিক চলতে থাকবে — কারণ সেটা ডিফল্ট CancellationToken.None নিয়ে চলছিল। এর ফলে ব্যবহারকারী টাইমআউট বা cancel করার পরও ব্যাকগ্রাউন্ডে রিসোর্স ব্যবহার হতেই থাকে। প্রতিটা async signature-এ CancellationToken parameter রাখা এবং প্রতিটা nested কলে সেটা explicit ভাবে পাস করার অভ্যাস করুন।</div>
