<h2 class="title">১৯. Entity Framework Core</h2>
<p class="lead">LINQ অধ্যায়ে আমরা <code>IQueryable&lt;T&gt;</code> নিয়ে একটা প্রতিশ্রুতি রেখেছিলাম যে পরে বিস্তারিত দেখা হবে, আর Expression Trees অধ্যায়ে বলেছিলাম lambda কীভাবে SQL-এ রূপান্তরিত হয় তা EF Core চ্যাপ্টারে ব্যাখ্যা করব। এই অধ্যায়ে সেই প্রতিশ্রুতিগুলো পূরণ করব — Entity Framework Core (EF Core) হলো .NET-এর অফিসিয়াল Object-Relational Mapper (ORM), যা C# ক্লাস আর ডাটাবেজ টেবিলের মধ্যে সেতুবন্ধন তৈরি করে।</p>

<h3>১৭.১ DbContext এবং DbSet</h3>
<p><span class="kw">DbContext</span> হলো EF Core-এর কেন্দ্রীয় ক্লাস — এটাকে বলা যায় একই সাথে <b>Unit of Work</b> এবং <b>Repository</b> প্যাটার্নের বিল্ট-ইন বাস্তবায়ন। এটি ডাটাবেজের সাথে কানেকশন ম্যানেজ করে, entity-গুলোর পরিবর্তন ট্র্যাক করে, এবং <code>SaveChanges()</code> কল হলে সবগুলো পরিবর্তন একসাথে একটা transaction-এ ডাটাবেজে পাঠায়। প্রতিটি <code>DbSet&lt;T&gt;</code> প্রপার্টি একটা টেবিলকে queryable কালেকশন হিসেবে উপস্থাপন করে।</p>
<div class="callout behind"><span class="tag">Unit of Work মানে আসলে কী</span> <b>Unit of Work</b> pattern-এর মূল ধারণা হলো — একাধিক আলাদা পরিবর্তন (একটা entity insert, আরেকটা update, তৃতীয়টা delete) সাথে সাথে ডাটাবেজে না পাঠিয়ে একটা একক "logical transaction"-এর ভেতরে জমা রাখা, এবং শেষে একবারে সবকিছু commit করা — যাতে হয় সব পরিবর্তন সফল হয়, নয়তো কোনোটাই না (all-or-nothing)। <code>DbContext</code> ঠিক এটাই করে: <code>Add</code>/<code>Remove</code>/property পরিবর্তন — কোনোটাই সাথে সাথে ডাটাবেজে যায় না, সবকিছু in-memory change tracker-এ জমা থাকে, আর <code>SaveChanges()</code> কল হলে তবেই সবগুলো একসাথে, একটা transaction-এ ডাটাবেজে পাঠানো হয়। এর সুবিধা — মাঝপথে কোনো একটা পরিবর্তন ব্যর্থ হলে বাকি সব পরিবর্তনও rollback হয়ে যায়, ডাটাবেজ কখনো "আধা-সম্পন্ন" অবস্থায় থাকে না।</div>
<pre>public class ShopDbContext : DbContext
{
    public ShopDbContext(DbContextOptions&lt;ShopDbContext&gt; options)
        : base(options) { }

    public DbSet&lt;Order&gt; Orders =&gt; Set&lt;Order&gt;();
    public DbSet&lt;Customer&gt; Customers =&gt; Set&lt;Customer&gt;();
}</pre>
<p>DI কন্টেইনারে registration করতে হয় <span class="kw">AddDbContext&lt;T&gt;</span> দিয়ে:</p>
<pre>builder.Services.AddDbContext&lt;ShopDbContext&gt;(options =&gt;
    options.UseSqlServer(connectionString));</pre>
<div class="callout why"><span class="tag">কেন Scoped?</span> Dependency Injection অধ্যায়ে আমরা দেখেছিলাম Scoped lifetime মানে একটা request-এর মধ্যে একটাই instance শেয়ার হয়। <code>AddDbContext</code> ডিফল্টভাবে <span class="kw">DbContext</span>-কে Scoped হিসেবে রেজিস্টার করে — এটাই একমাত্র সঠিক লাইফটাইম। <span class="kw">DbContext</span> কখনো Singleton হওয়া উচিত নয়, কারণ এটি thread-safe নয় এবং একাধিক request একসাথে একই instance ব্যবহার করলে change-tracking ডেটা মিশে গিয়ে অনিয়মিত (undefined) আচরণ তৈরি করবে।</div>

<h3>১৭.২ Code-First Migrations</h3>
<p>EF Core-এ সাধারণত <b>Code-First</b> ওয়ার্কফ্লো ব্যবহার করা হয় — মানে ডাটাবেজ স্কিমা হাতে তৈরি না করে C# entity ক্লাস থেকে তৈরি হয়। ওয়ার্কফ্লোটা এমন:</p>
<ul>
<li>C# entity ক্লাসে প্রপার্টি যোগ/পরিবর্তন/মুছে ফেলা হয়</li>
<li><code>dotnet ef migrations add &lt;Name&gt;</code> চালালে EF Core আগের স্ন্যাপশটের সাথে বর্তমান মডেল তুলনা করে একটা migration ফাইল তৈরি করে, যেখানে স্কিমার পার্থক্য (diff) বর্ণনা করা থাকে</li>
<li><code>dotnet ef database update</code> চালালে সেই migration আসল ডাটাবেজে প্রয়োগ হয়</li>
</ul>
<pre>dotnet ef migrations add AddOrderTotalColumn
dotnet ef database update</pre>
<div class="callout best"><span class="tag">Best practice — migration কে version control-এ রাখুন</span> প্রতিটি migration ফাইল একটা reviewable diff — ঠিক যেমন কোডের pull request রিভিউ হয়, তেমনি টিমমেট migration ফাইল দেখে বুঝতে পারে ঠিক কোন কলাম/টেবিল পরিবর্তন হয়েছে। এভাবে ডাটাবেজ স্কিমার ইতিহাস কোডের সাথে একই git repository-তে থাকে, ফলে "কোন ভার্সনে কোন স্কিমা ছিল" এই প্রশ্নের উত্তর সবসময় কোড থেকেই পাওয়া যায়।</div>

<h3>১৭.৩ Querying — IQueryable কীভাবে SQL-এ অনুবাদ হয়</h3>
<p>Expression Trees অধ্যায়ে দেখেছিলাম <code>IQueryable&lt;T&gt;</code>-এর উপর lambda লিখলে তা কম্পাইল হয়ে ডেটা নয়, বরং একটা <b>expression tree</b> — অর্থাৎ কোডের গঠন বর্ণনাকারী একটা ডেটা স্ট্রাকচার — তৈরি করে। EF Core ঠিক এই মেকানিজম ব্যবহার করে: <code>dbContext.Orders.Where(o =&gt; o.Total &gt; 100)</code> লিখলে EF Core-এর SQL provider সেই expression tree পড়ে এবং তাকে একটা <code>WHERE</code> ক্লজে অনুবাদ করে। ফিল্টারিং হয় ডাটাবেজের ভেতরে, C# মেমোরিতে নয় — অর্থাৎ সব রো টেনে এনে তারপর ফিল্টার করা হয় না।</p>
<pre>var bigOrders = dbContext.Orders
    .Where(o =&gt; o.Total &gt; 100)
    .OrderBy(o =&gt; o.CreatedAt)
    .ToList();
<span class="c">// প্রায় এভাবে অনুবাদ হয়:</span>
<span class="c">// SELECT * FROM Orders WHERE Total &gt; 100 ORDER BY CreatedAt</span></pre>
<div class="callout behind"><span class="tag">ভেতরে কী ঘটে</span> যতক্ষণ না <code>ToList()</code>, <code>ToListAsync()</code>, <code>First()</code>-এর মতো কোনো "materializing" মেথড কল হয়, ততক্ষণ কোনো ডাটাবেজ কল হয় না — expression tree শুধু জমা হতে থাকে। এটা LINQ চ্যাপ্টারের deferred execution ধারণারই একটা বাস্তব প্রয়োগ।</div>

<h3>১৭.৪ Tracking বনাম No-Tracking কোয়েরি</h3>
<p><span class="kw">DbContext</span> ডিফল্টভাবে কোনো কোয়েরির মাধ্যমে ফিরে আসা প্রতিটি entity-কে <b>ট্র্যাক</b> করে — মানে সেই entity-র একটা স্ন্যাপশট মেমোরিতে রেখে দেয়, যাতে পরে <code>SaveChanges()</code> কল হলে বোঝা যায় কোন প্রপার্টি বদলেছে। এই ট্র্যাকিং মেমোরি ও CPU খরচ করে — যেসব কোয়েরি শুধু পড়ার জন্য (রিপোর্টিং, তালিকা দেখানো, কোনো আপডেটের ইচ্ছা নেই), সেখানে এই খরচ অপ্রয়োজনীয়। এজন্য <span class="kw">AsNoTracking()</span> ব্যবহার করা হয়।</p>
<pre><span class="c">// Tracking (ডিফল্ট) — পরে আপডেট করার ইচ্ছা থাকলে</span>
var order = await dbContext.Orders.FirstAsync(o =&gt; o.Id == 5);

<span class="c">// No-Tracking — শুধু পড়ার জন্য, দ্রুত এবং কম মেমোরি</span>
var orders = await dbContext.Orders
    .AsNoTracking()
    .Where(o =&gt; o.Status == "Shipped")
    .ToListAsync();</pre>
<table>
<tr><th>পরিস্থিতি</th><th>কোনটা ব্যবহার করবেন</th></tr>
<tr><td>পরে প্রপার্টি বদলে SaveChanges করবেন</td><td>Tracking (ডিফল্ট)</td></tr>
<tr><td>শুধু তালিকা/রিপোর্ট দেখানো, কোনো লেখা নেই</td><td>AsNoTracking()</td></tr>
<tr><td>বড় পরিমাণ ডেটা রিড-অনলি API রেসপন্সে পাঠানো</td><td>AsNoTracking()</td></tr>
<tr><td>একটা entity আপডেট করে যেই query থেকে আনা হয়েছে সেটাই save করতে হবে</td><td>Tracking (ডিফল্ট)</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সব জায়গায় ডিফল্ট tracking রেখে দেওয়া</span> একটা বড় read-heavy API-তে যদি প্রতিটি GET এন্ডপয়েন্ট ডিফল্ট tracking দিয়ে কোয়েরি চালায়, তাহলে অপ্রয়োজনীয়ভাবে মেমোরি ব্যবহার বাড়ে এবং পারফরম্যান্স কমে। রিড-অনলি এন্ডপয়েন্টে সবসময় <code>AsNoTracking()</code> যোগ করার অভ্যাস করুন।</div>

<h3>১৭.৫ Change Tracking এবং SaveChanges</h3>
<p>একটা ট্র্যাক করা entity-র প্রপার্টি বদলে <span class="kw">SaveChangesAsync()</span> কল করলে EF Core নিজে বুঝে নেয় কোন কলামগুলো বদলেছে এবং সেই অনুযায়ী সঠিক <code>UPDATE</code>, <code>INSERT</code>, বা <code>DELETE</code> স্টেটমেন্ট তৈরি করে চালায় — হাতে SQL লেখার প্রয়োজন হয় না।</p>
<pre>var order = await dbContext.Orders.FirstAsync(o =&gt; o.Id == 5);
order.Status = "Shipped";
order.ShippedAt = DateTime.UtcNow;

await dbContext.SaveChangesAsync();
<span class="c">// প্রায় এভাবে অনুবাদ হয়:</span>
<span class="c">// UPDATE Orders SET Status = 'Shipped', ShippedAt = @p0 WHERE Id = 5</span></pre>
<p>নতুন entity যোগ করতে <code>dbContext.Orders.Add(newOrder)</code> এবং মুছতে <code>dbContext.Orders.Remove(order)</code> ব্যবহার করা হয় — উভয় ক্ষেত্রেই আসল <code>INSERT</code> বা <code>DELETE</code> ততক্ষণ চলে না, যতক্ষণ <code>SaveChangesAsync()</code> কল না হয়।</p>

<h3>১৭.৬ সম্পর্ক এবং লোডিং স্ট্র্যাটেজি</h3>
<p>এন্টিটির মধ্যে one-to-many বা many-to-many সম্পর্ক প্রকাশ করতে <b>navigation property</b> ব্যবহার হয় — যেমন <code>Customer</code>-এর একটা <code>List&lt;Order&gt;</code> প্রপার্টি থাকতে পারে। কিন্তু এই সম্পর্কিত ডেটা কখন লোড হবে তা নিয়ন্ত্রণ করার জন্য EF Core তিনটি কৌশল দেয়।</p>
<pre>public class Customer
{
    public int Id { get; set; }
    public string Name { get; set; } = "";
    public List&lt;Order&gt; Orders { get; set; } = new();
}

<span class="c">// Eager loading — একই কোয়েরিতে সম্পর্কিত ডেটাও নিয়ে আসে</span>
var customers = await dbContext.Customers
    .Include(c =&gt; c.Orders)
    .ToListAsync();

<span class="c">// Explicit loading — প্রয়োজন হলে পরে হাতে লোড করা</span>
var customer = await dbContext.Customers.FirstAsync(c =&gt; c.Id == 1);
await dbContext.Entry(customer).Collection(c =&gt; c.Orders).LoadAsync();</pre>
<table>
<tr><th>কৌশল</th><th>কীভাবে কাজ করে</th><th>মন্তব্য</th></tr>
<tr><td>Eager loading</td><td><code>.Include(...)</code> দিয়ে একই কোয়েরিতে JOIN করে সম্পর্কিত ডেটা আনে</td><td>সবচেয়ে predictable, কোয়েরির সংখ্যা আগে থেকে জানা যায়</td></tr>
<tr><td>Lazy loading</td><td>navigation property প্রথমবার access হলে স্বয়ংক্রিয়ভাবে আলাদা কোয়েরি চালায়</td><td>navigation property অবশ্যই <span class="kw">virtual</span> হতে হবে + proxies প্যাকেজ লাগবে; সহজে অজান্তে অনেক কোয়েরি তৈরি করে ফেলতে পারে</td></tr>
<tr><td>Explicit loading</td><td><code>.Entry(...).Collection(...).Load()</code> দিয়ে হাতে করে যখন দরকার তখন লোড করা</td><td>নিয়ন্ত্রণ সবচেয়ে বেশি, কিন্তু কোড বেশি লিখতে হয়</td></tr>
</table>

<h3>১৭.৭ N+1 কোয়েরি সমস্যা</h3>
<p>এটা EF Core-এ সবচেয়ে সাধারণ এবং সবচেয়ে বিপজ্জনক পারফরম্যান্স ফাঁদ। ধরুন lazy loading চালু আছে, এবং আমরা N জন কাস্টমার নিয়ে একটা লুপ চালিয়ে প্রতিটির অর্ডার সংখ্যা প্রিন্ট করছি:</p>
<pre>var customers = await dbContext.Customers.ToListAsync(); <span class="c">// ১টা কোয়েরি: সব কাস্টমার আনে</span>

foreach (var customer in customers)
{
    Console.WriteLine($"{customer.Name}: {customer.Orders.Count} orders");
    <span class="c">// প্রতিবার customer.Orders access হলে lazy loading একটা নতুন কোয়েরি পাঠায়!</span>
}</pre>
<p>এখানে প্রথমে ১টা কোয়েরি কাস্টমার আনতে চলে, তারপর লুপের প্রতিটি ইটারেশনে <code>customer.Orders</code> access করার মুহূর্তে lazy loading একটা করে আলাদা কোয়েরি ডাটাবেজে পাঠায়। N জন কাস্টমার থাকলে মোট <b>1 + N</b> টা আলাদা কোয়েরি চলে — ১০০০ কাস্টমারের জন্য ১০০১টা রাউন্ড-ট্রিপ ডাটাবেজে যায়, যেখানে ১টা ভালোভাবে লেখা কোয়েরিতেই কাজ শেষ হওয়ার কথা ছিল।</p>
<div class="callout mistake"><span class="tag">Common mistake — লুপের ভেতরে navigation property access</span> লুপে navigation property access করা দেখতে সাধারণ প্রপার্টি অ্যাক্সেসের মতোই লাগে, তাই ডেভেলপার প্রায়ই বুঝতেই পারে না প্রতিটি অ্যাক্সেস একটা নতুন ডাটাবেজ কল ট্রিগার করছে — যতক্ষণ না প্রোডাকশনে লগ বা প্রোফাইলার দেখায় হাজার হাজার কোয়েরি চলছে।</div>
<p>সমাধান হলো <span class="kw">Include()</span> দিয়ে eager loading করে একই কোয়েরিতে সম্পর্কিত ডেটা আগে থেকেই নিয়ে আসা:</p>
<pre>var customers = await dbContext.Customers
    .Include(c =&gt; c.Orders)
    .ToListAsync(); <span class="c">// একটাই কোয়েরি, JOIN সহ</span>

foreach (var customer in customers)
{
    Console.WriteLine($"{customer.Name}: {customer.Orders.Count} orders");
    <span class="c">// এখানে আর কোনো অতিরিক্ত কোয়েরি চলে না — Orders আগে থেকেই মেমোরিতে আছে</span>
}</pre>
<div class="callout why"><span class="tag">LINQ চ্যাপ্টারের সাথে যোগসূত্র</span> এটা আসলে deferred execution এবং multiple enumeration সমস্যারই একটা আত্মীয়। LINQ অধ্যায়ে দেখেছিলাম একটা <code>IEnumerable&lt;T&gt;</code>-কে একাধিকবার enumerate করলে তা অজান্তে বারবার এক্সিকিউট হতে পারে — এখানেও একই মূল বার্তা: কোড দেখতে সরল হলেও, প্রতিটি অ্যাক্সেসের পেছনে কী ঘটছে তা না বুঝলে কোয়েরি আপনার প্রত্যাশার চেয়ে অনেক বেশিবার চলে। দুটোতেই সমাধান একই দর্শনের — আগে থেকে materialize/eager-load করে ফেলা, এবং প্রতিটি অ্যাক্সেসকে "বিনামূল্যে" ধরে না নেওয়া।</div>
<div class="callout best"><span class="tag">Best practice — production-এ generated SQL লগ করুন</span> ডেভেলপমেন্টের সময় <code>AddDbContext</code>-এ <code>.LogTo(Console.WriteLine)</code> বা EF Core-এর built-in logging চালু রেখে প্রতিটি রিকোয়েস্টে ঠিক কয়টা SQL কোয়েরি চলছে তা চোখে চোখে রাখুন — N+1 সমস্যা প্রায়ই কোড রিভিউতে ধরা পড়ে না, কিন্তু লগে সহজেই দেখা যায়।</div>
</template>

<template data-page="testing">
<h2 class="title">২০. Testing — Unit, Mock, Integration</h2>
<p class="lead">কোর্সের শেষ অধ্যায়ে আমরা দেখব কীভাবে একটা C# অ্যাপ্লিকেশনের সঠিকতা নিশ্চিত করা যায় স্বয়ংক্রিয়ভাবে — <span class="kw">Unit Test</span>, <span class="kw">Mock</span> আর <span class="kw">Integration Test</span>-এর মাধ্যমে। এতদিন যা শিখেছি — OOP, DI, async, EF Core, ASP.NET Core — টেস্টিং হলো সেই সব কিছু ঠিকভাবে কাজ করছে কিনা তার প্রমাণ।</p>

<h3>১. xUnit দিয়ে Unit Testing-এর basics</h3>
<p><span class="kw">xUnit</span> হলো .NET-এর সবচেয়ে জনপ্রিয় টেস্টিং ফ্রেমওয়ার্ক। একটা টেস্ট মেথডকে <code>[Fact]</code> attribute দিয়ে চিহ্নিত করলেই সেটা টেস্ট রানার চিনে নেয়। প্রতিটা ভালো টেস্ট সাধারণত তিনটা ধাপে লেখা হয় — <b>Arrange-Act-Assert (AAA)</b> প্যাটার্ন: প্রথমে ইনপুট আর অবজেক্ট প্রস্তুত করা (Arrange), তারপর যে কাজটা টেস্ট করছি সেটা কল করা (Act), শেষে ফলাফল যাচাই করা (Assert)।</p>
<pre>public class CalculatorTests
{
    [Fact]
    public void Add_TwoPositiveNumbers_ReturnsSum()
    {
        <span class="c">// Arrange</span>
        var calculator = new Calculator();

        <span class="c">// Act</span>
        var result = calculator.Add(2, 3);

        <span class="c">// Assert</span>
        Assert.Equal(5, result);
    }
}</pre>
<p>একই লজিক একাধিক ইনপুটের বিপরীতে টেস্ট করতে হলে বারবার <code>[Fact]</code> মেথড না লিখে <code>[Theory]</code> আর <code>[InlineData]</code> ব্যবহার করা হয় — এতে একই টেস্ট বডি বিভিন্ন প্যারামিটার নিয়ে বারবার রান হয়।</p>
<pre>[Theory]
[InlineData(2, 3, 5)]
[InlineData(-1, 1, 0)]
[InlineData(0, 0, 0)]
public void Add_VariousInputs_ReturnsExpectedSum(int a, int b, int expected)
{
    var calculator = new Calculator();
    var result = calculator.Add(a, b);
    Assert.Equal(expected, result);
}</pre>

<h3>২. ভালো ইউনিট মানে isolation-এ টেস্টযোগ্য ডিজাইন</h3>
<p>এখানেই আগের <span class="kw">Dependency Injection</span> অধ্যায়ের সাথে সরাসরি সংযোগ। যে ক্লাস কনস্ট্রাক্টরে ইন্টারফেস ইনজেক্ট করে (constructor injection), কংক্রিট ক্লাস <code>new</code> করে না — সেই ক্লাস সহজেই isolation-এ টেস্ট করা যায়। কারণ টেস্টের সময় আসল ডাটাবেস বা নেটওয়ার্ক কলের বদলে একটা fake বা mock ইমপ্লিমেন্টেশন বসিয়ে দেওয়া যায়।</p>
<p>যদি কোনো ক্লাস ভেতরে সরাসরি <code>new SqlOrderRepository()</code> লিখে ফেলে, তাহলে সেই ক্লাসের টেস্ট চালাতে গেলেও আসল ডাটাবেস লাগবে — যা ধীর, ভঙ্গুর, আর ইউনিট টেস্টের সংজ্ঞার বিপরীত। তাই DI-friendly ডিজাইনই টেস্টযোগ্যতার (testability) ভিত্তি।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> DI শুধু আর্কিটেকচারের সৌন্দর্যের জন্য নয় — এটা টেস্টিং সম্ভব করার মূল কৌশল। ইন্টারফেসের পেছনে ডিপেন্ডেন্সি লুকিয়ে রাখলেই সেই সীমানায় fake বসিয়ে বাকি লজিক আলাদা করে যাচাই করা যায়।</div>

<h3>৩. Moq দিয়ে Mocking</h3>
<p><span class="kw">Moq</span> হলো .NET-এর সবচেয়ে ব্যবহৃত mocking লাইব্রেরি। এটা দিয়ে যেকোনো ইন্টারফেসের একটা "নকল" ইমপ্লিমেন্টেশন রানটাইমে তৈরি করা যায় — কোনো বাস্তব কোড না লিখেই। <code>.Setup(...).Returns(...)</code> দিয়ে বলে দেওয়া যায় কোনো মেথড কল হলে কী রিটার্ন করবে, আর <code>.Verify(...)</code> দিয়ে যাচাই করা যায় যে নির্দিষ্ট মেথডটা আসলেই কল হয়েছিল কিনা।</p>
<p>ধরা যাক আগের অধ্যায়ে দেখা <code>OrderService</code>, যেটা কনস্ট্রাক্টরে <code>IOrderRepository</code> ইনজেক্ট করে নেয়:</p>
<pre>public class OrderService
{
    private readonly IOrderRepository _repository;

    public OrderService(IOrderRepository repository)
    {
        _repository = repository;
    }

    public bool PlaceOrder(Order order)
    {
        if (order.Quantity &lt;= 0)
            return false;

        _repository.Save(order);
        return true;
    }
}</pre>
<p>এখন Moq দিয়ে আসল ডাটাবেস ছাড়াই এই সার্ভিসের আচরণ টেস্ট করা যায়:</p>
<pre>public class OrderServiceTests
{
    [Fact]
    public void PlaceOrder_ValidOrder_SavesAndReturnsTrue()
    {
        <span class="c">// Arrange</span>
        var mockRepo = new Mock&lt;IOrderRepository&gt;();
        mockRepo.Setup(r =&gt; r.Save(It.IsAny&lt;Order&gt;()));

        var service = new OrderService(mockRepo.Object);
        var order = new Order { Quantity = 2 };

        <span class="c">// Act</span>
        var result = service.PlaceOrder(order);

        <span class="c">// Assert</span>
        Assert.True(result);
        mockRepo.Verify(r =&gt; r.Save(order), Times.Once);
    }

    [Fact]
    public void PlaceOrder_InvalidQuantity_DoesNotSave()
    {
        var mockRepo = new Mock&lt;IOrderRepository&gt;();
        var service = new OrderService(mockRepo.Object);
        var order = new Order { Quantity = 0 };

        var result = service.PlaceOrder(order);

        Assert.False(result);
        mockRepo.Verify(r =&gt; r.Save(It.IsAny&lt;Order&gt;()), Times.Never);
    }
}</pre>
<p>লক্ষ্য করুন — এই টেস্টে কোনো আসল ডাটাবেস স্পর্শ করা হয়নি, তবুও <code>OrderService</code>-এর ব্যবসায়িক লজিক (quantity বৈধতা, সেভ কল হচ্ছে কিনা) পুরোপুরি যাচাই হয়ে গেছে।</p>

<h3>৪. Test Double-এর পরিভাষা</h3>
<p>"টেস্ট ডাবল" (test double) একটা ছাতা-টার্ম যার নিচে Mock, Stub, Fake — এই তিনটা আলাদা ধারণা পড়ে। এগুলো আলাদা করে চিনতে পারা জরুরি, কারণ ভিন্ন প্রেক্ষাপটে ভিন্নটা দরকার হয়।</p>

<tr><th>ধরন</th><th>কাজ</th><th>উদাহরণ</th></tr>

<h3>৫. WebApplicationFactory দিয়ে Integration Testing</h3>
<p>ইউনিট টেস্ট একটা ক্লাসকে বাকি সিস্টেম থেকে আলাদা করে টেস্ট করে। কিন্তু কখনো কখনো জানা দরকার — পুরো পাইপলাইনটা (routing, middleware, DI registration, ডাটাবেস সংযোগ) আসলেই একসাথে ঠিকভাবে কাজ করছে কিনা। এখানে কাজে আসে <span class="kw">WebApplicationFactory&lt;TEntryPoint&gt;</span> — এটা মেমোরিতে পুরো ASP.NET Core অ্যাপটাকে একটা টেস্ট সার্ভার হিসেবে চালু করে দেয়, আসল নেটওয়ার্ক পোর্ট ছাড়াই।</p>
<pre>public class OrdersEndpointTests : IClassFixture&lt;WebApplicationFactory&lt;Program&gt;&gt;
{
    private readonly HttpClient _client;

    public OrdersEndpointTests(WebApplicationFactory&lt;Program&gt; factory)
    {
        _client = factory.CreateClient();
    }

    [Fact]
    public async Task GetOrders_ReturnsSuccessAndJson()
    {
        <span class="c">// Act</span>
        var response = await _client.GetAsync("/api/orders");

        <span class="c">// Assert</span>
        response.EnsureSuccessStatusCode();
        Assert.Equal("application/json; charset=utf-8",
            response.Content.Headers.ContentType?.ToString());
    }
}</pre>
<p>কবে ইউনিট টেস্ট আর কবে ইন্টিগ্রেশন টেস্ট লিখব — এই সিদ্ধান্তটা গতির (speed) সাথে বাস্তবতার (realism) একটা ট্রেড-অফ। ব্যবসায়িক লজিকের প্রতিটা শাখা-প্রশাখা, edge case দ্রুত ও isolated ইউনিট টেস্ট দিয়ে ঢেকে ফেলা উচিত — এগুলো মিলিসেকেন্ডে চলে। আর middleware order, routing configuration, DI registration আসলেই ঠিকভাবে যুক্ত হয়েছে কিনা যাচাই করতে দরকার ইন্টিগ্রেশন টেস্ট — কিন্তু এগুলো ধীর, তাই সংখ্যায় কম রাখাই বাস্তবসম্মত।</p>

  │   Unit Tests       │        │  Integration Tests     │

  └───────────────────┘        └───────────────────────┘

</pre></div>

<h3>৬. সাধারণ ভুল — implementation টেস্ট করা, coverage-কে গুণ ভাবা</h3>
<div class="callout mistake"><span class="tag">Common mistake — ভেতরের বাস্তবায়ন টেস্ট করা</span> টেস্ট লেখার সময় অনেকে ক্লাসের <b>observable behavior</b>-এর বদলে তার ভেতরের বাস্তবায়ন (implementation detail) যাচাই করে ফেলে — যেমন কোনো প্রাইভেট মেথড ঠিক কতবার, কী ক্রমে কল হলো তা assert করা, বা এতটা mock বসানো যে টেস্টটা শুধু mock setup-এরই প্রতিধ্বনি হয়ে দাঁড়ায়, বাস্তব আচরণ কিছুই যাচাই করে না। এমন টেস্ট ভঙ্গুর হয় — ব্যবহারকারীর জন্য কোনো আচরণ না বদলেও, শুধু ভেতরের রিফ্যাক্টরিংয়ে টেস্ট ভেঙে যায়।</div>
<div class="callout mistake"><span class="tag">Common mistake — 100% coverage মানেই ভালো টেস্ট নয়</span> কোড কভারেজ শুধু মাপে কোন কোন লাইন এক্সিকিউট হয়েছে, এটা মাপে না যে টেস্টে অর্থপূর্ণ assertion আছে কিনা। একটা টেস্ট প্রতিটা লাইন ছুঁয়ে গিয়েও কিছুই যাচাই না করে পাস হয়ে যেতে পারে — তাই coverage সংখ্যাকে লক্ষ্য না বানিয়ে, টেস্টের মান আর প্রাসঙ্গিকতাকেই আসল মাপকাঠি ধরা উচিত।</div>
<div class="callout best"><span class="tag">Best practice — আচরণ টেস্ট করুন, বাস্তবায়ন নয়</span> টেস্ট লেখার সময় নিজেকে প্রশ্ন করুন — "আমি কি এই ক্লাসের পাবলিক কন্ট্রাক্ট (ইনপুট → আউটপুট, side effect) যাচাই করছি, নাকি এটা ভেতরে কীভাবে কাজ করে তা?" প্রথমটাই টেস্টকে রিফ্যাক্টরিং-প্রতিরোধী (refactor-safe) রাখে।</div>

<h3>১) dotnet run চালালে ভেতরে ঠিক কী ঘটে — IL, JIT, CLR এর ভূমিকা কী?</h3>

<h3>২) struct আর class ভ্যারিয়েবল assign করলে ভিন্ন আউটপুট আসে কেন?</h3>
<pre>public struct PointStruct { public int X; }
public class PointClass { public int X; }

PointStruct a = new PointStruct { X = 1 };
PointStruct b = a;
b.X = 99;
Console.WriteLine(a.X);   <span class="c">// আউটপুট: 1</span>

PointClass c = new PointClass { X = 1 };
PointClass d = c;
d.X = 99;
Console.WriteLine(c.X);   <span class="c">// আউটপুট: 99</span></pre>
<p><b>ব্যাখ্যা:</b> <code>struct</code> একটা value type — assign করলে পুরো ডেটার একটা স্বতন্ত্র কপি তৈরি হয়, তাই <code>b.X</code> বদলালে <code>a.X</code> অপরিবর্তিত থাকে। <code>class</code> একটা reference type — assign করলে শুধু heap-এর একই object-এর ঠিকানা কপি হয়, তাই <code>c</code> আর <code>d</code> একই object-কে নির্দেশ করে এবং একটা দিয়ে বদলালে অন্যটাতেও দেখা যায় (Memory Management অধ্যায়ে বিস্তারিত)।</p>

<pre>int number = 42;
object boxed = number;      <span class="c">// boxing — heap-এ নতুন allocation</span>

for (int i = 0; i &lt; 100000; i++)

<h3>৪) .NET-এর Generational GC ঠিক কীভাবে কাজ করে, আর IDisposable কেন দরকার?</h3>
<p><b>ব্যাখ্যা:</b> GC heap-এর অবজেক্টকে তিনটা generation-এ ভাগ করে — Gen 0 (নতুন, স্বল্পস্থায়ী অবজেক্ট, সবচেয়ে ঘন ঘন কালেক্ট হয়), Gen 1 (Gen 0-এ বেঁচে যাওয়া), আর Gen 2 (দীর্ঘজীবী অবজেক্ট, সবচেয়ে কম ঘন ঘন কালেক্ট হয়) — "most objects die young" এই ধারণার উপর ভিত্তি করে। কিন্তু GC শুধু <b>মেমরি</b> সামলায় — ফাইল হ্যান্ডেল, ডাটাবেজ কানেকশনের মতো unmanaged resource সামলায় না। তাই <code>IDisposable</code> ইন্টারফেস আর <code>using</code>/<code>using var</code> ব্যবহার করে deterministic cleanup নিশ্চিত করা হয়, কারণ finalizer-এর ওপর নির্ভর করলে resource release অনির্দিষ্ট সময় পর্যন্ত আটকে থাকতে পারে (Memory Management অধ্যায়ে বিস্তারিত)।</p>

<h3>৫) base class-এ virtual লিখতে ভুলে গেলে polymorphism-এ কী সমস্যা হয়?</h3>
<pre>class Animal
{

class Dog : Animal
{

a.MakeSound();  <span class="c">// আউটপুট: "Some generic sound." — Bark! আসেনি!</span></pre>
<p><b>ব্যাখ্যা:</b> base class-এর method <code>virtual</code> না থাকলে derived class-এ <code>override</code> লেখা যায় না — compiler নীরবে সেটাকে <code>new</code> (method hiding) হিসেবে ধরে নেয়। ফলে কোন method কল হবে তা ঠিক হয় compile-time reference type (<code>Animal</code>) অনুযায়ী, actual object type (<code>Dog</code>) অনুযায়ী নয়। এই বাগ ধরা কঠিন কারণ কোড নিখুঁতভাবে কম্পাইল হয়, শুধু ভুল আউটপুট দেয় (OOP অধ্যায়ে বিস্তারিত)।</p>

<h3>৬) Interface আর Abstract Class-এর মধ্যে পার্থক্য কী, কখন কোনটা বেছে নেবেন?</h3>
<p><b>ব্যাখ্যা:</b> Interface শুধু একটা contract — কোনো field বা constructor রাখতে পারে না, আর একটা class একাধিক interface implement করতে পারে। Abstract class আংশিক implementation ও field রাখতে পারে, কিন্তু একটা class শুধু একটাই class inherit করতে পারে। নিয়ম হলো — "IS-A" সম্পর্ক আর কোড শেয়ার করতে চাইলে abstract class, শুধু "CAN-DO" ক্ষমতা বর্ণনা করতে চাইলে (যেমন <code>IDisposable</code>) interface ব্যবহার করুন (OOP অধ্যায়ে বিস্তারিত)।</p>

<h3>৭) LINQ query define করার পরে underlying collection বদলালে কী হয়?</h3>
<pre>var numbers = new List&lt;int&gt; { 1, 2, 3 };
var query = numbers.Where(n =&gt; n &gt; 1);   <span class="c">// এখানে এখনো execute হয়নি</span>

numbers.Add(4);

foreach (var n in query)
    Console.WriteLine(n);  <span class="c">// আউটপুট: 2, 3, 4 — Add(4) সহ!</span></pre>
<p><b>ব্যাখ্যা:</b> এটাই LINQ-এর <span class="kw">Deferred Execution</span> — <code>Where</code>, <code>Select</code>-এর মতো operator query define করার সময় কিছুই execute করে না, শুধু একটা iterator (state machine) তৈরি করে। query আসলে চলে যখন <code>foreach</code> দিয়ে enumerate করা হয় বা <code>.ToList()</code>-এর মতো materializing call হয় — তাই মাঝখানে source বদলে গেলে সেই বদলানো ডেটাই ফলাফলে দেখা যায় (LINQ অধ্যায়ে বিস্তারিত)।</p>

<h3>৮) একই LINQ query একাধিকবার enumerate করলে কী সমস্যা হতে পারে?</h3>
<pre>var expensiveQuery = data.Where(x =&gt; SlowCheck(x));

if (expensiveQuery.Any())              <span class="c">// পুরো pipeline ১ম বার চললো</span>
    foreach (var item in expensiveQuery)   <span class="c">// পুরো pipeline আবার ২য় বার চললো</span>
        Process(item);</pre>
<p><b>ব্যাখ্যা:</b> deferred execution-এর কারণে একই query দুইবার enumerate করলে পুরো filter/map pipeline প্রতিবারই শুরু থেকে আবার চলে — ব্যয়বহুল বা external কল থাকলে এটা মারাত্মক পারফরম্যান্স সমস্যা তৈরি করে, এমনকি সোর্স মাঝে বদলে গেলে দুইবার ভিন্ন ফলাফলও আসতে পারে। সমাধান হলো <code>.ToList()</code>/<code>.ToArray()</code> দিয়ে একবার materialize করে ফেলা (LINQ অধ্যায়ে বিস্তারিত)।</p>

<h3>৯) IEnumerable&lt;T&gt; আর IQueryable&lt;T&gt;-এর মধ্যে execution model-এর পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> <code>IEnumerable&lt;T&gt;</code>-এর operator সাধারণ delegate-এ কম্পাইল হয় এবং সব লজিক মেমোরিতে, ইতিমধ্যে লোড হওয়া ডেটার উপর চলে। <code>IQueryable&lt;T&gt;</code>-এর operator একটা expression tree তৈরি করে, যা provider (যেমন EF Core) পড়ে সমতুল্য SQL-এ ট্রান্সলেট করে — ফিল্টারিং ডাটাবেজের ভেতরেই ঘটে। একটা <code>IQueryable</code>-কে আগেই <code>.ToList()</code> দিয়ে <code>IEnumerable</code>-এ নামিয়ে আনলে পরের <code>.Where()</code> মেমোরিতে চলে — পুরো টেবিল আগেই লোড হয়ে যায় (LINQ ও EF Core অধ্যায়ে বিস্তারিত)।</p>

<h3>১০) for লুপের ভেতরে lambda তৈরি করলে নিচের কোডের আউটপুট কী হবে?</h3>
<pre>var actions = new List&lt;Action&gt;();
for (int i = 0; i &lt; 3; i++)
    actions.Add(() =&gt; Console.WriteLine(i));

foreach (var act in actions) act();
<span class="c">// আউটপুট: 3  3  3  — 0 1 2 নয়!</span></pre>
<p><b>ব্যাখ্যা:</b> <code>for</code> লুপে ঘোষিত <code>i</code> পুরো লুপ জুড়ে একটাই শেয়ার্ড ভ্যারিয়েবল — প্রতিটা lambda সেই একই ভ্যারিয়েবলটাকে closure হিসেবে ক্যাপচার করে, কপি করে না। লুপ শেষ হওয়ার পর <code>i</code>-এর মান 3, তাই সব lambda call করলে 3-ই দেখা যায়। (উল্লেখ্য, <code>foreach</code>-এ C# 5.0 থেকে প্রতি ইটারেশনে নতুন ভ্যারিয়েবল স্কোপ হয় বলে সেখানে এই সমস্যা হয় না।) সমাধান — লুপের ভেতরে একটা local কপি বানানো: <code>int local = i;</code> (Delegate · Event · Lambda অধ্যায়ে বিস্তারিত)।</p>

<h3>১১) public delegate field-এর বদলে event keyword ব্যবহার করা হয় কেন, আর event সাবস্ক্রাইব করে unsubscribe না করলে কী সমস্যা হয়?</h3>
<pre>public class Subscriber : IDisposable
{
    private readonly OrderProcessor _processor;
    public Subscriber(OrderProcessor processor)
    {
        _processor = processor;
        _processor.OrderCompleted += OnOrderCompleted;
    }
    private void OnOrderCompleted(object? s, OrderEventArgs e) { }
    public void Dispose() =&gt; _processor.OrderCompleted -= OnOrderCompleted;  <span class="c">// জরুরি!</span>
}</pre>
<p><b>ব্যাখ্যা:</b> সাধারণ public delegate field এক্সপোজ করলে বাইরের কোড সরাসরি <code>Invoke()</code> কল করতে পারবে বা <code>=</code> দিয়ে সব সাবস্ক্রাইবার মুছে নিজের হ্যান্ডলার বসিয়ে দিতে পারবে — <code>event</code> keyword এটা এনক্যাপসুলেট করে, বাইরে থেকে শুধু <code>+=</code>/<code>-=</code> ব্যবহারযোগ্য থাকে। আর subscriber যদি <code>-=</code> দিয়ে unsubscribe না করে, publisher (বিশেষত singleton বা দীর্ঘজীবী object) তার delegate তালিকায় subscriber-এর রেফারেন্স ধরে রাখে, ফলে GC সেই subscriber-কে কখনো collect করতে পারে না — এটাই classic .NET event memory leak (Delegate · Event · Lambda অধ্যায়ে বিস্তারিত)।</p>

<h3>১২) throw; আর throw ex; -এর মধ্যে পার্থক্য কী?</h3>
<pre>catch (FormatException ex)
{
    LogError(ex);
    throw;      <span class="c">// ✅ original stack trace সংরক্ষিত থাকে</span>
}
catch (FormatException ex)
{
    LogError(ex);
    throw ex;   <span class="c">// ❌ stack trace এই লাইন থেকে রিসেট হয়ে যায়</span>
}</pre>
<p><b>ব্যাখ্যা:</b> <code>throw;</code> (কিছু ছাড়াই) original exception-কে তার সম্পূর্ণ stack trace-সহ re-throw করে — exception আসলে কোথায় প্রথম ঘটেছিল সেই তথ্য বজায় থাকে। কিন্তু <code>throw ex;</code> লিখলে stack trace ঐ লাইন থেকেই নতুন করে শুরু হয়ে যায়, ফলে মূল error কোথায় ঘটেছিল সেই তথ্য হারিয়ে যায় — production debugging-এ এটা বড় সমস্যা তৈরি করে (Exception Handling অধ্যায়ে বিস্তারিত)।</p>

<h3>১৩) async void মেথড ব্যবহার করা কেন বিপজ্জনক, async Task এর বদলে?</h3>
<p><b>ব্যাখ্যা:</b> <code>async void</code> মেথডের ভেতরের exception কোনো Task-এ ধরা থাকে না — সরাসরি SynchronizationContext-এ থ্রো হয় এবং সাধারণত পুরো প্রসেস ক্র্যাশ করে দেয়, caller-এর try/catch কখনো সেটা ধরতে পারে না। তাছাড়া <code>async void</code>-কে await করারও কোনো উপায় নেই, তাই caller জানতেও পারে না কাজ কখন শেষ হলো। এজন্য <code>async void</code> শুধু UI event handler-এর মতো একেবারে top-level জায়গায় ব্যবহার করা উচিত, বাকি সব ক্ষেত্রে <code>async Task</code> রিটার্ন করা উচিত (Async/Await অধ্যায়ে বিস্তারিত)।</p>

<h3>১৪) .Result বা .Wait() ব্যবহার করলে কীভাবে deadlock হতে পারে?</h3>
<pre>public void Button_Click(object sender, EventArgs e)
{
    string data = GetDataAsync().Result;  <span class="c">// DEADLOCK! (UI/ASP.NET-এর মতো context-এ)</span>
}
public async Task&lt;string&gt; GetDataAsync()
{
    var result = await client.GetStringAsync(url);
    return result;  <span class="c">// continuation captured context-এ ফিরতে চায়</span>
}</pre>
<p><b>ব্যাখ্যা:</b> <code>.Result</code> UI থ্রেডকে ব্লক করে ফেলে, আর <code>GetDataAsync</code>-এর ভেতরের <code>await</code> সম্পন্ন হওয়ার পর তার continuation captured <code>SynchronizationContext</code>-এ (একই UI থ্রেডে) ফিরে আসতে চায় — কিন্তু সেই থ্রেড তো ইতিমধ্যে <code>.Result</code>-এ ব্লকড হয়ে বসে আছে, তাই continuation কখনো চলতে পারে না। মডার্ন ASP.NET Core-এ কোনো SynchronizationContext না থাকায় এই নির্দিষ্ট deadlock সাধারণত ঘটে না, কিন্তু WPF/WinForms-এর মতো UI অ্যাপে এই ঝুঁকি এখনো বাস্তব (Async/Await অধ্যায়ে বিস্তারিত)।</p>

<h3>১৫) ConfigureAwait(false) আসলে কী করে, আর কখন ব্যবহার করা উচিত?</h3>
<p><b>ব্যাখ্যা:</b> <code>ConfigureAwait(false)</code> continuation-কে বলে দেয় যে original captured context-এ ফিরে আসার দরকার নেই, যেকোনো ThreadPool থ্রেডে চললেই হবে। এটা মূলত library কোডে best practice হিসেবে ব্যবহার করা হয়, কারণ library জানে না caller কোন ধরনের context (UI থ্রেড, ASP.NET request context) থেকে আসছে — এতে deadlock ঝুঁকি কমে এবং সামান্য পারফরম্যান্স সুবিধাও পাওয়া যায় (Async/Await অধ্যায়ে বিস্তারিত)।</p>

<h3>১৬) DI-তে Transient, Scoped আর Singleton lifetime-এর পার্থক্য কী, আর Captive Dependency bug কীভাবে ঘটে?</h3>
<pre>public class ReportCache
{
    private readonly AppDbContext _dbContext;
    public ReportCache(AppDbContext dbContext) { _dbContext = dbContext; }  <span class="c">// captured!</span>
}
builder.Services.AddSingleton&lt;ReportCache&gt;();
builder.Services.AddScoped&lt;AppDbContext&gt;();</pre>
<p><b>ব্যাখ্যা:</b> <code>Transient</code> প্রতিবার নতুন instance দেয়, <code>Scoped</code> একই scope (সাধারণত একটা HTTP request)-এর মধ্যে একটাই instance দেয়, আর <code>Singleton</code> পুরো অ্যাপ্লিকেশনের জীবনকালে একটাই instance রাখে। উপরের কোডে <code>ReportCache</code> Singleton হওয়ায় একবারই তৈরি হয় — তার constructor-এ যে Scoped <code>AppDbContext</code> প্রথমবার resolve হয়, সেটাই চিরকালের জন্য আটকে (captured) থাকে, ফলে পরবর্তী প্রতিটা request নিজের আলাদা <code>DbContext</code> না পেয়ে সেই একই পুরনো instance ব্যবহার করতে বাধ্য হয় — এটাই <span class="kw">Captive Dependency</span> bug, যা race condition ও ভুল ডেটা তৈরি করে। সমাধান — Singleton-এর ভেতরে প্রয়োজনের সময় <code>IServiceScopeFactory</code> দিয়ে নিজে একটা নতুন scope তৈরি করা (Dependency Injection অধ্যায়ে বিস্তারিত)।</p>

<h3>১৭) EF Core-এ N+1 query problem কী, আর এটা কীভাবে সমাধান করবেন?</h3>
<pre>var customers = await dbContext.Customers.ToListAsync(); <span class="c">// ১টা কোয়েরি</span>
foreach (var customer in customers)
    Console.WriteLine($"{customer.Name}: {customer.Orders.Count}");
    <span class="c">// প্রতিবার customer.Orders access হলে lazy loading নতুন কোয়েরি পাঠায়!</span></pre>
<p><b>ব্যাখ্যা:</b> lazy loading চালু থাকলে লুপের প্রতিটা ইটারেশনে navigation property (<code>customer.Orders</code>) access করার মুহূর্তে একটা করে আলাদা কোয়েরি ডাটাবেজে যায় — N জন কাস্টমারের জন্য মোট 1+N কোয়েরি চলে, যেখানে ১টা কোয়েরিতেই কাজ শেষ হওয়ার কথা ছিল। সমাধান হলো <code>.Include(c =&gt; c.Orders)</code> দিয়ে eager loading করে একই কোয়েরিতে JOIN-সহ সম্পর্কিত ডেটা আগে থেকেই নিয়ে আসা। পাশাপাশি, শুধু পড়ার জন্য (রিপোর্ট, তালিকা) কোয়েরিতে <code>AsNoTracking()</code> ব্যবহার করলে change-tracking-এর অতিরিক্ত খরচ বাঁচে (Entity Framework Core অধ্যায়ে বিস্তারিত)।</p>

<h3>১৮) record টাইপ default equality-এর দিক থেকে class থেকে আলাদা কেন?</h3>
<pre>public record PointRecord(int X, int Y);
public class PointClass { public int X, Y; }

var r1 = new PointRecord(3, 4);
var r2 = new PointRecord(3, 4);
Console.WriteLine(r1 == r2);   <span class="c">// True — value equality</span>

var c1 = new PointClass { X = 3, Y = 4 };
var c2 = new PointClass { X = 3, Y = 4 };
Console.WriteLine(c1 == c2);   <span class="c">// False — reference equality</span></pre>
<p><b>ব্যাখ্যা:</b> <code>class</code>-এ default <code>==</code>/<code>.Equals()</code> reference equality করে — দুইটা variable একই heap object পয়েন্ট করছে কিনা তা চেক করে, ভেতরের ডেটা এক হলেও নয়। <code>record</code> কম্পাইলার নিজেই <code>Equals</code>, <code>GetHashCode</code>, <code>==</code>/<code>!=</code> জেনারেট করে দেয় property-wise (value) তুলনার জন্য, তাই সব property সমান হলে দুইটা record সমান বিবেচিত হয় — এটা immutable ডেটা মডেল/DTO-এর জন্য উপযোগী, যেখানে identity নয়, ভেতরের মানই গুরুত্বপূর্ণ (Modern C# অধ্যায়ে বিস্তারিত)।</p>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
