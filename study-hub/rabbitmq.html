<template data-page="foundation">
<h2 class="title">১. Foundation — RabbitMQ কী?</h2>
<p class="lead">এক লাইনে: RabbitMQ একটা <span class="kw">message broker</span> — দুই বা একাধিক service-এর মাঝখানে দাঁড়িয়ে message নিরাপদে এক দিক থেকে নিয়ে আরেক দিকে পৌঁছে দেয়, যাতে তারা সরাসরি একে অপরের ওপর নির্ভর না করে।</p>

<h3>RabbitMQ ঠিক কী?</h3>
<p>RabbitMQ একটা open-source, Erlang-এ লেখা message broker যা মূলত <span class="kw">AMQP 0-9-1</span> protocol বাস্তবায়ন করে (MQTT, STOMP plugin-ও আছে)। এর কাজ — producer-এর পাঠানো message গ্রহণ করা, নিয়ম অনুযায়ী সঠিক queue-তে <b>route</b> করা, আর consumer সেটা process না করা পর্যন্ত ধরে রাখা।</p>
<div class="callout why"><span class="tag">Smart broker, dumb consumer</span>
RabbitMQ-র দর্শন: <b>routing-এর বুদ্ধি broker-এর ভেতরে</b> — exchange, binding, routing key দিয়ে broker ঠিক করে কোন message কোথায় যাবে; consumer শুধু নিজের queue থেকে পড়ে। এটা Kafka-র উল্টো (Kafka = "dumb broker, smart consumer" — সেখানে consumer নিজে offset track করে, broker শুধু log রাখে)। তাই RabbitMQ complex routing/task-distribution-এ শক্তিশালী, Kafka high-throughput event-log-এ।</div>

<h3>কেন দরকার? — কোন সমস্যা</h3>
<ul>
<li><b>Decoupling:</b> order-service সরাসরি email-service-কে না ডেকে একটা message পাঠায়; email-service down থাকলেও message queue-তে বসে থাকে।</li>
<li><b>Async / load leveling:</b> ভারী কাজ (PDF তৈরি, email) সাথে সাথে না করে queue-তে রেখে background worker ধীরে ধীরে করে — traffic spike shock absorb হয়।</li>
<li><b>Work distribution:</b> একটা queue-তে অনেক worker consumer বসিয়ে কাজ ভাগ করে দেওয়া যায় (competing consumers)।</li>
<li><b>Routing:</b> একই message বিভিন্ন নিয়মে বিভিন্ন queue-তে পাঠানো (fanout/topic)।</li>
</ul>

<h3>মূল মানসিক ছবি — Producer কখনো সরাসরি Queue-তে পাঠায় না</h3>
<p>RabbitMQ-র সবচেয়ে গুরুত্বপূর্ণ ধারণা: <b>producer message পাঠায় একটা <span class="kw">exchange</span>-এ, queue-তে নয়।</b> Exchange তার <span class="kw">binding</span> ও <span class="kw">routing key</span> দেখে ঠিক করে message কোন কোন queue-তে যাবে। এই indirection-ই RabbitMQ-কে নমনীয় করে।</p>

<h3>RabbitMQ vs Kafka — এক নজরে</h3>
<table>
<tr><th></th><th>RabbitMQ</th><th>Kafka</th></tr>
<tr><td>মডেল</td><td>Message broker (queue-ভিত্তিক)</td><td>Distributed log (append-only)</td></tr>
<tr><td>Routing বুদ্ধি</td><td>Broker-এ (exchange/binding)</td><td>Consumer-এ (offset/partition)</td></tr>
<tr><td>Message পড়ার পর</td><td>ack হলে queue থেকে <b>মুছে যায়</b></td><td>retention পর্যন্ত <b>থেকে যায়</b> (replay সহজ)</td></tr>
<tr><td>শক্তি</td><td>Complex routing, task queue, RPC, per-message TTL/priority</td><td>বিশাল throughput, event sourcing, stream</td></tr>
<tr><td>Ordering</td><td>একক queue-তে FIFO</td><td>per-partition</td></tr>
</table>
<div class="callout best"><span class="tag">কখন RabbitMQ বাছবেন</span>
জটিল routing, background job/task distribution, request-reply (RPC), অথবা per-message priority/TTL দরকার হলে RabbitMQ আদর্শ। বিশাল event stream/replay/log analytics দরকার হলে Kafka।</div>

<template data-page="amqp">
<h2 class="title">২. AMQP Protocol</h2>
<p class="lead">RabbitMQ যে ভাষায় কথা বলে — <span class="kw">AMQP 0-9-1</span> (Advanced Message Queuing Protocol)। এই protocol-ই exchange/queue/binding-এর ধারণা সংজ্ঞায়িত করে।</p>

<h3>AMQP আসলে কী?</h3>
<p>AMQP একটা <b>binary wire-level protocol</b> — অর্থাৎ client ও broker কীভাবে bytes আদান-প্রদান করবে তা নির্দিষ্ট করা আছে, তাই যেকোনো ভাষার client (.NET, Java, Python) একই RabbitMQ broker-এর সাথে কাজ করতে পারে। HTTP যেমন text-ভিত্তিক request/response, AMQP তেমন message-ভিত্তিক, কিন্তু binary ও অনেক efficient।</p>
<p>গুরুত্বপূর্ণ: RabbitMQ মূলত <b>AMQP 0-9-1</b> ব্যবহার করে (AMQP 1.0 আলাদা protocol, plugin দিয়ে সমর্থিত)। এই কোর্সে "AMQP" মানে 0-9-1।</p>

<h3>AMQP model — যে সত্তাগুলো protocol সংজ্ঞায়িত করে</h3>
<table>
<tr><th>সত্তা</th><th>কাজ</th></tr>
<tr><td><span class="kw">Connection</span></td><td>Client ও broker-এর মাঝে একটা TCP সংযোগ</td></tr>
<tr><td><span class="kw">Channel</span></td><td>Connection-এর ভেতরে virtual "sub-connection" (multiplexing)</td></tr>
<tr><td><span class="kw">Exchange</span></td><td>Message গ্রহণ করে ও route করে</td></tr>
<tr><td><span class="kw">Queue</span></td><td>Message জমা রাখে consume হওয়া পর্যন্ত</td></tr>
<tr><td><span class="kw">Binding</span></td><td>Exchange → Queue সংযোগের নিয়ম</td></tr>
<tr><td><span class="kw">Message</span></td><td>Payload (body) + properties (headers, delivery mode…)</td></tr>
</table>

<h3>Frames ও Methods (ভেতরের কথা)</h3>
<p>AMQP-তে সব যোগাযোগ ছোট ছোট <span class="kw">frame</span>-এ ভাগ হয়: method frame (যেমন <code>basic.publish</code>, <code>queue.declare</code>), header frame (message properties + size), body frame (আসল payload, বড় হলে টুকরো টুকরো)। Client library এসব লুকিয়ে রাখে — আপনি শুধু <code>QueueDeclare()</code>, <code>BasicPublish()</code> ইত্যাদি call করেন।</p>
<div class="diagram"><pre>
AMQP method কয়েকটা উদাহরণ (client → broker):
  connection.start / .open   — সংযোগ ও authenticate
  channel.open               — channel খোলা
  exchange.declare           — exchange তৈরি/নিশ্চিত
  queue.declare / queue.bind — queue তৈরি ও binding
  basic.publish              — message পাঠানো
  basic.consume / basic.get  — message নেওয়া (push / pull)
  basic.ack / .nack / .reject— acknowledgement
</pre></div>

<h3>Port ও নিরাপত্তা</h3>
<table>
<tr><th>Port</th><th>কী</th></tr>
<tr><td><code>5672</code></td><td>AMQP (plaintext)</td></tr>
<tr><td><code>5671</code></td><td>AMQPS — TLS সহ AMQP (production-এ এটাই)</td></tr>
<tr><td><code>15672</code></td><td>Management UI + HTTP API (plugin)</td></tr>
<tr><td><code>25672</code></td><td>Inter-node / cluster যোগাযোগ</td></tr>
</table>
<div class="callout behind"><span class="tag">Behind the scenes</span>
একটা AMQP connection খোলার সময় protocol negotiation হয় (version, auth mechanism যেমন PLAIN, heartbeat interval, সর্বোচ্চ channel সংখ্যা, সর্বোচ্চ frame size)। এই <code>heartbeat</code> (default ~60s) দিয়ে broker ও client পরস্পরের জীবিত থাকা যাচাই করে — dead connection সময়মতো ধরা পড়ে।</div>
</template>

<template data-page="connchan">
<h2 class="title">৩. Connections & Channels</h2>
<p class="lead">RabbitMQ-তে দক্ষতার প্রথম পাঠ: <b>connection ব্যয়বহুল, channel সস্তা</b>। এই দুটো গুলিয়ে ফেললেই production-এ সমস্যা।</p>

<h3>Connection</h3>
<p>একটা <span class="kw">connection</span> = client আর broker-এর মধ্যে একটা <b>TCP সংযোগ</b> (TLS হলে handshake সহ)। এটা তৈরি করা তুলনামূলক খরচের — তাই application-এ অল্প কয়েকটা connection রাখাই নিয়ম, প্রতি operation-এ নতুন connection নয়।</p>

<h3>Channel</h3>
<p>একটা <span class="kw">channel</span> হলো একটা connection-এর ভেতরে চলা <b>lightweight virtual connection</b>। প্রায় সব AMQP কাজ (declare, publish, consume, ack) channel-এর ওপর হয়। একটা TCP connection-এর ভেতরে অনেকগুলো channel multiplex করা যায় — ফলে হাজারটা কাজের জন্য হাজারটা TCP socket খুলতে হয় না।</p>

<h3>নিয়ম যা ভাঙলেই bug</h3>
<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li><b>প্রতি message-এ নতুন connection</b> খোলা — ভয়ানক ধীর ও broker-এ file-descriptor শেষ। একটা connection বানিয়ে দীর্ঘ সময় ব্যবহার করুন।</li>
<li><b>একটা channel একাধিক thread-এ share</b> করা — channel <b>thread-safe নয়</b>। প্রতি thread/worker-এর নিজের channel থাকুক।</li>
<li>একটা channel দিয়ে হাজারটা কাজ — একটা channel-এ error হলে broker পুরো channel বন্ধ করে দেয়, তখন ওই channel-এর সব কাজ থামে।</li>
</ul></div>
<div class="callout best"><span class="tag">Best practice</span>
<ul style="margin:4px 0">
<li>Application-প্রতি অল্প connection (যেমন একটা publish-এর জন্য, একটা consume-এর জন্য)।</li>
<li>Publish ও consume আলাদা connection-এ রাখুন — flow control-এ (নিচে) publisher block হলে consumer যেন না আটকায়।</li>
<li><b>Automatic recovery</b> চালু রাখুন (.NET: <code>AutomaticRecoveryEnabled=true</code>) — network hiccup-এ client নিজে connection/channel/consumer পুনরায় জোড়া লাগায়।</li>
</ul></div>
</template>

<template data-page="model">
<h2 class="title">৪. Exchange · Queue · Binding · Routing Key</h2>
<p class="lead">RabbitMQ-র হৃদয়। এই চারটা একসাথে ঠিক করে "কোন message কোন queue-তে যাবে"। এখানে সময় দিন — বাকি সব এর ওপর দাঁড়িয়ে।</p>

<h3>Exchange — routing-এর মস্তিষ্ক</h3>
<p>Producer সব message <span class="kw">exchange</span>-এ পাঠায়। Exchange নিজে message জমায় না — সে শুধু নিয়ম দেখে queue-তে <b>copy/route</b> করে দেয় (কোনো queue না মিললে message হারায় বা DLX-এ যায়)। Exchange-এর ধরন (type) ঠিক করে সে কীভাবে route করবে।</p>

<h4>চার ধরনের Exchange</h4>
<table>
<tr><th>Type</th><th>routing নিয়ম</th><th>ব্যবহার</th></tr>
<tr><td><span class="kw">direct</span></td><td>routing key == binding key হুবহু মিললে</td><td>নির্দিষ্ট queue-তে পাঠানো (log level, task type)</td></tr>
<tr><td><span class="kw">fanout</span></td><td>routing key উপেক্ষা করে <b>সব</b> bound queue-তে</td><td>Broadcast (সবাইকে একই event)</td></tr>
<tr><td><span class="kw">topic</span></td><td>routing key প্যাটার্ন মিলিয়ে (<code>*</code> / <code>#</code>)</td><td>নমনীয় routing (<code>order.created.eu</code>)</td></tr>
<tr><td><span class="kw">headers</span></td><td>routing key নয়, message header মিলিয়ে</td><td>একাধিক attribute দিয়ে routing</td></tr>
</table>
<div class="callout behind"><span class="tag">Default exchange</span>
প্রতিটা RabbitMQ-তে একটা নামহীন (<code>""</code>) default direct exchange থাকে — যার সাথে প্রতিটা queue তার নিজের নামে auto-bound। তাই <code>basic.publish("", "myqueue", ...)</code> দিলে সরাসরি <code>myqueue</code>-তে যায়। শেখার সময় সহজ, কিন্তু production-এ নিজের exchange বানানোই ভালো (নিয়ন্ত্রণ থাকে)।</div>

<div class="callout behind"><span class="tag">৫ম ধরন — consistent-hash exchange (plugin)</span>
উপরের চারটাই core AMQP-তে built-in। একটা প্লাগ-ইন (<code>rabbitmq_consistent_hash_exchange</code>) আরেকটা কাজের ধরন দেয়: routing key (বা header) hash করে সেই hash-এর ভিত্তিতে queue-গুলোর মধ্যে <b>একটাকে</b> বেছে message পাঠায় — একই key সবসময় একই queue-তে যায়, কিন্তু ভিন্ন key ছড়িয়ে যায় সব queue-তে (load spread)। এটাই সেই কৌশল যা দিয়ে <b>per-key ordering</b> পাওয়া যায় partition-এর মতো (Kafka-র partition key-এর সমতুল্য) — বিস্তারিত Producer/Consumer অধ্যায়ে ordering আলোচনায়।</div>

<h4>Topic exchange — wildcard routing</h4>
<p>Routing key কয়েকটা শব্দে ভাগ, <b>.</b> দিয়ে আলাদা (যেমন <code>order.created.eu</code>)। Binding key-তে দুটো wildcard:</p>
<ul>
<li><code>*</code> — ঠিক <b>একটা</b> শব্দ মেলে।</li>
<li><code>#</code> — <b>শূন্য বা একাধিক</b> শব্দ মেলে।</li>
</ul>
<div class="diagram"><pre>
Exchange type = topic;  message routing key = "order.created.eu"

 binding key          মেলে?   কেন
 ----------------------------------------------------------
 order.created.eu     ✅       হুবহু
 order.created.*      ✅       * = "eu" (এক শব্দ)
 order.#              ✅       # = "created.eu" (একাধিক শব্দ)
 order.*              ❌       * এক শব্দ, কিন্তু বাকি দুই শব্দ
 *.created.*          ✅       তিন শব্দ, মাঝেরটা "created"
 payment.#            ❌       প্রথম শব্দ মেলেনি
</pre></div>

<h3>Queue — message-এর ঘর</h3>
<p><span class="kw">Queue</span> message জমা রাখে যতক্ষণ না consumer ack করে। কিছু গুরুত্বপূর্ণ property (queue declare-এর সময়):</p>
<table>
<tr><th>Property</th><th>মানে</th></tr>
<tr><td><span class="kw">durable</span></td><td>broker restart-এ queue টিকে থাকে (message persistent হলে সেগুলোও)</td></tr>
<tr><td><span class="kw">exclusive</span></td><td>শুধু যে connection বানিয়েছে তার জন্য; connection বন্ধ হলে queue মুছে যায়</td></tr>
<tr><td><span class="kw">auto-delete</span></td><td>শেষ consumer চলে গেলে queue মুছে যায়</td></tr>
<tr><td><code>x-message-ttl</code></td><td>message কতক্ষণ বাঁচবে (DLX ট্যাব)</td></tr>
<tr><td><code>x-max-length</code></td><td>সর্বোচ্চ কত message; বেশি হলে পুরনো drop/DLX</td></tr>
<tr><td><code>x-dead-letter-exchange</code></td><td>reject/expire হলে কোথায় পাঠাবে</td></tr>
</table>

<h3>Binding ও Routing Key — যোগসূত্র</h3>
<p><span class="kw">Binding</span> হলো exchange আর queue-এর মধ্যে একটা "নিয়মের তার"। direct/topic exchange-এ binding-এর সাথে একটা <span class="kw">binding key</span> থাকে। Producer message-এ যে <span class="kw">routing key</span> দেয়, exchange সেটাকে binding key-এর সাথে মিলিয়ে সিদ্ধান্ত নেয়।</p>
<div class="callout why"><span class="tag">Routing key vs binding key</span>
<b>Routing key</b> — producer message পাঠানোর সময় দেয় ("এই message-এর ঠিকানা")। <b>Binding key</b> — queue যখন exchange-এ bind হয় তখন দেয় ("আমি এই ঠিকানার message চাই")। Exchange দুটো মিলিয়ে route করে। fanout exchange routing key উপেক্ষা করে, তাই সেখানে binding key অর্থহীন।</div>

<h4>উদাহরণ — direct exchange দিয়ে log routing</h4>
<div class="diagram"><pre>
exchange "logs" (direct)
   ├─ binding key "error" ──► queue: errors-only      (শুধু error)
   ├─ binding key "info"  ──► queue: all-logs
   └─ binding key "error" ──► queue: all-logs         (error-ও পায়)

publish(routing key="error") → errors-only + all-logs দুটোতেই যায়
publish(routing key="info")  → শুধু all-logs
</pre></div>

<h3>Unroutable message — কোনো queue না মিললে?</h3>
<p>Exchange যদি routing key দেখে <b>কোনো</b> matching binding/queue না পায়, তাহলে default-এ message নীরবে <b>ফেলে দেওয়া হয়</b> (drop) — production-এ যা নীরব data loss। তিনভাবে এটা ধরা/সামলানো যায়:</p>
<table>
<tr><th>কৌশল</th><th>কীভাবে</th><th>ফল</th></tr>
<tr><td><span class="kw">mandatory</span> flag</td><td>publish-এ <code>mandatory=true</code></td><td>route না হলে broker message publisher-কে <b>ফেরত</b> পাঠায় (<code>basic.return</code>)</td></tr>
<tr><td><span class="kw">Alternate Exchange</span> (AE)</td><td>exchange arg <code>alternate-exchange</code></td><td>route না হওয়া message ঐ বিকল্প exchange-এ চলে যায়</td></tr>
<tr><td>কিছুই না (default)</td><td>—</td><td>message নীরবে drop — ⚠ data loss</td></tr>
</table>
<p><b>mandatory + return:</b> publisher <code>BasicReturn</code> event handle করে জানে "এই message কোথাও গেল না" → log/alert/DLQ করা যায়। <b>Alternate Exchange</b> broker-side সমাধান: unmatched সব message একটা catch-all exchange→queue-তে জমে, publisher-কে কিছু করতে হয় না।</p>
<pre><span class="c">// Alternate Exchange — unmatched message এখানে জমবে</span>
var exArgs = new Dictionary&lt;string, object&gt; { { "alternate-exchange", "orders.unrouted" } };
channel.ExchangeDeclare("orders", ExchangeType.Direct, durable:true, autoDelete:false, arguments:exArgs);

<span class="c">// অথবা mandatory + return handler (publisher side)</span>
channel.BasicReturn += (s, ea) =&gt;
    Log($"unroutable: exchange={ea.Exchange} key={ea.RoutingKey} reason={ea.ReplyText}");
channel.BasicPublish("orders", "no.match.key", mandatory:true, basicProperties:props, body:body);</pre>
<div class="callout best"><span class="tag">Best practice</span>
Production-এ প্রতিটা গুরুত্বপূর্ণ exchange-এ একটা <b>Alternate Exchange</b> (catch-all) রাখুন — routing key-তে typo বা binding মুছে গেলেও message হারাবে না, বরং unrouted queue-তে জমে alert দেবে।</div>
</template>

<template data-page="pubsub">
<h2 class="title">৫. Producer · Consumer · Message Lifecycle</h2>
<p class="lead">Message কীভাবে জন্মায়, ভ্রমণ করে, আর শেষ হয় — publish থেকে ack পর্যন্ত পুরো জীবনচক্র।</p>

<h3>Producer (Publisher)</h3>
<p>Producer-এর কাজ: connection → channel → exchange declare → <code>basic.publish</code> (exchange নাম + routing key + properties + body)। Producer জানে না কোন queue আছে — সে শুধু exchange আর routing key দেয়।</p>
<p>গুরুত্বপূর্ণ message <span class="kw">properties</span>:</p>
<table>
<tr><th>Property</th><th>কাজ</th></tr>
<tr><td><code>delivery_mode=2</code> (<span class="kw">persistent</span>)</td><td>message disk-এ লেখা হয় → broker restart-এ টেকে</td></tr>
<tr><td><code>expiration</code></td><td>per-message TTL (ms)</td></tr>
<tr><td><code>priority</code></td><td>priority queue-তে আগে delivery</td></tr>
<tr><td><code>correlation_id</code> / <code>reply_to</code></td><td>RPC/request-reply pattern</td></tr>
<tr><td><code>headers</code></td><td>custom metadata (headers exchange, tracing)</td></tr>
<tr><td><code>message_id</code></td><td>idempotency/dedup-এর জন্য unique id</td></tr>
</table>

<h3>Consumer — Push বনাম Pull</h3>
<table>
<tr><th></th><th>Push (<code>basic.consume</code>)</th><th>Pull (<code>basic.get</code>)</th></tr>
<tr><td>কীভাবে</td><td>Broker message এলেই consumer-কে ঠেলে দেয়</td><td>Consumer প্রতিবার একটা করে চেয়ে নেয়</td></tr>
<tr><td>Throughput</td><td>উচ্চ — continuous stream</td><td>নিম্ন — প্রতি message-এ round-trip</td></tr>
<tr><td>ব্যবহার</td><td>প্রায় সব ক্ষেত্রে <b>এটাই</b></td><td>কালেভদ্রে, একটা-দুটো message দরকার হলে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
Loop-এ বারবার <code>basic.get</code> (polling) করে "consume" করা — ভয়ানক অদক্ষ (প্রতি call একটা network round-trip, queue খালি থাকলেও)। প্রায় সবসময় <code>basic.consume</code> (push) ব্যবহার করুন।</div>

<h3>Message Lifecycle — পুরো যাত্রা</h3>
<div class="diagram"><pre>
① Producer  basic.publish(exchange, routing key, body, props)
                │
② Exchange   binding + routing key মিলিয়ে queue বাছে
                │  (কোনো queue না মিললে → drop বা DLX/return)
③ Queue      message জমা (persistent হলে disk-এ)
                │
④ Broker     consumer-কে push (prefetch সীমার মধ্যে)
                │
⑤ Consumer   process করে
                │
⑥ Ack        basic.ack → broker queue থেকে message মুছে দেয় ✅
             basic.nack/reject(requeue=false) → DLX/drop ☠️
             basic.nack(requeue=true) → আবার queue-তে (retry) 🔁
</pre></div>
<div class="callout behind"><span class="tag">Behind the scenes — message মুছে যায় কখন</span>
Kafka-র মতো RabbitMQ message ধরে রাখে না। একবার consumer <b>ack</b> করলে broker সেই message queue থেকে <b>স্থায়ীভাবে মুছে</b> দেয় — replay করা যায় না। তাই ভুলে ack করার আগেই যদি process fail করে, message হারাতে পারে (এজন্যই manual ack — পরের ট্যাব)।</div>

<h3>একটা সাধারণ প্রবাহ (pseudo)</h3>
<div class="diagram"><pre>
Producer:
  channel.exchange_declare("orders", "direct", durable=true)
  channel.publish("orders", key="invoice.created", body=json, persistent=true)

Consumer:
  channel.queue_declare("billing", durable=true)
  channel.queue_bind("billing", "orders", key="invoice.created")
  channel.basic_consume("billing", on_message, auto_ack=false)
     → on_message: process(); channel.basic_ack(tag)
</pre></div>

<h3>Message ordering — গ্যারান্টি ও ফাঁদ</h3>
<p>RabbitMQ একটা <b>একক queue</b>-তে message <span class="kw">FIFO</span> (যে ক্রমে ঢুকেছে সে ক্রমে) রাখে। কিন্তু এই ordering সহজেই ভাঙে:</p>
<ul>
<li><b>একাধিক consumer:</b> একই queue-তে দুই consumer parallel-এ process করে — সম্পূর্ণ order আর থাকে না।</li>
<li><b>requeue / redelivery:</b> <code>nack(requeue=true)</code> করা message queue-র সামনে ফিরে আসে → ক্রম এলোমেলো।</li>
<li><b>priority / TTL:</b> priority queue বা per-message expiry স্বাভাবিক ক্রম বদলে দেয়।</li>
</ul>
<h4>Single Active Consumer — কঠোর order দরকার হলে</h4>
<p>একই queue-তে একাধিক consumer connect করলেও যদি চান একসাথে <b>শুধু একটা</b> active থাকুক (বাকিরা standby), তাহলে queue declare-এ <code>x-single-active-consumer=true</code> দিন। তখন এক consumer সব message ক্রমে পায়; সে মরলে broker স্বয়ংক্রিয়ভাবে পরের standby-কে active করে — <b>order + failover একসাথে</b>।</p>
<div class="callout why"><span class="tag">Ordering বনাম throughput</span>
কঠোর ordering আর parallelism পরস্পরবিরোধী — order দরকার হলে single active consumer (parallelism হারিয়ে), throughput দরকার হলে একাধিক consumer (order হারিয়ে)। মাঝামাঝি: <b>per-key order</b> যথেষ্ট হলে key অনুযায়ী আলাদা queue-তে routing করুন (consistent-hash exchange) — তখন প্রতি queue-তে order, queue-এর মধ্যে parallelism।</div>
</template>

<template data-page="reliability">
<h2 class="title">৬. Publisher Confirms · Manual Acks · Prefetch (QoS)</h2>
<p class="lead">"Message হারাবে না" নিশ্চিত করার তিন স্তম্ভ — publish দিক থেকে confirm, consume দিক থেকে ack, আর ন্যায্য বণ্টনের জন্য prefetch।</p>

<h3>Publisher Confirms — broker কি সত্যিই পেয়েছে?</h3>
<p>Default-এ <code>basic.publish</code> "fire and forget" — broker পেল কি না জানার উপায় নেই (message exchange-এ পৌঁছানোর আগেই connection মরলে নীরবে হারায়)। <span class="kw">Publisher confirms</span> চালু করলে (<code>confirm.select</code>) broker প্রতিটা message নিরাপদে গ্রহণ (persistent হলে disk-এ লেখা) করার পর publisher-কে একটা <b>ack</b> ফেরত দেয়।</p>
<div class="diagram"><pre>
Publisher ─publish(seq=1)─► Broker  ── queue-তে (ও persistent হলে disk-এ) ─► ✅ ack(1) ─► Publisher
Publisher ─publish(seq=2)─► Broker  ── route করার queue নেই / error ────────► ✖ nack(2) ─► Publisher
</pre></div>
<div class="callout best"><span class="tag">কীভাবে ব্যবহার</span>
Throughput ধরে রাখতে message-প্রতি অপেক্ষা না করে <b>batch</b> বা <b>async</b> confirm ব্যবহার করুন (একগুচ্ছ publish করে সব ack একসাথে যাচাই)। সবচেয়ে বিশ্বস্ত: async confirm + <code>message_id</code> track করে nack হলে ঐ message আবার পাঠানো।</div>

<h3>Manual Acknowledgements — consume দিক</h3>
<p>Consumer <code>autoAck</code> দুইভাবে:</p>
<table>
<tr><th>Mode</th><th>আচরণ</th><th>ঝুঁকি</th></tr>
<tr><td><code>autoAck=true</code></td><td>broker push করেই "delivered" ধরে queue থেকে মুছে দেয়</td><td>process-এর আগে consumer crash → message হারায়</td></tr>
<tr><td><code>autoAck=false</code> (manual)</td><td>consumer <b>process শেষে</b> নিজে <code>basic.ack</code> করে</td><td>নিরাপদ; ack না করলে message unacked থাকে</td></tr>
</table>
<p>Manual mode-এ তিনটা উত্তর:</p>
<ul>
<li><code>basic.ack</code> — সফল; queue থেকে মুছে দাও।</li>
<li><code>basic.nack(requeue=true)</code> / <code>basic.reject(requeue=true)</code> — ব্যর্থ, আবার queue-তে দাও (retry)।</li>
<li><code>basic.nack(requeue=false)</code> — ব্যর্থ, requeue নয় → DLX/drop (poison message)।</li>
</ul>
<div class="callout behind"><span class="tag">Unacked message</span>
Consumer message পেয়েছে কিন্তু এখনো ack/nack করেনি — এটা <b>unacked</b> অবস্থা। Consumer crash বা connection বন্ধ হলে broker সেই unacked message আবার অন্য consumer-কে <b>redeliver</b> করে (তখন <code>redelivered=true</code> flag থাকে)। এভাবে "at-least-once" নিশ্চিত হয় — কিন্তু duplicate সম্ভব, তাই consumer idempotent বানান।</div>

<h4>Consumer acknowledgement timeout — নীরব channel বন্ধ</h4>
<p>একটা বাস্তব ফাঁদ: manual ack mode-এ consumer একটা message পেয়ে <b>বেশি সময় ধরে</b> ack/nack না করলে (default <code>consumer_timeout</code> ≈ ৩০ মিনিট), RabbitMQ ধরে নেয় consumer আটকে গেছে এবং পুরো <b>channel বন্ধ</b> করে দেয় — তখন সব unacked message redeliver হয়।</p>
<div class="callout mistake"><span class="tag">Common mistake</span>
খুব দীর্ঘ কাজ (বড় ফাইল প্রসেস, বাইরের slow API) একটা message ধরে রেখে prefetch বেশি নিয়ে ফেলা → timeout পার → channel বন্ধ → কাজ আবার শুরু, কখনো শেষ হয় না। সমাধান: কাজ ছোট টুকরোয় ভাঙুন, prefetch কমান, অথবা broker-এ <code>consumer_timeout</code> বাড়ান।</div>

<h3>Prefetch (QoS) — ন্যায্য বণ্টন</h3>
<p>Default-এ broker unacked message-এর সীমা ছাড়াই consumer-কে ঠেলে দেয় — একটা দ্রুত-প্রেরণ কিন্তু ধীর-process করা consumer-এর memory ভরে যায়, আর কাজ অসমভাবে ভাগ হয়। <code>basic.qos(prefetchCount)</code> দিয়ে বলা যায়: "একসাথে সর্বোচ্চ N টা unacked message দাও; ack না করা পর্যন্ত আর নয়।"</p>

<div class="callout best"><span class="tag">prefetch কত রাখব</span>
<ul style="margin:4px 0">
<li><b>ভারী/দীর্ঘ কাজ</b> (প্রতি message সেকেন্ড লাগে): <code>prefetch=1</code> — ন্যায্য বণ্টন, কেউ overload হয় না।</li>
<li><b>হালকা/দ্রুত কাজ</b> (হাজারে হাজার small message): বড় prefetch (যেমন 50–300) — round-trip কমে throughput বাড়ে।</li>
<li>শুরুর নিরাপদ মান ~<b>20–50</b>, তারপর latency/throughput দেখে সমন্বয়।</li>
</ul></div>
<div class="callout behind"><span class="tag"><code>global</code> flag — prefetch কার জন্য গোনা হয়</span>
<code>basic.qos(prefetchCount, global)</code>-এ একটা তৃতীয় parameter আছে যা প্রায়ই উপেক্ষা করা হয়। <code>global=false</code> (ডিফল্ট, এবং প্রায় সবসময় যা চাই) মানে limit-টা channel-এর <b>প্রতিটা consumer আলাদাভাবে</b> মেনে চলে — দুইটা consumer একই channel-এ থাকলেও প্রত্যেকে নিজের N-টা করে unacked message পায়। <code>global=true</code> দিলে limit পুরো <b>channel-এর সব consumer মিলিয়ে একসাথে</b> — একটা consumer বেশি নিলে বাকিরা কম পায়, যা সাধারণত অনিচ্ছাকৃত এবং debug করা কঠিন। এজন্যই কোডে সবসময় স্পষ্ট করে <code>global:false</code> লেখা হয়।</div>
</template>

<template data-page="dlx">
<h2 class="title">৭. DLX · DLQ · TTL · Retry Patterns</h2>
<p class="lead">ব্যর্থ, মেয়াদোত্তীর্ণ, বা reject হওয়া message কোথায় যাবে — আর কীভাবে নিরাপদে retry করবেন। RabbitMQ-র সবচেয়ে ব্যবহারিক অংশ।</p>

<h3>Dead Letter Exchange (DLX)</h3>
<p><span class="kw">DLX</span> হলো একটা সাধারণ exchange, যেখানে একটা queue-এর message স্বয়ংক্রিয়ভাবে "dead-letter" হয়ে চলে যায় — তিনটা কারণে:</p>
<ul>
<li>Consumer <code>basic.nack</code>/<code>basic.reject</code> করেছে <b>requeue=false</b> সহ (poison message)।</li>
<li>Message-এর <b>TTL শেষ</b> (কেউ সময়মতো consume করেনি)।</li>
<li>Queue-এর <b>length limit</b> (<code>x-max-length</code>) পার — পুরনো message বেরিয়ে যায়।</li>
</ul>
<p>Queue declare করার সময় <code>x-dead-letter-exchange</code> (ও ঐচ্ছিক <code>x-dead-letter-routing-key</code>) দিয়ে DLX ঠিক করা হয়। DLX RabbitMQ-র <b>built-in feature</b> (Kafka-তে এমন কিছু নেই — সেখানে DLQ নিজে বানাতে হয়)।</p>

<h3>Dead Letter Queue (DLQ)</h3>
<p><span class="kw">DLQ</span> হলো DLX-এর সাথে bind করা queue — যেখানে dead-lettered message এসে জমে। এখানে আলাদা করে সেগুলো পরীক্ষা, alert, বা fix করে replay করা হয়।</p>

<h3>TTL & Expiration</h3>
<table>
<tr><th>ধরন</th><th>কীভাবে</th><th>কাজ</th></tr>
<tr><td>Per-message TTL</td><td>message property <code>expiration</code> (ms)</td><td>নির্দিষ্ট message কতক্ষণ বাঁচবে</td></tr>
<tr><td>Per-queue TTL</td><td>queue arg <code>x-message-ttl</code></td><td>ঐ queue-এর সব message-এর আয়ু</td></tr>
<tr><td>Queue expiry</td><td>queue arg <code>x-expires</code></td><td>queue নিজে কতক্ষণ ব্যবহার না হলে মুছে যাবে</td></tr>
</table>
<p>TTL শেষ হলে message drop হয় — কিন্তু DLX সেট থাকলে drop না হয়ে DLX-এ যায়। এই সমন্বয়ই <b>delayed retry</b>-র ভিত্তি।</p>

<h3>Retry Patterns — নিরাপদে আবার চেষ্টা</h3>
<h4>১) সরল requeue (সাবধান!)</h4>
<p><code>nack(requeue=true)</code> সাথে সাথে message-কে queue-এর সামনে ফেরত দেয় → consumer আবার সাথে সাথে fail → <b>busy loop</b>। শুধু সত্যিকারের transient error-এ, সীমিতভাবে ব্যবহার করুন।</p>
<h4>২) DLX + TTL দিয়ে delayed retry (ক্লাসিক)</h4>
<div class="diagram"><pre>
main queue ──nack(requeue=false)──► retry.dlx ──► wait queue (x-message-ttl=30s,
                                                       DLX = main exchange)
                                                          │  30s পরে TTL শেষ
                                                          ▼
                                              আবার main queue-তে ফিরে আসে → পুনরায় চেষ্টা
</pre></div>
<p>অর্থাৎ ব্যর্থ message একটা "wait" queue-তে গিয়ে TTL সময় বসে থাকে, তারপর dead-letter হয়ে মূল queue-তে ফিরে আসে — এভাবে <b>delay সহ retry</b> পাওয়া যায় (immediate busy-loop ছাড়া)।</p>
<h4>৩) Retry count সীমা + parking lot</h4>
<p>Message header-এ <code>x-death</code> (broker স্বয়ংক্রিয় রাখে) বা নিজের <code>x-retry-count</code> দেখে গুনুন। নির্দিষ্ট সংখ্যক (যেমন ৫) retry-র পরও fail করলে আর retry নয় — একটা <b>final DLQ / parking-lot</b> queue-তে পাঠিয়ে দিন এবং alert করুন (মানুষ দেখবে)।</p>
<h4>৪) Delayed Message plugin</h4>
<p><code>rabbitmq_delayed_message_exchange</code> plugin দিয়ে সরাসরি "X সেকেন্ড পরে deliver করো" ধরনের delay দেওয়া যায় — TTL+DLX গিমিক ছাড়াই। Plugin install দরকার।</p>
<h4>৫) Quorum queue delivery-limit (আধুনিক, সবচেয়ে সহজ)</h4>
<p>নিজে header গুনে retry সীমা রাখার বদলে <b>quorum queue</b>-তে <code>x-delivery-limit</code> সেট করুন। Message যতবার redeliver হয় broker গোনে; সীমা (যেমন ৫) পেরোলে broker নিজেই সেটাকে <b>dead-letter</b> করে দেয় (DLX-এ) — কোনো manual counting দরকার নেই।</p>
<pre>var args = new Dictionary&lt;string, object&gt; {
    { "x-queue-type", "quorum" },
    { "x-delivery-limit", 5 },                      <span class="c">// ৫ বার fail → auto dead-letter</span>
    { "x-dead-letter-exchange", "orders.dlx" },
};
channel.QueueDeclare("billing", durable:true, exclusive:false, autoDelete:false, arguments:args);</pre>
<div class="callout best"><span class="tag">Best practice</span>
নতুন system-এ এটাই সুপারিশ — <b>quorum queue + <code>x-delivery-limit</code> + DLX</b>। poison message নির্দিষ্ট বার চেষ্টার পর আপনাআপনি DLQ-তে যায়, infinite requeue-র ঝুঁকি নেই, আর কোড সরল থাকে।</div>
<div class="callout mistake"><span class="tag">Common mistakes</span>
<ul style="margin:4px 0">
<li>DLX ছাড়া <code>nack(requeue=false)</code> — message নীরবে <b>হারায়</b>।</li>
<li>Infinite requeue — poison message-এ retry সীমা না রাখা → CPU 100%, queue জ্যাম।</li>
<li>DLQ কখনো না দেখা — ব্যর্থতা জমতে থাকে, কেউ টের পায় না।</li>
<li>Retry delay ছাড়া (immediate) — dependency সাময়িক down থাকলে আরও চাপ পড়ে।</li>
</ul></div>
</template>

<template data-page="flow">
<h2 class="title">৮. Flow Control · Performance Tuning</h2>
<p class="lead">RabbitMQ চাপে পড়লে নিজেকে বাঁচাতে কী করে (flow control), আর আপনি কীভাবে throughput বাড়াবেন।</p>

<h3>Flow Control — broker-এর আত্মরক্ষা</h3>
<p>Producer যদি consumer-এর চেয়ে দ্রুত পাঠায়, message জমতে জমতে broker-এর <b>memory/disk</b> ভরে যায়। RabbitMQ তখন <span class="kw">flow control</span> প্রয়োগ করে — দ্রুত publisher-দের <b>ধীর/থামিয়ে</b> দেয় (backpressure), যাতে broker ক্র্যাশ না করে।</p>
<table>
<tr><th>প্রক্রিয়া</th><th>কী ঘটে</th></tr>
<tr><td><span class="kw">Memory high watermark</span> (<code>vm_memory_high_watermark</code>, ~40% RAM)</td><td>অতিক্রম করলে broker publisher-দের block করে (<code>connection.blocked</code>)</td></tr>
<tr><td><span class="kw">Disk free limit</span> (<code>disk_free_limit</code>)</td><td>disk কমে গেলে persistent publish block</td></tr>
<tr><td>Credit-based flow control</td><td>ভেতরে দ্রুত প্রক্রিয়া দ্রুত-প্রেরণকারীকে ধীর করে</td></tr>
</table>
<div class="diagram"><pre>
স্বাভাবিক অবস্থা:
  Publisher ──publish──► Broker (memory ~২৫%) ──deliver──► Consumer      ✅ চলছে

Memory watermark পার (যেমন ৪০% RAM):
  Publisher ──publish──✖  [BLOCKED — broker সাড়া দেয় না]      Broker (memory ~৪৫%)
                                                                     │  consumer ধীরে ধীরে drain করছে
                                                                     ▼
  memory watermark-এর নিচে নামলেই ─────────────────────► broker স্বয়ংক্রিয় unblock করে
  Publisher ──publish──► Broker                          (connection.unblocked)         ✅ আবার চলছে
</pre></div>
<div class="callout behind"><span class="tag">connection.blocked</span>
Publisher block হলে .NET client-এ <code>ConnectionBlocked</code> event আসে। এজন্য <b>publish ও consume আলাদা connection-এ</b> রাখা জরুরি — নাহলে publisher block হলে একই connection-এর consumer-ও আটকে যায়, আর queue কখনো খালি হয় না (deadlock-সদৃশ)। ব্লক চিরস্থায়ী নয়: broker কেবল <b>memory/disk আবার watermark-এর নিচে নামলে</b> নিজে থেকেই connection unblock করে (<code>ConnectionUnblocked</code> event) এবং publish আবার স্বাভাবিক চলে — এজন্যই consumer-কে সচল রাখা (আলাদা connection-এ) এত জরুরি, নাহলে memory কখনো নামবে না।</div>

<h3>Performance Tuning — throughput বাড়ানোর নিয়ম</h3>
<table>
<tr><th>কৌশল</th><th>কেন</th></tr>
<tr><td>Prefetch ঠিকমতো সেট করুন</td><td>খুব ছোট = consumer অভুক্ত; খুব বড় = অসম বণ্টন/memory</td></tr>
<tr><td>Queue <b>ছোট</b> রাখুন</td><td>খালি/ছোট queue দ্রুত; message জমলে (backlog) সব ধীর হয়</td></tr>
<tr><td>একাধিক consumer / channel</td><td>parallelism বাড়ে (competing consumers)</td></tr>
<tr><td>Connection/channel reuse</td><td>প্রতি operation-এ নতুন খোলা মহাব্যয়বহুল</td></tr>
<tr><td>Publisher confirm — batch/async</td><td>প্রতি message-এ sync অপেক্ষা throughput মেরে ফেলে</td></tr>
<tr><td>Persistent শুধু যেখানে দরকার</td><td>persistent = disk write; সব message-এ দরকার নেই</td></tr>
<tr><td>Lazy/quorum queue বড় backlog-এ</td><td>message disk-এ রাখে → RAM চাপ কম (quorum queue default lazy-সদৃশ)</td></tr>
<tr><td><code>basic.get</code> polling এড়ান</td><td>push (consume) অনেক বেশি efficient</td></tr>
</table>
<div class="callout best"><span class="tag">সোনালি নিয়ম</span>
"Queue সবসময় প্রায় খালি থাকা উচিত।" Queue যদি বড় হতে থাকে, সেটা মানে consumer পিছিয়ে — consumer/prefetch বাড়ান বা কাজ optimize করুন। Queue-কে dump/buffer হিসেবে ব্যবহার করবেন না।</div>
</template>

<template data-page="ha">
<h2 class="title">৯. Clustering · Quorum Queues · Federation & Shovel</h2>
<p class="lead">একটা node যথেষ্ট নয় — একাধিক node কীভাবে মিলে high-availability দেয়, আর ভৌগোলিকভাবে দূরের broker কীভাবে যুক্ত হয়।</p>

<h3>Clustering</h3>
<p>একাধিক RabbitMQ node মিলে একটা <span class="kw">cluster</span> — তারা metadata (exchange, binding, user, vhost সংজ্ঞা) শেয়ার করে ও একটাই logical broker হিসেবে দেখা যায়। Client যেকোনো node-এ connect করে যেকোনো queue-তে পৌঁছাতে পারে। Node-রা একই <b>Erlang cookie</b> দিয়ে পরস্পরকে বিশ্বাস করে।</p>
<div class="callout behind"><span class="tag">Queue কোথায় থাকে</span>
Classic queue-এর ডেটা <b>একটা</b> node-এ থাকে (যদিও metadata সব node জানে)। ঐ node down হলে classic (non-replicated) queue unavailable। এজন্যই HA দরকার হলে <b>quorum queue</b> (নিচে)। Cluster নিজে HA দেয় না — শুধু scale ও একক-প্রবেশদ্বার দেয়।</div>

<h3>Quorum Queues — আধুনিক HA</h3>
<p><span class="kw">Quorum queue</span> হলো <b>Raft consensus</b>-ভিত্তিক replicated queue — একটা leader ও কয়েকটা follower একাধিক node-এ। Message তখনই confirmed যখন সংখ্যাগরিষ্ঠ (quorum) replica লিখেছে। Leader-এর node down হলে follower থেকে নতুন leader নির্বাচিত হয় — queue চালু থাকে, data নিরাপদ।</p>
<table>
<tr><th></th><th>Classic queue</th><th>Quorum queue</th></tr>
<tr><td>Replication</td><td>না (একটা node)</td><td>হ্যাঁ (Raft, majority)</td></tr>
<tr><td>Node fail-এ</td><td>queue হারাতে/থামতে পারে</td><td>টিকে থাকে (failover)</td></tr>
<tr><td>Data safety</td><td>দুর্বল</td><td>শক্তিশালী</td></tr>
<tr><td>সুপারিশ</td><td>ক্ষণস্থায়ী/অগুরুত্বপূর্ণ</td><td><b>Production default</b></td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
নতুন production system-এ গুরুত্বপূর্ণ queue-এর জন্য <b>quorum queue</b> ব্যবহার করুন (বিজোড় সংখ্যক replica, যেমন 3 বা 5)। পুরনো <b>classic mirrored queue deprecated</b> — quorum তার আধুনিক প্রতিস্থাপন।</div>

<h3>Network Partition ও Split-Brain</h3>
<p>Cluster-এর node-গুলো যদি একে অপরকে network-এ <b>না দেখতে পায়</b> (কিন্তু নিজেরা নিজেরা এবং client-দের কাছে ঠিকই বেঁচে আছে) — একে বলে <span class="kw">network partition</span>। বিপদটা হলো: partition-এর দুই পাশই নিজেকে "আমিই আসল cluster" ভেবে <b>স্বাধীনভাবে</b> read/write গ্রহণ করতে থাকে — একে বলে <span class="kw">split-brain</span>। পরে network ফিরলে দুই পাশের data মেলানো (reconcile) কঠিন বা অসম্ভব।</p>
<table>
<tr><th>Partition handling mode</th><th>আচরণ</th></tr>
<tr><td><code>ignore</code> (default)</td><td>কিছুই করে না — দুই পাশই চলতে থাকে; পরে reconnect হলে RabbitMQ একটা পাশের data রেখে বাকিটা phasing out করে (data loss সম্ভব)</td></tr>
<tr><td><code>pause_minority</code></td><td>যে পাশে node সংখ্যা <b>কম</b> (minority), সেই পাশ নিজেই নিজেকে pause করে দেয় (unavailable) — majority পাশ একাই চালু থাকে, split-brain ঠেকে</td></tr>
<tr><td><code>autoheal</code></td><td>partition ধরা পড়লে RabbitMQ একটা পাশকে "বিজয়ী" ঘোষণা করে বাকি node restart করে দেয়</td></tr>
</table>
<div class="callout best"><span class="tag">সুপারিশ</span>
Production cluster-এ <code>cluster_partition_handling = pause_minority</code> সেট করুন (odd সংখ্যক node, যেমন 3 বা 5, যাতে majority/minority স্পষ্ট থাকে)। <b>Quorum queue</b> (Raft) এমনিতেই বাড়তি সুরক্ষা দেয়: Raft-এ লেখা চলতে হলে সংখ্যাগরিষ্ঠ replica-র সম্মতি লাগে, তাই minority পাশ নিজে থেকেই ঐ queue-তে কোনো write গ্রহণ করতে পারে না — partition handling policy যাই হোক, quorum queue নিজে থেকে split-brain এড়ায়।</div>

<h3>Federation ও Shovel — দূরত্ব পেরোনো</h3>
<p>Cluster একই datacenter-এর low-latency network ধরে নেয়। ভিন্ন datacenter/region-এর broker যুক্ত করতে:</p>
<table>
<tr><th></th><th><span class="kw">Federation</span></th><th><span class="kw">Shovel</span></th></tr>
<tr><td>কী করে</td><td>দূরের exchange/queue থেকে message "টেনে" আনে (loosely coupled link)</td><td>এক broker/queue থেকে আরেকটিতে message সরায় (নির্দিষ্ট, একমুখী)</td></tr>
<tr><td>Config</td><td>Declarative, উভয় প্রান্তে policy</td><td>Point-to-point, সহজ, নির্দিষ্ট source→dest</td></tr>
<tr><td>ব্যবহার</td><td>Multi-region fan-out, WAN-এ exchange ভাগ করা</td><td>এক জায়গার message আরেক জায়গায় নেওয়া, migration, bridging</td></tr>
<tr><td>Coupling</td><td>আলগা, অনেক node</td><td>দৃঢ়, নির্দিষ্ট দুই প্রান্ত</td></tr>
</table>
<div class="diagram"><pre>
Federation:  [EU broker] ⇄ (federated exchange) ⇄ [US broker]   — WAN, আলগা যুক্ত
Shovel:      [old broker] ──(shovel)──► [new broker]             — নির্দিষ্ট, একমুখী
</pre></div>
</template>

<template data-page="secmon">
<h2 class="title">১০. Security · Monitoring</h2>
<p class="lead">Production RabbitMQ মানে দুটো জিনিস অবহেলা করা যাবে না — কে access পাবে (security), আর ভেতরে কী ঘটছে (monitoring)।</p>

<h3>Security</h3>
<h4>Transport — TLS</h4>
<p>Plaintext (5672) production-এ নয়। <span class="kw">TLS</span> (5671) দিয়ে wire encrypt করুন; চাইলে <b>mTLS</b> (client certificate) দিয়ে client-ও যাচাই করুন।</p>
<h4>Authentication</h4>
<p>Username/password (default <code>guest/guest</code> শুধু localhost-এ, production-এ মুছে দিন), অথবা x509 certificate, LDAP, OAuth2 plugin।</p>
<h4>Authorization — vhost ও permission</h4>
<p><span class="kw">Virtual host (vhost)</span> হলো broker-এর ভেতরে আলাদা namespace — এক vhost-এর exchange/queue অন্যটা থেকে সম্পূর্ণ বিচ্ছিন্ন (multi-tenant isolation)। প্রতি user-কে vhost-প্রতি তিন ধরনের permission দেওয়া যায়:</p>
<table>
<tr><th>Permission</th><th>মানে</th></tr>
<tr><td><code>configure</code></td><td>exchange/queue তৈরি বা মুছতে পারা</td></tr>
<tr><td><code>write</code></td><td>publish করা (exchange-এ)</td></tr>
<tr><td><code>read</code></td><td>consume করা (queue থেকে)</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice</span>
<ul style="margin:4px 0">
<li>প্রতি service-এর আলাদা user + least-privilege permission (শুধু যা দরকার)।</li>
<li>Password কোডে নয় — secret manager/env var।</li>
<li>Environment/tenant আলাদা করতে আলাদা <b>vhost</b>।</li>
<li><code>guest</code> user মুছুন বা restrict করুন।</li>
</ul></div>

<h3>Monitoring</h3>
<p>দুই স্তর: <b>Management plugin</b> (<code>rabbitmq_management</code>) — port 15672-এ web UI + HTTP API; আর production-এ <b>Prometheus plugin + Grafana</b>।</p>
<table>
<tr><th>Metric</th><th>মানে</th><th>Alert কখন</th></tr>
<tr><td>Queue depth (ready messages)</td><td>consume-এর অপেক্ষায় কত</td><td>ক্রমাগত বাড়লে (consumer পিছিয়ে)</td></tr>
<tr><td>Unacked messages</td><td>delivered কিন্তু ack হয়নি</td><td>জমে থাকলে (consumer আটকে/prefetch বেশি)</td></tr>
<tr><td>Publish / deliver rate</td><td>message throughput</td><td>হঠাৎ পতন/spike</td></tr>
<tr><td>Consumer count</td><td>queue-তে কত consumer</td><td>0 হলে (কেউ পড়ছে না)</td></tr>
<tr><td>Memory / disk alarm</td><td>flow control চালু কি না</td><td>alarm true = publisher blocked</td></tr>
<tr><td>Connections / channels</td><td>churn / leak</td><td>অস্বাভাবিক বৃদ্ধি</td></tr>
<tr><td>Unroutable / DLQ depth</td><td>route না হওয়া / dead-lettered</td><td>&gt; 0 হলে তদন্ত</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
শুধু "up/down" monitor করা। আসল বিপদ চুপচাপ আসে — queue depth বা unacked ধীরে বাড়ে, memory alarm ট্রিগার হয়ে publisher block হয়, অথচ কেউ দেখছে না। এগুলোতেই alert বসান।</div>

<template data-page="dotnet">
<h2 class="title">১১. RabbitMQ.Client (.NET)</h2>
<p class="lead">আপনার background (.NET) ধরে — official <code>RabbitMQ.Client</code> দিয়ে reliable publish ও consume, confirms, manual ack, prefetch ও DLX সহ।</p>

<div class="callout behind"><span class="tag">সংস্করণ নোট</span>
নিচের উদাহরণ classic <code>IModel</code> API (v6.x) — স্থিতিশীল ও ব্যাপক। RabbitMQ.Client <b>v7+</b> সম্পূর্ণ <b>async</b> (<code>IChannel</code>, <code>CreateConnectionAsync</code>, <code>BasicPublishAsync</code>, <code>AsyncEventingBasicConsumer</code>)। ধারণাগুলো একই — শুধু method-এ <code>Async</code> ও <code>await</code> যোগ হয়।</div>

<h3>সংযোগ ও channel</h3>
<pre><span class="c">// dotnet add package RabbitMQ.Client</span>
var factory = new ConnectionFactory {
    HostName                 = "localhost",
    UserName                 = "app",
    Password                 = "secret",
    VirtualHost              = "/",
    Port                     = 5672,               <span class="c">// TLS হলে 5671 + Ssl সেট</span>
    AutomaticRecoveryEnabled = true,               <span class="c">// network hiccup এ নিজে জোড়া লাগায়</span>
    TopologyRecoveryEnabled  = true,
};
using var conn    = factory.CreateConnection();    <span class="c">// ব্যয়বহুল — reuse করুন</span>
using var channel = conn.CreateModel();            <span class="c">// প্রতি thread এ আলাদা channel</span></pre>

<h3>Producer — durable + persistent + publisher confirms</h3>
<pre>channel.ExchangeDeclare("orders", ExchangeType.Direct, durable:true);
channel.ConfirmSelect();                            <span class="c">// publisher confirms চালু</span>

var body  = Encoding.UTF8.GetBytes(json);
var props = channel.CreateBasicProperties();
props.Persistent = true;                            <span class="c">// delivery_mode = 2 (disk এ টেকে)</span>
props.MessageId  = eventId;                         <span class="c">// idempotency এর জন্য</span>

channel.BasicPublish("orders", routingKey:"invoice.created", basicProperties:props, body:body);

if (!channel.WaitForConfirms(TimeSpan.FromSeconds(5)))   <span class="c">// broker সত্যিই পেল?</span>
    throw new Exception("publish confirm পাওয়া যায়নি — আবার চেষ্টা করুন");</pre>

<h3>Consumer — prefetch + manual ack + DLX</h3>
<pre><span class="c">// DLX সহ queue declare</span>
var args = new Dictionary&lt;string, object&gt; {
    { "x-dead-letter-exchange", "orders.dlx" },     <span class="c">// reject/expire → এখানে</span>
    { "x-message-ttl", 3_600_000 },                 <span class="c">// 1 ঘণ্টা TTL</span>
};
channel.ExchangeDeclare("orders.dlx", ExchangeType.Fanout, durable:true);
channel.QueueDeclare("orders.dlq", durable:true, exclusive:false, autoDelete:false);
channel.QueueBind("orders.dlq", "orders.dlx", routingKey:"");

channel.QueueDeclare("billing", durable:true, exclusive:false, autoDelete:false, arguments:args);
channel.QueueBind("billing", "orders", routingKey:"invoice.created");

channel.BasicQos(prefetchSize:0, prefetchCount:20, global:false);   <span class="c">// QoS / prefetch</span>

var consumer = new EventingBasicConsumer(channel);
consumer.Received += (sender, ea) =&gt; {
    try {
        var msg = Encoding.UTF8.GetString(ea.Body.ToArray());
        Handle(msg);                                <span class="c">// business logic (idempotent!)</span>
        channel.BasicAck(ea.DeliveryTag, multiple:false);            <span class="c">// সফল</span>
    }
    catch (TransientException) {
        channel.BasicNack(ea.DeliveryTag, multiple:false, requeue:true);   <span class="c">// আবার চেষ্টা</span>
    }
    catch {
        channel.BasicNack(ea.DeliveryTag, multiple:false, requeue:false);  <span class="c">// poison → DLX</span>
    }
};
channel.BasicConsume("billing", autoAck:false, consumer);           <span class="c">// autoAck=false জরুরি</span></pre>

<div class="callout mistake"><span class="tag">Common mistakes (.NET)</span>
<ul style="margin:4px 0">
<li>একটা <code>IModel</code>/channel একাধিক thread-এ ব্যবহার — thread-safe নয়, corruption/exception।</li>
<li><code>autoAck:true</code> রেখে "নিরাপদ" ভাবা — process fail-এ message হারায়।</li>
<li>Publisher confirm ছাড়া "publish হয়েছে" ধরে নেওয়া।</li>
<li>Consumer-এ exception চেপে যাওয়া (ack-ও না, nack-ও না) → message চিরকাল unacked।</li>
</ul></div>

<template data-page="interview">
<h2 class="title">১৩. Interview প্রশ্নোত্তর</h2>
<p class="lead">Basic থেকে advanced পর্যন্ত RabbitMQ ইন্টারভিউতে বারবার ঘুরেফিরে আসা প্রশ্ন — প্রতিটার সংক্ষিপ্ত বাংলা ব্যাখ্যা, আগের অধ্যায়গুলোর টার্মিনোলজি অনুসরণ করে।</p>

<h3>১) RabbitMQ ঠিক কী করে, আর producer কি সরাসরি queue-তে পাঠায়?</h3>
<p><b>ব্যাখ্যা:</b> RabbitMQ একটা message broker — producer কখনো সরাসরি queue-তে পাঠায় না, সে পাঠায় একটা <span class="kw">exchange</span>-এ (Foundation অধ্যায়)। Exchange তার binding ও routing key দেখে ঠিক করে message কোন queue-তে যাবে। এই indirection-ই routing-কে নমনীয় করে এবং RabbitMQ-কে "smart broker, dumb consumer" মডেল বানায় — Kafka-র উল্টো, যেখানে broker শুধু log রাখে আর consumer নিজে বুদ্ধি খাটায়।</p>

<h3>২) AMQP কী, আর RabbitMQ কোন version ব্যবহার করে?</h3>
<p><b>ব্যাখ্যা:</b> AMQP (Advanced Message Queuing Protocol) হলো একটা binary wire-level protocol যা connection, channel, exchange, queue, binding-এর সংজ্ঞা দেয় (AMQP Protocol অধ্যায়)। RabbitMQ মূলত <b>AMQP 0-9-1</b> বাস্তবায়ন করে (AMQP 1.0 আলাদা প্রোটোকল, plugin দিয়ে সমর্থিত)। যেকোনো ভাষার client একই broker-এর সাথে কথা বলতে পারে কারণ protocol ভাষা-নিরপেক্ষ।</p>

<h3>৩) Connection আর Channel-এর মধ্যে পার্থক্য কী, আর কেন channel এত গুরুত্বপূর্ণ?</h3>
<p><b>ব্যাখ্যা:</b> Connection হলো client-broker-এর মধ্যে একটা ব্যয়বহুল TCP সংযোগ। Channel হলো সেই connection-এর ভেতরে একটা lightweight virtual sub-connection যার ওপর প্রায় সব AMQP কাজ (publish, consume, ack) হয় (Connections & Channels অধ্যায়)। একটা connection-এর ভেতরে অনেক channel multiplex করা যায়, কিন্তু <b>channel thread-safe নয়</b> — একাধিক thread একটা channel share করলে corruption/exception হতে পারে; প্রতি thread/worker-এর নিজের channel থাকা উচিত।</p>

<h3>৪) RabbitMQ-তে exchange-এর চার প্রকার কী কী, আর কোনটা কখন ব্যবহার করবেন?</h3>
<pre>direct  → routing key == binding key হুবহু মিললে         (নির্দিষ্ট queue-তে পাঠানো)
fanout  → routing key উপেক্ষা করে সব bound queue-তে       (broadcast)
topic   → routing key প্যাটার্ন মিলিয়ে (* এক শব্দ, # একাধিক)  (নমনীয় routing)
headers → routing key নয়, message header মিলিয়ে           (একাধিক attribute দিয়ে)</pre>
<p><b>ব্যাখ্যা:</b> চারটাই core AMQP-তে built-in (Exchange · Queue · Binding · Routing অধ্যায়)। direct নির্দিষ্ট এক গন্তব্যের জন্য, fanout সবাইকে একই event পাঠাতে (broadcast), topic নমনীয় pattern-ভিত্তিক routing-এর জন্য (যেমন <code>order.created.eu</code>), আর headers routing key-এর বদলে একাধিক attribute দিয়ে সিদ্ধান্ত নিতে। একটা প্লাগ-ইন হিসেবে পঞ্চম ধরনও আছে — <b>consistent-hash exchange</b>, যা key hash করে একটাকে বেছে পাঠায় (per-key ordering-এর জন্য দরকারি)।</p>

<h3>৫) Routing key আর binding key-এর মধ্যে পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> Routing key হলো producer যা message পাঠানোর সময় দেয় ("এই message-এর ঠিকানা")। Binding key হলো queue যখন exchange-এ bind হয় তখন দেয় ("আমি এই ঠিকানার message চাই") — Exchange · Queue · Binding · Routing অধ্যায়ে এই পার্থক্য বিস্তারিত। Exchange দুটো মিলিয়ে route করার সিদ্ধান্ত নেয়। fanout exchange-এ routing key সম্পূর্ণ উপেক্ষা করা হয়, তাই সেখানে binding key-এর কোনো অর্থ নেই।</p>

<h3>৬) কোনো queue-তে route না হওয়া (unroutable) message-এর কী হয়, আর কীভাবে ঠেকাবেন?</h3>
<p><b>ব্যাখ্যা:</b> Default-এ exchange যদি কোনো matching binding না পায়, message নীরবে <b>drop</b> হয়ে যায় — production-এ নীরব data loss (Exchange · Queue · Binding · Routing অধ্যায়)। দুটো সমাধান: publish-এ <code>mandatory=true</code> দিলে broker route না হলে message publisher-কে <code>basic.return</code> দিয়ে ফেরত পাঠায়; অথবা exchange-এ <code>alternate-exchange</code> সেট করলে unmatched message স্বয়ংক্রিয়ভাবে একটা catch-all exchange/queue-তে চলে যায়। Production-এ গুরুত্বপূর্ণ exchange-এ Alternate Exchange রাখা best practice।</p>

<h3>৭) ack, nack, আর reject-এর মধ্যে পার্থক্য কী?</h3>
<pre>basic.ack                     → সফল; broker queue থেকে message স্থায়ীভাবে মুছে দেয়
basic.nack(requeue=true)       → ব্যর্থ, আবার queue-তে ফেরত (retry)
basic.nack(requeue=false)      → ব্যর্থ, requeue নয় → DLX/drop (poison message)
basic.reject(requeue=true/false) → nack-এর মতোই, শুধু একবারে একটা delivery tag-এ (multiple নেই)</pre>
<p><b>ব্যাখ্যা:</b> এই তিনটাই manual acknowledgement mode-এর অংশ (Publisher Confirms · Manual Acks · Prefetch অধ্যায়)। <code>ack</code> মানে message সফলভাবে process হয়েছে। <code>nack</code>/<code>reject</code> ব্যর্থতা বোঝায়, আর <code>requeue</code> flag ঠিক করে message আবার একই queue-তে ফিরবে (transient error), নাকি DLX/drop হবে (poison message)। <code>nack</code>-এ <code>multiple=true</code> দিয়ে একসাথে একাধিক delivery একবারে ack/nack করা যায়, <code>reject</code>-এ যা সম্ভব নয়।</p>

<h3>৮) Publisher confirms কী এবং কেন শুধু publish করাই যথেষ্ট নয়?</h3>
<p><b>ব্যাখ্যা:</b> Default-এ <code>basic.publish</code> "fire and forget" — broker সত্যিই পেল কি না জানার উপায় নেই, connection মাঝপথে মরলে message নীরবে হারাতে পারে (Publisher Confirms অধ্যায়)। <code>confirm.select</code> চালু করলে broker প্রতিটা message নিরাপদে গ্রহণ (persistent হলে disk-এ লেখা) করার পর publisher-কে একটা ack ফেরত দেয়। Throughput ধরে রাখতে প্রতি message-এ sync অপেক্ষা না করে batch/async confirm ব্যবহার করা উচিত।</p>

<h3>৯) Unacked message বলতে কী বোঝায়, আর consumer crash করলে কী হয়?</h3>
<p><b>ব্যাখ্যা:</b> Consumer message পেয়েছে কিন্তু এখনো ack/nack করেনি — এই অবস্থাকেই unacked বলে (Publisher Confirms · Manual Acks · Prefetch অধ্যায়)। Consumer crash বা connection বন্ধ হলে broker সেই unacked message আবার অন্য consumer-কে <b>redeliver</b> করে (<code>redelivered=true</code> flag সহ), যা "at-least-once" নিশ্চিত করে কিন্তু duplicate তৈরি করতে পারে — তাই consumer সবসময় idempotent হওয়া উচিত (যেমন <code>message_id</code> দিয়ে dedup)।</p>

<h3>১০) Prefetch (QoS) কী করে, আর prefetch=1 কখন ব্যবহার করবেন?</h3>
<pre>channel.BasicQos(prefetchSize:0, prefetchCount:20, global:false);</pre>
<p><b>ব্যাখ্যা:</b> <code>basic.qos(prefetchCount)</code> বলে দেয় একসাথে সর্বোচ্চ কতগুলো unacked message একটা consumer-কে দেওয়া যাবে — ack না করা পর্যন্ত আর নয় (Publisher Confirms · Manual Acks · Prefetch অধ্যায়)। ভারী/দীর্ঘ কাজে <code>prefetch=1</code> দিলে ন্যায্য বণ্টন হয় (round-robin-এ ধীর consumer উপচে পড়ে না); হালকা/দ্রুত কাজে বড় prefetch (৫০–৩০০) round-trip কমিয়ে throughput বাড়ায়। <code>global</code> flag ডিফল্টে <code>false</code> থাকে — তাই limit প্রতিটা consumer আলাদাভাবে মেনে চলে; <code>global=true</code> দিলে পুরো channel-এর সব consumer মিলিয়ে একসাথে গোনা হয়, যা প্রায়ই অনিচ্ছাকৃত।</p>

<h3>১১) DLX আর TTL মিলিয়ে delayed retry pattern কীভাবে বানাবেন?</h3>
<pre>main queue ──nack(requeue=false)──► retry.dlx ──► wait queue (x-message-ttl=30s,
                                                       DLX = main exchange)
                                                          │  30s পরে TTL শেষ
                                                          ▼
                                              আবার main queue-তে ফিরে আসে → পুনরায় চেষ্টা</pre>
<p><b>ব্যাখ্যা:</b> DLX (Dead Letter Exchange) হলো একটা সাধারণ exchange যেখানে reject (requeue=false), TTL শেষ, বা queue length limit পার হলে message স্বয়ংক্রিয়ভাবে dead-letter হয়ে যায় (DLX · DLQ · TTL · Retry অধ্যায়)। সরল <code>nack(requeue=true)</code> সাথে সাথে busy loop তৈরি করতে পারে — তাই ব্যর্থ message-কে একটা "wait" queue-তে পাঠিয়ে সেখানে TTL সময় বসিয়ে রাখা হয়, TTL শেষে সেটা dead-letter হয়ে মূল queue-তে ফিরে আসে। এভাবে immediate busy-loop ছাড়াই delay সহ retry পাওয়া যায়। আধুনিক বিকল্প: quorum queue-তে <code>x-delivery-limit</code> সেট করলে broker নিজেই নির্দিষ্ট বার redeliver-এর পর message dead-letter করে দেয়, manual retry-count গোনার দরকার পড়ে না।</p>

<h3>১২) Quorum queue, classic queue, আর classic mirrored queue-এর মধ্যে পার্থক্য কী?</h3>
<table>
<tr><th></th><th>Classic queue</th><th>Quorum queue</th></tr>
<tr><td>Replication</td><td>না (একটা node)</td><td>হ্যাঁ (Raft, majority)</td></tr>
<tr><td>Node fail-এ</td><td>queue হারাতে/থামতে পারে</td><td>টিকে থাকে (failover)</td></tr>
<tr><td>সুপারিশ</td><td>ক্ষণস্থায়ী/অগুরুত্বপূর্ণ</td><td>Production default</td></tr>
</table>
<p><b>ব্যাখ্যা:</b> Classic queue-এর data একটা মাত্র node-এ থাকে, সেই node down হলে queue unavailable হয়ে যায় (Clustering · Quorum Queues অধ্যায়)। Quorum queue Raft consensus ব্যবহার করে — একটা leader ও কয়েকটা follower বিভিন্ন node-এ, majority replica লিখলে তবেই confirmed। Leader down হলে follower থেকে নতুন leader নির্বাচিত হয়, queue চালু থাকে। পুরনো classic <b>mirrored</b> queue (HA policy দিয়ে mirror করা) এখন deprecated — quorum queue তার আধুনিক, নির্ভরযোগ্য প্রতিস্থাপন।</p>

<h3>১৩) RabbitMQ flow control কীভাবে কাজ করে?</h3>
<p><b>ব্যাখ্যা:</b> Producer consumer-এর চেয়ে দ্রুত পাঠালে broker-এর memory/disk ভরে যেতে পারে (Flow Control · Performance অধ্যায়)। <code>vm_memory_high_watermark</code> (~৪০% RAM) পার হলে broker publisher-দের <b>block</b> করে দেয় (<code>connection.blocked</code> event) — memory আবার watermark-এর নিচে নামলে স্বয়ংক্রিয়ভাবে unblock হয় (<code>connection.unblocked</code>)। এজন্যই publish ও consume আলাদা connection-এ রাখা জরুরি — নাহলে publisher block হলে একই connection-এর consumer-ও আটকে যায়, memory কখনো নামবে না (deadlock-সদৃশ)।</p>

<h3>১৪) Network partition আর split-brain কী, RabbitMQ cluster কীভাবে এটা সামলায়?</h3>
<p><b>ব্যাখ্যা:</b> Cluster-এর node-গুলো একে অপরকে network-এ না দেখতে পেলেও নিজেরা ও client-রা বেঁচে আছে ভাবলে সেটা network partition; দুই পাশই যদি নিজেকে "আসল cluster" ভেবে স্বাধীনভাবে read/write নিতে থাকে, সেটাই split-brain (Clustering · Quorum Queues অধ্যায়)। <code>cluster_partition_handling = pause_minority</code> সেট করলে যে পাশে node সংখ্যা কম সেই পাশ নিজেই pause হয়ে যায়, majority পাশ একাই চলতে থাকে — split-brain ঠেকে। Quorum queue (Raft) নিজেই বাড়তি সুরক্ষা দেয় কারণ লেখার জন্য majority replica-র সম্মতি লাগে, minority পাশ কোনো write গ্রহণ করতে পারে না।</p>

<h3>১৫) একটা queue-তে message ordering গ্যারান্টি করার উপায় কী?</h3>
<p><b>ব্যাখ্যা:</b> RabbitMQ একটা একক queue-তে message FIFO ক্রমে রাখে, কিন্তু একাধিক consumer parallel-এ process করলে বা <code>nack(requeue=true)</code> হলে সেই ক্রম সহজেই ভেঙে যায় (Producer · Consumer · Message Lifecycle অধ্যায়)। কঠোর ordering দরকার হলে queue declare-এ <code>x-single-active-consumer=true</code> দিলে একসাথে শুধু একটা consumer active থাকে (বাকিরা standby); সে মরলে broker স্বয়ংক্রিয়ভাবে পরের standby-কে active করে — order + failover একসাথে পাওয়া যায়। Per-key order যথেষ্ট হলে consistent-hash exchange দিয়ে key অনুযায়ী আলাদা queue-তে routing করে প্রতি queue-তে order আর queue-গুলোর মধ্যে parallelism রাখা যায়।</p>

<h3>১৬) .NET-এ কেন <code>autoAck:true</code> "নিরাপদ" নয়, আর একটা reliable consumer-এ কী কী থাকা উচিত?</h3>
<pre>channel.BasicQos(prefetchSize:0, prefetchCount:20, global:false);
consumer.Received += (sender, ea) =&gt; {
    try {
        Handle(msg);                                          <span class="c">// idempotent handler</span>
        channel.BasicAck(ea.DeliveryTag, multiple:false);
    }
    catch (TransientException) {
        channel.BasicNack(ea.DeliveryTag, multiple:false, requeue:true);
    }
    catch {
        channel.BasicNack(ea.DeliveryTag, multiple:false, requeue:false);   <span class="c">// poison → DLX</span>
    }
};
channel.BasicConsume("billing", autoAck:false, consumer);</pre>
<p><b>ব্যাখ্যা:</b> <code>autoAck=true</code> রাখলে broker push করার সাথে সাথেই message queue থেকে মুছে দেয় — process শেষ হওয়ার আগে consumer crash করলে message স্থায়ীভাবে হারায় (RabbitMQ.Client (.NET) অধ্যায়)। Reliable consumer-এ দরকার: <code>autoAck:false</code> + যথাযথ prefetch + try/catch-এ transient error-এ <code>requeue:true</code>, permanent/poison error-এ <code>requeue:false</code> (DLX-এ যাবে) + idempotent handler (duplicate redelivery সামলাতে) + exception চেপে না গিয়ে সবসময় ack অথবা nack করা, নাহলে message চিরকাল unacked থেকে যাবে।</p>
</template>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
