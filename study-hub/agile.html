<template data-page="foundation">
<h2 class="title">১. Foundation — Agile Manifesto</h2>
<p class="lead">২০০১ সালে ১৭ জন সফটওয়্যার ডেভেলপার উটাহ-এর একটা স্কি রিসোর্টে মিলিত হয়ে <span class="kw">Agile Manifesto</span> লেখেন — চারটা মূল ভ্যালু আর বারোটা নীতি, যা আজও প্রায় প্রতিটা আধুনিক সফটওয়্যার টিমের কাজের ধরন প্রভাবিত করে।</p>

<h3>চারটা মূল Value</h3>
<table>
<tr><th>যা বেশি গুরুত্বপূর্ণ</th><th>যার তুলনায় (কম নয়, কিন্তু কম গুরুত্বপূর্ণ)</th></tr>
<tr><td>ব্যক্তি ও ইন্টারঅ্যাকশন</td><td>প্রক্রিয়া ও টুল</td></tr>
<tr><td>কার্যকর সফটওয়্যার</td><td>বিস্তারিত ডকুমেন্টেশন</td></tr>
<tr><td>গ্রাহকের সাথে সহযোগিতা</td><td>কন্ট্রাক্ট নেগোসিয়েশন</td></tr>
<tr><td>পরিবর্তনে সাড়া দেওয়া</td><td>একটা পরিকল্পনা অনুসরণ করা</td></tr>
</table>
<div class="callout why"><span class="tag">"বাম দিকেরটা বেশি মূল্যবান" — ডান দিকেরটা বাতিল নয়</span>
Manifesto স্পষ্টভাবে বলে "যদিও ডান দিকের জিনিসগুলোরও মূল্য আছে, আমরা বাম দিকেরটাকে বেশি মূল্য দিই" — ডকুমেন্টেশন/প্রক্রিয়া/পরিকল্পনা সম্পূর্ণ বাতিল নয়, শুধু যখন এগুলো ব্যক্তির ইন্টারঅ্যাকশন বা কাজ করা সফটওয়্যারের সাথে সাংঘর্ষিক হয়, তখন অগ্রাধিকার কোন দিকে যাবে তা স্পষ্ট করে দেওয়া হয়েছে। এই সূক্ষ্মতা প্রায়ই ভুল বোঝা হয় — "Agile মানে কোনো ডকুমেন্টেশন লাগে না" ভুল সিদ্ধান্ত (১৫ নম্বর অধ্যায়ে এই ভুল ব্যাখ্যা বিস্তারিত)।</div>

<h3>বারোটা নীতির সারাংশ</h3>
<div class="grid2">
  <div class="box"><b>ডেলিভারি ও পরিবর্তন</b><br>দ্রুত, নিয়মিত ডেলিভারি (সপ্তাহ, মাস নয়) — এমনকি ডেভেলপমেন্টের শেষ দিকেও পরিবর্তন স্বাগত জানানো, প্রতিযোগিতামূলক সুবিধার জন্য</div>
  <div class="box"><b>মানুষ ও সহযোগিতা</b><br>প্রতিদিন বিজনেস আর ডেভেলপার একসাথে কাজ করা, মুখোমুখি কথোপকথনকে সবচেয়ে কার্যকর যোগাযোগ মাধ্যম ধরা, স্ব-সংগঠিত টিমে বিশ্বাস</div>
  <div class="box"><b>টেকনিক্যাল উৎকর্ষ</b><br>কার্যকর সফটওয়্যারই অগ্রগতির প্রধান মাপকাঠি, টেকনিক্যাল উৎকর্ষ ও ভালো ডিজাইনের প্রতি ক্রমাগত মনোযোগ</div>
  <div class="box"><b>টেকসই গতি ও প্রতিফলন</b><br>একটা টেকসই গতিতে অনির্দিষ্টকাল কাজ করা যায় এমন ছন্দ বজায় রাখা, নিয়মিত বিরতিতে দল নিজেই নিজের কার্যকারিতা প্রতিফলিত করে সমন্বয় করে</div>
</div>
<div class="callout behind"><span class="tag">Agile একটা Methodology নয় — একটা Mindset</span>
Agile Manifesto নিজে কোনো নির্দিষ্ট প্রক্রিয়া, টুল, বা ধাপ-ভিত্তিক নির্দেশনা দেয় না — এটা একটা দর্শন/মূল্যবোধের সেট। Scrum, Kanban, XP (Extreme Programming) — এগুলো সবই এই একই মূল্যবোধের ওপর ভিত্তি করে তৈরি ভিন্ন ভিন্ন <b>ফ্রেমওয়ার্ক</b>। "আমরা Agile করছি" মানে "আমরা Scrum ব্যবহার করছি" নয় — Scrum একটা নির্দিষ্ট বাস্তবায়ন, Agile তার পেছনের দর্শন (২ নম্বর অধ্যায়ে বিস্তারিত)।</div>
</template>

<template data-page="waterfall">
<h2 class="title">২. Waterfall বনাম Agile</h2>
<p class="lead">Agile কেন এলো তা বোঝার জন্য আগে দেখা দরকার কোন সমস্যার প্রতিক্রিয়ায় এটা তৈরি হয়েছিল — <span class="kw">Waterfall</span> মডেলের সীমাবদ্ধতা।</p>

<h3>Waterfall — ধারাবাহিক, ধাপে-ধাপে</h3>
<div class="diagram"><pre>
Requirements ──▶ Design ──▶ Implementation ──▶ Testing ──▶ Deployment ──▶ Maintenance
     (প্রতিটা ধাপ সম্পূর্ণ শেষ না হলে পরের ধাপ শুরু হয় না — কোনো ফিরে যাওয়ার সুযোগ নেই)
</pre></div>
<p>Waterfall-এ পুরো প্রজেক্টের requirements শুরুতেই চূড়ান্ত করে ফেলা হয় — মাসের পর মাস পর প্রথম কার্যকর সফটওয়্যার দেখা যায়, ততদিনে বাজার/প্রয়োজন বদলে গেলেও তা সহজে সমন্বয় করা যায় না।</p>

<h3>Agile — ইটারেটিভ, ইনক্রিমেন্টাল</h3>
<div class="diagram"><pre>
Sprint ১ (২ সপ্তাহ): Plan → Build → Test → Review → Demo   → ছোট, কার্যকর ফিচার ডেলিভার
Sprint ২ (২ সপ্তাহ): Plan → Build → Test → Review → Demo   → আগেরটার ওপর ভিত্তি করে, ফিডব্যাক অনুযায়ী সমন্বয়
Sprint ৩ ...
</pre></div>
<table>
<tr><th></th><th>Waterfall</th><th>Agile</th></tr>
<tr><td>Requirements</td><td>শুরুতেই সম্পূর্ণ চূড়ান্ত</td><td>ক্রমশ বিকশিত হয়, প্রতিটা Sprint-এ পরিমার্জিত</td></tr>
<tr><td>ফিডব্যাক</td><td>প্রজেক্টের শেষে</td><td>প্রতি ২-৪ সপ্তাহে</td></tr>
<tr><td>পরিবর্তনের খরচ</td><td>দেরিতে পরিবর্তন খুব ব্যয়বহুল</td><td>পরিবর্তন প্রত্যাশিত ও সাশ্রয়ী</td></tr>
<tr><td>ঝুঁকি</td><td>শেষ পর্যন্ত জানা যায় না প্রোডাক্ট সঠিক কিনা</td><td>প্রতিটা Sprint-এই বাস্তব ফিডব্যাক মেলে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Waterfall ব্যর্থ হয় — Requirements আগে থেকে সম্পূর্ণ জানা যায় না</span>
Waterfall ধরে নেয় শুরুতেই সব requirements নির্ভুলভাবে জানা সম্ভব — বাস্তবে সফটওয়্যার প্রজেক্টে এটা প্রায় কখনোই সত্য নয়, বিশেষ করে জটিল/নতুন ডোমেইনে। ব্যবহারকারী নিজেও প্রায়ই জানেন না তারা ঠিক কী চান, যতক্ষণ না তারা কিছু একটা ব্যবহার করে দেখেন। Agile এই অনিশ্চয়তা মেনে নিয়ে ডিজাইন করা — ছোট ছোট চক্রে কাজ করে, দ্রুত শেখা ও দ্রুত দিক পরিবর্তন করার সুযোগ রাখে।</div>
<div class="callout mistake"><span class="tag">Common misconception — Waterfall মানেই খারাপ, Agile মানেই ভালো</span>
কিছু প্রজেক্টে (যেমন নিয়ন্ত্রক প্রয়োজনীয়তা কঠোর, একবারই তৈরি হবে এমন হার্ডওয়্যার-নির্ভর সিস্টেম) requirements সত্যিই স্থিতিশীল ও আগে থেকে জানা যায় — সেখানে একটা কাঠামোবদ্ধ, ধারাবাহিক পদ্ধতি যুক্তিসঙ্গত হতে পারে। Agile সবচেয়ে বেশি মূল্য দেয় যেখানে অনিশ্চয়তা বেশি, প্রয়োজন দ্রুত বদলায় — প্রতিটা প্রজেক্টে অন্ধভাবে একটাই পদ্ধতি চাপানো ভুল।</div>

Scrum-এর তিনটা স্তম্ভ হলো Transparency, Inspection, Adaptation — Artifact-গুলো প্রথম স্তম্ভ বাস্তবায়ন করে। Product Backlog দেখেই যে কেউ জানতে পারেন পরবর্তী কী আসছে; Sprint Backlog দেখেই বোঝা যায় এই Sprint-এ ঠিক কী প্রতিশ্রুত হয়েছে; Increment-ই একমাত্র সত্যিকারের অগ্রগতির প্রমাণ, কোনো শতাংশ-সম্পন্ন অনুমান নয়। এই স্বচ্ছতা ছাড়া Inspection (পর্যবেক্ষণ) ও Adaptation (সমন্বয়) অর্থহীন হয়ে যায়।</div>

<div class="callout mistake"><span class="tag">Common mistake — User Story-কে টেকনিক্যাল টাস্ক লেখা</span>
"Database-এ একটা নতুন কলাম যোগ করা" — এটা User Story নয়, এটা একটা টাস্ক। User Story সবসময় ব্যবহারকারীর দৃষ্টিকোণ থেকে, ব্যবসায়িক মূল্যের ভাষায় লেখা উচিত — টেকনিক্যাল বাস্তবায়নের বিস্তারিত (কোন টেবিল, কোন API) Story-র ভেতরের আলোচনায়/সাব-টাস্কে আসে, Story-র শিরোনামে নয়।</div>
</template>

<template data-page="estimation">
<h2 class="title">৭. Estimation — Story Point, Velocity</h2>
<p class="lead">Agile টিম সাধারণত সময়ে (ঘণ্টা/দিন) নয়, আপেক্ষিক জটিলতায় estimate করে — এই পার্থক্য প্রায়ই নতুনদের কাছে বিভ্রান্তিকর, কিন্তু এর পেছনে শক্ত যুক্তি আছে।</p>

<h3>Story Point কেন সময়ে নয়</h3>
<div class="callout why"><span class="tag">সময়ে Estimate করা কেন সমস্যাজনক</span>
"এটা ৮ ঘণ্টা লাগবে" — কার ৮ ঘণ্টা? একজন সিনিয়র ডেভেলপার আর একজন জুনিয়রের সময় আলাদা, একই ব্যক্তির ক্লান্ত দিনে আর তরতাজা দিনেও আলাদা। <span class="kw">Story Point</span> সময়ের বদলে <b>আপেক্ষিক জটিলতা</b> (relative complexity, effort, uncertainty একসাথে) মাপে — "এই story-টা আগের সেই story-র চেয়ে দ্বিগুণ জটিল" বলাটা "এটা ঠিক ৮ ঘণ্টা লাগবে" বলার চেয়ে অনেক বেশি নির্ভরযোগ্য, কারণ মানুষ আপেক্ষিক তুলনায় ভালো, নিরঙ্কুশ সময় অনুমানে খারাপ।</div>

<h3>Planning Poker</h3>
<div class="diagram"><pre>
টিমের প্রতিটা সদস্য একটা কার্ড বেছে নেন (Fibonacci-ধাঁচের স্কেল: 1,2,3,5,8,13,21...)
      সবাই একসাথে কার্ড উল্টায় (কারো মতামত অন্যকে প্রভাবিত না করে)
                            │
              ভিন্নমত হলে (যেমন কেউ 3, কেউ 13) — সংক্ষিপ্ত আলোচনা:
              "তুমি কেন 13 ভাবলে?" "আমি একটা এজ-কেস দেখেছিলাম যা তুমি দেখোনি"
                            │
                     আবার ভোট, ঐকমত্যে পৌঁছানো পর্যন্ত
</pre></div>
<div class="callout behind"><span class="tag">Fibonacci স্কেল কেন — অনিশ্চয়তা যত বাড়ে, নির্ভুলতা তত কমে</span>
1,2,3,5,8,13,21-এর মতো ক্রমবর্ধমান ব্যবধানের স্কেল ইচ্ছাকৃতভাবে ব্যবহার করা হয় — ছোট কাজে সূক্ষ্ম পার্থক্য (2 বনাম 3) গুরুত্বপূর্ণ ও অনুমানযোগ্য, কিন্তু বড় কাজে (13 বনাম 21) নির্ভুল পার্থক্য বলা আসলে অর্থহীন একটা মিথ্যা নিশ্চয়তা তৈরি করে। Fibonacci স্কেল এই বাস্তবতা স্বীকার করে — বড় সংখ্যার মধ্যে বড় ব্যবধান রেখে "এটা মোটামুটি বড়" বলার সততা বজায় রাখে।</div>

<h3>Velocity — টিমের ঐতিহাসিক গতি</h3>
<p><span class="kw">Velocity</span> হলো একটা টিম গড়ে প্রতি Sprint-এ কত Story Point সম্পন্ন করে — এটা একটা পূর্বাভাস টুল, লক্ষ্যমাত্রা নয়।</p>
<div class="callout mistake"><span class="tag">Common mistake — Velocity-কে Performance Target বানানো</span>
যদি ম্যানেজমেন্ট "আমাদের velocity প্রতি Sprint বাড়াতে হবে" বলে চাপ দেয়, টিম দ্রুত বুঝে ফেলে বড় সংখ্যায় estimate করলেই "ভালো দেখাবে" — এতে Story Point-এর প্রকৃত অর্থ (আপেক্ষিক জটিলতার সৎ পরিমাপ) নষ্ট হয়ে যায় (এই ঘটনাকে "velocity inflation" বলে)। Velocity শুধু <b>ভবিষ্যৎ পরিকল্পনার জন্য একটা পরিসংখ্যানগত গড়</b> — কোনো টিমের সাথে অন্য টিমের velocity তুলনা করাও অর্থহীন, কারণ Story Point-এর স্কেল প্রতিটা টিমের নিজস্ব, আপেক্ষিক সংজ্ঞা।</div>
</template>

<h2 class="title">৮. Kanban</h2>
<p class="lead"><span class="kw">Kanban</span> টয়োটার প্রোডাকশন সিস্টেম থেকে আসা একটা পদ্ধতি — Scrum-এর মতো নির্দিষ্ট Sprint/roles নেই, বরং একটা ক্রমাগত প্রবাহিত কাজের ব্যবস্থা, দৃশ্যমানতা ও কাজের পরিমাণ সীমিত করার ওপর কেন্দ্রীভূত।</p>

<h3>Kanban Board — কাজের দৃশ্যমানতা</h3>
<div class="diagram"><pre>
┌──────────┐ ┌──────────────┐ ┌────────────┐ ┌────────┐
│  To Do    │ │ In Progress   │ │  In Review  │ │  Done   │
│           │ │  (WIP limit:3)│ │(WIP limit:2)│ │         │
│  Task A   │ │  Task D       │ │  Task F     │ │ Task H  │
│  Task B   │ │  Task E       │ │  Task G     │ │ Task I  │
│  Task C   │ │               │ │             │ │         │
└──────────┘ └──────────────┘ └────────────┘ └────────┘
</pre></div>

<h3>WIP Limit ও Pull System</h3>
<table>
<tr><th>নীতি</th><th>ব্যাখ্যা</th></tr>
<tr><td><span class="kw">WIP Limit</span> (Work In Progress)</td><td>প্রতিটা কলামে একসাথে সর্বোচ্চ কতগুলো কাজ থাকতে পারে তার একটা সীমা — নতুন কাজ শুরুর আগে আগেরটা শেষ করতে বাধ্য করে</td></tr>
<tr><td><span class="kw">Pull System</span></td><td>কাজ ঠেলে (push) দেওয়া হয় না — একজন সদস্য নিজের ক্ষমতা খালি হলে নিজেই পরের কাজ "টেনে" নেন</td></tr>
</table>
<div class="callout why"><span class="tag">WIP Limit কেন — Multitasking-এর লুকানো খরচ</span>
একসাথে অনেক কাজ চালু রাখা (multitasking) স্বজ্ঞাগতভাবে দ্রুত মনে হয়, কিন্তু আসলে context-switching-এর খরচে সামগ্রিক throughput কমিয়ে দেয় — প্রতিটা কাজ "প্রায় শেষ" অবস্থায় আটকে থাকে, কোনোটাই সত্যিকারের "Done" হয় না। WIP Limit জোর করে একটা কাজ শেষ করে তারপর পরেরটা শুরু করতে বাধ্য করে, ফলে জিনিস দ্রুত <b>Done</b> কলামে পৌঁছায় (Little's Law: গড় সময় = WIP / throughput — WIP কমালে সময়ও কমে)।</div>

<h3>Cumulative Flow Diagram (CFD)</h3>
<div class="callout behind"><span class="tag">CFD কীভাবে Bottleneck দেখায়</span>
একটা Cumulative Flow Diagram প্রতিটা কলামে সময়ের সাথে কাজের সংখ্যা স্তরে স্তরে (stacked area) দেখায়। যদি কোনো একটা স্তর ক্রমশ চওড়া হতে থাকে (অন্যদের তুলনায়), তার মানে সেই ধাপে কাজ জমা হচ্ছে — একটা bottleneck। এটা visual ভাবে সাথে সাথে বোঝা যায় কোথায় প্রবাহ আটকে যাচ্ছে, কোনো জটিল বিশ্লেষণ ছাড়াই।</div>

Scrum ভালো কাজ করে যখন কাজ পরিকল্পনাযোগ্য ব্যাচে ভাগ করা যায় ও একটা স্থিতিশীল, পূর্বনির্ধারিত Sprint Goal থাকা সম্ভব (নতুন ফিচার ডেভেলপমেন্ট)। Kanban ভালো কাজ করে যখন কাজ অপ্রত্যাশিতভাবে আসে ও অগ্রাধিকার ঘন ঘন বদলায় (Support/Operations টিম, Production incident handling) — সেখানে একটা ২-সপ্তাহের Sprint পরিকল্পনা অবাস্তব, কারণ জরুরি টিকিট যেকোনো সময় আসতে পারে।</div>

<template data-page="backlog">
<h2 class="title">১০. Backlog Refinement ও Prioritization</h2>
<p class="lead">একটা Product Backlog সময়ের সাথে বড়, বিশৃঙ্খল হয়ে যেতে পারে যদি নিয়মিত পরিষ্কার ও অগ্রাধিকার না দেওয়া হয়।</p>

<h3>Backlog Refinement (Grooming)</h3>
<p><span class="kw">Backlog Refinement</span> একটা চলমান কার্যক্রম — PO ও Dev Team নিয়মিত (সাধারণত সপ্তাহে একবার) মিলে Backlog-এর ওপরের আইটেমগুলো পরিষ্কার করেন: বিস্তারিত করা, ছোট ছোট আইটেমে ভাঙা, Acceptance Criteria যোগ করা, estimate দেওয়া।</p>

<h3>Prioritization Technique</h3>
<table>
<tr><th>টেকনিক</th><th>ব্যাখ্যা</th></tr>
<tr><td><span class="kw">MoSCoW</span></td><td>Must have, Should have, Could have, Won't have — সহজ চার-স্তরের অগ্রাধিকার</td></tr>
<tr><td><span class="kw">Value vs Effort Matrix</span></td><td>দুই অক্ষে (ব্যবসায়িক মূল্য, বাস্তবায়নের খরচ) আইটেম বসিয়ে "Quick Win" (উচ্চ মূল্য, কম খরচ) খুঁজে বের করা</td></tr>
<tr><td><span class="kw">WSJF</span> (Weighted Shortest Job First)</td><td>(ব্যবসায়িক মূল্য + সময়ের সংবেদনশীলতা + ঝুঁকি হ্রাস) ÷ কাজের আকার — SAFe-এ ব্যবহৃত</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সবকিছুকে "High Priority" চিহ্নিত করা</span>
যদি Backlog-এর ৮০% আইটেম "High Priority" হয়, প্রায়োরিটাইজেশনের কোনো বাস্তব অর্থ থাকে না — এটা একটা সাধারণ ফাঁদ যখন একাধিক stakeholder সবাই নিজের অনুরোধকে সবচেয়ে জরুরি মনে করেন। PO-এর দায়িত্ব একটাই স্পষ্ট, কঠোর অগ্রাধিকার-ক্রম বজায় রাখা — সবাইকে খুশি করার চেষ্টায় একটা সমতল, অর্থহীন তালিকা তৈরি না করা।</div>
<div class="callout why"><span class="tag">কেন নিয়মিত Refinement — Sprint Planning-কে দ্রুত রাখা</span>
যদি Backlog আইটেমগুলো আগে থেকে refine করা না থাকে, Sprint Planning মিটিং-এই বিস্তারিত আলোচনা/estimation করতে হয় — যা ৪ ঘণ্টার সময়সীমা দ্রুত শেষ করে ফেলে। নিয়মিত Refinement এই কাজ আগেভাগে ছড়িয়ে দেয়, যাতে Sprint Planning শুধু "কী নেব" সিদ্ধান্তে কেন্দ্রীভূত থাকতে পারে, "এই আইটেমটা আসলে কী মানে" আলোচনায় নয়।</div>

<template data-page="definition">
<h2 class="title">১১. Definition of Done ও Ready</h2>
<p class="lead">"Done" শব্দটা টিমের প্রতিটা সদস্যের কাছে ভিন্ন অর্থ বহন করতে পারে যদি স্পষ্টভাবে সংজ্ঞায়িত না করা হয় — এই দুটো চেকলিস্ট সেই অস্পষ্টতা দূর করে।</p>

<h3>Definition of Done (DoD)</h3>
<p><span class="kw">Definition of Done</span> একটা চেকলিস্ট যা প্রতিটা Backlog আইটেমের জন্য প্রযোজ্য — এটা পূরণ না হলে কাজটা "সম্পন্ন" ধরা যাবে না, তা যতই ফাংশনালি কাজ করুক।</p>
<div class="diagram"><pre>
উদাহরণ DoD চেকলিস্ট:
  ☑ কোড লেখা ও পিয়ার-রিভিউ হয়েছে
  ☑ ইউনিট টেস্ট লেখা ও পাস হয়েছে (coverage ≥ 80%)
  ☑ Acceptance Criteria অনুযায়ী QA যাচাই করেছে
  ☑ ডকুমেন্টেশন আপডেট হয়েছে
  ☑ Staging environment-এ ডিপ্লয় ও যাচাই হয়েছে
</pre></div>

<h3>Definition of Ready (DoR)</h3>
<p><span class="kw">Definition of Ready</span> বিপরীত দিক থেকে দেখে — একটা আইটেম Sprint-এ নেওয়ার <b>আগে</b> কী শর্ত পূরণ করা উচিত।</p>
<table>
<tr><th>শর্ত</th><th>ব্যাখ্যা</th></tr>
<tr><td>স্পষ্ট Acceptance Criteria</td><td>কী হলে "সম্পন্ন" তা টিম আগে থেকেই জানে</td></tr>
<tr><td>Estimate করা হয়েছে</td><td>টিম জানে এটা মোটামুটি কতটা কাজ</td></tr>
<tr><td>Dependency চিহ্নিত</td><td>অন্য কোনো টিম/সিস্টেমের ওপর নির্ভরতা থাকলে তা স্পষ্ট</td></tr>
<tr><td>যথেষ্ট ছোট</td><td>এক Sprint-এর মধ্যে বাস্তবসম্মতভাবে শেষ করা সম্ভব</td></tr>
</table>
<div class="callout why"><span class="tag">DoR কেন — মাঝপথে "আসলে এটার মানে কী" প্রশ্ন এড়ানো</span>
Definition of Ready ছাড়া একটা আইটেম Sprint-এ নেওয়ার পর দেখা যেতে পারে এটা আসলে অস্পষ্ট, বা অন্য একটা টিমের ওপর নির্ভরশীল যা কেউ আগে খেয়াল করেনি — Sprint মাঝপথেই আটকে যায়। DoR একটা "গেটকিপার" — যা এই ধরনের সমস্যা Sprint শুরুর আগেই ধরে ফেলে, Sprint-এর ভেতরে নয়।</div>
<div class="callout mistake"><span class="tag">Common mistake — DoD-কে শুধু "কোড কাজ করে" ধরে নেওয়া</span>
যদি DoD-তে টেস্টিং, ডকুমেন্টেশন, ডিপ্লয়মেন্ট যাচাই অন্তর্ভুক্ত না থাকে, "Done" আইটেম আসলে প্রায়ই লুকানো কাজ (hidden work) নিয়ে আসে — যা পরে "টেকনিক্যাল ঋণ" হিসেবে জমা হয়। একটা শক্তিশালী DoD নিশ্চিত করে প্রতিটা Sprint-এর Increment সত্যিই production-ready।</div>

<p class="lead">Scrum মূলত একটা একক, ছোট টিমের (৫-৯ জন) জন্য ডিজাইন করা। যখন একটা প্রতিষ্ঠানে শত শত ইঞ্জিনিয়ার, একাধিক টিম একই প্রোডাক্টে কাজ করে, একটা সমন্বয়ের কাঠামো দরকার হয়।</p>

<h3>প্রধান Scaling Framework</h3>

<template data-page="retro">
<h2 class="title">১৪. Retrospective Techniques</h2>
<p class="lead">Retrospective Scrum-এর সবচেয়ে গুরুত্বপূর্ণ, অথচ প্রায়ই সবচেয়ে অবহেলিত ইভেন্ট — টিমের ক্রমাগত উন্নতির (continuous improvement) একমাত্র নিয়মিত সুযোগ।</p>

<h3>জনপ্রিয় Retrospective ফরম্যাট</h3>
<table>
<tr><th>টেকনিক</th><th>কাঠামো</th></tr>
<tr><td><span class="kw">Start-Stop-Continue</span></td><td>কী শুরু করা উচিত, কী বন্ধ করা উচিত, কী চালিয়ে যাওয়া উচিত</td></tr>
<tr><td><span class="kw">4Ls</span></td><td>Liked, Learned, Lacked, Longed For</td></tr>
<tr><td><span class="kw">Sailboat</span></td><td>বাতাস (যা এগিয়ে নিচ্ছে), নোঙর (যা আটকে রাখছে), পাথর (ঝুঁকি), দ্বীপ (লক্ষ্য) — রূপক দিয়ে আলোচনা সহজ করে</td></tr>
<tr><td><span class="kw">Mad-Sad-Glad</span></td><td>আবেগভিত্তিক প্রতিফলন — কী নিয়ে টিম হতাশ, দুঃখিত, খুশি</td></tr>
</table>

<h3>Retrospective কার্যকর করার নীতি</h3>
<div class="callout best"><span class="tag">Best practice — Action Item ছাড়া Retrospective অর্থহীন</span>
একটা Retrospective যদি শুধু অভিযোগ/প্রশংসার তালিকা তৈরি করে কোনো নির্দিষ্ট, দায়িত্বপ্রাপ্ত action item ছাড়াই শেষ হয়, পরের Sprint-এও একই সমস্যা আবার আসবে। প্রতিটা Retrospective থেকে সর্বোচ্চ ১-৩টা নির্দিষ্ট, ছোট, পরবর্তী Sprint-এই বাস্তবায়নযোগ্য action item বের করা উচিত — অনেকগুলো বড় পরিবর্তনের প্রতিশ্রুতির চেয়ে কম কিন্তু বাস্তবায়িত পরিবর্তন অনেক বেশি কার্যকর।</div>
<div class="callout why"><span class="tag">Retrospective Prime Directive</span>
Norm Kerth-এর লেখা এই নীতি Retrospective শুরুর আগে প্রায়ই পড়া হয়: "আমরা যা কিছুই আবিষ্কার করি না কেন, আমরা বুঝি ও সত্যিকারভাবে বিশ্বাস করি যে সেই সময়ে যা জানা ছিল, যে দক্ষতা ও সম্পদ ছিল, পরিস্থিতি যেমন ছিল, তাতে প্রত্যেকে যতটা ভালো করা সম্ভব ততটাই করেছেন।" এই মানসিকতা ছাড়া Retrospective সহজেই দোষারোপের মিটিং হয়ে যায় — মানুষ রক্ষণাত্মক হয়ে যান, প্রকৃত শেখা বন্ধ হয়ে যায়।</div>

<template data-page="interview">
<h2 class="title">১৮. Interview প্রশ্নোত্তর</h2>
<p class="lead">Agile/Scrum ইন্টারভিউতে বারবার আসা প্রশ্ন — শুধু সংজ্ঞা মুখস্থ নয়, প্রতিটার পেছনের যুক্তি বোঝা।</p>

<h3>১) Agile আর Scrum-এর মধ্যে পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> Agile একটা মূল্যবোধ/দর্শন (Manifesto-তে সংজ্ঞায়িত), কোনো নির্দিষ্ট প্রক্রিয়া নয়। Scrum একটা নির্দিষ্ট ফ্রেমওয়ার্ক যা এই দর্শন বাস্তবায়ন করে (নির্দিষ্ট roles, events, artifacts সহ)। Kanban, XP-ও একই দর্শনের ভিন্ন বাস্তবায়ন (১ নম্বর অধ্যায়ে)।</p>

<h3>২) Product Owner আর Scrum Master-এর দায়িত্বের পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> PO ঠিক করেন <b>কী</b> তৈরি হবে ও কোন ক্রমে (Backlog-এর মালিক, ROI-কেন্দ্রিক)। Scrum Master নিশ্চিত করেন Scrum প্রক্রিয়া ঠিকভাবে চলছে, বাধা দূর করেন — কোনো ম্যানেজার নন, একজন servant leader (৩ নম্বর অধ্যায়ে)।</p>

<h3>৩) Story Point কেন ব্যবহার করা হয়, সময় (ঘণ্টা) কেন নয়?</h3>
<p><b>ব্যাখ্যা:</b> মানুষ আপেক্ষিক তুলনায় (এটা ওটার চেয়ে দ্বিগুণ জটিল) সময়ের নিরঙ্কুশ অনুমানের চেয়ে অনেক বেশি নির্ভুল। Story Point ব্যক্তিভেদে ভিন্ন সময়ের সমস্যা এড়িয়ে জটিলতা/অনিশ্চয়তা/effort একসাথে আপেক্ষিকভাবে পরিমাপ করে (৭ নম্বর অধ্যায়ে)।</p>

<h3>৪) Velocity ঠিক কী পরিমাপ করে, এটা কীভাবে ভুলভাবে ব্যবহার হতে পারে?</h3>
<p><b>ব্যাখ্যা:</b> Velocity একটা টিম গড়ে প্রতি Sprint-এ কত Story Point সম্পন্ন করে — শুধু ভবিষ্যৎ পরিকল্পনার একটা পরিসংখ্যানগত টুল। এটাকে performance target বানালে "velocity inflation" ঘটে (টিম বড় সংখ্যায় estimate করে), আর দুই টিমের velocity তুলনা করা অর্থহীন কারণ Point-এর স্কেল প্রতিটা টিমের নিজস্ব (৭ নম্বর অধ্যায়ে)।</p>

<h3>৫) Scrum আর Kanban কখন কোনটা বেছে নেবেন?</h3>
<p><b>ব্যাখ্যা:</b> Scrum ভালো যখন কাজ ব্যাচে পরিকল্পনাযোগ্য (নতুন ফিচার ডেভেলপমেন্ট) — নির্দিষ্ট Sprint Goal সম্ভব। Kanban ভালো যখন কাজ অপ্রত্যাশিতভাবে আসে, অগ্রাধিকার ঘন ঘন বদলায় (Support/Ops টিম) — WIP Limit-ভিত্তিক ক্রমাগত প্রবাহ বেশি বাস্তবসম্মত (৯ নম্বর অধ্যায়ে)।</p>

<h3>৬) Definition of Done আর Acceptance Criteria-র পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> Acceptance Criteria একটা নির্দিষ্ট Story-র জন্য প্রযোজ্য (এই ফিচারটা কী করলে সঠিক)। Definition of Done প্রতিটা আইটেমের জন্য প্রযোজ্য একটা সার্বজনীন চেকলিস্ট (টেস্ট লেখা, রিভিউ হওয়া, ডকুমেন্টেশন) — Acceptance Criteria পূরণ হলেও DoD পূরণ না হলে আইটেম "Done" নয় (৬ ও ১১ নম্বর অধ্যায়ে)।</p>

<h3>৭) WIP Limit কী, এটা কেন কার্যকর?</h3>
<p><b>ব্যাখ্যা:</b> WIP Limit একটা Kanban বোর্ডের কলামে একসাথে সর্বোচ্চ কতগুলো কাজ থাকতে পারে তার সীমা। এটা multitasking-এর লুকানো খরচ (context-switching) কমায় — নতুন কাজ শুরুর আগে আগেরটা শেষ করতে বাধ্য করে, ফলে জিনিস দ্রুত সত্যিকারের "Done"-এ পৌঁছায় (৮ নম্বর অধ্যায়ে)।</p>

<h3>৮) Water-Scrum-Fall কী?</h3>
<p><b>ব্যাখ্যা:</b> এটা তখন ঘটে যখন requirements/design এখনও Waterfall-এর মতো শুরুতেই সম্পূর্ণ চূড়ান্ত করা হয়, শুধু implementation Sprint-এ ভাগ করা হয় — Agile-এর আসল সুবিধা (দ্রুত ফিডব্যাক, দিক পরিবর্তনের ক্ষমতা) হারিয়ে যায়, শুধু বাহ্যিক আচার-অনুষ্ঠান থেকে যায় (১৫ নম্বর অধ্যায়ে)।</p>

<h3>৯) Retrospective কীভাবে কার্যকর রাখবেন, যাতে এটা দোষারোপের মিটিং না হয়?</h3>
<p><b>ব্যাখ্যা:</b> Retrospective Prime Directive দিয়ে শুরু করা — সবাই বুঝে নেওয়া যে তখনকার জ্ঞান/পরিস্থিতিতে সবাই যথাসাধ্য করেছেন। প্রতিটা সেশন থেকে অল্প কিছু (১-৩টা), নির্দিষ্ট, পরবর্তী Sprint-এই বাস্তবায়নযোগ্য action item বের করা, শুধু অভিযোগের তালিকা নয় (১৪ নম্বর অধ্যায়ে)।</p>

<h3>১০) Agile আর DevOps কীভাবে সম্পর্কিত?</h3>
<p><b>ব্যাখ্যা:</b> Agile ঠিক করে "কী তৈরি করব" ও কীভাবে দ্রুত পরিমার্জন করব (Product দিক)। DevOps ঠিক করে কীভাবে সেটা দ্রুত, নিরাপদে production-এ পৌঁছাবে (Engineering দিক)। একটা ছাড়া আরেকটা অসম্পূর্ণ — দ্রুত প্ল্যান করেও যদি ডেলিভারি ধীর হয়, Agile-এর ফিডব্যাক লুপ ব্যর্থ হয়ে যায় (১৬ নম্বর অধ্যায়ে)।</p>
</template>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
