<h3>কোন টুল কখন — সংক্ষিপ্ত রেফারেন্স</h3>
<table>
<tr><th>টুল</th><th>মূল কাজ</th><th>ক্যানোনিক্যাল ব্যবহার</th></tr>
<tr><td><code>grep</code></td><td>Search / filter — pattern মেলা লাইন বের করা</td><td>একটা log ফাইলে নির্দিষ্ট error বা keyword খুঁজে বের করা</td></tr>
<tr><td><code>sed</code></td><td>Find-replace / stream transform — লাইন-বাই-লাইন বদলানো</td><td>একটা config ফাইলে একটা মান বদলে দেওয়া, বা লগ থেকে sensitive ডেটা মুছে ফেলা</td></tr>
<tr><td><code>awk</code></td><td>Field extraction / সাধারণ aggregation</td><td>একটা কলাম বের করা, গোনা, যোগ করা, বা একটা threshold-এর ভিত্তিতে ফিল্টার করা</td></tr>
</table>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
প্রতিটা টুল একটামাত্র কাজ ভালোভাবে করে, আর <code>|</code> দিয়ে জোড়া লাগিয়ে জটিল বিশ্লেষণ হয় — <code>grep</code> ফিল্টার করে, <code>sed</code> বদলায়, <code>awk</code> field বের করে/গোনে। <code>sed -i</code> সবসময় আগে dry-run করে বা <code>.bak</code> রেখে চালান — undo নেই। <code>2&gt;&amp;1</code>-এর ক্রম মনে রাখুন — বাম থেকে ডানে প্রসেস হয়। আর <code>\d</code>/<code>\w</code> POSIX regex-এ নেই, দরকার হলে <code>grep -P</code>। এই একই কমান্ড-লাইন দক্ষতা পরের চ্যাপ্টারেও লাগবে — Package Management-এ <code>dpkg -l</code>/<code>rpm -qa</code>-এর বিশাল আউটপুট থেকে নির্দিষ্ট প্যাকেজ খোঁজা, বা dependency conflict খুঁজে বের করার সময় এই একই grep/awk অভ্যাসই কাজে লাগবে।</div>

<h2 class="title">৬. Package Management</h2>
<p class="lead">সফটওয়্যার ইনস্টল করা মানে শুধু একটা ফাইল কপি করা নয় — কোথায় রাখা হবে, কী কী অন্য সফটওয়্যারের উপর নির্ভর করে, পরে কীভাবে নিরাপদে সরানো যাবে, এই সবকিছুর হিসাব রাখতে হয়। Package manager এই পুরো সমস্যাটাই সমাধান করে — এই চ্যাপ্টারে দেখব কীভাবে।</p>

<h3>কেন Package Manager দরকার — ম্যানুয়াল ইনস্টলের সমস্যা</h3>
<p>ধরুন আপনি source code থেকে একটা টুল কম্পাইল করে ইনস্টল করলেন — <span class="kw">compile from source</span>। এতে তিনটা জিনিসের দায়িত্ব সম্পূর্ণ আপনার উপর এসে পড়ে: টুলটার dependency (কোন library, কোন version) কী কী তা নিজে খুঁজে বের করে আগে থেকে ইনস্টল করা, টুলটা ঠিক কোন কোন ফাইল সিস্টেমে কোথায় রেখেছে তার হিসাব রাখা (যাতে পরে uninstall করার সময় সবকিছু খুঁজে মুছতে পারেন), আর নতুন version এলে আগেরটা কীভাবে বদলাবেন তা নিজে সামলানো। শত শত প্যাকেজের ক্ষেত্রে এটা দ্রুত অসম্ভব হয়ে ওঠে।</p>
<div class="callout why"><span class="tag">Package Manager আসলে কী সমাধান করে</span>
তিনটা মূল জিনিস। প্রথমত, <b>dependency resolution</b> — একটা প্যাকেজ ইনস্টল করতে চাইলে তার প্রয়োজনীয় সব library/প্যাকেজ স্বয়ংক্রিয়ভাবে খুঁজে বের করে ইনস্টল করা। দ্বিতীয়ত, একটা কেন্দ্রীয়, সার্চযোগ্য <b>ক্যাটালগ (repository)</b> — হাজার হাজার প্যাকেজ কোথায় পাওয়া যাবে তার একটা সুবিন্যস্ত তালিকা, যাতে প্রতিটার জন্য আলাদা ওয়েবসাইট খুঁজতে না হয়। তৃতীয়ত, প্রতিটা প্যাকেজ ঠিক কোন কোন <b>ফাইল</b> সিস্টেমে বসিয়েছে তার নিখুঁত হিসাব — যার ফলে uninstall করলে ঠিক সেই ফাইলগুলোই পরিষ্কারভাবে সরে যায়, অন্য কিছু নষ্ট না করে।</div>

<h3>দুইটা প্রধান ইকোসিস্টেম — Debian বনাম RedHat</h3>
<p>Linux distro-গুলো মূলত দুইটা পরিবারে ভাগ হয়, প্রতিটার নিজস্ব প্যাকেজ ফরম্যাট আর টুল আছে।</p>
<table>
<tr><th>পরিবার</th><th>প্যাকেজ ফাইল</th><th>টুল</th><th>Distro উদাহরণ</th></tr>
<tr><td>Debian-based</td><td><code>.deb</code></td><td><span class="kw">APT</span> (<code>apt</code>, নিচে <code>dpkg</code>)</td><td>Ubuntu, Debian, Linux Mint</td></tr>
<tr><td>RedHat-based</td><td><code>.rpm</code></td><td><span class="kw">DNF</span> / <span class="kw">YUM</span> (নিচে <code>rpm</code>)</td><td>RHEL, CentOS, Fedora, Rocky Linux, AlmaLinux</td></tr>
</table>
<div class="callout why"><span class="tag">দুটোই একই ধারণা, শুধু ভিন্ন ভাষা</span>
APT আর DNF যা করে তা <b>ধারণাগতভাবে হুবহু একই</b> — index refresh করো, dependency resolve করো, প্যাকেজ ডাউনলোড-আনপ্যাক-রেজিস্টার করো। পার্থক্যটা শুধু কমান্ডের নাম আর প্যাকেজের নামকরণে (যেমন Ubuntu-তে <code>python3-pip</code>, Fedora-তে <code>python3-pip</code>-ই কখনো, কখনো <code>python3-pip</code> ভিন্ন repo-তে থাকে)। একবার dependency resolution-এর ধারণাটা বুঝে গেলে, একটা পরিবার থেকে আরেকটায় যাওয়া মূলত কমান্ড-ম্যাপিং শেখা মাত্র — নিচের টেবিলে সেটাই দেওয়া আছে।</div>
<p>এছাড়া একটা তৃতীয়, ছোট কিন্তু গুরুত্বপূর্ণ উদাহরণ — Alpine Linux-এর <span class="kw">apk</span>। Alpine-এর প্যাকেজ ও বেস ইমেজ ইচ্ছাকৃতভাবে ন্যূনতম আকারের (কয়েক MB), তাই Docker base image হিসেবে (<code>FROM alpine</code>) এটা খুব জনপ্রিয় — কম layer size মানে দ্রুত pull, ছোট attack surface।</p>

<h3>APT — মূল কমান্ডসমূহ</h3>
<pre><span class="c"># repository metadata refresh — কিছু ইনস্টল করে না</span>
sudo apt update

<span class="c"># ইতিমধ্যে ইনস্টল করা প্যাকেজগুলোর নতুন version আছে কিনা দেখে, থাকলে ইনস্টল করে</span>
sudo apt upgrade

<span class="c"># নতুন প্যাকেজ ইনস্টল</span>
sudo apt install nginx

<span class="c"># প্যাকেজ সরায়, কিন্তু /etc-এর config ফাইল রেখে দেয়</span>
sudo apt remove nginx

<span class="c"># প্যাকেজ ও তার config ফাইল — দুটোই সম্পূর্ণ সরিয়ে দেয়</span>
sudo apt purge nginx

<span class="c"># নাম বা বিবরণে মিলিয়ে প্যাকেজ খোঁজে</span>
apt search nginx

<span class="c"># সিস্টেমে বর্তমানে ইনস্টল করা সব প্যাকেজের তালিকা</span>
apt list --installed</pre>
<div class="callout mistake"><span class="tag"><code>apt update</code> বনাম <code>apt upgrade</code> — সবচেয়ে সাধারণ বিভ্রান্তি</span>
এই দুইটার নাম কাছাকাছি হলেও কাজ সম্পূর্ণ ভিন্ন। <code>apt update</code> শুধু <b>local package index</b> — অর্থাৎ কোন প্যাকেজের কোন version কোথায় পাওয়া যায় তার metadata — configured repository থেকে টেনে রিফ্রেশ করে। এতে সিস্টেমে <b>একটা প্যাকেজও ইনস্টল বা আপডেট হয় না</b>। আসল আপডেট ঘটে <code>apt upgrade</code>-এ, যা ইতিমধ্যে ইনস্টল থাকা প্যাকেজগুলোর নতুন version সেই (আগে রিফ্রেশ করা) index অনুযায়ী ডাউনলোড করে বসায়। <code>apt update</code> না চালিয়ে সরাসরি <code>apt upgrade</code> চালালে index পুরনো থাকায় কিছুই নতুন মনে হবে না, বা ভুল version ইনস্টল হতে পারে।</div>

<h3>Repository sources — কোথা থেকে প্যাকেজ আসছে</h3>
<p><code>/etc/apt/sources.list</code> ও <code>/etc/apt/sources.list.d/</code>-এর ফাইলগুলো ঠিক করে দেয় apt কোন কোন repository-কে "উৎস" হিসেবে বিবেচনা করবে। ডিফল্টভাবে এখানে distro-র নিজস্ব official repository থাকে, কিন্তু অনেক সময় দরকার হয় তৃতীয় পক্ষের <span class="kw">PPA</span> (Personal Package Archive) বা কাস্টম repository যোগ করার — যেমন কোনো সফটওয়্যার ভেন্ডরের নিজস্ব apt repo।</p>
<div class="callout why"><span class="tag">তৃতীয় পক্ষের repo যোগ করা মানে একটা trust decision</span>
কোনো নতুন repository <code>sources.list.d/</code>-এ যোগ করার মানে, আপনি সেই repo-র মেইনটেইনারকে বিশ্বাস করছেন — সে যা প্যাকেজ প্রকাশ করবে তাই আপনার সিস্টেমে root privilege নিয়ে ইনস্টল হতে পারবে। apt নিজে থেকে জানে না প্যাকেজের ভেতরের কোড নিরাপদ কিনা — শুধু এটা যাচাই করে যে ডাউনলোড হওয়া প্যাকেজটা ট্রানজিটে বদলে যায়নি বা জাল নয়। এই যাচাই হয় <span class="kw">GPG signing</span>-এর মাধ্যমে — প্রতিটা বিশ্বস্ত repository-র একটা signing key থাকে, প্যাকেজ প্রকাশের সময় সেই key দিয়ে সাইন করা হয়, আর apt ইনস্টলের আগে সেই signature যাচাই করে। কোনো repo-র signing key আপনার সিস্টেমে যোগ করা মানেই আপনি সেই মেইনটেইনারকে আপনার মেশিনে root-level কোড চালানোর অনুমতি দিচ্ছেন — হালকাভাবে নেওয়ার সিদ্ধান্ত নয়।</div>

<h3>Dependency Resolution — পর্দার পেছনে</h3>
<p>যখন <code>apt install X</code> চালান, আর X-এর জন্য library Y-এর version ≥ 2.0 দরকার হয়, তখন apt পুরো <span class="kw">dependency graph</span> হিসাব করে — Y দরকার কিনা, Y-এর আবার কিছু দরকার কিনা, এভাবে পুরো chain মিলিয়ে দেখে ঠিক কী কী ইনস্টল বা আপগ্রেড করতে হবে সব একসাথে বের করে, তারপর একবারে সব ডাউনলোড ও ইনস্টল করে।</p>
<div class="callout behind"><span class="tag">"Dependency Hell" — package manager আসার আগের যুগের সমস্যা</span>
Package manager ছাড়া, প্রতিটা প্রোগ্রাম নিজের প্রয়োজনীয় library নিজে ম্যানুয়ালি ইনস্টল করলে একটা পরিচিত দুঃস্বপ্ন তৈরি হতো — প্রোগ্রাম A-এর জন্য library Z-এর version 1.2 দরকার, একই সিস্টেমে ইনস্টল করা প্রোগ্রাম B-এর জন্য দরকার Z-এর version 2.0, আর দুটো version একসাথে সহাবস্থান করতে না পারলে একটা প্রোগ্রামকে অকেজো করে দিতে হতো। একেই বলা হতো <span class="kw">dependency hell</span>। আধুনিক package manager এটা সমাধান করে কেন্দ্রীভূতভাবে পুরো সিস্টেমের সব প্যাকেজ ও তাদের version constraint একসাথে ট্র্যাক করে, আর প্রয়োজনে একাধিক version পাশাপাশি রাখার ব্যবস্থাও (যেমন <code>libssl1.1</code> ও <code>libssl3</code> একসাথে ইনস্টল থাকা) সমর্থন করে।</div>

<h3>একটা ভিন্ন স্তর — Language-specific Package Manager</h3>
<p><span class="kw">npm</span> (Node.js), <span class="kw">NuGet</span> (.NET), <span class="kw">pip</span> (Python) — এগুলোও "package manager", কিন্তু একটা সম্পূর্ণ ভিন্ন <b>স্তরে</b> কাজ করে। apt/dnf পুরো অপারেটিং সিস্টেমের জন্য প্যাকেজ (বাইনারি, লাইব্রেরি, সিস্টেম টুল) ম্যানেজ করে — সিস্টেম-ওয়াইড, root privilege দিয়ে। NuGet/npm/pip শুধু একটা নির্দিষ্ট <b>প্রোজেক্টের</b> জন্য একটা নির্দিষ্ট রানটাইমের লাইব্রেরি ম্যানেজ করে, সাধারণত সেই প্রোজেক্টের নিজস্ব ফোল্ডারে (<code>node_modules</code>, <code>.nuget</code> cache), root privilege ছাড়াই।</p>
<div class="callout mistake"><span class="tag"><code>apt install dotnet-sdk</code> ≠ <code>dotnet add package</code></span>
এই দুটো গুলিয়ে ফেলা সহজ কারণ দুটোই "কিছু একটা ইনস্টল করে", কিন্তু সম্পূর্ণ ভিন্ন জিনিস সমাধান করে। <code>apt install dotnet-sdk</code> সিস্টেমে .NET SDK-<b>নিজেই</b> ইনস্টল করে — যাতে <code>dotnet</code> কমান্ড, compiler, runtime সিস্টেমে পাওয়া যায়। এটা একবার, মেশিন-স্তরে করা হয়। <code>dotnet add package Newtonsoft.Json</code> ধরে নেয় .NET SDK ইতিমধ্যে আছে, আর শুধু একটা নির্দিষ্ট <b>প্রোজেক্টের</b> জন্য একটা লাইব্রেরি নির্ভরতা যোগ করে (<code>.csproj</code>-এ লেখা হয়, NuGet থেকে ডাউনলোড হয়)। প্রথমটা ছাড়া দ্বিতীয়টা সম্ভবই নয় — কিন্তু দুটো সম্পূর্ণ ভিন্ন স্তরের কাজ, ভিন্ন ক্যাটালগ, ভিন্ন scope।</div>

<h3>Fresh সিস্টেমে সরাসরি install করার ঝুঁকি</h3>
<div class="callout mistake"><span class="tag">Fresh/stale সিস্টেমে <code>apt update</code> ছাড়াই <code>apt install</code></span>
একটা নতুন VM বা অনেকদিন update না করা সার্ভারে সরাসরি <code>apt install somepkg</code> চালালে local index পুরনো থাকতে পারে। এর ফল তিন রকম হতে পারে — index-এ প্যাকেজটাই না থাকায় "Unable to locate package" error; index পুরনো হওয়ায় একটা পুরনো, সম্ভবত নিরাপত্তা-দুর্বল version ইনস্টল হয়ে যাওয়া; বা repository থেকে ইতিমধ্যে সরিয়ে ফেলা কোনো URL-এর রেফারেন্স index-এ থেকে যাওয়ায় পুরো resolution ব্যর্থ হওয়া। তাই প্রতিটা fresh সিস্টেমে বা দীর্ঘদিন পর প্রথম কাজের আগে <code>apt update</code> একটা reflex habit হওয়া উচিত, চিন্তা না করেই।</div>

<h3>নিয়মিত রক্ষণাবেক্ষণ — Security Updates</h3>
<div class="callout best"><span class="tag">নিয়মিত checked রাখুন — <code>apt list --upgradable</code></span>
<code>apt update && apt list --upgradable</code> চালিয়ে দেখুন ঠিক কোন কোন প্যাকেজের নতুন version অপেক্ষা করছে, upgrade করার আগেই — বিশেষ করে production সার্ভারে blind upgrade না চালিয়ে আগে দেখে নেওয়া ভালো অভ্যাস। সার্ভার fleet-এর জন্য <code>unattended-upgrades</code>-এর মতো টুল দিয়ে অন্তত <b>security patch</b> স্বয়ংক্রিয় করে রাখা একটা গুরুত্বপূর্ণ অপারেশনাল অভ্যাস — একটা critical CVE প্যাচ হওয়ার পরও সপ্তাহের পর সপ্তাহ manual upgrade-এর অপেক্ষায় থাকা অনেক production ব্রিচের আসল কারণ। এই স্বয়ংক্রিয়করণ ও scheduled maintenance আরও বিস্তারিতভাবে দেখব চ্যাপ্টার ১৩ (Security Hardening) ও চ্যাপ্টার ১৪ (Automation)-এ।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Package manager ম্যানুয়াল সফটওয়্যার ইনস্টলেশনের তিনটা বড় ব্যথা — dependency tracking, ক্যাটালগ খোঁজা, আর ফাইল ট্র্যাকিং — স্বয়ংক্রিয় করে দেয়। APT (Debian/Ubuntu) ও DNF (RHEL/Fedora) ধারণাগতভাবে সমান, শুধু কমান্ড ভিন্ন — <code>apt update</code> ইনডেক্স রিফ্রেশ করে, <code>apt upgrade</code>-ই আসল আপডেট করে, এই পার্থক্যটা মনে রাখাই সবচেয়ে গুরুত্বপূর্ণ। GPG signing নিশ্চিত করে প্যাকেজ বিশ্বাসযোগ্য উৎস থেকে অক্ষত অবস্থায় এসেছে। পরের চ্যাপ্টারে আমরা সরে যাব — এখন যে সফটওয়্যার ইনস্টল করলেন, সেটা <b>নেটওয়ার্কে</b> কীভাবে কথা বলে, port কীভাবে খোলে, firewall কীভাবে ট্রাফিক আটকায় বা যেতে দেয় — চ্যাপ্টার ৭ (Networking)।

<h2 class="title">৭. Networking Basics</h2>
<p class="lead">অ্যাপ্লিকেশন কাজ করছে না মানেই কোড খারাপ — এই ধারণাটাই সবচেয়ে বেশি সময় নষ্ট করায়। বাস্তবে সমস্যাটা প্রায়ই থাকে নেটওয়ার্কের কোনো একটা স্তরে — DNS resolve হচ্ছে না, firewall পোর্ট আটকে দিচ্ছে, অথবা সার্ভিসটাই আসলে চালু হয়নি। এই চ্যাপ্টারে এমন কিছু কমান্ড শিখবেন যেগুলো দিয়ে কোন স্তরটা আসলে ভাঙা তা মিনিটে বের করা যায়, কোড না ঘেঁটেই।</p>

<h3>IP ও Port — কেন দুটোই লাগে</h3>
<p>একটা <span class="kw">IP address</span> চিহ্নিত করে একটা মেশিন (বা তার একটা network interface) — নেটওয়ার্কে কোন হোস্টের সাথে কথা বলছেন সেটা বলে দেয়। কিন্তু একটা মেশিনে একসাথে অনেকগুলো সার্ভিস চলতে পারে — ওয়েব সার্ভার, ডেটাবেস, SSH ডিমন — সবাই একই IP-তে। তাহলে ট্রাফিক জানবে কোন প্রসেসের কাছে যেতে হবে? এই জন্যই দরকার <span class="kw">port</span> — একটা ১৬-বিট সংখ্যা (০-৬৫৫৩৫) যা মেশিনের ভেতরে একটা নির্দিষ্ট সার্ভিস/প্রসেসকে চিহ্নিত করে।</p>
<p>IP আর port একসাথে মিলে তৈরি করে একটা <b>socket</b> — আর প্রোটোকল (TCP/UDP) যোগ করলে সেটা একটা সম্পূর্ণ যোগাযোগের ঠিকানা হয়ে যায়: <code>protocol + IP + port</code>। যেমন <code>tcp://192.168.1.10:443</code> মানে — এই মেশিনে, TCP দিয়ে, ৪৪৩ নম্বর পোর্টে যে প্রসেস শুনছে তার সাথে কথা বলুন।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span>
"কানেকশন রিফিউজড" আর "টাইমআউট" — এই দুটো error আসলে দুটো ভিন্ন সমস্যার ইঙ্গিত দেয়। রিফিউজড মানে মেশিনে পৌঁছেছেন, কিন্তু ওই পোর্টে কেউ শুনছে না। টাইমআউট মানে মেশিনেই পৌঁছাতে পারেননি — সম্ভবত ফায়ারওয়াল বা রাউটিং সমস্যা। IP আর port আলাদা করে বুঝলে এই দুই ধরনের error থেকেই দ্রুত সঠিক দিকে তদন্ত শুরু করা যায়।</div>

<h3><span class="kw">ss</span> — কে কোন পোর্টে শুনছে</h3>
<p>পুরনো <code>netstat</code>-এর জায়গায় আধুনিক Linux ডিস্ট্রোতে এখন <span class="kw">ss</span> (socket statistics) ব্যবহার হয় — দ্রুত, আর সরাসরি kernel-এর <code>/proc/net</code> থেকে তথ্য পড়ে। "এই মেশিনে আসলে কী চলছে এবং কোন প্রসেস সেটার মালিক" — এটা বের করার প্রধান কমান্ড এটাই।</p>
<pre><span class="c"># সবচেয়ে বেশি ব্যবহৃত কম্বিনেশন</span>
ss -tulnp

<span class="c"># নমুনা আউটপুট</span>

tcp    LISTEN  0       511          127.0.0.1:5432            0.0.0.0:*      users:(("postgres",pid=1904,fd=6))
udp    UNCONN  0       0              0.0.0.0:68              0.0.0.0:*      users:(("dhclient",pid=601,fd=5))</pre>

<div class="callout best"><span class="tag">practical ব্যবহার</span>
"পোর্ট ৮০৮০-এ কিছু একটা আগে থেকেই চলছে" বা "আমার অ্যাপ কি আদৌ start হয়েছে" — এই প্রশ্নের উত্তর <code>ss -tulnp | grep 8080</code> দিয়ে সেকেন্ডে পাওয়া যায়। <code>Local Address</code> কলামে <code>0.0.0.0:8080</code> মানে সব ইন্টারফেস থেকে অ্যাক্সেসযোগ্য, আর <code>127.0.0.1:8080</code> মানে শুধু নিজের মেশিন থেকেই — এই পার্থক্যটা প্রায়ই "লোকালহোস্ট থেকে কাজ করে কিন্তু বাইরে থেকে করে না" জাতীয় সমস্যার আসল কারণ।</div>

<h3>TIME_WAIT — সার্ভিস restart করলেই "Address already in use" কেন আসে</h3>
<p>একটা খুব পরিচিত মুহূর্ত — কোনো সার্ভিস (dotnet app, nginx) বন্ধ করে সাথে সাথেই আবার চালু করতে গেলে <code>bind: Address already in use</code> এরর আসে, যদিও <code>ss -tulnp</code>-এ সেই পোর্টে কোনো প্রসেস শুনছে বলে দেখাচ্ছে না। এর পেছনের কারণ TCP-এর নিজস্ব একটা নিয়ম — <span class="kw">TIME_WAIT</span> state।</p>
<div class="callout behind"><span class="tag">TIME_WAIT আসলে কী, আর কেন এড়ানো যায় না</span>
যে পক্ষ প্রথমে একটা TCP কানেকশন বন্ধ করে (active close), তার socket সাথে সাথে পুরোপুরি মুছে যায় না — এটা কিছু সময়ের (সাধারণত ৩০-১২০ সেকেন্ড, kernel-নির্ভর) জন্য <b>TIME_WAIT</b> state-এ থেকে যায়। এই বিলম্ব ইচ্ছাকৃত — নেটওয়ার্কে দেরিতে পৌঁছানো কোনো পুরনো "delayed" প্যাকেট যদি একই IP:port কম্বিনেশনে তৈরি হওয়া নতুন কানেকশনে গিয়ে পড়ে, TIME_WAIT সেই পুরনো ডেটাকে নতুন কানেকশনের সাথে গুলিয়ে যাওয়া থেকে রক্ষা করে। তাই এটা কোনো bug না, protocol-এর ইচ্ছাকৃত সুরক্ষা। সমস্যাটা দেখা যায় যখন একটা সার্ভার প্রসেস নিজেই একটা পোর্টে listen করছিল আর সেটাকে রিস্টার্ট করা হলো — পুরনো instance-এর সকেট তখনো TIME_WAIT-এ, আর নতুন instance ঠিক একই পোর্টে bind করতে গিয়ে kernel-এর কাছে "পোর্ট এখনো ব্যবহৃত" জবাব পায়।
</div>
<pre><span class="c"># TIME_WAIT অবস্থায় থাকা সকেট দেখা</span>
$ ss -tan state time-wait
State      Recv-Q Send-Q  Local Address:Port    Peer Address:Port
TIME-WAIT  0      0        0.0.0.0:5000          203.0.113.9:51422</pre>
<div class="callout best"><span class="tag">সমাধান — SO_REUSEADDR, প্রোগ্রাম-লেভেলে</span>
এই সমস্যা এড়াতে অপেক্ষা করার দরকার নেই — বেশিরভাগ modern web server/framework (Kestrel/ASP.NET Core, nginx, Node.js) ডিফল্টভাবেই তাদের listening socket-এ <code>SO_REUSEADDR</code> অপশন সেট করে রাখে, যা kernel-কে বলে "TIME_WAIT-এ থাকা পুরনো সকেট থাকলেও আমাকে এই পোর্টে bind করতে দাও" — কারণ নতুন প্রসেসটাই আসল owner, পুরনো delayed প্যাকেটের ঝুঁকি এখানে গ্রহণযোগ্য। কোনো কাস্টম/লো-লেভেল সকেট কোডে এই সমস্যা দেখা দিলে <code>SO_REUSEADDR</code> এক্সপ্লিসিটভাবে সেট করাই সমাধান — <code>kill</code> করে বা কিছুক্ষণ অপেক্ষা করে "সমাধান" করার দরকার নেই।
</div>

<h3>DNS — নাম থেকে ঠিকানা</h3>
<p><span class="kw">DNS resolution</span>-এর কাজ আসলে একটাই — একটা hostname (যেমন <code>example.com</code>) কে একটা IP address-এ রূপান্তর করা, কারণ নেটওয়ার্ক স্তরে সব যোগাযোগ IP দিয়েই হয়, নাম দিয়ে নয়।</p>
<p>দুটো ফাইল এই প্রক্রিয়ায় সরাসরি জড়িত:</p>
<div class="grid2">
  <div class="box"><b>/etc/resolv.conf</b><br>কোন DNS সার্ভারের কাছে প্রশ্ন পাঠানো হবে সেটা বলে দেয় (<code>nameserver 8.8.8.8</code>)। DHCP বা systemd-resolved প্রায়ই এই ফাইল স্বয়ংক্রিয়ভাবে ম্যানেজ করে।</div>
  <div class="box"><b>/etc/hosts</b><br>স্থানীয় static override — এখানে যা লেখা থাকে তা DNS-এর কাছে জিজ্ঞেস করার <b>আগেই</b> চেক করা হয়।</div>
</div>
<div class="callout why"><span class="tag">/etc/hosts কেন এত কাজে লাগে</span>
কোনো ডোমেইনের DNS রেকর্ড বদলানোর পর সেটা পুরো ইন্টারনেটে propagate হতে ঘণ্টাখানেক থেকে ৪৮ ঘণ্টা পর্যন্ত লাগতে পারে (TTL-এর উপর নির্ভর করে)। কিন্তু নতুন সার্ভারটা DNS propagate হওয়ার আগেই টেস্ট করতে চাইলে, <code>/etc/hosts</code>-এ ম্যানুয়ালি সেই ডোমেইনকে নতুন সার্ভারের IP-তে ম্যাপ করে দেওয়া যায় — যেহেতু এটা DNS lookup-এর আগে চেক হয়, তাই পুরো সিস্টেমের কাছে মনে হবে DNS ইতিমধ্যেই আপডেট হয়ে গেছে, অথচ বাস্তবে কেবল এই একটা মেশিনেই ওভাররাইড করা হলো।</div>
<pre><span class="c"># hostname → IP resolve করো, আর কোন record type কোথা থেকে এলো তা বিস্তারিত দেখাও</span>
dig example.com

<span class="c"># সংক্ষিপ্ত অংশ যা সবচেয়ে গুরুত্বপূর্ণ</span>
;; ANSWER SECTION:
example.com.        3600    IN    A    93.184.216.34</pre>
<p>এখানে <span class="kw">A record</span>-ই মূল উত্তর — এটা একটা hostname-কে সরাসরি একটা IPv4 address-এর সাথে ম্যাপ করে। <code>nslookup example.com</code> দিয়েও একই কাজ করা যায়, তবে <code>dig</code> বেশি বিস্তারিত তথ্য দেয় (কোন nameserver জবাব দিলো, TTL কত, ইত্যাদি) — তাই ডিবাগিং-এর জন্য <code>dig</code>-ই বেশি পছন্দনীয়।</p>

<h3><span class="kw">curl</span> — শুধু ডাউনলোডের টুল নয়, একটা diagnostic টুল</h3>
<p><code>curl</code> সাধারণত ডেটা আনার জন্য ব্যবহার হয়, কিন্তু <code>-v</code> (verbose) ফ্ল্যাগসহ এটা একটা পুরো request-এর প্রতিটা স্তর একে একে দেখিয়ে দেয় — কোন স্তরে সমস্যা হচ্ছে সেটা আলাদা করার জন্য এর চেয়ে ভালো first-line টুল কমই আছে।</p>
<pre>curl -v https://example.com

<span class="c">*   Trying 93.184.216.34:443...</span>            <span class="c"># DNS resolve হয়েছে, এখন TCP connect করছে</span>
<span class="c">* Connected to example.com (93.184.216.34) port 443</span>  <span class="c"># TCP handshake সফল</span>
<span class="c">* ALPN, offering h2</span>
<span class="c">* TLSv1.3, handshake finished</span>              <span class="c"># TLS handshake সফল — সার্টিফিকেট, cipher সব ঠিক আছে</span>
<span class="kw">&gt; GET / HTTP/1.1</span>
<span class="kw">&gt; Host: example.com</span>
<span class="c">*</span>
<span class="kw">&lt; HTTP/1.1 200 OK</span>                          <span class="c"># সার্ভার রেসপন্স দিয়েছে</span>
<span class="kw">&lt; Content-Type: text/html</span></pre>
<p>প্রতিটা লাইন একটা আলাদা স্তরের প্রমাণ দেয়:</p>
<table>
<tr><th>আউটপুটের অংশ</th><th>যা প্রমাণ করে</th></tr>
<tr><td><code>Trying &lt;IP&gt;</code></td><td>DNS resolution সফল হয়েছে — hostname একটা IP পেয়েছে</td></tr>
<tr><td><code>Connected to ...</code></td><td>TCP handshake সফল — মেশিনটা network-এ পৌঁছানো যাচ্ছে এবং কোনো firewall আটকায়নি</td></tr>
<tr><td><code>TLS handshake finished</code></td><td>TLS/SSL negotiation সফল — সার্টিফিকেট valid, cipher matched</td></tr>
<tr><td><code>&lt; HTTP/1.1 200 OK</code></td><td>সার্ভারের অ্যাপ্লিকেশন কোড আসলে একটা response তৈরি করে ফেরত পাঠিয়েছে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
"API রিচেবল নয়" শুনে সরাসরি অ্যাপ্লিকেশন কোড খোলা একটা সাধারণ ভুল। <code>curl -v</code> চালালে যদি দেখেন <code>Trying ...</code>-এর পরেই আটকে গিয়ে টাইমআউট হচ্ছে, তাহলে সমস্যাটা DNS বা TLS-এর নয় — সম্ভবত ফায়ারওয়াল বা রাউটিং। যদি TCP connect হয় কিন্তু TLS handshake-এ আটকায়, সমস্যাটা সার্টিফিকেট নিয়ে। প্রতিটা স্তর যেখানে থেমে যাচ্ছে সেটাই বলে দেয় ঠিক কোথায় তদন্ত চালাতে হবে।</div>

<h3>Firewall — Packet Filtering ও Chains</h3>
<p>ফায়ারওয়ালের মূল ধারণা সহজ — প্রতিটা প্যাকেট আসার/যাওয়ার সময় একগুচ্ছ নিয়মের বিপরীতে যাচাই করা হয়, আর প্রতিটা নিয়ম বলে দেয় প্যাকেটটার সাথে কী করতে হবে: <b>ACCEPT</b> (যেতে দাও), <b>DROP</b> (নীরবে ফেলে দাও, কোনো জবাব নেই), অথবা <b>REJECT</b> (ফেলে দাও কিন্তু প্রেরককে একটা error জানিয়ে দাও)।</p>
<p><span class="kw">iptables</span>-এ নিয়মগুলো সাজানো থাকে <span class="kw">chain</span>-এ:</p>
<table>
<tr><th>Chain</th><th>কোন ট্রাফিকের জন্য</th></tr>
<tr><td><code>INPUT</code></td><td>এই মেশিনের উদ্দেশ্যে আসা ইনকামিং ট্রাফিক</td></tr>
<tr><td><code>OUTPUT</code></td><td>এই মেশিন থেকে বের হওয়া আউটগোয়িং ট্রাফিক</td></tr>
<tr><td><code>FORWARD</code></td><td>মেশিনটা যদি রাউটার হিসেবে কাজ করে (একটা ইন্টারফেস থেকে অন্যটায় প্যাকেট পাস করে দেয়), সেই ট্রাফিক</td></tr>
</table>
<pre><span class="c"># SSH (পোর্ট ২২)-এ ইনকামিং TCP ট্রাফিক accept করো</span>
iptables -A INPUT -p tcp --dport 22 -j ACCEPT

<span class="c"># একটা নির্দিষ্ট IP থেকে সব ইনকামিং ট্রাফিক ব্লক করো</span>
iptables -A INPUT -s 203.0.113.55 -j DROP

<span class="c"># বর্তমান নিয়মগুলো লাইন নম্বরসহ দেখাও</span>
iptables -L INPUT -n --line-numbers</pre>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — order কেন গুরুত্বপূর্ণ</span>
iptables-এ একটা chain-এর নিয়মগুলো <b>ক্রমানুসারে</b>, উপর থেকে নিচে, পড়া হয় — আর প্রথম যে নিয়মটা মেলে সেটাই কার্যকর হয় (first match wins), তারপর মূল্যায়ন থেমে যায়। তাই যদি একটা "সব ব্লক করো" নিয়ম উপরে বসানো থাকে আর তার নিচে "পোর্ট ২২ allow করো" নিয়ম থাকে, তাহলে দ্বিতীয় নিয়মটা কখনোই কার্যকর হবে না — উপরেরটাই আগে মিলে যাবে। এই কারণেই নির্দিষ্ট allow-নিয়মগুলো সাধারণত সবার আগে, আর সবচেয়ে সাধারণ "বাকি সব ড্রপ করো" নিয়মটা একদম শেষে রাখা হয়।</div>
<p>আধুনিক Linux ডিস্ট্রোতে <span class="kw">nftables</span> ধীরে ধীরে <code>iptables</code>-এর জায়গা নিচ্ছে — উদ্দেশ্য একই (packet filtering, chain-ভিত্তিক নিয়ম), তবে সিনট্যাক্স ও পারফরম্যান্স উন্নত। কনসেপ্ট হিসেবে দুটোই এক জিনিস বোঝায়, তাই <code>iptables</code> বুঝলে <code>nftables</code>-এ যাওয়া সহজ।</p>

<h3>TCP বনাম UDP</h3>
<p>এই দুটো প্রোটোকল একদম ভিন্ন নীতিতে কাজ করে, আর সঠিক প্রোটোকল বেছে নেওয়াটা সরাসরি অ্যাপ্লিকেশনের আচরণে প্রভাব ফেলে।</p>
<div class="grid2">
  <div class="box"><b>TCP (connection-oriented)</b><br>কানেকশন স্থাপন করে, প্যাকেট ক্রমানুসারে ডেলিভারি নিশ্চিত করে, হারিয়ে যাওয়া প্যাকেট আবার পাঠায় (retransmit)। ব্যবহার: HTTP, SSH, ডেটাবেস কানেকশন — যেখানে ডেটা হারানো বা এলোমেলো ক্রমে আসা মেনে নেওয়া যায় না।</div>
  <div class="box"><b>UDP (connectionless)</b><br>কোনো কানেকশন স্থাপন হয় না, ডেলিভারি বা ক্রমের কোনো গ্যারান্টি নেই। ব্যবহার: DNS query, ভিডিও স্ট্রিমিং, গেমিং — যেখানে একটা হারানো প্যাকেট দেরিতে আবার পাঠানোর চেয়ে বরং একটা নতুন প্যাকেট দিয়ে replace করাটাই ভালো (যেমন ভিডিওর একটা ফ্রেম মিস হলে পরের ফ্রেমের জন্য অপেক্ষা করাই যুক্তিসঙ্গত, পুরনোটার জন্য দেরি করা নয়)।</div>
</div>
<p>আগে দেখা <code>ss -tulnp</code>-এর <code>-t</code> আর <code>-u</code> ফ্ল্যাগ ঠিক এই পার্থক্যটাই প্রতিফলিত করে — কোনো সার্ভিস TCP-তে শুনছে নাকি UDP-তে, সেটা আউটপুটের <code>Netid</code> কলামেই স্পষ্ট দেখা যায়।</p>

<h3>Troubleshooting checklist — "অ্যাপটা কানেক্ট করতে পারছে না"</h3>
<p>যখন কোনো অ্যাপ অন্য একটা host-এর সাথে কানেক্ট করতে ব্যর্থ হয়, র‍্যান্ডমভাবে জিনিস পরিবর্তন না করে এই ক্রমে তদন্ত করুন — প্রতিটা ধাপ আগেরটার একটা স্তর গভীরে যায়:</p>
<div class="card">
<ol>
<li><b>সার্ভিসটা আদৌ শুনছে কিনা</b> — টার্গেট মেশিনে <code>ss -tulnp | grep &lt;port&gt;</code> চালান। কিছু না দেখালে সমস্যাটা নেটওয়ার্কের নয়, সার্ভিসটাই চালু হয়নি বা ক্র্যাশ করেছে।</li>
<li><b>পোর্টটা আদৌ পৌঁছানো যায় কিনা</b> — <code>curl -v host:port</code> অথবা <code>nc -zv host port</code> দিয়ে চেক করুন। টাইমআউট হলে বুঝবেন মেশিন পর্যন্ত পৌঁছানোই যাচ্ছে না — রাউটিং বা নেটওয়ার্ক সমস্যা।</li>
<li><b>ফায়ারওয়াল ব্লক করছে কিনা</b> — টার্গেট মেশিনে <code>iptables -L -n --line-numbers</code> চালিয়ে দেখুন প্রাসঙ্গিক পোর্টের জন্য কোনো DROP/REJECT নিয়ম উপরে বসে আছে কিনা।</li>
<li><b>DNS ঠিকমতো resolve হচ্ছে কিনা</b> — <code>dig &lt;hostname&gt;</code> চালিয়ে নিশ্চিত করুন hostname সঠিক IP-তে resolve হচ্ছে, পুরনো বা ভুল ক্যাশ করা কোনো IP-তে নয়।</li>
</ol>
</div>
<div class="callout mistake"><span class="tag">সবচেয়ে সাধারণ ভুল ধারণা</span>
"অ্যাপটা কাজ করছে না" মানেই যে একটা অ্যাপ্লিকেশন bug, এই ধারণাটাই সবচেয়ে বেশি সময় নষ্ট করায়। বাস্তবে বেশিরভাগ সময় সমস্যাটা হয় একটা ভুল firewall rule, একটা DNS misconfiguration, অথবা প্রত্যাশিত পোর্টে আসলে কিছুই শুনছে না — এই তিনটার একটাও অ্যাপ্লিকেশনের কোডের সাথে সম্পর্কিত নয়। এই চ্যাপ্টারের টুলগুলো (<code>ss</code>, <code>dig</code>, <code>curl</code>, <code>iptables</code>) ঠিক এই কারণেই দরকার — কোড ঘাঁটার আগে প্রথমে নিশ্চিত হয়ে নেওয়া যায় ঠিক কোন স্তরটা আসলে ভাঙা, তারপরই সঠিক জায়গায় সময় দেওয়া যায়।</div>

<h3>দ্রুত রেফারেন্স</h3>
<div class="card">
<span class="badge">ss -tulnp</span><span class="badge">dig / nslookup</span><span class="badge">curl -v</span><span class="badge">nc -zv host port</span><span class="badge">iptables -L -n</span>
<p style="margin-top:10px">এই পাঁচটা কমান্ড একসাথে হাতে থাকলে বেশিরভাগ "কানেক্ট করতে পারছি না" জাতীয় সমস্যার মূল কারণ কোড না ছুঁয়েই বের করা সম্ভব।</p>
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
IP+port মিলে একটা socket তৈরি করে; <code>ss -tulnp</code> দেখায় কে শুনছে; DNS (<code>/etc/resolv.conf</code>, <code>/etc/hosts</code>, <code>dig</code>) নাম থেকে IP বের করে; <code>curl -v</code> DNS → TCP → TLS → HTTP — পুরো পথ স্তরে স্তরে যাচাই করে; আর <code>iptables</code>/<code>nftables</code> chain-ভিত্তিক নিয়ম দিয়ে ঠিক করে কোন ট্রাফিক ভেতরে ঢুকতে পারবে। এই টুলগুলো মিলিয়ে যেকোনো "কানেক্ট করতে পারছি না" সমস্যাকে একটা নির্দিষ্ট স্তরে আটকে ফেলা যায়। পরের চ্যাপ্টারে (৮. Storage ও Filesystems) নেটওয়ার্ক থেকে সরে ডিস্কের দিকে যাব — কীভাবে filesystem mount হয়, disk usage ট্র্যাক করা হয়, আর <code>/etc/fstab</code>-এ স্থায়ী mount সংজ্ঞায়িত করা হয়, তা দেখব।
</div>

<h2 class="title">৮. Storage ও Filesystems</h2>
<p class="lead">ডিস্ক-এ ফাইল রাখা মানে আসলে তিনটা আলাদা স্তর পার হয়ে যাওয়া — raw ব্লক থেকে <code>/etc/nginx/nginx.conf</code>-এর মতো একটা পথে পৌঁছানো। এই স্তরগুলো না বুঝলে <code>df</code> full দেখালে কেন <code>du</code> মেলে না, বা <code>rm</code> করার পরও ডিস্ক ফাঁকা হয় না কেন — এসব ধাঁধা মনে হবে।</p>

<h3>Block Device, Partition ও Filesystem — তিনটি আলাদা স্তর</h3>
<p>একটা ডিস্ক নিজে শুধু একগুচ্ছ raw bytes-এর সিকোয়েন্স — Linux একে <span class="kw">block device</span> হিসেবে দেখে (যেমন <code>/dev/sda</code>, পুরো ডিস্কটাই)। এই ব্লক ডিভাইসকে এক বা একাধিক <span class="kw">partition</span>-এ ভাগ করা যায় (<code>/dev/sda1</code>, <code>/dev/sda2</code>) — প্রতিটা partition ওই একই raw ডিস্কের একটা অংশ। কিন্তু partition নিজে থেকে ফাইল/ডিরেক্টরি বোঝে না — তার জন্য দরকার একটা <span class="kw">filesystem</span> (ext4, xfs, ইত্যাদি), যা সেই raw bytes-এর ওপর ফাইল, ডিরেক্টরি, permission, timestamp — সব organize করার নিয়ম বসায়।</p>
<div class="callout why"><span class="tag">তিন স্তর কেন আলাদা রাখা হয়</span>
Block device, partition আর filesystem-কে আলাদা concept হিসেবে রাখার কারণ হলো প্রতিটা স্তর স্বাধীনভাবে বদলানো যায়। একই partition-এ পুরনো filesystem মুছে নতুন filesystem বসানো যায় (<code>mkfs.ext4</code> চালালেই partition-এর ডেটা মুছে নতুন কাঠামো বসে) — partition table বদলাতে হয় না। আবার একই ডিস্ককে একাধিক partition-এ ভেঙে প্রতিটাতে আলাদা filesystem বা আলাদা OS রাখা যায়। এই বিভাজন ছাড়া "শুধু filesystem বদলাবো" করতে পুরো ডিস্ক নতুন করে সাজাতে হতো।</div>
<pre><span class="c">$ lsblk</span>
NAME    MAJ:MIN RM   SIZE RO TYPE MOUNTPOINT
sda       8:0    0    40G  0 disk
├─sda1    8:1    0     1G  0 part /boot
├─sda2    8:2    0    37G  0 part /
└─sda3    8:3    0     2G  0 part [SWAP]
sdb       8:16   0   100G  0 disk
└─sdb1    8:17   0   100G  0 part /mnt/data</pre>
<p>এই গাছ পড়ার নিয়ম: <code>sda</code> হলো block device (পুরো disk) — তার নিচে <code>sda1</code>, <code>sda2</code>, <code>sda3</code> হলো partition। <code>TYPE</code> কলাম <code>disk</code> বনাম <code>part</code> দেখায়, আর <code>MOUNTPOINT</code> কলাম বলে কোন partition কোন directory-তে attach করা (নিচে <span class="kw">mounting</span> সেকশনে বিস্তারিত)। <code>sdb</code> সম্পূর্ণ আলাদা একটা physical disk — cloud VM-এ এটা প্রায়ই একটা আলাদা attached data volume হয়।</p>

<h4>Filesystem-এর ধরন</h4>
<table>
<tr><th>Filesystem</th><th>বৈশিষ্ট্য / typical ব্যবহার</th></tr>
<tr><td><span class="kw">ext4</span></td><td>Linux-এর সবচেয়ে সাধারণ default — পরিণত, স্থিতিশীল, journaling সহ; বেশিরভাগ Ubuntu/Debian server-এর root filesystem</td></tr>
<tr><td><span class="kw">xfs</span></td><td>বড় ফাইল ও উচ্চ-throughput workload-এ শক্তিশালী (parallel I/O ভালো সামলায়); RHEL/CentOS-এর default, database/log-heavy সার্ভারে জনপ্রিয়</td></tr>
<tr><td><span class="kw">btrfs</span></td><td>বিল্ট-ইন snapshot, checksum, ও copy-on-write সমর্থন করে — কিন্তু ext4/xfs-এর চেয়ে কম battle-tested প্রোডাকশনে</td></tr>
</table>

<h3>Partition তৈরি করা — <code>fdisk</code> ও <code>parted</code></h3>
<p>একটা নতুন disk attach করার পর সেটা partition করতে দুটো প্রধান টুল আছে। <span class="kw">fdisk</span> ইন্টারঅ্যাকটিভ, menu-চালিত — ছোট, GPT/MBR উভয় সমর্থন করে আধুনিক সংস্করণে। <span class="kw">parted</span> স্ক্রিপ্টেবল ও বড় (২TB+) ডিস্ক/GPT-এর জন্য বেশি স্বাভাবিক পছন্দ।</p>
<pre><span class="c">$ sudo fdisk /dev/sdb</span>
Command (m for help): n        <span class="c"># নতুন partition</span>
Partition type: p              <span class="c"># primary</span>
Partition number: 1
First sector: (enter চাপলে default)
Last sector: +50G              <span class="c"># সাইজ নির্দিষ্ট করে দেওয়া</span>
Command (m for help): w        <span class="c"># write — এখানেই আসল পরিবর্তন ডিস্কে লেখা হয়</span>

<span class="c">$ sudo parted /dev/sdb --script mklabel gpt mkpart primary ext4 0% 100%</span>
<span class="c"># parted-এ একই কাজ non-interactive script হিসেবে — automation/Ansible-এ এই ফর্মই বেশি ব্যবহৃত</span></pre>
<div class="callout mistake"><span class="tag">সবচেয়ে বিপজ্জনক ভুল — ভুল disk-এ partition করা</span>
<code>fdisk</code>/<code>parted</code> সরাসরি raw disk-এর partition table-এ লেখে — <code>w</code> (write) কমান্ড চালানোর পর সেই ডিস্কের আগের partition table মুছে যায়, কোনো নিশ্চিতকরণ ছাড়াই। <code>/dev/sdb</code>-এর বদলে ভুল করে <code>/dev/sda</code> (root disk) লিখলে পুরো running system-এর partition table নষ্ট হতে পারে। প্রতিবার চালানোর আগে <code>lsblk</code>/<code>fdisk -l</code> দিয়ে ডাবল-চেক করা আবশ্যক — কোন disk-এ root (<code>/</code>) mount করা আছে সেটা নিশ্চিত হয়ে তবেই এগোনো উচিত।</div>

<h3>Filesystem তৈরি করা — <code>mkfs</code></h3>
<p>Partition তৈরি হওয়ার পর সেটা এখনো খালি raw space — একটা filesystem "স্ট্যাম্প" না করা পর্যন্ত ব্যবহারযোগ্য নয়। এই কাজটাই করে <span class="kw">mkfs</span> পরিবার।</p>
<pre><span class="c">$ sudo mkfs.ext4 /dev/sdb1     </span><span class="c"># ext4 filesystem তৈরি — এই partition-এর আগের যেকোনো ডেটা মুছে যায়</span>
<span class="c">$ sudo mkfs.xfs -f /dev/sdb1   </span><span class="c"># xfs — আগে থেকে filesystem থাকলে -f (force) দিয়ে overwrite নিশ্চিত করতে হয়</span></pre>
<p>এরপরই আগে দেখা <code>mount</code>/<code>/etc/fstab</code> প্রক্রিয়া দিয়ে সেটাকে ডিরেক্টরি tree-তে যুক্ত করা যায়।</p>

<h3>Swap Space তৈরি ও পরিচালনা</h3>
<p>Swap হলো disk-এর একটা অংশ যা RAM ভরে গেলে kernel সাময়িকভাবে কম-ব্যবহৃত মেমরি পেজ সেখানে সরিয়ে রাখে — একটা dedicated partition দিয়ে, অথবা cloud VM-এ প্রায়ই একটা সাধারণ <b>swapfile</b> দিয়ে বানানো হয় (disk পুনরায় partition করা যেখানে ঝামেলার)।</p>
<pre><span class="c"># dedicated swap partition</span>
$ sudo mkswap /dev/sdb2
$ sudo swapon /dev/sdb2

<span class="c"># অথবা একটা সাধারণ ফাইল দিয়ে swap (cloud VM-এ সাধারণ পদ্ধতি)</span>
$ sudo fallocate -l 4G /swapfile
$ sudo chmod 600 /swapfile      <span class="c"># শুধু root পড়তে/লিখতে পারবে — এতে মেমরির sensitive ডেটা swap-এ safe থাকে</span>
$ sudo mkswap /swapfile
$ sudo swapon /swapfile

<span class="c"># স্থায়ী করতে /etc/fstab-এ যোগ করা</span>
$ echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab</pre>
<div class="callout why"><span class="tag"><code>swappiness</code> — কতটা আগ্রহ নিয়ে kernel swap করবে</span>
<code>vm.swappiness</code> (০–১০০, sysctl দিয়ে নিয়ন্ত্রিত) নির্ধারণ করে RAM ফাঁকা থাকা সত্ত্বেও kernel কতটা আগ্রহ নিয়ে পেজ swap-এ পাঠাবে — ডিফল্ট প্রায়ই ৬০। ডাটাবেস/latency-sensitive সার্ভারে এই মান কম (১০ বা তারও কম) রাখা প্রচলিত, যাতে RAM যথেষ্ট থাকা অবস্থায়ও kernel অকারণে ডিস্ক-এ swap করে latency spike না বাড়ায়। Swap সম্পূর্ণ বন্ধ করা (<code>0</code>) সবসময় নিরাপদ নয় — হঠাৎ মেমরি চাপে OOM killer আরও আক্রমণাত্মকভাবে process মারতে পারে।</div>

<h3>Inode — ফাইলের আসল পরিচয়পত্র, নাম নয়</h3>
<p>একটা সাধারণ ভুল ধারণা হলো ফাইলের নাম-ই ফাইলের পরিচয়। বাস্তবে filesystem একটা ফাইলের সব metadata (permission, owner, size, timestamp, আর ডেটা কোন disk block-এ আছে তার pointer) রাখে একটা <span class="kw">inode</span>-এ — কিন্তু inode-এর ভেতরে ফাইলের <b>নাম থাকে না</b>। নাম থাকে ডিরেক্টরির ভেতরে, যেটা আসলে একটা mapping টেবিল: filename → inode number।</p>
<pre><span class="c">$ ls -i notes.txt</span>
1548293 notes.txt</pre>
<div class="callout why"><span class="tag">নাম আর inode আলাদা কেন গুরুত্বপূর্ণ</span>
এই বিভাজনটাই ব্যাখ্যা করে তিনটা জিনিস: (১) <code>ls -i</code> কেন একটা inode number দেখায় — কারণ সেটাই ফাইলের আসল identity, নাম শুধু একটা label। (২) একই ফাইলের একাধিক নাম (hard link) কীভাবে সম্ভব — কারণ দুইটা ভিন্ন directory entry একই inode-কে point করতে পারে। (৩) কেন <code>df -h</code>-এ ফাঁকা বাইট দেখলেও নতুন ফাইল তৈরি করতে ব্যর্থ হতে পারেন — inode নিজেও একটা সসীম resource, প্রতিটা নতুন ফাইলের জন্য একটা নতুন inode লাগে।</div>
<pre><span class="c">$ df -i /</span>
Filesystem       Inodes   IUsed    IFree IUse% Mounted on
/dev/sda2       2400000 2398210     1790   100% /</pre>
<p>এখানে <code>df -h /</code> হয়তো বলবে "১৫% ব্যবহৃত" — কিন্তু <code>df -i</code> আলাদাভাবে দেখাচ্ছে inode প্রায় শেষ। এটা সাধারণত ঘটে যখন filesystem-এ লক্ষ লক্ষ ছোট ফাইল জমে (যেমন session cache ফাইল, বা mail queue-এর প্রতিটা মেইল আলাদা ফাইল) — প্রতিটা ফাইল সাইজে ছোট হলেও একটা করে inode গ্রাস করে।</p>

<h3>Hard Link বনাম Symbolic Link</h3>
<p><span class="kw">Hard link</span> মানে একই inode-কে point করা আরেকটা directory entry — অর্থাৎ একই ফাইলের দ্বিতীয় নাম, "কপি" নয়। <span class="kw">Symbolic link (symlink)</span> সম্পূর্ণ ভিন্ন জিনিস — এটা নিজেই একটা আলাদা, ছোট ফাইল যার ভেতরে শুধু একটা path string লেখা থাকে (টার্গেট ফাইলের ঠিকানা)।</p>
<pre><span class="c">$ echo "hello" &gt; file.txt</span>
<span class="c">$ ln file.txt hardlink.txt        </span><span class="c"># hard link — নতুন নাম, একই inode</span>
<span class="c">$ ln -s file.txt symlink.txt      </span><span class="c"># symlink — path-ভিত্তিক আলাদা ফাইল</span>
<span class="c">$ ls -li</span>
1548301 -rw-r--r-- 2 rasel rasel  6 Jul 17 10:00 file.txt
1548301 -rw-r--r-- 2 rasel rasel  6 Jul 17 10:00 hardlink.txt
1548305 lrwxrwxrwx 1 rasel rasel  8 Jul 17 10:00 symlink.txt -> file.txt</pre>
<p>লক্ষ করুন: <code>file.txt</code> আর <code>hardlink.txt</code>-এর inode number (<code>1548301</code>) একই, আর link count (<code>-rw-r--r--</code>-এর পরের কলাম) <code>2</code> — কারণ একই inode-কে দুইটা নাম point করছে। <code>symlink.txt</code>-এর inode সম্পূর্ণ ভিন্ন (<code>1548305</code>), আর তার permission-এর শুরুতে <code>l</code> — এটা নিজেই একটা "path বহনকারী" ফাইল।</p>
<div class="callout behind"><span class="tag">মুছে ফেললে কী হয় — link count-এর আসল ভূমিকা</span>
<code>rm file.txt</code> চালালে ফাইলের ডেটা মুছে যায় না যদি <code>hardlink.txt</code> এখনো থাকে — কারণ inode-এর ভেতরে একটা link count থাকে, <code>rm</code> শুধু ওই count এক কমায় ও ওই নির্দিষ্ট directory entry মুছে দেয়। Count শূন্যে না নামা পর্যন্ত (আর কোনো process ফাইলটা খোলা না থাকা পর্যন্ত) inode ও তার data block আসলে মুক্ত হয় না। উল্টোদিকে <code>symlink.txt</code>-এর টার্গেট (<code>file.txt</code>) মুছে ফেললে symlink ভেঙে যায় ("dangling symlink") — কারণ সেটা শুধু একটা path string ধরে রাখে, ফাইল সরে গেলে/মুছে গেলে সেই path আর বৈধ থাকে না। আর যেহেতু inode number শুধু <b>একটা filesystem-এর ভেতরেই ইউনিক</b>, hard link দুইটা আলাদা filesystem/partition জুড়ে কাজ করতে পারে না — symlink পারে, কারণ সে শুধু path মনে রাখে, inode নয়।</div>

<h3>Mounting — Filesystem-কে ডিরেক্টরি গাছে যুক্ত করা</h3>
<p>একটা partition-এ filesystem ফরম্যাট করা থাকলেই সেটা ব্যবহারযোগ্য হয়ে যায় না — সেটাকে ডিরেক্টরি tree-এর কোনো একটা বিন্দুতে <span class="kw">mount</span> করতে হয়, যাকে বলে <span class="kw">mount point</span>। Mount করার আগ পর্যন্ত সেই filesystem-এর ভেতরের কোনো ফাইল কোনো path দিয়ে দেখাই যায় না।</p>
<pre><span class="c">$ mount /dev/sdb1 /mnt/data     </span><span class="c"># sdb1-এর filesystem-কে /mnt/data-তে attach করা</span>
<span class="c">$ ls /mnt/data                  </span><span class="c"># এখন sdb1-এর ভেতরের ফাইল এখানে দেখা যাবে</span>
<span class="c">$ umount /mnt/data              </span><span class="c"># detach — ফাইলগুলো disk-এই থাকে, শুধু tree থেকে বিচ্ছিন্ন হয়</span></pre>
<p>এই <code>mount</code> command রিবুট হলে হারিয়ে যায় — পরের বুটে আবার হাতে চালাতে হবে, যদি না সেটা <code>/etc/fstab</code>-এ লেখা থাকে। <code>/etc/fstab</code>-ই সেই কনফিগ ফাইল যা বলে দেয় বুট হওয়ার সময় কোন device কোথায় স্বয়ংক্রিয়ভাবে mount হবে।</p>
<pre><span class="c">UUID=3a1f9e2c-...   /mnt/data   ext4   defaults,noatime   0   2</span></pre>
<table>
<tr><th>ফিল্ড</th><th>মানে</th></tr>
<tr><td><code>UUID=3a1f9e2c-...</code></td><td>ডিভাইস চেনার উপায় — <code>/dev/sdb1</code>-এর বদলে UUID ব্যবহার করা ভালো, কারণ disk যোগ/বিয়োগ হলে device নাম বদলে যেতে পারে কিন্তু UUID অপরিবর্তিত থাকে</td></tr>
<tr><td><code>/mnt/data</code></td><td>mount point — কোথায় attach হবে</td></tr>
<tr><td><code>ext4</code></td><td>filesystem type</td></tr>
<tr><td><code>defaults,noatime</code></td><td>mount option — <code>noatime</code> মানে প্রতিবার read-এ access-time আপডেট না করা (performance বাঁচায়)</td></tr>
<tr><td><code>0</code></td><td>dump utility ফ্ল্যাগ (আধুনিক সিস্টেমে প্রায় সবসময় ০, ব্যবহৃত হয় না)</td></tr>
<tr><td><code>2</code></td><td>বুট-টাইম <code>fsck</code> চেক-এর ক্রম (root filesystem <code>1</code>, বাকিগুলো <code>2</code>, <code>0</code> মানে চেক করা হবে না)</td></tr>
</table>

<h3><code>df -h</code> বনাম <code>du -sh</code> — আর "মুছেও জায়গা ফেরত না পাওয়া"-র ধাঁধা</h3>
<p><span class="kw">df</span> (disk free) পুরো filesystem-এর সামগ্রিক ব্যবহার দেখায় — kernel-এর কাছে filesystem-level হিসাব। <span class="kw">du</span> (disk usage) একটা নির্দিষ্ট directory tree ঘুরে ঘুরে ফাইলগুলোর সাইজ যোগ করে হিসাব বের করে।</p>
<pre><span class="c">$ df -h /var
Filesystem      Size  Used Avail Use% Mounted on
/dev/sda2        37G   35G  1.2G   97% /
$ du -sh /var/log
1.1G    /var/log</span></pre>
<div class="callout mistake"><span class="tag">df full, কিন্তু du-তে হিসাব মেলে না</span>
ক্লাসিক পরিস্থিতি: <code>df -h</code> বলছে filesystem প্রায় full, কিন্তু <code>du -sh</code> দিয়ে চোখে-দেখা সব ফাইল/ফোল্ডার যোগ করলে সেই সাইজ মেলে না। সবচেয়ে সাধারণ কারণ — কোনো process এখনো একটা <b>মুছে ফেলা (unlinked) ফাইলের file descriptor</b> খোলা রেখেছে। <code>rm</code> করলে directory entry মুছে যায় (তাই <code>du</code>/<code>ls</code>-এ আর দেখা যায় না), কিন্তু inode-এর data block তখনই মুক্ত হয় না যতক্ষণ না সেটাকে ধরে রাখা প্রতিটা file descriptor বন্ধ হয় — সাধারণত একটা লম্বা সময় ধরে চলা log-writing প্রসেস যার log file আপনি ভুলে (বা ইচ্ছাকৃতভাবে) মুছে ফেলেছেন, কিন্তু প্রসেসটা এখনো সেই একই fd-তে লিখেই যাচ্ছে।</div>
<pre><span class="c">$ lsof | grep deleted</span>
nginx     2311  www-data  13w   REG  8,2  2147483648  1548210 /var/log/nginx/access.log (deleted)</pre>
<p>এখানে <code>lsof</code>-এর আউটপুট স্পষ্ট বলছে — PID <code>2311</code> (nginx) এখনো ২GB সাইজের একটা মুছে ফেলা <code>access.log</code>-এর দিকে file descriptor <code>13</code> ধরে রেখেছে। যতক্ষণ এই process বন্ধ না হয় বা সেই fd close না করে, ততক্ষণ ওই ২GB disk-এ আটকে থাকবে — <code>df</code>-এ ধরা পড়বে, কিন্তু কোনো <code>ls</code>/<code>du</code>-তে দেখাবে না, কারণ ফাইলের নামটাই আর ডিরেক্টরিতে নেই।</p>
<div class="callout best"><span class="tag">সমাধান — মুছে ফেলার বদলে truncate করুন</span>
বড় log file নিয়ন্ত্রণে আনতে <code>rm</code> না করে সরাসরি খালি করে দিন, যদি জানেন কোনো process সেটা এখনো লিখছে:
<pre>truncate -s 0 /var/log/nginx/access.log
<span class="c"># অথবা</span>
&gt; /var/log/nginx/access.log</pre>
এতে একই inode আর একই file descriptor বহাল থাকে (process নতুন করে ফাইল খুলতে হয় না), শুধু তার ভেতরের content সাথে সাথে সাইজ ০-তে নেমে আসে — disk space তৎক্ষণাৎ ফেরত পাওয়া যায়। যদি ফাইলটা <code>rm</code> করেই ফেলেন, একমাত্র উপায় হলো process restart করা (বা সেই fd বন্ধ করানো) যাতে kernel অবশেষে block-গুলো free করে।</div>

<h3>LVM — Logical Volume Manager: নমনীয় স্টোরেজের অতিরিক্ত স্তর</h3>
<p>সরাসরি partition ব্যবহারের সমস্যা হলো একবার তৈরি হয়ে গেলে সাইজ বদলানো কষ্টকর, বিশেষত ছোট করা বা একাধিক ডিস্ক জুড়ে একটাকে বড় করা। <span class="kw">LVM</span> partition আর filesystem-এর মাঝে একটা নমনীয় স্তর যোগ করে, তিনটা concept দিয়ে:</p>
<table>
<tr><th>Layer</th><th>ভূমিকা</th></tr>
<tr><td><span class="kw">Physical Volume (PV)</span></td><td>আসল disk/partition (যেমন <code>/dev/sdb1</code>) — LVM-এর কাছে এটা raw উপাদান</td></tr>
<tr><td><span class="kw">Volume Group (VG)</span></td><td>একাধিক PV একসাথে জুড়ে বানানো একটা storage pool — এক বা একাধিক physical disk জুড়েও হতে পারে</td></tr>
<tr><td><span class="kw">Logical Volume (LV)</span></td><td>VG থেকে কেটে নেওয়া একটা "ভার্চুয়াল partition" — এর ওপরেই আসল filesystem (ext4/xfs) বসে</td></tr>
</table>
<div class="callout why"><span class="tag">এত স্তর কেন — মূল সুবিধা হলো resize</span>
সরাসরি partition-এ filesystem বসালে সেটা বড় করতে পাশে ফাঁকা contiguous জায়গা লাগে, যা সবসময় থাকে না। LVM-এ একটা LV-কে বড় করতে শুধু তার VG-তে জায়গা থাকলেই চলে — সেই জায়গা যেকোনো PV থেকে আসতে পারে, এমনকি নতুন করে যোগ করা একটা নতুন disk থেকেও। এই কারণেই cloud/VM পরিবেশে LVM এত দরকারি: একটা নতুন disk attach করে সেটাকে বিদ্যমান VG-তে যোগ করে দিলেই, downtime ছাড়া চলমান LV বড় করা যায় — বাস্তব disk-এর সীমানা user-এর কাছে অদৃশ্য হয়ে যায়।</div>

<h3>Resize করা — শুধু Partition/LV বড় করলেই যথেষ্ট নয়</h3>
<p>একটা সাধারণ ভুল ধারণা হলো underlying block device বড় করলেই filesystem নিজে থেকে সেই নতুন জায়গা ব্যবহার শুরু করবে। বাস্তবে <b>দুই ধাপে</b> কাজ করতে হয় — প্রথমে block-level (partition/LV) বড় করা, তারপর আলাদাভাবে filesystem-কে বলা "এখন আরও জায়গা আছে, নিজেকে বড় করো"।</p>
<pre><span class="c"># ধাপ ১ — LV বড় করা (LVM ব্যবহার করলে)</span>
$ sudo lvextend -L +20G /dev/myvg/mylv

<span class="c"># cloud VM-এ underlying cloud disk resize করার পর partition table-কেও জানাতে হয়</span>
$ sudo growpart /dev/sda 1        <span class="c"># /dev/sda1 partition-কে ডিস্কের নতুন পুরো জায়গা পর্যন্ত বড় করা</span>

<span class="c"># ধাপ ২ — filesystem-কে বড় জায়গা ব্যবহার করতে বলা (filesystem type অনুযায়ী আলাদা কমান্ড)</span>
$ sudo resize2fs /dev/myvg/mylv   <span class="c"># ext4-এর জন্য</span>
$ sudo xfs_growfs /               <span class="c"># xfs-এর জন্য — mount point দিয়ে চালাতে হয়, device path দিয়ে নয়</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — শুধু <code>lvextend</code>/<code>growpart</code> চালিয়ে থেমে যাওয়া</span>
<code>lvextend</code> বা cloud provider-এর ডিস্ক resize UI দিয়ে underlying device বড় করার পর <code>df -h</code>-এ সাইজ না বদলালে অনেকে ধরে নেন resize ব্যর্থ হয়েছে। আসলে দ্বিতীয় ধাপ (<code>resize2fs</code>/<code>xfs_growfs</code>) বাদ পড়েছে — filesystem-এর নিজস্ব metadata-তে এখনো পুরনো সাইজ লেখা আছে, নতুন block পাওয়া গেলেও filesystem নিজে থেকে তা "দাবি" করে না যতক্ষণ না স্পষ্টভাবে বলা হয়। উল্টো দিকে ছোট করা (shrink) আরও ঝুঁকিপূর্ণ — <code>ext4</code> shrink করা যায় (আগে <code>resize2fs</code> ছোট, পরে <code>lvreduce</code>), কিন্তু <code>xfs</code> shrink করা যায়ই না — শুধু বড় করা যায়, তাই xfs partition ছোট করতে চাইলে নতুন করে backup/restore ছাড়া উপায় নেই।</div>

<h3>RAID — একাধিক Disk জুড়ে Redundancy/Performance</h3>
<p><span class="kw">RAID</span> (<code>mdadm</code> দিয়ে software RAID) একাধিক physical disk-কে একসাথে একটা logical device হিসেবে দেখায় — উদ্দেশ্য redundancy (একটা disk মরলেও ডেটা বাঁচা) বা performance (parallel read/write), অথবা দুটোই।</p>
<table>
<tr><th>RAID Level</th><th>ধারণা</th><th>Trade-off</th></tr>
<tr><td>RAID 0</td><td>ডেটা সব disk জুড়ে striping — কোনো redundancy নেই</td><td>সর্বোচ্চ speed, কিন্তু একটা disk মরলে সব ডেটা হারায়</td></tr>
<tr><td>RAID 1</td><td>Mirroring — প্রতিটা disk-এ হুবহু একই ডেটা</td><td>একটা disk মরলেও ডেটা অক্ষত, কিন্তু usable space অর্ধেক</td></tr>
<tr><td>RAID 10</td><td>Mirror + Stripe-এর সমন্বয় (কমপক্ষে ৪টা disk)</td><td>speed ও redundancy দুটোই, কিন্তু বেশি disk লাগে</td></tr>
</table>
<div class="callout why"><span class="tag">Cloud-এ RAID-এর ভূমিকা বদলে গেছে</span>
Cloud environment-এ (AWS EBS, Azure Managed Disk) underlying storage ইতিমধ্যে provider-side redundancy সহ আসে — তাই redundancy-এর জন্য RAID 1 বসানো প্রায়ই অপ্রয়োজনীয় বাড়তি জটিলতা। তবে অনেক ছোট disk জুড়ে একটাতে বেশি throughput/IOPS পাওয়ার জন্য RAID 0 এখনো ব্যবহৃত হয় — শুধু মনে রাখতে হবে RAID 0-এ redundancy শূন্য, তাই backup আলাদাভাবে অপরিহার্য।</div>

<h3>Disk Encryption — LUKS</h3>
<p>Compliance বা sensitive ডেটার জন্য disk-at-rest encryption দরকার হলে <span class="kw">LUKS</span> (Linux Unified Key Setup, <code>cryptsetup</code> দিয়ে ব্যবহৃত) হলো standard পদ্ধতি — একটা partition/LV-কে পুরোপুরি এনক্রিপ্ট করে, তার ওপর filesystem বসানো হয়।</p>
<pre><span class="c">$ sudo cryptsetup luksFormat /dev/sdb1     </span><span class="c"># পাসফ্রেজ সেট করে partition এনক্রিপ্ট করা</span>
$ sudo cryptsetup luksOpen /dev/sdb1 secure_data  <span class="c"># unlock করে /dev/mapper/secure_data হিসেবে expose</span>
$ sudo mkfs.ext4 /dev/mapper/secure_data   <span class="c"># unlocked ম্যাপিং-এর ওপর সাধারণ filesystem</span>
$ sudo mount /dev/mapper/secure_data /mnt/secure</pre>
<div class="callout best"><span class="tag">Best practice — key management বাস্তব চ্যালেঞ্জ</span>
LUKS নিজে শক্তিশালী, কিন্তু আসল জটিলতা key management-এ — boot-এ যদি প্রতিবার হাতে পাসফ্রেজ দিতে হয়, unattended reboot (যেমন cloud auto-scaling) কাজ করবে না। প্রোডাকশনে তাই প্রায়ই একটা keyfile (নিজেই root-only permission দিয়ে সুরক্ষিত, বা একটা external secret manager/TPM-এ রাখা) ব্যবহার করা হয় যাতে boot স্বয়ংক্রিয় থাকে, অথবা cloud provider-এর নিজস্ব managed disk encryption (যা key management আলাদাভাবে সামলায়) বেছে নেওয়া হয়।</div>

<h3>পুরো পথ — Raw Disk থেকে User-এর দেখা File Path</h3>
<div class="diagram"><pre>
 Block Device            Partition          (ঐচ্ছিক) LVM স্তর            Filesystem        Mount Point
 ┌─────────────┐      ┌─────────────┐      ┌───────┐ ┌──────┐ ┌──────┐   ┌───────────┐     ┌───────────────┐
 │  /dev/sdb   │ ───▶ │  /dev/sdb1  │ ───▶ │  PV   │▶│  VG  │▶│  LV  │──▶│ ext4/xfs  │ ──▶ │  /mnt/data     │
 │ (পুরো disk) │      │ (একটা অংশ)  │      └───────┘ └──────┘ └──────┘   │ (organize │     │  (user এখানে  │
 └─────────────┘      └─────────────┘      একাধিক disk এখানে pool হতে   │  করার নিয়ম)│     │   ফাইল দেখেন) │
                                            পারে, resize-friendly        └───────────┘     └───────────────┘
</pre></div>
<p>LVM ছাড়া সরাসরি পথ: partition → filesystem → mount point। LVM থাকলে partition-কে PV বানিয়ে, একাধিক PV-কে VG-তে পুল করে, VG থেকে LV কেটে, সেই LV-এর ওপর filesystem বসিয়ে, সবশেষে সেটাকে একটা mount point-এ জোড়া হয় — user শুধু শেষ ফলাফল, একটা সাধারণ file path দেখেন।</p>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
Storage-এর হায়ারার্কি মনে রাখুন: block device → partition (<code>fdisk</code>/<code>parted</code> দিয়ে তৈরি) → (ঐচ্ছিক LVM: PV → VG → LV, বা RAID: <code>mdadm</code>) → filesystem (<code>mkfs</code> দিয়ে স্ট্যাম্প করা, ঐচ্ছিকভাবে LUKS দিয়ে এনক্রিপ্টেড) → mount point। Inode-ই ফাইলের আসল পরিচয় (নাম নয়), তাই hard link সম্ভব আর inode ফুরিয়ে গেলেও "no space" এরর আসতে পারে। <code>df -h</code> সামগ্রিক filesystem ব্যবহার দেখায়, <code>du -sh</code> নির্দিষ্ট ডিরেক্টরি — আর দুটো না মিললে <code>lsof | grep deleted</code> দিয়ে "খোলা রাখা মুছে ফেলা ফাইল" খুঁজুন। Resize করার সময় মনে রাখবেন block-level বড় করা (<code>lvextend</code>/<code>growpart</code>) আর filesystem-level বড় করা (<code>resize2fs</code>/<code>xfs_growfs</code>) — দুটো আলাদা ধাপ। পরের চ্যাপ্টারে (৯. systemd ও Service Management) দেখব কীভাবে Linux-এ প্রতিটা service বুট হওয়া থেকে চলতে থাকা পর্যন্ত পরিচালিত হয় — <code>systemctl</code>, unit file, আর dependency-চালিত startup order — যেখানে একটা service কীভাবে তার log/data file (এই চ্যাপ্টারেরই বিষয়) খোলা-বন্ধ করে তাও প্রাসঙ্গিক হয়ে উঠবে।</div>

<h2 class="title">৯. systemd ও Service Management</h2>
<p class="lead">৩ নম্বর চ্যাপ্টারে (Process Management) আমরা দেখেছিলাম প্রতিটা process-এর একটা parent থাকে, আর সবচেয়ে উপরে বসে থাকে <span class="kw">PID 1</span> — kernel বুট হওয়ার পর যে প্রথম process spawn হয়, এবং orphan হয়ে যাওয়া প্রতিটা process যার কাছে reparent হয়। আধুনিক প্রায় সব mainstream distro-তে (Ubuntu, Debian, Fedora, RHEL, Arch) এই PID 1-এর আসনে বসে থাকে <span class="kw">systemd</span>। এই চ্যাপ্টারে আমরা দেখব systemd আসলে কী কী দায়িত্ব পালন করে, কীভাবে একটা service define করে production-এ চালাতে হয় (বিশেষত ASP.NET Core-এর মতো long-running app), এবং যখন সেই service ক্র্যাশ করে তখন কীভাবে দ্রুত root cause খুঁজে বের করতে হয়।</p>

<h3>১. systemd — PID 1 হিসেবে ঠিক কী করে</h3>
<p>পুরনো দিনের <b>SysV init</b>-এ boot মানে ছিল একগুচ্ছ shell script একের পর এক, সিরিয়ালি চালানো — script #৫ শেষ না হওয়া পর্যন্ত script #৬ শুরু হতো না, যদিও তাদের মধ্যে আসল কোনো নির্ভরতা নাও থাকতে পারত। এতে boot ধীর হতো, আর "কোন service কোনটার আগে দরকার" — এই সম্পর্ক কোথাও স্পষ্টভাবে ঘোষিত থাকত না, লুকিয়ে থাকত script-এর ক্রম-সংখ্যায় (<code>S10networking</code>, <code>S20ssh</code>)।</p>
<p>systemd এই মডেল উল্টে দেয়: প্রতিটা service/mount/socket-কে একটা declarative <span class="kw">unit</span> ফাইলে বর্ণনা করা হয়, যেখানে বলা থাকে তার dependency ও ordering কী — আর systemd নিজে একটা dependency graph বানিয়ে যতটা সম্ভব <b>সমান্তরালে</b> সবকিছু start করে। ফলাফল: দ্রুত বুট, এবং "কেন X সার্ভিস Y-এর আগে দরকার" প্রশ্নের একটা স্পষ্ট, machine-readable উত্তর।</p>
<div class="callout behind"><span class="tag">PID 1-এর বাড়তি দায়িত্ব — Zombie Reaping</span>
৩ নম্বর চ্যাপ্টারে zombie process নিয়ে যে আলোচনা হয়েছিল তার একটা অংশ এখানে আবার আসে — কোনো process-এর parent যদি আগেই মারা যায়, সেই process <b>orphan</b> হয়ে যায় এবং kernel তাকে reparent করে PID 1-এর কাছে। systemd তখন সেই child-দের exit status <code>wait()</code> করে সংগ্রহ করে নেয়, যাতে তারা zombie হয়ে টেবিলে জমে না থাকে। তাই PID 1 শুধু "প্রথম process" নয় — গোটা সিস্টেমের জীবনকালব্যাপী এই cleanup দায়িত্বও তার।</div>

<h3>২. Unit — systemd যা কিছু ম্যানেজ করে তার মৌলিক একক</h3>
<p>systemd-তে সবকিছুই একটা <span class="kw">unit</span> — একটা ফাইল যা বলে দেয় "এই জিনিসটা কী, কীভাবে চালু/বন্ধ হয়, কীসের সাথে সম্পর্কিত"। ফাইলের extension দিয়েই unit-এর ধরন বোঝা যায়:</p>
<table>
<tr><th>Unit টাইপ</th><th>কী represent করে</th></tr>
<tr><td><span class="kw">.service</span></td><td>একটা daemon/প্রোগ্রাম — যেমন <code>nginx.service</code>, <code>sshd.service</code>, আপনার নিজের <code>myapi.service</code>। এই চ্যাপ্টারের মূল ফোকাস।</td></tr>
<tr><td><span class="kw">.socket</span></td><td>একটা network/Unix socket যা systemd আগে থেকে তৈরি করে রাখে — প্রথম connection আসার আগ পর্যন্ত আসল service-টা শুরুই হয় না (<b>socket activation</b>); এতে boot-এ কম সার্ভিস সক্রিয়ভাবে চলে।</td></tr>
<tr><td><span class="kw">.timer</span></td><td>নির্দিষ্ট সময়ে বা periodic interval-এ একটা unit trigger করে — <code>cron</code>-এর systemd-নেটিভ বিকল্প; বিস্তারিত ১৪ নম্বর চ্যাপ্টারে (Automation)।</td></tr>
<tr><td><span class="kw">.mount</span></td><td>একটা filesystem mount point-কে unit হিসেবে ট্র্যাক করে (৮ নম্বর চ্যাপ্টারের <code>/etc/fstab</code>-এর সাথে সম্পর্কিত) — অন্য service <code>RequiresMountsFor=</code> দিয়ে এর ওপর নির্ভর করতে পারে।</td></tr>
<tr><td><span class="kw">.target</span></td><td>কোনো প্রকৃত process না — শুধু একগুচ্ছ unit-কে গ্রুপ করার একটা সিঙ্ক্রোনাইজেশন পয়েন্ট। বিস্তারিত ৭ নম্বর সেকশনে।</td></tr>
</table>

<h3>৩. একটা বাস্তব <code>.service</code> ইউনিট ফাইল — ASP.NET Core app</h3>
<p>ধরুন <code>/var/www/myapi</code>-তে একটা publish করা ASP.NET Core app আছে, আর সেটাকে boot-এর সাথে সাথে চালু হওয়া, ক্র্যাশ করলে নিজে থেকে restart হওয়া একটা production service বানাতে চান। unit ফাইলটা যাবে <code>/etc/systemd/system/myapi.service</code>-এ:</p>
<pre><span class="c"># /etc/systemd/system/myapi.service</span>
[Unit]
Description=My ASP.NET Core Web API
After=network.target
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Type=notify
WorkingDirectory=/var/www/myapi
ExecStart=/usr/bin/dotnet /var/www/myapi/MyApi.dll
Restart=on-failure
RestartSec=5
User=myapi
Environment=ASPNETCORE_ENVIRONMENT=Production
Environment=ASPNETCORE_URLS=http://localhost:5000
KillSignal=SIGINT
SyslogIdentifier=myapi

[Install]
WantedBy=multi-user.target</pre>
<p>লাইনে লাইনে ভেঙে দেখা যাক:</p>
<ul>
<li><code>[Unit]</code> — মেটাডেটা ও ordering। <code>Description</code> শুধু <code>systemctl status</code>-এ দেখানোর জন্য মানুষ-পঠিত লেখা। <code>StartLimitIntervalSec</code>/<code>StartLimitBurst</code> restart-কে থ্রটল করার সীমা (৫ নম্বর সেকশনে বিস্তারিত)।</li>
<li><code>ExecStart</code> — আসলে যে কমান্ড চালানো হবে। এটাই একমাত্র লাইন যা বাদ দিলে unit-টা অকার্যকর — বাকি সবই মেটাডেটা বা supervision-এর নির্দেশ।</li>
<li><code>Restart=on-failure</code> ও <code>RestartSec=5</code> — auto-restart policy, বিস্তারিত ৫ নম্বর সেকশনে।</li>
<li><code>User=myapi</code> — ২ নম্বর চ্যাপ্টারে (Permissions) আলোচিত <b>least privilege</b> নীতির বাস্তব প্রয়োগ। <code>ExecStart</code> না বললে systemd default হিসেবে service-টাকে <code>root</code> হিসেবে চালাত — একটা internet-facing web app যদি root-এ চলে, সেই process-এ কোনো remote code execution bug থাকলে আক্রমণকারী সরাসরি পুরো সিস্টেমের root access পেয়ে যায়। একটা dedicated, no-login, ন্যূনতম অনুমতির <code>myapi</code> ইউজার তৈরি করে (<code>useradd --system --no-create-home myapi</code>) সেই ঝুঁকি সীমিত করা হয়।</li>
<li><code>WorkingDirectory</code> — relative path (যেমন <code>appsettings.json</code> খোঁজা) কোন ডিরেক্টরি থেকে resolve হবে।</li>
<li><code>Environment=</code> — প্রতিটা লাইন একটা env var সেট করে; একই image/build ভিন্ন environment-এ (dev/staging/prod) ভিন্নভাবে configure করতে ব্যবহার হয়, ঠিক Kubernetes ConfigMap-এর মতোই উদ্দেশ্যে।</li>
<li><code>[Install]</code> → <code>WantedBy=multi-user.target</code> — এই unit boot-এ চালু হওয়ার জন্য কোন target-এর সাথে যুক্ত হবে, তার ঘোষণা। বিস্তারিত ৭ নম্বর সেকশনে।</li>
</ul>
<div class="callout why"><span class="tag">After= মানে dependency নয় — শুধু ক্রম</span>
<code>After=network.target</code> দেখে অনেকে ধরে নেন এটা একটা hard dependency — "network না থাকলে এই service চালু হবে না।" ভুল। <code>After=</code> শুধু <b>ordering</b> নির্দেশ করে: "network.target-এর কাজ শেষ হওয়ার <i>পরে</i> আমাকে শুরু করো" — কিন্তু network.target ব্যর্থ হলেও, বা একেবারে না থাকলেও, systemd এই service-টা ঠিকই চালু করার চেষ্টা করবে। আসল নির্ভরতা প্রকাশ করতে হয় আলাদা directive দিয়ে — <code>Requires=</code> (কঠোর: ওইটা fail করলে এটাও fail) বা <code>Wants=</code> (নরম: চেষ্টা করবে, ব্যর্থ হলেও থামবে না)। আরেকটা সূক্ষ্ম ফাঁদ: <code>network.target</code> শুধু বোঝায় "নেটওয়ার্ক স্ট্যাক initialize হয়েছে" — interface-এ IP পাওয়া বা DNS resolve করা যাচ্ছে তার গ্যারান্টি নয়। সত্যিকারের কানেক্টিভিটির ওপর নির্ভরশীল app-এর জন্য <code>After=network-online.target</code> ও <code>Wants=network-online.target</code> দুটোই লাগবে।</div>

<h4>Type= — systemd কীভাবে বুঝবে service আসলে "রেডি" হয়েছে</h4>
<p>উপরের unit ফাইলে <code>Type=notify</code> লেখা আছে, কিন্তু এই ডিরেক্টিভটাই আসলে গুরুত্বপূর্ণ একটা প্রশ্নের উত্তর দেয় — <code>ExecStart</code>-এ দেওয়া প্রসেসটা fork হওয়ার সাথে সাথেই systemd কি ধরে নেবে "সার্ভিস চালু হয়ে গেছে", নাকি তার নিজের initialization (config load, database connection, port bind) শেষ হওয়া পর্যন্ত অপেক্ষা করবে? <code>Type=</code> ঠিক এটাই নির্ধারণ করে।</p>
<table>
<tr><th>Type</th><th>systemd কখন ধরে নেয় "started"</th><th>ব্যবহার</th></tr>
<tr><td><span class="kw">simple</span> (ডিফল্ট)</td><td><code>ExecStart</code>-এর প্রসেস <code>fork()</code> হওয়ার সাথে সাথেই — প্রসেসটা আসলে request নেওয়ার জন্য প্রস্তুত কিনা systemd যাচাই করে না</td><td>সাধারণ long-running প্রসেস, যেখানে startup প্রায় তাৎক্ষণিক</td></tr>
<tr><td><span class="kw">notify</span></td><td>প্রসেস নিজে থেকে একটা বিশেষ <code>sd_notify(READY=1)</code> সিগন্যাল systemd-কে না পাঠানো পর্যন্ত অপেক্ষা করে — অ্যাপ্লিকেশনকে এই কল সাপোর্ট করতে হয়</td><td>ASP.NET Core-এর মতো app, যেখানে প্রসেস শুরু হওয়া আর প্রকৃত "রেডি" হওয়া (DB migration, cache warm-up শেষে) এক মুহূর্ত না</td></tr>
<tr><td><span class="kw">forking</span></td><td><code>ExecStart</code>-এর প্রসেস নিজে fork করে একটা background daemon child তৈরি করে মূল প্রসেসটা exit করে যায় — systemd সেই exit-এর অপেক্ষা করে, তারপর child-কে main PID ধরে</td><td>পুরনো-ধাঁচের classic daemonizing প্রোগ্রাম</td></tr>
<tr><td><span class="kw">oneshot</span></td><td>প্রসেস একবার চলে সম্পূর্ণ হয়ে exit করবে — একে "চলমান সার্ভিস" ধরা হয় না</td><td>backup/migration script — চ্যাপ্টার ১৪-এর timer-triggered job</td></tr>
</table>
<div class="callout mistake"><span class="tag">ভুল ধরে নেওয়া — <code>Type=simple</code>-এ dependent service একটু দেরিতে চালু হলেও সমস্যা নেই</span>
<code>Type=simple</code> (ডিফল্ট) ব্যবহার করলে systemd শুধু <code>fork()</code> সফল হয়েছে দেখেই সার্ভিসকে "চালু" ধরে নেয় — এর ফল হলো, <code>After=myapi.service</code> দিয়ে dependency ঘোষণা করা অন্য কোনো সার্ভিস (যেমন একটা reverse proxy) হয়তো myapi-র নিজের initialization (database connection pool তৈরি, cache warm-up) শেষ হওয়ার আগেই request পাঠানো শুরু করে দিতে পারে — ফলে startup-এর প্রথম কয়েক সেকেন্ড connection refused বা 502 error দেখা যায়। <code>Type=notify</code>-এর আসল সুবিধা এখানেই — অ্যাপ্লিকেশন নিজে (.NET-এ <code>Microsoft.Extensions.Hosting.Systemd</code> প্যাকেজের বিল্ট-ইন সাপোর্ট আছে) systemd-কে জানায় ঠিক কখন request নেওয়ার জন্য প্রস্তুত, আর systemd তখনই dependent unit-দের এগোতে দেয়।
</div>

<h3>৪. <code>systemctl</code> দিয়ে service নিয়ন্ত্রণ</h3>
<p>ইউনিট ফাইল লেখা হলেই systemd সেটা নিজে থেকে জানে না — ফাইল save করার পর তাকে জানাতে হয়:</p>
<pre><span class="c"># unit ফাইল নতুন বা edit করার পর — systemd-কে disk থেকে আবার পড়তে বলা</span>
sudo systemctl daemon-reload

<span class="c"># service চালু করা + এখনই এবং প্রতি বুটে — দুটো একসাথে করার shortcut</span>
sudo systemctl enable --now myapi.service

<span class="c"># অবস্থা দেখা — running/failed, সাম্প্রতিক লগের কয়েক লাইন, main PID</span>
systemctl status myapi.service

<span class="c"># কোড পাল্টানোর পর নতুন বিল্ড ধরাতে</span>
sudo systemctl restart myapi.service

<span class="c"># সাময়িকভাবে বন্ধ করা (কিন্তু বুটে আবার চালু হবে, যদি enabled থাকে)</span>
sudo systemctl stop myapi.service

<span class="c"># বুটে আর চালু না হোক — কিন্তু এখন চলমান থাকলে চলতেই থাকবে</span>
sudo systemctl disable myapi.service</pre>
<div class="callout mistake"><span class="tag">enable আর start সম্পূর্ণ স্বাধীন — একটা করলে অন্যটা হয় না</span>
এটাই systemd নিয়ে সবচেয়ে বেশি বিভ্রান্তিকর জায়গা। <code>systemctl enable myapi</code> শুধু <code>/etc/systemd/system/multi-user.target.wants/</code>-এ একটা symlink তৈরি করে, যাতে <b>পরের বার</b> যখন <code>multi-user.target</code>-এ পৌঁছানো হবে (অর্থাৎ পরের বুটে), তখন systemd এটাকে চালু করে। এটা service-টাকে <b>এখনই</b> চালু করে না। উল্টোদিকে <code>systemctl start myapi</code> এখনই চালায়, কিন্তু পরের বুটে আবার চালু হওয়ার কোনো গ্যারান্টি রাখে না (enable করা না থাকলে সার্ভার reboot-এর পর সার্ভিস "হারিয়ে" যায়!)। একটা নতুন প্রোডাকশন সার্ভিস deploy করার সময় প্রায় সবসময় দুটোই চান — সেজন্যই <code>enable --now</code> shortcut-টা এত দরকারি।</div>
<div class="callout mistake"><span class="tag">unit ফাইল edit করে সরাসরি restart — daemon-reload ভুলে যাওয়া</span>
systemd যখন প্রথমবার একটা unit ফাইল পড়ে, সে তার একটা <b>in-memory কপি</b> রেখে দেয় — প্রতিবার <code>start</code>/<code>restart</code> করার সময় সে ডিস্কে আবার ফাইল খুলে দেখে না। তাই আপনি যদি <code>myapi.service</code> ফাইল edit করে (ধরুন <code>ExecStart</code> বা <code>Environment=</code> পাল্টে) সরাসরি <code>systemctl restart myapi</code> চালান, systemd নীরবে আপনার <b>পুরনো, in-memory কনফিগারেশন</b> দিয়েই সার্ভিস restart করবে — কোনো error বা warning ছাড়াই। ফলাফল: আপনি নিশ্চিত যে নতুন config এফেক্টিভ, অথচ আসলে পুরনোটাই চলছে — ডিবাগ করতে ঘণ্টার পর ঘণ্টা লেগে যেতে পারে যতক্ষণ না মনে পড়ে <code>daemon-reload</code> চালাতে হবে। নিয়ম: unit ফাইলে যেকোনো পরিবর্তনের পর, restart করার <b>আগে</b> সবসময় <code>daemon-reload</code>।</div>
<div class="callout behind"><span class="tag">enable আসলে পর্দার পেছনে কী করে</span>
<code>WantedBy=multi-user.target</code> ঘোষণার মানে হলো enable করলে systemd <code>multi-user.target.wants/</code> ডিরেক্টরিতে একটা symlink বানাবে যেটা আসল unit ফাইলের দিকে নির্দেশ করে — নিজে থেকে কোনো নতুন কনফিগারেশন লেখে না:
<pre>$ sudo systemctl enable myapi.service
Created symlink /etc/systemd/system/multi-user.target.wants/myapi.service → /etc/systemd/system/myapi.service.

$ ls -l /etc/systemd/system/multi-user.target.wants/ | grep myapi
lrwxrwxrwx ... myapi.service -> /etc/systemd/system/myapi.service</pre>
বুটের সময় systemd যখন <code>multi-user.target</code>-এ পৌঁছায়, সে এই <code>.wants/</code> ডিরেক্টরির সব symlink অনুসরণ করে সেই unit-গুলো চালু করে। <code>disable</code> শুধু এই symlink মুছে দেয় — আসল unit ফাইল অক্ষত থাকে।</div>

<h3>৫. Restart Policy — ক্র্যাশ হলে systemd কী করবে</h3>
<p><code>Restart=</code> directive ঠিক করে systemd একটা service-এর process শেষ হয়ে গেলে কী করবে:</p>
<div class="card">
<div class="grid2">
<div class="box"><span class="badge">সাধারণ প্রোডাকশন ডিফল্ট</span><b>Restart=on-failure</b><br>শুধু <b>অস্বাভাবিক exit</b>-এ restart করে — non-zero exit code, বা signal দিয়ে kill (crash)। <code>systemctl stop</code> দিয়ে ইচ্ছাকৃতভাবে থামালে (exit code 0, বা পরিষ্কার stop) আবার চালু হয় না — যেটাই চান।</div>
<div class="box"><b>Restart=always</b><br>ইচ্ছাকৃত <code>stop</code> ছাড়া প্রায় সবকিছুতেই restart করে — এমনকি clean exit-এও। সাধারণত এমন সার্ভিসের জন্য যেগুলোর "স্বাভাবিকভাবে থেমে যাওয়া" নিজেই একটা সমস্যার লক্ষণ।</div>
</div>
</div>
<p><code>Restart=no</code> (ডিফল্ট, explicit বললে) মানে কখনোই auto-restart হবে না — one-shot script/batch job-এর জন্য মানানসই, কিন্তু always-on web API-এর জন্য প্রায় কখনোই কাম্য নয়।</p>
<p><code>RestartSec=5</code> restart করার আগে কত সেকেন্ড অপেক্ষা করবে তা বলে — সাথে সাথে না থেমে একটা ছোট delay রাখা হয় যাতে সাময়িক সমস্যা (যেমন database এখনো বুট হচ্ছে) নিজে থেকে সেরে ওঠার একটু সময় পায়।</p>
<div class="callout mistake"><span class="tag">কেন unbounded restart বিপজ্জনক — crash loop</span>
কল্পনা করুন একটা bad config deploy হয়েছে আর app শুরু হওয়ার সাথে সাথেই ক্র্যাশ করছে। শুধু <code>Restart=on-failure</code> থাকলে systemd প্রতি <code>RestartSec</code> পর পর সেটাকে বারবার চালানোর চেষ্টা করবে — <b>অসীমভাবে</b>। এতে CPU নষ্ট হয়, প্রতিবার নতুন database connection খোলার চেষ্টায় connection pool চাপে পড়ে, আর log ফাইল crash trace দিয়ে ভরে যায়। এখানেই <code>StartLimitIntervalSec=60</code> ও <code>StartLimitBurst=5</code> কাজে আসে (unit ফাইলের <code>[Unit]</code> সেকশনে, ৩ নম্বর সেকশনের উদাহরণ দেখুন) — এর অর্থ "৬০ সেকেন্ডের ভেতরে ৫ বারের বেশি restart হলে, থামিয়ে দাও এবং service-টাকে <code>failed</code> অবস্থায় রেখে দাও, মানুষ এসে দেখুক।" এই cap ছাড়া একটা crash-restart-crash loop অসীমকাল ধরে সার্ভারের রিসোর্স খেয়ে যেতে পারে।</div>

<h3>৬. journald ও journalctl — কেন্দ্রীভূত লগিং</h3>
<p>systemd-এর একটা integrated logging component আছে যাকে বলে <span class="kw">journald</span>। প্রতিটা systemd-managed service-এর stdout ও stderr স্বয়ংক্রিয়ভাবে ক্যাপচার হয়ে journal-এ জমা হয় — অ্যাপকে নিজে থেকে log file খুলতে, rotate করতে, বা disk space ব্যবস্থাপনা করতে হয় না। ৩ নম্বর সেকশনের <code>myapi.service</code>-এর <code>Console.WriteLine</code> বা .NET-এর built-in console logger যা প্রিন্ট করে, তার সবই সরাসরি journal-এ চলে যায়।</p>
<pre><span class="c"># শুধু এই ইউনিটের লগ</span>
journalctl -u myapi.service

<span class="c"># লাইভ tail করা — নতুন এন্ট্রি এলে সাথে সাথে দেখাবে (Ctrl+C দিয়ে বন্ধ)</span>
journalctl -u myapi.service -f

<span class="c"># সময়ভিত্তিক ফিল্টার</span>
journalctl -u myapi.service --since "1 hour ago"

<span class="c"># শুধু error ও তার চেয়ে গুরুতর priority</span>
journalctl -u myapi.service -p err</pre>
<p>"সার্ভিসটা এইমাত্র কেন ক্র্যাশ করল" — এই প্রশ্নের সবচেয়ে দ্রুত উত্তর প্রায় সবসময় <code>journalctl -u myapi.service -p err --since "10 minutes ago"</code> দিয়ে শুরু হয়, তারপর দরকার হলে <code>-f</code> দিয়ে লাইভ পর্যবেক্ষণ।</p>
<div class="callout why"><span class="tag">journal সবসময় বুট পার হয়ে টিকে থাকে না</span>
অনেক minimal install-এ ডিফল্টভাবে journal শুধু <code>/run/log/journal</code>-এ (RAM-backed, volatile) রাখা হয় — reboot হলেই আগের সব লগ হারিয়ে যায়। ৮ নম্বর চ্যাপ্টারের persistent বনাম tmpfs storage-এর আলোচনার সাথে মিলিয়ে দেখুন: <code>/var/log/journal</code> ডিরেক্টরি (<code>sudo mkdir -p /var/log/journal && sudo systemctl restart systemd-journald</code>) তৈরি করলেই journald নিজে থেকে disk-এ persistent logging-এ সুইচ করে। প্রোডাকশন সার্ভারে crash-এর পরের ফরেনসিক তদন্তের জন্য এটা কার্যত অপরিহার্য।</div>

<h3>৭. Target — পুরনো Runlevel-এর জায়গা নিয়েছে</h3>
<p>পুরনো SysV init-এ সিস্টেমের "অবস্থা" বোঝানো হতো সংখ্যা দিয়ে — runlevel 3 (multi-user, no GUI), runlevel 5 (GUI-সহ)। systemd-তে সেই ধারণাটাই আরও নমনীয়ভাবে প্রকাশ পায় <span class="kw">target</span> দিয়ে — একটা target হলো ইউনিটদের একটা named গ্রুপ/সিঙ্ক্রোনাইজেশন পয়েন্ট, নিজে কোনো process না।</p>
<table>
<tr><th>Target</th><th>রুনলেভেল সমতুল্য</th><th>মানে</th></tr>
<tr><td><span class="kw">multi-user.target</span></td><td>Runlevel 3</td><td>নেটওয়ার্কসহ পূর্ণ multi-user সিস্টেম, কিন্তু কোনো graphical UI ছাড়া — বেশিরভাগ সার্ভারের ডিফল্ট।</td></tr>
<tr><td><span class="kw">graphical.target</span></td><td>Runlevel 5</td><td>multi-user.target-এর সবকিছু, প্লাস display manager/desktop — ডেস্কটপ ডিস্ট্রোর ডিফল্ট।</td></tr>
</table>
<p>এখন ৩ নম্বর সেকশনের <code>WantedBy=multi-user.target</code> লাইনটার মানে স্পষ্ট: "systemd যখন multi-user.target-এ পৌঁছাবে (অর্থাৎ সার্ভার সাধারণ multi-user মোডে বুট হচ্ছে), তখন <code>myapi.service</code>-কেও চালু করার তালিকায় যোগ করো।" একটা headless সার্ভারে সাধারণত <code>graphical.target</code>-এর দরকারই পড়ে না।</p>

<h3>৯. দ্রুত রেফারেন্স — <code>systemctl</code> সাবকমান্ড</h3>
<table>
<tr><th>কমান্ড</th><th>কী করে</th><th>সাধারণ ভুল/গোচা</th></tr>
<tr><td><code>start</code></td><td>এখনই সার্ভিস চালু করে</td><td>enable করা না থাকলে পরের বুটে আবার চালু হবে না</td></tr>
<tr><td><code>stop</code></td><td>এখনই সার্ভিস বন্ধ করে</td><td>enable করা থাকলে পরের বুটে ঠিকই আবার চালু হবে যাবে</td></tr>
<tr><td><code>restart</code></td><td>stop + start</td><td>unit ফাইল edit করার পর <code>daemon-reload</code> ছাড়া চালালে পুরনো config দিয়েই restart হয়</td></tr>
<tr><td><code>status</code></td><td>বর্তমান অবস্থা, main PID, সাম্প্রতিক কয়েক লাইন লগ</td><td>পুরো লগের জন্য যথেষ্ট নয় — <code>journalctl -u</code> ব্যবহার করুন</td></tr>
<tr><td><code>enable</code></td><td>target-এর <code>.wants/</code>-এ symlink বানায় — পরের বুটে চালু হওয়ার জন্য</td><td><b>এখনই চালু করে না</b> — <code>start</code>-এর সাথে গুলিয়ে ফেলা সবচেয়ে সাধারণ ভুল</td></tr>
<tr><td><code>disable</code></td><td>সেই symlink মুছে দেয়</td><td>চলমান instance থামায় না — সেজন্য আলাদা <code>stop</code> লাগবে</td></tr>
<tr><td><code>daemon-reload</code></td><td>disk থেকে সব unit ফাইল আবার পড়ে, in-memory কপি রিফ্রেশ করে</td><td>ভুলে গেলে ফাইল-পরিবর্তন নীরবে ignore হয় — কোনো error দেখায় না</td></tr>
</table>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
systemd আধুনিক Linux-এর PID 1 — এটাই বুট সিকোয়েন্স ম্যানেজ করে আর সারাজীবন ধরে service supervise করে। একটা <code>.service</code> unit ফাইলে <code>ExecStart</code>, <code>Restart=</code>, <code>User=</code>, আর <code>WantedBy=</code> — এই চারটে জিনিস ঠিক বসালেই বেশিরভাগ প্রোডাকশন app চালানোর মতো তৈরি। মনে রাখার মতো দুটো ফাঁদ: <b>enable আর start আলাদা</b> (দুটোই চান তো <code>enable --now</code>), আর unit ফাইল edit করলে restart-এর আগে <code>daemon-reload</code> বাধ্যতামূলক। আর যখন কিছু ভেঙে যায়, <code>journalctl -u &lt;service&gt; -p err</code> — এটাই আপনার প্রথম গন্তব্য। এখন পর্যন্ত আমরা একটা সার্ভারের ভেতরের অবস্থা নিয়ে কথা বলেছি — নেটওয়ার্কিং চ্যাপ্টারে (৭) ধারণাগতভাবে দেখানো হলেও, বাস্তবে সেই সার্ভারে <b>নিরাপদে দূর থেকে ঢোকা ও কমান্ড চালানো</b>-টাই এখন সবচেয়ে জরুরি দক্ষতা। পরের চ্যাপ্টারে (১০. SSH ও Remote Access) আমরা দেখব key-based authentication, <code>ssh-agent</code>, ও remote সার্ভারে নিরাপদে অ্যাক্সেস করার প্র্যাকটিক্যাল খুঁটিনাটি — যেখান থেকে আসলে আমরা আজকের <code>systemctl</code>/<code>journalctl</code> কমান্ডগুলো দূরের সার্ভারে গিয়ে চালাবো।</div>
