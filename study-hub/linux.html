<h2 class="title">১. Foundations — Kernel, Shell, Filesystem Hierarchy</h2>
<p class="lead">Linux নিয়ে কাজ শুরু করার আগে একটা বেসিক প্রশ্নের উত্তর পরিষ্কার থাকা দরকার — "Linux" শব্দটা আসলে কী বোঝায়? এই চ্যাপ্টারে আমরা kernel, shell, আর filesystem hierarchy — এই তিনটা বিল্ডিং ব্লক দিয়ে পুরো সিস্টেমের mental model তৈরি করব, যেটা বাকি পুরো কোর্সের ভিত্তি হয়ে থাকবে।</p>

<h3>Linux আসলে কী — Kernel বনাম Distribution</h3>
<p>প্রথম ভুল ধারণাটা এখানেই ভাঙা দরকার। <b>Linux</b> নিজে একটা সম্পূর্ণ অপারেটিং সিস্টেম না — এটা শুধু একটা <span class="kw">kernel</span>, ১৯৯১ সালে Linus Torvalds যেটা লেখা শুরু করেছিলেন। Kernel হলো সেই প্রোগ্রাম যেটা হার্ডওয়্যারের সাথে সরাসরি কথা বলে — CPU shcedule করা, মেমরি ম্যানেজ করা, ডিস্ক/নেটওয়ার্ক ডিভাইস চালানো। কিন্তু শুধু kernel দিয়ে আপনি টার্মিনালে <code>ls</code>, <code>cp</code>, <code>bash</code> — কিছুই চালাতে পারবেন না, কারণ এগুলো kernel-এর অংশ না।</p>
<p>এই gap-টা পূরণ করে <span class="kw">GNU</span> প্রজেক্ট — Richard Stallman-এর নেতৃত্বে ১৯৮০-র দশকে শুরু হওয়া একগুচ্ছ userland টুল: shell (bash), compiler (gcc), core utilities (coreutils — ls, cp, mv, cat...), lib (glibc)। GNU প্রজেক্টের নিজস্ব kernel (Hurd) কখনো production-ready হয়নি, তাই যখন Linux kernel তৈরি হলো, GNU টুলগুলোর সাথে জোড়া লেগে একটা সম্পূর্ণ usable OS দাঁড়ালো — এই কারণেই টেকনিক্যালি ঠিকঠাক নাম "GNU/Linux"।</p>
<p>এরপর আসে <span class="kw">distribution</span> (সংক্ষেপে "distro") — Ubuntu, Debian, RHEL/CentOS, Fedora, Alpine। সবগুলো একই Linux kernel ব্যবহার করে, কিন্তু তাদের মধ্যে পার্থক্য তিনটা জায়গায়:</p>
<ul>
<li><b>Package manager</b> — Debian/Ubuntu-তে <code>apt</code>/<code>dpkg</code>, RHEL/CentOS-এ <code>dnf</code>/<code>rpm</code>, Alpine-এ <code>apk</code>।</li>
<li><b>Init system ও default configuration</b> — বেশিরভাগ আধুনিক distro <span class="kw">systemd</span> ব্যবহার করে (chapter ৯-এ বিস্তারিত), Alpine সাধারণত OpenRC।</li>
<li><b>Philosophy ও target ব্যবহার</b> — Alpine হালকা, musl-libc ব্যবহার করে, container image-এ জনপ্রিয়; RHEL enterprise stability-focused, দীর্ঘ support cycle দেয়।</li>
</ul>

<div class="callout mistake">
<span class="tag">MISTAKE</span>
অনেকে "Linux" আর "একটা Linux distribution" গুলিয়ে ফেলেন — এই কনফিউশনটাই বেশিরভাগ "distro অনুযায়ী ডকুমেন্টেশন আলাদা কেন?" প্রশ্নের মূল কারণ। মনে রাখুন: <b>kernel একটাই</b> (Linus Torvalds ও কমিউনিটি মেইনটেইন করে), কিন্তু তার উপর বসানো প্যাকেজিং, init system, আর default config distro থেকে distro-তে ভিন্ন। তাই যখন একটা Stack Overflow উত্তর <code>yum install</code> বলে কিন্তু আপনার Ubuntu সার্ভারে সেটা কাজ করে না, বুঝবেন সমস্যা kernel-এ না — distro-স্পেসিফিক tooling-এ।
</div>

<h3>Kernel-এর মূল দায়িত্ব</h3>
<p>Kernel-কে ভাবতে পারেন হার্ডওয়্যার আর বাকি সব সফটওয়্যারের মাঝখানের একটা লেয়ার হিসেবে — যেটা পাঁচটা মূল কাজ করে:</p>
<table>
<tr><th>Subsystem</th><th>দায়িত্ব</th></tr>
<tr><td>Process scheduler</td><td>কোন প্রোসেস কখন CPU টাইম পাবে সেটা ঠিক করে (multitasking সম্ভব করে)</td></tr>
<tr><td>Memory manager</td><td>প্রতিটা প্রোসেসকে আলাদা virtual address space দেয়, physical RAM আর swap ম্যানেজ করে</td></tr>
<tr><td>Device drivers</td><td>ডিস্ক, নেটওয়ার্ক কার্ড, GPU-এর মতো হার্ডওয়্যারের সাথে কথা বলার নির্দিষ্ট কোড</td></tr>
<tr><td>Filesystem abstraction</td><td>ext4, XFS, NFS-এর মতো ভিন্ন ভিন্ন ফাইলসিস্টেমকে একই <code>open()</code>/<code>read()</code> interface-এর পেছনে লুকিয়ে রাখে</td></tr>
<tr><td>Networking stack</td><td>TCP/IP প্যাকেট তৈরি, রাউটিং, socket ম্যানেজমেন্ট</td></tr>
</table>
<p>এই সবগুলো subsystem একসাথে মিলে হার্ডওয়্যারের জটিলতা লুকিয়ে userland প্রোগ্রামগুলোর জন্য একটা পরিষ্কার, consistent interface তৈরি করে।</p>

<h3>Kernel Space বনাম User Space</h3>
<p>Linux মেমরিকে দুই ভাগে ভাগ করে: <span class="kw">kernel space</span> আর <span class="kw">user space</span>। Kernel space-এ চলে kernel নিজে আর তার ড্রাইভারগুলো — এখানে হার্ডওয়্যারে সরাসরি অ্যাক্সেস আছে। User space-এ চলে বাকি সব প্রোগ্রাম — আপনার bash shell, nginx, dotnet প্রসেস, এমনকি root হিসেবে চালানো প্রোগ্রামও।</p>
<p>এই বিভাজন কেন দরকার? দুইটা কারণ:</p>
<ol>
<li><b>Stability</b> — একটা user space প্রোগ্রাম ক্র্যাশ করলে শুধু সেই প্রোসেসটাই মরে; পুরো মেশিন ডাউন হয় না। কিন্তু kernel space-এ bug থাকলে পুরো সিস্টেম crash করতে পারে (kernel panic)।</li>
<li><b>Security</b> — user space প্রোগ্রাম হার্ডওয়্যারে সরাসরি হাত দিতে পারে না। একটা buggy বা malicious প্রোগ্রাম চাইলেই ডিস্ক কন্ট্রোলারকে সরাসরি কমান্ড পাঠাতে পারবে না।</li>
</ol>
<p>তাহলে user space প্রোগ্রাম যখন ফাইল পড়তে চায়, বা নেটওয়ার্কে ডেটা পাঠাতে চায় — সেটা কীভাবে সম্ভব? উত্তর: <span class="kw">system calls</span>। এটাই দুই world-এর মধ্যে একমাত্র সরকারি দরজা। <code>read()</code>, <code>write()</code>, <code>open()</code>, <code>fork()</code>, <code>execve()</code> — এগুলো সব system call; user space প্রোগ্রাম এগুলো ইনভোক করে kernel-কে অনুরোধ পাঠায়, kernel সেই অনুরোধ যাচাই করে (permission আছে কি না) execute করে, ফলাফল ফেরত দেয়।</p>

<div class="callout why">
<span class="tag">WHY</span>
System call boundary-টা যদি না থাকত, তাহলে প্রতিটা প্রোগ্রামকে নিজে থেকেই ডিস্ক ড্রাইভার, ফাইলসিস্টেম লজিক লিখতে হতো, আর একটার bug অন্যটার ডেটা নষ্ট করে দিতে পারত। System call interface একটা "contract" — user space শুধু জানে কী চাইতে হবে (<code>open("/etc/hosts", O_RDONLY)</code>), কীভাবে সেটা হার্ডওয়্যার লেভেলে ঘটবে সেটা সম্পূর্ণ kernel-এর দায়িত্ব। এই abstraction-ই একই বাইনারিকে ভিন্ন ভিন্ন ডিস্ক, ভিন্ন ফাইলসিস্টেমে অপরিবর্তিত রেখে চালানো সম্ভব করে।
</div>

<h3>Shell — কমান্ড থেকে Kernel পর্যন্ত</h3>
<p><span class="kw">Shell</span> নিজেও একটা সাধারণ user space প্রোগ্রাম — যেটার কাজ আপনার টাইপ করা কমান্ড পড়া, বোঝা, আর kernel-কে system call-এর মাধ্যমে অনুরোধ করে সেটা execute করানো। বেশিরভাগ distro-তে ডিফল্ট শেল <code>bash</code> (Bourne Again Shell); এর বাইরে <code>zsh</code> (macOS-এর ডিফল্ট, অনেক customization সুবিধা) আর <code>fish</code>ও (user-friendly ডিফল্ট, কিন্তু POSIX-compatible না) ব্যবহার হয়। এই কোর্সে আমরা মূলত bash নিয়েই কাজ করব, কারণ script portability আর server-এর ডিফল্ট presence-এর দিক থেকে এটাই standard।</p>
<p>একটা সাধারণ <code>ls</code> কমান্ড টাইপ করলে পর্দার আড়ালে কী ঘটে, দেখা যাক:</p>
<div class="diagram">
<pre>
আপনি টাইপ করলেন:  ls /var/log

┌────────────┐   ①fork()+exec()   ┌────────────┐
│   bash     │ ──────────────────▶│  /bin/ls   │
│ (shell)    │                    │  (নতুন প্রসেস)│
└────────────┘                    └─────┬──────┘
      ▲                                 │ ②system call: openat(), getdents(), close()
      │                                 ▼
      │                          ┌────────────┐
      │      ④ফলাফল টার্মিনালে   │   Kernel   │
      │       প্রিন্ট হয়         │ (VFS layer)│
      └─────────────────────────│            │
                ③ডিরেক্টরি এন্ট্রি│            │
                 রিড করে ফেরত দেয়└────────────┘
</pre>
</div>
<p>ধাপে ধাপে: bash প্রথমে <span class="kw">fork</span> করে নিজের একটা কপি তৈরি করে, তারপর সেই child প্রসেসে <span class="kw">exec</span> সিস্টেম কল দিয়ে <code>/bin/ls</code> বাইনারি লোড করে। <code>ls</code> নিজে kernel থেকে ডিরেক্টরি লিস্টিং পড়তে <code>openat()</code> আর <code>getdents()</code> system call করে। Kernel তার filesystem abstraction লেয়ার (VFS) দিয়ে আসল ডিস্ক থেকে ডেটা তুলে user space-এ ফেরত দেয়। <code>ls</code> সেই raw ডেটা ফরম্যাট করে stdout-এ লেখে, আর bash সেটা আপনার টার্মিনালে দেখায়। পুরো ব্যাপারটা মিলিসেকেন্ডের মধ্যে ঘটে, কিন্তু প্রতিটা ধাপই একটা নির্দিষ্ট সীমানা পার হয়ে যাচ্ছে।</p>

<div class="callout behind">
<span class="tag">BEHIND THE SCENES</span>
আপনি যখন সরাসরি shell-এ কোনো built-in যেমন <code>cd</code> চালান, সেখানে কোনো নতুন প্রসেস fork/exec হয় না — <code>cd</code> bash-এর নিজের ভেতরেই ইমপ্লিমেন্টেড, কারণ current working directory পরিবর্তন করতে হলে সেটা shell-এর নিজের প্রসেসের state বদলাতে হয় (একটা child প্রসেসে <code>cd</code> চালালে সেটা parent shell-এর directory বদলাতে পারত না)। এই জন্যই <code>type cd</code> চালালে দেখবেন এটা "shell builtin", কোনো আলাদা বাইনারি না।
</div>

<h3>Filesystem Hierarchy Standard (FHS)</h3>
<p>Linux-এ সব ফাইল একটাই root (<code>/</code>) থেকে শুরু হওয়া একটা single tree-তে থাকে — Windows-এর মতো আলাদা আলাদা drive letter (C:\, D:\) নেই। এই tree-এর টপ-লেভেল ডিরেক্টরিগুলোর নাম আর অবস্থান একটা কনভেনশন মেনে চলে, যাকে বলে <span class="kw">Filesystem Hierarchy Standard</span> (FHS)। এটা জানা মানে শুধু নাম মুখস্থ করা না — প্রতিটা ডিরেক্টরির পেছনে একটা যুক্তি আছে, যেটা বুঝলে যেকোনো নতুন distro-তেও আপনি হারিয়ে যাবেন না।</p>
<table>
<tr><th>ডিরেক্টরি</th><th>উদ্দেশ্য</th><th>উদাহরণ কন্টেন্ট</th></tr>
<tr><td><code>/bin</code>, <code>/sbin</code></td><td>বুট আর সিঙ্গেল-ইউজার মোডের জন্য দরকারি essential বাইনারি (আধুনিক distro-তে প্রায়ই <code>/usr/bin</code>-এর সাথে symlink করা)</td><td><code>ls</code>, <code>cp</code>, <code>mount</code>, <code>reboot</code></td></tr>
<tr><td><code>/etc</code></td><td>সিস্টেম-ওয়াইড configuration ফাইল — সব প্লেইন টেক্সট, কোনো বাইনারি রেজিস্ট্রি না</td><td><code>/etc/passwd</code>, <code>/etc/ssh/sshd_config</code>, <code>/etc/hosts</code></td></tr>
<tr><td><code>/home</code></td><td>প্রতিটা ইউজারের ব্যক্তিগত ডেটা ও কনফিগ</td><td><code>/home/rasel/.bashrc</code>, প্রজেক্ট ফাইল</td></tr>
<tr><td><code>/var</code></td><td>Variable ডেটা — যা সময়ের সাথে বদলায়/বাড়ে (log, cache, spool)</td><td><code>/var/log/syslog</code>, <code>/var/cache/apt</code></td></tr>
<tr><td><code>/tmp</code></td><td>অস্থায়ী ফাইল; প্রায়ই reboot-এ বা নির্দিষ্ট সময় পর মুছে যায়</td><td>বিল্ড প্রসেসের intermediate ফাইল</td></tr>
<tr><td><code>/usr</code></td><td>Secondary hierarchy — ইউজার-ইনস্টল করা প্রোগ্রাম ও তাদের ডেটা (ঐতিহাসিকভাবে "Unix System Resources", user-এর সাথে সম্পর্কহীন নাম হলেও)</td><td><code>/usr/bin/python3</code>, <code>/usr/share/doc</code></td></tr>
<tr><td><code>/proc</code></td><td>ভার্চুয়াল filesystem — ডিস্কে কোনো real ফাইল নেই, kernel runtime-এ তৈরি করে দেয়</td><td><code>/proc/cpuinfo</code>, <code>/proc/1234/status</code></td></tr>
<tr><td><code>/dev</code></td><td>ডিভাইস ফাইল — হার্ডওয়্যার ও ভার্চুয়াল ডিভাইসের ফাইল-রূপী ইন্টারফেস</td><td><code>/dev/sda</code>, <code>/dev/null</code>, <code>/dev/tty</code></td></tr>
</table>

<h4>/proc — ফাইলের ছদ্মবেশে Live Kernel ডেটা</h4>
<p><code>/proc</code> নিয়ে একটা কমন ভুল ধারণা হলো — এটাকে সাধারণ ডিরেক্টরি ভেবে বসা। বাস্তবে <code>/proc</code>-এর ভেতরের ফাইলগুলো ডিস্কে কোথাও সংরক্ষিত নেই। আপনি যখন এগুলো read করেন, kernel সেই মুহূর্তে তার internal state থেকে টেক্সট generate করে দেয়:</p>
<pre>$ cat /proc/cpuinfo <span class="c"># CPU-এর তথ্য — kernel এই মুহূর্তে generate করছে</span>
processor       : 0
vendor_id       : GenuineIntel
model name      : Intel(R) Xeon(R) Platinum 8259CL CPU @ 2.50GHz
cpu MHz         : 2500.006
cache size      : 36608 KB

$ cat /proc/meminfo <span class="c"># RAM/swap-এর লাইভ স্ন্যাপশট</span>
MemTotal:        8025920 kB
MemFree:         1203456 kB
MemAvailable:    4521088 kB
SwapTotal:       2097148 kB

$ <span class="kw">ls -la /proc/cpuinfo</span>
-r--r--r-- 1 root root 0 Jul 17 10:22 /proc/cpuinfo <span class="c"># সাইজ 0! কারণ এটা ডিস্কে সংরক্ষিত না</span></pre>
<p>লক্ষ করুন শেষ লাইনে — ফাইল সাইজ <b>0 বাইট</b>, অথচ <code>cat</code> করলে কিলোবাইট ডেটা বেরিয়ে আসে। এটাই প্রমাণ করে <code>/proc</code> ডিস্ক-ব্যাকড না — প্রতিবার read করার সময় kernel তার লাইভ মেমরি/প্রসেস স্টেট থেকে content তৈরি করে দেয়। এই জন্যই <code>/proc/uptime</code>, <code>/proc/loadavg</code>, বা <code>/proc/&lt;pid&gt;/status</code>-এর মতো ফাইল বারবার পড়লে প্রতিবার আলাদা ফলাফল আসে — monitoring টুল (chapter ১১-এ বিস্তারিত) মূলত এভাবেই ডেটা সংগ্রহ করে।</p>

<div class="callout best">
<span class="tag">BEST PRACTICE</span>
প্রোডাকশন ডিবাগিংয়ে <code>/proc</code> আপনার প্রথম টুল হওয়া উচিত, কারণ এটা কোনো এজেন্ট বা এক্সট্রা প্যাকেজ ছাড়াই সরাসরি kernel থেকে সত্য তথ্য দেয়। যেমন কোনো প্রসেস কতটা মেমরি খাচ্ছে দেখতে <code>cat /proc/&lt;pid&gt;/status</code>, বা একটা প্রসেস কোন ফাইল/সকেট খুলে রেখেছে জানতে <code>ls -la /proc/&lt;pid&gt;/fd</code> চালান — <code>lsof</code> ইনস্টল না থাকলেও এই তথ্যগুলো সবসময় পাওয়া যাবে।
</div>

<h3>"Everything is a File" — ইউনিক্স ফিলোসফি</h3>
<p>Unix-এর (আর তার উত্তরসূরি Linux-এর) একটা কেন্দ্রীয় ডিজাইন সিদ্ধান্ত হলো — যতটা সম্ভব জিনিসকে ফাইলের মতো দেখানো, যাতে সেগুলোর সাথে একই টুলসেট (<code>cat</code>, <code>&gt;</code>/<code>&gt;&gt;</code> রিডাইরেকশন, <code>|</code> পাইপ) কাজ করতে পারে। এই দর্শনের প্রয়োগ দেখা যায় কয়েক জায়গায়:</p>
<ul>
<li><b>ডিভাইস</b> — <code>/dev/sda</code> (হার্ড ডিস্ক), <code>/dev/null</code> (সব ডেটা "গিলে ফেলা" একটা ভার্চুয়াল ডিভাইস), <code>/dev/tty</code> (টার্মিনাল)।</li>
<li><b>প্রসেস তথ্য</b> — <code>/proc/&lt;pid&gt;/</code> ডিরেক্টরিগুলো, যেগুলো আমরা উপরে দেখলাম।</li>
<li><b>নেটওয়ার্ক সকেট</b> — কার্নেল কিছু socket-কে file descriptor হিসেবেই এক্সপোজ করে, তাই <code>read()</code>/<code>write()</code> সিস্টেম কল সেখানেও কাজ করে।</li>
</ul>
<p>এই unifying abstraction-এর আসল শক্তি হলো — আপনি একবার শিখলে সেই একই স্কিল (redirect, pipe, grep) প্রায় সব জায়গায় কাজে লাগে:</p>
<pre>$ echo "Hello" &gt; /dev/null           <span class="c"># ডেটা কোথাও না গিয়ে "হারিয়ে" যায়</span>
$ cat /proc/loadavg | awk '{print $1}' <span class="c"># kernel ডেটার উপর সাধারণ pipe চালানো</span>
$ echo 1 &gt; /proc/sys/net/ipv4/ip_forward <span class="c"># ফাইলে লিখেই kernel-এর runtime setting বদলানো!</span></pre>
<p>শেষ লাইনটা বিশেষভাবে লক্ষণীয় — <code>/proc/sys/</code>-এর নিচের ফাইলগুলোতে লিখলে সরাসরি kernel-এর behavior বদলে যায় (এখানে IP forwarding চালু করা হলো), কোনো বিশেষ API কল ছাড়াই। এটাই "everything is a file"-এর ব্যবহারিক সৌন্দর্য।</p>

<h2 class="title">২. Users, Groups ও Permissions</h2>
<p class="lead">Linux-এর পুরো access-control মডেল একটা সহজ ভিত্তির ওপর দাঁড়িয়ে: প্রতিটা file-এর একজন owner ও একটা group থাকে, আর প্রতিটা process কোনো-না-কোনো user হিসেবে চলে। এই একটা বাক্যই বাকি পুরো চ্যাপ্টারের ভিত্তি — আজ যা শিখবেন, পরের চ্যাপ্টারে (Process Management) প্রতিটা process-এর "কোন user-এর অনুমতিতে চলছে" প্রশ্নে বারবার ফিরে আসবেন।</p>

<h3>User, Group, আর সংখ্যার আসল গল্প — UID/GID</h3>
<p>কার্নেলের কাছে <span class="kw">root</span> বা <span class="kw">alice</span> বলে কিছু নেই — কার্নেল শুধু সংখ্যা চেনে। প্রতিটা user-এর একটা <span class="kw">UID</span> (User ID) আর প্রতিটা group-এর একটা <span class="kw">GID</span> (Group ID) থাকে। <code>root</code>-এর UID সবসময় <code>0</code>; বাকি সব সাধারণ user-এর UID সাধারণত ১০০০ থেকে শুরু হয় (distro-ভেদে ভিন্ন হতে পারে)। "alice" নামটা আসলে <code>/etc/passwd</code> ফাইলে রাখা একটা human-friendly mapping মাত্র — UID 1001-কে মানুষের পড়ার জন্য "alice" নামে দেখানো হয়।</p>
<pre><span class="c"># /etc/passwd — একটা লাইনের গঠন</span>
alice:x:1001:1001:Alice Rahman:/home/alice:/bin/bash
<span class="c">#  ^     ^  ^    ^      ^          ^           ^
#  username  UID  GID  full name  home dir   login shell
#        (password এখন /etc/shadow-এ থাকে, তাই এখানে শুধু 'x')</span></pre>
<div class="callout why"><span class="tag">কেন সংখ্যা, নাম নয়?</span>
Kernel প্রতিটা file access-এ যদি স্ট্রিং তুলনা করত ("এই user-এর নাম কি owner-এর নামের সাথে মেলে?"), তা ধীর এবং জটিল হতো — স্ট্রিং-এর দৈর্ঘ্য অনির্দিষ্ট, encoding সমস্যা, আর নাম বদলালে পুরনো ownership record অচল হয়ে যেত। একটা fixed-size integer (UID) তুলনা করা এক নিমিষে হয়, memory-তে fixed space নেয়, আর user rename করলেও (শুধু <code>/etc/passwd</code>-এ নাম বদলালেই) তার ফাইলের প্রকৃত ownership (UID-ভিত্তিক) অক্ষত থাকে। এই কারণেই <code>ls -l</code>-এ মাঝে মাঝে owner column-এ নামের বদলে সরাসরি একটা সংখ্যা দেখা যায় — সেটা তখন হয় যখন সেই UID-এর জন্য <code>/etc/passwd</code>-এ কোনো নাম-mapping খুঁজে পাওয়া যায় না (যেমন একটা external disk mount করলে, যার file অন্য মেশিনে তৈরি হয়েছিল অন্য UID scheme দিয়ে)।</div>

<h3>rwx — তিনটা ক্যাটাগরি, তিনটা অনুমতি</h3>
<p>প্রতিটা file/directory-তে permission তিনটা আলাদা ক্যাটাগরির জন্য আলাদাভাবে সংজ্ঞায়িত থাকে — <span class="kw">u</span> (owner user), <span class="kw">g</span> (owning group), <span class="kw">o</span> (অন্য সবাই — others)। প্রতিটা ক্যাটাগরির জন্য তিনটা bit: <b>r</b> (read), <b>w</b> (write), <b>x</b> (execute)। মোট ৯টা bit — এটাই classic Unix permission model, যা পরে ACL দিয়ে আরও নমনীয় করা যায় (নিচে দেখুন)।</p>

<h3>ls -l ডিকোড করা — ফিল্ড বাই ফিল্ড</h3>
<pre><span class="c">$</span> ls -l deploy.sh
-rwxr-xr--  1 alice devteam  1284 Jul 12 09:14 deploy.sh</pre>
<div class="diagram"><pre>
-  rwx  r-x  r--
│   │    │    │
│   │    │    └── others (o): read only
│   │    └──────── group  (g): read + execute
│   └───────────── owner  (u): read + write + execute
└───────────────── file type ('-' সাধারণ file, 'd' directory, 'l' symlink)
</pre></div>
<p>এরপরের কলামগুলো: <code>1</code> = hard link সংখ্যা, <code>alice</code> = owner user, <code>devteam</code> = owning group, <code>1284</code> = byte-এ size, বাকিটা modification timestamp আর filename।</p>

<h3>File বনাম Directory-তে rwx-এর আলাদা অর্থ — এখানেই সবচেয়ে বেশি ভুল হয়</h3>
<p>Beginner-রা ধরে নেয় rwx সব জায়গায় একই জিনিস বোঝায় — বাস্তবে <b>directory</b>-তে r, w, x-এর অর্থ file-এর চেয়ে সম্পূর্ণ আলাদা:</p>
<table>
<tr><th>Bit</th><th>File-এ অর্থ</th><th>Directory-তে অর্থ</th></tr>
<tr><td><b>r</b> (read)</td><td>ফাইলের content পড়া যাবে (<code>cat</code>, editor দিয়ে খোলা)</td><td>directory-এর ভেতরের নামের তালিকা দেখা যাবে (<code>ls</code> কাজ করবে)</td></tr>
<tr><td><b>w</b> (write)</td><td>ফাইলের content বদলানো/মুছে ফেলা যাবে</td><td>directory-এর ভেতরে নতুন file তৈরি, বিদ্যমান file মুছে ফেলা বা rename করা যাবে (নোট: file-এর <b>নিজের</b> permission নয়, directory-এর entry বদলানোর অনুমতি)</td></tr>
<tr><td><b>x</b> (execute)</td><td>ফাইলটাকে program হিসেবে চালানো যাবে</td><td>directory-এর ভেতরে <b>ঢোকা/traverse</b> করা যাবে — অর্থাৎ <code>cd</code> করা, বা ভেতরের কোনো file-এ path দিয়ে access করা</td></tr>
</table>
<div class="callout why"><span class="tag">Directory readable কিন্তু enter-able না হতে পারে কেন — আর তা কী কাজে লাগে</span>
<code>r</code> ছাড়া <code>x</code> থাকা একটা directory বাস্তবেই খুব কাজের একটা কৌশল: এমন একটা directory-তে আপনি <code>ls</code> দিয়ে ভেতরের নামের তালিকা দেখতে পারবেন না, কিন্তু যদি একটা ফাইলের <b>সঠিক পুরো নাম আগে থেকে জানা থাকে</b>, তাহলে সেটা access করতে পারবেন (<code>cat dir/secret-report-2024.csv</code> কাজ করবে, কিন্তু <code>ls dir/</code> করবে না)। এটা ব্যবহার হয় এমন directory-তে যেখানে ফাইলের নাম নিজেই একটা "token" হিসেবে কাজ করে (যেমন কোনো session/upload directory) — অন্য user directory-র ভেতর কী কী আছে তা "browse" করতে পারবে না, কিন্তু নির্দিষ্ট নাম জানলে সেটাই access করতে পারবে। উল্টোটাও সত্য: শুধু <code>r</code> আছে, <code>x</code> নেই এমন directory-তে <code>ls</code> কাজ করবে (নামগুলো দেখা যাবে), কিন্তু সেই নাম ব্যবহার করে ভেতরের কোনো file খুলতে গেলে "Permission denied" আসবে — কারণ file-এ পৌঁছাতে হলে path-এর প্রতিটা directory component-এ <code>x</code> লাগে, নিজের কাছে filename জানা থাকলেও।</div>

<h3>Octal Notation — সংখ্যায় Permission লেখা</h3>
<p>প্রতিটা bit-এর একটা নির্দিষ্ট numeric value আছে: <code>r = 4</code>, <code>w = 2</code>, <code>x = 1</code>। একটা ক্যাটাগরির (u/g/o) তিনটা bit-এর value যোগ করলেই সেই ক্যাটাগরির একক অঙ্ক পাওয়া যায় — আর তিন ক্যাটাগরি মিলিয়ে হয় তিন অঙ্কের octal number।</p>
<div class="diagram"><pre>
7 = 4+2+1 = rwx      754
5 = 4+0+1 = r-x       │││
4 = 4+0+0 = r--       ││└─ others = 4  (r--)
                      │└── group  = 5  (r-x)
                      └─── owner  = 7  (rwx)
</pre></div>
<pre><span class="c">$</span> chmod 754 deploy.sh          <span class="c"># owner: rwx, group: r-x, other: r--</span>
<span class="c">$</span> chmod u=rwx,g=rx,o=r deploy.sh   <span class="c"># ঠিক একই ফলাফল, symbolic ফর্মে</span></pre>
<p>দুইটার ফলাফল একদম অভিন্ন — octal দ্রুত লিখতে সুবিধাজনক (একবারে পুরো state সেট করা), symbolic form সুবিধাজনক যখন শুধু একটা ক্যাটাগরির একটা bit বদলাতে চান, বাকিগুলো অপরিবর্তিত রেখে (যেমন <code>chmod g+w file</code> — শুধু group-এ write যোগ করা, বাকি সব যেমন ছিল তেমনই থাকবে)।</p>

<h3>umask — নতুন ফাইল কেন ডিফল্টভাবে rwxrwxrwx পায় না</h3>
<p>একটা স্বাভাবিক প্রশ্ন এতক্ষণে মাথায় আসা উচিত — <code>touch newfile.txt</code> চালালে সেই ফাইলটা ঠিক কোন permission নিয়ে "জন্মায়" সেটা কে ঠিক করে? উত্তর হলো <span class="kw">umask</span> — প্রতিটা shell process-এর একটা মান, যা নতুন তৈরি হওয়া ফাইল/ডিরেক্টরির ডিফল্ট permission থেকে নির্দিষ্ট bit <b>বিয়োগ (mask out)</b> করে দেয়। Kernel ধরে নেয় নতুন ফাইলের সর্বোচ্চ সম্ভাব্য ডিফল্ট <code>666</code> (rw-rw-rw- — execute bit কখনোই ডিফল্টে থাকে না, কারণ একটা ফাইল হুট করে executable হয়ে যাওয়া উচিত না, সেটা ইচ্ছাকৃতভাবে <code>chmod +x</code> করেই করতে হয়) আর নতুন ডিরেক্টরির সর্বোচ্চ ডিফল্ট <code>777</code> (ডিরেক্টরিতে x মানে traverse, সেটা সাধারণত দরকারই হয়)। umask ভ্যালু এই সর্বোচ্চ থেকে বাদ দেওয়া bit-গুলো নির্দিষ্ট করে।</p>
<div class="diagram"><pre>
নতুন ফাইলের সর্বোচ্চ ডিফল্ট      666  (rw-rw-rw-)
umask                          -  022  (----w--w-)
────────────────────────────────────────────────
আসল ফলাফল                       644  (rw-r--r--)

নতুন ডিরেক্টরির সর্বোচ্চ ডিফল্ট   777  (rwxrwxrwx)
umask                          -  022  (----w--w-)
────────────────────────────────────────────────
আসল ফলাফল                       755  (rwxr-xr-x)
</pre></div>
<pre><span class="c">$</span> umask
0022
<span class="c">$</span> touch newfile.txt &amp;&amp; ls -l newfile.txt
-rw-r--r-- 1 rasel rasel 0 Jul 17 10:00 newfile.txt   <span class="c"># 666 - 022 = 644</span>
<span class="c">$</span> mkdir newdir &amp;&amp; ls -ld newdir
drwxr-xr-x 2 rasel rasel 4096 Jul 17 10:00 newdir       <span class="c"># 777 - 022 = 755</span></pre>
<div class="callout why"><span class="tag">umask কেন "বিয়োগ", আর chmod কেন "নির্ধারণ"</span>
umask আর chmod বিপরীত দিক থেকে কাজ করে বলেই এই দুটো গুলিয়ে ফেলা সহজ। <code>chmod 644 file</code> সরাসরি সেই permission <b>বসিয়ে দেয়</b> (set) — বর্তমান state যাই হোক না কেন। কিন্তু umask কোনো ফাইলের permission সরাসরি সেট করে না; এটা একটা "নতুন ফাইল তৈরির মুহূর্তে ঠিক কোন bit বাদ দিতে হবে"-র মাস্ক, যা প্রতিবার <code>create()</code> system call-এর সময় kernel-এর সর্বোচ্চ ডিফল্ট থেকে bitwise বিয়োগ হয়। তাই <code>umask 077</code> সেট করলে মানে দাঁড়ায় "এখন থেকে তৈরি হওয়া প্রতিটা নতুন ফাইল শুধু owner-ই পড়তে/লিখতে পারবে, group/other একদমই না" — shared home directory থাকা multi-user সার্ভারে personal script/config-এর জন্য এটা একটা common hardening অভ্যাস।
</div>
<p>umask সাধারণত shell startup ফাইলে (<code>/etc/profile</code>, <code>~/.bashrc</code>) সেট থাকে — বেশিরভাগ distro-তে normal user-এর ডিফল্ট <code>022</code>। শুধু বর্তমান session-এর জন্য বদলাতে <code>umask 027</code> চালালেই চলে; স্থায়ী করতে সেটা shell profile-এ যোগ করতে হবে।</p>

<h3>Owner ও Group বদলানো — chown / chgrp</h3>
<pre><span class="c">$</span> sudo chown alice deploy.sh          <span class="c"># owner বদলে alice</span>
<span class="c">$</span> sudo chown alice:devteam deploy.sh  <span class="c"># owner ও group একসাথে বদলানো</span>
<span class="c">$</span> chgrp devteam deploy.sh             <span class="c"># শুধু group বদলানো</span></pre>
<div class="callout why"><span class="tag">কেন শুধু root file-এর owner বদলাতে পারে</span>
নিজের file-এর group নিজের সদস্য অন্য যেকোনো group-এ বদলানো একজন সাধারণ user করতে পারে (নিজের group membership-এর সীমার মধ্যে) — কিন্তু owner বদলানোর ক্ষমতা শুধু root-এর হাতে। কারণটা accounting-ভিত্তিক: যদি সাধারণ user নিজের file-এর ownership অন্য কারো নামে বদলে দিতে পারত, তাহলে সে disk quota ফাঁকি দিতে পারত (নিজের বড় ফাইল অন্য user-এর নামে "গছিয়ে দেওয়া", যাতে তার quota-তে না গোনে) অথবা কোনো ক্ষতিকর কাজের দায় অন্যের ঘাড়ে চাপাতে পারত। Ownership transfer-কে root-এর হাতে সীমাবদ্ধ রাখা এই দুই ধরনের অপব্যবহার রোধ করে।</div>

<h3>sudo বনাম সরাসরি root লগইন — শুধু কম টাইপ করা নয়</h3>
<p><span class="kw">sudo</span>-কে অনেকে ভাবেন শুধু "প্রতিবার <code>su</code> করে root password দেওয়ার ঝামেলা এড়ানোর শর্টকাট" — বাস্তবে এটা একটা সম্পূর্ণ ভিন্ন security model। <code>/etc/sudoers</code> ফাইলে নির্দিষ্ট user বা group-কে অনুমতি দেওয়া থাকে — তারা কোন command, কোন user হিসেবে (সাধারণত root, কিন্তু যেকোনো user-ও হতে পারে) চালাতে পারবে। প্রতিটা <code>sudo</code> command syslog/journal-এ পুরো audit trail সহ লগ হয় — কে, কখন, কোন command চালিয়েছে।</p>
<pre><span class="c">$</span> sudo systemctl restart nginx
<span class="c"># /var/log/auth.log (বা journalctl) -এ রেকর্ড হয়:</span>
<span class="c">#   alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/bin/systemctl restart nginx</span></pre>
<div class="callout why"><span class="tag">সরাসরি root হিসেবে লগইন করলে কী হারায়</span>
কেউ সরাসরি root-এর password দিয়ে লগইন করলে, root shell-এর ভেতরে যা-ই করুক না কেন — সবই "root" হিসেবে রেকর্ড হয়, নির্দিষ্ট কোন <b>মানুষ</b> সেই কাজ করেছে তার কোনো চিহ্ন থাকে না। একাধিক admin যদি root password শেয়ার করে, তাহলে কোনো ভুল বা সন্দেহজনক কাজের পর "কে করেছিল" পুনর্গঠন করা প্রায় অসম্ভব হয়ে যায়। <code>sudo</code>-তে প্রতিটা user নিজের পরিচয়ে লগইন করে, নিজের পরিচয়েই privileged command চালায় — audit log-এ সবসময় নির্দিষ্ট ব্যক্তির নাম থাকে। এই কারণেই বেশিরভাগ production/enterprise setup-এ root login সরাসরি বন্ধ (SSH-এও <code>PermitRootLogin no</code>) রাখা হয়, আর সব privileged কাজ sudo দিয়ে করানো হয়।</div>

<h3>setuid, setgid, Sticky Bit — সাময়িক privilege escalation</h3>
<p>Classic rwx model-এর বাইরে আরও তিনটা বিশেষ bit আছে। সবচেয়ে গুরুত্বপূর্ণ ব্যবহারিক উদাহরণ <span class="kw">setuid</span> দিয়ে বোঝা যাক — <code>passwd</code> command।</p>
<p>একজন সাধারণ user নিজের password বদলাতে চাইলে তাকে <code>/etc/shadow</code> ফাইলে লিখতে হয় — কিন্তু সেই ফাইল শুধুমাত্র root লিখতে পারে (security-এর জন্যই — সেখানে সব user-এর hashed password থাকে)। সমাধান: <code>passwd</code> বাইনারিতে <b>setuid root</b> bit সেট করা থাকে — এর মানে, যখনই কেউ <code>passwd</code> চালায়, process-টা সাময়িকভাবে root-এর privilege নিয়ে চলে (যে ব্যবহারকারী চালাচ্ছে তার নিজের privilege দিয়ে নয়), শুধুমাত্র password বদলানোর ঐ narrow কাজটুকু সম্পন্ন করার জন্য।</p>
<pre><span class="c">$</span> ls -l /usr/bin/passwd
-rwsr-xr-x  1 root root  68208 Feb  6 2024 /usr/bin/passwd
<span class="c">#    ^</span>
<span class="c">#    owner এর 'x' স্থানে 's' — এটাই setuid bit</span></pre>
<div class="callout behind"><span class="tag">setuid আসলে কী নিয়ন্ত্রণ করে</span>
সাধারণত একটা process EUID (effective UID) হিসেবে চালু-করা user-এরই UID পায়। setuid bit থাকলে kernel exec()-এর সময় বাইনারির <b>owner</b>-এর UID-কে সেই process-এর effective UID হিসেবে বসিয়ে দেয় — চালু কে করল তা বিবেচ্য না। এই কারণে setuid bit-যুক্ত প্রতিটা বাইনারিকে খুব সতর্কভাবে দেখা হয়: সেই বাইনারির কোডে কোনো bug/exploit থাকলে তা root privilege-এ চলা একটা bug — attacker সেটা কাজে লাগিয়ে root-এ পৌঁছাতে পারে। এজন্যই প্রয়োজনের বাইরে নিজের কোনো script/binary-তে setuid bit বসানো (<code>chmod u+s script.sh</code>) একটা মারাত্মক ঝুঁকি হিসেবে গণ্য হয় — শুধু <code>passwd</code>, <code>sudo</code>, <code>ping</code>-এর মতো সুচিন্তিতভাবে ডিজাইন করা কয়েকটা বাইনারিতেই এটা যৌক্তিক।</div>
<p><span class="kw">setgid</span> একই নীতি group-এর জন্য কাজ করে; directory-তে বসানো হলে সেই directory-র ভেতরে তৈরি হওয়া নতুন file স্বয়ংক্রিয়ভাবে directory-র group-ই পাবে (creator-এর primary group নয়) — team-shared directory-তে এটা খুব প্রচলিত।</p>
<p><span class="kw">Sticky bit</span> (<code>/tmp</code>-এর classic উদাহরণ) একটা world-writable directory-তে একটা নিরাপত্তা যোগ করে: সাধারণত directory-তে write permission থাকলে যেকোনো user সেখানকার অন্য কারো file মুছে ফেলতে পারত (কারণ delete মূলত directory entry বদলানোর অনুমতি, নিচে দেখেছেন)। sticky bit থাকলে নিয়ম বদলে যায় — শুধুমাত্র <b>ফাইলের নিজের owner</b> (বা root) সেই file মুছতে পারবে, যদিও পুরো directory সবার জন্য writable।</p>
<pre><span class="c">$</span> ls -ld /tmp
drwxrwxrwt  12 root root  4096 Jul 17 10:02 /tmp
<span class="c">#         ^</span>
<span class="c">#         others-এর 'x' স্থানে 't' — sticky bit</span></pre>

<h3>ACL — Owner/Group/Other Model যখন যথেষ্ট নয়</h3>
<p>Classic 9-bit model-এ শুধু একজন owner আর একটা group-এর জন্য আলাদা rule দেওয়া যায় — বাস্তব দুনিয়ায় প্রায়ই দরকার পড়ে "নির্দিষ্ট একজন অতিরিক্ত user-কে read access দাও, কিন্তু group membership বদলাতে চাই না" (হয়তো সেই group-এর বাকি সবাইকেই access দিতে চান না)। <span class="kw">ACL</span> (Access Control List) ঠিক এই ফাঁকটা পূরণ করে — file/directory-প্রতি একাধিক নির্দিষ্ট user/group-এর জন্য আলাদা আলাদা permission যোগ করার সুবিধা।</p>
<pre><span class="c">$</span> setfacl -m u:alice:r report.csv     <span class="c"># alice-কে শুধু read access দাও, group না বদলিয়ে</span>
<span class="c">$</span> getfacl report.csv
<span class="c"># file: report.csv
# owner: bob
# group: finance</span>
user::rw-
user:alice:r--                        <span class="c"># ACL-এ যোগ হওয়া অতিরিক্ত entry</span>
group::r--
mask::r--
other::---</pre>
<div class="callout best"><span class="tag">কখন ACL, কখন সাধারণ group</span>
যদি একটা গোটা team-কে একই access দিতে চান, নতুন group তৈরি করে সেই group-কে file/directory-র owning group বানানোই সহজ ও maintainable — কে group-এর সদস্য তা এক জায়গায় (<code>/etc/group</code>) পরিচালনা করা যায়। ACL তখনই কাজে লাগে যখন ব্যতিক্রম দরকার — "বাকি সব group rule অপরিবর্তিত রেখে, ঠিক একজন নির্দিষ্ট বাইরের ব্যক্তিকে সাময়িক access দাও।" ACL-কে নিয়ম হিসেবে না ভেবে exception হিসেবে ভাবাই ভালো — অতিরিক্ত ব্যবহার করলে কোন file-এ আসলে কার access আছে তা <code>ls -l</code> দেখে বোঝা যায় না (শুধু <code>getfacl</code> দিয়েই বোঝা যায়), যা troubleshooting জটিল করে তোলে।</div>

<div class="callout mistake"><span class="tag">Common mistake — "Permission denied" পেলেই chmod 777 করে ফেলা</span>
Deploy আটকে গেলে বা script চালাতে গিয়ে "Permission denied" দেখলে সবচেয়ে প্রচলিত (আর সবচেয়ে বিপজ্জনক) "quick fix" হলো <code>chmod 777</code> চালিয়ে দেওয়া — এতে error চলে যায়, তাই মনে হয় সমস্যা সমাধান হয়ে গেছে। বাস্তবে এটা সমস্যার কারণ ঠিক না করেই উপসর্গ ঢেকে দেওয়া। <code>777</code> মানে owner/group/others — অর্থাৎ সিস্টেমের <b>প্রত্যেক user এবং প্রত্যেক process</b> — সেই file পড়তে, লিখতে, এবং চালাতে পারবে। এই মেশিনে যদি কোনো একটা service compromise হয় (একটা vulnerable web app-ও যথেষ্ট), সেই attacker-নিয়ন্ত্রিত process সরাসরি সেই file বদলে দিতে বা replace করে ফেলতে পারবে — বিশেষভাবে বিপজ্জনক যদি ফাইলটা কোনো script/config/executable হয়।
<br><br>
সঠিক approach হলো আগে প্রশ্ন করা — <b>কেন</b> permission denied হলো? Owner ভুল (deploy user হিসেবে চালানো হচ্ছে, কিন্তু file-এর owner অন্য কেউ)? Group membership নেই (user সেই group-এর সদস্যই নয়)? নাকি parent directory-তে <code>x</code> bit নেই (উপরে যা দেখেছেন)? এই root cause খুঁজে বের করে ঠিক সেই নির্দিষ্ট সমস্যাটা সমাধান করাই সঠিক fix — <code>chown</code> দিয়ে owner ঠিক করা, <code>usermod -aG</code> দিয়ে group-এ যোগ করা, বা প্রয়োজন অনুযায়ী নির্দিষ্ট bit যোগ করা (<code>chmod g+x</code>), সব খুলে দেওয়া নয়।
</div>

<div class="grid2">
<div class="box"><b>rwx — File-এ</b><br>r = content পড়া, w = content বদলানো, x = program হিসেবে চালানো।</div>
<div class="box"><b>rwx — Directory-তে</b><br>r = listing (<code>ls</code>), w = entry তৈরি/মুছা/rename, x = ভেতরে ঢোকা/traverse।</div>
</div>

<div class="callout best">
<span class="tag">এই চ্যাপ্টারের সারাংশ</span>
প্রতিটা file-এর owner (UID) ও group (GID) থাকে, আর owner/group/others — এই তিন ক্যাটাগরির জন্য আলাদাভাবে rwx সংজ্ঞায়িত। Directory-তে rwx-এর অর্থ file-এর চেয়ে ভিন্ন — এই পার্থক্যটাই permission-সংক্রান্ত সবচেয়ে বেশি বিভ্রান্তির উৎস। <code>chmod</code>/<code>chown</code>/<code>chgrp</code> দিয়ে permission ও ownership পরিবর্তন করা যায়; <code>sudo</code> সেই পরিবর্তনগুলো নিরাপদে, audit trail-সহ করার প্রমিত উপায়। setuid/setgid/sticky bit বিশেষ ক্ষেত্রে সাময়িক privilege elevation বা delete-protection দেয়, আর ACL owner/group/other model-এর সীমা ছাড়িয়ে সূক্ষ্ম নিয়ন্ত্রণ দেয়।
<br><br>
কিন্তু permission শুধু <b>কে ফাইল ছুঁতে পারবে</b> তা নিয়ন্ত্রণ করে — <b>কে কী চালাচ্ছে, কীভাবে সেই running program-কে নিয়ন্ত্রণ করবেন, আর একটা process কীভাবে অন্য process-এর সাথে সম্পর্কিত</b> তা সম্পূর্ণ আলাদা প্রশ্ন। পরের চ্যাপ্টারে (৩. Process Management) দেখবেন <code>passwd</code>-এর মতো একটা program চালু হয়ে কীভাবে একটা <b>process</b>-এ পরিণত হয়, তার নিজের PID, নিজের effective UID (এইখানে যা শিখলেন সেই setuid নীতিই সেখানে process-এর ভেতরে কাজ করে), আর <code>ps</code>/<code>kill</code>/<code>signal</code> দিয়ে সেই process-কে কীভাবে পর্যবেক্ষণ ও নিয়ন্ত্রণ করবেন।
</div>

<h2 class="title">৩. Process Management</h2>
<p class="lead">প্রতিটা কমান্ড, প্রতিটা চলমান সার্ভিস, প্রতিটা background job — সবকিছুই কার্নেলের চোখে একটা <span class="kw">process</span>। এই চ্যাপ্টারে দেখব একটা process আসলে কী, সে কী কী অবস্থায় থাকতে পারে, আর কীভাবে নিরাপদে তার সাথে যোগাযোগ (signal) করা হয় — বিশেষ করে কেন <code>kill -9</code> সবসময় প্রথম পছন্দ হওয়া উচিত না।</p>

<h3>প্রসেস কী — PID, মেমরি, ও প্রসেস ট্রি</h3>
<p>একটা <span class="kw">process</span> হলো একটা প্রোগ্রামের চলমান instance — তার নিজস্ব <b>PID</b> (Process ID), নিজস্ব virtual memory space, নিজস্ব file descriptor টেবিল, আর নিজস্ব execution state আছে। একই বাইনারি (যেমন <code>bash</code>) দুইবার চালালে দুইটা সম্পূর্ণ আলাদা process তৈরি হয় — একটার মেমরি আরেকটা সরাসরি দেখতে পায় না, এটাই process isolation-এর মূল কথা।</p>
<p>প্রতিটা process-এর একটা <b>parent</b> থাকে (PID 1 ছাড়া) — একটা process নতুন process তৈরি করলে (<code>fork()</code>), নতুনটা তার child হয়। এভাবে পুরো সিস্টেমের সব process মিলে একটা গাছ (tree) তৈরি হয়, যার root PID 1। <code>pstree</code> কমান্ড দিয়ে এই সম্পর্ক দেখা যায়।</p>
<pre><span class="c">$ pstree -p 1</span>
systemd(1)─┬─sshd(842)───bash(1201)───dotnet(1450)─┬─{dotnet}(1451)
           │                                        └─{dotnet}(1452)
           ├─nginx(900)─┬─nginx(901)
           │            └─nginx(902)
           └─cron(760)───sh(2210)</pre>
<div class="callout behind"><span class="tag">সামনে যা আসছে — Chapter ৯: systemd</span>
PID 1 হলো কার্নেল বুট হওয়ার পর সরাসরি চালু করা প্রথম process — বেশিরভাগ আধুনিক distro-তে এটা <b>systemd</b>। যদি কোনো process-এর parent মারা যায়, তার child-গুলো এতিম (orphan) হয়ে যায় না — কার্নেল সাথে সাথে তাদের PID 1-এর কাছে <span class="kw">reparent</span> করে দেয়, যাতে প্রতিটা process-এরই সবসময় একটা parent থাকে। systemd ঠিক কীভাবে service চালু, restart, আর dependency manage করে তা বিস্তারিত থাকবে Chapter ৯-এ।</div>

<h3>প্রসেস স্টেট — <code>ps aux</code>-এর STAT কলাম</h3>
<p>একটা process সবসময় CPU-তে চলছে না — বেশিরভাগ সময়ই সে কিছু একটার অপেক্ষায় থাকে। <code>ps aux</code>-এর <b>STAT</b> কলাম এই মুহূর্তের অবস্থা দেখায়।</p>
<pre><span class="c">$ ps aux | head -8</span>

root         1   0.0  0.1  22960 11144 ?        Ss   09:14   0:03 /sbin/init
root       842   0.0  0.2  16612  9876 ?        Ss   09:14   0:00 sshd: /usr/sbin/sshd
rasel     1201   0.0  0.1  11340  5560 pts/0    Ss   09:20   0:00 -bash
rasel     1450   2.3  4.8 812340 98120 pts/0    Sl   09:21   1:47 dotnet MyApi.dll
rasel     1980   0.0  0.0      0     0 ?        Z    09:40   0:00 [dotnet] &lt;defunct&gt;

<tr><th>কোড</th><th>নাম</th><th>মানে</th></tr>
<tr><td>R</td><td>Running</td><td>এই মুহূর্তে CPU-তে চলছে, বা চলার জন্য run queue-তে অপেক্ষমাণ।</td></tr>
<tr><td>S</td><td>Sleeping (interruptible)</td><td>কোনো event-এর (I/O, network, timer) অপেক্ষায় ঘুমিয়ে আছে — একটা signal এলে জেগে উঠতে পারে। বেশিরভাগ idle process এই অবস্থায় থাকে।</td></tr>
<tr><td>D</td><td>Uninterruptible Sleep</td><td>disk বা NFS I/O-এর অপেক্ষায় — এই অবস্থায় signal দিয়েও জাগানো যায় না, এমনকি <code>kill -9</code>-ও কাজ করে না যতক্ষণ না I/O শেষ হয়। অনেক process দীর্ঘসময় D-তে আটকে থাকলে সেটা disk hardware বা storage subsystem-এ সমস্যার ক্লাসিক লক্ষণ।</td></tr>
<tr><td>T</td><td>Stopped</td><td><code>SIGSTOP</code> বা <code>Ctrl+Z</code> দিয়ে সাসপেন্ড করা — CPU একদমই ব্যবহার করছে না, কিন্তু মেমরিতে সংরক্ষিত আছে, <code>SIGCONT</code>/<code>bg</code>/<code>fg</code> দিয়ে আবার চালু করা যায়।</td></tr>
<tr><td>Z</td><td>Zombie</td><td>process নিজে শেষ হয়ে গেছে, কিন্তু process table-এ তার entry এখনো আছে — নিচে বিস্তারিত।</td></tr>

<h3>Zombie process — ভ্রান্ত ধারণা ভাঙা</h3>
<p>"Zombie" নামটা শুনে মনে হতে পারে এটা কোনো আটকে যাওয়া, misbehaving process — বাস্তবে ঠিক উল্টো: <b>zombie process আসলে ইতিমধ্যে মৃত</b>। এটা আর কোনো CPU, মেমরি, বা file descriptor ব্যবহার করছে না।</p>
<div class="callout why"><span class="tag">Zombie আসলে কী</span>
যখন একটা process terminate হয়, তার exit code সাথে সাথে মুছে যায় না — parent process-এর <span class="kw">wait()</span> সিস্টেম কল দিয়ে সেটা read (reap) করা পর্যন্ত process table-এ একটা entry থেকে যায়, যাতে parent জানতে পারে child কীভাবে (কোন exit status নিয়ে) শেষ হলো। এই মাঝের সময়টাতেই process-টা <b>Z (zombie)</b> অবস্থায় দেখা যায়। দু-একটা ক্ষণস্থায়ী zombie সম্পূর্ণ স্বাভাবিক — parent একটু পরেই reap করে ফেলবে, বা parent নিজে মারা গেলে সেই zombie PID 1-এর কাছে reparent হয়ে সাথে সাথেই reap হয়ে যায়। কিন্তু <b>ক্রমাগত বাড়তে থাকা zombie সংখ্যা</b> মানে parent process-এ বাগ আছে — সে কখনো <code>wait()</code> কল করছে না। এটা <code>kill -9</code> দিয়ে "সমাধান" করা যায় না, কারণ zombie already dead — সমাধান হলো parent process-এর কোড ঠিক করা (অথবা parent restart করা, যাতে নতুন parent বা PID 1 বাকি zombie-গুলো reap করে ফেলে)।</div>

<h3>Foreground বনাম Background jobs</h3>
<p>টার্মিনালে একটা কমান্ড চালালে সেটা ডিফল্টভাবে <b>foreground</b>-এ চলে — শেল প্রম্পট আটকে থাকে যতক্ষণ না কমান্ড শেষ হয়। কমান্ডের শেষে <code>&amp;</code> লাগালে সেটা <b>background</b>-এ চলে, প্রম্পট সাথে সাথেই ফিরে আসে।</p>
<pre><span class="c">$ sleep 300 &amp;</span>                <span class="c"># background-এ শুরু</span>
[1] 20481
<span class="c">$ jobs</span>
[1]+  Running                 sleep 300 &amp;
<span class="c">$ some-long-build</span>            <span class="c"># foreground-এ চলছে, হঠাৎ থামাতে চাই</span>
^Z
[2]+  Stopped                 some-long-build
<span class="c">$ bg %2</span>                       <span class="c"># থেমে থাকা job-টা background-এ আবার চালু</span>
[2]+ some-long-build &amp;
<span class="c">$ fg %1</span>                       <span class="c"># sleep 300-কে ফিরিয়ে আনা foreground-এ</span>
sleep 300</pre>
<div class="grid2">
  <div class="box"><b>Ctrl+Z</b><br>Foreground job-কে <span class="kw">suspend</span> করে (Stopped, <code>T</code>) শেলে ফিরিয়ে আনে — job-কে মারে না, শুধু থামিয়ে রাখে।</div>
  <div class="box"><b><code>bg %N</code></b><br>Stopped job-কে background-এ আবার চালু করে — এখন সেটা <span class="badge">Running</span>, কিন্তু শেল প্রম্পট মুক্ত।</div>
  <div class="box"><b><code>fg %N</code></b><br>Background/stopped job-কে আবার foreground-এ আনে — প্রম্পট আটকে যায় job শেষ না হওয়া পর্যন্ত।</div>
  <div class="box"><b><code>jobs</code></b><br>বর্তমান শেল সেশনের সব background/stopped job-এর তালিকা, job number (<code>%1</code>, <code>%2</code>) সহ।</div>
</div>

<h3><code>nohup</code> ও <code>disown</code> — টার্মিনাল বন্ধ করলে job কেন মরে যায়</h3>
<p>একটা টার্মিনাল সেশন বন্ধ করলে (SSH disconnect, terminal window close) — সেই সেশনের সব job, foreground হোক বা background, <span class="kw">SIGHUP</span> সিগন্যাল পায়। ডিফল্ট আচরণ হলো এই সিগন্যালে terminate হয়ে যাওয়া। তাই <code>&amp;</code> দিয়ে background-এ পাঠানো একটা job-ও টার্মিনাল বন্ধ করলে মারা যায় — <code>&amp;</code> শুধু foreground/background আলাদা করে, টার্মিনালের lifecycle থেকে বিচ্ছিন্ন করে না।</p>
<pre><span class="c">$ long-report.sh &amp;</span>          <span class="c"># টার্মিনাল বন্ধ করলেই SIGHUP পেয়ে মারা যাবে</span>
[1] 20990
<span class="c">$ exit</span>                        <span class="c"># সেশন বন্ধ — শেল তার সব job-কে SIGHUP পাঠায়</span>

<span class="c"># সমাধান ১: শুরু থেকেই SIGHUP থেকে সুরক্ষিত রাখা</span>
$ nohup ./deploy.sh &gt; deploy.log 2&gt;&amp;1 &amp;

<span class="c"># সমাধান ২: ইতিমধ্যে চলমান job-কে সেশন থেকে বিচ্ছিন্ন করা</span>
$ disown -h %1</pre>
<p><span class="kw">nohup</span> কমান্ডটাকে SIGHUP ignore করতে বলে শুরু থেকেই এবং stdout/stderr কে টার্মিনাল থেকে সরিয়ে ফাইলে রিডাইরেক্ট করে (তাই <code>&gt; deploy.log 2&gt;&amp;1</code> সাধারণত সাথেই থাকে)। <span class="kw">disown</span> ইতিমধ্যে চলতে থাকা একটা job-কে শেলের job table থেকে সরিয়ে দেয়, ফলে শেল বন্ধ হলে সেই job-কে আর SIGHUP পাঠানো হয় না — production-এ দুটোই সাধারণত <code>systemd</code> service বা <code>tmux</code>/<code>screen</code> দিয়ে এড়ানো হয়, কিন্তু quick one-off task-এর জন্য এগুলো জানা জরুরি।</p>

<h3>Signal — কার্নেলের asynchronous নোটিফিকেশন ব্যবস্থা</h3>
<p><span class="kw">Signal</span> হলো কার্নেলের একটা process-কে asynchronously কিছু জানানোর মেকানিজম — "কেউ Ctrl+C চেপেছে", "টার্মিনাল বন্ধ হয়ে গেছে", "কেউ তোমাকে থামতে বলেছে"। process নিজে থেকে polling করে এসব জানে না — কার্নেল সরাসরি তাকে ইন্টারাপ্ট করে জানিয়ে দেয়।</p>
<div class="diagram"><pre>
শেল থেকে সিগন্যাল পাঠানো — একটা নির্দিষ্ট PID-কে টার্গেট করে:

systemd(1)
├─ sshd(842)
│   └─ bash(1201)
│       └─ dotnet(1450)  MyApi.dll        ◀── টার্গেট
│           ├─ dotnet(1451)  worker pool

<div class="callout why"><span class="tag">কেন SIGKILL/SIGSTOP কখনো catch করা যায় না?</span>
সাধারণ signal (SIGTERM, SIGINT, SIGHUP) কার্নেল প্রসেসের নিজস্ব <span class="kw">signal handler</span>-এ ডেলিভার করে — process চাইলে সেটা catch করে নিজের মতো react করতে পারে, এমনকি ignore পর্যন্ত করতে পারে। কিন্তু <b>SIGKILL (9)</b> ও <b>SIGSTOP</b>-এর ক্ষেত্রে কার্নেল কোনো handler-এর জন্য অপেক্ষা করে না — এই দুটো user-space process code-এ পৌঁছানোর আগেই কার্নেল নিজে scheduler-স্তরে সরাসরি কার্যকর করে ফেলে (process-কে run queue থেকে সরিয়ে/terminate করে দেয়)। তাই কোনো bug, কোনো "catch সব signal" কোড — কিছুই SIGKILL ঠেকাতে পারে না; এটাই একে শেষ অস্ত্র বানায়, কিন্তু বিপজ্জনকও বানায়।</div>

<h3>SIGTERM আগে, SIGKILL পরে — সঠিক শাটডাউন ক্রম</h3>
<p>একটা misbehaving বা অলস process বন্ধ করার সঠিক ক্রম সবসময় একই: প্রথমে ভদ্র অনুরোধ, তারপরই কেবল জোর।</p>
<pre><span class="c">$ kill -15 1450</span>              <span class="c"># SIGTERM — ভদ্র অনুরোধ, প্রসেস নিজে cleanup করে exit করবে</span>
$ sleep 5
$ ps -p 1450                       <span class="c"># এখনো বেঁচে আছে কিনা যাচাই</span>
$ kill -9 1450                     <span class="c"># শুধু তখনই — SIGKILL, শেষ অস্ত্র</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — রিফ্লেক্সে <code>kill -9</code> ব্যবহার</span>
Process আটকে গেলে সরাসরি <code>kill -9</code> চালানো প্রলুব্ধকর — কাজ তো হয়েই যায়, সাথে সাথে। কিন্তু SIGKILL process-কে cleanup-এর <b>কোনো সুযোগই দেয় না</b> — কোনো file flush নেই, কোনো transaction commit/rollback নেই, কোনো child process-কে সঠিকভাবে বিদায় জানানো নেই। একটা database বা app যদি ঠিক mid-write অবস্থায় SIGKILL খায়, তাহলে ডেটা ফাইল corrupt হতে পারে বা transaction অসম্পূর্ণ অবস্থায় থেকে যেতে পারে — পরের বার চালু হওয়ার সময় দীর্ঘ crash-recovery প্রয়োজন হতে পারে, কিছু ক্ষেত্রে ডেটা ক্ষতিও হতে পারে। নিয়ম সহজ: আগে SIGTERM, কয়েক সেকেন্ড অপেক্ষা, এরপরও process মরে না গেলে <b>কেবল তখনই</b> SIGKILL।</div>
<div class="callout best"><span class="tag">Best practice — শাটডাউন ক্রম</span>
কোনো long-running service বন্ধ করার আগে সবসময় ভাবুন: এই process কি একটা open transaction, socket connection, বা file write-এর মাঝখানে আছে? যদি হ্যাঁ — SIGTERM পাঠান, একটা যুক্তিসঙ্গত timeout দিন (৫-৩০ সেকেন্ড, workload অনুযায়ী), তারপর <code>ps</code>/<code>kill -0</code> দিয়ে যাচাই করুন এখনো চলছে কিনা। এখনো চললেই কেবল SIGKILL। <code>systemd</code>-এর <code>TimeoutStopSec</code> ঠিক এই প্যাটার্নটাই স্বয়ংক্রিয়ভাবে করে — বিস্তারিত Chapter ৯-এ।</div>

<h3>Live monitoring — <code>top</code>, <code>htop</code>, ও one-off snapshot</h3>
<p><span class="kw">top</span> ও <span class="kw">htop</span> রিয়েল-টাইমে process তালিকা, CPU/মেমরি ব্যবহার, আর process state আপডেট হতে হতে দেখায় — কোনটা resource বেশি খাচ্ছে তা তাৎক্ষণিকভাবে বোঝার জন্য এগুলোই মূল টুল। এদের গভীর ব্যবহার (sorting, filtering, per-core view, tree mode) থাকবে Chapter ১১ (Monitoring)-এ। এখন শুধু একটা one-off, script-friendly snapshot নেওয়ার কমান্ড দেখি।</p>
<pre><span class="c">$ ps aux --sort=-%cpu | head -6</span>   <span class="c"># CPU খরচ অনুযায়ী descending sort — কে সবচেয়ে বেশি খাচ্ছে</span>
USER       PID  %CPU %MEM COMMAND
rasel     1450  38.2  4.8 dotnet MyApi.dll
root      2210  12.1  0.3 tar -xzf backup.tar.gz
root       900   3.4  0.5 nginx: master process
rasel     1201   0.1  0.1 -bash</pre>
<p><code>top</code>/<code>htop</code> ইন্টারঅ্যাক্টিভ পর্যবেক্ষণের জন্য ভালো, কিন্তু script বা log-এ রাখার জন্য <code>ps aux --sort=-%cpu</code> (বা <code>--sort=-%mem</code>) বেশি ব্যবহারযোগ্য — এটা একবার output দিয়ে বেরিয়ে আসে, কোনো interactive session আটকে রাখে না।</p>

<h3>Process Priority — <code>nice</code> ও <code>renice</code></h3>
<p>প্রতিটা runnable process সমান গুরুত্ব নিয়ে CPU-র জন্য প্রতিযোগিতা করে না — kernel-এর scheduler কাকে কতটুকু CPU সময় দেবে ঠিক করার সময় প্রতিটা process-এর একটা <span class="kw">priority</span>ও বিবেচনা করে। এই priority হাতে নিয়ন্ত্রণ করার হাতিয়ার হলো <span class="kw">nice value</span> — একটা সংখ্যা <code>-20</code> (সর্বোচ্চ priority, CPU-র সবচেয়ে বেশি দাবিদার) থেকে <code>+19</code> (সর্বনিম্ন priority — অন্যদের আগে যেতে দেয়, তাই "nice/ভদ্র") পর্যন্ত। ডিফল্ট nice value <code>0</code>।</p>
<pre><span class="c"># নতুন প্রসেস কম priority (বেশি nice value) নিয়ে শুরু করা — CPU-ভারী background job-এর জন্য আদর্শ</span>
$ nice -n 10 ./generate-report.sh

<span class="c"># ইতিমধ্যে চলমান একটা প্রসেসের priority বদলানো</span>
$ renice -n 15 -p 3021</pre>
<div class="callout why"><span class="tag">সাধারণ user শুধু nice বাড়াতে পারে, কমাতে পারে না কেন</span>
একজন সাধারণ user নিজের process-এর nice value বাড়াতে (কম priority নিতে) বাধাহীনভাবে পারে, কিন্তু কমাতে (বেশি priority দাবি করতে) পারে না root ছাড়া। কারণটা fairness-ভিত্তিক — যদি যেকোনো user নিজের প্রতিটা process-কে সর্বোচ্চ priority (<code>-20</code>) দিতে পারত, একজন user-ই পুরো সিস্টেমের CPU অন্য সবার থেকে কেড়ে নিজের কাজে ব্যবহার করে ফেলতে পারত। নিজের কাজকে ইচ্ছাকৃতভাবে কম গুরুত্বপূর্ণ ঘোষণা করা (nice বাড়ানো) কারো ক্ষতি করে না, তাই সেটা যে কেউ করতে পারে — কিন্তু নিজের কাজকে বেশি গুরুত্বপূর্ণ ঘোষণা করা (nice কমানো) অন্যদের CPU-বঞ্চিত করতে পারে, তাই এটা root-এর সিদ্ধান্তে সীমাবদ্ধ।
</div>
<p>একটু পরে এই চ্যাপ্টারেই <code>top</code>-এর আউটপুটে <code>PR</code> (kernel-এর হিসাব করা প্রকৃত scheduling priority) ও <code>NI</code> (আপনার সেট করা nice value) কলাম দুটো ঠিক এই একই জিনিস দেখাবে — একটা CPU-ভারী batch job (log compression, report generation) চালানোর আগে <code>nice -n 10</code> দিয়ে শুরু করাটা ভালো অভ্যাস, যাতে interactive/latency-sensitive প্রসেস (যেমন একটা ওয়েব রিকোয়েস্ট হ্যান্ডলার) CPU পেতে দেরি না করে।</p>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
প্রতিটা process-এর একটা PID, একটা parent, আর একটা state (R/S/D/T/Z) আছে — <code>ps aux</code>-এর STAT কলাম পড়তে জানলে সিস্টেমের স্বাস্থ্য সম্পর্কে অনেক কিছু বোঝা যায় (অনেক D মানে disk সমস্যা, বাড়তে থাকা Z মানে parent-এর বাগ)। Job control (<code>&amp;</code>, <code>jobs</code>, <code>fg</code>/<code>bg</code>, <code>nohup</code>/<code>disown</code>) দিয়ে টার্মিনাল সেশনের সাথে process-এর সম্পর্ক নিয়ন্ত্রণ করা যায়, আর signal (বিশেষ করে SIGTERM বনাম SIGKILL) দিয়ে process-কে নিরাপদে বন্ধ করা যায় — সবসময় ভদ্র অনুরোধ আগে, জোরপূর্বক শেষ অস্ত্র পরে। এই "কমান্ড চালানো, তার output ধরে রাখা, দরকার হলে নিয়ন্ত্রিতভাবে বন্ধ করা" — ঠিক এই দক্ষতাগুলোই পরের চ্যাপ্টারে (৪. Bash Scripting) একসাথে জোড়া লেগে স্বয়ংক্রিয় script-এ রূপ নেবে, যেখানে প্রতিটা কমান্ডের exit code, output, আর সিগন্যাল-হ্যান্ডলিং প্রোগ্রামেটিকভাবে নিয়ন্ত্রণ করা শিখবেন।</div>
</template>

<template data-page="bashscripting">
<h2 class="title">৪. Shell Scripting ও Bash Essentials</h2>
<p class="lead">টার্মিনালে একটার পর একটা কমান্ড টাইপ করা আর সেই একই কমান্ডগুলোকে একটা ফাইলে লিখে বারবার নির্ভরযোগ্যভাবে চালানো — এই দুইয়ের মধ্যেই পার্থক্য গড়ে দেয় <span class="kw">bash script</span>। এই চ্যাপ্টারে দেখব কীভাবে একটা script নিরাপদ, predictable আর অন্য কারও মেশিনেও ঠিকঠাক চলার মতো করে লেখা যায় — কারণ প্রোডাকশনে একটা "কাজ করা" script আর একটা "নির্ভরযোগ্য" script এক জিনিস না।</p>

<h3>Shebang — ইন্টারপ্রেটার বেছে নেওয়ার নির্দেশ</h3>
<p>যেকোনো bash script-এর প্রথম লাইন সাধারণত হয় একটা <span class="kw">shebang</span> — <code>#!</code> দিয়ে শুরু হওয়া একটা বিশেষ লাইন যা kernel-কে বলে দেয় এই ফাইলটা চালাতে কোন ইন্টারপ্রেটার ব্যবহার করতে হবে। ফাইলটা যখন executable হিসেবে (<code>./script.sh</code>) চালানো হয়, kernel প্রথম লাইনটা পড়ে সেই ইন্টারপ্রেটারকে invoke করে আর script ফাইলটাকে তার argument হিসেবে পাস করে দেয়।</p>
<pre><span class="c"># সাধারণ, কিন্তু ভঙ্গুর পদ্ধতি — bash যে এই path-এই আছে তা ধরে নেওয়া হচ্ছে</span>
#!/bin/bash

<span class="c"># বেশি পোর্টেবল পদ্ধতি — env দিয়ে PATH থেকে bash খুঁজে বের করা হয়</span>
#!/usr/bin/env bash</pre>
<p><code>#!/bin/bash</code> ধরে নেয় bash ঠিক <code>/bin/bash</code>-এই আছে। বেশিরভাগ Linux distro-তে এটা সত্যি, কিন্তু macOS-এ (Homebrew দিয়ে installed নতুন bash version), কিছু BSD সিস্টেমে, বা এমন কোনো environment-এ যেখানে bash অন্য কোথাও (যেমন <code>/usr/local/bin/bash</code>) ইনস্টল করা — এই hardcoded path fail করবে। <code>#!/usr/bin/env bash</code> এর বদলে <code>env</code> কমান্ডকে চালায়, যেটা user-এর <span class="kw">PATH</span> ভেরিয়েবল অনুযায়ী খুঁজে প্রথম <code>bash</code> executable-টা বের করে চালায় — তাই এটা distro বা machine নির্বিশেষে বেশি নির্ভরযোগ্য।</p>
<div class="callout why">
<span class="tag">কেন</span>
Shebang লেখা থাকলেও ফাইলের <b>execute permission bit</b> (chapter ২ থেকে মনে করুন — <code>chmod +x script.sh</code>) না থাকলে <code>./script.sh</code> চলবে না — <code>Permission denied</code> error দেবে। execute bit ছাড়া ফাইলটা শুধু <code>bash script.sh</code> আকারে চালানো যায়, কারণ তখন আপনি explicitly bash-কে বলছেন ফাইলটা পড়তে; shebang-ও ignore হয়ে যায় সেক্ষেত্রে, কারণ আপনি নিজেই ইন্টারপ্রেটার বেছে দিচ্ছেন।
</div>

<h3>Variables — শেল ভ্যারিয়েবল বনাম এনভায়রনমেন্ট ভ্যারিয়েবল</h3>
<p>Bash-এ variable assignment-এ <code>=</code> চিহ্নের দুই পাশে কোনো স্পেস থাকা যাবে না — <code>name = "value"</code> লিখলে bash এটাকে "<code>name</code> নামের একটা command চালাও, argument হিসেবে <code>=</code> আর <code>value</code> পাঠাও" হিসেবে পড়ে ফেলবে এবং <code>command not found</code> error দেবে।</p>
<pre>name="Rasel"          <span class="c"># ঠিক — স্পেস নেই</span>
echo "$name"           <span class="c"># অথবা ${name} — ব্রেসের ভেতরে রাখলে পরের অক্ষরের সাথে গুলিয়ে যাওয়ার ভয় থাকে না</span>
echo "${name}_suffix"  <span class="c"># যেমন এখানে — ${name} না লিখে $name_suffix লিখলে bash "name_suffix" নামের ভ্যারিয়েবল খুঁজত</span></pre>
<p>একটা সাধারণ কনফিউশন হলো shell variable আর environment variable-কে একই জিনিস ভাবা। <span class="kw">export</span> ছাড়া যেকোনো variable কেবল current shell process-এর নিজের মেমোরিতে থাকে — সেই shell থেকে চালানো কোনো child process (আরেকটা script, একটা প্রোগ্রাম) সেটা দেখতে পায় না। <code>export</code> করলে variable-টা process-এর environment block-এ যোগ হয়, যা fork হওয়া প্রতিটা child process ইনহেরিট করে।</p>
<table>
<tr><th>ধরন</th><th>Syntax</th><th>দৃশ্যমানতা</th></tr>
<tr><td>Shell variable</td><td><code>name="Rasel"</code></td><td>শুধু বর্তমান shell-এ; কোনো child process দেখে না</td></tr>
<tr><td>Environment variable</td><td><code>export name="Rasel"</code></td><td>বর্তমান shell + এখান থেকে fork হওয়া সব child process</td></tr>
</table>
<div class="callout mistake">
<span class="tag">সাধারণ ভুল</span>
একটা script-এ variable set করে সেটা <code>export</code> না করে আশা করা যে পরে চালানো অন্য কোনো প্রোগ্রাম বা sub-script সেটা পড়তে পারবে। <code>export</code> ছাড়া variable-টা কার্যত সেই script-এর ভেতরেই বন্দী থাকে — child process-এর কাছে সেটা অস্তিত্বহীন।
</div>

<h3>Command Substitution — কমান্ডের আউটপুট ধরে রাখা</h3>
<p>কোনো কমান্ডের আউটপুট একটা variable-এ জমা রাখতে চাইলে <span class="kw">command substitution</span> ব্যবহার হয়। আধুনিক bash-এ প্রেফার্ড সিনট্যাক্স হলো <code>$(command)</code> — এটা <b>nestable</b>, মানে একটার ভেতরে আরেকটা বসানো যায় পড়তে ও maintain করতে অসুবিধা ছাড়াই। পুরনো backtick সিনট্যাক্স (<code>`command`</code>) এখনও কাজ করে কিন্তু legacy — nest করতে গেলে backslash দিয়ে escape করতে হয়, যা দ্রুত অপঠনযোগ্য হয়ে ওঠে।</p>
<pre><span class="c"># প্রেফার্ড — $(...) সিনট্যাক্স</span>
files=$(ls /var/log)
echo "$files"

<span class="c"># $(...) সহজে nest করা যায়</span>
count=$(echo "$(ls /var/log | wc -l)")

<span class="c"># legacy backtick — একই কাজ, কিন্তু nest করা কষ্টকর</span>
files=`ls /var/log`</pre>

<h3>Script Arguments — Positional Parameters</h3>
<p>Script চালানোর সময় দেওয়া argument গুলো bash স্বয়ংক্রিয়ভাবে numbered variable-এ রাখে।</p>
<table>
<tr><th>Variable</th><th>মানে</th></tr>
<tr><td><code>$0</code></td><td>script-এর নাম নিজেই</td></tr>
<tr><td><code>$1</code>, <code>$2</code> ...</td><td>প্রথম, দ্বিতীয় ... argument</td></tr>
<tr><td><code>$#</code></td><td>মোট কতগুলো argument দেওয়া হয়েছে</td></tr>
<tr><td><code>$@</code></td><td>সব argument, প্রতিটা <b>আলাদা শব্দ</b> হিসেবে</td></tr>
<tr><td><code>$*</code></td><td>সব argument, <b>একটামাত্র শব্দ</b> হিসেবে জোড়া লাগানো (IFS দিয়ে জোড়া)</td></tr>
</table>
<pre>#!/usr/bin/env bash
echo "Script name: $0"
echo "First arg:   $1"
echo "Total args:  $#"

<span class="c"># "$@" ব্যবহার করুন যখন প্রতিটা argument আলাদাভাবে দরকার — যেমন loop-এ</span>
for arg in "$@"; do
  echo "arg -> $arg"
done</pre>
<p>বাস্তব কাজে প্রায় সবসময় <code>"$@"</code> চাইবেন, <code>$*</code> না — কারণ <code>"$@"</code> প্রতিটা argument-কে আলাদা রাখে, স্পেসসহ argument থাকলেও ভেঙে যায় না। <code>$*</code> সবগুলোকে একটা string বানিয়ে ফেলে, যা spaces থাকা argument-এর জন্য সমস্যা তৈরি করে।</p>

<h3>Conditionals</h3>
<p>Bash-এর <code>if</code> সিনট্যাক্স:</p>
<pre>if [ "$count" -eq 0 ]; then
  echo "কোনো ফাইল পাওয়া যায়নি"
fi</pre>
<div class="callout behind">
<span class="tag">পর্দার আড়ালে</span>
<code>[</code> কোনো bash keyword বা operator না — এটা আসলে একটা প্রকৃত <b>command/binary</b> (<code>/usr/bin/[</code>, <code>test</code>-এর symlink)। তাই <code>[ "$count" -eq 0 ]</code>-এ শেষের <code>]</code>-টাও সেই command-এর শেষ argument — এই কারণেই <code>[</code> আর <code>]</code>-এর চারপাশে স্পেস বাধ্যতামূলক। <code>[$count-eq0]</code> বা এমনকি <code>[$count -eq 0]</code> লিখলে shell একে একটামাত্র token হিসেবে পড়বে এবং "command not found" জাতীয় error দেবে।
</div>
<table>
<tr><th>Operator</th><th>মানে</th></tr>
<tr><td><code>-eq</code>, <code>-ne</code>, <code>-lt</code>, <code>-gt</code></td><td>সংখ্যা তুলনা (equal, not-equal, less-than, greater-than)</td></tr>
<tr><td><code>-f path</code></td><td>path-এ একটা regular file আছে কিনা</td></tr>
<tr><td><code>-d path</code></td><td>path-এ একটা directory আছে কিনা</td></tr>
<tr><td><code>-z string</code></td><td>string খালি (zero-length) কিনা</td></tr>
<tr><td><code>-n string</code></td><td>string খালি নয় (non-zero-length) কিনা</td></tr>
</table>
<p>আধুনিক bash script-এ <code>[ ]</code>-এর বদলে <span class="kw">[[ ]]</span> ব্যবহার করাই ভালো অভ্যাস — এটা bash-এর নিজস্ব <b>builtin keyword</b>, external command না, তাই এর আচরণ predictable। <code>[[ ]]</code>-এর ভেতরে সরাসরি <code>&&</code> ও <code>||</code> ব্যবহার করা যায়, pattern matching (<code>[[ "$file" == *.log ]]</code>) সরাসরি সাপোর্ট করে, আর quote না করা variable-এও word-splitting বা globbing-এর surprise হয় না।</p>
<pre><span class="c"># [[ ]] — quote না করলেও নিরাপদ, && সরাসরি ব্যবহারযোগ্য</span>
if [[ -f "$file" && "$file" == *.log ]]; then
  echo "$file একটা .log ফাইল এবং এর অস্তিত্ব আছে"
fi</pre>

<h3>Loops</h3>
<pre><span class="c"># for loop — glob pattern-এর উপর ইটারেট করা</span>
for file in *.log; do
  echo "Processing: $file"
done

<span class="c"># while read — ফাইল থেকে লাইন-বাই-লাইন পড়ার স্ট্যান্ডার্ড, নিরাপদ প্যাটার্ন</span>
while read -r line; do
  echo "Line: $line"
done < file.txt</pre>
<div class="callout why">
<span class="tag">কেন</span>
<code>while read -r line; do ... done &lt; file.txt</code> ফাইল লাইন-বাই-লাইন প্রসেস করার de-facto standard, কারণ এটা মেমোরিতে পুরো ফাইল একসাথে লোড না করে stream হিসেবে পড়ে — বিশাল লগ ফাইলের জন্যেও কাজ করে। <code>-r</code> ফ্ল্যাগ ছাড়া <code>read</code> ডিফল্টভাবে backslash-কে escape character হিসেবে ইন্টারপ্রেট করে, ফলে ফাইলের ভেতরে থাকা backslash (যেমন Windows-style path, বা regex) নিঃশব্দে বদলে যেতে পারে। <code>-r</code> দিলে <code>read</code> লাইনটা raw/literal হিসেবে নেয়, কোনো backslash প্রসেসিং হয় না।
</div>

<h3>Functions</h3>
<pre>backup_file() {
  local src="$1"          <span class="c"># local — শুধু এই function-এর ভেতরে বাঁচে, global scope নোংরা করে না</span>
  local dest="$2"
  cp "$src" "$dest"
  return 0                 <span class="c"># exit code — সফল হলে 0</span>
}

<span class="c"># "রিটার্ন ভ্যালু" পেতে হলে echo করে command substitution দিয়ে ধরতে হয়</span>
get_file_count() {
  local dir="$1"
  local count
  count=$(ls "$dir" | wc -l)
  echo "$count"            <span class="c"># ডেটা "রিটার্ন" করার প্রকৃত উপায়</span>
}

total=$(get_file_count "/var/log")
echo "Total files: $total"</pre>
<div class="callout why">
<span class="tag">কেন</span>
Bash function-এর <code>return</code> শুধু একটা <b>exit code</b> (0–255) রিটার্ন করতে পারে, C বা Python-এর মতো কোনো মান (string, number, list) রিটার্ন করতে পারে না — এটা প্রায়ই ভুল বোঝা হয়। ডেটা "রিটার্ন" করার প্রকৃত উপায় হলো function-এর ভেতর থেকে <code>echo</code> করা এবং caller-এর দিক থেকে সেটাকে <code>$(function_name ...)</code> দিয়ে command substitution-এর মাধ্যমে capture করা। আর <code>local</code> keyword ব্যবহার না করলে function-এর ভেতরের variable ডিফল্টভাবে global scope-এ চলে যায় — বড় script-এ এটা name collision তৈরি করতে পারে।
</div>

<h3>Exit Codes ও Safe Script Header — set -euo pipefail</h3>
<p>প্রতিটা কমান্ড শেষ হওয়ার পর একটা <span class="kw">exit code</span> রেখে যায় — <code>0</code> মানে সফল, non-zero মানে ব্যর্থ। ডিফল্টভাবে bash script একটা কমান্ড fail করলেও থেমে যায় না, পরের লাইনে চলতেই থাকে — যা silent data corruption বা half-completed কাজের জন্ম দিতে পারে। তিনটা <code>set</code> option মিলিয়ে এই আচরণ অনেকটাই নিরাপদ করা যায়।</p>
<table>
<tr><th>Option</th><th>কী করে</th></tr>
<tr><td><code>set -e</code></td><td>যেকোনো কমান্ড non-zero exit code দিলে script সাথে সাথে বন্ধ হয়ে যায়</td></tr>
<tr><td><code>set -u</code></td><td>কোনো undefined variable ব্যবহার করলে error দেয় — টাইপো ধরার জন্য কার্যকর (যেমন <code>$FIEL</code> লিখলে ধরা পড়বে)</td></tr>
<tr><td><code>set -o pipefail</code></td><td>একটা pipeline (<code>a | b | c</code>)-এর মধ্যে যেকোনো একটা কমান্ড fail করলেই পুরো pipeline-কে fail ধরা হয়, শুধু শেষেরটা নয়</td></tr>
</table>
<div class="callout mistake">
<span class="tag">ক্রিটিক্যাল গচা</span>
<code>set -o pipefail</code> ছাড়া একটা pipeline-এর exit code শুধু <b>সবশেষ কমান্ডের</b> exit code হয়। যেমন <code>cat missing_file.txt | grep foo</code> — <code>missing_file.txt</code> না থাকলেও <code>cat</code> fail করবে, কিন্তু <code>grep foo</code>-এর নিজস্ব exit code (কিছু match না পেলেও সেটা একটা "স্বাভাবিক" non-zero, বা match পেলে 0) হয়ে যায় পুরো pipeline-এর ফলাফল। ফলে <code>set -e</code> চালু থাকলেও script "সফল" হয়ে চলতে থাকে, অথচ আসলে input ফাইলটাই পড়া যায়নি। <code>pipefail</code> চালু থাকলে এই ধরনের সাইলেন্ট ব্যর্থতা ধরা পড়ে।
</div>
<pre>#!/usr/bin/env bash
set -euo pipefail   <span class="c"># প্রায় সবসময় ব্যবহার করার মতো একটা নিরাপদ default header</span>

<span class="c"># এখন undefined variable, কোনো কমান্ডের ব্যর্থতা, বা pipeline-এর মাঝের ব্যর্থতা — সবকিছুতেই script থেমে যাবে</span></pre>

<h3>Quoting — সবচেয়ে বেশি বাগ তৈরি করা জায়গা</h3>
<p>Bash-এ তিন ধরনের quoting আচরণ ভিন্ন — আর এটাই সবচেয়ে বেশি production bug-এর উৎস।</p>
<table>
<tr><th>Style</th><th>উদাহরণ</th><th>Variable expansion</th><th>Word-splitting / Globbing</th></tr>
<tr><td>Unquoted</td><td><code>$var</code></td><td>হয়</td><td>স্পেস আর glob character (<code>*</code>, <code>?</code>) দিয়ে ভেঙে যেতে পারে</td></tr>
<tr><td>Double-quoted</td><td><code>"$var"</code></td><td>হয়</td><td>হয় না — পুরো মানটা একটা একক শব্দ হিসেবে থাকে</td></tr>
<tr><td>Single-quoted</td><td><code>'$var'</code></td><td>হয় না — সম্পূর্ণ literal</td><td>প্রযোজ্য না</td></tr>
</table>
<pre><span class="c"># বাগ: unquoted $file — filename-এ স্পেস থাকলে ভেঙে যায়</span>
for file in *.txt; do
  rm $file        <span class="c"># "My Report.txt" হলে rm পায় দুইটা আলাদা argument: "My" আর "Report.txt"</span>
done               <span class="c"># ফলাফল: rm: cannot remove 'My': No such file or directory</span>

<span class="c"># ফিক্স: quote করা</span>
for file in *.txt; do
  rm "$file"       <span class="c"># "My Report.txt" এখন একটামাত্র argument হিসেবে যায়</span>
done</pre>
<div class="callout mistake">
<span class="tag">সাধারণ ভুল</span>
"আমার মেশিনে তো কাজ করছিল" — এই বাগ সাধারণত ধরা পড়ে না, কারণ ডেভেলপমেন্টে ব্যবহার করা টেস্ট ফাইলের নামে স্পেস থাকে না। কিন্তু যেই কেউ <code>invoice 2026.pdf</code> বা <code>My Report.txt</code>-এর মতো নাম দিয়ে ফাইল তৈরি করবে, unquoted <code>$file</code>-নির্ভর for-loop বা <code>rm</code> কমান্ড সেই ফাইলনামকে একাধিক শব্দে ভেঙে ফেলবে (word-splitting) — ফলে ভুল ফাইল delete হওয়া, বা "file not found" এর মতো বিভ্রান্তিকর error। নিয়ম সহজ: variable-কে <code>"$var"</code> আকারে quote না করার কোনো কারণ না থাকলে, সবসময় quote করুন।
</div>

<h3>ওয়ার্কড এক্সাম্পল — একটা ছোট Backup Script</h3>
<p>নিচের script উপরের প্রায় সবকিছু এক জায়গায় নিয়ে আসে — safe header, variable, for loop, existence check, আর proper quoting।</p>
<pre>#!/usr/bin/env bash
set -euo pipefail

<span class="c"># --- কনফিগারেশন ---</span>
src_dir="/var/www/myapp/data"
backup_dir="/var/backups/myapp"
timestamp=$(date +%Y%m%d-%H%M%S)
dest="${backup_dir}/backup-${timestamp}.tar.gz"

<span class="c"># --- সোর্স ডিরেক্টরির অস্তিত্ব যাচাই ---</span>
if [[ ! -d "$src_dir" ]]; then
  echo "Error: source directory '$src_dir' পাওয়া যায়নি" >&2
  exit 1
fi

<span class="c"># --- backup ডিরেক্টরি না থাকলে তৈরি করা ---</span>
mkdir -p "$backup_dir"

<span class="c"># --- প্রতিটা .conf ফাইল লগ করে নেওয়া (উদাহরণ হিসেবে quoted loop) ---</span>
for conf in "$src_dir"/*.conf; do
  [[ -f "$conf" ]] || continue    <span class="c"># glob কোনো ফাইল না মিললে literal pattern-ই থাকে, তাই safety check</span>
  echo "Including: $conf"
done

<span class="c"># --- আসল archive তৈরি ---</span>
tar -czf "$dest" -C "$src_dir" .

echo "Backup সম্পন্ন: $dest"</pre>
<div class="callout best">
<span class="tag">ভালো অভ্যাস</span>
এই script-টা যেভাবে লেখা — <code>set -euo pipefail</code>, quoted variable, existence check সহ — ঠিক এই ধরনের script-ই chapter ১৪-এ (Automation ও Cron) নিয়মিত সময়ে চালানোর জন্য <code>crontab</code>-এ শিডিউল করা হবে। Cron-এ চালানো script fail করলে সেটা silent-ই থেকে যায় যদি না ভালোভাবে exit code আর error handling করা থাকে — তাই এই habits গুলো এখনই গড়ে তোলা জরুরি।
</div>

<h2 class="title">৫. Text Processing — grep, sed, awk</h2>
<p class="lead">এতক্ষণ যা শিখেছেন তা এক-একটা আলাদা কমান্ড। এই চ্যাপ্টার দেখাবে সেগুলোকে <span class="kw">pipe</span> দিয়ে জোড়া লাগিয়ে কীভাবে বড় বিশ্লেষণের কাজ করা যায় — নতুন কোনো প্রোগ্রাম না লিখেই। Log পড়া, deployment script লেখা, বা প্রোডাকশনে হঠাৎ কিছু investigate করা — এসবের সিংহভাগ <span class="kw">grep</span>, <span class="kw">sed</span>, আর <span class="kw">awk</span>-এর সমন্বয়েই হয়।</p>

<h3>Unix দর্শন — ছোট টুল, বড় pipeline</h3>
<p>Linux-এর কোর টুলগুলো ইচ্ছাকৃতভাবে "ছোট" রাখা হয়েছে — <code>grep</code> শুধু খোঁজে, <code>sed</code> শুধু বদলায়, <code>awk</code> শুধু field নিয়ে কাজ করে। কোনোটাই একা একটা পূর্ণাঙ্গ log-analysis টুল নয়। কিন্তু এই ছোট টুলগুলোকে pipe (<code>|</code>) দিয়ে জোড়া লাগালে একটা <b>assembly line</b> তৈরি হয় — একটার আউটপুট আরেকটার ইনপুট হিসেবে ঢুকে যায়, আর জটিল বিশ্লেষণ কয়েকটা কমান্ডের একটা লাইনেই হয়ে যায়।</p>
<div class="callout why"><span class="tag">কেন এর জন্য আলাদা প্রোগ্রাম লিখব না</span>
কোনো লগ ফাইলে গতকালের সব ERROR কোন সময়ে সবচেয়ে বেশি হয়েছে — এটা বের করতে একটা Python/C# script লেখা যায়, কিন্তু সেটা লিখতে, টেস্ট করতে, ডিপ্লয় করতে সময় লাগে। একই কাজ <code>grep</code>, <code>awk</code>, <code>sort</code>, <code>uniq</code> জোড়া লাগিয়ে এক লাইনে, দশ সেকেন্ডে করা যায় — আর এই টুলগুলো প্রতিটা Linux সিস্টেমে আগে থেকেই থাকে, ইনস্টল করারও দরকার নেই। এই দর্শনই (small tools, composed via pipes) সিদ্ধান্ত নেয় কেন এখনো, দশকের পর দশক পরেও, প্রোডাকশন ইনসিডেন্টে প্রথম হাতিয়ার একটা shell pipeline, একটা কাস্টম script নয়।</div>

<p><code>command1 | command2</code> লিখলে command1-এর <b>stdout</b> সরাসরি command2-এর <b>stdin</b>-এ চলে যায় — মাঝে কোনো ফাইল লেখা-পড়া হয় না, দুটো process একসাথে, streaming ভাবে চলে। এর পাশাপাশি redirection অপারেটরগুলো মনে করিয়ে নেওয়া দরকার, কারণ পরের সব উদাহরণে এগুলোই বারবার আসবে:</p>
<pre><span class="c"># stdout redirect</span>
./deploy.sh &gt; out.log              <span class="c"># stdout ওভাররাইট করে out.log-এ লেখে (আগের কনটেন্ট মুছে যায়)</span>
./deploy.sh &gt;&gt; out.log             <span class="c"># stdout append করে out.log-এর শেষে যোগ করে</span>

<span class="c"># stderr আলাদাভাবে redirect</span>
./deploy.sh 2&gt; err.log             <span class="c"># শুধু stderr err.log-এ যায়, stdout টার্মিনালেই দেখা যায়</span>

<span class="c"># দুটোই একসাথে — কিন্তু ক্রম গুরুত্বপূর্ণ!</span>
./deploy.sh &gt; out.log 2&gt;&amp;1        <span class="c"># stdout ও stderr — দুটোই out.log-এ যায়</span></pre>

<div class="diagram"><pre>
./deploy.sh &gt; out.log 2&gt;&amp;1              ./deploy.sh 2&gt;&amp;1 &gt; out.log
বাম থেকে ডানে পড়ুন:                        বাম থেকে ডানে পড়ুন:
──────────────────────────                ──────────────────────────
১) stdout → out.log-এ redirect হলো         ১) stderr → এখন stdout যা নির্দেশ করছে
২) 2&gt;&amp;1 মানে "stderr এখন stdout             সেখানে (এখনো টার্মিনাল!) কপি হলো
   যেখানে যাচ্ছে সেখানেই যাক" — অর্থাৎ        ২) stdout → out.log-এ redirect হলো
   stderr-ও out.log-এ যায়                  ── ফলাফল: stdout ফাইলে যায়, stderr
── ফলাফল: stdout ও stderr দুটোই                টার্মিনালেই থেকে যায় — উদ্দেশ্য
   out.log-এ, কিছুই হারায় না                   ব্যর্থ!
</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — redirection-এর ক্রম উলটে ফেলা</span>
<code>2&gt;&amp;1</code>-এর মানে "stderr-কে ঠিক সেই জায়গায় পাঠাও যেখানে <b>এই মুহূর্তে</b> stdout যাচ্ছে" — এটা future-এর কোনো redirect-কে বোঝে না, শুধু <b>বাম থেকে ডানে যে মুহূর্তে</b> এই টোকেনটা প্রসেস হয় তখনকার অবস্থা কপি করে। তাই <code>cmd &gt; file 2&gt;&amp;1</code>-এ প্রথমে stdout file-এ যায়, তারপর stderr সেই একই file-কে অনুসরণ করে — দুটোই file-এ। কিন্তু <code>cmd 2&gt;&amp;1 &gt; file</code>-এ প্রথমে stderr টার্মিনাল (stdout-এর তৎকালীন গন্তব্য)-এ কপি হয়ে যায়, <b>তারপর</b> stdout file-এ সরে যায় — ফলে stderr টার্মিনালেই থেকে যায়, file-এ শুধু stdout। Deployment script debug করার সময় এই ভুল ক্রমের কারণে "error log-এ কিছুই নেই" জাতীয় বিভ্রান্তি হয় — অথচ error আসলে টার্মিনালেই ছাপা হয়েছিল, শুধু capture হয়নি।</div>

<h3>grep — প্যাটার্ন দিয়ে খোঁজা</h3>
<p>grep (Global Regular Expression Print) একটা ফাইল বা stream-এর মধ্যে একটা pattern-এর সাথে মেলে এমন লাইন খুঁজে বের করে। Log investigation-এর সবচেয়ে ঘন ব্যবহৃত flag কয়েকটা:</p>
<table>
<tr><th>flag</th><th>কাজ</th></tr>
<tr><td><code>-i</code></td><td>Case-insensitive খোঁজা — বড়/ছোট হাতের অক্ষর উপেক্ষা করে</td></tr>
<tr><td><code>-r</code>, <code>-R</code></td><td>ডিরেক্টরির ভেতরে recursive খোঁজা (সব subdirectory-সহ)</td></tr>
<tr><td><code>-v</code></td><td>Invert match — pattern-এর সাথে <b>না</b>-মেলা লাইনগুলো দেখায়</td></tr>
<tr><td><code>-n</code></td><td>প্রতিটা match-এর সাথে ফাইলের লাইন নম্বর দেখায়</td></tr>
<tr><td><code>-c</code></td><td>Match হওয়া লাইনের সংখ্যা গোনে, লাইনগুলো নিজে না দেখিয়ে</td></tr>
<tr><td><code>-E</code></td><td>Extended Regular Expression (ERE) চালু করে — নিচে regex সেকশনে বিস্তারিত</td></tr>
<tr><td><code>-A n</code> / <code>-B n</code> / <code>-C n</code></td><td>Match-এর পরে (After) / আগে (Before) / দুই পাশে (Context) <code>n</code> লাইন অতিরিক্ত দেখায়</td></tr>
</table>

<p>বাস্তব উদাহরণ — একটা application log-এ ERROR লাইন কোন প্রসঙ্গে ঘটেছে সেটা বোঝার জন্য প্রতিটা match-এর চারপাশে ৩ লাইন context নিয়ে দেখা:</p>
<pre><span class="c"># app.log-এর একাংশ</span>
2026-07-17 09:12:01 INFO  Request GET /api/orders 200 42ms
2026-07-17 09:12:03 ERROR Database connection timeout after 5000ms
2026-07-17 09:12:03 ERROR Retrying connection (attempt 1/3)
2026-07-17 09:12:04 INFO  Request GET /api/health 200 3ms
2026-07-17 09:12:05 ERROR Database connection timeout after 5000ms

<span class="c"># ERROR-এর চারপাশে ৩ লাইন context, সাথে লাইন নম্বর</span>
$ grep -n -C 3 "ERROR" app.log
2:2026-07-17 09:12:01 INFO  Request GET /api/orders 200 42ms
3:2026-07-17 09:12:03 ERROR Database connection timeout after 5000ms
4:2026-07-17 09:12:03 ERROR Retrying connection (attempt 1/3)
5:2026-07-17 09:12:04 INFO  Request GET /api/health 200 3ms
6:2026-07-17 09:12:05 ERROR Database connection timeout after 5000ms</pre>
<p>এখানে <code>-C 3</code> না দিলে শুধু ৩টা ERROR লাইনই দেখা যেত — INFO লাইন দুটো (context) হারিয়ে যেত, আর বোঝা যেত না timeout-এর ঠিক আগে/পরে সিস্টেমে আর কী ঘটছিল। এটাই <code>-A</code>/<code>-B</code>/<code>-C</code>-এর আসল কাজ — একটা error-কে বিচ্ছিন্নভাবে না দেখে তার আশপাশের প্রসঙ্গসহ দেখা।</p>

<pre><span class="c"># শুধু গোনা, লাইন না দেখিয়ে</span>
$ grep -c "ERROR" app.log
3

<span class="c"># invert match — ERROR ছাড়া বাকি সব লাইন</span>
$ grep -v "ERROR" app.log

<span class="c"># recursive, case-insensitive — পুরো ডিরেক্টরি জুড়ে খোঁজা</span>
$ grep -rin "connection timeout" /var/log/myapp/
/var/log/myapp/app.log:3:2026-07-17 09:12:03 ERROR Database connection timeout after 5000ms</pre>

<h3>sed — Stream Editor</h3>
<p>sed (stream editor)-এর মূল কাজ একটা stream-এর ওপর find-and-replace করা। সবচেয়ে বেশি ব্যবহৃত ফর্ম <code>sed 's/old/new/g'</code> — <code>s</code> মানে substitute, <code>g</code> (global) দিলে প্রতি লাইনের <b>সব</b> মিল বদলায়, না দিলে শুধু প্রতি লাইনের <b>প্রথম</b> মিলটা বদলায়:</p>
<pre><span class="c"># g ছাড়া — প্রতি লাইনে শুধু প্রথম মিল বদলায়</span>
$ echo "ERROR: ERROR: connection failed" | sed 's/ERROR/CRITICAL/'
CRITICAL: ERROR: connection failed

<span class="c"># g সহ — লাইনের সব মিল বদলায়</span>
$ echo "ERROR: ERROR: connection failed" | sed 's/ERROR/CRITICAL/g'
CRITICAL: CRITICAL: connection failed</pre>

<div class="callout behind"><span class="tag">sed পর্দার আড়ালে কী করে — কেন এত বড় ফাইলেও দ্রুত</span>
<code>sed</code> পুরো ফাইলটা মেমরিতে লোড করে না — এটা <b>লাইন-বাই-লাইন</b> stream হিসেবে প্রসেস করে: একটা লাইন পড়ে, তার ওপর pattern প্রয়োগ করে, আউটপুটে লিখে দেয়, তারপর পরের লাইনে যায়। এজন্যই কয়েক GB সাইজের log ফাইলে খোলা vim/nano-তে editor আটকে যেতে পারে (পুরোটা মেমরিতে লোড করার চেষ্টা করে), কিন্তু <code>sed</code> একই ফাইল constant মেমরিতে, প্রায় সাথে সাথেই প্রসেস করে ফেলে। বড় log rotate বা transform করার সময় এজন্যই sed/awk-এর মতো streaming টুল পছন্দ করা হয়, টেক্সট এডিটর নয়।</div>

<p><code>sed</code> ডিফল্টভাবে আউটপুট শুধু stdout-এ দেখায়, মূল ফাইল অপরিবর্তিত থাকে। ফাইল সরাসরি বদলাতে <code>-i</code> (in-place) flag দিতে হয়:</p>
<pre><span class="c"># নিরাপদ পদ্ধতি — আগে dry-run করে stdout-এ দেখুন, ফাইল না ছুঁয়ে</span>
$ sed 's/DEBUG=false/DEBUG=true/' config.env
DEBUG=true
LOG_LEVEL=info

<span class="c"># ঠিক আছে মনে হলে -i দিয়ে সরাসরি ফাইলে লিখুন</span>
$ sed -i 's/DEBUG=false/DEBUG=true/' config.env

<span class="c"># অথবা backup রেখে in-place edit — config.env.bak অটোমেটিক তৈরি হবে</span>
$ sed -i.bak 's/DEBUG=false/DEBUG=true/' config.env</pre>
<div class="callout mistake"><span class="tag">Common mistake — সরাসরি production-এ <code>sed -i</code> চালিয়ে দেওয়া</span>
<code>sed -i</code> ফাইলটা <b>সরাসরি, পার্মানেন্টলি</b> বদলে দেয় — কোনো undo/recycle bin নেই। Pattern-এ একটা ভুল (যেমন খুব বেশি broad একটা match) পুরো ফাইলকে নষ্ট করে দিতে পারে, আর সেটা টের পাওয়ার আগেই deploy/commit হয়ে যেতে পারে। নিরাপদ অভ্যাস: প্রোডাকশন script-এ <code>-i</code> ব্যবহারের আগে (১) প্রথমে <code>-i</code> ছাড়া চালিয়ে stdout-এ diff-এর মতো দেখে নিশ্চিত হোন pattern ঠিক জায়গায় মিলছে, অথবা (২) <code>sed -i.bak</code> দিয়ে একটা automatic backup কপি রেখে দিন যাতে ভুল হলে সাথে সাথে ফিরে যাওয়া যায়।</div>

<p>Pattern নিজে যদি <code>/</code> ধারণ করে (যেমন file path), তাহলে ডিফল্ট <code>/</code> delimiter দিয়ে প্রতিটা <code>/</code> escape করতে হয় — পড়তেও কষ্ট, ভুল হওয়ার সম্ভাবনাও বেশি। এক্ষেত্রে delimiter বদলে ফেলাই সহজ সমাধান:</p>
<pre><span class="c"># ডিফল্ট / delimiter দিয়ে — প্রতিটা / escape করতে হচ্ছে, পড়া কষ্টকর</span>
$ sed 's/\/var\/www\/old-app/\/var\/www\/new-app/g' nginx.conf

<span class="c"># | কে delimiter বানালে — একই কাজ, কোনো escape লাগে না</span>
$ sed 's|/var/www/old-app|/var/www/new-app|g' nginx.conf</pre>
<p><code>sed</code>-এ <code>/</code>-এর কোনো বিশেষ জাদু নেই — এটা শুধু <b>প্রথাগত ডিফল্ট</b> delimiter, <code>s</code>-এর পরের যেকোনো character-ই (যতক্ষণ পুরো কমান্ড জুড়ে consistent থাকে) delimiter হিসেবে চলে — <code>|</code>, <code>#</code>, <code>@</code> — যেটা pattern-এর নিজের ভেতরে থাকার সম্ভাবনা কম, সেটাই বেছে নিন।</p>

<h3>awk — Field-Processing মিনি-ভাষা</h3>
<p>awk-কে শুধু আরেকটা টেক্সট ফিল্টার ভাবলে ভুল হবে — এটা আসলে একটা ছোট প্রোগ্রামিং ভাষা যার মূল মানসিক মডেল: <code>awk</code> ইনপুট <b>লাইন ধরে ধরে</b> পড়ে, প্রতিটা লাইনকে হোয়াইটস্পেস (বা <code>-F</code> দিয়ে বলে দেওয়া কাস্টম delimiter) দিয়ে স্বয়ংক্রিয়ভাবে <b>field</b>-এ ভাগ করে ফেলে — <code>$1</code> প্রথম field, <code>$2</code> দ্বিতীয়, ... আর <code>$0</code> মানে পুরো লাইন অপরিবর্তিত।</p>
<pre><span class="c"># ps aux আউটপুট — প্রতিটা কলাম একটা field</span>
$ ps aux
USER   PID  %CPU %MEM    VSZ    RSS TTY  STAT START   TIME COMMAND
root     1   0.0  0.1  169924  11840 ?    Ss   Jul10   0:12 /sbin/init
rasel 2841  12.4  3.2  892140 263212 ?    Sl   09:01   4:21 dotnet MyApi.dll
rasel 3092   4.1  8.7 1544200 715360 ?    Sl   09:03  12:47 java -jar worker.jar

<span class="c"># শুধু PID (কলাম ২) আর %MEM (কলাম ৪) বের করা</span>
$ ps aux | awk '{print $2, $4}'
PID   %MEM
1     0.1
2841  3.2
3092  8.7

<span class="c"># যেসব process ৫%-এর বেশি মেমরি খাচ্ছে, শুধু তাদের PID/%MEM/COMMAND</span>
$ ps aux | awk '$4 > 5.0 {print $2, $4, $11}'
3092  8.7  java</pre>
<p>শেষ উদাহরণে <code>$4 &gt; 5.0</code> একটা <b>condition</b> — যে লাইনে এই শর্ত সত্যি হয়, শুধু সেই লাইনের জন্যই <code>{print ...}</code> ব্লক চলে। এটাই <code>awk</code>-এর সাধারণ প্যাটার্ন: <code>condition { action }</code>।</p>

<pre><span class="c"># কাস্টম comma-separated লগ ফরম্যাট: timestamp,level,service,duration_ms</span>
2026-07-17T09:12:03,ERROR,orders-api,4210
2026-07-17T09:12:04,INFO,orders-api,38
2026-07-17T09:12:05,ERROR,payments-api,5010

<span class="c"># -F দিয়ে কমাকে delimiter বানিয়ে শুধু service আর level বের করা</span>
$ awk -F',' '{print $3, $2}' requests.csv
orders-api ERROR
orders-api INFO
payments-api ERROR

<span class="c"># duration_ms (কলাম ৪) যোগ করে মোট সময় বের করা — aggregation</span>
$ awk -F',' '{sum += $4} END {print "মোট:", sum, "ms"}' requests.csv
মোট: 9259 ms</pre>
<p>এখানে <code>{sum += $4}</code> প্রতিটা লাইনে চলে (running total রাখে), আর <code>END {...}</code> ব্লক ইনপুট শেষ হওয়ার পরে <b>একবার মাত্র</b> চলে — এভাবেই awk দিয়ে গোনা, যোগ করা, বা গড় বের করার মতো ছোট aggregation করা যায়, আলাদা কোনো script ছাড়াই।</p>

<div class="card"><b>awk-এর কিছু বিল্ট-ইন ভেরিয়েবল, দ্রুত রেফারেন্স</b><br>
<code>$0</code> = পুরো বর্তমান লাইন &nbsp;·&nbsp; <code>$1</code>...<code>$N</code> = ১ম থেকে N-তম field &nbsp;·&nbsp; <code>NF</code> = বর্তমান লাইনে মোট field সংখ্যা &nbsp;·&nbsp; <code>NR</code> = এখন পর্যন্ত পড়া লাইন নম্বর (running count) &nbsp;·&nbsp; <code>-F'delim'</code> = হোয়াইটস্পেসের বদলে কাস্টম field separator</div>

<h3>Regular Expression — বাস্তবে যতটুকু লাগে</h3>
<p>grep, sed, awk তিনটাই <span class="kw">regular expression</span> (regex) দিয়ে pattern মেলায়। প্রতিদিনের কাজে যে কয়েকটা building block বারবার আসে:</p>
<table>
<tr><th>টোকেন</th><th>মানে</th></tr>
<tr><td><code>.</code></td><td>যেকোনো একটা character (newline বাদে)</td></tr>
<tr><td><code>*</code></td><td>ঠিক আগের character/group-এর শূন্য বা তার বেশি বার পুনরাবৃত্তি</td></tr>
<tr><td><code>+</code></td><td>ঠিক আগের character/group-এর এক বা তার বেশি বার (ERE-এ সরাসরি, BRE-এ <code>\+</code>)</td></tr>
<tr><td><code>^</code> / <code>$</code></td><td>লাইনের শুরু / শেষ — anchor, নিজে কোনো character ধরে না</td></tr>
<tr><td><code>[...]</code></td><td>Character class — বন্ধনীর ভেতরের যেকোনো একটা character (যেমন <code>[0-9]</code>, <code>[A-Za-z]</code>)</td></tr>
</table>

<div class="grid2">
<div class="box"><b>Basic Regular Expression (BRE)</b><br><code>grep</code> ও <code>sed</code>-এর ডিফল্ট সিনট্যাক্স। <code>+</code>, <code>?</code>, <code>|</code>, <code>(...)</code>-এর special অর্থ পেতে ব্যাকস্ল্যাশ দিয়ে escape করতে হয় — <code>\+</code>, <code>\?</code>, <code>\|</code>, <code>\(...\)</code>।</div>
<div class="box"><b>Extended Regular Expression (ERE)</b><br><code>grep -E</code> (বা <code>egrep</code>), <code>sed -E</code>, আর <code>awk</code>-এর ডিফল্ট প্যাটার্ন সিনট্যাক্স। <code>+</code>, <code>?</code>, <code>|</code>, <code>(...)</code> সরাসরি বিশেষ অর্থে ব্যবহারযোগ্য, escape লাগে না।</div>
</div>
<pre><span class="c"># BRE (ডিফল্ট grep) — + escape করতে হয়</span>
$ grep 'ERROR\+' app.log

<span class="c"># ERE (-E) — + সরাসরি "এক বা একাধিক" অর্থে</span>
$ grep -E 'timeout|refused|unreachable' app.log</pre>

<div class="callout mistake"><span class="tag">সাধারণ ভুল ধারণা — <code>\d</code>, <code>\w</code> সব জায়গায় কাজ করবে ভাবা</span>
POSIX BRE বা ERE-এ (যা <code>grep</code>, <code>sed</code>, <code>awk</code> ডিফল্টভাবে বোঝে) <code>\d</code> (digit) বা <code>\w</code> (word character) সংজ্ঞায়িতই নেই — এগুলো <b>Perl-Compatible Regular Expression (PCRE)</b>-এর অংশ, যা Perl, Python, বা GNU grep-এর <code>-P</code> flag ব্যবহার করে। সাধারণ <code>grep -E '\d+'</code> চালালে এটা digit খুঁজবে না — literal <code>d</code> অক্ষরটাই (এক বা একাধিকবার) খুঁজবে, কারণ POSIX regex-এ <code>\d</code>-এর কোনো বিশেষ অর্থ না থাকায় ব্যাকস্ল্যাশ উপেক্ষা হয়ে যায়। POSIX regex-এ digit বোঝাতে <code>[0-9]</code> বা <code>[[:digit:]]</code>, word character বোঝাতে <code>[A-Za-z0-9_]</code> ব্যবহার করুন। সত্যিকারের PCRE সিনট্যাক্স দরকার হলে GNU <code>grep -P</code> ব্যবহার করুন, অথবা Perl/Python-এর মতো ভাষায় চলে যান।</div>

<h3>সব একসাথে — একটা বাস্তব investigation pipeline</h3>
<p>এতক্ষণ প্রতিটা টুল আলাদা আলাদা দেখানো হয়েছে — আসল শক্তি বোঝা যায় যখন এগুলো একসাথে জোড়া লাগে। একটা ক্লাসিক প্রশ্ন: "কোন তারিখে সবচেয়ে বেশি ERROR হয়েছে?" এটা এক লাইনেই বের করা যায়:</p>
<pre><span class="c"># app.log-এ কোন তারিখে সবচেয়ে বেশি ERROR হয়েছে</span>
$ grep ERROR app.log | awk '{print $1}' | sort | uniq -c | sort -rn
     42 2026-07-17
     17 2026-07-16
      3 2026-07-15</pre>
<p>প্রতিটা ধাপ ঠিক কী করছে:</p>
<table>
<tr><th>ধাপ</th><th>কাজ</th></tr>
<tr><td><code>grep ERROR app.log</code></td><td>শুধু ERROR-সংবলিত লাইনগুলো বের করে বাকি সব বাদ দেয় (filter)</td></tr>
<tr><td><code>awk '{print $1}'</code></td><td>প্রতিটা বেঁচে থাকা লাইন থেকে শুধু প্রথম field (তারিখ) বের করে (extract)</td></tr>
<tr><td><code>sort</code></td><td>একই মানগুলোকে পাশাপাশি নিয়ে আসে — <code>uniq -c</code> কাজ করার জন্য এটা আবশ্যক, কারণ <code>uniq</code> শুধু <b>পরপর</b> একই লাইন গোনে</td></tr>
<tr><td><code>uniq -c</code></td><td>পরপর একই মানের লাইন কতবার এসেছে তা গোনে</td></tr>
<tr><td><code>sort -rn</code></td><td>গোনা সংখ্যা অনুযায়ী numeric, descending (বেশি থেকে কম) সাজায় — ফলাফল: সবচেয়ে বেশি সমস্যা যেখানে, সেটা সবার উপরে</td></tr>
</table>
<div class="callout best"><span class="tag">"কে/কী সবচেয়ে বেশি ফেইল করছে" — একটা পুনরাবৃত্ত প্যাটার্ন</span>
এই <code>grep | awk | sort | uniq -c | sort -rn</code> কম্বিনেশন শুধু তারিখ গোনার জন্য না — <code>awk</code>-এর field বদলে দিলেই একই pipeline দিয়ে "কোন IP সবচেয়ে বেশি request পাঠাচ্ছে", "কোন service সবচেয়ে বেশি error দিচ্ছে", বা "কোন endpoint সবচেয়ে বেশি হিট হচ্ছে" — সবই বের করা যায়। প্রোডাকশন ইনসিডেন্টে দ্রুত ranked breakdown পেতে এই প্যাটার্নটা মুখস্থ রাখার মতো।</div>
