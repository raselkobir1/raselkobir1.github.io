<template data-page="interview">
<h2 class="title">১৬. Important Interview Queries</h2>
<p class="lead">Interview-এ বারবার ঘুরেফিরে আসা SQL প্রশ্ন — প্রতিটার query + বাংলায় ধাপে ধাপে ব্যাখ্যা "কীভাবে ও কেন কাজ করে"। এগুলো মুখস্থ নয়, <b>বুঝে</b> রাখুন।</p>
<div class="callout behind"><span class="tag">নমুনা schema (উদাহরণে ব্যবহৃত)</span>
<code>employees(id, name, salary, department_id, manager_id)</code> · <code>departments(id, name)</code> · <code>customers(id, name)</code> · <code>orders(id, customer_id, amount, created_at)</code>।</div>

<h3>১) N-তম সর্বোচ্চ salary (2nd highest)</h3>
<pre><span class="c">-- পদ্ধতি ১: DENSE_RANK (সুপারিশ — tie ঠিকভাবে সামলায়)</span>
<span class="k">WITH</span> r <span class="k">AS</span> (
  <span class="k">SELECT</span> salary, <span class="k">DENSE_RANK</span>() <span class="k">OVER</span> (<span class="k">ORDER BY</span> salary <span class="k">DESC</span>) <span class="k">AS</span> rnk
  <span class="k">FROM</span> employees
)
<span class="k">SELECT DISTINCT</span> salary <span class="k">FROM</span> r <span class="k">WHERE</span> rnk = 2;   <span class="c">-- N চাইলে rnk = N</span>

<span class="c">-- পদ্ধতি ২: subquery (window ছাড়া, শুধু 2nd)</span>
<span class="k">SELECT MAX</span>(salary) <span class="k">FROM</span> employees
<span class="k">WHERE</span> salary &lt; (<span class="k">SELECT MAX</span>(salary) <span class="k">FROM</span> employees);</pre>
<p><b>ব্যাখ্যা:</b> <code>DENSE_RANK</code> প্রতিটা distinct salary-কে rank দেয় — tie হলে একই rank, আর পরের নম্বর skip করে না। তাই <code>rnk = 2</code> মানে দ্বিতীয় সর্বোচ্চ salary (একাধিক জন একই সর্বোচ্চ salary পেলেও ঠিক কাজ করে)। পদ্ধতি ২-এ: সর্বোচ্চ salary-র <b>চেয়ে ছোট</b> salary-গুলোর মধ্যে সর্বোচ্চটাই দ্বিতীয় সর্বোচ্চ।</p>

<h3>২) Duplicate row খুঁজে বের করা</h3>
<pre><span class="k">SELECT</span> email, <span class="k">COUNT</span>(*) <span class="k">AS</span> cnt
<span class="k">FROM</span> users
<span class="k">GROUP BY</span> email
<span class="k">HAVING</span> <span class="k">COUNT</span>(*) &gt; 1;</pre>
<p><b>ব্যাখ্যা:</b> <code>email</code> দিয়ে group করে প্রতিটা group-এ কতটা row আছে গুনি। <code>HAVING COUNT(*) &gt; 1</code> মানে যেসব email একাধিকবার আছে — সেগুলোই duplicate। (WHERE নয়, HAVING — কারণ filter-টা aggregate-এর ওপর।)</p>

<h3>৩) Duplicate মুছে একটা রেখে দেওয়া</h3>
<pre><span class="k">WITH</span> d <span class="k">AS</span> (
  <span class="k">SELECT</span> id, <span class="k">ROW_NUMBER</span>() <span class="k">OVER</span> (<span class="k">PARTITION BY</span> email <span class="k">ORDER BY</span> id) <span class="k">AS</span> rn
  <span class="k">FROM</span> users
)
<span class="k">DELETE FROM</span> users <span class="k">WHERE</span> id <span class="k">IN</span> (<span class="k">SELECT</span> id <span class="k">FROM</span> d <span class="k">WHERE</span> rn &gt; 1);</pre>
<p><b>ব্যাখ্যা:</b> প্রতিটা <code>email</code> group-এ <code>ROW_NUMBER</code> দিই (id ছোট থেকে বড়) — group-এর প্রথম row পায় <code>rn = 1</code> (এটা রাখব), বাকি copy গুলো পায় <code>rn &gt; 1</code> (এগুলো duplicate, মুছব)। ফলে প্রতিটা email-এর একটা (সবচেয়ে ছোট id) টিকে থাকে।</p>

<h3>৪) প্রতি group-এ Top-N (প্রতি department-এ top 2 earner)</h3>
<pre><span class="k">WITH</span> r <span class="k">AS</span> (
  <span class="k">SELECT</span> *, <span class="k">DENSE_RANK</span>() <span class="k">OVER</span> (<span class="k">PARTITION BY</span> department_id <span class="k">ORDER BY</span> salary <span class="k">DESC</span>) <span class="k">AS</span> rnk
  <span class="k">FROM</span> employees
)
<span class="k">SELECT</span> * <span class="k">FROM</span> r <span class="k">WHERE</span> rnk &lt;= 2;</pre>
<p><b>ব্যাখ্যা:</b> <code>PARTITION BY department_id</code> প্রতিটা department-কে আলাদা window বানায়; ভেতরে salary অনুযায়ী rank হয়। <code>rnk &lt;= 2</code> নিলে প্রতি department-এর top 2 পাওয়া যায় (একটার top অন্যটার top-কে প্রভাবিত করে না)। "প্রতি X-এ top N" — এই pattern interview-এর সবচেয়ে সাধারণ window প্রশ্ন।</p>

<h3>৫) নিজের manager-এর চেয়ে বেশি salary (Self Join)</h3>
<pre><span class="k">SELECT</span> e.name <span class="k">AS</span> employee, e.salary, m.name <span class="k">AS</span> manager, m.salary <span class="k">AS</span> mgr_salary
<span class="k">FROM</span> employees e
<span class="k">JOIN</span> employees m <span class="k">ON</span> e.manager_id = m.id
<span class="k">WHERE</span> e.salary &gt; m.salary;</pre>
<p><b>ব্যাখ্যা:</b> একটাই <code>employees</code> table-কে দুটো alias-এ (<code>e</code> = কর্মী, <code>m</code> = manager) নিজের সাথে join করি — <code>e.manager_id = m.id</code> দিয়ে প্রতিটা কর্মীর পাশে তার manager-এর তথ্য বসে। তারপর <code>e.salary &gt; m.salary</code> দিয়ে যাদের salary manager-এর চেয়ে বেশি তাদের বাছি।</p>

<h3>৬) Department গড়ের চেয়ে বেশি salary</h3>
<pre><span class="c">-- correlated subquery</span>
<span class="k">SELECT</span> e.* <span class="k">FROM</span> employees e
<span class="k">WHERE</span> e.salary &gt; (
  <span class="k">SELECT</span> <span class="k">AVG</span>(x.salary) <span class="k">FROM</span> employees x <span class="k">WHERE</span> x.department_id = e.department_id
);

<span class="c">-- window (সাধারণত দ্রুত — একবার scan)</span>
<span class="k">SELECT</span> * <span class="k">FROM</span> (
  <span class="k">SELECT</span> *, <span class="k">AVG</span>(salary) <span class="k">OVER</span> (<span class="k">PARTITION BY</span> department_id) <span class="k">AS</span> dept_avg
  <span class="k">FROM</span> employees
) t <span class="k">WHERE</span> salary &gt; dept_avg;</pre>
<p><b>ব্যাখ্যা:</b> correlated subquery প্রতিটা কর্মীর জন্য তার <b>নিজের</b> department-এর গড় salary বের করে তুলনা করে (বাইরের <code>e.department_id</code> ভেতরে ব্যবহৃত)। window version প্রতিটা row-এর পাশে <code>dept_avg</code> বসিয়ে তারপর filter করে — table একবার পড়ে বলে সাধারণত efficient।</p>

<h3>৭) যে customer-এর কোনো order নেই (Anti-Join)</h3>
<pre><span class="c">-- NOT EXISTS (সুপারিশ — NULL-নিরাপদ, পঠনযোগ্য)</span>
<span class="k">SELECT</span> c.* <span class="k">FROM</span> customers c
<span class="k">WHERE NOT EXISTS</span> (<span class="k">SELECT</span> 1 <span class="k">FROM</span> orders o <span class="k">WHERE</span> o.customer_id = c.id);

<span class="c">-- LEFT JOIN ... IS NULL</span>
<span class="k">SELECT</span> c.* <span class="k">FROM</span> customers c
<span class="k">LEFT JOIN</span> orders o <span class="k">ON</span> o.customer_id = c.id
<span class="k">WHERE</span> o.id <span class="k">IS NULL</span>;</pre>
<p><b>ব্যাখ্যা:</b> দুটোই "যেসব customer-এর কোনো order নেই" বের করে। LEFT JOIN সব customer আনে; order না থাকলে order-এর column গুলো NULL হয় — তাই <code>o.id IS NULL</code> দিয়ে সেই order-বিহীন customer ধরি। <code>NOT EXISTS</code> বেশি পঠনযোগ্য এবং <code>NOT IN</code>-এর NULL-ফাঁদ এড়ায়।</p>

<h3>৮) Running Total (ক্রমযোজিত যোগফল)</h3>
<pre><span class="k">SELECT</span> day, revenue,
       <span class="k">SUM</span>(revenue) <span class="k">OVER</span> (<span class="k">ORDER BY</span> day
              <span class="k">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span>) <span class="k">AS</span> running_total
<span class="k">FROM</span> daily_sales;</pre>
<p><b>ব্যাখ্যা:</b> <code>SUM() OVER (ORDER BY day)</code> প্রতিটা row পর্যন্ত (শুরু থেকে current row) সব revenue যোগ করে — অর্থাৎ চলমান মোট। frame স্পষ্ট করা (<code>UNBOUNDED PRECEDING → CURRENT ROW</code>) নিশ্চিত করে ঠিক "এই row পর্যন্ত" যোগ হচ্ছে।</p>

<h3>৯) মোটের শতকরা (Percentage of Total)</h3>
<pre><span class="k">SELECT</span> category, amount,
       <span class="k">ROUND</span>(100.0 * amount / <span class="k">SUM</span>(amount) <span class="k">OVER</span> (), 2) <span class="k">AS</span> pct
<span class="k">FROM</span> sales;</pre>
<p><b>ব্যাখ্যা:</b> খালি <code>OVER ()</code> মানে পুরো result set-এর window — তাই <code>SUM(amount) OVER ()</code> সব row-এর মোট যোগফল (প্রতিটা row-এর পাশে একই মান)। প্রতিটা amount-কে সেই মোট দিয়ে ভাগ করে × 100 = শতকরা। <code>100.0</code> (দশমিক) রাখায় integer division-এ ফলাফল 0 হয়ে যায় না।</p>

<h3>১০) Row → Column ঘোরানো (Pivot / Conditional Aggregation)</h3>
<pre><span class="c">-- portable (PG + SQL Server): CASE</span>
<span class="k">SELECT</span> department_id,
  <span class="k">SUM</span>(<span class="k">CASE WHEN</span> status = <span class="k">'ACTIVE'</span>   <span class="k">THEN</span> 1 <span class="k">ELSE</span> 0 <span class="k">END</span>) <span class="k">AS</span> active,
  <span class="k">SUM</span>(<span class="k">CASE WHEN</span> status = <span class="k">'INACTIVE'</span> <span class="k">THEN</span> 1 <span class="k">ELSE</span> 0 <span class="k">END</span>) <span class="k">AS</span> inactive
<span class="k">FROM</span> employees <span class="k">GROUP BY</span> department_id;

<span class="c">-- PostgreSQL সংক্ষিপ্ত রূপ: FILTER</span>
<span class="k">SELECT</span> department_id,
  <span class="k">COUNT</span>(*) <span class="k">FILTER</span> (<span class="k">WHERE</span> status = <span class="k">'ACTIVE'</span>)   <span class="k">AS</span> active,
  <span class="k">COUNT</span>(*) <span class="k">FILTER</span> (<span class="k">WHERE</span> status = <span class="k">'INACTIVE'</span>) <span class="k">AS</span> inactive
<span class="k">FROM</span> employees <span class="k">GROUP BY</span> department_id;</pre>
<p><b>ব্যাখ্যা:</b> প্রতিটা category-র জন্য একটা করে column বানাই — <code>CASE WHEN</code> দিয়ে শুধু ঐ status-এর row-কে 1 (নাহলে 0) ধরে <code>SUM</code> করি, ফলে ঐ category-র count। এভাবে "status" নামের row-ভিত্তিক মানগুলো আলাদা column-এ ঘুরে যায় (pivot) — কোনো special <code>PIVOT</code> syntax ছাড়াই। PG-তে <code>FILTER</code> এর আরও পরিষ্কার রূপ।</p>

<h3>১১) Sequence-এ ফাঁক খোঁজা (LAG)</h3>
<pre><span class="k">WITH</span> t <span class="k">AS</span> (
  <span class="k">SELECT</span> id, <span class="k">LAG</span>(id) <span class="k">OVER</span> (<span class="k">ORDER BY</span> id) <span class="k">AS</span> prev_id <span class="k">FROM</span> tickets
)
<span class="k">SELECT</span> prev_id + 1 <span class="k">AS</span> gap_start, id - 1 <span class="k">AS</span> gap_end
<span class="k">FROM</span> t <span class="k">WHERE</span> id - prev_id &gt; 1;</pre>
<p><b>ব্যাখ্যা:</b> <code>LAG(id)</code> প্রতিটা row-এর ঠিক <b>আগের</b> id দেয়। বর্তমান id আর আগের id-র পার্থক্য যদি 1-এর বেশি হয়, মাঝে কিছু id অনুপস্থিত — সেটাই gap। <code>prev_id + 1</code> থেকে <code>id - 1</code> পর্যন্ত হলো হারানো range। (LEAD দিলে পরের row দেখা যায়।)</p>

<h3>১২) Median (মধ্যমা)</h3>
<pre><span class="k">SELECT</span> <span class="k">PERCENTILE_CONT</span>(0.5) <span class="k">WITHIN GROUP</span> (<span class="k">ORDER BY</span> salary) <span class="k">AS</span> median_salary
<span class="k">FROM</span> employees;</pre>
<p><b>ব্যাখ্যা:</b> <code>PERCENTILE_CONT(0.5)</code> = ৫০তম percentile = median। <code>WITHIN GROUP (ORDER BY salary)</code> salary-কে sort করে ধরে মাঝের মানটা বের করে (জোড় সংখ্যক হলে দুই মাঝের গড়)। PG ও SQL Server (2012+) দুটোতেই আছে — AVG-এর চেয়ে outlier-এ কম প্রভাবিত।</p>

<h3>১৩) মাস অনুযায়ী report (date grouping)</h3>
<pre><span class="c">-- PostgreSQL</span>
<span class="k">SELECT</span> <span class="k">date_trunc</span>(<span class="k">'month'</span>, created_at) <span class="k">AS</span> month,
       <span class="k">COUNT</span>(*) <span class="k">AS</span> orders, <span class="k">SUM</span>(amount) <span class="k">AS</span> revenue
<span class="k">FROM</span> orders <span class="k">GROUP BY</span> 1 <span class="k">ORDER BY</span> 1;

<span class="c">-- SQL Server</span>
<span class="k">SELECT</span> <span class="k">FORMAT</span>(created_at, <span class="k">'yyyy-MM'</span>) <span class="k">AS</span> month,
       <span class="k">COUNT</span>(*) <span class="k">AS</span> orders, <span class="k">SUM</span>(amount) <span class="k">AS</span> revenue
<span class="k">FROM</span> orders <span class="k">GROUP BY</span> <span class="k">FORMAT</span>(created_at, <span class="k">'yyyy-MM'</span>) <span class="k">ORDER BY</span> month;</pre>
<p><b>ব্যাখ্যা:</b> তারিখকে মাসের শুরুতে "কেটে" (<code>date_trunc</code>) বা <code>'yyyy-MM'</code> format-এ রূপান্তর করে সেই মাস দিয়ে group করি — ফলে প্রতিটা মাসের order সংখ্যা ও মোট revenue পাওয়া যায় (monthly report)।</p>

<div class="callout best"><span class="tag">Interview-এ সোনালি টিপ</span>
<ul style="margin:4px 0">
<li>"প্রতি group-এ top/latest N" শুনলেই → <b>window function</b> (<code>ROW_NUMBER/DENSE_RANK OVER PARTITION BY</code>) ভাবুন।</li>
<li>"যাদের X নেই" → <b>NOT EXISTS</b> / LEFT JOIN IS NULL (anti-join)।</li>
<li>"চলমান/ক্রমযোজিত/আগের-পরের" → <b>SUM/LAG/LEAD OVER</b>।</li>
<li>Duplicate-এ → GROUP BY HAVING (খোঁজা), ROW_NUMBER (মোছা)।</li>
<li>উত্তরের আগে সবসময় <b>edge case</b> বলুন: NULL, tie, খালি group — interviewer এটাই দেখতে চায়।</li>
</ul></div>

<h3>১৪) পরপর দিন Login Streak (Gaps & Islands)</h3>
<pre><span class="k">WITH</span> r <span class="k">AS</span> (
  <span class="k">SELECT</span> user_id, login_date,
         login_date - (<span class="k">ROW_NUMBER</span>() <span class="k">OVER</span> (<span class="k">PARTITION BY</span> user_id <span class="k">ORDER BY</span> login_date)) * <span class="k">INTERVAL</span> <span class="k">'1 day'</span> <span class="k">AS</span> grp
  <span class="k">FROM</span> logins
),
streaks <span class="k">AS</span> (
  <span class="k">SELECT</span> user_id, grp, <span class="k">COUNT</span>(*) <span class="k">AS</span> streak_len,
         <span class="k">MIN</span>(login_date) <span class="k">AS</span> streak_start, <span class="k">MAX</span>(login_date) <span class="k">AS</span> streak_end
  <span class="k">FROM</span> r <span class="k">GROUP BY</span> user_id, grp
)
<span class="k">SELECT</span> user_id, <span class="k">MAX</span>(streak_len) <span class="k">AS</span> longest_streak
<span class="k">FROM</span> streaks <span class="k">GROUP BY</span> user_id <span class="k">ORDER BY</span> longest_streak <span class="k">DESC</span>;</pre>
<p><b>ব্যাখ্যা:</b> এটাই বিখ্যাত "gaps & islands" trick। <code>ROW_NUMBER()</code> প্রতিটা row-এ ১,২,৩… ক্রমিক নম্বর দেয় — টানা (consecutive) দিনগুলোর জন্য <code>login_date</code>-ও ঠিক ১ করে বাড়ে। তাই <code>login_date</code> থেকে সেই ক্রমিক নম্বর (দিনে রূপান্তর করে) বাদ দিলে — টানা প্রতিটা দিনের জন্য একই ধ্রুবক মান (<code>grp</code>) থেকে যায়, যেন একটা "island" চিহ্নিত হলো। এরপর <code>user_id, grp</code> দিয়ে group করে row গুনলেই সেই island-এর দৈর্ঘ্য (streak_len), আর সবচেয়ে বড়টাই longest streak। SQL Server-এ <code>DATEADD(DAY, -ROW_NUMBER() OVER(...), login_date)</code> দিয়ে একই ধারণা।</p>

<h3>১৫) প্রতি department-এ প্রথম ও সর্বশেষ যোগ দেওয়া employee (FIRST_VALUE/LAST_VALUE)</h3>
<pre><span class="k">SELECT DISTINCT</span> department_id,
  <span class="k">FIRST_VALUE</span>(name) <span class="k">OVER</span> (<span class="k">PARTITION BY</span> department_id <span class="k">ORDER BY</span> hire_date) <span class="k">AS</span> first_hired,
  <span class="k">FIRST_VALUE</span>(name) <span class="k">OVER</span> (<span class="k">PARTITION BY</span> department_id <span class="k">ORDER BY</span> hire_date <span class="k">DESC</span>) <span class="k">AS</span> last_hired
<span class="k">FROM</span> employees;</pre>
<p><b>ব্যাখ্যা:</b> <code>FIRST_VALUE</code> প্রতিটা partition (department)-এর window-এর <b>প্রথম</b> row-এর মান দেয় — <code>ORDER BY hire_date</code>-এ সেটাই প্রথম যোগ দেওয়া employee। "শেষ" employee পেতে <code>LAST_VALUE</code> ব্যবহার না করে <b>উল্টো ক্রমে</b> (<code>ORDER BY hire_date DESC</code>) আবার <code>FIRST_VALUE</code> নিলাম — কারণ অধ্যায় ৭-এ দেখা গেছে <code>LAST_VALUE</code>-এর default frame ("current row পর্যন্ত") প্রায়ই ভুল current-row মান ফেরত দেয়, আর সঠিক frame মনে রাখা ঝামেলার। উল্টো-order <code>FIRST_VALUE</code> সেই ফাঁদ এড়িয়ে একই ফল দেয়। প্রতিটা row-এ একই মান বসে বলে শেষে <code>DISTINCT</code> দিয়ে প্রতি department-এর একটাই row রাখা হলো।</p>

<h3>১৬) পূর্ণ organization hierarchy — level ও path সহ (Recursive CTE)</h3>
<pre><span class="k">WITH RECURSIVE</span> org <span class="k">AS</span> (
  <span class="k">SELECT</span> id, name, manager_id, 1 <span class="k">AS</span> lvl, name <span class="k">AS</span> path
  <span class="k">FROM</span> employees <span class="k">WHERE</span> manager_id <span class="k">IS NULL</span>            <span class="c">-- anchor: সবচেয়ে ওপরের বস (CEO)</span>
  <span class="k">UNION ALL</span>
  <span class="k">SELECT</span> e.id, e.name, e.manager_id, o.lvl + 1, o.path || <span class="k">' > '</span> || e.name
  <span class="k">FROM</span> employees e
  <span class="k">JOIN</span> org o <span class="k">ON</span> e.manager_id = o.id                    <span class="c">-- recursive step: পরের স্তর</span>
)
<span class="k">SELECT</span> id, name, lvl, path <span class="k">FROM</span> org <span class="k">ORDER BY</span> path;</pre>
<p><b>ব্যাখ্যা:</b> অধ্যায় ৬-এর recursive CTE উদাহরণ একজন নির্দিষ্ট manager-এর অধীনস্থদের লিস্ট করেছিল; এখানে সেই ধারণাটাই বাড়িয়ে প্রতিটা employee-র <b>depth (lvl)</b> ও পুরো <b>reporting chain (path)</b> বের করা হলো। Anchor member শুরু করে root (<code>manager_id IS NULL</code>, লেভেল ১) দিয়ে; recursive step প্রতিবার আগের ফলাফলের (<code>org</code>) সাথে join করে এক লেভেল নিচে নামে, <code>lvl + 1</code> দিয়ে গভীরতা গোনে আর <code>path</code>-এ নাম জুড়ে পুরো chain তৈরি করে। org-chart UI-তে indentation দেখাতে বা "কে কোন স্তরে" বের করতে এই pattern খুবই কাজের।</p>

<h3>১৭) Salary অনুযায়ী quartile ভাগ করা (NTILE)</h3>
<pre><span class="k">SELECT</span> name, salary,
       <span class="k">NTILE</span>(4) <span class="k">OVER</span> (<span class="k">ORDER BY</span> salary <span class="k">DESC</span>) <span class="k">AS</span> quartile
<span class="k">FROM</span> employees;</pre>
<p><b>ব্যাখ্যা:</b> <code>NTILE(4)</code> সব row-কে (salary অনুযায়ী sorted) প্রায়-সমান ৪টা bucket-এ ভাগ করে — <code>DESC</code> দেওয়ায় quartile 1 হলো সবচেয়ে বেশি salary-র দল। row সংখ্যা ৪ দিয়ে ভাগ না গেলে প্রথম দিকের bucket-গুলো একটা করে বাড়তি row পায়। manual range/CASE না লিখে salary-band/performance-bucket রিপোর্টে এটাই দ্রুততম পথ।</p>

<h3>১৮) Moving Average — ৩ দিনের rolling গড়</h3>
<pre><span class="k">SELECT</span> day, revenue,
       <span class="k">ROUND</span>(<span class="k">AVG</span>(revenue) <span class="k">OVER</span> (<span class="k">ORDER BY</span> day
              <span class="k">ROWS BETWEEN</span> 2 <span class="k">PRECEDING AND CURRENT ROW</span>), 2) <span class="k">AS</span> moving_avg_3d
<span class="k">FROM</span> daily_sales;</pre>
<p><b>ব্যাখ্যা:</b> এখানে frame-টা <b>fixed-width</b> — <code>2 PRECEDING AND CURRENT ROW</code> মানে সবসময় "current row + ঠিক আগের ২টা row" = ৩ দিনের জানালা, যেটা প্রতিটা row-এর সাথে সাথে এগিয়ে যায়। এটা প্রশ্ন ৮-এর running total-এর থেকে আলাদা — সেখানে frame ছিল <code>UNBOUNDED PRECEDING</code> (শুরু থেকে current পর্যন্ত, ক্রমাগত বাড়ে), এখানে frame-এর প্রস্থ স্থির থেকে সরে সরে যায়। ফলে দৈনিক ওঠানামা মসৃণ (smooth) হয়ে একটা trend দেখা যায়।</p>

<h3>১৯) একই salary পাচ্ছেন এমন employee (tie group) খোঁজা</h3>
<pre><span class="k">SELECT</span> salary, <span class="k">COUNT</span>(*) <span class="k">AS</span> cnt, <span class="k">STRING_AGG</span>(name, <span class="k">', '</span>) <span class="k">AS</span> employees
<span class="k">FROM</span> employees
<span class="k">GROUP BY</span> salary
<span class="k">HAVING</span> <span class="k">COUNT</span>(*) &gt; 1
<span class="k">ORDER BY</span> salary <span class="k">DESC</span>;</pre>
<p><b>ব্যাখ্যা:</b> প্রশ্ন ২-এর duplicate-email pattern-টাই এখানে <code>salary</code>-তে প্রয়োগ করা হলো — <code>GROUP BY salary</code> করে যাদের salary সমান তাদের একসাথে জড়ো করি, <code>HAVING COUNT(*) &gt; 1</code> দিয়ে শুধু tie-group রাখি (WHERE নয়, কারণ filter-টা aggregate-এর ওপর)। <code>STRING_AGG</code> সেই group-এর সব নাম কমা দিয়ে জোড়া লাগিয়ে এক row-এ দেখায় — payroll-band audit বা "কারা একই pay-grade-এ আছে" বের করতে সরাসরি কাজে লাগে। (PG 9.0+ ও SQL Server 2017+ দুটোতেই আছে।)</p>

<h3>২০) Referential action অনুমান — CASCADE বনাম SET NULL</h3>
<pre><span class="k">ALTER TABLE</span> orders
  <span class="k">ADD CONSTRAINT</span> fk_orders_customer
  <span class="k">FOREIGN KEY</span> (customer_id) <span class="k">REFERENCES</span> customers(id) <span class="k">ON DELETE SET NULL</span>;

<span class="k">DELETE FROM</span> customers <span class="k">WHERE</span> id = 7;   <span class="c">-- customer 7-এর orders-এ কী ঘটবে?</span></pre>
<p><b>ব্যাখ্যা:</b> অধ্যায় ৮-এর referential-action টেবিল অনুযায়ী এখানে <code>ON DELETE SET NULL</code> বলা আছে — তাই customer 7 মুছে গেলে তার <code>orders</code> row-গুলো মোছে না, শুধু তাদের <code>customer_id</code> column <code>NULL</code> হয়ে যায় (column অবশ্যই NULL-able হতে হবে)। এটা <code>order_items → orders</code>-এর <code>ON DELETE CASCADE</code> (অধ্যায় ৮-এ দেখানো, যেখানে order মুছলে item-ও মুছে যায়) থেকে সম্পূর্ণ ভিন্ন আচরণ — একই ধরনের FK constraint হলেও referential action ভিন্ন হলে ফলাফল ভিন্ন। constraint-এ কিছু না লিখলে default <code>NO ACTION</code>/<code>RESTRICT</code> হতো — তখন child order থাকা অবস্থায় এই <code>DELETE</code>-ই আটকে গিয়ে error দিত।</p>

<h3>২১) কোন Join Algorithm বাছবে engine — reasoning</h3>
<pre><span class="k">SELECT</span> o.id, o.amount, c.name
<span class="k">FROM</span> orders o
<span class="k">JOIN</span> customers c <span class="k">ON</span> o.customer_id = c.id
<span class="k">WHERE</span> o.customer_id = 42;</pre>
<p><b>ব্যাখ্যা:</b> অধ্যায় ৪-এর join-algorithm টেবিল অনুযায়ী এখানে <code>WHERE o.customer_id = 42</code> আগেই <code>orders</code>-কে মাত্র কয়েকটা row-এ নামিয়ে দেয় (ছোট outer), আর <code>customers.id</code>-এ PK/unique index আছে ধরে নিলে — engine সম্ভবত <b>Nested Loop</b> বাছবে (কয়েকটা outer row × সস্তা index seek)। কিন্তু <code>WHERE</code> শর্তটা সরিয়ে দিলে (পুরো <code>orders</code> পুরো <code>customers</code>-এর সাথে join), দুই side-ই বড়/unsorted equality join হয়ে যায় — তখন optimizer সম্ভবত <b>Hash Join</b> বেছে নেবে। অর্থাৎ একই query-shape-এ শুধু WHERE filter-এর selectivity বদলেই বেছে নেওয়া algorithm বদলে যেতে পারে — interview-এ এই reasoning দেখাতে পারাটাই আসল দক্ষতা, শুধু নাম মুখস্থ বলা নয়।</p>
</template>

<template data-page="progobj">
<h2 class="title">১৭. Functions · Procedures · Triggers · Views (গভীরে)</h2>
<p class="lead">Database-এর ভেতরে reusable logic — কোনটা কী, কখন কোনটা, আর PostgreSQL ও SQL Server-এ কীভাবে লিখবেন (ব্যাখ্যা সহ)।</p>

<h3>Function বনাম Procedure — মূল পার্থক্য</h3>
<table>
<tr><th></th><th>Function</th><th>Procedure</th></tr>
<tr><td>ফেরত দেয়</td><td>একটা মান বা table (return বাধ্যতামূলক)</td><td>ঐচ্ছিক (OUT param / result set)</td></tr>
<tr><td>কল করা</td><td><code>SELECT fn(...)</code> — query-র ভেতরে</td><td><code>CALL</code> (PG) / <code>EXEC</code> (MS)</td></tr>
<tr><td>Query-তে ব্যবহার</td><td>হ্যাঁ (SELECT/WHERE/FROM)</td><td>না</td></tr>
<tr><td>Transaction control</td><td>সাধারণত না</td><td>হ্যাঁ (COMMIT/ROLLBACK করতে পারে)</td></tr>
<tr><td>উদ্দেশ্য</td><td>মান হিসাব (pure-ish)</td><td>multi-step কাজ (side-effect)</td></tr>
</table>

<h3>Scalar Function — একটা মান ফেরে</h3>
<pre><span class="c">-- PostgreSQL</span>
<span class="k">CREATE FUNCTION</span> order_total(p_order_id <span class="k">BIGINT</span>)
<span class="k">RETURNS</span> <span class="k">NUMERIC</span> <span class="k">AS</span> $$
  <span class="k">SELECT</span> <span class="k">COALESCE</span>(<span class="k">SUM</span>(qty * price), 0)
  <span class="k">FROM</span> order_items <span class="k">WHERE</span> order_id = p_order_id;
$$ <span class="k">LANGUAGE</span> sql;

<span class="k">SELECT</span> order_total(5);          <span class="c">-- query-তে ব্যবহার</span>

<span class="c">-- SQL Server</span>
<span class="k">CREATE FUNCTION</span> dbo.OrderTotal(@OrderId <span class="k">BIGINT</span>)
<span class="k">RETURNS</span> <span class="k">DECIMAL</span>(12,2) <span class="k">AS</span>
<span class="k">BEGIN</span>
  <span class="k">RETURN</span> (<span class="k">SELECT</span> <span class="k">COALESCE</span>(<span class="k">SUM</span>(qty * price), 0)
          <span class="k">FROM</span> order_items <span class="k">WHERE</span> order_id = @OrderId);
<span class="k">END</span>;</pre>
<p><b>ব্যাখ্যা:</b> scalar function একটা মান ফেরত দেয় এবং query-র ভেতরে expression-এর মতো ব্যবহার করা যায় — reusable calculation (মোট, discount, format) এক জায়গায় রাখতে ভালো।</p>
<div class="callout mistake"><span class="tag">Scalar UDF performance ফাঁদ (SQL Server)</span>
পুরনো SQL Server-এ scalar UDF <b>প্রতিটা row-এর জন্য আলাদা</b> চলে (row-by-row) → বড় query-তে ভয়ানক ধীর, আর execution plan-এ cost লুকিয়ে থাকে। SQL Server 2019+ কিছু scalar UDF inline করে, তবু WHERE/SELECT-এ ভারী scalar UDF সাবধানে — প্রায়ই inline TVF বা সরাসরি expression ভালো।</div>

<h3>Table-Valued Function (TVF) — একটা table ফেরে</h3>
<pre><span class="c">-- PostgreSQL: RETURNS TABLE</span>
<span class="k">CREATE FUNCTION</span> recent_orders(p_customer <span class="k">BIGINT</span>, p_days <span class="k">INT</span>)
<span class="k">RETURNS TABLE</span>(id <span class="k">BIGINT</span>, amount <span class="k">NUMERIC</span>, created_at <span class="k">TIMESTAMP</span>) <span class="k">AS</span> $$
  <span class="k">SELECT</span> id, amount, created_at <span class="k">FROM</span> orders
  <span class="k">WHERE</span> customer_id = p_customer
    <span class="k">AND</span> created_at &gt;= <span class="k">NOW</span>() - (p_days || <span class="k">' days'</span>)::<span class="k">INTERVAL</span>;
$$ <span class="k">LANGUAGE</span> sql;

<span class="k">SELECT</span> * <span class="k">FROM</span> recent_orders(100, 30);   <span class="c">-- FROM-এ table-এর মতো</span>

<span class="c">-- SQL Server: inline TVF (দ্রুত — plan-এ merge হয়)</span>
<span class="k">CREATE FUNCTION</span> dbo.RecentOrders(@CustomerId <span class="k">BIGINT</span>, @Days <span class="k">INT</span>)
<span class="k">RETURNS TABLE AS RETURN</span> (
  <span class="k">SELECT</span> id, amount, created_at <span class="k">FROM</span> orders
  <span class="k">WHERE</span> customer_id = @CustomerId <span class="k">AND</span> created_at &gt;= <span class="k">DATEADD</span>(<span class="k">DAY</span>, -@Days, <span class="k">SYSUTCDATETIME</span>())
);</pre>
<p><b>ব্যাখ্যা:</b> TVF একটা result table ফেরে যা <code>FROM</code>-এ join/filter করা যায় — parameterized view-এর মতো। SQL Server-এ <b>inline TVF</b> (একটা SELECT) planner মূল query-তে merge করে (দ্রুত); <b>multi-statement TVF</b> আলাদা চলে (statistics নেই, ধীর) — তাই inline-ই পছন্দনীয়।</p>

<h3>Stored Procedure — কাজ সম্পাদন</h3>
<pre><span class="c">-- PostgreSQL</span>
<span class="k">CREATE PROCEDURE</span> transfer(p_from <span class="k">BIGINT</span>, p_to <span class="k">BIGINT</span>, p_amt <span class="k">NUMERIC</span>)
<span class="k">LANGUAGE</span> plpgsql <span class="k">AS</span> $$
<span class="k">BEGIN</span>
  <span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance - p_amt <span class="k">WHERE</span> id = p_from;
  <span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance + p_amt <span class="k">WHERE</span> id = p_to;
<span class="k">END</span>; $$;

<span class="k">CALL</span> transfer(1, 2, 100);

<span class="c">-- SQL Server</span>
<span class="k">CREATE PROCEDURE</span> dbo.Transfer @From <span class="k">BIGINT</span>, @To <span class="k">BIGINT</span>, @Amt <span class="k">DECIMAL</span>(12,2) <span class="k">AS</span>
<span class="k">BEGIN</span>
  <span class="k">SET NOCOUNT ON</span>;
  <span class="k">BEGIN TRAN</span>;
    <span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance - @Amt <span class="k">WHERE</span> id = @From;
    <span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance + @Amt <span class="k">WHERE</span> id = @To;
  <span class="k">COMMIT</span>;
<span class="k">END</span>;

<span class="k">EXEC</span> dbo.Transfer @From=1, @To=2, @Amt=100;</pre>
<p><b>ব্যাখ্যা:</b> procedure একাধিক statement-এর একটা কাজ (যেমন টাকা transfer) সম্পাদন করে এবং transaction control করতে পারে। function-এর মতো query-তে embed করা যায় না — আলাদা <code>CALL</code>/<code>EXEC</code> দিয়ে চালাতে হয়। IN/OUT parameter দিয়ে মান নেওয়া-দেওয়া যায়।</p>

<h3>Trigger — event-এ স্বয়ংক্রিয় logic</h3>
<pre><span class="c">-- PostgreSQL: function + trigger (salary পরিবর্তন audit)</span>
<span class="k">CREATE FUNCTION</span> log_salary_change() <span class="k">RETURNS TRIGGER AS</span> $$
<span class="k">BEGIN</span>
  <span class="k">INSERT INTO</span> salary_audit(emp_id, old_salary, new_salary, changed_at)
  <span class="k">VALUES</span> (<span class="k">NEW</span>.id, <span class="k">OLD</span>.salary, <span class="k">NEW</span>.salary, <span class="k">NOW</span>());
  <span class="k">RETURN</span> <span class="k">NEW</span>;
<span class="k">END</span>; $$ <span class="k">LANGUAGE</span> plpgsql;

<span class="k">CREATE TRIGGER</span> trg_salary <span class="k">AFTER UPDATE OF</span> salary <span class="k">ON</span> employees
<span class="k">FOR EACH ROW EXECUTE FUNCTION</span> log_salary_change();

<span class="c">-- SQL Server: inserted/deleted pseudo-table (set-based)</span>
<span class="k">CREATE TRIGGER</span> trg_salary <span class="k">ON</span> employees <span class="k">AFTER UPDATE AS</span>
<span class="k">BEGIN</span>
  <span class="k">INSERT INTO</span> salary_audit(emp_id, old_salary, new_salary, changed_at)
  <span class="k">SELECT</span> d.id, d.salary, i.salary, <span class="k">SYSUTCDATETIME</span>()
  <span class="k">FROM</span> inserted i <span class="k">JOIN</span> deleted d <span class="k">ON</span> i.id = d.id
  <span class="k">WHERE</span> i.salary &lt;&gt; d.salary;
<span class="k">END</span>;</pre>
<p><b>ব্যাখ্যা:</b> trigger হলো একটা event (INSERT/UPDATE/DELETE)-এ database নিজে থেকে চালানো logic — audit log, derived value maintain, validation-এ ব্যবহার। PG-তে <code>NEW</code>/<code>OLD</code> দিয়ে row-এর নতুন/পুরনো মান; SQL Server-এ <code>inserted</code>/<code>deleted</code> pseudo-table।</p>
<div class="callout mistake"><span class="tag">Trigger-এর সতর্কতা</span>
Trigger "লুকানো" logic — কেউ সাধারণ INSERT করল, পেছনে trigger আরও কাজ করল, debug কঠিন। SQL Server trigger <b>set-based</b> (একবারে সব affected row একসাথে) — <code>inserted</code>/<code>deleted</code>-কে একটা row ধরে লিখলে multi-row update-এ bug হবে। ভারী কাজ trigger-এ না দিয়ে application/procedure-এ রাখা ভালো।</div>

<h3>View (গভীরে)</h3>
<p>View আগের অধ্যায়ে দেখেছি — এখানে দুটো production feature:</p>
<pre><span class="k">CREATE VIEW</span> active_orders <span class="k">AS</span>
<span class="k">SELECT</span> * <span class="k">FROM</span> orders <span class="k">WHERE</span> status = <span class="k">'ACTIVE'</span>
<span class="k">WITH CHECK OPTION</span>;   <span class="c">-- এই view দিয়ে status='ACTIVE' নয় এমন row insert/update ব্লক</span></pre>
<ul>
<li><b>Updatable view:</b> সরল single-table view-তে সরাসরি INSERT/UPDATE করা যায় (join/aggregate থাকলে সাধারণত নয়)।</li>
<li><b>WITH CHECK OPTION:</b> view-এর WHERE শর্ত ভাঙে এমন row view দিয়ে ঢোকানো/বদলানো আটকায়।</li>
</ul>

<h3>কোনটা কখন — সিদ্ধান্ত</h3>
<table>
<tr><th>দরকার</th><th>ব্যবহার করুন</th></tr>
<tr><td>জটিল query-কে নাম দেওয়া (reuse, পড়তে সহজ)</td><td><span class="kw">View</span></td></tr>
<tr><td>Parameter সহ query result (table)</td><td><span class="kw">Inline TVF</span></td></tr>
<tr><td>একটা মান হিসাব (query-তে embed)</td><td><span class="kw">Scalar function</span> (সাবধানে)</td></tr>
<tr><td>Multi-step কাজ + transaction</td><td><span class="kw">Procedure</span></td></tr>
<tr><td>Event-এ auto কাজ (audit/validate)</td><td><span class="kw">Trigger</span> (হালকা রাখুন)</td></tr>
<tr><td>ভারী query একবার cache করে দ্রুত read</td><td><span class="kw">Materialized view</span></td></tr>
</table>
</template>

<template data-page="optimize">
<h2 class="title">১৮. Query Optimization Process</h2>
<p class="lead">ধীর query "কেন ধীর" অনুমান না করে — একটা পদ্ধতিগত process-এ খুঁজে বের করে ঠিক করা। সাথে দুই মূল হাতিয়ার: execution plan ও profiler।</p>

<div class="diagram"><pre>
① ধীর query খুঁজুন → ② execution plan পড়ুন → ③ সমস্যা চিহ্নিত → ④ ঠিক করুন → ⑤ মেপে যাচাই
                                   ↺ (আবার)
</pre></div>

<h3>ধাপ ১ — ধীর query খুঁজুন (measure, অনুমান নয়)</h3>
<p>আগে জানুন <b>কোন</b> query আসলে সমস্যা — চোখে নয়, ডেটা দিয়ে:</p>
<table>
<tr><th>ধরন</th><th>PostgreSQL</th><th>SQL Server</th></tr>
<tr><td>Aggregate stats</td><td><code>pg_stat_statements</code></td><td>Query Store / <code>sys.dm_exec_query_stats</code></td></tr>
<tr><td>Slow query log</td><td><code>log_min_duration_statement</code></td><td>Extended Events</td></tr>
</table>
<div class="callout best"><span class="tag">মোট সময়, ধীরতম একক নয়</span>
সবচেয়ে বেশি <b>মোট</b> সময় নেওয়া query আগে ধরুন (calls × avg time)। একটা query হয়তো ধীর কিন্তু দিনে একবার চলে; আরেকটা দ্রুত কিন্তু লাখবার চলে বলে মোট বোঝা বেশি। <code>pg_stat_statements</code>-এ <code>total_exec_time</code> অনুযায়ী sort করুন।</div>

<h3>ধাপ ২ — Execution Plan পড়ুন</h3>
<p><span class="kw">Execution plan</span> = engine query-টা <b>কীভাবে</b> চালাবে তার নীলনকশা — কোন index, seek না scan, join-এর ধরন ও ক্রম, আনুমানিক cost ও row সংখ্যা।</p>
<pre><span class="c">-- PostgreSQL: প্রকৃত সময় ও row সহ</span>
<span class="k">EXPLAIN ANALYZE</span> <span class="k">SELECT</span> * <span class="k">FROM</span> orders <span class="k">WHERE</span> customer_id = 100;

<span class="c">-- SQL Server</span>
<span class="k">SET STATISTICS IO</span>, <span class="k">TIME ON</span>;    <span class="c">-- I/O ও সময়; + "Actual Execution Plan" চালু করে চালান</span></pre>
<div class="callout why"><span class="tag">Execution plan — কেন ব্যবহার করবেন ও সুবিধা</span>
<b>কেন:</b> plan না দেখে tuning মানে অন্ধকারে ঢিল ছোঁড়া — সময় কোথায় যাচ্ছে তা শুধু <b>অনুমান</b> করা। plan সেটা চোখে <b>দেখিয়ে</b> দেয়।<br>
<b>সুবিধা:</b> (১) সবচেয়ে ব্যয়বহুল operator চিহ্নিত করে; (২) missing index ধরে (বড় table-এ Seq/Table Scan দেখলে); (৩) খারাপ estimate ধরে (estimated বনাম actual row-এর বড় ফারাক = stale statistics); (৪) আপনার fix সত্যিই plan বদলেছে কি না তা <b>প্রমাণ</b> করে। এটাই tuning-এর #১ হাতিয়ার।</div>
<p>Plan-এ যা খুঁজবেন: বড় table-এ <b>Seq/Table Scan</b> (index দরকার?), সবচেয়ে ব্যয়বহুল node, <b>estimated ≠ actual</b> row (stale stats), বড় row-এর ওপর nested loop, disk-এ sort/hash spill।</p>

<h3>Profiler / Tracing — চলন্ত workload দেখা</h3>
<p>Execution plan দেখায় <b>একটা</b> query কীভাবে চলবে; <span class="kw">Profiler / trace</span> দেখায় production-এ <b>আসলে কী চলছে</b> — কোন query, কত duration, কত read, কী parameter, কোথায় deadlock/blocking।</p>
<table>
<tr><th>ধরন</th><th>SQL Server</th><th>PostgreSQL</th></tr>
<tr><td>আধুনিক tracing</td><td><span class="kw">Extended Events</span> (হালকা; পুরনো SQL Profiler-এর প্রতিস্থাপন)</td><td><code>auto_explain</code> (slow query-র plan log), <code>log_min_duration_statement</code></td></tr>
<tr><td>History / বিশ্লেষণ</td><td>Query Store</td><td><code>pg_stat_statements</code>, pgBadger (log report)</td></tr>
</table>
<div class="callout why"><span class="tag">Profiler — কেন ব্যবহার করবেন ও সুবিধা</span>
<b>কেন:</b> dev-এ query দ্রুত অথচ production-এ ধীর — কারণ আসল data volume, parameter, আর concurrency ভিন্ন। Profiler/trace <b>বাস্তব</b> workload ধরে (কৃত্রিম test নয়)।<br>
<b>সুবিধা:</b> (১) কোন query সবচেয়ে বেশি চলছে/ধীর — প্রকৃত চিত্র; (২) actual parameter value ধরা (parameter sniffing debug); (৩) deadlock ও blocking chain দেখা; (৪) কোন app/endpoint কোন query পাঠাচ্ছে তা চিহ্নিত করা।</div>
<div class="callout mistake"><span class="tag">সতর্কতা</span>
পুরনো <b>SQL Profiler (GUI trace)</b> ভারী — busy production-এ চালালে server ধীর হয়ে যায়। এর বদলে <b>Extended Events</b> (হালকা) ব্যবহার করুন। PG-তে <code>log_min_duration_statement</code> + <code>auto_explain</code> দিয়ে শুধু ধীর query log করুন (সব query নয়)।</div>

<h3>ধাপ ৩ — সাধারণ সমস্যা চিহ্নিত করুন</h3>
<table>
<tr><th>Plan-এ যা দেখছেন</th><th>সম্ভাব্য কারণ</th><th>সমাধান</th></tr>
<tr><td>বড় table-এ Seq/Table Scan + selective filter</td><td>missing index</td><td>WHERE/JOIN column-এ index</td></tr>
<tr><td>index থাকা সত্ত্বেও scan</td><td>non-SARGable (column-এ function) / ভুল index</td><td>query SARGable করুন, সঠিক composite index</td></tr>
<tr><td>estimated ≠ actual (বড় ফারাক)</td><td>stale statistics</td><td><code>ANALYZE</code> / <code>UPDATE STATISTICS</code></td></tr>
<tr><td>একই query হাজারবার (loop)</td><td>N+1 (ORM lazy load)</td><td>join / batch / eager load</td></tr>
<tr><td>Sort/Hash "spill to disk"</td><td>বড় result / কম memory</td><td>row কমান, order-এর জন্য index</td></tr>
<tr><td>Implicit conversion warning</td><td>data type mismatch (int column-এ string param)</td><td>param-এর type মেলান</td></tr>
</table>

<h3>ধাপ ৪ — সমাধান প্রয়োগ (একবারে একটা)</h3>
<ul>
<li>সঠিক <b>index</b> (composite/covering/filtered) যোগ বা সাজান।</li>
<li>Query <b>SARGable</b> করুন — column-এ function নয় (অধ্যায় ১০)।</li>
<li><b>Statistics</b> update করুন।</li>
<li>আগে filter (WHERE early), শুধু দরকারি column (<code>SELECT *</code> নয়), <b>keyset pagination</b> (অধ্যায় ১১)।</li>
<li>N+1 এড়াতে join/batch; data type মেলান।</li>
</ul>

<h3>ধাপ ৫ — মেপে যাচাই</h3>
<div class="callout best"><span class="tag">অনুমান নয়, সংখ্যা</span>
Fix-এর আগে ও পরে একই measurement নিন (<code>EXPLAIN ANALYZE</code> / <code>SET STATISTICS IO,TIME</code> / actual duration)। logical reads বা execution time সত্যিই কমেছে কি না দেখুন। <b>একবারে একটা</b> পরিবর্তন করুন — নাহলে কোনটা কাজ করল বোঝা যাবে না।</div>

<h3>Anti-pattern cheat sheet</h3>
<table>
<tr><th>Anti-pattern</th><th>কেন খারাপ</th></tr>
<tr><td><code>SELECT *</code></td><td>অপ্রয়োজনীয় column/I/O, covering index ভাঙে</td></tr>
<tr><td>WHERE-এ column-এ function</td><td>non-SARGable → index অকেজো</td></tr>
<tr><td>বড় <code>OFFSET</code> pagination</td><td>আগের সব row skip করতে পড়তে হয় → keyset ব্যবহার করুন</td></tr>
<tr><td>N+1 query (ORM)</td><td>হাজার round-trip → join/batch</td></tr>
<tr><td><code>NOT IN</code> + NULL</td><td>ভুল/খালি ফলাফল → <code>NOT EXISTS</code></td></tr>
<tr><td>সব কিছুতে index</td><td>write ধীর, storage নষ্ট — শুধু দরকারিটা</td></tr>
</table>
<div class="callout best"><span class="tag">Golden rule</span>
Optimization = <b>measure → plan → fix → measure</b>। কখনো plan না দেখে অনুমানে index যোগ করবেন না; আর প্রতিটা fix সংখ্যা দিয়ে প্রমাণ করুন।</div>
</template>

<template data-page="replcdc">
<h2 class="title">১৯. Replication & CDC</h2>
<p class="lead">Data একাধিক জায়গায় sync রাখা (replication) আর প্রতিটা পরিবর্তনকে event হিসেবে ধরা (CDC) — দুটোরই ভিত্তি একই transaction log, কিন্তু উদ্দেশ্য আলাদা।</p>

<h3>Replication — কী ও কেন</h3>
<p><span class="kw">Replication</span> = একটা database (primary/master)-এর data আরেকটা database (replica/standby)-তে ক্রমাগত copy করে sync রাখা।</p>
<h4>সুবিধা (benefit)</h4>
<ul>
<li><b>High Availability (HA):</b> primary down হলে replica নতুন primary হয়ে সেবা চালু রাখে (failover)।</li>
<li><b>Read scaling:</b> read query replica থেকে সার্ভ করে primary-র load কমায়।</li>
<li><b>Disaster Recovery (DR):</b> অন্য datacenter/region-এ copy — বিপর্যয়ে data বাঁচে।</li>
<li><b>Reporting/backup offload:</b> ভারী report/backup replica-তে চালান, production-এ প্রভাব পড়ে না।</li>
</ul>
<div class="callout why"><span class="tag">Sync বনাম Async replication</span>
<b>Synchronous:</b> primary commit-এর আগে replica-ও লিখেছে নিশ্চিত করে — zero data loss, কিন্তু latency বাড়ে (replica-র জন্য অপেক্ষা)। <b>Asynchronous:</b> primary সাথে সাথে commit করে, replica একটু পিছিয়ে থাকে — দ্রুত, কিন্তু primary crash-এ সর্বশেষ কিছু transaction হারাতে পারে (replication lag)। বেশিরভাগ read-scaling async; কড়া HA-তে sync।</div>

<h3>PostgreSQL Replication</h3>
<table>
<tr><th>ধরন</th><th>কী করে</th><th>ব্যবহার</th></tr>
<tr><td><span class="kw">Physical / Streaming</span></td><td>WAL byte-level stream করে পুরো cluster হুবহু copy (hot standby = read replica)</td><td>HA, DR, read replica</td></tr>
<tr><td><span class="kw">Logical</span></td><td>publication/subscription — নির্দিষ্ট table row-level replicate (WAL logical decode)</td><td>selective sync, cross-version upgrade, partial copy</td></tr>
</table>
<pre><span class="c">-- Logical replication (PG 10+)</span>
<span class="c">-- primary এ:</span>
<span class="k">CREATE PUBLICATION</span> pub_orders <span class="k">FOR TABLE</span> orders, order_items;
<span class="c">-- replica এ:</span>
<span class="k">CREATE SUBSCRIPTION</span> sub_orders
  <span class="k">CONNECTION</span> <span class="k">'host=primary dbname=app'</span> <span class="k">PUBLICATION</span> pub_orders;</pre>
<p><b>ব্যাখ্যা:</b> physical replication পুরো cluster (সব database, একই version) হুবহু নেয় — HA-র জন্য আদর্শ। logical replication টেবিল বেছে নেয়, ভিন্ন version/schema-তেও পাঠানো যায় — migration ও selective sync-এ ভালো। ভেতরে দুটোই WAL ব্যবহার করে।</p>

<h3>SQL Server Replication</h3>
<table>
<tr><th>ধরন</th><th>কী করে</th></tr>
<tr><td><span class="kw">Always On Availability Groups</span></td><td>আধুনিক HA/DR — database group একাধিক replica-তে (sync/async), automatic failover, readable secondary। Enterprise-grade।</td></tr>
<tr><td><span class="kw">Log Shipping</span></td><td>transaction log backup নিয়মিত standby-তে restore — সরল DR</td></tr>
<tr><td><span class="kw">Transactional Replication</span></td><td>publisher → distributor → subscriber; committed change subscriber-এ (row-level, near-real-time)</td></tr>
<tr><td>Snapshot / Merge</td><td>পুরো snapshot / দ্বিমুখী merge (occasional-connect scenario)</td></tr>
</table>
<div class="callout behind"><span class="tag">Database Mirroring — deprecated</span>
পুরনো <b>Database Mirroring</b> আর ব্যবহার করবেন না — Microsoft এটাকে <b>Always On Availability Groups</b> দিয়ে প্রতিস্থাপন করেছে। নতুন HA-তে AG-ই standard।</div>

<h3>CDC (Change Data Capture) — কী ও কেন</h3>
<p><span class="kw">CDC</span> = database-এ প্রতিটা row পরিবর্তন (INSERT/UPDATE/DELETE) ঘটার সাথে সাথে <b>event হিসেবে ধরা</b>, যাতে downstream system consume করতে পারে — Kafka, search index (Elasticsearch), cache (Redis), data warehouse, বা অন্য microservice।</p>
<h4>সুবিধা (benefit)</h4>
<ul>
<li><b>Near-real-time integration:</b> polling ছাড়াই পরিবর্তন সাথে সাথে অন্য system-এ পৌঁছায়।</li>
<li><b>Decoupling:</b> source DB জানে না কে consume করছে — নতুন consumer যোগ করা সহজ (event-driven)।</li>
<li><b>Dual-write সমস্যা এড়ানো:</b> "DB-তে লিখলাম + Kafka-তে পাঠালাম" — দুটো আলাদা কাজ inconsistent হতে পারে; CDC-তে শুধু DB-তে লেখেন, event আপনাআপনি log থেকে আসে (একটাই source of truth)।</li>
<li><b>Analytics/search/cache sync, audit trail, event sourcing।</b></li>
</ul>
<h4>CDC-র তিন কৌশল</h4>
<table>
<tr><th>কৌশল</th><th>কীভাবে</th><th>মূল্যায়ন</th></tr>
<tr><td><span class="kw">Log-based</span></td><td>transaction log/WAL পড়ে change decode করে</td><td>✅ সেরা — কম overhead, DELETE-ও ধরে, ক্রম ঠিক, non-intrusive</td></tr>
<tr><td><span class="kw">Trigger-based</span></td><td>প্রতি table-এ trigger change table-এ লেখে</td><td>write ধীর করে, ভারী</td></tr>
<tr><td><span class="kw">Query / polling</span></td><td><code>updated_at &gt; last</code> দিয়ে বারবার poll</td><td>DELETE মিস করে, load বাড়ায়, latency</td></tr>
</table>
<div class="callout why"><span class="tag">Log-based CDC কীভাবে কাজ করে (deep) — মূল অন্তর্দৃষ্টি</span>
Database <b>এমনিতেই</b> প্রতিটা committed change durability-র জন্য transaction log (WAL/transaction log)-এ লেখে (অধ্যায় ৯)। Log-based CDC সেই log-টাই <b>পড়ে</b> — নতুন কোনো trigger বা polling নয়। ফলে (১) source-এ প্রায় কোনো বাড়তি চাপ নেই, (২) প্রতিটা change commit-এর <b>ক্রমেই</b> পাওয়া যায়, (৩) DELETE-ও ধরা পড়ে (polling যা পারে না)। এটাই CDC-কে event-driven architecture-এর মেরুদণ্ড বানায়।</div>

<h3>PostgreSQL CDC</h3>
<p>PG <span class="kw">logical decoding</span> দিয়ে WAL থেকে row-level change একটা stream-এ বের করে — <span class="kw">replication slot</span> + output plugin (<code>pgoutput</code>, <code>wal2json</code>) ব্যবহার করে।</p>
<pre><span class="c">-- logical decoding চালু (postgresql.conf: wal_level = logical)</span>
<span class="k">SELECT</span> pg_create_logical_replication_slot(<span class="k">'cdc_slot'</span>, <span class="k">'wal2json'</span>);
<span class="c">-- slot থেকে change পড়া (সাধারণত Debezium/connector এটা করে)</span>
<span class="k">SELECT</span> * <span class="k">FROM</span> pg_logical_slot_get_changes(<span class="k">'cdc_slot'</span>, <span class="k">NULL</span>, <span class="k">NULL</span>);</pre>
<p>Production-এ সাধারণত <b>Debezium</b> (Kafka Connect) এই logical decoding ব্যবহার করে change গুলো Kafka topic-এ stream করে।</p>

<h3>SQL Server CDC</h3>
<p>SQL Server-এ <b>native CDC</b> feature আছে — একটা capture job transaction log পড়ে পরিবর্তন change table-এ রাখে।</p>
<pre><span class="c">-- database ও table এ CDC চালু</span>
<span class="k">EXEC</span> sys.sp_cdc_enable_db;
<span class="k">EXEC</span> sys.sp_cdc_enable_table
  @source_schema = <span class="k">'dbo'</span>, @source_name = <span class="k">'orders'</span>, @role_name = <span class="k">NULL</span>;
<span class="c">-- change table (cdc.dbo_orders_CT) query করে বা CDC function দিয়ে পড়া</span></pre>
<table>
<tr><th>Feature</th><th>কী দেয়</th></tr>
<tr><td><span class="kw">Change Data Capture</span></td><td>প্রতিটা পরিবর্তনের পূর্ণ ইতিহাস (before/after, INSERT/UPDATE/DELETE)</td></tr>
<tr><td><span class="kw">Change Tracking</span></td><td>শুধু <b>কোন row</b> বদলেছে (হালকা, history নেই) — sync scenario</td></tr>
</table>
<p>Debezium SQL Server-এর এই CDC ব্যবহার করেও Kafka-তে stream করতে পারে।</p>

<h3>CDC Tools — Debezium ও PeerDB</h3>
<p>CDC হাতে না বানিয়ে সাধারণত ready-made tool ব্যবহার হয়। দুটো প্রধান:</p>
<h4>Debezium</h4>
<p>সবচেয়ে প্রচলিত open-source CDC platform (Kafka Connect-এর ওপর)। PostgreSQL (logical decoding), SQL Server (native CDC), MySQL, MongoDB, Oracle — সব থেকে change ধরে <b>Kafka topic</b>-এ পাঠায়। প্রতি table → একটা topic; প্রতিটা message-এ change-এর before/after image ও operation type (<code>c</code>=create, <code>u</code>=update, <code>d</code>=delete)। General-purpose, বহু-DB।</p>
<h4>PeerDB</h4>
<p><span class="kw">PeerDB</span> একটা open-source, <b>PostgreSQL-কেন্দ্রিক</b> CDC ও data-movement tool (২০২৪-এ ClickHouse একে অধিগ্রহণ করে)। এটা বিশেষভাবে Postgres থেকে বিশাল data <b>দ্রুত</b> সরাতে optimized — গন্তব্য: data warehouse (Snowflake, BigQuery, ClickHouse), queue (Kafka, PubSub), বা অন্য Postgres।</p>
<ul>
<li><b>কীভাবে:</b> ভেতরে Postgres logical replication (replication slot + logical decoding) ব্যবহার করে; সাথে দ্রুত parallel initial <b>snapshot</b> + continuous CDC।</li>
<li><b>Peer ও Mirror:</b> প্রতিটা data store (source/destination) একটা <span class="kw">peer</span>; দুই peer-এর মধ্যে একটা <span class="kw">mirror</span> = CDC/sync pipeline। SQL-সদৃশ command-এ (<code>CREATE PEER</code>, <code>CREATE MIRROR</code>) সব define হয়।</li>
<li><b>কেন Debezium-এর বদলে:</b> Postgres → warehouse বড় pipeline-এ PeerDB দ্রুত ও সরল (Kafka layer ছাড়াই সরাসরি warehouse-এ), large-table snapshot ও throughput-এ ভালো।</li>
</ul>
<div class="callout why"><span class="tag">Debezium না PeerDB?</span>
<b>Debezium:</b> multi-DB, Kafka-কেন্দ্রিক event streaming, microservice integration (dual-write সমাধান)। <b>PeerDB:</b> Postgres থেকে warehouse/queue-তে বড় আকারে দ্রুত data sync (analytics/ETL)। দুটোই ভেতরে Postgres logical decoding ব্যবহার করে — পার্থক্য উদ্দেশ্য ও optimization-এ।</div>

<h3>Monitoring — replication/CDC health ও tools</h3>
<div class="callout mistake"><span class="tag">#১ বিপদ — unconsumed replication slot</span>
PostgreSQL logical replication/CDC-তে consumer (Debezium/PeerDB) থেমে গেলে replication slot পুরনো WAL <b>ধরে রাখে</b> — WAL জমতে জমতে <b>disk ভরে গিয়ে পুরো database crash</b> করতে পারে! তাই slot lag monitor করা <b>বাধ্যতামূলক</b>: <code>SELECT slot_name, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) FROM pg_replication_slots;</code> — এই retained WAL বাড়তে থাকলে সাথে সাথে alert।</div>
<h4>কী monitor করবেন</h4>
<table>
<tr><th>কী</th><th>PostgreSQL</th><th>SQL Server</th></tr>
<tr><td>Replication lag</td><td><code>pg_stat_replication</code>, <code>pg_stat_wal_receiver</code></td><td>AG dashboard, <code>sys.dm_hadr_database_replica_states</code></td></tr>
<tr><td>Slot / CDC lag</td><td><code>pg_replication_slots</code> (retained WAL)</td><td>CDC capture/cleanup job latency</td></tr>
<tr><td>Connector health</td><td>Debezium / Kafka Connect status + JMX metrics</td><td>CDC capture job status</td></tr>
</table>
<h4>Monitoring tools</h4>
<table>
<tr><th></th><th><span class="pill pg">PostgreSQL</span></th><th><span class="pill ms">SQL Server</span></th></tr>
<tr><td>Built-in</td><td><code>pg_stat_*</code> view, <code>pg_stat_statements</code>, <code>auto_explain</code></td><td>Query Store, DMV (<code>sys.dm_*</code>), Extended Events</td></tr>
<tr><td>Open-source</td><td>pgwatch, pgBadger (log), postgres_exporter</td><td>—</td></tr>
<tr><td>Dashboard</td><td>Prometheus + Grafana</td><td>Prometheus + Grafana, Azure SQL Analytics</td></tr>
<tr><td>Commercial</td><td>pganalyze, Datadog</td><td>Redgate, SolarWinds DPA, Datadog</td></tr>
<tr><td>CDC pipeline</td><td>Debezium (JMX→Grafana), PeerDB UI</td><td>Debezium, Kafka lag tools</td></tr>
</table>
<div class="callout best"><span class="tag">Monitoring checklist</span>
<ul style="margin:4px 0">
<li>Replication <b>lag</b> (bytes ও সময়) — বাড়তে থাকলে alert।</li>
<li>PostgreSQL <b>replication slot-এর retained WAL</b> — disk-full রোধে সবচেয়ে জরুরি alert।</li>
<li>CDC connector/task <b>failed state</b>, error rate, DLQ depth।</li>
<li>Consumer throughput বনাম source change rate — consumer পিছিয়ে পড়ছে কি না।</li>
<li>সাধারণ DB health — CPU, memory, disk, slow query, connection count।</li>
</ul></div>

<h3>Replication বনাম CDC — পার্থক্য</h3>
<table>
<tr><th></th><th>Replication</th><th>CDC</th></tr>
<tr><td>উদ্দেশ্য</td><td>আরেকটা DB-তে full copy sync রাখা</td><td>পরিবর্তনকে event হিসেবে যেকোনো system-এ পাঠানো</td></tr>
<tr><td>গন্তব্য</td><td>একই ধরনের database (DB → DB)</td><td>যেকোনো — Kafka, search, cache, warehouse</td></tr>
<tr><td>আকার</td><td>একই schema/shape</td><td>ভিন্ন shape/transform সম্ভব</td></tr>
<tr><td>ব্যবহার</td><td>HA, read scale, DR</td><td>event-driven integration, ETL, sync</td></tr>
</table>
<div class="callout best"><span class="tag">.NET microservice-এ CDC</span>
Event-driven .NET system-এ CDC (Debezium + Kafka) দিয়ে <b>dual-write সমস্যা</b> এড়ানো যায় — service শুধু নিজের DB-তে লেখে, CDC সেই change Kafka-তে পাঠায়, অন্য service consume করে। বিকল্প: <b>Outbox pattern</b> (একই transaction-এ outbox table-এ লিখে CDC/poller দিয়ে publish)। event streaming বিস্তারিত Kafka ও RabbitMQ ট্যাবে।</div>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
