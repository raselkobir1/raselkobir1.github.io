<h2 class="title">১. Foundation — কেন Spoken English জরুরি একজন Software Engineer-এর জন্য</h2>
<p class="lead">অনেক বাংলাদেশি ইঞ্জিনিয়ার দুর্দান্ত কোড লেখেন, complex সিস্টেম ডিজাইন করেন, প্রোডাকশন ইনসিডেন্ট সমাধান করেন — কিন্তু একটা standup meeting-এ নিজের কাজ ব্যাখ্যা করতে গিয়ে জমে যান, কিংবা client call-এ প্রশ্ন শুনে মাথায় উত্তর থাকা সত্ত্বেও ইংরেজিতে বলতে গিয়ে আটকে যান। এই কোর্সের পুরো উদ্দেশ্য একটাই — টেকনিক্যাল দক্ষতা যা ইতিমধ্যে আছে, সেটাকে স্পষ্ট, আত্মবিশ্বাসী spoken ও written English দিয়ে সঠিকভাবে প্রকাশ করতে শেখানো।</p>

<h3>আসল সমস্যা — টেকনিক্যাল স্কিলই যথেষ্ট নয়</h3>
<p>ক্যারিয়ারে একটা পর্যায় পর্যন্ত কোডিং স্কিল একাই আপনাকে এগিয়ে নেয় — কিন্তু senior role, remote/international job, বা client-facing দায়িত্বে যাওয়ার সাথে সাথে <span class="kw">communication</span> একটা আলাদা, সমান গুরুত্বপূর্ণ স্কিল হয়ে দাঁড়ায়। একজন ইঞ্জিনিয়ার যিনি নিজের সমাধান স্পষ্টভাবে ব্যাখ্যা করতে পারেন না, তিনি প্রায়ই promotion-এ পিছিয়ে পড়েন, interview-এ বাদ পড়েন, অথবা client-এর কাছে "কম নির্ভরযোগ্য" মনে হন — যদিও টেকনিক্যাল কাজ পুরোপুরি ঠিক ছিল। এটা শুধু "ভালো ইংরেজি বলা"-র প্রশ্ন নয়; এটা সরাসরি ক্যারিয়ার-গ্রোথ, বেতন-বৃদ্ধি, এবং remote job পাওয়ার সুযোগের সাথে যুক্ত।</p>
<div class="callout why"><span class="tag">কেন এই সমস্যাটা প্রায়ই অদৃশ্য থাকে</span>নিজের টিমের ভেতরে বাংলায় বা ভাঙা ইংরেজিতে কাজ চালানো সহজ, তাই সমস্যাটা দৃশ্যমান হয় না — যতক্ষণ না একটা international standup, একটা onsite client call, বা একটা remote job interview এসে পড়ে। তখন বোঝা যায় যে ভাষার barrier আসলে টেকনিক্যাল সীমাবদ্ধতা নয়, বরং practice-এর অভাব — এবং practice দিয়েই এটা সমাধানযোগ্য।</div>

<h3>একজন ইঞ্জিনিয়ারের দিনভর ইংরেজি কোথায় কোথায় লাগে</h3>
<p>ইংরেজি শুধু "interview-এর জন্য" শেখার বিষয় নয় — একজন working software engineer-এর প্রতিদিনের কাজে এটা বারবার দরকার হয়, স্পোকেন এবং written দুইভাবেই।</p>
<pre><span class="c"># একজন ইঞ্জিনিয়ারের সাপ্তাহিক জীবনে ইংরেজির ব্যবহার</span>
Daily standup                → what I did / doing / blockers বলা
Sprint planning ও retro       → estimation, opinion, feedback দেওয়া
Code review comments          → written — সংক্ষিপ্ত কিন্তু স্পষ্টভাবে issue বোঝানো
PR description                → written — কেন change করা হলো তার প্রেক্ষাপট
Slack / email                 → distributed teammate-দের সাথে async communication
Client demo / status call     → progress, risk, timeline ব্যাখ্যা করা
Technical interview            → problem বলা, approach ব্যাখ্যা করা, প্রশ্ন করা
Behavioral interview           → local ও international remote job উভয়ের জন্য
Conference talk / tech blog    → জ্ঞান শেয়ার করা, personal brand তৈরি
Open-source contribution       → issue/PR-এ ইংরেজিতে আলোচনা, maintainer-এর সাথে
Salary / offer negotiation     → নিজের value স্পষ্টভাবে যুক্তি দিয়ে উপস্থাপন করা</pre>
<p>লক্ষ্য করুন — এই তালিকার প্রায় অর্ধেক <span class="kw">spoken</span> (standup, call, interview, negotiation), আর বাকি অর্ধেক <span class="kw">written</span> (code review, PR, email, blog)। দুটোই আলাদা স্কিল, দুটোরই আলাদা priority — এবং এই কোর্স দুটোই কভার করবে।</p>

<h3>Spoken fluency মানে perfect grammar নয় — একটা গুরুত্বপূর্ণ reframe</h3>
<p>অনেকে "spoken English ভালো করা" মানে ধরে নেন perfect grammar, বড় বড় শব্দ, বা নিখুঁত উচ্চারণ। বাস্তবে standup বা client call-এর মতো real-time কথোপকথনে সবচেয়ে গুরুত্বপূর্ণ জিনিস হলো <span class="kw">clarity</span> এবং <span class="kw">confidence</span> — শ্রোতা যেন প্রথমবারেই বুঝে ফেলেন আপনি কী বলছেন, আর আপনি যেন থেমে না গিয়ে চালিয়ে যেতে পারেন। অন্যদিকে, একটা PR description, একটা technical doc, বা একটা client email লেখার সময় আপনার হাতে সময় থাকে — সেখানে grammar, শব্দচয়ন, এবং গঠন ঠিক করার সুযোগ ও প্রয়োজন দুটোই বেশি।</p>
<div class="grid2">
  <div class="box"><b>Speaking situations (standup, call, interview)</b><br>Real-time, থামার সুযোগ কম। Priority: বোঝা যাওয়া (clarity), না থেমে বলে যাওয়া (fluency), আত্মবিশ্বাসী শোনানো। ছোট ভুল grammar গ্রহণযোগ্য, যদি অর্থ স্পষ্ট থাকে।</div>
  <div class="box"><b>Writing situations (PR, doc, email)</b><br>সময় নিয়ে লেখা, edit করার সুযোগ। Priority: সঠিক grammar, precise শব্দচয়ন, গঠনগত স্পষ্টতা। এখানে ভুল বেশি চোখে পড়ে ও বেশিদিন থেকে যায়, তাই সতর্কতা জরুরি।</div>
</div>
<div class="callout why"><span class="tag">কেন এই কোর্স speaking-এ grammar-এর চেয়ে clarity/confidence-কে আগে রাখে</span>একটা standup-এ যদি আপনি "Yesterday I am fixing the bug" বলেন ভুল tense দিয়ে, কিন্তু স্পষ্টভাবে, দ্বিধাহীনভাবে বলেন — টিম বুঝে যাবে এবং কাজ এগোবে। কিন্তু যদি সঠিক tense-এর কথা ভাবতে গিয়ে ৫ সেকেন্ড থেমে যান, বা একদম চুপ করে থাকেন — সেটাই প্রকৃত সমস্যা তৈরি করে, কারণ টিম ভাববে আপনি নিশ্চিত না বা কাজ এগোয়নি। তাই speaking অংশে আগে fluency ও confidence তৈরি করা হবে, grammar আসবে সমান্তরালে — কিন্তু writing অংশে grammar-কে প্রথম priority দেওয়া হবে, কারণ লেখার ভুল স্থায়ীভাবে থেকে যায় এবং professionally বেশি চোখে পড়ে।</div>

<h3>এই কোর্সের রোডম্যাপ — ১৫টা অধ্যায়, চারটা পর্ব</h3>
<p>পুরো কোর্সটা চারটা পর্বে সাজানো, প্রতিটা পর্ব আগেরটার উপর ভিত্তি করে তৈরি — ভিত্তি (উচ্চারণ) ছাড়া গ্রামার শেখা, আর গ্রামার ছাড়া কথোপকথন প্র্যাকটিস করা কার্যকর হয় না।</p>
<table>
<tr><th>পর্ব</th><th>অধ্যায়</th><th>লক্ষ্য</th></tr>

<div class="callout mistake"><span class="tag">Common mistake — "আগে perfect grammar শিখি, তারপর কথা বলব"</span>এটা সবচেয়ে ক্ষতিকর একটা ধারণা। বাস্তবে "perfect" গ্রামার শেখার লক্ষ্যে অনেক ইঞ্জিনিয়ার বছরের পর বছর চুপ করে থাকেন, standup-এ শুধু "yes/no" বলেন, বা meeting-এ মতামত দেওয়া এড়িয়ে যান — এই নীরবতাই আসলে speaking skill-কে আরও দুর্বল করে দেয়, কারণ speaking অন্য যেকোনো স্কিলের মতোই শুধু practice দিয়ে উন্নত হয়, perfect হওয়ার অপেক্ষা করে নয়। ভুল করে বলাটাই শেখার প্রক্রিয়ার অংশ।</div>

<h2 class="title">২. Phonetics ১ — English-এর Vowel Sound ও IPA পরিচিতি</h2>

<h3>IPA কী, আর কেন এটা একজন Software Engineer-এর দরকার</h3>
<p><span class="kw">IPA</span> (International Phonetic Alphabet) হলো একটা universal symbol system, যেখানে প্রতিটা sound-এর জন্য একটা নির্দিষ্ট symbol আছে — spelling যাই হোক না কেন, উচ্চারণ একরকম। ইংরেজি spelling আর pronunciation-এর মধ্যে সরাসরি সম্পর্ক নেই (যেমন <code>put</code> আর <code>but</code> দেখতে প্রায় একরকম, কিন্তু vowel sound সম্পূর্ণ আলাদা), তাই IPA জানলে dictionary-তে দেওয়া pronunciation guide পড়তে পারবেন এবং নিজে থেকে ভুল ধারণা সংশোধন করতে পারবেন।</p>
<p>দৈনন্দিন standup, code review, বা client call-এ আপনি হয়তো গ্রামার ঠিকই বলছেন, কিন্তু একটা vowel sound ভুল হলে পুরো শব্দটাই অন্য অর্থ দাঁড়িয়ে যেতে পারে — যেমন <code>sheep</code> বলতে গিয়ে <code>ship</code> বলে ফেলা। Bangla-তে vowel-এর সংখ্যা কম এবং length-based পার্থক্য (short vs long) তেমন গুরুত্বপূর্ণ নয়, কিন্তু English-এ এই পার্থক্যটাই অর্থ বদলে দেয়। এই mismatch-এর কারণেই systematic ভুল হয় — শুধু individual mistake না, প্যাটার্ন হিসেবে repeat হয়।</p>

<p>Monophthong মানে একটামাত্র pure vowel sound, শুরু থেকে শেষ পর্যন্ত quality বদলায় না। নিচের table-এ ১১টা গুরুত্বপূর্ণ English monophthong দেওয়া হলো।</p>

<p><span class="kw">Schwa</span> <code>/ə/</code> হলো English-এর সবচেয়ে বেশি ব্যবহৃত vowel sound — unstressed syllable-এ প্রায় সবসময় এটাই আসে। যেমন <code>about</code> শব্দে প্রথম syllable "a" পুরোপুরি "আ" না বলে schwa হয়ে যায়: <code>/əˈbaʊt/</code>। Bangla speaker-রা প্রায়ই এই schwa কে উপেক্ষা করে প্রতিটা syllable পূর্ণভাবে উচ্চারণ করেন, যার ফলে speech শোনায় textbook-reading-এর মতো, unnatural।</p>

<h3>Diphthongs — দুই Vowel Sound-এর মিশ্রণ</h3>
<p><span class="kw">Diphthong</span> হলো এমন vowel sound যেখানে একটা sound থেকে আরেকটাতে glide করে যাওয়া হয় — শুরুর sound আর শেষের sound আলাদা, কিন্তু একই syllable-এ মিশে একটা সুষম glide তৈরি করে।</p>

<h2 class="title">৩. Phonetics ২ — Consonant Sound ও বাংলাভাষীদের কমন ভুল</h2>
<p class="lead">গত chapter-এ আমরা vowel sound নিয়ে কথা বলেছি। এই chapter-এ আমরা দেখব consonant sound গুলো — বিশেষ করে যেগুলো বাংলা ভাষায় নেই বা আলাদাভাবে উচ্চারিত হয়, আর যেগুলোর কারণে standup meeting-এ বা client call-এ শ্রোতার কাছে অর্থ পাল্টে যেতে পারে। লক্ষ্য accent পাল্টানো নয় — লক্ষ্য হলো unambiguous (দ্ব্যর্থহীন) ভাবে কথা বলা।</p>

<h3>Consonant sound-এর সংক্ষিপ্ত গঠন</h3>
<p>English-এর consonant sound গুলো কীভাবে তৈরি হয় তা বুঝলে ভুল ধরা সহজ হয়। মোটামুটি পাঁচটা ভাগে ভাগ করা যায়।</p>

<tr><td><span class="kw">Affricate</span></td><td>Stop দিয়ে শুরু, Fricative দিয়ে শেষ</td><td>/tʃ/ (church), /dʒ/ (judge)</td></tr>

</table>
<p>বাংলাভাষীদের জন্য মূল সমস্যা তৈরি হয় <span class="kw">Fricative</span> আর <span class="kw">Approximant</span> গোষ্ঠীতে — কারণ বাংলায় এই sound গুলোর সরাসরি প্রতিরূপ নেই। নিচে সবচেয়ে গুরুত্বপূর্ণ চারটা কেস বিস্তারিত দেখা যাক।</p>

<h3>TH sound — /θ/ ও /ð/</h3>
<p>English-এ দুই ধরনের TH আছে: <span class="kw">voiceless /θ/</span> (think, three, throw — vocal cord কাঁপে না) আর <span class="kw">voiced /ð/</span> (this, that, these — vocal cord কাঁপে)। বাংলায় এই sound-এর কোনো সমতুল্য অক্ষর নেই, তাই আমরা স্বভাবতই কাছাকাছি sound দিয়ে replace করি — /t/, /d/ অথবা /s/, /z/ দিয়ে। ফলে "think" হয়ে যায় "tink", "this" হয়ে যায় "dis"।</p>
<p>সঠিক উচ্চারণের জন্য জিভের ডগা উপরের দাঁতের একদম কিনারায় (দাঁত আর ঠোঁটের মাঝে) হালকা করে ছুঁইয়ে বাতাস বের করতে হয় — দাঁতের পেছনে জিভ ঠেকানো (যেমন /t/, /d/-এ হয়) নয়।</p>

<h3>V বনাম W বনাম B — বিভ্রান্তি</h3>
<p>বাংলা ভাষায় /v/ sound নেই — আমরা "ভ" বা "ব" দিয়ে কাজ চালাই, ফলে <span class="kw">/v/</span> আর <span class="kw">/b/</span> প্রায়ই মিলেমিশে যায়। আবার /v/ আর /w/-ও গুলিয়ে ফেলা হয়, কারণ দুটোই ঠোঁটের কাছাকাছি সম্পর্কিত মনে হয়। কিন্তু তিনটা সম্পূর্ণ আলাদা: /b/-এ ঠোঁট সম্পূর্ণ বন্ধ হয়ে হঠাৎ খোলে, /v/-এ উপরের দাঁত নিচের ঠোঁটে হালকা ছোঁয় আর বাতাস ঘষে বের হয়, আর /w/-এ দুই ঠোঁট গোল করে ভেতরের দিকে টেনে "উ"-এর মতো sound তৈরি হয়।</p>

<h3>R sound — retroflex approximant</h3>
<p>বাংলার "র" জিভ দিয়ে তালুতে হালকা টোকা দিয়ে (tap) বা মাঝে মাঝে গড়িয়ে (roll) উচ্চারিত হয়। English /r/ সম্পূর্ণ ভিন্ন — এটা একটা <span class="kw">approximant</span>, জিভ কোথাও ছোঁয় না, বরং জিভের ডগা সামান্য পেছনে কার্ল (curl) করে মুখের ছাদের কাছাকাছি নিয়ে আসতে হয়। তাই "very", "server", "retry" বলার সময় জিভ যেন কোথাও টোকা না দেয়, বরং একটানে গড়িয়ে যায়।</p>
<p>আরেকটা গুরুত্বপূর্ণ পার্থক্য হলো <span class="kw">rhotic</span> বনাম <span class="kw">non-rhotic</span> accent। American English-এ vowel-এর পরেও /r/ উচ্চারিত হয় — যেমন "car", "server", "error"। British English-এ vowel-এর পরের /r/ প্রায়ই drop হয়ে যায় (car → "cah")। দুটোই সঠিক, কিন্তু একটা ঠিক করে সেটাতেই স্থির থাকা ভালো — মাঝপথে দুটো mix করলে শোনার সময় অসংগতি লাগে।</p>

<h3>শেষের consonant cluster ও dropped ending</h3>
<p>বাংলা শব্দে সাধারণত এত জটিল consonant cluster শব্দের শেষে থাকে না, তাই ইংরেজি বলার সময় আমরা অজান্তেই শেষের sound গুলো ছেঁটে ফেলি। "asked" /ɑːskt/-এর /s/, /k/, /t/ তিনটাই উচ্চারণ না করলে সেটা শোনায় "ask" বা এমনকি "as"-এর মতো। এটা শুধু accent-এর ব্যাপার না — এখানে <span class="kw">grammar</span>-ই পাল্টে যায়, কারণ past tense-এর -ed ending drop হলে শ্রোতা বুঝতে পারে না আপনি past বলছেন না present।</p>

<div class="callout why"><span class="tag">Accent-free নয়, unambiguous — এটাই আসল লক্ষ্য</span>Consonant precision নিয়ে এত বিস্তারিত আলোচনার কারণ হলো — একজন non-native speaker কখনোই সম্পূর্ণ "native accent" পাবেন না, আর সেটার দরকারও নেই। কিন্তু TH, V, R, বা -ed ending-এর মতো sound ভুল হলে অনেক সময় শব্দের অর্থই পাল্টে যায় (ban vs van, ask vs asked)। তাই লক্ষ্য হওয়া উচিত consonant গুলো এমনভাবে উচ্চারণ করা যাতে শ্রোতা বিভ্রান্ত না হন — accent থাকতেই পারে, কিন্তু meaning যেন সবসময় স্পষ্ট থাকে।</div>

<h2 class="title">৪. Word Stress ও Syllable — Technical শব্দের সঠিক উচ্চারণ</h2>
<p class="lead">বাংলায় আমরা প্রায় প্রতিটা syllable-এ সমান জোর দিয়ে কথা বলি — এটাকে বলে syllable-timed rhythm। কিন্তু English একটা <span class="kw">stress-timed language</span> — একটা শব্দে একটা নির্দিষ্ট syllable-এ জোর (stress) পড়ে, বাকিগুলো তুলনামূলক দ্রুত ও হালকাভাবে উচ্চারিত হয়। এই chapter-এ আমরা শিখব কেন stress এত গুরুত্বপূর্ণ, কিছু সাধারণ নিয়ম, আর সবচেয়ে বেশি ব্যবহৃত technical শব্দগুলোর সঠিক stress pattern।</p>

<h3>Word Stress আসলে কী, এবং এটা কেন গুরুত্বপূর্ণ</h3>
<p>প্রতিটা multi-syllable ইংরেজি শব্দে একটা syllable অন্যগুলোর চেয়ে জোরে, লম্বা সময় ধরে, এবং একটু উঁচু pitch-এ উচ্চারিত হয় — একে বলে <span class="kw">primary stress</span>। যেমন <code>de-VE-lo-per</code> শব্দে "VE" অংশটা বাকি তিনটার চেয়ে স্পষ্টভাবে জোরালো। বাংলায় আমরা "ডেভেলপার" বললে প্রতিটা অংশ প্রায় সমান জোরে বলি, তাই এই stress pattern স্বাভাবিকভাবে আসে না — এটা আলাদাভাবে শিখে practice করতে হয়।</p>
<div class="callout why"><span class="tag">Stress কেন vowel-এর চেয়েও বেশি জরুরি</span>একজন native বা fluent English speaker শব্দ চেনার সময় মূলত <span class="kw">stress pattern</span>-এর উপর নির্ভর করে, প্রতিটা vowel-এর নিখুঁত উচ্চারণের উপর নয়। তাই vowel সামান্য ভুল হলেও শ্রোতা প্রসঙ্গ থেকে বুঝে নিতে পারে, কিন্তু stress ভুল জায়গায় পড়লে মস্তিষ্ক শব্দটাকেই ভিন্ন একটা শব্দ হিসেবে process করার চেষ্টা করে — ফলে সঠিক উচ্চারণ সত্ত্বেও শব্দটা বোধগম্য থাকে না।</div>

<h3>সাধারণ নিয়ম — Noun বনাম Verb Stress</h3>
<p>ইংরেজিতে অনেক দুই-syllable শব্দ noun হিসেবে ব্যবহার হলে প্রথম syllable-এ এবং verb হিসেবে ব্যবহার হলে দ্বিতীয় syllable-এ stress নেয়। এটা কোনো strict নিয়ম নয়, কিন্তু খুব common একটা pattern — বিশেষ করে record, produce, project, permit, contract-এর মতো শব্দে দেখা যায়।</p>

<h3>Common Mistake — Last-Syllable বা Equal Stress-এর প্রবণতা</h3>

<h2 class="title">৫. Sentence Stress, Rhythm ও Intonation</h2>
<p class="lead">শব্দ সঠিক আর গ্রামার নিখুঁত হলেও যদি বলার সুর (tone) আর ছন্দ (rhythm) ঠিক না থাকে, তাহলে standup-এ বা interview-তে আপনাকে অস্পষ্ট, অনিশ্চিত বা বিরক্ত মনে হতে পারে। এই chapter-এ আমরা দেখব ইংরেজি বলার সময় কোন শব্দে জোর পড়ে, শব্দগুলো কীভাবে একসাথে মিশে যায়, আর প্রশ্ন-উত্তর-list বলার সময় সুর কোন দিকে ওঠে-নামে — যাতে আপনার কথা শুনতে <span class="kw">confident</span> আর natural লাগে।</p>

<h3>Content words vs Function words — কোন শব্দে জোর পড়ে</h3>
<p>বাংলায় আমরা মোটামুটি প্রতিটা শব্দকে সমান গুরুত্ব দিয়ে উচ্চারণ করি। কিন্তু ইংরেজি একটা <span class="kw">stress-timed</span> ভাষা — মানে বাক্যের মধ্যে শুধু কিছু নির্দিষ্ট শব্দে জোর (stress) পড়ে, বাকিগুলো দ্রুত আর হালকাভাবে উচ্চারিত হয়। যেসব শব্দ অর্থ বহন করে — noun, main verb, adjective, adverb — সেগুলোকে বলে <span class="kw">content words</span>, আর এগুলোতেই জোর পড়ে। আর articles (a, the), prepositions (to, in, on), auxiliary verbs (is, was, have), pronoun (it, he, they) — এগুলো হলো <span class="kw">function words</span>, এগুলো গ্রামার ঠিক রাখে কিন্তু নিজে থেকে বাড়তি অর্থ যোগ করে না, তাই এগুলো de-stress করে দ্রুত বলা হয়।</p>
<pre><span class="c"># কোন শব্দে stress পড়ছে দেখুন (CAPS = stressed)</span>
I de-PLOYED the SER-vice to pro-DUC-tion YES-ter-day.</pre>
<p>লক্ষ করুন — <code>I</code>, <code>the</code>, <code>to</code> এই function words প্রায় অস্পষ্টভাবে দ্রুত চলে যায়, কিন্তু <code>DEPLOYED</code>, <code>SERVICE</code>, <code>PRODUCTION</code>, <code>YESTERDAY</code> — এই content words-এ স্পষ্ট জোর পড়ে। এই জোর-অজোরের প্যাটার্নই ইংরেজির স্বাভাবিক rhythm তৈরি করে। এই rhythm অভ্যাস না করলে বাক্য শুনতে "রোবটিক" বা "শব্দ-বাই-শব্দ" মনে হয়।</p>

<h3>Connected Speech ও Linking — শব্দগুলো কীভাবে মিশে যায়</h3>
<p>স্বাভাবিক গতিতে কথা বললে ইংরেজিতে শব্দগুলো আলাদা আলাদা করে উচ্চারিত হয় না, বরং একটার শেষ আরেকটার শুরুর সাথে মিশে যায় — একে বলে <span class="kw">linking</span>। যখন একটা শব্দ consonant দিয়ে শেষ হয় আর পরের শব্দ vowel দিয়ে শুরু হয়, তখন সেগুলো একসাথে জোড়া লেগে যায়।</p>
<pre><span class="c"># linking-এর উদাহরণ</span>
"Check it in"  →  শোনায় "che-KI-tin"
"Turn it off"  →  শোনায় "TUR-ni-TOFF"
"Log in"       →  শোনায় "LO-gin"</pre>
<p>এর পাশাপাশি কথ্য ইংরেজিতে কিছু <span class="kw">contraction</span> খুব সাধারণ, বিশেষ করে developer-দের আড্ডা বা standup-এ: <code>gonna</code> (going to), <code>wanna</code> (want to), <code>gotta</code> (got to), <code>I'd've</code> (I would have)। যেমন — "I'm gonna push this fix today" বা "We gotta fix that bug before release।"</p>
<div class="callout mistake"><span class="tag">লিখিত ইংরেজিতে ব্যবহার করবেন না</span>এই contraction গুলো শুধু <b>কথ্য</b> ভাষার জন্য — casual standup বা আড্ডায় স্বাভাবিক। কিন্তু PR description, technical document, বা client email-এ "gonna", "wanna" লেখা অপেশাদার (unprofessional) মনে হবে। লিখিত ইংরেজির formality নিয়ে বিস্তারিত থাকবে পরের একটা chapter-এ।</div>

<h3>Intonation Patterns — কথার সুর কোন দিকে যায়</h3>
<p>ইংরেজিতে বাক্যের শেষে সুর ওঠে না নামে, সেটার উপর নির্ভর করে বাক্যের অর্থ আর উদ্দেশ্য বদলে যায়। তিনটা প্রধান প্যাটার্ন মনে রাখুন — statement আর wh-question-এ সুর <span class="kw">নামে</span> (falling ↘), yes/no question-এ সুর <span class="kw">ওঠে</span> (rising ↗), আর list বা option বলার সময় প্রতিটা item-এ ওঠে, শেষ item-এ নামে।</p>
<pre><span class="c"># falling — statement ও wh-question</span>
I deployed the service. ↘
What did you deploy? ↘

<span class="c"># rising — yes/no question</span>
Did the tests pass? ↗
Is the pipeline green? ↗

<span class="c"># rising-falling — list/options</span>
We can use Redis↗, Postgres↗, or Kafka↘.</pre>
<table>
<tr><th>বাক্যের ধরন</th><th>Intonation</th><th>উদাহরণ</th></tr>
<tr><td>Statement</td><td>Falling ↘</td><td>The build failed. ↘</td></tr>
<tr><td>Wh-question (what/why/how)</td><td>Falling ↘</td><td>Why did the build fail? ↘</td></tr>
<tr><td>Yes/No question</td><td>Rising ↗</td><td>Did you fix the bug? ↗</td></tr>
<tr><td>List / options</td><td>Rising↗ … Falling↘ (শেষে)</td><td>Staging↗, QA↗, or Production↘?</td></tr>
</table>

<h3>Flat বা Monotone বলা কেন সমস্যা</h3>
<p>অনেকেই স্কুলে ইংরেজি শিখেছেন শব্দ-বাই-শব্দ পড়ে, তাই বলার সময়ও প্রতিটা শব্দ সমান জোর দিয়ে, সমান pitch-এ, flat ভাবে বলে ফেলেন। টেকনিক্যালি বাক্যের গ্রামার আর content সঠিক হলেও এই <span class="kw">monotone delivery</span> শুনতে অনিশ্চিত, বিরক্তিকর বা অস্পষ্ট শোনায় — শ্রোতা বুঝতে পারেন না কোনটা গুরুত্বপূর্ণ তথ্য, কোনটা না।</p>
<div class="callout why"><span class="tag">Tone আসলে perception বদলে দেয়</span>Standup বা interview-তে আপনার কথার content ঠিক থাকলেও, monotone আর flat delivery শুনলে শ্রোতা (বিশেষ করে native speaker manager বা client) ধরে নেন আপনি ব্যাপারটা নিয়ে নিশ্চিত না, অথবা গুরুত্ব দিচ্ছেন না। অর্থাৎ সঠিক stress আর intonation শুধু অর্থ স্পষ্ট করে না — এটা আপনাকে কতটা confident ও competent মনে হচ্ছে, সেটাও নির্ধারণ করে।</div>
<div class="callout mistake"><span class="tag">Common mistake — শব্দ-বাই-শব্দ পড়া</span>স্কুলে শেখানো পদ্ধতিতে অনেকে ইংরেজি বাক্য এমনভাবে পড়েন যেন প্রতিটা শব্দ আলাদা একটা ইউনিট — "I. Deployed. The. Service." এভাবে থেমে থেমে, সমান জোর দিয়ে। স্বাভাবিক ইংরেজিতে বরং শব্দগুলো <span class="kw">stress group</span>-এ একসাথে চলে, যেমন "I deployed" একসাথে একটা প্রবাহে বলা হয়, মাঝে থেমে থেমে না। প্রতিটা শব্দ আলাদা করে জোর দিয়ে বলাটাই flat, রোবটিক শোনানোর মূল কারণ।</div>

<h3>Practice Exercise — একটা standup update মার্কআপ করে অনুশীলন</h3>
<p>নিচের বাস্তব standup update sentence-টা নিন, তারপর stress (CAPS) আর intonation (↘ ↗) মার্ক করে জোরে জোরে কয়েকবার পড়ুন।</p>
<pre><span class="c"># Step 1 — সাধারণ বাক্য</span>
Yesterday I fixed the login bug and pushed the changes. Today I'm gonna review Rasel's PR.

<span class="c"># Step 2 — stress ও intonation মার্ক করা</span>
YES-ter-day I FIXED the LO-gin BUG and PUSHED the CHANG-es. ↘
to-DAY I'm gonna re-VIEW Ra-SEL's P-R. ↘</pre>
<p>এবার এটা অন্তত পাঁচবার জোরে পড়ুন — প্রতিবার শুধু CAPS করা শব্দগুলোতে জোর দিন, বাকি শব্দগুলো দ্রুত আর হালকাভাবে বলুন, আর বাক্যের শেষে সুর নামিয়ে আনুন। তারপর নিজের কণ্ঠ রেকর্ড করে শুনুন — flat লাগছে, নাকি স্বাভাবিক ছন্দে বাক্যটা প্রবাহিত হচ্ছে?</p>
<div class="callout best"><span class="tag">Best practice — নিজের কণ্ঠ রেকর্ড করে তুলনা করুন</span>নিজের standup update ফোনে রেকর্ড করুন, তারপর একই ধরনের content-এর একটা native speaker recording (যেমন YouTube-এ কোনো engineering standup বা tech talk clip) খুঁজে বের করে পাশাপাশি শুনুন। তুলনা করার সময় শুধু "শব্দ ঠিক আছে কিনা" দেখবেন না — <b>rhythm আর stress pattern মিলছে কিনা</b> সেটাতেই মনোযোগ দিন। শব্দ ভুল হলেও rhythm ঠিক থাকলে শুনতে অনেক বেশি natural আর confident লাগে।</div>

<h2 class="title">৬. Basic Grammar ১ — Sentence Structure ও Tense</h2>
<p class="lead">Grammar-এর ভুল বেশিরভাগ সময় "rule না জানার" সমস্যা না — এটা মূলত <span class="kw">sentence-building habit</span>-এর সমস্যা। বাংলা আর ইংরেজি sentence বানানোর পদ্ধতি একদম উল্টো, তাই মাথায় বাংলায় ভাবা sentence সরাসরি ইংরেজিতে বসিয়ে দিলে সেটা awkward শোনায়। এই chapter-এ আমরা সেই মূল কারণটা ধরব, আর present-past-future tense-এর ব্যবহারিক পার্থক্যগুলো দেখব যা standup, code review আর client call-এ প্রতিদিন লাগে।</p>

<h3>মূল সমস্যা — SOV বনাম SVO</h3>
<p>বাংলা একটা <span class="kw">SOV</span> ভাষা — মানে sentence-এর গঠন হয় Subject-Object-Verb, আর verb সবসময় শেষে আসে। ইংরেজি হলো <span class="kw">SVO</span> ভাষা — Subject-Verb-Object, verb মাঝখানে বসে। যেমন বাংলায় আমরা বলি "আমি সার্ভিসটা deploy করলাম" — এখানে verb ("করলাম") সবার শেষে। কিন্তু ইংরেজিতে হবে "I deployed the service" — verb ("deployed") দ্বিতীয় position-এ, শেষে না।</p>
<p>স্বতঃস্ফূর্তভাবে (spontaneously) কথা বলার সময় মস্তিষ্ক আগে বাংলা order-এ sentence build করে, তারপর সেটাকে শব্দে শব্দে ইংরেজিতে translate করার চেষ্টা করে — আর ঠিক এখানেই সমস্যা তৈরি হয়। কারণ verb শেষে রাখার অভ্যাস থেকে বেরিয়ে আসা কঠিন, ফলে sentence অসম্পূর্ণ থেকে যায়, বা word-order উল্টে যায়, বা মাঝপথে থেমে গিয়ে reconstruct করতে হয়।</p>

<p>Sentence বানানোর আগে এই building block গুলো চেনা দরকার। প্রতিটার সাথে একটা dev-relevant উদাহরণ দেওয়া হলো।</p>

<h3>Present Tense — তিনটা রূপ, তিনটা ভিন্ন অর্থ</h3>
<p>বাংলায় আমরা সাধারণত সব present-কে এক রকম বলি — "আমি কাজ করছি" বলতে গিয়ে habit, এখনকার কাজ, আর সদ্য-শেষ-হওয়া কাজ সবকিছুই "করছি/করি" দিয়ে চালিয়ে দিই। ইংরেজিতে কিন্তু এই তিনটার জন্য আলাদা tense আছে, আর অর্থও আলাদা — এই পার্থক্য না বুঝলে শ্রোতা বুঝতেই পারবে না আপনি কী বলতে চাইছেন।</p>

<p>লক্ষ্য করুন — "I deploy the service every Friday" মানে এটা প্রতি শুক্রবার নিয়মিত করি (habit)। কিন্তু "I am deploying the service" মানে এই মুহূর্তে সেটা চলছে। আর "I have deployed the service" মানে deploy করা শেষ হয়ে গেছে এবং এখন সেটার result বা status relevant — যেমন "I have deployed the service, so you can test it now।" এই তৃতীয়টা বাংলা speaker-দের কাছে সবচেয়ে বেশি গুলিয়ে যায়, কারণ বাংলায় এর জন্য আলাদা কোনো ব্যাকরণিক রূপ নেই।</p>

<h3>Stative Verb — যেসব verb কখনো Continuous (-ing) হয় না</h3>
<p>Present Continuous শেখার পর একটা খুব সাধারণ ভুল হলো — সব verb-কেই "-ing" বসিয়ে continuous বানানোর চেষ্টা করা, যেন এখনই ঘটছে সেটা বোঝাতে হবে। কিন্তু <span class="kw">know</span>, <span class="kw">understand</span>, <span class="kw">agree</span>, <span class="kw">want</span>, <span class="kw">need</span>, <span class="kw">believe</span>, <span class="kw">own</span>, <span class="kw">prefer</span>-এর মতো <span class="kw">stative verb</span> কোনো action না, বরং একটা মানসিক অবস্থা বা স্থায়ী সত্য বোঝায় — আর ইংরেজিতে state কখনো "চলমান" (continuous) হয় না, তাই এগুলো সবসময় simple form-এ থাকে, বিষয়টা এই মুহূর্তে ঘটছে হলেও।</p>

<div class="callout mistake"><span class="tag">Common mistake — প্রতিটা "এখন ঘটছে" অনুভূতিকে -ing দিয়ে বলা</span>বাংলায় "আমি বুঝছি", "আমি জানছি" শুনতে continuous-এর মতো লাগে, তাই সরাসরি অনুবাদ করলে "I am understanding", "I am knowing" বেরিয়ে আসে। কিন্তু ইংরেজিতে stative verb-এর জন্য simple present-ই যথেষ্ট এবং সঠিক — "I understand", "I know" নিজেই বোঝায় যে এটা এখনকার অবস্থা। এই ভুলটা interview বা client call-এ বেশ চোখে পড়ে, কারণ এটা প্রায় প্রতিটা বাক্যে সম্ভাব্য।</div>

<h3>Since বনাম For — কতদিন ধরে চলছে সেটা বলার নিয়ম</h3>
<p>Present Perfect দিয়ে কোনো কাজ কতদিন ধরে চলছে বলতে গেলে <span class="kw">since</span> আর <span class="kw">for</span>-এর পার্থক্যটা প্রায়ই গুলিয়ে যায় — বিশেষ করে ইন্টারভিউতে নিজের অভিজ্ঞতার কথা বলার সময়। <span class="kw">since</span> ব্যবহার হয় একটা নির্দিষ্ট শুরুর বিন্দু বোঝাতে (2020, last March, join করার পর থেকে), আর <span class="kw">for</span> ব্যবহার হয় সময়ের length বোঝাতে (৩ বছর, ৬ মাস, দুই সপ্তাহ)।</p>
<table>
<tr><th>ভুল</th><th>সঠিক</th></tr>
<tr><td>"I am working here since three years."</td><td>"I have been working here for three years."</td></tr>
<tr><td>"I am using this framework for 2020."</td><td>"I have been using this framework since 2020."</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Interview-এ since/for উল্টে ফেলা</span>"I am working here since three years" — একসাথে দুটো ভুল: continuous form ব্যবহার (উচিত ছিল present perfect continuous) আর ভুল preposition (since-এর বদলে for হওয়া উচিত)। ইন্টারভিউতে নিজের অভিজ্ঞতা বলতে গিয়ে এই বাক্যটা এতবার শোনা যায় যে অনেক interviewer সাথে সাথে খেয়াল করেন। মনে রাখার সহজ উপায় — since-এর পরে সবসময় একটা point in time (2020, last year, joining), আর for-এর পরে সবসময় একটা duration (three years, six months)।</div>

<h3>Past ও Future Tense — dev standup-এর বাস্তব উদাহরণ</h3>
<p>Standup আর status update-এ past আর future tense সবচেয়ে বেশি লাগে — কালকে কী করেছেন, আজ কী করছেন/করবেন সেটা বলার জন্য। নিচের টেবিলে চারটা গুরুত্বপূর্ণ রূপ দেওয়া হলো।</p>
<table><tr><th>Tense</th><th>কখন ব্যবহার হয়</th><th>উদাহরণ</th></tr>
<tr><td><span class="kw">Past Simple</span></td><td>past-এ শেষ হওয়া একটা কাজ</td><td>"I fixed the bug yesterday."</td></tr>
<tr><td><span class="kw">Past Continuous</span></td><td>past-এর একটা মুহূর্তে চলছিল</td><td>"I was debugging when the call started."</td></tr>
<tr><td><span class="kw">Past Perfect</span></td><td>আরেকটা past event-এর আগে ঘটেছিল</td><td>"I had already deployed before the client called."</td></tr>
<tr><td><span class="kw">Future — will</span></td><td>তাৎক্ষণিক decision / prediction</td><td>"I will merge this after tests pass."</td></tr>
<tr><td><span class="kw">Future — going to</span></td><td>আগে থেকে planned intention</td><td>"I am going to refactor this next sprint."</td></tr>
</table>
<p><code>will</code> সাধারণত তখন ব্যবহার হয় যখন decision-টা কথা বলার মুহূর্তেই নেওয়া হচ্ছে, বা কোনো প্রতিশ্রুতি/prediction — যেমন "Tests pass করলে আমি এটা merge করে দেব।" আর <code>going to</code> ব্যবহার হয় যখন plan আগে থেকেই ঠিক করা আছে — যেমন "পরের sprint-এ আমরা এটা refactor করার plan করেছি।" এই পার্থক্যটা client call-এ commitment বোঝাতে গুরুত্বপূর্ণ — "I will fix it" শুনতে instant commitment মনে হয়, কিন্তু "I am going to fix it in the next release" শুনতে already-planned মনে হয়।</p>
<pre><span class="c"># Standup update — past, present, future একসাথে</span>
Yesterday, I fixed the login bug.
Right now, I am writing unit tests for it.
I will deploy it once the review is approved.
</pre>

<h3>সবচেয়ে সাধারণ ভুল — Auxiliary Verb (be/have/do) বাদ দেওয়া</h3>
<p>বাংলায় "আমি কাজ করছি" বলতে আলাদা কোনো helping word লাগে না — verb-এর form নিজেই সেটা বহন করে। কিন্তু ইংরেজিতে continuous, perfect, বা negative sentence বানাতে <span class="kw">auxiliary verb</span> (am/is/are, have/has, do/does) অবশ্যই লাগে। বাংলা speaker-রা প্রায়ই এই auxiliary বাদ দিয়ে ফেলেন, কারণ বাংলায় এর কোনো সমতুল্য শব্দ নেই।</p>
<table><tr><th>ভুল</th><th>সঠিক</th></tr>
<tr><td>"I working on it."</td><td>"I am working on it."</td></tr>
<tr><td>"I not sure."</td><td>"I am not sure." / "I'm not sure."</td></tr>
<tr><td>"He finished the task."(ঠিক আছে, কিন্তু continuous বোঝাতে গেলে)</td><td>"He is finishing the task." (এখনো চলছে বোঝাতে)</td></tr>
<tr><td>"She not agree with this approach."</td><td>"She doesn't agree with this approach."</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — auxiliary verb বাদ দেওয়া</span>"I working on it" বা "I not sure" এই ধরনের sentence বাংলা structure-এর সরাসরি প্রভাব — বাংলায় verb-ই যথেষ্ট, কিন্তু ইংরেজিতে <code>be</code>, <code>have</code>, <code>do</code> ছাড়া sentence অসম্পূর্ণ থেকে যায় এবং শুনতে ভাঙা ইংরেজি মনে হয়। প্রতিটা continuous ("-ing") sentence-এর আগে am/is/are বসছে কিনা, আর প্রতিটা negative sentence-এ do/does/am/is/are + not আছে কিনা — এই দুইটা check habit করে নিন।</div>

<h3>Subject-Verb Agreement — He/She/It-এর পরে Verb-এ -s ভুলে যাওয়া</h3>
<p>বাংলায় verb-এর রূপ subject অনুযায়ী তেমন বদলায় না ("আমি যাই", "সে যায়" — verb-এর মূল অংশ প্রায় একই), কিন্তু ইংরেজিতে Present Simple-এ subject <span class="kw">he/she/it</span> (বা singular noun) হলে verb-এর শেষে অবশ্যই <code>-s</code> বা <code>-es</code> যোগ করতে হয়। বাংলা speaker-রা প্রায়ই এই ছোট্ট <code>-s</code>-টা বাদ দিয়ে ফেলেন, কারণ বাংলা structure-এ এর সমতুল্য কিছু নেই।</p>
<table>
<tr><th>ভুল</th><th>সঠিক</th></tr>
<tr><td>"The server crash every night."</td><td>"The server crashes every night."</td></tr>
<tr><td>"He work remotely on Fridays."</td><td>"He works remotely on Fridays."</td></tr>
<tr><td>"This function return null if the input is empty."</td><td>"This function returns null if the input is empty."</td></tr>
<tr><td>"She always test her code before pushing."</td><td>"She always tests her code before pushing."</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — singular subject-এ verb-এর -s বাদ দেওয়া</span>এই ভুলটা এতটাই ছোট যে বলার সময় নিজে ধরাও কঠিন, কিন্তু লেখা বা presentation-এ বারবার হলে non-native ছাপ স্পষ্ট হয়ে ওঠে। System বা code-এর আচরণ বর্ণনা করার সময় ("the function returns", "the service depends on") এই প্যাটার্নটা খুব ঘন ঘন আসে, তাই এখানে সচেতন থাকা বিশেষভাবে জরুরি — subject singular (he/she/it, বা কোনো একটা জিনিসের নাম, যেমন "the database", "this endpoint") হলেই verb-এ -s বসবে কিনা, এই একটা প্রশ্ন নিজেকে জিজ্ঞেস করার অভ্যাস করুন।</div>

<h3>অভ্যাস তৈরির উপায়</h3>
<p>শুধু rule পড়ে এই অভ্যাস বদলানো যায় না — এর জন্য মুখে বলে practice করতে হবে, কারণ সমস্যাটা knowledge-এর না, habit-এর।</p>
<div class="callout best"><span class="tag">Best practice — জোরে বলে practice করুন</span>প্রতিদিন meeting-এ যাওয়ার আগে নিজের কাজ নিয়ে ৩-৪টা simple SVO sentence জোরে বলে practice করুন — "I fixed the bug", "I am reviewing the PR", "I will deploy tomorrow।" এতে মস্তিষ্ক সরাসরি ইংরেজি order-এ sentence build করার অভ্যাস পায়, বাংলা order থেকে translate করার দরকার পড়ে না। শুরুতে ধীরে বললেও সমস্যা নেই — লক্ষ্য হলো subject-verb-object এই ক্রমটাকে reflex বানানো, যাতে আসল meeting-এ চিন্তা না করেই সঠিক order-এ কথা বেরিয়ে আসে।</div>

<h2 class="title">৭. Basic Grammar ২ — Article, Preposition ও Modal Verb</h2>
<p class="lead">এই অধ্যায়ে আমরা এমন তিনটা জিনিস নিয়ে কথা বলব যেগুলো বাংলা ভাষায় সরাসরি নেই — article (a/an/the), preposition-এর নির্দিষ্ট ব্যবহার, আর modal verb-এর মাধ্যমে politeness প্রকাশ। এই তিনটাই ছোট ছোট শব্দ, কিন্তু এগুলো ঠিকমতো ব্যবহার না করলে আপনার English শোনায় ভাঙা ভাঙা, আর code review-এর মতো লিখিত জায়গায় ভুল modal ব্যবহার করলে আপনার কথা অনিচ্ছাকৃতভাবে রূঢ় শোনাতে পারে।</p>

<h3>Article — a/an/the: বাংলায় যার কোনো সমতুল্য নেই</h3>
<p>বাংলা ভাষায় article বলে কিছু নেই। আমরা বলি "আমি bug ঠিক করেছি" — এখানে "একটা bug" নাকি "সেই নির্দিষ্ট bug" তা প্রসঙ্গ থেকে বোঝা যায়, আলাদা শব্দ লাগে না। কিন্তু English-এ এই পার্থক্যটা <span class="kw">article</span> দিয়ে বাধ্যতামূলকভাবে বলে দিতে হয়। এই কারণেই বাংলাভাষী ইঞ্জিনিয়াররা প্রায়ই বলেন "I fixed bug" — যেটা native speaker-এর কানে সাথে সাথে অস্বাভাবিক লাগে, কারণ ওদের ব্রেইন "a bug" বা "the bug" প্রত্যাশা করে।</p>
<p>সহজ নিয়ম মনে রাখুন — <span class="kw">a/an</span> ব্যবহার হয় যখন প্রথমবার কোনো একটা countable জিনিসের কথা বলা হয় (যেটা শ্রোতা এখনো জানে না কোনটা)। <span class="kw">the</span> ব্যবহার হয় যখন জিনিসটা নির্দিষ্ট, আগে থেকে আলোচিত, অথবা একমাত্র (unique)। আর uncountable concept, general idea, বা বেশিরভাগ proper noun (ভাষা, টুল, ফ্রেমওয়ার্কের নাম)-এর আগে কোনো article লাগে না।</p>
<table>
<tr><th>Phrase</th><th>ব্যাখ্যা</th></tr>
<tr><td>"I need <b>a</b> database for this service."</td><td>প্রথমবার উল্লেখ — যেকোনো একটা database, নির্দিষ্ট না</td></tr>
<tr><td>"<b>The</b> database is down again."</td><td>নির্দিষ্ট — যে database নিয়ে আগে কথা হয়েছে</td></tr>
<tr><td>"<b>The</b> API returned a 500 error."</td><td>নির্দিষ্ট, দুজনেই জানে কোন API</td></tr>
<tr><td>"We need <b>an</b> algorithm to sort this."</td><td>প্রথমবার, vowel sound তাই "an"</td></tr>
<tr><td>"<b>Kubernetes</b> is popular for orchestration." (no article)</td><td>টেকনোলজির নাম, general concept — article নেই</td></tr>
<tr><td>"<b>The</b> Kubernetes cluster is down."</td><td>নির্দিষ্ট instance — এখন article লাগবে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — article একেবারে বাদ দেওয়া</span>অনেকে সবসময় বলেন "bug", "server", "test" — কখনো "a bug", কখনো "the bug" বলেন না। এটা বোঝা যায়, কিন্তু শুনতে খুবই non-native লাগে, এবং কখনো কখনো সত্যিকারের ambiguity তৈরি করে — শ্রোতা বুঝতে পারে না আপনি একটা নির্দিষ্ট bug-এর কথা বলছেন, নাকি সাধারণভাবে bug সম্পর্কে বলছেন।</div>

<h3>Uncountable Noun — কখনো Plural (-s) হয় না, "a/an" ও লাগে না</h3>
<p>Article-এর মতোই আরেকটা কাছাকাছি সমস্যা হলো — কিছু ইংরেজি noun-কে <span class="kw">uncountable</span> হিসেবে ধরা হয় (গুণে গুণে বলা যায় না, ভরে/পরিমাণে ধরা হয়), অথচ বাংলায় এই একই শব্দগুলো গণনাযোগ্য মনে হয়। ফলে বাংলাভাষী ইঞ্জিনিয়াররা প্রায়ই এগুলোকে ভুলভাবে plural করে ফেলেন বা আগে "a/an" বসিয়ে দেন — "feedbacks", "informations", "an advice"।</p>
<table>
<tr><th>ভুল</th><th>সঠিক</th></tr>
<tr><td>"Can you give me some feedbacks on this PR?"</td><td>"Can you give me some feedback on this PR?"</td></tr>
<tr><td>"I need more informations about the API."</td><td>"I need more information about the API."</td></tr>
<tr><td>"Let me give you an advice."</td><td>"Let me give you a piece of advice." / "Let me give you some advice."</td></tr>
<tr><td>"We bought a new equipments for the server room."</td><td>"We bought new equipment for the server room."</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Uncountable noun-কে plural করে ফেলা</span><code>feedback</code>, <code>information</code>, <code>advice</code>, <code>equipment</code>, <code>software</code> — এই শব্দগুলো ইংরেজিতে সবসময় singular form-এ থাকে, "-s" যোগ হয় না, আর "a/an" এককভাবে বসে না। পরিমাণ বোঝাতে হলে "some", "a lot of", বা "a piece of" ব্যবহার করুন — যেমন "a piece of advice", "a lot of feedback"। Code review বা status update-এ এই শব্দগুলো ঘন ঘন আসে, তাই ভুলটাও ঘন ঘন শোনা যায়।</div>

<h3>Common tech preposition phrase — এগুলো ফিক্সড, মুখস্থ করে ফেলুন</h3>
<p>ইংরেজিতে অনেক শব্দের সাথে একটা নির্দিষ্ট preposition আটকে থাকে — এগুলো যুক্তি দিয়ে বোঝা যায় না, শুধু মুখস্থ করে নিতে হয়। ইঞ্জিনিয়ারিং কথাবার্তায় এই phrase-গুলো প্রতিদিন ব্যবহার হয়।</p>
<table>
<tr><th>Phrase</th><th>Example</th></tr>
<tr><td><span class="kw">depends on</span></td><td>"The deployment time depends on the image size."</td></tr>
<tr><td><span class="kw">based on</span></td><td>"We chose this design based on last sprint's feedback."</td></tr>
<tr><td><span class="kw">responsible for</span></td><td>"I'm responsible for the payment service."</td></tr>
<tr><td><span class="kw">related to</span></td><td>"This bug is related to the caching layer."</td></tr>
<tr><td><span class="kw">compatible with</span></td><td>"This library isn't compatible with Node 18."</td></tr>
<tr><td><span class="kw">consistent with</span></td><td>"Let's keep the naming consistent with the rest of the codebase."</td></tr>
<tr><td><span class="kw">different from</span></td><td>"Staging behaves different from production."</td></tr>
<tr><td><span class="kw">similar to</span></td><td>"This error is similar to the one we saw last week."</td></tr>
<tr><td><span class="kw">in charge of</span></td><td>"Who's in charge of the release pipeline this week?"</td></tr>
</table>

<h3>Preposition of time ও place — in/on/at</h3>
<p>Time এবং place-এর জন্য <code>in</code>, <code>on</code>, <code>at</code> — এই তিনটা preposition গুলিয়ে ফেলা খুবই সাধারণ একটা ভুল। মোটামুটি নিয়ম হলো — বড় সময়/জায়গার জন্য <code>in</code>, মাঝারি নির্দিষ্ট দিনের জন্য <code>on</code>, আর একদম নির্দিষ্ট পয়েন্টের জন্য <code>at</code>।</p>
<table>
<tr><th>Time</th><th>Place</th></tr>
<tr><td><code>in</code> 2024, <code>in</code> July, <code>in</code> the morning</td><td><code>in</code> the office, <code>in</code> the codebase</td></tr>
<tr><td><code>on</code> Monday, <code>on</code> the deadline day</td><td><code>on</code> the server, <code>on</code> the branch, <code>on</code> the call</td></tr>
<tr><td><code>at</code> 3pm, <code>at</code> noon, <code>at</code> the moment</td><td><code>at</code> the meeting, <code>at</code> the office desk</td></tr>
</table>

<h3>Modal verb — politeness-এর level ঠিক করে</h3>
<p><span class="kw">Modal verb</span> (can, could, should, must, would, might) দিয়ে আমরা একই কথা বিভিন্ন মাত্রার directness বা politeness দিয়ে বলতে পারি। বাংলায় আমরা tone, honorific ("আপনি"/"তুমি"), বাক্যের গঠন দিয়ে ভদ্রতা বোঝাই — English-এ অনেকটা কাজটা modal verb করে। ভুল modal বেছে নিলে আপনার বলা কথা শ্রোতার কাছে অনেক বেশি harsh বা অনেক বেশি weak শোনাতে পারে, আপনি হয়তো তা বোঝাতেই চাননি।</p>
<table>
<tr><th>Modal phrase</th><th>Intent / Politeness level</th></tr>
<tr><td>"You <b>must</b> fix this before merging."</td><td>Strong obligation — জোরালো, কখনো কখনো harsh শোনায়</td></tr>
<tr><td>"You <b>should</b> consider refactoring this."</td><td>Suggestion — পরামর্শ, চাপিয়ে দেওয়া না</td></tr>
<tr><td>"<b>Could</b> you please rebase this branch?"</td><td>Polite request — ভদ্র অনুরোধ</td></tr>
<tr><td>"This <b>might</b> cause a race condition."</td><td>Cautious possibility — নিশ্চিত না, সতর্ক করা</td></tr>
<tr><td>"<b>Would</b> you mind adding a test for this?"</td><td>Very polite request — সবচেয়ে soft অনুরোধ</td></tr>
</table>

<h3>Code review comment-এ modal-এর গুরুত্ব</h3>
<p>Code review একটা লিখিত মাধ্যম, এখানে গলার স্বর (tone of voice), মুখভঙ্গি, বা হাসি দিয়ে কথা নরম করার সুযোগ নেই। তাই আপনি যদি "must" ব্যবহার করেন যেখানে আসলে "could" বা "should" বোঝাতে চেয়েছিলেন, সেটা লেখায় ঠিক ততটাই কড়া শোনাবে যতটা লেখা আছে — কোনো নরম tone সেটা ঠিক করে দেবে না। বিশেষ করে ভিন্ন সংস্কৃতির টিমমেট বা senior-এর সাথে কাজ করার সময় এই পার্থক্যটা সম্পর্ক এবং professional impression-এ সরাসরি প্রভাব ফেলে।</p>
<div class="callout why"><span class="tag">লিখিত মাধ্যমে politeness gradient কেন বেশি জরুরি</span>মুখোমুখি কথায় hesitation, smile, বা soft tone দিয়ে একটা কড়া কথাও নরম করে দেওয়া যায়। কিন্তু লেখায় সেই সুযোগ নেই — শব্দই একমাত্র সংকেত। তাই code review comment-এ শব্দ choice (বিশেষত modal verb)-ই পুরো সামাজিক সংকেতের ভার বহন করে। একই ভুলের কথা "must" দিয়ে লিখলে command শোনায়, "could" দিয়ে লিখলে collaboration শোনায়।</div>
<div class="callout best"><span class="tag">Best practice — Code review-এর politeness ladder</span>Direct সমালোচনা নরম করতে "must"/"have to"-এর বদলে ধাপে ধাপে softer modal ব্যবহার করুন। যেমন — সবচেয়ে জরুরি ও non-negotiable বিষয়ের জন্য "This needs to change because..." (কারণ সহ ব্যাখ্যা করলে "must"-ও কম harsh লাগে), মাঝারি গুরুত্বের সাজেশনের জন্য "You should..." বা "I'd suggest...", আর optional idea বা সন্দেহের জন্য "Could we...", "What if we...", "This might benefit from...". একটা সহজ অভ্যাস — প্রতিটা review comment লেখার পর একবার নিজেকে জিজ্ঞেস করুন, "এটা কি command শোনাচ্ছে নাকি suggestion?"</div>

<h3>অনুশীলনের জন্য কিছু বাক্য</h3>
<pre><span class="c"># Article ঠিক রেখে বলার অনুশীলন</span>

The bug happens only on the staging server.

Could we extract this into a separate function?
This might cause a memory leak under load.
Would you mind renaming this variable for clarity?</pre>

<h2 class="title">৮. Developer Grammar — Conditional, Passive Voice ও Reported Speech</h2>
<p class="lead">এই চ্যাপ্টারে যে তিনটা গ্রামার টপিক নিয়ে কথা বলব — Conditional, Passive Voice, আর Reported Speech — এগুলো আসলে সফটওয়্যার ইঞ্জিনিয়ারদের জন্য সবচেয়ে "স্বাভাবিক" গ্রামার। কারণ আপনি প্রতিদিন কোডে <code>if/else</code>, ফাংশন কল আর কারো বলা বাগ রিপোর্ট নিয়ে কাজ করেন — এই তিনটাই আসলে সেই একই লজিকের ইংরেজি ভার্সন।</p>

<h3>Conditionals — আপনার if/else লজিক, শুধু ইংরেজিতে</h3>
<p>ইংরেজিতে চারটা মূল <span class="kw">conditional</span> টাইপ আছে, আর মজার ব্যাপার হলো — প্রতিটার পেছনে একটা করে চেনা প্রোগ্রামিং প্যাটার্ন আছে।</p>
<table>
<tr><th>টাইপ</th><th>স্ট্রাকচার</th><th>ব্যবহার</th><th>ডেভ উদাহরণ</th></tr>
<tr><td><span class="kw">Zero conditional</span></td><td>If + present, present</td><td>সবসময় সত্য / fact / fixed logic</td><td>If the cache misses, the system queries the database.</td></tr>
<tr><td><span class="kw">First conditional</span></td><td>If + present, will + verb</td><td>বাস্তব সম্ভাবনা, ভবিষ্যতে ঘটতে পারে</td><td>If tests fail, the pipeline will stop.</td></tr>
<tr><td><span class="kw">Second conditional</span></td><td>If + past, would + verb</td><td>কাল্পনিক / অসম্ভাব্য পরিস্থিতি</td><td>If we rewrote this in Rust, it would be faster.</td></tr>
<tr><td><span class="kw">Third conditional</span></td><td>If + past perfect, would have + verb</td><td>অতীতের অনুমান / আফসোস (postmortem)</td><td>If we had used a queue, we would not have lost those events.</td></tr>
</table>
<p>লক্ষ্য করুন — <code>zero</code> হলো এমন লজিক যা <code>if (cacheMiss) return db.query()</code>-এর মতো সবসময় সত্য। <code>first</code> হলো এমন শর্ত যা আসলেই ঘটতে পারে — প্রায় <code>if (testsFail) pipeline.stop()</code>। <code>second</code> আর <code>third</code> হলো এমন branch যেটা আসলে কখনো এক্সিকিউট হয়নি বা হবে না — একটা "what-if" সিমুলেশন।</p>

<div class="callout why"><span class="tag">Conditional আপনার জন্য নতুন কিছু না</span>আপনি ইতিমধ্যে প্রতিদিন <code>if/else</code>, <code>switch-case</code>, guard clause লিখে অভ্যস্ত। ইংরেজি conditional শেখা মানে নতুন একটা লজিক শেখা না — শুধু সেই একই লজিক্যাল স্ট্রাকচারকে ইংরেজি tense-এ ম্যাপ করা। বেশিরভাগ ইংরেজি শিক্ষার্থীর জন্য conditional কঠিন লাগে কারণ তারা এটাকে বিমূর্ত গ্রামার রুল হিসেবে মুখস্থ করে। আপনার সেই সমস্যা নেই — আপনি already condition-based thinking-এ expert। শুধু "if X then Y" এর ইংরেজি tense mapping-টা মনে রাখলেই হয়ে যায়।</div>

<h3>Passive Voice — টেকনিক্যাল লেখায় কখন এবং কেন</h3>
<p><span class="kw">Passive voice</span> টেকনিক্যাল ডকুমেন্টেশন, API doc, রিসার্চ পেপার আর incident report-এ প্রচুর ব্যবহার হয় — কারণ এখানে "কে করেছে" তার চেয়ে "কী হয়েছে" বেশি গুরুত্বপূর্ণ।</p>
<table>
<tr><th>Active</th><th>Passive</th></tr>
<tr><td>The middleware processes the request.</td><td>The request is processed by the middleware.</td></tr>
<tr><td>The team migrated the data last night.</td><td>The data was migrated last night.</td></tr>
<tr><td>The logger logs errors automatically.</td><td>Errors are logged automatically.</td></tr>
<tr><td>Someone deprecated this endpoint in v2.</td><td>This endpoint was deprecated in v2.</td></tr>
</table>
<p>Passive ব্যবহার করুন যখন <b>সিস্টেমের আচরণ</b> বর্ণনা করছেন এবং "কে করেছে" সেটা irrelevant বা obvious — যেমন ডকুমেন্টেশন, README, architecture doc। কিন্তু day-to-day কমিউনিকেশনে — standup, code review কমেন্ট, স্ল্যাক মেসেজ — active voice বেশি direct, স্পষ্ট, আর কথোপকথনের মতো শোনায়।</p>

<div class="callout mistake"><span class="tag">Common mistake — Standup-এ passive voice-এর ওভারইউজ</span>অনেকে standup-এ বলেন "The bug was fixed" — কিন্তু এতে বোঝা যায় না কে ফিক্স করেছে, এটা কি already merged হয়েছে, নাকি কেউ অন্য কেউ করেছে। Team visibility-র জন্য এটা ক্ষতিকর, কারণ টিম জানতে চায় কে কী কাজ করেছে। সবসময় বলুন "I fixed the bug" বা "I merged the fix" — নিজের কাজের ownership স্পষ্ট করে বলাটাই ভালো communication।</div>

<div class="callout best"><span class="tag">Best practice — Doc-এ passive, স্পিচে active</span>টেকনিক্যাল ডকুমেন্টেশন লেখার সময় সিস্টেম behavior বর্ণনা করতে passive voice ব্যবহার করুন — এটা objective এবং professional শোনায় ("Requests are validated before processing")। কিন্তু মুখে যখন নিজের progress রিপোর্ট করছেন, active voice-এ থাকুন — "I validated the requests", "I deployed the fix" — এতে স্পষ্টতা আর accountability দুটোই বজায় থাকে।</p></div>

<h3>Reported Speech — কারো বলা কথা টিমকে জানানো</h3>
<p><span class="kw">Reported speech</span> শেখা জরুরি কারণ প্রতিদিন আপনাকে ক্লায়েন্ট, QA, বা PM-এর বলা কথা টিমের কাছে relay করতে হয় — সরাসরি quote না করে। মূল নিয়ম হলো: tense এক ধাপ পেছনে চলে যায় — <code>doesn't</code> → <code>didn't</code>, <code>will</code> → <code>would</code>, <code>can</code> → <code>could</code>, <code>is</code> → <code>was</code>।</p>
<table>
<tr><th>Direct speech</th><th>Reported speech</th></tr>
<tr><td>Client: "The button doesn't work."</td><td>She said the button didn't work.</td></tr>
<tr><td>QA: "The app crashes on login."</td><td>QA said the app crashed on login.</td></tr>
<tr><td>PM: "We will release this on Friday."</td><td>The PM said they would release it on Friday.</td></tr>
<tr><td>Tester: "I can reproduce the bug."</td><td>The tester said she could reproduce the bug.</td></tr>
</table>

<h3>Reported Question — Client বা QA-এর প্রশ্ন টিমকে জানানো</h3>
<p>Statement report করার নিয়ম উপরে দেখা হলো, কিন্তু কেউ যদি একটা <span class="kw">প্রশ্ন</span> করে থাকে — সেটা report করার নিয়ম আলাদা, আর এখানেই বাংলাভাষীরা সবচেয়ে বেশি ভুল করেন। মূল নিয়ম দুইটা: (১) yes/no question report করতে <code>if</code> বা <code>whether</code> যোগ করতে হয়, প্রশ্নবোধক শব্দ (do/does/did) থাকে না; (২) word order প্রশ্নের মতো উল্টে না গিয়ে সাধারণ statement-এর মতো (subject আগে, verb পরে) থাকে।</p>
<table>
<tr><th>Direct question</th><th>Reported question</th></tr>
<tr><td>Client: "Does the app work offline?"</td><td>The client asked <b>if</b> the app worked offline.</td></tr>
<tr><td>QA: "Did you test this on Safari?"</td><td>QA asked <b>whether</b> I had tested it on Safari.</td></tr>
<tr><td>PM: "Why is the release delayed?"</td><td>The PM asked why the release was delayed.</td></tr>
<tr><td>Client: "When will this be fixed?"</td><td>The client asked when it would be fixed.</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — প্রশ্নের word order রেখে দেওয়া</span>বাংলা থেকে সরাসরি অনুবাদ করলে অনেকে বলে ফেলেন "The client asked does the app work offline" বা "She asked why is the release delayed" — অর্থাৎ direct question-এর word order (auxiliary/verb আগে) সেভাবেই রেখে দেন। ইংরেজিতে reported question-এ subject সবসময় verb-এর আগে বসে, ঠিক normal statement-এর মতো — "the app <b>worked</b>", "the release <b>was</b> delayed" — প্রশ্নের মতো উল্টানো থাকে না। আর yes/no question-এর ক্ষেত্রে <code>if</code>/<code>whether</code> যোগ করতে ভুলে যাওয়াটাও সাধারণ একটা ভুল।</div>

<h3>মিনি ডায়ালগ — সব একসাথে</h3>
<p>নিচের ছোট ডায়ালগে reported speech, first conditional, আর third conditional — তিনটাই একসাথে ব্যবহার করা হয়েছে, ঠিক যেভাবে বাস্তব standup-এ কথা বলা হয়।</p>
<pre><span class="c"># Relaying a QA bug report + fix + prevention</span>
Rafi: QA said the login button crashed on mobile Safari.
Rafi: If we deploy the fix today, the crash will go away.
Rafi: If we had added mobile Safari to our test matrix earlier,
      we would not have missed this bug.</pre>
<p>প্রথম লাইনে reported speech ("QA said... crashed") দিয়ে বাগ রিপোর্ট রিলে করা হয়েছে। দ্বিতীয় লাইনে first conditional দিয়ে বাস্তব fix-এর ফলাফল বলা হয়েছে। তৃতীয় লাইনে third conditional দিয়ে postmortem-স্টাইলে বলা হয়েছে কী করলে এই বাগটা এড়ানো যেত। এই তিনটা প্যাটার্ন একসাথে ব্যবহার করতে পারলে আপনি যেকোনো bug-discussion বা incident review-তে flawlessly ইংরেজিতে কথা বলতে পারবেন।</p>
</template>

<h3>২. মতামত দেওয়ার Phrase Bank — Sprint Planning ও Retro-তে</h3>
<p>Sprint planning বা retro-তে নিজের মতামত পরিষ্কারভাবে কিন্তু ভদ্রভাবে উপস্থাপন করার জন্য কিছু নির্দিষ্ট phrase বারবার ব্যবহার হয়। এগুলো মুখস্থ রাখলে মিটিং-এ চুপ করে বসে থাকতে হবে না।</p>
<table><tr><th>Phrase</th><th>কখন ব্যবহার করবে</th></tr>
<tr><td><code>I think we should...</code></td><td>সরাসরি একটা প্রস্তাব দেওয়ার সময়</td></tr>
<tr><td><code>In my opinion, ...</code></td><td>নিজের মত হিসেবে স্পষ্ট করে বলার সময়, যাতে বোঝা যায় এটা fact নয় opinion</td></tr>
<tr><td><code>One option would be to...</code></td><td>একাধিক সমাধানের একটা হিসেবে নরমভাবে উপস্থাপন করতে</td></tr>
<tr><td><code>What if we tried...?</code></td><td>নতুন আইডিয়া প্রস্তাব করতে, কিছুটা ব্রেইনস্টর্মিং ভঙ্গিতে</td></tr>
<tr><td><code>From my experience, ...</code></td><td>আগের প্রজেক্ট বা অভিজ্ঞতা থেকে যুক্তি দিতে</td></tr>
<tr><td><code>I'd suggest we prioritize X over Y because...</code></td><td>Sprint planning-এ priority নিয়ে মতামত দিতে</td></tr>
</table>

<h3>৩. ভদ্রভাবে একমত/দ্বিমত পোষণ করা</h3>
<p>Meeting-এ কারো মতের সাথে একমত বা দ্বিমত পোষণ করার একটা ভদ্র ভাষা আছে, যেটা না জানলে কথাগুলো রূঢ় শোনাতে পারে।</p>
<table><tr><th>উদ্দেশ্য</th><th>Phrase</th></tr>
<tr><td>একমত হওয়া</td><td><code>That makes sense.</code> / <code>I agree, and also...</code> / <code>Exactly, that's what I was thinking too.</code></td></tr>
<tr><td>ভদ্রভাবে দ্বিমত</td><td><code>I see your point, but I'm a bit concerned about...</code></td></tr>
<tr><td>ভদ্রভাবে দ্বিমত</td><td><code>Have you considered...?</code></td></tr>
<tr><td>ভদ্রভাবে দ্বিমত</td><td><code>I'm not fully convinced, could we discuss this a bit more?</code></td></tr>
<tr><td>আংশিক একমত, আংশিক দ্বিমত</td><td><code>That's a fair point, but on the other hand...</code></td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সরাসরি "No, that's wrong" বলা</span>টেকনিক্যালি ঠিক হলেও মিটিং-এ সরাসরি <code>"No, that's wrong"</code> বলাটা বেশিরভাগ international বা western workplace culture-এ রূঢ় শোনায়, যদিও তোমার point valid। একই কথা <code>"I see your point, but I'm a bit concerned about the edge case where..."</code> দিয়ে বললে result একই থাকে — তোমার আপত্তিটা পৌঁছায় — কিন্তু কারো সাথে confrontation তৈরি হয় না।</div>

<h3>৪. পরিষ্কার না হলে জিজ্ঞেস করা — Clarifying Question</h3>
<p>অনেক ইঞ্জিনিয়ার দ্বিধার কারণে না বুঝেও জিজ্ঞেস করে না, ভাবে "সবাই হয়তো জানে, আমি জিজ্ঞেস করলে বোকা মনে হব।" আসলে ঠিক উল্টোটা — জিজ্ঞেস না করে ভুল ধরে নিয়ে এগিয়ে যাওয়াটাই বেশি ক্ষতিকর।</p>
<pre><span class="c"># Clarifying question phrase bank</span>
Sorry, could you repeat that?
Just to confirm, you mean we should deploy this on Friday, not Monday?
When you say "the API is deprecated," do you mean it's already removed,
or just marked for removal in a future version?
Could you clarify what you mean by "high priority" here?
Sorry, I missed that last part — could you say it again?
So if I understood correctly, the plan is to roll back first
and then investigate — is that right?</pre>
<div class="callout mistake"><span class="tag">Common mistake — না বুঝেও চুপ করে থাকা</span>মিটিং-এ কিছু পরিষ্কার না হলে "বোকা মনে হবে" ভেবে চুপ করে থাকা ছোট একটা সমস্যা মনে হলেও এটা দীর্ঘমেয়াদে অনেক বেশি ক্ষতিকর। কারণ পরে দেখা যায় ভুল বোঝাবুঝির কারণে পুরো ফিচার ভুলভাবে বানিয়ে ফেলা হয়েছে, যেটা ঠিক করতে দিন-রাতের পরিশ্রম আর অনেক embarrassment দুটোই লাগে। একবার clarifying question জিজ্ঞেস করার সাহসিকতা সবসময়ই পরে ভুল কাজ শুধরানোর চেয়ে সস্তা।</div>

<h3>৫. মাঝে কথা বলা ও মিটিং শেষে Summarize করা</h3>
<p>কারো কথার মাঝে ভদ্রভাবে ঢুকে কিছু বলতে হলে, বা মিটিং শেষে সবার আলোচনা এক জায়গায় গুছিয়ে বলতে হলে এই phrase গুলো কাজে লাগে।</p>
<table><tr><th>উদ্দেশ্য</th><th>Phrase</th></tr>
<tr><td>ভদ্রভাবে মাঝে কথা বলা</td><td><code>Sorry to jump in, but...</code> / <code>Can I add something here?</code> / <code>Sorry, quick question before we move on...</code></td></tr>
<tr><td>মিটিং শেষে সারমর্ম</td><td><code>Just to summarize what we've discussed...</code></td></tr>
<tr><td>Action item স্পষ্ট করা</td><td><code>So the action items are: I'll do X, Tanvir will do Y, and we'll check back on Thursday.</code></td></tr>
<tr><td>নিশ্চিত হওয়া</td><td><code>Does that sound right to everyone?</code> / <code>Are we all aligned on this?</code></td></tr>
</table>
<div class="callout why"><span class="tag">চুপ থাকা vs ভদ্রভাবে দ্বিমত পোষণ করা</span>বেশিরভাগ modern engineering culture-এ ভদ্রভাবে প্রশ্ন তোলা বা দ্বিমত পোষণ করাকে নেতিবাচকভাবে দেখা হয় না, বরং এটাকে engagement আর ownership-এর লক্ষণ হিসেবে দেখা হয়। উল্টো দিকে, মিটিং-এ পুরোপুরি চুপ থাকা বা সবকিছুতে হ্যাঁ বলে যাওয়াকে অনেক সময় "সে বুঝতে পারছে না" বা "সে আসলে engaged না" হিসেবে ধরে নেওয়া হয়। তাই প্রশ্ন তোলা বা মৃদু আপত্তি জানানো ভদ্রতার লঙ্ঘন নয়, বরং একজন সক্রিয় টিম মেম্বার হওয়ার লক্ষণ।</div>

<h3>৬. Mini Sprint Planning Dialogue</h3>
<p>নিচের সংক্ষিপ্ত কথোপকথনে দুইজন ইঞ্জিনিয়ার — একজন opinion দিচ্ছে, একজন clarifying question জিজ্ঞেস করছে, ভদ্রভাবে দ্বিমত জানাচ্ছে, আর শেষে summarize করছে।</p>
<pre><span class="c"># Mini sprint planning dialogue</span>
Rasel: I think we should pick up the notification service refactor
       this sprint, before we add any new features on top of it.

Tanvir: Just to confirm, you mean refactoring the whole service,
        or just the retry logic inside it?

Rasel: Just the retry logic for now — the rest can wait.

Tanvir: Okay, that makes sense. I'm a bit concerned about the timeline
        though — we already have the checkout bug fix in this sprint.
        Have you considered splitting the refactor into two smaller tasks?

Rasel: That's a fair point. Let's split it, and I'll take the smaller
        piece so we don't overload the sprint.

Tanvir: Sounds good. So, just to summarize — we're doing the checkout
        fix, plus a smaller retry-logic refactor split into two tasks.
        I'll create the tickets today.</pre>
<div class="grid2"><div class="box"><b>মনে রাখার মূল কথা</b><br>Standup, meeting আর clarifying question — এই তিনটা জায়গায় একই কয়েকটা phrase বারবার ঘুরেফিরে আসে। এগুলো মুখস্থ করে ফেললে দৈনন্দিন কাজের ৮০% ইংরেজি কথোপকথন সহজ হয়ে যায়।</div><div class="box"><b>অনুশীলন</b><br>আজকের standup-এর জন্য উপরের টেমপ্লেট ব্যবহার করে ৩টা বাক্য লিখে ফেলো, আর পরের মিটিং-এ অন্তত একটা clarifying question জিজ্ঞেস করার চেষ্টা করো — even if it feels uncomfortable at first।</div></div>
</template>

<h2 class="title">১০. Technical Communication — Bug রিপোর্ট, Architecture ও Code Review কথায় বলা</h2>
<p class="lead">Senior ইঞ্জিনিয়ার আর জুনিয়ার ইঞ্জিনিয়ারের মধ্যে পার্থক্য শুধু কোড লেখায় না — <b>জটিল টেকনিক্যাল তথ্য কতটা পরিষ্কারভাবে অন্যকে বোঝাতে পারেন</b> তাতেও। একটা bug ঠিকভাবে বর্ণনা করতে না পারলে debugging-এ দ্বিগুণ সময় লাগে, একটা architecture ভুলভাবে ব্যাখ্যা করলে নতুন টিমমেট ভুল ধারণা নিয়ে কোড লেখা শুরু করে, আর একটা code review comment ভুল টোনে লিখলে সম্পর্ক নষ্ট হয়। এই chapter-এ আমরা তিনটা সবচেয়ে ঘন ঘন ঘটা technical conversation-এর জন্য reusable ভাষার কাঠামো শিখব।</p>

<h3>একটা Bug স্পষ্টভাবে মুখে বর্ণনা করা</h3>
<p>একটা bug রিপোর্ট করার সবচেয়ে নির্ভরযোগ্য কাঠামো চারটা অংশে ভাগ করা যায়: <span class="kw">Expected behavior</span> (কী হওয়ার কথা ছিল) → <span class="kw">Actual behavior</span> (আসলে কী হচ্ছে) → <span class="kw">Steps to reproduce</span> (কীভাবে আবার ঘটানো যায়) → <span class="kw">Environment/context</span> (কোথায়, কখন, কী পরিস্থিতিতে ঘটে)। এই একই ক্রম প্রতিবার ব্যবহার করলে শ্রোতা — তা টিমমেট হোক বা QA — সহজেই আপনাকে ফলো করতে পারে, এমনকি meeting তাড়াহুড়ায় থাকলেও।</p>
<table>
<tr><th>অংশ</th><th>ব্যবহারযোগ্য phrase</th></tr>
<tr><td>Expected behavior</td><td>"I expected X to happen when the user clicks submit."<br>"The intended behavior is that the order gets confirmed immediately."</td></tr>
<tr><td>Actual behavior</td><td>"But instead, the page just freezes."<br>"Instead, it silently fails and nothing gets saved."</td></tr>
<tr><td>Steps to reproduce</td><td>"It happens when you submit the form twice in a row."<br>"It's reproducible if you log in with an expired token."<br>"Here are the exact steps to reproduce it."</td></tr>
<tr><td>Environment/context</td><td>"It's reproducible on staging, but not on my local machine."<br>"It only happens in production, not locally."<br>"This only shows up under heavy load, around 500 concurrent users."</td></tr>
</table>
<pre><span class="c"># একটা সম্পূর্ণ spoken bug description — উদাহরণ</span>
"So, I expected the payment confirmation email to go out
right after checkout. But instead, the email never arrives —
the order still gets created, it's just the email that's
missing. It's reproducible every time you checkout with a
saved card, not a new one. And it only happens in production;
locally, with the same saved-card flow, the email goes out
fine. So my guess is it's something environment-specific,
maybe an SMTP config difference."
</pre>
<div class="callout best"><span class="tag">Best practice — সবসময় একই কাঠামো ব্যবহার করুন</span>প্রতিবার bug বর্ণনা করার সময় expected → actual → repro → context এই একই ক্রম বজায় রাখুন। এটা মুখস্থ script মনে হলেও আসলে এটাই সবচেয়ে কার্যকর — শ্রোতা জানে পরের বাক্যে কী আসবে, তাই তথ্য মিস করার সম্ভাবনা কমে, আর আপনি চাপের মধ্যেও কিছু বাদ দেন না।</div>

<h3>System Architecture মুখে বর্ণনা করা</h3>
<p>একজন নতুন টিমমেট বা junior-কে একটা diagram বা flow মুখে বুঝিয়ে দেওয়ার সময় সবসময় <span class="kw">entry point</span> থেকে শুরু করুন এবং request-এর গতিপথ অনুসরণ করুন — এলোমেলোভাবে মাঝখান থেকে শুরু করলে শ্রোতা হারিয়ে যায়। প্রতিটা component-এর জন্য এক বাক্যে তার দায়িত্ব বলুন, তারপর পরের component-এ যান।</p>
<pre><span class="c"># architecture narration-এর জন্য phrase bank</span>
"Let's start from the entry point — the client sends a request here."
"This service is responsible for validating the user's session."
"The request flows from the API gateway to the auth service, then to the database."
"From there, it gets forwarded to..."
"The reason we split it this way is to isolate the payment logic."
"At a high level, there are three layers here."
"Everything eventually comes back through this same path."
</pre>
<p>নিচের উদাহরণে একটা সাধারণ তিন-স্তরের (client → API → database) architecture এভাবে বর্ণনা করা যায়।</p>
<pre><span class="c"># mini-narration উদাহরণ — client → API → database</span>
"Let's start from the entry point. The client — that's our
web or mobile app — sends a request to the API layer over
HTTPS. This API layer is responsible for authentication,
validation, and business logic. The request flows from the
API into the database, which just stores and retrieves the
raw data — it has no business logic of its own. The reason
we keep the database this thin is so we can swap or scale it
independently. Everything eventually comes back through the
same API layer to the client."
</pre>
<div class="callout why"><span class="tag">এন্ট্রি পয়েন্ট থেকে শুরু করাই কেন কার্যকর</span>মানুষের মস্তিষ্ক একটা গল্পের মতো ক্রমিক ভাষ্য সহজে অনুসরণ করে — request কোথা থেকে ঢোকে সেখান থেকে শুরু করলে শ্রোতা একটা mental map তৈরি করতে পারে, প্রতিটা component সেই মানচিত্রে একটা নির্দিষ্ট জায়গায় বসে। মাঝখান থেকে শুরু করলে শ্রোতাকে একইসাথে "এর আগে কী হয়েছিল" আর "এর পরে কী হবে" — দুটোই অনুমান করতে হয়, যা cognitive load বাড়ায়।</div>

<h3>Code Review-এর ভাষা — লেখা ও মুখে বলা</h3>
<p>Code review comment-এর টোন প্রায়ই তার বিষয়বস্তুর চেয়ে বেশি গুরুত্বপূর্ণ। একই সমালোচনা দুইভাবে বলা যায় — একটা সম্পর্ক নষ্ট করে, অন্যটা করে না। নিচের phrase bank চারটা category-তে ভাগ করা।</p>
<table>
<tr><th>Category</th><th>ব্যবহারযোগ্য phrase</th></tr>
<tr><td>নরমভাবে পরিবর্তনের প্রস্তাব</td><td>"Have you considered using a map here instead of nested loops?"<br>"What if we extracted this into a separate function?"<br>"Small nit: maybe rename this variable for clarity."</td></tr>
<tr><td>Blocking বনাম minor চিহ্নিত করা</td><td>"blocking: this will throw a null reference in production."<br>"nit: extra blank line here."<br>"non-blocking suggestion: consider adding a test for the edge case."</td></tr>
<tr><td>ভালো কাজের প্রশংসা</td><td>"Nice catch here — I would've missed that edge case."<br>"This is a clean approach, much simpler than what I had in mind."<br>"Great job handling the error cases here."</td></tr>
<tr><td>সিদ্ধান্তের কারণ জিজ্ঞাসা</td><td>"What was the reasoning behind choosing this library?"<br>"Can you help me understand why we're not caching this response?"<br>"Is there a specific constraint that led to this design?"</td></tr>
</table>
<div class="callout why"><span class="tag">nit: / blocking: কনভেনশন কেন দরকার</span>এই লেবেলিং কনভেনশন থাকার কারণ হলো — author-কে সাথে সাথে বলে দেওয়া যায় কোন comment merge-এর আগে অবশ্যই ঠিক করতে হবে (blocking), আর কোনটা optional, চাইলে পরে ঠিক করা যায় (nit, non-blocking suggestion)। এটা ছাড়া author প্রতিটা comment-কে সমান গুরুত্বপূর্ণ ভেবে সবকিছু নিয়ে আলোচনা শুরু করে, যা review-কে দীর্ঘ back-and-forth-এ পরিণত করে। লেবেল স্পষ্ট থাকলে author এক নজরে triage করতে পারে।</div>
<div class="callout mistake"><span class="tag">Common mistake — কারণ না জেনেই সিদ্ধান্তকে ভুল ধরে নেওয়া</span>একটা design decision দেখে সরাসরি বলে দেওয়া "This is wrong" বা "why did you do it this way, it doesn't make sense" — প্রায়ই ভুল হয়, কারণ সেই decision-এর পেছনে হয়তো এমন একটা constraint ছিল যা আপনি জানতেন না (legacy system, performance requirement, client-এর বিশেষ শর্ত)। আগে "What was the reasoning behind this?" জিজ্ঞাসা করুন — যদি সত্যিই ভুল হয়, তখনও সেটা বলার সুযোগ থাকবে, কিন্তু আপনি author-কে defensive না করেই আলোচনা শুরু করতে পারবেন।</div>

<h3>Sample Dialogue — টিমমেটকে কলে Bug বোঝানো</h3>
<pre><span class="c"># Call — Rafi bug-টা Sara-কে ব্যাখ্যা করছে</span>
Rafi:  Hey, do you have a minute? I found something weird
       with the checkout flow.
Sara:  Sure, go ahead.

       final total is shown. But instead, it applies after

       immediately click checkout — you don't even need to

Sara:  Interesting. Any idea why local is different?
Rafi:  Not yet — my guess is a caching layer that only exists

Sara:  Got it, that's a good starting point. Can you open a

Rafi:  Yeah, doing that now.
</pre>

<h3>Cross-cultural নোট — সরাসরি বলা সবসময় ভালো নয়</h3>
<p>বাংলা থেকে সরাসরি অনুবাদ করা ইংরেজি প্রায়ই অতিরিক্ত blunt শোনায় — যেমন "This is wrong," "You did this incorrectly," "Why did you write it like this?" এই বাক্যগুলো টেকনিক্যালি সঠিক হতে পারে, কিন্তু অনেক আন্তর্জাতিক বা পশ্চিমা সহকর্মীর কাছে এগুলো অপ্রয়োজনীয়ভাবে কঠোর মনে হয় — যেন ব্যক্তিগতভাবে দোষারোপ করা হচ্ছে। একই সংশোধন নরম ভাষায় বললেও সমান কার্যকর হয়, বরং সম্পর্ক অক্ষত থাকে।</p>

<div class="callout why"><span class="tag">Async/remote টিমে এটা আরও বেশি জরুরি কেন</span>একই অফিসে বসা সহকর্মীকে অস্পষ্ট মেসেজ পাঠালে সে ঘুরে এসে "মানে কী বলতে চাইছ?" জিজ্ঞেস করতে পারে — কথোপকথন দ্রুত ঠিক হয়ে যায়। কিন্তু distributed/remote টিমে reader হয়তো ৬-১২ ঘণ্টা সময়-পার্থক্যে থাকে — একটা অস্পষ্ট প্রশ্নের উত্তর পেতে পুরো একটা কর্মদিবস নষ্ট হতে পারে। তাই প্রথম মেসেজটাই এমনভাবে লেখা দরকার যাতে reader কোনো back-and-forth ছাড়াই কাজ করতে পারে — সব প্রয়োজনীয় তথ্য (কী দরকার, কখন, কেন) একসাথে থাকা চাই।</div>

<h3>Commit Message — Imperative Mood: "এই commit যা করবে তা লিখুন"</h3>
<p>Git commit message লেখার সবচেয়ে সাধারণ নিয়ম হলো <span class="kw">imperative mood</span> ব্যবহার করা — যেন একটা নির্দেশ দিচ্ছেন। "Fix null pointer exception" ঠিক, কিন্তু "Fixed null pointer exception" বা "Fixes null pointer exception" প্রথাগতভাবে ভুল ধরা হয়। কারণ বোঝার সহজ উপায় হলো একটা বাক্য সম্পূর্ণ করা মনে করে দেখা — <b>"If applied, this commit will ___"</b>। এই ফাঁকা জায়গায় commit message বসিয়ে দেখুন: "If applied, this commit will fix null pointer exception" — বাক্যটা ব্যাকরণগতভাবে ঠিক বসে। কিন্তু "will fixed" বা "will fixes" বসালে তা ভাঙা বাক্য হয়ে যায়।</p>
<table>
<tr><th>ভুল (past/present tense)</th><th>সঠিক (imperative)</th></tr>
<tr><td>Fixed the login bug</td><td>Fix the login bug</td></tr>
<tr><td>Adds retry logic to payment service</td><td>Add retry logic to payment service</td></tr>
<tr><td>Updated README with setup instructions</td><td>Update README with setup instructions</td></tr>
<tr><td>Removing unused imports</td><td>Remove unused imports</td></tr>
</table>
<p>এই কনভেনশন শুধু ব্যাকরণের খেলা না — এটা Git-এর নিজস্ব আচরণের সাথেও সামঞ্জস্যপূর্ণ। `git merge` বা `git revert` নিজে থেকেই imperative mood-এ commit message তৈরি করে ("Merge branch 'feature-x'"), তাই টিমের সব commit একই স্বরে থাকলে history পড়তে সহজ ও ধারাবাহিক হয়। Git workflow-এর বাকি কনভেনশন (branch naming, PR title, conventional commits যেমন `feat:`/`fix:`/`chore:`) — এই একই imperative-mood নীতির উপর দাঁড়িয়ে।</p>
<div class="callout mistake"><span class="tag">Common mistake — tense-এ অসংগতি</span>একই PR-এর ভেতরে কিছু commit "Fix ...", কিছু "Fixed ...", কিছু "Fixes ..." — এই অসংগতি ছোট মনে হলেও history স্ক্যান করা কঠিন করে তোলে। এর চেয়েও বড় সমস্যা হলো commit message-এ শুধু "fix bug" বা "update code" লিখে ফেলা — কোন bug, কেন, কীভাবে fix হলো তার কোনো ইঙ্গিত না থাকা। ছয় মাস পর `git blame` করে যখন কেউ (হয়তো আপনি নিজেই) এই commit-এ পৌঁছাবে, "fix bug" কোনো context দেয় না — সময় নষ্ট হয় পুরোনো PR/issue খুঁজে বের করতে।</div>

<h3>PR (Pull Request) Description — What, Why, How</h3>
<p>ভালো PR description একটা নির্দিষ্ট কাঠামো অনুসরণ করে: <span class="kw">what</span> (ঠিক কী পরিবর্তন হয়েছে), <span class="kw">why</span> (এই পরিবর্তনের পেছনের সমস্যা বা motivation কী), <span class="kw">how to test</span> (reviewer কীভাবে নিশ্চিত হবে এটা কাজ করছে), আর <span class="kw">risks/tradeoffs</span> (কোনো side-effect বা সীমাবদ্ধতা থাকলে)। এই চার অংশ থাকলে reviewer দ্রুত এবং সঠিকভাবে review করতে পারে — আর ভবিষ্যতে কেউ এই PR-এ ফিরে এলে পুরো প্রেক্ষাপট পায়।</p>
<pre><span class="c"># PR: Add rate limiting to /api/orders endpoint</span>

## What
Adds a token-bucket rate limiter (10 requests/second per API key)
to the POST /api/orders endpoint using the existing Redis instance.

## Why
Last week a misbehaving client script sent ~500 req/s to this
endpoint and caused a brief DB connection pool exhaustion (see
incident #2026-07-18). This endpoint had no protection against
that kind of burst traffic.

## How to test
1. Run `docker-compose up redis`
2. Hit POST /api/orders 15 times in one second with the same
   API key — requests 11-15 should return 429 Too Many Requests
3. Wait 1 second, confirm requests succeed again
4. Unit tests added in `test_rate_limiter.py` cover the bucket
   refill logic

## Risks / tradeoffs
- Rate limit is per API key, not per IP, so a shared key across
  multiple clients will hit the limit faster than expected.
- Limit is currently hardcoded (10 req/s); follow-up ticket
  JIRA-4521 will move this to a config value.</pre>
<p>লক্ষ্য করুন — শিরোনামটাও imperative mood-এ ("Add rate limiting"), commit message-এর নিয়মের সাথে সামঞ্জস্যপূর্ণ। প্রতিটা section ছোট, scannable — reviewer উপর থেকে নিচে পড়ে দ্রুত পুরো ছবিটা পায়, লম্বা প্যারাগ্রাফে হারিয়ে যেতে হয় না।</p>

<h3>Documentation লেখার নিয়ম — Active Voice, Present Tense, কম শব্দ</h3>
<p>Documentation লেখার সময় সবচেয়ে সাধারণ ভুল হলো অতিরিক্ত ভদ্র বা জটিল বাক্য গঠন — passive voice, future tense, বা অপ্রয়োজনীয় hedge words ("might", "could potentially")। ভালো documentation লেখে <span class="kw">active voice</span> ও <span class="kw">present tense</span>-এ, কারণ ফাংশন/সিস্টেম যা করে তা একটা স্থায়ী সত্য — future tense ব্যবহার করলে মনে হয় যেন এটা এখনো ঘটেনি। আর পাঠক ধরে নিন আপনার চেয়ে কম context আছে — তাই স্পষ্ট, ছোট বাক্য, কোনো অপ্রয়োজনীয় শব্দ ছাড়া।</p>

<h3>সারসংক্ষেপ — Speaking বনাম Writing</h3>
<p>এই কোর্সের প্রথম অধ্যায়ে বলা হয়েছিল, কথা বলার সময় <span class="kw">clarity over perfection</span> — গ্রামারের ছোটখাটো ভুল, contraction, এমনকি কিছুটা এলোমেলো বাক্যও গ্রহণযোগ্য, কারণ কথোপকথন তাৎক্ষণিক এবং সংশোধনযোগ্য। কিন্তু লেখায় নিয়ম পাল্টায় — বিশেষ করে ক্লায়েন্ট-facing document, commit message, বা PR description-এ, যা দীর্ঘদিন টিকে থাকে এবং বহু মানুষ পড়ে।</p>

<h2 class="title">১২. Phrasal Verbs, Idioms ও Everyday Tech Expressions</h2>
<p class="lead">এতক্ষণ আমরা grammar structure আর নির্দিষ্ট পরিস্থিতির (standup, code review, writing) ভাষা শিখেছি। কিন্তু native ও fluent non-native speaker-দের কথায় প্রতিনিয়ত এমন কিছু শব্দগুচ্ছ ঘুরেফিরে আসে যেগুলো আক্ষরিক অর্থ থেকে সম্পূর্ণ আলাদা কিছু বোঝায় — <span class="kw">phrasal verb</span> আর <span class="kw">idiom</span>। বাংলায় verb-এর সাথে particle (up/down/into/off) জুড়ে অর্থ বদলে দেওয়ার এই পদ্ধতিটাই নেই, তাই এগুলো না জানলে মিটিং-এ প্রায় প্রতিটা বাক্যে একটা-দুটো শব্দ অপরিচিত ঠেকে, যদিও প্রতিটা শব্দ আলাদাভাবে সহজ।</p>

<h3>Phrasal Verb আসলে কেন এত কঠিন লাগে</h3>
<p>একটা phrasal verb হলো verb + particle (preposition/adverb) মিলে তৈরি হওয়া একটা নতুন অর্থ, যেটা প্রায়ই মূল verb-এর অর্থ থেকে অনুমান করা যায় না। যেমন <code>look</code> শব্দটা সহজ, কিন্তু <code>look into</code> (তদন্ত করা), <code>look up</code> (তথ্য খোঁজা), <code>look forward to</code> (উন্মুখ হয়ে থাকা), আর <code>look after</code> (দেখাশোনা করা) — চারটাই সম্পূর্ণ ভিন্ন অর্থ বহন করে, শুধু particle বদলে। বাংলায় আমরা সাধারণত একটা আলাদা, সম্পূর্ণ ভিন্ন শব্দ ব্যবহার করি এই অর্থ প্রকাশ করতে (তদন্ত করা, খোঁজা, উন্মুখ হওয়া, দেখাশোনা করা) — তাই ইংরেজির এই "একই verb, ভিন্ন particle, ভিন্ন অর্থ" প্যাটার্নটা স্বাভাবিকভাবে আসে না, প্রতিটা combination আলাদা শব্দের মতোই মুখস্থ করতে হয়।</p>
<div class="callout why"><span class="tag">কেন এগুলো এড়িয়ে না গিয়ে শেখা দরকার</span>
অনেকে ভাবেন phrasal verb এড়িয়ে সবসময় "formal" শব্দ (<code>investigate</code>-এর বদলে <code>look into</code> এড়িয়ে যাওয়া) ব্যবহার করলেই চলবে। সমস্যা হলো — native ও fluent speaker-রা কথ্য ইংরেজিতে phrasal verb-ই ডিফল্টভাবে ব্যবহার করেন, formal শব্দ নয়। ফলে আপনি নিজে phrasal verb এড়িয়ে গেলেও, মিটিং-এ অন্যরা যখন বলবেন "let's circle back to this" বা "can you look into this bug", তখন <b>বোঝাটাই</b> আসল চ্যালেঞ্জ হয়ে দাঁড়ায় — নিজে বলা এড়িয়ে যাওয়া গেলেও, শোনা এড়িয়ে যাওয়া যায় না।</div>

<h3>Debugging ও Technical কাজের Phrasal Verb</h3>
<table>
<tr><th>Phrasal Verb</th><th>অর্থ</th><th>উদাহরণ</th></tr>
<tr><td><span class="kw">look into</span></td><td>তদন্ত করা</td><td>"I'll look into why the pipeline is failing."</td></tr>
<tr><td><span class="kw">dig into</span></td><td>গভীরভাবে খতিয়ে দেখা</td><td>"Let's dig into the logs before assuming it's a network issue."</td></tr>
<tr><td><span class="kw">figure out</span></td><td>বুঝে ফেলা, সমাধান খুঁজে বের করা</td><td>"I finally figured out why the cache was stale."</td></tr>
<tr><td><span class="kw">run into (an issue)</span></td><td>হঠাৎ সমস্যায় পড়া</td><td>"I ran into a weird bug while testing the retry logic."</td></tr>
<tr><td><span class="kw">get to the bottom of</span></td><td>মূল কারণ খুঁজে বের করা</td><td>"We need to get to the bottom of this memory leak."</td></tr>
<tr><td><span class="kw">sort out</span></td><td>ঠিকঠাক করা, সমাধান করা</td><td>"I'll sort out the merge conflicts before lunch."</td></tr>
<tr><td><span class="kw">iron out</span></td><td>ছোটখাটো সমস্যা মিটিয়ে ফেলা</td><td>"We just need to iron out a few edge cases."</td></tr>
<tr><td><span class="kw">break down</span></td><td>ভেঙে ছোট অংশে ভাগ করা</td><td>"Can you break down this task into smaller subtasks?"</td></tr>
<tr><td><span class="kw">come up with</span></td><td>নতুন কিছু নিয়ে আসা (আইডিয়া/সমাধান)</td><td>"She came up with a clever workaround."</td></tr>
<tr><td><span class="kw">narrow down</span></td><td>সংক্ষিপ্ত/নির্দিষ্ট করা</td><td>"Let's narrow down the root cause to these two services."</td></tr>
</table>

<h3>Infrastructure ও Deployment-এর Phrasal Verb</h3>
<table>
<tr><th>Phrasal Verb</th><th>অর্থ</th><th>উদাহরণ</th></tr>
<tr><td><span class="kw">spin up</span></td><td>নতুন instance/resource চালু করা</td><td>"I'll spin up a new EC2 instance for testing."</td></tr>
<tr><td><span class="kw">spin down / shut down</span></td><td>বন্ধ করা</td><td>"We can spin down the staging cluster over the weekend."</td></tr>
<tr><td><span class="kw">roll out</span></td><td>ধাপে ধাপে চালু/প্রকাশ করা</td><td>"We're rolling out the feature to 10% of users first."</td></tr>
<tr><td><span class="kw">roll back</span></td><td>আগের অবস্থায় ফিরিয়ে নেওয়া</td><td>"We had to roll back the deployment due to errors."</td></tr>
<tr><td><span class="kw">set up</span></td><td>প্রস্তুত/কনফিগার করা</td><td>"Can you set up the dev environment for the new hire?"</td></tr>
<tr><td><span class="kw">back up</span></td><td>ব্যাকআপ নেওয়া</td><td>"Make sure to back up the database before migrating."</td></tr>
<tr><td><span class="kw">log in / log out</span></td><td>প্রবেশ করা / বের হওয়া</td><td>"Users can't log in since the last deploy."</td></tr>
<tr><td><span class="kw">plug in</span></td><td>যুক্ত/সংযুক্ত করা</td><td>"We just need to plug in the new payment provider."</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Particle বাদ দিয়ে অর্ধেক অর্থ বলা</span>
"I'll look the bug" বা "we need to figure this" — particle (into/out) বাদ দিলে বাক্যটা ব্যাকরণগতভাবে অসম্পূর্ণ এবং native কানে দৃষ্টিকটু লাগে। Phrasal verb শেখার সময় শুধু verb না, পুরো combination (verb + particle) একসাথে একটা একক শব্দগুচ্ছ হিসেবে মুখস্থ করুন — "look into", আলাদা "look" আর "into" না।</div>

<h3>Tech Workplace-এ প্রচলিত সাধারণ Idiom</h3>
<p><span class="kw">Idiom</span> phrasal verb-এর চেয়েও বেশি আক্ষরিক অর্থ থেকে দূরে — পুরো বাক্যাংশটার একটা প্রতীকী অর্থ থাকে, যা শব্দ দিয়ে দিয়ে অনুবাদ করলে একদমই বোঝা যায় না।</p>
<table>
<tr><th>Idiom</th><th>অর্থ</th><th>উদাহরণ</th></tr>
<tr><td><span class="kw">on the same page</span></td><td>একই বোঝাপড়ায় থাকা</td><td>"Let's make sure we're all on the same page before coding starts."</td></tr>
<tr><td><span class="kw">low-hanging fruit</span></td><td>সহজে করা যায় এমন কাজ, দ্রুত ফল দেয়</td><td>"Let's fix the low-hanging fruit first — the typo in the error message."</td></tr>
<tr><td><span class="kw">move the needle</span></td><td>উল্লেখযোগ্য প্রভাব ফেলা</td><td>"This optimization won't really move the needle on performance."</td></tr>
<tr><td><span class="kw">ballpark figure</span></td><td>আনুমানিক সংখ্যা</td><td>"Can you give me a ballpark figure for how long this will take?"</td></tr>
<tr><td><span class="kw">back to the drawing board</span></td><td>নতুন করে শুরু করা</td><td>"This approach didn't work — back to the drawing board."</td></tr>
<tr><td><span class="kw">deep dive</span></td><td>বিস্তারিত/গভীর আলোচনা</td><td>"Let's do a deep dive into the authentication flow next week."</td></tr>
<tr><td><span class="kw">bandwidth</span></td><td>সময়/সক্ষমতা (আক্ষরিক network অর্থ না)</td><td>"I don't have the bandwidth to take this on right now."</td></tr>
<tr><td><span class="kw">touch base</span></td><td>সংক্ষিপ্তভাবে যোগাযোগ করা</td><td>"Let's touch base tomorrow morning about the release."</td></tr>
<tr><td><span class="kw">quick win</span></td><td>দ্রুত অর্জনযোগ্য সাফল্য</td><td>"Caching this response would be a quick win."</td></tr>
<tr><td><span class="kw">under the hood</span></td><td>ভেতরের/আড়ালের কারিগরি বিষয়</td><td>"Under the hood, this library uses a worker thread pool."</td></tr>
<tr><td><span class="kw">put out a fire / firefighting</span></td><td>জরুরি সমস্যা সামলানো</td><td>"I spent the whole morning firefighting a production outage."</td></tr>
<tr><td><span class="kw">at the end of the day</span></td><td>সবকিছু বিবেচনা করে, শেষমেশ</td><td>"At the end of the day, the client just wants it to work reliably."</td></tr>
</table>
<div class="callout mistake"><span class="tag">সতর্কতা — "table this" আমেরিকান বনাম ব্রিটিশ ইংরেজিতে বিপরীত অর্থ</span>
এই idiom-টা বিশেষভাবে বিভ্রান্তিকর, কারণ American ও British English-এ এর অর্থ সম্পূর্ণ <b>বিপরীত</b>। American English-এ "let's table this" মানে <b>আলোচনা পরে করার জন্য পিছিয়ে দেওয়া</b> (postpone)। কিন্তু British English-এ এর মানে ঠিক উল্টো — <b>এখনই আলোচনার টেবিলে তোলা</b> (bring up for discussion now)। একটা আন্তর্জাতিক টিমে এই শব্দ ব্যবহারের সময় সতর্ক থাকুন, বা অস্পষ্টতা এড়াতে সরাসরি বলুন "let's discuss this later" বা "let's discuss this now" — অর্থ নিয়ে দ্বিধা রাখার চেয়ে স্পষ্ট বলা ভালো।</div>

<h3>Numbers, Version ও Error Code জোরে পড়ার নিয়ম</h3>
<p>Standup, code review call, বা bug triage-এ সংখ্যা, version, error code জোরে পড়তে হয় প্রতিনিয়ত — কিন্তু এগুলোর reading convention সাধারণ সংখ্যার নিয়ম থেকে আলাদা, আর ভুল পড়লে বিভ্রান্তি তৈরি হয়।</p>
<table>
<tr><th>যা লেখা আছে</th><th>কীভাবে জোরে পড়বেন</th><th>নোট</th></tr>
<tr><td><code>404</code></td><td>"four oh four" (বা "four-zero-four")</td><td>Error code সবসময় digit-by-digit পড়া হয়, "four hundred four" নয়</td></tr>
<tr><td><code>500</code></td><td>"five hundred" বা "five oh oh"</td><td>দুটোই প্রচলিত — কথোপকথনে "five hundred error" বেশি common</td></tr>
<tr><td><code>v2.3.1</code></td><td>"version two point three point one"</td><td>প্রতিটা ডট আলাদা "point" বলে পড়তে হবে, একসাথে সংখ্যা নয়</td></tr>
<tr><td><code>192.168.1.1</code></td><td>"one nine two dot one six eight dot one dot one"</td><td>IP address সবসময় digit-by-digit + "dot"</td></tr>
<tr><td><code>/usr/local/bin</code></td><td>"slash usr slash local slash bin"</td><td>File path-এ প্রতিটা "/" কে "slash" বলে পড়তে হয়</td></tr>
<tr><td><code>07/25/2026</code></td><td>"July twenty-fifth, twenty twenty-six"</td><td>American format (MM/DD/YYYY); British হলে "the twenty-fifth of July"</td></tr>
<tr><td><code>99.9%</code></td><td>"ninety-nine point nine percent"</td><td>দশমিক বিন্দুকে "point" বলা হয়</td></tr>
<tr><td><code>$1,200</code></td><td>"twelve hundred dollars" বা "one thousand two hundred dollars"</td><td>দুটোই সঠিক, প্রথমটা কথোপকথনে বেশি common</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এই ছোট্ট জিনিসটা গুরুত্বপূর্ণ</span>
একটা bug triage call-এ "getting five hundred four errors" বলাটা "five-oh-four" (৫০৪ Gateway Timeout)-এর বদলে "five hundred four" (একটা একক বড় সংখ্যা) হিসেবে শোনা যেতে পারে — শ্রোতা confuse হয়ে যান ঠিক কোন HTTP status code নিয়ে কথা হচ্ছে। Error code, version, IP address — এগুলো সবসময় digit-by-digit পড়ার অভ্যাস করে রাখলে এই ধরনের ভুল বোঝাবুঝি এড়ানো যায়।</div>

<h3>Video Call ও Remote Meeting Logistics-এর ভাষা</h3>
<p>Remote/hybrid টিমে প্রতিদিনের video call-এ কিছু নির্দিষ্ট logistics phrase বারবার লাগে — কানেকশন সমস্যা, স্ক্রিন শেয়ার, বা সময়ের চাপ জানানোর জন্য।</p>

<tr><th>পরিস্থিতি</th><th>প্রচলিত phrase</th></tr>
<tr><td>কেউ mute অবস্থায় কথা বলছে</td><td>"Sorry, you're on mute." / "I think you're muted."</td></tr>

<h2 class="title">১৩. Interview English — Technical ও Behavioral (STAR Method)</h2>
<p class="lead">ইন্টারভিউ মানে শুধু আপনার technical জ্ঞান যাচাই না — আপনি কীভাবে চিন্তা করেন, কীভাবে communicate করেন, আর কীভাবে একটা গল্পকে গুছিয়ে বলেন সেটাও দেখা হয়। এই chapter-এ আমরা দেখব একটা modern tech interview-এর structure কেমন হয়, behavioral প্রশ্নের জন্য <span class="kw">STAR method</span> কীভাবে ব্যবহার করবেন, আর live coding round-এ চুপ না থেকে জোরে চিন্তা করার (thinking out loud) কৌশল।</p>

<h3>১. একটি Modern Interview-এর ধাপ</h3>
<p>বেশিরভাগ software engineering interview মোটামুটি একই কাঠামো অনুসরণ করে — শুধু কোম্পানিভেদে সময় আর emphasis আলাদা হয়। প্রতিটা ধাপে কী expect করা হয় সেটা আগে থেকে জানা থাকলে nervousness অনেক কমে যায়।</p>
<table>
<tr><th>ধাপ</th><th>সময়কাল</th><th>যা প্রত্যাশিত</th></tr>

<tr><td><span class="kw">Technical Q&A / Live coding</span></td><td>৩০-৪৫ মিনিট</td><td>Problem-solving process দেখানো, clarifying questions করা, code লেখার সময় চিন্তা প্রকাশ করা।</td></tr>
<tr><td><span class="kw">Behavioral questions</span></td><td>১৫-২৫ মিনিট</td><td>নির্দিষ্ট, বাস্তব উদাহরণ — STAR structure মেনে সংক্ষিপ্ত ও organized উত্তর।</td></tr>
