<p><b>পাঠ:</b> (১) <code>ef_search</code> ১০ থেকে ৪০০-তে recall ০.২৯ → ০.৯৯ — একটা সংখ্যা ঘুরিয়ে নির্ভুলতা প্রায় সম্পূর্ণ বদলে যায়, আর সময় মাত্র ২ গুণ। (২) ডিফল্ট (০.৮৩) এই র‍্যান্ডম ডেটায় "ভালো, কিন্তু নিখুঁত নয়" — প্রতি ১০টা প্রতিবেশীর ~১.৭টা মিস। (৩) M ও ef_construction কমালে index সস্তা কিন্তু recall বড় ধাক্কা খায় (০.৫৬)।</p>
<div class="callout mistake"><span class="tag">সতর্কতা — এই সংখ্যা সার্বজনীন নয়</span>
র‍্যান্ডম গাউসিয়ান vector ANN-এর জন্য <b>কঠিন</b> ডেটা (কোনো ক্লাস্টার-কাঠামো নেই, সবাই প্রায় সমদূরবর্তী)। আসল embedding-এর ডেটায় সাধারণত গঠন থাকে, ফলে একই সেটিংয়ে recall ভিন্ন হয়। এই টেবিলের উদ্দেশ্য <b>প্রবণতা</b> দেখানো — আপনার ডেটায় নিজে মাপুন (অধ্যায় ১৩-র recall@k পদ্ধতি)।</div>
<h4>১১.১ একটা আশ্চর্য আবিষ্কার — <code>modify</code> করে <code>ef_search</code> বদলানো</h4>
<pre>col.modify(configuration={"hnsw": {"ef_search": 10}})
col.configuration["hnsw"]["ef_search"]      <span class="c"># → 10  (config পাল্টেছে)</span>
<span class="c"># কিন্তু একই process-এ query করলে recall বদলায়নি (0.822 → 0.822)</span>

<span class="c"># process বন্ধ করে নতুন client দিয়ে collection আবার লোড করার পর:</span>
c = chromadb.PersistentClient(path="./ef_store"); col = c.get_collection("efc")
<span class="c"># recall → 0.273  (ef_search=10-এর আচরণ এখন কার্যকর)</span></pre>
<p>আমার এই version-এ <code>modify</code>-এর <code>ef_search</code> পরিবর্তন config-এ সংরক্ষিত হয়, কিন্তু চালু index-এর আচরণ বদলাতে collection <b>পুনরায় লোড</b> করতে হয়েছে। তাই টিউন করার সময় (ক) তৈরির সময়ই সেটিং দিন, অথবা (খ) <code>modify</code>-এর পর client/collection আবার খুলুন, আর (গ) আচরণ যাচাই করতে আসল recall মেপে দেখুন, config-এর মান দেখে নয়। (এটা version-নির্ভর আচরণ — পরের version-এ বদলাতে পারে।)</p>
<h4>১১.২ ছোট ডেটায় ANN-ই লাগে না — একই পরীক্ষায় প্রমাণ</h4>
<p>একই ২০,০০০ × ৬৪ ডেটায় numpy-র সাধারণ brute-force (সব vector-এর সাথে গুণ + সাজানো) = <b>১.৫৯ ms/প্রশ্ন</b>, আর Chroma-র HNSW = <b>~১.৩–১.৭ ms</b> — প্রায় সমান! অর্থাৎ এই স্কেলে ANN index কোনো গতির সুবিধাই দেয় না, কিন্তু recall ০.৮ করে দেয়। অধ্যায় ৪-৫-এর নীতি এখানে সংখ্যায়: <b>কয়েক হাজার–কয়েক লাখ vector পর্যন্ত exact (flat) খোঁজাই সাধারণত যথেষ্ট ও নিখুঁত</b>; ANN-এর সুবিধা আসে লাখ-কোটি স্কেলে (বা বড় মাত্রায়)।</p>

<h3>১২. ডিস্কে সংরক্ষণ ও Reload — যাচাই</h3>

<p>Collection-এর কনফিগারেশন (space, HNSW সেটিং) ডিস্কে থাকে, তাই আবার খুললে আগের মতো। <b>EF</b> আবার পাস করা নিরাপদ অভ্যাস (৬.২)। <b>Backup:</b> প্রোগ্রাম বন্ধ থাকা অবস্থায় পুরো <code>path</code> ফোল্ডারটা কপি করুন (চালু অবস্থায় কপি করলে অসামঞ্জস্য হতে পারে — এটা সতর্কতা, আমি পরীক্ষা করে দেখাইনি)।</p>

<h3>১৩. Concurrency ও Deployment — সীমাবদ্ধতা</h3>
<h4>১৩.১ একাধিক process একই path-এ</h4>
<p>একটা সরল পরীক্ষা: process A একটা <code>PersistentClient</code> খুলে রেখেছে; process B একই path খুলে পড়ল ও একটা record লিখল — আমার পরীক্ষায় <b>কোনো error আসেনি</b> (B-তে count ২০০০০ → add-এর পর ২০০০১)। কিন্তু এটা "নিরাপদ" প্রমাণ নয় — দুই process একই ফাইলে লিখলে সামঞ্জস্য, দৃশ্যমানতা ও ডেটা-দুর্নীতির ঝুঁকি থাকে, যা এক সরল পরীক্ষায় ধরা পড়ে না। <b>নিয়ম:</b> embedded (<code>PersistentClient</code>) মোড = <b>এক process, এক লেখক</b>। একাধিক সার্ভিস/ওয়ার্কার একই ডেটা ব্যবহার করলে <b>server মোড</b> (<code>chroma run</code> + <code>HttpClient</code>) ব্যবহার করুন।</p>
<h4>১৩.২ Chroma কোথায় থামে</h4>
<table>

<h4>১৩.৩ Chroma থেকে অন্য DB-তে সরানো (migration)</h4>
<p>Chroma-তে prototype বানিয়ে পরে pgvector/Qdrant-এ যেতে চাইলে — আপনার ডেটা (<code>embeddings + documents + metadatas</code>) <code>get</code> দিয়ে পৃষ্ঠা-ভাগ করে নামানো যায় (আমি ছোট collection-এ চালিয়েছি):</p>
<pre>def export_all(col, page=1000):
    off = 0
    while True:
        g = col.get(limit=page, offset=off, include=["embeddings", "documents", "metadatas"])
        if not g["ids"]: break
        yield g; off += page

for g in export_all(c2, page=2):
    target.upsert(g["ids"], g["embeddings"], g["documents"], g["metadatas"])   <span class="c"># গন্তব্য DB-র API অনুযায়ী</span></pre>
<p>কারণ আপনি embedding আগেই নিজে বানিয়েছেন (৬.৩-এর "নিজে embed" পদ্ধতি) এবং <code>embedding_model</code> metadata-তে রেখেছেন, তাই re-embed ছাড়াই সরানো যায় — আরেকটা কারণ প্রথম থেকেই embedding নিজের হাতে রাখার।</p>

<h3>১৪. Common ভুল — একসাথে</h3>
<div class="callout mistake"><span class="tag">ভুল ১ — ডিফল্ট L2 ভুলে যাওয়া</span>
<code>space</code> না দিলে squared-L2। টেক্সটে cosine চান — তৈরির সময়ই <code>configuration={"hnsw": {"space": "cosine"}}</code>।</div>
<div class="callout mistake"><span class="tag">ভুল ২ — <code>add</code> দিয়ে আপডেট</span>
আগের id-তে <code>add</code> নীরবে উপেক্ষিত। সবসময় <code>upsert</code>।</div>
<div class="callout mistake"><span class="tag">ভুল ৩ — ডিফল্ট EF-এ বাংলা</span>
ইংরেজি-কেন্দ্রিক model; বাংলা প্রশ্নে সঠিক ডকুমেন্ট সবার শেষে (আমার পরীক্ষা)। বহুভাষিক model ও golden সেটে যাচাই।</div>
<div class="callout mistake"><span class="tag">ভুল ৪ — reload-এ EF না দেওয়া</span>
<code>get_collection</code>-এ আগের EF না জুড়লে (বা ভুল EF ধরা পড়লে) query vector ভিন্ন model-এর হয়ে যেতে পারে। অভ্যাস করুন: সবসময় একই EF পাস, আর <code>embedding_model</code> metadata রাখা।</div>
<div class="callout mistake"><span class="tag">ভুল ৫ — filter-এ ভুল টাইপ বা ভুল গঠন</span>
<code>{"year": "2025"}</code> (স্ট্রিং) নীরবে খালি; একাধিক শর্ত সরাসরি এক dict-এ দিলে ValueError — <code>$and</code> লাগবে।</div>
<div class="callout mistake"><span class="tag">ভুল ৬ — distance-কে similarity ভাবা</span>
Chroma-র distance ছোট = ভালো। Cosine-এ <code>sim = 1 − dist</code>; L2 ও ip-তে সূত্র আলাদা (ip-তে ঋণাত্মকও হয়)। Threshold বসানোর আগে space মনে করুন।</div>
<div class="callout mistake"><span class="tag">ভুল ৭ — batch সীমা না জানা</span>
একসাথে ~৫,৪৬১-এর বেশি record দিলে ValueError। ব্যাচে ভাঙুন।</div>
<div class="callout mistake"><span class="tag">ভুল ৮ — <code>modify(ef_search)</code> করে ধরে নেওয়া কাজ করছে</span>
আমার version-এ reload ছাড়া আচরণ বদলায়নি। তৈরির সময় দিন বা reload করে recall মাপুন।</div>
<div class="callout mistake"><span class="tag">ভুল ৯ — EphemeralClient-এ ডেটা রেখে ভুলে যাওয়া</span>
প্রোগ্রাম শেষ = সব হারাল। ডেটা রাখতে চাইলে <code>PersistentClient</code>।</div>
<div class="callout mistake"><span class="tag">ভুল ১০ — একাধিক process-এ একই path</span>
এক সরল পরীক্ষায় error আসেনি বলে নিরাপদ নয়। একাধিক ব্যবহারকারী/সার্ভিস = server মোড বা অন্য DB।</div>

<h3>১৫. হাতে-কলমে অনুশীলন — নিজে করে দেখুন</h3>
<ol>
<li><b>প্রথম collection:</b> <code>PersistentClient</code> দিয়ে cosine collection বানান; ১০টা বাক্য (ইংরেজি+বাংলা মিশিয়ে) ঢোকান; তিনটা প্রশ্নে <code>query</code> চালান; distance পড়ুন।</li>
<li><b>ডিফল্ট EF-এর ফাঁদ নিজে দেখুন:</b> ইংরেজি ও বাংলা প্রশ্নে ফল তুলনা (৬.১-এর পরীক্ষা পুনরাবৃত্তি)। তারপর একটা বহুভাষিক model দিয়ে একই প্রশ্ন (অধ্যায় ৩)।</li>
<li><b>add বনাম upsert:</b> একই id-তে <code>add</code> করে দেখুন কী হয়, তারপর <code>upsert</code>।</li>
<li><b>Filter ও টাইপ:</b> <code>year</code> int ও string দুই ভাবে রেখে filter চালান; <code>$and</code> বানান।</li>
<li><b>Mini app:</b> ১০ নং অংশের কোড নিজের একটা ছোট Markdown নীতিমালায় চালান; একটা অনুচ্ছেদ বদলে আবার ingest করে <code>embedded</code> সংখ্যা দেখুন।</li>
<li><b>ANN মাপুন:</b> ২০ হাজার র‍্যান্ডম vector-এ <code>ef_search</code> বদলে recall মাপুন (১১ নং অংশের কোড); numpy brute-force-এর সময়ের সাথে তুলনা।</li>
<li><b>Server মোড:</b> <code>chroma run</code> চালিয়ে <code>HttpClient</code> থেকে সংযোগ।</li>
</ol>

<div class="callout best"><span class="tag">Best practice — Chroma-র প্রস্তাবিত ব্যবহার</span>
(১) শেখা ও prototype-এ <code>PersistentClient</code>; (২) collection তৈরিতেই <code>space</code> স্পষ্ট; (৩) embedding নিজে বানান ও <code>embedding_model</code> metadata-তে রাখুন; (৪) <code>upsert</code> + ডিটারমিনিস্টিক id + content_hash; (৫) threshold ও filter প্রথম দিন থেকে; (৬) বাংলায় বহুভাষিক model ও golden সেট; (৭) এক-লেখক নিয়ম — একাধিক ব্যবহারকারী হলে server বা অন্য DB; (৮) বড়/বহু-ব্যবহারকারী প্রোডাকশনে পরের দুই অধ্যায়ের pgvector/Qdrant বিবেচনা।</div>

<div class="callout why"><span class="tag">সংক্ষেপে মনে রাখুন</span>
(১) <b>Chroma = সবচেয়ে সহজ শুরু</b>: <code>pip install</code>, ৩ ধরনের client (Ephemeral/Persistent/Http), ডিস্কে sqlite + HNSW ফাইল। (২) <b>ডিফল্ট distance L2, cosine নয়</b> — তৈরির সময় <code>space</code> দিন; distance সবসময় ছোট = কাছের; cosine-এ sim = ১ − dist। (৩) <b>ডিফল্ট EF (MiniLM, ৩৮৪-মাত্রা) ইংরেজি-কেন্দ্রিক — বাংলায় নীরবে ভুল</b>; নিজে বহুভাষিক embedding বানিয়ে দিন। (৪) <b><code>add</code> আগের id নীরবে উপেক্ষা করে — <code>upsert</code> ব্যবহার করুন</b>; metadata সমতল, None/nested নয়; filter-এ টাইপ মেলান ও <code>$and</code> লাগবে। (৫) Chroma-র filter কঠোর (১%) হলেও পূর্ণ k টা নিখুঁত ফল দেয় (আমার পরীক্ষা)। (৬) <b>ANN recall সেটিং-নির্ভর</b>: ef_search ১০ → ০.২৯, ৪০০ → ০.৯৯ (আমার মাপা, কঠিন র‍্যান্ডম ডেটা); <code>modify</code>-এর পরিবর্তন reload ছাড়া কার্যকর হয়নি; ২০ হাজার vector-এ brute force-ও সমান দ্রুত। (৭) <b>Idempotent ingestion</b> (id + content_hash + stale মোছা) প্রথম দিন থেকে। (৮) <b>এক process, এক লেখক</b>; একাধিক ব্যবহারকারী/বড় স্কেল/HA/RBAC/SQL join দরকার হলে pgvector বা Qdrant — আর embedding নিজে বানিয়ে রাখলে মাইগ্রেশন সহজ।</div>

<p class="lead">আপনি যদি .NET ও PostgreSQL-এ কাজ করেন, তাহলে Vector Database শেখার সবচেয়ে বাস্তবসম্মত পথ হলো <span class="kw">pgvector</span> — PostgreSQL-এর একটা extension, যা আপনার চেনা database-কেই vector সংরক্ষণ ও "অর্থের কাছাকাছি" খোঁজার ক্ষমতা দেয়। কোনো নতুন সার্ভার নেই, নতুন backup-পদ্ধতি নেই, নতুন নিরাপত্তা-মডেল নেই। এই অধ্যায়ে আমরা শুধু "কীভাবে ব্যবহার করব" নয়, <b>ভেতরে কী ঘটছে, কেন ঘটছে, কোথায় ভাঙে ও কীভাবে সারাব</b> — সব ধাপে ধাপে বুঝব। শেষে Python ও .NET (EF Core, Npgsql, Dapper) দিয়ে পূর্ণ প্রয়োগ।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
আগের অধ্যায়গুলোতে আমরা vector, similarity (অধ্যায় ২) আর ANN index-এর ধারণা (অধ্যায় ৪, ৫) শিখেছি। এখানে সেই ধারণাগুলো একটা আসল database-এ হাতে-কলমে বসাব। pgvector-এ শেখা প্রতিটা জিনিস — operator, index parameter, filter সমস্যা, hybrid search, memory হিসাব — অন্য যেকোনো Vector DB-তেও (অধ্যায় ১০, ১১) কাজে লাগবে, কারণ ধারণাগুলো একই; শুধু সিনট্যাক্স আলাদা।</div>

<h3>১. pgvector কী, আর কেন এটা এত জনপ্রিয়</h3>
<h4>১.১ ধারণা: দুই জগৎ এক জায়গায়</h4>
<p>একটা সাধারণ RAG/semantic-search অ্যাপে দুই ধরনের ডেটা থাকে: (ক) <b>সংগঠিত ডেটা</b> — customer, document, user, permission, তারিখ (এগুলো PostgreSQL-এ আগে থেকেই আছে), আর (খ) <b>vector</b> — প্রতিটা chunk-এর অর্থের সংখ্যা-তালিকা। যদি vector অন্য একটা আলাদা সিস্টেমে (Pinecone, Qdrant) রাখেন, তাহলে দুটো সিস্টেমকে সবসময় <b>সিঙ্কে রাখতে</b> হয়: ডকুমেন্ট মুছলে দুই জায়গা থেকেই মুছতে হবে, permission বদলালে দুই জায়গায় বদলাতে হবে। pgvector এই সিঙ্কের ঝামেলাই দূর করে — <b>একই table, একই transaction, একই backup</b>।</p>

<h3>২. Setup — Docker দিয়ে ধাপে ধাপে</h3>
<h4>২.১ docker-compose.yml</h4>
<pre><span class="c"># docker-compose.yml — pgvector আগে থেকে ইনস্টল করা official image</span>
services:
  db:
    image: pgvector/pgvector:pg17          <span class="c"># pg16/pg17 ইত্যাদি — আপনার PostgreSQL major version অনুযায়ী</span>
    container_name: vdb-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass           <span class="c"># production-এ secret ম্যানেজার ব্যবহার করুন</span>
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro    <span class="c"># প্রথমবার চালুর সময় একবার চলবে</span>
    shm_size: "1gb"                          <span class="c"># parallel index build-এ shared memory লাগতে পারে</span>
    command: &gt;
      postgres
      -c shared_buffers=1GB
      -c maintenance_work_mem=1GB
      -c max_parallel_maintenance_workers=4
volumes:
  pgdata:</pre>
<pre>-- init.sql
CREATE EXTENSION IF NOT EXISTS vector;
SELECT extversion FROM pg_extension WHERE extname = 'vector';   -- ইনস্টল হওয়া সংস্করণ দেখুন</pre>
<pre><span class="c"># চালানো ও যাচাই</span>
docker compose up -d
docker exec -it vdb-pg psql -U app -d appdb -c "SELECT vector_dims('[1,2,3]'::vector);"   <span class="c"># 3 আসা উচিত</span></pre>
<div class="callout behind"><span class="tag">পর্দার পেছনে — Extension কী</span>
PostgreSQL-এর extension হলো C-তে লেখা একটা প্লাগইন, যা database-এর ভেতরে নতুন data type (<code>vector</code>), operator (<code>&lt;=&gt;</code>) ও index method (<code>hnsw</code>, <code>ivfflat</code>) যোগ করে। <code>CREATE EXTENSION</code> প্রতিটা database-এ আলাদাভাবে চালাতে হয়। তাই migration-এ এটা রাখুন — নইলে নতুন environment-এ table বানানোই ব্যর্থ হবে।</div>
<h4>২.২ Managed service-এ</h4>
<p>বেশিরভাগ বড় managed PostgreSQL সেবা pgvector সমর্থন করে (AWS RDS/Aurora, Azure Database for PostgreSQL Flexible Server, Google Cloud SQL, Supabase, Neon ইত্যাদি)। সাধারণত শুধু <code>CREATE EXTENSION vector;</code> চালালেই হয়, তবে কোন pgvector সংস্করণ (ও তাই কোন feature — halfvec, iterative scan) পাওয়া যাবে তা প্রতিটা প্রদানকারীর ডকুমেন্টে ভিন্ন ও বদলায় — <b>২০২৬-এ আপনার প্রদানকারীর সংস্করণ যাচাই করুন</b> (<code>SELECT extversion ...</code>)।</p>

<h3>৩. Vector-এর ধরন — চারটা type ও তাদের আকার</h3>
<h4>৩.১ চারটা type</h4>
<table>
<tr><th>Type</th><th>কী রাখে</th><th>প্রতি vector-এর আকার (বাইট)</th><th>কখন</th></tr>
<tr><td><code>vector(n)</code></td><td>৩২-বিট float (single precision)</td><td><b>4 × n + 8</b></td><td>ডিফল্ট; সবচেয়ে নির্ভুল</td></tr>
<tr><td><code>halfvec(n)</code></td><td>১৬-বিট float (half precision)</td><td><b>2 × n + 8</b></td><td>মেমরি অর্ধেক করতে; নির্ভুলতার সামান্য ক্ষতি (প্রায়ই নগণ্য)</td></tr>
<tr><td><code>bit(n)</code></td><td>প্রতিটা মাত্রা ১ বিট (০/১)</td><td><b>⌈n / 8⌉ + 8</b></td><td>binary quantization; Hamming/Jaccard দূরত্ব; ৩২ গুণ ছোট</td></tr>
<tr><td><code>sparsevec(n)</code></td><td>শুধু non-zero মান (index→value)</td><td><b>8 × nnz + 16</b></td><td>sparse embedding (SPLADE, BM25-ধরনের); বিস্তারিত নিচে</td></tr>
</table>

<div class="callout why"><span class="tag">এই সংখ্যার তাৎপর্য — কেন dimension গুরুত্বপূর্ণ</span>
১ কোটি chunk × ১৫৩৬ dimension হলে শুধু vector-ই ~৬১ GB। তার উপর HNSW index-এ প্রতিটা node-এর vector-এর কপি ও প্রতিবেশী-তালিকা থাকে, অর্থাৎ index প্রায় একই আকারের (বা বেশি) হয়। দ্রুত খোঁজার জন্য index RAM-এ থাকা দরকার — তাই ১২৮GB RAM-এর সার্ভারও ভরে যেতে পারে। এজন্য <code>halfvec</code> বা কম-dimension model (অধ্যায় ৩, ৫) এত গুরুত্বপূর্ণ: অর্ধেক মেমরি, প্রায় একই মান।</div>
<h4>৩.২ Dimension সীমা (সংস্করণ-নির্ভর — হেজসহ)</h4>
<table>
<tr><th>সীমা</th><th>সাধারণ মান (pgvector ০.৭+ ধরে)</th><th>অর্থ</th></tr>
<tr><td><code>vector</code> সংরক্ষণ</td><td>সর্বোচ্চ ~১৬,০০০ dimension</td><td>কলামে রাখা যায়</td></tr>
<tr><td><code>vector</code> index (HNSW/IVFFlat)</td><td>সর্বোচ্চ <b>২,০০০</b> dimension</td><td>index বানানো যায় শুধু এই পর্যন্ত — ৩০৭২-dim embedding-এ সরাসরি <code>vector</code> index হয় না!</td></tr>
<tr><td><code>halfvec</code> index</td><td>সর্বোচ্চ <b>৪,০০০</b> dimension</td><td>৩০৭২-dim embedding-এর জন্য সমাধান: <code>halfvec(3072)</code></td></tr>
<tr><td><code>bit</code> index</td><td>সর্বোচ্চ ~৬৪,০০০</td><td>binary quantization</td></tr>
<tr><td><code>sparsevec</code> index</td><td>সর্বোচ্চ ~১,০০০ non-zero element</td><td>sparse vector</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — ৩০৭২-dimension model + vector index</span>
<code>text-embedding-3-large</code> (৩০৭২ dim) ব্যবহার করে <code>vector(3072)</code> কলামে HNSW index বানাতে গেলে error আসে ("column cannot have more than 2000 dimensions for hnsw index")। সমাধান তিনটা: (ক) model-এর <code>dimensions</code> প্যারামিটারে ১৫৩৬ বা ১০২৪-এ কমানো (Matryoshka — অধ্যায় ৩), (খ) <code>halfvec(3072)</code> কলাম ও <code>halfvec_cosine_ops</code> index, (গ) expression index: <code>(embedding::halfvec(3072))</code>। সীমাগুলো সংস্করণ অনুযায়ী বদলায় — নিজের সংস্করণের ডকুমেন্ট দেখুন।</div>
<h4>৩.৩ Literal ও cast</h4>
<pre>SELECT '[1,2,3]'::vector;                       -- vector literal: বর্গ বন্ধনীতে কমা-ভাগ
SELECT '[1,2,3]'::vector(3);                    -- dimension নির্দিষ্ট করা (ভুল হলে error)
SELECT ARRAY[1,2,3]::real[]::vector;            -- array থেকে
SELECT '[1,2,3]'::vector::halfvec;              -- ছোট precision-এ রূপান্তর
SELECT '{1:1.5,3:2}/5'::sparsevec;              -- sparsevec: {index:value,...}/মোট_dimension — index ১-ভিত্তিক!
SELECT vector_dims('[1,2,3]'::vector);          -- 3
SELECT vector_norm('[3,4]'::vector);            -- 5  (L2 norm)
SELECT l2_normalize('[3,4]'::vector);           -- [0.6,0.8]  (দৈর্ঘ্য ১)</pre>
<div class="callout behind"><span class="tag">পর্দার পেছনে — sparsevec-এর index ১-ভিত্তিক</span>
<code>pgvector</code> Python প্যারামিটারে <code>SparseVector({0:1.5, 2:2.0}, 4)</code> লিখলে (০-ভিত্তিক) সেটা text হয়ে যায় <code>{1:1.5,3:2.0}/4</code> — অর্থাৎ SQL-এ index ১ থেকে শুরু। এটা যাচাই করা (Python প্যাকেজ চালিয়ে)। ০-ভিত্তিক আর ১-ভিত্তিক মেশালে নীরবে ভুল term-এ মিল হয়, যা ধরা খুব কঠিন — Python-এ প্যাকেজের <code>SparseVector</code> ক্লাসই ব্যবহার করুন, হাতে text বানাবেন না।</div>
<p><b>ভুল dimension ঢোকালে কী হয়?</b> <code>vector(1536)</code> কলামে ৭৬৮-dim vector insert করলে সরাসরি error: <code>expected 1536 dimensions, not 768</code>। এটা আসলে ভালো — নীরবে ভুল ডেটা ঢোকে না। Model বদলালে (অধ্যায় ১৪-র re-embedding) schema-ও বদলাতে হয় — এটা ভুলে যাবেন না।</p>

<h3>৪. দূরত্বের Operator — ও কেন <code>&lt;#&gt;</code> ঋণাত্মক</h3>
<h4>৪.১ চারটা (এবং আরও কিছু) operator</h4>
<p>একই দুটো vector নিয়ে হিসাব: <code>a = [1,2,3]</code>, <code>b = [2,1,0]</code> (গণনা করা):</p>
<table>
<tr><th>Operator</th><th>নাম</th><th>সূত্র</th><th>a, b-র জন্য মান</th><th>Index operator class</th></tr>
<tr><td><code>&lt;-&gt;</code></td><td>L2 (Euclidean) দূরত্ব</td><td>√Σ(aᵢ−bᵢ)²</td><td><b>3.3166</b></td><td><code>vector_l2_ops</code></td></tr>
<tr><td><code>&lt;=&gt;</code></td><td>Cosine <b>distance</b></td><td>1 − (a·b)/(‖a‖‖b‖)</td><td><b>0.5219</b></td><td><code>vector_cosine_ops</code></td></tr>
<tr><td><code>&lt;#&gt;</code></td><td><b>ঋণাত্মক</b> inner product</td><td>−(a·b)</td><td><b>−4.0</b></td><td><code>vector_ip_ops</code></td></tr>
<tr><td><code>&lt;+&gt;</code></td><td>L1 (Manhattan) দূরত্ব</td><td>Σ|aᵢ−bᵢ|</td><td><b>5.0</b></td><td><code>vector_l1_ops</code> (সংস্করণ-নির্ভর)</td></tr>
<tr><td><code>&lt;~&gt;</code></td><td>Hamming দূরত্ব (<code>bit</code>)</td><td>অমিল বিটের সংখ্যা</td><td>—</td><td><code>bit_hamming_ops</code></td></tr>
<tr><td><code>&lt;%&gt;</code></td><td>Jaccard দূরত্ব (<code>bit</code>)</td><td>১ − |A∩B|/|A∪B|</td><td>—</td><td><code>bit_jaccard_ops</code></td></tr>
</table>
<h4>৪.২ কেন inner product ঋণাত্মক?</h4>
<p>PostgreSQL-এর index কেবল <b>ছোট থেকে বড় (ASC)</b> সাজানো ক্রম সমর্থন করে: <code>ORDER BY x ASC</code>। কিন্তু inner product-এ <i>বড়</i> মান মানে বেশি মিল। তাই pgvector inner product-কে <b>−১ দিয়ে গুণ</b> করে ফেরত দেয়, যাতে "ছোট = বেশি মিল" নিয়মটা বজায় থাকে ও index ব্যবহার করা যায়। ফলে: <b>আসল inner product = (−১) × <code>&lt;#&gt;</code>-এর ফল।</b></p>
<h4>৪.৩ Unit vector-এ তিন দূরত্ব এক — গণনা করে প্রমাণ</h4>
<p>দুটো vector-কে আগে normalize (দৈর্ঘ্য ১) করলে তিনটা মাপ একই র‍্যাঙ্কিং দেয়। উপরের a, b-কে normalize করে গণনা:</p>
<pre>L2 দূরত্বের বর্গ  = 1.0438
2 × cosine distance = 1.0438      <span class="c">// হুবহু সমান</span>
1 + (−inner product) = 0.5219     <span class="c">// = cosine distance</span></pre>
<p>অর্থাৎ unit vector-এ: <b>L2² = 2 × cosine_distance</b> এবং <b>cosine_distance = 1 + (&lt;#&gt;-এর ফল)</b>। তিনটাই একই র‍্যাঙ্কিং। এজন্য OpenAI ইত্যাদি model-এর vector (যেগুলো আগে থেকেই normalized) নিয়ে <b>inner product (<code>&lt;#&gt;</code>) সবচেয়ে দ্রুত</b> — cosine-এর মতো দৈর্ঘ্য-ভাগের খরচ নেই, অথচ ফল একই।</p>
<div class="callout best"><span class="tag">কোন operator বাছবেন</span>
(১) embedding model-এর ডকুমেন্ট দেখুন কোন metric-এ train। (২) Vector আগে থেকে normalized জানা থাকলে <code>&lt;#&gt;</code> (ip) বা <code>&lt;=&gt;</code> — ফল একই, ip সামান্য দ্রুত। (৩) নিশ্চিত না হলে <code>&lt;=&gt;</code> (cosine) — সবচেয়ে নিরাপদ ডিফল্ট। (৪) <b>Index-এর operator class আর query-র operator অবশ্যই মিলতে হবে</b> (পরের অংশ)।</div>
<h4>৪.৪ Distance থেকে Similarity</h4>
<pre>SELECT 1 - (embedding &lt;=&gt; $1) AS cosine_similarity,        -- ১ = হুবহু, ০ = সম্পর্কহীন
       (embedding &lt;#&gt; $1) * -1  AS inner_product,
       embedding &lt;-&gt; $1          AS l2_distance
FROM doc_chunks ORDER BY embedding &lt;=&gt; $1 LIMIT 5;</pre>
<div class="callout mistake"><span class="tag">Common mistake — ORDER BY-তে similarity, distance নয়</span>
<code>ORDER BY 1 - (embedding &lt;=&gt; $1) DESC</code> লিখলে PostgreSQL index ব্যবহার করতে পারে না (expression মেলে না) — চুপচাপ পুরো table scan। সবসময় <code>ORDER BY embedding &lt;=&gt; $1</code> (সরাসরি operator, ASC) লিখুন; similarity দরকার হলে শুধু SELECT-এ হিসাব করুন।</div>
<h4>৪.৫ কাজের ফাংশন ও aggregate</h4>
<pre>SELECT avg(embedding) FROM doc_chunks WHERE doc_id = 'policy-1';   -- একটা ডকুমেন্টের "গড় অর্থ" (centroid)
SELECT cosine_distance(a, b), l2_distance(a, b), inner_product(a, b), l1_distance(a, b) FROM ...;
SELECT vector_dims(embedding), vector_norm(embedding) FROM doc_chunks LIMIT 3;   -- sanity check
-- normalize করে সংরক্ষণ করলে inner product ও cosine একই — একবার normalize, সারাজীবন সুবিধা
UPDATE doc_chunks SET embedding = l2_normalize(embedding);</pre>

<h3>৫. Table design — ভালো schema কীভাবে ভাবব</h3>
<h4>৫.১ প্রথম নীতি: ডকুমেন্ট ও chunk আলাদা table</h4>
<p>একটা ডকুমেন্টের অনেকগুলো chunk। ডকুমেন্ট-স্তরের তথ্য (শিরোনাম, লেখক, tenant, অনুমতি) প্রতিটা chunk-এ কপি করা ডেটা-অপচয় ও আপডেট-ঝুঁকি। তাই normalize করুন:</p>
<pre>CREATE TABLE documents (
    id           BIGSERIAL PRIMARY KEY,
    tenant_id    INT          NOT NULL,
    source_uri   TEXT         NOT NULL,                -- মূল ফাইল/URL
    title        TEXT,
    dept         TEXT         NOT NULL,
    lang         TEXT         NOT NULL DEFAULT 'bn',
    acl_roles    TEXT[]       NOT NULL DEFAULT '{}',   -- কোন role দেখতে পারবে
    content_hash TEXT         NOT NULL,                -- ডকুমেন্ট বদলেছে কিনা বোঝার জন্য
    updated_at   TIMESTAMPTZ  NOT NULL DEFAULT now(),
    UNIQUE (tenant_id, source_uri)
);

CREATE TABLE doc_chunks (
    id           BIGSERIAL PRIMARY KEY,
    document_id  BIGINT       NOT NULL REFERENCES documents(id) ON DELETE CASCADE,  -- ডকুমেন্ট মুছলে chunk-ও
    tenant_id    INT          NOT NULL,                 -- ইচ্ছাকৃত denormalization: filter ও RLS-এর জন্য
    chunk_index  INT          NOT NULL,
    content      TEXT         NOT NULL,
    token_count  INT,
    embedding    vector(1536) NOT NULL,
    embed_model  TEXT         NOT NULL,                 -- 'text-embedding-3-small@2024' — model-বদল ট্র্যাকিং
    content_hash TEXT         NOT NULL,                 -- chunk-স্তরে re-embed এড়াতে
    fts          tsvector GENERATED ALWAYS AS (to_tsvector('simple', content)) STORED,  -- hybrid search (১১ নং অংশ)
    created_at   TIMESTAMPTZ  NOT NULL DEFAULT now(),
    UNIQUE (document_id, chunk_index)
);
CREATE INDEX idx_chunks_tenant ON doc_chunks (tenant_id);   -- সাধারণ B-tree: filter-এর জন্য</pre>
<h4>৫.২ প্রতিটা কলাম কেন আছে</h4>
<table>
<tr><th>কলাম</th><th>কেন</th><th>না রাখলে কী ঘটে</th></tr>
<tr><td><code>ON DELETE CASCADE</code></td><td>ডকুমেন্ট মুছলে chunk-ও স্বয়ংক্রিয়ভাবে যায়</td><td>"ভূতুড়ে" chunk থেকে যায়, মুছে-ফেলা তথ্য AI উত্তরে ফিরে আসে (গোপনীয়তা সমস্যা)</td></tr>
<tr><td><code>tenant_id</code> chunk-এও</td><td>JOIN ছাড়াই filter করা, RLS ও partial index সম্ভব</td><td>প্রতিটা vector query-তে JOIN লাগে, planner-এর কাজ জটিল</td></tr>
<tr><td><code>embed_model</code></td><td>কোন model-এর vector তা জানা — model বদলালে ধাপে ধাপে migrate</td><td>পুরোনো ও নতুন model-এর vector মিশে র‍্যাঙ্কিং অর্থহীন হয়, অথচ কোনো error নেই</td></tr>
<tr><td><code>content_hash</code></td><td>লেখা না বদলালে আবার embed না করা</td><td>প্রতিবার সব re-embed → API খরচ ও সময় নষ্ট</td></tr>
<tr><td><code>chunk_index</code></td><td>chunk-এর ক্রম; আশপাশের chunk আনতে (প্রসঙ্গ বাড়াতে) কাজে লাগে</td><td>"আগের/পরের অনুচ্ছেদ" আনা যায় না</td></tr>
<tr><td><code>fts</code> generated column</td><td>hybrid search-এ keyword অংশ</td><td>হুবহু শব্দ/কোড (invoice নম্বর) খোঁজা দুর্বল</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — vector আলাদা table-এও রাখা যায়</span>
vector কলাম বড় (৬KB+/row)। যদি আপনি <code>content</code> ও অন্য কলাম নিয়ে প্রচুর non-vector query চালান, vector-কে আলাদা table-এ (<code>chunk_id, embedding</code>) রাখলে মূল table ছোট ও দ্রুত থাকে। ছোট-মাঝারি scale-এ একই table-ই সরল ও যথেষ্ট; বড় হলে ভাগ করার কথা ভাবুন।</div>

<h3>৬. ডেটা লোড করা — Single insert থেকে COPY</h3>
<h4>৬.১ তিনটা পদ্ধতির তুলনা</h4>
<table>
<tr><th>পদ্ধতি</th><th>কীভাবে</th><th>গতি (আপেক্ষিক)</th><th>কখন</th></tr>

</table>
<div class="callout why"><span class="tag">কেন COPY এত দ্রুত — ভেতরের কথা</span>
প্রতিটা INSERT-এ SQL parse, plan, round-trip, transaction-overhead লাগে। COPY একটা সংযোগের ভেতরে ডেটার স্ট্রিম পাঠায়, parse/plan একবার। vector-এর মতো বড় (৬KB) row-তে network-এর ব্যবহার হ্রাস করতে <code>FORMAT BINARY</code> আরও সাহায্য করে (float-কে text-এ রূপান্তর করার খরচ বাঁচে)।</div>
<h4>৬.২ Python: COPY দিয়ে bulk load (psycopg 3 + pgvector)</h4>
<pre><span class="c"># pip install "psycopg[binary]" pgvector numpy</span>
import numpy as np, psycopg
from pgvector.psycopg import register_vector

def bulk_load(conn_str: str, rows):
    """rows: (document_id, tenant_id, chunk_index, content, embedding(np.float32), embed_model, content_hash) এর iterable"""
    with psycopg.connect(conn_str) as conn:
        register_vector(conn)                                   <span class="c"># vector টাইপ psycopg-কে চেনায়</span>
        with conn.cursor() as cur:
            with cur.copy(
                "COPY doc_chunks (document_id, tenant_id, chunk_index, content, embedding, embed_model, content_hash) "
                "FROM STDIN WITH (FORMAT BINARY)"
            ) as copy:
                copy.set_types(["bigint", "int", "int", "text", "vector", "text", "text"])   <span class="c"># binary-তে টাইপ বলে দিতে হয়</span>
                for r in rows:
                    copy.write_row(r)
        conn.commit()</pre>
<h4>৬.৩ Idempotent upsert (লাইভ আপডেটের জন্য)</h4>
<pre>INSERT INTO doc_chunks (document_id, tenant_id, chunk_index, content, embedding, embed_model, content_hash)
VALUES (%s, %s, %s, %s, %s, %s, %s)
ON CONFLICT (document_id, chunk_index) DO UPDATE
SET content = EXCLUDED.content,
    embedding = EXCLUDED.embedding,
    embed_model = EXCLUDED.embed_model,
    content_hash = EXCLUDED.content_hash
WHERE doc_chunks.content_hash IS DISTINCT FROM EXCLUDED.content_hash;   -- hash একই হলে কিছুই করে না</pre>
<div class="callout best"><span class="tag">Best practice — আগে ডেটা, পরে index</span>
প্রাথমিক বড় লোডে <b>প্রথমে সব ডেটা ঢোকান, তারপর ANN index বানান</b>। Index থাকা অবস্থায় প্রতিটা insert-এ graph/list আপডেট হয় — অনেক ধীর। বিশেষ করে <b>IVFFlat-এ</b> এটা বাধ্যতামূলক: centroid (এলাকার কেন্দ্র) বানানো হয় index তৈরির সময়ের ডেটা থেকে — খালি table-এ বানালে centroid অর্থহীন (৯ নং অংশ)।</div>

<h3>৭. প্রথমে Exact Search — Index ছাড়া খোঁজা</h3>
<h4>৭.১ কেন index ছাড়াই শুরু করবেন</h4>
<p>Index ছাড়া PostgreSQL প্রতিটা সারির সাথে তুলনা করে (sequential scan) — এটাই brute force/exact kNN, ১০০% নির্ভুল। আপনার ডেটা কয়েক হাজার–কয়েক লাখ হলে এটাই যথেষ্ট দ্রুত হতে পারে, আর এটাই ANN-এর নির্ভুলতা মাপার <b>ground truth</b>। খরচ ≈ সারি × dimension গুণ-যোগ: ১ লাখ × ১৫৩৬ ≈ ১৫.৪ কোটি floating-point গুণ-যোগ — আধুনিক CPU-তে দশ-কয়েক মিলিসেকেন্ড থেকে শতাধিক ms (parallel scan-এ কম)। ১ কোটি হলে ১০০ গুণ — সেকেন্ড, তখন index অপরিহার্য।</p>
<pre>-- exact search: index ছাড়া (বা index থাকলেও বন্ধ করে) সঠিক উত্তর
BEGIN;
SET LOCAL enable_indexscan = off;        -- সাময়িকভাবে index বন্ধ
SELECT id, content, embedding &lt;=&gt; $1 AS dist
FROM doc_chunks WHERE tenant_id = 7
ORDER BY embedding &lt;=&gt; $1 LIMIT 10;
COMMIT;</pre>
<h4>৭.২ ANN-এর recall কীভাবে মাপবেন</h4>
<p>ধারণা: একই ১০০টা প্রশ্ন একবার exact (ground truth), একবার ANN index দিয়ে চালান; ANN-এর top-k কতটা exact-এর top-k-এর সাথে মেলে তা <b>recall@k</b>। পুরো পরীক্ষার কোড — মেলানোর ফাংশনটা Python-এ চালিয়ে যাচাই করা:</p>
<pre>def recall_at_k(exact_ids: list[list[int]], ann_ids: list[list[int]], k: int = 10) -&gt; float:
    """প্রতিটা প্রশ্নের জন্য: ANN-এর top-k-এর কতজন exact top-k-তে আছে — গড়।"""
    total = 0.0
    for ex, an in zip(exact_ids, ann_ids):
        total += len(set(ex[:k]) &amp; set(an[:k])) / k
    return total / len(exact_ids)

<span class="c"># উদাহরণ: ২ প্রশ্ন, k=4</span>
exact = [[1, 2, 3, 4], [10, 11, 12, 13]]
ann   = [[1, 2, 3, 9], [10, 12, 99, 98]]        <span class="c"># ১ম: ৩/৪ মিলেছে, ২য়: ২/৪</span>
print(recall_at_k(exact, ann, k=4))               <span class="c"># (0.75 + 0.5) / 2 = 0.625</span></pre>
<pre><span class="c"># DB থেকে দুই ধরনের ফল আনা (psycopg)</span>
def search_ids(conn, qvec, k, exact: bool):
    with conn.transaction():
        if exact:
            conn.execute("SET LOCAL enable_indexscan = off")        <span class="c"># index বন্ধ → exact</span>
        return [r[0] for r in conn.execute(
            "SELECT id FROM doc_chunks ORDER BY embedding &lt;=&gt; %s LIMIT %s", (qvec, k)).fetchall()]</pre>
<div class="callout best"><span class="tag">লক্ষ্য কত হবে</span>
সাধারণত recall@10 ≥ ০.৯৫ ভালো শুরু; RAG-এ ০.৯০ও প্রায়ই চলে (কারণ পরে reranker আছে), কিন্তু ০.৮০-র নিচে হলে প্রাসঙ্গিক chunk নিয়মিত হারাচ্ছেন। এই সংখ্যা মেপে ef_search/probes টিউন করুন — অনুমান করে নয় (অধ্যায় ১৩)।</div>

<h3>৮. HNSW Index — ভেতরের কাজ, parameter ও ব্যবহার</h3>
<h4>৮.১ ধারণা (সংক্ষেপে মনে করি, বিস্তারিত অধ্যায় ৪-এ)</h4>
<p>HNSW হলো <b>স্তরভিত্তিক গ্রাফ</b>। প্রতিটা vector একটা node। প্রতিটা node কয়েকটা "কাছের প্রতিবেশী"-র সাথে যুক্ত। উপরের স্তর বিরল (কম node, লম্বা লাফ), নিচের স্তর ঘন (সব node)। খোঁজার সময় উপরের স্তরে শুরু করে "লোভী" (greedy) পথে লক্ষ্যের দিকে এগোয়, তারপর নিচের স্তরে নেমে ক্রমে সূক্ষ্ম করে — যেন মানচিত্রে দেশ → শহর → রাস্তা → বাড়ি।</p>
<h4>৮.২ Insert-এ কী ঘটে (ধাপে ধাপে)</h4>
<ol>
<li>নতুন node-এর <b>সর্বোচ্চ স্তর</b> এলোমেলোভাবে ঠিক হয়: <code>level = ⌊−ln(rand) × mL⌋</code> যেখানে <code>mL = 1/ln(m)</code>। এতে বেশিরভাগ node শুধু স্তর ০-তে, অল্প কিছু উপরে।</li>
<li>সবচেয়ে উপরের স্তর থেকে শুরু করে, প্রতিটা স্তরে greedy খোঁজে নতুন node-এর <b>সবচেয়ে কাছের</b> একটা node (entry point) বের করে।</li>
<li>নতুন node-এর নিজস্ব স্তর থেকে নিচে, প্রতিটা স্তরে <code>ef_construction</code> সংখ্যক প্রার্থী দেখে, তাদের মধ্য থেকে সবচেয়ে ভালো <code>m</code>টা বাছে (স্তর ০-তে <code>2×m</code>) ও দ্বিমুখী সংযোগ বানায়।</li>
<li>কোনো প্রতিবেশীর সংযোগ সীমা পার হলে তার "সবচেয়ে কম কাজের" সংযোগ ছেঁটে ফেলা হয় (pruning/heuristic)।</li>
</ol>
<p>গণনা করা: কত স্তর হবে? প্রত্যাশিত সর্বোচ্চ স্তর ≈ <code>ln(N) × mL</code>:</p>
<table>
<tr><th><code>m</code></th><th><code>mL = 1/ln(m)</code></th><th>১০ লাখ node-এ প্রত্যাশিত সর্বোচ্চ স্তর</th></tr>
<tr><td>8</td><td>0.481</td><td>≈ 6.6</td></tr>
<tr><td>16</td><td>0.361</td><td>≈ 5.0</td></tr>
<tr><td>32</td><td>0.289</td><td>≈ 4.0</td></tr>
</table>
<p>অর্থাৎ ১০ লাখ vector-এও মাত্র ~৫ স্তর — খোঁজার পথ খুব ছোট (প্রায় লগারিদমিক), এজন্যই HNSW এত দ্রুত।</p>
<h4>৮.৩ খোঁজার সময় কী ঘটে</h4>
<ol>
<li>উপরের স্তর থেকে নিচে নামতে নামতে, স্তর ১ পর্যন্ত প্রতিটা স্তরে greedy একটা সেরা node।</li>
<li>স্তর ০-তে <b><code>ef_search</code> সংখ্যক</b> প্রার্থীর একটা "প্রার্থী-তালিকা" রাখে; সবচেয়ে কাছের অনুসন্ধিত প্রতিবেশীদের বারবার দেখে তালিকা হালনাগাদ করে, যতক্ষণ না উন্নতি থামে।</li>
<li>তালিকার সেরা <code>LIMIT</code> টা ফেরত।</li>
</ol>
<div class="callout why"><span class="tag">তাৎপর্য — <code>ef_search</code>ই recall-এর নিয়ন্ত্রণ</span>
<code>ef_search</code> বাড়ালে বেশি প্রার্থী দেখা হয় → recall বাড়ে, কিন্তু আরও node ছুঁতে হয় → ধীর। আর <b><code>ef_search</code> কমপক্ষে <code>LIMIT</code>-এর সমান না হলে</b> আপনি চাওয়া সংখ্যার ফল পাবেন না (যেমন ef_search=40 ও LIMIT 100 → সর্বোচ্চ ~৪০টা ফল)। এটা filtered search-এ আরও গুরুতর (১১ নং অংশ)।</div>
<h4>৮.৪ Index তৈরি ও parameter</h4>
<pre>CREATE INDEX idx_chunks_hnsw ON doc_chunks
USING hnsw (embedding vector_cosine_ops)          -- operator class অবশ্যই query-র operator-এর সাথে মিলতে হবে
WITH (m = 16, ef_construction = 64);              -- ডিফল্ট মান; নিচে কখন বদলাবেন</pre>

<tr><th>Parameter</th><th>ডিফল্ট</th><th>অর্থ</th><th>বাড়ালে</th><th>কমালে</th></tr>
<tr><td><code>m</code></td><td>16</td><td>প্রতিটা node-এর সর্বোচ্চ সংযোগ (স্তর ০-তে ২×m)</td><td>recall ↑ (বিশেষ করে উচ্চ-dimension/কঠিন ডেটায়), index আকার ↑, build ধীর</td><td>ছোট ও দ্রুত index, recall ↓</td></tr>
<tr><td><code>ef_construction</code></td><td>64</td><td>index বানানোর সময় প্রতিটা node-এর জন্য কতজন প্রার্থী বিবেচনা</td><td>graph-এর মান ↑ (পরে একই ef_search-এ recall ↑), build অনেক ধীর</td><td>দ্রুত build, নিম্নমানের graph</td></tr>

</table>

BEGIN;
SET LOCAL hnsw.ef_search = 100;
SELECT id, content FROM doc_chunks ORDER BY embedding &lt;=&gt; $1 LIMIT 10;
COMMIT;</pre>
<h4>৮.৫ Index কেন ব্যবহার হচ্ছে না — পরীক্ষার তালিকা</h4>
<table>
<tr><th>কারণ</th><th>লক্ষণ</th><th>সমাধান</th></tr>
<tr><td>Query-র operator ≠ index-এর operator class</td><td>Seq Scan</td><td><code>&lt;=&gt;</code> ↔ <code>vector_cosine_ops</code>, <code>&lt;-&gt;</code> ↔ <code>vector_l2_ops</code>, <code>&lt;#&gt;</code> ↔ <code>vector_ip_ops</code></td></tr>
<tr><td><code>ORDER BY</code> + <code>LIMIT</code> নেই</td><td>Seq Scan</td><td>ANN index কেবল "সবচেয়ে কাছের k" প্যাটার্নে কাজ করে</td></tr>
<tr><td>ORDER BY-তে expression/similarity</td><td>Seq Scan</td><td>সরাসরি <code>ORDER BY embedding &lt;=&gt; $1</code> (৪.৪ দেখুন)</td></tr>
<tr><td>Cast মেলেনি (<code>vector</code> কলাম, query <code>halfvec</code>)</td><td>Seq Scan</td><td>Index-এর expression ও query হুবহু মেলান</td></tr>
<tr><td>Planner ভাবছে seq scan সস্তা (ছোট table বা নিম্ন selectivity)</td><td>ছোট table-এ Seq Scan</td><td>স্বাভাবিক — ছোট ডেটায় index দরকারই নেই। <code>ANALYZE</code> চালান</td></tr>
<tr><td>Parameter ($1) type অস্পষ্ট</td><td>কখনো Seq Scan</td><td>ক্লায়েন্টে স্পষ্ট <code>::vector</code> cast, বা driver-এর vector adapter</td></tr>
</table>
<h4>৮.৬ Build-এর সময় ও মেমরি — সবচেয়ে ব্যবহারিক টিপস</h4>
<ul>
<li><b><code>maintenance_work_mem</code>:</b> HNSW graph বানানোর সময় যদি graph এই মেমরিতে না আঁটে, PostgreSQL <code>NOTICE: hnsw graph no longer fits into maintenance_work_mem</code> বলে এবং build <b>নাটকীয়ভাবে ধীর</b> হয়ে যায় (disk-এ নামে)। বড় ডেটায় সেশনে <code>SET maintenance_work_mem = '4GB'</code> (সার্ভারের RAM-এর মধ্যে) দিয়ে build করুন।</li>
<li><b>Parallel build:</b> <code>SET max_parallel_maintenance_workers = 7</code> (কোর সংখ্যা অনুযায়ী) — সংস্করণ ০.৬+ থেকে HNSW parallel build সম্ভব (হেজ)।</li>
<li><b>অনলাইন সিস্টেমে:</b> <code>CREATE INDEX CONCURRENTLY</code> — table লক না করে (কিন্তু বেশি সময় লাগে, ব্যর্থ হলে অবৈধ index পড়ে থাকে, তা <code>DROP INDEX</code> করে আবার চেষ্টা)।</li>
<li><b>Progress দেখা:</b> <code>SELECT phase, round(100.0*blocks_done/nullif(blocks_total,0),1) AS pct FROM pg_stat_progress_create_index;</code></li>
<li><b>Index আকার দেখা:</b> <code>SELECT pg_size_pretty(pg_relation_size('idx_chunks_hnsw'));</code></li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake — Build শুরু করে মেমরি/সময়ের আন্দাজ না রাখা</span>
১ কোটি × ১৫৩৬-dim HNSW build ঘণ্টা-খানেক থেকে কয়েক ঘণ্টা ও কয়েকশো GB পর্যন্ত লাগতে পারে — production-এ পিক টাইমে সরাসরি চালালে অন্য query ধীর হবে। আগে ছোট নমুনায় (১ লাখ) সময় মেপে আন্দাজ করুন, off-peak-এ <code>CONCURRENTLY</code> দিয়ে চালান, আর <code>halfvec</code>/ছোট dimension ভাবুন।</div>
<h4>৮.৭ Insert/Update-এর খরচ</h4>
<p>HNSW index থাকা অবস্থায় প্রতিটা নতুন row ঢোকানো মানে graph-এ নতুন node জোড়া (উপরের ৮.২-এর ধাপ) — সাধারণ B-tree insert-এর চেয়ে অনেক ভারী। ফলে লেখা-ভারী কাজে (প্রতি সেকেন্ডে হাজার হাজার insert) throughput কমে। সমাধান: batch করে ঢোকান, বা বড় লোডের আগে index ফেলে পরে বানান।</p>

<h3>৯. IVFFlat Index — বিকল্প, ও কখন</h3>
<h4>৯.১ ধারণা</h4>
<p><b>IVFFlat</b> (Inverted File with Flat storage): index বানানোর সময় সব vector-কে <b>k-means clustering</b> দিয়ে <code>lists</code> সংখ্যক এলাকায় (cluster) ভাগ করে, প্রতিটার একটা <b>কেন্দ্র (centroid)</b> রাখে। প্রতিটা vector নিজের সবচেয়ে কাছের centroid-এর "তালিকা"-য় জমা হয়। খোঁজার সময়: (১) প্রশ্নের vector-কে সব centroid-এর সাথে তুলনা, (২) সবচেয়ে কাছের <code>probes</code> সংখ্যক এলাকা বাছা, (৩) শুধু সেই এলাকাগুলোর ভেতরে exact তুলনা।</p>
<div class="diagram"><pre>
   সব vector ──k-means──► lists = 4 এলাকা          প্রশ্ন q → কাছের centroid-এর probes=1 এলাকা শুধু দেখো

   ┌────────┐ ┌────────┐ ┌────────┐ ┌────────┐
   │ এলাকা A │ │ এলাকা B │ │ এলাকা C │ │ এলাকা D │       q অনুমানিত এলাকা B-র কাছে →
   │  ●  ●   │ │   ●    │ │  ●  ●   │ │   ●    │       শুধু B-র ভেতর খুঁজি (¼ ডেটা)
   │ ●c  ●   │ │ ● c ●  │ │  ●c ●   │ │ ● c ●  │       ঝুঁকি: আসল সেরা প্রতিবেশী সীমানার
   └────────┘ └────────┘ └────────┘ └────────┘        ওপারে (এলাকা C-তে) থাকলে মিস হয়
</pre></div>
<h4>৯.২ Parameter ও sizing নিয়ম (গণনা করা)</h4>
<pre>CREATE INDEX idx_chunks_ivf ON doc_chunks
USING ivfflat (embedding vector_cosine_ops) WITH (lists = 1000);

SET ivfflat.probes = 32;     -- query-time: কয়টা এলাকা দেখবে (ডিফল্ট 1 — প্রায় সবসময় খুব কম!)</pre>
<table>
<tr><th>সারি (N)</th><th>সুপারিশ <code>lists</code></th><th>সুপারিশ <code>probes</code> ≈ √lists</th><th>স্ক্যান করা ভগ্নাংশ</th><th>প্রতি query-তে ~সারি</th></tr>
<tr><td>১ লাখ</td><td>N/1000 = 100</td><td>10</td><td>10%</td><td>~10,000</td></tr>
<tr><td>১০ লাখ</td><td>N/1000 = 1,000</td><td>31</td><td>3.1%</td><td>~31,000</td></tr>
<tr><td>৫০ লাখ</td><td>√N ≈ 2,236</td><td>47</td><td>2.1%</td><td>~105,000</td></tr>
</table>
<p>নিয়ম (pgvector ডকুমেন্টের পরামর্শ): ১০ লাখ পর্যন্ত <code>lists = rows/1000</code>, তার বেশিতে <code>lists = √rows</code>; <code>probes</code> শুরুতে <code>√lists</code>। সংখ্যাগুলো উপরে গণনা করা। এটা শুরুর আন্দাজ — আপনার ডেটায় recall মেপে টিউন করুন (৭.২)।</p>
<h4>৯.৩ IVFFlat-এর বিশেষ সতর্কতা</h4>
<div class="callout mistake"><span class="tag">Common mistake — খালি/ছোট table-এ IVFFlat বানানো</span>
Centroid বানানো হয় index তৈরির মুহূর্তের ডেটা থেকে। খালি বা খুব কম ডেটায় বানালে centroid অর্থহীন; পরে ডেটা ঢুকলেও centroid বদলায় না → এলাকাগুলো অসম হয়, recall নষ্ট। <b>ডেটা ঢোকানোর পরে index বানান</b>। ডেটার বণ্টন অনেক বদলে গেলে <code>REINDEX</code> করে centroid নতুন করে বানাতে হয়।</div>
<div class="callout mistake"><span class="tag">Common mistake — <code>probes = 1</code> ডিফল্টে ছেড়ে দেওয়া</span>
ডিফল্ট ১ মানে শুধু একটা এলাকা দেখে — recall প্রায়ই ৪০–৭০%-এ থাকে এবং আপনি ভাবেন "Vector search খারাপ"। অথচ সমস্যা শুধু একটা সেটিং। probes বাড়িয়ে recall মাপুন।</div>
<h4>৯.৪ HNSW বনাম IVFFlat</h4>
<table>
<tr><th></th><th>HNSW</th><th>IVFFlat</th></tr>
<tr><td>Query গতি ও recall (একই স্তরে)</td><td><b>সাধারণত ভালো</b></td><td>তুলনায় কম</td></tr>
<tr><td>Build সময়</td><td>ধীর</td><td><b>দ্রুত</b></td></tr>
<tr><td>Index মেমরি/আকার</td><td>বড়</td><td><b>ছোট</b></td></tr>
<tr><td>খালি table-এ বানানো</td><td><b>চলে</b> (ডেটা ক্রমে ঢুকতে পারে)</td><td>ঠিক না — ডেটা আগে লাগে</td></tr>
<tr><td>ডেটা বদলালে</td><td>ভালোভাবে মানিয়ে নেয়</td><td>বণ্টন বদলালে rebuild</td></tr>
<tr><td>প্রধান tuning knob</td><td><code>ef_search</code></td><td><code>probes</code></td></tr>
</table>
<div class="callout best"><span class="tag">সুপারিশ</span>
ডিফল্ট পছন্দ <b>HNSW</b> — ভালো recall/গতি, কম ঝামেলা। IVFFlat ভাবুন শুধু যখন: build সময়/মেমরি সীমিত, ডেটা বিশাল ও স্থির, বা ছোট index দরকার। দুটোর বাইরে কিছুই না বানিয়ে (exact scan) থাকাও ছোট ডেটায় একদম সঠিক সিদ্ধান্ত।</div>

<h3>১০. Filtered Search — pgvector-এর সবচেয়ে বড় ফাঁদ (গভীরে)</h3>
<h4>১০.১ সমস্যাটা কী</h4>
<p>বাস্তবে প্রায় সব query-তে filter থাকে: <code>WHERE tenant_id = 7 AND dept = 'finance'</code>। কিন্তু ANN index (HNSW/IVF) <b>শুধু vector দূরত্ব</b> জানে, আপনার filter জানে না। PostgreSQL-এ ধাপগুলো দাঁড়ায়: (১) index থেকে <code>ef_search</code> সংখ্যক "কাছের" প্রার্থী আনো (filter ছাড়া), (২) তাদের উপর filter প্রয়োগ করো (<b>post-filtering</b>), (৩) যা টিকে থাকে তাই ফেরত। যদি filter কঠোর হয়, প্রার্থীদের প্রায় সবাই বাদ পড়ে।</p>
<h4>১০.২ গণিত — কেন এটা ভয়ংকর (গণনা করা)</h4>
<p>ধরুন <code>ef_search = 40</code>, আর আপনার filter ডেটার <b>selectivity</b> (কত ভগ্নাংশ সারি filter পাস করে) = s। প্রার্থী ৪০টার মধ্যে প্রত্যাশিত বাঁচবে ≈ <b>40 × s</b>:</p>
<table>
<tr><th>Filter পাস করে (s)</th><th>৪০ প্রার্থীর মধ্যে প্রত্যাশিত survivor</th><th>১০টা ফল পেতে কতজন প্রার্থী লাগত (10/s)</th><th>ফল</th></tr>
<tr><td>৫০%</td><td>20</td><td>20</td><td>ঠিক আছে</td></tr>
<tr><td>১০%</td><td>4</td><td>100</td><td>মাত্র ~৪টা ফল (১০টা চেয়েছিলেন)</td></tr>
<tr><td>১%</td><td><b>0.4</b></td><td>1,000</td><td><b>প্রায়ই শূন্য ফল!</b></td></tr>
<tr><td>০.১%</td><td>0.04</td><td>10,000</td><td>কার্যত সবসময় খালি</td></tr>
</table>
<div class="callout why"><span class="tag">এটা কেন বিপজ্জনক — নীরব ব্যর্থতা</span>
কোনো error আসে না। Query "সফল" হয়, কিন্তু ১টা বা ০টা ফল দেয়। RAG-এ এর অর্থ: প্রাসঙ্গিক chunk থাকা সত্ত্বেও LLM "জানি না" বলে বা অপ্রাসঙ্গিক তথ্যে hallucinate করে। সবচেয়ে খারাপ — multi-tenant সিস্টেমে ছোট tenant (১% ডেটা) সবচেয়ে বেশি ভোগে, ফলে ছোট গ্রাহকেরা "AI কাজ করে না" বলে অভিযোগ করে, আর আপনি বড় tenant-এ পরীক্ষা করে সব ঠিক দেখেন।</div>
<h4>১০.৩ সমাধানের তালিকা (সহজ থেকে জটিল)</h4>
<table>
<tr><th>কৌশল</th><th>কীভাবে</th><th>কখন ভালো</th><th>সীমা</th></tr>
<tr><td><b>১. ef_search বাড়ানো</b></td><td><code>SET hnsw.ef_search = 400</code></td><td>মাঝারি selectivity (১০%+)</td><td>কঠোর filter-এ অকার্যকর/ধীর; সীমা ~১০০০</td></tr>
<tr><td><b>২. B-tree index + planner</b></td><td>filter কলামে সাধারণ index; selectivity খুব কম হলে planner নিজেই "filter আগে, তারপর exact scan" বেছে নেয়</td><td>খুব কঠোর filter (&lt;১%): কয়েকশো সারির exact scan দ্রুত ও ১০০% নির্ভুল</td><td>planner-কে <code>ANALYZE</code> ও সঠিক statistics দিতে হয়</td></tr>
<tr><td><b>৩. Partial index</b></td><td><code>CREATE INDEX ... USING hnsw (...) WHERE tenant_id = 7</code></td><td>অল্প সংখ্যক বড় tenant/স্থির শ্রেণি</td><td>প্রতি tenant-এ আলাদা index — শতাধিক tenant-এ অচল</td></tr>
<tr><td><b>৪. Partitioning</b></td><td><code>PARTITION BY LIST (tenant_id)</code> বা HASH; প্রতি partition-এ নিজস্ব HNSW</td><td>বহু tenant, প্রতিটা আলাদা; query সবসময় tenant নির্দিষ্ট</td><td>partition সংখ্যা বেশি হলে planning overhead</td></tr>
<tr><td><b>৫. Iterative index scan</b> (pgvector ০.৮+; হেজ)</td><td><code>SET hnsw.iterative_scan = relaxed_order</code> — যথেষ্ট ফল না পেলে index থেকে আরও প্রার্থী পড়তে থাকে</td><td>ডিফল্ট সমাধান, বিশেষ করে ১–১০% filter</td><td>সংস্করণ লাগে; <code>hnsw.max_scan_tuples</code> (ডিফল্ট ~২০,০০০) এ থামে; <code>relaxed_order</code> সামান্য অর্ডার-গরমিল করতে পারে</td></tr>
<tr><td><b>৬. Over-fetch</b></td><td>ভেতরের query-তে filter ছাড়া বড় LIMIT (যেমন ২০০), বাইরে filter + ছোট LIMIT</td><td>iterative scan নেই এমন সংস্করণে</td><td>নিশ্চয়তা নেই, সংখ্যা অনুমান</td></tr>
<tr><td><b>৭. Pre-filter + exact</b></td><td>CTE-তে MATERIALIZED filter, তারপর exact <code>ORDER BY</code></td><td>filter-এর ফলে সারি &lt; ~১০–৫০ হাজার</td><td>বড় ফল-সেটে ধীর</td></tr>
</table>
<h4>১০.৪ বাস্তব SQL — Iterative scan ও বিকল্প</h4>
<pre>-- (৫) Iterative scan (pgvector ০.৮+ — আপনার সংস্করণে যাচাই করুন)
BEGIN;
SET LOCAL hnsw.iterative_scan = relaxed_order;
SET LOCAL hnsw.max_scan_tuples = 50000;          -- সর্বোচ্চ কতজন প্রার্থী পড়বে (নিরাপত্তা-সীমা)
SET LOCAL hnsw.ef_search = 100;
SELECT id, content, embedding &lt;=&gt; $1 AS dist
FROM doc_chunks
WHERE tenant_id = 7 AND dept = 'finance'
ORDER BY embedding &lt;=&gt; $1
LIMIT 10;
COMMIT;

-- (৬) Over-fetch: iterative scan নেই এমন সংস্করণে
WITH candidates AS (
    SELECT id, content, tenant_id, dept, embedding &lt;=&gt; $1 AS dist
    FROM doc_chunks
    ORDER BY embedding &lt;=&gt; $1
    LIMIT 400                                    -- বড় জাল ফেলো
)
SELECT * FROM candidates
WHERE tenant_id = 7 AND dept = 'finance'
ORDER BY dist LIMIT 10;

-- (৭) Pre-filter + exact: সংকীর্ণ filter-এ নির্ভুল
WITH scoped AS MATERIALIZED (
    SELECT id, content, embedding FROM doc_chunks WHERE tenant_id = 7 AND dept = 'finance'
)
SELECT id, content, embedding &lt;=&gt; $1 AS dist FROM scoped ORDER BY dist LIMIT 10;

-- (৩) Partial index এবং (৪) partitioning
CREATE INDEX idx_chunks_hnsw_t7 ON doc_chunks USING hnsw (embedding vector_cosine_ops) WHERE tenant_id = 7;

CREATE TABLE doc_chunks_p (LIKE doc_chunks INCLUDING DEFAULTS) PARTITION BY HASH (tenant_id);
CREATE TABLE doc_chunks_p0 PARTITION OF doc_chunks_p FOR VALUES WITH (MODULUS 8, REMAINDER 0);
-- ... p1..p7; প্রতিটা partition-এ আলাদা HNSW index</pre>
<div class="callout best"><span class="tag">সিদ্ধান্তের ধাপ</span>
(১) আপনার filter-গুলোর selectivity মাপুন। (২) অধিকাংশ query-তে selectivity &gt;১০% হলে সাধারণ HNSW + বড় <code>ef_search</code> যথেষ্ট। (৩) ১–১০% হলে iterative scan। (৪) &lt;১%-এ B-tree + exact scan বা partitioning। (৫) <b>সবসময় ছোটতম tenant দিয়ে পরীক্ষা করুন</b> — বড়টা দিয়ে নয়।</div>

<h3>১১. Hybrid Search — Vector + Full-Text, SQL-এই (পূর্ণ কোড)</h3>
<h4>১১.১ কেন দরকার (পুনরাবৃত্তি ছাড়া মূল কথা)</h4>
<p>Vector অর্থ ধরে, কিন্তু হুবহু শব্দ (invoice <code>INV-1042</code>, পণ্যের কোড, নাম, ইংরেজি পরিভাষা) প্রায়ই দুর্বল ধরে। Keyword search ঠিক উল্টো। দুটো মিশিয়ে ব্যবহার করাই hybrid (অধ্যায় ৭-এ ধারণা)। PostgreSQL-এ দুটোই এক জায়গায় — একটা SQL query-তেই।</p>
<h4>১১.২ Keyword অংশ: tsvector ও GIN index</h4>
<pre>-- ৫.১-এর table-এ fts কলাম আগে থেকেই আছে: to_tsvector('simple', content)
CREATE INDEX idx_chunks_fts ON doc_chunks USING gin (fts);

SELECT id, ts_rank_cd(fts, websearch_to_tsquery('simple', 'refund policy')) AS rank
FROM doc_chunks
WHERE fts @@ websearch_to_tsquery('simple', 'refund policy')
ORDER BY rank DESC LIMIT 20;</pre>
<div class="callout mistake"><span class="tag">Common mistake — বাংলার জন্য <code>'english'</code> কনফিগ</span>
PostgreSQL-এ বাংলার জন্য built-in stemmer/stop-word নেই। <code>to_tsvector('english', বাংলা লেখা)</code> বাংলা শব্দকে ভুলভাবে ছাঁটে বা অবহেলা করে। বাংলা/মিশ্র লেখায় সাধারণত <code>'simple'</code> কনফিগ (শুধু ছোট হাতের ও শব্দে ভাগ) ব্যবহার করুন; আরও ভালো ফলের জন্য ভাষা-নির্দিষ্ট extension/বাইরের tokenizer বা <code>pg_trgm</code> (trigram) ভাবুন। ইংরেজি-ভারী ডেটায় <code>'english'</code> ঠিক আছে।</div>
<div class="callout behind"><span class="tag">পর্দার পেছনে — <code>ts_rank</code> আসল BM25 নয়</span>
PostgreSQL-এর <code>ts_rank</code>/<code>ts_rank_cd</code> একটা সরল র‍্যাঙ্কিং (শব্দের ঘনত্ব/নৈকট্য); এতে BM25-র মতো ডকুমেন্ট-দৈর্ঘ্য স্বাভাবিকীকরণ ও IDF সঠিকভাবে নেই। অনেক ব্যবহারে যথেষ্ট; কিন্তু আসল BM25 লাগলে বাইরের extension (যেমন ParadeDB <code>pg_search</code>, VectorChord-bm25 — <b>২০২৬-এ যাচাই করুন</b>) বা Elasticsearch/OpenSearch (অধ্যায় ১১) ভাবুন।</div>
<h4>১১.৩ ফল মেশানো: Reciprocal Rank Fusion (RRF)</h4>
<p>সমস্যা: vector-এর স্কোর (cosine distance ০–২) আর keyword স্কোর (ts_rank ০–১+) <b>ভিন্ন একক</b> — সরাসরি যোগ করা অর্থহীন। RRF স্কোর বাদ দিয়ে শুধু <b>র‍্যাঙ্ক (ক্রম)</b> ব্যবহার করে: প্রতিটা তালিকায় একটা ডকুমেন্টের র‍্যাঙ্ক r হলে তার অবদান <code>1/(k + r)</code>, সব তালিকার অবদান যোগ। <code>k</code> সাধারণত ৬০।</p>
<p><b>হাতে গণনা করা উদাহরণ</b> (k = ৬০, গণনা Python-এ যাচাই করা): keyword তালিকা = [d7, d2, d9, d1], vector তালিকা = [d2, d5, d7, d3]।</p>
<table>
<tr><th>Doc</th><th>keyword র‍্যাঙ্ক</th><th>vector র‍্যাঙ্ক</th><th>RRF স্কোর</th></tr>
<tr><td><b>d2</b></td><td>2</td><td>1</td><td>1/62 + 1/61 = <b>0.03252</b></td></tr>
<tr><td><b>d7</b></td><td>1</td><td>3</td><td>1/61 + 1/63 = <b>0.03227</b></td></tr>
<tr><td>d5</td><td>—</td><td>2</td><td>1/62 = 0.01613</td></tr>
<tr><td>d9</td><td>3</td><td>—</td><td>1/63 = 0.01587</td></tr>
<tr><td>d1</td><td>4</td><td>—</td><td>1/64 = 0.01562</td></tr>
<tr><td>d3</td><td>—</td><td>4</td><td>1/64 = 0.01562 (d1-এর সাথে টাই)</td></tr>
</table>
<div class="callout why"><span class="tag">অন্তর্দৃষ্টি — d2 ও d7 কেন উপরে</span>
d2 ও d7 <b>দুই তালিকাতেই</b> আছে, তাই দুই অবদান যোগ হয়ে একক-তালিকা-ওয়ালাদের (d5, d9) দ্বিগুণের কাছাকাছি স্কোর পায়। RRF-এর শক্তি: "দুই ভিন্ন পদ্ধতিই যাকে ভালো বলে, সে সম্ভবত সত্যিই প্রাসঙ্গিক"। <code>k</code> বড় হলে র‍্যাঙ্কের পার্থক্যের প্রভাব কমে (সমান ওজন), ছোট হলে (যেমন k=1: d2=0.833, d7=0.75, d5=0.333) শীর্ষ র‍্যাঙ্ক অনেক বেশি প্রাধান্য পায়।</div>
<h4>১১.৪ পূর্ণ SQL — RRF একটা query-তে</h4>
<pre>-- $1 = প্রশ্নের embedding (vector), $2 = প্রশ্নের টেক্সট, $3 = tenant
WITH vec AS (
    SELECT id, ROW_NUMBER() OVER (ORDER BY dist) AS rnk           -- র‍্যাঙ্ক বসে ৪০টা বেছে নেওয়ার পরে
    FROM (
        SELECT id, embedding &lt;=&gt; $1 AS dist
        FROM doc_chunks
        WHERE tenant_id = $3
        ORDER BY embedding &lt;=&gt; $1                                -- সরাসরি operator + LIMIT → HNSW index ব্যবহারযোগ্য
        LIMIT 40                                                  -- প্রতিটা শাখা থেকে ৪০ প্রার্থী
    ) s
),
kw AS (
    SELECT id, ROW_NUMBER() OVER (ORDER BY score DESC) AS rnk
    FROM (
        SELECT id, ts_rank_cd(fts, q) AS score
        FROM doc_chunks, websearch_to_tsquery('simple', $2) AS q
        WHERE tenant_id = $3 AND fts @@ q
        ORDER BY score DESC
        LIMIT 40
    ) s
),
fused AS (
    SELECT COALESCE(vec.id, kw.id) AS id,
           COALESCE(1.0 / (60 + vec.rnk), 0) + COALESCE(1.0 / (60 + kw.rnk), 0) AS rrf
    FROM vec FULL OUTER JOIN kw ON vec.id = kw.id    -- যেকোনো এক তালিকায় থাকলেই চলবে
)
SELECT c.id, c.content, f.rrf
FROM fused f JOIN doc_chunks c ON c.id = f.id
ORDER BY f.rrf DESC
LIMIT 10;</pre>
<div class="callout mistake"><span class="tag">Common mistake — LIMIT-এর আগে ROW_NUMBER() (index নীরবে অকেজো)</span>
প্রথম মনে হয় লেখা যায়: <code>SELECT id, ROW_NUMBER() OVER (ORDER BY embedding &lt;=&gt; $1) AS rnk FROM doc_chunks ORDER BY embedding &lt;=&gt; $1 LIMIT 40</code>। কিন্তু SQL-এ <b>window function <code>LIMIT</code>-এর আগে</b> গণনা হয় — তাই PostgreSQL আগে <i>সব</i> সারির জন্য row number বের করতে বাধ্য, মানে পুরো table scan ও sort; HNSW index কাজেই লাগে না। সঠিক নকশা: ভেতরের subquery-তে সরাসরি <code>ORDER BY embedding &lt;=&gt; $1 LIMIT 40</code> (index পায়), তারপর বাইরে সেই ৪০টার উপর <code>ROW_NUMBER()</code>। উপরের SQL ঠিক তা-ই করে। সন্দেহ হলে <code>EXPLAIN</code>-এ <code>WindowAgg</code> ও <code>Seq Scan</code> দেখুন।</div>
<p>ওজন দিতে চাইলে (যেমন vector-কে বেশি): <code>0.7 * COALESCE(1.0/(60+vec.rnk),0) + 0.3 * COALESCE(1.0/(60+kw.rnk),0)</code>। একই RRF Python-এ (যাচাই করা, উপরের উদাহরণ চালিয়ে):</p>
<pre>def rrf_fuse(ranked_lists: list[list[str]], k: int = 60) -&gt; list[tuple[str, float]]:
    scores: dict[str, float] = {}
    for lst in ranked_lists:
        for rank, doc in enumerate(lst, start=1):       <span class="c"># rank ১ থেকে শুরু</span>
            scores[doc] = scores.get(doc, 0.0) + 1.0 / (k + rank)
    return sorted(scores.items(), key=lambda x: -x[1])

print(rrf_fuse([["d7","d2","d9","d1"], ["d2","d5","d7","d3"]]))
<span class="c"># [('d2', 0.03252), ('d7', 0.03227), ('d5', 0.01613), ('d9', 0.01587), ('d1', 0.01562), ('d3', 0.01562)]</span></pre>

<h3>১২. EXPLAIN ANALYZE পড়া — Index কাজ করছে কিনা দেখা</h3>
<p>সন্দেহ হলে অনুমান নয়, <b>planner-কে জিজ্ঞেস করুন</b>। নিচের আউটপুট <b>দৃষ্টান্তমূলক</b> (আপনার সংখ্যা ভিন্ন হবে), পড়ার ধরন শেখার জন্য:</p>
<pre>EXPLAIN (ANALYZE, BUFFERS)
SELECT id FROM doc_chunks ORDER BY embedding &lt;=&gt; '[...]' LIMIT 10;

<span class="c">-- ভালো: Index ব্যবহার হচ্ছে</span>
 Limit  (cost=... rows=10) (actual time=3.1..3.4 rows=10 loops=1)
   Buffers: shared hit=412
   -&gt;  Index Scan using idx_chunks_hnsw on doc_chunks  (actual time=3.0..3.3 rows=10 loops=1)
         Order By: (embedding &lt;=&gt; '[...]'::vector)
 Planning Time: 0.2 ms
 Execution Time: 3.5 ms

<span class="c">-- খারাপ: পুরো table scan</span>
 Limit  (actual time=812.4..812.5 rows=10 loops=1)
   -&gt;  Sort  (actual time=812.4..812.4 rows=10)
         Sort Method: top-N heapsort  Memory: 26kB
         -&gt;  Seq Scan on doc_chunks  (actual time=0.03..790 rows=1000000)</pre>
<table>
<tr><th>কী দেখবেন</th><th>অর্থ</th></tr>
<tr><td><code>Index Scan using idx_...hnsw</code> + <code>Order By: (embedding &lt;=&gt; ...)</code></td><td>ANN index ব্যবহার হচ্ছে</td></tr>
<tr><td><code>Seq Scan</code> + <code>Sort</code></td><td>index ব্যবহার হচ্ছে না — ৮.৫-এর তালিকা মেলান</td></tr>
<tr><td><code>Filter: (...)</code> এবং <code>Rows Removed by Filter: N</code> (index scan-এর নিচে)</td><td>post-filtering ঘটছে; N বড় হলে ফল-সংখ্যা কমে যাওয়ার ঝুঁকি (১০ নং অংশ)</td></tr>
<tr><td><code>Buffers: shared hit</code> vs <code>read</code></td><td>hit = RAM থেকে; read = disk থেকে (বেশি read মানে index RAM-এ আঁটছে না)</td></tr>

</table>
<pre><span class="c">-- সংখ্যায় মাপার আরও কিছু কাজের query</span>
SELECT pg_size_pretty(pg_relation_size('doc_chunks'))        AS table_size,
       pg_size_pretty(pg_relation_size('idx_chunks_hnsw'))   AS hnsw_size,
       pg_size_pretty(pg_total_relation_size('doc_chunks'))  AS total_with_indexes;

SELECT calls, round(mean_exec_time::numeric,1) AS avg_ms, left(query, 80) AS q   -- pg_stat_statements চালু থাকলে
FROM pg_stat_statements WHERE query ILIKE '%&lt;=&gt;%' ORDER BY mean_exec_time DESC LIMIT 5;</pre>

<h3>১৩. Operations — VACUUM, bloat, backup, replication, মেমরি</h3>
<h4>১৩.১ Update/Delete ও bloat</h4>
<p>PostgreSQL-এ UPDATE/DELETE পুরোনো row মুছে না, "মৃত tuple" হিসেবে রেখে দেয় (MVCC); <code>VACUUM</code> সেগুলো পরিষ্কার করে। vector row বড় (~৬KB), তাই বারবার আপডেট হলে bloat দ্রুত বাড়ে। HNSW index-এও মৃত tuple-এর নোড থেকে যায়; বড় আকারের delete-এর পর vacuum ধীর ও index "ফাঁপা" হতে পারে।</p>
<table>
<tr><th>পরিস্থিতি</th><th>করণীয়</th></tr>
<tr><td>প্রচুর delete/update (ডকুমেন্ট পুনরায় index)</td><td>autovacuum-কে এই table-এ আরও আক্রমণাত্মক করুন (<code>ALTER TABLE doc_chunks SET (autovacuum_vacuum_scale_factor = 0.02)</code>); বড় batch-এর পরে ম্যানুয়াল <code>VACUUM (ANALYZE)</code></td></tr>
<tr><td>HNSW index-এর মান নেমেছে/আকার অস্বাভাবিক</td><td><code>REINDEX INDEX CONCURRENTLY idx_chunks_hnsw;</code> (অনলাইন rebuild)</td></tr>
<tr><td>বড় ডেটা বদলের পর planner-এর ভুল সিদ্ধান্ত</td><td><code>ANALYZE doc_chunks;</code></td></tr>
<tr><td>"আপডেট না করে নতুন ভার্সন" নকশা</td><td>chunk update-in-place এড়িয়ে নতুন row + পুরোনো soft-delete, পরে ব্যাচে মুছুন — bloat নিয়ন্ত্রণ সহজ</td></tr>
</table>
<h4>১৩.২ Backup, Replication, Upgrade</h4>
<ul>
<li><b>Backup:</b> vector সাধারণ কলামের মতোই <code>pg_dump</code>/<code>pg_basebackup</code>/PITR-এ আসে — আলাদা কিছু নেই। (restore করলে index আবার বানাতে সময় লাগতে পারে — pg_dump text index-কে আবার তৈরি করে।)</li>
<li><b>Replication:</b> index WAL-এ লেখা হয়, তাই streaming replica-তেও আছে। <b>Read replica-য় search চালিয়ে primary-কে লেখার জন্য হালকা রাখা</b> একটা চমৎকার scale-কৌশল।</li>
<li><b>pgvector আপগ্রেড:</b> <code>ALTER EXTENSION vector UPDATE;</code> — কিছু সংস্করণে index ফরম্যাট বদলায়; আগে staging-এ পরীক্ষা, release note পড়ুন।</li>
<li><b>Connection pooling (PgBouncer):</b> <code>SET LOCAL</code> কাজ করতে transaction-এর ভেতরে থাকতে হয়; transaction pooling-এ session-level <code>SET</code> পরের কোনো অজানা client-এর কাছে চলে যেতে পারে। তাই <b>সবসময় <code>BEGIN; SET LOCAL ...; SELECT...; COMMIT;</code></b>।</li>
</ul>
<h4>১৩.৩ মেমরির হিসাব — সবচেয়ে গুরুত্বপূর্ণ ক্যাপাসিটি প্রশ্ন</h4>
<p>দ্রুত ANN-এর জন্য index (ও প্রায়ই হট ডেটা) RAM-এ থাকা দরকার (<code>shared_buffers</code> + OS page cache)। মোটামুটি আন্দাজ: HNSW index আকার ≈ vector আকারের কাছাকাছি বা কিছু বেশি (প্রতিটা node-এ vector-এর কপি + প্রতিবেশী-তালিকা)। অর্থাৎ ১ কোটি × <code>vector(1536)</code> → শুধু index ~৬০GB+। তাই:</p>
<ul>
<li>RAM কম হলে <code>halfvec</code> (অর্ধেক), কম dimension, বা bit-quantization + rescoring (অধ্যায় ৫)।</li>
<li><code>shared_buffers</code> সাধারণত RAM-এর ~২৫%, বাকিটা OS cache-এর জন্য ছাড়ুন — PostgreSQL ডবল-ক্যাশ করে।</li>
<li>Index RAM-এ আঁটছে কিনা বুঝতে <code>EXPLAIN (BUFFERS)</code>-এ <code>read</code> সংখ্যা দেখুন; বেশি হলে latency লাফাবে।</li>
</ul>

<h3>১৪. Python-এ পূর্ণ ingestion + query</h3>
<p>নিচের কোড end-to-end: chunk → embed → upsert → hybrid search। Embedding ফাংশন আলাদা (আপনার provider/local model — অধ্যায় ৩) যাতে বদলানো সহজ থাকে। <b>DB-নির্ভর অংশ এখানে চালানো যায়নি</b> (Postgres নেই); পিওর-Python অংশগুলো (chunk, hash, RRF, recall) চালিয়ে যাচাই করা।</p>
<pre><span class="c"># pip install "psycopg[binary]" pgvector numpy</span>
import hashlib, numpy as np, psycopg
from pgvector.psycopg import register_vector

EMBED_MODEL = "text-embedding-3-small"          <span class="c"># 1536 dim — table-এর vector(1536)-এর সাথে মিলতে হবে</span>

def embed(texts: list[str]) -&gt; list[np.ndarray]:
    """আপনার provider বা local model-কে এখানে বসান; একসাথে অনেকগুলো (batch) পাঠান।
    ফেরত: প্রতিটা text-এর জন্য float32 numpy vector (সম্ভব হলে normalized)।"""
    raise NotImplementedError

def sha(text: str) -&gt; str:
    return hashlib.sha256(text.encode("utf-8")).hexdigest()

def chunk_text(text: str, size: int = 800, overlap: int = 120) -&gt; list[str]:
    chunks, start = [], 0
    while start &lt; len(text):
        end = min(start + size, len(text))
        chunks.append(text[start:end])
        if end == len(text): break
        start = end - overlap
    return chunks

def ingest_document(conn, tenant_id: int, source_uri: str, title: str, dept: str, text: str):
    doc_hash = sha(text)
    with conn.transaction():                                    <span class="c"># ডকুমেন্ট + সব chunk একই transaction-এ — আধা-আপডেট নেই</span>
        row = conn.execute(
            """INSERT INTO documents (tenant_id, source_uri, title, dept, content_hash)
               VALUES (%s,%s,%s,%s,%s)
               ON CONFLICT (tenant_id, source_uri) DO UPDATE
                 SET title=EXCLUDED.title, dept=EXCLUDED.dept, content_hash=EXCLUDED.content_hash, updated_at=now()
               RETURNING id, (xmax = 0) AS inserted""",           <span class="c"># xmax=0 মানে নতুন সারি</span>
            (tenant_id, source_uri, title, dept, doc_hash)).fetchone()
        doc_id = row[0]

        chunks = chunk_text(text)
        existing = dict(conn.execute(
            "SELECT chunk_index, content_hash FROM doc_chunks WHERE document_id=%s", (doc_id,)).fetchall())

        todo = [(i, c) for i, c in enumerate(chunks) if existing.get(i) != sha(c)]   <span class="c"># শুধু বদলানোগুলো</span>
        if todo:
            vectors = embed([c for _, c in todo])                <span class="c"># একসাথে batch embed — প্রতিটার জন্য আলাদা API call নয়</span>
            for (i, c), v in zip(todo, vectors):
                conn.execute(
                    """INSERT INTO doc_chunks (document_id, tenant_id, chunk_index, content, embedding, embed_model, content_hash)
                       VALUES (%s,%s,%s,%s,%s,%s,%s)
                       ON CONFLICT (document_id, chunk_index) DO UPDATE
                         SET content=EXCLUDED.content, embedding=EXCLUDED.embedding,
                             embed_model=EXCLUDED.embed_model, content_hash=EXCLUDED.content_hash""",
                    (doc_id, tenant_id, i, c, v, EMBED_MODEL, sha(c)))
        conn.execute("DELETE FROM doc_chunks WHERE document_id=%s AND chunk_index &gt;= %s",
                     (doc_id, len(chunks)))                       <span class="c"># ডকুমেন্ট ছোট হলে বাড়তি পুরোনো chunk মোছা</span>

HYBRID_SQL = """
WITH vec AS (SELECT id, ROW_NUMBER() OVER (ORDER BY dist) AS rnk
             FROM (SELECT id, embedding &lt;=&gt; %(qv)s AS dist FROM doc_chunks
                   WHERE tenant_id = %(t)s ORDER BY embedding &lt;=&gt; %(qv)s LIMIT 40) s),
     kw  AS (SELECT id, ROW_NUMBER() OVER (ORDER BY score DESC) AS rnk
             FROM (SELECT id, ts_rank_cd(fts, q) AS score
                   FROM doc_chunks, websearch_to_tsquery('simple', %(qt)s) q
                   WHERE tenant_id = %(t)s AND fts @@ q ORDER BY score DESC LIMIT 40) s),
     fused AS (SELECT COALESCE(vec.id, kw.id) AS id,
                      COALESCE(1.0/(60+vec.rnk),0) + COALESCE(1.0/(60+kw.rnk),0) AS rrf
               FROM vec FULL OUTER JOIN kw ON vec.id = kw.id)
SELECT c.id, c.content, f.rrf FROM fused f JOIN doc_chunks c ON c.id = f.id
ORDER BY f.rrf DESC LIMIT %(k)s"""

def hybrid_search(conn, tenant_id: int, question: str, k: int = 8):
    qv = embed([question])[0]
    with conn.transaction():
        conn.execute("SET LOCAL hnsw.ef_search = 100")
        return conn.execute(HYBRID_SQL, {"qv": qv, "qt": question, "t": tenant_id, "k": k}).fetchall()

if __name__ == "__main__":
    with psycopg.connect("postgresql://app:app_pass@localhost/appdb") as conn:
        register_vector(conn)
        ingest_document(conn, 7, "policy/refund.md", "Refund Policy", "finance", open("refund.md", encoding="utf-8").read())
        for cid, content, score in hybrid_search(conn, 7, "পেমেন্ট ফেরত নিতে চাই"):
            print(round(score, 4), content[:80])</pre>
<div class="callout best"><span class="tag">কোডের নকশার কারণ (ডিজাইন সিদ্ধান্ত)</span>
(১) <b>এক transaction:</b> ডকুমেন্টের মাঝপথে ব্যর্থ হলে সব rollback — অর্ধেক chunk পুরোনো আর অর্ধেক নতুন থাকে না। (২) <b>chunk-hash:</b> কেবল বদলানো chunk আবার embed — খরচ ও সময় বাঁচে। (৩) <b>বাড়তি chunk মোছা:</b> লেখা ছোট হলে ভূতুড়ে পুরোনো chunk থাকে না। (৪) <b>batch embed:</b> একসাথে অনেক text পাঠানো API-র জন্য দ্রুত ও সস্তা। (৫) <b><code>SET LOCAL</code> transaction-এর ভেতরে:</b> pooling-নিরাপদ।</div>

<h4>১৫.৩ Repository, Service ও Minimal API (DI সহ)</h4>
<pre>public record Hit(string DocId, string Content, double Distance);

public interface IChunkRepository
{
    Task&lt;IReadOnlyList&lt;Hit&gt;&gt; SearchAsync(float[] query, string dept, int k, CancellationToken ct);
}

public class EfChunkRepository(AppDbContext db) : IChunkRepository
{
    public async Task&lt;IReadOnlyList&lt;Hit&gt;&gt; SearchAsync(float[] query, string dept, int k, CancellationToken ct)
    {
        var qv = new Vector(query);
        return await db.Chunks
            .Where(c =&gt; c.Dept == dept)                                      <span class="c">// metadata filter (১০ নং অংশের সতর্কতা মনে রাখুন)</span>
            .OrderBy(c =&gt; c.Embedding.CosineDistance(qv))                    <span class="c">// সরাসরি operator → index ব্যবহারযোগ্য</span>
            .Take(k)
            .Select(c =&gt; new Hit(c.DocId, c.Content, c.Embedding.CosineDistance(qv)))
            .ToListAsync(ct);
    }
}

public class SearchService(IChunkRepository repo, IEmbeddingGenerator&lt;string, Embedding&lt;float&gt;&gt; embedder)
{
    public async Task&lt;IReadOnlyList&lt;Hit&gt;&gt; AskAsync(string question, string dept, CancellationToken ct)
    {
        var vec = await embedder.GenerateVectorAsync(question, cancellationToken: ct);   <span class="c">// ReadOnlyMemory&lt;float&gt;</span>
        var hits = await repo.SearchAsync(vec.ToArray(), dept, 8, ct);                   <span class="c">// বেশি এনে</span>
        return hits.Where(h =&gt; h.Distance &lt; 0.35).Take(5).ToList();                     <span class="c">// threshold — অপ্রাসঙ্গিক বাদ</span>
    }
}

<div class="callout best"><span class="tag">কোনটা কখন — EF Core বনাম Dapper/Npgsql</span>
<b>EF Core:</b> CRUD ও সাধারণ vector search (<code>CosineDistance</code>) সুন্দরভাবে, migration-এ index সহ। <b>Dapper/Npgsql:</b> hybrid RRF query, <code>SET LOCAL</code>, COPY-র মতো ভারী/বিশেষ SQL যেখানে ORM বাধা — ১১.৪-এর পূর্ণ SQL সরাসরি পাঠান। একই প্রজেক্টে দুটোই মিশিয়ে ব্যবহার সম্পূর্ণ স্বাভাবিক: EF Core-এর <code>FromSqlInterpolated</code>-ও হাইব্রিড query-র সেতু।</div>
<div class="callout mistake"><span class="tag">Common mistake — EF Core-এ <code>SET LOCAL</code> ভুলে যাওয়া / ত্রুটিপূর্ণ ব্যবহার</span>
<code>SET LOCAL hnsw.ef_search</code> কাজ করে কেবল একটা transaction-এর ভেতরে। EF Core-এ <code>await using var tx = await db.Database.BeginTransactionAsync(); await db.Database.ExecuteSqlRawAsync("SET LOCAL hnsw.ef_search = 100"); ... await tx.CommitAsync();</code> — transaction ছাড়া <code>SET LOCAL</code> কোনো প্রভাব ফেলে না, আর session-level <code>SET</code> connection pool-এ মিশে অন্য request-কে প্রভাবিত করে।</div>

<h3>১৬. Row-Level Security (RLS) — AI-র জন্য ডেটা-ফাঁস রোধের শক্ত দেয়াল</h3>
<p>RAG-এর সবচেয়ে বড় নিরাপত্তা ঝুঁকি: ব্যবহারকারী A-র প্রশ্নে ব্যবহারকারী B-র গোপন chunk উঠে আসা। অ্যাপ-কোডে <code>WHERE tenant_id = ...</code> মনে রাখাই যথেষ্ট নয় — একটা ভুলে (কোনো endpoint-এ filter ভুলে গেলে) ডেটা ফাঁস। <b>RLS</b> database-কেই বাধ্য করে।</p>
<pre>ALTER TABLE doc_chunks ENABLE ROW LEVEL SECURITY;
ALTER TABLE doc_chunks FORCE ROW LEVEL SECURITY;            -- table-মালিকের জন্যও প্রযোজ্য

CREATE POLICY tenant_isolation ON doc_chunks
    USING (tenant_id = current_setting('app.tenant_id')::int);

-- অ্যাপ প্রতিটা request/transaction-এ:
BEGIN;
SET LOCAL app.tenant_id = '7';
SELECT id, content FROM doc_chunks ORDER BY embedding &lt;=&gt; $1 LIMIT 10;   -- শুধু tenant 7-এর row দেখা যাবে
COMMIT;</pre>
<div class="callout why"><span class="tag">কেন এটা কেবল pgvector-এই সহজ</span>
আলাদা Vector DB-তে এই ধরনের database-স্তরের নিয়ম সাধারণত নেই (বা আলাদাভাবে সামলাতে হয়)। pgvector-এ vector, মেটাডেটা ও নিরাপত্তা-নিয়ম একই engine-এ — তাই AI-র "ফাঁস" ঝুঁকি কমে। সতর্কতা: RLS-এর সাথে ANN index-এর filter-সমস্যা (১০ নং অংশ) একই — post-filtering-এ ফল কমতে পারে। অনেক tenant হলে partitioning + RLS-এর সমন্বয় ভাবুন, আর অবশ্যই ছোট tenant-এ পরীক্ষা করুন। ভূমিকাগুলোর (database role) superuser-এর RLS এড়ানোর ক্ষমতা মনে রাখুন — অ্যাপ কখনো superuser দিয়ে সংযোগ করবে না।</div>

<h3>১৮. Failure Mode ও সমস্যা-সমাধানের তালিকা</h3>

<tr><th>লক্ষণ</th><th>সম্ভাব্য কারণ</th><th>পরীক্ষা/সমাধান</th></tr>
<tr><td>Query ধীর (সেকেন্ড), CPU বেশি</td><td>index ব্যবহার হচ্ছে না</td><td><code>EXPLAIN</code>; operator class/ORDER BY/cast মেলান (৮.৫)</td></tr>

<h3>১৯. Common ভুল — সংক্ষেপে</h3>
<div class="callout mistake"><span class="tag">ভুল ১ — Index ও query-র operator না মেলানো</span>
সবচেয়ে প্রচলিত কারণ "index কাজ করে না"। ৮.৫-এর তালিকা মুখস্থ রাখুন।</div>
<div class="callout mistake"><span class="tag">ভুল ২ — ছোট tenant দিয়ে পরীক্ষা না করা</span>
বড় tenant-এ সব ঠিক, ছোটটায় ফল শূন্য — ১০ নং অংশের গণিত।</div>
<div class="callout mistake"><span class="tag">ভুল ৩ — recall না মেপে ef_search/probes অনুমান</span>
exact বনাম ANN তুলনা না করলে আপনি জানেনই না আপনার ৩০% ফল হারাচ্ছে।</div>
<div class="callout mistake"><span class="tag">ভুল ৪ — embedding model/ভার্সন না রেখে model বদলানো</span>
<code>embed_model</code> কলাম নেই, তাই মিশ্র vector, নীরব মান-পতন।</div>
<div class="callout mistake"><span class="tag">ভুল ৫ — Pooling-এ session-level SET ব্যবহার</span>
<code>SET hnsw.ef_search</code> (LOCAL ছাড়া) PgBouncer-এ অন্য ক্লায়েন্টের query-তে ঢুকে যায়। সবসময় <code>SET LOCAL</code> + transaction।</div>
<div class="callout mistake"><span class="tag">ভুল ৬ — শুধু vector, hybrid ছাড়া</span>
Invoice নম্বর/কোড/নামে vector দুর্বল; GIN + RRF যোগ করুন (১১ নং অংশ)।</div>
<div class="callout mistake"><span class="tag">ভুল ৭ — Similarity দিয়ে ORDER BY</span>
Index অকেজো হয় — distance operator সরাসরি ব্যবহার (৪.৪)।</div>
<div class="callout mistake"><span class="tag">ভুল ৮ — vector কলাম SELECT * এ টানা</span>
৬KB × অনেক সারি নেটওয়ার্কে — শুধু দরকারি কলাম SELECT করুন; embedding ফেরত প্রায় কখনোই দরকার নেই।</div>

<h3>২০. সংক্ষিপ্ত Cheat Sheet</h3>
<pre>-- সেটআপ
CREATE EXTENSION vector;

-- টেবিল
embedding vector(1536)           -- বা halfvec(3072) বড় dimension-এ
embed_model TEXT                 -- model ট্র্যাক করুন

-- খোঁজা (cosine)
SELECT ... ORDER BY embedding &lt;=&gt; $1 LIMIT k;

-- Index
CREATE INDEX ON t USING hnsw (embedding vector_cosine_ops) WITH (m=16, ef_construction=64);
SET LOCAL hnsw.ef_search = 100;                  -- query-time recall নব
CREATE INDEX ON t USING ivfflat (embedding vector_cosine_ops) WITH (lists=1000);
SET LOCAL ivfflat.probes = 32;

-- Filter-এ সমস্যা হলে
SET LOCAL hnsw.iterative_scan = relaxed_order;   -- (০.৮+)

-- দেখা
EXPLAIN (ANALYZE, BUFFERS) ...;  SELECT pg_size_pretty(pg_relation_size('idx'));</pre>
<div class="callout best"><span class="tag">সংক্ষেপে মনে রাখুন</span>
(১) pgvector = আপনার PostgreSQL-এই vector: <b>এক transaction, এক backup, SQL join ও RLS</b> — তাই RAG-এর জন্য সবচেয়ে কম-ঝুঁকির শুরু। (২) <b>Index-এর operator class = query-র operator</b>, আর সবসময় সরাসরি <code>ORDER BY embedding &lt;=&gt; $1 LIMIT k</code>। (৩) <b>প্রথমে exact scan</b> — এটাই ground truth; ছোট ডেটায় index লাগেই না। (৪) HNSW ডিফল্ট; <code>ef_search</code>-ই recall/গতির নব; IVFFlat-এ ডেটা আগে, <code>probes</code> বাড়ান। (৫) <b>Filter + ANN = নীরব ফল-হ্রাস</b>: selectivity গণনা, iterative scan/partition, ছোট tenant দিয়ে পরীক্ষা। (৬) <b>Hybrid = vector + GIN + RRF</b>, বাংলায় <code>'simple'</code> কনফিগ। (৭) মেমরি = vector আকার × সারি; index RAM-এ না আঁটলে latency লাফায় — <code>halfvec</code>/কম dimension। (৮) <code>embed_model</code>, <code>content_hash</code>, <code>SET LOCAL</code>, VACUUM/REINDEX — production-এর অদৃশ্য নায়ক। (৯) নিরাপত্তা শেষ দেয়াল: <b>RLS</b>।</div>

<h2 class="title">১০. হাতে-কলমে: Qdrant</h2>
<p class="lead"><span class="kw">Qdrant</span> (উচ্চারণ: "কোয়াড্র্যান্ট") একটা open-source, <b>শুধু vector-এর জন্য বানানো</b> (purpose-built) Vector Database, Rust ভাষায় লেখা। pgvector যেখানে "আপনার PostgreSQL-এর ভেতরে একটা ক্ষমতা", Qdrant সেখানে "vector খোঁজার কাজে বিশেষজ্ঞ একটা আলাদা সার্ভার"। এই অধ্যায়ে আমরা Qdrant-কে ভেতর থেকে বুঝব — কীভাবে ডেটা সাজায়, কেন filter-সহ খোঁজায় এটা শক্তিশালী, quantization দিয়ে কীভাবে মেমরি ৩২ গুণ কমে, cluster কীভাবে চলে — আর Python ও .NET-এ হাতে-কলমে ব্যবহার করব।</p>

অধ্যায় ৯-এ আমরা দেখেছি pgvector-এ filtered search একটা "নীরব ফাঁদ" (post-filtering-এ ফল হারায়)। Qdrant-এর নকশার একটা কেন্দ্রীয় লক্ষ্যই ছিল এই সমস্যার সমাধান — <b>filter-কে খোঁজার প্রক্রিয়ার ভেতরেই ঢুকিয়ে দেওয়া</b>। তাই Qdrant শেখা মানে শুধু আরেকটা টুল শেখা নয়, "একটা বিশেষায়িত Vector DB কীভাবে ভিন্নভাবে ভাবে" তা বোঝা — যা অধ্যায় ১১-র তুলনা ও বাছাইয়ের সিদ্ধান্তের জন্য অপরিহার্য।</div>

<div class="callout best"><span class="tag">কোন কোড কতটা যাচাই করা হয়েছে (সততার জন্য)</span>
Python <code>qdrant-client</code> (১.১৯.১) অংশের <b>সব কোড বাস্তবে চালিয়ে</b> যাচাই করা, <code>QdrantClient(":memory:")</code> (লোকাল মোড) দিয়ে — আউটপুটের সংখ্যাগুলো সেই রান থেকে নেওয়া, আর <code>exact=True</code> search-এর ফল <b>numpy-র হিসাবের সাথে হুবহু মিলিয়ে</b> দেখা। <b>সতর্কতা:</b> লোকাল মোড একটা শেখার/টেস্টের সুবিধা — এটা সবসময় brute-force (সঠিক) খোঁজে, <b>আসল HNSW index, quantization, cluster, snapshot — এসব চালায় না</b>। তাই সেই অংশগুলোর ব্যাখ্যা Qdrant-এর ডকুমেন্টেড আচরণ থেকে, আর সেগুলো যেখানে এই মেশিনে চালানো যায়নি সেখানে স্পষ্ট বলা আছে। REST/curl উদাহরণ Qdrant-এর প্রচলিত API থেকে লেখা (সার্ভার চালানো যায়নি)। .NET কোড (<code>Qdrant.Client</code> ১.১৯.০) <b>কমপাইল করে দেখা</b>, চালানো হয়নি। Qdrant দ্রুত বদলায় — <b>২০২৬-এ আপনার সংস্করণের ডকুমেন্ট যাচাই করুন</b>।</div>

<h4>১.২ ভেতরের গঠন — Segment, WAL ও Optimizer</h4>
<p>Qdrant-এর একটা collection ভেতরে এক বা একাধিক <b>shard</b>-এ বিভক্ত, আর প্রতিটা shard অনেকগুলো <b>segment</b>-এ। Segment হলো ডেটা-সংরক্ষণের মূল একক — প্রতিটা segment-এর নিজস্ব vector storage, payload storage ও (যথেষ্ট বড় হলে) HNSW index থাকে।</p>
<div class="diagram"><pre>
 Collection "policies"
   ├─ Shard 0 ─┬─ Segment A (appendable — নতুন লেখা এখানে ঢোকে; index ছাড়া, brute-force)
   │            ├─ Segment B (immutable — optimizer বানিয়েছে; HNSW index + quantization সহ)
   │            └─ Segment C (immutable, বড়)
   └─ Shard 1 ─ ...

   লেখার পথ:  client → WAL (write-ahead log, টেকসই) → appendable segment
   ব্যাকগ্রাউন্ড: Optimizer — appendable segment বড় হলে সেটাকে "সিল" করে HNSW বানায়, ছোট segment মেলায় (merge), vacuum করে
   খোঁজার পথ: সব segment-এ সমান্তরালে খোঁজা → ফল একত্র → সেরা k
</pre></div>
<div class="callout why"><span class="tag">তাৎপর্য — এই নকশা থেকে কী কী আচরণ বোঝা যায়</span>
(১) <b>নতুন লেখা সাথে সাথেই খোঁজা যায়</b> (appendable segment brute-force-এ খোঁজে) — তাই real-time ingestion সম্ভব; আর বড় হলে ব্যাকগ্রাউন্ডে index হয়। (২) <b>index বানানো ব্যাকগ্রাউন্ডে</b> — বড় লোডের পরে একটু সময়ের জন্য collection "yellow" (optimizing) অবস্থায় থাকে, খোঁজা চলে কিন্তু ধীর হতে পারে। (৩) <b>WAL আছে বলে</b> ক্র্যাশের পরেও acknowledged লেখা হারায় না। (৪) segment সংখ্যা বেশি হলে খোঁজা ধীর (প্রতি segment-এ খুঁজতে হয়) — optimizer সেটা নিয়ন্ত্রণে রাখে।</div>
<h4>১.৩ কেন Rust — প্রাসঙ্গিক সুবিধা</h4>
<p>Rust-এ garbage collector নেই, ফলে GC-এর "stop-the-world" বিরতির কারণে হঠাৎ latency-র লাফ হয় না; মেমরি ব্যবহার কম ও অনুমানযোগ্য। Vector search-এর মতো CPU/মেমরি-ভারী কাজে এটা বাস্তব সুবিধা — কিন্তু এটা আপনার কোড লেখার ভাষা বদলায় না (আপনি REST/gRPC/client library-র মাধ্যমেই ব্যবহার করেন)।</p>

</table>
<div class="callout behind"><span class="tag">পর্দার পেছনে — Cosine metric-এ Qdrant vector normalize করে সংরক্ষণ করে</span>
<code>Distance.COSINE</code> দিলে Qdrant প্রতিটা vector ঢোকানোর সময় নিজেই normalize (দৈর্ঘ্য ১) করে সংরক্ষণ করে, তারপর cosine-কে আসলে dot product হিসেবে গণনা করে (দ্রুত)। দুটো ফল: (ক) আপনি যে vector পাঠিয়েছিলেন, ফেরত নিলে তা normalized আকারে পাবেন (ক্ষেত্রবিশেষে) — মূল magnitude হারায়; (খ) <b>score = similarity, বড় = ভালো</b> (pgvector-এর <code>&lt;=&gt;</code> distance-এর উল্টো, যেখানে ছোট = ভালো)। যাচাই করা: একই vector দিয়ে খুঁজলে score = <b>1.0</b> আসে।</div>

<h3>৪. লোকাল মোড — শেখার জন্য সার্ভার ছাড়াই</h3>
<p><code>qdrant-client</code> Python প্যাকেজ নিজেই একটা সীমিত "লোকাল Qdrant" চালাতে পারে — কোনো সার্ভার বা Docker ছাড়া। শেখা, unit test ও ছোট prototype-এর জন্য চমৎকার।</p>
<pre><span class="c"># pip install qdrant-client</span>
from qdrant_client import QdrantClient

client = QdrantClient(":memory:")                  <span class="c"># শুধু মেমরিতে (প্রোগ্রাম শেষ = ডেটা শেষ)</span>
client = QdrantClient(path="./qdrant_local")       <span class="c"># ডিস্কে সংরক্ষণ (একই ডিরেক্টরিতে একসাথে একটা প্রসেস)</span>
client = QdrantClient(url="http://localhost:6333", api_key="change-me-long-random-key")   <span class="c"># আসল সার্ভার</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — লোকাল মোডের ফলকে production আচরণ ভাবা</span>
লোকাল মোড <b>সবসময় brute-force (নির্ভুল)</b> খোঁজে — HNSW index, quantization, payload index-এর গতি-প্রভাব, shard/replica, snapshot, optimizer — কিছুই বাস্তবে চালায় না (API নিয়ে নেয়, কিন্তু কার্যকর নয়)। তাই এখানে "recall ১০০%" দেখে ভাবা যাবে না যে production-এও তা-ই; আর গতি মাপা অর্থহীন। এখানে আপনি <b>API ও ফলের সঠিকতা</b> শিখছেন, scale আচরণ নয়। production-মুখী পরীক্ষা সবসময় আসল সার্ভারে (Docker) করুন।</div>

<h3>৫. হাতে-কলমে (Python): ধাপে ধাপে — সব কোড চালিয়ে যাচাই করা</h3>
<p>একটা ছোট dataset: ৫টা point, ৪-মাত্রার vector (সরলতার জন্য), payload-এ বিভাগ/বছর/ভাষা। এটাই আমরা পুরো অংশে ব্যবহার করব।</p>

<tr><th>id</th><th>লেখা</th><th>vector</th><th>dept</th><th>year</th><th>lang</th></tr>
<tr><td>1</td><td>Refund policy: ৭ দিনের মধ্যে টাকা ফেরত</td><td>[0.90, 0.10, 0.00, 0.05]</td><td>finance</td><td>2025</td><td>bn</td></tr>
<tr><td>2</td><td>Voucher posting নিয়ম</td><td>[0.10, 0.90, 0.10, 0.00]</td><td>accounting</td><td>2024</td><td>bn</td></tr>
<tr><td>3</td><td>Return ও money back নীতি</td><td>[0.85, 0.15, 0.05, 0.10]</td><td>finance</td><td>2026</td><td>en</td></tr>
<tr><td>4</td><td>Hotel booking cancellation</td><td>[0.05, 0.20, 0.90, 0.10]</td><td>travel</td><td>2026</td><td>en</td></tr>
