<tr><td>নতুন domain-এ ভালো সাধারণীকরণ (প্রায়ই)</td><td>ব্যাখ্যা ও ডিবাগ কঠিন; টিউনিং বেশি</td></tr>
</table>
<div class="callout best"><span class="tag">ব্যবহারিক কৌশল — শুধু rerank ধাপে</span>
পুরো corpus-এ multi-vector রাখা ব্যয়বহুল। জনপ্রিয় পদ্ধতি: প্রথমে সস্তা এক-vector ANN দিয়ে ১০০টা প্রার্থী আনুন, তারপর শুধু সেই ১০০টাকে MaxSim দিয়ে পুনর্বিন্যাস করুন (অধ্যায় ৭-র rerank-এর মতো)। এতে বেশিরভাগ লাভ পাওয়া যায়, খরচ ছোট। (কিছু ইঞ্জিন — যেমন Qdrant-এর multivector সমর্থন, Vespa — এটা সরাসরি দেয়; version অনুযায়ী যাচাই করুন।) আরেকটা প্রয়োগ: ছবি-ভিত্তিক ডকুমেন্ট (PDF-এর পৃষ্ঠা-ছবি) খোঁজার জন্য ColPali-ধরনের পদ্ধতি — পৃষ্ঠার ছবি প্যাচে ভেঙে প্রতি প্যাচের vector।</div>
<p><b>LLM/RAG-এর সাথে সম্পর্ক:</b> RAG-এর বেশিরভাগ ব্যর্থতা retrieval-এ। late interaction retrieval-এর মান বাড়ায়, বিশেষত জটিল প্রশ্নে যেখানে একাধিক শর্ত একসাথে মিলতে হয় ("অক্টোবরে Dhaka-য় চুক্তিবদ্ধ, কিন্তু বাতিল হওয়া hotel")।</p>

<h3>৩. Learned Sparse (SPLADE-ধারণা) — "শব্দ-ভিত্তিক" কিন্তু "বুদ্ধিমান"</h3>
<h4>৩.১ Dense বনাম Sparse — আবার ঝালিয়ে নিই</h4>
<table>
<tr><th></th><th>Dense vector</th><th>Sparse vector</th></tr>
<tr><td>আকার</td><td>~৭৬৮–৩০৭২ সংখ্যা, প্রায় সবই অশূন্য</td><td>হাজার হাজার (শব্দভান্ডার-সমান) dimension, কিন্তু প্রায় সবই <b>শূন্য</b></td></tr>
<tr><td>প্রতিটা dimension</td><td>অস্পষ্ট "অর্থ-অক্ষ"</td><td>একটা নির্দিষ্ট শব্দ/টোকেন</td></tr>
<tr><td>শক্তি</td><td>অর্থ, প্রতিশব্দ, ভাষান্তর</td><td>হুবহু শব্দ, কোড, নাম, ID</td></tr>
<tr><td>দুর্বলতা</td><td>হুবহু শব্দ মিস</td><td>প্রতিশব্দ মিস ("refund" ≠ "money back")</td></tr>
<tr><td>উদাহরণ</td><td>embedding model</td><td>BM25, TF-IDF</td></tr>
</table>
<h4>৩.২ Learned Sparse কী করে</h4>
<p><span class="kw">SPLADE</span>-ধরনের মডেল একটা neural network দিয়ে লেখা থেকে sparse vector বানায়, কিন্তু সেই vector-এ <b>লেখায় না-থাকা প্রাসঙ্গিক শব্দও যোগ</b> হয় (<i>term expansion</i>) এবং শব্দের ওজন শেখা হয়। "টাকা ফেরত নীতি" লেখায় নেই এমন "refund", "return" শব্দের ওজনও অশূন্য হতে পারে — ফলে BM25-র হুবহু-মিলের সীমা ভাঙে, অথচ inverted index-এর দ্রুততা ও ব্যাখ্যাযোগ্যতা (কোন শব্দ মিলল বলা যায়) থাকে।</p>
<pre><span class="c"># Sparse vector-এর অন্তর্গত গুণফল (শুধু সাধারণ শব্দে অবদান) — সরল চিত্র</span>
a = {"refund": 1.2, "money": 0.8, "return": 0.6}      <span class="c"># প্রশ্ন (expansion সহ)</span>
b = {"refund": 1.0, "policy": 0.5, "return": 0.7}      <span class="c"># ডকুমেন্ট</span>
score = sum(a[k] * b.get(k, 0) for k in a)             <span class="c"># 1.2×1.0 + 0.6×0.7 = 1.62</span>
print(score)                                           <span class="c"># → 1.62 (আমরা চালিয়ে মিলিয়েছি)</span></pre>
<h4>৩.৩ কোথায় ব্যবহার, কোথায় নয়</h4>
<ul>
<li>Qdrant (sparse vectors), Elasticsearch/OpenSearch (<code>sparse_vector</code>), pgvector (<code>sparsevec</code> type) — dense-এর সাথে <b>hybrid</b> হিসেবে (অধ্যায় ৭-র RRF)।</li>
<li>অসুবিধা: model চালানোর খরচ (BM25-র চেয়ে ভারী), index বড়, ভাষা-সমর্থন সীমিত (বাংলা-র জন্য ভালো learned-sparse model কম) — আগে সাধারণ BM25 + dense hybrid-ই মেপে দেখুন, তারপর learned sparse।</li>
</ul>

<h3>৪. Binary Quantization ও Matryoshka — ছোট vector, বড় সঞ্চয়</h3>
<h4>৪.১ Binary Quantization — প্রতিটা সংখ্যাকে ১ বিটে</h4>
<p><b>ধারণা:</b> প্রতিটা float সংখ্যা শুধু "ধনাত্মক না ঋণাত্মক" (১ বিট) হিসেবে রাখা। ৩৮৪ dimension-এর vector ১৫৩৬ বাইট থেকে ৪৮ বাইটে নামে — <b>৩২ গুণ ছোট</b>। দূরত্ব মাপা হয় <i>Hamming distance</i> (কয়টা বিট আলাদা) দিয়ে — যা CPU-তে অত্যন্ত দ্রুত (XOR + popcount)।</p>
<p><b>কিন্তু নির্ভুলতা কমে।</b> এজন্য মূল কৌশল: <b>binary দিয়ে অনেক প্রার্থী আনুন → মূল float vector দিয়ে rescore করুন</b> (দুই-ধাপের funnel)। নিচের পরীক্ষা আমরা চালিয়েছি (কৃত্রিম, ২০,০০০ vector × ৩৮৪ dim, ক্লাস্টার-সদৃশ ডেটা, ৫০টা প্রশ্ন):</p>
<pre>import numpy as np
rng = np.random.default_rng(1)

<span class="c"># কৃত্রিম ডেটা: ২০০টা "বিষয়" ঘিরে ২০,০০০ vector</span>
C = 200
centers = rng.normal(size=(C, 384))
X = centers[rng.integers(0, C, 20000)] + 0.6 * rng.normal(size=(20000, 384))
X /= np.linalg.norm(X, axis=1, keepdims=True)
Q = X[rng.choice(20000, 50, replace=False)] + 0.1 * rng.normal(size=(50, 384))
Q /= np.linalg.norm(Q, axis=1, keepdims=True)

true = np.argsort(-(Q @ X.T), axis=1)[:, :10]                <span class="c"># আসল (float) সেরা ১০</span>
P  = np.packbits(X &gt; 0, axis=1)                              <span class="c"># বিট-প্যাক: ৩৮৪ বিট = ৪৮ বাইট</span>
PQ = np.packbits(Q &gt; 0, axis=1)

for cand in (10, 20, 50, 100, 200, 500):                     <span class="c"># binary থেকে কয়টা প্রার্থী নেব</span>
    r = []
    for i in range(50):
        ham = np.unpackbits(np.bitwise_xor(P, PQ[i]), axis=1).sum(1)   <span class="c"># Hamming দূরত্ব</span>
        c = np.argsort(ham)[:cand]                                      <span class="c"># binary-র সেরা cand টা</span>
        top = c[np.argsort(-(X[c] @ Q[i]))[:10]]                        <span class="c"># float vector দিয়ে rescore → সেরা ১০</span>
        r.append(len(set(top) &amp; set(true[i])) / 10)
    print("binary candidates", cand, "recall@10 after rescore", round(np.mean(r), 3))</pre>

<p><b>পড়ার ধরন:</b> binary-তে স্টোরেজ ৩২× কম, আর প্রার্থী-সংখ্যা ~১০× (১০০টা) নিলেই rescore-এর পর recall ~০.৯৮। অর্থাৎ <b>"সস্তা মোটা ছাঁকনি + দামি সূক্ষ্ম ছাঁকনি"</b> — গোপন সূত্র এটাই। (এই সংখ্যা এই কৃত্রিম ডেটার; আপনার আসল embedding-এ ভিন্ন হবে — নিজের golden set-এ মাপুন। কিছু embedding model binary-র জন্য বিশেষভাবে ভালো আচরণ করে, কিছু করে না।)</p>
<h4>৪.২ Matryoshka Embedding — "রুশ পুতুলের" মতো, ছোট করে কাটা যায়</h4>
<p>সাধারণ embedding-এ প্রথম ২৫৬টা সংখ্যা কেটে নিলে অর্থ নষ্ট হয়ে যায়। <span class="kw">Matryoshka Representation Learning (MRL)</span>-এ train করা model-এ <b>গুরুত্বপূর্ণ তথ্য শুরুর সংখ্যাগুলোতে জমা থাকে</b> — তাই ১৫৩৬ থেকে ২৫৬-তে ছেঁটে (এবং আবার normalize করে) ব্যবহার করা যায়, সামান্য মান হারিয়ে। (কিছু API — যেমন OpenAI-র <code>text-embedding-3</code> সিরিজ — <code>dimensions</code> প্যারামিটার দিয়ে এটা সরাসরি সমর্থন করে; model/ভার্সন যাচাই করুন।)</p>
<pre>def truncate_and_normalize(v, dims=256):
    t = v[:dims]
    return t / np.linalg.norm(t)          <span class="c"># আবার normalize — না করলে cosine/dot ভুল হবে</span></pre>

Binary-only বা অতি-ছোট dimension সরাসরি চূড়ান্ত ফল হিসেবে ব্যবহার করলে recall নেমে যায় (উপরের ছকে ০.৩২)। সবসময় rescoring স্তর রাখুন এবং আপনার ডেটায় recall মেপে নিন।</div>

<h3>৫. GraphRAG ও Vector RAG — সম্পর্ক ও পার্থক্য</h3>
<h4>৫.১ Vector RAG কোথায় হোঁচট খায়</h4>
<p>Vector RAG "প্রশ্নের সাথে অর্থে মেলে এমন কিছু chunk" খোঁজে। কিন্তু কিছু প্রশ্নের উত্তর <b>একটা chunk-এ নেই</b>:</p>

<tr><th>প্রশ্নের ধরন</th><th>উদাহরণ</th><th>Vector RAG কেন দুর্বল</th></tr>
<tr><td>Multi-hop (শৃঙ্খল)</td><td>"যে supplier-এর কাছ থেকে Triplover-এর বিতর্কিত invoice এসেছে, তার সাথে আর কোন কোন customer-এর লেনদেন?"</td><td>উত্তর কয়েকটা ডকুমেন্টের সম্পর্ক জুড়ে; কোনো এক chunk-এ নেই</td></tr>
<tr><td>Global/সারসংক্ষেপ</td><td>"সব ticket মিলিয়ে প্রধান ৫টা সমস্যা কী?"</td><td>top-k মাত্র কয়েকটা chunk আনে; পুরো corpus-এর চিত্র নয়</td></tr>
<tr><td>সম্পর্ক/সত্তা-কেন্দ্রিক</td><td>"কে কাকে report করে?", "কোন চুক্তি কোন বিভাগে প্রভাব ফেলে?"</td><td>সম্পর্ক লেখায় ছড়িয়ে; embedding সেগুলো স্পষ্ট ধরে না</td></tr>
</table>
<h4>৫.২ GraphRAG কীভাবে কাজ করে (সারমর্ম)</h4>
<div class="diagram"><pre>
 ইনডেক্সিং (ভারী):
  ডকুমেন্ট ─→ LLM দিয়ে সত্তা (entity) ও সম্পর্ক (relation) বের করা
          ─→ Knowledge Graph (নোড = সত্তা, এজ = সম্পর্ক)
          ─→ Community detection (ঘনিষ্ঠ নোডের গুচ্ছ)
          ─→ প্রতিটা community-র LLM-তৈরি সারাংশ

 প্রশ্ন:
  • নির্দিষ্ট (local) → সম্পর্কিত সত্তার চারপাশের নোড/এজ/chunk ঘুরে আনা
  • সার্বিক (global) → community সারাংশগুলো থেকে উত্তর বানানো
</pre></div>
<h4>৫.৩ Vector DB-র সাথে সম্পর্ক — প্রতিযোগী নয়, পরিপূরক</h4>
<ul>
<li>GraphRAG-তেও Vector DB লাগে: সত্তার নাম/বর্ণনা, community সারাংশ, chunk — সবকিছুর embedding রেখে <b>প্রবেশ-বিন্দু খুঁজতে</b> (প্রশ্নের কাছের সত্তা কোনগুলো?), তারপর graph ধরে ঘুরে সম্পর্কিত তথ্য সংগ্রহ।</li>
<li>অর্থাৎ <b>vector search = "কোথা থেকে শুরু"</b>, <b>graph = "সেখান থেকে কোথায় যাব"</b>।</li>
</ul>

প্রায় সব প্রজেক্টে Vector RAG দিয়ে শুরু করুন (hybrid + rerank সহ)। যদি মেপে দেখেন যে প্রশ্নগুলোর একটা বড় অংশ multi-hop/সার্বিক এবং সেগুলোতে ফল খারাপ — তখন GraphRAG বা হালকা বিকল্প (সম্পর্কিত ডকুমেন্টের মধ্যে <code>links</code> metadata রেখে "প্রতিবেশী chunk-ও আনো", parent-child retrieval, বা LLM-চালিত বহু-ধাপ খোঁজা — ৬ নং অংশ) ভাবুন। GraphRAG-র index-খরচ ও রক্ষণাবেক্ষণ বড় প্রতিশ্রুতি।</div>

<h3>৬. Agentic RAG ও Tool Routing — অনেক tool/উৎস থেকে সঠিকটা বাছা</h3>
<h4>৬.১ সমস্যা</h4>
<p>একটা agent-এর ৫০০টা tool (MCP server-গুলোর সব tool) থাকতে পারে। সবগুলোর বিবরণ prompt-এ দিলে context ফুলে যায়, খরচ বাড়ে, আর মডেল ভুল tool বাছে (AI কোর্সের MCP/Agents অধ্যায়ে এই সীমা এসেছে)। সমাধান: <b>tool-এর বিবরণকেও embed করা এবং প্রশ্নের সাথে মেলে এমন ৫–১০টা tool বের করে শুধু সেগুলো দেওয়া।</b> অর্থাৎ Vector DB শুধু ডকুমেন্টের জন্য নয়, <b>"ক্ষমতা"-র সূচিপত্র</b>।</p>
<h4>৬.২ ছোট demo — চালিয়ে দেখা (সরল bag-of-words embedder দিয়ে)</h4>
<p>আসল embedding model ছাড়াই ধারণাটা দেখতে আমরা একটা সরল TF-IDF-ধরনের embedder বানিয়েছি। এটা শুধু <b>প্রক্রিয়াটা</b> বোঝানোর জন্য — আসল embedding অনেক ভালো করবে।</p>
<pre>import re, math, numpy as np

tools = {
 "get_invoice":        "fetch invoice details by invoice number",
 "list_invoices":      "list invoices for a customer in a date range",
 "get_revenue":        "total revenue of a customer for a month",
 "create_voucher":     "create accounting voucher entry",
 "post_voucher":       "post a voucher to the ledger",
 "send_email":         "send an email to a recipient",
 "search_policy":      "search company policy documents",
 "get_exchange_rate":  "currency exchange rate for a date",
 "book_flight":        "book a flight ticket for a passenger",
 "search_hotels":      "search hotels in a city",
 "get_ledger_balance": "balance of a ledger account",
 "create_ticket":      "create a customer support ticket",
}
toks  = lambda t: re.findall(r'[a-z]+', t.lower())
vocab = sorted({w for d in tools.values() for w in toks(d)})
idx   = {w: i for i, w in enumerate(vocab)}
df    = {w: sum(w in toks(d) for d in tools.values()) for w in vocab}

def emb(t):                                       <span class="c"># TF-IDF-সদৃশ, normalize করা</span>
    v = np.zeros(len(vocab))
    for w in toks(t):
        if w in idx: v[idx[w]] += math.log(1 + len(tools) / df[w])
    n = np.linalg.norm(v); return v / n if n else v

E = {k: emb(v) for k, v in tools.items()}         <span class="c"># প্রতিটা tool-এর বিবরণের vector (Vector DB-তে রাখা হয়)</span>
for q in ["what is the revenue for Triplover in October", "email the invoice to customer", "hotel in Dhaka"]:
    qv = emb(q); r = sorted(((float(qv @ E[k]), k) for k in tools), reverse=True)[:3]
    print(q, "-&gt;", [(k, round(s, 2)) for s, k in r])</pre>
<pre><span class="c"># আউটপুট (চালিয়ে পেয়েছি)</span>
what is the revenue for Triplover in October -&gt; [('get_revenue', 0.35), ('post_voucher', 0.3), ('list_invoices', 0.22)]
email the invoice to customer -&gt; [('post_voucher', 0.4), ('send_email', 0.37), ('get_invoice', 0.35)]
hotel in Dhaka -&gt; [('search_hotels', 0.42), ('list_invoices', 0.33), ('send_email', 0.0)]</pre>
<h4>৬.৩ ফল পড়ে যা শিখি</h4>
<ul>
<li><b>top-1 ভরসা করা যায় না:</b> দ্বিতীয় প্রশ্নে সরল embedder-এ <code>post_voucher</code> ০.৪০ নিয়ে এগিয়ে, সঠিক <code>send_email</code> ০.৩৭ — কিন্তু <b>top-3-এর মধ্যে সঠিক tool আছে</b>। তাই "প্রার্থী ৫–১০টা বের করে চূড়ান্ত বাছাই LLM-এর হাতে" — এটাই নিয়ম।</li>
<li><b>Tool-বিবরণের মান সরাসরি routing-এর মান:</b> বিবরণ অস্পষ্ট বা কাছাকাছি হলে (<code>create_voucher</code> বনাম <code>post_voucher</code>) ভুল হয়। বিবরণে "কখন ব্যবহার করবেন / কখন নয়" ও উদাহরণ প্রশ্ন লিখুন; embed করার আগে বিবরণ + উদাহরণ ব্যবহার-বাক্য জুড়ুন।</li>
<li><b>তৃতীয় প্রশ্নে ঝামেলা:</b> "in" শব্দ মিলে <code>list_invoices</code> ০.৩৩ পেয়ে গেছে — আমাদের সরল embedder stop-word বাদ দেয়নি। আসল embedding model এই ধরনের ভুল কম করে, কিন্তু একেবারে করে না — তাই threshold ও মূল্যায়ন (অধ্যায় ১৩) দরকার।</li>
</ul>
<h4>৬.৪ Agentic RAG — সিদ্ধান্ত নেওয়া খোঁজা</h4>
<p>সাধারণ RAG: প্রশ্ন → একবার retrieve → উত্তর। <span class="kw">Agentic RAG</span>-এ LLM নিজেই খোঁজার প্রক্রিয়া চালায়:</p>
<div class="diagram"><pre>
 প্রশ্ন ──→ [LLM: কী লাগবে?] ──→ কোন উৎস? (policy docs / SQL / live API / web)
              ▲                         │
              │                         ▼
              │              [retrieve/tool call] ──→ ফলাফল
              │                         │
              └── যথেষ্ট? না → প্রশ্ন বদলে/ভেঙে আবার খোঁজো (query decomposition, rewrite)
                  যথেষ্ট? হ্যাঁ → উত্তর + উৎস-উদ্ধৃতি
</pre></div>

<h3>৭. Recommendation System — User ও Item-এর Embedding</h3>
<h4>৭.১ ধারণা: "পছন্দ" ও একটা vector</h4>
<p>Search-এ আমরা প্রশ্নের vector দিয়ে ডকুমেন্ট খুঁজি। Recommendation-এ ব্যবহারকারীর <b>আচরণ</b> থেকে তার vector বানাই, আর পণ্য/হোটেল/invoice-এরও vector থাকে; ব্যবহারকারীর vector-এর কাছের item-ই সুপারিশ। যে সব ব্যবহারকারী একই জিনিস পছন্দ করে, তাদের vector কাছাকাছি হয়; যে item-গুলো একই ধরনের মানুষ পছন্দ করে, সেগুলোও কাছাকাছি।</p>
<h4>৭.২ ভেতরে কীভাবে কাজ করে — Matrix Factorization</h4>
<p>ব্যবহারকারী×item সারণিতে (কে কোনটা পছন্দ করেছে) গুণফল <code>U · Vᵀ</code> দিয়ে এই সারণিকে কাছাকাছি আনার চেষ্টা: ব্যবহারকারী-vector <code>U[u]</code> ও item-vector <code>V[i]</code> এমনভাবে শেখা যাতে <code>U[u]·V[i]</code> পছন্দের মানের কাছাকাছি হয়। নিচে ৬ জন ব্যবহারকারী, ৬টা item — দুটো "রুচি-গুচ্ছ": ব্যবহারকারী ০–২ পছন্দ করে item ০–২, ব্যবহারকারী ৩–৫ পছন্দ করে item ৩–৫। <b>ব্যবহারকারী ০ কখনো item ২ ব্যবহার করেনি</b> — মডেল কি সেটা সুপারিশ করবে?</p>
<pre>import numpy as np
rng = np.random.default_rng(3)

R = np.zeros((6, 6))
likes = {0: [0, 1], 1: [0, 1, 2], 2: [1, 2], 3: [3, 4], 4: [3, 4, 5], 5: [4, 5]}   <span class="c"># user → পছন্দের item</span>
for u, items in likes.items():
    for i in items: R[u, i] = 1.0                       <span class="c"># implicit feedback: আচরণ = ১, না-করা = ০</span>

U = rng.normal(scale=.3, size=(6, 2)); V = rng.normal(scale=.3, size=(6, 2))    <span class="c"># ২-মাত্রার latent vector</span>
for ep in range(2000):                                  <span class="c"># সরল SGD</span>
    for u in range(6):
        for i in range(6):
            e  = R[u, i] - U[u] @ V[i]
            gu = e * V[i] - 0.02 * U[u]; gv = e * U[u] - 0.02 * V[i]
            U[u] += 0.05 * gu; V[i] += 0.05 * gv

P = U @ V.T
print("user0 scores:", {i: round(float(P[0, i]), 2) for i in range(6)})
unseen = [i for i in range(6) if R[0, i] == 0]
print("user0 unseen ranked:", sorted(unseen, key=lambda i: -P[0, i]))
cos = lambda a, b: float(a @ b / np.linalg.norm(a) / np.linalg.norm(b))
print("item2~item0", round(cos(V[2], V[0]), 2), "item2~item4", round(cos(V[2], V[4]), 2))</pre>
<pre><span class="c"># আউটপুট (চালিয়ে পেয়েছি)</span>
user0 scores: {0: 0.55, 1: 0.79, 2: 0.57, 3: -0.0, 4: -0.0, 5: -0.0}
user0 unseen ranked: [2, 4, 3, 5]       <span class="c"># ← না-দেখা item-গুলোর মধ্যে item ২ সবার আগে (০.৫৭), বাকিগুলো ~০</span>
item2~item0 1.0 item2~item4 0.0         <span class="c"># ← item ২ ও item ০ একই গুচ্ছে (cosine ১.০), item ৪ আলাদা গুচ্ছে (০.০)</span></pre>
<p><b>ফল কী বলছে:</b> ব্যবহারকারী ০ item ২ কখনো দেখেনি, কিন্তু তার মতো রুচির ব্যবহারকারী ১ ও ২ item ২ পছন্দ করেছে — তাই মডেল item ২-কে সুপারিশের শীর্ষে রেখেছে। এটাই <i>collaborative filtering</i>: "যারা তোমার মতো, তারা এটা পছন্দ করেছে।"</p>
<h4>৭.৩ Two-Tower Model — বড় স্কেলের আধুনিক রূপ</h4>
<p>বাস্তব সিস্টেমে মিলিয়ন ব্যবহারকারী ও item। <span class="kw">Two-tower</span> স্থাপত্যে দুটো neural network: একটা (user tower) ব্যবহারকারীর ইতিহাস/বৈশিষ্ট্য থেকে user-vector বানায়, অন্যটা (item tower) item-এর বৈশিষ্ট্য থেকে item-vector। দুটোর dot product = পছন্দের স্কোর।</p>
<div class="diagram"><pre>
  user features ─→ [User Tower] ─→ u-vector ┐
                                             ├─ dot(u, i) = সম্ভাব্য পছন্দ
  item features ─→ [Item Tower] ─→ i-vector ┘

  Serving (গুরুত্বপূর্ণ কৌশল):
   • সব item-vector আগে থেকেই বানিয়ে Vector DB-তে রাখা (offline)
   • অনুরোধের সময় শুধু user-vector বানানো → Vector DB-তে ANN → শীর্ষ ২০০ প্রার্থী
   • তারপর ছোট, ভারী "ranking model" দিয়ে সেই ২০০ থেকে চূড়ান্ত ১০টা
</pre></div>
<p>এই <b>"প্রার্থী-উৎপাদন (retrieval) + ranking"</b> দুই-ধাপ হলো প্রায় সব বড় সুপারিশ-সিস্টেমের কাঠামো — আর retrieval ধাপটা ঠিক Vector DB-র কাজ (ANN)।</p>

<h4>৭.৪ বাস্তব সমস্যা</h4>
<div class="callout mistake"><span class="tag">Common mistake — Cold start উপেক্ষা</span>
নতুন ব্যবহারকারী/item-এর কোনো ইতিহাস নেই — vector অর্থহীন। সমাধান: item-এর ক্ষেত্রে <b>content-based</b> embedding (বিবরণ থেকে, ইতিহাস ছাড়াই — তাই Vector DB-তে লেখা-embedding খুব কাজের), নতুন ব্যবহারকারীর জন্য জনপ্রিয়/প্রসঙ্গভিত্তিক ডিফল্ট, ধীরে ধীরে ব্যক্তিগত।</div>
<div class="callout mistake"><span class="tag">Common mistake — "না-করা" মানে "অপছন্দ" ধরা</span>
আমাদের demo-তে না-করা = ০ ধরা হয়েছে, কিন্তু আসলে ব্যবহারকারী হয়তো item-টা দেখেইনি। এজন্য আসল সিস্টেমে negative sampling, exposure-aware training, ও weighting ব্যবহার হয়। আর সম্ভব হলে আগে baseline (জনপ্রিয়তা, "এটার মতো আরও") মাপুন।</div>
<div class="callout mistake"><span class="tag">Common mistake — ফিল্টার বাবল ও বৈচিত্র্যহীনতা</span>
সবসময় "সবচেয়ে কাছের" দিলে একই ধরনের item-এর ভিড় (সব হোটেল একই চেইনের)। বৈচিত্র্য আনতে MMR (অধ্যায় ৭), ব্যবসায়িক নিয়ম, এবং কিছু অনুসন্ধানমূলক (exploration) সুপারিশ রাখুন।</div>

<h3>৮. Anomaly Detection with Embeddings — "অদ্ভুত"-কে চেনা</h3>
<h4>৮.১ ধারণা</h4>
<p>স্বাভাবিক ডেটার embedding গুচ্ছ বেঁধে থাকে। যে লেনদেন/ticket/voucher-বিবরণ কোনো গুচ্ছের কাছেই নয় — যার <b>k-তম প্রতিবেশী অনেক দূরে</b> — সেটা অস্বাভাবিক হওয়ার সম্ভাবনা বেশি। এটা <i>kNN-ভিত্তিক anomaly score</i>।</p>
<h4>৮.২ ধাপে ধাপে ও demo</h4>
<ol>
<li>সুস্থ/স্বাভাবিক ডেটার embedding সংগ্রহ (train সেট)।</li>
<li>নতুন বিন্দুর জন্য: train সেটের k-তম (বা k-টা গড়) নিকটতম প্রতিবেশীর দূরত্ব = <b>anomaly score</b> (এখানে <code>1 − cosine</code>)।</li>
<li>Threshold: <b>আলাদা hold-out স্বাভাবিক ডেটার</b> ৯৯তম percentile-এ — অর্থাৎ স্বাভাবিকের মাত্র ~১% ভুলে অস্বাভাবিক ধরা পড়বে।</li>
<li>Score > threshold হলে পর্যালোচনার জন্য পাঠানো।</li>
</ol>
<pre>import numpy as np
rng = np.random.default_rng(1)       

cent = rng.normal(size=(5, 32))                                   <span class="c"># ৫টা "স্বাভাবিক বিষয়"</span>
Xn = cent[rng.integers(0, 5, 3000)] + 0.3 * rng.normal(size=(3000, 32))
Xn /= np.linalg.norm(Xn, axis=1, keepdims=True)
An = rng.normal(size=(30, 32)); An /= np.linalg.norm(An, axis=1, keepdims=True)   <span class="c"># ৩০টা "অদ্ভুত" বিন্দু (এলোমেলো দিক)</span>

tr, te = Xn[:2500], Xn[2500:]                                     <span class="c"># train / hold-out স্বাভাবিক</span>
def knn_score(Z, k=5):
    s = Z @ tr.T                                                  <span class="c"># cosine similarity (normalized)</span>
    return 1 - np.sort(s, axis=1)[:, -k:].mean(1)                 <span class="c"># সেরা k প্রতিবেশীর গড় দূরত্ব</span>

thr = np.percentile(knn_score(te), 99)                            <span class="c"># hold-out-এর ৯৯তম percentile</span>
print("threshold", round(float(thr), 3),
      "normal flagged", round(float((knn_score(te) &gt; thr).mean()), 3),
      "anomalies caught", round(float((knn_score(An) &gt; thr).mean()), 3))
<span class="c"># আমাদের রানে → threshold 0.084, normal flagged 0.01, anomalies caught 1.0</span></pre>
<p>কৃত্রিম ডেটায় ৩০টার সবগুলো অদ্ভুত বিন্দু ধরা পড়ল (১.০), আর স্বাভাবিকের ১% মিথ্যা সতর্কতা। <b>বাস্তবে এত সহজ হবে না</b> — আসল অস্বাভাবিকতা স্বাভাবিকের কাছাকাছি লুকিয়ে থাকে।</p>
<div class="callout mistake"><span class="tag">Common mistake — ধরে নেওয়া যে "দূরে = খারাপ"</span>
Embedding-এ "অদ্ভুত" মানে "এই ডেটার তুলনায় নতুন/বিরল" — জালিয়াতি নয়। একটা সম্পূর্ণ বৈধ কিন্তু বিরল লেনদেন (প্রথমবার বিদেশি মুদ্রা) উঁচু স্কোর পাবে। তাই ফলাফল <b>পর্যালোচনার সংকেত</b>, রায় নয়। আর নতুন বৈধ ধরন শুরু হলে (নতুন পণ্য লাইন) পুরোনো baseline বাসি হয় — নিয়মিত হালনাগাদ ও threshold পুনর্মূল্যায়ন দরকার (অধ্যায় ১৪-র drift)।</div>
<div class="callout best"><span class="tag">Best practice — Embedding + কাঠামোগত সংকেত একসাথে</span>
লেখার embedding অর্থ ধরে, কিন্তু পরিমাণ/সময়/পক্ষ ধরে না। অস্বাভাবিক লেনদেন ধরতে লেখা-embedding-এর স্কোরের সাথে কাঠামোগত ফিচার (পরিমাণের z-score, সময়, নতুন counterparty) মিলিয়ে সিদ্ধান্ত নিন — AI কোর্সের Real-world model অধ্যায়ের Isolation Forest ইত্যাদির সাথে একটা সংমিশ্রণ।</div>

<h3>৯. Deduplication — MinHash বনাম Embedding</h3>
<p>ডুপ্লিকেট কেন সমস্যা? একই ডকুমেন্ট বারবার ingest হলে top-k ফলের পুরোটাই একই কথার প্রতিলিপি — LLM-এর context নষ্ট, বৈচিত্র্য শূন্য, খরচ বেশি, কখনো সঠিক উত্তর বাদ পড়ে। কিন্তু "ডুপ্লিকেট" একটা স্পেকট্রাম:</p>
<table>
<tr><th>ধরন</th><th>উদাহরণ</th><th>কোন পদ্ধতি</th></tr>
<tr><td>হুবহু একই</td><td>একই ফাইল দুবার আপলোড</td><td>Content hash (SHA-256) — সবচেয়ে সস্তা ও নিখুঁত</td></tr>
<tr><td>প্রায় একই (near-duplicate)</td><td>একই invoice, একটা বানান/তারিখ আলাদা; একই ইমেইল থ্রেডের quote-করা অংশ</td><td><b>MinHash + LSH</b> (শব্দ/shingle-ভিত্তিক)</td></tr>
<tr><td>অর্থে একই, শব্দে আলাদা (paraphrase)</td><td>"৭ দিনে refund" বনাম "এক সপ্তাহের মধ্যে টাকা ফেরত"</td><td><b>Embedding similarity</b> (threshold-সহ)</td></tr>
</table>
<h4>৯.১ MinHash কীভাবে কাজ করে — ধাপে ধাপে</h4>
<ol>
<li><b>Shingle:</b> লেখাকে পরপর k-টা শব্দের টুকরোয় ভাঙা (যেমন ৩-শব্দ)। দুটো লেখার shingle-সেটের <b>Jaccard similarity</b> = (সাধারণ shingle) ÷ (মোট আলাদা shingle)।</li>
<li><b>MinHash:</b> n-টা আলাদা hash ফাংশনে প্রতিটা shingle hash করে প্রতিটা ফাংশনের <b>সর্বনিম্ন</b> মান রাখা। দুই লেখার n-টা সংখ্যার মধ্যে কত শতাংশ মেলে — সেটাই Jaccard-এর আনুমানিক মান। (গাণিতিক সত্য: দুই সেটে একটা hash-এর min একই হওয়ার সম্ভাবনা = তাদের Jaccard।)</li>
<li><b>LSH banding:</b> ১২৮টা সংখ্যাকে b ব্যান্ডে ভাগ (প্রতি ব্যান্ডে r সংখ্যা, b×r=১২৮); কোনো এক ব্যান্ডে দুটোর সব r-টা সংখ্যা একই হলে তারা "প্রার্থী জোড়া"। এতে সবার সাথে সবার তুলনা (O(n²)) এড়ানো যায়।</li>
</ol>
<pre>import hashlib, re

def shingles(t, k=3):
    w = re.findall(r'\w+', t.lower())
    return {" ".join(w[i:i+k]) for i in range(max(1, len(w) - k + 1))}

def jacc(a, b): return len(a &amp; b) / len(a | b)

def minhash(s, n=128):
    return [min(int(hashlib.md5(f"{i}:{x}".encode()).hexdigest()[:8], 16) for x in s) for i in range(n)]

def est(a, b): return sum(x == y for x, y in zip(a, b)) / len(a)

t1 = "Invoice 1042 for Triplover amount 25000 BDT due on 15 October payable by bank transfer"
t2 = "Invoice 1042 for Triplover amount 25000 BDT due on 15 October payable by bank transfers"        <span class="c"># near-dup (ছোট বানান-ভেদ)</span>
t3 = "Triplover owes twenty five thousand taka for bill 1042, settle through the bank before mid October"   <span class="c"># paraphrase</span>

for name, t in [("near-dup", t2), ("paraphrase", t3)]:
    a, b = shingles(t1), shingles(t)
    print(name, "jaccard", round(jacc(a, b), 3), "minhash est", round(est(minhash(a), minhash(b)), 3))</pre>
<pre><span class="c"># আউটপুট (চালিয়ে পেয়েছি)</span>
near-dup   jaccard 0.857  minhash est 0.82     <span class="c"># ← প্রায়-হুবহু: উচ্চ মিল, MinHash ধরেছে (অনুমান ০.৮২ ≈ আসল ০.৮৫৭)</span>
paraphrase jaccard 0.0    minhash est 0.0      <span class="c"># ← অর্থ একই, কিন্তু শব্দ আলাদা: MinHash কিছুই দেখে না</span></pre>
<p>এটাই মূল পার্থক্য: <b>MinHash শব্দ-স্তরের মিল ধরে, অর্থ-স্তরের নয়।</b> Paraphrase ধরতে embedding লাগে।</p>
<h4>৯.২ LSH banding — সম্ভাবনার বক্ররেখা (সংখ্যা চালিয়ে হিসাব)</h4>
<p>কোনো জোড়ার আসল Jaccard <code>s</code> হলে, b ব্যান্ড × r সারির LSH-এ তারা প্রার্থী হওয়ার সম্ভাবনা = <code>1 − (1 − sʳ)ᵇ</code>। b ও r বদলে "কত মিলকে ডুপ্লিকেট ধরব" ঠিক করা যায়:</p>

<tr><th>Jaccard s</th><th>b=৩২, r=৪ (সংবেদনশীল)</th><th>b=১৬, r=৮ (কঠোর)</th></tr>
<tr><td>০.৩</td><td>০.২২৯</td><td>০.০০১</td></tr>
<tr><td>০.৫</td><td>০.৮৭৩</td><td>০.০৬১</td></tr>
<tr><td>০.৭</td><td>১.০০০</td><td>০.৬১৩</td></tr>
<tr><td>০.৮</td><td>১.০০০</td><td>০.৯৪৭</td></tr>
<tr><td>০.৯</td><td>১.০০০</td><td>১.০০০</td></tr>
<tr><td>আনুমানিক "থ্রেশহোল্ড" (1/b)^(1/r)</td><td>০.৪২</td><td>০.৭১</td></tr>
</table>
<p>অর্থাৎ b=৩২,r=৪ হলে ০.৫-মিলের জোড়াও ৮৭% সম্ভাবনায় ধরা পড়ে (অনেক প্রার্থী → পরে সঠিক তুলনায় ছাঁটাই); b=১৬,r=৮ হলে শুধু ০.৭+ মিলের জোড়া ধরা পড়ে (কম মিথ্যা প্রার্থী, কিছু মিস)।</p>
<h4>৯.৩ Embedding দিয়ে dedup — ধাপ</h4>
<pre><span class="c"># ধারণা (embedding model সহ): কাছের জোড়া খুঁজে threshold-এর উপরে হলে ডুপ্লিকেট চিহ্নিত</span>
THRESH = 0.95                                  <span class="c"># আপনার ডেটায় মেপে ঠিক করুন — ০.৯০ ও ০.৯৮ খুব ভিন্ন ফল দেয়</span>
for chunk in new_chunks:
    nn = vector_db.search(embed(chunk), k=1)
    if nn and nn[0].score &gt;= THRESH:
        mark_duplicate(chunk, of=nn[0].id)     <span class="c"># বাদ দিন, বা "canonical" এক কপি রেখে বাকিগুলোকে link করুন</span>
    else:
        vector_db.upsert(chunk)</pre>
<div class="callout best"><span class="tag">স্তরভিত্তিক dedup পাইপলাইন</span>
<b>(১)</b> Content hash — হুবহু একই ফেলুন (প্রায় বিনামূল্যে)। <b>(২)</b> MinHash/LSH — প্রায়-হুবহু ফেলুন (embed-খরচ বাঁচে, কারণ embed-এর আগেই)। <b>(৩)</b> Embedding threshold — অর্থগত ডুপ্লিকেট। প্রতিটা ধাপ আগেরটার চেয়ে ব্যয়বহুল, তাই আগেরগুলো বেশিরভাগ ফেলে দিক।</div>
<div class="callout mistake"><span class="tag">Common mistake — অর্থগত ডুপ্লিকেট নির্বিচারে মুছে ফেলা</span>
"৭ দিনে refund" ও "৩০ দিনে refund" অর্থে খুব কাছাকাছি, কিন্তু <b>ভিন্ন তথ্য</b> (বিভিন্ন নীতির ভার্সন)! Threshold কঠোর রাখুন, সংখ্যা/তারিখ/ভার্সন metadata ভিন্ন হলে ডুপ্লিকেট ধরবেন না, আর মোছার বদলে "canonical + link" ভাবুন। চূড়ান্ত মোছা মানুষের পর্যালোচনায়।</div>

<h3>১১. Streaming ও Real-time Freshness — ডেটা কত দ্রুত খোঁজার যোগ্য হয়</h3>
<h4>১১.১ Freshness lag কোথা থেকে আসে</h4>
<div class="diagram"><pre>
 নতুন ডকুমেন্ট ─→ [ইভেন্ট/CDC] ─→ [Parse+Chunk] ─→ [Embed (API)] ─→ [Vector DB write] ─→ [Index-এ দৃশ্যমান]
        │               │              │                 │                    │                    │
       ~0s            ms–s          ms–s            ~100ms–s+            ms–s                 সেকেন্ড–মিনিট
                                                        (queue/rate-limit)             (segment flush, index build)
        └─────────────── মোট "freshness lag" = উপরের সবকিছুর যোগফল ───────────────────────────┘
</pre></div>
<h4>১১.২ ইঞ্জিনের ভেতরে কীভাবে নতুন ডেটা সামলায়</h4>
<p>HNSW-এর মতো গ্রাফ-index একটা একটা করে নোড যোগ সমর্থন করে, কিন্তু ভারী/লক-সংবেদনশীল। অনেক ইঞ্জিন তাই <b>দুই-স্তর</b> রাখে: নতুন লেখা প্রথমে একটা ছোট "growing/memtable" অংশে (প্রায়ই brute-force খোঁজা, কারণ ছোট) যায়, আর পুরোনো বড় অংশ "sealed segment"-এ ANN index-সহ থাকে। Query দুটোতেই চলে, ফল মেলানো হয়। পরে নতুন অংশ ভরাট হলে background-এ index বানিয়ে sealed হয় (compaction)।</p>

<h3>১২. Long-context বনাম RAG — কোনটা কখন</h3>

<tr><td>নির্ভুলতা</td><td>"Lost in the middle": মাঝের তথ্য দুর্বলভাবে ব্যবহৃত; বিশাল context-এ মনোযোগ ছড়ায়</td><td>retrieval ভালো হলে কেন্দ্রীভূত; retrieval মিস করলে উত্তর নেই</td></tr>
<tr><td>সার্বিক প্রশ্ন ("সব মিলিয়ে সারাংশ")</td><td>ভালো (সবকিছু দেখে)</td><td>দুর্বল (top-k মাত্র)</td></tr>
<tr><td>অনুমতি/ACL</td><td>কঠিন — সবকিছু একসাথে দিলে per-user ফিল্টার নেই</td><td>retrieval-এ ফিল্টার (অধ্যায় ১৫)</td></tr>
<tr><td>হালনাগাদ</td><td>প্রতিবার পুনর্গঠন</td><td>chunk যোগ/মোছা</td></tr>
<tr><td>উৎস-উদ্ধৃতি/ব্যাখ্যা</td><td>কঠিন</td><td>সহজ (কোন chunk)</td></tr>
<tr><td>সরলতা</td><td>খুব সরল (কোনো index নেই)</td><td>অবকাঠামো ও টিউনিং</td></tr>
</table>
<div class="callout best"><span class="tag">সিদ্ধান্ত</span>
<b>Long-context জেতে:</b> ছোট corpus (কয়েক ডকুমেন্ট), কম প্রশ্ন, একবারের বিশ্লেষণ (এই ৫০ পৃষ্ঠার চুক্তিটা বিশ্লেষণ করো), সার্বিক সারসংক্ষেপ। <b>RAG জেতে:</b> বড়/বাড়তে থাকা corpus, বেশি প্রশ্ন, per-user অনুমতি, হালনাগাদ, খরচ-সংবেদনশীল। <b>সংমিশ্রণ:</b> RAG দিয়ে প্রাসঙ্গিক ডকুমেন্টগুলো (chunk নয়, পূর্ণ ডকুমেন্ট বা বড় অংশ) বেছে তারপর সেগুলো long-context-এ দেওয়া — দুইয়ের সেরা।</div>

<h3>১৩. উদীয়মান প্রবণতা (সতর্কতার সাথে — এই ক্ষেত্র দ্রুত বদলায়)</h3>
<div class="callout behind"><span class="tag">দায়-সীমা</span>
নিচেরগুলো প্রবণতা, নিশ্চিত ভবিষ্যৎ নয়। কোনো একটার উপর বড় সিদ্ধান্ত নেওয়ার আগে বর্তমান ডকুমেন্টেশন ও নিজের মাপজোক দেখুন।</div>
<ul>
<li><b>Vector সমর্থন সর্বত্র:</b> প্রায় সব database (PostgreSQL, MongoDB, Elasticsearch, Redis, SQL Server/Azure ও cloud DB) এখন vector সমর্থন করছে — আলাদা Vector DB-র প্রয়োজন কমছে সরল/মাঝারি ক্ষেত্রে, আর বিশেষায়িত ইঞ্জিন চরম স্কেল/ফিচারে।</li>
<li><b>Multi-vector/late-interaction মূলধারায়:</b> বিশেষত ডকুমেন্ট-ছবি ও জটিল প্রশ্নে।</li>
<li><b>Instruction-aware ও reasoning-based retrieval:</b> embedding-কে "কী ধরনের খোঁজা" নির্দেশনা দেওয়া; খোঁজার সময় LLM-এর reasoning ব্যবহার।</li>
<li><b>Embedding-এর ছোট/কার্যকর রূপ:</b> Matryoshka, binary/int8 স্ট্যান্ডার্ড হয়ে উঠছে।</li>
<li><b>Agent memory:</b> দীর্ঘস্থায়ী agent-এর স্মৃতি-ব্যবস্থাপনা (কী মনে রাখা, কী ভোলা, সময়ভিত্তিক ক্ষয়)।</li>
<li><b>স্বয়ংক্রিয় টিউনিং:</b> ইঞ্জিন নিজে index-পরামিতি ও quantization বেছে নেওয়া।</li>
<li><b>মূল্যায়ন-কেন্দ্রিকতা:</b> কোন কৌশল ভালো তা বিতর্ক নয়, নিজের golden set-এ মেপে ঠিক করার সংস্কৃতি (অধ্যায় ১৩)।</li>
</ul>

<h3>খ. Capstone প্রজেক্ট — শেখাকে কাজে রূপ দেওয়া</h3>
<p>শেখা পাকা হয় বানানোর মধ্য দিয়ে। নিচে ৪টা প্রজেক্ট — প্রতিটা আপনার কর্মক্ষেত্রের (accounting/ERP/travel) সাথে মেলে, ধাপে ধাপে, মূল্যায়নের মাপকাঠিসহ। ক্রম: সহজ থেকে কঠিন।</p>

<h3>Capstone ১ — কোম্পানির Policy Assistant (RAG + Access Control)</h3>
<table>
<tr><th>লক্ষ্য</th><td>কর্মীরা policy-ডকুমেন্ট (refund, leave, approval limit, expense rule) নিয়ে বাংলা/ইংরেজিতে প্রশ্ন করবে; উত্তর আসবে উৎস-উদ্ধৃতিসহ; কর্মী কেবল নিজের অধিকারের ডকুমেন্ট থেকে উত্তর পাবে।</td></tr>
<tr><th>Stack</th><td>PostgreSQL + pgvector, multilingual embedding model, ASP.NET Core API (বা FastAPI), একটা LLM, RLS বা TenantScoped wrapper</td></tr>
</table>
<div class="diagram"><pre>
 Policy docs ─→ parse ─→ chunk(structure-aware) ─→ embed ─→ pgvector (chunk + ACL + version)
                                                                   ▲
 ব্যবহারকারী ─→ API(auth, groups) ─→ embed(query) ─→ hybrid search + ACL filter ─→ rerank ─→ LLM ─→ উত্তর+citation
</pre></div>
<ol>
<li><b>ডেটা:</b> ২০–৫০টা policy ডকুমেন্ট (নিজে নমুনা লিখুন বা বেনামী করুন)। কিছুতে "শুধু HR" ও "শুধু Finance" লেবেল।</li>
<li><b>Schema:</b> অধ্যায় ৯-র <code>doc_chunks</code> + <code>acl_groups</code>, <code>version</code>, <code>effective_date</code>, <code>source_tier</code>।</li>
<li><b>Ingestion:</b> heading-ভিত্তিক chunking (অধ্যায় ৬), PII/secret স্ক্যান (অধ্যায় ১৫), batch embedding, <code>content_hash</code> দিয়ে idempotent upsert।</li>
<li><b>Retrieval:</b> hybrid (vector + <code>tsvector</code>) + RRF, ACL filter caller-এর গ্রুপ দিয়ে (বাধ্যতামূলক), similarity threshold।</li>
<li><b>Generation:</b> prompt-এ chunk delimiter+escape, "জানি না" নীতি, উত্তরে [১] [২] উৎস।</li>
<li><b>নিরাপত্তা:</b> canary-পরীক্ষা (এক গ্রুপের গোপন ডকুমেন্ট অন্যের query-তে আসে না), red-team প্রশ্ন, audit log।</li>
<li><b>মূল্যায়ন:</b> ৫০টা golden প্রশ্ন (প্রতিটার সঠিক doc চিহ্নিত) → hit-rate@5, MRR; উত্তর-মান (সঠিক/উৎস-সমর্থিত); লক্ষ্য: hit-rate@5 ≥ ০.৯।</li>
<li><b>Stretch:</b> semantic cache (invalidation সহ), নীতির নতুন ভার্সন আসলে পুরোনো বাদ।</li>
</ol>
<p><b>যা শিখবেন:</b> chunking, hybrid, ACL, citation, eval — RAG-এর পুরো মৌলিক চক্র।</p>

<h3>Capstone ২ — Invoice Similarity ও Duplicate Finder</h3>
<table>
<tr><th>লক্ষ্য</th><td>নতুন invoice এলে সিস্টেম সদৃশ আগের invoice (সম্ভাব্য ডুপ্লিকেট/পুনরাবৃত্ত বিল) দেখাবে, ডুপ্লিকেটের ঝুঁকি-স্কোর দেবে, আর "এই ধরনের invoice-এর GL account" প্রস্তাব করবে।</td></tr>
<tr><th>Stack</th><td>Python (ingestion), Qdrant বা pgvector, embedding model, কাঠামোগত ফিল্ড (amount, date, vendor)</td></tr>
</table>
<ol>
<li><b>ডেটা প্রস্তুত:</b> invoice-এর টেক্সট বিবরণ + কাঠামোগত ফিল্ড। embed করার টেক্সট: "vendor: X; description: ...; items: ..." (কাঠামো ঠিকভাবে লিখুন; শুধু সংখ্যা embed করবেন না)।</li>
<li><b>স্তরভিত্তিক dedup:</b> (ক) content hash — হুবহু; (খ) MinHash+LSH — প্রায়-হুবহু (বানান-ভেদ); (গ) embedding threshold — অর্থগত সদৃশ। </li>
<li><b>কাঠামোগত মিল:</b> embedding-এর সাথে <b>মিলিয়ে</b> amount (±১%), vendor, তারিখ-ব্যবধান — একই vendor + একই amount + কাছাকাছি লেখা = শক্তিশালী ডুপ্লিকেট সংকেত।</li>
<li><b>Vector DB ফিল্টার:</b> একই vendor বা ±৯০ দিনের মধ্যে — তুলনার সেট ছোট ও প্রাসঙ্গিক।</li>
<li><b>স্কোর ও সিদ্ধান্ত:</b> সম্মিলিত স্কোর; উচ্চ → হোল্ড করে মানুষের পর্যালোচনা, মাঝারি → সতর্কতা, নিম্ন → পাস। <b>স্বয়ংক্রিয়ভাবে মোছা/বাতিল নয়।</b></li>
<li><b>GL প্রস্তাব (kNN classification):</b> নতুন invoice-এর k সবচেয়ে কাছের আগের invoice-এর GL account-এর ভোট → সবচেয়ে বেশি ভোট + আস্থা-স্কোর; আস্থা কম হলে মানুষ।</li>
<li><b>মূল্যায়ন:</b> পুরোনো ডেটায় কৃত্রিম ডুপ্লিকেট (বানান-ভেদ, পরিমাণ-ভেদ, paraphrase) ঢুকিয়ে precision/recall; GL প্রস্তাবে top-1/top-3 নির্ভুলতা।</li>
<li><b>Stretch:</b> Capstone-এর feedback loop — মানুষের সংশোধন নতুন উদাহরণ হিসেবে ফেরত।</li>
</ol>
<p><b>যা শিখবেন:</b> dedup-এর স্তর, embedding + structured মিশ্রণ, kNN classification, মিথ্যা-ধনাত্মকের খরচ।</p>

<h3>Capstone ৩ — Support Ticket Router ও সদৃশ-সমাধান সুপারিশ</h3>
<table>
<tr><th>লক্ষ্য</th><td>আসা ticket-এর (১) ক্যাটাগরি/টিম ঠিক করা, (২) অগ্রাধিকার অনুমান, (৩) পুরোনো সদৃশ ticket ও তাদের সমাধান দেখানো — এজেন্টের সময় বাঁচাতে।</td></tr>
<tr><th>Stack</th><td>pgvector/Qdrant, embedding, একটা ছোট LLM (সারাংশ/প্রস্তাবিত উত্তর), message queue (Kafka/RabbitMQ), ASP.NET Core worker</td></tr>
</table>
<ol>
<li><b>ডেটা:</b> ২,০০০+ পুরোনো সমাধান-হওয়া ticket (লেখা, ক্যাটাগরি, সমাধান, সময়)। PII মাস্ক।</li>
<li><b>Embed ও সংরক্ষণ:</b> ticket-এর শিরোনাম+বিবরণ; payload-এ ক্যাটাগরি, টিম, সমাধান-সারাংশ, সমাধান-সময়।</li>
<li><b>Routing (kNN ভোট):</b> নতুন ticket → k=১০ নিকটতম → ক্যাটাগরির ভোট (দূরত্ব-ভিত্তিক ওজনসহ) → শীর্ষ ক্যাটাগরি + আস্থা।</li>
<li><b>Confidence-ভিত্তিক স্বয়ংক্রিয়তা:</b> আস্থা ≥ ০.৯ → স্বয়ংক্রিয় রুট; ০.৬–০.৯ → প্রস্তাব, এজেন্ট নিশ্চিত করবে; &lt; ০.৬ → ম্যানুয়াল triage।</li>
<li><b>সদৃশ-সমাধান:</b> শীর্ষ ৩টা সমাধান-হওয়া ticket ও সমাধান দেখান; LLM দিয়ে "প্রস্তাবিত উত্তর" খসড়া (মানুষ পাঠাবে)।</li>
<li><b>Event-driven:</b> নতুন ticket → queue → worker (embed+search) → ফল ticket-এ লেখা; DLQ ও retry।</li>
<li><b>Feedback loop:</b> এজেন্ট ক্যাটাগরি বদলালে সেটা সংরক্ষণ → নতুন উদাহরণ হিসেবে index-এ (সঠিক লেবেলসহ)।</li>
<li><b>মূল্যায়ন:</b> hold-out ticket-এ ক্যাটাগরি নির্ভুলতা/macro-F1, "সদৃশ-সমাধান উপকারী ছিল?" এজেন্ট-রেটিং; ব্যবসায়িক মাপ: গড় সমাধান-সময় ও প্রথম-উত্তরের সময়।</li>
<li><b>Stretch:</b> drift নজরদারি — নতুন ধরনের সমস্যা (outage) হঠাৎ এলে anomaly সংকেত (৮ নং অংশ)।</li>
</ol>
<p><b>যা শিখবেন:</b> kNN-classification, confidence ladder, event-driven pipeline, feedback loop, ব্যবসায়িক ROI-মাপ।</p>

<h3>Capstone ৪ — Travel Hotel Semantic Search (Multimodal + Filter + Recommendation)</h3>
<table>
<tr><th>লক্ষ্য</th><td>ব্যবহারকারী লিখবে "শান্ত, সমুদ্র-দেখা, পরিবারের জন্য, কক্সবাজারে, ১০ হাজারের মধ্যে" — সিস্টেম বিবরণ+ছবির অর্থ বুঝে ফিল্টারসহ সেরা হোটেল দেখাবে; "এটার মতো আরও" বোতামও থাকবে।</td></tr>
<tr><th>Stack</th><td>Qdrant (named vectors + payload filter), text embedding + CLIP-ধরনের image embedding, ASP.NET Core API, ছোট UI</td></tr>
</table>
<ol>
<li><b>ডেটা:</b> ৫০০–২,০০০ হোটেল: বিবরণ, সুবিধা, শহর, দাম, রেটিং, ছবি (৩–৫টা)।</li>
<li><b>দুই ধরনের vector:</b> <code>text_vec</code> (বিবরণ+সুবিধা) ও <code>image_vec</code> (প্রতিটা ছবির; গড় বা আলাদা point) — এক record-এ named vectors।</li>
<li><b>Payload ও index:</b> <code>city</code>, <code>price_per_night</code>, <code>rating</code>, <code>amenities[]</code>, <code>available_from/to</code> — payload index তৈরি (ফিল্টার দ্রুত)।</li>
<li><b>Query বোঝা:</b> LLM/নিয়ম দিয়ে প্রশ্ন ভেঙে → structured ফিল্টার (শহর=কক্সবাজার, দাম≤১০০০০) + semantic অংশ ("শান্ত, সমুদ্র-দেখা, পরিবার")। এটা Query Transformation (অধ্যায় ৭)।</li>

প্রশ্নগুলো ক্রম অনুযায়ী সাজানো: <b>১–১২ মৌলিক</b> (vector, similarity, ANN), <b>১৩–২০ ডেটা ও embedding</b>, <b>২১–২৮ retrieval ও তুলনা</b>, <b>২৯–৩৩ ডাটাবেস/টুল</b>, <b>৩৪–৩৬ মূল্যায়ন</b>, <b>৩৭–৪৫ production ও scenario</b>, <b>৪৬–৫০ নিরাপত্তা</b>, <b>৫১–৫৬ উন্নত ও architecture design</b>। উত্তর পড়ার আগে নিজে বলার চেষ্টা করুন — তারপর মেলান।</div>

<h3>ক. মৌলিক প্রশ্ন</h3>

<h3>১) Vector Database কী, আর সাধারণ SQL database বা full-text search থেকে এটা কীভাবে আলাদা?</h3>
<pre>SQL / full-text : "শব্দ মিলেছে?"   → "money back" খুঁজলে "টাকা ফেরত" মেলে না
Vector search   : "অর্থ মিলেছে?"    → দুটোই কাছাকাছি, তাই মেলে</pre>
<p><b>ব্যাখ্যা:</b> Embedding model লেখার অর্থকে সংখ্যা-তালিকায় (vector) রূপ দেয়; অর্থ কাছাকাছি হলে vector-ও কাছাকাছি। Vector Database সেই vector-গুলো (সাথে মূল লেখা ও metadata) সংরক্ষণ করে এবং "এই vector-এর সবচেয়ে কাছের k টা কোনগুলো" প্রশ্নের উত্তর কোটি কোটি ডেটায়ও মিলিসেকেন্ডে দেয় — ANN index (HNSW, IVF) ব্যবহার করে। SQL হুবহু ও কাঠামোগত শর্তে নিখুঁত ("invoice #1042-এর amount"); full-text শব্দ-ভিত্তিক মিলে ভালো; vector অর্থ-ভিত্তিক খোঁজায় ভালো। তিনটা প্রতিযোগী নয়, প্রায়ই একসাথে (hybrid) ব্যবহৃত হয়। আর AI-এর সাথে সম্পর্ক: LLM-এর জ্ঞান স্থির ও context সীমিত, Vector DB হলো তার বাহ্যিক দীর্ঘমেয়াদি স্মৃতি — RAG-এর ভিত্তি।</p>

<h3>২) Embedding কী? Dimension মানে কী? কে এই সংখ্যাগুলো বানায়?</h3>
<pre>"টাকা ফেরত পাওয়া যাবে" → [0.90, 0.10, 0.00, ... ১৫৩৬ সংখ্যা]
"money back policy"     → [0.85, 0.15, 0.05, ...]    <span class="c">// কাছাকাছি সংখ্যা = কাছাকাছি অর্থ</span></pre>
<p><b>ব্যাখ্যা:</b> Embedding হলো লেখা/ছবি/অডিওর অর্থের সংখ্যা-তালিকা। Dimension হলো তালিকার দৈর্ঘ্য (যেমন ৩৮৪, ৭৬৮, ১৫৩৬, ৩০৭২)। বেশি dimension সূক্ষ্ম পার্থক্য ধরার ক্ষমতা বাড়ায় কিন্তু স্টোরেজ, মেমরি ও গণনা সমানুপাতে বাড়ে (১ কোটি × ১৫৩৬ × ৪ বাইট ≈ ৬১ GB)। সংখ্যাগুলো বানায় একটা <b>embedding model</b> — একটা বিশেষ neural network যা কথা বলে না, শুধু অর্থকে সংখ্যায় রূপ দেয়; এটা chat LLM থেকে আলাদা (OpenAI <code>text-embedding-3</code>, Cohere, বা open-source bge/e5)। Dimension-এর প্রতিটা অক্ষের মানুষ-বোধ্য অর্থ নেই — অর্থ ছড়ানো থাকে সবগুলোয় মিলে।</p>

<h3>৩) Document ও query কেন একই embedding model দিয়ে embed করতে হয়?</h3>
<p><b>ব্যাখ্যা:</b> প্রতিটা embedding model নিজস্ব "অর্থের ম্যাপ" বানায় — একটা model-এর ৭৬৮টা অক্ষ আর অন্য model-এর ৭৬৮টা অক্ষ সম্পূর্ণ আলাদা কিছু বোঝায়। ভিন্ন model-এর vector তুলনা করা যেন একটা ম্যাপে কিলোমিটার আর অন্যটায় মাইল মিলিয়ে দূরত্ব মাপা — সংখ্যা বের হয়, কিন্তু অর্থহীন। (dimension মিলে গেলেও ভুল!) তাই document ও query দুটোই একই model ও একই ভার্সনে; model বদলালে সব ডেটা আবার embed। কিছু model asymmetric: query ও passage-এর জন্য আলাদা prefix চায় (যেমন "query: ", "passage: ") — সেটাও ঠিক করে দিতে হয়, নইলে ফল দুর্বল। প্রতিটা record-এ <code>embedding_model</code> ভার্সন রাখা ভালো অভ্যাস।</p>

<h3>৪) Cosine similarity, dot product ও Euclidean (L2) — কী মাপে, কখন কোনটা?</h3>
<pre>q = [1, 1];   a = [10, 10];   b = [1, 0.9];   c = [0, 1]

        dot     cosine   L2 দূরত্ব
a      20.0     1.000    12.73      <span class="c">// একই দিক, কিন্তু অনেক লম্বা</span>
b       1.9     0.999     0.10      <span class="c">// প্রায় একই দিক, প্রায় একই দৈর্ঘ্য</span>
c       1.0     0.707     1.00      <span class="c">// ভিন্ন দিক</span></pre>
<p><b>ব্যাখ্যা:</b> (উপরের সংখ্যা আমরা চালিয়ে মিলিয়েছি।) <b>Cosine</b> দুই vector-এর <i>দিকের</i> মিল মাপে, দৈর্ঘ্য উপেক্ষা করে — a ও q একই দিকে তাই ১.০, যদিও a ১০ গুণ লম্বা। <b>Dot product</b> দিক + দৈর্ঘ্য দুটোই মেশায় — লম্বা vector-এর স্কোর বেশি, তাই a (২০.০) b-কে (১.৯) অনেক পেছনে ফেলল, যদিও b-ও প্রায় একই দিকে। <b>L2</b> বিন্দু দুটোর সরলরেখার দূরত্ব — এখানে ছোট = কাছের, উল্টো দিকের নিয়ম (a সবচেয়ে "দূরে"!)। টেক্সট embedding-এর সাধারণ ডিফল্ট cosine, কারণ আমরা অর্থ (দিক) চাই, লেখার "দৈর্ঘ্য-প্রভাব" নয়। যে metric model train করা হয়েছে সেটাই ব্যবহার করুন (model-এর ডকুমেন্টেশনে লেখা থাকে) — ভুল metric র‍্যাঙ্কিং নষ্ট করে।</p>

<h3>৫) Trick: vector normalize করা থাকলে cosine আর dot product একই — কেন? আর কেন এটা কাজের?</h3>
<pre>নরমালাইজড (দৈর্ঘ্য = ১):  cosine(x, y) = (x · y) / (|x| |y|) = x · y / (1 × 1) = x · y

উপরের উদাহরণে normalized dot: a → 1.0, b → 0.999, c → 0.707   <span class="c">// ঠিক cosine-এর সমান</span></pre>
<p><b>ব্যাখ্যা:</b> Cosine-এর সূত্রে হর-এ দুই vector-এর দৈর্ঘ্যের গুণফল; দৈর্ঘ্য ১ হলে হর ১, ফলে cosine = dot। এর ব্যবহারিক গুরুত্ব: (১) dot product গণনা সবচেয়ে সস্তা ও SIMD-অনুকূল — তাই আগে থেকে normalize করে "inner product" index ব্যবহার করলে cosine-এর ফলই পাওয়া যায়, দ্রুততরভাবে। (২) অনেক embedding model (যেমন OpenAI-র) ইতিমধ্যেই normalized vector ফেরত দেয় — তখন cosine ও dot একই। (৩) সতর্কতা: যে model normalized দেয় না, সেটাকে ইচ্ছামতো dot দিয়ে খুঁজলে দৈর্ঘ্য-পক্ষপাত ঢোকে (৪ নং উত্তরের a) — আগে normalize করুন, বা cosine operator ব্যবহার করুন।</p>

<h3>৬) pgvector-এ <code>&lt;=&gt;</code> কী ফেরত দেয়? Similarity আর distance-এর সম্পর্ক কী?</h3>
<pre>SELECT content, 1 - (embedding &lt;=&gt; $1) AS similarity     <span class="c">-- cosine distance → similarity</span>
FROM   doc_chunks ORDER BY embedding &lt;=&gt; $1 LIMIT 5;</pre>
<p><b>ব্যাখ্যা:</b> <code>&lt;=&gt;</code> <b>cosine distance</b> (= ১ − cosine similarity) ফেরত দেয়: ০ মানে একই দিক, ২ মানে উল্টো। তাই <code>ORDER BY ... ASC</code> (ছোট distance আগে) = সবচেয়ে মিলযুক্ত আগে। ব্যবহারকারীকে similarity দেখাতে চাইলে <code>1 − distance</code>। অনেকে এখানে উল্টো ক্রমে সাজিয়ে ভুল করেন। একইভাবে <code>&lt;-&gt;</code> L2 distance ও <code>&lt;#&gt;</code> <i>negative</i> inner product (ছোট = ভালো, তাই ঋণাত্মক চিহ্ন)। Chroma/Qdrant-ও কোথাও distance, কোথাও score দেয় — প্রতিটা ইঞ্জিনে "ছোট ভালো না বড় ভালো" যাচাই করুন (অধ্যায় ২, ৮)।</p>

<h3>৭) Trick: Vector search সবসময় top-k ফল দেয়, এমনকি প্রাসঙ্গিক কিছু না থাকলেও। এটা কেন বিপজ্জনক? কী করবেন?</h3>
<pre>এলোমেলো ১০০০ vector-এর corpus-এ একটা এলোমেলো প্রশ্ন:
top-3 similarity = 0.365, 0.337, 0.333     <span class="c">// কিছু একটা "সবচেয়ে কাছের" ঠিকই এল!</span></pre>
<p><b>ব্যাখ্যা:</b> (উপরের সংখ্যা আমরা চালিয়েছি।) kNN-এর কাজ "সবচেয়ে কাছের k টা" — "যথেষ্ট কাছের" নয়। কোনো প্রাসঙ্গিক ডকুমেন্ট না থাকলেও সবচেয়ে কম-অপ্রাসঙ্গিক k টা ফেরত আসে। এগুলো LLM-কে context হিসেবে দিলে মডেল সেগুলো থেকেই উত্তর বানানোর চেষ্টা করে — hallucination। সমাধান: (১) <b>similarity threshold</b> (আপনার ডেটায় মেপে — যেমন ০.৭-র নিচে বাদ); (২) কিছুই না পেলে LLM-কে "এ বিষয়ে তথ্য পাওয়া যায়নি" বলতে দেওয়া; (৩) top-1 ও top-2-এর স্কোর-ফারাক দেখা (সবাই প্রায় সমান কম হলে অনিশ্চিত); (৪) reranker-এর স্কোর দিয়ে চূড়ান্ত cut-off। Threshold মডেল-নির্ভর — এক embedding model-এ ০.৭ ভালো, অন্যটায় ০.৪; তাই golden set-এ ঠিক করুন (অধ্যায় ৭, ১৩)।</p>

<h3>৮) kNN আর ANN-এর পার্থক্য কী? "Approximate" হয়েও production-এ গ্রহণযোগ্য কেন?</h3>
<p><b>ব্যাখ্যা:</b> <b>kNN (exact/brute-force/Flat)</b> সব vector-এর সাথে তুলনা করে — নিখুঁত, কিন্তু সময় ডেটার সমানুপাতিক (১ কোটি × ১৫৩৬ dimension প্রতি প্রশ্নে সেকেন্ড-পরিমাণ)। <b>ANN</b> আগে থেকে বিশেষ কাঠামো (index) সাজিয়ে রাখে, যাতে অধিকাংশ vector দেখতেই না হয় — সময় প্রায় লগারিদমিক, কিন্তু সামান্য নির্ভুলতা হারায় (recall ~৯৫–৯৯%)। গ্রহণযোগ্য কারণ: (১) embedding নিজেই আনুমানিক — "৯৭% নিখুঁত নিকটতম" আর "১০০% নিখুঁত" র‍্যাঙ্কিংয়ের পার্থক্য ব্যবহারকারীর কাছে প্রায় অদৃশ্য; (২) RAG-এ আমরা top-k নিই, আর শেষে reranker পুনর্বিন্যাস করে — ছোট ভুল পুষিয়ে যায়; (৩) গতির লাভ ১০০০×। ছোট ডেটায় (কয়েক লাখ পর্যন্ত) Flat-ই সরল ও নিখুঁত — ANN তখনই যখন latency সত্যিই সমস্যা (অধ্যায় ৪)।</p>

<h3>৯) HNSW কীভাবে কাজ করে? <code>M</code>, <code>ef_construction</code>, <code>ef_search</code> কী?</h3>
<pre>স্তর ২ (বিরল, বড় লাফ):   ●───────────────────────●
স্তর ১ (মাঝারি):          ●────●────────●────●─────●
স্তর ০ (সব vector, ঘন):  ●─●─●─●─●─●─●─●─●─●─●─●─●─●</pre>
<p><b>ব্যাখ্যা:</b> HNSW (Hierarchical Navigable Small World) একটা স্তরভিত্তিক গ্রাফ: প্রতিটা vector একটা নোড, কাছের নোডগুলো এজ দিয়ে যুক্ত। উপরের স্তরে নোড কম ও সংযোগ দূরের (মহাসড়ক), নিচের স্তরে ঘন (গলি)। খোঁজার সময় উপরের স্তরে একটা প্রবেশ-বিন্দু থেকে শুরু করে "গ্রাফে লোভী ভ্রমণ" — সবসময় প্রশ্নের দিকে এগোনো প্রতিবেশীর কাছে যাওয়া, যতক্ষণ আর কাছে যাওয়া যায় না; তারপর এক স্তর নিচে নেমে একই; স্তর ০-তে চূড়ান্ত প্রতিবেশী। <b>পরামিতি:</b> <code>M</code> = প্রতি নোডের সংযোগ-সংখ্যা (বাড়ালে recall ↑, মেমরি ↑); <code>ef_construction</code> = index বানানোর সময় কতজন প্রার্থী বিবেচনা (বাড়ালে index-মান ↑, নির্মাণ ধীর); <code>ef_search</code> = query-র সময় প্রার্থী-তালিকার আকার (বাড়ালে recall ↑, query ধীর) — এটাই runtime-এ recall-বনাম-speed-এর প্রধান নব। মেমরি বেশি লাগে কারণ vector-এর পাশাপাশি গ্রাফের সংযোগও RAM-এ রাখতে হয় (মোটামুটি প্রতি vector-এ ~২×M×৪ বাইট অতিরিক্ত)।</p>

<h3>১০) IVF কীভাবে কাজ করে? HNSW-এর সাথে তুলনা করুন।</h3>
<p><b>ব্যাখ্যা:</b> IVF (Inverted File): আগে সব vector-কে k-means clustering দিয়ে <code>nlist</code> টা "এলাকা"-য় (centroid) ভাগ করা হয়। Query-তে প্রথমে প্রশ্নের কাছের <code>nprobe</code> টা centroid বেছে শুধু সেই এলাকাগুলোতেই খোঁজা হয় — বাকি এলাকা উপেক্ষা। <b>সুবিধা:</b> কম মেমরি, দ্রুত নির্মাণ, quantization (IVF-PQ)-এর সাথে চমৎকার; <b>অসুবিধা:</b> এলাকা-সীমানার কাছের vector মিস হতে পারে (<code>nprobe</code> বাড়িয়ে পুষিয়ে নিন); আগে train (clustering) লাগে; ডেটা-বণ্টন বদলালে clustering বাসি হয়। <b>HNSW:</b> train লাগে না, সাধারণত বেশি recall/কম latency, কিন্তু বেশি মেমরি ও ধীর নির্মাণ। নিয়ম: RAM যথেষ্ট ও উচ্চ recall চাই → HNSW; বিশাল ডেটা ও মেমরি-সংকট → IVF-PQ বা disk-ভিত্তিক বিকল্প (অধ্যায় ৪, ৫)।</p>

<h3>১১) Recall@k কী? Recall বনাম speed-এর টানাপোড়েন ব্যাখ্যা করুন।</h3>
<pre>exact সেরা ৫ : [1, 2, 3, 4, 5]
ANN-এর ৫    : [1, 2, 3, 9, 8]
recall@5 = |{1,2,3}| / 5 = 0.6</pre>
<p><b>ব্যাখ্যা:</b> ANN-recall = ANN যে k টা দিল তার মধ্যে আসল (brute-force) সেরা k-এর কত ভাগ আছে (এখানে ৩/৫ = ০.৬)। (সাবধান: এটা <i>ANN-এর</i> recall; ৩৪ নং প্রশ্নের "retrieval recall/hit-rate" আলাদা — সেটা সঠিক ডকুমেন্ট আদৌ এসেছে কিনা, আসল সত্য-লেবেলের বিপরীতে।) টানাপোড়েন: আরও প্রার্থী পরীক্ষা করলে (বড় <code>ef_search</code>/<code>nprobe</code>) recall বাড়ে কিন্তু প্রতিটা query বেশি সময় নেয়; কম পরীক্ষা করলে দ্রুত কিন্তু ভালো প্রতিবেশী মিস। তাই সবসময় একটা বক্ররেখা মাপুন (recall বনাম QPS/latency), এবং লক্ষ্য ঠিক করুন (যেমন recall ≥ ০.৯৫ ও p95 ≤ ৫০ms) — "সবচেয়ে দ্রুত" বা "সবচেয়ে নিখুঁত" নয়, <i>ব্যবসার জন্য যথেষ্ট</i> বিন্দু বেছে নিন (অধ্যায় ৫)।</p>

<h3>১২) Trick: একই query দুবার চালালে ANN কেন ভিন্ন ফল দিতে পারে? কীভাবে স্থিতিশীল রাখবেন?</h3>
<p><b>ব্যাখ্যা:</b> কারণগুলো: (১) <b>গ্রাফ তৈরির অনিশ্চয়তা</b> — HNSW-এ vector যে ক্রমে ঢোকে ও সমান্তরাল নির্মাণের কারণে গ্রাফ প্রতিবার সামান্য আলাদা হয়, তাই দুটো আলাদা index আলাদা ফল দিতে পারে; (২) <b>বহু segment/shard</b> — প্রতিটায় আলাদা ANN, ফল মেলানোর সময় tie/সীমান্ত-পার্থক্য; (৩) <b>background compaction/merge</b> চলাকালীন index বদলে যায়; (৪) <b>replica</b>-গুলো সম্পূর্ণ সমান না (replication lag); (৫) নতুন লেখা দৃশ্যমান হওয়া (freshness); (৬) মান-সীমান্তে প্রায়-সমান স্কোরের tie। একই index-এ একই query সাধারণত নির্ধারিত (deterministic) ফল দেয়, কিন্তু উপরের পরিস্থিতিতে নয়। স্থিতিশীলতার উপায়: বড় <code>ef_search</code>, tie-breaker (দ্বিতীয় sort key — <code>id</code>), শেষে নির্ধারিত rerank, evaluation-এ ফল-কে "সঠিক সেট" দিয়ে মাপা (ক্রম নয়), সম্পূর্ণ নির্ধারিত দরকার হলে Flat বা exact rescoring। আর জানার বিষয়: ANN-এ "ফল একটু ভিন্ন" স্বাভাবিক, ত্রুটি নয়।</p>

<h3>খ. ডেটা, Chunking ও Embedding</h3>

<h3>১৩) Chunking কেন দরকার? Chunk size ও overlap কীভাবে ঠিক করবেন?</h3>
<pre>খুব ছোট → প্রসঙ্গ হারায় | খুব বড় → অর্থ পাতলা, অপ্রাসঙ্গিক তথ্যও LLM-এ যায়
শুরু: ~২০০–৮০০ token + সামান্য overlap → golden set-এ মেপে টিউন</pre>
<p><b>ব্যাখ্যা:</b> পুরো ডকুমেন্টের একটা vector সবকিছুর "গড় অর্থ" ধরে, নির্দিষ্ট প্রশ্নের উত্তর খোঁজা কঠিন হয়; আবার embedding model-এর token-সীমাও আছে। তাই ছোট chunk-এ ভেঙে প্রতিটার আলাদা vector। Overlap রাখা হয় যাতে সীমানায় কেটে যাওয়া তথ্য দুই chunk-এই থাকে (সাধারণত ১০–২০%)। কোনো "জাদু সংখ্যা" নেই — ডেটার ধরন (আইন, কোড, FAQ, ticket) ও প্রশ্নের ধরনের উপর নির্ভর। পরীক্ষার পদ্ধতি: ১২৮/২৫৬/৫১২/১০২৪ token-এ index বানিয়ে একই golden set-এ hit-rate@k ও MRR তুলনা করুন; সবচেয়ে ভালোটা বাছুন। বেশি ছোট chunk-এ retrieval নির্ভুল কিন্তু প্রসঙ্গহীন; বেশি বড় chunk-এ প্রসঙ্গ আছে কিন্তু ঘোলা — তাই parent-child কৌশলও (১৪) জনপ্রিয় (অধ্যায় ৬)।</p>

<h3>১৪) Chunking-এর কৌশলগুলো কী কী? Parent-child retrieval কী?</h3>
<p><b>ব্যাখ্যা:</b> (১) <b>Fixed-size</b> — নির্দিষ্ট দৈর্ঘ্যে কাটা; সরল, কিন্তু বাক্য মাঝখানে কাটতে পারে। (২) <b>Recursive</b> — অনুচ্ছেদ → বাক্য → শব্দ ক্রমে ভাঙে; ভালো ডিফল্ট। (৩) <b>Structure-aware</b> — heading/ধারা/টেবিল/কোড-ব্লক অনুযায়ী (আইন, policy, API doc, Markdown-এর জন্য সেরা)। (৪) <b>Semantic</b> — embedding দিয়ে বিষয়-বদলের জায়গায় কাটা; ব্যয়বহুল। <b>Parent-child (small-to-big):</b> খোঁজার জন্য ছোট "child" chunk (নির্ভুল মিল) embed করা হয়, কিন্তু LLM-কে দেওয়া হয় তার বড় "parent" (পুরো অনুচ্ছেদ/section) — ফলে খোঁজা নির্ভুল আর প্রসঙ্গও পূর্ণ। প্রতিটা child-এ <code>parent_id</code> থাকে; match হলে parent তুলে আনা হয় (একাধিক child একই parent-এ গেলে ডুপ্লিকেট বাদ)। আরেকটা কৌশল: chunk-এর আগে section-শিরোনাম বা ডকুমেন্ট-সারাংশ জুড়ে embed (contextual chunk) — মূল্য: embedding/স্টোরেজ বেশি।</p>

<h3>১৫) প্রতিটা chunk-এর সাথে কোন metadata রাখবেন, আর কেন?</h3>
<pre>{ "doc_id", "chunk_index", "tenant_id", "acl_groups", "source", "section", "lang",
  "version", "effective_date", "updated_at", "content_hash", "embedding_model", "source_tier" }</pre>
<p><b>ব্যাখ্যা:</b> প্রতিটা ক্ষেত্রের কাজ: <code>doc_id</code>/<code>chunk_index</code> — আপডেট, মোছা, ক্রম; <code>tenant_id</code>/<code>acl_groups</code> — নিরাপত্তা-ফিল্টার; <code>source</code>/<code>section</code> — citation; <code>lang</code> — ভাষা-ফিল্টার; <code>version</code>/<code>effective_date</code> — পুরোনো নীতি বাদ দেওয়া; <code>content_hash</code> — অকারণ re-embed এড়ানো; <code>embedding_model</code> — model-বদলের সময় কোনটা কোন vector; <code>source_tier</code> — বিশ্বাসযোগ্যতা (poisoning-প্রতিরোধ)। metadata ছাড়া ফিল্টার, উৎস-উদ্ধৃতি, update/delete ও নিরাপত্তা — সবই কঠিন বা অসম্ভব হয়ে যায়। সতর্কতা: যে field দিয়ে ফিল্টার করবেন সেটায় index (payload/B-tree) থাকা চাই; আর PII metadata-তে রাখবেন না (অধ্যায় ১৫)।</p>

<h3>১৬) Embedding model কীভাবে বাছবেন?</h3>
<table>
<tr><th>মাপকাঠি</th><th>কী দেখবেন</th></tr>
<tr><td>ভাষা</td><td>বাংলা/মিশ্র ভাষা সমর্থন — multilingual model; নিজের ডেটায় পরীক্ষা</td></tr>
<tr><td>মান</td><td>MTEB/MIRACL-ধরনের benchmark শুরুর সংকেত মাত্র; <b>আসল সিদ্ধান্ত নিজের golden set-এ</b></td></tr>
<tr><td>Dimension ও খরচ</td><td>স্টোরেজ/মেমরি/গণনা; Matryoshka/কমানো সম্ভব?</td></tr>
<tr><td>Context দৈর্ঘ্য</td><td>সর্বোচ্চ token সীমা — chunk-এর আকারের সাথে মেলে?</td></tr>
<tr><td>Latency ও throughput</td><td>API round-trip বনাম self-host (GPU/CPU)</td></tr>
<tr><td>গোপনীয়তা ও লাইসেন্স</td><td>ডেটা বাইরে যায়? self-host করা যায়? বাণিজ্যিক লাইসেন্স?</td></tr>
<tr><td>স্থিতিশীলতা</td><td>provider ভার্সন বদলালে vector বদলে যায় — ভার্সন-পিন করা যায়?</td></tr>
</table>
<p><b>ব্যাখ্যা:</b> কার্যপদ্ধতি: ২–৩ প্রার্থী model বাছুন → একই chunk ও golden set-এ index → hit-rate@5, MRR, latency, খরচ তুলনা → সিদ্ধান্ত। সবচেয়ে বড় বা সবচেয়ে ব্যয়বহুল model সবসময় সেরা নয় — ছোট, সস্তা, দ্রুত model আপনার ডেটায় প্রায়ই যথেষ্ট। এবং মনে রাখুন model বদলানো ব্যয়বহুল (সব re-embed; ৩৮ নং প্রশ্ন), তাই শুরুতে যত্ন নিয়ে বাছুন (অধ্যায় ৩)।</p>

<h3>১৭) বাংলা ডেটা নিয়ে Vector DB/RAG বানালে বিশেষ কোন সতর্কতা?</h3>
<p><b>ব্যাখ্যা:</b> (১) <b>Tokenization:</b> বেশিরভাগ tokenizer ইংরেজি-ঘেঁষা, বাংলায় একটা শব্দ বহু token-এ ভাঙে — একই অর্থে বেশি token, ফলে chunk-এর "token-সীমা" ও খরচ ইংরেজির চেয়ে বেশি; chunk আকার token-এ মাপুন, অক্ষরে নয়। (২) <b>Model:</b> multilingual embedding model বাছুন এবং বাংলা প্রশ্ন + বাংলা/ইংরেজি ডকুমেন্টে মেপে দেখুন; cross-lingual খোঁজা (বাংলা প্রশ্ন, ইংরেজি ডকুমেন্ট) আলাদা পরীক্ষা করুন। (৩) <b>Unicode normalization:</b> একই অক্ষর একাধিকভাবে এনকোড হতে পারে (যুক্তাক্ষর, য-ফলা/র-ফলার ক্রম) — NFC normalize করে embed ও hybrid keyword index করুন, নইলে "দেখতে একই, আসলে ভিন্ন" লেখা মেলে না। (৪) <b>Hybrid-এ BM25:</b> বাংলার জন্য ভালো analyzer/stemming কম; নামে বানানভেদ (রাসেল/রাছেল) — keyword একা দুর্বল, তাই vector + keyword মিশ্রণ। (৫) <b>ডিজিট:</b> বাংলা ও ইংরেজি সংখ্যা (১০০ বনাম 100) — normalize বা উভয় রূপে খোঁজা। (৬) <b>মিশ্র ভাষা (Banglish):</b> কথোপকথনে বাংলা-ইংরেজি মিশ্রণ সাধারণ; মিশ্র প্রশ্ন সহ golden set রাখুন। (৭) <b>Reranker/LLM:</b> সেগুলোও বাংলা-সক্ষম কিনা যাচাই।</p>

<h3>১৮) Embedding-এর dimension কমালে কী হয়? Matryoshka embedding কী?</h3>
<pre>১০ লক্ষ vector:  ১৫৩৬-dim float32 = ৬.১৪৪ GB | ২৫৬-dim = ১.০২৪ GB (৬×) | ১৫৩৬-bit binary = ০.১৯২ GB (৩২×)</pre>
<p><b>ব্যাখ্যা:</b> সাধারণ model-এর vector প্রথম ২৫৬টা সংখ্যা কেটে নিলে অর্থ ভেঙে যায়। <b>Matryoshka Representation Learning</b>-এ train করা model-এ গুরুত্বপূর্ণ তথ্য শুরুর সংখ্যাগুলোতে জমা থাকে — তাই ছেঁটে (এবং আবার normalize করে) ছোট vector ব্যবহার করা যায় সামান্য মান হারিয়ে (OpenAI <code>text-embedding-3</code> সিরিজে <code>dimensions</code> প্যারামিটার)। ছোট dimension মানে কম স্টোরেজ, কম মেমরি, দ্রুত খোঁজা; দাম: সূক্ষ্ম পার্থক্য ধরার ক্ষমতা কিছুটা কমে। ভালো কৌশল: ছোট vector দিয়ে বেশি প্রার্থী (candidate) আনা, পূর্ণ vector দিয়ে rescore। কিন্তু সাধারণ (non-Matryoshka) model ছেঁটে ব্যবহার করবেন না (অধ্যায় ১৬)।</p>

<h3>১৯) Quantization কী? int8, binary ও product quantization — পার্থক্য ও সংখ্যা।</h3>
<pre>৫ কোটি × ৭৬৮ dim:
 float32 = ১৫৩.৬ GB | int8 = ৩৮.৪ GB | binary (১ বিট) = ৪.৮ GB
HNSW গ্রাফের অতিরিক্ত (M=16, মোটামুটি) ≈ ৬.৪ GB</pre>
<p><b>ব্যাখ্যা:</b> Quantization = প্রতিটা সংখ্যা কম বিটে রাখা, মেমরি কমানোর জন্য। <b>Scalar (int8):</b> float → ০–২৫৫ পূর্ণসংখ্যা (৪× ছোট), সামান্য নির্ভুলতা হারায়; <b>Binary:</b> প্রতিটা সংখ্যা ১ বিট (৩২× ছোট), Hamming দূরত্বে অত্যন্ত দ্রুত, কিন্তু একা নির্ভুলতা বেশ কম; <b>Product Quantization (PQ):</b> vector-কে ছোট ছোট অংশে ভেঙে প্রতিটা অংশ একটা "কোডবুক"-এর কোডে রূপ দেওয়া (১৬–৬৪×)। মূল কৌশল সবসময় <b>rescoring</b>: সস্তা সংকুচিত vector দিয়ে অনেক প্রার্থী (যেমন ১০০) → মূল float vector দিয়ে পুনর্বিন্যাস। আমাদের কৃত্রিম পরীক্ষায় binary-only recall@10 ছিল ~০.৩২, কিন্তু ১০০ প্রার্থী + rescore-এ ~০.৯৮ (অধ্যায় ১৬) — আপনার ডেটায় ভিন্ন হবে, মেপে দেখুন। ৫ কোটি × ৭৬৮ float32 ≈ ১৫৩.৬ GB আমরা সরল গুণ করে মিলিয়েছি (পূর্ণ vector ডিস্কে, সংকুচিত RAM-এ রাখলে খরচ বাঁচে) (অধ্যায় ৫)।</p>

<h3>২০) Embedding drift ও model update ঝুঁকি কী? Provider model আপডেট করলে কী ঘটে?</h3>
<p><b>ব্যাখ্যা:</b> কিছু hosted embedding model নীরবে আপডেট বা বন্ধ হতে পারে; ভার্সন বদলালে নতুন query-vector পুরোনো ডকুমেন্ট-vector-এর সাথে আর মেলে না (ভিন্ন "ম্যাপ") — ফল ধীরে বা হঠাৎ খারাপ। প্রতিরোধ: (১) নির্দিষ্ট model-ভার্সন পিন; (২) প্রতিটা record-এ <code>embedding_model</code> metadata; (৩) নিয়মিত golden-set regression চালানো যাতে নীরব অবনতি ধরা পড়ে; (৪) মডেল-বদলের পূর্ব-পরিকল্পনা (৩৮ নং — zero-downtime migration); (৫) সম্ভব হলে self-hosted model ভার্সন-নিয়ন্ত্রণের জন্য। আরেক ধরনের drift: <b>ডেটা-drift</b> — corpus ও প্রশ্নের বিষয় সময়ের সাথে বদলায় (নতুন পণ্য/পরিভাষা) → chunk/model পুরোনো ধারণা ধরে; মাসিক মূল্যায়ন ও নতুন প্রশ্ন golden set-এ যোগ (অধ্যায় ১৩, ১৪)।</p>

<h3>গ. Retrieval কৌশল ও তুলনা</h3>

<h3>২১) Hybrid search কেন লাগে? RRF কীভাবে কাজ করে — উদাহরণসহ।</h3>
<pre>dense র‍্যাঙ্ক : [d1, d2, d3]        sparse (BM25) র‍্যাঙ্ক : [d3, d1, d4]
RRF স্কোর = Σ 1 / (k + rank),  k = 60

d1 = 1/61 + 1/62 = 0.03252        d3 = 1/63 + 1/61 = 0.03227
d2 = 1/62        = 0.01613        d4 = 1/63        = 0.01587
চূড়ান্ত: d1, d3, d2, d4</pre>
<p><b>ব্যাখ্যা:</b> (সংখ্যা আমরা চালিয়েছি।) Dense vector অর্থ ও প্রতিশব্দে ভালো, কিন্তু হুবহু শব্দ (invoice নম্বর, পণ্যের কোড, নাম) মিস করে; BM25/keyword হুবহু শব্দে ভালো, কিন্তু প্রতিশব্দ ধরে না। Hybrid দুটোর শক্তি মেশায়। সমস্যা: দুই পদ্ধতির স্কোর একই স্কেলে নয় (cosine ০–১ বনাম BM25 অসীম) — সরাসরি যোগ করা যায় না। <b>RRF (Reciprocal Rank Fusion)</b> স্কোর বাদ দিয়ে শুধু <i>র‍্যাঙ্ক</i> ব্যবহার করে: প্রতিটা তালিকায় উপরে থাকলে বেশি পয়েন্ট, দুই তালিকায়ই থাকলে যোগ। <code>k=৬০</code> সংখ্যাটা একটা স্মুথিং ধ্রুবক — শীর্ষ র‍্যাঙ্কের একচেটিয়া আধিপত্য কমায়। উদাহরণে d1 ও d3 দুই তালিকায়ই আছে তাই শীর্ষে। বিকল্প: ওজনযুক্ত স্কোর (normalize করে), কিন্তু RRF সরল, শক্তিশালী ও টিউনিং-কম (অধ্যায় ৭)।</p>

<h3>২২) Reranking কী? Bi-encoder ও cross-encoder-এর পার্থক্য কী?</h3>
<pre>Bi-encoder   : query → vector, doc → vector (আলাদাভাবে, আগে থেকে)   → cosine   [দ্রুত, ANN-যোগ্য]
Cross-encoder: (query, doc) জোড়া একসাথে মডেলে → একটা স্কোর            [ধীর, কিন্তু অনেক নির্ভুল]</pre>
<p><b>ব্যাখ্যা:</b> Vector search (bi-encoder) দ্রুত কারণ doc-vector আগে থেকে বানানো থাকে, কিন্তু query ও doc পরস্পরকে "দেখে" না — শুধু আলাদা আলাদা সংক্ষেপ। Cross-encoder query আর doc-কে একসাথে পড়ে, শব্দে-শব্দে মিলিয়ে দেখে — বেশি নির্ভুল, কিন্তু প্রতিটা (query, doc) জোড়ায় আলাদা model-চালনা, তাই কোটি ডকুমেন্টে অসম্ভব। তাই <b>দুই-ধাপ:</b> (১) ANN/hybrid দিয়ে ~৫০–১০০ প্রার্থী (দ্রুত, recall-কেন্দ্রিক); (২) cross-encoder rerank করে শীর্ষ ৫ (নির্ভুলতা-কেন্দ্রিক)। এটা প্রায় সবসময় সবচেয়ে সস্তা বড় মান-উন্নতি। খরচ: প্রতি query-তে অতিরিক্ত ~১০০–৫০০ms ও model-ব্যবহার; প্রার্থী-সংখ্যা ও batch দিয়ে নিয়ন্ত্রণ (অধ্যায় ৭)।</p>

<h3>২৩) Metadata filtering-এ pre-filter বনাম post-filter — পার্থক্য ও ঝুঁকি?</h3>
<pre>২০,০০০ chunk, ১০% দৃশ্যমান, k=১০, ২০০ প্রশ্ন:
 Post-filter: গড় ০.৯৩৫টা ফল, ৭৬/২০০ প্রশ্নে শূন্য
 Over-fetch ২০০ → filter: গড় ১৯.৬২ (≥১০ পাওয়া: ৯৯%)
 Pre-filter: সবসময় ১০</pre>
<p><b>ব্যাখ্যা:</b> (সংখ্যা আমরা সিমুলেশনে পেয়েছি।) <b>Post-filter:</b> আগে ANN top-k, তারপর শর্ত না-মেলাগুলো বাদ — filter কঠোর হলে হাতে প্রায় কিছুই থাকে না, কারণ top-k অনুমতিহীন/অপ্রাসঙ্গিক ফলে ভরা ছিল। <b>Pre/In-filter:</b> শর্ত মেনে চলা সেটের ভেতরেই খোঁজা। কিন্তু ANN গ্রাফ-index-এ pre-filter সহজ নয়: গ্রাফ ঘোরার সময় filter-অমিল নোড পেরিয়ে যেতে হয় — কঠোর filter-এ গ্রাফ-সংযোগ ভেঙে recall কমে। ভালো ইঞ্জিন filter-aware traversal, payload index বা শর্তের সাথে index-কৌশল বদলায় (Qdrant), pgvector-এ কঠোর filter-এ <code>ef_search</code> বাড়ান বা partition/partial index ভাবুন; অতি-কঠোর (খুব কম ফলের) filter-এ brute-force-ই ভালো। সতর্কতা: নিরাপত্তা-ফিল্টার post-filter-নির্ভর হলে শুধু মান নয়, existence side-channel-ও আছে (অধ্যায় ৭, ১৫)।</p>

<h3>২৪) MMR কী? কেন দরকার?</h3>
<p><b>ব্যাখ্যা:</b> শুধু "সবচেয়ে কাছের" top-k নিলে প্রায়ই একই কথার ৫টা প্রায়-অভিন্ন chunk আসে — LLM-এর context নষ্ট, বৈচিত্র্য নেই, অন্য প্রাসঙ্গিক দৃষ্টিকোণ বাদ। <b>MMR (Maximal Marginal Relevance)</b> লোভীভাবে একটা একটা করে বাছে এমন chunk যেটা প্রশ্নের সাথে প্রাসঙ্গিক <i>এবং</i> আগে-বাছা chunk-গুলো থেকে ভিন্ন: <code>score = λ · sim(query, d) − (1 − λ) · max sim(d, আগে বাছা)</code>। λ=১ হলে সাধারণ top-k; λ কমালে বৈচিত্র্য বাড়ে (সাধারণত ০.৫–০.৮)। ব্যবহার: সারাংশ/গবেষণা-ধরনের প্রশ্নে, ডুপ্লিকেট-ঘন corpus-এ, সুপারিশে বৈচিত্র্যের জন্য। অসুবিধা: কিছু প্রাসঙ্গিকতা বিসর্জন। ডুপ্লিকেট আগে dedup করলে (অধ্যায় ১৬) MMR-এর প্রয়োজন কমে।</p>

<h3>২৫) Query transformation কী? HyDE, multi-query ও query decomposition ব্যাখ্যা করুন।</h3>
<p><b>ব্যাখ্যা:</b> ব্যবহারকারীর প্রশ্ন প্রায়ই ডকুমেন্টের ভাষা থেকে আলাদা (সংক্ষিপ্ত, অস্পষ্ট, কথোপকথনের ধরনে)। Query transformation খোঁজার আগে প্রশ্ন বদলে নেয়। <b>HyDE (Hypothetical Document Embeddings):</b> LLM দিয়ে প্রশ্নের একটা "কাল্পনিক উত্তর" লিখিয়ে সেটার vector দিয়ে খোঁজা — কারণ উত্তরের ভাষা ডকুমেন্টের ভাষার কাছাকাছি, প্রশ্নের চেয়ে বেশি। <b>Multi-query:</b> একটা প্রশ্ন থেকে ৩–৫টা ভিন্ন শব্দবিন্যাসের প্রশ্ন বানিয়ে সবগুলো চালানো, ফল RRF-এ মেলানো — recall বাড়ে। <b>Decomposition:</b> জটিল প্রশ্নকে উপ-প্রশ্নে ভাঙা ("আমাদের refund আর leave নীতির পার্থক্য" → দুটো আলাদা খোঁজা)। <b>Rewrite with history:</b> কথোপকথনে "তাহলে এটার সময়সীমা?" — আগের turn মিলিয়ে স্বয়ংসম্পূর্ণ প্রশ্ন বানানো। খরচ: প্রতিটায় অতিরিক্ত LLM call (latency, টাকা) এবং ঝুঁকি — LLM প্রশ্ন বিকৃত করতে পারে, কাল্পনিক উত্তর ভুল দিকে টানতে পারে। তাই মেপে প্রমাণ করুন, সবসময় চালু রাখবেন না (অধ্যায় ৭)।</p>

<h3>২৬) Vector Database বনাম Elasticsearch/OpenSearch বনাম SQL full-text — কখন কোনটা?</h3>

<tr><td>Hybrid</td><td>বেশিরভাগ এখন দেয়</td><td>স্বাভাবিক — এক সিস্টেমে BM25+vector</td><td>FTS + pgvector একই SQL-এ</td></tr>
<tr><td>Scale ও ফিচার</td><td>vector-বিশেষায়িত টিউনিং, quantization</td><td>বড় ecosystem, aggregation, logging-এ পরিচিত</td><td>সীমিত; ছোট–মাঝারি ডেটা</td></tr>
<tr><td>অপারেশন</td><td>আলাদা সিস্টেম (managed হলে সহজ)</td><td>ভারী cluster, JVM, টিউনিং</td><td>বিদ্যমান DB — কোনো নতুন সিস্টেম নয়</td></tr>
<tr><td>কখন</td><td>vector-কেন্দ্রিক ওয়ার্কলোড, বড় scale</td><td>আগে থেকেই Elastic ব্যবহার; keyword-ভারী + vector</td><td>PostgreSQL আছে, মাঝারি ডেটা, কম অপারেশনাল ঝামেলা</td></tr>
</table>
<p><b>ব্যাখ্যা:</b> কোনটা "সেরা" নয় — প্রেক্ষাপট। .NET/PostgreSQL টিমের জন্য সাধারণত pgvector (সাথে tsvector hybrid) প্রথম পছন্দ কারণ নতুন অবকাঠামো লাগে না, SQL join ও transaction একসাথে। আগে থেকে Elasticsearch-নির্ভর হলে তার vector সমর্থন। বিশাল scale বা বিশেষায়িত ফিচারে dedicated Vector DB (অধ্যায় ১১)।</p>

<h3>২৭) RAG, Fine-tuning ও Long-context — কখন কোনটা?</h3>
<pre>নতুন/বদলানো/ব্যক্তিগত জ্ঞান, উৎস-উদ্ধৃতি, অনুমতি → RAG
আচরণ/স্টাইল/ফরম্যাট/ডোমেইন-ভাষা শেখানো         → Fine-tuning
ছোট corpus, একবারের বিশ্লেষণ, সার্বিক সারসংক্ষেপ    → Long-context</pre>
<p><b>ব্যাখ্যা:</b> <b>RAG</b> জ্ঞান <i>বাহির থেকে</i> আনে: হালনাগাদ সহজ (chunk যোগ/মোছা), উৎস-উদ্ধৃতি, per-user অনুমতি, মডেল বদলাতে হয় না; দুর্বলতা — retrieval মিস করলে উত্তর নেই, সার্বিক প্রশ্নে সীমিত। <b>Fine-tuning</b> মডেলের <i>আচরণ</i> বদলায় (স্টাইল, নির্দিষ্ট ফরম্যাট, ডোমেইন-পরিভাষা) — নতুন তথ্য শেখানোর জন্য অকার্যকর/ঝুঁকিপূর্ণ (ভুলে যায়, hallucinate, হালনাগাদ কঠিন, উৎস দেখানো যায় না)। <b>Long-context</b> সরল (index নেই) কিন্তু প্রতি প্রশ্নে পুরো corpus পাঠানো — আমাদের হিসাবে ১ লাখ token বনাম RAG-এর ~২,৭০০ token মানে ~৩৭× token ও খরচ (কাল্পনিক দামে দিনে ১০ হাজার প্রশ্নে $১,০০০ বনাম $২৭), আর বড় context-এ মাঝের তথ্য দুর্বল ব্যবহৃত হয় ("lost in the middle")। বাস্তবে সংমিশ্রণ: RAG-এ ডেটা, fine-tuning-এ স্টাইল, RAG দিয়ে বেছে long-context-এ পূর্ণ ডকুমেন্ট (অধ্যায় ১৬)।</p>

<h3>২৮) RAG আর MCP-র সম্পর্ক কী? Vector DB-র সাথে MCP কীভাবে মেলে?</h3>
<pre>RAG → কী তথ্য মডেলকে দেখাবেন (জ্ঞানের কৌশল)
MCP → মডেল কীভাবে বাইরের সিস্টেমের সাথে যুক্ত হবে (সংযোগের protocol)

"আমাদের refund policy কী?"          → RAG (ডকুমেন্ট থেকে)
"Triplover-এর এই মাসের revenue?"    → MCP tool (live SQL/API)</pre>
<p><b>ব্যাখ্যা:</b> RAG একটা <b>technique</b>, MCP একটা <b>protocol</b> — একই স্তরের প্রতিযোগী নয়। সবচেয়ে সাধারণ মিলন: RAG-এর retrieval-টাকে একটা MCP tool হিসেবে expose করা (<code>search_policy_docs(query)</code>), যার ভেতরে embed → Vector DB search → rerank লুকানো; LLM শুধু tool-ই দেখে। ফলে একই agent policy ডকুমেন্ট (vector search) ও live accounting ডেটা (SQL tool) ও action (ইমেইল) — সব একই protocol-এ ব্যবহার করে (agentic RAG, অধ্যায় ১৬)। নিয়ম: লেখা/জ্ঞান থেকে উত্তর → RAG; সংখ্যা/live ডেটা/কাজ → MCP tool (নিখুঁত SQL, অনুমান নয়)। নিরাপত্তা: MCP-র মাধ্যমে vector search করলেও ব্যবহারকারীর পরিচয় server পর্যন্ত বহন করে ACL-ফিল্টার করতে হবে (অধ্যায় ১২, ১৫)।</p>

<h3>ঘ. ডাটাবেস ও টুল</h3>

<h3>২৯) pgvector, Qdrant ও Pinecone — কখন কোনটা বেছে নেবেন?</h3>
