<h3>৭. পদ্ধতি ৪ — Structure-Aware (ডকুমেন্টের নিজস্ব কাঠামো মেনে)</h3>
<p>অনেক ডকুমেন্টের কাঠামো আগে থেকেই আছে — Markdown heading, আইনের ধারা, API doc-এর endpoint, টেবিল। সেই কাঠামো উপেক্ষা করে অক্ষর গুনে কাটা মানে লেখকের দেওয়া সেরা সংকেত ফেলে দেওয়া।</p>
<h4>৭.১ Markdown heading-aware splitter</h4>
<pre>def split_markdown(md, max_chars=400, overlap=40):
    out, path, buf = [], [], []
    def flush():
        body = "\n".join(buf).strip()
        if body: out.append({"section": " &gt; ".join(path), "text": body})
        buf.clear()
    for line in md.splitlines():
        m = re.match(r"^(#{1,6})\s+(.*)", line)
        if m:                                              <span class="c"># heading পেলাম</span>
            flush()
            level = len(m.group(1))
            path[:] = path[:level - 1] + [m.group(2).strip()]   <span class="c"># heading-পথ (breadcrumb) হালনাগাদ</span>
        else:
            buf.append(line)
    flush()
    final = []
    for s in out:                                          <span class="c"># section যদি এখনও বড় — recursive-এ ভাঙো</span>
        if len(s["text"]) &lt;= max_chars: final.append(s)
        else:
            for part in split_recursive(s["text"], max_chars, overlap):
                final.append({"section": s["section"], "text": part})
    return final

md = """# HR Policy
## Leave
Annual leave 20 দিন। Sick leave 10 দিন।
## Expense
### Travel
Domestic travel-এ hotel limit 6,000 BDT/রাত।
### Meals
Daily meal allowance 1,500 BDT।
"""
split_markdown(md)
<span class="c"># {'section': 'HR Policy > Leave',            'text': 'Annual leave 20 দিন। Sick leave 10 দিন।'}
# {'section': 'HR Policy > Expense > Travel', 'text': 'Domestic travel-এ hotel limit 6,000 BDT/রাত।'}
# {'section': 'HR Policy > Expense > Meals',  'text': 'Daily meal allowance 1,500 BDT।'}</span></pre>
<p><b>দুটো বড় লাভ:</b> (১) chunk সবসময় একটা সম্পূর্ণ section — অর্থের সীমানা নিখুঁত। (২) প্রতিটা chunk-এর সাথে <b>breadcrumb</b> (<code>HR Policy &gt; Expense &gt; Travel</code>) পাওয়া গেল, যা metadata ও citation-এ কাজে লাগে, এবং পরের "contextual header" কৌশলে।</p>
<h4>৭.২ আইন/চুক্তি/নীতির ধারা</h4>
<p>"ধারা ৫", "৫.২(ক)", "Article 7", "Clause 3.1" — এগুলো regex দিয়ে চিনে প্রতিটা ধারাকে একটা chunk করুন। ধারা-নম্বর metadata-তে রাখুন (<code>clause: "5.2(a)"</code>), কারণ ব্যবহারকারী প্রায়ই "ধারা ৫.২ কী বলে?" বলে সরাসরি জিজ্ঞেস করে — তখন metadata filter + keyword খোঁজা vector-এর চেয়ে নিখুঁত (অধ্যায় ৭)। আর ধারার <b>সংজ্ঞা/ব্যতিক্রম</b> ("তবে শর্ত থাকে যে…") আলাদা chunk-এ কেটে গেলে অর্থ উল্টে যেতে পারে — এসব ক্ষেত্রে ধারাকে ভাঙবেন না, বরং parent-child (৯ নং অংশ) ব্যবহার করুন।</p>
<h4>৭.৩ টেবিল</h4>
<p>টেবিলকে সাধারণ লেখার মতো কাটলে কলামের শিরোনাম হারিয়ে যায় — "6,000" কোন কলামের মান বোঝা যায় না। কৌশল: <b>প্রতিটা সারিকে একটা chunk বানান এবং কলাম-শিরোনাম সহ সেটা লিখুন</b>, অথবা পুরো ছোট টেবিলকে একটা chunk (টেবিল বড় না হলে)।</p>
<pre>| শহর       | হোটেল limit (BDT/রাত) | Meal (BDT/দিন) |
| Dhaka     | 6,000                  | 1,500           |
| Chattogram| 5,000                  | 1,200           |

<span class="c"># ভুল chunk:   "| Dhaka | 6,000 | 1,500 |"                          ← সংখ্যাগুলো কিসের জানা নেই
# ভালো chunk:  "শহর: Dhaka; হোটেল limit (BDT/রাত): 6,000; Meal (BDT/দিন): 1,500"
#              + metadata: {table: "travel-limits", row: "Dhaka"}</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — টেবিলের মাঝখানে কাটা</span>
সারির মাঝে বা শিরোনাম ও ডেটার মাঝে কাটলে "Dhaka-র hotel limit কত?" প্রশ্নের উত্তরে শুধু সংখ্যা আসে, কলামের নাম আসে না — LLM ভুল কলাম ধরতে পারে। আর সংখ্যাভিত্তিক টেবিলে নিখুঁত উত্তর দরকার হলে (যেমন মোট, গড়) vector search নয়, টেবিলটাকে SQL ডেটা হিসেবে রেখে tool/MCP দিয়ে query করুন (AI কোর্সের MCP/RAG তুলনা)।</div>

<h3>৮. Contextual Header — chunk-কে নিজের পরিচয় দেওয়া</h3>
<h4>৮.১ সমস্যা</h4>
<p>"Domestic travel-এ hotel limit 6,000 BDT/রাত।" — এই chunk আলাদা করে পড়লে বোঝা যায় না এটা কোন কোম্পানির, কোন নীতির, কোন বছরের। আরও খারাপ: "এই সীমা অতিক্রম করলে অনুমোদন লাগবে" — "এই সীমা" কী? অথবা "পূর্ববর্তী ধারা অনুযায়ী…" — কোন ধারা? একটা chunk যত বেশি অন্য অংশের উপর নির্ভরশীল (pronoun, "উপরোক্ত", "এটা"), embedding তত দুর্বল।</p>
<h4>৮.২ সমাধান — Header prefix</h4>
<pre>def with_header(doc_title, section, text):
    return f"[{doc_title} | {section}]\n{text}"

with_header("HR Policy", "Expense &gt; Travel", "Domestic travel-এ hotel limit 6,000 BDT/রাত।")
<span class="c"># [HR Policy | Expense > Travel]
# Domestic travel-এ hotel limit 6,000 BDT/রাত।</span></pre>
<p>এখন embedding-এ "HR Policy", "Expense", "Travel" শব্দগুলো যোগ হলো — "HR-এর travel খরচের নিয়ম কী?" প্রশ্নের সাথে মিল বাড়ে। <b>মূল টেক্সট আর header আলাদা রাখুন:</b> embedding-এর জন্য header+টেক্সট, কিন্তু LLM-কে দেখানো/citation-এর জন্য মূল টেক্সট ও metadata আলাদা — নইলে একই header বারবার context জুড়ে token নষ্ট করে।</p>
<h4>৮.৩ আরও এগিয়ে — LLM দিয়ে প্রসঙ্গ লেখানো</h4>
<p>প্রতিটা chunk-এর জন্য একটা ছোট LLM call: "পুরো ডকুমেন্টের প্রেক্ষিতে এই অংশটা কোথায় বসে — ১-২ বাক্যে লেখো", সেই বাক্য chunk-এর সামনে জুড়ে embed করা (এই ধারণাটা কিছু প্রকাশনায় "contextual retrieval" নামে পরিচিত — আমি এর সুনির্দিষ্ট উন্নতির সংখ্যা এখানে দাবি করছি না; নিজের ডেটায় মেপে দেখুন)। এতে "এই সীমা" জাতীয় অস্পষ্ট chunk-ও নিজের পরিচয় পায়। মূল্য: ingestion-এ প্রতি chunk-এ একটা LLM call (খরচ ও সময়) — তাই এটা <b>একবারের</b> ingestion খরচ, query-র সময় নয়; আর prompt caching ব্যবহার করলে কমে। ছোট ডেটায় বা বাজেটে সীমিত হলে আগে সরল header, তারপর প্রয়োজনে LLM-context।</p>

<h3>৯. পদ্ধতি ৫ — Parent-Child (Small-to-Big)</h3>
<h4>৯.১ ধারণা</h4>
<p>Sentence-window-এর সাধারণীকরণ: ডকুমেন্টকে <b>দুই স্তরে</b> ভাগ করুন — বড় <b>parent</b> (পুরো section, ~৩০০–১০০০ token) এবং তার ভেতরের ছোট <b>child</b> (বাক্য-গুচ্ছ, ~১০০–২০০ token)। <b>শুধু child-গুলো embed ও index করুন</b> (ছোট, নিখুঁত vector)। খোঁজার পর child-এর <code>parent_id</code> ধরে <b>parent টেক্সট LLM-কে দিন</b> (পূর্ণ প্রসঙ্গ)।</p>
<div class="diagram"><pre>
  ডকুমেন্ট
   ├─ Parent P0 (section: Refund) ──── সংরক্ষিত (vector নেই), শুধু id→টেক্সট
   │     ├─ child C0  ─ vector ✔  (index-এ)
   │     ├─ child C1  ─ vector ✔
   │     └─ child C2  ─ vector ✔
   └─ Parent P1 (section: Approval)
         ├─ child C0 ✔   ├─ child C1 ✔   └─ child C2 ✔

  Query ──→ child vector খোঁজা ──→ top child ──→ parent_id ──→ P0 টেক্সট ──→ LLM
            (নির্ভুল)                                          (পূর্ণ প্রসঙ্গ)
</pre></div>
<h4>৯.২ কোড (চালানো)</h4>
<pre>class ParentChildStore:
    def __init__(self): self.parents, self.children = {}, []

    def add(self, doc_id, text, parent_size=300, child_size=100):
        for pi, parent in enumerate(split_recursive(text, parent_size, 0)):
            pid = f"{doc_id}#p{pi}"
            self.parents[pid] = parent                       <span class="c"># parent: শুধু সংরক্ষণ (vector লাগে না)</span>
            for ci, child in enumerate(split_recursive(parent, child_size, 0)):
                self.children.append({"id": f"{pid}#c{ci}", "parent_id": pid, "text": child})   <span class="c"># child: embed হবে</span>

    def expand(self, child_ids):
        by_id = {c["id"]: c for c in self.children}
        seen, out = set(), []
        for cid in child_ids:
            pid = by_id[cid]["parent_id"]
            if pid not in seen:                              <span class="c"># একই parent বারবার নয় — dedupe</span>
                seen.add(pid); out.append(self.parents[pid])
        return out

st = ParentChildStore(); st.add("pol", doc, 300, 100)
len(st.parents), len(st.children)        <span class="c"># → (2, 7)</span>
st.expand(["pol#p0#c0", "pol#p0#c1"])    <span class="c"># দুটো child → মাত্র ১টা parent (dedupe কাজ করেছে)</span></pre>
<h4>৯.৩ সংখ্যায় লাভ-ক্ষতি</h4>
<p>ধরুন parent = ৮০০ token, child = ১৫০ token (≈ ৫–৬টা child প্রতি parent), top-৫ child খুঁজলেন:</p>

<tr><th>পদ্ধতি</th><th>Index-এ vector</th><th>LLM-কে পাঠানো token (সর্বোচ্চ)</th></tr>
<tr><td>শুধু ছোট chunk (১৫০)</td><td>N</td><td>৫ × ১৫০ = ৭৫০ (প্রসঙ্গ কম)</td></tr>
<tr><td>শুধু বড় chunk (৮০০)</td><td>N/৫.৫ (কম) কিন্তু ঝাপসা vector</td><td>৫ × ৮০০ = ৪,০০০</td></tr>
<tr><td><b>Parent-child</b></td><td>N (child-ই) — নির্ভুল vector</td><td>৫ child ≤ ৫ parent = ≤ ৪,০০০; <b>তবে একই parent-এর child জমা হলে কম</b> (dedupe)</td></tr>

<h3>১০. পদ্ধতি ৬ — Semantic Chunking (অর্থ বদলালে কাটা)</h3>
<h4>১০.১ ধারণা ও পদ্ধতি</h4>
<p>এতক্ষণ আমরা <b>চিহ্ন</b> (অনুচ্ছেদ, দাঁড়ি, heading) দেখে কেটেছি। Semantic chunking <b>অর্থ</b> দেখে কাটে: (১) লেখাকে বাক্যে ভাগ, (২) প্রতিটা বাক্য embed, (৩) পাশাপাশি বাক্যের cosine similarity মাপা, (৪) যেখানে similarity হঠাৎ কমে (বিষয় বদলাল) সেখানে কাটা।</p>
<pre>def semantic_chunks(text, embed_fn, percentile=40):
    ss = sentences(text)
    V = [embed_fn(s) for s in ss]
    sims = [float(V[i] @ V[i + 1]) for i in range(len(V) - 1)]   <span class="c"># পাশাপাশি বাক্যের মিল</span>
    thr = np.percentile(sims, percentile)                          <span class="c"># সবচেয়ে কম মিলগুলোর সীমা</span>
    chunks, cur = [], [ss[0]]
    for i, s in enumerate(sims):
        if s &lt;= thr:                                               <span class="c"># বিষয় বদলাল → এখানে কাটো</span>
            chunks.append(" ".join(cur)); cur = []
        cur.append(ss[i + 1])
    chunks.append(" ".join(cur))
    return chunks, sims</pre>
<p>৬টা বাক্যের একটা নমুনা (refund ২টা, voucher ২টা, travel ২টা) — আমার চালানো ফল (এখানে একটা শিক্ষণীয় "খেলনা" embedder ব্যবহার করেছি যা কয়েকটা কী-ওয়ার্ডের ভিত্তিতে অর্থ ধরে; আসল model-এ সংখ্যা ভিন্ন হবে, কিন্তু কৌশলটা একই):</p>
<pre>পাশাপাশি বাক্যের মিল: [0.99, 0.00, 0.99, 0.01, 0.98]
                          ↑ refund→voucher এ ভাঙন     ↑ voucher→travel এ ভাঙন
chunk ১: Refund: টাকা ফেরত ৭ দিনে পাওয়া যাবে। Return হলে money back দেওয়া হবে।
chunk ২: Voucher posting: debit ও credit সমান হবে। Voucher posting-এর পর credit বদলানো যাবে না।
chunk ৩: Travel: hotel limit রাতে 6,000। Travel-এর hotel রাত ভিত্তিতে বুক হবে।</pre>

<h3>১১. নোংরা ডেটা সামলানো — PDF, OCR, Unicode</h3>
<p>পরিষ্কার Markdown পাওয়া বিলাসিতা। বাস্তবে ডেটা আসে PDF, স্ক্যান, Word, ইমেইল থেকে। "Garbage in, garbage out" এখানে সবচেয়ে সত্য — chunking-এর আগে পরিষ্কার না করলে সব কৌশলই ব্যর্থ।</p>
<h4>১১.১ PDF-এর সাধারণ সমস্যা</h4>

<h4>১১.২ OCR-এর ঝুঁকি</h4>
<p>OCR ভুল করে: "০" ↔ "O", "১" ↔ "l", বাংলা যুক্তাক্ষর ভাঙা, দাঁড়ি "।" ↔ "|"। ভুল token embedding-কে বিচ্যুত করে এবং BM25/keyword খোঁজাও মিস করে। কৌশল: OCR confidence কম এমন অংশ চিহ্নিত রাখা (metadata <code>ocr_conf</code>), গুরুত্বপূর্ণ ডকুমেন্টে মানুষের নমুনা-যাচাই, আর hybrid search-এ fuzzy match (অধ্যায় ৭)।</p>
<h4>১১.৩ বাংলার নির্দিষ্ট ঝুঁকি</h4>
<ul>
<li><b>পুরোনো ফন্ট এনকোডিং (Bijoy/ANSI)</b>: অনেক সরকারি/পুরোনো বাংলা PDF Unicode নয়, লেগাসি ফন্টে লেখা। টেক্সট extract করলে আবোল-তাবোল অক্ষর আসে (দেখতে ঠিক, কিন্তু কপি করলে ভুল)। <b>ingestion-এর আগে নমুনা extract করে চোখে দেখুন।</b> লেগাসি হলে কনভার্টার বা OCR ব্যবহার করুন।</li>
<li><b>Unicode normalization:</b> একই দৃশ্যমান অক্ষর একাধিক code point-ক্রমে লেখা যেতে পারে। যেমন "কো" = ক + ো (U+09CB), কিন্তু decomposed রূপে ক + ে + া — আমি চালিয়ে দেখেছি: দুটোর দৈর্ঘ্য ২ বনাম ৩, <code>==</code> মিথ্যা, কিন্তু <code>unicodedata.normalize("NFC", …)</code> করলে আবার সমান। না করলে একই শব্দ ভিন্ন token হয়ে BM25 ও exact-match filter মিস করে এবং embedding-ও সামান্য ভিন্ন হয়। তাই ingestion ও query <b>দুই দিকেই</b> একই normalization চালান।</li>
<li><b>Zero-width characters:</b> ZWJ/ZWNJ (U+200D/200C) বাংলা যুক্তাক্ষর/রেফে বৈধভাবে আসে, কিন্তু ZWSP (U+200B) প্রায়ই অনাকাঙ্ক্ষিত আবর্জনা — সাবধানে সরান (ZWJ/ZWNJ মুছলে শব্দের আকার বদলাতে পারে)।</li>
<li><b>সংখ্যা:</b> বাংলা (১২৩) ও ইংরেজি (123) অঙ্ক মিশে থাকলে exact খোঁজা মেলে না — প্রয়োজনে একটা canonical রূপও metadata/BM25 field-এ রাখুন।</li>
</ul>
<h4>১১.৪ পরিষ্কারের কোড (চালানো)</h4>
<pre>import re, unicodedata
from collections import Counter

def clean_pages(pages, min_ratio=0.5):
    lines_per_page = [set(l.strip() for l in p.splitlines() if l.strip()) for p in pages]
    cnt = Counter(l for s in lines_per_page for l in s)
    boiler = {l for l, c in cnt.items() if c / len(pages) &gt;= min_ratio}     <span class="c"># বেশিরভাগ পাতায় আছে = header/footer</span>
    out = []
    for p in pages:
        kept = [l for l in p.splitlines() if l.strip() not in boiler]
        t = unicodedata.normalize("NFC", "\n".join(kept))                 <span class="c"># Unicode স্বাভাবিকীকরণ</span>
        t = re.sub(r"(\w)-\n(\w)", r"\1\2", t)                            <span class="c"># "approv-\nal" → "approval"</span>
        t = re.sub(r"[ \t ]+", " ", t)                               <span class="c"># বাড়তি space</span>
        t = t.replace("​", "")                                       <span class="c"># zero-width space</span>
        out.append(t.strip())
    return out, boiler

pages = ["ACME Ltd — Confidential\nRefund নীতি: ৭ দিনের মধ্যে approv-\nal লাগবে।\nPage 1",
         "ACME Ltd — Confidential\nHotel limit  6,000 BDT।\nPage 2",
         "ACME Ltd — Confidential\nTax: VAT ১৫%।\nPage 3"]
clean_pages(pages, 0.6)
<span class="c"># boilerplate: {'ACME Ltd — Confidential'}
# ['Refund নীতি: ৭ দিনের মধ্যে approval লাগবে।\nPage 1', 'Hotel limit 6,000 BDT।\nPage 2', ...]
# লক্ষ্য: "Page 1/2/3" আলাদা লাইন বলে ধরা পড়েনি → আগে regex দিয়ে "^Page \d+$" মুছুন</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — পরিষ্কার না করেই embed</span>
প্রতিটা chunk-এর শুরুতে একই footer থাকলে সব vector একটা অভিন্ন "আবর্জনা-দিকে" সরে যায়; অনুসন্ধানে সব chunk-এর মধ্যে মিল কৃত্রিমভাবে বাড়ে এবং রিয়েল পার্থক্য ঝাপসা হয়। <b>পরিষ্কার করা chunking-এর আগে, পরে নয়।</b></div>

<h3>১২. কোড, JSON ও লগ chunking</h3>
<p>সোর্স কোডকে অক্ষর দিয়ে কাটলে ফাংশন মাঝখানে ভাঙে। কোডের কাঠামো (ফাংশন, ক্লাস) মেনে কাটুন — Python-এ <code>ast</code> মডিউলই যথেষ্ট (আমি চালিয়েছি):</p>
<pre>import ast

def chunk_python(src):
    tree = ast.parse(src); lines = src.splitlines(); out = []
    for node in tree.body:
        if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
            seg = "\n".join(lines[node.lineno - 1: node.end_lineno])
            out.append({"kind": type(node).__name__, "name": node.name, "line": node.lineno, "text": seg})
    return out
<span class="c"># FunctionDef vat 4 72
# ClassDef Voucher 8 107</span></pre>
<p>অন্যান্য ভাষায় tree-sitter-এর মতো parser ব্যবহার করা যায়। প্রতিটা chunk-এ <code>file_path</code>, <code>symbol</code>, <code>language</code> metadata রাখুন, আর ফাংশনের সাথে তার docstring/সিগনেচার একই chunk-এ রাখুন। JSON/API doc-এ প্রতিটা endpoint একটা chunk; লগে সময়-জানালা বা error-ঘটনা ধরে (stack trace ভাঙবেন না)।</p>

<h3>১৩. Chat, ticket ও ইমেইল থ্রেড</h3>
<p>কথোপকথনে অর্থ ছড়িয়ে থাকে <b>প্রশ্ন-উত্তর জোড়ায়</b> — একা "হ্যাঁ, মূল রসিদ লাগবে।" অর্থহীন; কিসের উত্তর তা আগের বার্তায়। তাই বার্তার একক-chunk নয়, <b>বার্তার জানালা</b> বা প্রশ্ন+উত্তর জোড়া একসাথে, বক্তা (role) সহ:</p>
<pre>def thread_windows(msgs, size=2, stride=1):
    return ["\n".join(f"{r}: {t}" for r, t in msgs[i:i + size])
            for i in range(0, len(msgs) - size + 1, stride)]

msgs = [("customer","আমার refund কবে পাব?"), ("agent","আপনার refund ৭ দিনে হবে।"),
        ("customer","রসিদ লাগবে?"), ("agent","হ্যাঁ, মূল রসিদ লাগবে।"), ("customer","ধন্যবাদ")]
thread_windows(msgs)
<span class="c"># 'customer: আমার refund কবে পাব?\nagent: আপনার refund ৭ দিনে হবে।'
# 'agent: আপনার refund ৭ দিনে হবে।\ncustomer: রসিদ লাগবে?'
# 'customer: রসিদ লাগবে?\nagent: হ্যাঁ, মূল রসিদ লাগবে।'
# 'agent: হ্যাঁ, মূল রসিদ লাগবে।\ncustomer: ধন্যবাদ'</span></pre>
<p>Metadata: <code>ticket_id</code>, <code>customer_id</code>, <code>role</code>, <code>timestamp</code>, <code>resolved</code> (সমাধান হয়েছে কিনা — সমাধানকৃত থ্রেড "similar past tickets" সুপারিশে বেশি মূল্যবান)। দীর্ঘ থ্রেডে সময়-ফাঁক (যেমন ২৪ ঘণ্টার বেশি) দেখলে নতুন chunk। আর ইমেইলে quoted-reply ("On ... wrote:") ও স্বাক্ষর ছেঁটে ফেলুন, নইলে একই লেখা বারবার embed হয়।</p>

<h3>১৪. Metadata নকশার কিছু গভীর নীতি</h3>
<ul>
<li><b>Filter করার ফিল্ড আলাদা, দেখানোর ফিল্ড আলাদা:</b> <code>dept</code>, <code>year</code>, <code>tenant_id</code> — filter-এর জন্য, তাই ছোট, নির্দিষ্ট মান (enum/সংখ্যা), বড় টেক্সট নয়। বড় টেক্সট payload-এ থাকে, কিন্তু filter-index করা হয় না।</li>
<li><b>High-cardinality filter</b> (যেমন <code>user_id</code> — লক্ষ মান): সব vector DB-তে সমান দ্রুত নয়; DB-র ডকুমেন্টেশন দেখে payload/ইনডেক্স বানান (অধ্যায় ৯, ১০)।</li>
<li><b>তারিখ সংরক্ষণ:</b> সংখ্যা (epoch) বা ISO তারিখ — রেঞ্জ filter (<code>$gte</code>) সংখ্যায় কাজ করে (অধ্যায় ৮-এ চালিয়ে দেখানো), স্ট্রিং তারিখে সবসময় নয়।</li>
<li><b>Metadata-কে embedding-এ মিশিয়ে ফেলবেন না:</b> "dept: finance" লিখে embed করলে শব্দটা অর্থে মেশে — কিন্তু নিখুঁত filter দরকার হলে metadata filter-ই নির্ভরযোগ্য। দুটো আলাদা কাজ: header = অর্থ-সংকেত, metadata = নিখুঁত শর্ত।</li>
<li><b>Schema-ভার্সন:</b> metadata ফিল্ড বদলালে পুরোনো record-এর সাথে মিশ্রণ সামলাতে <code>schema_version</code> রাখুন।</li>
</ul>

<h3>১৬. পরীক্ষা: নিজের ডেটায় chunk size কীভাবে বাছবেন</h3>
<p>"কোন chunk size সেরা?" — সার্বজনীন উত্তর নেই। ডেটা, প্রশ্নের ধরন ও embedding model ভেদে বদলায়। তাই <b>মেপে বাছুন</b>। পদ্ধতি:</p>
<ol>
<li><b>Golden set বানান:</b> ২০–১০০টা বাস্তব প্রশ্ন (ব্যবহারকারীর আসল লগ থেকে নেওয়া ভালো), প্রতিটার উত্তর যে লেখায় আছে তার স্ট্রিং চিহ্নিত।</li>
<li><b>প্রশ্নের ধরন মেশান:</b> এক-বাক্যে উত্তর, দুই-বাক্যে ছড়ানো উত্তর, সংখ্যা, তুলনা।</li>
<li><b>একটা চলক বদলান, বাকি সব স্থির:</b> chunk size (৬০/১২০/২৪০/৪৮০/৯৬০), overlap, কৌশল।</li>
<li><b>মাপুন:</b> hit@k (সঠিক উত্তর কি top-k chunk-এ আছে?), multi-fact সফলতা, <b>এবং খরচ</b> (গড় chunk আকার = LLM context খরচের প্রতিনিধি)।</li>
<li><b>ত্রুটি-বিশ্লেষণ:</b> ব্যর্থ প্রশ্নগুলো হাতে দেখুন — সীমানা কেটেছে? ঝাপসা? ভুল chunk র‍্যাঙ্কে উপরে?</li>
<li><b>পরিবর্তন সিদ্ধান্ত নিন, আবার মাপুন।</b></li>
</ol>
<p>আমি একটা ছোট পরীক্ষা চালিয়েছি: ৭৫৯ অক্ষরের একটা নীতিমালা (৮টা অনুচ্ছেদ), ১৩টা প্রশ্ন (১০টা এক-তথ্যের, ৩টা দুই-তথ্যের যেখানে উত্তরের দুটো অংশ একই chunk-এ থাকা দরকার), BM25 দিয়ে খোঁজা, recursive splitter (overlap = size-এর ১৫%):</p>
<pre>size  chunks  avg_chars  hit@1  hit@3  multi-hit@1
  60     18        44    1.00   1.00     0.33   ← দুই-তথ্যের প্রশ্ন ব্যর্থ: উত্তর দুই chunk-এ ভেঙেছে
 120      8       106    1.00   1.00     1.00   ← সেরা ভারসাম্য
 240      5       178    0.90   1.00     1.00   ← hit@1 একটু কমল: chunk-এ অন্য বিষয় মিশতে শুরু
 480      2       413    0.90   1.00     1.00
 960      1       759    1.00   1.00     1.00   ← 'hit' নিখুঁত, কিন্তু পুরো ডকুমেন্ট = কোনো বাছাই নেই!</pre>
<p><b>ফল পড়া:</b> (১) size ৬০-এ এক-তথ্যের প্রশ্ন নিখুঁত কিন্তু <b>দুই-তথ্যের প্রশ্ন মাত্র ৩৩%</b> — ছোট chunk প্রসঙ্গ হারায়। (২) size ১২০–২৪০ ভারসাম্যপূর্ণ। (৩) size ৯৬০-এ hit@1 = ১.০০ দেখে ধোঁকা খাবেন না — chunk সংখ্যা ১ মানে পুরো ডকুমেন্টই ফেরত যাচ্ছে (avg ৭৫৯ অক্ষর), retrieval আসলে কিছু বাছেনি; তাই <b>hit-rate-এর সাথে খরচ/আকার দেখা বাধ্যতামূলক</b>। (৪) hit@3 সব আকারে ১.০০ — ছোট corpus-এ top-3 প্রায় সবকিছু ধরে; এজন্য hit@1 ও multi-fact ভালো আলাদাকারী।</p>
<div class="callout mistake"><span class="tag">সতর্কতা — এই সংখ্যাগুলো সাধারণ নিয়ম নয়</span>
এটা ১৩ প্রশ্ন, ৭৫৯ অক্ষর, BM25 (dense নয়) — শুধু <b>পদ্ধতিটা</b> দেখানোর জন্য। আপনার ডেটায় আসল embedding model, ডজন-শত প্রশ্ন ও বড় corpus দিয়ে একই পরীক্ষা চালান; অধ্যায় ১৩-তে আরও পূর্ণাঙ্গ evaluation (recall@k, MRR, nDCG) আছে।</div>

<h3>১৭. Common ভুল — একসাথে</h3>
<div class="callout mistake"><span class="tag">ভুল — chunk নিজে না পড়ে শুধু সংখ্যা দেখা</span>
উপরের দুটো বাগ (separator হারানো, শব্দের মাঝে overlap) কোনো metric ধরত না — ধরা পড়েছে chunk চোখে পড়ে। ingestion-এর পর <b>র‍্যান্ডম ২০টা chunk পড়ে দেখুন</b>।</div>
<div class="callout mistake"><span class="tag">ভুল — এক সাইজ সব ডেটায়</span>
FAQ (ছোট প্রশ্ন-উত্তর), আইনি ধারা (লম্বা, নির্ভরশীল), chat (ছোট বার্তা), কোড (ফাংশন) — প্রতিটার জন্য আলাদা কৌশল ও আকার। এক collection-এ মিশিয়ে এক নিয়মে কাটলে সবটাই মাঝারি হয়।</div>
<div class="callout mistake"><span class="tag">ভুল — ID/hash ছাড়া ingestion</span>
প্রতিবার সব মুছে আবার ঢোকানো কাজ করে — কিন্তু বড় ডেটায় খরচ ও downtime; আংশিক আপডেটে ডুপ্লিকেট বা stale chunk। ডিটারমিনিস্টিক id + content_hash প্রথম দিন থেকে।</div>
<div class="callout mistake"><span class="tag">ভুল — Query ও document-এর ভিন্ন প্রক্রিয়া</span>
ingestion-এ NFC normalization, header prefix, lowercase করলেন; query-তে করলেন না — মিল নীরবে কমে। দুই দিকে একই প্রি-প্রসেসিং (embedding model যা প্রত্যাশা করে — কিছু model query-তে আলাদা prefix চায়, যেমন "query:"/"passage:" — model card দেখুন)।</div>
<div class="callout mistake"><span class="tag">ভুল — অতিরিক্ত overlap</span>
৫০% overlap = খরচ ২×, এবং retrieval-এ প্রায়-ডুপ্লিকেট chunk। ১০–২০% বা structure-aware দিয়ে overlap-ই কম লাগে।</div>
<div class="callout mistake"><span class="tag">ভুল — metadata-য় অ্যাক্সেস-অধিকার না রাখা</span>
পরে যোগ করা কঠিন — সব record আবার লিখতে হয়। শুরু থেকে <code>tenant_id</code>/<code>acl</code> রাখুন (অধ্যায় ১৪, ১৫)।</div>
<div class="callout best"><span class="tag">Best practice — প্রস্তাবিত শুরুর রেসিপি</span>
(১) পরিষ্কার + NFC → (২) structure-aware split (heading থাকলে) নয়তো recursive (বাংলা দাঁড়িসহ) → (৩) প্রতিটা chunk-এ contextual header → (৪) ১০–২০% overlap → (৫) ডিটারমিনিস্টিক id + content_hash + metadata (doc_id, section, lang, tenant, acl, embedding_model) → (৬) লম্বা নথিতে parent-child → (৭) golden set দিয়ে size/কৌশল মেপে টিউন → (৮) র‍্যান্ডম chunk চোখে যাচাই।</div>

<div class="callout why"><span class="tag">সংক্ষেপে মনে রাখুন</span>
(১) <b>একটা vector = একটা অর্থ</b> — লম্বা লেখা মেশালে ঝাপসা গড় (cos ১.০ → ০.৭১); তাই chunking। (২) <b>Record schema</b> প্রথম দিনেই ভাবুন: ডিটারমিনিস্টিক id, doc_id, content_hash, embedding_model, tenant/acl। (৩) <b>Overlap-এর খরচ আছে</b>: গুণক = size ÷ (size − overlap); ১০–২০% যথেষ্ট। (৪) <b>Recursive</b> ডিফল্ট; বাংলায় দাঁড়ি (<code>"। "</code>) separator-এ রাখুন। (৫) <b>Structure-aware + contextual header</b> প্রায় সবসময় লাভজনক; <b>parent-child</b> প্রসঙ্গ ও নির্ভুলতা দুটোই দেয়। (৬) <b>পরিষ্কার আগে</b> — PDF header/footer, hyphenation, NFC, লেগাসি বাংলা ফন্ট। (৭) <b>মেপে বাছুন</b>: golden set + hit@k + multi-fact + খরচ — আর chunk নিজে পড়ে দেখুন। (৮) এই ডেটা-সাজানোই পরের অধ্যায়গুলোর (retrieval, evaluation, production) ভিত্তি।</div>

<h2 class="title">৭. Retrieval কৌশল — Filter, Hybrid Search, Rerank, MMR, Query Transformation</h2>
<p class="lead">"Vector DB-তে সবচেয়ে কাছের k টা vector খোঁজো" — এটা retrieval-এর <b>প্রথম ধাপ মাত্র</b>। বাস্তব সিস্টেমে ভালো উত্তর আসে একটা <b>পাইপলাইন</b> থেকে: প্রশ্ন বদলানো → প্রার্থী (candidate) আনা (বিভিন্ন উপায়ে) → মেলানো → পুনরায় সাজানো → বৈচিত্র্য আনা → LLM-এর budget-এ ঢোকানো। প্রতিটা ধাপ একটা নির্দিষ্ট ব্যর্থতার প্রতিকার, আর প্রতিটার একটা মূল্য (latency, খরচ, জটিলতা) আছে। এই অধ্যায়ে প্রতিটা কৌশল খুলে দেখব: <i>কেন লাগে, ভেতরে কীভাবে কাজ করে, সংখ্যায় কেমন, কোথায় ভাঙে, কখন মূল্য দেওয়ার যোগ্য</i>।</p>

<div class="callout why"><span class="tag">কেন এই অধ্যায়</span>
শুধু "top-k cosine" দিয়ে শুরু করা ঠিক — কিন্তু সেখানেই থেমে থাকলে চারটা পরিচিত সমস্যা আসবেই: (১) "INV-2042"-এর মতো হুবহু শব্দে vector ভুল করে, (২) "রিফান্ড চাই" লিখলে keyword search কিছুই পায় না, (৩) একই তথ্যের পাঁচটা কাছাকাছি chunk top-5 দখল করে নেয়, (৪) প্রাসঙ্গিক কিছু না থাকলেও সিস্টেম "সবচেয়ে কাছের" একটা কিছু ফেরত দেয়। এই অধ্যায়ের প্রতিটা কৌশল এদেরই একটা না একটার সমাধান। শেষে আপনি জানবেন কোন সমস্যায় কোন কৌশল, আর কোনটা latency-র দাম দেওয়ার যোগ্য।</div>

<h3>২. Top-k ও Similarity Threshold — "সবসময় কিছু একটা ফেরত দেওয়া" সমস্যা</h3>
<h4>২.১ সমস্যাটা</h4>
<p>Vector search একটা <b>র‍্যাঙ্কিং</b> ফেরত দেয়, "মিলেছে/মেলেনি" সিদ্ধান্ত নয়। ডেটাবেসে প্রাসঙ্গিক কিছু না থাকলেও সে "তুলনামূলক সবচেয়ে কাছের" k টা দেবে। RAG-এ সেই আজেবাজে chunk LLM-কে দিলে সে হয় বিভ্রান্ত হয়, নয়তো সেই অপ্রাসঙ্গিক লেখা থেকেই "উত্তর বানায়" (hallucination)।</p>
<h4>২.২ সংখ্যায় দেখা (খেলনা embedder দিয়ে — শুধু আচরণ বোঝাতে)</h4>
<p>আমাদের ৮-ডকুমেন্টের নমুনা corpus-এ ছয়টা in-scope প্রশ্ন (policy/invoice সংক্রান্ত) আর চারটা out-of-scope প্রশ্ন ("আজকের আবহাওয়া কেমন", "ক্রিকেট ম্যাচের স্কোর"…) চালিয়ে সর্বোচ্চ (top-1) cosine মান নিলাম:</p>
<pre>in-scope  প্রশ্নের top-1 স্কোর: [0.987, 0.945, 0.943, 0.983, 0.991, 0.973]
out-scope প্রশ্নের top-1 স্কোর: [0.088, 0.126, 0.169, 0.126]

threshold=0.1 → in-scope রাখল 100%, কিন্তু out-of-scope ভুলে রাখল 75%   ← খুব নিচু
threshold=0.3 → in-scope রাখল 100%, out-of-scope ভুলে রাখল 0%           ← পরিষ্কার পার্থক্য</pre>
<div class="callout mistake"><span class="tag">সতর্কতা — এটা খেলনা; আপনার মডেলে ছবি ভিন্ন হবে</span>
এই embedder কৃত্রিম, তাই দুই দলের স্কোর অতি-পরিষ্কারভাবে আলাদা। আসল embedding model-এ in-scope ও out-of-scope স্কোরের পরিসর <b>ওভারল্যাপ</b> করে (যেমন সঠিক উত্তরের স্কোর ০.৫৫ কিন্তু অপ্রাসঙ্গিকের ০.৫০)। তাছাড়া প্রতিটা model-এর স্কোরের "স্কেল" আলাদা — কোনোটায় সবকিছুই ০.৭-এর উপরে, কোনোটায় ভালো মিলও ০.৪। <b>তাই "০.৭ সার্বজনীন সীমা" বলে কিছু নেই।</b></div>
<h4>২.৩ Threshold ক্যালিব্রেট করার পদ্ধতি</h4>
<ol>
<li>গোল্ডেন প্রশ্নের দুটো দল বানান: <b>in-scope</b> (উত্তর আছে) এবং <b>out-of-scope</b> (উত্তর নেই — আবহাওয়া, বেমানান প্রশ্ন, আপনার ডেটার বাইরের বিষয়)।</li>
<li>প্রতিটার top-1 স্কোর (বা সঠিক chunk-এর স্কোর) সংগ্রহ করুন।</li>
<li>দুই বণ্টনের histogram দেখুন; threshold এমনভাবে বাছুন যাতে ব্যবসার কাছে গ্রহণযোগ্য ভারসাম্য আসে:
  <ul><li>উঁচু threshold → অপ্রাসঙ্গিক কম, কিন্তু সঠিক উত্তরও কখনো কেটে যায় ("জানি না" বেশি)।</li>
  <li>নিচু threshold → কিছু সঠিক উত্তর বাঁচে, কিন্তু আজেবাজে context ঢোকে।</li></ul></li>
<li>Threshold-এর নিচে সব পড়লে <b>স্পষ্ট ফলব্যাক</b>: "এ বিষয়ে তথ্য পাওয়া যায়নি", বা মানুষের কাছে হস্তান্তর, বা (নিরাপদ হলে) সাধারণ জ্ঞানে উত্তর — কিন্তু সেটা ব্যবহারকারীকে জানিয়ে।</li>
</ol>
<h4>২.৪ Absolute ছাড়াও আরও দুটো উপায়</h4>
<table>
<tr><th>উপায়</th><th>কীভাবে</th><th>কখন ভালো</th></tr>
<tr><td>Absolute threshold</td><td>স্কোর ≥ T</td><td>স্কোর-স্কেল স্থির (একই model, একই metric)</td></tr>
<tr><td>Relative threshold</td><td>স্কোর ≥ (top-1 স্কোর − δ) অথবা ≥ ρ × top-1</td><td>স্কোর-স্কেল প্রশ্নভেদে বদলায়</td></tr>
<tr><td>Dynamic-k (score gap / "elbow")</td><td>স্কোর-তালিকায় সবচেয়ে বড় ফাঁকে কাটা</td><td>কখনো ১টা chunk-ই উত্তর, কখনো ৫টা দরকার</td></tr>
</table>
<pre>def cut_by_gap(scores, min_k=1, max_k=10, min_gap=0.15):
    s = sorted(scores, reverse=True)[:max_k]
    if len(s) &lt;= min_k: return len(s)
    gaps = [(s[i] - s[i + 1], i + 1) for i in range(min_k - 1, len(s) - 1)]   <span class="c"># (ফাঁক, এখানে কাটলে কয়টা থাকবে)</span>
    gap, k = max(gaps)
    return k if gap &gt;= min_gap else len(s)       <span class="c"># স্পষ্ট ফাঁক না থাকলে কাটব না</span>

cut_by_gap([0.91, 0.89, 0.88, 0.41, 0.39, 0.38])   <span class="c"># → 3   (০.৮৮ → ০.৪১ বড় ফাঁক: প্রথম ৩টাই প্রাসঙ্গিক)</span>
cut_by_gap([0.62, 0.60, 0.59, 0.58, 0.57])         <span class="c"># → 5   (সব প্রায় সমান — কাটার কারণ নেই)</span>
cut_by_gap([0.95, 0.50, 0.48, 0.47])               <span class="c"># → 1   (একটাই স্পষ্ট বিজয়ী)</span></pre>
<div class="callout behind"><span class="tag">পর্দার পেছনে — আমার প্রথম সংস্করণের বাগ</span>
প্রথমে <code>min_gap</code> ছিল না: স্কোর সব প্রায় সমান হলে (০.৬২, ০.৬০, ০.৫৯…) "সবচেয়ে বড় ফাঁক" তবুও একটা থাকে (০.০২) — ফাংশন সেখানেই কেটে মাত্র ১টা chunk ফেরত দিত। শিক্ষা: "সর্বোচ্চ ফাঁকে কাটো" নিয়মটা ফাঁকের <b>বাস্তব আকার</b> না দেখলে ভুল সংকেত দেয়। সবসময় ন্যূনতম গুরুত্বপূর্ণ ফাঁকের সীমা রাখুন।</div>

<h3>৩. Metadata Filtering — Pre-filter, Post-filter ও In-filter</h3>
<h4>৩.১ তিন ধরন</h4>
<div class="diagram"><pre>
 POST-filter:   [ANN: সবার মধ্যে top-F খোঁজো] ──→ [তারপর filter প্রয়োগ] ──→ k-এর কম ফল ফেরত আসতে পারে ✗
 PRE-filter:    [আগে filter-এ মেলা vector-এর সেট বের করো] ──→ [শুধু ওদের মধ্যে খোঁজো]   (সঠিক, কিন্তু ANN index সরাসরি কাজ নাও করতে পারে)
 IN-filter:     [ANN গ্রাফ চলার সময়ই প্রতিটা প্রার্থীকে filter-এ যাচাই] ──→ k ফল সঠিক ✓ (আধুনিক DB-র লক্ষ্য)
</pre></div>
<h4>৩.২ Post-filter কেন ফল হারায় — সংখ্যায় (আমি চালিয়েছি)</h4>
<p>১০,০০০ র‍্যান্ডম vector (৩২ মাত্রা), যার মাত্র <b>~৫% (৪৯৮টা)</b> tenant "A"-র। প্রশ্ন একটা র‍্যান্ডম vector; আমরা tenant A-র সেরা ১০ চাই।</p>
<pre>post-filter: প্রথমে ANN থেকে top-F আনি, তারপর tenant=A রাখি

  F = 10    → ফল পেলাম  1 টা   (আশা: ১০ × ০.০৫ ≈ ০.৫)
  F = 50    → ফল পেলাম  2 টা   (আশা: ৫০ × ০.০৫ = ২.৫)
  F = 200   → ফল পেলাম  9 টা   (আশা: ২০০ × ০.০৫ = ১০)
  F = 1000  → ফল পেলাম 10 টা   (১০০০ × ০.০৫ = ৫০ → ১০ বাছা গেল)

pre-filter (আগে tenant=A, তারপর সেরা ১০) → 10 টা, সবসময়
F=200 হলেও সত্যিকারের সেরা ১০-এর সাথে মিল: 9/10</pre>
<p><b>সূত্র:</b> প্রত্যাশিত ফল ≈ <code>F × s</code> (s = filter-এর selectivity, মানে কত ভগ্নাংশ ডেটা শর্ত মানে)। k টা ফল নিশ্চিত করতে হলে <code>F ≥ k ÷ s</code> লাগবে। s = ০.০৫, k = ১০ → F ≥ ২০০; কিন্তু s = ০.০০১ (লাখে ১০০টা) হলে F ≥ ১০,০০০ — ANN-কে অত প্রার্থী আনতে বললে তার গতির সুবিধাই চলে যায়।</p>
<div class="callout behind"><span class="tag">পর্দার পেছনে — Filter কঠোর হলে brute-force-ই সস্তা</span>
Selectivity ০.০৫-এ ১০,০০০ থেকে ৪৯৮টা vector মেলে। সেই ৪৯৮টার মধ্যে <b>exact</b> খোঁজা (৪৯৮ × ৩২ গুণ) প্রায় তাৎক্ষণিক, ১০০% নিখুঁত — আর ANN index-এর চেয়েও দ্রুত হতে পারে। তাই ভালো vector DB filter কতটা কঠোর তা দেখে কৌশল বদলায়: <b>কঠোর filter → filter-এ মেলা সেটে সরাসরি exact scan; ঢিলা filter → ANN-এর ভেতরে in-filter</b>। কিছু engine (যেমন Qdrant) payload index ও filter-সচেতন গ্রাফ-ভ্রমণ দিয়ে এটা স্বয়ংক্রিয়ভাবে করে; pgvector-এ সাধারণ filter সম্ভবত post-filter-এর মতো আচরণ করে এবং এর জন্য আলাদা কৌশল (partial index, partition, iterative scan — অধ্যায় ৯) ব্যবহার করতে হয়। এসব ডিটেইল DB ও version অনুযায়ী বদলায়, তাই ডকুমেন্টেশন দেখুন।</div>
<h4>৩.৩ In-filter-এর নিজস্ব সমস্যা — গ্রাফ ছিঁড়ে যাওয়া</h4>
<p>HNSW গ্রাফে প্রতিটা নোড কাছের কয়েকটা নোডের সাথে যুক্ত। Filter-এ মেলে না এমন নোডগুলো "বাদ" ধরলে (selectivity খুব কম হলে) যে নোডগুলো বাকি থাকে সেগুলো পরস্পরের সাথে সংযুক্ত নাও থাকতে পারে — গ্রাফ-ভ্রমণ কোনো প্রাসঙ্গিক নোডে পৌঁছায় না, যদিও সেটা আছে। ফলে ফল কম আসে বা recall কমে। প্রতিকার: payload-index (filter-ফিল্ডের জন্য), কঠোর filter-এ exact fallback, এবং tenant-ভিত্তিক আলাদা index/partition (অধ্যায় ১৪)।</p>

<h4>৪.২ BM25 — ভেতরে কীভাবে কাজ করে</h4>
<p><b>ধারণা:</b> একটা ডকুমেন্ট প্রশ্নের সাথে কতটা মেলে তা নির্ভর করে তিনটা জিনিসের উপর: (১) <b>TF</b> — প্রশ্নের শব্দ ডকুমেন্টে কতবার আছে (কিন্তু বারবার বললে সুবিধা কমতে থাকে — saturation), (২) <b>IDF</b> — শব্দটা কত বিরল (বিরল শব্দ বেশি গুরুত্বপূর্ণ: "INV-2042" > "BDT"), (৩) <b>দৈর্ঘ্য-স্বাভাবিকীকরণ</b> — লম্বা ডকুমেন্টে শব্দ বেশি থাকার সুযোগ বেশি, তাই লম্বা ডকুমেন্টকে সামান্য শাস্তি।</p>
<pre>score(D, Q) = Σ (প্রশ্নের প্রতিটা শব্দ w)   IDF(w) × [ tf × (k1 + 1) ] ÷ [ tf + k1 × (1 − b + b × |D| / avgdl) ]

IDF(w) = ln( (N − df + 0.5) / (df + 0.5) + 1 )     <span class="c"># N = মোট ডকুমেন্ট, df = যে ডকুমেন্টে w আছে</span>
k1 ≈ 1.2–2.0 (TF saturation), b ≈ 0.75 (দৈর্ঘ্য-শাস্তির মাত্রা)</pre>
<h4>৪.৩ হাতে হিসাব — আমাদের নমুনা corpus-এ ("INV-2042" প্রশ্ন, ডকুমেন্ট d4)</h4>
<pre>corpus: N = 8 ডকুমেন্ট, গড় দৈর্ঘ্য avgdl = 8.625 token
d4 = "Invoice INV-2042 amount 3,10,000 BDT customer Skyline"
   token: [invoice, inv-2042, amount, 3,10,000, bdt, customer, skyline]  → |D| = 7

"inv-2042" শব্দটা মাত্র ১টা ডকুমেন্টে (df = 1)  →  IDF = ln((8−1+0.5)/(1+0.5)+1) = ln(6) = 1.7918
tf = 1,  k1 = 1.5,  b = 0.75
TF-অংশ = 1 × 2.5 ÷ [1 + 1.5 × (0.25 + 0.75 × 7/8.625)] = 2.5 ÷ 2.288 = 1.0926
স্কোর  = 1.7918 × 1.0926 = 1.9577                          <span class="c"># কোড চালিয়ে ঠিক এই মানই এসেছে</span>

তুলনা: "bdt" আছে ৩টা ডকুমেন্টে (IDF = 0.944), "invoice" ২টায় (IDF = 1.281)
        → বিরল শব্দ ("inv-2042", IDF 1.79) সাধারণ শব্দের চেয়ে স্পষ্টত বেশি ওজন পায়</pre>
<h4>৪.৪ কোড — হাতে লেখা BM25 (চালানো ও rank-bm25 লাইব্রেরির সাথে ranking মিলিয়ে দেখা)</h4>
<pre>import math, re
from collections import Counter

def tok(t):                                            <span class="c"># বাংলা + ইংরেজি + সংখ্যা/ID টোকেন</span>
    return re.findall(r"[A-Za-z0-9\-,]+|[ঀ-৿]+", t.lower())

class BM25:
    def __init__(self, docs, k1=1.5, b=0.75):          <span class="c"># docs = {id: text}</span>
        self.ids = list(docs); self.toks = [tok(docs[i]) for i in self.ids]
        self.k1, self.b = k1, b
        self.N = len(self.toks); self.avgdl = sum(map(len, self.toks)) / self.N
        self.df = Counter(w for t in self.toks for w in set(t))
    def idf(self, w):
        n = self.df.get(w, 0)
        return math.log((self.N - n + 0.5) / (n + 0.5) + 1)
    def score(self, q):
        qs = tok(q); out = {}
        for i, t in zip(self.ids, self.toks):
            tf = Counter(t); s = 0.0
            for w in qs:
                if w not in tf: continue
                f = tf[w]
                s += self.idf(w) * f * (self.k1 + 1) / (f + self.k1 * (1 - self.b + self.b * len(t) / self.avgdl))
            out[i] = s
        return out</pre>
<p><code>rank-bm25</code> লাইব্রেরির <code>BM25Okapi</code> সামান্য ভিন্ন IDF সূত্র ব্যবহার করে (Lucene-ধাঁচের "+১" ছাড়া), তাই <b>স্কোরের পরম মান ভিন্ন</b> — কিন্তু আমি দুটো প্রশ্নে চালিয়ে দেখেছি র‍্যাঙ্কিং হুবহু একই (<code>INV-1042 amount → [d3, d4]</code>, <code>approval manager → [d7]</code>)। র‍্যাঙ্কিংই এখানে মূল।</p>
<div class="callout mistake"><span class="tag">Common mistake — BM25-তে বাংলা টোকেনাইজেশন</span>
বাংলা এক-শব্দের বহু রূপ হয়: "ফেরত", "ফেরতের", "ফেরতযোগ্য"। শব্দ-ভিত্তিক BM25 এগুলোকে আলাদা শব্দ ধরে। আমি চালিয়ে দেখেছি: ডকুমেন্টে "ফেরতের নিয়ম ও শর্ত" আছে; প্রশ্ন "ফেরত" → <b>কোনো ফল নেই</b> (<code>[]</code>), প্রশ্ন "ফেরতের" → মেলে। সমাধান:
<ul><li><b>Stemming/lemmatization</b> (বাংলার জন্য ভালো টুল সীমিত — আপনার লাইব্রেরি বাছুন ও যাচাই করুন)।</li>
<li><b>Character n-gram</b> টোকেন (অভাষা-নির্ভর): শব্দকে ৩-অক্ষরের টুকরোয় ভাঙা।</li></ul>
Character 3-gram দিয়ে একই ডকুমেন্টে প্রশ্ন "ফেরত"-এর টোকেন <code>['#ফে', 'ফের', 'েরত', 'রত#']</code> — আর "ফেরতের"-এর সাথে এদের বেশিরভাগ মেলে; ফল: <code>x1</code> স্কোর ২.৯৭, বাকিরা ০.০০। মূল্য: index বড় হয়, কিছু অপ্রাসঙ্গিক মিল আসে (ছোট শব্দে) — তাই n-gram BM25 সাধারণত word-BM25-এর পাশাপাশি বা fuzzy fallback হিসেবে।</div>

<h4>৪.৫ Dense আর Sparse মেলানো — Fusion</h4>
<p>দুই তালিকা থেকে একটা তালিকা বানাতে হবে। সরল ধারণা: স্কোর যোগ করা। সমস্যা: <b>স্কোরের স্কেল আলাদা</b> — BM25 ০ থেকে ২০+ হতে পারে, cosine −১ থেকে ১। যোগ করলে একজন অন্যজনকে ডুবিয়ে দেয়। Min-max normalization (প্রতিটা তালিকা ০-১ করা) সম্ভব, কিন্তু একটা outlier সব বিকৃত করে দেয়।</p>
<h4>Reciprocal Rank Fusion (RRF) — স্কোর বাদ, শুধু ক্রম</h4>
<p><b>ধারণা:</b> স্কোরের পরম মান নয়, প্রতিটা তালিকায় ডকুমেন্ট <b>কত নম্বরে</b> আছে সেটা দেখো। যে ডকুমেন্ট অনেক তালিকার উপরের দিকে আছে সে জয়ী।</p>
<pre>RRF(d) = Σ (প্রতিটা তালিকা L)   1 ÷ (k + rank_L(d))        <span class="c"># সাধারণত k = 60; rank ১ থেকে শুরু</span>

হাতে হিসাব (k = 60):
  দুই তালিকাতেই ১ নম্বরে      → 1/61 + 1/61 = 0.03279
  একটায় ১ নম্বরে, আরেকটায় ৩ → 1/61 + 1/63 = 0.03227
  শুধু একটা তালিকায় ১ নম্বরে → 1/61        = 0.01639</pre>
<p><code>k = 60</code> একটা "নরম" ধ্রুবক: এটা বড় বলে ১ ও ২ নম্বরের পার্থক্য (1/61 বনাম 1/62) ছোট — অর্থাৎ একটা তালিকায় সামান্য উপরে-নিচে থাকা বেশি ম্যাটার করে না, কিন্তু <b>দুই তালিকাতেই থাকা</b> বড় বোনাস। কোড:</p>
<pre>def rrf_w(rank_lists, weights=None, k=60):
    weights = weights or [1.0] * len(rank_lists)
    fused, best = Counter(), {}
    for rl, wt in zip(rank_lists, weights):
        for r, i in enumerate(rl, 1):
            fused[i] += wt / (k + r)
            best[i] = min(best.get(i, 99), r)               <span class="c"># tie-break-এর জন্য সেরা র‍্যাঙ্ক</span>
    return sorted(fused.items(), key=lambda x: (-x[1], best[x[0]], x[0]))</pre>

<h4>৪.৫.১ পরীক্ষা — কোথায় কোনটা একা ব্যর্থ, আর RRF কীভাবে বাঁচায়</h4>
<p>৮-ডকুমেন্টের নমুনা (invoice নম্বরসহ)। Dense অংশে আগের খেলনা embedder (অর্থ ধরে, কিন্তু বিরল শব্দ ধোঁয়াটে — ঠিক আসল dense-এর দুর্বলতার প্রতিরূপ):</p>
<table>
<tr><th>প্রশ্ন</th><th>BM25 একা</th><th>Dense একা</th><th>RRF</th><th>পাঠ</th></tr>
<tr><td><b>রিফান্ড চাই</b><br>(সঠিক: d1, d2)</td><td><b>কিছুই নেই</b> — "রিফান্ড" শব্দ কোনো ডকুমেন্টে নেই</td><td>d1, d2, d7 ✓</td><td>d1, d2, d7 ✓</td><td>শব্দ-অমিল (vocabulary mismatch): sparse ব্যর্থ, dense সফল</td></tr>
<tr><td><b>INV-2042</b><br>(সঠিক: d4)</td><td>d4 ✓</td><td>d1, d5, d6, d8 — <b>d4 নেই!</b></td><td>d1 ও d4 <b>টাই</b> (০.০১৬৪)</td><td>বিরল ID: dense ব্যর্থ; আবার RRF-এ <b>টাই</b></td></tr>
<tr><td><b>INV-1042</b><br>(সঠিক: d3)</td><td>d3 ✓</td><td>d7, d3, d2</td><td>d3 (০.০৩২৫), তারপর d7</td><td>দুই তালিকায় আছে বলে d3 স্পষ্ট জয়ী</td></tr>
<tr><td><b>ইনভয়েস INV-1042 টাকা কত</b></td><td>d3, d1</td><td>d3, d4, d2, d1</td><td>d3 (০.০৩২৮), d1 (০.০৩১৮)</td><td>মিশ্র প্রশ্নে দুই পদ্ধতির সম্মিলিত জোর</td></tr>
</table>
<h4>টাই সমস্যা — এবং weighted RRF</h4>
<p>"INV-2042"-এ BM25-র একমাত্র সেরা (d4) আর dense-এর সেরা (d1) দুজনেরই স্কোর ঠিক ১/৬১ — <b>টাই</b>। আমার tie-break (আলাদা নাম অনুযায়ী) ভুল করে d1-কে আগে বসিয়েছে, অথচ সঠিক d4! RRF-এর একটা দুর্বলতা এটা: কে বেশি নির্ভরযোগ্য তা সে জানে না। সমাধান: <b>ওজনযুক্ত RRF</b> — যে প্রশ্নে ID/কোড আছে সেখানে BM25-কে বেশি ওজন:</p>
<pre>b = ranked(bm.score("INV-2042")); d = ranked(dense("INV-2042"))
rrf_w([b[:5], d[:5]])                       <span class="c"># → d1 0.0164, d4 0.0164, d5 0.0161   (টাই; আলফা-ক্রমে d1 আগে ✗)</span>
rrf_w([b[:5], d[:5]], weights=[1.5, 1.0])   <span class="c"># → d4 0.0246, d1 0.0164, d5 0.0161   ✓</span></pre>
<div class="callout best"><span class="tag">Best practice — ওজন কীভাবে ঠিক করবেন</span>
(১) <b>Query-রাউটিং:</b> প্রশ্নে ID/কোড/সংখ্যার প্যাটার্ন (<code>INV-\d+</code>, <code>[A-Z]{2,}-\d+</code>) থাকলে BM25 ওজন বাড়ান; লম্বা প্রাকৃতিক ভাষার প্রশ্নে dense। (২) অথবা golden set-এ ওজন (১:১, ১.৫:১, ২:১) পরীক্ষা করে মেপে বাছুন (অধ্যায় ১৩)। (৩) টাই-ব্রেক নির্ধারক রাখুন (সেরা র‍্যাঙ্ক, তারপর স্থির ক্রম) — যাতে ফল পুনরুৎপাদনযোগ্য হয়।</div>
<div class="callout mistake"><span class="tag">Common mistake — প্রতিটা তালিকা থেকে খুব কম প্রার্থী নেওয়া</span>
Hybrid-এ প্রতিটা পথ (dense, BM25) থেকে <b>k নয়, তার চেয়ে অনেক বেশি</b> (৫০-১০০) আনুন, মেলানোর পর top-k নিন। প্রতিটা থেকে মাত্র ৩টা আনলে যে ডকুমেন্ট দুই তালিকাতেই ৪-৫ নম্বরে আছে সে হারিয়ে যায়, অথচ RRF-এ সে জিততে পারত।</div>

<h4>৪.৬ Learned Sparse (SPLADE) — সংক্ষেপে</h4>
<p>BM25 শুধু ডকুমেন্টের হুবহু শব্দ ধরে। <b>Learned sparse</b> মডেল (যেমন SPLADE পরিবার) একটা ট্রান্সফর্মার দিয়ে ডকুমেন্টকে একটা <b>sparse vector</b> বানায় — ভোকাবুলারির প্রতিটা শব্দের জন্য একটা ওজন, বেশিরভাগ ০ — কিন্তু মডেল শেখে ডকুমেন্টে না থাকা প্রাসঙ্গিক শব্দেও ওজন বসাতে ("refund" থাকা ডকুমেন্টে "return", "money" শব্দেও ওজন)। ফলে sparse-এর নিখুঁত শব্দ-মিল আর dense-এর অর্থ-বোঝা — দুটোরই কিছু সুবিধা, inverted index-এ। বাস্তবতা: বহুভাষিক/বাংলা সমর্থিত মডেল সীমিত (আপনার ভাষার সমর্থন যাচাই করুন), index বড়, আর অনেক vector DB এখন sparse vector সরাসরি সাপোর্ট করে (version/ডকুমেন্টেশন দেখুন)। শুরুতে BM25 + dense যথেষ্ট; learned sparse তখন, যখন মেপে দেখেন BM25-র শব্দ-অমিল বড় সমস্যা।</p>

<h3>৫. Reranking — প্রথম ধাপ "মোটামুটি", দ্বিতীয় ধাপ "সূক্ষ্ম"</h3>
<h4>৫.১ Bi-encoder বনাম Cross-encoder — মূল পার্থক্য</h4>
<div class="diagram"><pre>
 BI-ENCODER (embedding model — যা আমরা এতক্ষণ ব্যবহার করেছি)
   query  ──[model]──→ vector_q ┐
                                 ├─→ cosine(q, d)       ← ডকুমেন্ট vector আগে থেকেই গণনা করা, index-এ রাখা
   doc    ──[model]──→ vector_d ┘     (প্রশ্ন ও ডকুমেন্ট আলাদা আলাদা কোডেড — পরস্পরকে "দেখে" না)
   ➜ দ্রুত: কোটি ডকুমেন্টেও ANN চলে। কিন্তু সূক্ষ্ম মিল (negation, শর্ত, সংখ্যা) ধরতে দুর্বল

 CROSS-ENCODER (reranker)
   [query + doc একসাথে] ──[model]──→ একটা স্কোর
   ➜ প্রশ্ন ও ডকুমেন্টের প্রতিটা token একে অপরকে "দেখে" (attention) → অনেক বেশি নির্ভুল
   ➜ কিন্তু প্রতিটা (প্রশ্ন, ডকুমেন্ট) জোড়ার জন্য আলাদা model-run — কোটি ডকুমেন্টে অসম্ভব
</pre></div>
<p><b>তাই দুই-ধাপ:</b> সস্তা bi-encoder/BM25 দিয়ে কোটি থেকে ~৫০–১০০ প্রার্থী (<b>recall-এর জন্য</b> প্রশস্ত), তারপর ব্যয়বহুল cross-encoder দিয়ে সেই ৫০–১০০টাকে নতুন করে সাজিয়ে ~৫–১০টা (<b>precision-এর জন্য</b>)।</p>
<h4>৫.২ কেন bi-encoder সূক্ষ্ম জিনিস ধরে না — একটা উদাহরণ</h4>
<pre>প্রশ্ন : "৫০,০০০ টাকার <b>কম</b> হলে কার অনুমোদন লাগে?"
chunk A: "৫০,০০০ টাকার <b>বেশি</b> হলে finance manager approve করবেন।"
chunk B: "৫০,০০০ টাকার <b>কম</b> হলে বিভাগীয় প্রধান approve করবেন।"</pre>
<p>Bi-encoder-এ "কম" ও "বেশি" শব্দ দুটো অর্থে একই এলাকার (পরিমাণ-তুলনা) — দুটো chunk-ই প্রশ্নের খুব কাছে পড়তে পারে, এমনকি A উপরে। Cross-encoder প্রশ্ন ও chunk একসাথে পড়ে "কম"-"কম" মিল ধরে B-কে উপরে তোলার সম্ভাবনা বেশি। (প্রবণতা — প্রতিটা মডেলে নিশ্চয়তা নয়; নিজের ডেটায় মাপুন।)</p>
<h4>৫.৩ কোড (ধারণা-নির্ভর; মডেল নামাতে হয় বলে আমি এখানে চালাইনি)</h4>
<pre><span class="c"># pip install sentence-transformers          — মডেল প্রথমবার নামে; নাম ও সাইজ version/হার্ডওয়্যারে নির্ভর</span>
from sentence_transformers import CrossEncoder

ce = CrossEncoder("BAAI/bge-reranker-v2-m3")      <span class="c"># বহুভাষিক (বাংলা সহ) reranker-এর একটা উদাহরণ — নিজে যাচাই করুন</span>

def rerank(query, candidates, top_n=8):
    pairs = [(query, c["text"]) for c in candidates]
    scores = ce.predict(pairs)                     <span class="c"># প্রতিটা জোড়ার জন্য একটা স্কোর — candidates সংখ্যা যত, model-run তত</span>
    ranked = sorted(zip(candidates, scores), key=lambda x: -x[1])
    return [c for c, s in ranked[:top_n]]

hits = hybrid_search(query, k=50)                  <span class="c"># প্রথম ধাপ: প্রশস্ত (recall)</span>
context = rerank(query, hits, top_n=8)             <span class="c"># দ্বিতীয় ধাপ: নির্ভুল (precision)</span></pre>
<p>বিকল্প: Cohere/Voyage/Jina ইত্যাদির hosted rerank API (প্রতি অনুরোধে খরচ, ডেটা বাইরে যায়), বা LLM দিয়ে rerank ("এই ২০টা chunk-কে প্রশ্নের প্রাসঙ্গিকতা অনুযায়ী ০-১০ স্কোর দাও") — সবচেয়ে ধীর ও দামী, কিন্তু নমনীয়।</p>
<h4>৫.৪ মূল্যের হিসাব</h4>
<table>
<tr><th>চলক</th><th>প্রভাব</th></tr>
<tr><td>Candidate সংখ্যা C</td><td>latency ∝ C (প্রতিটা জোড়ায় একটা model-run; GPU-তে batch করে কিছুটা সস্তা)</td></tr>
<tr><td>Chunk দৈর্ঘ্য</td><td>বড় chunk = ধীর (attention খরচ দৈর্ঘ্যের সাথে বাড়ে)</td></tr>
<tr><td>Model আকার/হার্ডওয়্যার</td><td>ছোট model + GPU: দ্রুত; বড় model + CPU: ধীর — আপনার পরিবেশে মাপুন</td></tr>
</table>
<p>অভিজ্ঞতা-সূত্র: C = ৫০ থেকে ১০০-এর মধ্যে রাখুন; C বাড়ালে recall সামান্য বাড়ে, কিন্তু latency রৈখিক। <b>কখন লাগে:</b> top-k র‍্যাঙ্কিং-এর গুণমান সত্যিকারের বাধা (golden set-এ সঠিক chunk top-50-এ আছে কিন্তু top-5-এ নেই — মানে recall ভালো, precision দুর্বল)। <b>কখন লাগে না:</b> সঠিক chunk-ই আসছে না (তখন সমস্যা recall-এ — chunking, hybrid, query transformation); আর তাৎক্ষণিক (&lt;১০০ms) উত্তর দরকার হলে।</p>
<div class="callout mistake"><span class="tag">Common mistake — Reranker দিয়ে recall-এর সমস্যা ঠিক করার চেষ্টা</span>
Reranker শুধু যা প্রার্থী তালিকায় এসেছে তাকে নতুন করে সাজায়। সঠিক chunk যদি প্রথম ধাপে ৫০-এর মধ্যেই না আসে, কোনো reranker তাকে বাঁচাতে পারবে না। আগে মাপুন: <b>recall@50</b> (সঠিক chunk কি ৫০-এর মধ্যে?) — এটা ভালো হলে তবেই reranker-এ বিনিয়োগ।</div>

<h3>৬. MMR — বৈচিত্র্য আনা (Maximal Marginal Relevance)</h3>
<h4>৬.১ সমস্যা</h4>
<p>আপনার ডেটায় একই তথ্য একাধিকবার আছে (overlap, একই নীতির একাধিক ভার্সন, চ্যাটে বারবার একই প্রশ্ন)। Top-5-এ পাঁচটাই প্রায়-একই chunk এলে LLM-এর context-এ একই তথ্য ৫ বার — token নষ্ট, আর অন্য প্রাসঙ্গিক ভিন্ন তথ্য (যেমন "ব্যতিক্রম") বাদ পড়ে।</p>
<h4>৬.২ সূত্র ও ধারণা</h4>
<p>MMR প্রতিবার এমন chunk বাছে যেটা <b>প্রশ্নের সাথে প্রাসঙ্গিক</b> আবার <b>ইতিমধ্যে-বাছা chunk-গুলোর থেকে ভিন্ন</b>:</p>
<pre>MMR-স্কোর(d) = λ × similarity(d, প্রশ্ন)  −  (1 − λ) × max similarity(d, ইতিমধ্যে-বাছা যেকোনো chunk)

λ = 1   → শুধু প্রাসঙ্গিকতা (সাধারণ top-k)
λ = 0.5 → ভারসাম্য
λ = 0   → শুধু বৈচিত্র্য (প্রাসঙ্গিকতা উপেক্ষা)</pre>
<pre>def mmr(q, cand_ids, vecs, k=3, lam=0.5):
    selected, rest = [], list(cand_ids)
    while rest and len(selected) &lt; k:
        best, bs = None, -9
        for i in rest:
            rel = float(q @ vecs[i])                                              <span class="c"># প্রশ্নের সাথে প্রাসঙ্গিকতা</span>
            red = max((float(vecs[i] @ vecs[j]) for j in selected), default=0.0)   <span class="c"># বাছাদের সাথে সর্বোচ্চ মিল (পুনরাবৃত্তি)</span>
            s = lam * rel - (1 - lam) * red
            if s &gt; bs: best, bs = i, s
        selected.append(best); rest.remove(best)
    return selected</pre>
<h4>৬.৩ সংখ্যায় (আমি চালিয়েছি)</h4>
<p>৫টা chunk: <code>a, b, c</code> প্রায়-একই (প্রশ্নের খুব কাছে), <code>x</code> কিছুটা ভিন্ন দিকে, <code>y</code> আরও ভিন্ন। প্রশ্ন a-b-c-র দিকে।</p>
<pre>সাধারণ top-3:    [c, b, a]       ← তিনটাই প্রায় একই তথ্য
MMR λ = 1.0:     [c, b, a]       ← সাধারণ top-k-এর সমান
MMR λ = 0.7:     [c, b, a]       ← এখনও প্রাসঙ্গিকতাই প্রধান
MMR λ = 0.5:     [c, x, b]       ← দ্বিতীয় স্থানে ভিন্ন তথ্য x ঢুকল
MMR λ = 0.3:     [c, y, x]       ← বৈচিত্র্য প্রধান; তবে সর্বোচ্চ প্রাসঙ্গিক b, a বাদ</pre>
<p>লক্ষ্য করুন λ খুব কম হলে সবচেয়ে প্রাসঙ্গিক chunk-ও বাদ পড়তে পারে — তাই বৈচিত্র্য ও প্রাসঙ্গিকতার মধ্যে সতর্ক ভারসাম্য: সাধারণত λ = ০.৫–০.৭ দিয়ে শুরু। জটিলতা: প্রতি নির্বাচনে সব প্রার্থী × বাছা = O(k × candidates) — ছোট, তাই সস্তা।</p>
<h4>৬.৪ MMR-এর বিকল্প/পরিপূরক — প্রায়-ডুপ্লিকেট বাদ</h4>
<p>সরল ও কার্যকর: ফল তালিকায় দুটো chunk-এর মধ্যে cosine ≥ ০.৯৫ (আপনার ডেটায় মেপে ঠিক করুন) হলে নিচেরটা বাদ। আর ingestion-এর সময় content_hash-ভিত্তিক সম্পূর্ণ-ডুপ্লিকেট বাদ (অধ্যায় ৬)। MMR বিশেষভাবে কাজে লাগে যখন <b>বহু-দৃষ্টিকোণের উত্তর</b> দরকার (তুলনা, "সব শর্ত কী কী?", সারাংশ) — একক তথ্যের প্রশ্নে সাধারণ top-k-ই যথেষ্ট।</p>

<h3>৭. Query Transformation — প্রশ্নটাকেই উন্নত করা</h3>
<p>অনেক সময় সমস্যা ডেটায় নয়, <b>প্রশ্নে</b>: ছোট ("limit?"), অস্পষ্ট, কথোপকথনের মাঝের ("আর তার limit?"), বা ডকুমেন্টের ভাষা থেকে ভিন্ন। একটা LLM call দিয়ে প্রশ্ন বদলে retrieval উন্নত করা যায়।</p>
<h4>৭.১ Query Rewriting (কথোপকথনের প্রসঙ্গ জোড়া)</h4>
<pre>কথোপকথন:
  ব্যবহারকারী: Domestic travel-এ hotel limit কত?
  বট:         6,000 BDT প্রতি রাত।
  ব্যবহারকারী: আর international-এ?          <span class="c">← একা এই প্রশ্ন vector-এ অর্থহীন</span>

Rewrite (LLM): "International travel-এ hotel limit কত?"      <span class="c">← স্বয়ংসম্পূর্ণ প্রশ্ন → এটা embed করে খোঁজো</span></pre>
<pre>REWRITE_PROMPT = """নিচের কথোপকথনের শেষ প্রশ্নটাকে একটা স্বয়ংসম্পূর্ণ প্রশ্নে বদলাও,
যাতে আগের কথা না জেনেও বোঝা যায়। নতুন তথ্য যোগ করবে না। শুধু বদলানো প্রশ্নটা লেখো।

কথোপকথন:
{history}
শেষ প্রশ্ন: {question}"""</pre>
<h4>৭.২ Multi-Query — একই প্রশ্ন একাধিক ভাষায়</h4>
<p>LLM থেকে প্রশ্নের ৩-৫টা প্যারাফ্রেজ আনুন (ভিন্ন শব্দ, ভিন্ন ভাষা), প্রতিটার জন্য আলাদা retrieval, তারপর RRF দিয়ে মেলান। এক শব্দচয়নের দুর্ভাগ্য কাটে।</p>
<pre>def multi_query_retrieve(question, llm, retrieve, k=5):
    variants = [question] + llm_paraphrases(llm, question, n=3)     <span class="c"># আসল + ৩টা প্যারাফ্রেজ</span>
    lists = [retrieve(v, k=20) for v in variants]                    <span class="c"># প্রতিটার জন্য আলাদা খোঁজা</span>
    return [i for i, s in rrf_w(lists)][:k]                          <span class="c"># RRF — যে chunk অনেক রূপে আসে সে জয়ী</span></pre>
<p>নমুনা (LLM-এর জায়গায় স্থির প্যারাফ্রেজ, খেলনা retriever): "টাকা ফেরত কীভাবে পাব" + তিনটা প্যারাফ্রেজ → চারটা তালিকা (<code>[d2,d1,d3]</code>, <code>[d1,d2,d5]</code>, <code>[d2,d1,d3]</code>, <code>[d2,d1,d3]</code>) → RRF: <code>d2 (০.০৬৫৩), d1 (০.০৬৪৮), d3 (০.০৪৭৬)</code> — যেসব chunk বারবার আসে তারা শীর্ষে স্থির হয়। মূল্য: ১টা LLM call + N গুণ retrieval।</p>
<h4>৭.৩ HyDE — Hypothetical Document Embeddings</h4>
<p><b>ধারণা:</b> প্রশ্ন ছোট ও প্রশ্নের ধরনের, কিন্তু ডকুমেন্ট দীর্ঘ ও উত্তরের ধরনের — তাদের vector স্বভাবতই একটু দূরে। HyDE-তে LLM-কে বলা হয় "এই প্রশ্নের একটা কাল্পনিক উত্তর লেখো" (সঠিক না হলেও চলবে), তারপর <b>সেই কাল্পনিক উত্তরের</b> vector দিয়ে খোঁজা হয় — কারণ উত্তরের ধরন ডকুমেন্টের ধরনের কাছাকাছি।</p>
<pre>প্রশ্ন:           "refund policy?"
LLM-এর কাল্পনিক উত্তর:  "গ্রাহক আবেদনের ৭ দিনের মধ্যে মূল রসিদসহ টাকা ফেরত পেতে পারেন..."
embed(কাল্পনিক উত্তর) → vector দিয়ে খোঁজা          <span class="c"># আসল প্রশ্নের vector নয়</span></pre>
<div class="callout mistake"><span class="tag">HyDE-র ঝুঁকি</span>
(১) LLM ভুল/ভিন্ন তথ্য কল্পনা করলে retrieval ভুল দিকে যায় (তার সংখ্যা/দাবি কখনো ফলে না দেখিয়ে শুধু খোঁজার জন্য ব্যবহার করুন)। (২) ডোমেইন-নির্দিষ্ট বিষয়ে (আপনার অভ্যন্তরীণ কোড/নীতি) LLM-এর কল্পনা এলোমেলো। (৩) প্রতি প্রশ্নে অতিরিক্ত LLM call। কাজে আসে সাধারণ-জ্ঞান-ঘেঁষা, ছোট প্রশ্নে; মেপে দেখুন।</div>
<h4>৭.৪ Decomposition — জটিল প্রশ্ন ভাঙা</h4>
<p>"Triplover-এর গত তিন মাসের revenue ড্রপ কি আমাদের refund policy-র পরিবর্তনের কারণে?" — এটা একটা chunk-এ নেই; একাধিক উৎস লাগে। LLM প্রশ্নটাকে উপ-প্রশ্নে ভাঙে: (১) "Triplover-এর মাসিক revenue" (→ SQL/MCP tool), (২) "refund policy কী পরিবর্তন হয়েছে" (→ vector retrieval)। প্রতিটার উত্তর জোগাড় করে শেষে LLM সংশ্লেষণ করে। এটাই multi-hop RAG ও agentic RAG-এর ভিত্তি (AI কোর্সের Agents/MCP অধ্যায়) — retrieval এখানে agent-এর একটা tool।</p>
<h4>৭.৫ Step-back</h4>
<p>খুব নির্দিষ্ট প্রশ্নকে আরও সাধারণ রূপে বদলানো ("Dhaka-র ৫-তারা হোটেলের limit?" → "hotel limit নীতি কী?") যাতে বিস্তৃত প্রসঙ্গ chunk পাওয়া যায়, তারপর নির্দিষ্টটা প্রসঙ্গ থেকে বের করা।</p>

<h3>৮. Self-Query ও Routing — প্রশ্ন থেকে filter ও গন্তব্য বের করা</h3>
<h4>৮.১ Self-Query</h4>
<p>"২০২৫ সালের finance বিভাগের refund নীতি" — এর মধ্যে <b>filter</b> (dept = finance, year = 2025) আর <b>অর্থ-প্রশ্ন</b> (refund নীতি) মেশানো। LLM-কে বলুন structured output (JSON) দিতে:</p>
<pre>{
  "query":   "refund নীতি",
  "filters": { "dept": "finance", "year": 2025 }
}</pre>
<p>তারপর <code>query</code> embed করে <code>filters</code>-কে metadata where-শর্ত বানান। <b>নিরাপত্তা-নীতি:</b> LLM-এর বের করা filter শুধু <i>প্রাসঙ্গিকতা</i>-filter হবে (dept, year); <code>tenant_id</code>/<code>acl</code> কখনো LLM থেকে নয়, সেশন থেকে কোডে বসবে। আর <b>ব্যর্থতা:</b> LLM ভুল filter বসালে (যেমন year = 2024) সঠিক উত্তর বাদ পড়ে — তাই ফল শূন্য বা কম স্কোর এলে <b>filter ছাড়া আবার খোঁজা</b> (fallback) এবং filter-মান যাচাই (বৈধ তালিকা থেকে)।</p>
<h4>৮.২ Routing — কোন উৎসে যাব</h4>

<h3>৯. Context Assembly — LLM-এর budget-এ ঢোকানো</h3>
<h4>৯.১ k কত? — budget থেকে হিসাব</h4>
<p>k "অনুমান" নয়, <b>token budget</b> থেকে বের করুন: <code>retrieval budget = context window − system prompt − কথোপকথনের ইতিহাস − উত্তরের জন্য সংরক্ষিত জায়গা</code>। আমাদের আগের উদাহরণ: ৮,১৯২ − ১,৫০০ − ১,০০০ = ৫,৬৯২ token; chunk ~৪০০ token হলে সর্বোচ্চ <b>১৪টা</b> chunk। (আমি একটা সরল ফাংশন চালিয়েছি: ২০টা প্রার্থীর মধ্যে budget-এর মধ্যে ১৪টা বসল, ব্যবহৃত ৫,৬০০ / ৫,৬৯২।)</p>
<pre>def assemble(chunks, window=8192, system=1500, answer=1000, tok_fn=lambda t: max(1, len(t) // 3)):
    budget = window - system - answer
    used, picked = 0, []
    for c in chunks:                            <span class="c"># chunks আগে থেকেই সেরা-প্রথম ক্রমে সাজানো</span>
        t = tok_fn(c["text"])
        if used + t &gt; budget: break
        picked.append(c); used += t
    return picked, used, budget</pre>
<h4>৯.২ "বেশি context = ভালো" নয়</h4>
<ul>
<li><b>Lost in the middle:</b> অনেক LLM লম্বা context-এর <b>মাঝের</b> অংশ প্রথম ও শেষ অংশের চেয়ে কম মনোযোগ দেয় (বিভিন্ন গবেষণায় দেখা গেছে; মডেল-ভেদে মাত্রা আলাদা)। তাই সবচেয়ে প্রাসঙ্গিক chunk-গুলো <b>শুরুতে (এবং/অথবা শেষে)</b> রাখুন।</li>
<li><b>খরচ ও latency:</b> input token যত, খরচ ও প্রথম-token-এর সময় তত।</li>
<li><b>বিভ্রান্তি:</b> অপ্রাসঙ্গিক chunk LLM-কে ভুল পথে নিতে পারে — অল্প কিন্তু সঠিক chunk প্রায়ই বেশি-কিন্তু-মিশ্রণের চেয়ে ভালো।</li>
</ul>
<h4>৯.৩ চূড়ান্ত prompt-এ কী যায়</h4>
<pre>[SYSTEM]  তুমি কোম্পানির নীতি-সহায়ক। শুধু নিচের context থেকে উত্তর দাও। না পেলে "তথ্য পাওয়া যায়নি" বলো।
          প্রতিটা দাবির পরে [উৎস: id] উল্লেখ করো।
[CONTEXT]
  [policy-001#0000 | Company Policy &gt; Refund | পৃ.৪]
  Refund: আবেদনের ১০ দিনের মধ্যে টাকা ফেরত পাওয়া যাবে।
  [policy-001#0001 | Company Policy &gt; Approval | পৃ.৫]
  ...
[QUESTION] ...</pre>
<p>প্রতিটা chunk-এর সাথে <b>id ও section/পৃষ্ঠা</b> দিন — LLM উত্তরে citation দিতে পারে, আর পরে যাচাই করা যায়। Parent-child (অধ্যায় ৬) থাকলে child-এর বদলে parent টেক্সট বসান, parent dedupe করে।</p>
<div class="callout best"><span class="tag">Best practice — retrieved টেক্সটকে "ডেটা" হিসেবে ঘিরে দিন</span>

<h3>১০. বাস্তব পাইপলাইন — সব কৌশল একসাথে (কোড-কাঠামো)</h3>
<pre>def answer(question, history, user):
    <span class="c"># (ক) প্রশ্ন বদলানো — শর্তসাপেক্ষে</span>
    q = rewrite_if_followup(question, history)

    <span class="c"># (খ) নিরাপত্তা-filter (সেশন থেকে, LLM থেকে নয়) + প্রাসঙ্গিকতা-filter (ঐচ্ছিক self-query)</span>
    flt = {"tenant_id": user.tenant, "acl": {"$in": user.roles}}

    <span class="c"># (গ) প্রার্থী: dense ও BM25 — প্রতিটা থেকে প্রশস্ত</span>
    dense_ids  = dense_search(q, filter=flt, k=50)
    sparse_ids = bm25_search(q, filter=flt, k=50)
    fused = rrf_w([sparse_ids, dense_ids], weights=[1.5 if has_id_pattern(q) else 1.0, 1.0])[:50]

    <span class="c"># (ঘ) rerank (যদি মেপে লাভ দেখা যায়)</span>
    top = rerank(q, fused, top_n=12)

    <span class="c"># (ঙ) threshold + MMR + dedupe</span>
    top = [c for c in top if c.score &gt;= THRESHOLD]
    if not top: return "এ বিষয়ে তথ্য পাওয়া যায়নি।"
    top = mmr_select(q, top, k=8, lam=0.6)

    <span class="c"># (চ) context assembly: parent expansion + token budget + citation</span>
    ctx = assemble(expand_parents(top), window=8192, system=1500, answer=1000)
    return llm(build_prompt(ctx, question))</pre>

<tr><td><code>chromadb.HttpClient(host="localhost", port=8000)</code></td><td>আলাদা Chroma <b>server</b> প্রসেসে; আপনার কোড নেটওয়ার্কে কথা বলে</td><td>একাধিক সার্ভিস/প্রসেস একই ডেটা ব্যবহার করলে</td></tr>
</table>
<p>Server চালানো (আমি চালিয়ে যাচাই করেছি):</p>
<pre><span class="c"># টার্মিনালে — server শুরু</span>
chroma run --path ./chroma_data --port 8000

<span class="c"># Python কোডে</span>
import chromadb
client = chromadb.HttpClient(host="localhost", port=8000)
col = client.get_or_create_collection("http_demo", configuration={"hnsw": {"space": "cosine"}})
col.upsert(ids=["a", "b"], embeddings=[[1,0,0],[0,1,0]], documents=["alpha","beta"], metadatas=[{"k":1},{"k":2}])
r = col.query(query_embeddings=[[0.9,0.1,0]], n_results=2, where={"k": {"$gte": 1}})
print(r["ids"], [round(x,4) for x in r["distances"][0]])
<span class="c"># → [['a', 'b']] [0.0061, 0.8896]</span></pre>
<p>Chroma-র ম্যানেজড ক্লাউড সংস্করণও আছে (আলাদা client, API key) — আমি সেটা চালাইনি, তাই এখানে বিস্তারিত দিচ্ছি না; ডকুমেন্টেশন দেখুন।</p>

<h3>৪. মূল ধারণা — Collection ও Record</h3>
<div class="diagram"><pre>
 Client
  └─ Tenant (ডিফল্ট: default_tenant)
       └─ Database (ডিফল্ট: default_database)
            └─ Collection  "policy_chunks"     ← SQL-এর table-এর মতো
                 ├─ Record: id="policy-001#0000"
                 │            embedding = [0.12, -0.03, ...]      ← vector
                 │            document  = "Refund: আবেদনের ৭ দিনের..."   ← মূল লেখা
                 │            metadata  = {"dept": "finance", "year": 2025}
                 └─ Record: ...
</pre></div>
<ul>
<li><b>Collection</b> = একই ধরনের record-এর গ্রুপ। একই collection-এর সব vector-এর <b>dimension সমান</b> হতে হবে।</li>
<li><b>Record</b> = <code>id</code> (বাধ্যতামূলক, স্ট্রিং, collection-এ অনন্য) + <code>embedding</code> + ঐচ্ছিক <code>document</code>, <code>metadata</code>, <code>uri</code>।</li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake — collection-এর নামে ভুল</span>
নাম অন্তত <b>৩ অক্ষরের</b> হতে হবে (সর্বোচ্চ ৫১২), শুধু <code>a-z A-Z 0-9 . _ -</code>, আর শুরু-শেষ আলফানিউমেরিক। আমি <code>"t"</code> নাম দিয়ে চালাতে গিয়ে পেলাম: <code>InvalidArgumentError: Validation error: name: Expected a name containing 3-512 characters from [a-zA-Z0-9._-], starting and ending with a character in [a-zA-Z0-9]. Got: t</code>। বাংলা নাম দেওয়া যাবে না।</div>

<h3>৫. Collection তৈরি — Distance ও HNSW সেটিং</h3>
<h4>৫.১ সবচেয়ে গুরুত্বপূর্ণ সতর্কতা: ডিফল্ট distance cosine নয়!</h4>
<pre>col = client.get_or_create_collection("default_space")
print(col.configuration["hnsw"])
<span class="c"># {'space': 'l2', 'ef_construction': 100, 'ef_search': 100, 'max_neighbors': 16,
#  'resize_factor': 1.2, 'sync_threshold': 1000}</span></pre>
<p>ডিফল্ট <code>space</code> হলো <b><code>l2</code></b> (squared Euclidean distance)। টেক্সট embedding-এর জন্য সাধারণত চাই <b>cosine</b> (অধ্যায় ২)। তাই collection তৈরির সময়ই বলে দিন:</p>
<pre><span class="c"># নতুন (১.x) পদ্ধতি — আমি এটা চালিয়েছি</span>
col = client.get_or_create_collection(
    name="policies",
    configuration={"hnsw": {"space": "cosine"}},
)
<span class="c"># পুরোনো পদ্ধতিও (এই version-এ) কাজ করেছে:  metadata={"hnsw:space": "cosine"}</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — space না বলে ডিফল্টে ছেড়ে দেওয়া</span>
Distance metric পরে বদলানো যায় না (index তার ভিত্তিতে বানানো)। আর L2 vs cosine ভিন্ন র‍্যাঙ্কিং দিতে পারে — যদি আপনার embedding model cosine-এর জন্য train হয় (বেশিরভাগ টেক্সট model), ডিফল্ট L2 নীরবে খারাপ ফল দেবে। সবসময় স্পষ্টভাবে <code>space</code> দিন; collection তৈরির আগে model-এর ডকুমেন্টেশন দেখুন।</div>
<h4>৫.২ তিনটা space-এ "distance" আসলে কী — আমি চালিয়ে দেখেছি</h4>
<p>দুটো vector <code>a = [3, 4]</code> ও <code>b = [0.6, 0.8]</code> (একই দিক, ভিন্ন দৈর্ঘ্য)। প্রশ্ন = <code>[3, 4]</code>:</p>
<pre>space     a-র distance   b-র distance      সূত্র
cosine       0.0            0.0          1 − cos(θ)             ← দিক একই, তাই দুটোই ০
l2           0.0           16.0          (squared) Σ(x−y)²      ← (3−0.6)² + (4−0.8)² = 5.76 + 10.24 = 16
ip         −24.0          −4.0           1 − (q · v)            ← 1 − 25 = −24;  1 − 5 = −4</pre>
<p><b>পাঠ:</b> (১) Chroma-র <code>distance</code> সবসময় "<b>ছোট = কাছের</b>"। (২) <code>l2</code> হলো <b>বর্গ</b> দূরত্ব (বর্গমূল নেওয়া নেই)। (৩) <code>ip</code>-তে distance ঋণাত্মকও হতে পারে (কারণ সূত্র <code>1 − dot</code>) — চমকাবেন না। (৪) cosine দিক দেখে, দৈর্ঘ্য নয় — তাই a ও b একই। (৫) <b>cosine similarity = 1 − cosine distance</b> (threshold-এর জন্য রূপান্তর, ৯ নং অংশ)।</p>
<h4>৫.৩ HNSW সেটিং (সংক্ষেপে; বিস্তারিত অধ্যায় ৪, ৫)</h4>
<table>
<tr><th>পরামিতি</th><th>ডিফল্ট</th><th>অর্থ</th></tr>
<tr><td><code>max_neighbors</code> (M)</td><td>১৬</td><td>প্রতি নোডের সংযোগ</td></tr>
<tr><td><code>ef_construction</code></td><td>১০০</td><td>index বানানোর সময় প্রার্থী সংখ্যা</td></tr>
<tr><td><code>ef_search</code></td><td>১০০</td><td>query-র সময় প্রার্থী সংখ্যা</td></tr>
</table>
<p>১১ নং অংশে আমার মাপা সংখ্যাসহ দেখব এগুলো বদলালে recall ও সময় কীভাবে বদলায়।</p>

<h3>৬. Embedding Function — vector কে বানাবে?</h3>
<p>Chroma-তে vector দেওয়ার দুটো পথ: (ক) আপনি নিজে vector বানিয়ে <code>embeddings=</code> দেবেন, অথবা (খ) collection-এর সাথে একটা <b>embedding function (EF)</b> জুড়ে দেবেন — তখন শুধু <code>documents=</code> / <code>query_texts=</code> দিলেই Chroma নিজে embed করে নেয়।</p>
<h4>৬.১ ডিফল্ট EF — সুবিধা ও একটা বড় ফাঁদ</h4>
<p>কিছু না দিলে Chroma একটা ডিফল্ট EF ব্যবহার করে: <code>all-MiniLM-L6-v2</code> (ONNX, <b>৩৮৪ মাত্রা</b>)। প্রথমবার ব্যবহারে ~৭৯ MB model ইন্টারনেট থেকে নামে (<code>~/.cache/chroma/onnx_models/</code>)। আমি ৩টা ছোট ডকুমেন্ট ও তিনটা প্রশ্ন দিয়ে পরীক্ষা করেছি:</p>
<pre>documents: ১ "refund policy for customers within seven days"
           ২ "voucher posting rules for debit and credit"
           ৩ "hotel booking limit per night"

প্রশ্ন "money back"            → ['1','2','3']  distance [0.684, 0.832, 0.951]   ✓ ঠিক (refund সবার আগে)
প্রশ্ন "returning a purchase"  → ['1','2','3']  distance [0.515, 0.715, 0.984]   ✓ ঠিক
প্রশ্ন "টাকা ফেরত"              → ['3','2','1']  distance [0.910, 1.049, 1.052]   ✗ ভুল! hotel সবার আগে, refund সবার শেষে</pre>
<div class="callout mistake"><span class="tag">গুরুত্বপূর্ণ ফাঁদ — ডিফল্ট EF ইংরেজি-কেন্দ্রিক; বাংলায় নীরবে ভুল</span>
লক্ষ্য করুন: কোনো error নেই, ফল স্বাভাবিক দেখতে — অথচ বাংলা প্রশ্নে সঠিক ডকুমেন্ট <b>সবার শেষে</b>। এই model মূলত ইংরেজিতে train; বাংলা token সে ভালো বোঝে না। (distance-গুলোও সব ০.৯-এর উপরে — "কেউই কাছের নয়" সংকেত।) <b>বাংলা বা মিশ্র ডেটায় ডিফল্ট EF দিয়ে প্রোডাকশন বানাবেন না</b> — একটা বহুভাষিক model বাছুন (অধ্যায় ৩) এবং নিজের golden প্রশ্নে যাচাই করুন (অধ্যায় ১৩)।</div>
<h4>৬.২ নিজের EF লেখা (custom)</h4>
<p>যেকোনো embedding (OpenAI, Cohere, আপনার নিজের সার্ভিস, local model) জুড়তে একটা ছোট ক্লাস:</p>
<pre>from chromadb import Documents, EmbeddingFunction, Embeddings

class ToyEF(EmbeddingFunction):
    <span class="c">"""শিক্ষণীয় deterministic embedder — আসল model-এর জায়গায় বসবে (এখানে অধ্যায় ৭-এর খেলনা লেক্সিকন)"""</span>
    def __init__(self): pass

    def __call__(self, input: Documents) -&gt; Embeddings:         <span class="c"># input = স্ট্রিংয়ের তালিকা</span>
        return [my_embed(t).tolist() for t in input]            <span class="c"># প্রতিটার জন্য float-এর তালিকা ফেরত</span>

    @staticmethod
    def name(): return "toy-ef"                                  <span class="c"># Chroma ১.x-এ নাম ও config দরকার (persist-এর জন্য)</span>
    def get_config(self): return {}
    @staticmethod
    def build_from_config(config): return ToyEF()

col = client.get_or_create_collection("policies", embedding_function=ToyEF(),
                                      configuration={"hnsw": {"space": "cosine"}})
col.add(ids=[...], documents=[...])                              <span class="c"># EF নিজে embed করবে</span>
col.query(query_texts=["রিফান্ড চাই"], n_results=3)              <span class="c"># প্রশ্নও EF দিয়ে embed</span></pre>
<p>আমি এই ক্লাস দিয়ে চালিয়েছি: <code>query_texts=["রিফান্ড চাই"]</code> → ids <code>[['d1','d2','d7']]</code>, distances <code>[0.121, 0.175, 0.993]</code>। <b>সতর্কতা:</b> <code>__call__</code>-এর প্যারামিটারের নাম <code>input</code> হতে হয় (Chroma নিজে এই নামে ডাকে)। আর collection <b>আবার খোলার সময়ও</b> (<code>get_collection</code>) EF পাস করুন — কিছু version/EF-এ না দিলে ডিফল্ট EF ধরে নেওয়া হতে পারে, ফলে query vector আলাদা model-এর হয়ে যায় (অধ্যায় ২-এর "ভিন্ন model মেশানো" ভুল)।</p>
<h4>৬.৩ কোনটা ভালো — EF জোড়া, না নিজে embed?</h4>
<table>
<tr><th></th><th>EF জোড়া (convenience)</th><th>নিজে embed করে <code>embeddings=</code> দেওয়া</th></tr>
<tr><td>সরলতা</td><td>খুব সরল — <code>documents=</code>, <code>query_texts=</code></td><td>একটু বেশি কোড</td></tr>
<tr><td>নিয়ন্ত্রণ</td><td>সীমিত (batching, retry, caching, rate-limit আপনার হাতে নেই)</td><td>পূর্ণ — retry, cache (content_hash), batch, ক্ষয়-নিয়ন্ত্রণ সব আপনার</td></tr>
<tr><td>সুবিধাজনক কখন</td><td>শেখা, prototype</td><td>প্রোডাকশন — ingestion pipeline আলাদা, embedding পুনর্ব্যবহার (অধ্যায় ১২, ১৪)</td></tr>
<tr><td>বিপদ</td><td>ভুল EF-এ নীরবে খারাপ ফল (বাংলা)</td><td>query-তে আলাদা model দিলে ফল ভুল — মডেল-নাম metadata-তে রাখুন</td></tr>
</table>

<h3>৭. CRUD — ধাপে ধাপে</h3>
<p>এবার আমাদের ৮-ডকুমেন্টের নমুনা (invoice, policy, voucher…) ও ToyEF দিয়ে প্রতিটা কাজ। <code>c1</code> = cosine collection, ToyEF সহ।</p>
<h4>৭.১ Add — ঢোকানো</h4>
<pre>ids = ["d1","d2","d3","d4","d5","d6","d7","d8"]
c1.add(
    ids=ids,
    documents=[DOCS[i] for i in ids],
    metadatas=[{"dept": "finance", "year": 2025, "pinned": True}, ...],   <span class="c"># প্রতিটা record-এর metadata</span>
)
print(c1.count())     <span class="c"># → 8</span>
print(c1.peek(2)["ids"])   <span class="c"># প্রথম কয়েকটা দেখা → ['d1', 'd2']</span></pre>
<h4>৭.২ Metadata-র ধরন (আমি প্রতিটা পরীক্ষা করেছি)</h4>
<table>
<tr><th>মান</th><th>ফল</th></tr>
<tr><td><code>"x"</code> (স্ট্রিং), <code>1</code> (int), <code>1.5</code> (float), <code>True</code> (bool)</td><td>✓ চলে</td></tr>
<tr><td><code>[1, 2]</code> (তালিকা)</td><td>✓ চলে (এই version-এ)</td></tr>
<tr><td><code>None</code></td><td>✗ <code>TypeError: ... Cannot convert Python object to MetadataValue</code></td></tr>
<tr><td><code>{"a": 1}</code> (nested dict)</td><td>✗ <code>ValueError: Expected metadata value to be a str, int, float, bool, SparseVector, list, or None</code></td></tr>
</table>
<p>অর্থাৎ metadata <b>সমতল (flat)</b>। নেস্টেড কাঠামো দরকার হলে ফ্ল্যাট কী-তে ভাঙুন (<code>"addr_city"</code>) বা JSON স্ট্রিং আকারে রাখুন (তবে সেটা দিয়ে filter করা যাবে না)। <code>None</code> দিতে চাইলে ফিল্ডটাই বাদ দিন। (SparseVector-এর উল্লেখ দেখে বোঝা যায় নতুন version sparse vector সমর্থনের দিকে এগোচ্ছে — আমি এটা চালাইনি, ফিচার-স্থিতি ডকুমেন্টেশনে যাচাই করুন।)</p>
<h4>৭.৩ ভুল ইনপুটে কী হয় — আমি ইচ্ছা করে ভেঙেছি</h4>
<pre><span class="c"># ১. একই call-এ ডুপ্লিকেট id</span>
col.add(ids=["a","a"], embeddings=[[1,0],[0,1]])
<span class="c"># → DuplicateIDError: Expected IDs to be unique, found duplicates of: a in add.</span>

<span class="c"># ২. ভুল dimension</span>
col.add(ids=["z"], embeddings=[[1,0,0]])           <span class="c"># collection আছে ২-মাত্রার</span>
<span class="c"># → InvalidArgumentError: Collection expecting embedding with dimension of 2, got 3</span>

<span class="c"># ৩. আগে থেকে থাকা id আবার add করা  ← সবচেয়ে বিপজ্জনক</span>
c1.add(ids=["d1"], documents=["dup"])
print(c1.get(ids=["d1"])["documents"][0][:30])
<span class="c"># → "Refund policy: আবেদনের ৭ দিনের"   ← কোনো error নেই, নতুন লেখা "dup" ঢুকলই না!</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — <code>add</code> আর <code>upsert</code> এক ভেবে নেওয়া</span>
আগে থেকে থাকা id-তে <code>add</code> করলে Chroma <b>নীরবে উপেক্ষা করে</b> (আমার পরীক্ষায় error আসেনি, পুরোনো ডকুমেন্টই রয়ে গেছে)। ফলে ডকুমেন্ট এডিট করে আবার "add" করলে আপনি ভাবেন আপডেট হয়েছে, অথচ পুরোনো লেখাই খুঁজে পাচ্ছেন — ভয়ানক stale-data বাগ। <b>নতুন-বা-বদল দুটোর জন্যই <code>upsert</code> ব্যবহার করুন</b> (অধ্যায় ৬-এর idempotent ingestion)।</div>
<h4>৭.৪ Upsert, Update, Delete, Get</h4>
<pre><span class="c"># upsert: নেই → নতুন; আছে → বদলে দেয়</span>
c1.upsert(ids=["d9"], documents=["Tax rule: VAT 15%"], metadatas=[{"dept": "accounting", "year": 2026, "pinned": False}])
c1.count()                                         <span class="c"># → 9</span>

<span class="c"># update: শুধু আছে এমন record-এর নির্দিষ্ট ফিল্ড (এখানে metadata)</span>
c1.update(ids=["d1"], metadatas=[{"dept": "finance", "year": 2026, "pinned": True}])
c1.get(ids=["d1"])["metadatas"][0]                 <span class="c"># → {'dept': 'finance', 'year': 2026, 'pinned': True}</span>

<span class="c"># delete: id দিয়ে অথবা filter দিয়ে</span>
c1.delete(where={"dept": "hr"})                    <span class="c"># hr বিভাগের সব মুছল → count 9 → 7</span>
c1.delete(ids=["d9"])                               <span class="c"># → 6</span>

<span class="c"># get: id, filter, পৃষ্ঠা (limit/offset), কী ফেরত আসবে (include)</span>
g = c1.get(ids=["d1","d3"], include=["documents","metadatas"])
g = c1.get(where={"dept": "finance"}, limit=2, offset=1)          <span class="c"># পৃষ্ঠা-ভাগ করে পড়া</span>
g = c1.get(ids=["d1"], include=["embeddings"])
len(g["embeddings"][0])                            <span class="c"># → 15  (ToyEF-এর মাত্রা)</span></pre>
<p>লক্ষ্য করুন <code>get</code> বা <code>query</code>-র ফল একটা <b>dict</b> (<code>ids</code>, <code>documents</code>, <code>metadatas</code>, <code>embeddings</code>, ...), আর <code>query</code>-তে প্রতিটা ভ্যালু <b>তালিকার তালিকা</b> — একটা প্রশ্নের জন্য একটা ভেতরের তালিকা (তাই <code>r["ids"][0]</code>)।</p>
<h4>৭.৫ Batch সীমা</h4>
<pre>client.get_max_batch_size()          <span class="c"># → 5461  (এই পরিবেশে)</span>
col.add(ids=[...5471 টা...], embeddings=...)
<span class="c"># → ValueError: Batch size of 5471 is greater than max batch size of 5461</span>

<span class="c"># সমাধান: ছোট ছোট ব্যাচে ভাঙা</span>
def add_in_batches(client, col, ids, embeddings, metadatas=None, documents=None):
    bs = client.get_max_batch_size()
    for s in range(0, len(ids), bs):
        sl = slice(s, s + bs)
        col.add(ids=ids[sl], embeddings=embeddings[sl],
                metadatas=metadatas[sl] if metadatas else None,
                documents=documents[sl] if documents else None)</pre>
<p>২০,০০০ vector (৬৪ মাত্রা) ৫,০০০-এর ব্যাচে ঢুকতে আমার মেশিনে ~২.২ সেকেন্ড লেগেছে — ছোট স্কেলে ইনসার্ট ঝামেলাহীন।</p>

<h3>৮. Query — খোঁজা</h3>
<h4>৮.১ মূল query</h4>
<pre>r = c1.query(
    query_texts=["রিফান্ড চাই"],         <span class="c"># EF embed করবে — অথবা query_embeddings=[[...]] নিজে দিন</span>
    n_results=3,                          <span class="c"># top-k</span>
    where={"dept": "finance"},            <span class="c"># ঐচ্ছিক metadata filter</span>
    include=["documents", "metadatas", "distances"],   <span class="c"># কী কী ফেরত চাই</span>
)
r["ids"][0]         <span class="c"># প্রথম প্রশ্নের ফলাফলের id-তালিকা</span>
r["distances"][0]   <span class="c"># প্রতিটার distance — ছোট = কাছের (cosine space-এ: 1 − similarity)</span></pre>
<h4>৮.২ আচরণের খুঁটিনাটি (আমি প্রতিটা পরীক্ষা করেছি)</h4>
<ul>
<li><b>একাধিক প্রশ্ন একসাথে:</b> <code>query_texts=["রিফান্ড", "hotel limit"]</code>, <code>n_results=1</code> → <code>[['d1'], ['d4']]</code> — প্রতিটার আলাদা তালিকা। একসাথে পাঠালে নেটওয়ার্ক/embedding ব্যাচ-সুবিধা।</li>
<li><b><code>n_results</code> সংখ্যা ছাড়িয়ে গেলে:</b> collection-এ ৬টা record, <code>n_results=50</code> চাইলে ৬টাই ফেরত আসে — error নেই।</li>
<li><b>ফাঁকা collection:</b> <code>[[]]</code> ফেরত (error নয়) — আপনার কোডে ফাঁকা তালিকার জন্য প্রস্তুত থাকুন।</li>
<li><b>Filter-এ মেলে না এমন ফল:</b> <code>get(where={"nokey": "x"})</code> → <code>[]</code>।</li>
<li><b>include-তে কী কী:</b> <code>distances, metadatas, documents, embeddings, uris</code> (আমি পাঁচটাই পেয়েছি)।</li>
</ul>
<h4>৮.৩ Distance থেকে similarity ও threshold</h4>
<pre>sim = 1 - dist                         <span class="c"># শুধু cosine space-এ বৈধ</span>
hits = [(i, round(1 - d, 3)) for i, d in zip(r["ids"][0], r["distances"][0]) if 1 - d &gt;= 0.5]</pre>
<p>Threshold ক্যালিব্রেশন অধ্যায় ৭-এ (§২)। মনে রাখুন ডিফল্ট EF-এর সব distance ০.৯-এর উপরে আসা (উপরে বাংলার উদাহরণ) = "প্রাসঙ্গিক কিছু নেই" সংকেত — threshold থাকলে ঠিক এই ক্ষেত্রে সিস্টেম "জানি না" বলত।</p>

<h3>৯. Filter — where ও where_document</h3>
<h4>৯.১ metadata filter (<code>where</code>) — সব operator চালানো</h4>
<p>আমাদের ৮টা record, metadata: <code>dept</code> (finance/sales/accounting/hr), <code>year</code> (২০২৩–২০২৬), <code>pinned</code> (bool):</p>
<table>
<tr><th>Operator</th><th>উদাহরণ</th><th>ফলাফল (id)</th></tr>
<tr><td><code>$eq</code> (সরাসরি মান)</td><td><code>{"dept": "finance"}</code></td><td>d2, d1, d3, d7</td></tr>
<tr><td><code>$ne</code></td><td><code>{"dept": {"$ne": "finance"}}</code></td><td>d4, d6, d5, d8</td></tr>
<tr><td><code>$in</code></td><td><code>{"dept": {"$in": ["hr","sales"]}}</code></td><td>d4, d6, d8</td></tr>
<tr><td><code>$nin</code></td><td><code>{"dept": {"$nin": ["hr","sales"]}}</code></td><td>d2, d1, d3, d5, d7</td></tr>
<tr><td><code>$gt</code> / <code>$gte</code></td><td><code>{"year": {"$gt": 2025}}</code> / <code>$gte</code></td><td>d3, d4, d7 / d1, d3, d4, d6, d7</td></tr>
<tr><td><code>$lt</code> / <code>$lte</code></td><td><code>{"year": {"$lt": 2025}}</code> / <code>$lte</code></td><td>d2, d5, d8 / d2, d1, d6, d5, d8</td></tr>
<tr><td><code>$and</code></td><td><code>{"$and": [{"dept":"finance"}, {"year": {"$gte": 2025}}]}</code></td><td>d1, d3, d7</td></tr>
<tr><td><code>$or</code></td><td><code>{"$or": [{"dept":"hr"}, {"pinned": True}]}</code></td><td>d1, d6, d7, d8</td></tr>
<tr><td>bool</td><td><code>{"pinned": True}</code></td><td>d1, d7</td></tr>
</table>
<p>(ফলাফলের ক্রম = প্রশ্নের সাথে distance অনুযায়ী; <code>query_texts=["টাকা ফেরত refund"]</code> ধরে।) <b>সব operator এই version-এ কাজ করেছে।</b></p>
<h4>৯.২ ডকুমেন্টের লেখায় filter (<code>where_document</code>)</h4>
<pre>q(wd={"$contains": "Invoice"})                    <span class="c"># → d3, d4          লেখায় "Invoice" আছে</span>
q(wd={"$not_contains": "Invoice"})                <span class="c"># → d2, d1, d6, d5, d7, d8</span>
q(wd={"$regex": "INV-[0-9]+"})                    <span class="c"># → d3, d4          regex — ID-ধাঁচের খোঁজার জন্য কাজের</span>
q(wd={"$and": [{"$contains": "Invoice"}, {"$contains": "Triplover"}]})   <span class="c"># → d3</span></pre>
<p><code>where_document</code> একটা সরল substring/regex ফিল্টার — আসল BM25 নয় (শব্দ-র‍্যাঙ্কিং নেই; শুধু আছে/নেই)। তবু "INV-1042" জাতীয় হুবহু খোঁজা সরল পরিস্থিতিতে vector search-এর সাথে জুড়ে কাজ চালায় (অধ্যায় ৭-এর hybrid-এর হালকা বিকল্প)।</p>
<h4>৯.৩ filter-এর তিনটা কড়া নিয়ম — যেখানে সবাই আটকায়</h4>
<pre><span class="c"># নিয়ম ১: টাইপ মিলতে হবে — "২০২৫" (স্ট্রিং) আর ২০২৫ (int) এক নয়</span>
c2.get(where={"year": 2025})["ids"]        <span class="c"># → ['a']      (metadata-তে int রাখা)</span>
c2.get(where={"year": "2025"})["ids"]      <span class="c"># → []         ← নীরবে খালি! error নেই</span>
c2.get(where={"year": {"$gt": "2024"}})
<span class="c"># → ValueError: Expected operand value to be an int or a float for operator $gt, got 2024</span>

<span class="c"># নিয়ম ২: একাধিক শর্ত সরাসরি এক dict-এ নয় — $and লাগবে</span>
c2.get(where={"year": 2025, "tag": "x"})
<span class="c"># → ValueError: Expected where to have exactly one operator, got {'year': 2025, 'tag': 'x'}</span>
c2.get(where={"$and": [{"year": 2025}, {"tag": "x"}]})         <span class="c"># ✓</span>

<span class="c"># নিয়ম ৩: তুলনা ($gt, $lt) শুধু সংখ্যায় — তারিখ রাখুন সংখ্যা (epoch/YYYYMMDD) আকারে</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — নীরবে খালি ফল</span>
Filter-এর টাইপ ভুলে (<code>"2025"</code> বনাম <code>2025</code>) ফল শূন্য আসে, কোনো সতর্কতা ছাড়াই — আপনি ভাবেন "ডেটা নেই"। ingestion-এ metadata-র টাইপ স্থির রাখুন (একটা schema/ফাংশন দিয়ে), আর filter ও ডেটা একই জায়গা থেকে টাইপ নিন।</div>
<h4>৯.৪ কঠোর filter-এ Chroma কীভাবে আচরণ করে — অধ্যায় ৭-এর পরীক্ষার প্রতিফলন</h4>
<p>অধ্যায় ৭-এ দেখেছি naive post-filter কঠোর filter-এ ফল হারায়। Chroma-র আচরণ আমি আলাদা করে পরীক্ষা করেছি: ২০,০০০ vector, তার মাত্র <b>১৯১টা (~১%)</b> <code>tenant="A"</code>। ২০টা র‍্যান্ডম প্রশ্নে <code>where={"tenant": "A"}, n_results=10</code>:</p>
<pre>প্রতিটা প্রশ্নে ফেরত ফল: ১০টা (সবসময়)   | exact brute-force top-10-এর সাথে মিল: ১০/১০ (গড় ১০.০)</pre>
<p>অর্থাৎ Chroma-র filter <b>filter-সচেতনভাবে খোঁজে</b> (post-filter নয়) — কঠোর filter-এও পূর্ণ k টা ও নিখুঁত ফল দিয়েছে। এটা Chroma-র ভালো দিক। (তবে আমার এই পরীক্ষা ২০ হাজার vector-এ; কোটি-স্কেলে বা অন্য filter-ধরনে আচরণ আলাদা হতে পারে — নিজের ডেটায় যাচাই করুন, অধ্যায় ৭-এর "exact-এর সাথে তুলনা" কৌশলে।)</p>

<h3>১০. একটা পূর্ণ Mini Policy-Search App</h3>
<p>এবার সব জুড়ে একটা কাজের অ্যাপ: ডকুমেন্ট (Markdown) ingest → chunk → embed → Chroma; <b>idempotent</b> (অধ্যায় ৬-এর নিয়ম: ডিটারমিনিস্টিক id + content_hash + stale মোছা); search-এ threshold ও filter।</p>
<pre>import chromadb, time
from chunklib import split_markdown, with_header, sha        <span class="c"># অধ্যায় ৬-এর chunker</span>

EMBED_MODEL = "toy-ef-v1"
client = chromadb.PersistentClient(path="./app_store")
col = client.get_or_create_collection("policy_chunks", embedding_function=ToyEF(),
                                      configuration={"hnsw": {"space": "cosine"}})

def ingest(doc_id, title, markdown, dept, version):
    <span class="c">"""Idempotent: অপরিবর্তিত chunk skip, বদলানো embed, আর নেই এমন chunk মোছা।"""</span>
    chunks = split_markdown(markdown, max_chars=300)
    new = {}
    for i, ch in enumerate(chunks):                                   <span class="c"># ১. নতুন chunk-গুলো বানাই (id সহ)</span>
        text = with_header(title, ch["section"], ch["text"])           <span class="c">#    contextual header (অধ্যায় ৬)</span>
        new[f"{doc_id}#{i:04d}"] = (text, ch["section"])

    old = col.get(where={"doc_id": doc_id}, include=["metadatas"])      <span class="c"># ২. এই ডকুমেন্টের পুরোনো chunk ও hash</span>
    old_hash = {i: m["content_hash"] for i, m in zip(old["ids"], old["metadatas"])}

    stale   = [i for i in old_hash if i not in new]                     <span class="c"># ৩. আর নেই → delete</span>
    changed = [i for i, (t, _) in new.items() if old_hash.get(i) != sha(t)]   <span class="c"># নতুন বা বদলানো → embed</span>
    if stale: col.delete(ids=stale)
    if changed:
        col.upsert(ids=changed,
                   documents=[new[i][0] for i in changed],
                   metadatas=[{"doc_id": doc_id, "title": title, "section": new[i][1], "dept": dept,
                               "version": version, "embedding_model": EMBED_MODEL,
                               "content_hash": sha(new[i][0]), "updated_at": int(time.time())} for i in changed])
    return {"total": len(new), "embedded": len(changed), "deleted": len(stale)}

def search(query, k=3, dept=None, min_sim=0.5):
    r = col.query(query_texts=[query], n_results=k, where={"dept": dept} if dept else None)
    out = []
    for i, d, m, dist in zip(r["ids"][0], r["documents"][0], r["metadatas"][0], r["distances"][0]):
        sim = 1 - dist                                                 <span class="c"># cosine distance → similarity</span>
        if sim &gt;= min_sim: out.append((i, round(sim, 3), m["section"]))   <span class="c"># threshold</span>
    return out</pre>
<p>তিনটা সংস্করণে একই ডকুমেন্ট ingest করে দেখলাম (V2: শুধু Refund-এর "৭ দিনের" → "১০ দিনের"; V3: Travel অংশ মুছে দেওয়া):</p>
<pre>ingest(V1)        → {'total': 3, 'embedded': 3, 'deleted': 0}     <span class="c"># প্রথমবার: ৩টা chunk সবই embed</span>
ingest(V1) আবার   → {'total': 3, 'embedded': 0, 'deleted': 0}     <span class="c"># ★ idempotent: কিছুই embed হলো না</span>
ingest(V2)        → {'total': 3, 'embedded': 1, 'deleted': 0}     <span class="c"># ★ শুধু বদলানো ১টা chunk embed</span>
count             → 3
search("রিফান্ড টাকা ফেরত")        → [('policy-001#0000', 0.969, 'Policy > Refund')]
search("আবহাওয়া কেমন")            → []        <span class="c"># ★ threshold: অপ্রাসঙ্গিক প্রশ্নে "কিছু নেই"</span>
search("refund", dept="hr")         → []        <span class="c"># ★ filter: hr বিভাগে নেই</span>
ingest(V3)        → {'total': 2, 'embedded': 0, 'deleted': 1}     <span class="c"># ★ মুছে-যাওয়া অংশের chunk delete</span>
count             → 2    ids: ['policy-001#0000', 'policy-001#0001']
get(0000) →  [Company Policy | Policy > Refund]
             Refund: আবেদনের ১০ দিনের মধ্যে টাকা ফেরত পাওয়া যাবে।        <span class="c"># ★ আপডেট হয়েছে (৭ → ১০)</span></pre>
<div class="callout best"><span class="tag">এখানে কী শিখলেন</span>
(১) একই ডকুমেন্ট বারবার ingest করলে খরচ ০ (embed হয় না)। (২) এক অনুচ্ছেদ বদলালে শুধু সেটুকুর embedding খরচ। (৩) মুছে-যাওয়া অংশ stale হয়ে থাকে না। (৪) threshold ও filter প্রথম দিন থেকেই। এটাই প্রোডাকশন ingestion-এর ছোট রূপ — পরে (অধ্যায় ১৪) queue, retry, versioning যুক্ত হলেও মূল যুক্তি এটাই। <b>নিজের মডেল বসাতে:</b> <code>ToyEF()</code>-র জায়গায় আপনার বহুভাষিক embedding function।</div>

<h3>১১. ANN বাস্তবে — Recall, গতি ও Chroma-র সেটিং (আমার মাপা সংখ্যা)</h3>
<p>অধ্যায় ৪-৫-এ ANN-এর তত্ত্ব দেখেছি। এবার Chroma-তে সংখ্যা: <b>২০,০০০ র‍্যান্ডম vector, ৬৪ মাত্রা, cosine</b>; ১০০টা প্রশ্ন; সঠিক উত্তর numpy brute-force-এ; মাপা recall@10 ও প্রতি প্রশ্নের গড় সময়:</p>

<tr><th>Collection সেটিং (তৈরির সময় দেওয়া)</th><th>recall@10</th><th>ms / প্রশ্ন</th></tr>
<tr><td>ডিফল্ট (M=16, ef_construction=100, ef_search=100)</td><td>০.৮৩৪</td><td>১.৭৩</td></tr>
<tr><td><code>ef_search=10</code></td><td><b>০.২৯০</b></td><td>১.৫৭</td></tr>
<tr><td><code>ef_search=400</code></td><td><b>০.৯৮৮</b></td><td>৩.১৫</td></tr>

<tr><td>M=8, ef_construction=40</td><td>০.৫৬১</td><td>১.৮০</td></tr>
