<h4>৫.১ Collection তৈরি ও ডেটা ঢোকানো</h4>
<pre>from qdrant_client import QdrantClient, models

client = QdrantClient(":memory:")
COL = "policies"
client.create_collection(
    collection_name=COL,
    vectors_config=models.VectorParams(size=4, distance=models.Distance.COSINE),   <span class="c"># size ও distance পরে বদলানো যায় না</span>
)

pts = [
  models.PointStruct(id=1, vector=[0.90,0.10,0.00,0.05], payload={"text":"Refund policy: ৭ দিনের মধ্যে টাকা ফেরত","dept":"finance","year":2025,"lang":"bn"}),
  models.PointStruct(id=2, vector=[0.10,0.90,0.10,0.00], payload={"text":"Voucher posting নিয়ম","dept":"accounting","year":2024,"lang":"bn"}),
  models.PointStruct(id=3, vector=[0.85,0.15,0.05,0.10], payload={"text":"Return ও money back নীতি","dept":"finance","year":2026,"lang":"en"}),
  models.PointStruct(id=4, vector=[0.05,0.20,0.90,0.10], payload={"text":"Hotel booking cancellation","dept":"travel","year":2026,"lang":"en"}),
  models.PointStruct(id=5, vector=[0.00,0.10,0.20,0.95], payload={"text":"Flight reschedule fee","dept":"travel","year":2023,"lang":"en"}),
]
print(client.upsert(COL, points=pts).status)     <span class="c"># completed</span></pre>
<h4>৫.২ সরল খোঁজা — query_points</h4>
<pre>q = [0.88, 0.12, 0.02, 0.05]                      <span class="c"># প্রশ্ন: "টাকা ফেরত পাব কীভাবে?" (এর embedding — কল্পিত)</span>
r = client.query_points(COL, query=q, limit=3, with_payload=True)
for p in r.points:
    print(p.id, round(p.score, 4), p.payload["text"])</pre>
<p><b>আউটপুট</b> (বাস্তবে চালানো):</p>
<pre>1 0.9994 Refund policy: ৭ দিনের মধ্যে টাকা ফেরত
3 0.9969 Return ও money back নীতি
2 0.2443 Voucher posting নিয়ম</pre>
<div class="callout why"><span class="tag">ফল বোঝা — অর্থ বনাম শব্দ</span>
id=1 ও id=3 প্রায় ১.০ স্কোর পেয়েছে, যদিও id=3-এর লেখায় "টাকা ফেরত" শব্দই নেই (আছে "Return ও money back") — কারণ আমরা শব্দ নয়, vector-এর দিক মিলিয়েছি। id=2 (Voucher posting) ০.২৪ — আলাদা বিষয়। লক্ষ্য করুন score <b>বড় = ভালো</b> (Qdrant cosine similarity ফেরত দেয়)। আর <code>limit=3</code> দিলে তিনটা ফল আসবেই — তৃতীয়টা প্রায় অপ্রাসঙ্গিক (০.২৪)! তাই RAG-এ <code>score_threshold</code> (পরের অংশ) অপরিহার্য।</div>
<h4>৫.৩ score_threshold — "যথেষ্ট কাছের না হলে ফেরত দিও না"</h4>
<pre>r = client.query_points(COL, query=q, limit=10, score_threshold=0.7)
print([(p.id, round(p.score,4)) for p in r.points])      <span class="c"># [(1, 0.9994), (3, 0.9969)] — id=2 (০.২৪) বাদ</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — Threshold ছাড়া RAG</span>
Vector search সবসময় "সবচেয়ে কাছের" কিছু একটা দেয়, এমনকি পুরো ডেটায় প্রাসঙ্গিক কিছু না থাকলেও। Threshold ছাড়া অপ্রাসঙ্গিক chunk LLM-এর কাছে গেলে সে সেটা থেকেই উত্তর বানায় (hallucination)। তবে threshold-এর মান embedding model ও ডেটা অনুযায়ী ভিন্ন — নিজের golden set-এ মেপে ঠিক করুন (অধ্যায় ১৩), ০.৭ কোনো সার্বজনীন সংখ্যা নয়।</div>
<h4>৫.৪ Filter-সহ খোঁজা</h4>
<pre><span class="c"># শুধু finance বিভাগ এবং ২০২৬ বা তার পরে</span>
flt = models.Filter(must=[
    models.FieldCondition(key="dept", match=models.MatchValue(value="finance")),
    models.FieldCondition(key="year", range=models.Range(gte=2026)),
])
r = client.query_points(COL, query=q, query_filter=flt, limit=3)
print([(p.id, round(p.score,4)) for p in r.points])        <span class="c"># [(3, 0.9969)] — id=1 (finance কিন্তু ২০২৫) বাদ</span>

<span class="c"># should = "যেকোনো একটা" (OR), must_not = "এটা নয়"</span>
flt2 = models.Filter(
    should=[models.FieldCondition(key="dept", match=models.MatchValue(value="travel")),
            models.FieldCondition(key="dept", match=models.MatchValue(value="accounting"))],
    must_not=[models.FieldCondition(key="year", range=models.Range(lt=2024))],
)
r = client.query_points(COL, query=q, query_filter=flt2, limit=5)
print([(p.id, round(p.score,4)) for p in r.points])        <span class="c"># [(2, 0.2443), (4, 0.1101)] — id=5 (২০২৩) বাদ</span></pre>
<h4>৫.৫ Filter-এর সম্পূর্ণ ভাষা</h4>
<table>
<tr><th>শর্ত</th><th>Python</th><th>অর্থ</th></tr>
<tr><td>সমান</td><td><code>MatchValue(value="finance")</code></td><td>হুবহু মান</td></tr>
<tr><td>এর যেকোনো একটা</td><td><code>MatchAny(any=["finance","hr"])</code></td><td>IN (...)</td></tr>
<tr><td>এগুলো ছাড়া</td><td><code>MatchExcept(**{"except": ["finance"]})</code></td><td>NOT IN (...)</td></tr>
<tr><td>সংখ্যার পরিসর</td><td><code>Range(gte=2023, lt=2025)</code></td><td>২০২৩ ≤ x &lt; ২০২৫</td></tr>
<tr><td>তারিখের পরিসর</td><td><code>DatetimeRange(gte=datetime(...))</code></td><td>তারিখ-সময়</td></tr>
<tr><td>ফাঁকা/null</td><td><code>IsNullCondition</code>, <code>IsEmptyCondition</code></td><td>মান নেই</td></tr>
<tr><td>নির্দিষ্ট id</td><td><code>HasIdCondition(has_id=[...])</code></td><td>id-ধরে</td></tr>
<tr><td>পূর্ণ-টেক্সট শব্দ</td><td><code>MatchText(text="refund")</code> (text index লাগে)</td><td>লেখায় শব্দ আছে</td></tr>
<tr><td>ভৌগোলিক</td><td><code>GeoRadius</code>, <code>GeoBoundingBox</code></td><td>লোকেশন-ভিত্তিক</td></tr>
<tr><td>নেস্টেড</td><td><code>NestedCondition</code></td><td>অ্যারের ভেতরের object-এ</td></tr>
<tr><td>যুক্তি</td><td><code>must</code> (AND), <code>should</code> (OR), <code>must_not</code> (NOT), <code>min_should</code></td><td>নেস্ট করা যায়</td></tr>
</table>
<p>আমরা বড় একটা synthetic dataset-এ (২০০ point, ৪ বিভাগ, ৫টা বছর) যাচাই করেছি: <code>dept ∈ {finance, hr}</code> <b>এবং</b> <code>2023 ≤ year &lt; 2025</code> গুনে এলো <b>৪০</b>। হাতে-হিসাবও মেলে: বিভাগ ২/৪ = ১/২ ভাগ, বছর ২/৫ ভাগ (২০২৩, ২০২৪) → ১/২ × ২/৫ = ১/৫ → ২০০ × ১/৫ = ৪০ ✓।</p>

<h3>৬. Filter-এর রহস্য — Filterable HNSW (Qdrant-এর সবচেয়ে গুরুত্বপূর্ণ নকশা)</h3>
<h4>৬.১ সমস্যাটা মনে করি (অধ্যায় ৯, অংশ ১০)</h4>
<p>সাধারণ ANN index vector দূরত্ব জানে, filter জানে না। "প্রথমে ANN, পরে filter" (post-filter) করলে কঠোর filter-এ সব প্রার্থী বাদ পড়ে → ১-২টা বা শূন্য ফল। বিপরীতটা — "প্রথমে filter, তারপর ANN" (pre-filter) — HNSW-তে চলে না, কারণ filter-পাস না করা node বাদ দিলে <b>graph ছিঁড়ে যায়</b> (পথই পাওয়া যায় না)। ঠিক এই দ্বিধার সমাধান Qdrant-এর "filterable HNSW"।</p>
<h4>৬.২ Qdrant কীভাবে সমাধান করে (দুটো কৌশল একসাথে)</h4>
<div class="diagram"><pre>
 প্রশ্ন + filter আসে
        │
        ▼
 Query planner: payload index ব্যবহার করে filter-এ কতটা point মেলে তা আন্দাজ করে (cardinality estimation)
        │
        ├── মিল কম  (cardinality &lt; full_scan_threshold) ──► payload index দিয়ে মিলে-যাওয়া point গুলো সরাসরি তুলে
        │                                                    তাদের উপর সরাসরি (exact) তুলনা — দ্রুত ও ১০০% নির্ভুল
        │
        └── মিল বেশি ───────────────────────────────────► HNSW graph-এ খোঁজো, কিন্তু traversal-এর সময়
                                                              filter-কে সাথে সাথে প্রয়োগ করো (in-filter);
                                                              graph-এ payload-ভিত্তিক অতিরিক্ত সংযোগ (payload_m) আছে বলে
                                                              filter-পাস node-গুলো পরস্পরের সাথে যুক্ত থাকে — ছিঁড়ে যায় না
</pre></div>
<h4>৬.৩ গণনা: full_scan_threshold আসলে কত point?</h4>
<p><code>full_scan_threshold</code>-এর ডিফল্ট প্রায় <b>১০,০০০ KB</b> (সংস্করণ-নির্ভর; <b>kilobyte</b> এককে — point-সংখ্যায় নয়!)। অর্থাৎ "মিলে-যাওয়া point-গুলোর vector-ডেটা ~১০ MB-এর কম হলে" সরাসরি scan। কয়টা point সেটা dimension-এর উপর নির্ভর করে (গণনা করা):</p>
<table>
<tr><th>Dimension</th><th>প্রতি vector (float32)</th><th>১০,০০০ KB-তে কত point</th></tr>
<tr><td>384</td><td>1,536 বাইট</td><td>≈ 6,667</td></tr>
<tr><td>768</td><td>3,072 বাইট</td><td>≈ 3,333</td></tr>
<tr><td>1536</td><td>6,144 বাইট</td><td>≈ 1,667</td></tr>
</table>
<p><b>একটা বাস্তব দৃশ্য:</b> ১০ লাখ point (১৫৩৬-dim), tenant = "ছোট কোম্পানি" যার ৫০০টা point (filter selectivity ০.০৫%)। ৫০০ &lt; ১,৬৬৭ → planner payload index দিয়ে ৫০০টা তুলে exact তুলনা করে — ফল নিখুঁত, কোনো recall-হ্রাস নেই। এখন বড় tenant ১ লাখ point (১০%) → ১,৬৬৭-এর অনেক উপরে → filterable HNSW traversal। অর্থাৎ <b>দুই সীমান্তেই ফল ঠিক</b> — যা সাধারণ post-filter HNSW পারত না (অধ্যায় ৯-এ গণনা: ১%-এ ৪০ প্রার্থীর মধ্যে ০.৪টা survive)।</p>
<div class="callout mistake"><span class="tag">Common mistake — Payload index না বানিয়ে filter ব্যবহার</span>
Payload index না থাকলে planner filter-এর cardinality আন্দাজ করতে পারে না, ও filter-পাস point সরাসরি তুলতে পারে না — ফলে ধীর ও কম-নির্ভুল পথে যায়। <b>যে ফিল্ডে নিয়মিত filter করবেন, তার জন্য <code>create_payload_index</code> অবশ্যই বানান</b> (পরের অংশ)। এটা Qdrant-এ সবচেয়ে সাধারণ পারফরম্যান্স-ভুল।</div>
<h4>৬.৪ Payload index তৈরি</h4>
<pre>client.create_payload_index(COL, field_name="dept", field_schema=models.PayloadSchemaType.KEYWORD)
client.create_payload_index(COL, field_name="year", field_schema=models.PayloadSchemaType.INTEGER)
<span class="c"># অন্য ধরন: FLOAT, BOOL, GEO, DATETIME, TEXT (full-text), UUID</span></pre>

একটা collection-এ হাজার হাজার tenant রেখে প্রতিটা query-তে <code>tenant_id</code> filter করা Qdrant-এ সুপারিশকৃত পদ্ধতি (প্রতি tenant-এ আলাদা collection বানানো বড় সংখ্যায় ভারী ও অদক্ষ)। নতুন সংস্করণে <code>tenant_id</code> keyword index-এ <code>is_tenant=True</code> প্যারামিটার ও HNSW-তে <code>m=0, payload_m=16</code> সেটিং দিলে ডেটা tenant অনুযায়ী ভৌতভাবে কাছাকাছি সাজানো হয় ও প্রতি-tenant graph তৈরি হয় — ছোট ও বড় tenant দুজনেই দ্রুত। সঠিক সিনট্যাক্স ও সীমা আপনার সংস্করণের "Multitenancy" ডকুমেন্টে দেখুন।</div>

<h3>৭. HNSW কনফিগ ও Search Param</h3>
<h4>৭.১ Index-সময়ের কনফিগ (collection তৈরির সময়)</h4>
<pre>client.create_collection(
    "tuned",
    vectors_config=models.VectorParams(
        size=1536, distance=models.Distance.COSINE,
        hnsw_config=models.HnswConfigDiff(m=16, ef_construct=100),   <span class="c"># per-vector কনফিগ</span>
    ),
)</pre>
<table>
<tr><th>প্যারামিটার</th><th>ডিফল্ট (সংস্করণ-নির্ভর)</th><th>অর্থ</th><th>বাড়ালে</th></tr>
<tr><td><code>m</code></td><td>16</td><td>প্রতি node-এর সংযোগ সংখ্যা</td><td>recall ↑, মেমরি/build সময় ↑</td></tr>

<tr><td><code>full_scan_threshold</code></td><td>~10,000 (KB)</td><td>৬.৩ দেখুন — এর কম হলে exact scan</td><td>বেশি filter exact-পথে যাবে (নির্ভুল কিন্তু ধীর)</td></tr>

<tr><td><code>on_disk</code></td><td>false</td><td>HNSW index RAM-এর বদলে ডিস্কে (mmap)</td><td>মেমরি কম, latency ↑</td></tr>
</table>
<p>pgvector-এর <code>m</code> / <code>ef_construction</code>-এর সাথে ধারণাগতভাবে একই (অধ্যায় ৪, ৯)।</p>
<h4>৭.২ Query-সময়ের Search Param</h4>
<pre>r = client.query_points(COL, query=q, limit=3,
    search_params=models.SearchParams(
        hnsw_ef=128,        <span class="c"># query-time প্রার্থী-তালিকা (pgvector-এর ef_search); বাড়ালে recall ↑, ধীর</span>
        exact=False,        <span class="c"># True = HNSW বাইপাস করে brute-force (১০০% নির্ভুল; ground truth/ডিবাগের জন্য)</span>
    ))</pre>
<p><b>যাচাই (গুরুত্বপূর্ণ):</b> ২০০ random unit vector (৮-dim) দিয়ে <code>exact=True</code> search-এর top-3 numpy-র নিজের গণনার (<code>vecs @ q</code>, sort) সাথে <b>হুবহু মিলেছে</b> — id ও score দুটোই: <code>[(3, 1.0), (31, 0.817), (54, 0.7212)]</code> উভয় পদ্ধতিতেই। অর্থাৎ Qdrant-এর cosine ঠিক সেই গাণিতিক cosine-ই, যা অধ্যায় ২-এ শিখেছি।</p>
<div class="callout best"><span class="tag">Recall মাপার সহজ উপায় (অধ্যায় ১৩-র আগাম)</span>
একই প্রশ্ন একবার <code>exact=True</code> (ground truth), একবার <code>exact=False, hnsw_ef=N</code> দিয়ে চালান; দুই ফলের মিল = recall@k। <code>hnsw_ef</code> বদলে সংখ্যাটা দেখুন। লোকাল মোডে এটা অর্থহীন (সবসময় exact) — আসল সার্ভারে করুন।</div>

<h3>৮. Quantization — মেমরি ৪–৩২ গুণ কমানো</h3>
<p>অধ্যায় ৫-এ ধারণা শিখেছি; এখানে Qdrant-এ কীভাবে ব্যবহার। Quantization মানে vector-এর প্রতিটা সংখ্যাকে কম বিটে সংরক্ষণ — মেমরি কমে, গতি বাড়ে, সামান্য নির্ভুলতা কমে।</p>
<table>
<tr><th>ধরন</th><th>প্রতি সংখ্যা</th><th>সংকোচন</th><th>কখন</th><th>খরচ</th></tr>
<tr><td><b>Scalar (int8)</b></td><td>৮ বিট (float32 → int8)</td><td><b>৪×</b></td><td>ডিফল্ট পছন্দ — প্রায় সব dimension-এ নিরাপদ</td><td>নির্ভুলতার সামান্য ক্ষতি (সাধারণত নগণ্য)</td></tr>
<tr><td><b>Product (PQ)</b></td><td>vector-কে অংশে ভেঙে প্রতিটা কোডবুকের কোডে</td><td>সর্বোচ্চ ~<b>৬৪×</b></td><td>অত্যন্ত বড় ডেটা, মেমরিই বাধা</td><td>বেশি recall-ক্ষতি, ধীর, অপ্টিমাইজ কঠিন</td></tr>
<tr><td><b>Binary (BQ)</b></td><td>১ বিট (চিহ্ন: ধনাত্মক/ঋণাত্মক)</td><td><b>৩২×</b></td><td>উচ্চ-dimension (সাধারণত ≥ ১০২৪) ও এ-ধরনের জন্য ভালো সাড়া দেওয়া model (যেমন OpenAI)</td><td>কম-dimension-এ recall বড় ধাক্কা খায়; rescoring প্রায় বাধ্যতামূলক</td></tr>
</table>
<h4>৮.১ মেমরির হিসাব (গণনা করা)</h4>
<p>১ কোটি vector × ১৫৩৬ dimension:</p>
<table>
<tr><th>সংরক্ষণ</th><th>মেমরি</th><th>গণনা</th></tr>
<tr><td>মূল float32</td><td><b>61.44 GB</b></td><td>10,000,000 × 1536 × 4 বাইট</td></tr>
<tr><td>Scalar int8</td><td><b>15.36 GB</b></td><td>10,000,000 × 1536 × 1 বাইট</td></tr>
<tr><td>Binary</td><td><b>1.92 GB</b></td><td>10,000,000 × 1536 ÷ 8 বাইট</td></tr>
</table>
<div class="callout why"><span class="tag">তাৎপর্য — একটা সার্ভারে আঁটানো</span>
৬১ GB vector একটা ৬৪GB RAM-এর সার্ভারে আঁটে না (index ও অন্য জিনিস বাদে); কিন্তু binary করলে মাত্র ~২ GB — একটা ছোট সার্ভারেই RAM-এ! এই নাটকীয় পার্থক্যই quantization-কে বাস্তব scale-এর চাবিকাঠি করে। দাম: নির্ভুলতা কমে — যা নিচের কৌশলে পুষিয়ে নেওয়া হয়।</div>
<h4>৮.২ Rescoring ও Oversampling — নির্ভুলতা ফিরিয়ে আনার কৌশল</h4>
<div class="diagram"><pre>
  ১. ছোট (quantized) vector দিয়ে দ্রুত খোঁজা   → সবচেয়ে কাছের (limit × oversampling) টা প্রার্থী   [RAM-এ, দ্রুত]
  ২. ওই প্রার্থীদের মূল (float32) vector ডিস্ক থেকে এনে নির্ভুলভাবে আবার স্কোর                       [অল্প সংখ্যক, তাই সস্তা]
  ৩. নির্ভুল স্কোরে সাজিয়ে সেরা limit টা ফেরত
</pre></div>
<pre><span class="c"># collection তৈরি: scalar quantization + মূল vector ডিস্কে</span>
client.create_collection(
    "q8",
    vectors_config=models.VectorParams(size=1536, distance=models.Distance.COSINE, on_disk=True),   <span class="c"># মূল float32 ডিস্কে (mmap)</span>
    quantization_config=models.ScalarQuantization(
        scalar=models.ScalarQuantizationConfig(type=models.ScalarType.INT8, quantile=0.99, always_ram=True)),  <span class="c"># ছোট কপি RAM-এ</span>
)

<span class="c"># binary quantization (বড় dimension)</span>
quant_bin = models.BinaryQuantization(binary=models.BinaryQuantizationConfig(always_ram=True))

<span class="c"># query-তে rescoring + oversampling</span>
r = client.query_points("q8", query=q_1536, limit=10,
    search_params=models.SearchParams(
        quantization=models.QuantizationSearchParams(rescore=True, oversampling=2.0)))   <span class="c"># ২০টা এনে মূল দিয়ে পুনঃস্কোর, ১০টা ফেরত</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — Binary quantization কম-dimension model-এ</span>
৩৮৪-dim model-এ binary করলে প্রতিটা vector মাত্র ৩৮৪ বিট — তথ্য এত কমে যে recall দুর্বল হয়, rescoring দিয়েও পুরোপুরি পোষায় না। Binary ভালো কাজ করে উচ্চ-dimension (১০২৪+) ও মান-নির্ভর model-এ। সবসময় নিজের ডেটায় recall মেপে (অধ্যায় ১৩) সিদ্ধান্ত নিন; ডকুমেন্টের সাধারণ নিয়ম আপনার ডেটায় না-ও খাটতে পারে।</div>
<div class="callout behind"><span class="tag">পর্দার পেছনে — quantile কী</span>
Scalar quantization-এ float-কে ২৫৬টা ধাপে (int8) ভাগ করতে একটা পরিসর লাগে। শীর্ষ বিক্ষিপ্ত (outlier) মানগুলো ধরলে পরিসর অযথা বড় হয়ে বাকিদের নির্ভুলতা কমে। <code>quantile=0.99</code> মানে "সবচেয়ে বড় ১% মান ছেঁটে বাকি ৯৯% দিয়ে পরিসর ধরো" — বেশিরভাগ ডেটার জন্য ভালো ভারসাম্য।</div>
<p><b>লোকাল মোডে চালানো:</b> quantization-এর কনফিগ API গ্রহণ করে (যাচাই করা), কিন্তু লোকাল মোডে এর কোনো কার্যকর প্রভাব নেই; আসল মেমরি/গতির পার্থক্য দেখতে সার্ভারে চালাতে হবে।</p>

<h3>৯. Named Vectors, Sparse Vectors ও Hybrid Search</h3>
<h4>৯.১ কেন একাধিক vector</h4>
<p>একটা ডকুমেন্টের শিরোনাম, মূল লেখা, ছবির আলাদা embedding থাকতে পারে — অথবা একই লেখার <b>dense</b> (অর্থ) ও <b>sparse</b> (শব্দ-নির্ভর) দুটো আলাদা প্রতিনিধিত্ব। Qdrant একই point-এ একাধিক "named vector" রাখে।</p>
<pre>client.create_collection(
    "hybrid",
    vectors_config={"dense": models.VectorParams(size=4, distance=models.Distance.COSINE)},   <span class="c"># dense: অর্থ</span>
    sparse_vectors_config={"sparse": models.SparseVectorParams()},                              <span class="c"># sparse: শব্দ (SPLADE/BM25-ধরনের)</span>
)
client.upsert("hybrid", points=[
  models.PointStruct(id=1,
      vector={"dense": [0.9,0.1,0,0.05],
              "sparse": models.SparseVector(indices=[10,42], values=[0.8,0.5])},   <span class="c"># শুধু non-zero: term 10 → 0.8, term 42 → 0.5</span>
      payload={"t": "a"}),
  models.PointStruct(id=2,
      vector={"dense": [0.1,0.9,0.1,0],
              "sparse": models.SparseVector(indices=[42,77], values=[0.9,0.3])},
      payload={"t": "b"}),
])</pre>
<div class="callout why"><span class="tag">Sparse vector কী — একটা উপমা</span>
Dense vector = প্রতিটা বাক্যের ১৫৩৬টা সংখ্যার "অর্থের ছায়া"। Sparse vector = একটা বিশাল তালিকা (যেমন ৩০,০০০ শব্দের অভিধান) যেখানে প্রতিটা শব্দের জন্য একটা ঘর, কিন্তু বেশিরভাগ ঘর ফাঁকা (০) — শুধু এই লেখায় থাকা শব্দগুলোর ঘরে ওজন। এটা keyword search-এর "গণিতীয় রূপ"। SPLADE-এর মতো model একটা শেখা (learned) sparse vector বানায় যেখানে সম্পর্কিত শব্দও (প্রতিশব্দ) ওজন পায়। তাই sparse = হুবহু শব্দে শক্তিশালী, dense = অর্থে শক্তিশালী — একসাথে অজেয় (অধ্যায় ৭)।</div>
<h4>৯.২ Hybrid query — prefetch ও fusion</h4>
<pre>r = client.query_points(
    "hybrid",
    prefetch=[                                                    <span class="c"># দুটো আলাদা "প্রার্থী-খোঁজা", সমান্তরালে</span>
        models.Prefetch(query=[0.88,0.12,0.02,0.05], using="dense", limit=5),
        models.Prefetch(query=models.SparseVector(indices=[42], values=[1.0]), using="sparse", limit=5),
    ],
    query=models.FusionQuery(fusion=models.Fusion.RRF),           <span class="c"># র‍্যাঙ্ক-ভিত্তিক মেশানো</span>
    limit=2,
)
print([(p.id, round(p.score, 4)) for p in r.points])             <span class="c"># [(1, 0.8333), (2, 0.8333)]</span></pre>
<p><b>আউটপুটটা কেন টাই?</b> dense খোঁজায় id=1 প্রথম, id=2 দ্বিতীয়। sparse খোঁজায় (term 42): id=2-এর মান ০.৯, id=1-এর ০.৫ → id=2 প্রথম, id=1 দ্বিতীয়। অর্থাৎ <b>র‍্যাঙ্ক ঠিক উল্টো</b>, তাই দুজনের RRF যোগফল সমান — tie। এটা নিছক কাকতালীয় নয়, RRF-এর প্রতিসাম্যের ফল। আর ০.৮৩৩৩ এল কোথা থেকে? ডিফল্ট RRF-এ স্কোর = Σ 1/(k + rank) যেখানে এই সংস্করণে (<b>লোকাল মোডে যাচাই করা</b>) k = ২ ও rank শূন্য থেকে গোনা: ১/(২+০) + ১/(২+১) = ০.৫ + ০.৩৩৩৩ = <b>০.৮৩৩৩</b> ✓।</p>
<div class="callout behind"><span class="tag">পর্দার পেছনে — Qdrant-এর RRF বনাম পাঠ্যবইয়ের RRF</span>
অধ্যায় ৯-এর পাঠ্যবই-সূত্রে k = ৬০ ও rank ১ থেকে গোনা। Qdrant-এর ডিফল্ট ভিন্ন (ছোট k, শূন্য-ভিত্তিক rank) — ফলে ফল-র‍্যাঙ্কে প্রভাব ভিন্ন হতে পারে (ছোট k শীর্ষ র‍্যাঙ্ককে বেশি প্রাধান্য দেয়)। নতুন সংস্করণে k নিজে ঠিক করা যায়: <code>models.RrfQuery(rrf=models.Rrf(k=60))</code> — এটা যাচাই করা, ফল: d0 = <b>0.03306</b> = ১/৬০ + ১/৬১ ✓। আরও একটা fusion আছে <code>Fusion.DBSF</code> (Distribution-Based Score Fusion) যা র‍্যাঙ্ক নয়, স্কোরের বণ্টন স্বাভাবিকীকরণ করে মেশায়। সংস্করণ-নির্ভর; আপনার ডকুমেন্ট দেখুন।</div>
<div class="callout best"><span class="tag">Prefetch-এর শক্তি — বহু-ধাপ pipeline</span>
<code>prefetch</code> নেস্ট করা যায়: প্রথমে সস্তা (ছোট dimension বা quantized) vector দিয়ে ১০০০ প্রার্থী → তারপর বড় নির্ভুল vector দিয়ে rerank করে ১০০ → শেষে multivector (ColBERT) দিয়ে ১০। একটাই API কলে পুরো retrieval-pipeline সার্ভারেই — network round-trip ও ক্লায়েন্ট-কোড কম।</div>
<h4>৯.৩ Multivector (late interaction)</h4>

client.upsert("mv", [

    models.PointStruct(id=2, vector=[[0,0,1,0]]),

<h3>১১. Update, Delete, ID-নকশা ও Idempotency</h3>
<h4>১১.১ Upsert = "id থাকলে বদলাও, না থাকলে বানাও"</h4>
<p>একই <code>id</code> দিয়ে আবার upsert করলে পুরোনো point পুরো <b>বদলে যায়</b> (vector ও payload উভয়ই) — যাচাই করা: id=5 আবার upsert করার পরেও count ২০০ রয়ে গেছে, বাড়েনি। এটা idempotent লেখা — retry নিরাপদ।</p>
<h4>১১.২ ID বাছাই — Deterministic UUID (গুরুত্বপূর্ণ কৌশল)</h4>
<p>Qdrant-এর id অবশ্যই u64 বা UUID — আপনার "policy-1#chunk-0"-এর মতো string সরাসরি চলে না। সমাধান: <b>UUIDv5</b> — একই ইনপুট থেকে সবসময় একই UUID। ফলে ডকুমেন্ট আবার ingest করলে একই chunk একই id পায় → upsert পুরোনোটাকে বদলায়, ডুপ্লিকেট জমে না।</p>
<pre>import uuid
NS = uuid.UUID("6ba7b810-9dad-11d1-80b4-00c04fd430c8")          <span class="c"># আপনার প্রজেক্টের নির্দিষ্ট namespace (একবার ঠিক করে রাখুন)</span>

def point_id(doc_id: str, chunk_index: int) -&gt; str:
    return str(uuid.uuid5(NS, f"{doc_id}#{chunk_index}"))

point_id("policy-1", 0) == point_id("policy-1", 0)               <span class="c"># True — যাচাই করা; একই ইনপুট, একই id</span>
<span class="c"># 730b5cec-2417-5f06-a4de-119696a575cd</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — random UUID (uuid4) দিয়ে id বানানো</span>
প্রতিবার ingest-এ নতুন random id → একই chunk-এর পুরোনো ও নতুন কপি দুটোই থেকে যায় → খোঁজায় ডুপ্লিকেট ফল, "ভূতুড়ে" পুরোনো তথ্য। Deterministic id (UUIDv5) অথবা ডকুমেন্ট-id payload রেখে delete-by-filter + re-insert — দুটোর যেকোনো একটা পদ্ধতিতে idempotency নিশ্চিত করুন।</div>
<h4>১১.৩ Payload ও vector আংশিক আপডেট (যাচাই করা)</h4>
<pre>client.set_payload(COL, payload={"reviewed": True}, points=[1])       <span class="c"># বিদ্যমান payload-এ ফিল্ড যোগ/বদল (বাকি অক্ষত)</span>
client.delete_payload(COL, keys=["reviewed"], points=[1])             <span class="c"># নির্দিষ্ট ফিল্ড মোছা</span>
client.overwrite_payload(COL, payload={"only": 1}, points=[2])        <span class="c"># পুরো payload প্রতিস্থাপন</span>
client.update_vectors(COL, points=[models.PointVectors(id=5, vector=[0.1,0.2,0.3,0.4])])   <span class="c"># শুধু vector বদল, payload অক্ষত</span></pre>
<h4>১১.৪ Delete — id ধরে ও filter ধরে</h4>
<pre>client.delete(COL, points_selector=models.PointIdsList(points=[2]))                       <span class="c"># id ধরে</span>
client.delete(COL, points_selector=models.FilterSelector(filter=models.Filter(
    must=[models.FieldCondition(key="year", range=models.Range(lt=2024))])))               <span class="c"># filter ধরে — "২০২৪-এর আগের সব মুছে দাও"</span>
<span class="c"># ডকুমেন্ট বদলালে: doc_id payload দিয়ে সব পুরোনো chunk মুছে নতুন chunk upsert</span></pre>
<div class="callout best"><span class="tag">Best practice — <code>wait=True</code> কখন</span>
ডিফল্টে লেখা acknowledge হয় WAL-এ পৌঁছালে (<code>wait=True</code> হলে index-এ প্রয়োগের পরে)। ingestion-এ বড় batch দ্রুত পাঠাতে <code>wait=False</code>; কিন্তু "লিখলাম আর সাথে সাথে খুঁজলাম" ধরনের পরীক্ষা/ফ্লোতে <code>wait=True</code>, নইলে সদ্য লেখা point কখনো খোঁজায় আসে না (race)। বড় লোডে <code>client.upload_points(...)</code> (batch + সমান্তরাল) ব্যবহার করুন — আমরা ২০০ point এ <code>batch_size=64</code> দিয়ে যাচাই করেছি।</div>

<h3>১২. Alias দিয়ে Zero-downtime Re-embedding</h3>
<p>Embedding model বদলালে সব ডেটা আবার embed করতে হয় (অধ্যায় ৩, ১৪)। চালু সিস্টেম বন্ধ না করে এটা করার সবচেয়ে সুন্দর উপায় <b>alias</b>:</p>
<div class="diagram"><pre>
 ১. অ্যাপ পড়ে alias "policies_live" ──► collection "policies_v1" (পুরোনো model)
 ২. নতুন model দিয়ে সব ডেটা আবার embed করে নতুন collection "policies_v2" ভরো (পুরোনোটা চালু থাকতেই)
 ৩. নতুনটা যাচাই করো (golden set-এ recall — অধ্যায় ১৩)
 ৪. alias পরমাণুভাবে (atomic) সুইচ:  policies_live ──► policies_v2     (অ্যাপের কোড বদলাতে হয় না)
 ৫. সমস্যা হলে alias আবার v1-এ ফেরাও (rollback); ঠিক থাকলে v1 মুছো
</pre></div>
<pre>client.update_collection_aliases(change_aliases_operations=[
    models.CreateAliasOperation(create_alias=models.CreateAlias(collection_name="policies_v1", alias_name="policies_live"))])

<span class="c"># সুইচ: একই অনুরোধে পুরোনো alias মুছে নতুন বসানো — পরমাণুভাবে</span>
client.update_collection_aliases(change_aliases_operations=[
    models.DeleteAliasOperation(delete_alias=models.DeleteAlias(alias_name="policies_live")),
    models.CreateAliasOperation(create_alias=models.CreateAlias(collection_name="policies_v2", alias_name="policies_live")),
])
<span class="c"># অ্যাপ সবসময় collection_name="policies_live" দিয়ে query করে — alias দিয়ে query যাচাই করা (২টা ফল এসেছে)</span></pre>

<h3>১৩. REST API — curl দিয়ে সরাসরি (সার্ভারে)</h3>
<p>এই অংশ Qdrant-এর প্রচলিত REST API থেকে লেখা — <b>সার্ভার না থাকায় চালানো যায়নি</b>। (Query API ~১.১০+ ধরে।)</p>
<pre>H='-H "api-key: change-me-long-random-key" -H "Content-Type: application/json"'

}'

<span class="c"># payload index</span>
curl -X PUT http://localhost:6333/collections/policies/index $H -d '{ "field_name": "dept", "field_schema": "keyword" }'

  "params": { "hnsw_ef": 128, "exact": false },

}'

<span class="c"># hybrid (dense + sparse + RRF)</span>

    { "query": { "indices": [42], "values": [1.0] }, "using": "sparse", "limit": 20 }
  ],
  "query": { "fusion": "rrf" },
  "limit": 10
}'

<span class="c"># scroll, count, delete-by-filter</span>

curl -X POST http://localhost:6333/collections/policies/points/count  $H -d '{ "filter": { "must": [ { "key": "dept", "match": { "value": "finance" } } ] }, "exact": true }'
curl -X POST http://localhost:6333/collections/policies/points/delete $H -d '{ "filter": { "must": [ { "key": "year", "range": { "lt": 2024 } } ] } }'

curl -X POST http://localhost:6333/collections/aliases $H -d '{ "actions": [ { "create_alias": { "collection_name": "policies_v2", "alias_name": "policies_live" } } ] }'</pre>

<h3>১৪. Scale ও Operations — Cluster, Shard, Replica, Snapshot</h3>
<h4>১৪.১ Distributed mode (সংক্ষেপে)</h4>
<p>একটা মেশিনে না আঁটলে বা উচ্চ-প্রাপ্যতা চাইলে Qdrant cluster চালানো যায় — নোডগুলো মেটাডেটা ঠিক রাখতে <b>Raft consensus</b> ব্যবহার করে। collection তৈরির সময় ঠিক হয়:</p>
<table>
<tr><th>প্যারামিটার</th><th>অর্থ</th><th>বাছাই-নির্দেশ</th></tr>
<tr><td><code>shard_number</code></td><td>collection কয়টা অংশে (shard) ভাগ হবে — প্রতিটা আলাদা নোডে</td><td>সাধারণত নোড-সংখ্যার গুণিতক; ভবিষ্যৎ বৃদ্ধির কথা ভেবে একটু বেশি</td></tr>
<tr><td><code>replication_factor</code></td><td>প্রতিটা shard-এর কয়টা কপি</td><td>production-এ ≥ ২ (একটা নোড পড়লেও চলে)</td></tr>
<tr><td><code>write_consistency_factor</code></td><td>লেখা সফল ধরতে কয়টা replica-র নিশ্চিতকরণ লাগবে</td><td>ছোট = দ্রুত কিন্তু কম নিরাপদ; বড় = নিরাপদ কিন্তু ধীর</td></tr>
<tr><td><code>on_disk_payload</code></td><td>payload RAM-এর বদলে ডিস্কে</td><td>payload বড় হলে মেমরি বাঁচে, filter-ফিল্ড অবশ্যই index করুন</td></tr>
</table>
<div class="callout why"><span class="tag">পরিকল্পনার নীতি</span>
Shard সংখ্যা collection তৈরির সময় ঠিক হয়; পরে বদলানো (resharding) সংস্করণ-নির্ভর ও ভারী। তাই আগে থেকে ক্ষমতা-পরিকল্পনা করুন (অধ্যায় ১৪)। Replica বাড়ালে <b>read throughput ও প্রাপ্যতা</b> বাড়ে (খোঁজা ছড়িয়ে যায়), কিন্তু <b>মেমরি/খরচ গুণিতকে</b> বাড়ে।</div>
<h4>১৪.২ স্টোরেজ — মেমরি ও ডিস্কের ভারসাম্য</h4>
<table>
<tr><th>কৌশল</th><th>কী</th><th>ফল</th></tr>
<tr><td>সব RAM-এ</td><td>vector + index + payload RAM-এ</td><td>সবচেয়ে দ্রুত; সবচেয়ে দামী</td></tr>
<tr><td>Quantized RAM-এ + মূল ডিস্কে (mmap)</td><td>৮ নং অংশের কনফিগ</td><td>মেমরি ৪–৩২× কম, rescoring-এ ডিস্ক পড়া; দ্রুত SSD/NVMe দরকার</td></tr>
<tr><td><code>on_disk</code> HNSW + vector</td><td>প্রায় সব ডিস্কে</td><td>সবচেয়ে সস্তা; latency বেশি; দ্রুত NVMe ছাড়া অনুপযুক্ত</td></tr>
</table>
<h4>১৪.৩ Snapshot, Backup ও Monitoring</h4>
<ul>
<li><b>Snapshot:</b> collection-এর সম্পূর্ণ ছবি (REST <code>POST /collections/{name}/snapshots</code>); অন্য সার্ভারে restore করা যায়। নিয়মিত (cron) নিয়ে বাইরের স্টোরেজে (S3 ইত্যাদি) রাখুন।</li>
<li><b>Cluster-এ:</b> প্রতিটা নোডের snapshot আলাদা; পুরো-cluster ব্যাকআপ-পরিকল্পনা আলাদা করে ভাবতে হয়।</li>
<li><b>Monitoring:</b> <code>/metrics</code> (Prometheus ফরম্যাট) — request latency, collection আকার, segment সংখ্যা, optimizer অবস্থা। কোন collection "yellow/optimizing" বা "red" তা নজরে রাখুন।</li>
<li><b>নিরাপত্তা:</b> API key / JWT (read-only token সহ), TLS, নেটওয়ার্ক-সীমা (অধ্যায় ১৫)।</li>
</ul>

<h3>১৫. Python-এ পূর্ণ ingestion + search (প্রজেক্ট-ধাঁচ)</h3>
<p>নিচের কোড idempotent ingestion + hybrid-সক্ষম খোঁজার কাঠামো। Embedding ফাংশন আপনার provider দিয়ে বসাতে হবে (অধ্যায় ৩) — তাই এখানে সেটা stub; বাকি Qdrant-অংশের API সব উপরে চালিয়ে যাচাই করা।</p>
<pre>import uuid, hashlib
from qdrant_client import QdrantClient, models

NS = uuid.UUID("6ba7b810-9dad-11d1-80b4-00c04fd430c8")
DIM = 1536
client = QdrantClient(url="http://localhost:6333", api_key="change-me-long-random-key")

def embed(texts: list[str]) -&gt; list[list[float]]:
    raise NotImplementedError            <span class="c"># আপনার embedding provider (batch)</span>

def ensure_collection(name: str):
    if client.collection_exists(name): return
    client.create_collection(
        name,
        vectors_config=models.VectorParams(size=DIM, distance=models.Distance.COSINE, on_disk=True),
        quantization_config=models.ScalarQuantization(
            scalar=models.ScalarQuantizationConfig(type=models.ScalarType.INT8, quantile=0.99, always_ram=True)),
    )
    for field, schema in [("tenant", "keyword"), ("dept", "keyword"), ("year", "integer"), ("doc_id", "keyword")]:
        client.create_payload_index(name, field, schema)        <span class="c"># filter করবেন এমন সব ফিল্ড</span>

def pid(doc_id: str, i: int) -&gt; str:
    return str(uuid.uuid5(NS, f"{doc_id}#{i}"))

def ingest(name: str, tenant: str, doc_id: str, dept: str, year: int, chunks: list[str], model: str):
    vecs = embed(chunks)                                          <span class="c"># একসাথে batch</span>
    points = [
        models.PointStruct(
            id=pid(doc_id, i), vector=v,
            payload={"tenant": tenant, "doc_id": doc_id, "chunk": i, "dept": dept, "year": year,
                     "text": c, "embed_model": model, "hash": hashlib.sha256(c.encode()).hexdigest()})
        for i, (c, v) in enumerate(zip(chunks, vecs))
    ]
    client.upload_points(name, points, batch_size=128, wait=True)    <span class="c"># deterministic id → আবার চালালে বদলায়, বাড়ে না</span>
    <span class="c"># ডকুমেন্ট ছোট হলে বাড়তি পুরোনো chunk মোছা</span>
    client.delete(name, points_selector=models.FilterSelector(filter=models.Filter(must=[
        models.FieldCondition(key="doc_id", match=models.MatchValue(value=doc_id)),
        models.FieldCondition(key="chunk", range=models.Range(gte=len(chunks)))])))

def search(name: str, tenant: str, question: str, dept: str | None = None, k: int = 8, min_score: float = 0.7):
    must = [models.FieldCondition(key="tenant", match=models.MatchValue(value=tenant))]   <span class="c"># বাধ্যতামূলক tenant filter</span>
    if dept: must.append(models.FieldCondition(key="dept", match=models.MatchValue(value=dept)))
    r = client.query_points(name, query=embed([question])[0], query_filter=models.Filter(must=must),
                            limit=k, score_threshold=min_score, with_payload=True,
                            search_params=models.SearchParams(hnsw_ef=128,
                                quantization=models.QuantizationSearchParams(rescore=True, oversampling=2.0)))
    return [(p.score, p.payload["text"], p.payload["doc_id"]) for p in r.points]</pre>
<div class="callout best"><span class="tag">নকশার কারণ</span>
(১) <b>Deterministic id + doc_id payload:</b> আবার ingest করলে ডুপ্লিকেট নয়, বাড়তি chunk-ও মোছা। (২) <b>tenant সবসময় filter-এ</b> ও index করা (বাধ্যতামূলক, ডিফল্টভাবে অন্তর্ভুক্ত — ভুলে যাওয়ার সুযোগ কম)। (৩) <b>quantization + rescore:</b> মেমরি কম, নির্ভুলতা ঠিক। (৪) <b>embed_model payload-এ:</b> মিশ্র model শনাক্ত ও migration-এর জন্য। (৫) <b>batch upload:</b> দ্রুত।</div>

<h3>১৬. .NET (C#) থেকে Qdrant</h3>
<p>অফিসিয়াল <code>Qdrant.Client</code> NuGet package (gRPC-ভিত্তিক, ডিফল্ট পোর্ট ৬৩৩৪)। নিচের কোড <b>কমপাইল করে দেখা</b> (<code>Qdrant.Client</code> ১.১৯.০), তবে সার্ভার না থাকায় <b>চালানো হয়নি</b> — আপনার package version-এ নাম/সিগনেচার সামান্য ভিন্ন হতে পারে।</p>
<pre>dotnet add package Qdrant.Client</pre>
<pre>using Qdrant.Client;
using Qdrant.Client.Grpc;
using static Qdrant.Client.Grpc.Conditions;      <span class="c">// MatchKeyword, Range ইত্যাদি filter helper</span>

public record PolicyHit(ulong Id, float Score, string Text);

public class QdrantPolicyStore(QdrantClient client)
{
    const string Col = "policies";

    public async Task EnsureAsync()
    {
        if (await client.CollectionExistsAsync(Col)) return;
        await client.CreateCollectionAsync(Col,
            new VectorParams { Size = 1536, Distance = Distance.Cosine, OnDisk = false },
            hnswConfig: new HnswConfigDiff { M = 16, EfConstruct = 100 },
            quantizationConfig: new QuantizationConfig
            {
                Scalar = new ScalarQuantization { Type = QuantizationType.Int8, Quantile = 0.99f, AlwaysRam = true }
            });
        await client.CreatePayloadIndexAsync(Col, "dept", PayloadSchemaType.Keyword);    <span class="c">// filter-ফিল্ডের index</span>
        await client.CreatePayloadIndexAsync(Col, "year", PayloadSchemaType.Integer);
    }

    public async Task UpsertAsync(ulong id, float[] vec, string dept, int year, string text)
    {
        var p = new PointStruct { Id = id, Vectors = vec };
        p.Payload["dept"] = dept; p.Payload["year"] = year; p.Payload["text"] = text;
        await client.UpsertAsync(Col, new[] { p }, wait: true);
    }

    public async Task&lt;IReadOnlyList&lt;PolicyHit&gt;&gt; SearchAsync(float[] q, string dept, int minYear, int k)
    {
        var res = await client.QueryAsync(Col, query: q,
            filter: MatchKeyword("dept", dept) &amp; Range("year", new Qdrant.Client.Grpc.Range { Gte = minYear }),   <span class="c">// &amp; = AND</span>
            searchParams: new SearchParams { HnswEf = 128, Exact = false },
            limit: (ulong)k, payloadSelector: true);
        return res.Select(r =&gt; new PolicyHit(r.Id.Num, r.Score, r.Payload["text"].StringValue)).ToList();
    }

    public async Task&lt;long&gt; CountAsync(string dept) =&gt;
        (long)await client.CountAsync(Col, filter: MatchKeyword("dept", dept), exact: true);

    public async Task DeleteDeptAsync(string dept) =&gt; await client.DeleteAsync(Col, MatchKeyword("dept", dept));
}

<span class="c">// Program.cs — QdrantClient thread-safe, একটাই Singleton</span>

builder.Services.AddSingleton&lt;QdrantPolicyStore&gt;();
app.MapGet("/api/policies", async (QdrantPolicyStore s, string q /*... embed করে */) =&gt; { /* s.SearchAsync(...) */ });</pre>
<div class="callout best"><span class="tag">.NET-এ কয়েকটা বিষয়</span>
(১) <code>QdrantClient</code> একটা gRPC channel ধরে রাখে — <b>Singleton</b> করুন (প্রতি request-এ নতুন বানাবেন না)। (২) Embedding তৈরির জন্য <code>Microsoft.Extensions.AI</code>-এর <code>IEmbeddingGenerator</code> (AI কোর্সের Integration অধ্যায়) — Qdrant-অংশ থেকে আলাদা রাখুন যাতে vector DB বদলানো সহজ থাকে (অধ্যায় ১১-র portability)। (৩) ID <code>ulong</code> বা <code>Guid</code> — string-কে UUIDv5 (<code>Guid</code>) বানিয়ে নিন। (৪) Sparse/hybrid (prefetch + fusion) ও multivector-এর C# সিনট্যাক্স সংস্করণ-নির্ভর — সঠিক টাইপ ও প্যারামিটারক্রম আপনার client-এর ডকুমেন্টে দেখে নিন (আমরা এখানে সেগুলোর কোড দেখাইনি, কারণ যাচাই ছাড়া ভুল সিনট্যাক্স দেওয়া বিপজ্জনক)।</div>

<h3>১৭. কখন Qdrant, কখন pgvector — সিদ্ধান্তের গাইড</h3>
<table>
<tr><th>বিষয়</th><th>pgvector জেতে</th><th>Qdrant জেতে</th></tr>
<tr><td>আপনার ডেটা ইতিমধ্যে PostgreSQL-এ, SQL-এর সাথে JOIN/transaction দরকার</td><td><b>হ্যাঁ</b></td><td>না — দুই সিস্টেম সিঙ্ক করতে হবে</td></tr>
<tr><td>Vector সংখ্যা কোটি ছাড়িয়ে, কঠোর latency</td><td>কঠিন হতে পারে</td><td><b>হ্যাঁ</b> — বিশেষায়িত, shard করা সহজ</td></tr>
<tr><td>কঠোর filter (multi-tenant, ১%-এর কম) + উচ্চ recall</td><td>workaround লাগে (অধ্যায় ৯)</td><td><b>হ্যাঁ</b> — filterable HNSW নকশাতেই</td></tr>
<tr><td>মেমরি কমানো (quantization-এর সূক্ষ্ম নিয়ন্ত্রণ)</td><td>halfvec, bit সীমিত</td><td><b>হ্যাঁ</b> — scalar/product/binary + rescoring + on-disk</td></tr>
<tr><td>Hybrid dense+sparse, multivector, বহু-ধাপ prefetch pipeline</td><td>SQL-এ নিজে বানাতে হয়</td><td><b>হ্যাঁ</b> — প্রথম-শ্রেণির feature</td></tr>
<tr><td>অতিরিক্ত অপারেশনাল বোঝা এড়ানো</td><td><b>হ্যাঁ</b> — নতুন সার্ভিস নেই</td><td>আলাদা সার্ভিস চালাতে ও মনিটর করতে হয়</td></tr>
<tr><td>Row-level নিরাপত্তা (RLS), ACID</td><td><b>হ্যাঁ</b></td><td>না (অ্যাপ-স্তরে filter ও API-key/JWT)</td></tr>
<tr><td>ডেটা-একক বড় ও আপডেট-ভারী</td><td>MVCC bloat সামলাতে হয়</td><td>segment/optimizer-ভিত্তিক — আলাদা ধরনের আচরণ</td></tr>
</table>
<div class="callout best"><span class="tag">অনুশীলনী সিদ্ধান্ত-নিয়ম</span>
শুরু করুন pgvector-এ (সবচেয়ে কম জটিলতা)। <b>Qdrant-এ সরানোর সংকেত:</b> (১) filtered search-এ recall নিয়ে নিয়মিত সমস্যা ও workaround জটিল হচ্ছে, (২) vector সংখ্যা/মেমরি PostgreSQL-কে চাপে ফেলছে, (৩) অন্য কাজের query-র সাথে vector search সংঘর্ষ করছে (resource contention), (৪) hybrid/multivector/quantization-এর উন্নত নিয়ন্ত্রণ দরকার। আর সরার সময় — source of truth (chunk, metadata) আপনার PostgreSQL-এই রাখুন, Qdrant-কে রাখুন <b>পুনর্নির্মাণযোগ্য index</b> হিসেবে (অধ্যায় ১১, ১৪)।</div>

<h3>১৮. Failure Mode ও সমস্যা-সমাধান</h3>
<table>
<tr><th>লক্ষণ</th><th>সম্ভাব্য কারণ</th><th>সমাধান</th></tr>
<tr><td>Filter-সহ query ধীর/কম-নির্ভুল</td><td>filter-ফিল্ডে payload index নেই</td><td><code>create_payload_index</code></td></tr>
<tr><td>বড় লোডের পর খোঁজা ধীর</td><td>optimizer এখনো index বানাচ্ছে (collection "yellow")</td><td>অপেক্ষা; <code>GET /collections/{name}</code>-এ status দেখুন; লোডের সময় indexing সাময়িক বন্ধ/পরে চালু (উন্নত)</td></tr>
<tr><td>সদ্য লেখা point খোঁজায় আসছে না</td><td><code>wait=False</code> ও দ্রুত পড়া</td><td><code>wait=True</code> বা কিছুক্ষণ পর</td></tr>
<tr><td>ডুপ্লিকেট ফল</td><td>random id, একই chunk একাধিকবার</td><td>deterministic UUIDv5; delete-by-doc_id</td></tr>
<tr><td>Recall কম (quantization চালুর পর)</td><td>rescore বন্ধ / oversampling কম / কম-dim-এ binary</td><td><code>rescore=True, oversampling≥2</code>; scalar-এ ফিরুন; recall মাপুন</td></tr>

<p>বাছাইয়ের আগে সবচেয়ে কাজের গণনা: "আমার ডেটা কত বড়?" নিচের সংখ্যা Python-এ গণনা করা। (নিয়ম: float32 = ৪ বাইট; int8 scalar quantization = ১ বাইট; binary = ১ বিট; HNSW graph ≈ প্রতি node-এ <code>2×m×4</code> বাইট স্তর-০ সংযোগ, <code>m=16</code> → ~১২৮ বাইট — মোটামুটি আন্দাজ, বাস্তবে উপরের স্তর ও ওভারহেড কিছু যোগ হয়।)</p>

<div class="callout why"><span class="tag">এই টেবিল থেকে ৪টা শিক্ষা</span>
(১) <b>১০ লাখ vector</b> (১৫৩৬-dim) মাত্র ~৬ GB — যেকোনো সাধারণ সার্ভারে, pgvector-এ সহজেই। এখানে "বিশেষায়িত Vector DB" প্রায়ই অপ্রয়োজনীয়। (২) <b>১ কোটি</b> = ~৬১ GB — এখানে quantization/বড় RAM/ভাবনা শুরু। (৩) <b>১০ কোটির উপরে</b> — আসল scale-সমস্যা; shard, quantization, disk-ভিত্তিক index অপরিহার্য। (৪) <b>১০০ কোটি</b> — শুধু বিশেষায়িত ও distributed সমাধান (Milvus, Vespa, বিশাল Qdrant/Pinecone cluster); একজন নতুন প্রজেক্টের প্রায় কখনোই এই পর্যায়ে যাওয়ার কথা নয়। <b>আপনার ডেটা কোন সারিতে পড়ে তা জানলেই বিকল্পের অর্ধেক বাদ পড়ে যায়।</b></div>
<div class="callout behind"><span class="tag">pgvector-এর সাথে পার্থক্য — index-এ vector-এর কপি</span>
উপরে HNSW graph-কে ছোট দেখাচ্ছে (শুধু সংযোগের তালিকা), কারণ Qdrant/অনেক বিশেষায়িত DB graph ও vector আলাদা রাখে। pgvector-এ HNSW index-এর ভেতরেই vector-এর কপি থাকে, তাই table + index মিলে vector-ডেটা প্রায় <b>দ্বিগুণ</b> জায়গা নেয় (অধ্যায় ৯, ১৩.৩)। মেমরি-পরিকল্পনায় এই পার্থক্য আসল।</div>

<h3>৪. প্রতিটা সমাধানের গভীর পরিচয়</h3>
<p>প্রতিটার জন্য একই কাঠামো: <b>কী/স্থাপত্য → শক্তি → দুর্বলতা → হোস্টিং → মূল্য কীভাবে হয় → কোন scale-এ → API-র স্বাদ → কখন বাছবেন / কখন নয়।</b></p>

<h4>৪.১ pgvector (পুনরাবৃত্তি ছাড়া সংক্ষেপে — অধ্যায় ৯)</h4>
<table>
<tr><th>কী</th><td>PostgreSQL extension; vector আপনার table-এর কলাম; HNSW/IVFFlat index</td></tr>
<tr><th>শক্তি</th><td>ACID, SQL JOIN, RLS, বিদ্যমান অবকাঠামো; কোনো নতুন সার্ভিস নেই</td></tr>
<tr><th>দুর্বলতা</th><td>filtered search-এর ফাঁদ; বিশাল scale/কম latency-তে সীমা; index-এর মেমরি; native sharding নেই</td></tr>
<tr><th>হোস্টিং</th><td>self-host বা প্রায় সব managed PostgreSQL (RDS, Azure, Cloud SQL, Supabase, Neon...)</td></tr>
<tr><th>মূল্য</th><td>আপনার PostgreSQL-এর খরচই (compute + storage + backup) — আলাদা vector-মূল্য নেই</td></tr>
<tr><th>Scale</th><td>সাধারণত কয়েক হাজার থেকে কয়েক কোটি; তার উপরে সতর্কতা ও পরিকল্পনা</td></tr>
<tr><th>API</th><td>SQL (<code>ORDER BY embedding &lt;=&gt; $1 LIMIT k</code>)</td></tr>
<tr><th>বাছুন</th><td>বিদ্যমান PostgreSQL + মাঝারি scale + SQL-সম্পর্ক দরকার → <b>প্রথম পছন্দ</b></td></tr>
<tr><th>নয়</th><td>কঠোর multi-tenant filter + কোটি vector + ছোট দল যারা workaround সামলাতে চায় না</td></tr>
</table>

<h4>৪.২ Qdrant (পুনরাবৃত্তি ছাড়া সংক্ষেপে — অধ্যায় ১০)</h4>
<table>
<tr><th>কী</th><td>Rust-এ লেখা purpose-built Vector DB; segment + WAL + optimizer; filterable HNSW</td></tr>
<tr><th>শক্তি</th><td>filtered search-এ নকশাগত সমাধান, quantization-এর সূক্ষ্ম নিয়ন্ত্রণ, hybrid (named dense+sparse), multivector, alias-based re-embedding</td></tr>
<tr><th>দুর্বলতা</th><td>আলাদা সিস্টেম; transaction/JOIN নেই; DB-র সাথে সিঙ্ক রাখতে হয়</td></tr>
<tr><th>হোস্টিং</th><td>Docker/K8s self-host; Qdrant Cloud (managed); hybrid cloud</td></tr>
<tr><th>মূল্য</th><td>self-host: আপনার সার্ভার-খরচ; cloud: সাধারণত cluster-আকার (RAM/ডিস্ক/নোড) ও ঘণ্টা-ভিত্তিক — বর্তমান মূল্য-মডেল ২০২৬-এ যাচাই করুন</td></tr>
<tr><th>Scale</th><td>লাখ থেকে কয়েকশো কোটি (cluster-এ)</td></tr>
<tr><th>API</th><td>REST + gRPC; Python/.NET/JS/Go/Rust client</td></tr>
<tr><th>বাছুন</th><td>কঠোর filter/multi-tenant, উচ্চ scale, মেমরি-নিয়ন্ত্রণ, hybrid pipeline</td></tr>
<tr><th>নয়</th><td>ছোট প্রজেক্ট যেখানে PostgreSQL-ই যথেষ্ট</td></tr>
</table>

<h4>৪.৩ Pinecone — managed-first, serverless</h4>
<table>
<tr><th>কী</th><td>সম্পূর্ণ managed (SaaS) Vector DB — আপনি সার্ভার দেখেন না। স্থাপত্য-ধারণা: serverless মডেলে storage ও compute আলাদা, আপনি index-এর "আকার" নয়, ব্যবহার (read/write, storage) অনুযায়ী দেন (ডকুমেন্টেড মডেল; বর্তমান বিবরণ যাচাই করুন)</td></tr>
<tr><th>শক্তি</th><td>অপারেশন প্রায় শূন্য; দ্রুত শুরু; <b>namespace</b>-ভিত্তিক multi-tenancy প্রথম-শ্রেণির; scale-নিয়ে চিন্তা কম; metadata filter; হাইব্রিড/integrated inference (সংস্করণ-নির্ভর)</td></tr>
<tr><th>দুর্বলতা</th><td>closed-source, শুধু cloud — ডেটা তাদের পরিকাঠামোতে; vendor lock-in; খরচ scale-এ দ্রুত বাড়তে পারে; ইনফ্রাস্ট্রাকচারের ভেতরে কী হচ্ছে তা দেখা/টিউন করার সুযোগ সীমিত; নিজস্ব ডেটা-আবাসন (residency) প্রয়োজন হলে অঞ্চল-সীমা যাচাই</td></tr>
<tr><th>হোস্টিং</th><td>শুধু Pinecone-এর managed cloud (AWS/GCP/Azure-এ অঞ্চল বেছে)</td></tr>
<tr><th>মূল্য কীভাবে</th><td>ব্যবহার-ভিত্তিক (পড়া/লেখার ইউনিট + সংরক্ষিত ডেটা) এবং প্ল্যান-স্তর; আগের pod-ভিত্তিক মডেল ছিল (নির্দিষ্ট ক্ষমতা × ঘণ্টা) — <b>২০২৬-এ যাচাই করুন</b></td></tr>
<tr><th>Scale</th><td>লাখ থেকে বিলিয়ন (তাদের দাবি/ডকুমেন্ট অনুযায়ী) — নিজের workload-এ পরীক্ষা করুন</td></tr>
<tr><th>API</th><td>Python/JS/.NET/Java/Go SDK; REST</td></tr>
<tr><th>বাছুন</th><td>ছোট দল, অপারেশন-সময় নেই, দ্রুত বাজারে যেতে চান, ডেটা-আবাসনে কোনো বাধা নেই, খরচ সহনীয়</td></tr>
<tr><th>নয়</th><td>ডেটা অবশ্যই নিজের অবকাঠামোয় রাখতে হবে; খরচ-নিয়ন্ত্রণ কঠোর; lock-in এড়াতে চান</td></tr>
</table>
<pre><span class="c"># API-র স্বাদ (Python; সংস্করণ অনুযায়ী বদলায়, চালানো হয়নি)</span>
from pinecone import Pinecone, ServerlessSpec
pc = Pinecone(api_key="...")
pc.create_index(name="policies", dimension=1536, metric="cosine",
                spec=ServerlessSpec(cloud="aws", region="us-east-1"))
index = pc.Index("policies")
index.upsert(vectors=[{"id": "p1#0", "values": [...], "metadata": {"dept": "finance", "year": 2025}}],
             namespace="tenant-7")                                   <span class="c"># namespace = tenant-বিচ্ছিন্নতা</span>
res = index.query(vector=[...], top_k=5, include_metadata=True,
                  filter={"dept": {"$eq": "finance"}}, namespace="tenant-7")</pre>

<h4>৪.৪ Weaviate — "batteries-included" ও বিল্ট-ইন hybrid</h4>
<table>
<tr><th>কী</th><td>open-source Vector DB (Go); object-ভিত্তিক ডেটা মডেল (class/collection + property); HNSW/flat/dynamic index; <b>বিল্ট-ইন BM25 ও hybrid search</b>; embedding তৈরির মডিউল (vectorizer) সংযুক্ত করা যায়</td></tr>
<tr><th>শক্তি</th><td>hybrid search সহজ (একটা <code>alpha</code> প্যারামিটারে vector↔keyword ভারসাম্য); multi-tenancy প্রথম-শ্রেণির (প্রতি-tenant আলাদা shard); GraphQL/REST/gRPC; মডিউলার (embedding/reranker integration)</td></tr>
<tr><th>দুর্বলতা</th><td>নিজস্ব ডেটা-মডেল শিখতে হয়; নিজে চালালে অপারেশনাল জটিলতা মাঝারি; সংস্করণ-পরিবর্তনে API-র পার্থক্য (v3→v4 client)</td></tr>
<tr><th>হোস্টিং</th><td>self-host (Docker/K8s) বা Weaviate Cloud</td></tr>
<tr><th>মূল্য কীভাবে</th><td>self-host: সার্ভার-খরচ; cloud: সাধারণত ব্যবহার/dimension-সংখ্যা বা ক্ষমতা-ভিত্তিক — যাচাই করুন</td></tr>
<tr><th>Scale</th><td>লাখ থেকে কয়েক কোটি+ (cluster-এ)</td></tr>
<tr><th>বাছুন</th><td>hybrid search সহজ চান, multi-tenant, মডিউলার pipeline</td></tr>
<tr><th>নয়</th><td>SQL-সম্পর্ক দরকার, বা সবচেয়ে সরল স্থাপত্য চান</td></tr>
</table>
<pre><span class="c"># API-র স্বাদ (Python client v4; চালানো হয়নি)</span>

                            filters=Filter.by_property("dept").equal("finance"))</pre>

<h4>৪.৫ Milvus / Zilliz Cloud — বিশাল scale-এর জন্য বানানো</h4>

<h4>৪.৬ Elasticsearch / OpenSearch — keyword-সম্রাটের vector ক্ষমতা</h4>
<table>
<tr><th>কী</th><td>সার্চ ইঞ্জিন (Apache Lucene-ভিত্তিক, JVM) যা নিজের inverted index-এর পাশে <code>dense_vector</code> ও HNSW kNN যোগ করেছে। OpenSearch (Amazon-নেতৃত্বাধীন fork) একই ধারার নিজস্ব kNN plugin (Lucene/Faiss/nmslib ইঞ্জিন) দেয়</td></tr>
<tr><th>শক্তি</th><td><b>keyword/BM25 ও hybrid search-এ শ্রেষ্ঠ</b> (একই সিস্টেমে পূর্ণ-টেক্সট + vector + aggregation/ফ্যাসেট); পরিপক্ক অপারেশন, মনিটরিং, security (role/field-level); বিশাল ইকোসিস্টেম; আপনার যদি ইতিমধ্যে ELK/সার্চ থাকে — নতুন সিস্টেম নয়</td></tr>
<tr><th>দুর্বলতা</th><td>JVM-ভিত্তিক ভারী; vector মেমরি-ব্যয়বহুল (segment-ভিত্তিক HNSW — প্রতি segment-এ আলাদা graph); segment merge/refresh আচরণ বোঝা দরকার; বিশুদ্ধ vector-কাজে বিশেষায়িত DB-র চেয়ে সাধারণত বেশি সম্পদ লাগে; real-time লেখা তাৎক্ষণিক নয় (refresh interval)</td></tr>
<tr><th>হোস্টিং</th><td>self-host; Elastic Cloud; Amazon OpenSearch Service/Serverless; Azure-এ বিভিন্ন বিকল্প</td></tr>
<tr><th>মূল্য কীভাবে</th><td>নোড/ইন্সটেন্স-ঘণ্টা + স্টোরেজ (managed-এ ক্ষমতা-স্তর বা serverless-এ ব্যবহার-ইউনিট) — যাচাই করুন</td></tr>
<tr><th>Scale</th><td>লাখ থেকে কয়েক শত কোটি (বিপুল cluster-এ); vector-এ মেমরি প্রধান সীমা</td></tr>
<tr><th>বাছুন</th><td>ইতিমধ্যে Elasticsearch/OpenSearch আছে; hybrid/keyword-ভারী (ই-কমার্স সার্চ, লগ/ডকুমেন্ট সার্চ) + vector; ফ্যাসেট/aggregation দরকার</td></tr>
<tr><th>নয়</th><td>বিশুদ্ধ vector কাজ, ছোট দল যারা Elasticsearch-অপারেশন নতুন করে শিখতে চান না</td></tr>
</table>

POST /policies/_search
{
  "knn": {
    "field": "embedding",
    "query_vector": [ ... ],
    "k": 10,
    "num_candidates": 100,                    <span class="c">// প্রতি shard-এ কতজন প্রার্থী (≈ ef_search)</span>
    "filter": { "term": { "dept": "finance" } }
  },
  "query": { "match": { "text": "refund policy" } },     <span class="c">// একই request-এ BM25 — hybrid</span>

<h4>৪.৭ Azure AI Search — .NET/Azure-কেন্দ্রিক এন্টারপ্রাইজের জন্য</h4>
<table>
<tr><th>কী</th><td>Microsoft-এর managed search সেবা: পূর্ণ-টেক্সট (BM25) + vector (HNSW বা exhaustive KNN) + ঐচ্ছিক "semantic ranker" (reranker) + integrated vectorization/chunking (সংস্করণ-নির্ভর)</td></tr>
<tr><th>শক্তি</th><td><b>Azure ও .NET ইকোসিস্টেমের সাথে নিবিড়</b> (Azure.Search.Documents SDK, Entra ID/RBAC, Private Link, Blob/SQL/Cosmos indexer); hybrid + reranker একসাথে; document-level security trimming-এর জন্য filter-ভিত্তিক প্যাটার্ন; এন্টারপ্রাইজ compliance ও SLA; অপারেশন Microsoft-এর</td></tr>
<tr><th>দুর্বলতা</th><td>closed, শুধু Azure — তীব্র lock-in; স্তর/টায়র-ভিত্তিক সীমা (index সংখ্যা, vector আকার, partition/replica) ও খরচ — scale বাড়ালে দ্রুত দামী; কাস্টমাইজেশন সীমিত</td></tr>
<tr><th>মূল্য কীভাবে</th><td>প্রতি "search unit" (replica × partition) ঘণ্টা-ভিত্তিক, টায়র অনুযায়ী; semantic ranker ইত্যাদি আলাদা — <b>২০২৬-এ যাচাই করুন</b></td></tr>
<tr><th>Scale</th><td>টায়র-নির্ভর; লাখ থেকে কয়েক কোটি vector (সীমা সংস্করণে বদলায়)</td></tr>
<tr><th>বাছুন</th><td>আপনার কোম্পানি Azure-এ, .NET টিম, এন্টারপ্রাইজ নিরাপত্তা/compliance, অপারেশন-মুক্ত hybrid + reranker চান</td></tr>
<tr><th>নয়</th><td>cloud-নিরপেক্ষ থাকতে চান; খরচ-সংবেদনশীল বড় scale</td></tr>
</table>

<h4>৪.৮ MongoDB Atlas Vector Search</h4>
<table>
<tr><th>কী</th><td>MongoDB Atlas-এ document-এর ভেতরেই vector ফিল্ড + <code>$vectorSearch</code> aggregation stage; "mongot" নামে সার্চ প্রসেস আলাদা index সামলায়</td></tr>
<tr><th>শক্তি</th><td>আপনার document ডেটার পাশেই vector (সংগতি/ডেটা-কপি কম); aggregation pipeline-এর সাথে মেলানো; ইতিমধ্যে MongoDB থাকলে সহজ; pre-filter</td></tr>
<tr><th>দুর্বলতা</th><td>মূলত Atlas (managed)-কেন্দ্রিক — self-managed সমর্থন সংস্করণ-নির্ভর (যাচাই করুন); filter-ফিল্ড index-এ আগে থেকে ঘোষণা করতে হয়; বিশেষায়িত DB-র মতো সূক্ষ্ম tuning নেই</td></tr>
<tr><th>বাছুন</th><td>ডেটা ইতিমধ্যে MongoDB Atlas-এ, ডেটা-মডেল document-ভিত্তিক</td></tr>
<tr><th>নয়</th><td>MongoDB ব্যবহার করেন না — শুধু vector-এর জন্য এতে যাওয়ার কারণ নেই</td></tr>
</table>
<pre><span class="c">// API-র স্বাদ (MongoDB aggregation; চালানো হয়নি)</span>
db.policies.aggregate([
  { $vectorSearch: { index: "vec_idx", path: "embedding", queryVector: [ ... ],
                     numCandidates: 100, limit: 10, filter: { dept: "finance" } } },
  { $project: { text: 1, score: { $meta: "vectorSearchScore" } } }
])</pre>

<h4>৪.৯ Redis (Query Engine) — অতি-দ্রুত, in-memory</h4>
<table>
<tr><th>কী</th><td>Redis-এর Query Engine (পূর্বে RediSearch)-এ <code>VECTOR</code> ফিল্ড (FLAT/HNSW); সব মেমরিতে</td></tr>
<tr><th>শক্তি</th><td><b>অতি-কম latency</b> (মিলিসেকেন্ডের নিচে); <b>semantic cache</b>-এর জন্য আদর্শ (অধ্যায় ১২); আপনার সিস্টেমে ইতিমধ্যে Redis থাকলে সহজ; hybrid filter</td></tr>
<tr><th>দুর্বলতা</th><td><b>RAM-ব্যয়বহুল</b> — বড় vector-সংগ্রহ আর্থিকভাবে অচল; persistence/durability আচরণ বোঝা দরকার; বড় ডেটা-সেটের জন্য নয়</td></tr>
<tr><th>বাছুন</th><td>ছোট–মাঝারি ডেটা + কঠোর latency; semantic cache; session-memory</td></tr>
<tr><th>নয়</th><td>কোটি vector-এর মূল জ্ঞান-ভান্ডার</td></tr>
</table>
<pre><span class="c"># API-র স্বাদ (redis-cli; চালানো হয়নি)</span>
FT.CREATE idx ON HASH PREFIX 1 doc: SCHEMA text TEXT dept TAG embedding VECTOR HNSW 6 TYPE FLOAT32 DIM 1536 DISTANCE_METRIC COSINE
FT.SEARCH idx "(@dept:{finance})=&gt;[KNN 5 @embedding $vec AS dist]" PARAMS 2 vec "&lt;binary-float32-bytes&gt;" SORTBY dist DIALECT 2</pre>

<div class="callout mistake"><span class="tag">Common mistake — Library-কে database ভাবা</span>
FAISS/hnswlib-এ বেশিরভাগ ক্ষেত্রে <b>persistence নেই বা সীমিত, metadata filter নেই, id-ধরে update/delete কঠিন বা অসম্ভব, concurrent লেখা নিরাপদ নয়, নেটওয়ার্ক সার্ভার নেই</b>। প্রোটোটাইপে ঠিক আছে, কিন্তু production-এ এগুলো নিজে বানাতে গেলে আসলে একটা Vector DB বানিয়ে ফেলবেন। প্রায় সব Vector DB-র ভেতরেই এই library বা তাদের ধারণা ব্যবহার হয় — আপনার সরাসরি ব্যবহার তখনই যুক্তিযুক্ত যখন নিয়ন্ত্রণ আপনার পুরো দরকার।</div>

<h4>৪.১২ মূলধারার DB-র ভেতরের vector (আরও কিছু — সংক্ষেপে)</h4>
<ul>
<li><b>SQL Server / Azure SQL:</b> নতুন সংস্করণে native <code>vector</code> টাইপ ও vector-খোঁজার ক্ষমতা যোগ হচ্ছে (DiskANN-ভিত্তিক index-এর কথা প্রচারিত) — .NET/SQL Server-ভিত্তিক টিমের জন্য আকর্ষণীয় হতে পারে; <b>সংস্করণ/GA অবস্থা ও সীমা ২০২৬-এ অবশ্যই যাচাই করুন</b>, কারণ এটি দ্রুত বদলাচ্ছে।</li>
<li><b>Oracle 23ai, Azure Cosmos DB, MySQL/HeatWave, Neo4j, SQLite (sqlite-vec)...</b> — প্রত্যেকেই কোনো না কোনো আকারে vector যোগ করেছে। আপনার বিদ্যমান ডেটাবেস এর মধ্যে থাকলে প্রথমে সেটার ডকুমেন্ট দেখুন।</li>
<li><b>Cloud-নেটিভ:</b> Amazon OpenSearch Service/Serverless, Aurora-তে pgvector, Google Vertex AI Vector Search, AWS-এর নতুন বস্তু-সংরক্ষণ-ভিত্তিক vector সেবা (সস্তা, ধীর-গতির ধরনের) ইত্যাদি — নিজের ক্লাউডের বিকল্প আগে দেখুন (ডেটা-আবাসন, IAM, বিলিং একই জায়গায়)।</li>
</ul>

<h4>৬.১ Weighted decision matrix — সিদ্ধান্তকে সংখ্যায় ধরা</h4>
<p>"মনে হচ্ছে" নয়, <b>গুরুত্ব (weight) × স্কোর</b> দিয়ে। পদ্ধতি: (১) আপনার মানদণ্ডগুলো তালিকা করুন; (২) প্রতিটার <b>ওজন</b> (গুরুত্ব) ঠিক করুন; (৩) প্রতিটা প্রার্থীকে ১–৫ স্কোর দিন; (৪) ওজনযুক্ত গড়। একই স্কোর, কিন্তু <b>ওজন বদলালে বিজয়ী বদলে যায়</b> — এটাই পদ্ধতির আসল শিক্ষা: আপনার সিদ্ধান্ত নির্ভর করে <b>আপনি কী গুরুত্ব দেন</b>-এর উপর, কোনো "সর্বজনীন সেরা" নেই।</p>
<pre>def score(weights: dict[str, float], options: dict[str, dict[str, float]]) -&gt; dict[str, float]:
    total = sum(weights.values())
    res = {name: sum(weights[k] * sc[k] for k in weights) / total for name, sc in options.items()}
    return dict(sorted(res.items(), key=lambda x: -x[1]))      <span class="c"># বিজয়ী আগে</span></pre>
<p><b>পরিস্থিতি A:</b> .NET ERP স্টার্টআপ, ~৩ লাখ chunk, PostgreSQL আছে, ছোট দল। ওজন: বিদ্যমান-স্ট্যাক ৫, অপারেশন-সহজতা ৪, SQL/ACID ৪, filter ৩, hybrid ৩, খরচ ৩, scale ২। (স্কোর আমার ব্যক্তিগত বিচার; Python-এ গণনা করা):</p>

@dataclass
class Hit:
    id: str; score: float; payload: dict         <span class="c"># score: সবসময় SIMILARITY (বড় = ভালো) — সব adapter এটা মানবে</span>

class VectorStore(Protocol):
    def upsert(self, items: list[Item]) -&gt; None: ...
    def search(self, vector: list[float], k: int, filters: dict[str, Any] | None = None) -&gt; list[Hit]: ...
    def delete_doc(self, doc_id: str) -&gt; None: ...
    def count(self) -&gt; int: ...

class NumpyStore:                                 <span class="c"># রেফারেন্স (ground-truth) — ছোট ডেটায়, এবং contract test-এর জন্য</span>
    def __init__(self): self.items: dict[str, Item] = {}
    def upsert(self, items):
        for it in items:
            v = np.asarray(it.vector, dtype=np.float32); v = v / np.linalg.norm(v)
            self.items[it.id] = Item(it.id, it.doc_id, v.tolist(), dict(it.payload))
    def search(self, vector, k, filters=None):
        q = np.asarray(vector, dtype=np.float32); q = q / np.linalg.norm(q)
        cand = [it for it in self.items.values()
                if not filters or all(it.payload.get(a) == b for a, b in filters.items())]
        sc = sorted(((float(np.dot(q, np.asarray(it.vector))), it) for it in cand), key=lambda x: -x[0])[:k]
        return [Hit(it.id, s, it.payload) for s, it in sc]
    def delete_doc(self, doc_id): self.items = {i: v for i, v in self.items.items() if v.doc_id != doc_id}
    def count(self): return len(self.items)

NS = uuid.UUID("6ba7b810-9dad-11d1-80b4-00c04fd430c8")
class QdrantStore:
    def __init__(self, client, name, dim):
        self.c, self.name = client, name
        client.create_collection(name, vectors_config=models.VectorParams(size=dim, distance=models.Distance.COSINE))
        client.create_payload_index(name, "doc_id", models.PayloadSchemaType.KEYWORD)
    def upsert(self, items):
        self.c.upsert(self.name, wait=True, points=[models.PointStruct(
            id=str(uuid.uuid5(NS, it.id)),                           <span class="c"># আপনার string id → Qdrant-এর UUID (adapter-এর কাজ)</span>
            vector=it.vector,
            payload={**it.payload, "_id": it.id, "doc_id": it.doc_id}) for it in items])
    def search(self, vector, k, filters=None):
        f = models.Filter(must=[models.FieldCondition(key=a, match=models.MatchValue(value=b))
                                for a, b in filters.items()]) if filters else None
        r = self.c.query_points(self.name, query=vector, query_filter=f, limit=k, with_payload=True)
        return [Hit(p.payload["_id"], p.score, {a: b for a, b in p.payload.items() if a != "_id"}) for p in r.points]
    def delete_doc(self, doc_id):
        self.c.delete(self.name, points_selector=models.FilterSelector(filter=models.Filter(
            must=[models.FieldCondition(key="doc_id", match=models.MatchValue(value=doc_id))])))
    def count(self): return self.c.count(self.name, exact=True).count</pre>
<p><b>Contract test</b> — একই ডেটা ও একই প্রশ্ন দুই store-এ চালিয়ে ফল মেলানো। এই পরীক্ষাই প্রমাণ করে নতুন adapter ঠিক আছে (এবং পরে migration-যাচাইয়েও কাজে লাগে):</p>
<pre>def overlap_at_k(a: list[str], b: list[str], k: int) -&gt; float:
    a, b = a[:k], b[:k]
    if not a and not b: return 1.0               <span class="c"># দুটোই খালি = সম্পূর্ণ মিল (নইলে ভুল সতর্কতা)</span>
    return len(set(a) &amp; set(b)) / max(len(a), len(b))

rng = np.random.default_rng(11); D = 16; N = 300
vecs = rng.normal(size=(N, D)).astype("float32")
items = [Item(f"doc{i//5}#{i%5}", f"doc{i//5}", vecs[i].tolist(),
              {"dept": ["finance", "travel", "hr"][i % 3], "year": 2024 + (i % 3)}) for i in range(N)]
stores = {"numpy": NumpyStore(), "qdrant": QdrantStore(QdrantClient(":memory:"), "c", D)}
for s in stores.values(): s.upsert(items)

queries = [rng.normal(size=D).tolist() for _ in range(20)]
for filt in (None, {"dept": "finance"}, {"dept": "hr", "year": 2026}):
    ov = [overlap_at_k([h.id for h in stores["numpy"].search(q, 5, filt)],
                       [h.id for h in stores["qdrant"].search(q, 5, filt)], 5) for q in queries]
    print(filt, "mean overlap@5 =", np.mean(ov))</pre>
<p><b>আউটপুট</b> (বাস্তবে চালানো): তিন ধরনের filter-এই <code>mean overlap@5 = 1.0</code> এবং স্কোরের সর্বোচ্চ পার্থক্য ~০ — অর্থাৎ দুই adapter হুবহু একই আচরণ করে। delete-এর পর দুটোতেই ২৯৫, আবার ১০টা upsert করার পর ৩০০ (idempotent) ✓।</p>
<h4>৯.৩ নীতি ৩: "সিস্টেম-ভেদে যা অমিল" — adapter-এর কাজের তালিকা</h4>
<table>
<tr><th>পার্থক্য</th><th>উদাহরণ</th><th>adapter-এ কীভাবে সামলাবেন</th></tr>
<tr><td><b>স্কোরের অর্থ</b></td><td>pgvector: distance (ছোট=ভালো); Qdrant/Pinecone: similarity (বড়=ভালো); কেউ কেউ dot, কেউ negative-ip</td><td>interface-এ সবসময় <b>similarity</b> (বড়=ভালো) — adapter রূপান্তর করে (<code>1 − cosine_distance</code>)। নইলে threshold বদলে ফেললে নীরবে ভেঙে যায়</td></tr>
<tr><td><b>ID-র ধরন</b></td><td>Qdrant: u64/UUID; Pinecone: string; pgvector: আপনার পছন্দ; Weaviate: UUID</td><td>আপনার string id → deterministic UUIDv5 (উপরের কোড); মূল id payload-এ</td></tr>
<tr><td><b>Filter-এর ভাষা</b></td><td>SQL <code>WHERE</code>, Qdrant <code>Filter</code>, Pinecone <code>{"$eq"}</code>, Elasticsearch DSL</td><td>নিজস্ব <b>সরল filter-ভাষা</b> (যেমন dict-সমতা + range) — adapter অনুবাদ করে। অতিরিক্ত জটিল filter interface-এ আনবেন না</td></tr>
<tr><td><b>Metadata-র ধরন ও আকার</b></td><td>নেস্টেড JSON সব জায়গায় নেই; payload আকারসীমা ভিন্ন</td><td>flat, সরল ধরনে সীমিত রাখুন (string/number/bool/datetime)</td></tr>
<tr><td><b>Batch-সীমা, rate limit</b></td><td>প্রতি request-এ সর্বোচ্চ সংখ্যা ভিন্ন</td><td>adapter-এর ভেতরে batching/retry</td></tr>
<tr><td><b>সামঞ্জস্য (consistency)</b></td><td>লেখার পর পড়ায় কতক্ষণে দেখা যায় (Elasticsearch refresh, Pinecone eventual consistency)</td><td>পরীক্ষায় "লিখেই খোঁজা" ধরে নেবেন না; অপেক্ষা/polling</td></tr>
<tr><td><b>Hybrid/rerank</b></td><td>সবাই সমান সমর্থন করে না</td><td>interface-এ ঐচ্ছিক capability; না থাকলে অ্যাপ-স্তরে fallback (BM25 নিজে + RRF — অধ্যায় ৭)</td></tr>
<tr><td><b>Distance metric</b></td><td>collection-তৈরির সময় স্থির</td><td>নিজের কনফিগে metric রেকর্ড; embedding-এর সাথে মেলান</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Abstraction অতি-সাধারণ বা অতি-জটিল করা</span>
(ক) <b>অতি-জটিল:</b> সব vendor-এর সব feature ঢাকতে গিয়ে বিশাল, ভঙ্গুর interface — তখন lowest-common-denominator হয়ে যান, কোনো DB-রই শক্তি কাজে লাগে না। (খ) <b>অতি-সরল/অনুপস্থিত:</b> অ্যাপের বিভিন্ন জায়গায় সরাসরি vendor-client ছড়িয়ে — পরে বদলানো দুঃস্বপ্ন। মধ্যপথ: <b>ছোট interface (upsert/search/delete/count + সরল filter)</b>, বিশেষ ক্ষমতা (hybrid, multivector) ঐচ্ছিক capability হিসেবে।</div>
<p><b>.NET-এ একই ধারণা</b> (কমপাইল করে দেখা): </p>
<pre>public record VItem(string Id, string DocId, float[] Vector, IReadOnlyDictionary&lt;string, object&gt; Payload);
public record VHit(string Id, double Score, IReadOnlyDictionary&lt;string, object&gt; Payload);   <span class="c">// Score: সবসময় similarity (বড় = ভালো)</span>

public interface IVectorStore
{
    Task UpsertAsync(IReadOnlyList&lt;VItem&gt; items, CancellationToken ct = default);
    Task&lt;IReadOnlyList&lt;VHit&gt;&gt; SearchAsync(float[] vector, int k,
        IReadOnlyDictionary&lt;string, object&gt;? filters = null, CancellationToken ct = default);
    Task DeleteDocAsync(string docId, CancellationToken ct = default);
    Task&lt;long&gt; CountAsync(CancellationToken ct = default);
}

<span class="c">// কনফিগ দিয়ে implementation বাছাই — বদলাতে অ্যাপ-কোড ছোঁয়া লাগে না</span>
switch (cfg["VectorStore:Provider"])
{
    case "pgvector": services.AddScoped&lt;IVectorStore, PgVectorStore&gt;(); break;
    case "qdrant":   services.AddSingleton&lt;IVectorStore, QdrantVectorStore&gt;(); break;
    default: throw new InvalidOperationException("Unknown VectorStore:Provider");
}</pre>
<h4>৯.৪ নীতি ৪: Migration-এর নিরাপদ প্রক্রিয়া (সিস্টেম বদলের playbook)</h4>
<div class="diagram"><pre>
  ১. নতুন store তৈরি (নতুন collection/index) — পুরোনোটা চালু থাকে
  ২. Backfill: নিজের source (chunk+metadata+embeddings) থেকে নতুনটায় bulk-load        ← re-embed নয় (embedding নিজের কাছে থাকলে)
  ৩. Dual-write: নতুন লেখা দুটোতেই যায় (পুরোনো চালু, নতুন ধরছে)
  ৪. Shadow-read: প্রতিটা প্রশ্ন দুটোতেই চালাও, ব্যবহারকারীকে পুরোনোর ফল; নতুনেরটা শুধু লগ/তুলনা
  ৫. যাচাই: overlap@k, golden-set recall, latency — পাস-মানদণ্ড মিললে
  ৬. Cutover: পড়া নতুনে সুইচ (ফিচার-ফ্ল্যাগ/কনফিগ); পুরোনো কিছুদিন "গরম" রাখা (rollback)
  ৭. স্থিতিশীল হলে পুরোনো মুছো
</pre></div>
<p>ধাপ ২-৫-এর যাচাইয়ে উপরের <code>overlap_at_k</code> ও contract-test সরাসরি কাজে লাগে। যাচাই করা: numpy store থেকে সব item নিয়ে একটা <b>নতুন</b> Qdrant store-এ bulk-load করে একই ২০ প্রশ্নে top-10 মিলিয়ে দেখলাম <code>mean overlap@10 = 1.0</code>, count = ৩০০।</p>
<div class="callout behind"><span class="tag">পর্দার পেছনে — ANN-এ 100% overlap আশা কোরো না</span>
আমাদের পরীক্ষা ছোট ডেটায় লোকাল (exact) মোডে, তাই overlap ১.০। আসল ANN (HNSW) সার্ভারে দুই সিস্টেমের ফল পুরোপুরি এক হবে না (প্রতিটা আলাদা index-কাঠামো ও এলোমেলোতা) — overlap@10 ০.৯০–০.৯৮ স্বাভাবিক। তাই migration-যাচাইয়ে লক্ষ্য "১০০% মিল" নয়, বরং <b>golden set-এ recall নতুনে পুরোনোর চেয়ে খারাপ নয়</b>। "পুরোনোর সাথে মিল" আসলে একটা প্রক্সি-মাপ; আসল প্রশ্ন ব্যবহারকারীর ফল ভালো কিনা।</div>

<h3>১০. Vendor Lock-in — চার রকম, ও প্রতিকার</h3>
<table>
<tr><th>লক-ইনের ধরন</th><th>কী</th><th>কতটা বিপজ্জনক</th><th>প্রতিকার</th></tr>
<tr><td><b>ডেটা</b></td><td>vector ও metadata বের করা কঠিন/সীমিত/ধীর</td><td>উচ্চ</td><td>নিজের কাছে source of truth + embeddings (৯.১); নিয়মিত export</td></tr>

<tr><td><b>Feature</b></td><td>vendor-এর নিজস্ব সুবিধা (integrated inference, semantic ranker) ছাড়া চলে না</td><td>মাঝারি</td><td>সেগুলোকে ঐচ্ছিক capability রাখুন; নির্ভরশীলতা সচেতনভাবে নিন, বা অ্যাপ-স্তরে বিকল্প (নিজের reranker)</td></tr>

<p>Open-source (Qdrant, Milvus, Weaviate, pgvector) lock-in কমায় — আপনি চাইলে নিজে চালাতে পারেন — তবে license দেখুন (Apache-2.0, BSD, ও আরও কঠোর শর্তের তফাত আছে; বাণিজ্যিক বা managed-সেবা বিক্রিতে প্রভাব ফেলে — <b>২০২৬-এ যাচাই করুন</b>)। Managed/closed সেবা সুবিধা দেয়, দামে lock-in-এর ঝুঁকি।</p>

<h3>১২. পাঁচটা বাস্তব পরিস্থিতি — সুপারিশ ও যুক্তি</h3>

<h3>৩. ধাপ ২ — Ingestion Pipeline</h3>
<h4>৩.১ Toy embedder — ভেতরে কী ঘটে</h4>
<p>Embedder-এর কাজ: একটা লেখা নিয়ে একটা নির্দিষ্ট দৈর্ঘ্যের (এখানে ৫১২) সংখ্যা-তালিকা (vector) ফেরত দেওয়া, যেন <b>কাছাকাছি অর্থের লেখা → কাছাকাছি vector</b>। আমাদের নকল embedder এটা করে <span class="kw">feature hashing</span> দিয়ে: প্রতিটা শব্দকে একটা hash-এর মাধ্যমে ৫১২ ঘরের কোনো একটায় ফেলে সেখানে ১ যোগ করে (এটাই "bag of words")। সাথে প্রতিটা শব্দের অক্ষর-তিনটি (<i>trigram</i>) ০.২৫ ওজনে যোগ করে, যেন "passwords" আর "password" কিছুটা মেলে।</p>
<pre>DIM = 512
<span class="c"># Real models learn synonyms from data. Our toy embedder fakes it with a tiny concept map so the demo shows "meaning" search offline.</span>
CONCEPTS = {
    "refund": "C_REFUND", "ফেরত": "C_REFUND", "রিফান্ড": "C_REFUND", "return": "C_REFUND", "back": "C_REFUND", "money": "C_MONEY", "টাকা": "C_MONEY",
    "leave": "C_LEAVE", "ছুটি": "C_LEAVE", "vacation": "C_LEAVE",
    "cancellation": "C_CANCEL", "cancel": "C_CANCEL", "বাতিল": "C_CANCEL", "বাতিলের": "C_CANCEL",
    "password": "C_PASS", "passwords": "C_PASS", "পাসওয়ার্ড": "C_PASS", "characters": "C_CHAR", "অক্ষরের": "C_CHAR", "অক্ষর": "C_CHAR",
    "late": "C_LATE", "দেরিতে": "C_LATE", "বিলম্ব": "C_LATE", "overdue": "C_LATE",
    "invoice": "C_INVOICE", "ইনভয়েস": "C_INVOICE",
    "voucher": "C_VOUCHER", "ভাউচার": "C_VOUCHER", "ভাউচার": "C_VOUCHER",
    "retention": "C_RETAIN", "সংরক্ষণ": "C_RETAIN", "keep": "C_RETAIN", "store": "C_RETAIN",
    "expense": "C_EXPENSE", "খরচ": "C_EXPENSE", "খরচের": "C_EXPENSE", "approval": "C_APPROVE", "approved": "C_APPROVE", "অনুমোদন": "C_APPROVE",
    "salary": "C_SALARY", "বেতন": "C_SALARY", "overtime": "C_OT", "ওভারটাইম": "C_OT",
    "vendor": "C_VENDOR", "supplier": "C_VENDOR", "petty": "C_PETTY", "পেটি": "C_PETTY",
}
STOP = {"the", "a", "an", "of", "to", "in", "is", "are", "for", "and", "or", "be", "by", "on", "at", "it", "this", "that",
        "করতে", "হবে", "যাবে", "না", "ও", "এবং", "কী", "কি", "আমি", "চাই", "পাব", "পাবেন", "যায়", "কত"}

def tokenize(text: str):
    toks = re.findall(r"[\wঀ-৿]+", text.lower())      <span class="c"># Bengali block included (matras are not \w)</span>
    return [t for t in toks if t not in STOP]

def _h(s: str, mod: int) -&gt; int:
    return int(hashlib.md5(s.encode("utf-8")).hexdigest(), 16) % mod   <span class="c"># md5 = deterministic across runs (Python hash() is randomized)</span>

def embed(text: str) -&gt; np.ndarray:
    v = np.zeros(DIM, dtype=np.float32)
    for t in tokenize(text):
        v[_h("w:" + CONCEPTS.get(t, t), DIM)] += 1.0                  <span class="c"># word / concept feature</span>
        for i in range(len(t) - 2):                                   <span class="c"># char trigram feature (fuzzy overlap)</span>
            v[_h("g:" + t[i:i + 3], DIM)] += 0.25
    n = np.linalg.norm(v)
    return v / n if n else v

def embed_many(texts): return [embed(t) for t in texts]</pre>

<h4>৩.২ Clean ও Chunk</h4>
<p>আমাদের ডকুমেন্ট ছোট, তাই <b>অনুচ্ছেদ-ভিত্তিক (paragraph) chunking</b> যথেষ্ট: ফাঁকা লাইন দিয়ে অনুচ্ছেদ ভাগ করি, তারপর ছোট অনুচ্ছেদগুলো <code>max_chars</code> পর্যন্ত একসাথে জুড়ি। এভাবে বাক্যের মাঝখানে কাটা পড়ে না। প্রতিটা chunk-এর শুরুতে ডকুমেন্টের <b>শিরোনাম</b> বসাই (<code>d["title"] + "\n\n" + d["text"]</code>) — কারণ chunk একা পড়লে "এটা কোন policy-র অংশ" বোঝা যায় না; শিরোনাম embedding-কে প্রসঙ্গ দেয়।</p>
<pre>def clean(text: str) -&gt; str:
    return re.sub(r"[ \t]+", " ", text).strip()

def chunk_paragraphs(text: str, max_chars: int = 400):
    chunks, buf = [], ""
    for para in [p.strip() for p in clean(text).split("\n\n") if p.strip()]:
        if buf and len(buf) + len(para) &gt; max_chars:
            chunks.append(buf); buf = para
        else:
            buf = (buf + "\n\n" + para) if buf else para
    if buf: chunks.append(buf)
    return chunks

def sha(t: str) -&gt; str: return hashlib.sha256(t.encode("utf-8")).hexdigest()[:16]</pre>
<div class="callout mistake"><span class="tag">Common mistake — chunk ও শিরোনাম আলাদা করে ফেলা</span>
"৭ কর্মদিবস" লেখা একটা chunk একা কোনো প্রশ্নের সাথে মিলবে না, কারণ chunk-এ "refund" শব্দটাই নেই (শিরোনামে ছিল)। শিরোনাম/heading chunk-এর সাথে জুড়ে embed করলে retrieval উল্লেখযোগ্যভাবে ভালো হয় — এটা সবচেয়ে সস্তা উন্নতিগুলোর একটা (অধ্যায় ৬)।</div>

<h4>৩.৩ Idempotent Ingestion — একই ডেটা দ্বিতীয়বার এলে কী হবে</h4>
<p>Ingestion pipeline একবার চালিয়ে শেষ নয়; ডকুমেন্ট বদলায়, পাইপলাইন ব্যর্থ হয়ে আবার চলে, scheduler ভুল করে দুইবার চালায়। তাই pipeline হতে হবে <span class="kw">idempotent</span> — <b>একই ইনপুটে যতবার চালান, ফলাফল একই, আর অকারণ কাজ (embedding খরচ) হয় না।</b> আমাদের কৌশল:</p>
<ol>
<li>প্রতিটা chunk-এর একটা স্থায়ী id: <code>{doc_id}#{chunk_index}</code>।</li>
<li>প্রতিটা chunk-এর লেখার <b>content hash</b> (SHA-256-এর প্রথম ১৬ অক্ষর) metadata-তে রাখি।</li>
<li>ingest-এর সময় আগের chunk-গুলোর hash আনি। <b>hash একই → embed ও লেখা skip।</b> আলাদা → নতুন embed করে <code>upsert</code>।</li>
<li>ডকুমেন্ট ছোট হয়ে গেলে (আগে ৩ chunk, এখন ২) অতিরিক্ত পুরোনো chunk <b>মুছি</b> — নইলে মৃত তথ্য সারাজীবন retrieval-এ ভেসে উঠবে।</li>
<li>প্রতিটা chunk-এ <code>embedding_model</code> রাখি — ভবিষ্যতে model বদলালে কোনগুলো পুরোনো বোঝা যাবে (অধ্যায় ১৪)।</li>
</ol>
<pre>class Store:
    def __init__(self, path=None, name="policies"):
        self.client = chromadb.PersistentClient(path=path) if path else chromadb.EphemeralClient()
        try: self.client.delete_collection(name)
        except Exception: pass
        self.col = self.client.get_or_create_collection(name, metadata={"hnsw:space": "cosine"})
        self.embed_calls = 0

    def ingest(self, docs):
        stats = {"new": 0, "updated": 0, "skipped": 0, "deleted": 0}
        for d in docs:
            chunks = chunk_paragraphs(d["title"] + "\n\n" + d["text"])
            ids = [f"{d['id']}#{i}" for i in range(len(chunks))]
            existing = self.col.get(where={"doc_id": d["id"]}, include=["metadatas"])
            old = {i: m["content_hash"] for i, m in zip(existing["ids"], existing["metadatas"])}
            stale = [i for i in old if i not in ids]                       <span class="c"># chunks that no longer exist (doc got shorter)</span>
            if stale: self.col.delete(ids=stale); stats["deleted"] += len(stale)
            todo = []
            for cid, ch in zip(ids, chunks):
                h = sha(ch)
                if old.get(cid) == h: stats["skipped"] += 1; continue      <span class="c"># same content → skip (saves embedding cost)</span>
                stats["updated" if cid in old else "new"] += 1
                todo.append((cid, ch, h))
            if todo:
                vecs = embed_many([c for _, c, _ in todo]); self.embed_calls += len(todo)
                self.col.upsert(ids=[c for c, _, _ in todo], documents=[c for _, c, _ in todo],
                                embeddings=[v.tolist() for v in vecs],
                                metadatas=[{"doc_id": d["id"], "title": d["title"], "dept": d["dept"], "access": d["access"],
                                            "content_hash": h, "embedding_model": "toy-v1"} for _, _, h in todo])
        return stats</pre>
<p>এবার চালিয়ে দেখি — একই ডেটা দুইবার, তারপর একটা ডকুমেন্ট সম্পাদনা করে:</p>
<pre>1st ingest : {'new': 12, 'updated': 0, 'skipped': 0, 'deleted': 0} | embed calls: 12
2nd ingest : {'new': 0, 'updated': 0, 'skipped': 12, 'deleted': 0} | embed calls: 12
after edit : {'new': 0, 'updated': 1, 'skipped': 11, 'deleted': 0} | embed calls: 13 | count: 12</pre>

<tr><td>১ম ingest</td><td><code>new: 12</code>, embed calls: 12</td><td>সব নতুন — ১২টা chunk embed হলো (প্রতিটা ডকুমেন্ট ছোট বলে ১টা করে chunk)</td></tr>
<tr><td>২য় ingest (হুবহু একই)</td><td><code>skipped: 12</code>, embed calls: <b>এখনও ১২</b></td><td>কোনো embed হয়নি — hash মিলেছে। আসল API-তে এটা সরাসরি টাকা বাঁচানো</td></tr>
<tr><td>refund ডকুমেন্টে এক অনুচ্ছেদ যোগ</td><td><code>updated: 1</code>, <code>skipped: 11</code>, embed calls: ১৩</td><td>শুধু বদলানো chunk আবার embed হলো; collection count এখনও ১২ (নতুন id নয়, আপডেট)</td></tr>
</table>
<div class="callout behind"><span class="tag">পর্দার পেছনে — কেন <code>upsert</code>, <code>add</code> নয়</span>
<code>add</code> একই id দ্বিতীয়বার দিলে ত্রুটি দেয় (বা কিছু DB-তে চুপচাপ ডুপ্লিকেট বানায়)। <code>upsert</code> = "আছে তো বদলাও, না থাকলে বানাও" — idempotency-র জন্য এটাই সঠিক অপারেশন। pgvector-এ এর সমতুল্য <code>INSERT ... ON CONFLICT DO UPDATE</code> (অধ্যায় ৯)।</div>
<div class="callout mistake"><span class="tag">Common mistake / ব্যর্থতার ধরন — ingestion-এর ফাঁকগুলো</span>
<b>(১) মাঝপথে ব্যর্থতা:</b> একটা ডকুমেন্টের ৫টা chunk-এর ৩টা লেখা হয়ে ক্র্যাশ — DB-তে আধা-ডকুমেন্ট। আমাদের hash-সিস্টেমে আবার চালালেই বাকিগুলো সেরে যায় (self-healing), তবে সেই সময়টুকুতে retrieval অসম্পূর্ণ ফল দেখাতে পারে। বড় সিস্টেমে "নতুন version পুরোটা লিখে তবে চালু" (অধ্যায় ১৪-র blue/green) নিরাপদ। <b>(২) একসাথে দুই writer:</b> দুটো process একই ডকুমেন্ট একসাথে ingest করলে stale-delete ও upsert মিশে বিভ্রাট হতে পারে — ডকুমেন্ট-স্তরে lock বা queue-তে ক্রমানুসারে চালানো। <b>(৩) hash শুধু লেখার, metadata-র নয়:</b> ডকুমেন্টের <code>access</code> বদলালে লেখা একই থাকে, তাই আমাদের কোড তা skip করবে — অথচ অনুমতি বদলেছে! বাস্তবে hash-এ metadata-ও ধরুন (<code>sha(text + access + dept)</code>)। এটা নিরাপত্তা-সংক্রান্ত সূক্ষ্ম বাগ।</div>

<h3>৪. ধাপ ৩ — Retrieval: ভালো ফল বাছার পাঁচ স্তর</h3>
<p>এবার প্রশ্ন এলে কীভাবে সবচেয়ে প্রাসঙ্গিক chunk বের করব। আমাদের retriever এই ক্রমে কাজ করে:</p>
<div class="diagram"><pre>
প্রশ্ন ──► embed ──► [১] Dense search (ACL filter সহ, top-৮) ──┐
  │                                                              ├─► [৩] RRF ──► [৪] Threshold ──► [৫] MMR ──► top-k
  └───────► [২] BM25 keyword search (ACL filter সহ, top-৮) ──────┘
</pre></div>

<h4>৪.১ স্তর ১ — Dense search ও cosine similarity</h4>
<p>প্রশ্নকে একই embedder দিয়ে vector বানিয়ে Chroma-কে বলি "সবচেয়ে কাছের ৮টা দাও"। Chroma <b>distance</b> ফেরত দেয় (cosine distance = ১ − similarity); আমরা <code>1 - d</code> করে similarity বানাই — কারণ "বেশি = ভালো" ভাবা সহজ। ছোট সংখ্যা মানে কাছে, এই ভুল ধারণা distance আর similarity গুলিয়ে ফেললে হয়।</p>

<h4>৪.২ স্তর ২ — BM25: শব্দ-ভিত্তিক খোঁজা কেন তবু দরকার</h4>
<p>Dense search অর্থ বোঝে, কিন্তু <b>হুবহু শব্দ/সংখ্যা/কোড</b>-এ দুর্বল ("10,000", "INV-1042", "TIN")। <span class="kw">BM25</span> হলো দশকের পুরোনো, কিন্তু অসাধারণ কার্যকর keyword র‍্যাঙ্কিং। অন্তর্দৃষ্টি তিনটা:</p>
<ul>
<li><b>IDF (বিরল শব্দ বেশি মূল্যবান):</b> যে শব্দ বেশিরভাগ ডকুমেন্টে আছে ("policy") তার দাম কম; যা মাত্র একটায় ("TIN") তার দাম বেশি। সূত্র: <code>idf = ln(1 + (N − n + 0.5)/(n + 0.5))</code>, N = মোট chunk, n = যতটায় শব্দটা আছে। আমাদের N=১২: n=১ হলে idf = <b>২.১৫৯</b>; n=৩ হলে <b>১.৩১২</b>; n=৬ হলে <b>০.৬৯৩</b>; n=১২ (সবখানে) হলে মাত্র <b>০.০৩৯</b> — প্রায় শূন্য।</li>
<li><b>TF saturation (বারবার বললেই বেশি নয়):</b> শব্দ ১ বার থাকলে স্কোর অংশ ১.০ (গড় দৈর্ঘ্যের chunk-এ); ২ বার → ১.৪২৯; ৫ বার → ১.৯২৩। বাড়ছে, কিন্তু ক্রমশ কম হারে — <code>k1</code> এই বাঁক ঠিক করে।</li>
<li><b>দৈর্ঘ্য স্বাভাবিকীকরণ (b):</b> লম্বা chunk-এ শব্দ থাকা "স্বাভাবিক", তাই গড়ের দ্বিগুণ লম্বা chunk-এ ১ বার থাকা শব্দের অংশ ০.৬৯০ (গড় দৈর্ঘ্যের ১.০০০-এর চেয়ে কম); গড়ের অর্ধেক ছোট chunk-এ ১.২৯০।</li>
</ul>
<pre>class BM25:
    def __init__(self, docs, k1=1.5, b=0.75):
        self.k1, self.b = k1, b
        self.ids = [i for i, _ in docs]; self.toks = [tokenize(t) for _, t in docs]
        self.avg = sum(len(t) for t in self.toks) / len(self.toks)
        df = {}
        for ts in self.toks:
            for w in set(ts): df[w] = df.get(w, 0) + 1
        N = len(self.toks)
        self.idf = {w: math.log(1 + (N - n + 0.5) / (n + 0.5)) for w, n in df.items()}
    def search(self, q, k=5):
        qt = tokenize(q); scores = []
        for i, ts in enumerate(self.toks):
            s = 0.0; L = len(ts)
            for w in qt:
                f = ts.count(w)
                if f: s += self.idf.get(w, 0) * f * (self.k1 + 1) / (f + self.k1 * (1 - self.b + self.b * L / self.avg))
            scores.append((s, self.ids[i]))
        return [(s, i) for s, i in sorted(scores, reverse=True)[:k] if s &gt; 0]</pre>

<h4>৪.৩ স্তর ৩ — RRF: দুটো আলাদা র‍্যাঙ্কিং কীভাবে জোড়ে</h4>
<p>Dense-এর স্কোর (cosine, ০–১) আর BM25-এর স্কোর (০–অজানা) <b>সম্পূর্ণ আলাদা স্কেলে</b> — সরাসরি যোগ করা অর্থহীন। <span class="kw">Reciprocal Rank Fusion (RRF)</span> স্কোর ফেলে দিয়ে শুধু <b>র‍্যাঙ্ক (অবস্থান)</b> ব্যবহার করে: <code>score(doc) = Σ 1/(60 + rank)</code>, প্রতিটা তালিকার জন্য। (৬০ একটা প্রচলিত ধ্রুবক, শীর্ষের পার্থক্য খুব বেশি চড়া হওয়া ঠেকায়।)</p>
<table>
<tr><th>ডকুমেন্ট</th><th>Dense-এ র‍্যাঙ্ক</th><th>BM25-এ র‍্যাঙ্ক</th><th>RRF স্কোর</th></tr>
<tr><td>X</td><td>১</td><td>৩</td><td>1/61 + 1/63 = <b>০.০৩২২৭</b></td></tr>
