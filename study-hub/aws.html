<h2 class="title">১. Cloud Computing ও AWS Foundation</h2>
<p class="lead">AWS শেখা শুরু করার আগে বোঝা জরুরি — cloud computing আসলে কোন সমস্যার সমাধান করে, এবং AWS এই সমাধানকে কীভাবে বিশ্বব্যাপী একটা infrastructure-এ রূপ দিয়েছে।</p>

<h3>Cloud Computing কী এবং কেন</h3>
<p>ঐতিহ্যগতভাবে একটা কোম্পানি সার্ভার কিনত, ডেটা সেন্টারে রাখত, নিজেই ম্যানেজ করত — এটা <span class="kw">CapEx</span> (Capital Expenditure) মডেল: বিশাল আগাম বিনিয়োগ, তারপর বছরের পর বছর maintenance। সমস্যা হলো — আপনি traffic-এর peak load অনুমান করে হার্ডওয়্যার কেনেন, কিন্তু বাস্তবে বেশিরভাগ সময় সেই ক্যাপাসিটির অর্ধেকও ব্যবহার হয় না, অথবা উল্টোটা — আন্ডার-প্রভিশন করে ফেললে ট্র্যাফিক স্পাইকে সাইট ক্র্যাশ করে।</p>
<p><span class="kw">Cloud Computing</span> এই সমস্যাকে <span class="kw">OpEx</span> (Operating Expenditure) মডেলে রূপান্তরিত করে — আপনি হার্ডওয়্যার কেনেন না, বরং AWS-এর মালিকানাধীন হার্ডওয়্যার থেকে প্রয়োজনমতো কম্পিউট/স্টোরেজ/নেটওয়ার্ক ভাড়া নেন, ঠিক যেভাবে বিদ্যুৎ বা পানির বিল দেন — যতটুকু ব্যবহার, ততটুকু বিল।</p>
<div class="callout why"><span class="tag">কেন — Elasticity আসল গেম চেঞ্জার</span>
শুধু "কেনার বদলে ভাড়া" নেওয়া বড় কথা না; আসল শক্তি হলো <span class="kw">Elasticity</span> — চাহিদা বাড়লে সেকেন্ডের মধ্যে ক্যাপাসিটি বাড়ানো, কমলে কমানো। ঈদের সেলে হঠাৎ ১০x ট্র্যাফিক আসলে আগে আপনাকে মাসখানেক আগে থেকে সার্ভার কিনে বসিয়ে রাখতে হতো (আর সেল শেষে সেগুলো অলস বসে থাকত)। AWS-এ আপনি Auto Scaling দিয়ে চাহিদার সাথে সাথে রিসোর্স বাড়ান-কমান — এটাই cloud-এর মূল ইকোনমিক ভ্যালু, শুধু "কারো ডেটা সেন্টারে সার্ভার রাখা" নয়।</div>

<h3>Service Model — IaaS, PaaS, SaaS</h3>
<p>Cloud service-গুলো কতটুকু ম্যানেজ করে দেয় আর আপনাকে কতটুকু নিজে সামলাতে হয়, তার ভিত্তিতে তিনটা স্তরে ভাগ করা হয়।</p>
<table>
<tr><th>মডেল</th><th>আপনি কী পান</th><th>আপনি কী ম্যানেজ করেন</th><th>AWS উদাহরণ</th></tr>
<tr><td>IaaS (Infrastructure as a Service)</td><td>ভার্চুয়াল সার্ভার, নেটওয়ার্ক, স্টোরেজ — কাঁচা ইনফ্রাস্ট্রাকচার</td><td>OS, runtime, middleware, অ্যাপ্লিকেশন, ডেটা</td><td>EC2, EBS, VPC</td></tr>
<tr><td>PaaS (Platform as a Service)</td><td>রেডি রানটাইম প্ল্যাটফর্ম — কোড দিলেই চলে</td><td>অ্যাপ্লিকেশন কোড, ডেটা</td><td>Elastic Beanstalk, RDS</td></tr>
<tr><td>SaaS (Software as a Service)</td><td>সম্পূর্ণ প্রস্তুত সফটওয়্যার</td><td>শুধু ব্যবহার ও কনফিগারেশন</td><td>Amazon Chime, WorkMail</td></tr>
</table>
<p>এই স্পেক্ট্রাম মাথায় রাখুন — পরে <b>Shared Responsibility Model</b> বোঝার সময় এটাই key হয়ে দাঁড়াবে, কারণ যত উপরের স্তরে যাবেন (IaaS → PaaS → SaaS), AWS-এর দায়িত্ব তত বাড়ে, আপনার দায়িত্ব তত কমে।</p>
<div class="callout behind"><span class="tag">Elastic Beanstalk আসলে কী করে</span>
উপরের টেবিলে PaaS উদাহরণ হিসেবে Elastic Beanstalk দেখানো হয়েছে — এটা কোনো নতুন compute engine না, বরং এই কোর্সেরই পরের চ্যাপ্টারগুলোতে শেখা EC2, Auto Scaling Group, ALB, RDS-এর উপর একটা orchestration layer। আপনি শুধু কোড (zip ফাইল বা container image) আপলোড করেন, আর Beanstalk নিজে থেকেই প্রয়োজনীয় EC2 instance, Load Balancer, Auto Scaling Group প্রভিশন করে, deploy করে, health monitor করে। অর্থাৎ Beanstalk আন্ডারলাইং resource-গুলো লুকিয়ে রাখে না — চাইলে Console-এ গিয়ে সেই EC2/ALB সরাসরি দেখা ও কাস্টমাইজ করা যায়, এই কারণে একে "PaaS with an escape hatch" বলা যায় — সরলতা চাইলে সরল থাকে, কিন্তু নিচের স্তর পুরোপুরি লুকানো না।</div>

<h3>AWS Global Infrastructure</h3>
<p>AWS-এর পুরো বিশ্বব্যাপী উপস্থিতি তিনটা স্তরে সংগঠিত: <span class="kw">Region</span>, <span class="kw">Availability Zone (AZ)</span>, এবং <span class="kw">Edge Location</span>।</p>
<div class="diagram"><pre>
Region: ap-southeast-1 (Singapore)
┌─────────────────────────────────────────────┐
│  AZ-1 (ap-southeast-1a)   AZ-2 (...1b)   AZ-3 (...1c)  │
│  ┌──────────────┐  ┌──────────────┐  ┌──────────────┐ │
│  │ Data Center  │  │ Data Center  │  │ Data Center  │ │
│  │ (নিজস্ব power,│  │ (নিজস্ব power,│  │ (নিজস্ব power,│ │
│  │  cooling,     │  │  cooling,     │  │  cooling,     │ │
│  │  network)     │  │  network)     │  │  network)     │ │
│  └──────────────┘  └──────────────┘  └──────────────┘ │
│        └── কম-লেটেন্সি প্রাইভেট লিংকে পরস্পর সংযুক্ত ──┘  │
└─────────────────────────────────────────────┘

Edge Location (CloudFront POP) → শত শত জায়গায় ছড়িয়ে, ইউজারের কাছাকাছি cache
</pre></div>
<p>একটা <b>Region</b> হলো ভৌগোলিকভাবে আলাদা একটা এলাকা (যেমন Singapore, Mumbai, Frankfurt), যার ভেতরে থাকে একাধিক <b>Availability Zone</b> — প্রতিটা AZ হলো এক বা একাধিক physically আলাদা ডেটা সেন্টারের গ্রুপ, যাদের নিজস্ব বিদ্যুৎ, কুলিং, নেটওয়ার্ক আছে।</p>
<div class="callout why"><span class="tag">কেন একাধিক AZ থাকে — Fault Isolation</span>
প্রতিটা AZ-কে ইচ্ছাকৃতভাবে অন্য AZ থেকে যথেষ্ট দূরে রাখা হয় যাতে একটা AZ-এ আগুন, বিদ্যুৎ বিভ্রাট, বা কুলিং ফেইলিওর হলে সেটা অন্য AZ-কে প্রভাবিত না করে — কিন্তু এতটাও দূরে না যাতে দুই AZ-এর মধ্যে নেটওয়ার্ক লেটেন্সি বেড়ে যায় (সাধারণত single-digit মিলিসেকেন্ডের মধ্যে)। এই কারণেই production architecture-এ কখনো একটা মাত্র AZ-এর উপর নির্ভর করা উচিত না — কমপক্ষে দুইটা AZ-এ resource ছড়িয়ে রাখলে একটা AZ পুরো ডাউন হয়ে গেলেও সার্ভিস চালু থাকে। এটাই <b>Multi-AZ High Availability</b>-এর ভিত্তি।</div>
<p><span class="kw">Edge Location</span> হলো Region-এর বাইরে, শত শত শহরে ছড়িয়ে থাকা ছোট ছোট পয়েন্ট — এগুলো নিজে কম্পিউট চালায় না, বরং CloudFront-এর মাধ্যমে কনটেন্ট cache করে ইউজারের কাছাকাছি পৌঁছে দিয়ে latency কমায়।</p>

<h3>AWS Account ও Root User</h3>
<p>AWS account খোলার সময় যে ইমেইল-পাসওয়ার্ড দিয়ে সাইন আপ করেন, সেটাই <span class="kw">Root User</span> — এই একাউন্টের উপর সম্পূর্ণ, কোনো restriction ছাড়া নিয়ন্ত্রণ থাকে এর হাতে (billing বাতিল করা, একাউন্ট বন্ধ করা, সব কিছু)।</p>
<div class="callout mistake"><span class="tag">Common mistake — Root user দিয়ে দৈনন্দিন কাজ করা</span>
নতুনরা প্রায়ই root user দিয়েই EC2 চালু করে, S3 বাকেট বানায়, কারণ "এটাই তো আমার একাউন্ট"। সমস্যা হলো root user-এর অ্যাক্সেস সীমিত করা যায় না — কোনো IAM policy root-কে block করতে পারে না। Access key leak হলে পুরো একাউন্ট, পুরো বিলিং, সব ডেটা বিপন্ন। তাই best practice হলো: root user শুধু account সেটআপ, billing alarm তৈরি, এবং প্রথম IAM admin user বানানোর জন্য একবার ব্যবহার করে, তারপর MFA লাগিয়ে root credential নিরাপদে সরিয়ে রাখা — দৈনন্দিন কাজের জন্য IAM user/role ব্যবহার করা।</div>

<h3>AWS-এ অ্যাক্সেসের পথ</h3>
<p>AWS resource-এর সাথে ইন্টার‍্যাক্ট করার চারটা মূল উপায় আছে — সবগুলোই একই underlying API-কে কল করে, শুধু ইন্টারফেস আলাদা।</p>

<h3>Free Tier</h3>
<p>নতুন AWS একাউন্টে ১২ মাসের জন্য নির্দিষ্ট পরিমাণ ফ্রি ব্যবহার পাওয়া যায় (যেমন ৭৫০ ঘণ্টা t2.micro/t3.micro EC2 প্রতি মাসে, ৫GB S3 স্টোরেজ), সাথে কিছু সার্ভিসের "Always Free" quota যা মেয়াদহীন। শেখার পর্যায়ে এটা ব্যবহার করাই বুদ্ধিমানের কাজ, কিন্তু billing alarm সেট করে রাখা জরুরি — Free Tier limit পার হয়ে গেলে চার্জ শুরু হয়ে যায়, কোনো নোটিফিকেশন ছাড়া না-ও আসতে পারে যদি আপনি নিজে alarm সেট না করেন।</p>

<h3>Shared Responsibility Model</h3>
<p>AWS এবং customer-এর মধ্যে সিকিউরিটির দায়িত্ব ভাগ করা থাকে — এটা বোঝা যেকোনো AWS সিকিউরিটি প্রশ্নের মূল ভিত্তি।</p>

<p>মূল কথাটা: AWS ক্লাউডটাকে সুরক্ষিত রাখে, আপনি ক্লাউডের ভেতরে যা বানাচ্ছেন সেটা সুরক্ষিত রাখেন। EC2 ইনস্ট্যান্স হ্যাক হলে সেটা AWS-এর দোষ নয় যদি কারণ হয় আপনার weak Security Group rule বা patch না করা OS।</p>
<div class="callout behind"><span class="tag">Service model অনুযায়ী রেখা সরে</span>
এই দায়িত্বের রেখা fixed নয় — IaaS (EC2)-তে আপনি OS patching, middleware, সবকিছুর দায়িত্বে; কিন্তু managed service যত বেশি (PaaS-এর দিকে, যেমন RDS, বা SaaS-এর দিকে), AWS তত বেশি দায়িত্ব নিয়ে নেয়। RDS-এ AWS underlying OS patch করে দেয়, আপনি শুধু ডেটাবেস-লেভেল অ্যাক্সেস ও ডেটা সামলান। Lambda-তে আপনি শুধু কোড লেখেন — সার্ভার, OS, রানটাইম প্যাচিং সব AWS-এর। যত বেশি "managed", দায়িত্বের রেখা তত উপরে সরে।</div>

<h3>AWS Well-Architected Framework</h3>
<p>AWS একটা framework দিয়েছে ভালো architecture ডিজাইনের নির্দেশিকা হিসেবে, যা ছয়টা <span class="kw">Pillar</span>-এ ভাগ করা:</p>
<ul>
<li><b>Operational Excellence</b> — সিস্টেম চালানো ও মনিটর করার প্রক্রিয়া</li>
<li><b>Security</b> — ডেটা ও সিস্টেম সুরক্ষা</li>
<li><b>Reliability</b> — ব্যর্থতা থেকে recover করার সক্ষমতা</li>
<li><b>Performance Efficiency</b> — রিসোর্স দক্ষভাবে ব্যবহার</li>
<li><b>Cost Optimization</b> — অপ্রয়োজনীয় খরচ এড়ানো</li>
<li><b>Sustainability</b> — পরিবেশগত প্রভাব কমানো</li>
</ul>
<p>এই ছয়টা pillar এই সিরিজের প্রতিটা সার্ভিস চ্যাপ্টারে ঘুরে ঘুরে আসবে — বিশেষভাবে <b>Cost Optimization</b>-এর গভীর আলোচনা পরের একটা নির্দিষ্ট চ্যাপ্টারে আসবে, যেখানে Reserved Instance, Savings Plans, ও cost-monitoring টুলস নিয়ে বিস্তারিত আলোচনা হবে।</p>
<div class="callout best"><span class="tag">Best practice — Framework মুখস্থ না করে প্রশ্ন হিসেবে ব্যবহার করুন</span>
Well-Architected pillar-গুলো মুখস্থ সংজ্ঞা নয়, বরং প্রতিটা architecture ডিজাইনের সময় নিজেকে করা উচিত প্রশ্ন: "এই সিস্টেম একটা AZ ডাউন হলে কী হবে? (Reliability)", "কেউ ভুল করে পাবলিক S3 বাকেট বানালে কী হবে? (Security)", "এই রিসোর্স রাতের বেলা কেন চলছে যখন কেউ ব্যবহার করছে না? (Cost)"। ইন্টারভিউতেও এই framework-ভিত্তিক প্রশ্ন আসে — সংজ্ঞা না বলে ট্রেড-অফ ব্যাখ্যা করতে পারলে সেটাই আসল বোঝাপড়া প্রমাণ করে।</div>

<h2 class="title">২. IAM — Identity and Access Management</h2>
<p class="lead">AWS-এ "কে কী করতে পারবে" — এই একটাই প্রশ্নের উত্তর দেয় IAM। এটা AWS সিকিউরিটির কেন্দ্রবিন্দু, এবং প্রায় প্রতিটা প্রোডাকশন ইনসিডেন্টের মূলে কোনো না কোনো IAM ভুল থাকে।</p>

<h3>IAM-এর মূল বিল্ডিং ব্লক</h3>
<p>IAM চারটা মূল অবজেক্ট নিয়ে গঠিত — <span class="kw">User</span>, <span class="kw">Group</span>, <span class="kw">Role</span>, এবং <span class="kw">Policy</span>। Policy হলো নিয়মের ডকুমেন্ট, বাকি তিনটা হলো সেই নিয়ম কার উপর প্রযোজ্য হবে তা ঠিক করার পাত্র।</p>
<div class="diagram"><pre>
                  ┌───────────┐
                  │  Policy   │  (JSON — কী করা যাবে/যাবে না)
                  └─────┬─────┘
          attach করা হয় │
     ┌────────┬─────────┼─────────┐
     ▼        ▼         ▼         ▼
  ┌─────┐  ┌───────┐ ┌──────┐  ┌──────┐
  │User │  │ Group │ │ Role │  │Resource│ (resource-based policy)
  └─────┘  └───┬───┘ └──────┘  └──────┘
               │ member
          ┌────┴────┐
          ▼         ▼
        User1     User2

Role = "কেউ temporarily ধার করে নিতে পারে এমন পরিচয়"
      (User/Service/অন্য Account assume করে)
</pre></div>
<p><b>User</b> হলো একজন নির্দিষ্ট ব্যক্তি বা অ্যাপ্লিকেশনের স্থায়ী পরিচয়। <b>Group</b> হলো একগুচ্ছ user-কে একসাথে policy দেওয়ার সুবিধার জন্য — group নিজে কোনো credential রাখে না, শুধু member-দের policy inherit করায়। <b>Role</b> হলো এমন একটা পরিচয় যাকে কেউ "assume" করে সাময়িকভাবে ধার নেয়, নিজের নাম দিয়ে নয়।</p>

<h3>Root vs IAM User</h3>
<p>আগের চ্যাপ্টারে বলা হয়েছে — root user account তৈরির সময়কার সেই একাউন্ট, যার কোনো সীমা নেই। <b>IAM User</b> হলো root-এর তৈরি করা, নির্দিষ্ট policy দ্বারা সীমাবদ্ধ পরিচয় — প্রতিটা টিম মেম্বারের জন্য আলাদা IAM user বানানো হয়, যাতে প্রত্যেকের অ্যাক্সেস আলাদাভাবে নিয়ন্ত্রণ ও audit করা যায়।</p>

<h3>Policy JSON গঠন</h3>
<p>একটা IAM policy হলো JSON ডকুমেন্ট, যার মূল উপাদান চারটা: <code>Effect</code> (Allow/Deny), <code>Action</code> (কোন API কল), <code>Resource</code> (কোন resource-এর উপর), এবং ঐচ্ছিক <code>Condition</code>।</p>
<pre>{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "AllowS3ReadOnlyInSpecificBucket",
      "Effect": "Allow",
      "Action": [
        "s3:GetObject",
        "s3:ListBucket"
      ],
      "Resource": [
        "arn:aws:s3:::project-reports-bucket",
        "arn:aws:s3:::project-reports-bucket/*"
      ],
      "Condition": {
        "IpAddress": {
          "aws:SourceIp": "103.10.20.0/24"
        }
      }
    }
  ]
}</pre>
<p>এখানে এই policy অনুমতি দিচ্ছে শুধু <code>project-reports-bucket</code>-এ read করার (list ও get), তাও শুধু নির্দিষ্ট একটা IP range থেকে এলে। <code>Condition</code> ব্লক policy-কে অতিরিক্ত সূক্ষ্মভাবে সীমিত করে — সময়, IP, MFA উপস্থিতি, ইত্যাদি ভিত্তিতে।</p>

<h3>Managed vs Inline Policy</h3>
<table>
<tr><th>দিক</th><th>Managed Policy</th><th>Inline Policy</th></tr>
<tr><td>সংযুক্তি</td><td>স্বতন্ত্র অবজেক্ট, একাধিক user/group/role-এ attach করা যায়</td><td>একটা নির্দিষ্ট identity-এর সাথে সরাসরি embedded, শেয়ার করা যায় না</td></tr>
<tr><td>পুনঃব্যবহার</td><td>একবার লিখে বহুজনে ব্যবহার — maintenance সহজ</td><td>প্রতিটা identity-তে আলাদা করে লিখতে হয়</td></tr>
<tr><td>টাইপ</td><td>AWS Managed (AWS নিজে maintain করে) বা Customer Managed</td><td>শুধু customer-এর তৈরি</td></tr>
<tr><td>উপযুক্ত ব্যবহার</td><td>প্রায় সব ক্ষেত্রে (default choice)</td><td>একটা identity-র জন্য কড়াকড়ি ১-১ সম্পর্কযুক্ত বিশেষ permission</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — Managed policy default রাখুন</span>
Inline policy সহজেই ভুলে যাওয়া যায় — যখন কোনো user delete করবেন, inline policy তার সাথেই মুছে যায়, কিন্তু audit করার সময় খুঁজে পাওয়া কঠিন কারণ সেগুলো কোথাও centralize করা নেই। Customer Managed Policy ব্যবহার করলে policy-টা একটা স্বতন্ত্র, ভার্সন-কন্ট্রোলড অবজেক্ট হিসেবে থাকে, যা একাধিক জায়গায় reuse ও centrally audit করা সহজ। Inline শুধু তখনই ব্যবহার করুন যখন নিশ্চিত থাকেন এই permission সত্যিই একটা মাত্র identity-র জন্যই, কখনো শেয়ার হবে না।</div>

<h3>Least Privilege নীতি</h3>
<p><span class="kw">Least Privilege</span> মানে — একটা identity-কে ঠিক তত টুকু permission দেওয়া, যতটুকু তার কাজ করতে লাগে, এক বিন্দু বেশি না।</p>
<div class="callout mistake"><span class="tag">Common mistake — সুবিধার জন্য AdministratorAccess দেওয়া</span>
Deadline চাপে অনেক ডেভেলপার বলে "permission error ঠিক করতে সময় নাই, ওকে AdministratorAccess দিয়ে দিই" — এটা সবচেয়ে বেশি ঘটা এবং সবচেয়ে ব্যয়বহুল ভুল। বাস্তবে বহু পরিচিত ডেটা ব্রিচের মূলে ছিল একটা over-privileged IAM role/user, যার credential leak হওয়ার পর আক্রমণকারী পুরো একাউন্টে অ্যাক্সেস পেয়ে যায় — কারণ সেই role-এর প্রয়োজনের চেয়ে অনেক বেশি permission ছিল। সঠিক পথ: শুরু করুন কম permission দিয়ে, CloudTrail log দেখে বুঝুন আসলে কোন API কল লাগছে, তারপর ধীরে ধীরে ঠিক প্রয়োজনীয় permission যুক্ত করুন।</div>

<h3>IAM Role ও Trust Policy</h3>
<p>Role-এর সাথে দুই ধরনের policy জড়িত: <b>Permission Policy</b> (কী করা যাবে) এবং <span class="kw">Trust Policy</span> (কে এই role assume করতে পারবে)। Trust policy বলে দেয় role-টা কার জন্য উপলব্ধ — একটা EC2 service, একটা Lambda, অন্য একটা AWS account, বা একটা federated identity।</p>
<div class="diagram"><pre>
EC2 Instance                    Trust Policy বলছে:
     │                          "ec2.amazonaws.com service
     │ AssumeRole                এই role assume করতে পারবে"
     ▼
┌──────────────┐
│  IAM Role     │──── Permission Policy: S3 read access
│  (temporary   │
│  credentials) │
└──────────────┘
     │
     ▼
Temporary security credentials (STS টোকেন, নির্দিষ্ট সময়ের জন্য বৈধ)
</pre></div>
<div class="callout why"><span class="tag">কেন EC2 Instance Role, hardcoded access key-এর চেয়ে ভালো</span>
Access key hardcode করলে সেটা কোডে, config ফাইলে, বা git history-তে থেকে যাওয়ার ঝুঁকি থাকে — leak হলে সেই key দীর্ঘ সময় ধরে বৈধ থাকে যতক্ষণ না ম্যানুয়ালি revoke করা হয়। EC2 Instance Role ব্যবহার করলে EC2-কে কোনো access key দিতেই হয় না — instance নিজেই স্বয়ংক্রিয়ভাবে Instance Metadata Service থেকে temporary credential নেয়, যা কয়েক ঘণ্টার মধ্যে expire হয়ে যায় ও automatically refresh হয়। এমনকি সেই credential কোনোভাবে leak হলেও এর আয়ু সীমিত, এবং কোনো দিন কোথাও hardcode করার সুযোগই নেই। এই কারণে AWS নিজে বলে: "কখনো access key EC2/Lambda-তে hardcode করবেন না — সবসময় Role ব্যবহার করুন।"</div>

<h3>Cross-Account Access</h3>
<p>একাধিক AWS account (যেমন dev, staging, prod আলাদা account-এ) থাকলে এক account-এর user-কে অন্য account-এর resource অ্যাক্সেস করতে দিতে হয় প্রায়ই। এর জন্য target account-এ একটা role বানানো হয়, যার trust policy-তে বলা থাকে "account B-এর নির্দিষ্ট user/role এই role assume করতে পারবে"। এতে করে কোনো credential শেয়ার করতে হয় না — শুধু <code>sts:AssumeRole</code> কল করে সাময়িক অ্যাক্সেস নেওয়া হয়।</p>

<h3>Policy Evaluation Logic</h3>
<p>একটা রিকোয়েস্ট আসলে AWS একাধিক policy (identity-based, resource-based, permission boundary, SCP...) একসাথে মূল্যায়ন করে একটা সিদ্ধান্তে আসে।</p>
<div class="callout behind"><span class="tag">Explicit Deny সবসময় জেতে</span>
IAM-এর evaluation logic-এ ডিফল্ট হলো <b>implicit deny</b> — কোনো Allow না থাকলে request reject হয়ে যায়। কিন্তু যদি কোনো একটা policy-তে <b>explicit Deny</b> থাকে, সেটা যেকোনো সংখ্যক Allow-কেও ওভাররাইড করে জিতে যায় — কোনো ব্যতিক্রম নেই। এর পেছনে যুক্তি হলো সিকিউরিটি-ফার্স্ট ডিজাইন: যদি কোনো একটা জায়গায় (হয়তো একটা SCP বা guardrail policy-তে) স্পষ্টভাবে বলা থাকে "এই অ্যাকশন নিষিদ্ধ", তাহলে অন্য কোথাও ভুলবশত বা ইচ্ছাকৃতভাবে দেওয়া কোনো Allow সেটাকে ফাঁকি দিতে পারবে না। এই কারণেই organization-level guardrail তৈরির সময় explicit Deny ব্যবহার করা হয় — নিশ্চিত করার জন্য যে কোনো ভুল IAM policy দিয়েও কেউ সেই সীমা ভাঙতে পারবে না।</div>
<div class="callout behind"><span class="tag">Permission Boundary — একজন user-এর জন্য নিজস্ব সিলিং</span>
SCP পুরো account/OU-এর উপর সিলিং টানে, কিন্তু <span class="kw">Permission Boundary</span> একটা নির্দিষ্ট IAM user/role-এর জন্য সিলিং টানে — কার্যকরী permission হয় user-এর নিজের policy আর boundary-র <b>intersection</b> (দুটোতেই Allow থাকলে তবেই কাজ করে)। এটা সবচেয়ে বেশি ব্যবহৃত হয় যখন একজন developer-কে নিজে নতুন IAM role বানানোর অনুমতি দিতে হয়, কিন্তু নিশ্চিত করতে হয় সে নিজেকে বা অন্য কাউকে তার নিজের চেয়ে বেশি ক্ষমতাশালী role বানিয়ে দিতে না পারে — boundary সেই সর্বোচ্চ সীমা বেঁধে দেয়, যতই তার তৈরি করা নতুন policy উদার হোক না কেন।</div>

<h3>MFA ও Access Key Rotation</h3>
<p><span class="kw">MFA</span> (Multi-Factor Authentication) লগইনে পাসওয়ার্ডের সাথে একটা দ্বিতীয় factor (OTP, hardware key) যুক্ত করে — পাসওয়ার্ড leak হলেও একা সেটা যথেষ্ট না অ্যাকাউন্টে ঢোকার জন্য। Root user এবং সব privileged IAM user-এর জন্য MFA বাধ্যতামূলক করা উচিত।</p>
<div class="callout best"><span class="tag">Best practice — Access Key নিয়মিত Rotate করুন</span>
দীর্ঘদিন ধরে একই access key ব্যবহার করলে সেটা leak হওয়ার ঝুঁকি সময়ের সাথে জমতে থাকে — পুরনো ব্যাকআপ, log, বা forgotten script-এ থেকে যেতে পারে। AWS পরামর্শ দেয় নিয়মিত বিরতিতে (যেমন ৯০ দিনে) key rotate করার — নতুন key বানিয়ে অ্যাপ্লিকেশনে আপডেট করে পুরনোটা deactivate ও পরে delete করা। যেখানে সম্ভব, access key এড়িয়ে IAM Role ব্যবহার করাই সবচেয়ে ভালো সমাধান, কারণ role-এর credential নিজে থেকেই ঘন ঘন rotate হয়।</div>

<h3>IAM Identity Center (AWS SSO)</h3>
<p>একাধিক AWS account নিয়ে কাজ করা organization-এর জন্য প্রতিটা account-এ আলাদা IAM user বানানো অব্যবস্থাপনাযোগ্য হয়ে যায়। <span class="kw">IAM Identity Center</span> (আগের নাম AWS SSO) একটা কেন্দ্রীয় জায়গা থেকে একবার লগইন করে একাধিক AWS account ও role-এর মধ্যে সুইচ করার সুবিধা দেয়, এবং প্রায়ই কোম্পানির বিদ্যমান identity provider (যেমন Azure AD, Okta) এর সাথে integrate করে single sign-on দেয়। এন্টারপ্রাইজ পরিবেশে এটাই standard পদ্ধতি, শুধু কয়েকজনের ছোট প্রজেক্টে IAM user সরাসরি যথেষ্ট হতে পারে।</p>

<h2 class="title">৩. EC2 — Elastic Compute Cloud</h2>
<p class="lead">EC2 হলো AWS-এর সবচেয়ে ব্যবহৃত, সবচেয়ে মৌলিক সার্ভিস — ভার্চুয়াল সার্ভার ভাড়া নেওয়ার সুবিধা। এর ভেতরের মেকানিক্স বোঝা অন্য প্রায় সব compute সার্ভিস (ECS, EKS, Lambda-এর তুলনা) বোঝার ভিত্তি তৈরি করে।</p>

<h3>Instance Lifecycle</h3>
<p>একটা EC2 instance তার জীবনচক্রে কয়েকটা নির্দিষ্ট state-এর মধ্য দিয়ে যায়, এবং প্রতিটা state বিলিং ও ডেটা persistence-এর দিক থেকে আলাদা আচরণ করে।</p>

<h3>Instance Type নামকরণ পদ্ধতি</h3>
<p>EC2 instance type-এর নাম দেখেই এর characteristics বোঝা যায় — যেমন <code>t3.micro</code> বা <code>m5.large</code>।</p>

<h3>AMI — Amazon Machine Image</h3>
<p><span class="kw">AMI</span> হলো একটা টেমপ্লেট — OS, প্রি-ইনস্টলড সফটওয়্যার, এবং কনফিগারেশনের একটা স্ন্যাপশট, যা থেকে নতুন EC2 instance launch করা হয়। AWS-এর দেওয়া পাবলিক AMI (Amazon Linux, Ubuntu ইত্যাদি) ব্যবহার করা যায়, বা নিজের কাস্টমাইজড instance থেকে নিজের AMI বানিয়ে রাখা যায় — এতে বারবার একই সফটওয়্যার ইনস্টলেশনের ঝামেলা এড়িয়ে দ্রুত নতুন instance দাঁড় করানো যায় (auto scaling-এর মূল ভিত্তি এটাই)।</p>

<h3>EBS-backed vs Instance Store</h3>
<p>EC2 instance-এর root volume দুই ধরনের storage-এর উপর ভিত্তি করে হতে পারে।</p>

<tr><td>পারফরম্যান্স</td><td>নেটওয়ার্ক নির্ভর, কিন্তু snapshot/resize সহজ</td><td>সরাসরি disk হওয়ায় খুব বেশি IOPS (ephemeral cache-এর জন্য উপযুক্ত)</td></tr>

<div class="callout mistake"><span class="tag">Common mistake — Instance Store-কে persistent ধরে নেওয়া</span>
Instance Store volume-এ গুরুত্বপূর্ণ ডেটাবেস ফাইল বা লগ রেখে instance stop করলে (বা underlying hardware ফেইল করলে) সেই ডেটা পুরোপুরি হারিয়ে যায় — কোনো recovery নেই। এটা বোঝার আগেই অনেকে instance store-কে সাধারণ ডিস্কের মতো ব্যবহার করে বসে, এবং প্রথম hardware failure বা reboot-এ ডেটা হারিয়ে সমস্যায় পড়ে। যেকোনো ডেটা যা টিকে থাকা প্রয়োজন, তা EBS volume-এ বা S3-এ রাখা উচিত।</div>

<h3>Security Group</h3>
<p><span class="kw">Security Group</span> হলো instance-লেভেলে একটা ভার্চুয়াল ফায়ারওয়াল, যা ইনবাউন্ড ও আউটবাউন্ড ট্র্যাফিক নিয়ন্ত্রণ করে। এর দুইটা মূল বৈশিষ্ট্য মনে রাখা জরুরি: এটা <span class="kw">stateful</span>, এবং এটা কেবল <b>allow rule</b> সমর্থন করে — কোনো deny rule লেখা যায় না।</p>
<div class="callout why"><span class="tag">কেন Stateful — Return Traffic স্বয়ংক্রিয়ভাবে অনুমোদিত</span>
Security Group stateful হওয়ার মানে — যদি আপনি ইনবাউন্ড rule দিয়ে port 443-এ ঢোকার অনুমতি দেন, তাহলে সেই connection-এর response ট্র্যাফিক (outbound) স্বয়ংক্রিয়ভাবে অনুমোদিত হয়ে যায়, আলাদা করে কোনো outbound rule না লিখলেও। কারণ Security Group প্রতিটা connection track করে — এটা জানে কোন outbound packet-টা আসলে কোন allowed inbound connection-এর response। এই কারণে বেশিরভাগ ওয়েব সার্ভার Security Group-এ শুধু inbound rule লিখেই কাজ চালায়, default outbound "allow all" রেখে দেয়।</div>
<p>যেহেতু deny rule লেখা যায় না, কোনো নির্দিষ্ট IP-কে ব্লক করতে চাইলে Security Group একা যথেষ্ট নয় — এর জন্য Network ACL লাগে, যা আমরা পরের VPC চ্যাপ্টারে বিস্তারিত তুলনা করব।</p>

<h3>Key Pair ও SSH Access</h3>
<p>Linux instance-এ লগইনের জন্য password-এর বদলে <span class="kw">Key Pair</span> ব্যবহার হয় — একটা public key AWS instance-এ বসিয়ে দেয় (<code>~/.ssh/authorized_keys</code>-এ), এবং আপনি private key দিয়ে সংযোগ করেন। Private key কখনো AWS-এর কাছে থাকে না — এটা শুধু একবার ডাউনলোডের সময় দেখানো হয়, তারপর নিরাপদে নিজের কাছে রাখতে হয়, হারালে পুনরুদ্ধার করা যায় না।</p>
<pre>ssh -i my-key.pem ec2-user@&lt;public-ip&gt;</pre>
<div class="callout best"><span class="tag">Best practice — SSH-এর বদলে Systems Manager Session Manager</span>
প্রতিটা instance-এ port 22 খোলা রাখা, key pair ম্যানেজ করা, আর SSH access-এর জন্য একটা bastion host চালানো — এই পুরো ঝামেলা এড়ানো যায় <span class="kw">AWS Systems Manager Session Manager</span> দিয়ে। এটা IAM permission দিয়ে ব্রাউজার বা CLI থেকেই সরাসরি একটা secure shell session খুলে দেয় (SSM Agent-এর মাধ্যমে, যা বেশিরভাগ Amazon AMI-তে প্রি-ইনস্টলড থাকে) — কোনো inbound port খোলা রাখা লাগে না, কোনো key pair ম্যানেজ করা লাগে না, এবং প্রতিটা session-এর প্রতিটা কমান্ড CloudTrail-এ log হয়ে যায়। এই কারণে অনেক প্রোডাকশন environment-এ Security Group-এ port 22 সম্পূর্ণ বন্ধ রেখে শুধু Session Manager-ই একমাত্র access পথ রাখা হয় — attack surface অনেকটা কমে যায়।</div>

<h3>User Data ও Bootstrap Script</h3>
<p><span class="kw">User Data</span> হলো একটা স্ক্রিপ্ট, যা instance প্রথমবার বুট হওয়ার সময় একবার স্বয়ংক্রিয়ভাবে চলে — সফটওয়্যার ইনস্টল, কনফিগারেশন, বা সার্ভিস চালু করার জন্য ব্যবহৃত হয়, ম্যানুয়াল SSH করে সেটআপ করার প্রয়োজন দূর করে।</p>
<pre>#!/bin/bash
<span class="c"># EC2 launch হওয়ার সময় এই স্ক্রিপ্ট একবার রান হবে</span>
yum update -y
yum install -y httpd
systemctl start httpd
systemctl enable httpd
echo "&lt;h1&gt;Hello from $(hostname -f)&lt;/h1&gt;" &gt; /var/www/html/index.html</pre>
<p>এটাই Auto Scaling Group-এর মূল ভিত্তি — নতুন instance স্বয়ংক্রিয়ভাবে launch হয়ে User Data চালিয়ে নিজেকে ready করে ফেলে, মানুষের হস্তক্ষেপ ছাড়াই।</p>

<h3>Instance Metadata Service (IMDS)</h3>
<p>প্রতিটা EC2 instance থেকে <code>169.254.169.254</code> এই লোকাল, non-routable IP-তে request করে instance নিজের ব্যাপারে তথ্য পেতে পারে (instance ID, IAM role credential, ইত্যাদি) — এটাই <span class="kw">Instance Metadata Service</span>।</p>
<div class="callout behind"><span class="tag">কেন IMDSv2 বেশি নিরাপদ — SSRF ঝুঁকি</span>
IMDSv1-এ শুধু একটা সাধারণ GET রিকোয়েস্ট দিয়েই metadata পড়া যেত (<code>curl http://169.254.169.254/latest/meta-data/</code>) — কোনো authentication লাগত না। সমস্যা হলো, যদি আপনার ওয়েব অ্যাপ্লিকেশনে কোনো <span class="kw">SSRF</span> (Server-Side Request Forgery) ভালনারেবিলিটি থাকে — যেমন একটা endpoint যা ইউজারের দেওয়া URL fetch করে — তাহলে আক্রমণকারী সেই অ্যাপকে দিয়ে <code>169.254.169.254</code>-এ রিকোয়েস্ট করিয়ে instance-এর IAM role-এর temporary credential চুরি করতে পারত, কোনো authentication বাইপাস না করেই। IMDSv2 এটা বন্ধ করে দেয় সেশন-ভিত্তিক টোকেন বাধ্যতামূলক করে — প্রথমে একটা PUT রিকোয়েস্ট দিয়ে টোকেন নিতে হয়, তারপর সেই টোকেন হেডারে দিয়ে GET করতে হয়। বেশিরভাগ সাধারণ SSRF ভালনারেবিলিটি (যেগুলো শুধু GET/redirect ফরওয়ার্ড করে) PUT রিকোয়েস্ট পাঠাতে পারে না, তাই IMDSv2 কার্যত সেই আক্রমণের পথ বন্ধ করে দেয়।</div>
<div class="callout best"><span class="tag">Best practice — IMDSv2 বাধ্যতামূলক করুন</span>
নতুন instance launch করার সময় "IMDSv2 required" অপশন চালু করুন (hop limit ও require token সেটিংসে) — এতে IMDSv1-এর মাধ্যমে metadata পড়ার পথ পুরোপুরি বন্ধ হয়ে যায়। AWS নিজেও নতুন account-এ ধীরে ধীরে এটাকে default বানাচ্ছে, কারণ SSRF-ভিত্তিক credential theft বাস্তব-জগতের অনেক ইনসিডেন্টের কারণ হয়েছে।</div>

<h3>Pricing Models</h3>

<tr><th>মডেল</th><th>বর্ণনা</th><th>ছাড়</th><th>উপযুক্ত ব্যবহার</th></tr>
<tr><td>On-Demand</td><td>প্রতি ঘণ্টা/সেকেন্ড হিসেবে বিল, কোনো commitment নেই</td><td>বেসলাইন দাম</td><td>অনিশ্চিত, স্বল্পমেয়াদী, বা টেস্টিং workload</td></tr>

</table>
<div class="callout mistake"><span class="tag">Common mistake — Spot Instance-এ stateful প্রোডাকশন সার্ভিস চালানো</span>
Spot Instance সস্তা দেখে অনেকে সরাসরি ডেটাবেস বা session-dependent সার্ভিস চালিয়ে ফেলে। কিন্তু AWS যখন সেই ক্যাপাসিটি ফিরে চায় (অন্য কেউ On-Demand দামে সেটা চাইলে), আপনার instance-কে মাত্র ২ মিনিটের নোটিসে বন্ধ করে দেওয়া হয় — এটাই <span class="kw">Spot Interruption</span>। যে workload interruption সহ্য করতে পারে না (যেমন একটা primary ডেটাবেস), সেটা Spot-এ রাখলে হঠাৎ ডেটা হারানো বা ডাউনটাইমের ঝুঁকি থাকে। Spot উপযুক্ত শুধু সেই workload-এর জন্য যেগুলো checkpoint করতে পারে বা হঠাৎ বন্ধ হয়ে গেলেও পুনরায় শুরু করা যায়।</div>

<h3>Elastic IP</h3>
<p>সাধারণ পাবলিক IP instance stop/start করলে বদলে যেতে পারে। <span class="kw">Elastic IP</span> হলো একটা স্থির, আপনার account-এর মালিকানাধীন পাবলিক IP, যা প্রয়োজনে এক instance থেকে আরেক instance-এ attach করা যায় — DNS পরিবর্তন না করেই ব্যর্থ instance-এর জায়গায় নতুন instance-এ ট্র্যাফিক সরিয়ে নেওয়ার জন্য উপযোগী। মনে রাখা জরুরি — allocate করা কিন্তু কোনো running instance-এ attach না করা Elastic IP-এর জন্য চার্জ হয়, তাই অব্যবহৃত Elastic IP release করা উচিত।</p>

<h3>Placement Group</h3>
<p><span class="kw">Placement Group</span> instance-গুলো কীভাবে ফিজিক্যাল hardware-এ বসানো হবে তা নিয়ন্ত্রণ করে। <code>Cluster</code> টাইপ instance-গুলোকে কাছাকাছি রাখে সর্বনিম্ন latency-র জন্য (কিন্তু hardware failure-এর ঝুঁকি একসাথে বাড়ে), <code>Spread</code> টাইপ আলাদা hardware-এ ছড়িয়ে দেয় fault tolerance-এর জন্য, আর <code>Partition</code> টাইপ বড় distributed সিস্টেমে (যেমন HDFS, Cassandra) পার্টিশনভিত্তিক আলাদা করে রাখে।</p>

<h2 class="title">৪. VPC ও Networking</h2>
<p class="lead">VPC হলো AWS-এর ভেতরে আপনার নিজের প্রাইভেট নেটওয়ার্ক — এবং এই নেটওয়ার্কিং ঠিকভাবে বোঝা ছাড়া কোনো secure, production-grade architecture ডিজাইন করা সম্ভব নয়।</p>

<h3>VPC ও CIDR ব্লক</h3>
<p><span class="kw">VPC</span> (Virtual Private Cloud) হলো একটা logically আলাদা, আপনার নিজের নিয়ন্ত্রণে থাকা নেটওয়ার্ক, যেখানে আপনি নিজের IP range, subnet, route table, gateway নির্ধারণ করেন। VPC-এর IP range নির্ধারিত হয় <span class="kw">CIDR</span> (Classless Inter-Domain Routing) নোটেশনে — যেমন <code>10.0.0.0/16</code>।</p>
<div class="diagram"><pre>
VPC: 10.0.0.0/16   → ৬৫,৫৩৬টা IP (২^(32-16) = ২^16)

এই VPC-কে ভাগ করা হলো চারটা /24 subnet-এ (প্রতিটাতে ২৫৬টা IP, ২^(32-24)=২^8):

  10.0.0.0/24   → Public Subnet   (AZ-a)   [10.0.0.0 - 10.0.0.255]
  10.0.1.0/24   → Private Subnet  (AZ-a)   [10.0.1.0 - 10.0.1.255]
  10.0.2.0/24   → Public Subnet   (AZ-b)   [10.0.2.0 - 10.0.2.255]
  10.0.3.0/24   → Private Subnet  (AZ-b)   [10.0.3.0 - 10.0.3.255]

প্রতি subnet-এ AWS ৫টা IP নিজের জন্য রিজার্ভ করে রাখে
(নেটওয়ার্ক অ্যাড্রেস, VPC router, DNS, future use, broadcast)
→ /24 subnet-এ আসলে ব্যবহারযোগ্য IP = ২৫৬ - ৫ = ২৫১টা
</pre></div>
<div class="callout why"><span class="tag">কেন /16 VPC-কে /24 subnet-এ ভাগ করা হয়</span>
CIDR-এর সংখ্যা যত ছোট হয় (যেমন /16), তত বেশি IP সেই ব্লকে থাকে, কারণ host বিটের সংখ্যা বাড়ে (32-16=16 বিট = ২^16 IP)। VPC-কে বড় একটা /16 রেঞ্জ দিয়ে শুরু করা হয় যাতে ভবিষ্যতে অনেকগুলো subnet তৈরির জন্য যথেষ্ট জায়গা থাকে। প্রতিটা subnet-কে ছোট /24 (২৫৬ IP)-এ ভাগ করা হয় যাতে প্রতিটা AZ ও tier (public/private)-এর জন্য আলাদা, পরিষ্কারভাবে সীমাবদ্ধ IP range থাকে — একই subnet-এর সব instance অবশ্যই একই AZ-এ থাকতে হয়, তাই আলাদা AZ-এর জন্য আলাদা subnet অপরিহার্য।</div>

<h3>Public vs Private Subnet</h3>
<p>একটা গুরুত্বপূর্ণ ভুল ধারণা হলো — subnet নিজে "public" বা "private" নামে ট্যাগ করা থাকে। বাস্তবে AWS-এ subnet টাইপ নির্ধারণ করে না কোনো ফ্ল্যাগ, বরং তার সাথে যুক্ত <span class="kw">Route Table</span>।</p>
<div class="callout why"><span class="tag">কেন Route Table-ই তফাৎ তৈরি করে</span>
একটা subnet "public" হয় যদি তার route table-এ <code>0.0.0.0/0 → Internet Gateway</code> রুট থাকে — মানে সেই subnet-এর ট্র্যাফিক সরাসরি ইন্টারনেটে যাওয়ার পথ পায়। যে subnet-এর route table-এ এই রুট নেই (থাকলেও সেটা NAT Gateway-এর দিকে যায়), সেটা "private" — তার instance সরাসরি ইন্টারনেট থেকে reachable না। এই কারণে দুইটা identical subnet-কে ভিন্ন route table attach করে একটাকে public, আরেকটাকে private বানানো যায় — subnet নিজে শুধু একটা IP রেঞ্জ, তার আচরণ ঠিক করে route table।</div>

<h3>Internet Gateway</h3>
<p><span class="kw">Internet Gateway (IGW)</span> হলো VPC-র সাথে সংযুক্ত একটা horizontally scaled, highly available gateway component, যা VPC-কে পাবলিক ইন্টারনেটের সাথে সংযুক্ত করে — এর জন্যই public subnet-এর route table-এ IGW-এর দিকে রুট থাকা লাগে, এবং instance-এর একটা পাবলিক IP থাকা লাগে।</p>

<h3>NAT Gateway vs NAT Instance</h3>
<p>Private subnet-এর instance-এর প্রায়ই বাইরের ইন্টারনেটে যাওয়া প্রয়োজন হয় (যেমন OS update ডাউনলোড, বাইরের API কল করা), কিন্তু বাইরে থেকে সরাসরি সেই instance-কে reach করা নিরাপত্তার জন্য অনুমোদিত না। এই সমস্যা সমাধান করে <span class="kw">NAT (Network Address Translation) Gateway</span>।</p>
<div class="diagram"><pre>
Private Subnet Instance                Public Subnet          Internet
  10.0.1.20
      │  outbound request
      ▼
  route table: 0.0.0.0/0 → NAT Gateway
      │
      ▼
  ┌──────────────┐   source IP পরিবর্তন হয়ে
  │ NAT Gateway   │──────────────────────────────▶  বাইরের সার্ভার
  │ (Elastic IP)  │   NAT Gateway-এর পাবলিক IP
  └──────────────┘
      ▲
      │  response ফিরে আসে NAT Gateway-তে, যা track করে
      │  আসল private instance-কে ফরওয়ার্ড করে
      │
  বাইরে থেকে কেউ 10.0.1.20-তে সরাসরি connection শুরু
  করতে পারবে না — কারণ এটা রুটেবল না বাইরের দিক থেকে,
  এবং NAT শুধু established connection-এর response ফেরায়
</pre></div>
<div class="callout why"><span class="tag">কেন বাইরে যাওয়া যায় কিন্তু বাইরে থেকে reach করা যায় না</span>
NAT-এর ব্যাপারটা asymmetric by design — এটা private instance-এর initiate করা connection-এর source IP-কে নিজের পাবলিক IP দিয়ে replace করে বাইরে পাঠায়, এবং response ফিরে এলে সেটা মূল instance-এ ফরওয়ার্ড করে, ঠিক Security Group-এর মতো connection-state ট্র্যাক করে। কিন্তু এটা কখনো বাইরে থেকে <b>নতুন</b> ইনবাউন্ড connection initiate করার অনুমতি দেয় না — কারণ NAT জানে না কোন private instance-এ সেটা ফরওয়ার্ড করা উচিত, কোনো established session না থাকলে। এই এক-দিকের বৈশিষ্ট্যই private subnet-কে "বাইরে যেতে পারে, কিন্তু বাইরে থেকে আক্রমণ করা যায় না" বানায়।</div>
<table>
<tr><th>দিক</th><th>NAT Gateway</th><th>NAT Instance</th></tr>
<tr><td>ম্যানেজমেন্ট</td><td>AWS managed, নিজে patch/scale করতে হয় না</td><td>নিজে EC2 instance চালিয়ে maintain করতে হয়</td></tr>
<tr><td>Availability</td><td>প্রতি AZ-এ redundant, automatic failover</td><td>single point of failure, নিজেই HA সেটআপ করতে হয়</td></tr>
<tr><td>Bandwidth</td><td>স্বয়ংক্রিয়ভাবে scale করে (৪৫ Gbps পর্যন্ত)</td><td>instance type-এর উপর সীমাবদ্ধ</td></tr>
<tr><td>খরচ</td><td>ঘণ্টা + ডেটা প্রসেসিং চার্জ</td><td>শুধু instance-এর দাম (সাধারণত সস্তা কম ট্র্যাফিকে)</td></tr>
<tr><td>প্রস্তাবিত ব্যবহার</td><td>প্রায় সব production ক্ষেত্রে (default choice)</td><td>legacy বা খুবই cost-sensitive, low-traffic ক্ষেত্র</td></tr>
</table>

<h3>Security Group vs Network ACL</h3>
<p>দুটোই ফায়ারওয়াল-জাতীয়, কিন্তু ভিন্ন স্তরে কাজ করে এবং ভিন্ন নিয়মে চলে।</p>
<table>
<tr><th>দিক</th><th>Security Group</th><th>Network ACL</th></tr>
<tr><td>স্তর</td><td>Instance (ENI)-level</td><td>Subnet-level — subnet-এর সব instance-এর উপর প্রযোজ্য</td></tr>
<tr><td>State</td><td>Stateful — return traffic স্বয়ংক্রিয় অনুমোদিত</td><td>Stateless — inbound ও outbound rule আলাদাভাবে লিখতে হয়</td></tr>
<tr><td>Rule টাইপ</td><td>কেবল Allow (Deny লেখা যায় না)</td><td>Allow ও Deny দুটোই লেখা যায়</td></tr>
<tr><td>Rule প্রসেসিং</td><td>সব rule একসাথে মূল্যায়ন (সর্বোচ্চ পারমিসিভ প্রযোজ্য)</td><td>Rule number অনুযায়ী ক্রমানুসারে, প্রথম মিলে যাওয়া rule জিতে যায়</td></tr>
<tr><td>প্রয়োগ</td><td>নির্দিষ্ট instance টার্গেট করার জন্য সূক্ষ্ম নিয়ন্ত্রণ</td><td>subnet-wide broad নিয়ন্ত্রণ, নির্দিষ্ট IP ব্লক করার জন্য উপযোগী</td></tr>
</table>
<div class="callout behind"><span class="tag">কেন দুটোই একসাথে ব্যবহার করা হয় — Defense in Depth</span>
Security Group একা প্রায়ই যথেষ্ট, কিন্তু NACL একটা অতিরিক্ত স্তর যোগ করে যা instance-level সেটিংসের ভুল থেকে রক্ষা করে। যেমন — কোনো নির্দিষ্ট malicious IP range পুরো subnet থেকে ব্লক করতে চাইলে, প্রতিটা instance-এর Security Group আলাদা করে আপডেট করার বদলে একটাই NACL rule দিয়ে পুরো subnet-এর জন্য block করে দেওয়া যায়। এই দুই স্তরের নিয়ন্ত্রণ (subnet-wide stateless + instance-specific stateful) একসাথে থাকাটাই <span class="kw">Defense in Depth</span> নীতির উদাহরণ — একটা স্তর ভুল কনফিগার হলেও অন্য স্তর সুরক্ষা দিতে পারে।</div>
<div class="callout mistake"><span class="tag">Common mistake — NACL-এ stateless বৈশিষ্ট্য ভুলে যাওয়া</span>
Security Group-এর অভ্যাসে অনেকে NACL-এ শুধু inbound allow rule লিখে ভাবে কাজ হয়ে গেছে — কিন্তু NACL stateless, তাই response ট্র্যাফিকের জন্য আলাদা outbound rule না থাকলে সেই connection আসলে কাজ করবে না (client টাইমআউট পাবে)। যেমন port 443 inbound allow করলে ephemeral port range (সাধারণত 1024-65535) outbound-এ allow করতে ভুলে গেলে response ফিরতে পারবে না।</div>

<h3>VPC Peering</h3>
<p><span class="kw">VPC Peering</span> দুইটা VPC-এর মধ্যে সরাসরি নেটওয়ার্ক সংযোগ তৈরি করে (এক বা ভিন্ন account/region-এ), যাতে তাদের private IP দিয়েই একে অপরের সাথে কথা বলতে পারে, ইন্টারনেট বা কোনো গেটওয়ে না দিয়েই। এটা point-to-point — দুইটা VPC-র মধ্যে সরাসরি, কোনো transitive routing হয় না (A-B peered, B-C peered থাকলে A সরাসরি C-এর সাথে কথা বলতে পারবে না, আলাদা peering লাগবে)।</p>

<h3>Transit Gateway</h3>
<p>যখন VPC-এর সংখ্যা বাড়তে থাকে (৫টা, ১০টা, ৫০টা), প্রতিটা VPC-কে প্রতিটার সাথে peer করলে সংযোগের সংখ্যা exponentially বাড়ে (n(n-1)/2), যা ম্যানেজ করা অসম্ভব হয়ে যায়।</p>
<div class="diagram"><pre>
Peering (mesh) — ৫টা VPC হলে ১০টা connection লাগে:
  VPC1─VPC2, VPC1─VPC3, VPC1─VPC4, VPC1─VPC5,
  VPC2─VPC3, VPC2─VPC4 ... (সংখ্যা বাড়লে ব্যবস্থাপনা কঠিন)

Transit Gateway (hub-and-spoke) — একই ৫টা VPC হলে ৫টা connection:
        VPC1     VPC2
          \       /
           \     /
        ┌───────────┐
        │  Transit   │
        │  Gateway   │──── VPC3
        └───────────┘
           /     \
          /       \
        VPC4     VPC5
</pre></div>
<p><span class="kw">Transit Gateway</span> একটা কেন্দ্রীয় hub হিসেবে কাজ করে — প্রতিটা VPC (এবং on-premises নেটওয়ার্কও) কেবল Transit Gateway-এর সাথে একবার সংযুক্ত হয়, এবং Transit Gateway routing সামলায়। এতে transitive routing সম্ভব হয় (A থেকে C পর্যন্ত পৌঁছানো যায় সরাসরি peering ছাড়াই), এবং connection সংখ্যা linear-ভাবে বাড়ে, exponentially না।</p>

<h3>VPC Endpoint</h3>
<p>ডিফল্টভাবে VPC-এর ভেতরের instance থেকে S3, DynamoDB, বা অন্য AWS সার্ভিস অ্যাক্সেস করতে হলে ট্র্যাফিক ইন্টারনেটের মধ্য দিয়ে (বা NAT Gateway দিয়ে) যায় — এমনকি যদিও গন্তব্য AWS-এরই আরেকটা সার্ভিস। <span class="kw">VPC Endpoint</span> এই ট্র্যাফিককে AWS-এর প্রাইভেট নেটওয়ার্কের ভেতরেই রাখে, ইন্টারনেটে বেরোনো ছাড়াই।</p>
<table>
<tr><th>টাইপ</th><th>কীভাবে কাজ করে</th><th>সমর্থিত সার্ভিস</th></tr>
<tr><td>Gateway Endpoint</td><td>Route table-এ একটা রুট যুক্ত হয়, কোনো ENI/IP লাগে না, ফ্রি</td><td>S3, DynamoDB</td></tr>
<tr><td>Interface Endpoint</td><td>Subnet-এ একটা ENI (private IP) তৈরি হয়, PrivateLink ব্যবহার করে</td><td>বাকি প্রায় সব AWS সার্ভিস (SNS, SQS, ECS API, ইত্যাদি)</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — NAT Gateway খরচ বাঁচাতে VPC Endpoint ব্যবহার করুন</span>
NAT Gateway ব্যবহার করে S3-এ বড় পরিমাণ ডেটা পাঠালে ঘণ্টার চার্জের সাথে প্রতি GB ডেটা প্রসেসিং চার্জও যুক্ত হয় — বড় ডেটা ট্রান্সফারে এটা উল্লেখযোগ্য খরচ হয়ে দাঁড়াতে পারে। S3-এর জন্য Gateway Endpoint সম্পূর্ণ ফ্রি এবং route table-এ যুক্ত করা মাত্র কয়েক মিনিটের কাজ — private subnet থেকে S3-এ ট্র্যাফিক NAT Gateway এড়িয়ে সরাসরি প্রাইভেট রুটে যায়, খরচ এবং latency দুটোই কমে। যেকোনো architecture-এ private subnet থেকে S3/DynamoDB access থাকলে Gateway Endpoint যুক্ত করা প্রায় সবসময় লাভজনক।</div>

<h3>VPC Flow Logs</h3>
<p>যখন প্রশ্ন আসে "দুটো instance-এর মধ্যে কানেকশন কেন কাজ করছে না — Security Group ব্লক করছে, নাকি route table ভুল, নাকি NACL?" — তখন <span class="kw">VPC Flow Logs</span> সবচেয়ে ভরসাযোগ্য উত্তর দেয়। এটা VPC-এর ভেতরে আসা-যাওয়া প্রতিটা IP ট্র্যাফিকের একটা metadata রেকর্ড ক্যাপচার করে (source/destination IP ও port, protocol, packet/byte সংখ্যা, এবং সবচেয়ে গুরুত্বপূর্ণ — <code>ACCEPT</code> নাকি <code>REJECT</code>) এবং সেটা CloudWatch Logs বা S3-এ পাঠায়।</p>
<pre>2 123456789012 eni-1235b8ca123456789 10.0.1.5 10.0.2.8 443 51000 6 20 4249 1616000000 1616000060 ACCEPT OK
<span class="c">// version account-id eni-id srcaddr dstaddr srcport dstport protocol packets bytes start end action log-status</span></pre>
<div class="callout why"><span class="tag">কেন এটা প্যাকেট কন্টেন্ট ক্যাপচার করে না</span>
VPC Flow Logs শুধু <b>metadata</b> রেকর্ড করে — কে কার সাথে, কোন port-এ, কতক্ষণ কথা বলল — কিন্তু প্যাকেটের ভেতরের আসল payload কখনো ক্যাপচার করে না। এটা ইচ্ছাকৃত ডিজাইন — packet inspection ব্যয়বহুল ও privacy-সংবেদনশীল, যেখানে বেশিরভাগ ট্রাবলশুটিং ও সিকিউরিটি অ্যানালাইসিসের জন্য (কানেকশন হচ্ছে কিনা, কোথায় ব্লক হচ্ছে, কে কার সাথে কথা বলছে) শুধু metadata-ই যথেষ্ট। এই একই কারণে VPC Flow Logs GuardDuty-এর একটা মূল ইনপুট — অস্বাভাবিক ট্রাফিক প্যাটার্ন (যেমন হঠাৎ কোনো known-malicious IP-তে outbound কল) metadata থেকেই ধরা পড়ে, পুরো payload স্ক্যান না করেই।</div>
<div class="callout best"><span class="tag">Best practice — REJECT entry-তে নজর রাখুন</span>
একটা connectivity সমস্যা ডিবাগ করার সময় Flow Log-এ <code>REJECT</code> entry খুঁজলেই বোঝা যায় ঠিক কোন layer ট্রাফিক আটকাচ্ছে — Security Group নাকি NACL। এছাড়া নিয়মিত REJECT প্যাটার্ন মনিটর করলে port-scanning বা misconfigured client খুঁজে বের করা সহজ হয়, প্রোডাকশন ইস্যু হওয়ার আগেই।</div>

<h3>Direct Connect ও Site-to-Site VPN</h3>
<p>On-premises ডেটা সেন্টার বা অফিস নেটওয়ার্ককে AWS VPC-এর সাথে সংযুক্ত করার দুটো মূল উপায়। <span class="kw">Site-to-Site VPN</span> ইন্টারনেটের উপর দিয়ে একটা এনক্রিপ্টেড IPsec টানেল তৈরি করে — সেটআপ দ্রুত ও সস্তা, কিন্তু bandwidth ও latency ইন্টারনেটের উপর নির্ভরশীল, তাই কিছুটা অনিশ্চিত। <span class="kw">Direct Connect</span> একটা dedicated, ফিজিক্যাল নেটওয়ার্ক লিংক (AWS-এর partner ডেটা সেন্টার দিয়ে) — অনেক বেশি স্থির bandwidth, কম, পূর্বানুমানযোগ্য latency দেয়, কিন্তু সেটআপে সময় লাগে (সপ্তাহ থেকে মাস) এবং খরচ বেশি। সাধারণ প্র্যাক্টিসে দুটো একসাথেও রাখা হয় — Direct Connect প্রধান লিংক, VPN ব্যাকআপ হিসেবে, যাতে physical লিংক ফেইল করলেও সংযোগ বিচ্ছিন্ন না হয়।</p>

<h2 class="title">৫. S3 — Simple Storage Service</h2>
<p class="lead">S3 হলো AWS-এর সবচেয়ে পুরনো এবং সবচেয়ে বেশি ব্যবহৃত সার্ভিস — কিন্তু এর ভেতরের মডেলটা অনেকেই ভুল বোঝেন। এটা ফাইল সিস্টেম না, এটা একটা বিশাল flat key-value store।</p>

<h3>Bucket, Object ও Key — ফোল্ডার একটা illusion</h3>
<p>S3-এ তিনটা মূল জিনিস — <span class="kw">Bucket</span> (একটা top-level container, নাম globally unique হতে হয়), <span class="kw">Object</span> (আসল ফাইল/ডেটা), এবং <span class="kw">Key</span> (অবজেক্টের নাম, পুরো bucket-এর মধ্যে unique)। মূল কথা হলো — S3-এর ভেতরে সত্যিকারের কোনো "folder" নেই। আপনি যখন <code>images/2024/photo.jpg</code> নামে একটা object আপলোড করেন, S3 এটাকে একটা single flat key হিসেবে সংরক্ষণ করে। Console-এ যে folder-এর মতো দেখায়, সেটা শুধু UI-এর trick — key-এর মধ্যে <code>/</code> character দেখে গ্রুপ করে দেখানো হয়।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> এই flat key-value ডিজাইনের কারণেই S3 এত সহজে horizontally scale করতে পারে — কোনো hierarchical directory tree traverse করার দরকার নেই, একটা key দিয়ে সরাসরি hash-based lookup হয়। কিন্তু এর মানে হলো "লাখ লাখ ফাইল একটা ফোল্ডারে রাখলে স্লো হয়ে যাবে" — এই ধারণাটা S3-এ প্রযোজ্য নয়, কারণ ফোল্ডার বলে কিছু নেই।</div>

<h3>Storage Classes — cost বনাম retrieval time</h3>
<p>একই ডেটার জন্য access pattern ভিন্ন হতে পারে — কিছু ডেটা রোজ পড়া হয়, কিছু বছরে একবার। S3 এই কারণে একাধিক storage class দেয়, যেখানে storage cost কমার সাথে সাথে retrieval cost/time বাড়ে।</p>
<table>
<tr><th>Storage Class</th><th>Availability</th><th>Retrieval Time</th><th>Use Case</th></tr>
<tr><td>Standard</td><td>99.99%</td><td>Immediate</td><td>ঘন ঘন access হওয়া active ডেটা</td></tr>
<tr><td>Standard-IA</td><td>99.9%</td><td>Immediate (higher per-GB retrieval fee)</td><td>Infrequent access, কিন্তু দরকার হলে সাথে সাথে লাগবে</td></tr>
<tr><td>One Zone-IA</td><td>99.5% (single AZ)</td><td>Immediate</td><td>Re-creatable ডেটা, কম cost, AZ loss risk নেওয়া যায়</td></tr>
<tr><td>Intelligent-Tiering</td><td>99.9%</td><td>Immediate</td><td>Access pattern অনিশ্চিত — AWS নিজে monitor করে tier পরিবর্তন করে</td></tr>
<tr><td>Glacier Instant Retrieval</td><td>99.9%</td><td>Milliseconds</td><td>Quarterly access হওয়া archive ডেটা</td></tr>
<tr><td>Glacier Flexible Retrieval</td><td>99.99%</td><td>Minutes–hours</td><td>Backup/DR, বছরে ১-২ বার access</td></tr>
<tr><td>Glacier Deep Archive</td><td>99.99%</td><td>Hours (up to 12h)</td><td>Compliance archive, ৭+ বছর ধরে রাখা</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সব ডেটা Standard-এ রাখা</span> অনেক প্রজেক্ট শুরু থেকে শেষ পর্যন্ত সব object Standard class-এ রেখে দেয়, ফলে বিল বাড়তেই থাকে। বাস্তবে log/backup/archive ডেটার একটা বড় অংশ কখনো পড়াই হয় না — এখানেই Lifecycle policy দিয়ে automatic transition কাজে লাগে।</div>

<h3>Versioning ও Delete Marker</h3>
<p><span class="kw">Versioning</span> চালু থাকলে একই key-এ নতুন করে object আপলোড করলে পুরনোটা ডিলিট হয় না — নতুন version হিসেবে যুক্ত হয়। এটা accidental overwrite বা delete থেকে রক্ষা করে। যখন আপনি একটা versioned object "delete" করেন, S3 আসলে ডেটা মুছে দেয় না — বরং একটা <span class="kw">Delete Marker</span> নামের বিশেষ marker version তৈরি করে, যা সেই key-কে "deleted" হিসেবে দেখায়। আসল object versions ঠিকই থেকে যায়, এবং delete marker-টা মুছে দিলে বা নির্দিষ্ট version request করলে পুরনো ডেটা ফিরে পাওয়া যায়।</p>
<div class="callout behind"><span class="tag">Delete marker-এর আচরণ</span> সাধারণ GET request delete marker থাকা key-এর জন্য 404 দেখায় (যদিও ডেটা এখনো bucket-এ আছে)। কিন্তু <code>versionId</code> specify করে GET করলে সরাসরি সেই version-এর ডেটা পাওয়া যায়। এই কারণে versioning enabled bucket-এ storage cost প্রতিটা version-এর জন্য আলাদাভাবে হিসাব হয় — MFA Delete ও Lifecycle rule দিয়ে পুরনো version পরিষ্কার করা জরুরি।</div>

<h3>Lifecycle Policy</h3>
<p>Lifecycle rule দুই ধরনের action করতে পারে — <span class="kw">Transition</span> (এক storage class থেকে আরেকটায় সরানো) এবং <span class="kw">Expiration</span> (নির্দিষ্ট সময় পর permanently ডিলিট)।</p>
<pre>{
  "Rules": [
    {
      "ID": "log-archival-rule",
      "Status": "Enabled",
      "Filter": { "Prefix": "logs/" },
      "Transitions": [
        { "Days": 30, "StorageClass": "STANDARD_IA" },
        { "Days": 90, "StorageClass": "GLACIER" }
      ],
      "Expiration": { "Days": 365 }
    }
  ]
}</pre>
<p>এই rule অনুযায়ী <code>logs/</code> prefix-এর যেকোনো object ৩০ দিন পর Standard-IA-এ, ৯০ দিন পর Glacier-এ চলে যাবে, এবং ৩৬৫ দিন পর একদম মুছে যাবে — সবটাই automatic, কোনো কোড লিখতে হয় না।</p>

<h3>Access Control — তিন স্তর</h3>
<p>S3-এ কে কী access পাবে সেটা তিন জায়গা থেকে নিয়ন্ত্রণ করা যায়, এবং এই তিনটার মধ্যে পার্থক্য বোঝা জরুরি।</p>
<table>
<tr><th>স্তর</th><th>Scope</th><th>কখন ব্যবহার</th></tr>
<tr><td>IAM Policy</td><td>User/Role-কে attach করা, identity-centric</td><td>আপনার নিজের AWS account-এর user/role-কে নিয়ন্ত্রণ করতে</td></tr>
<tr><td>Bucket Policy</td><td>Bucket-এ attach করা, resource-centric</td><td>Cross-account access, anonymous public access, নির্দিষ্ট IP/VPC থেকে access সীমিত করা</td></tr>
<tr><td>ACL (Access Control List)</td><td>Object/bucket-level, খুবই legacy</td><td>প্রায় avoid করা হয় — নতুন প্রজেক্টে disabled রাখা হয়</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — ACL বন্ধ রাখুন</span> AWS নিজেই এখন নতুন bucket তৈরি করার সময় default ভাবে "ACLs disabled" রাখে (Object Ownership = Bucket owner enforced)। ACL-এর granularity খুব সীমিত এবং কে কী পারমিশন দিয়েছে তা track করা কঠিন — এর বদলে সবকিছু IAM policy ও Bucket policy দিয়ে করাই আজকের standard।</div>

<h3>Encryption</h3>
<table>
<tr><th>পদ্ধতি</th><th>Key ব্যবস্থাপনা</th><th>Use Case</th></tr>
<tr><td>SSE-S3</td><td>AWS নিজেই key manage করে (AES-256)</td><td>Default, simplest, extra cost নেই</td></tr>
<tr><td>SSE-KMS</td><td>AWS KMS-এ customer-managed key, audit trail (CloudTrail-এ key usage log হয়)</td><td>Compliance/audit দরকার হলে</td></tr>
<tr><td>SSE-C</td><td>Client নিজেই key সরবরাহ করে request-এর সাথে, AWS key স্টোর করে না</td><td>যখন key AWS-এর কাছে রাখতেই চান না</td></tr>
</table>
<div class="callout why"><span class="tag">Envelope Encryption সংক্ষেপে</span> SSE-KMS-এ প্রতিটা object আলাদা data key দিয়ে encrypt হয়, এবং সেই data key নিজেই আপনার KMS master key দিয়ে encrypt হয়ে object metadata-র সাথে সংরক্ষিত থাকে। ফলে প্রতিটা request-এ পুরো object-টা KMS দিয়ে পাঠাতে হয় না — শুধু ছোট data key-টা decrypt করলেই হয়। এটাই envelope encryption, বড় ডেটার এনক্রিপশন দ্রুত ও efficient রাখে।</div>

<h3>Presigned URL</h3>
<p>মনে করুন একটা mobile app user-কে সরাসরি S3-এ ফাইল আপলোড করতে দিতে চান, কিন্তু আপনার AWS credentials app-এ embed করতে চান না — কারণ credentials leak হলে পুরো bucket-এর access চলে যেতে পারে। <span class="kw">Presigned URL</span> এই সমস্যার সমাধান — এটা একটা সাময়িক URL যেখানে signature ও expiration embedded থাকে, credential শেয়ার না করেই নির্দিষ্ট সময়ের জন্য নির্দিষ্ট action (GET/PUT) করার অনুমতি দেয়।</p>
<pre>aws s3 presign s3://my-bucket/uploads/report.pdf --expires-in 3600
<span class="c">// ১ ঘণ্টার জন্য বৈধ একটা URL রিটার্ন করবে</span></pre>

<h3>Static Website Hosting ও Event Notification</h3>
<p>S3 bucket-কে সরাসরি static website হিসেবে serve করা যায় — HTML/CSS/JS ফাইল রেখে index/error document নির্দিষ্ট করে দিলে হয়। এছাড়া S3-এ object তৈরি/ডিলিট হলে <span class="kw">Event Notification</span> ট্রিগার করা যায় — Lambda function চালানো, SQS queue-এ message পাঠানো, বা SNS topic-এ notify করা — যেমন ছবি আপলোড হওয়ার সাথে সাথে thumbnail তৈরি করার Lambda ট্রিগার করা এক common pattern।</p>
<div class="diagram"><pre>Object Upload → S3 Bucket
                   │  (event notification)
                   ▼
          ┌───────────────────┐
          │   Lambda / SQS /  │
          │        SNS        │
          └───────────────────┘
                   │
                   ▼
        Thumbnail generation / processing</pre></div>

<h3>Cross-Region Replication (CRR)</h3>
<p>CRR চালু করলে এক region-এর bucket-এ নতুন object আসার সাথে সাথে সেটা asynchronously অন্য region-এর bucket-এ কপি হতে থাকে — disaster recovery, latency কমানো (কাছের region থেকে serve করা), বা compliance-এর কারণে ডেটা একাধিক region-এ রাখার প্রয়োজনে এটা ব্যবহার হয়। দুই bucket-এই versioning enabled থাকতে হয়।</p>

<h3>Consistency Model — ইতিহাসটা জানা জরুরি</h3>
<p>বর্তমানে S3 <span class="kw">Strong Consistency</span> দেয় — কোনো object PUT/DELETE করার পরপর সাথে সাথেই সব read request সেই latest state দেখতে পায়, list operation-এও। কিন্তু ২০২০-এর ডিসেম্বরের আগে S3-এ overwrite/delete-এর ক্ষেত্রে <span class="kw">Eventual Consistency</span> ছিল — মানে একটা object আপডেট করার পরও কিছু সময় পুরনো version পড়ার সম্ভাবনা ছিল।</p>
<div class="callout behind"><span class="tag">কেন এই ইতিহাস এখনও গুরুত্বপূর্ণ</span> পুরনো অনেক architecture pattern, blog post, এবং interview প্রশ্নে "S3 eventually consistent" এই ধারণা এখনও ঘুরে বেড়ায়। বাস্তবে এখন strong consistency থাকায় সেই সব workaround pattern (যেমন read-after-write-এর জন্য retry loop) আর প্রয়োজন নেই — কিন্তু জানা থাকা ভালো, কারণ এখনও অনেক পুরনো ডকুমেন্টেশনে এই ধারণা পুরনো তথ্য হিসেবে রয়ে গেছে।</div>

<h3>Multipart Upload</h3>
<p>বড় ফাইল (সাধারণত 100MB-এর বেশি) সরাসরি একবারে আপলোড করলে network এর কোনো সমস্যায় পুরো আপলোড আবার শুরু করতে হয়। <span class="kw">Multipart Upload</span> ফাইলটাকে একাধিক part-এ ভাগ করে আলাদাভাবে (এমনকি parallel-এও) আপলোড করতে দেয়, এবং কোনো part fail করলে শুধু সেই part আবার পাঠাতে হয়, পুরো ফাইল না।</p>
<div class="callout best"><span class="tag">Best practice</span> 100MB-এর বেশি সাইজের object-এর জন্য AWS নিজেই multipart upload recommend করে; কিছু SDK/CLI tool স্বয়ংক্রিয়ভাবেই threshold-এর উপর ফাইলকে multipart-এ পাঠিয়ে দেয়।</div>
</template>

<template data-page="storage">
<h2 class="title">৬. EBS, EFS ও Storage Options</h2>
<p class="lead">S3 হলো object storage, কিন্তু EC2 instance-এর জন্য block-level বা file-level storage প্রয়োজন হয় — সেখানেই আসে EBS ও EFS, দুটো একদমই ভিন্ন সমস্যার সমাধান।</p>

<h3>EBS Volume Types</h3>
<p><span class="kw">EBS (Elastic Block Store)</span> হলো একটা network-attached block storage volume, যা একটা EC2 instance-এর সাথে যুক্ত হয় ঠিক একটা hard drive-এর মতো। বিভিন্ন workload-এর জন্য বিভিন্ন volume type আছে।</p>
<table>
<tr><th>Type</th><th>ভিত্তি</th><th>IOPS/Throughput</th><th>Use Case</th></tr>
<tr><td>gp3 (General Purpose SSD)</td><td>SSD</td><td>3,000 IOPS baseline (independently scalable up to 16,000)</td><td>বেশিরভাগ workload — boot volume, dev/test, ছোট-মাঝারি database</td></tr>
<tr><td>io2 (Provisioned IOPS SSD)</td><td>SSD</td><td>up to 64,000 IOPS, 99.999% durability</td><td>বড় production database (latency-sensitive, high IOPS দরকার)</td></tr>
<tr><td>st1 (Throughput Optimized HDD)</td><td>HDD</td><td>Throughput-focused, low IOPS</td><td>Big data, log processing — sequential read/write</td></tr>
<tr><td>sc1 (Cold HDD)</td><td>HDD</td><td>সবচেয়ে কম cost, কম throughput</td><td>Infrequently accessed data, archive-এর কাছাকাছি</td></tr>
</table>
<div class="callout why"><span class="tag">কেন gp3 আজকাল default choice</span> পুরনো gp2-এ IOPS volume সাইজের সাথে bound ছিল (সাইজ বাড়ালেই IOPS বাড়তো, নাহলে কম থাকতো)। gp3-এ IOPS ও throughput আলাদাভাবে provision করা যায় সাইজ পরিবর্তন না করেই — ফলে ছোট volume-এও high IOPS পাওয়া সম্ভব, এবং এটা gp2-এর চেয়ে সস্তা।</div>

<h3>EBS Snapshot — Incremental কেন</h3>
<p>EBS Snapshot volume-এর একটা point-in-time কপি, যা S3-এ সংরক্ষিত হয়। প্রথম snapshot পুরো volume-এর ডেটা কপি করে, কিন্তু তারপরের প্রতিটা snapshot শুধু প্রথম snapshot-এর পর যেসব block পরিবর্তন হয়েছে সেগুলোই কপি করে — একে <span class="kw">Incremental Snapshot</span> বলে।</p>
<div class="callout why"><span class="tag">কেন ইনক্রিমেন্টাল স্ন্যাপশট দ্রুত ও সস্তা</span> ধরুন একটা 100GB volume-এ প্রতিদিন মাত্র ২GB ডেটা পরিবর্তন হয়। প্রতিদিন পুরো 100GB কপি করার বদলে, প্রতিটা নতুন snapshot মাত্র সেই ২GB-এর জন্য ব্যয় হিসাব করে এবং সময় নেয় — যদিও restore করার সময় AWS পুরো chain থেকে দরকারি সব block পুনর্গঠন করে একটা সম্পূর্ণ volume বানায়।</div>

<h3>EBS vs Instance Store</h3>
<table>
<tr><th></th><th>EBS</th><th>Instance Store</th></tr>
<tr><td>Persistence</td><td>Instance stop/terminate হলেও ডেটা থাকে (root volume ছাড়া, সেটা নির্ভর করে DeleteOnTermination flag-এর উপর)</td><td>Instance stop বা terminate হলে ডেটা সম্পূর্ণ হারিয়ে যায়</td></tr>
<tr><td>ভিত্তি</td><td>Network-attached, host থেকে আলাদা</td><td>Physical host-এর সাথে সরাসরি সংযুক্ত ডিস্ক</td></tr>
<tr><td>Performance</td><td>Network latency-এর কারণে সামান্য overhead</td><td>সরাসরি local disk, খুব উচ্চ IOPS/throughput</td></tr>
<tr><td>Use Case</td><td>Database, persistent application data</td><td>Cache, temporary buffer/scratch data, replicated data যা হারালেও পুনরায় তৈরি করা যায়</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — Instance Store-এ persistent data রাখা</span> Instance Store খুব দ্রুত হওয়ায় অনেকে ভুল করে সেখানে database data রাখে, কিন্তু instance stop হলেই (বা underlying hardware fail করলেই) সব ডেটা চিরতরে হারিয়ে যায়। এটা শুধু তখনই ঠিক আছে যখন ডেটা হারালে কোনো ক্ষতি নেই বা সহজে পুনর্গঠন করা যায় — যেমন temporary cache।</div>

<h3>EFS — কেন একাধিক instance একসাথে mount করতে পারে</h3>
<p>EBS volume আসলে একটা নির্দিষ্ট Availability Zone-এ থাকে এবং একই সময়ে সাধারণত একটা মাত্র EC2 instance-এর সাথে attach থাকতে পারে (io2-এর Multi-Attach ব্যতিক্রম, তাও একই AZ-এর মধ্যে সীমিত)। কিন্তু অনেক application-এ একাধিক server-কে একই ফাইল সিস্টেমে read/write করতে হয় — যেমন একটা shared config directory, বা একাধিক web server একই uploaded content দেখাতে চায়।</p>
<p><span class="kw">EFS (Elastic File System)</span> এই সমস্যার সমাধান — এটা একটা <span class="kw">NFS</span>-ভিত্তিক managed file system, যা একাধিক AZ-এর একাধিক EC2 instance একসাথে mount করতে পারে।</p>
<div class="callout why"><span class="tag">কেন EBS দিয়ে এটা সম্ভব নয়</span> EBS মূলত একটা block device — এটা raw block-level storage দেয়, যার উপরে একটা filesystem (যেমন ext4) বসানো হয়। একাধিক instance যদি একই সময়ে একই block device-এ লিখতে যায়, filesystem-level metadata corruption হওয়ার ঝুঁকি থাকে, কারণ ext4-এর মতো filesystem একাধিক host থেকে concurrent write handle করার জন্য ডিজাইন করা হয়নি। EFS ভিন্নভাবে কাজ করে — এটা network protocol (NFS)-এর মাধ্যমে file-level access দেয়, যেখানে concurrency control সার্ভিসের ভেতরেই সমাধান করা থাকে।</div>
<div class="diagram"><pre>        ┌────────────┐   ┌────────────┐   ┌────────────┐
        │ EC2 (AZ-1) │   │ EC2 (AZ-2) │   │ EC2 (AZ-3) │
        └─────┬──────┘   └─────┬──────┘   └─────┬──────┘
              │  NFS mount     │  NFS mount     │  NFS mount
              └────────────────┼────────────────┘
                                ▼
                    ┌───────────────────────┐
                    │   EFS (shared, all-AZ) │
                    └───────────────────────┘</pre></div>

<h3>FSx ও Storage Gateway — সংক্ষেপে</h3>
<p><span class="kw">FSx</span> নির্দিষ্ট workload-ভিত্তিক managed file system দেয় — FSx for Windows File Server (SMB protocol, Windows-native workload) এবং FSx for Lustre (high-performance computing, machine learning training-এর মতো IO-heavy workload)। <span class="kw">Storage Gateway</span> on-premises datacenter-কে S3/Glacier-এর সাথে সংযুক্ত করে — hybrid cloud setup-এ on-prem application-কে cloud storage ব্যবহার করতে দেয়, যেন সেটা local storage-এর মতোই মনে হয়।</p>

<h3>সব মিলিয়ে — S3 vs EBS vs EFS</h3>
<table>
<tr><th></th><th>S3</th><th>EBS</th><th>EFS</th></tr>
<tr><td>Storage Type</td><td>Object storage</td><td>Block storage</td><td>File storage (NFS)</td></tr>
<tr><td>Access</td><td>HTTP API (GET/PUT), instance ছাড়াই</td><td>একটা instance-এর সাথে attach থাকতে হয়</td><td>একাধিক instance একসাথে mount করতে পারে</td></tr>
<tr><td>Scalability</td><td>Virtually unlimited, automatic</td><td>Provision করা সাইজ অনুযায়ী সীমিত (resize করা যায়)</td><td>Automatic elastic scaling, প্রয়োজন অনুযায়ী বাড়ে-কমে</td></tr>
<tr><td>AZ সীমাবদ্ধতা</td><td>Region-wide, কোনো AZ সীমাবদ্ধতা নেই</td><td>একটা নির্দিষ্ট AZ-এর সাথে বাঁধা</td><td>একাধিক AZ জুড়ে available</td></tr>
<tr><td>Typical Use Case</td><td>Backup, static asset, data lake, log</td><td>Database, boot volume, transactional workload</td><td>Shared content, CMS, container-এর shared config, home directory</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — সঠিক ডিসিশন</span> প্রশ্নটা হওয়া উচিত: এই ডেটা কি একাধিক server থেকে একসাথে file-level access প্রয়োজন (→ EFS), নাকি একটা single instance-এর জন্য দ্রুত low-latency disk প্রয়োজন (→ EBS), নাকি এটা মূলত unstructured object যা HTTP-এর মাধ্যমে access হবে (→ S3)।</div>
</template>

<template data-page="rds">
<h2 class="title">৭. RDS ও Aurora</h2>
<p class="lead">Database চালানো মানে শুধু query লেখা না — patching, backup, failover, replication পরিচালনা করাও একটা বড় কাজ। RDS এই "undifferentiated heavy lifting" AWS-এর হাতে তুলে দেয়।</p>

<h3>RDS কী সমস্যা সমাধান করে</h3>
<p>নিজে EC2-এ database চালালে আপনাকেই OS patching, database engine patching, backup schedule, failover logic, storage scaling — সব নিজে হাতে করতে হয়। এই কাজগুলো ব্যবসার জন্য কোনো প্রতিযোগিতামূলক সুবিধা তৈরি করে না, কিন্তু ভুল হলে বড় ক্ষতি করে — এটাই <span class="kw">Undifferentiated Heavy Lifting</span>। <span class="kw">RDS (Relational Database Service)</span> এই দায়িত্বগুলো নিয়ে নেয়, যাতে আপনি শুধু schema design ও query optimization-এ ফোকাস করতে পারেন।</p>
<p>RDS-এ MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, এবং AWS-এর নিজস্ব Aurora (MySQL/PostgreSQL-compatible) — এই engine-গুলো সমর্থিত।</p>

<h3>Multi-AZ vs Read Replica — সবচেয়ে বেশি গুলিয়ে ফেলা টপিক</h3>
<p>এই দুটো ফিচার একে অপরের বিকল্প মনে হলেও, দুটোর উদ্দেশ্য সম্পূর্ণ আলাদা — একটা <b>availability</b>-এর জন্য, আরেকটা <b>performance/scaling</b>-এর জন্য।</p>
<table>
<tr><th></th><th>Multi-AZ Deployment</th><th>Read Replica</th></tr>
<tr><td>উদ্দেশ্য</td><td>High Availability / Disaster Recovery</td><td>Read traffic scaling</td></tr>
<tr><td>Replication Type</td><td>Synchronous</td><td>Asynchronous</td></tr>
<tr><td>Standby-এ সরাসরি query</td><td>না — standby-তে সরাসরি read করা যায় না (এটা শুধু failover-এর জন্য reserved)</td><td>হ্যাঁ — replica-কে সরাসরি read query পাঠানো যায়</td></tr>
<tr><td>Region</td><td>একই region-এর ভিন্ন AZ</td><td>একই region বা আলাদা region (cross-region সম্ভব)</td></tr>
<tr><td>Failover</td><td>স্বয়ংক্রিয়, DNS endpoint পরিবর্তন করে standby-কে primary বানায়</td><td>স্বয়ংক্রিয় failover হয় না — manual promotion প্রয়োজন</td></tr>
<tr><td>সংখ্যা</td><td>একটাই standby</td><td>একাধিক replica (RDS-এ পর্যন্ত ৫টা, Aurora-এ ১৫টা)</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Multi-AZ synchronous, কিন্তু performance বাড়ায় না</span> Multi-AZ-এ প্রতিটা write একই সাথে primary ও standby-তে commit না হওয়া পর্যন্ত client-কে success response যায় না — এটাই synchronous replication। এই কারণে standby সবসময় primary-র সাথে হুবহু sync থাকে, এবং primary fail করলে কোনো ডেটা না হারিয়ে সাথে সাথেই failover করা যায়। কিন্তু এই synchronous wait write latency কিছুটা বাড়ায়, কমায় না — তাই Multi-AZ কখনো "পারফরম্যান্স বাড়ানোর" ফিচার হিসেবে ব্যবহার করা ভুল, এটা শুধুই availability-এর জন্য।</div>
<div class="callout mistake"><span class="tag">Common mistake — Read Replica-কে backup ভাবা</span> Read Replica asynchronous হওয়ায় primary-র সাথে সবসময় একদম sync নয় (replication lag থাকতে পারে)। এটাকে disaster recovery বা backup-এর বিকল্প ভাবা ভুল — primary hard crash করলে সদ্য লেখা কিছু ডেটা replica-এ না-ও থাকতে পারে।</div>

<h3>Backup — Automated vs Manual Snapshot</h3>
<table>
<tr><th></th><th>Automated Backup</th><th>Manual Snapshot</th></tr>
<tr><td>Trigger</td><td>RDS নিজে নির্ধারিত backup window-এ নেয়</td><td>ইউজার নিজে ইচ্ছামত নেয়</td></tr>
<tr><td>Retention</td><td>নির্ধারিত সময় পর (default/configured retention period, সাধারণত ১-৩৫ দিন) স্বয়ংক্রিয়ভাবে মুছে যায়</td><td>ইউজার নিজে না মুছলে অনির্দিষ্টকাল থাকে</td></tr>
<tr><td>Point-in-Time Recovery</td><td>সমর্থন করে</td><td>প্রযোজ্য নয় (এটা একটা নির্দিষ্ট সময়ের স্ন্যাপশট)</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Point-in-Time Recovery সম্ভব</span> Automated backup শুধু দৈনিক full snapshot না — RDS প্রতি ৫ মিনিটে transaction log (write-ahead log) S3-এ আপলোড করে। Restore করার সময় সবচেয়ে কাছের snapshot নিয়ে, তারপর সেই snapshot থেকে আপনার চাওয়া নির্দিষ্ট সময় পর্যন্ত transaction log replay করে ঠিক সেই মুহূর্তের state পুনর্গঠন করা হয় — এই কারণেই এটাকে <b>Point-in-Time Recovery (PITR)</b> বলে, এবং প্রায় সেকেন্ড-লেভেল precision পর্যন্ত restore করা যায়।</div>

<h3>Parameter Group vs Option Group</h3>
<p><span class="kw">Parameter Group</span> database engine-এর configuration control করে (যেমন <code>max_connections</code>, query cache সেটিংস)। <span class="kw">Option Group</span> engine-specific অতিরিক্ত feature enable করে (যেমন Oracle-এর জন্য Native Network Encryption, SQL Server-এর জন্য SSRS)। মূল পার্থক্য — Parameter Group টিউনিং-এর জন্য, Option Group অতিরিক্ত ফিচার সংযুক্ত করার জন্য।</p>

<h3>Aurora — Storage আলাদা, Compute আলাদা</h3>
<p>প্রচলিত RDS MySQL/PostgreSQL-এ compute (database engine process) এবং storage একসাথে bound — Multi-AZ failover-এ পুরো storage volume নতুন instance-এর সাথে reattach করতে সময় লাগে। <span class="kw">Aurora</span> সম্পূর্ণ ভিন্নভাবে ডিজাইন করা — এখানে storage layer compute থেকে সম্পূর্ণ আলাদা একটা distributed, self-healing storage service, যা AWS নিজেই তিনটা Availability Zone-এ ছড়িয়ে <b>৬টা কপি</b> রাখে (প্রতি AZ-এ ২টা)।</p>
<div class="diagram"><pre>          Aurora Compute (Writer + Readers)
                    │  low-latency network
                    ▼
        ┌───────────────────────────────────┐
        │        Aurora Storage Layer         │
        │  (৩ AZ × ২ কপি = ৬-way replication) │
        └───────────────────────────────────┘
   AZ-1: copy, copy    AZ-2: copy, copy    AZ-3: copy, copy</pre></div>
<div class="callout why"><span class="tag">কেন Aurora failover অনেক দ্রুত</span> RDS MySQL/PostgreSQL-এ failover মানে standby instance-কে storage volume attach করে, database engine বুট করে recovery process চালানো — যা কয়েক মিনিট নিতে পারে। Aurora-তে storage layer আগে থেকেই সব replica-র জন্য shared এবং durable, তাই failover করার সময় নতুন writer instance-কে শুধু existing storage-এর সাথে connect করতে হয় — কোনো data copy বা lengthy crash-recovery প্রয়োজন হয় না। এই কারণে Aurora failover সাধারণত ৩০ সেকেন্ডের মধ্যেই সম্পন্ন হয়, যেখানে RDS Multi-AZ-এ এটা মিনিট লাগতে পারে।</div>

<h3>Aurora Serverless v2</h3>
<p>প্রচলিত Aurora-তে instance size আগে থেকে ঠিক করে দিতে হয়। <span class="kw">Aurora Serverless v2</span> traffic-এর সাথে সাথে compute capacity (ACU — Aurora Capacity Unit) স্বয়ংক্রিয়ভাবে scale up/down করে, এমনকি সেকেন্ডের মধ্যে — এটা variable বা unpredictable workload-এর জন্য উপযোগী, যেখানে fixed-size provisioning করলে বেশিরভাগ সময় resource অব্যবহৃত থেকে যেত।</p>

<h3>RDS Proxy — কেন Connection Pooling প্রয়োজন</h3>
<p>Lambda-এর মতো serverless compute যখন হাজার হাজার concurrent invocation চালায়, প্রতিটা invocation যদি database-এর সাথে নতুন connection খোলে, তাহলে database engine-এর max connection limit খুব দ্রুত শেষ হয়ে যেতে পারে — connection তৈরি করা এবং maintain করা database-এর জন্য একটা costly operation।</p>
<div class="callout why"><span class="tag">কেন এই সমস্যাটা Lambda-তে বিশেষভাবে বড়</span> সাধারণ long-running application server-এ connection pool একবার তৈরি হয়ে reuse হতে থাকে। কিন্তু Lambda-এর প্রতিটা concurrent execution আলাদা environment-এ চলে, এবং burst traffic-এ শত শত Lambda instance একসাথে চালু হয়ে গেলে প্রত্যেকেই নিজের নিজের connection খুলতে চায়। <span class="kw">RDS Proxy</span> Lambda ও database-এর মাঝখানে বসে connection pooling ও multiplexing করে — অনেক client connection-কে একটা ছোট সংখ্যক আসল database connection-এ শেয়ার করিয়ে দেয়, ফলে database overwhelmed হয় না।</div>
</template>

<template data-page="dynamodb">
<h2 class="title">৮. DynamoDB — NoSQL Database</h2>
<p class="lead">DynamoDB একটা fully managed key-value ও document database, যেখানে scale করার জন্য কোনো server provision করতে হয় না — কিন্তু এর পারফরম্যান্স পুরোপুরি নির্ভর করে আপনার Primary Key ডিজাইনের উপর।</p>

<h3>Table, Item, Attribute — বেসিক মডেল</h3>
<p>DynamoDB-এ <span class="kw">Table</span> হলো items-এর একটা collection, <span class="kw">Item</span> হলো একটা row-এর সমতুল্য (কিন্তু schema-less), এবং <span class="kw">Attribute</span> হলো item-এর একটা field। RDBMS-এর মতো এখানে প্রতিটা item-এর একই সেট attribute থাকতে হয় না — একটা item-এ ৩টা field থাকতে পারে, আরেকটাতে ১০টা।</p>

<h3>Primary Key ডিজাইন — Partition Key vs Composite Key</h3>
<p>DynamoDB-এ দুই ধরনের Primary Key ডিজাইন সম্ভব — <span class="kw">Simple Primary Key</span> (শুধু Partition Key) এবং <span class="kw">Composite Primary Key</span> (Partition Key + Sort Key)।</p>
<p>উদাহরণ: একটা <code>Orders</code> table যেখানে <code>user_id</code> Partition Key এবং <code>timestamp</code> Sort Key —</p>
<pre>{
  "user_id": "u-1001",       <span class="c">// Partition Key</span>
  "timestamp": "2026-07-28T10:15:00Z",  <span class="c">// Sort Key</span>
  "order_total": 1250,
  "status": "SHIPPED"
}</pre>
<p>এই ডিজাইনে একজন user-এর সব order একই partition-এ থাকে (কারণ Partition Key একই), কিন্তু <code>timestamp</code> অনুযায়ী sorted থাকে — ফলে "user u-1001-এর গত মাসের সব order দেখাও" এমন query খুব efficient ভাবে করা যায় (একটা <code>Query</code> operation, পুরো table scan করা লাগে না)।</p>

<h3>Partition Key Hashing ও Hot Partition সমস্যা</h3>
<p>DynamoDB internally Partition Key-এর উপর একটা hash function চালিয়ে ঠিক করে ডেটা কোন physical partition-এ যাবে। ভালো partition key মানে ডেটা সব partition-এ সমানভাবে ছড়িয়ে পড়া।</p>
<div class="diagram"><pre>Partition Key ──▶ hash(key) ──▶  Partition-1 / Partition-2 / Partition-3 ...
                                  (প্রতিটার নিজস্ব throughput capacity)</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — Hot Partition</span> ধরুন একটা table-এ Partition Key হিসেবে <code>status</code> ব্যবহার করা হলো ("ACTIVE", "INACTIVE") — মাত্র দুটো সম্ভাব্য মান। সব "ACTIVE" item একই partition-এ hash হবে, এবং সব traffic সেই একটা partition-এই কেন্দ্রীভূত হবে — এটাই <span class="kw">Hot Partition</span> সমস্যা। এর ফলে সেই একটা partition-এর throughput limit-এ পৌঁছে throttling শুরু হয়, যদিও table-এর সামগ্রিক provisioned capacity যথেষ্ট থাকে।</div>
<div class="callout why"><span class="tag">কেন ভালো Partition Key উচ্চ cardinality দরকার</span> Partition Key-তে যত বেশি unique value থাকবে (high cardinality — যেমন <code>user_id</code>, <code>device_id</code>), ডেটা তত বেশি ভিন্ন ভিন্ন partition-এ ছড়িয়ে পড়বে, এবং প্রতিটা partition-এর নিজস্ব read/write capacity সমানভাবে ব্যবহৃত হবে। এই কারণেই Primary Key ডিজাইন করার আগে ভাবতে হয় "কোন attribute-এ যথেষ্ট বৈচিত্র্য আছে যাতে traffic সমানভাবে ছড়ায়"।</div>

<h3>GSI vs LSI</h3>
<table>
<tr><th></th><th>Local Secondary Index (LSI)</th><th>Global Secondary Index (GSI)</th></tr>
<tr><td>Partition Key</td><td>Base table-এর মতোই থাকতে হয়</td><td>ভিন্ন Partition Key বেছে নেওয়া যায়</td></tr>
<tr><td>তৈরি করার সময়</td><td>শুধু table তৈরির সময় define করা যায়</td><td>যখন খুশি table তৈরির পরও যুক্ত করা যায়</td></tr>
<tr><td>Capacity</td><td>Base table-এর capacity শেয়ার করে</td><td>নিজের আলাদা provisioned/on-demand capacity</td></tr>
<tr><td>Consistency</td><td>Eventually ও Strongly Consistent — দুটোই সমর্থিত</td><td>শুধু Eventually Consistent</td></tr>
<tr><td>সংখ্যা সীমা</td><td>প্রতি table-এ সর্বোচ্চ ৫টা</td><td>প্রতি table-এ সর্বোচ্চ ২০টা (বাড়ানো যায়)</td></tr>
</table>

<h3>Capacity Mode — Provisioned vs On-Demand</h3>
<table>
<tr><th></th><th>Provisioned (with Auto Scaling)</th><th>On-Demand</th></tr>
<tr><td>Cost Model</td><td>আগে থেকে নির্ধারিত RCU/WCU-এর জন্য fixed cost, predictable</td><td>প্রতিটা request অনুযায়ী pay-per-use, কোনো capacity plan লাগে না</td></tr>
<tr><td>উপযুক্ত কখন</td><td>Predictable, steady traffic pattern (Auto Scaling দিয়ে ধীরে ধীরে adjust)</td><td>Unpredictable বা spiky traffic, নতুন প্রজেক্ট যার traffic pattern অজানা</td></tr>
<tr><td>Scaling গতি</td><td>Auto Scaling ধীরে react করে (মিনিট লাগে)</td><td>Sudden traffic spike সাথে সাথেই handle করতে পারে</td></tr>
</table>

<h3>Consistency — Eventually vs Strongly Consistent Read</h3>
<p>DynamoDB ডেটা multiple copy-তে replicate করে রাখে (availability-এর জন্য)। <span class="kw">Eventually Consistent Read</span> যেকোনো একটা copy থেকে পড়ে (হয়তো সদ্য লেখা ডেটা এখনো propagate হয়নি), যেখানে <span class="kw">Strongly Consistent Read</span> নিশ্চিত করে সবচেয়ে latest committed ডেটাই পাওয়া যাবে।</p>
<div class="callout why"><span class="tag">কেন Strongly Consistent Read-এ বেশি RCU লাগে</span> Strongly consistent read নিশ্চিত করতে হলে read request-টাকে বেশিরভাগ replica-র সাথে coordinate করতে হয় যাতে latest write নিশ্চিতভাবে দেখা যায় — এই অতিরিক্ত coordination-এর কারণে এটা eventually consistent read-এর দ্বিগুণ RCU consume করে। তাই যেখানে সামান্য staleness acceptable (যেমন একটা dashboard), সেখানে eventually consistent read বেছে নেওয়া cost-effective।</div>

<h3>DAX (DynamoDB Accelerator)</h3>
<p><span class="kw">DAX</span> DynamoDB-এর জন্য একটা in-memory caching layer, যা microsecond-level latency দেয় (DynamoDB নিজেই single-digit millisecond, কিন্তু অত্যন্ত read-heavy workload-এ আরও কম latency দরকার হতে পারে)।</p>
<div class="callout behind"><span class="tag">কেন DAX ElastiCache-এর চেয়ে সহজ ইন্টিগ্রেশন</span> ElastiCache ব্যবহার করলে আপনাকে নিজে cache-aside pattern কোড করতে হয় — প্রতিটা read-এ প্রথমে cache চেক করা, miss হলে DynamoDB থেকে পড়া, তারপর cache-এ লেখা, এবং invalidation নিজে সামাল দেওয়া। DAX DynamoDB API-compatible একটা drop-in cache — মাত্র endpoint পরিবর্তন করলেই আপনার existing DynamoDB SDK কল স্বয়ংক্রিয়ভাবে DAX-এর মধ্য দিয়ে যায়, cache management logic DAX নিজেই সামলায়।</div>

<h3>DynamoDB Streams</h3>
<p><span class="kw">DynamoDB Streams</span> table-এ প্রতিটা item-level change (insert/update/delete) একটা ordered log হিসেবে ক্যাপচার করে — এটা এক ধরনের <span class="kw">Change Data Capture (CDC)</span>। সাধারণ ব্যবহার হলো Streams-এ Lambda function attach করা, যা প্রতিটা change হওয়ার সাথে সাথেই ট্রিগার হয় — যেমন একটা order table-এ নতুন order আসলে সাথে সাথে inventory update করা, বা analytics pipeline-এ পাঠানো।</p>
<div class="diagram"><pre>DynamoDB Table  ──change──▶  DynamoDB Stream  ──trigger──▶  Lambda
     (write)                  (ordered log)                (side-effect:
                                                             notify, aggregate,
                                                             replicate)</pre></div>

<h3>Single-Table Design — RDBMS থেকে mindset পরিবর্তন</h3>
<p>RDBMS-এ ডেটা প্রথমে normalize করা হয়, তারপর query লেখার সময় প্রয়োজনমতো <code>JOIN</code> করে ডেটা একসাথে আনা হয়। DynamoDB-তে <b>কোনো JOIN নেই</b> — কারণ DynamoDB ডিজাইন করা হয়েছে massive scale-এ predictable, single-digit-millisecond latency দেওয়ার জন্য, এবং JOIN operation-এর cost data volume-এর সাথে অনিশ্চিতভাবে বাড়তে পারে, যা এই predictability ভেঙে দেয়।</p>
<div class="callout why"><span class="tag">কেন আগে থেকেই access pattern ডিজাইন করতে হয়</span> RDBMS-এ আগে schema normalize করে পরে যা লাগবে সেই query লেখা যায়। DynamoDB-তে এটা বিপরীত — আপনাকে প্রথমেই ভাবতে হয় "আমার application-এর সব access pattern কী কী হবে" (যেমন "user দিয়ে order খোঁজা", "order ID দিয়ে খোঁজা", "date range-এ খোঁজা"), এবং সেই অনুযায়ী একই table-এ বিভিন্ন entity type-এর ডেটা এমনভাবে রাখা হয় যাতে প্রতিটা pattern একটামাত্র <code>Query</code> operation দিয়ে সমাধান হয় — এটাই <span class="kw">Single-Table Design</span>। Schema পরিবর্তন করা কঠিন না হলেও, access pattern ভুল ডিজাইন করলে পরে সেটা ঠিক করতে পুরো ডেটা migrate করতে হতে পারে।</div>
<div class="callout best"><span class="tag">Best practice</span> DynamoDB টেবিল ডিজাইন শুরু করার আগে সব known access pattern লিস্ট করুন, তারপর Partition Key/Sort Key ও GSI ডিজাইন করুন — "ডেটা মডেল প্রথমে, তারপর query" এই RDBMS মানসিকতা এখানে খাটে না।</div>
</template>
