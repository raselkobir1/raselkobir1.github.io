<h3>GuardDuty — Detective Control</h3>
<p><span class="kw">GuardDuty</span> একটা <span class="kw">threat detection</span> সার্ভিস — এটা VPC Flow Log, CloudTrail log, ও DNS log বিশ্লেষণ করে অস্বাভাবিক প্যাটার্ন (anomaly) খুঁজে বের করে, যেমন কোনো known malicious IP-তে outbound কল, বা একটা IAM credential অস্বাভাবিক জিওলোকেশন থেকে ব্যবহার হওয়া। এটা কোনো নতুন সেটআপ চাওয়া লাগে না — existing log source থেকেই মেশিন লার্নিং মডেল দিয়ে সিদ্ধান্ত নেয়।</p>
<div class="callout behind"><span class="tag">কেন এটা "detective", "preventive" না</span>
GuardDuty কোনো request ব্লক করে না — এটা কিছু ঘটার পরে সেটা চিহ্নিত করে ও সতর্ক করে। WAF বা Security Group প্রিভেন্টিভ কন্ট্রোল (আগেই আটকায়), কিন্তু GuardDuty ডিটেক্টিভ কন্ট্রোল (ঘটনার পরে ধরিয়ে দেয়) — কারণ কিছু আক্রমণ প্যাটার্ন সময়ের সাথে আচরণ দেখেই বোঝা যায়, single-request rule দিয়ে আগে থেকে সংজ্ঞায়িত করা যায় না। তাই একটা সম্পূর্ণ security posture-এ preventive ও detective দুই ধরনের কন্ট্রোলই লাগে, একটা অন্যটার বিকল্প না।</div>

<h3>AWS Config — রিসোর্স Configuration-এর ইতিহাস ও Compliance</h3>
<p>CloudTrail বলে দেয় "কে কী action চালালো", কিন্তু "এই মুহূর্তে আমার S3 bucket-টা কি encrypted, এবং গত মাসে কি ছিল না" — এই প্রশ্নের উত্তর দেয় <span class="kw">AWS Config</span>। এটা প্রতিটা resource-এর <b>configuration snapshot</b> ও তার পরিবর্তনের সম্পূর্ণ timeline রেকর্ড করে রাখে, এবং একটা <span class="kw">Config Rule</span> (যেমন "সব EBS volume encrypted থাকতে হবে") দিয়ে চেক করে প্রতিটা resource কম্প্লায়েন্ট কিনা তা ক্রমাগত মূল্যায়ন করতে পারে।</p>
<div class="diagram"><pre>
Resource পরিবর্তন হলো (SG rule যুক্ত হলো)
        │
        ▼
Config Snapshot নেয় ──► Timeline-এ যুক্ত হয় ──► Config Rule evaluate করে
                                                       │
                                          ┌────────────┴────────────┐
                                          ▼                         ▼
                                     COMPLIANT              NON_COMPLIANT
                                                             (alert/remediation ট্রিগার করা যায়)
</pre></div>
<div class="callout why"><span class="tag">কেন এটা CloudFormation Drift Detection থেকে আলাদা</span>
CloudFormation Drift Detection শুধু সেই resource-গুলো নিয়ে ভাবে যেগুলো <b>CloudFormation দিয়ে তৈরি</b> — এবং শুধু বলে দেয় "template থেকে সরে গেছে কিনা"। AWS Config পুরো account-এর <b>সব</b> resource ট্র্যাক করে, সেগুলো CloudFormation দিয়ে তৈরি হোক বা ম্যানুয়ালি Console থেকে — এবং শুধু "সরে গেছে কিনা" বলে না, বরং "সরে যাওয়া state-টা আসলে ঠিক কবে, কী থেকে কী হয়েছে" তার সম্পূর্ণ ইতিহাস রাখে। এই কারণে Config একটা broader, সময়ের-সাথে-চলা compliance টুল, যেখানে Drift Detection একটা narrow, IaC-নির্দিষ্ট চেক।</div>
<div class="callout best"><span class="tag">Best practice — Auto Remediation যুক্ত করুন</span>
শুধু NON_COMPLIANT resource চিহ্নিত করাই যথেষ্ট না — Config Rule-এর সাথে একটা SSM Automation document যুক্ত করে auto-remediation সেট করা যায় (যেমন কোনো S3 bucket public হয়ে গেলে স্বয়ংক্রিয়ভাবে তার public access block করে দেওয়া), যাতে মানুষের হস্তক্ষেপের অপেক্ষা না করে সমস্যা তৎক্ষণাৎ ঠিক হয়ে যায়।</div>

<h3>Security Hub</h3>
<p><span class="kw">Security Hub</span> GuardDuty, Inspector, IAM Access Analyzer, Config-এর মতো একাধিক security সার্ভিসের ফাইন্ডিংকে একটাই ড্যাশবোর্ডে অ্যাগ্রিগেট করে, এবং CIS/AWS Foundational Security Best Practices-এর মতো স্ট্যান্ডার্ডের বিপরীতে স্বয়ংক্রিয় compliance check চালায় — ফলে আলাদা আলাদা সার্ভিসে গিয়ে ফাইন্ডিং দেখার বদলে একটা central pane of glass পাওয়া যায়।</p>

<h3>AWS Organizations ও SCP</h3>
<p><span class="kw">AWS Organizations</span> একাধিক AWS account-কে একটা গাছের মতো hierarchy-তে (OU — Organizational Unit) গুছিয়ে সেন্ট্রালি ম্যানেজ করার সুযোগ দেয়। এর সবচেয়ে গুরুত্বপূর্ণ security টুল <span class="kw">SCP (Service Control Policy)</span> — এটা IAM policy-র মতোই লেখা হয়, কিন্তু কাজ করে সম্পূর্ণ ভিন্ন স্তরে।</p>
<div class="callout why"><span class="tag">কেন SCP IAM policy-র "উপরের স্তর"-এর guardrail</span>
IAM policy একটা account-এর ভেতরে একটা user/role কী করতে পারবে তা বলে দেয়, আর সেই account-এর <b>root user</b>-কে IAM policy দিয়ে সীমাবদ্ধ করা যায় না। SCP পুরো account বা OU-এর ওপর কাজ করে — এটা root user সহ সবার জন্য একটা "maximum permission boundary" সেট করে দেয়। কোনো IAM policy যতই Allow দিক, SCP যদি সেই action deny করে রাখে, তাহলে সেটা কখনোই কার্যকর হবে না। এই কারণে অর্গানাইজেশনে "কেউ যেন root account ব্যবহার করে billing region-এর বাইরে resource না বানাতে পারে" এই ধরনের guardrail SCP দিয়েই সম্ভব, একক-account IAM দিয়ে না।</div>
<div class="callout mistake"><span class="tag">Common mistake — SCP-কে IAM policy-র বিকল্প ভাবা</span>
SCP নিজে কখনো কোনো পারমিশন "দেয় না" — এটা শুধু সিলিং টানে (Deny/allow-list)। একটা account-এর ভেতরে অ্যাক্সেস আসলে কাজ করার জন্য এখনো IAM policy-তে সেই পারমিশন Allow থাকতে হবে। অনেকে ভুল করে SCP লিখেই ভাবেন ব্যবহারকারী এখন অ্যাক্সেস পেয়ে গেছে — বাস্তবে SCP শুধু নিষেধ করতে পারে, নিজে থেকে অ্যাক্সেস দিতে পারে না।</div>

<h2 class="title">১৯. Cost Optimization ও Well-Architected Framework</h2>
<p class="lead">AWS-এ ঠিকভাবে আর্কিটেকচার বানানো আর সেটা যত্ন সহকারে খরচ-সচেতনভাবে চালানো — দুটোই আলাদা স্কিল, আর AWS নিজেই এই দুটোকে একটা কাঠামোয় (Well-Architected Framework) বেঁধেছে।</p>

<h3>Pricing Model — সংক্ষিপ্ত পুনরালোচনা</h3>

</table>
<div class="callout why"><span class="tag">কেন Savings Plans RI-এর চেয়ে বেশি flexible</span>
Reserved Instance একটা নির্দিষ্ট instance family ও region-এ লক হয়ে যায় — instance type বদলালে ছাড় হারানোর ঝুঁকি থাকে। Savings Plans commitment করে টাকার পরিমাণে (প্রতি ঘণ্টায় $X খরচ করার প্রতিশ্রুতি), instance type-এ না — তাই আর্কিটেকচার বদলালেও (EC2 থেকে Fargate, বা এক family থেকে আরেক family) ছাড় বহাল থাকে। এই জন্যই AWS নতুন commitment-এর জন্য RI-এর বদলে Savings Plans-কেই বেশি সুপারিশ করে।</div>

<h3>Cost Explorer ও Budgets</h3>
<p><span class="kw">Cost Explorer</span> ঐতিহাসিক খরচ visualize করে — কোন সার্ভিসে, কোন সময়ে খরচ বেড়েছে তা analyze করার জন্য। কিন্তু এটা reactive — সমস্যা ঘটে যাওয়ার পরে দেখা যায়। <span class="kw">AWS Budgets</span> এই ফাঁক পূরণ করে proactive alert দিয়ে — একটা থ্রেশহোল্ড (যেমন মাসিক $৫০০) সেট করলে খরচ সেই সীমার কাছাকাছি বা পার হয়ে গেলে notification পাওয়া যায়, actual খরচ হয়ে যাওয়ার আগেই।</p>
<div class="callout why"><span class="tag">কেন proactive alert জরুরি</span>
মাস শেষে বিল দেখে চমকে যাওয়া — এটা একটা খুবই সাধারণ AWS ভুল, বিশেষ করে ভুলভাবে রেখে দেওয়া resource (forgotten EC2 instance, unused EBS volume, বা একটা misconfigured Lambda loop) কয়েক সপ্তাহ চলার পর। Budgets দিয়ে আগে থেকে সতর্কতা পাওয়া গেলে সমস্যা সমাধান দ্রুত করা যায়, পুরো মাসের ক্ষতি হওয়ার আগে।</div>

<h3>Tagging Strategy</h3>
<p>প্রতিটা resource-এ <code>Team</code>, <code>Project</code>, <code>Environment</code>-এর মতো <span class="kw">Cost Allocation Tag</span> লাগানো একটা ছোট কাজ মনে হলেও, এটা না করলে বিলের ভেতর কোন টিম বা প্রজেক্ট কত খরচ করছে সেটা আলাদা করাই অসম্ভব হয়ে পড়ে — বিশেষ করে যখন একাধিক টিম একই account শেয়ার করে।</p>
<div class="callout mistake"><span class="tag">Common mistake — শুরুতে ট্যাগ না দেওয়া</span>
নতুন প্রজেক্টে "পরে ট্যাগ লাগাবো" ভেবে resource বানানো শুরু হলে, কিছু মাস পরে শত শত resource-এর মধ্যে কোনটা কার — এটা আর মনে রাখা যায় না। Tag Policy দিয়ে account-লেভেলে বাধ্যতামূলক ট্যাগ enforce করাই সঠিক পদ্ধতি, যাতে ট্যাগ ছাড়া resource তৈরিই না হয়।</div>

<h3>Right-Sizing</h3>
<p><span class="kw">Right-sizing</span> মানে actual ব্যবহারের সাথে মিলিয়ে instance/resource-এর সাইজ ঠিক করা। CloudWatch metric (CPU, memory, network) দেখে যদি কোনো instance বারবার ২০%-এর নিচে CPU ব্যবহার করে, তবে সেটা <b>over-provisioned</b> — একটা ছোট instance type-এ নামিয়ে আনলে পারফরম্যান্সে কোনো প্রভাব না ফেলেই খরচ কমানো যায়। Compute Optimizer এই সুপারিশ স্বয়ংক্রিয়ভাবে দেয়।</p>

<h3>Disaster Recovery — RTO, RPO ও চারটা Strategy</h3>
<p>Reliability pillar-এর সবচেয়ে বাস্তব প্রশ্ন হলো — "একটা পুরো region হারিয়ে গেলে কী হবে, এবং তার জন্য আমি কতটা খরচ করতে রাজি?" এই সিদ্ধান্ত নিতে দুটো সংখ্যা প্রথমে ঠিক করতে হয়।</p>
<table>
<tr><th>মেট্রিক</th><th>প্রশ্ন যা এটা উত্তর দেয়</th></tr>
<tr><td><span class="kw">RTO (Recovery Time Objective)</span></td><td>"বিপর্যয়ের পর সিস্টেম আবার চালু হতে সর্বোচ্চ কতক্ষণ সময় লাগতে পারে?"</td></tr>
<tr><td><span class="kw">RPO (Recovery Point Objective)</span></td><td>"বিপর্যয়ে সর্বোচ্চ কত সময়ের ডেটা হারানো গ্রহণযোগ্য?" (শেষ backup আর ঘটনার মধ্যেকার সময়)</td></tr>
</table>
<p>RTO ও RPO যত কম (মানে যত কড়া requirement) চাইবেন, খরচ ও architecture-এর জটিলতা তত বাড়বে — এই trade-off বুঝেই AWS চারটা সাধারণ DR strategy প্রস্তাব করে, cost বনাম recovery speed-এর একটা স্পেকট্রামে।</p>

</pre></div>
<table>

</table>
<div class="callout why"><span class="tag">কেন এই ক্রমটাই খরচ-বনাম-গতির trade-off</span>
Backup & Restore-এ DR region-এ কিছুই চলমান না থাকায় খরচ প্রায় শূন্য (শুধু S3 storage), কিন্তু failover-এর সময় নতুন infrastructure বানিয়ে ডেটা restore করতে ঘণ্টার পর ঘণ্টা লাগে। Multi-Site Active-Active-এ উল্টোটা — দুই region-ই পুরোপুরি চলমান বলে failover প্রায় তাৎক্ষণিক, কিন্তু খরচ দ্বিগুণের কাছাকাছি (দুই region-ই ফুল ক্যাপাসিটিতে চলছে, ব্যবহার হোক বা না হোক)। ব্যবসার RTO/RPO requirement যত কড়া, স্পেকট্রামে তত ডানদিকে যেতে হয়, এবং বাজেটও সেই অনুযায়ী বাড়াতে হয় — কোনো "সবচেয়ে ভালো" strategy নেই, শুধু ব্যবসার প্রয়োজনের সাথে মানানসই একটা আছে।</div>
<div class="callout mistake"><span class="tag">Common mistake — RTO/RPO ঠিক না করেই DR architecture বেছে নেওয়া</span>
অনেক টিম সরাসরি "আমরা Multi-Region যাব" বলে ফেলে, RTO/RPO সংখ্যায় নামিয়ে না এনেই — ফলে হয় প্রয়োজনের চেয়ে বেশি খরচ হয় (Active-Active দরকার নেই এমন সিস্টেমেও), অথবা production-এ প্রকৃত outage-এর সময় দেখা যায় বাস্তব recovery time প্রতিশ্রুতির চেয়ে অনেক বেশি। সঠিক ক্রম — প্রথমে ব্যবসার সাথে বসে RTO/RPO সংখ্যায় নির্ধারণ করা, তারপর সেই সংখ্যার সাথে মানানসই সবচেয়ে সস্তা strategy বেছে নেওয়া।</div>

<h2 class="title">২০. Interview প্রশ্নোত্তর</h2>
<p class="lead">AWS ইন্টারভিউতে বারবার আসা প্রশ্ন — প্রতিটা আগের চ্যাপ্টারের রেফারেন্স দিয়ে।</p>

<h3>১) IAM Role আর IAM User-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> IAM User একটা নির্দিষ্ট মানুষ বা অ্যাপ্লিকেশনের স্থায়ী identity — এর সাথে long-term credential (password/access key) যুক্ত থাকে। IAM Role-এর কোনো নিজস্ব স্থায়ী credential থাকে না — এটা একটা identity যা অন্য কেউ (মানুষ, সার্ভিস, বা এমনকি ভিন্ন AWS account) সাময়িকভাবে "assume" করে, এবং STS থেকে temporary credential পায় যা কিছু সময় পর নিজে থেকে expire হয়ে যায়। EC2/Lambda-এর মতো সার্ভিসকে permission দিতে সবসময় Role ব্যবহার করা উচিত, User বানিয়ে access key hardcode করা উচিত না। এই বিষয় ২ নম্বর অধ্যায়ে বিস্তারিত আলোচনা করা হয়েছে।</p>

<h3>২) IAM policy evaluation-এর মূল নিয়ম কী — একাধিক policy সাংঘর্ষিক হলে কী হয়?</h3>
<p><b>উত্তর:</b> AWS-এর policy evaluation সবসময় "default deny" থেকে শুরু হয় — কোনো Allow না থাকলে সব কিছু নিষেধ। একাধিক policy (identity-based, resource-based, SCP, permission boundary) মিলিয়ে মূল্যায়ন হয়, এবং যদি কোথাও একটাও explicit <code>Deny</code> থাকে, সেটা সবকিছুর ওপরে জিতে যায় — Allow যতই থাকুক না কেন। তাই "Deny সবচেয়ে শক্তিশালী, তারপর Allow, ডিফল্ট সবসময় Deny" এই ক্রম মাথায় রাখা জরুরি। এটা ২ নম্বর অধ্যায়ের কেন্দ্রীয় বিষয়।</p>

<h3>৩) Spot Instance আর Reserved Instance কখন কোনটা বেছে নেবেন?</h3>
<p><b>উত্তর:</b> Reserved Instance একটা নির্দিষ্ট, predictable, দীর্ঘমেয়াদি (১-৩ বছর) ওয়ার্কলোডের জন্য — commitment দিয়ে বড় ছাড় (৪০-৭২%) পাওয়া যায়, কিন্তু interruption হয় না। Spot Instance স্পট মার্কেটের অতিরিক্ত ক্যাপাসিটি থেকে আসে, ছাড় অনেক বেশি (৭০-৯০%) কিন্তু AWS ২ মিনিটের নোটিসে instance ফিরিয়ে নিতে পারে — তাই এটা শুধু fault-tolerant, stateless workload-এর জন্য (batch processing, CI/CD, distributed rendering) উপযুক্ত, প্রোডাকশন ডাটাবেসের জন্য না। এই তুলনা ৩ ও ১৯ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৪) Security Group আর Network ACL-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> Security Group instance/ENI লেভেলে কাজ করে, এটা <b>stateful</b> (আসা রিকোয়েস্টের রেসপন্স স্বয়ংক্রিয়ভাবে ফেরত যেতে পারে) এবং শুধু <code>Allow</code> rule সাপোর্ট করে। Network ACL (NACL) সাবনেট লেভেলে কাজ করে, এটা <b>stateless</b> (ইন ও আউট আলাদাভাবে rule দিয়ে অনুমোদন করতে হয়) এবং <code>Allow</code> ও <code>Deny</code> দুটোই সাপোর্ট করে, rule নম্বর ক্রম অনুযায়ী evaluate হয়। ব্যবহারিকভাবে Security Group প্রাথমিক defense, NACL অতিরিক্ত সাবনেট-লেভেল guardrail। এই তুলনা ৪ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৫) Public Subnet আর Private Subnet-এর পার্থক্য কী, এবং NAT Gateway কেন প্রয়োজন?</h3>
<p><b>উত্তর:</b> Public Subnet-এর route table-এ Internet Gateway-এর দিকে একটা রুট থাকে, ফলে ঐ সাবনেটের resource সরাসরি ইন্টারনেট থেকে অ্যাক্সেসযোগ্য হতে পারে (পাবলিক IP থাকলে)। Private Subnet-এ এই রুট না থাকায় বাইরে থেকে সরাসরি পাওয়া যায় না — কিন্তু ভেতরের resource-এর (যেমন একটা DB বা backend service) নিজেরই বাইরের ইন্টারনেটে (patch update, third-party API) যাওয়ার প্রয়োজন হতে পারে। NAT Gateway ঠিক এই এক-দিকের যাওয়ার পথ দেয় — private subnet থেকে আউটবাউন্ড ট্রাফিক পাবলিক ইন্টারনেটে যেতে পারে, কিন্তু বাইরে থেকে ভেতরে কোনো ইনবাউন্ড কানেকশন শুরু করা যায় না। এই ধারণা ৪ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৬) S3 Storage Class কীভাবে বাছবেন, এবং S3 কোন consistency model দেয়?</h3>
<p><b>উত্তর:</b> Storage class বাছাই মূলত access frequency-এর ওপর নির্ভর করে — নিয়মিত অ্যাক্সেস হওয়া ডেটার জন্য S3 Standard, কম অ্যাক্সেস হওয়া কিন্তু দ্রুত লাগলে Standard-IA, দীর্ঘমেয়াদি archive-এর জন্য Glacier-এর বিভিন্ন টায়ার (retrieval time ও খরচের ট্রেড-অফ ভিন্ন)। access pattern অনিশ্চিত হলে S3 Intelligent-Tiering স্বয়ংক্রিয়ভাবে অপ্টিমাইজ করে। S3 এখন সব operation-এর জন্য <b>strong consistency</b> দেয় (২০২০-এর পর থেকে) — একটা write সফল হলে পরের read সাথে সাথেই আপডেটেড ডেটা পাবে, আগে যেমন eventual consistency-এর জটিলতা ছিল তা এখন নেই। এই বিষয় ৫ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৭) RDS Multi-AZ আর Read Replica-এর পার্থক্য কী — এটা একটা ক্লাসিক ভুল বোঝাবুঝি?</h3>
<p><b>উত্তর:</b> Multi-AZ মূলত <b>high availability</b>-এর জন্য — একটা সিঙ্ক্রোনাস স্ট্যান্ডবাই কপি আলাদা AZ-তে রাখা হয়, যা শুধু প্রাইমারি ব্যর্থ হলে ফেইলওভারে কাজে আসে; এটা সরাসরি read traffic নেয় না এবং পারফরম্যান্স বাড়ায় না। Read Replica মূলত <b>scalability</b>-এর জন্য — এসিঙ্ক্রোনাস কপি যা read-heavy workload-এর জন্য আলাদাভাবে read traffic সার্ভ করে, এবং একাধিক replica বানানো যায় (এমনকি ভিন্ন region-এও)। একটা প্রোডাকশন সিস্টেমে দুটোই একসাথে ব্যবহার করা সাধারণ — Multi-AZ availability-এর জন্য, Read Replica স্কেলিং-এর জন্য। এই তুলনা ৭ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৮) DynamoDB-এ partition key ডিজাইন করার সময় কী মাথায় রাখা উচিত?</h3>
<p><b>উত্তর:</b> DynamoDB ডেটা partition key-এর হ্যাশের ওপর ভিত্তি করে একাধিক physical partition-এ ছড়িয়ে দেয়, তাই একটা ভালো partition key-এ high cardinality (অনেক আলাদা মান) থাকা প্রয়োজন যাতে ট্রাফিক সমানভাবে ছড়ায়। যদি অনেক আইটেম একই partition key শেয়ার করে (যেমন সব ইউজারের জন্য একটাই "status" key), তাহলে একটা "hot partition" তৈরি হয় যা throughput সীমিত করে দেয়। GSI (Global Secondary Index) নিজের আলাদা partition key/sort key দিয়ে ভিন্ন query pattern সাপোর্ট করে ও eventually consistent হয়, যেখানে LSI (Local Secondary Index) একই partition key কিন্তু ভিন্ন sort key ব্যবহার করে ও strongly consistent read সাপোর্ট করে, কিন্তু টেবিল তৈরির সময়েই define করতে হয়। এই বিষয় ৮ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>৯) ALB আর NLB কখন কোনটা বেছে নেবেন?</h3>
<p><b>উত্তর:</b> ALB (Application Load Balancer) OSI layer 7-এ কাজ করে — HTTP/HTTPS-এর content (path, host header) দেখে রাউটিং করতে পারে, তাই microservices/path-based routing-এর জন্য উপযুক্ত। NLB (Network Load Balancer) layer 4-এ কাজ করে, অনেক বেশি throughput ও কম latency দেয়, স্ট্যাটিক IP সাপোর্ট করে, এবং TCP/UDP-ভিত্তিক non-HTTP প্রোটোকলের (যেমন gaming, IoT) জন্য প্রয়োজন হয়। সংক্ষেপে — HTTP-অ্যাওয়ার রাউটিং লাগলে ALB, extreme performance বা non-HTTP প্রোটোকল লাগলে NLB। এই তুলনা ৯ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১০) Lambda-এ Cold Start কী, এবং Concurrency কীভাবে কাজ করে?</h3>
<p><b>উত্তর:</b> Lambda function কিছু সময় নিষ্ক্রিয় থাকলে AWS তার execution environment বন্ধ করে দেয়; পরের ইনভোকেশনে নতুন environment বুট করা লাগে (কোড লোড, runtime init, static initialization) — এই বাড়তি সময়টাই <span class="kw">Cold Start</span>। যত environment "warm" (আগের থেকেই চালু) থাকে, request তত ধীরে ধীরে reuse করে চলে, cold start এড়িয়ে যায়। <span class="kw">Concurrency</span> মানে একই সময়ে কতগুলো execution environment সমান্তরালে চলছে — Reserved Concurrency একটা function-এর জন্য নির্দিষ্ট সীমা বেঁধে দেয় (এবং সেই সীমার মধ্যে গ্যারান্টিও দেয়), Provisioned Concurrency আগে থেকেই কিছু environment "warm" রেখে দেয় যাতে latency-sensitive workload-এ cold start এড়ানো যায়। এই বিষয় ১২ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১১) SQS, SNS ও EventBridge-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> SQS একটা <b>queue</b> — মেসেজ একটাই consumer গ্রহণ করে ও প্রসেস করে (point-to-point), মূলত decoupling ও workload buffering-এর জন্য। SNS একটা <b>pub/sub</b> সার্ভিস — একটা মেসেজ একসাথে একাধিক subscriber-কে (SQS queue, Lambda, email ইত্যাদি) fan-out হয়। EventBridge আরও উন্নত ইভেন্ট-রাউটিং সার্ভিস — content-based filtering (event pattern matching) দিয়ে নির্দিষ্ট শর্ত মিললেই নির্দিষ্ট টার্গেটে রাউট করে, এবং schema registry, third-party SaaS ইভেন্ট ইন্টিগ্রেশনের মতো advanced ফিচার আছে (আগে এর নাম ছিল CloudWatch Events)। তিনটাই messaging-এর ভিন্ন প্যাটার্ন সমাধান করে, একটা আরেকটার সরাসরি বিকল্প না। এই তুলনা ১৪ ও ১৭ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১২) ECS, EKS ও Fargate-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> ECS আর EKS দুটোই container orchestrator, কিন্তু ECS AWS-এর নিজস্ব সহজ, প্রোপ্রাইটরি অর্কেস্ট্রেশন সিস্টেম, আর EKS ম্যানেজড Kubernetes — যদি আপনার টিম Kubernetes-এর ecosystem (Helm, kubectl, portability) চায় বা multi-cloud কৌশল থাকে তবে EKS, নাহলে সরলতার জন্য ECS যথেষ্ট। Fargate কোনো orchestrator না — এটা একটা <b>launch type</b> (compute engine) যা ECS বা EKS দুটোর সাথেই ব্যবহার করা যায়, যেখানে EC2 instance ম্যানেজ করার বদলে AWS নিজেই সার্ভারলেসভাবে কন্টেইনার চালানোর ইনফ্রাস্ট্রাকচার সামলায়। এই বিষয় ১৫ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৩) CloudFront-এ Cache Invalidation আর Versioning-এর মধ্যে পার্থক্য কী, কোনটা ভালো?</h3>
<p><b>উত্তর:</b> Cache Invalidation মানে CloudFront-কে বলে দেওয়া একটা নির্দিষ্ট path-এর cached কপি জোরপূর্বক মুছে ফেলতে, যাতে পরের রিকোয়েস্ট origin থেকে নতুন কপি আনে — কিন্তু এটার খরচ আছে (একটা ফ্রি কোটার পরে) এবং সব edge location-এ propagate হতে কিছুটা সময় লাগে। Versioning পদ্ধতিতে ফাইলের নামেই একটা ইউনিক ভার্সন (হ্যাশ বা বিল্ড নম্বর) যুক্ত করা হয় (যেমন <code>app.a1b2c3.js</code>) যাতে প্রতিটা নতুন ভার্সন স্বয়ংক্রিয়ভাবে ভিন্ন URL হয়ে যায় ও পুরনো cache প্রভাবিতই হয় না। বেশিরভাগ প্রোডাকশন সিস্টেমে versioning প্রেফার করা হয় কারণ এটা নির্ভরযোগ্য, তাৎক্ষণিক ও খরচহীন — invalidation ব্যবহার হয় শুধু জরুরি/emergency কনটেন্ট আপডেটের জন্য। এই বিষয় ১১ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৪) Envelope Encryption কী, এবং কেন এটা KMS-এর সাথে ব্যবহার হয়?</h3>
<p><b>উত্তর:</b> KMS-এর API call-এ payload সাইজ ও থ্রুপুট লিমিট আছে, তাই বড় ডেটা সরাসরি KMS দিয়ে এনক্রিপ্ট করা অকার্যকর। Envelope Encryption প্যাটার্নে KMS দিয়ে একটা ছোট data key তৈরি করা হয় (plaintext ও encrypted দুই ভার্সনে), তারপর plaintext key দিয়ে আসল বড় ডেটা লোকালি এনক্রিপ্ট করা হয় এবং সাথে সাথে plaintext key মেমরি থেকে মুছে ফেলা হয় — শুধু encrypted key ও encrypted data সংরক্ষিত থাকে। ফলে ভারী এনক্রিপশন কাজ লোকালি সিপিইউতে হয়, আর KMS শুধু key-management-এর দামি, নিরাপদ অংশটা সামলায়। এই বিষয় ১৮ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৫) Shield আর WAF-এর মধ্যে পার্থক্য কী — দুটোই কি একই কাজ করে?</h3>
<p><b>উত্তর:</b> না, দুটো ভিন্ন সমস্যা সমাধান করে। Shield মূলত <b>DDoS প্রতিরোধ</b> — নেটওয়ার্ক/ট্রান্সপোর্ট লেয়ার (এবং Advanced হলে অ্যাপ্লিকেশন লেয়ার) ভলিউমেট্রিক আক্রমণ থেকে রক্ষা করে; Standard সবার জন্য ফ্রি ও স্বয়ংক্রিয়, Advanced পেইড এবং DDoS-জনিত অতিরিক্ত বিল কভার করে। WAF মূলত <b>অ্যাপ্লিকেশন-লেভেল আক্রমণ</b> (SQL injection, XSS, নির্দিষ্ট rate-based abuse) থেকে রক্ষা করে নির্দিষ্ট rule দিয়ে request পরীক্ষা করে। বাস্তবে দুটো একসাথে ব্যবহার করা হয় — Shield ভলিউম-ভিত্তিক আক্রমণ ঠেকায়, WAF কনটেন্ট-ভিত্তিক আক্রমণ ঠেকায়। এই তুলনা ১৮ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৬) IaC (Infrastructure as Code) কেন গুরুত্বপূর্ণ, এবং CloudFormation/Terraform-এর মূল ধারণা কী?</h3>
<p><b>উত্তর:</b> Console বা CLI দিয়ে ম্যানুয়ালি resource বানালে সময়ের সাথে "configuration drift" তৈরি হয় — কেউ মনে রাখে না ঠিক কী সেটিংস দিয়ে কোন resource বানানো হয়েছিল, এবং পরিবেশ পুনরুৎপাদন (নতুন environment বা disaster recovery) কঠিন হয়ে পড়ে। IaC-তে ইনফ্রাস্ট্রাকচারকে কোড (YAML/JSON/HCL) হিসেবে লেখা হয়, যা version control-এ রাখা যায়, review করা যায়, এবং স্বয়ংক্রিয়ভাবে বারবার একই ফলাফল দিয়ে deploy করা যায় (idempotency)। CloudFormation AWS-নেটিভ ও state AWS নিজেই ম্যানেজ করে, Terraform মাল্টি-cloud সাপোর্ট করে কিন্তু state file নিজেকেই (বা S3 backend-এ) ম্যানেজ করতে হয়। এই বিষয় ১৬ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৭) Well-Architected Framework-এর ৬টা pillar কী কী, এবং এটা প্র্যাক্টিক্যালি কীভাবে ব্যবহার হয়?</h3>
<p><b>উত্তর:</b> ৬টা pillar হলো Operational Excellence (সিস্টেম চালানো ও উন্নত করার প্রক্রিয়া), Security, Reliability (ব্যর্থতা থেকে recover হওয়া), Performance Efficiency, Cost Optimization, এবং Sustainability (পরিবেশগত প্রভাব কমানো)। বাস্তবে এটা একটা checklist-এর মতো ব্যবহার হয় — নতুন আর্কিটেকচার ডিজাইন করার সময় বা periodic review-এর সময় AWS-এর Well-Architected Tool দিয়ে প্রতিটা pillar-এর প্রশ্নের বিপরীতে সিস্টেম যাচাই করা হয়, যাতে কোনো একটা দিক (যেমন খরচ কমাতে গিয়ে reliability compromise) উপেক্ষিত না থাকে। এই বিষয় ১৯ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৮) CloudWatch Alarm-এ INSUFFICIENT_DATA state কেন আলাদা রাখা হয়েছে?</h3>
<p><b>উত্তর:</b> যদি এই state না থাকতো, alarm-কে বাধ্য হয়ে OK বা ALARM-এর মধ্যে একটা বেছে নিতে হতো এমনকি যখন যথেষ্ট data point-ই আসেনি বা metric সাময়িকভাবে বন্ধ হয়ে গেছে — এতে ভুল নিরাপত্তার অনুভূতি (false OK) তৈরি হতো। INSUFFICIENT_DATA স্পষ্টভাবে বলে দেয় "সিদ্ধান্ত নেওয়ার তথ্যই নেই", যা একটা নতুন চালু হওয়া resource বা সাময়িক মেট্রিক বিভ্রাটের সময় সঠিক প্রতিনিধিত্ব দেয়। এই বিষয় ১৭ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>১৯) On-Demand, Reserved, Savings Plans ও Spot pricing-এর মধ্যে সাধারণ পার্থক্য সংক্ষেপে বলুন।</h3>
<p><b>উত্তর:</b> On-Demand কোনো commitment ছাড়া বেসলাইন রেট, নমনীয় কিন্তু সবচেয়ে দামি। Reserved Instances ১-৩ বছরের commitment দিয়ে বড় ছাড় (৪০-৭২%) দেয় কিন্তু নির্দিষ্ট instance family/region-এ লক থাকে। Savings Plans একই রকম ছাড় দেয় টাকার commitment-এর ভিত্তিতে, কিন্তু instance type জুড়ে flexible। Spot Instances সবচেয়ে বেশি ছাড় (৭০-৯০%) দেয় কিন্তু ২ মিনিটের নোটিসে interrupt হতে পারে, তাই শুধু fault-tolerant workload-এর জন্য উপযুক্ত। এই তুলনা ১৯ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২০) VPC Peering আর Transit Gateway-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> VPC Peering দুটো VPC-এর মধ্যে একটা সরাসরি, পয়েন্ট-টু-পয়েন্ট কানেকশন তৈরি করে — কয়েকটা VPC হলে ঠিক আছে, কিন্তু VPC সংখ্যা বাড়লে প্রতিটা জোড়ার মধ্যে আলাদা peering লাগে (n×(n-1)/2 কানেকশন) এবং peering transitive না (A-B ও B-C peered হলেও A সরাসরি C-তে পৌঁছাতে পারে না)। Transit Gateway একটা কেন্দ্রীয় হাব হিসেবে কাজ করে — সব VPC একটাই Transit Gateway-এর সাথে কানেক্ট হয়, ফলে ম্যানেজমেন্ট সহজ হয় ও transitive রাউটিং সম্ভব হয়। বড় সংখ্যক VPC (dozens বা তার বেশি) থাকলে Transit Gateway-ই স্কেলেবল সমাধান। এই বিষয় ৪ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২১) CloudTrail আর CloudWatch-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> CloudWatch সিস্টেমের <b>পারফরম্যান্স ও স্বাস্থ্য</b> নিয়ে কাজ করে — metric, alarm, log, dashboard দিয়ে বলে দেয় "সিস্টেম কেমন চলছে"। CloudTrail সম্পূর্ণ ভিন্ন প্রশ্নের উত্তর দেয় — "কে, কখন, কোন AWS API call করলো" — প্রতিটা Console/CLI/SDK action-এর একটা audit log রাখে। Security incident investigation বা compliance audit-এ প্রথমেই CloudTrail দেখা হয়, পারফরম্যান্স সমস্যায় CloudWatch। এই তুলনা ১৭ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২২) RTO আর RPO-এর পার্থক্য কী, এবং AWS-এ চারটা DR strategy কী কী?</h3>
<p><b>উত্তর:</b> RTO (Recovery Time Objective) বলে দেয় বিপর্যয়ের পর সিস্টেম আবার চালু হতে সর্বোচ্চ কতক্ষণ সময় লাগতে পারে, আর RPO (Recovery Point Objective) বলে দেয় সর্বোচ্চ কত সময়ের ডেটা হারানো গ্রহণযোগ্য। এই দুই সংখ্যার কড়াকড়ি অনুযায়ী AWS চারটা strategy প্রস্তাব করে, খরচ বনাম recovery-speed-এর স্পেকট্রামে — Backup &amp; Restore (সস্তা, ধীর), Pilot Light (core resource minimal অবস্থায় চলমান), Warm Standby (পুরো architecture-এর ছোট-স্কেল কপি চলমান), এবং Multi-Site Active-Active (দুই region-ই সমান-স্কেলে লাইভ, প্রায় তাৎক্ষণিক failover)। এই বিষয় ১৯ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২৩) Cognito User Pool আর Identity Pool-এর পার্থক্য কী?</h3>
<p><b>উত্তর:</b> User Pool authentication সমাধান করে — user sign-up/sign-in, password reset, MFA — এবং সফল লগইনে একটা JWT token দেয়। Identity Pool ভিন্ন সমস্যা সমাধান করে — একটা authenticated (বা এমনকি guest) user-কে সরাসরি AWS resource অ্যাক্সেসের জন্য temporary AWS credential (STS-এর মাধ্যমে) ইস্যু করে, যেমন মোবাইল app সরাসরি S3-এ ফাইল আপলোড করা backend API ছাড়াই। দুটো প্রায়ই একসাথে ব্যবহৃত হয় — User Pool দিয়ে "কে তুমি" যাচাই করে, তারপর সেই token Identity Pool-কে দিয়ে AWS credential নেওয়া হয়। এই বিষয় ১৩ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২৪) EC2-তে SSH-এর বদলে Systems Manager Session Manager কেন ব্যবহার করা হয়?</h3>
<p><b>উত্তর:</b> SSH ব্যবহার করতে হলে প্রতিটা instance-এ port 22 খোলা রাখতে হয়, key pair ম্যানেজ করতে হয়, এবং প্রায়ই একটা bastion host চালাতে হয় — প্রতিটাই একটা অতিরিক্ত attack surface। Session Manager IAM permission দিয়েই একটা secure shell session খুলে দেয় SSM Agent-এর মাধ্যমে — কোনো inbound port খোলা রাখা লাগে না, কোনো key pair লাগে না, এবং প্রতিটা session CloudTrail-এ log হয়ে যায় সম্পূর্ণ audit trail-সহ। এই কারণে অনেক প্রোডাকশন environment-এ port 22 সম্পূর্ণ বন্ধ রেখে শুধু Session Manager-ই একমাত্র access পথ রাখা হয়। এই বিষয় ৩ নম্বর অধ্যায়ে বিস্তারিত।</p>

<h3>২৫) SQS আর Kinesis Data Streams-এর মধ্যে পার্থক্য কী?</h3>
<p><b>উত্তর:</b> SQS-এ একটা message consume করে delete হয়ে গেলে সেটা হারিয়ে যায় (destructive, competing consumers মডেল) — এক producer, এক (বা প্রতিযোগী) consumer-এর জন্য উপযুক্ত। Kinesis Data Streams ডেটাকে একটা retention period পর্যন্ত ধরে রাখে এবং একাধিক independent consumer একই ডেটা আলাদাভাবে, নিজের cursor ট্র্যাক করে সমান্তরালে পড়তে পারে, এমনকি replay-ও করতে পারে — real-time analytics pipeline বা একই ডেটা একাধিক downstream system-এ পাঠানোর জন্য উপযুক্ত। এই বিষয় ১৪ নম্বর অধ্যায়ে বিস্তারিত।</p>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
</html>
