<h2 class="title">৯. Load Balancing ও Auto Scaling</h2>
<p class="lead">একটা সার্ভার কখনোই "যথেষ্ট" না — ট্রাফিক বাড়লে বা কোনো instance আচমকা ক্র্যাশ করলে সিস্টেম যেন নিজে থেকেই সামলে নিতে পারে, সেটাই Load Balancing আর Auto Scaling একসাথে করে।</p>

<h3>ALB vs NLB vs CLB — কোনটা কখন</h3>
<p>AWS-এ তিন প্রজন্মের Elastic Load Balancer আছে। <span class="kw">CLB</span> (Classic Load Balancer) সবচেয়ে পুরনো, নতুন প্রজেক্টে এখন প্রায় ব্যবহার হয় না — legacy সিস্টেমে টিকে থাকে মাত্র। বাকি দুটোই আজকের বাস্তব পছন্দ, কিন্তু তারা একদমই ভিন্ন layer-এ কাজ করে।</p>
<table>
<tr><th>বিষয়</th><th>ALB (Application LB)</th><th>NLB (Network LB)</th><th>CLB (Classic, legacy)</th></tr>
<tr><td>OSI Layer</td><td>Layer 7 (HTTP/HTTPS)</td><td>Layer 4 (TCP/UDP/TLS)</td><td>Layer 4 ও কিছুটা Layer 7</td></tr>
<tr><td>Routing ভিত্তি</td><td>URL path, hostname, header, query string</td><td>IP + port</td><td>খুব সীমিত, শুধু port-based</td></tr>
<tr><td>Throughput/Latency</td><td>মাঝারি overhead (HTTP parse করে)</td><td>অতি কম latency, খুব বেশি throughput</td><td>মাঝারি</td></tr>
<tr><td>WebSocket / HTTP2</td><td>সাপোর্ট করে</td><td>TCP পাস-থ্রু বলে natively সাপোর্ট করে (protocol নিয়ে মাথা ঘামায় না)</td><td>সীমিত/নেই</td></tr>
<tr><td>Static IP</td><td>না (DNS name দেয়)</td><td>হ্যাঁ, প্রতি AZ-এ একটা static/Elastic IP</td><td>না</td></tr>
<tr><td>সাধারণ use case</td><td>Web app, microservices, path/host-based routing</td><td>Gaming, IoT, high-frequency trading, extreme low-latency TCP</td><td>পুরনো EC2-Classic অ্যাপ</td></tr>
</table>
<div class="callout why"><span class="tag">কেন — layer আলাদা হলে ক্ষমতাও আলাদা</span>
ALB HTTP request-টা আসলে <b>পার্স করে বুঝে নেয়</b> — path, header, host সব দেখতে পারে বলেই smart routing সম্ভব। NLB এই parsing করেই না, শুধু TCP packet forward করে দেয় — তাই এত দ্রুত, কিন্তু path/host দেখে route করার সুযোগ নেই। "স্মার্ট" আর "দ্রুত" — এই trade-off-টাই দুটো লোড ব্যালান্সারের মূল পার্থক্য।</div>

<h3>Target Group ও Health Check</h3>
<p>Load Balancer সরাসরি EC2 instance-কে চেনে না — সে ট্রাফিক পাঠায় একটা <span class="kw">Target Group</span>-এর কাছে, আর Target Group-ই instance/IP/Lambda-এর লিস্ট রাখে ও তাদের স্বাস্থ্য পরীক্ষা করে।</p>
<div class="diagram"><pre>
Client → ALB → Listener (port 443) → Listener Rule → Target Group
                                                          │
                                        ┌─────────────────┼─────────────────┐
                                        ▼                 ▼                 ▼
                                  Instance A       Instance B        Instance C
                                  (healthy)        (healthy)         (UNHEALTHY)
                                        ▲                 ▲
                                        └── periodic health check (GET /health) ──┘
                                             Instance C বাদ পড়ে ট্রাফিক থেকে
</pre></div>
<p>Health check নির্দিষ্ট interval-এ (যেমন ৩০ সেকেন্ডে একবার) প্রতিটা target-এ একটা request পাঠায় (সাধারণত HTTP GET একটা path-এ, যেমন <code>/health</code>)। পরপর কয়েকবার (<code>Unhealthy threshold</code>) fail করলে ALB সেই target-কে <b>unhealthy</b> মার্ক করে এবং নতুন ট্রাফিক পাঠানো বন্ধ করে দেয় — কিন্তু instance-টা টার্মিনেট করে না, শুধু রাউটিং থেকে বাদ দেয়।</p>
<div class="callout mistake"><span class="tag">Common mistake — health check path অ্যাপ্লিকেশনের সাথে না মেলা</span>
অনেকে health check path ডিফল্ট <code>/</code> রেখে দেয়, কিন্তু সেই route DB কল করে বা auth চায় — ফলে DB সামান্য স্লো হলেই পুরো fleet "unhealthy" দেখাবে আর ALB সব ট্রাফিক বন্ধ করে দেবে। আলাদা lightweight <code>/health</code> endpoint বানানো উচিত যা শুধু "process বেঁচে আছে কিনা" চেক করে, downstream dependency-র উপর নির্ভর করে না।</div>

<h3>ACM — HTTPS Certificate ফ্রি ও স্বয়ংক্রিয়ভাবে renew</h3>
<p>একটা ALB-এ HTTPS listener (port 443) চালাতে একটা SSL/TLS certificate লাগে। <span class="kw">AWS Certificate Manager (ACM)</span> দিয়ে এই certificate সম্পূর্ণ ফ্রি তৈরি করা যায় (DNS বা email দিয়ে domain ownership validate করে), এবং সবচেয়ে বড় সুবিধা — certificate নিজে থেকেই মেয়াদ শেষ হওয়ার আগে renew হয়ে যায়, ম্যানুয়াল renewal-এর ঝক্কি নেই।</p>
<div class="callout why"><span class="tag">কেন ম্যানুয়াল certificate renewal একটা বাস্তব ঝুঁকি</span>
প্রথাগতভাবে SSL certificate কেনা, install করা, এবং প্রতি ১-২ বছরে renew করা মনে রাখা — এটা এত বেশি প্রোডাকশন outage-এর কারণ হয়েছে যে "certificate expired, সাইট ডাউন" একটা পরিচিত ঘটনা। ACM এই পুরো সমস্যা দূর করে দেয় — certificate DNS validation-এর মাধ্যমে auto-renew হয় (যদি validation record ঠিকমতো বহাল থাকে), এবং renewal-এর জন্য কোনো downtime বা ম্যানুয়াল হস্তক্ষেপ লাগে না।</div>
<div class="callout mistake"><span class="tag">Common mistake — CloudFront-এর জন্য ভুল region-এ certificate বানানো</span>
ALB-এর certificate সেই ALB যে region-এ আছে সেখানেই বানাতে হয়, কিন্তু CloudFront-এর জন্য certificate সবসময় <code>us-east-1</code> (N. Virginia) region-এ বানাতে হয় — CloudFront যতই অন্য region-এর origin serve করুক না কেন। এটা ভুলে গিয়ে অন্য region-এ certificate বানালে CloudFront distribution-এ সেটা attach করার অপশনই দেখা যায় না, এবং নতুনরা প্রায়ই বিভ্রান্ত হয়ে ভাবে সার্ভিস ভাঙা।</div>

<h3>Listener ও Listener Rule — Path/Host-based Routing</h3>
<p><span class="kw">Listener</span> হলো একটা port আর protocol-এ ALB যেভাবে শোনে (যেমন 443-এ HTTPS)। একটা Listener-এর ভেতরে একাধিক <span class="kw">Listener Rule</span> থাকতে পারে, যেগুলো condition অনুযায়ী আলাদা আলাদা Target Group-এ ট্রাফিক পাঠায়।</p>
<pre>Rule 1: IF path is  /api/*        THEN forward to  tg-api-service
Rule 2: IF path is  /images/*     THEN forward to  tg-static-service
Rule 3: IF host is  admin.example.com  THEN forward to  tg-admin-service
Rule default: THEN forward to  tg-frontend-service</pre>
<p>এই path-based ও host-based routing-এর কারণেই একটাই ALB দিয়ে একাধিক microservice সার্ভ করা সম্ভব — আলাদা আলাদা লোড ব্যালান্সার লাগে না, খরচ ও অপারেশনাল overhead দুটোই কমে।</p>

<h3>Auto Scaling Group — Launch Template ও Capacity</h3>
<p><span class="kw">Auto Scaling Group (ASG)</span> একটা group of EC2 instance ম্যানেজ করে, যেন সবসময় নির্দিষ্ট সংখ্যক healthy instance চলমান থাকে। প্রতিটা নতুন instance ঠিক কেমন হবে (AMI, instance type, security group, user-data script) তা আসে <span class="kw">Launch Template</span> থেকে — এটা একরকম "ব্লুপ্রিন্ট"।</p>
<table>
<tr><th>প্যারামিটার</th><th>মানে</th></tr>
<tr><td>Min capacity</td><td>যত পরিস্থিতিই হোক, এর নিচে instance সংখ্যা নামবে না</td></tr>
<tr><td>Max capacity</td><td>যত ট্রাফিকই আসুক, এর বেশি instance স্পন হবে না (cost cap)</td></tr>
<tr><td>Desired capacity</td><td>এই মুহূর্তে ASG কত instance রাখতে চায় — scaling policy এটাকেই adjust করে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Max capacity গুরুত্বপূর্ণ</span>
Target Tracking policy যদি ভুল metric বা misconfigured threshold নিয়ে চলে, তাহলে unlimited instance স্পন করার ঝুঁকি থাকে — একটা bug বা traffic spike পুরো billing-কে বিস্ফোরিত করতে পারে। Max capacity একটা hard safety net, ঠিক যেমন IAM-এ least privilege।</div>

<h3>Scaling Policy — Target Tracking vs Step vs Scheduled</h3>
<table>
<tr><th>Policy</th><th>কীভাবে কাজ করে</th><th>কখন ব্যবহার করবেন</th></tr>
<tr><td>Target Tracking</td><td>একটা metric-কে (যেমন CPU 50%) টার্গেট করে, CloudWatch alarm-এর মতো নিজেই সংখ্যা বাড়ায়/কমায়</td><td>সবচেয়ে সাধারণ, বেশিরভাগ ওয়েব ওয়ার্কলোডের জন্য default choice — "সেট করো, ভুলে যাও"</td></tr>
<tr><td>Step Scaling</td><td>একাধিক threshold-এর ধাপে ধাপে ভিন্ন পরিমাণ instance যোগ করে (যেমন CPU&gt;70% হলে +2, CPU&gt;90% হলে +5)</td><td>যখন ট্রাফিক স্পাইক অনির্দিষ্ট মাপের ও দ্রুত react করা লাগে, ধাপে ধাপে aggressive scaling চাই</td></tr>
<tr><td>Scheduled Scaling</td><td>নির্দিষ্ট সময়ে desired capacity সেট করে দেয়, কোনো metric দেখে না</td><td>predictable pattern — অফিস আওয়ারে বেশি ট্রাফিক, রাতে কম; sale event আগে থেকে জানা</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — একসাথে ব্যবহার করুন</span>
Target Tracking কে বেস policy রেখে, predictable peak-এর জন্য Scheduled Scaling যুক্ত করা খুবই কার্যকর — যেমন সকাল ৯টায় min capacity বাড়িয়ে দেওয়া, যাতে reactive scaling-এর অপেক্ষা না করে আগে থেকেই capacity রেডি থাকে (cold start-এর মতো নতুন instance বুট হতে সময় লাগে)।</div>

<h3>Lifecycle Hook — Terminate হওয়ার আগে সময় নেওয়া</h3>
<p>ASG যখন কোনো instance scale-in বা health check fail-এর কারণে টার্মিনেট করতে যায়, ডিফল্টে সেটা প্রায় তাৎক্ষণিক ঘটে। কিন্তু বাস্তবে instance-টার হয়তো এখনও in-flight request প্রসেস করছে, বা log/metric flush করা বাকি, বা কোনো cleanup script চালানো দরকার। <span class="kw">Lifecycle Hook</span> এই টার্মিনেশনকে সাময়িকভাবে "pause" করে রাখে (<code>Terminating:Wait</code> state), যতক্ষণ না আপনার script কাজ শেষ করে সিগন্যাল দেয়, বা টাইমআউট হয়ে যায়।</p>
<div class="diagram"><pre>
Scale-in ট্রিগার
    │
    ▼
Terminating:Wait  ──► SNS/EventBridge notification পাঠায়
    │                       │
    │                       ▼
    │                 Lambda/script: connection drain, log upload, cache flush
    │                       │
    │◄──────────────── CompleteLifecycleAction ──────┘
    ▼
Terminating:Proceed → Instance actually terminate হয়
</pre></div>
<div class="callout why"><span class="tag">কেন এটা দরকার — graceful shutdown vs hard kill</span>
ALB connection drain (deregistration delay) ইনকামিং ট্রাফিক বন্ধ করে, কিন্তু instance-এর ভেতরে চলা background job বা queue consumer সেটা জানে না। Lifecycle hook ছাড়া টার্মিনেশন মানে হুট করে process kill — যার ফলে half-processed message, corrupted upload, বা lost log হতে পারে। Hook দিয়ে আপনি নিশ্চিত করেন instance "সম্মানের সাথে" বিদায় নিচ্ছে।</div>

<h3>ALB + ASG একসাথে — সম্পূর্ণ চিত্র</h3>
<div class="diagram"><pre>
                         ┌─────────────────────┐
   Internet  ────────►   │   ALB (multi-AZ)     │
                         └──────────┬───────────┘
                                    │ health check + routing
                                    ▼
                         ┌─────────────────────┐
                         │   Target Group       │
                         └──────────┬───────────┘
                    ┌────────────────┼────────────────┐
                    ▼                ▼                ▼
              EC2 (AZ-1a)      EC2 (AZ-1b)       EC2 (AZ-1c)
                    ▲                ▲                ▲
                    └────────────────┴────────────────┘
                             Auto Scaling Group
                    (CPU 70% হলে +N instance স্পন করে,
                     নতুন instance বুট হলে নিজে Target Group-এ register হয়)
</pre></div>
<div class="callout behind"><span class="tag">গভীরে — নতুন instance কীভাবে ট্রাফিক পায়</span>
ASG যখন নতুন instance বানায়, সেটা Launch Template অনুযায়ী বুট হয়, তারপর ASG নিজে থেকেই তাকে সংশ্লিষ্ট Target Group-এ register করে দেয়। কিন্তু ALB সেই instance-কে তখনই ট্রাফিক পাঠায় না — প্রথমে health check pass করতে হয় (<code>Initial delay</code> + <code>Healthy threshold</code> সংখ্যক successful check)। তাই স্কেল-আউটের সময় সামান্য ল্যাগ থাকা স্বাভাবিক — এটা bug না, এটা safety mechanism যাতে half-booted instance ট্রাফিক না পায়।</div>

<h2 class="title">১০. Route 53 — DNS</h2>
<p class="lead">DNS হলো ইন্টারনেটের ফোনবুক — Route 53 হলো AWS-এর সেই ফোনবুক ম্যানেজ করার সার্ভিস, সাথে হেলথ-চেক ও স্মার্ট রাউটিং যুক্ত।</p>

<h3>DNS Resolution Flow — সংক্ষিপ্ত রিক্যাপ</h3>
<p>যখন ব্রাউজারে <code>example.com</code> লেখা হয়, সেই নামটাকে IP address-এ রূপান্তর করার জন্য কয়েকটা ধাপ অতিক্রম হয়:</p>
<div class="diagram"><pre>
Browser → Recursive Resolver (ISP/8.8.8.8)
              │
              ▼
        Root Nameserver ("." )         "com এর জন্য কোথায় যাব?"
              │
              ▼
        TLD Nameserver (.com)          "example.com এর জন্য কোথায় যাব?"
              │
              ▼
        Authoritative Nameserver       ─── এটাই Route 53 Hosted Zone
        (Route 53)
              │
              ▼
        উত্তর: 93.184.216.34 (A record)
              │
              ▼
        Browser এখন সরাসরি সেই IP-তে কানেক্ট করে
</pre></div>
<p>Route 53 এই চেইনের সবচেয়ে শেষ, সবচেয়ে গুরুত্বপূর্ণ স্টেপ — <span class="kw">Authoritative Nameserver</span> — যেটা আসলে সিদ্ধান্ত দেয় আপনার ডোমেইনের জন্য কোন IP ফেরত যাবে।</p>

<h3>Hosted Zone — Public vs Private</h3>
<table>
<tr><th>বিষয়</th><th>Public Hosted Zone</th><th>Private Hosted Zone</th></tr>
<tr><td>দৃশ্যমানতা</td><td>ইন্টারনেটে সবার কাছে resolve হয়</td><td>শুধু নির্দিষ্ট VPC(গুলো)-র ভেতর থেকে resolve হয়</td></tr>
<tr><td>Use case</td><td>পাবলিক ওয়েবসাইট, API</td><td>ইন্টারনাল সার্ভিস ডিসকভারি — যেমন <code>db.internal.company.com</code></td></tr>
<tr><td>Record একই নামে দুটোতেই</td><td>ভিন্ন উত্তর দিতে পারে — split-horizon DNS</td><td></td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — internal service নাম পাবলিকে ফাঁস করবেন না</span>
প্রোডাকশন ডেটাবেস বা internal microservice-এর hostname যদি public hosted zone-এ থাকে, সেটা attacker-এর জন্য reconnaissance তথ্য হয়ে যায় (subdomain enumeration attack)। Private Hosted Zone ব্যবহার করলে সেই নেমিং শুধু আপনার VPC-এর ভেতরেই resolve হয়, বাইরে থেকে কেউ query করেই পাবে না।</div>

<h3>Record Type</h3>
<table>
<tr><th>Record</th><th>কী resolve করে</th><th>মূল ব্যবহার</th></tr>
<tr><td>A</td><td>hostname → IPv4 address</td><td>সরাসরি সার্ভারের IP</td></tr>
<tr><td>CNAME</td><td>hostname → আরেকটা hostname</td><td>subdomain-কে অন্য domain-এ পয়েন্ট করা (যেমন <code>www</code> → <code>d123.cloudfront.net</code>)</td></tr>
<tr><td>Alias</td><td>hostname → AWS resource (ALB, CloudFront, S3, নিজেই আরেক Route 53 record)</td><td>zone apex-এ AWS resource পয়েন্ট করা, CNAME-এর AWS-নির্দিষ্ট উন্নত বিকল্প</td></tr>
<tr><td>MX</td><td>ডোমেইনের mail server</td><td>ইমেইল রাউটিং</td></tr>
<tr><td>TXT</td><td>arbitrary text</td><td>domain ownership verification, SPF/DKIM</td></tr>
<tr><td>NS</td><td>ডোমেইনের authoritative nameserver</td><td>delegation — কোন নেমসার্ভার এই zone-এর জন্য দায়ী তা জানানো</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Alias, CNAME-এর চেয়ে ভালো</span>
DNS প্রোটোকলের নিয়মেই <b>zone apex</b> (যেমন খালি <code>example.com</code>, subdomain ছাড়া) এ CNAME রাখা নিষেধ — apex-এ SOA/NS record থাকতে হয়, আর CNAME অন্য কোনো record টাইপের সাথে coexist করতে পারে না। AWS তাই Alias record বানিয়েছে, যা DNS লেভেলে A record-এর মতোই আচরণ করে (তাই apex-এ বসতে পারে) কিন্তু ভেতরে ভেতরে টার্গেট AWS resource-এর IP পরিবর্তন হলেও নিজে থেকেই আপডেট থাকে। এছাড়া Alias query করার জন্য Route 53 কোনো চার্জ নেয় না, যেখানে সাধারণ record query-তে চার্জ থাকে।</div>

<h3>Routing Policy</h3>
<table>
<tr><th>Policy</th><th>আচরণ</th><th>বাস্তব উদাহরণ</th></tr>
<tr><td>Simple</td><td>একটাই record, একটাই মান (একাধিক IP দিলে সব একসাথে র‍্যান্ডম ফেরত)</td><td>ছোট সাইট, একটাই সার্ভার</td></tr>
<tr><td>Weighted</td><td>শতাংশ অনুপাতে একাধিক টার্গেটে ট্রাফিক ভাগ করে</td><td>Canary deployment — নতুন ভার্সনে ৫% ট্রাফিক পাঠিয়ে টেস্ট করা</td></tr>
<tr><td>Latency-based</td><td>ইউজার যেখান থেকে query করছে, তার কাছে সবচেয়ে কম latency-র region-এ পাঠায়</td><td>একাধিক region-এ ডিপ্লয় করা global অ্যাপ, response time optimize করা</td></tr>
<tr><td>Failover</td><td>Primary healthy থাকলে সেখানেই পাঠায়, না হলে Secondary-তে সুইচ করে</td><td>Disaster recovery — primary region ডাউন হলে backup region সচল হওয়া</td></tr>
<tr><td>Geolocation</td><td>ইউজারের ভৌগোলিক অবস্থান (দেশ/মহাদেশ) অনুযায়ী রাউট করে</td><td>data residency compliance, দেশভিত্তিক কনটেন্ট/ভাষা সার্ভ করা</td></tr>
<tr><td>Multivalue Answer</td><td>একাধিক IP ফেরত দেয়, প্রতিটার সাথে ঐচ্ছিক health check</td><td>সাধারণ round-robin + health check, ছোট স্কেলে ALB-এর alternative</td></tr>
</table>

<h3>Health Check ও Failover Routing</h3>
<p>Route 53 Health Check নিয়মিত interval-এ একটা endpoint-এ (HTTP/HTTPS/TCP) request পাঠিয়ে যাচাই করে সেটা সাড়া দিচ্ছে কিনা। এই health check যখন Failover routing policy-র সাথে যুক্ত হয়, তখনই সত্যিকারের auto-DR কাজ করে।</p>
<div class="diagram"><pre>
                         ┌─── Health Check: OK ───► Primary Region (us-east-1)
User query ──► Route 53 │
                         └─── Health Check: FAIL ─► Secondary Region (ap-southeast-1)
</pre></div>
<div class="callout mistake"><span class="tag">Common mistake — health check ছাড়া Failover সেট করা</span>
Failover routing policy কনফিগার করলেও যদি সেই record-এর সাথে কোনো Health Check attach না থাকে, Route 53-এর জানার কোনো উপায় নেই primary সত্যিই ডাউন কিনা — ফলে outage-এর সময়ও ট্রাফিক ডেড primary-তেই যেতে থাকবে। Failover কাজ করার পূর্বশর্তই হলো health check।</div>

<h3>Domain Registration — সংক্ষেপে</h3>
<p>Route 53 নিজে একটা <span class="kw">Domain Registrar</span>-ও — মানে সরাসরি এখান থেকে নতুন ডোমেইন (যেমন <code>.com</code>, <code>.io</code>) কেনা যায়। ডোমেইন কেনার পর AWS নিজে থেকেই একটা Public Hosted Zone তৈরি করে দেয় এবং NS record-গুলো সঠিকভাবে সেট করে দেয়। বাইরের registrar (GoDaddy, Namecheap) থেকে কেনা ডোমেইনও Route 53-এ ব্যবহার করা যায় — শুধু সেই registrar-এ গিয়ে NS record-গুলো Route 53-এর দেওয়া নেমসার্ভারের দিকে পয়েন্ট করে দিতে হয় (delegation)।</p>
<div class="callout behind"><span class="tag">গভীরে — registrar আর DNS hosting আলাদা বিষয়</span>
Domain registration (কে ডোমেইনের মালিক, renewal) আর DNS hosting (কে record সার্ভ করে) — দুটো টেকনিক্যালি স্বতন্ত্র সার্ভিস, যদিও Route 53 দুটোই এক জায়গায় দেয়। এই কারণেই আপনি GoDaddy থেকে ডোমেইন কিনেও Route 53-কে তার DNS হিসেবে ব্যবহার করতে পারেন — শুধু registrar-এর কাছে NS record আপডেট করে "delegation" করে দিতে হয়।</div>

<h2 class="title">১১. CloudFront — CDN</h2>
<p class="lead">Origin সার্ভার পৃথিবীর এক কোণে বসে থাকলেও, CloudFront কনটেন্টকে ইউজারের কাছাকাছি নিয়ে যায় — এবং সেই সাথে origin-কেও প্রত্যক্ষ আক্রমণ থেকে আড়াল করে রাখে।</p>

<h3>CDN কেন প্রয়োজন — Latency-র সমস্যা</h3>
<p>ধরুন origin সার্ভার আছে <code>us-east-1</code>-এ, কিন্তু ইউজার বসে ঢাকায়। প্রতিটা request-কে আটলান্টিক-প্যাসিফিক পার হয়ে যেতে হলে network round-trip-এই কয়েকশ মিলিসেকেন্ড চলে যায়। <span class="kw">CDN (Content Delivery Network)</span> এই সমস্যার সমাধান করে বিশ্বজুড়ে ছড়িয়ে থাকা <span class="kw">Edge Location</span>-এ কনটেন্টের কপি রেখে — ইউজারের request origin পর্যন্ত না গিয়ে সবচেয়ে কাছের edge থেকেই সার্ভ হয়ে যায়।</p>
<div class="diagram"><pre>
User (Dhaka) ──► নিকটতম Edge Location (Singapore/Mumbai)
                        │
              ┌─────────┴─────────┐
              ▼                   ▼
        Cache HIT            Cache MISS
        (আগেই কপি আছে)      (origin থেকে আনতে হবে)
              │                   │
        সরাসরি রিটার্ন      Origin (us-east-1) ─► ফেরত ─► Edge-এ cache করে ─► User-কে দেয়
</pre></div>

<h3>Origin — S3 vs Custom Origin (ALB)</h3>
<table>
<tr><th>Origin Type</th><th>কী সার্ভ করে</th><th>বিশেষত্ব</th></tr>
<tr><td>S3 bucket</td><td>Static ফাইল — HTML, CSS, JS, ইমেজ, ভিডিও</td><td>OAC দিয়ে bucket পাবলিক না করেও serve করা যায়</td></tr>
<tr><td>ALB / Custom Origin (server)</td><td>Dynamic কনটেন্ট, API response</td><td>যেকোনো HTTP সার্ভার হতে পারে, এমনকি AWS-এর বাইরের ডোমেইনও</td></tr>
</table>

<h3>Cache Behavior ও TTL</h3>
<p>একটা distribution-এ path pattern অনুযায়ী আলাদা আলাদা <span class="kw">Cache Behavior</span> সেট করা যায় — যেমন <code>/images/*</code>-এর TTL অনেক বেশি রাখা, কিন্তু <code>/api/*</code> cache-ই না করা। <span class="kw">TTL (Time To Live)</span> নির্ধারণ করে edge-এ একটা object কতক্ষণ "সতেজ" ধরা হবে, তারপর ফের origin-এ গিয়ে যাচাই করে।</p>
<pre>Cache Behavior: /static/*
  Min TTL     = 86400   <span class="c">// অন্তত ১ দিন cache-এ থাকবে</span>
  Default TTL = 604800  <span class="c">// ৭ দিন</span>
  Max TTL     = 31536000

Cache Behavior: /api/*
  Cache Policy = CachingDisabled   <span class="c">// dynamic response, cache করা যাবে না</span></pre>
<div class="callout why"><span class="tag">কেন সব কিছু cache করা যায় না</span>
Cache শুধু তখনই নিরাপদ যখন একই request বারবার একই response ডিজার্ভ করে। ব্যক্তিগত ড্যাশবোর্ড বা লগইন-নির্ভর API response cache হলে একজনের ডেটা আরেকজনকে দেখিয়ে ফেলার ঝুঁকি থাকে — তাই dynamic/personalized কনটেন্টে Cache Policy সরাসরি disable রাখা হয়।</div>

<h3>Cache Invalidation — কেন "instant" না</h3>
<p>Origin-এ ফাইল বদলালেও edge location-এ থাকা পুরনো কপি TTL শেষ না হওয়া পর্যন্ত সার্ভ হতেই থাকে। <span class="kw">Invalidation</span> রিকোয়েস্ট দিয়ে জোর করে cache খালি করা যায়, কিন্তু এটা সব edge location-এ propagate হতে কিছুটা সময় নেয় — সত্যিকারের instant না, eventually consistent।</p>
<div class="callout mistake"><span class="tag">Common mistake — একই ফাইলনাম বারবার আপডেট করে invalidation-এর উপর নির্ভর করা</span>
<code>app.js</code> ফাইলটাই বারবার আপডেট করে প্রতিবার invalidation চালানো ব্যয়বহুল (invalidation-এর একটা ফ্রি quota পার হলে চার্জ লাগে) এবং সব edge-এ propagate হওয়ার আগে কিছু ইউজার পুরনো ভার্সনই পেয়ে যায়। সঠিক practice হলো <b>versioned file naming</b> — <code>app.a1b2c3.js</code>-এর মতো hash-ভিত্তিক নাম দেওয়া, যাতে নতুন ভার্সনের জন্য নতুন URL তৈরি হয় এবং পুরনো cache-এর সাথে কোনো conflict-ই না থাকে।</div>

<h3>OAC — কেন সরাসরি S3 পাবলিক করা উচিত না</h3>
<p><span class="kw">OAC (Origin Access Control)</span> হলো CloudFront আর S3-এর মধ্যে একটা signed handshake — এটা নিশ্চিত করে S3 bucket-এর কনটেন্ট শুধুমাত্র নির্দিষ্ট CloudFront distribution থেকেই আসতে পারবে, সরাসরি S3 URL দিয়ে কেউ অ্যাক্সেস করতে পারবে না। এটা পুরনো <span class="kw">OAI (Origin Access Identity)</span>-এর জায়গা নিয়েছে — OAI-তে SSE-KMS encrypted অবজেক্ট বা নির্দিষ্ট কিছু region সাপোর্ট করত না, OAC সেই সীমাবদ্ধতা দূর করেছে।</p>
<div class="callout best"><span class="tag">Best practice — bucket সবসময় private রাখুন, CloudFront-কেই একমাত্র দরজা বানান</span>
S3 bucket public করলে CloudFront বাইপাস করে সরাসরি S3 URL দিয়ে ফাইল অ্যাক্সেস সম্ভব হয়ে যায় — তখন cache-এর সুবিধা, access logging, geo-restriction, signed URL — সবকিছুই ফাঁকি দেওয়া যায়। Bucket policy-তে শুধু CloudFront-এর OAC-কে <code>GetObject</code> অনুমতি দিয়ে bucket-কে সম্পূর্ণ private রাখাই সঠিক architecture।</div>

<tr><th>বিষয়</th><th>Lambda@Edge</th><th>CloudFront Functions</th></tr>
<tr><td>Execution location</td><td>নিকটতম <b>regional edge cache</b> (সীমিত সংখ্যক লোকেশন)</td><td>সরাসরি <b>edge location</b>-এ (সবচেয়ে বেশি লোকেশনে চলে)</td></tr>
<tr><td>Runtime</td><td>Node.js/Python, পূর্ণ Lambda ক্ষমতা</td><td>শুধু হালকা JavaScript (ES5.1-ভিত্তিক সাবসেট)</td></tr>
<tr><td>Execution time limit</td><td>কয়েক সেকেন্ড পর্যন্ত (viewer request-এ ৫ms, origin request-এ ৩০s)</td><td>মাইক্রোসেকেন্ড লেভেল (&lt;১ms), অতি সীমিত</td></tr>
<tr><td>Use case</td><td>Origin response বদলানো, external API কল, complex logic</td><td>Header manipulation, URL rewrite, সাধারণ redirect, A/B testing bucket assign</td></tr>
</table>
<div class="callout behind"><span class="tag">গভীরে — কেন দুটো আলাদা প্রোডাক্ট আছে</span>
CloudFront Functions যতটা সম্ভব সীমিত ক্ষমতার বদলে extreme কম latency আর সস্তা খরচ পেয়েছে — এটা প্রতিটা সিঙ্গেল edge location-এ চলতে পারে কারণ এর memory/execution footprint নগণ্য। Lambda@Edge পূর্ণ Node.js/Python runtime চালায় বলে ভারী, তাই সেটা প্রতিটা ক্ষুদ্র edge-এ না রেখে কিছু নির্বাচিত "Regional Edge Cache"-এ রাখা হয় — সহজ কাজে Functions ব্যবহার করাই সঠিক, ভারী লজিকেই Lambda@Edge লাগে।</div>

<template data-page="lambda">
<h2 class="title">১২. Lambda ও Serverless</h2>
<p class="lead">সার্ভার প্রভিশন, প্যাচ, স্কেল করার দায়িত্ব থেকে মুক্তি — কোড লিখুন, চালান, শুধু ব্যবহারের জন্যই পে করুন। এই মডেলটাই Serverless-এর আসল আকর্ষণ, আর Lambda তার কেন্দ্রবিন্দু।</p>

<h3>Function Anatomy — Handler, Event, Context</h3>
<p>প্রতিটা Lambda function-এর একটা <span class="kw">handler</span> থাকে — এটাই entry point, যেটা AWS ইনভোক করে যখন কোনো trigger ঘটে। এটা দুটো প্যারামিটার পায়: <span class="kw">event</span> (যে ডেটা দিয়ে function ট্রিগার হলো — S3 file info, HTTP request body, ইত্যাদি) আর <span class="kw">context</span> (রানটাইম সম্পর্কে তথ্য — কত সময় বাকি, request ID, memory limit)।</p>
<pre>exports.handler = async (event, context) =&gt; {
    console.log("Remaining time:", context.getRemainingTimeInMillis());
    const userId = event.pathParameters.id;   <span class="c">// API Gateway থেকে আসা event</span>

    return {
        statusCode: 200,
        body: JSON.stringify({ message: `Hello ${userId}` })
    };
};</pre>

<h3>Trigger উৎস — সংক্ষিপ্ত তালিকা</h3>
<ul>
<li><b>S3</b> — নতুন ফাইল আপলোড হলে (object created/deleted)</li>
<li><b>API Gateway</b> — HTTP request এলে (REST/HTTP API)</li>
<li><b>EventBridge</b> — নির্ধারিত সময়ে (cron) বা কোনো event pattern মিললে</li>
<li><b>SQS</b> — কিউতে message এলে</li>
<li><b>DynamoDB Streams</b> — টেবিলে item change হলে</li>
<li><b>SNS</b> — টপিকে message publish হলে</li>
</ul>

<h3>Execution Role — Lambda-র নিজের IAM লাগে কেন</h3>
<p>Lambda function কোড হিসেবে "নিষ্ক্রিয়" — যতক্ষণ না সেটা চলে, সে কোনো AWS resource স্পর্শই করতে পারে না। যখন চলে, তখন সে অন্য কোনো সার্ভিস (S3, DynamoDB, ইত্যাদি) কল করতে চাইলে তার নিজস্ব পরিচয় ও অনুমতি লাগে — সেটাই <span class="kw">Execution Role</span>, একটা IAM Role যা function-এর সাথে attach থাকে।</p>
<div class="callout why"><span class="tag">কেন এটা compute instance থেকে আলাদা ভাবতে হয়</span>
EC2-এ role attach করলে পুরো instance-এ চলা সব প্রসেস সেই permission পায়। Lambda-তে প্রতিটা function তার নিজের role রাখতে পারে বলে — একই অ্যাকাউন্টের ১০টা function থাকলেও প্রতিটার permission আলাদা আলাদা ভাবে সংকুচিত (least privilege) রাখা সহজ। একটা compromised function অন্য function-এর resource ছুঁতে পারে না, যদি role আলাদা রাখা হয়।</div>
<div class="callout mistake"><span class="tag">Common mistake — সব function-এ একই বিশাল role শেয়ার করা</span>
সুবিধার জন্য একটা "AdminAccess"-জাতীয় role সব Lambda-তে ব্যবহার করলে, একটা function-এর কোডে bug বা injection থাকলেও সে পুরো অ্যাকাউন্টের উপর ক্ষমতা পেয়ে যায়। প্রতিটা function-এর role-এ ঠিক ততটুকু permission দিন যতটুকু তার কাজের জন্য প্রয়োজন।</div>

<h3>Cold Start — কী এবং কেন হয়</h3>
<p>Lambda request না এলে কোনো compute বরাদ্দ রাখে না — request এলেই একটা নতুন <span class="kw">Execution Environment</span> (এক ধরনের lightweight sandbox/container) প্রভিশন করা হয়, কোড ডাউনলোড হয়, runtime বুট হয়, তারপরই handler চলে। এই পুরো প্রভিশনিং সময়টাই <span class="kw">Cold Start</span> — কয়েকশ মিলিসেকেন্ড থেকে কয়েক সেকেন্ড পর্যন্ত লাগতে পারে (runtime, package size, VPC attach থাকলে আরও বেশি)।</p>
<div class="diagram"><pre>
প্রথম request  ──► [Cold Start: environment বানানো + runtime init] ──► handler চলে ──► response
                                    (কয়েকশ ms – কয়েক সেকেন্ড)

দ্বিতীয় request (দ্রুত পরপর) ──► [পুরনো environment reuse — Warm] ──► handler চলে ──► response
                                        (কয়েক ms)
</pre></div>
<div class="callout behind"><span class="tag">গভীরে — কেন warm invocation দ্রুত</span>
Environment একবার তৈরি হয়ে গেলে AWS সেটা কিছুক্ষণ (সাধারণত মিনিট কয়েক নিষ্ক্রিয় থাকার পরও) ধরে রাখে, যাতে পরের request একই environment reuse করতে পারে — runtime বুট আর করতে হয় না, শুধু handler কল হয়। ট্রাফিক পর্যাপ্ত ধারাবাহিক থাকলে বেশিরভাগ request-ই "warm" হিসেবে সার্ভ হয়, cold start শুধু নতুন স্পাইক বা দীর্ঘ নিষ্ক্রিয়তার পরেই দেখা যায়।</div>

<h3>Provisioned Concurrency vs Reserved Concurrency</h3>
<table>
<tr><th>বিষয়</th><th>Provisioned Concurrency</th><th>Reserved Concurrency</th></tr>
<tr><td>মূল উদ্দেশ্য</td><td>Cold start এড়ানো — environment আগে থেকেই "গরম" রাখা</td><td>Concurrency-র একটা সীমা (upper bound) বেঁধে দেওয়া বা নির্দিষ্ট পরিমাণ guarantee করা</td></tr>
<tr><td>প্রভাব</td><td>কল হওয়ার আগেই N সংখ্যক environment রেডি রাখে</td><td>এই function সর্বোচ্চ N-এর বেশি concurrent instance চালাতে পারবে না</td></tr>
<tr><td>খরচ</td><td>রেডি রাখা environment-এর জন্য এক্সট্রা চার্জ, সবসময় চলে (idle থাকলেও)</td><td>নিজে থেকে এক্সট্রা চার্জ নেই, শুধু capacity বেঁধে দেয়</td></tr>
<tr><td>কখন ব্যবহার</td><td>Latency-sensitive API যেখানে cold start অগ্রহণযোগ্য</td><td>Downstream সিস্টেম (যেমন DB) overload ঠেকাতে, বা অন্য function-এর জন্য concurrency বাঁচিয়ে রাখতে</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — দুটোকে একই জিনিস ভাবা</span>
Reserved Concurrency শুধু একটা "সিলিং" — এটা cold start কমায় না, বরং উল্টো যদি সিলিং কম রাখা হয় আর ট্রাফিক বেড়ে যায়, তাহলে request throttle (রিজেক্ট) হতে শুরু করে। Cold start কমাতে হলে Provisioned Concurrency লাগবেই — দুটো সম্পূর্ণ ভিন্ন সমস্যার সমাধান করে।</div>

<h3>Memory ও Timeout — Trade-off</h3>
<p>Lambda-তে memory বাড়ালে CPU ক্ষমতাও proportionally বাড়ে — কারণ AWS memory allocation-এর সাথে CPU/network bandwidth সমানুপাতিকভাবে বরাদ্দ করে, এগুলো আলাদা করে সেট করার সুযোগ নেই। ফলে অনেক সময় memory বাড়িয়ে দিলে function দ্রুত শেষ হয় ও প্রকৃত বিল কমে যায় (কম সময় × বেশি রেট, বনাম বেশি সময় × কম রেট)।</p>
<table>
<tr><th>Memory</th><th>প্রায় সমানুপাতিক CPU</th><th>প্রভাব</th></tr>
<tr><td>128 MB</td><td>সবচেয়ে কম</td><td>CPU-bound কাজে (image resize, JSON parse বড় ডেটা) ধীর</td></tr>
<tr><td>1769 MB</td><td>প্রায় ১টা full vCPU</td><td>এই পয়েন্ট থেকে multi-thread কাজের সুবিধা পাওয়া শুরু হয়</td></tr>
<tr><td>10240 MB (max)</td><td>একাধিক vCPU</td><td>parallelizable heavy compute-এ কার্যকর</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — memory টিউন করে দেখুন, শুধু বাড়িয়ে যাবেন না</span>
সবসময় memory বাড়ানোই সমাধান না — I/O-bound function (যেমন শুধু একটা API কল করে অপেক্ষা করা) মেমরি বাড়ালেও দ্রুত হবে না, কারণ সমস্যা CPU-তে না, network wait-এ। AWS Lambda Power Tuning-এর মতো টুল দিয়ে আসল bottleneck বুঝে memory সেট করা উচিত।</div>

<h3>Layers — শেয়ার্ড কোড/ডিপেন্ডেন্সি</h3>
<p><span class="kw">Layer</span> হলো একটা ZIP প্যাকেজ (লাইব্রেরি, SDK, বা shared utility কোড) যা একাধিক Lambda function একসাথে ব্যবহার করতে পারে, প্রতিটার deployment package-এ আলাদা করে বান্ডেল না করে। এটা deployment package ছোট রাখে ও একই dependency বারবার আপলোড করা এড়ায়।</p>

<h3>Event Source Mapping — SQS/DynamoDB Streams Polling</h3>
<p>SQS বা DynamoDB Streams নিজে থেকে Lambda-কে push করে ডাকতে পারে না (এরা "poll-based" সোর্স) — তাই AWS-এর একটা ইন্টারনাল পোলার (<span class="kw">Event Source Mapping</span>) নিয়মিতভাবে কিউ/স্ট্রিম চেক করে, ব্যাচ আকারে মেসেজ জমা করে, তারপর Lambda-কে সেই ব্যাচ দিয়ে ইনভোক করে।</p>
<div class="diagram"><pre>
SQS Queue ──► Event Source Mapping (polls every few seconds)
                       │
                 batch size = 10 (default), max 10,000
                       │
                       ▼
                Lambda invoke(batch of messages)
                       │
              সব সফল হলে ──► SQS থেকে মেসেজ delete
              partial fail ──► শুধু ফেল করা মেসেজ queue-এ থেকে যায়
</pre></div>
<div class="callout why"><span class="tag">কেন Batch Size গুরুত্বপূর্ণ</span>
বড় batch size মানে কম Lambda invocation (খরচ কম, throughput বেশি), কিন্তু একটা মেসেজ প্রসেস করতে fail করলে পুরো ব্যাচ retry হওয়ার ঝুঁকি থাকে (যদি partial batch failure রিপোর্টিং ঠিকমতো কনফিগার না করা থাকে) — একটা খারাপ মেসেজ পুরো ব্যাচকে বারবার আটকে দিতে পারে ("poison pill")। এই কারণেই DLQ (Dead Letter Queue) সেট করা ও batch size বুঝে ঠিক করা জরুরি।</div>

<h3>Step Functions — যখন একটা Lambda যথেষ্ট না</h3>
<p>একটা single Lambda function ভালো একটা কাজের জন্য, কিন্তু বাস্তব ওয়ার্কফ্লো প্রায়ই একাধিক ধাপ, condition, retry, এবং parallel branch নিয়ে গঠিত — যেমন "অর্ডার confirm → payment charge → inventory update → email পাঠানো, আর কোনো ধাপ fail করলে rollback করা"। এই ধরনের orchestration নিজের কোডে হার্ডকোড করলে জটিল আর fragile হয়ে যায়। <span class="kw">Step Functions</span> এই ধরনের multi-step workflow-কে একটা visual state machine হিসেবে define করতে দেয়, যেখানে প্রতিটা state আলাদা একটা Lambda (বা অন্য সার্ভিস) কল করতে পারে, আর retry/error handling built-in থাকে।</p>

<h3>Serverless Architecture Pattern — একটা ছোট উদাহরণ</h3>
<div class="diagram"><pre>
Client ──► API Gateway ──► Lambda (business logic) ──► DynamoDB
              │                    │
        request validation   execution role দিয়ে DynamoDB-তে
        ও throttling         GetItem/PutItem অনুমতি
</pre></div>
<p>এই প্যাটার্নে কোনো সার্ভার প্রভিশন করা লাগেনি — API Gateway ট্রাফিক গ্রহণ করে, Lambda শুধু ট্রিগার হওয়ার সময়টুকু চলে, DynamoDB নিজে থেকেই স্কেল করে। পুরো সিস্টেম idle অবস্থায় প্রায় শূন্য খরচে বসে থাকে, আর ট্রাফিক বাড়লে নিজে থেকেই স্কেল করে — এটাই serverless-এর মূল প্রতিশ্রুতি।</p>
</template>

<template data-page="apigateway">
<h2 class="title">১৩. API Gateway</h2>
<p class="lead"><span class="kw">API Gateway</span> হলো AWS-এর ম্যানেজড সার্ভিস যা client আর backend (Lambda, EC2, অন্য কোনো HTTP endpoint)-এর মাঝে একটা front door তৈরি করে — routing, auth, throttling, monitoring সব একজায়গায় হ্যান্ডেল হয়, backend কোড এসব নিয়ে ভাবেই না।</p>

<h3>REST API vs HTTP API vs WebSocket API</h3>
<p>API Gateway তিন ধরনের API সাপোর্ট করে, প্রতিটার আলাদা use-case। নতুন প্রজেক্টে সাধারণত <span class="kw">HTTP API</span> ডিফল্ট চয়েস হয়ে দাঁড়িয়েছে কারণ এটা REST API-এর প্রায় সব কমন ফিচার দেয় কিন্তু অনেক কম latency ও অনেক কম দামে।</p>
<table>
<tr><th>ফিচার</th><th>REST API</th><th>HTTP API</th><th>WebSocket API</th></tr>
<tr><td>প্রধান ব্যবহার</td><td>পুরনো/জটিল ফিচার প্রয়োজন হলে</td><td>সাধারণ REST backend (default choice)</td><td>bidirectional realtime যোগাযোগ</td></tr>
<tr><td>Latency</td><td>বেশি (extra processing layer)</td><td>কম (~৫০-৭০% কম)</td><td>persistent connection ভিত্তিক</td></tr>
<tr><td>দাম</td><td>বেশি</td><td>প্রায় ৭০% কম</td><td>connection minute + message ভিত্তিক</td></tr>
<tr><td>Authorizer সাপোর্ট</td><td>IAM, Cognito, Lambda</td><td>IAM, JWT (Cognito/OIDC), Lambda</td><td>IAM, Lambda</td></tr>
<tr><td>Usage Plan/API Key</td><td>আছে</td><td>নেই</td><td>নেই</td></tr>
<tr><td>Request Validation</td><td>বিল্ট-ইন schema validation</td><td>সীমিত</td><td>N/A</td></tr>
<tr><td>Private Integration (VPC Link)</td><td>আছে</td><td>আছে</td><td>নেই</td></tr>
</table>
<div class="callout why"><span class="tag">কেন HTTP API নতুন প্রজেক্টে বেশি recommend করা হয়</span>
REST API আসলে অনেক পুরনো এবং প্রতিটা request-এ extra feature-set (WAF integration, request validation, usage plans) চেক করার জন্য বাড়তি processing layer পার হয়ে যায়। HTTP API এই অপ্রয়োজনীয় layer-গুলো বাদ দিয়ে একটা lean, optimized path তৈরি করেছে — তাই যদি আপনার Usage Plan/API Key বা request validation লাগে না, HTTP API-ই যুক্তিসঙ্গত।</div>

<h3>Stage ও Deployment</h3>
<p>API Gateway-তে একটা API-র কনফিগারেশন লেখা মাত্রই live হয় না — সেটা একটা <span class="kw">Deployment</span> হিসেবে "স্ন্যাপশট" নেওয়া হয়, তারপর সেই deployment একটা <span class="kw">Stage</span>-এ (যেমন <code>dev</code>, <code>staging</code>, <code>prod</code>) publish করতে হয়। প্রতিটা stage-এর নিজের URL, নিজের throttling limit, নিজের stage variable থাকে।</p>
<div class="diagram"><pre>
 API Definition (routes, integrations)
          │
          ▼
      Deployment  (immutable snapshot)
          │
   ┌──────┼───────────┐
   ▼      ▼           ▼
 Stage:dev  Stage:staging  Stage:prod
 /dev/...   /staging/...   /prod/...
 (আলাদা throttle, আলাদা stage variable)
</pre></div>
<div class="callout why"><span class="tag">কেন একটা API একাধিক stage-এ deploy হয়</span>
Stage আলাদা না থাকলে dev-এ টেস্ট করা একটা ভাঙা রুট সরাসরি prod ট্রাফিক প্রভাবিত করতে পারত। Stage আলাদা থাকায় একই API definition-এর ওপর ভিত্তি করে dev, staging, prod আলাদা lifecycle-এ চলতে পারে, এবং stage variable ব্যবহার করে প্রতিটা stage আলাদা Lambda alias বা backend endpoint-এ পয়েন্ট করতে পারে — কোড ডুপ্লিকেট না করেই।</div>

<h3>Integration Type</h3>
<p>API Gateway route-কে backend-এর সাথে কীভাবে সংযুক্ত করবে, সেটা নির্ধারণ করে <span class="kw">Integration Type</span>।</p>
<div class="diagram"><pre>
Client Request
     │
     ▼
[API Gateway Route]
     │
     ├── Lambda Proxy ─────► পুরো request (headers, body, query) event
     │                       হিসেবে Lambda-এ যায়, response ফরম্যাটও
     │                       Lambda নিজে বানায়
     │
     ├── HTTP Proxy ───────► request প্রায় পুরোপুরি backend HTTP
     │                       endpoint-এ forward হয় (EC2, ALB, external API)
     │
     └── Mock ─────────────► API Gateway নিজেই response বানিয়ে দেয়,
                              কোনো backend call হয়ই না (health-check/স্টাব)
</pre></div>
<div class="callout behind"><span class="tag">Lambda Proxy vs Lambda Custom Integration</span>
Lambda Proxy integration-এ পুরো HTTP request একটা fixed schema-তে (event object) Lambda-কে দেওয়া হয় এবং response-ও একটা fixed schema মেনে ফেরত দিতে হয় (statusCode, headers, body)। Custom integration-এ আপনি নিজে request/response mapping template লিখে transform করতে পারেন — flexible কিন্তু maintain করা কঠিন, তাই প্রায় সবাই Proxy integration-ই ব্যবহার করে।</div>

<h3>Authorizer — কখন কোনটা</h3>
<table>
<tr><th>Authorizer টাইপ</th><th>কাজ করে কীভাবে</th><th>কখন ব্যবহার</th></tr>
<tr><td>IAM Authorization</td><td>SigV4 signed request, IAM policy চেক করে</td><td>service-to-service call, AWS-এর ভেতরে অন্য সার্ভিস থেকে</td></tr>
<tr><td>Cognito User Pool Authorizer</td><td>JWT token verify করে সরাসরি API Gateway-তে (কোনো Lambda লাগে না)</td><td>মোবাইল/ওয়েব অ্যাপের end-user login, standard OAuth flow</td></tr>
<tr><td>Lambda Custom Authorizer</td><td>আপনার নিজের Lambda function token/header যাচাই করে policy রিটার্ন করে</td><td>কাস্টম auth logic, তৃতীয় পক্ষের auth সিস্টেম, বা multi-factor বিজনেস রুল</td></tr>
</table>
<div class="callout best"><span class="tag">Best practice — Authorizer response cache করুন</span>
Lambda Custom Authorizer প্রতিটা রিকোয়েস্টে চালানো ব্যয়বহুল এবং latency বাড়ায়। API Gateway-তে authorizer result একটা TTL (সাধারণত ৩০০ সেকেন্ড) পর্যন্ত cache করার অপশন আছে — same token দিয়ে বারবার call করলে Lambda re-invoke হয় না।</div>

<h3>Cognito — User Pool vs Identity Pool</h3>
<p><span class="kw">Amazon Cognito</span>-র দুটো অংশ প্রায়ই গুলিয়ে যায়, কিন্তু তারা সম্পূর্ণ ভিন্ন দুটো সমস্যার সমাধান করে।</p>
<table>
<tr><th></th><th>User Pool</th><th>Identity Pool</th></tr>
<tr><td>সমস্যা সমাধান করে</td><td><b>AuthN</b> — user sign-up/sign-in, password reset, MFA</td><td><b>AuthZ to AWS</b> — লগইন করা user-কে সরাসরি AWS resource access দেওয়া</td></tr>
<tr><td>আউটপুট</td><td>JWT token (ID token, access token)</td><td>Temporary AWS credential (STS-এর মাধ্যমে)</td></tr>
<tr><td>ব্যবহার</td><td>API Gateway Authorizer — এই JWT verify করেই request authorize হয়</td><td>মোবাইল app সরাসরি S3-এ ফাইল আপলোড করবে, backend API না ছুঁয়ে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন দুটো আলাদা — Authentication বনাম AWS Access</span>
User Pool শুধু নিশ্চিত করে "এই ব্যক্তি সত্যিই যা দাবি করছে সে-ই" — এটা একটা independent identity provider, AWS resource-এর সাথে সরাসরি সম্পর্ক নেই। কিন্তু অনেক mobile/web app-এর প্রয়োজন হয় লগইন করা user-কে সরাসরি একটা AWS resource-এ (যেমন S3) সীমিত অ্যাক্সেস দেওয়া, backend API-কে মাঝখানে না রেখেই। Identity Pool এই ফাঁকটা পূরণ করে — এটা User Pool (বা Google/Facebook-এর মতো অন্য identity provider)-এর token নিয়ে, IAM Role-এর সাথে map করে, STS থেকে সাময়িক AWS credential ইস্যু করে দেয়। এই দুই ধাপ (প্রথমে "কে তুমি", তারপর "AWS-এ কী করতে পারবে") আলাদা রাখাই Cognito-র ডিজাইনের মূল কারণ।</div>

<h3>Throttling ও Usage Plan / API Key</h3>
<p>API Gateway-তে দুই লেভেলে throttling হয় — account-level default limit এবং stage/method-level কাস্টম limit। এছাড়া <span class="kw">Usage Plan</span> দিয়ে নির্দিষ্ট <span class="kw">API Key</span>-ভিত্তিক client-কে rate limit ও quota (দৈনিক/মাসিক request সংখ্যা) বেঁধে দেওয়া যায়।</p>
<div class="callout why"><span class="tag">কেন rate limiting প্রয়োজন</span>
Throttling ছাড়া একটা buggy client বা malicious actor আপনার backend-কে (এবং downstream Lambda/DB-কে) overload করে ফেলতে পারে — এটা শুধু availability সমস্যা না, বরং cost সমস্যাও, কারণ প্রতিটা extra invocation বিল বাড়ায়। Usage Plan দিয়ে প্রতিটা client/partner-কে আলাদা quota দেওয়া মানে একজনের abuse অন্যজনের সার্ভিস ডাউন করতে পারবে না।</div>
<div class="callout mistake"><span class="tag">Common mistake — API Key-কে security mechanism ভাবা</span>
API Key মূলত usage tracking আর throttling-এর জন্য, এটা authentication নয়। API Key URL/query string বা header-এ readable থাকে এবং সহজেই লিক হতে পারে। প্রকৃত security-এর জন্য IAM, Cognito, বা Lambda Authorizer দরকার — API Key তার বদলি নয়।</div>

<h3>CORS</h3>
<p>ব্রাউজার থেকে সরাসরি কোনো ভিন্ন origin-এর API কল করলে ব্রাউজার একটা <span class="kw">preflight request</span> (OPTIONS method) পাঠায় — এটাই <span class="kw">CORS</span> (Cross-Origin Resource Sharing) এর মূল কারণ যা প্রায়ই developer-দের বিভ্রান্ত করে।</p>
<div class="diagram"><pre>
Browser (origin: https://app.example.com)
   │
   │ 1. OPTIONS /users  (preflight — ব্রাউজার নিজেই পাঠায়)
   ▼
API Gateway  ──► Access-Control-Allow-Origin: https://app.example.com
                 Access-Control-Allow-Methods: GET, POST
                 Access-Control-Allow-Headers: Content-Type, Authorization
   │
   │ 2. যদি headers মিলে যায় → actual GET/POST request পাঠায়
   ▼
API Gateway → Lambda → Response (এই response-এও CORS header লাগবে!)
</pre></div>
<div class="callout why"><span class="tag">কেন এটা প্রায়ই confusion তৈরি করে</span>
CORS পুরোপুরি ব্রাউজার-সাইড সিকিউরিটি ফিচার — সার্ভার নিজে কখনো ব্লক করে না, ব্রাউজার-ই response দেখে ঠিক করে জাভাস্ক্রিপ্টকে সেই response পড়তে দেবে কি না। তাই Postman বা curl দিয়ে কল করলে CORS error আসেই না, কিন্তু ব্রাউজার থেকে আসে — অনেকে ভুলভাবে ভাবে backend ভাঙা। এছাড়া preflight OPTIONS request এবং actual request দুটোতেই আলাদাভাবে সঠিক CORS header দরকার — actual response-এ header ভুলে গেলেও ব্রাউজার request ব্লক করে দেবে, যদিও Lambda সফলভাবে চলেছে।</div>
<div class="callout mistake"><span class="tag">Common mistake — Lambda Proxy integration-এ CORS header ভুলে যাওয়া</span>
Lambda Proxy ব্যবহার করলে API Gateway কনসোলের "Enable CORS" বাটন OPTIONS method বানিয়ে দেয়, কিন্তু actual GET/POST response-এর <code>Access-Control-Allow-Origin</code> header Lambda কোডেই সেট করতে হয় — কারণ response Lambda বানাচ্ছে, API Gateway নয়। এটা ভুলে গেলে preflight পাস হলেও actual call ব্রাউজারে ব্লক হয়ে যায়।</div>
</template>

<template data-page="messaging">
<h2 class="title">১৪. SQS, SNS ও EventBridge</h2>
<p class="lead">Distributed system-এ সার্ভিসগুলোকে সরাসরি একে অপরকে synchronously কল করানোর বদলে <span class="kw">messaging</span>-এর মাধ্যমে decouple করা হয় — এতে একটা সার্ভিস ডাউন থাকলেও পুরো সিস্টেম আটকে যায় না। AWS-এ এই কাজের জন্য তিনটা মূল টুল: SQS (queue), SNS (pub-sub), EventBridge (event bus)।</p>

<h3>SQS Standard vs FIFO</h3>
<table>
<tr><th>বৈশিষ্ট্য</th><th>Standard Queue</th><th>FIFO Queue</th></tr>
<tr><td>Ordering</td><td>guarantee নেই (best-effort)</td><td>strict order গ্যারান্টিড (per Message Group)</td></tr>
<tr><td>Delivery</td><td>at-least-once (duplicate হতে পারে)</td><td>exactly-once processing (dedup-এর মাধ্যমে)</td></tr>
<tr><td>Throughput</td><td>virtually unlimited</td><td>৩০০ msg/sec (batch-এ ৩০০০), high-throughput mode-এ বেশি</td></tr>
<tr><td>Deduplication</td><td>নেই</td><td>৫ মিনিট deduplication window (content-based বা explicit ID)</td></tr>
<tr><td>Naming</td><td>যেকোনো নাম</td><td>নামের শেষে <code>.fifo</code> বাধ্যতামূলক</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Standard queue duplicate তৈরি করতে পারে</span>
SQS ডিস্ট্রিবিউটেড আর্কিটেকচারে একই message একাধিক সার্ভারে replicate হয়ে থাকে availability-এর জন্য। Standard queue speed ও scalability-কে priority দেয়, তাই strict dedup checking বা ordering enforce করে না — এই ট্রেড-অফের ফলে consumer কোডকে অবশ্যই idempotent হতে হয়।</div>

<h3>Visibility Timeout</h3>
<p>একটা consumer message receive করলে সেই message queue থেকে ডিলিট হয় না — বরং একটা <span class="kw">Visibility Timeout</span> পিরিয়ডের জন্য অন্য consumer-দের কাছে "invisible" হয়ে যায়, যতক্ষণ না consumer explicitly delete করে।</p>
<div class="diagram"><pre>
Consumer A ── ReceiveMessage ──► [Msg #1 এখন invisible, Timeout=30s শুরু]
                                        │
                     (Consumer A প্রসেস করছে...)
                                        │
      ┌─────────────────────────────────┴─────────────────────┐
      │ যদি ৩০s এর মধ্যে DeleteMessage কল হয়        │ যদি না হয় (crash/slow)
      ▼                                              ▼
  Message permanently deleted               Msg #1 আবার visible →
                                             Consumer B পুনরায় receive করবে
</pre></div>
<div class="callout why"><span class="tag">কেন Visibility Timeout প্রয়োজন</span>
কোনো global lock ছাড়া distributed queue-তে একই message দুইজন consumer একসাথে তুলে ফেললে duplicate processing হয়ে যেত। Visibility Timeout একটা "lease" এর মতো কাজ করে — একজন consumer কাজ করার সময় বাকিদের সেই message দেখতেই দেয় না। কিন্তু consumer যদি crash করে বা timeout-এর চেয়ে বেশি সময় নেয়, timeout শেষে message আবার queue-তে visible হয়ে যায় যাতে অন্য consumer সেটা পিক করতে পারে — at-least-once delivery এখানেই আসে।</div>
<div class="callout mistake"><span class="tag">Common mistake — Visibility Timeout খুব কম রাখা</span>
প্রসেসিং টাইমের চেয়ে কম timeout রাখলে একই message process চলা অবস্থায়ই আবার visible হয়ে যায় এবং দ্বিতীয় consumer একই কাজ শুরু করে দেয় — duplicate side-effect (যেমন দুইবার ইমেইল পাঠানো)। নিয়ম: Visibility Timeout = গড় প্রসেসিং টাইমের কমপক্ষে ৬ গুণ।</div>

<h3>Dead Letter Queue (DLQ)</h3>
<p>কোনো message যদি বারবার প্রসেস ফেইল করে (<span class="kw">poison message</span>), সেটা মূল queue-তে infinite loop-এ আটকে থাকার বদলে একটা নির্ধারিত সংখ্যক (<code>maxReceiveCount</code>) চেষ্টার পর একটা আলাদা <span class="kw">Dead Letter Queue</span>-এ চলে যায়।</p>
<pre>{
  "RedrivePolicy": {
    "deadLetterTargetArn": "arn:aws:sqs:ap-southeast-1:123456789012:orders-dlq",
    "maxReceiveCount": "5"
  }
}</pre>
<div class="callout why"><span class="tag">কেন DLQ প্রয়োজন — poison message ঠেকানো</span>
কোনো message-এর ডেটা যদি malformed হয় বা কোনো downstream বাগের কারণে প্রসেসিং সবসময় exception ছুঁড়ে, ওই message বারবার visible হয়ে আবার receive হতে থাকবে — অন্য valid message-গুলোর প্রসেসিং স্লো করে দেবে এবং invocation cost বাড়াবে। DLQ সেই message-কে quarantine করে রাখে, যাতে টিম আলাদাভাবে ডিবাগ করতে পারে এবং মূল queue স্বাভাবিক গতিতে বাকি কাজ চালাতে পারে।</div>
<div class="callout best"><span class="tag">Best practice — DLQ-তে CloudWatch alarm রাখুন</span>
DLQ-তে message আসা মানে কিছু ভুল হচ্ছে — <code>ApproximateNumberOfMessagesVisible</code> মেট্রিকের ওপর alarm সেট করে টিমকে সাথে সাথে জানানো উচিত, নাহলে DLQ silently ভরে যাবে এবং কেউ খেয়ালই করবে না।</div>

<h3>Long Polling vs Short Polling</h3>
<table>
<tr><th></th><th>Short Polling</th><th>Long Polling</th></tr>
<tr><td>আচরণ</td><td>queue-তে message না থাকলেও তাৎক্ষণিক empty response</td><td>message না থাকলে সর্বোচ্চ ২০ সেকেন্ড wait করে</td></tr>
<tr><td>API কল সংখ্যা</td><td>বেশি (বারবার poll করতে হয়)</td><td>কম</td></tr>
<tr><td>Cost</td><td>বেশি (প্রতি request-এর দাম আছে)</td><td>কম</td></tr>
<tr><td>কনফিগার</td><td><code>WaitTimeSeconds=0</code></td><td><code>WaitTimeSeconds</code> ১-২০ সেট করলে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Long Polling সাধারণত ভালো</span>
Short polling-এ যদি queue খালি থাকে, তাও একটা empty response তৈরি হয় এবং সেই API call-এর জন্য বিল হয় — অপ্রয়োজনীয় খরচ। Long polling request-কে queue-তে message আসা পর্যন্ত (বা টাইমআউট পর্যন্ত) খোলা রাখে, তাই একই latency-তে অনেক কম API call লাগে। AWS SDK ডিফল্টে long polling ব্যবহার করে।</div>

<h3>SNS — Topic, Subscription ও Fan-out</h3>
<p><span class="kw">SNS</span> হলো pub-sub মডেল — একটা <span class="kw">Topic</span>-এ message পাবলিশ করলে সেই topic-এ subscribe করা সব endpoint (SQS queue, Lambda, HTTP, email, SMS) একসাথে message পায়। এটাই <span class="kw">Fan-out pattern</span>।</p>
<div class="diagram"><pre>
                         ┌──► SQS Queue (Billing Service)
                         │
Publisher ──► SNS Topic ─┼──► SQS Queue (Analytics Service)
                         │
                         └──► Lambda (Notification Service)
</pre></div>
<div class="callout why"><span class="tag">কেন SNS + SQS একসাথে ব্যবহার করা হয়</span>
SNS নিজে message persist করে না — একটা subscriber যদি সেই মুহূর্তে ডাউন থাকে বা এরর দেয়, SNS-এর নিজের retry কয়েকবারের মধ্যেই থেমে যায় এবং message হারিয়ে যেতে পারে। SQS queue subscriber বসিয়ে দিলে, SNS message SQS-এ persist হয়ে যায় এবং subscriber সার্ভিস ডাউন থাকলেও message queue-তে অপেক্ষা করে — সার্ভিস ফিরে এলে প্রসেস করতে পারবে। এই কম্বোতে SNS দেয় fan-out (একই message বহু জায়গায়), আর SQS দেয় durability + buffering।</div>

<h3>EventBridge</h3>
<p><span class="kw">EventBridge</span> হলো একটা event bus সার্ভিস যেখানে producer-রা event পাবলিশ করে এবং <span class="kw">Rule</span> দিয়ে event-এর কন্টেন্ট (source, detail-type, নির্দিষ্ট field ভ্যালু) অনুযায়ী <span class="kw">pattern matching</span> করে সঠিক target-এ route করা হয় — SNS-এর চেয়ে অনেক বেশি richer routing/filtering ক্ষমতা।</p>
<pre>{
  "source": ["order.service"],
  "detail-type": ["OrderCreated"],
  "detail": {
    "amount": [{ "numeric": [">", 1000] }]
  }
}</pre>
<div class="callout behind"><span class="tag">SNS vs EventBridge — routing-এর পার্থক্য</span>
SNS-এ subscriber শুধু পুরো topic subscribe করে, বড়জোর filter policy দিয়ে attribute-ভিত্তিক সাধারণ ফিল্টার করতে পারে। EventBridge-এর rule ইঞ্জিন event-এর nested JSON body-র ভেতরে গিয়ে জটিল condition (numeric comparison, prefix match, exists check) evaluate করতে পারে, একাধিক AWS সার্ভিস ও ১৫০+ SaaS পার্টনার (Partner Event Source) থেকে event নিতে পারে, এবং একটা bus-এ একাধিক independent rule রাখা যায় — অনেক বেশি declarative ও scalable event-driven architecture-এর জন্য।</div>

<h3>কখন কোনটা বেছে নেবেন</h3>
<table>
<tr><th>প্যাটার্ন</th><th>ব্যবহার করুন যখন</th></tr>
<tr><td>SQS (Queue)</td><td>এক producer থেকে এক (বা কয়েকটা competing) consumer, workload buffering/decoupling, guaranteed processing দরকার</td></tr>
<tr><td>SNS (Pub-Sub)</td><td>এক event একাধিক independent subscriber-কে সরাসরি জানাতে হবে (fan-out), simple broadcasting</td></tr>
<tr><td>EventBridge (Event Bus)</td><td>একাধিক সার্ভিস/সোর্স থেকে event আসছে, complex filtering/routing rule লাগবে, SaaS integration বা schema registry দরকার</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake — সবকিছুর জন্য SNS ব্যবহার করা</span>
SNS simple মনে হলেও complex routing logic (একাধিক শর্তের কম্বিনেশন) কোড করে Lambda-তে ফেলতে হয় যদি SNS filter policy যথেষ্ট না হয়। EventBridge-এর declarative rule দিয়ে সেই লজিক infrastructure লেয়ারেই থাকে, কোড-এ নয় — maintain করা সহজ হয়।</div>

<h3>Kinesis — Streaming Data, SQS থেকে ভিন্ন সমস্যা</h3>
<p>SQS একবার message consume ও delete হয়ে গেলে সেটা হারিয়ে যায় — এটা "কাজ একবার সম্পন্ন করা" মডেলের জন্য ডিজাইন করা। কিন্তু অনেক ব্যবহারে (clickstream analytics, IoT sensor data, log aggregation) একই ডেটা <b>একাধিক independent consumer</b>-কে একসাথে, ordered ভাবে, এবং কিছুক্ষণ পর আবারও reprocess করার সুযোগ নিয়ে পড়তে হয় — এটাই <span class="kw">Amazon Kinesis Data Streams</span>-এর কাজ।</p>
<table>
<tr><th></th><th>SQS</th><th>Kinesis Data Streams</th></tr>
<tr><td>Consumption model</td><td>Message পড়ার পর delete হয়ে যায় (destructive)</td><td>Data একটা নির্দিষ্ট retention period (ডিফল্ট ২৪ ঘণ্টা, বাড়ানো যায়) ধরে থেকে যায়, বারবার replay করা যায়</td></tr>
<tr><td>একাধিক consumer</td><td>Competing consumers — একটা message একজনই পায়</td><td>একাধিক independent consumer application একই ডেটা আলাদাভাবে, সমান্তরালে পড়তে পারে</td></tr>
<tr><td>Ordering</td><td>Standard-এ নেই, FIFO-এ group-ভিত্তিক</td><td>প্রতিটা Shard-এর ভেতরে strict ordering</td></tr>
<tr><td>Scaling ইউনিট</td><td>স্বয়ংক্রিয়, কোনো ধারণা নেই</td><td><span class="kw">Shard</span> — প্রতিটা shard-এর নির্দিষ্ট throughput ক্যাপাসিটি, ম্যানুয়ালি বা on-demand স্কেল করতে হয়</td></tr>
<tr><td>Use case</td><td>Task queue, decoupling, job buffering</td><td>Real-time analytics pipeline, log/metric aggregation, একই ডেটা একাধিক downstream system-এ পাঠানো</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Replay সম্ভব — Kinesis ডেটা delete করে না</span>
SQS-এ consumer একটা message "delete" করেই বলে দেয় "এটা প্রসেস শেষ" — তারপর সেটা চিরতরে চলে যায়। Kinesis সম্পূর্ণ ভিন্নভাবে কাজ করে: এটা ডেটাকে retention period পর্যন্ত ধরে রাখে এবং প্রতিটা consumer নিজের একটা <b>cursor/checkpoint</b> ট্র্যাক করে বলে "আমি এই পর্যন্ত পড়েছি" — ডেটা নিজে কখনো মুছে যায় না consumer পড়ার কারণে। এই ডিজাইনের ফলে একটা নতুন consumer application যুক্ত হলে সে শুরু থেকেই (বা যেকোনো নির্দিষ্ট সময় থেকে) পুরনো ডেটা পুনরায় প্রসেস করতে পারে — SQS-এ এটা সম্ভব না, কারণ ডেটা একবার consume হলে হারিয়ে যায়।</div>
</template>

<template data-page="containers">
<h2 class="title">১৫. ECS, EKS ও Containers</h2>
<p class="lead">একটা কন্টেইনার একবার বানানো সহজ, কিন্তু production-এ শত শত কন্টেইনার চালানো, স্কেল করা, রিস্টার্ট করা, নেটওয়ার্ক ও সিকিউরিটি হ্যান্ডেল করা — এই পুরো কাজটাই করে <span class="kw">container orchestration</span> সার্ভিস। AWS-এ এই কাজের জন্য মূলত দুটো অপশন: ECS ও EKS।</p>

<h3>Container Orchestration কেন প্রয়োজন</h3>
<p>একটা মাত্র <code>docker run</code> কমান্ড দিয়ে একটা কন্টেইনার চালানো যায়, কিন্তু production workload-এ প্রশ্ন আসে — কন্টেইনার crash করলে কে restart করবে? ট্রাফিক বাড়লে কে নতুন instance স্পন করবে? কোন হোস্টে কোন কন্টেইনার যাবে? নতুন ভার্সন deploy করার সময় downtime ছাড়া কীভাবে rollout হবে? এই সব সিদ্ধান্ত orchestrator নেয় — ম্যানুয়ালি করলে এটা অসম্ভব স্কেলে জটিল হয়ে যায়।</p>

<h3>ECS Core Concept — Cluster, Task Definition, Service</h3>
<div class="diagram"><pre>
ECS Cluster (logical grouping of compute)
     │
     ├── Task Definition  (blueprint: image, CPU/মেমরি, env var, port)
     │         │
     │         ▼
     └── Service ── desired count=3 ──► Task #1 (running container)
                                   ├──► Task #2 (running container)
                                   └──► Task #3 (running container)
              │
              └── ALB-এর মাধ্যমে traffic distribute + health check fail
                  হলে নতুন Task দিয়ে replace
</pre></div>
<table>
<tr><th>কনসেপ্ট</th><th>ভূমিকা</th></tr>
<tr><td>Cluster</td><td>logical namespace — কোন compute resource-এর ওপর task চলবে তার গ্রুপিং</td></tr>
<tr><td>Task Definition</td><td>একটা টেক্সট (JSON) blueprint — কোন image, কত CPU/মেমরি, কোন port, কোন IAM role</td></tr>
<tr><td>Task</td><td>Task Definition-এর একটা running instance (এক বা একাধিক কন্টেইনার একসাথে)</td></tr>
<tr><td>Service</td><td>নির্দিষ্ট সংখ্যক Task সবসময় চলমান রাখে, ALB-এর সাথে ইন্টিগ্রেট করে, ফেইল করা Task রিপ্লেস করে</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Task Definition আর Task আলাদা কনসেপ্ট</span>
Task Definition হলো immutable blueprint (versioned) — এটা কোড রিপোর মতো revision history রাখে। Task হলো সেই blueprint থেকে তৈরি একটা running instance। এই বিভাজনের কারণে rollback সহজ হয় — নতুন Task Definition revision ডিপ্লয় করে সমস্যা হলে আগের revision-এ ফিরে যাওয়া মাত্র একটা reference পরিবর্তন, নতুন করে সবকিছু rebuild করার প্রয়োজন হয় না।</div>

<h3>Launch Type — Fargate vs EC2</h3>
<table>
<tr><th></th><th>Fargate</th><th>EC2 Launch Type</th></tr>
<tr><td>Infrastructure management</td><td>সার্ভারলেস — AWS পুরো হোস্ট manage করে</td><td>আপনি EC2 instance provision/patch/scale করেন</td></tr>
<tr><td>Cost model</td><td>per-task vCPU/মেমরি ব্যবহারের ওপর বিল</td><td>underlying EC2 instance-এর দাম (Reserved/Spot দিয়ে সস্তা করা যায়)</td></tr>
<tr><td>Control</td><td>সীমিত (কোনো SSH access, কাস্টম AMI নেই)</td><td>পুরো OS-level control, custom AMI, GPU instance সম্ভব</td></tr>
<tr><td>Cold start / স্পিড</td><td>নতুন task স্পিন-আপে কিছুটা বেশি সময়</td><td>warm instance পুল থাকলে দ্রুত</td></tr>
<tr><td>উপযুক্ত</td><td>variable/unpredictable workload, ছোট টিম যাদের ops overhead কমাতে হবে</td><td>predictable steady-state high-volume workload, GPU/special hardware প্রয়োজন</td></tr>
</table>
<div class="callout why"><span class="tag">কেন Fargate-এ কম control কিন্তু কম ops overhead</span>
Fargate প্রতিটা Task-কে একটা আলাদা micro-VM-এ চালায় (Firecracker ভিত্তিক), তাই AWS নিজেই patching, capacity planning, host-level isolation সামলায়। এর বিনিময়ে আপনি হোস্ট OS ছুঁতে পারবেন না। EC2 launch type-এ আপনি নিজে instance manage করেন — বেশি flexibility কিন্তু বেশি দায়িত্ব (patching, right-sizing, scaling policy)।</div>

<h3>ECR — Container Registry</h3>
<p><span class="kw">ECR</span> (Elastic Container Registry) হলো AWS-এর প্রাইভেট Docker image registry — IAM দিয়ে অ্যাক্সেস কন্ট্রোল হয়, VPC-এর ভেতর থেকে সরাসরি pull করা যায় (public internet-এ না গিয়ে), এবং image scanning (vulnerability check) বিল্ট-ইন।</p>
<pre>aws ecr get-login-password --region ap-southeast-1 | \
  docker login --username AWS --password-stdin \
  123456789012.dkr.ecr.ap-southeast-1.amazonaws.com

docker tag my-app:latest \
  123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/my-app:latest

docker push 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/my-app:latest</pre>

<h3>Networking Mode — awsvpc</h3>
<p>ECS-এ <span class="kw">awsvpc</span> networking mode প্রতিটা Task-কে তার নিজস্ব <span class="kw">Elastic Network Interface (ENI)</span> দেয় — মানে প্রতিটা Task-এর নিজের প্রাইভেট IP address আছে, ঠিক একটা EC2 instance-এর মতো।</p>
<div class="diagram"><pre>
EC2 Host / Fargate micro-VM
   ┌───────────────┐   ┌───────────────┐
   │ Task A        │   │ Task B        │
   │ ENI: 10.0.1.5 │   │ ENI: 10.0.1.6 │
   │ SG: sg-app    │   │ SG: sg-worker │  ◄── আলাদা Security Group,
   └───────────────┘   └───────────────┘      Task-level এ apply
</pre></div>
<div class="callout why"><span class="tag">কেন প্রতিটা Task নিজের ENI পায়</span>
পুরনো bridge networking mode-এ একই হোস্টের সব কন্টেইনার হোস্টের নেটওয়ার্ক নেমস্পেস শেয়ার করত, port mapping ম্যানুয়ালি করতে হতো, এবং Security Group হোস্ট-লেভেলে apply হতো — মানে একই হোস্টে থাকা সব Task একই নেটওয়ার্ক সিকিউরিটি পেত। awsvpc mode প্রতিটা Task-কে তার নিজস্ব network interface দেওয়ায়, Security Group এখন সরাসরি individual Task-এর ওপর apply করা যায় — একটা Task শুধু তার প্রয়োজনীয় port/source-এর সাথে কথা বলতে পারবে, সহজাতভাবেই least-privilege নেটওয়ার্ক আইসোলেশন পাওয়া যায়।</div>
<div class="callout mistake"><span class="tag">Common mistake — awsvpc mode-এ ENI limit ভুলে যাওয়া</span>
প্রতিটা EC2 instance টাইপের একটা ম্যাক্সিমাম ENI সংখ্যা থাকে, তাই EC2 launch type-এ awsvpc mode ব্যবহার করলে instance-এ কতগুলো Task রাখা যাবে সেটা সীমিত হয়ে যায় (instance টাইপ অনুযায়ী)। Fargate-এ এই সীমা নিয়ে ভাবতে হয় না কারণ প্রতিটা Task-ই নিজের micro-VM।</div>

<h3>EKS — Managed Kubernetes</h3>
<p><span class="kw">EKS</span> হলো AWS-এর ম্যানেজড Kubernetes সার্ভিস। AWS Kubernetes control plane (API server, etcd, scheduler) নিজে হোস্ট ও manage করে — patching, high availability, upgrade সব AWS-এর দায়িত্ব। কিন্তু worker node (EC2 বা Fargate) এবং সেখানে চলা Kubernetes workload-এর কনফিগারেশন (Deployment, Service manifest) এখনও গ্রাহকের দায়িত্ব।</p>

<h3>ECS vs EKS vs Lambda — কখন কোনটা</h3>
<table>
<tr><th>বিবেচ্য বিষয়</th><th>ECS</th><th>EKS</th><th>Lambda</th></tr>
<tr><td>Team-এর Kubernetes experience</td><td>প্রয়োজন নেই</td><td>প্রয়োজন (steeper learning curve)</td><td>প্রয়োজন নেই</td></tr>

<div class="callout best"><span class="tag">Best practice — সিদ্ধান্তের সহজ নিয়ম</span>
যদি টিম আগে থেকেই Kubernetes-এ কাজ করে বা multi-cloud portability লাগবে — EKS। যদি AWS-native এবং Kubernetes complexity এড়িয়ে সহজে container চালাতে চান — ECS (বিশেষত Fargate)। যদি workload event-driven, ছোট ও spiky হয়, এবং idle সময়ে কোনো cost না চান — Lambda।</div>

<h2 class="title">১৬. CloudFormation ও IaC</h2>
<p class="lead"><span class="kw">Infrastructure as Code (IaC)</span> মানে ইনফ্রাস্ট্রাকচার কনফিগারেশন কোডে লেখা, যাতে সেটা version control-এ রাখা যায়, রিভিউ করা যায়, এবং একইভাবে বারবার reproduce করা যায় — AWS কনসোলে ম্যানুয়ালি ক্লিক করে রিসোর্স বানানোর বিপরীত পদ্ধতি।</p>

<h3>কেন Manual Console Click সমস্যাজনক</h3>
<p>কনসোলে ক্লিক করে রিসোর্স বানানো দ্রুত মনে হয়, কিন্তু production-এ এটা তিনটা গুরুতর সমস্যা তৈরি করে।</p>
<ul>
<li><b>Drift</b> — সময়ের সাথে কেউ একটা সেটিং ম্যানুয়ালি বদলে দিলে, actual infrastructure আর documented state-এর মধ্যে অমিল তৈরি হয়, এবং কেউ জানেই না real configuration কী।</li>
<li><b>Non-repeatable</b> — একই environment দ্বিতীয়বার বানাতে (dev থেকে staging, বা disaster recovery-এর সময়) একই ধারাবাহিক ক্লিক মনে রাখা বা ডকুমেন্ট করা প্রায় অসম্ভব — মানুষ ভুল করে।</li>
<li><b>No version control</b> — কোনো ইনফ্রাস্ট্রাকচার পরিবর্তনের history নেই, কে কী বদলালো, কখন, কেন — এসব ট্র্যাক করার কোনো উপায় নেই, এবং rollback করাও কঠিন।</li>
</ul>
<div class="callout why"><span class="tag">কেন IaC এই সমস্যাগুলো সমাধান করে</span>
কোড হিসেবে ইনফ্রাস্ট্রাকচার লেখা হলে সেটা Git-এ কমিট হয়, PR রিভিউ হয়, এবং একই টেমপ্লেট বারবার apply করলে একই ফলাফল আসে (idempotent)। প্রতিটা পরিবর্তন একটা commit — কে, কেন, কখন বদলালো তার সম্পূর্ণ audit trail তৈরি হয়ে যায় বিনা বাড়তি চেষ্টায়।</div>

<h3>CloudFormation Template গঠন</h3>
<p>একটা CloudFormation template মূলত তিনটা প্রধান সেকশনে গঠিত — <code>Parameters</code> (input variable), <code>Resources</code> (কী বানাবে — বাধ্যতামূলক সেকশন), <code>Outputs</code> (তৈরি হওয়া রিসোর্সের তথ্য এক্সপোর্ট করা)।</p>
<pre>AWSTemplateFormatVersion: '2010-09-09'
Description: একটা প্রাইভেট S3 bucket তৈরি করে

Parameters:
  BucketNamePrefix:
    Type: String
    Default: my-app-data

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketNamePrefix}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true

Outputs:
  BucketArn:
    Description: তৈরি হওয়া bucket-এর ARN
    Value: !GetAtt DataBucket.Arn</pre>
<div class="callout why"><span class="tag">কেন Outputs সেকশন গুরুত্বপূর্ণ</span>
একটা Stack-এর তৈরি করা রিসোর্স (যেমন bucket ARN, VPC ID) প্রায়ই আরেকটা Stack-এর ইনপুট হিসেবে লাগে। Outputs সেকশন সেই মানগুলো এক্সপোর্ট করে দেয়, যাতে অন্য Stack <code>Fn::ImportValue</code> দিয়ে সেটা রেফারেন্স করতে পারে — আলাদা Stack-গুলোর মধ্যে সেতু তৈরি হয় ম্যানুয়ালি ভ্যালু কপি-পেস্ট না করেই।</div>

<h3>Stack ও Change Set</h3>
<p>একটা template deploy করলে CloudFormation একটা <span class="kw">Stack</span> তৈরি করে — সমস্ত রিসোর্সের একটা logical গ্রুপ, যেটা একসাথে create/update/delete হয়। বিদ্যমান Stack আপডেট করার সময়, directly apply করার বদলে প্রথমে একটা <span class="kw">Change Set</span> তৈরি করে দেখা উচিত ঠিক কী কী পরিবর্তন হবে।</p>
<div class="diagram"><pre>
বর্তমান Stack ──► প্রস্তাবিত Template পরিবর্তন
      │
      ▼
  Change Set তৈরি (preview mode, কিছুই apply হয়নি)
      │
      ▼
  রিভিউ: "DataBucket → Replacement: True" ⚠️
         (মানে bucket ডিলিট হয়ে নতুন বানাবে — ডেটা হারাতে পারে!)
      │
      ├── ঠিক আছে মনে হলে ─► Execute Change Set ─► Stack Update হয়
      └── ঝুঁকিপূর্ণ মনে হলে ─► বাতিল করে template ঠিক করুন
</pre></div>
<div class="callout why"><span class="tag">কেন সরাসরি apply না করে Change Set দিয়ে preview করা Best Practice</span>
CloudFormation-এর অনেক property change আসলে "update in place" নয় — বরং রিসোর্স ডিলিট করে নতুন করে বানায় (Replacement)। উদাহরণ: RDS instance-এর কিছু property বদলালে পুরো database replace হয়ে যেতে পারে, ডেটা হারিয়ে। Change Set আসলে apply করার আগে ঠিক কোন রিসোর্স "Modify" হবে বনাম "Replace" হবে সেটা দেখিয়ে দেয় — এই preview না থাকলে production database ভুলবশত ডিলিট হয়ে যাওয়ার মতো বিপর্যয় ঘটতে পারে।</div>
<div class="callout mistake"><span class="tag">Common mistake — Change Set-এর "Replacement: True" উপেক্ষা করা</span>
তাড়াহুড়োয় অনেকে Change Set-এর detail না পড়েই Execute করে দেয়। ছোট মনে হওয়া একটা property পরিবর্তন (যেমন RDS-এর <code>Engine Version</code> বা S3 bucket-এর <code>BucketName</code>) আসলে পুরো রিসোর্স রিপ্লেস করে দিতে পারে — সবসময় Replacement column চেক করা আবশ্যক।</div>

<h3>Drift Detection</h3>
<p>কেউ যদি কনসোলে গিয়ে ম্যানুয়ালি একটা CloudFormation-managed রিসোর্সের সেটিং বদলে দেয়, তখন actual state আর template-এ ডিফাইন করা state-এর মধ্যে অমিল তৈরি হয় — এটাকে <span class="kw">Drift</span> বলে। CloudFormation-এর <code>Detect Drift</code> ফিচার প্রতিটা রিসোর্স চেক করে বলে দেয় কোনটা drift করেছে এবং ঠিক কোন property বদলে গেছে।</p>
<div class="callout best"><span class="tag">Best practice — নিয়মিত Drift Detection চালান</span>
Drift চেক না করলে টিম বিশ্বাস করতে থাকে যে template-ই সত্যিকারের ইনফ্রাস্ট্রাকচার প্রতিনিধিত্ব করছে, যেখানে বাস্তবে তা নয় — পরের deployment-এ অপ্রত্যাশিত আচরণ দেখা দিতে পারে। Scheduled Lambda বা CI pipeline দিয়ে নিয়মিত drift detection চালিয়ে alert সেট করা উচিত।</div>

<h3>Nested Stack</h3>
<p>একটা বড় ইনফ্রাস্ট্রাকচার (নেটওয়ার্কিং, ডেটাবেস, অ্যাপ্লিকেশন লেয়ার সব একসাথে) একটা মাত্র বিশাল template-এ লেখা কঠিন হয়ে যায়। <span class="kw">Nested Stack</span> দিয়ে একটা Parent Stack একাধিক Child Stack-কে reference করতে পারে, প্রতিটা নিজের দায়িত্বে আলাদা।</p>
<div class="diagram"><pre>
Parent Stack (network-app.yaml)
     │
     ├── Nested: network-stack.yaml   (VPC, Subnet, Route Table)
     ├── Nested: database-stack.yaml  (RDS, Security Group)
     └── Nested: app-stack.yaml       (ECS Service, ALB)
</pre></div>
<div class="callout why"><span class="tag">কেন বড় ইনফ্রাস্ট্রাকচার ভাগ করা হয়</span>
Nested Stack প্রতিটা লেয়ারকে (network, data, app) reusable, independently testable মডিউলে ভাগ করে — টিমের একটা অংশ networking নিয়ে কাজ করলে সেটা app-লেয়ারের কোড না ছুঁয়েই করতে পারে। এটাও CloudFormation-এর একটা hard limit এড়াতে সাহায্য করে — একটা template-এর ম্যাক্সিমাম রিসোর্স সংখ্যা (৫০০) সীমিত, বড় সিস্টেমে সেই সীমা সহজেই ছুঁয়ে যায়।</div>

<h3>CloudFormation vs Terraform vs CDK</h3>
<table>
<tr><th></th><th>CloudFormation</th><th>Terraform</th><th>AWS CDK</th></tr>
<tr><td>Cloud সাপোর্ট</td><td>AWS-only</td><td>Multi-cloud (AWS, Azure, GCP, ...)</td><td>AWS-only (কিন্তু CDK for Terraform দিয়ে multi-cloud সম্ভব)</td></tr>

<tr><td>নতুন ফিচার সাপোর্ট</td><td>AWS রিলিজের সাথে সাথে নেটিভ সাপোর্ট</td><td>provider আপডেটের জন্য কিছুটা দেরি হতে পারে</td><td>AWS রিলিজের সাথে সাথে (CloudFormation-নির্ভর)</td></tr>
<tr><td>উপযুক্ত</td><td>pure AWS টিম, কোনো external tool ছাড়াই চালাতে চাইলে</td><td>multi-cloud বা hybrid ইনফ্রাস্ট্রাকচার</td><td>developer টিম যারা কোড দিয়েই ইনফ্রা ডিফাইন করতে চায় (loop, condition, abstraction ব্যবহার করে)</td></tr>
</table>
<div class="callout behind"><span class="tag">CDK আসলে CloudFormation-এর ওপরেই চলে</span>
CDK কোনো আলাদা deployment ইঞ্জিন নয় — এটা একটা abstraction layer যা আপনার TypeScript/Python কোডকে CloudFormation template-এ synthesize করে, তারপর সেই template-ই স্বাভাবিক CloudFormation-এর মাধ্যমে deploy হয়। তাই CDK-এর সব সুবিধা (drift detection, change set, rollback) আসলে CloudFormation-এরই সুবিধা — CDK শুধু template লেখার experience-টা প্রোগ্রামিং ভাষার loop/class/function দিয়ে সহজ করে দেয়।</div>

<template data-page="observability">
<h2 class="title">১৭. CloudWatch ও Observability</h2>
<p class="lead">অ্যাপ্লিকেশন প্রোডাকশনে চলছে মানেই কাজ শেষ না — সেটা ঠিকভাবে চলছে কিনা, কোথায় সমস্যা হচ্ছে, সেটা জানার ব্যবস্থাই <span class="kw">Observability</span>, আর AWS-এ এর কেন্দ্রীয় সার্ভিস <span class="kw">CloudWatch</span>।</p>

<h3>Metric ও Namespace</h3>
<p><span class="kw">Metric</span> হলো সময়ের সাথে বদলানো একটা সংখ্যার সিরিজ — যেমন CPUUtilization, RequestCount। প্রতিটা metric একটা <span class="kw">Namespace</span>-এর ভেতরে থাকে (যেমন <code>AWS/EC2</code>, <code>AWS/Lambda</code>) — namespace শুধু একটা গ্রুপিং, যাতে একই নামের metric ভিন্ন সার্ভিসের মধ্যে গুলিয়ে না যায়। AWS-এর নিজস্ব সার্ভিসগুলো স্বয়ংক্রিয়ভাবে <b>standard resolution</b>-এ (১ মিনিট) metric পাঠায়; আপনি চাইলে <b>high-resolution</b> metric (১ সেকেন্ড পর্যন্ত গ্রানুলারিটি) নিজে পাঠাতে পারেন, তবে সেটার স্টোরেজ কস্ট বেশি।</p>

<table>
<tr><th>বিষয়</th><th>Standard Resolution</th><th>High Resolution</th></tr>
<tr><td>ন্যূনতম Period</td><td>৬০ সেকেন্ড</td><td>১ সেকেন্ড</td></tr>
<tr><td>ব্যবহার</td><td>সাধারণ EC2/RDS/ELB metric</td><td>latency-sensitive real-time alert (যেমন trading, gaming)</td></tr>
<tr><td>খরচ</td><td>তুলনামূলক কম</td><td>বেশি (data point বেশি জমা হয়)</td></tr>
</table>

<div class="callout why"><span class="tag">কেন সব metric high-resolution নয়</span>
প্রতিটা data point স্টোর করতে খরচ হয়। সব metric সেকেন্ডে-সেকেন্ডে পাঠালে খরচ কয়েকগুণ বেড়ে যায়, অথচ বেশিরভাগ ব্যবহারের ক্ষেত্রে ১ মিনিটের গ্রানুলারিটিই যথেষ্ট। তাই AWS default resolution কম রাখে, আর high-resolution শুধু তখনই বেছে নিতে বলে যখন আসলেই সেকেন্ড-লেভেল reaction প্রয়োজন।</div>

<h3>Alarm — threshold, state ও evaluation period</h3>
<p>একটা <span class="kw">Alarm</span> একটা metric-কে থ্রেশহোল্ডের সাথে তুলনা করে এবং তিনটার একটা state-এ থাকে। <code>Period</code> হলো একটা data point কতক্ষণের ডেটা নিয়ে বানানো (যেমন ৫ মিনিট), আর <code>Evaluation Period</code> হলো কতটা পিরিয়ড টানা থ্রেশহোল্ড ব্রেক করলে alarm ট্রিগার হবে (যেমন "৩টা টানা ৫-মিনিট পিরিয়ডে CPU &gt; ৮০%")।</p>

<table>
<tr><th>State</th><th>মানে</th></tr>
<tr><td><b>OK</b></td><td>Metric থ্রেশহোল্ডের মধ্যে আছে — সব ঠিক আছে।</td></tr>
<tr><td><b>ALARM</b></td><td>থ্রেশহোল্ড ভঙ্গ হয়েছে — অ্যাকশন (SNS notification, Auto Scaling ইত্যাদি) ট্রিগার হয়।</td></tr>
<tr><td><b>INSUFFICIENT_DATA</b></td><td>এখনো যথেষ্ট data point আসেনি সিদ্ধান্ত নেওয়ার জন্য, বা metric সাময়িকভাবে বন্ধ হয়ে গেছে।</td></tr>
</table>

<div class="callout why"><span class="tag">কেন INSUFFICIENT_DATA আলাদা state</span>
যদি এটা আলাদা state না থেকে alarm-কে বাধ্য হয়ে OK বা ALARM-এর মধ্যে একটা বেছে নিতে হতো, তাহলে একটা resource সদ্য চালু হওয়ার সময় বা metric না-পাঠানোর সময় ভুলভাবে "OK" ধরে নেওয়া হতো — যেটা misleading, কারণ আসলে অবস্থা সম্পর্কে কোনো তথ্যই নেই। এই তৃতীয় state স্পষ্ট করে বলে দেয়: "আমরা জানি না", যাতে অপারেটর ভুল নিরাপত্তার অনুভূতিতে না পড়ে।</div>

<h3>Log Group, Log Stream ও Logs Insights</h3>
<p>CloudWatch Logs-এ <span class="kw">Log Group</span> হলো লগের একটা কনটেইনার (সাধারণত এক অ্যাপ্লিকেশন বা এক Lambda function-এর জন্য একটা), এর ভেতরে <span class="kw">Log Stream</span> থাকে (সাধারণত এক instance/এক execution-এর জন্য একটা সিকোয়েন্স)। Log Group-এ retention period সেট করা যায় — সেট না করলে লগ default-এ চিরকাল থাকে (এবং খরচ বাড়তেই থাকে)।</p>
<p><span class="kw">CloudWatch Logs Insights</span> দিয়ে একটা query language ব্যবহার করে বিশাল লগের ভেতর থেকে দ্রুত প্যাটার্ন খুঁজে বের করা যায় — এটা <code>grep</code>-এর চেয়ে অনেক বেশি শক্তিশালী কারণ এটা parse, filter, aggregate সব একসাথে করতে পারে।</p>
<pre>fields @timestamp, @message
| filter @message like /ERROR/
| stats count(*) as errorCount by bin(5m)
| sort errorCount desc</pre>
<p>উপরের query প্রতি ৫ মিনিটের bucket-এ কতটা ERROR লগ এসেছে সেটা গুনে সবচেয়ে বেশি error-প্রবণ সময় বের করে দেয় — production-এ কোনো incident-এর সময়সীমা বুঝতে এটা খুব কাজের।</p>

<h3>Custom Metric — PutMetricData</h3>
<p>AWS resource-এর built-in metric (CPU, memory ইত্যাদি) infrastructure-এর অবস্থা বলে, কিন্তু আপনার business logic কেমন চলছে সেটা বলে না — যেমন "checkout সফল হওয়ার রেট" বা "queue-এ কতগুলো item pending"। এই ধরনের অ্যাপ্লিকেশন-স্পেসিফিক তথ্যের জন্য <code>PutMetricData</code> API দিয়ে নিজের <span class="kw">Custom Metric</span> পাঠাতে হয়।</p>
<pre>aws cloudwatch put-metric-data \
  --namespace "MyApp/Checkout" \
  --metric-name "SuccessfulOrders" \
  --value 1 \
  --unit Count</pre>
<div class="callout mistake"><span class="tag">Common mistake — শুধু infrastructure metric দেখা</span>
অনেক টিম শুধু CPU/Memory dashboard দেখে "সিস্টেম সুস্থ" ভাবে, কিন্তু ব্যবসায়িক দিক থেকে ব্যর্থতা (যেমন payment gateway টাইমআউট বেড়ে যাওয়া) infrastructure metric-এ ধরা পড়ে না। Custom metric ছাড়া আপনি শুধু "সার্ভার চলছে" জানবেন, "ব্যবসা ঠিক চলছে" জানবেন না।</div>

<h3>Dashboard</h3>
<p><span class="kw">CloudWatch Dashboard</span> একাধিক metric, alarm, log widget একই স্ক্রিনে সাজিয়ে রাখার জায়গা — একটা টিম বা একটা সার্ভিসের health এক নজরে দেখার জন্য। JSON দিয়ে দাশবোর্ড কোড-এ define করা যায়, ফলে এটাও IaC-এর মতো version control-এ রাখা সম্ভব।</p>

<h3>X-Ray — Distributed Tracing</h3>
<p>Monolith-এ একটা request কোথায় ধীর হচ্ছে বোঝা সহজ — একটাই প্রসেসের log দেখলেই চলে। কিন্তু microservices architecture-এ একটা request অনেকগুলো সার্ভিস ঘুরে আসে, আর প্রতিটার লগ আলাদা জায়গায় থাকে — তখন "কোন সার্ভিসে সময় বেশি লাগছে" বের করা কঠিন হয়ে পড়ে। <span class="kw">AWS X-Ray</span> এই সমস্যার সমাধান করে পুরো request-এর যাত্রা একসাথে ট্র্যাক করে।</p>
<p>একটা সম্পূর্ণ request-এর যাত্রাকে বলে <span class="kw">Trace</span>। প্রতিটা সার্ভিস তার নিজের কাজের সময়টা রেকর্ড করে একটা <span class="kw">Segment</span> হিসেবে, আর একটা সার্ভিসের ভেতরে ছোট ছোট অংশ (যেমন একটা DB call) হয় <span class="kw">Subsegment</span>। সব segment একটাই trace ID দিয়ে যুক্ত থাকে বলে পুরো path পুনর্গঠন করা যায়।</p>
<div class="diagram"><pre>Client → API Gateway → Order Service → Payment Service → DB
  │           │              │                │            │
  └── trace-id: abc123 ── একই trace-এর অংশ সব segment/subsegment ──┘

X-Ray Trace টাইমলাইন:
API GW      [████ 10ms]
Order Svc     [██████████ 40ms]
Payment Svc      [██████████████████████████ 120ms]  ← bottleneck এখানে
DB                              [████ 15ms]</pre></div>
<div class="callout behind"><span class="tag">কীভাবে bottleneck ধরা পড়ে</span>
X-Ray-এর Service Map প্রতিটা segment-এর duration পাশাপাশি দেখায়, ফলে টাইমলাইনে যে সার্ভিস সবচেয়ে বেশি জায়গা নিচ্ছে সেটাই দৃশ্যত আলাদা হয়ে যায়। উপরের উদাহরণে Payment Service-এর ১২০ms স্পষ্টভাবে বাকিদের চেয়ে বড় — তাই optimization-এর ফোকাস প্রথমে সেখানেই দিতে হবে, অন্য কোথাও না।</div>

<h3>CloudTrail — কে কী করলো, তার রেকর্ড</h3>
<p>CloudWatch বলে দেয় সিস্টেম কেমন <b>পারফর্ম</b> করছে (CPU কত, error rate কত), কিন্তু "কে ঠিক কোন IAM user গতরাতে এই Security Group-টা ডিলিট করলো" — এই প্রশ্নের উত্তর CloudWatch দেয় না। এই কাজ করে <span class="kw">AWS CloudTrail</span> — এটা AWS অ্যাকাউন্টে হওয়া প্রতিটা API call-এর একটা audit log রাখে (কে, কখন, কোথা থেকে, কোন action, সফল হলো নাকি ব্যর্থ)।</p>
<table>
<tr><th></th><th>CloudWatch</th><th>CloudTrail</th></tr>
<tr><td>প্রশ্নের ধরন</td><td>"সিস্টেম কেমন পারফর্ম করছে?" (metric, log, health)</td><td>"কে কী করলো?" (API call audit)</td></tr>
<tr><td>ডেটার উৎস</td><td>অ্যাপ্লিকেশন/resource-এর নিজের metric ও log</td><td>AWS API-র প্রতিটা কল (Console, CLI, SDK থেকেও)</td></tr>
<tr><td>টিপিক্যাল ব্যবহার</td><td>Alarm, dashboard, performance debugging</td><td>Security audit, compliance, incident investigation ("কে এটা করলো")</td></tr>
</table>
<p>CloudTrail-এ দুই ধরনের event থাকে — <span class="kw">Management Events</span> (রিসোর্স তৈরি/মুছা/পরিবর্তন করার মতো control-plane অপারেশন, ডিফল্টে বিনামূল্যে লগ হয়) এবং <span class="kw">Data Events</span> (S3 object-level GetObject/PutObject, Lambda invoke-এর মতো high-volume data-plane অপারেশন, আলাদাভাবে enable করতে হয় এবং চার্জ প্রযোজ্য)।</p>
<div class="callout why"><span class="tag">কেন CloudTrail security incident investigation-এর প্রথম জায়গা</span>
কোনো সন্দেহজনক পরিবর্তন (যেমন একটা bucket policy পাবলিক হয়ে গেছে, বা একটা IAM user-এর permission বেড়ে গেছে) ধরা পড়লে, CloudTrail-এর event history দেখেই বলা যায় ঠিক কোন credential/role, কোন IP থেকে, কখন এই পরিবর্তন করেছে — কারণ এটা IAM-এর প্রতিটা successful ও failed API call রেকর্ড করে। এই কারণে একটা <b>Multi-Region Trail</b> চালু করে রাখা (যা S3-এ log স্টোর করে) practically বাধ্যতামূলক — যেকোনো compliance audit বা security investigation-এ এটাই প্রথম জায়গা যেখানে তাকানো হয়।</div>
<div class="callout mistake"><span class="tag">Common mistake — CloudTrail log delete করার permission কাউকে দেওয়া</span>
CloudTrail-এর S3 log bucket-এ delete permission থাকলে, একটা compromised বা malicious actor প্রথমেই নিজের কাজের evidence মুছে দিতে পারে। Best practice হলো CloudTrail log bucket-এ versioning ও MFA Delete চালু রাখা, এবং log delete করার permission শুধু সবচেয়ে trusted admin role-এর কাছে সীমিত রাখা।</div>

<h3>CloudWatch Events থেকে EventBridge</h3>
<p>আগে AWS resource-এর state change (যেমন EC2 চালু হওয়া) বা cron-ভিত্তিক schedule ট্রিগার করার সার্ভিসের নাম ছিল <span class="kw">CloudWatch Events</span>। AWS পরে এই ইভেন্ট-রাউটিং সিস্টেমকে আরও general-purpose করে — তৃতীয় পক্ষের SaaS ইভেন্ট, কাস্টম অ্যাপ্লিকেশন ইভেন্ট, schema registry ইত্যাদি যুক্ত করে — এবং নতুন নামে রিলঞ্চ করে: <span class="kw">EventBridge</span>। পুরনো CloudWatch Events rule আজও EventBridge-এর <code>default</code> event bus-এ কাজ করে; মূল ইভেন্ট-রাউটিং ধারণা একই, শুধু scope বড় হয়েছে।</p>

<h2 class="title">১৮. Security — KMS, Secrets Manager, WAF ও GuardDuty</h2>
<p class="lead">AWS-এ security একটাই সার্ভিসের কাজ না — encryption, secret handling, network-level attack প্রতিরোধ আর threat detection মিলিয়ে একটা স্তরযুক্ত (layered) defense তৈরি হয়।</p>

<h3>KMS ও Envelope Encryption</h3>
<p><span class="kw">AWS KMS</span> (Key Management Service) দিয়ে আপনি <span class="kw">Customer Master Key (CMK)</span> — এখন সাধারণভাবে <span class="kw">KMS key</span> বলা হয় — তৈরি ও ম্যানেজ করেন। এই key দিয়ে সরাসরি ডেটা এনক্রিপ্ট করা সম্ভব, কিন্তু KMS-এর API call-এ একটা সীমা আছে (data size ও throughput দুটোতেই) — বড় ফাইল বা বড় ডেটাসেট সরাসরি KMS দিয়ে এনক্রিপ্ট করা অকার্যকর ও ধীর।</p>
<p>এই কারণে <span class="kw">Envelope Encryption</span> প্যাটার্ন ব্যবহার হয়: KMS দিয়ে একটা ছোট <span class="kw">Data Key</span> generate করা হয় (plaintext + KMS-encrypted দুই ভার্সনেই), তারপর plaintext data key দিয়ে আসল বড় ডেটা লোকালি (AES দিয়ে) এনক্রিপ্ট করা হয়। এরপর plaintext data key মেমরি থেকে ফেলে দেওয়া হয়, আর শুধু encrypted data key ডেটার সাথে সংরক্ষণ করা হয়।</p>
<div class="diagram"><pre>১) KMS.GenerateDataKey() ──▶ Plaintext Data Key + Encrypted Data Key
                                      │
২) Plaintext Data Key দিয়ে বড় ডেটা লোকালি AES এনক্রিপ্ট
                                      │
৩) Plaintext Data Key মেমরি থেকে মুছে ফেলা হয়
                                      │
৪) সংরক্ষণ করা হয়: Encrypted Data + Encrypted Data Key
   (decrypt করার সময় KMS দিয়ে data key ফিরিয়ে এনে তখন ডেটা decrypt হয়)</pre></div>
<div class="callout why"><span class="tag">কেন সরাসরি KMS দিয়ে বড় ডেটা এনক্রিপ্ট করা হয় না</span>
KMS মূলত key-management সার্ভিস, bulk-encryption engine না — প্রতিটা <code>Encrypt</code> কলে একটা payload-size লিমিট (৪KB-এর মতো) আছে এবং নেটওয়ার্ক রাউন্ড-ট্রিপের কারণে ধীর। Envelope encryption দিয়ে ভারী কাজ (বাইট-বাইট এনক্রিপশন) লোকালি সিপিইউ-তে হয়, আর KMS শুধু ছোট, দামি অংশ — key ম্যানেজমেন্ট আর অ্যাক্সেস কন্ট্রোল — সামলায়। এটাই S3, EBS, DynamoDB encryption-এর ভেতরের আসল মেকানিজম।</div>

<p>KMS key-এর অ্যাক্সেস দুই স্তরে কন্ট্রোল হয়: <span class="kw">Key Policy</span> (key-এর নিজের রিসোর্স-বেসড পলিসি, key-লেভেলে কে অ্যাক্সেস পাবে তার মূল গেটকিপার) আর <span class="kw">IAM Policy</span> (ব্যবহারকারী/রোলের পারমিশন)। দুটোই "allow" করলেই কেবল অ্যাক্সেস মিলবে — key policy যদি IAM-কে অনুমতি না দেয় (<code>kms:CallerAccount</code> ইত্যাদির মাধ্যমে), তাহলে IAM policy-তে যত <code>Allow</code>-ই থাকুক কাজ করবে না।</p>
<div class="callout mistake"><span class="tag">Common mistake — key policy ভুলে যাওয়া</span>
অনেকে ভাবেন IAM policy-তে <code>kms:Decrypt</code> Allow দিলেই কাজ শেষ। কিন্তু KMS key policy default-এ শুধু root account-কে অ্যাক্সেস দেয় — অন্য কোনো IAM user/role-এর জন্য key policy-তেও আলাদাভাবে অনুমতি (বা root delegation) থাকতে হবে, নাহলে <code>AccessDeniedException</code> আসবে যদিও IAM policy সম্পূর্ণ ঠিক আছে।</div>

<tr><td>ব্যবহার</td><td>DB password, API key — যেখানে rotation জরুরি</td><td>Config value, feature flag, non-sensitive/semi-sensitive সেটিংস</td></tr>

<div class="callout best"><span class="tag">কখন কোনটা বাছবেন</span>
Database credential বা তৃতীয় পক্ষের API key-এর মতো এমন কিছুর জন্য যা নিয়মিত rotate করা প্রয়োজন, Secrets Manager-ই সঠিক পছন্দ — automatic rotation লজিক নিজে বানাতে হবে না। কিন্তু শুধু configuration value বা environment-specific সেটিংসের জন্য যেখানে rotation লাগে না, Parameter Store Standard tier বিনামূল্যে হওয়ায় খরচ বাঁচায়।</div>

<h3>WAF — Web ACL ও Rule</h3>
<p><span class="kw">AWS WAF</span> CloudFront, ALB বা API Gateway-এর সামনে বসে HTTP request পরীক্ষা করে। এর কেন্দ্রীয় ধারণা <span class="kw">Web ACL</span> — একগুচ্ছ <span class="kw">Rule</span> যা নির্দিষ্ট প্যাটার্ন মিললে request block/allow/count করে। সাধারণ managed rule group SQL injection ও XSS (cross-site scripting) প্যাটার্ন সনাক্ত করে, এবং <span class="kw">rate-based rule</span> দিয়ে একই IP থেকে অতিরিক্ত অনুরোধ এলে temporarily ব্লক করা যায় (basic DDoS/brute-force প্রতিরোধ)।</p>
