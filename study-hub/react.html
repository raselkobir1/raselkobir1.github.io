<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modern React Mastery — Bangla (Beginner → Advanced)</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d333b;
    --text:#e6edf3; --muted:#9aa7b4; --accent:#61dafb; --accent2:#a5e8ff;
    --green:#3fb950; --red:#f85149; --yellow:#e3b341; --purple:#bc8cff; --blue:#4aa3ff;
    --code-bg:#0b0f14; --kw:#61dafb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hind Siliguri","Noto Sans Bengali",".SF Bangla","Kohinoor Bangla","Bangla MN",system-ui,-apple-system,sans-serif;
    line-height:1.85; font-size:16.5px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh}
  .sidebar{
    width:300px; flex:0 0 300px; background:var(--panel);
    border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
    overflow-y:auto; padding:22px 14px;
  }
  .brand{padding:6px 10px 16px}
  .brand h1{font-size:19px; margin:0 0 4px; color:var(--accent)}
  .brand p{font-size:12.5px; color:var(--muted); margin:0}
  .navbtn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; color:var(--text); border:none; cursor:pointer;
    padding:10px 12px; border-radius:9px; font-size:14px; margin:2px 0;
    font-family:inherit; transition:background .15s;
  }
  .navbtn:hover{background:var(--panel2)}
  .navbtn.active{background:linear-gradient(90deg,rgba(97,218,251,.22),transparent); color:var(--accent); font-weight:600}
  .navbtn .num{
    flex:0 0 26px; height:26px; display:grid; place-items:center; font-size:12px;
    background:var(--panel2); border-radius:7px; color:var(--muted);
  }
  .navbtn.active .num{background:var(--accent); color:#0d1117}
  .main{flex:1; min-width:0; padding:38px 52px 90px; max-width:1080px; margin:0 auto}
  .page{display:none; animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.title{font-size:30px; margin:0 0 6px; color:var(--accent); border-bottom:2px solid var(--border); padding-bottom:14px}
  h3{font-size:22px; margin:34px 0 10px; color:var(--accent2)}
  h4{font-size:18px; margin:24px 0 8px; color:var(--purple)}
  p{margin:10px 0}
  .lead{color:var(--muted); font-size:16px; margin-bottom:20px}
  code{background:var(--code-bg); color:var(--kw); padding:2px 6px; border-radius:5px; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:14px}
  pre{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:16px 18px; overflow-x:auto; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; line-height:1.6; color:#c9d1d9}
  pre .c{color:#6e7681}
  .kw{color:var(--accent); font-weight:600}
  ul,ol{margin:10px 0; padding-left:24px}
  li{margin:6px 0}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin:16px 0}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .box{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 14px}
  .box b{color:var(--accent2)}
  .callout{border-left:4px solid var(--accent); background:var(--panel); padding:12px 16px; border-radius:0 10px 10px 0; margin:16px 0}
  .callout.why{border-color:var(--blue)}
  .callout.mistake{border-color:var(--red)}
  .callout.best{border-color:var(--green)}
  .callout.behind{border-color:var(--purple)}
  .callout .tag{font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; display:inline-block; margin-bottom:4px}
  .callout.why .tag{color:var(--blue)}
  .callout.mistake .tag{color:var(--red)}
  .callout.best .tag{color:var(--green)}
  .callout.behind .tag{color:var(--purple)}
  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:14.5px}
  th,td{border:1px solid var(--border); padding:9px 12px; text-align:left; vertical-align:top}
  th{background:var(--panel2); color:var(--accent2)}
  .diagram{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:18px; margin:16px 0; overflow-x:auto}
  .diagram pre{border:none; background:transparent; padding:0; color:#cbd5e1}
  .viz{background:var(--code-bg); border:1px solid var(--border); border-radius:12px; padding:20px 18px 12px; margin:18px 0}
  .viz svg{width:100%; height:auto; display:block; overflow:visible}
  .viz figcaption{color:var(--muted); font-size:13px; margin-top:10px; text-align:center; line-height:1.5}
  .viz text{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  .viz .bn{font-family:"Hind Siliguri","Noto Sans Bengali",".SF Bangla",sans-serif}
  .badge{display:inline-block; font-size:12px; padding:2px 9px; border-radius:20px; background:var(--panel2); color:var(--muted); border:1px solid var(--border); margin-right:6px}
  hr{border:none; border-top:1px solid var(--border); margin:28px 0}
  .footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--border); color:var(--muted); font-size:13px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px}
  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:100%;flex:none;height:auto;position:static}
    .main{padding:24px 18px 60px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <a href="index.html" style="display:inline-block;color:var(--muted);text-decoration:none;font-size:12.5px;margin-bottom:10px">← সব টপিক (Dashboard)</a>
      <h1>⚛️ Modern React Mastery</h1>
      <p>Beginner → Advanced • বাংলায়</p>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
const pages = [
  {id:"foundations",   icon:"⚛️", title:"React Foundations — JSX, Components, Rendering"},
  {id:"hooks",         icon:"🪝", title:"Hooks Foundations — useState, useEffect"},
  {id:"advhooks",      icon:"🧠", title:"Advanced Hooks — useMemo, useCallback, useRef, Custom Hooks"},
  {id:"context",       icon:"🌐", title:"Context API ও State Lifting"},
  {id:"statemgmt",     icon:"🗃️", title:"State Management at Scale — Redux Toolkit, Zustand"},
  {id:"datafetch",     icon:"📡", title:"Data Fetching — React Query, SWR"},
  {id:"routing",       icon:"🧭", title:"React Router"},
  {id:"performance",   icon:"⚡", title:"Performance Optimization"},
  {id:"servercomp",    icon:"🖥️", title:"Server Components ও Next.js App Router"},
  {id:"forms",         icon:"📝", title:"Forms ও Validation"},
  {id:"testing",       icon:"🧪", title:"Testing — React Testing Library, Jest"},
  {id:"patterns",      icon:"🧩", title:"Component Design Patterns"},
  {id:"a11y",          icon:"♿", title:"Accessibility ও Styling"},
  {id:"production",    icon:"🚀", title:"Production Concerns"},
];
</script>

<!-- ============================ CONTENT ============================ -->

<!--CHAPTER_SLOT-->

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
</body>
</html>
