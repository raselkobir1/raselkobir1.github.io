<h3>১) Virtual DOM কী, আর এটা কেন দরকার?</h3>
<p><b>ব্যাখ্যা:</b> Virtual DOM হলো real DOM-এর একটা lightweight in-memory JS object representation। State বদলালে React সরাসরি real DOM manipulate করে না — প্রথমে নতুন virtual DOM tree বানায়, আগেরটার সাথে diff করে, তারপর শুধু বদলানো অংশটুকু real DOM-এ প্রয়োগ করে (Foundations অধ্যায়ে বিস্তারিত)। Real DOM manipulation ব্যয়বহুল (layout/reflow trigger করে) — তাই সরাসরি DOM বদলানোর বদলে প্রথমে সস্তা JS object তুলনা করে শুধু প্রয়োজনীয় ন্যূনতম DOM update করাই এর মূল কারণ।</p>

<h3>২) useState-এর পরিবর্তন কি synchronous?</h3>
<pre>function Example() {
  const [count, setCount] = useState(0);
  function handleClick() {
    setCount(count + 1);
    console.log(count);   <span class="c">// এখনো পুরনো মান দেখাবে, বদলানো মান নয়</span>
  }
}</pre>
<p><b>ব্যাখ্যা:</b> না। <code>setCount</code> কল করলে React একটা re-render <b>schedule</b> করে — সেই মুহূর্তেই <code>count</code> variable বদলায় না, পরের render-এ নতুন মান পাওয়া যায়। React 18-এ সব ইভেন্টেই একাধিক <code>setState</code> কল একসাথে batch হয়ে একটাই re-render trigger করে।</p>

<h3>৩) useEffect-এর dependency array খালি ([]) রাখলে কী হয়, আর একেবারে বাদ দিলে কী হয়?</h3>
<pre>useEffect(() =&gt; { console.log("A"); });        <span class="c">// প্রতিটা render-এর পরে চলে</span>
useEffect(() =&gt; { console.log("B"); }, []);    <span class="c">// শুধু প্রথম render-এর পরে (mount) চলে</span>
useEffect(() =&gt; { console.log("C"); }, [x]);   <span class="c">// mount + x বদলালে চলে</span></pre>
<p><b>ব্যাখ্যা:</b> Dependency array বাদ দিলে effect প্রতিটা render-এর পরেই চলে — প্রায় সবসময় অনিচ্ছাকৃত। খালি <code>[]</code> মানে effect শুধু একবার, mount হওয়ার পরে চলবে। একটা array-তে variable থাকলে, শুধু সেগুলোর যেকোনো একটা বদলালে effect আবার চলবে।</p>

<h3>৪) Controlled বনাম Uncontrolled Component — পার্থক্য কী?</h3>
<p><b>ব্যাখ্যা:</b> Controlled component-এ input-এর value React state দিয়ে নিয়ন্ত্রিত (<code>value={state}</code> + <code>onChange</code>) — React-ই "single source of truth"। Uncontrolled component-এ DOM নিজেই value ধরে রাখে, React শুধু <code>ref</code> দিয়ে প্রয়োজনে সেটা পড়ে (Forms অধ্যায়ে বিস্তারিত)। Controlled component প্রতিটা keystroke-এ validation/conditional logic চালানো সহজ করে, কিন্তু বড় form-এ বেশি re-render ঘটায়।</p>

<h3>৫) key prop কেন দরকার, আর index কে key হিসেবে ব্যবহার করলে কী সমস্যা হতে পারে?</h3>
<pre><span class="c">// list পুনর্বিন্যস্ত/filter হলে index-ভিত্তিক key ভুল component-এ ভুল state আটকে দিতে পারে</span>
items.map((item, index) =&gt; &lt;TodoItem key={index} item={item} /&gt;)   <span class="c">// ঝুঁকিপূর্ণ</span>
items.map((item) =&gt; &lt;TodoItem key={item.id} item={item} /&gt;)        <span class="c">// নিরাপদ</span></pre>
<p><b>ব্যাখ্যা:</b> React <code>key</code> ব্যবহার করে বোঝে কোন list item কোনটার সাথে "একই পরিচয়ের" (identity) — যাতে re-render-এ সঠিক DOM node/component state পুনর্ব্যবহার করতে পারে। Index পজিশন বোঝায়, item-এর identity নয় — list পুনর্বিন্যস্ত হলে ভুল item-এর সাথে ভুল internal state (যেমন input-এর টাইপ করা টেক্সট) লেগে যেতে পারে।</p>

<h3>৬) useMemo আর useCallback-এর মধ্যে পার্থক্য কী?</h3>
<pre>const memoizedValue = useMemo(() =&gt; computeExpensive(a, b), [a, b]);   <span class="c">// একটা VALUE মেমোইজ করে</span>
const memoizedFn = useCallback(() =&gt; doSomething(a, b), [a, b]);       <span class="c">// একটা FUNCTION REFERENCE মেমোইজ করে</span>
<span class="c">// useCallback(fn, deps) আসলে useMemo(() =&gt; fn, deps)-এর সমতুল্য</span></pre>
<p><b>ব্যাখ্যা:</b> <code>useMemo</code> একটা গণনার <b>ফলাফল</b> (value) মেমোইজ করে — dependency না বদলালে আবার গণনা না করে আগের ফলাফল ফেরত দেয়। <code>useCallback</code> একটা <b>function</b>-এর reference মেমোইজ করে, যাতে dependency না বদলালে প্রতিটা render-এ নতুন function object তৈরি না হয় (Advanced Hooks অধ্যায়ে referential equality আলোচনা দেখুন)।</p>

<h3>৭) React.memo কীভাবে কাজ করে, আর কেন এটা সবসময় re-render আটকায় না?</h3>
<pre>const Row = React.memo(function Row({ user }) { return &lt;li&gt;{user.name}&lt;/li&gt;; });
<span class="c">// prop হিসেবে { name: "Alice" } প্রতিবার নতুন object পাঠালে, React.memo তবু re-render করবে</span>
&lt;Row user={{ name: "Alice" }} /&gt;   <span class="c">// প্রতি parent render-এ নতুন object reference — memo কাজ করবে না</span></pre>
<p><b>ব্যাখ্যা:</b> <code>React.memo</code> আগের ও নতুন prop-এর shallow comparison (<code>===</code>) করে — সব prop অপরিবর্তিত থাকলেই re-render skip করে। কিন্তু object/array/function prop প্রতি render-এ নতুন reference হলে (parent-এ inline তৈরি করলে), shallow comparison সবসময় "বদলেছে" দেখাবে — তখন <code>useMemo</code>/<code>useCallback</code> দিয়ে parent-এ সেই prop-কে স্থির রাখা লাগবে।</p>

<h3>৮) Rules of Hooks কী, আর এগুলো ভাঙলে কী সমস্যা হয়?</h3>
<p><b>ব্যাখ্যা:</b> দুইটা নিয়ম — (১) hook শুধু top level-এ কল করা যাবে, কোনো condition/loop/nested function-এর ভেতরে নয়, আর (২) হুক শুধু React function component বা custom hook-এর ভেতর থেকে কল করা যাবে। React hooks-এর state কল করার <b>ক্রম</b> অনুযায়ী track করে — একটা render-এ condition-এর কারণে কোনো hook skip হয়ে গেলে, পরের সব hook-এর internal index শিফট হয়ে ভুল state ভুল hook-এর সাথে মিলে যায় (Advanced Hooks অধ্যায়ে বিস্তারিত)।</p>

<h3>৯) Context ব্যবহার করলে কি সব consumer re-render হয়?</h3>
<p><b>ব্যাখ্যা:</b> হ্যাঁ — Context value বদলালে সেই Context-এর <b>প্রতিটা</b> consumer re-render হয়, এমনকি সে value-এর যে অংশ ব্যবহার করে সেটা না বদলালেও। এজন্য ঘন ঘন বদলানো ও কম ঘন ঘন বদলানো ডেটা আলাদা Context-এ রাখা উচিত, আর সত্যিকারের fine-grained subscription দরকার হলে Redux/Zustand-এর মতো selector-ভিত্তিক library বেছে নেওয়া ভালো (Context ও State Management অধ্যায়ে বিস্তারিত)।</p>

<h3>১০) React 18-এর Concurrent Rendering আসলে কী সমাধান করে?</h3>
<p><b>ব্যাখ্যা:</b> Concurrent rendering React-কে একটা render কাজ মাঝপথে <b>থামিয়ে</b>, বেশি priority-এর কাজ (যেমন একটা input-এ keystroke) আগে সেরে, তারপর আগের render আবার শুরু/বাতিল করার ক্ষমতা দেয় — Fiber architecture-এর কারণে সম্ভব (Foundations অধ্যায়ে আলোচিত)। <code>useTransition</code>/<code>startTransition</code> দিয়ে ডেভেলপার একটা আপডেটকে "non-urgent" চিহ্নিত করতে পারেন, যাতে বড় list filter/sort হওয়ার সময়ও input typing responsive থাকে।</p>

<h3>১১) useLayoutEffect কখন useEffect-এর বদলে ব্যবহার করা উচিত?</h3>
<p><b>ব্যাখ্যা:</b> যখন DOM measurement (যেমন একটা element-এর height/width মাপা) করে সেই তথ্যের ওপর ভিত্তি করে সাথে সাথে আরেকটা DOM mutation করতে হয়, যাতে ব্যবহারকারী কোনো visual flicker/jump না দেখেন — যেমন একটা tooltip-কে viewport-এর মধ্যে থাকার জন্য reposition করা। <code>useEffect</code> browser paint-এর পরে চলে (flicker দেখা যেতে পারে), <code>useLayoutEffect</code> paint-এর আগে, synchronously চলে (Hooks Foundations অধ্যায়ে বিস্তারিত)।</p>

<h3>১২) React Server Component-এ useState/useEffect ব্যবহার করা যায় না কেন?</h3>
<p><b>ব্যাখ্যা:</b> Server Component শুধু সার্ভারে একবার render হয় HTML তৈরি করার জন্য — client-এ কোনো JS bundle পাঠানো হয় না, তাই সেখানে কোনো "পরবর্তী re-render" বা browser event-ই নেই যার জন্য state/effect দরকার হতে পারে। Interactivity (state, click handler) দরকার হলে সেই অংশটুকু আলাদা <code>"use client"</code> Component হিসেবে বের করে নিতে হয় (Server Components অধ্যায়ে বিস্তারিত)।</p>

<h3>১৩) একটা Custom Hook লিখুন যা window resize track করে</h3>
<pre>function useWindowSize() {
  const [size, setSize] = useState({ width: window.innerWidth, height: window.innerHeight });

  useEffect(() =&gt; {
    function handleResize() {
      setSize({ width: window.innerWidth, height: window.innerHeight });
    }
    window.addEventListener("resize", handleResize);
    return () =&gt; window.removeEventListener("resize", handleResize);   <span class="c">// cleanup — leak এড়ানো</span>
  }, []);

  return size;
}

<span class="c">// ব্যবহার</span>
function ResponsiveComponent() {
  const { width } = useWindowSize();
  return &lt;p&gt;{width &lt; 768 ? "Mobile view" : "Desktop view"}&lt;/p&gt;;
}</pre>
<p><b>ব্যাখ্যা:</b> এই প্রশ্নে interviewer দেখতে চান — dependency array সঠিক (<code>[]</code>, কারণ listener একবারই বসানো দরকার), cleanup function আছে কিনা (না থাকলে প্রতিবার re-mount-এ নতুন listener জমতে থাকবে — memory leak), আর hook নামকরণ কনভেনশন (<code>use</code> prefix) মানা হয়েছে কিনা।</p>

<h3>১৪) useState থাকতে useReducer কবে বেছে নেবেন?</h3>
<pre><span class="c">// একাধিক sub-value একসাথে, নির্দিষ্ট নিয়মে বদলাচ্ছে — useReducer এখানে যুক্তি এক জায়গায় জড়ো করে</span>
function cartReducer(state, action) {
  switch (action.type) {
    case "add":    return { ...state, items: [...state.items, action.item] };
    case "remove": return { ...state, items: state.items.filter(i =&gt; i.id !== action.id) };
    default: return state;
  }
}
const [state, dispatch] = useReducer(cartReducer, { items: [] });</pre>
<p><b>ব্যাখ্যা:</b> একটা স্বাধীন, সরল মান (boolean toggle, একটা input value) হলে <code>useState</code>-ই যথেষ্ট। কিন্তু যখন state-এর একাধিক sub-value একই action-এ একসাথে, নির্দিষ্ট নিয়মে বদলানো দরকার হয়, তখন আলাদা আলাদা <code>useState</code> রাখলে "কোন state কীভাবে বদলাবে" এই যুক্তি component জুড়ে ছড়িয়ে পড়ে। <code>useReducer</code> এই পুরো update logic-কে একটা pure reducer function-এ কেন্দ্রীভূত করে — অনেকটা Redux-এর reducer প্যাটার্ন, কিন্তু কোনো external library ছাড়াই (Advanced Hooks অধ্যায়ে বিস্তারিত)।</p>

<h3>১৫) "Text content does not match server-rendered HTML" — এই hydration mismatch error কেন হয়, আর কীভাবে ঠিক করবেন?</h3>
<pre><span class="c">// ❌ সার্ভার আর ক্লায়েন্ট প্রথম render-এ ভিন্ন ফলাফল দিচ্ছে</span>
function Clock() {
  return &lt;p&gt;{new Date().toLocaleTimeString()}&lt;/p&gt;;   <span class="c">// সার্ভারের সময় ≠ ব্রাউজারে hydrate হওয়ার সময়</span>
}

<span class="c">// ✅ প্রথম render দুই জায়গাতেই এক রাখা — সময়-নির্ভর মান mount-এর পরে সেট করা</span>
function Clock() {
  const [time, setTime] = useState(null);
  useEffect(() =&gt; { setTime(new Date().toLocaleTimeString()); }, []);
  return &lt;p&gt;{time ?? "--:--:--"}&lt;/p&gt;;
}</pre>
<p><b>ব্যাখ্যা:</b> React আশা করে সার্ভারে render হওয়া HTML আর ক্লায়েন্টে hydrate করার সময় প্রথম render-এর ফলাফল একই হবে। <code>new Date()</code>, <code>Math.random()</code>, বা সরাসরি <code>typeof window !== "undefined"</code>-এর মতো কিছু render-এর ভেতরে ব্যবহার করলে সার্ভার আর ক্লায়েন্ট ভিন্ন আউটপুট দেয়, ফলে React mismatch warning/error দেখায়। সমাধান — এমন ডেটা render-এ সরাসরি না বসিয়ে <code>useEffect</code>-এ (যা শুধু client-এ, mount-এর পরে চলে) সেট করা, যাতে প্রথম render দুই জায়গাতেই অভিন্ন থাকে (Server Components অধ্যায়ে বিস্তারিত)।</p>

<h3>১৬) useTransition আসলে কী সমস্যা সমাধান করে, আর এটা debounce থেকে আলাদা কীভাবে?</h3>
<pre>const [isPending, startTransition] = useTransition();
function handleChange(e) {
  setQuery(e.target.value);              <span class="c">// urgent — সাথে সাথে দেখানো লাগবে</span>
  startTransition(() =&gt; {
    setFiltered(allProducts.filter(p =&gt; p.name.includes(e.target.value)));  <span class="c">// non-urgent</span>
  });
}</pre>
<p><b>ব্যাখ্যা:</b> একটা ভারী update (বড় list filter/sort)-কে "non-urgent" চিহ্নিত করে দিলে React সেটাকে interruptible রাখে — input typing-এর responsiveness বজায় থাকে, কারণ নতুন urgent update এলে চলমান non-urgent render বাতিল করে আবার শুরু হয়। Debounce-এ filter শুরু হতেই একটা fixed delay (যেমন ৩০০ms) অপেক্ষা করতে হয়, টাইপ করা থামার পরেই; <code>startTransition</code>-এ filter সাথে সাথেই শুরু হয় কিন্তু কখনো input-কে block করে না — আর <code>isPending</code> দিয়ে হালকা loading ইঙ্গিতও দেখানো যায় (Performance অধ্যায়ে বিস্তারিত)।</p>

<h3>১৭) React Router-এর data router-এ loader ব্যবহার করলে কী সুবিধা পাওয়া যায়?</h3>
<pre>{
  path: "products/:productId",
  element: &lt;ProductDetail /&gt;,
  loader: async ({ params }) =&gt; fetch(`/api/products/${params.productId}`).then(r =&gt; r.json()),
}
<span class="c">// component-এ</span>
function ProductDetail() {
  const product = useLoaderData();   <span class="c">// render হওয়ার আগেই ডেটা প্রস্তুত</span>
  return &lt;h2&gt;{product.name}&lt;/h2&gt;;
}</pre>
<p><b>ব্যাখ্যা:</b> পুরনো প্যাটার্নে component আগে mount হয়ে <code>useEffect</code>-এ fetch শুরু করে — UI প্রথমে খালি/loading অবস্থায় render হয়, তারপর ডেটা এলে আবার render হয় ("render-then-fetch")। <code>loader</code> দিয়ে navigation শুরু হওয়ার সাথে সাথেই fetch শুরু হয়ে যায়, component render হয় শুধু ডেটা প্রস্তুত হলে ("fetch-then-render") — এতে loading spinner-এর ঝাপটানি কমে এবং perceived performance ভালো হয় (Routing অধ্যায়ে বিস্তারিত)।</p>

<h3>১৮) useEffect দিয়ে সরাসরি fetch করার বদলে React Query/SWR ব্যবহার করলে কী কী সমস্যা এমনিতেই সমাধান হয়ে যায়?</h3>
<pre><span class="c">// ❌ useEffect fetch — race condition ঝুঁকিপূর্ণ, caching নেই</span>
useEffect(() =&gt; {
  fetch(`/api/users/${userId}`).then(r =&gt; r.json()).then(setUser);
}, [userId]);

<span class="c">// ✅ React Query — caching, race condition handling, retry — সব built-in</span>
const { data: user, isLoading } = useQuery({
  queryKey: ["user", userId],
  queryFn: () =&gt; fetch(`/api/users/${userId}`).then(r =&gt; r.json()),
});</pre>
<p><b>ব্যাখ্যা:</b> ম্যানুয়াল <code>useEffect</code> fetch-এ <code>userId</code> দ্রুত বদলালে পুরনো response পরে ফিরে এসে নতুন state ওভাররাইট করতে পারে (race condition), কোনো caching নেই (একই ডেটার জন্য বারবার fetch), retry/background-refetch লজিক নিজে লিখতে হয়। React Query/SWR <code>queryKey</code>-ভিত্তিক caching, deduplication, স্বয়ংক্রিয় race-condition handling, আর retry-with-backoff বিল্ট-ইন দেয় — "server state" ব্যবস্থাপনাকে একটা সমাধান করা সমস্যা হিসেবে দেখে (Data Fetching অধ্যায়ে বিস্তারিত)।</p>

<h3>১৯) Testing Library-তে getByRole/getByLabelText রেখে সবসময় data-testid ব্যবহার না করার পরামর্শ কেন দেওয়া হয়?</h3>
<pre><span class="c">// ❌ শেষ অবলম্বন হিসেবেই ব্যবহার করা উচিত</span>
screen.getByTestId("submit-btn")

<span class="c">// ✅ ব্যবহারকারী/screen reader যেভাবে element চেনে, সেভাবেই খোঁজা</span>
screen.getByRole("button", { name: /submit/i })</pre>
<p><b>ব্যাখ্যা:</b> RTL-এর দর্শন হলো — "যত বেশি সম্ভব টেস্ট আসল সফটওয়্যার ব্যবহারের সাথে মিলবে, তত বেশি আত্মবিশ্বাস দেবে"। <code>data-testid</code> ব্যবহারকারীর অভিজ্ঞতা থেকে সম্পূর্ণ বিচ্ছিন্ন একটা attribute — একটা বাটনে সঠিক <code>aria-label</code> না থাকলেও testid দিয়ে টেস্ট পাস করে যাবে, অথচ screen reader ব্যবহারকারী সেটা বুঝতে পারবেন না। <code>getByRole</code>/<code>getByLabelText</code> প্রথমে ব্যবহার করলে টেস্টই accessibility-এর একটা checker হিসেবে কাজ করে (Testing অধ্যায়ে বিস্তারিত)।</p>

<h3>২০) Compound Components প্যাটার্ন কী সমস্যা সমাধান করে?</h3>
<pre>&lt;Tabs defaultValue="profile"&gt;
  &lt;Tabs.List&gt;
    &lt;Tabs.Tab value="profile"&gt;Profile&lt;/Tabs.Tab&gt;
    &lt;Tabs.Tab value="settings"&gt;Settings&lt;/Tabs.Tab&gt;
  &lt;/Tabs.List&gt;
  &lt;Tabs.Panel value="profile"&gt;Profile content&lt;/Tabs.Panel&gt;
&lt;/Tabs&gt;</pre>
<p><b>ব্যাখ্যা:</b> এখানে <code>Tabs</code>, <code>Tabs.List</code>, <code>Tabs.Tab</code>, <code>Tabs.Panel</code> Context দিয়ে implicit ভাবে সংযুক্ত, কিন্তু ব্যবহারকারী নিজের ইচ্ছামতো ক্রম ও গঠনে সাজাতে পারেন — একটামাত্র বড়, prop-heavy configuration object-এর বদলে HTML-এর নিজস্ব <code>&lt;select&gt;</code>/<code>&lt;option&gt;</code>-এর মতো flexible composition পাওয়া যায়। এজন্যই বেশিরভাগ headless UI library (Radix, Headless UI) এই প্যাটার্নে বানানো (Patterns অধ্যায়ে বিস্তারিত)।</p>

<h3>২১) Error Boundary এখনো কেন class component হিসেবেই লিখতে হয়, আর পুরো অ্যাপকে একটামাত্র বড় Error Boundary দিয়ে wrap করা কেন ভুল?</h3>
<pre>class ErrorBoundary extends React.Component {
  state = { hasError: false };
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, info) { logErrorToService(error, info); }
  render() { return this.state.hasError ? this.props.fallback : this.props.children; }
}</pre>
<p><b>ব্যাখ্যা:</b> <code>getDerivedStateFromError</code> ও <code>componentDidCatch</code> lifecycle method-এর এখনো কোনো hook সমতুল্য নেই — তাই Error Boundary একমাত্র জায়গা যেখানে class component লেখা বাধ্যতামূলক। পুরো অ্যাপকে একটামাত্র বড় Error Boundary দিয়ে wrap করলে, একটা ছোট widget crash করলেই পুরো পেজ সাদা স্ক্রিন হয়ে যায় — প্রতিটা independent widget/section-কে আলাদা Error Boundary দিয়ে wrap করলে একটা অংশ ভেঙে গেলেও বাকি অ্যাপ স্বাভাবিকভাবে চলতে থাকে (Production Concerns অধ্যায়ে বিস্তারিত)।</p>

<div class="callout best"><span class="tag">Interview-এ সোনালি টিপ</span>
<ul>
<li>"কেন re-render হচ্ছে" জাতীয় প্রশ্ন এলেই → <b>referential equality</b> (object/function/array প্রতি render-এ নতুন reference) নিয়ে ভাবুন।</li>
<li>"State আপডেট আগের state-এর ওপর নির্ভরশীল" শুনলেই → <b>functional update</b> (<code>setX(x =&gt; ...)</code>) মনে করুন।</li>
<li>Effect নিয়ে যেকোনো প্রশ্নে dependency array আর cleanup function দুটোই উল্লেখ করুন — বেশিরভাগ effect-সংক্রান্ত বাগ এই দুইটার একটায় লুকিয়ে থাকে।</li>
<li>"Class component-এ এটা কীভাবে করতেন" প্রশ্ন এলে <code>useEffect</code> ≈ <code>componentDidMount</code> + <code>componentDidUpdate</code> + <code>componentWillUnmount</code> এই সমতুল্যতা মনে রাখুন।</li>
</ul>

<!-- ============================ RENDER ============================ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  const searchIndex = {};
  (function buildIndex(){
    const tmp = document.createElement('div');
    pages.forEach(p=>{
      tmp.innerHTML = templates[p.id] || '';
      searchIndex[p.id] = ((p.title||'') + ' ' + tmp.textContent).toLowerCase();
    });
  })();

  let currentQuery = '';

  function clearHighlights(root){
    root.querySelectorAll('mark.hl').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
  }

  function highlightIn(root, q){
    if(!q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentNode;
        if(!node.nodeValue || !p || p.tagName==='SCRIPT' || p.tagName==='STYLE' || p.tagName==='MARK') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    const ql = q.toLowerCase();
    nodes.forEach(node=>{
      const text = node.nodeValue, lower = text.toLowerCase();
      if(!lower.includes(ql)) return;
      const frag = document.createDocumentFragment();
      let idx=0, pos;
      while((pos = lower.indexOf(ql, idx)) !== -1){
        if(pos>idx) frag.appendChild(document.createTextNode(text.slice(idx,pos)));
        const mark = document.createElement('mark');
        mark.className='hl';
        mark.textContent = text.slice(pos, pos+ql.length);
        frag.appendChild(mark);
        idx = pos+ql.length;
      }
      if(idx<text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function applyHighlight(){
    const active = main.querySelector('.page.active');
    if(!active) return;
    clearHighlights(active);
    if(currentQuery) highlightIn(active, currentQuery);
  }

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    applyHighlight();
    const active = main.querySelector('.page.active');
    const firstMark = active ? active.querySelector('mark.hl') : null;
    if(firstMark && firstMark.scrollIntoView) firstMark.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const searchInput = document.getElementById('courseSearch');
  const searchMeta = document.getElementById('searchMeta');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim();
      currentQuery = q;
      const ql = q.toLowerCase();
      let matchCount = 0, firstMatch = null;
      pages.forEach(p=>{
        const btn = sidebar.querySelector('.navbtn[data-target="'+p.id+'"]');
        const matches = !ql || searchIndex[p.id].includes(ql);
        if(matches){ matchCount++; if(!firstMatch) firstMatch = p; }
        if(btn) btn.classList.toggle('hide', !matches);
      });
      if(!ql) searchMeta.textContent = '';
      else if(matchCount===0) searchMeta.textContent = 'কোনো ফলাফল নেই';
      else searchMeta.textContent = matchCount + 'টা অধ্যায়ে ফলাফল পাওয়া গেছে';

      const active = main.querySelector('.page.active');
      const activeId = active ? active.id.replace('page-','') : null;
      const activeMatches = !!(ql && activeId && searchIndex[activeId] && searchIndex[activeId].includes(ql));
      if(ql && !activeMatches && firstMatch){
        show(firstMatch.id);
      } else {
        applyHighlight();
        const mark = active ? active.querySelector('mark.hl') : null;
        if(ql && mark && mark.scrollIntoView) mark.scrollIntoView({block:'center'});
      }
    });
    searchInput.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
  }

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="global-search.js"></script>
</body>
