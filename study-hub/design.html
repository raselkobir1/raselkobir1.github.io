<h3>State pattern প্রবর্তনের সংকেত</h3>
<p>প্রতিটা enum-driven object-এর জন্যই State pattern দরকার হয় না — একটা সাধারণ <code>if (status == "Active")</code> চেক-এর জন্য পুরো class hierarchy বানানো over-engineering। State pattern প্রবর্তনের বাস্তব সংকেত:</p>
<div class="grid2">
<div class="box"><b>একই enum-এর উপর switch/if-else ৩+ জায়গায় ছড়িয়ে</b> — controller, background job, reporting query — সবখানে একই transition-logic পুনরাবৃত্তি হচ্ছে, আর একটা নতুন state যোগ করলে সবগুলো জায়গা মনে করে আপডেট করতে হয়।</div>
<div class="box"><b>"অবৈধ transition" বাগ প্রোডাকশনে ধরা পড়ছে</b> — যেমন একটা Cancelled অর্ডার আবার Ship হয়ে গেছে, কারণ কোথাও একটা switch-এ সেই case handle করতে ভুলে গেছেন। State pattern-এ এই ভুল compile-time বা প্রথম রানেই throw করে ধরা পড়ে, প্রোডাকশনে সাইলেন্টলি না।</div>
</div>

<h3>Mediator — many-to-many নির্ভরতাকে এক hub-এ কেন্দ্রীভূত করা</h3>
<p><span class="kw">Mediator</span> pattern একটা object সংজ্ঞায়িত করে যেটা একগুচ্ছ অন্য object কীভাবে পরস্পরের সাথে interact করবে তা এনক্যাপসুলেট করে — ফলে সেই object-গুলো একে অপরকে সরাসরি reference করে না। এটা এড়ায় একটা জট পাকানো many-to-many dependency web, যেখানে N-টা object-এর প্রতিটা বাকি N-1টার সাথে সরাসরি যুক্ত।</p>
<div class="diagram"><pre>
আগে (direct references)         পরে (Mediator দিয়ে)

  A ---- B                            A     B
  |\    /|                             \   /
  | \  / |                              \ /
  |  \/  |                              M  ← IMediator
  |  /\  |                              / \
  | /  \ |                             /   \
  C ---- D                            C     D

  প্রতিটা object বাকি সবাইকে      প্রতিটা object শুধু Mediator-কে
  চেনে — N=4 হলে ৬টা সংযোগ        চেনে — N=4 হলে ৪টা সংযোগ,
  (jটা পরিবর্তনে অনেক জায়গা)      নতুন object যোগ করা সস্তা
</pre></div>
<pre>public interface IChatMediator
{
    void Send(string message, Participant sender);
    void Register(Participant participant);
}

public class ChatRoom : IChatMediator
{
    private readonly List&lt;Participant&gt; _participants = new();

    public void Register(Participant p) =&gt; _participants.Add(p);

    public void Send(string message, Participant sender)
    {
        foreach (var p in _participants)
            if (p != sender)
                p.Receive(message, sender.Name); // Participant একে অপরকে চেনে না
    }
}

public class Participant
{
    private readonly IChatMediator _mediator;
    public string Name { get; }

    public Participant(string name, IChatMediator mediator)
    {
        Name = name; _mediator = mediator;
        _mediator.Register(this);
    }

    public void Send(string message) =&gt; _mediator.Send(message, this);
    public void Receive(string message, string from) =&gt; Console.WriteLine($"{from} → {Name}: {message}");
}</pre>
<p>কোনো <code>Participant</code>-ই আরেকটা <code>Participant</code>-এর reference রাখে না — সবাই শুধু <code>IChatMediator</code>-কে চেনে। নতুন participant যোগ করা, বা broadcast logic (mute, rate-limit, filtering) বদলানো — সব এক জায়গায়।</p>

<div class="callout behind"><span class="tag">.NET-এ বাস্তব উদাহরণ — MediatR</span>
.NET ইকোসিস্টেমে Mediator pattern-এর সবচেয়ে পরিচিত রূপ হলো <b>MediatR</b> লাইব্রেরি — একটা in-process request/response ও notification mediator, যা ASP.NET Core-এ CQRS-স্টাইল architecture-এর সাথে ব্যাপকভাবে ব্যবহৃত হয়। একটা controller action <code>IMediator.Send(new CreateOrderCommand(...))</code> কল করে — controller-টা জানে না কোন handler class আসলে অনুরোধটা পূরণ করবে, শুধু mediator-এর কাছে পাঠিয়ে দেয়, mediator সঠিক handler খুঁজে ডেকে দেয়।
<br/><br/>
এখানে চ্যাপ্টার ১০-এর সাথে একটা সরাসরি যোগসূত্র আছে: MediatR-এ পাঠানো প্রতিটা <code>CreateOrderCommand</code>, <code>GetOrderQuery</code> ইত্যাদি আসলে একটা <span class="kw">Command object</span> (চ্যাপ্টার ১০) — request-টাকেই একটা প্রথম-শ্রেণির object বানানো হয়েছে — যা একটা <span class="kw">Mediator</span>-এর মধ্য দিয়ে dispatch হচ্ছে। দুইটা pattern একসাথে মিলে MediatR-এর মূল আর্কিটেকচার তৈরি করে।
</div>

<div class="callout mistake"><span class="tag">Mediator যখন নীরবে God Object হয়ে যায়</span>
Mediator pattern-এর সবচেয়ে বড় ঝুঁকি: এটা <b>coordinate</b> করার কথা, কিন্তু ধীরে ধীরে যদি প্রতিটা interaction-এর সমস্ত business logic নিজের ভেতরেই লিখে ফেলা হয় — validation, persistence, notification, external API call, সব — তাহলে <code>ChatRoom</code> বা কোনো "OrderMediator" ক্লাসটা নিজেই একটা বিশাল, সব-জানা, সব-করা <b>God Object</b>-এ পরিণত হয়। তখন যে সমস্যাটা এড়াতে Mediator আনা হয়েছিল (একটা কেন্দ্রীয়, সবকিছুর সাথে যুক্ত bottleneck) — সেটাই আবার ফিরে আসে, শুধু নাম বদলে। পরবর্তী চ্যাপ্টার (১২, Anti-patterns)-এ আমরা এই God Object অ্যান্টি-প্যাটার্নটা বিস্তারিত দেখব — মনে রাখবেন: Mediator শুধু "কে কার সাথে কথা বলবে" ঠিক করে দেয়, প্রতিটা conversation-এর ভেতরের ব্যবসায়িক নিয়ম আলাদা, ছোট, single-responsibility class/handler-এ রাখা উচিত।
</div>

<h3>তিনটার তুলনা — কোনটা কখন</h3>
<table>
<tr><th>Pattern</th><th>কী পরিবর্তনশীল</th><th>মেকানিজম</th><th>.NET-এ চেনা উদাহরণ</th></tr>
<tr><td><span class="kw">Template Method</span></td><td>algorithm-এর নির্দিষ্ট কিছু ধাপ — সামগ্রিক ক্রম fixed ও shared</td><td>Inheritance (abstract/virtual method override)</td><td>Abstract base class-এ fixed lifecycle, subclass শুধু নির্দিষ্ট hook override করে (যেমন কাস্টম <code>ControllerBase</code>-জাতীয় base class-এর overridable step)</td></tr>
<tr><td><span class="kw">State</span></td><td>একই object-এর সময়ের সাথে বদলানো আচরণ — internal state অনুযায়ী</td><td>Composition — context বর্তমান state object-এর কাছে delegate করে, state object পরবর্তী state রিটার্ন করে</td><td>Order/workflow state machine (<code>PendingState</code>/<code>PaidState</code>/<code>ShippedState</code>-জাতীয় class), বা built-in <code>System.Threading.Tasks.Task</code>-এর internal state transitions</td></tr>
<tr><td><span class="kw">Mediator</span></td><td>N-টা object-এর মধ্যে interaction/communication</td><td>Composition — সবাই এক central object-কে reference করে, একে অপরকে নয়</td><td>MediatR (in-process CQRS request/notification dispatch)</td></tr>
</table>

<h3>একসাথে কখন ব্যবহৃত হয়</h3>
<div class="card">
<div class="grid2">
<div class="box"><b>State + Strategy</b> — কাঠামোগতভাবে প্রায় অভিন্ন (উভয়েই context একটা interface-এর মাধ্যমে composed object-এর কাছে delegate করে) — পার্থক্য <i>intent</i>-এ: Strategy-তে caller সচেতনভাবে algorithm বেছে দেয়, State-এ transition-টা object নিজেই তার internal logic-এ ঘটায় এবং caller সাধারণত জানেই না কোন state active।</div>
<div class="box"><b>Mediator + Observer</b> — একটা Mediator প্রায়ই ভেতরে Observer ব্যবহার করে broadcast করতে (যেমন <code>ChatRoom.Send</code> সব participant-কে notify করা আসলে একটা one-to-many broadcast) — কিন্তু Mediator যোগ করে একটা কেন্দ্রীয় নিয়ন্ত্রণ বিন্দু, যেখানে pure Observer-এ publisher সরাসরি subscriber-দের তালিকা রাখে।</div>
<div class="box"><b>Command + Mediator</b> — MediatR ঠিক এই সংমিশ্রণ: request object (Command) + dispatch hub (Mediator)। প্রতিটা handler decoupled, testable, আর নতুন handler যোগ করা existing কোড স্পর্শ না করেই সম্ভব (Open/Closed)।</div>
<div class="box"><b>Template Method + Strategy একসাথে</b> — বাস্তব কোডে প্রায়ই একটা Template Method-এর ভেতরের একটা নির্দিষ্ট ধাপ নিজেই একটা Strategy হয় — যেমন <code>DataImporter.Validate()</code> hook একটা injected <code>IValidationStrategy</code>-কে delegate করতে পারে, inheritance আর composition একসাথে।</div>
</div>
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>

<tr><td rowspan="4"><b>Structural</b> (৯)</td><td><span class="kw">Adapter</span></td><td>একটা বেমানান interface-কে caller-এর প্রত্যাশিত interface-এ ট্রান্সলেট করে</td></tr>
<tr><td><span class="kw">Decorator</span></td><td>runtime-এ একটা object-কে নতুন responsibility দিয়ে wrap করে, তার class না বদলিয়ে</td></tr>
<tr><td><span class="kw">Facade</span></td><td>একটা জটিল subsystem-এর সামনে একটা সরল, একক entry-point interface দেয়</td></tr>
<tr><td><span class="kw">Proxy</span></td><td>আসল object-এর জায়গায় একটা placeholder বসায় — access নিয়ন্ত্রণ, lazy-loading, বা caching-এর জন্য</td></tr>

<tr><td><span class="kw">Observer</span></td><td>এক-থেকে-বহু নির্ভরতা তৈরি করে — একটা object বদলালে সব dependent স্বয়ংক্রিয়ভাবে notified হয়</td></tr>

এই এগারোটা pattern কোনোটাই "সবসময় ব্যবহার করো" এর তালিকা না — প্রতিটাই একটা নির্দিষ্ট চাপের (pressure) উত্তর, আর ভুল জায়গায় প্রয়োগ করলে সেটাই জটিলতা বাড়ায়, কমায় না। ঠিক এই অতি-উৎসাহ থেকেই জন্ম নেয় <b>anti-pattern</b> — pattern নিজেই ভুল না, কিন্তু "pattern-এর জন্য pattern" বসিয়ে দেওয়া, বা Mediator-এর মতো একটা pattern-কে God Object বানিয়ে ফেলা। পরবর্তী চ্যাপ্টার (১২)-এ আমরা দেখব সবচেয়ে সাধারণ anti-pattern ও code smell-গুলো — কীভাবে চিনবেন, আর কীভাবে এই এগারোটা টুল ব্যবহার করেই সেগুলো ঠিক করবেন।

<h2 class="title">১২. Anti-patterns ও Code Smells</h2>
<p class="lead">এই চ্যাপ্টারটা আসলে একটা আয়না — গত এগারোটা চ্যাপ্টারে যা যা শিখেছেন, তার প্রতিটাকেই উল্টো দিক থেকে দেখা। প্রতিটা ভালো নীতি বা প্যাটার্ন, judgment ছাড়া চরম পর্যায়ে প্রয়োগ করলে, নিজেই একটা <span class="kw">code smell</span> বা <span class="kw">anti-pattern</span>-এ পরিণত হয়। SRP অতিরিক্ত টেনে নিয়ে গেলে ভেঙে পড়ে না, বরং SRP অগ্রাহ্য করলে যা হয় সেটাই এখানে ফোকাস — আর OCP/DIP-এর মতো নীতি অতিরিক্ত টেনে ধরলে উল্টো সমস্যা হয়। এই চ্যাপ্টারে আমরা কোর্সজুড়ে যেসব "mistake" callout-এ আভাস দিয়েছিলাম, সেগুলোকেই একত্র করে নাম দিচ্ছি এবং প্রতিটার root cause-কে আগের নির্দিষ্ট চ্যাপ্টারের সাথে যুক্ত করছি।</p>

<h3>কেন Anti-pattern-এর নাম জানা জরুরি</h3>
<p>Anti-pattern মূলত একটা <b>recurring</b> সমাধান যেটা দেখতে সমাধানের মতো লাগে, কিন্তু বাস্তবে সমস্যাটাকেই আরও জটিল করে তোলে। এগুলো চেনার সবচেয়ে বড় সুবিধা টেকনিক্যাল নয় — <b>কালচারাল</b>।</p>
<div class="callout why"><span class="tag">কেন নাম দেওয়া দরকার</span> একটা টিমে যখন কেউ বলে, "এই ক্লাসটা তো <i>god object</i> হয়ে যাচ্ছে" — তখন এটা কারো ব্যক্তিগত সমালোচনা না, এটা একটা shared vocabulary-র রেফারেন্স। কোড রিভিউতে "তোমার কোড খারাপ" বলার চেয়ে "এটা god object pattern-এর দিকে যাচ্ছে, চলো SRP অনুযায়ী ভাগ করি" বলা অনেক নিরাপদ এবং objective। নাম থাকলে আলোচনাটা ব্যক্তি থেকে সরে গিয়ে প্যাটার্নের দিকে যায় — এবং এটাই দলগতভাবে দ্রুত ও কম আবেগঘন কোড রিভিউয়ের চাবিকাঠি।</div>

<h3>God Object / God Class — SRP-এর চরম লঙ্ঘন</h3>
<p><span class="kw">God Object</span> (বা God Class) হলো এমন একটা ক্লাস যেটা প্রায় সবকিছু জানে এবং প্রায় সবকিছু করে। চ্যাপ্টার ৩-এ আমরা <b>Single Responsibility Principle</b> শিখেছিলাম — একটা ক্লাসের পরিবর্তনের একটাই কারণ থাকা উচিত। God Object হলো এই নীতিটা সম্পূর্ণ উপেক্ষা করার চূড়ান্ত ফল।</p>
<div class="card">
<p><b>চেনার লক্ষণ:</b></p>
<ul>
<li>ফাইলে কয়েক হাজার লাইন কোড, কোনো একজন ডেভেলপারও পুরোটা মাথায় রাখতে পারে না</li>
<li>একই ক্লাসে ডজনখানেক সম্পর্কহীন মেথড — order processing, email sending, PDF generation, logging, caching — সব একসাথে</li>
<li>টিমের সবাই এই ক্লাস touch করতে ভয় পায়, কারণ একটা ছোট পরিবর্তনও অপ্রত্যাশিতভাবে অন্য জায়গায় break করে</li>
<li>প্রতিটা নতুন feature request-এর উত্তর হয়ে যায়: "ঐ ক্লাসেই একটা মেথড যোগ করে দাও"</li>

<div class="callout mistake"><span class="tag">রুট কজ</span> কেউ একদিনে বসে ইচ্ছা করে God Object বানায় না। এটা তৈরি হয় শত শত ছোট, individually-reasonable সিদ্ধান্ত থেকে — "আচ্ছা, এই একটা মেথড এখানেই যোগ করে দিই, নতুন ক্লাস বানানোর দরকার নেই।" প্রতিটা সিদ্ধান্ত আলাদাভাবে নিরীহ, কিন্তু কেউ boundary enforce না করলে এই ছোট ছোট compromise জমতে জমতে একটা <span class="badge">SRP ভঙ্গ</span> <span class="badge">high coupling</span> দানব তৈরি হয়।</div>

<p><span class="kw">Spaghetti Code</span> মানে এমন কোড যেখানে control flow এবং object reference এলোমেলোভাবে জড়িয়ে আছে — কোনো স্পষ্ট layer বা structure নেই। এটা সাধারণত তৈরি হয় দুইভাবে: চ্যাপ্টার ৭-এর <b>Dependency Inversion Principle</b> উপেক্ষা করে সরাসরি concrete implementation-এর ওপর নির্ভর করা, আর চ্যাপ্টার ৩-এর SRP উপেক্ষা করে সম্পূর্ণ ভিন্ন ধরনের concern একই মেথডে গুলিয়ে ফেলা।</p>

        }

        <span class="c">// ৪) HTTP response formatting হাতে string জোড়া দিয়ে — controller-এর মধ্যেই</span>
        return "{\"total\": " + total + ", \"email\": \"" + customerEmail + "\"}";
    }
}</pre>
<p>একটা মাত্র মেথডে চারটা সম্পূর্ণ ভিন্ন concern — data access, business rule, notification, presentation — একসাথে মেশানো আছে। কোনো একটা টেস্ট করতে চাইলে বাকি তিনটাকেও সাথে নিয়ে টেস্ট করতে হবে, কারণ কোনো abstraction layer নেই যেটা এদের আলাদা করে।</p>

<h3>Interface-itis ও Over-engineering — YAGNI ভুলে যাওয়া</h3>
<p>চ্যাপ্টার ৪ (OCP) এবং চ্যাপ্টার ৭ (DIP)-এ আমরা abstraction এবং interface-এর গুরুত্ব শিখেছি — কিন্তু সেখানেই সতর্ক করেছিলাম যে এটা অতিরিক্ত প্রয়োগ করলে উল্টো ফল দেয়। <span class="kw">Interface-itis</span> হলো সেই বাড়াবাড়ি: প্রতিটা ক্লাসকে "testability বা flexibility-র জন্য" একটা করে interface দিয়ে wrap করা, যদিও বাস্তবে দ্বিতীয় কোনো implementation কখনো আসবে না।</p>
<div class="diagram"><pre>
Controller
    │
    ▼
IOrderService            ← ইন্টারফেস, ৩ বছরে implementation একটাই: OrderService
    │
    ▼
OrderService : IOrderService
    │
    ▼
IOrderRepository          ← ইন্টারফেস, ৩ বছরে implementation একটাই: OrderRepository
    │
    ▼
OrderRepository : IOrderRepository
    │
    ▼
DbContext

  "একটা SQL query খুঁজে পেতে ৫টা ফাইল আর ৩টা ইন্টারফেস
   পেরিয়ে যেতে হচ্ছে — অথচ কোনোদিনও দ্বিতীয় implementation আসেনি।"
</pre></div>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> এই আচরণের মূলে আছে <span class="kw">YAGNI</span> (<i>You Aren't Gonna Need It</i>) নীতির লঙ্ঘন — "ভবিষ্যতে হয়তো দরকার হবে" ধরে নিয়ে আজকেই সেই flexibility-র দাম দেওয়া। প্রতিটা indirection layer navigation cost বাড়ায়, IDE-তে "Go to Definition" চাপলে ইন্টারফেসে গিয়ে থামে, আসল implementation আরেকবার ক্লিক করে খুঁজতে হয়। আর যেহেতু কোনোদিন দ্বিতীয় implementation আসেই না, পুরো ব্যাপারটার real benefit শূন্য — শুধু বাড়তি navigation cost আর মানসিক load যোগ হয়।</div>

<h3>Singleton Abuse — গ্লোবাল স্টেট, প্যাটার্নের ছদ্মবেশে</h3>
<p>চ্যাপ্টার ৮-এ আমরা <span class="kw">Singleton</span> প্যাটার্ন শিখেছি এবং সতর্ক করেছিলাম এর অপব্যবহার নিয়ে — এখানে সেটাই আনুষ্ঠানিকভাবে নাম দিচ্ছি: <span class="kw">Singleton Abuse</span>। সমস্যাটা প্যাটার্নে না, সমস্যাটা এর misuse-এ — mutable global state-কে "ডিজাইন প্যাটার্ন" নাম দিয়ে জাস্টিফাই করা।</p>
<div class="callout mistake"><span class="tag">দুইটা বাস্তব ক্ষতি</span>
<p><b>১. Test flakiness:</b> Singleton-এর ভেতরের state একটা টেস্ট থেকে আরেকটা টেস্টে leak করে। টেস্ট আলাদাভাবে চালালে pass করে, কিন্তু নির্দিষ্ট ক্রমে চালালে fail করে — কারণ এক টেস্ট singleton-এর state বদলে রেখে যায়, পরের টেস্ট সেই বদলানো state-এর ওপর নির্ভর করে চলে।</p>
<p><b>২. Hidden dependency:</b> একটা মেথডের সিগনেচার দেখে বোঝার কথা তার কী কী লাগবে — কিন্তু <code>OrderService.ProcessOrder(int id)</code> ভেতরে চুপচাপ <code>Logger.Instance</code> বা <code>ConfigManager.Instance</code>-এ হাত ঢোকালে সেই নির্ভরতা সিগনেচারে দেখাই যায় না। মেথডটা টেস্ট করতে গিয়ে বুঝবেন এটা আসলে ৩টা জিনিসের ওপর নির্ভরশীল, কিন্তু সিগনেচার বলছে একটার ওপর।</p>
</div>

<h3>Anemic Domain Model — ক্লাস আছে, কিন্তু encapsulation নেই</h3>
<p>এটা সবচেয়ে বিভ্রান্তিকর anti-pattern, কারণ দেখতে এটা পুরোপুরি OOP মনে হয় — ক্লাস আছে, প্রপার্টি আছে। কিন্তু <span class="kw">Anemic Domain Model</span>-এ ক্লাসগুলো নিছক getter/setter-এর ব্যাগ, আর সব behavior/business logic টেনে বের করে আলাদা "Service" ক্লাসে রাখা হয়। চ্যাপ্টার ১-এ শেখা <b>encapsulation</b>-এর মূল কথাই ছিল: data এবং সেই data-কে নিয়ন্ত্রণকারী behavior একসাথে থাকবে, যাতে object নিজের invariant নিজে রক্ষা করতে পারে। Anemic model সেটা সম্পূর্ণ ভেঙে দেয়।</p>
<div class="grid2">
<div class="box"><b>Anemic (সমস্যাযুক্ত)</b>
<pre>public class Order
{
    public decimal Total { get; set; }
    public OrderStatus Status { get; set; }
    public List&lt;Item&gt; Items { get; set; }
}

public class OrderService
{
    public void ApplyDiscount(Order o, decimal pct)
    {
        <span class="c">// কেউ চাইলেই negative total সেট করে দিতে পারে,</span>
        <span class="c">// Order নিজে কিছুই আটকাচ্ছে না</span>
        o.Total = o.Total - (o.Total * pct);
    }
}</pre>
</div>
<div class="box"><b>Rich Domain Model (সঠিক)</b>
<pre>public class Order
{
    public decimal Total { get; private set; }
    public OrderStatus Status { get; private set; }

    public void ApplyDiscount(decimal pct)
    {
        if (Status == OrderStatus.Shipped)
            throw new InvalidOperationException(
                "শিপড অর্ডারে ডিসকাউন্ট দেওয়া যায় না");
        Total -= Total * pct;   <span class="c">// invariant নিজেই রক্ষা করছে</span>
    }
}</pre>
</div>
</div>
<p>দ্বিতীয় সংস্করণে <span class="kw">rich domain model</span>-এ <code>Order</code> নিজেই নিজের নিয়ম প্রয়োগ করছে — বাইরের কোনো Service চাইলেই invalid state তৈরি করতে পারবে না, কারণ setter-গুলো <code>private</code> এবং একমাত্র পথ হলো ক্লাসের নিজের মেথড। এটাই আসল OOP — শুধু ক্লাস থাকাটা OOP না, ক্লাস নিজের data-কে protect করাটাই OOP।</p>

<h3>Premature Optimization / Premature Abstraction</h3>
<p><span class="kw">Premature Optimization</span> এবং <span class="kw">Premature Abstraction</span> একই মূল ভুলের দুইটা রূপ: এমন flexibility বা performance-এর জন্য ডিজাইন করা যেটার এখনো কোনো প্রমাণিত দরকার নেই — অথচ তার মূল্য দিতে হচ্ছে এখনকার code clarity দিয়ে। Donald Knuth-এর বিখ্যাত উক্তি — "premature optimization is the root of all evil" — শুধু পারফরম্যান্স নিয়ে না, একই যুক্তি abstraction-এর ক্ষেত্রেও খাটে।</p>
<pre><span class="c">// ❌ Premature — মাত্র ১০ জন ইন্টারনাল ইউজারের একটা ছোট টুল, তবু "ভবিষ্যতে scale করতে হতে পারে" ভেবে
// আগে থেকেই একটা পুরো pluggable caching layer, তিনটা eviction strategy, আর metrics reporting বসানো হয়েছে</span>
public interface ICacheEvictionStrategy { void Evict(ICacheStore store); }
public class LruEvictionStrategy : ICacheEvictionStrategy { /* ... */ }
public class LfuEvictionStrategy : ICacheEvictionStrategy { /* ... */ }
public class TtlEvictionStrategy : ICacheEvictionStrategy { /* ... */ }

public class ConfigurableCache
{
    public ConfigurableCache(ICacheStore store, ICacheEvictionStrategy eviction, IMetricsReporter metrics)
    { <span class="c">/* ৪০+ লাইন wiring — তিনটা ইন্টারফেস, একটাই আসল ব্যবহারকারী, কোনোদিন দ্বিতীয় strategy আসেনি */</span> }
}

<span class="c">// ✅ যা আসলে দরকার ছিল — সরল, direct; evidence এলে (আসল load, আসল memory pressure) তখন জটিল করা যাবে</span>
public class SimpleCache
{
    private readonly Dictionary&lt;string, object&gt; _store = new();
    public void Set(string key, object value) => _store[key] = value;
    public object? Get(string key) => _store.TryGetValue(key, out var v) ? v : null;
}</pre>
<div class="callout best"><span class="tag">সঠিক ক্রম</span> Kent Beck-এর নিয়মটা মনে রাখা ভালো: <b>make it work, make it right, then make it fast</b> — এবং একই যুক্তিতে <b>make it flexible</b>ও শেষে আসে। আগে সঠিক আচরণ নিশ্চিত করুন সরল কোডে, তারপর সেটাকে পরিষ্কার করুন, তারপর যদি বাস্তব evidence (প্রোফাইলার ডেটা, actual scale-এর দরকার) দেখায় যে দরকার আছে — তখনই optimize বা generalize করুন। speculation-এর ওপর ভিত্তি করে না, প্রমাণের ওপর ভিত্তি করে।</div>

<h3>স্মেল রাডার — কাপলিং আর কোহিশন চোখে দেখা</h3>
<p>নিচের চিত্রে বাম পাশে একটা God Object দেখানো হয়েছে — একটামাত্র কেন্দ্রীয় ক্লাসের সাথে ৮টা সম্পর্কহীন responsibility জোড়া লাগানো (high coupling, low cohesion)। ডান পাশে সেই একই কার্যকারিতা কয়েকটা ছোট, ফোকাসড ক্লাসে ভাগ করা — প্রতিটার সংযোগ মাত্র ১-২টা (low coupling, high cohesion)।</p>

<div class="card">

<h3>১৩.১ Webhook কী, আর কেন Polling-এর বিকল্প</h3>
<p>ধরুন আপনার অ্যাপ Stripe দিয়ে পেমেন্ট নেয়, আর পেমেন্ট সফল হলেই আপনাকে জানতে হবে। একটা সহজ (কিন্তু খারাপ) সমাধান হলো <span class="kw">Polling</span> — প্রতি কয়েক সেকেন্ড পরপর Stripe-কে জিজ্ঞেস করা "পেমেন্টটা কি হয়ে গেছে? হয়ে গেছে? হয়ে গেছে?"। এতে তিনটা সমস্যা: অনর্থক অসংখ্য request (বেশিরভাগেরই উত্তর "না"), সার্ভার লোড, আর সবচেয়ে গুরুত্বপূর্ণ — <b>latency</b>, কারণ প্রকৃত ঘটনা আর আপনার জানার মধ্যে সবসময় একটা poll-interval ফাঁক থেকেই যায়।</p>
<p><span class="kw">Webhook</span> এই সম্পর্কটা উল্টে দেয় — একে বলা যায় একটা <b>reverse API call</b>। এখানে আপনি কল করেন না; বরং ঘটনাটা ঘটার মুহূর্তেই Stripe নিজে থেকে আপনার একটা HTTP endpoint-এ (যেমন <code>/webhooks/stripe</code>) একটা POST request পাঠায়। GitHub-ও ঠিক এভাবেই কাজ করে — কেউ কোনো repository-তে push করলেই GitHub আপনার configured endpoint-এ event পাঠিয়ে দেয়। আপনি আর জিজ্ঞেস করছেন না; আপনাকে বলে দেওয়া হচ্ছে।</p>

<h3>১৩.২ Webhook বনাম Message Queue — নিরাপত্তার প্রশ্নটা কেন আলাদা</h3>
<p>এই সাইটের Distributed Systems কোর্সে দেখানো async messaging (message queue/broker দিয়ে) আর webhook — দুটোই "event ঘটলে কাউকে জানানো" এই একই দর্শন শেয়ার করে, কিন্তু trust boundary সম্পূর্ণ ভিন্ন। একটা internal message queue-তে producer আর consumer দুটোই আপনার নিজের ইনফ্রাস্ট্রাকচার, একই network perimeter, একই team-এর নিয়ন্ত্রণে। কিন্তু webhook একটা <b>organizational boundary পেরিয়ে</b> আসা এককালীন (one-off) HTTP call — Stripe-এর সার্ভার internet দিয়ে সরাসরি আপনার public URL-এ POST করছে, এবং ডিফল্টভাবে সেই URL-এ POST করা থেকে আর কাউকে আটকানো যায় না।</p>
<div class="grid2">
  <div class="box"><b>Internal Message Queue</b><br/>Producer ও consumer দুটোই আপনার নিয়ন্ত্রণে। Network perimeter (VPC, private subnet) দিয়েই অনেকটা নিরাপত্তা এমনিতেই আসে। Broker নিজেই authentication/authorization করে দেয়।</div>
  <div class="box"><b>Webhook (Cross-Boundary)</b><br/>Sender একটা তৃতীয়-পক্ষ, receiver-এর URL সম্পূর্ণ public — internet-এ যে কেউ সেই URL-এ POST করতে পারে। Broker-এর মতো কোনো built-in trust layer নেই — নিরাপত্তা পুরোপুরি application-level-এ, আপনাকেই বানাতে হবে।</div>

<h3>১৩.৩ Signature Verification — HMAC দিয়ে প্রমাণীকরণ</h3>
<p>Provider (Stripe/GitHub) আর আপনার মধ্যে setup-এর সময় একটা <b>shared secret</b> ঠিক করা থাকে (কেবল দুই পক্ষই জানে)। প্রতিটা webhook পাঠানোর সময় provider payload-এর ওপর <span class="kw">HMAC-SHA256(payload, sharedSecret)</span> হিসাব করে একটা header-এ (যেমন <code>X-Signature</code>) জুড়ে দেয়। Receiver হিসেবে আপনি ঠিক একই raw request body-এর ওপর একই shared secret দিয়ে একই HMAC আবার হিসাব করেন, তারপর দুটো তুলনা করেন — শুধু secret-টা যার কাছে আছে সে-ই মিলে যাওয়া signature বানাতে পারবে, তাই signature মিললে বোঝা যায় request-টা সত্যিই সেই provider থেকে এসেছে এবং transit-এ payload-টা বদলে যায়নি।</p>
<pre><span class="c">// --- Provider পাশে: payload সাইন করা ---</span>
using System.Security.Cryptography;
using System.Text;

public static string ComputeSignature(string rawPayload, string sharedSecret)
{
    byte[] keyBytes = Encoding.UTF8.GetBytes(sharedSecret);
    using var hmac = new HMACSHA256(keyBytes);
    byte[] hash = hmac.ComputeHash(Encoding.UTF8.GetBytes(rawPayload));
    return Convert.ToHexString(hash).ToLowerInvariant();
}

<span class="c">// পাঠানোর সময়:</span>
<span class="c">// request.Headers.Add("X-Signature", ComputeSignature(rawJsonBody, secret));</span></pre>
<p>Receiver পাশে সবচেয়ে গুরুত্বপূর্ণ সূক্ষ্ম বিষয়টা হলো — signature দুটো তুলনা করার <b>পদ্ধতি</b>। সাধারণ string equality (<code>==</code> বা <code>.Equals()</code>) সাধারণত প্রথম অমিল character পেলেই তাৎক্ষণিক false রিটার্ন করে (early-exit) — যতগুলো character মিলেছে সেই সংখ্যার সাথে execution time সরাসরি সমানুপাতিক। এই ক্ষুদ্র সময়ের পার্থক্য মেপে একজন আক্রমণকারী ধীরে ধীরে, byte-by-byte, সঠিক signature অনুমান করে ফেলতে পারে — একে বলে <span class="kw">timing attack</span>। এড়ানোর উপায়: <span class="kw">constant-time comparison</span> — .NET-এ <code>CryptographicOperations.FixedTimeEquals</code>, যেটা সবসময় একই পরিমাণ সময় নেয়, ফলে সময়ের তারতম্য থেকে কোনো তথ্য ফাঁস হয় না।</p>
<pre>public bool VerifySignature(string rawBody, string receivedSignatureHex, string sharedSecret)
{
    string expectedHex = ComputeSignature(rawBody, sharedSecret);

    byte[] expectedBytes = Encoding.UTF8.GetBytes(expectedHex);
    byte[] receivedBytes = Encoding.UTF8.GetBytes(receivedSignatureHex);

    if (expectedBytes.Length != receivedBytes.Length)
        return false;   <span class="c">// দৈর্ঘ্য না মিললে সাথে সাথেই বাদ</span>

    <span class="kw">// ভুল:</span> if (expectedHex == receivedSignatureHex)   <span class="c">// early-exit compare — timing attack-এ ফাঁস দেয়</span>

    <span class="kw">// ঠিক:</span> সবসময় constant-time compare ব্যবহার করুন
    return CryptographicOperations.FixedTimeEquals(expectedBytes, receivedBytes);
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — signature তুলনায় সাধারণ == ব্যবহার</span> এই ভুলটা compile হয়, test-ও pass করে (কারণ সঠিক input-এ ঠিক কাজ করে!), অথচ production-এ একটা সূক্ষ্ম timing side-channel খুলে রাখে। এই বাগ কোনো functional test দিয়ে ধরা পড়ে না — শুধু security review বা timing-analysis দিয়েই বোঝা যায়। এজন্যই secret/signature/token তুলনার প্রতিটা জায়গায় ডিফল্টভাবেই <code>FixedTimeEquals</code> (বা equivalent) ব্যবহার করা উচিত, "দরকার আছে কিনা" ভেবে না দেখে।</div>

<h3>১৩.৪ Idempotency — At-Least-Once Delivery-এর অনিবার্য পরিণতি</h3>
<p>প্রায় সব webhook provider একই নিয়ম মেনে চলে: আপনার endpoint যদি কোনো non-2xx status ফেরত দেয়, বা timeout হয়ে যায়, তাহলে provider সেই event আবার পাঠানোর চেষ্টা করবে — কখনো কখনো ঘণ্টাখানেক ধরে বারবার। এর মানে হলো, আপনার endpoint দীর্ঘমেয়াদে <b>একই event একাধিকবার</b> পাবে-ই, এটা exception নয়, নিয়ম। এটাই <span class="kw">at-least-once delivery</span> সমস্যা — ঠিক যে সমস্যাটা distributed messaging-এও দেখা যায় (এই সাইটের Distributed Systems কোর্সের Messaging Guarantees চ্যাপ্টারে বিস্তারিতভাবে আলোচিত): নেটওয়ার্কের কোনো নিশ্চিত উপায় নেই "message পৌঁছায়নি" আর "message পৌঁছেছে, শুধু ack হারিয়েছে" — এই দুটো অবস্থাকে আলাদা করার, তাই sender-এর একমাত্র নিরাপদ পছন্দ retry করা, আর duplicate সামলানোর দায়িত্ব receiver-এর।</p>
<p>সমাধান একই — <span class="kw">idempotency key</span> প্যাটার্ন। প্রতিটা webhook event-এর একটা অনন্য <code>EventId</code> থাকে (Stripe দেয় <code>evt_...</code> আকারে)। Business logic চালানোর আগে চেক করুন এই ID আগে প্রসেস হয়েছে কিনা — হলে চুপচাপ skip করুন।</p>
<pre>public async Task HandleWebhookEventAsync(WebhookEvent evt)
{
    bool alreadyProcessed = await _processedEvents.ExistsAsync(evt.EventId);
    if (alreadyProcessed)
    {
        return;   <span class="c">// retry থেকে আসা duplicate — নীরবে skip, আবার charge/email করবেন না</span>
    }

    await _processedEvents.RecordAsync(evt.EventId);   <span class="c">// একই DB transaction-এ record করুন</span>
    await ApplyBusinessLogicAsync(evt);                 <span class="c">// চার্জ কনফার্ম, ইমেইল পাঠানো ইত্যাদি — ঠিক একবারই কার্যকর হবে</span>
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — webhook "একবারই আসবে" ধরে নেওয়া</span> Happy-path testing-এ (একবার call, একবার response) সবকিছু ঠিকঠাক দেখায়। কিন্তু production-এ সাময়িক network glitch, সার্ভার restart, বা শুধু আপনার handler-এর ৫০০ms দেরি — এসবের যেকোনোটাই provider-কে retry ট্রিগার করতে বাধ্য করে। Idempotency check ছাড়া একটা duplicate <code>payment.succeeded</code> event মানে গ্রাহককে দ্বিতীয়বার charge করা, আর duplicate <code>order.created</code> মানে একই কনফার্মেশন ইমেইল দুইবার পাঠানো — দুটোই বাস্তব, ব্যয়বহুল প্রোডাকশন ঘটনা, রেয়ার এজ-কেস নয়।</div>

<h3>১৩.৫ Fast-Ack Pattern — Verify → Persist → 200 → Async Process</h3>
<p>বেশিরভাগ webhook provider-এর একটা কড়া response timeout থাকে — সাধারণত কয়েক সেকেন্ড। যদি আপনার handler-এর ভেতরেই synchronously ভারী business logic (payment reconciliation, একাধিক downstream API call, রিপোর্ট জেনারেট করা) চালান, timeout হওয়ার ঝুঁকি থাকে — আর timeout মানেই provider ধরে নেবে delivery ব্যর্থ হয়েছে, ফলে আবার retry পাঠাবে, যদিও আপনার business logic হয়তো ততক্ষণে আসলে সম্পন্ন হয়ে গেছে বা চলমান। এতে অকারণ duplicate processing আর retry-storm তৈরি হয়।</p>
<p>সমাধান হলো <span class="kw">fast-ack pattern</span>: handler-এ শুধু (১) signature verify করুন, (২) raw event দ্রুত একটা queue/table-এ persist করুন, (৩) সাথে সাথেই 2xx ফেরত দিন। এরপর একটা আলাদা background worker সেই persisted event তুলে (idempotency check-সহ) আসল business logic চালায় — provider-এর timeout window-এর সাথে এই ধীর কাজের কোনো সম্পর্কই থাকে না।</p>
<pre>app.MapPost("/webhooks/stripe", async (HttpRequest req, IWebhookQueue queue, IOptions&lt;StripeOptions&gt; opts) =>
{
    using var reader = new StreamReader(req.Body);
    string rawBody = await reader.ReadToEndAsync();
    string signature = req.Headers["X-Signature"]!;

    if (!VerifySignature(rawBody, signature, opts.Value.SharedSecret))
        return Results.Unauthorized();               <span class="c">// signature মেলেনি — 401, persist করারও দরকার নেই</span>

    long ts = long.Parse(req.Headers["X-Timestamp"]!);
    if (Math.Abs(DateTimeOffset.UtcNow.ToUnixTimeSeconds() - ts) > 300)
        return Results.Unauthorized();               <span class="c">// ৫ মিনিটের বেশি পুরনো — সম্ভাব্য replay, নিচে দেখুন</span>

    await queue.EnqueueAsync(rawBody);                <span class="c">// দ্রুত persist — মিলিসেকেন্ডে শেষ, ব্যবসায়িক লজিক এখনো চলেনি</span>
    return Results.Ok();                              <span class="c">// 2xx তাৎক্ষণিক — provider-এর timeout-এর ভেতরেই</span>
});

<span class="c">// আলাদা background worker rawBody dequeue করে ApplyBusinessLogicAsync চালাবে,</span>
<span class="c">// idempotency check-সহ (১৩.৪-এর কোড ব্লক দেখুন)।</span></pre>
<div class="card"><b>Handler-এর দায়িত্ব মাত্র তিনটা</b>
<ul>
<li>Signature ও timestamp verify করা (প্রমাণীকরণ)</li>
<li>Raw event দ্রুত, নির্ভরযোগ্যভাবে persist করা (durability)</li>
<li>তাৎক্ষণিক 2xx ফেরত দেওয়া (provider-এর timeout সন্তুষ্ট করা)</li>
</ul>
ব্যবসায়িক লজিক (charge apply, email পাঠানো, downstream sync) এই তিনটার কোনোটার মধ্যেই নেই — সেটা background worker-এর কাজ।</div>
<div class="callout best"><span class="tag">Best practice — verify → persist → ack → process</span> Handler-কে যতটা সম্ভব "পাতলা" (thin) রাখুন। যত কম কাজ HTTP request-response cycle-এর ভেতরে সম্পন্ন হবে, timeout-জনিত retry storm-এর ঝুঁকি ততই কম, আর duplicate processing-এর সম্ভাবনাও কমে যায়।</div>

<h3>১৩.৬ Replay Protection — Timestamp ও Nonce</h3>
<p>শুধু signature verification যথেষ্ট নয়। একজন আক্রমণকারী যদি নেটওয়ার্কে কোনোভাবে একটা বৈধ, সঠিক-signature-সহ request capture করে ফেলে (উদাহরণ: একটা compromised proxy, বা লগ ফাইলে পড়ে থাকা পুরনো request), সে সেই একই request পরে আবার পাঠাতে পারে — signature তখনও মিলবে, কারণ payload অপরিবর্তিত। একে বলে <span class="kw">replay attack</span>। প্রতিরোধ করতে signature-এর সাথে একটা <code>timestamp</code>-ও signed payload-এর অংশ করে দেওয়া হয়, আর receiver সেই timestamp বর্তমান সময়ের একটা নির্দিষ্ট window-এর (যেমন ৫ মিনিট) বাইরে হলে request বাতিল করে দেয় — উপরের fast-ack কোড ব্লকেই এই চেকটা দেখানো হয়েছে। আরও কড়া সুরক্ষার জন্য একটা অনন্য <span class="kw">nonce</span> (once-only random value) সংযুক্ত করে সেটাও একটা short-lived seen-nonce store-এ রেখে দেওয়া যায়, যাতে window-এর ভেতরেই হুবহু একই request দ্বিতীয়বার গ্রহণ না হয়।</p>
<div class="callout behind"><span class="tag">লক্ষ্য করুন</span> Timestamp check আর idempotency key check — দুটো ভিন্ন সমস্যা সমাধান করে যদিও দেখতে একই রকম মনে হতে পারে। Timestamp আটকায় <b>পুরনো, capture করা request-এর পুনরাবৃত্তি</b> (নিরাপত্তা সমস্যা); idempotency key আটকায় <b>provider-এর নিজস্ব বৈধ retry-এর ডুপ্লিকেট effect</b> (নির্ভরযোগ্যতা সমস্যা)। একটা মজবুত webhook receiver-এ দুটোই লাগে, একটা আরেকটার বিকল্প নয়।</div>

<h3>১৩.৭ Sender-Side Retry ও Backoff Design</h3>
<p>এতক্ষণ আমরা receiver-এর দৃষ্টিকোণ থেকে দেখেছি। কিন্তু যদি আপনি নিজে webhook <b>পাঠানোর</b> পক্ষ হন — যেমন আপনার SaaS প্ল্যাটফর্ম গ্রাহকদের নিজস্ব endpoint-এ event পাঠায় — তাহলে retry ডিজাইন করাটা আপনার দায়িত্ব। শুধু বারবার সাথে সাথে retry করলে একটা সাময়িকভাবে ব্যস্ত endpoint-কে আরও চাপে ফেলে দেয়, আর একটা স্থায়ীভাবে ভাঙা (permanently broken) গ্রাহক endpoint-এ চিরকাল retry করলে সেটা কেবল আপনার নিজের রিসোর্স নষ্ট করে, কোনো লাভ হয় না। সমাধান: <span class="kw">exponential backoff</span> — প্রতি ব্যর্থ চেষ্টার পর অপেক্ষার সময় দ্বিগুণ করে বাড়ানো, সাথে একটা সর্বোচ্চ চেষ্টা-সংখ্যা নির্ধারণ করে দেওয়া।</p>
<pre>int attempt = 0;
const int maxAttempts = 6;

while (attempt < maxAttempts)
{
    HttpResponseMessage response = await httpClient.PostAsync(customerWebhookUrl, content);
    if (response.IsSuccessStatusCode)
        return;                                    <span class="c">// 2xx পাওয়া গেছে — delivery সফল, শেষ</span>

    attempt++;
    int delaySeconds = (int)Math.Pow(2, attempt);   <span class="c">// 2, 4, 8, 16, 32, 64 সেকেন্ড...</span>
    await Task.Delay(TimeSpan.FromSeconds(delaySeconds));
}

<span class="c">// maxAttempts শেষ — এখানেই থামুন, চিরকাল retry নয়</span>
await _deliveryFailures.RecordPermanentFailureAsync(eventId, customerWebhookUrl);
<span class="c">// dashboard/log-এ দেখান, প্রয়োজনে গ্রাহককে সতর্ক করুন — নীরবে হারিয়ে যেতে দেবেন না</span></pre>
<div class="callout mistake"><span class="tag">Common mistake — সীমাহীন retry</span> "delivery নিশ্চিত করতেই হবে" এই যুক্তিতে max-attempt ছাড়া অনির্দিষ্টকাল retry করা আসলে একটা fixed-interval retry loop-এ পরিণত হয় যা একটা ভাঙা endpoint-এর বিরুদ্ধে ক্রমাগত request পাঠাতেই থাকে — নিজের outbound worker pool আর গ্রাহকের (হয়তো এমনিতেই ডাউন থাকা) সার্ভার দুটোকেই অপ্রয়োজনীয় চাপে ফেলে। একটা যুক্তিসঙ্গত max attempt-এর পর হাল ছেড়ে দিয়ে ব্যর্থতা দৃশ্যমান (visible) করে দেওয়াই ভালো — যাতে মানুষ হস্তক্ষেপ করে গ্রাহকের endpoint ঠিক করতে বলতে পারে।</div>

<h3>১৩.৮ ডিজাইন চেকলিস্ট এক নজরে</h3>
<table>
<tr><th>Design Concern</th><th>উপেক্ষা করলে ঝুঁকি</th><th>Mitigation</th></tr>
<tr><td>Signature verification</td><td>যে কেউ ভুয়া payload পাঠিয়ে আপনার সিস্টেমকে বোকা বানাতে পারে (spoofed request)</td><td>HMAC signing + constant-time compare (<code>FixedTimeEquals</code>)</td></tr>
<tr><td>Idempotency</td><td>Duplicate side-effect — একই গ্রাহককে দুইবার charge, একই ইমেইল দুইবার পাঠানো</td><td>Idempotency key (EventId) + deduplication store</td></tr>
<tr><td>Slow synchronous handler</td><td>Provider-এর timeout, ফলে অপ্রয়োজনীয় retry-storm ও duplicate processing</td><td>Fast-ack pattern — verify → persist → 2xx → async process</td></tr>
<tr><td>Replay protection নেই</td><td>Capture করা বৈধ-signature request পরে আবার পাঠিয়ে replay করা সম্ভব</td><td>Timestamp window check + (ঐচ্ছিক) nonce check</td></tr>
</table>

<h3>১৩.৯ ডিজাইন প্রিন্সিপলের সাথে সংযোগ — SRP ও Command Pattern</h3>
<p>একটা ভালোভাবে ডিজাইন করা webhook handler আসলে এই কোর্সের গোড়ার নীতিগুলোরই একটা বাস্তব, কম্প্যাক্ট উদাহরণ। ১৩.৫-এ দেখা তিনটা আলাদা দায়িত্ব — signature verification, event persistence, আর business processing — যদি একটাই মেথডে মিশিয়ে ফেলা হতো, সেটা <b>চ্যাপ্টার ৩ (SRP)</b>-এর ঠিক যে সমস্যাটা এড়াতে বলে, সেটাই হতো: একটা class/method-এর পরিবর্তনের একাধিক কারণ (security policy বদলালে, storage backend বদলালে, business rule বদলালে — প্রতিটাই একই কোড ছুঁয়ে ফেলবে)। এগুলোকে আলাদা রেখে, প্রতিটাকে independently টেস্ট ও বদলানো সহজ হয়।</p>
<p>আরও লক্ষণীয়: fast-ack pattern-এ persist হওয়া raw event — যেটা পরে একটা background worker তুলে নিয়ে চালায় — কাঠামোগতভাবে <b>চ্যাপ্টার ১০ (Command pattern)</b>-এরই একটা রূপ। আগত webhook event একটা immediate function call নয়, বরং একটা স্টোরযোগ্য, সারিবদ্ধ (queueable) command object হয়ে যায় — যা later, asynchronously, প্রয়োজনে retry করে execute করা যায়, ঠিক যেমন Command pattern-এ request-কে object হিসেবে ঘুরিয়ে ফেলে undo/queue/log করার সুবিধা পাওয়া যায়।</p>
<span class="badge">চ্যাপ্টার ৩ → SRP</span> <span class="badge">চ্যাপ্টার ১০ → Command Pattern</span> <span class="badge">চ্যাপ্টার ১৪ → সিন্থেসিস</span>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> Webhook হলো একটা reverse API call — polling-এর latency ও অপচয় এড়িয়ে provider নিজেই ঘটনার মুহূর্তে আপনার endpoint-কে জানিয়ে দেয়। কিন্তু organizational boundary পেরিয়ে আসা একটা public, ডিফল্টভাবে-অবিশ্বস্ত HTTP call হওয়ায় এটার নিজস্ব নিরাপত্তা ও নির্ভরযোগ্যতা মডেল লাগে, যা internal message queue-তে বিনামূল্যেই পাওয়া যায়: <span class="kw">HMAC signature verification</span> (constant-time compare-সহ) প্রমাণ করে request সত্যিই provider থেকে এসেছে; <span class="kw">timestamp/nonce check</span> আটকায় capture করা request-এর replay; <span class="kw">idempotency key</span> সামলায় at-least-once delivery-এর অনিবার্য duplicate; আর <span class="kw">fast-ack pattern</span> handler-কে পাতলা রেখে timeout-জনিত retry-storm এড়ায়। এই চারটা উদ্বেগ একসাথে যেভাবে ভাগ হয়ে যায় — verification, persistence, আর processing আলাদা concern হিসেবে — সেটাই SRP আর Command pattern-এর একটা ঝরঝরে, বাস্তব প্রয়োগ। পরের ও শেষ চ্যাপ্টারে (১৪. সবকিছু একসাথে — Clean Architecture Case Study) এই webhook handler-সহ কোর্সের সবগুলো নীতি — SOLID, প্রতিটা design pattern, আর এড়িয়ে চলার মতো anti-pattern — একটা একক, সম্পূর্ণ real-world architecture-এ কীভাবে একসাথে বসে তা দেখানো হবে।</div>

<h3>Clean Architecture / Onion Architecture — একটা লেয়ারিং, একটা DIP</h3>
<p><span class="kw">Clean Architecture</span> (Robert C. Martin) আর <span class="kw">Onion Architecture</span> (Jeffrey Palermo) মূলত একই ধারণার দুটো নাম — কোডকে এক গুচ্ছ concentric (কেন্দ্রমুখী) স্তরে ভাগ করা:</p>
<ul>
<li><b>Domain</b> (সবচেয়ে ভেতরে) — entity আর business rule; কোনো বাইরের dependency নেই, database/HTTP/framework কিছুই জানে না।</li>
<li><b>Application</b> (মাঝখানে) — use case/service; শুধু Domain-এর abstraction-এর উপর নির্ভর করে।</li>
<li><b>Infrastructure</b> (সবচেয়ে বাইরে) — DB, HTTP client, external API; ভেতরের স্তরগুলো যেসব interface চেয়েছে, সেগুলোই implement করে।</li>
</ul>
<p>এই চ্যাপ্টারে যেসব চ্যাপ্টার একসাথে কাজ করতে দেখবেন: <span class="badge">ch.১ Encapsulation</span><span class="badge">ch.৩ SRP</span><span class="badge">ch.৪ OCP</span><span class="badge">ch.৬ ISP</span><span class="badge">ch.৭ DIP/DI</span><span class="badge">ch.৯ Decorator</span><span class="badge">ch.১০ Strategy</span><span class="badge">ch.১১ State</span><span class="badge">ch.১২ Anti-patterns</span><span class="badge">ch.১৩ Webhooks</span></p>
<div class="callout why"><span class="tag">এটা আসলে DIP-ই, পুরো আর্কিটেকচার জুড়ে</span>
৭ নং চ্যাপ্টারে <span class="kw">Dependency Inversion Principle</span> শিখেছিলেন একটা ক্লাস-লেভেল নিয়ম হিসেবে — high-level module concrete low-level module-এর উপর নির্ভর করবে না, বরং দুটোই abstraction-এর উপর নির্ভর করবে। Clean Architecture ঠিক এই একই নিয়মকে পুরো codebase-এর স্তরে তুলে ধরে: dependency arrow সবসময় <b>ভেতরের দিকে</b> — বাইরের (detail-heavy) স্তর ভেতরের (abstract) স্তরের উপর নির্ভর করে, উল্টোটা কখনো না। Infrastructure Domain-কে চেনে, কিন্তু Domain Infrastructure-এর অস্তিত্বই জানে না।</div>

<h3>Domain Layer — Order Entity ও State Pattern</h3>
<p><code>Order</code> entity নিজের invariant নিজেই রক্ষা করে — যেমন, একবার <code>Cancelled</code> হয়ে গেলে সেটা আর <code>Paid</code>-এ ফিরে যেতে পারবে না। এটা ১ নং চ্যাপ্টারের <span class="kw">encapsulation</span>-এর সরাসরি প্রয়োগ: state পরিবর্তনের নিয়ম object-এর বাইরে কোনো if/else স্তূপে না রেখে object নিজেই সেটা নিয়ন্ত্রণ করে। বাস্তবায়নের জন্য ১১ নং চ্যাপ্টারের <span class="kw">State pattern</span> ব্যবহার হয়েছে — প্রতিটা অবস্থা (<code>Pending</code>, <code>Paid</code>, <code>Shipped</code>, <code>Cancelled</code>) একটা করে <code>IOrderState</code> implementation, আর transition-এর অনুমতি/অনুমতি-না-দেওয়া সেই ক্লাসের মধ্যেই লেখা।</p>

<h4>PlaceOrderService — এক দায়িত্ব, সরু নির্ভরতা</h4>

<pre>public class PlaceOrderService
{
    private readonly IOrderRepository _orders;
    private readonly IPaymentGateway _payments;
    private readonly IDiscountStrategy _discount;
    private readonly IOrderPlacedNotifier _notifier;

    <span class="c">// সবগুলো নির্ভরতাই ইন্টারফেস — কোনো concrete class ইনজেক্ট হচ্ছে না।</span>
    <span class="c">// এটাই DIP (ch.৭)-এর বাস্তবায়ন: PlaceOrderService শুধু abstraction চেনে।</span>
    public PlaceOrderService(
        IOrderRepository orders,
        IPaymentGateway payments,
        IDiscountStrategy discount,
        IOrderPlacedNotifier notifier)
    {
        _orders = orders;
        _payments = payments;
        _discount = discount;
        _notifier = notifier;
    }

    public async Task<OrderResult> PlaceOrderAsync(PlaceOrderRequest request)
    {
        var order = Order.Create(request.CustomerId, request.Items);
        var discounted = _discount.Apply(order);          <span class="c">// Strategy (ch.১০)</span>

        var charge = await _payments.ChargeAsync(discounted.Total, request.PaymentToken);
        if (!charge.Succeeded)
            return OrderResult.Failed(charge.Error);

        order.MarkAwaitingPayment();                       <span class="c">// State transition (ch.১১)</span>
        await _orders.SaveAsync(order);
        await _notifier.NotifyAsync(order);                <span class="c">// Decorator-wrapped (ch.৯)</span>

        return OrderResult.Success(order.Id);
    }
}</pre>

<h3>Infrastructure Layer — বাস্তবায়ন, Wiring ও Webhook</h3>
<h4>Concrete implementation ও DI wiring</h4>
<p>সবচেয়ে বাইরের স্তরে আসল বাস্তবায়ন থাকে — <code>SqlOrderRepository</code> (<code>IOrderRepository</code> implement করে, EF Core/Dapper দিয়ে) আর <code>StripePaymentGateway</code> (<code>IPaymentGateway</code> implement করে, Stripe SDK কল করে)। এগুলো কখনোই Application লেয়ার জানে না কোন class — startup-এ শুধু ৭ নং চ্যাপ্টারের DI container-এ registration হয়:</p>
<pre>services.AddScoped<IOrderRepository, SqlOrderRepository>();
services.AddScoped<IPaymentGateway, StripePaymentGateway>();
services.AddScoped<IDiscountStrategy, TierBasedDiscountStrategy>();
services.AddScoped<PlaceOrderService>();</pre>
<h4>Webhook দিয়ে asynchronous payment confirmation</h4>
<p>Payment সবসময় synchronous ভাবে succeed করে না — Stripe আসল confirmation পাঠায় একটা async webhook দিয়ে। ১৩ নং চ্যাপ্টারের সবকিছু এখানে কাজ করছে: <code>StripeWebhookHandler</code> incoming request-এর <span class="kw">HMAC signature</span> যাচাই করে, সাথে সাথে ২০০ ফেরত দেয় (fast-ack), event ID দিয়ে <span class="kw">idempotency</span> চেক করে (একই <code>payment_succeeded</code> event দুবার এলেও অর্ডার দুবার Paid না হয়), আর তারপর ভেতরের দিকে কল করে — Application লেয়ারের একটা method ডেকে অর্ডারকে <code>Paid</code> মার্ক করে, যা আবার Domain-এর State pattern transition ট্রিগার করে।</p>
<p>শেষে, notification পাঠানোর সময় নেটওয়ার্ক flaky হতে পারে — তাই বেস <code>IOrderPlacedNotifier</code>-কে একটা <code>NotificationDecorator</code> মুড়িয়ে রাখা হয়, যা ৯ নং চ্যাপ্টারের <span class="kw">Decorator pattern</span>: মূল notifier-এর কোড না ছুঁয়েই retry-with-backoff behavior যোগ হয়ে যায়।</p>

<div class="callout why"><span class="tag">কেন এই ডিজাইন সহজে টেস্ট করা যায়</span>
<code>PlaceOrderService</code>-কে ইউনিট টেস্ট করার জন্য আসল SQL Server বা আসল Stripe API-কল লাগে না — শুধু <code>IOrderRepository</code> আর <code>IPaymentGateway</code>-এর ফেক/মক ইমপ্লিমেন্টেশন যথেষ্ট, কারণ সার্ভিসটা <b>কখনোই concrete class জানে না</b>, শুধু ইন্টারফেস জানে (৭ নং চ্যাপ্টারের DIP)। এটাই এই পুরো লেয়ারিং করার আসল পুরস্কার — শুধু "পরিষ্কার দেখতে লাগে" বলে না, বরং টেস্ট দ্রুত, ডেটাবেজ-নির্ভরতাহীন, আর নেটওয়ার্ক-flakiness-মুক্ত হয়ে যায়।</div>

<div class="callout mistake"><span class="tag">সবখানে এই স্তরায়ন কপি করবেন না</span>
এই পুরো Domain/Application/Infrastructure বিভাজন, State pattern, Strategy, Decorator — এগুলো একটা ছোট্ট internal CRUD টুলে (যেখানে সত্যিকারের business rule নেই, শুধু ফর্ম থেকে ডেটাবেজে সেভ) হুবহু কপি করাটাই ১২ নং চ্যাপ্টারের <span class="kw">premature optimization / over-engineering</span> anti-pattern। কাঠামোর পরিমাণ প্রজেক্টের প্রকৃত জটিলতার সাথে বাড়া উচিত — impressive দেখাচ্ছে বলে না। একটা ৩-টেবিলের admin panel-এ চার স্তরের abstraction মানে বেশি ফাইল, বেশি ইন্ডাইরেকশন, কম productivity — কোনো লাভ ছাড়াই।</div>

<div class="callout best"><span class="tag">কোর্স সারাংশ ও পরবর্তী পদক্ষেপ</span>
এই পুরো কোর্সটা আসলে একটাই মানসিক মডেল তৈরির জন্য, ধাপে ধাপে। <b>OOP-এর চার স্তম্ভ</b> (ch.১) আপনাকে দিয়েছে vocabulary — encapsulation, abstraction, inheritance, polymorphism নিয়ে কথা বলার ভাষা। <b>Composition-over-inheritance</b> (ch.২) আর <b>SOLID</b> (ch.৩-৭) দিয়েছে নীতি — কোড <b>কেন</b> একরকম আকারে থাকা উচিত তার যুক্তি। <b>Gang-of-Four প্যাটার্নগুলো</b> (ch.৮-১১) হলো প্রমাণিত, নামকরণ-করা <b>আকার</b> (shape) — একই ধরনের সমস্যা বারবার এলে সেই নীতিগুলো বাস্তবে কীভাবে সাজাতে হয় তার রেসিপি। <b>Anti-pattern</b>গুলো (ch.১২) দেখায় কী হয় যখন এই নীতিগুলো উপেক্ষা করা হয় — অথবা judgment ছাড়া, প্রতিটা জায়গায় জোর করে প্রয়োগ করা হয়। আর <b>Webhook</b> চ্যাপ্টার (ch.১৩) দেখিয়েছে এই একই নীতিগুলো একটা খুবই বাস্তব, প্রতিদিনকার integration সমস্যা সমাধান করছে।<br/><br/>
সবচেয়ে গুরুত্বপূর্ণ শিক্ষা এটাই: নতুন কোড ডিজাইন করার সময় শুরু করুন <b>আসল সমস্যা</b> থেকে, আর কাঠামোকে সেখান থেকে জন্ম নিতে দিন। কোনো pattern ব্যবহার করুন কারণ আপনি আপনার সমস্যায় সেই pattern-এর <b>আকারটা চিনতে পেরেছেন</b> — একটা নামকরা pattern ব্যবহার করা "sophisticated" লাগবে বলে না। এই judgment-টাই — কখন প্রয়োগ করবেন, আর কখন সংযত থাকবেন — একজন ভালো ইঞ্জিনিয়ার আর একজন pattern-obsessed ইঞ্জিনিয়ারের মধ্যে আসল পার্থক্য।</div>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
