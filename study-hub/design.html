<h2 class="title">১. OOP Foundations — Encapsulation, Abstraction, Polymorphism</h2>
<p class="lead">Object-Oriented Programming (OOP) কোনো syntax feature না — এটা জটিলতা সামলানোর একটা কৌশল। এই চ্যাপ্টারে আমরা দেখবো OOP আসলে কোন সমস্যার সমাধান করে, চারটা "pillar" — Encapsulation, Abstraction, Inheritance, Polymorphism — ঠিক কী গ্যারান্টি দেয়, আর কোথায় এই pillar-গুলোর সবচেয়ে বেশি অপব্যবহার হয়। এই ভিত্তিটা ছাড়া পরের SOLID ও Design Pattern চ্যাপ্টারগুলো শুধু মুখস্থ নিয়ম মনে হবে — কেন সেগুলো দরকার তা বোঝা যাবে না।</p>

<h3>১.১ OOP আসলে কোন সমস্যার সমাধান</h3>
<p>একটা ছোট script-এ ডেটা আর সেই ডেটার উপর কাজ করা function আলাদা রাখলেও সমস্যা হয় না — পুরো প্রোগ্রামটা একজনের মাথায় ধরে। কিন্তু একটা codebase যখন হাজার হাজার লাইনে, বহু ডেভেলপারের হাতে, বছরের পর বছর ধরে বাড়তে থাকে, তখন আসল সমস্যাটা দাঁড়ায় — <b>কোন ডেটা কোন নিয়ম মেনে বদলাতে পারে, আর কে সেই নিয়ম মানতে বাধ্য</b> তা ট্র্যাক করা। ডেটা আর সেই ডেটাকে নিয়ন্ত্রণ করা logic যদি আলাদা আলাদা জায়গায় ছড়িয়ে থাকে, তাহলে কোনো একটা জায়গায় নিয়ম ভাঙলে বাকি পুরো codebase-এর কেউ জানতেও পারে না।</p>
<p><span class="kw">OOP</span> এই সমস্যাটার সমাধান করে ডেটা আর behavior-কে একসাথে একটা ইউনিটে বেঁধে — যাকে বলে <span class="kw">object</span>। বাস্তব জগতের এনটিটি (একটা <code>Order</code>, একটা <code>BankAccount</code>, একটা <code>User</code>) মডেল করার সুবিধাটা আসলে গৌণ ফলাফল; আসল লক্ষ্য হলো — প্রতিটা ডেটার সাথে তার নিয়মগুলোকে একই জায়গায় বন্দি করে রাখা, যাতে কোড যত বড়ই হোক, একটা নির্দিষ্ট state কীভাবে বদলাতে পারে তা বোঝার জন্য পুরো codebase খুঁজতে না হয় — শুধু সেই class-টা দেখলেই চলে।</p>
<div class="callout why"><span class="tag">কেন গুরুত্বপূর্ণ — পরিবর্তনের সমস্যা</span>
OOP-এর গভীরতম উদ্দেশ্য আসলে জটিলতা লুকানো না, বরং <b>পরিবর্তনের খরচ কমানো</b>। বাস্তব সফটওয়্যারে requirement সবসময় বদলায় — নতুন payment method যোগ হয়, নতুন discount rule আসে। প্রশ্ন হলো: নতুন requirement আসলে কি পুরনো, পরীক্ষিত কোড খুলে সম্পাদনা করতে হবে (ঝুঁকিপূর্ণ — যেকোনো জায়গায় নতুন bug ঢুকতে পারে), নাকি পুরনো কোড অক্ষত রেখে শুধু নতুন কোড যোগ করা যাবে (নিরাপদ)? ভালোভাবে ডিজাইন করা object-oriented কোড দ্বিতীয়টা সম্ভব করে — পুরনো কোড না ছুঁয়ে নতুন ক্লাস/implementation যোগ করে ব্যবহার বাড়ানো যায়। এই নীতিটাই পরে চ্যাপ্টার ৪-এ <span class="kw">Open/Closed Principle</span> নামে আনুষ্ঠানিক রূপ পাবে।</div>

<h3>১.২ Encapsulation — কেন public field বিপজ্জনক</h3>
<p><span class="kw">Encapsulation</span> মানে একটা object-এর internal state-কে বাইরের জগৎ থেকে আড়াল করা, এবং সেই state বদলানোর একমাত্র পথ হিসেবে একটা নিয়ন্ত্রিত public interface (method বা property) রাখা। এটা শুধু "data hiding" না — এর আসল কাজ হলো <b>invariant রক্ষা করা</b>। Invariant মানে এমন একটা শর্ত যা object-এর পুরো জীবনচক্রে সবসময় সত্য থাকতে হবে — যেমন একটা ব্যাংক অ্যাকাউন্টের ব্যালেন্স কখনো ঋণাত্মক (negative) হতে পারবে না।</p>
<p>ধরুন <code>BankAccount</code> ক্লাসের <code>Balance</code> field সরাসরি public:</p>
<pre>public class BankAccount
{
    public decimal Balance;   <span class="c">// public field — যে কেউ, যেকোনো জায়গা থেকে বদলাতে পারে</span>
}

<span class="c">// codebase-এর যেকোনো জায়গায়, যেকোনো ফাইলে এভাবে লেখা যায়:</span>
account.Balance -= 500;
<span class="c">// কেউ চেক করছে না account.Balance যথেষ্ট আছে কিনা।
// account.Balance = -1000; ও বৈধ — কম্পাইলার কোনো আপত্তি করবে না।</span></pre>
<p>এখানে আসল সমস্যাটা হলো — "ব্যালেন্স কখনো ঋণাত্মক হবে না" এই নিয়মটা প্রয়োগ করার দায়িত্ব <b>কোনো একটা নির্দিষ্ট জায়গায় নেই</b>। এই field-টা যত জায়গায় ব্যবহার হয়, প্রতিটা জায়গায় ডেভেলপারকে মনে রাখতে হবে চেক করে নিতে — আর একজনও ভুলে গেলে অ্যাকাউন্ট negative balance-এ চলে যাবে। এখন এই কোড ১০০টা ফাইলে ছড়িয়ে থাকলে বাগ খোঁজা প্রায় অসম্ভব হয়ে যায়, কারণ কোন কল-সাইটে ভুলটা হয়েছে তা কেউ জানে না।</p>
<p>Encapsulation দিয়ে সমাধান — field private করে, শুধু method-এর মাধ্যমে state বদলানোর পথ খোলা রাখা, আর সেই method-এর ভেতরেই invariant চেক করা:</p>
<pre>public class BankAccount
{
    private decimal _balance;   <span class="c">// বাইরে থেকে সরাসরি access নেই</span>

    public decimal Balance => _balance;   <span class="c">// শুধু পড়ার জন্য expose করা হলো</span>

    public void Withdraw(decimal amount)
    {
        if (amount <span class="kw">&lt;=</span> 0)
            throw new ArgumentException("Withdraw amount must be positive.");
        if (amount > _balance)
            throw new InvalidOperationException("Insufficient funds.");

        _balance -= amount;   <span class="c">// invariant এখানে, একটা জায়গায়, নিশ্চিত হয়</span>
    }

    public void Deposit(decimal amount)
    {
        if (amount <span class="kw">&lt;=</span> 0)
            throw new ArgumentException("Deposit amount must be positive.");
        _balance += amount;
    }
}</pre>
<p>লক্ষ্য করুন — এখন "ব্যালেন্স ঋণাত্মক হবে না" নিয়মটা <b>একটাই জায়গায়</b> বাস করে — <code>Withdraw</code> method-এর ভেতরে। এই ক্লাসকে যত জায়গা থেকেই ব্যবহার করা হোক, নিয়মটা কখনো এড়িয়ে যাওয়া সম্ভব না, কারণ <code>_balance</code>-এ পৌঁছানোর আর কোনো পথ নেই।</p>
<div class="callout why"><span class="tag">কেন শুধু "নিরাপত্তা" না — একটা single source of truth</span>
Encapsulation-কে অনেকে ভুল করে ভাবেন এটা শুধু "বাইরের হাত থেকে বাঁচানো" (security)। আসল কারণ ভিন্ন — এটা নিশ্চিত করে যে একটা invariant প্রয়োগ করার লজিক codebase-এ ঠিক <b>একবার</b> লেখা থাকে। ভবিষ্যতে নিয়ম বদলালে (ধরুন, minimum balance $10 রাখতে হবে এখন), শুধু একটা method বদলালেই চলবে — বাকি পুরো codebase-এ কেউ টেরও পাবে না কিছু বদলেছে। Public mutable field থাকলে এই একই নিয়ম বদলাতে হলে প্রতিটা কল-সাইট খুঁজে বের করে বদলাতে হতো।
</div>

<h3>১.৩ Abstraction — কী গুরুত্বপূর্ণ তাই expose করা</h3>
<p><span class="kw">Abstraction</span> এবং Encapsulation প্রায়ই গুলিয়ে ফেলা হয়, কিন্তু দুটো ভিন্ন জিনিস। Encapsulation বলে <b>কীভাবে</b> state সুরক্ষিত রাখা হবে (access control-এর মাধ্যমে)। Abstraction বলে ব্যবহারকারীকে <b>কতটুকু</b> জানতে হবে — একটা জটিল বাস্তবতাকে সরলীকৃত একটা contract-এর পেছনে লুকিয়ে ফেলা, যাতে ব্যবহারকারীকে implementation detail নিয়ে মাথা ঘামাতে না হয়।</p>
<p>ধরুন একটা e-commerce সিস্টেমে payment প্রসেস করতে হবে। Stripe বা PayPal — কোনটা ব্যবহার হচ্ছে সেটা business logic-এর জানার দরকার নেই, শুধু জানা দরকার "টাকা কাটা যাবে কিনা":</p>
<pre>public interface IPaymentGateway
{
    bool Charge(decimal amount, string cardToken);
}

public class StripeGateway : IPaymentGateway
{
    public bool Charge(decimal amount, string cardToken)
    {
        <span class="c">// Stripe SDK কল, retry logic, error mapping — সব এখানে লুকানো</span>
        return true;
    }
}

public class PayPalGateway : IPaymentGateway
{
    public bool Charge(decimal amount, string cardToken)
    {
        <span class="c">// সম্পূর্ণ ভিন্ন SDK, ভিন্ন authentication flow — কিন্তু caller এটা জানেই না</span>
        return true;
    }
}

public class CheckoutService
{
    private readonly IPaymentGateway _gateway;

    public CheckoutService(IPaymentGateway gateway) => _gateway = gateway;

    public void CompleteOrder(decimal total, string cardToken)
    {
        if (!_gateway.Charge(total, cardToken))
            throw new Exception("Payment failed.");
        <span class="c">// CheckoutService জানেই না এটা Stripe না PayPal — জানারও দরকার নেই</span>
    }
}</pre>
<p><code>CheckoutService</code> শুধু <code>IPaymentGateway</code> contract-টা চেনে — Stripe-এর API key, retry policy, বা network call-এর কোনো detail এর জানার দরকার নেই। এটাই abstraction-এর শক্তি: জটিলতা পুরোপুরি মুছে যায় না, কিন্তু যেখানে দরকার নেই সেখান থেকে সরিয়ে রাখা হয়।</p>
<div class="callout behind"><span class="tag">সামনে যা আসছে</span>
এই <code>IPaymentGateway</code> উদাহরণটাই আসলে <span class="kw">Dependency Inversion Principle</span> (চ্যাপ্টার ৭)-এর সবচেয়ে সাধারণ প্রয়োগ — high-level <code>CheckoutService</code> concrete <code>StripeGateway</code>-এর উপর নির্ভর করছে না, বরং একটা abstraction-এর উপর নির্ভর করছে। এই প্যাটার্নটা কেন unit testing সহজ করে দেয় (mock <code>IPaymentGateway</code> বসিয়ে) তা বিস্তারিত সেই চ্যাপ্টারে দেখা যাবে।
</div>

<h3>১.৪ Inheritance — code reuse বনাম ভাঙা contract</h3>
<p><span class="kw">Inheritance</span> একটা <b>is-a</b> সম্পর্ক প্রকাশ করে — <code>Dog</code> is-a <code>Animal</code>, <code>Square</code> is-a <code>Shape</code>। এর মূল সুবিধা হলো code reuse: base class-এর common logic derived class-গুলো বিনামূল্যে পায়। কিন্তু inheritance-এর একটা সূক্ষ্ম কিন্তু বিপজ্জনক শর্ত আছে যা প্রায়ই উপেক্ষা করা হয় — derived class-কে base class সম্পর্কে যা <b>প্রতিশ্রুতি দেওয়া হয়েছে</b> তার সবটাই মেনে চলতে হবে, শুধু method signature কপি করলেই চলবে না।</p>
<p>ক্লাসিক উদাহরণ — <code>Rectangle</code> আর <code>Square</code>। জ্যামিতিকভাবে একটা square একটা rectangle-এরই বিশেষ রূপ (সব বাহু সমান), তাই মনে হয় inheritance এখানে স্বাভাবিক ফিট:</p>
<pre>public class Rectangle
{
    public virtual int Width { get; set; }
    public virtual int Height { get; set; }

    public int Area() => Width <span class="kw">*</span> Height;
}

public class Square : Rectangle
{
    <span class="c">// Square-এ Width আর Height সবসময় সমান রাখতে হবে —
    // তাই একটা বদলালে অন্যটাও বদলে দেওয়া হচ্ছে</span>
    public override int Width
    {
        get => base.Width;
        set { base.Width = value; base.Height = value; }
    }
    public override int Height
    {
        get => base.Height;
        set { base.Width = value; base.Height = value; }
    }
}</pre>
<pre>void ResizeRectangle(Rectangle r)
{
    r.Width = 5;
    r.Height = 10;
    <span class="c">// Rectangle-এর জন্য Area() হওয়ার কথা 50</span>
    Console.WriteLine(r.Area());
}

ResizeRectangle(new Square(10));
<span class="c">// Output: 100, প্রত্যাশিত 50 নয়! — কারণ Height সেট করা মাত্র Width-ও বদলে গেছে</span></pre>
<p>যে কোনো কোড যা <code>Rectangle</code> নিয়ে কাজ করে সে ধরে নেয় <code>Width</code> আর <code>Height</code> স্বাধীনভাবে বদলানো যায় — এটাই <code>Rectangle</code>-এর "প্রতিশ্রুতি" বা contract। <code>Square</code> সেই প্রতিশ্রুতি রাখতে পারে না, কারণ তার নিজস্ব invariant (সব বাহু সমান) সেটাকে বাধ্য করে। ফলাফল — <code>Square</code>, <code>Rectangle</code>-এর জায়গায় নিরাপদে বসানো যায় না, যদিও জ্যামিতিকভাবে is-a সম্পর্কটা সত্যি মনে হয়।</p>
<p>আরেকটা সমান পরিচিত উদাহরণ — <code>Bird</code> বেস ক্লাসে <code>Fly()</code> method থাকলে, <code>Penguin : Bird</code> লেখাটা ভেঙে পড়ে, কারণ Penguin উড়তে পারে না। হয় <code>Fly()</code>-এ exception ছুঁড়তে হয় (caller-এর জন্য surprise), নয়তো অর্থহীন implementation লিখতে হয় — দুটোই base class-এর দেওয়া প্রতিশ্রুতি ভাঙে।</p>
<div class="callout behind"><span class="tag">সামনে যা আসছে</span>
"Derived class base class-এর জায়গায় নিরাপদে ব্যবহারযোগ্য হতে হবে" — এই নিয়মটার একটা আনুষ্ঠানিক নাম আছে: <span class="kw">Liskov Substitution Principle (LSP)</span>। চ্যাপ্টার ৫-এ ঠিক এই <code>Rectangle</code>/<code>Square</code> আর <code>Bird</code>/<code>Penguin</code> সমস্যাগুলোই বিস্তারিতভাবে বিশ্লেষণ করে দেখানো হবে কীভাবে LSP লঙ্ঘন চিনতে হয় এবং কীভাবে সমাধান করতে হয়।
</div>

<h3>১.৫ Polymorphism — একই interface, ভিন্ন আচরণ</h3>
<p><span class="kw">Polymorphism</span> মানে একই operation বিভিন্ন object-এ ভিন্নভাবে চলবে, caller-কে actual type জানার দরকার হবে না। C#-এ এটা runtime-এ অর্জিত হয় <span class="kw">virtual</span>/<span class="kw">override</span> (class inheritance-এর মাধ্যমে), অথবা <span class="kw">interface</span> implementation-এর মাধ্যমে।</p>
<pre>public interface IShape
{
    double Area();
}

public class Circle : IShape
{
    private readonly double _radius;
    public Circle(double radius) => _radius = radius;
    public double Area() => Math.PI <span class="kw">*</span> _radius <span class="kw">*</span> _radius;
}

public class Rectangle : IShape
{
    private readonly double _width, _height;
    public Rectangle(double width, double height)
    {
        _width = width; _height = height;
    }
    public double Area() => _width <span class="kw">*</span> _height;
}

List&lt;IShape&gt; shapes = new List&lt;IShape&gt;
{
    new Circle(3),
    new Rectangle(4, 5)
};

foreach (IShape shape in shapes)
{
    <span class="c">// এখানে কোনো if-else বা type check নেই — প্রতিটা object নিজে জানে
    // Area() কীভাবে হিসাব করতে হবে</span>
    Console.WriteLine(shape.Area());
}
<span class="c">// Output:
// 28.274333882308138
// 20</span></pre>
<p>এই লুপে <code>shape</code>-এর compile-time type হলো <code>IShape</code>, কিন্তু <code>Area()</code> call হয় actual object-এর (runtime) type অনুযায়ী — <code>Circle</code> হলে বৃত্তের সূত্র, <code>Rectangle</code> হলে আয়তক্ষেত্রের সূত্র। নতুন একটা <code>Triangle : IShape</code> যোগ করতে হলে <code>foreach</code> লুপের একটা লাইনও বদলাতে হয় না — এটাই polymorphism-এর আসল সুবিধা, নতুন type-এর জন্য পুরনো কোড অক্ষত থাকে।</p>

<h3>১.৬ সাধারণ ভুল — Inheritance-কে code reuse-এর ডিফল্ট টুল ধরে নেওয়া</h3>
<p>OOP শেখার শুরুতে অনেকেই ধরে নেন — দুটো ক্লাসের মধ্যে কোনো কোড কমন থাকলেই inheritance ব্যবহার করা উচিত। এই অভ্যাস ধীরে ধীরে গভীর, ভঙ্গুর (fragile) class hierarchy তৈরি করে — <code>A → B → C → D</code>-এর মতো চেইন, যেখানে <code>A</code>-তে একটা ছোট পরিবর্তন <code>B</code>, <code>C</code>, <code>D</code> সব জায়গায় অপ্রত্যাশিত প্রভাব ফেলে। এটাকে বলে <span class="kw">fragile base class problem</span> — base class-এর maintainer জানেনই না নিচের কোন derived class কীভাবে সেই internal behavior-এর উপর নির্ভর করে বসে আছে।</p>
<div class="callout mistake"><span class="tag">Common mistake — "code শেয়ার করতে হবে মানেই inherit করো"</span>
"<code>Manager</code>-এরও <code>Employee</code>-এর মতো নাম আর salary আছে, তাই <code>Manager : Employee</code> লিখে ফেলি" — এই যুক্তিটা প্রথম দেখায় নিরীহ মনে হয়, কিন্তু বাস্তবে প্রতিটা নতুন requirement ("Manager-এর bonus আছে কিন্তু Intern-এর নেই", "Contractor-এর salary structure আলাদা") হয় hierarchy-কে আরও গভীর করে, নয়তো derived class-এ base class-এর কিছু method override করে "নিষ্ক্রিয়" করতে বাধ্য করে (ঠিক আগের <code>Penguin.Fly()</code>-এর মতো)। কয়েক মাস পর দেখা যায় hierarchy এত জটিল যে কেউ নিরাপদে একটা base method বদলাতে সাহস পায় না — কোন derived class ভেঙে যাবে তা কেউ নিশ্চিত করে বলতে পারে না।
</div>
<div class="callout behind"><span class="tag">সামনে যা আসছে</span>
বেশিরভাগ ক্ষেত্রে "HAS-A" সম্পর্ক (একটা object আরেকটা object-কে ব্যবহার করে, কিন্তু তার সাব-টাইপ নয়) — অর্থাৎ <span class="kw">Composition</span> — inheritance-এর চেয়ে নিরাপদ, নমনীয় ডিফল্ট পছন্দ। পরের চ্যাপ্টার (Composition over Inheritance) পুরোপুরি এই প্রশ্নেই নিবেদিত — কখন সত্যিকারের is-a সম্পর্ক inheritance দাবি করে, আর কখন composition দিয়ে একই code reuse নিরাপদে, কম coupling-এ পাওয়া যায়।
</div>

OOP মূলত জটিলতা আর পরিবর্তনের খরচ সামলানোর একটা কৌশল — ডেটা আর তার নিয়মকে একসাথে বেঁধে (Encapsulation), শুধু প্রয়োজনীয়টুকু প্রকাশ করে (Abstraction), সম্পর্ক ও পুনর্ব্যবহার মডেল করে (Inheritance), আর একই contract-এর পেছনে ভিন্ন আচরণ চালিয়ে (Polymorphism)। কিন্তু চারটা pillar-ই যত্ন ছাড়া প্রয়োগ করলে বিপরীত ফল দেয় — public field encapsulation নষ্ট করে, ভুল জায়গায় inheritance ব্যবহার করলে (<code>Rectangle</code>/<code>Square</code>, <code>Bird</code>/<code>Penguin</code>) contract ভেঙে যায়, আর "code শেয়ার করতে হবে মানেই inherit করো" মানসিকতা গভীর, ভঙ্গুর hierarchy তৈরি করে। এই ভুলগুলোর মূল সমাধান একটাই দিক নির্দেশ করে — inheritance-কে ডিফল্ট না ধরে composition-কে প্রথম পছন্দ ভাবা, আর is-a সম্পর্ক সত্যিই স্থিতিশীল কিনা তা সাবধানে যাচাই করা। ঠিক এখান থেকেই শুরু হবে পরের চ্যাপ্টার — Composition over Inheritance।

<h2 class="title">২. Composition over Inheritance</h2>
<p class="lead">আগের chapter-এ আমরা দেখেছি Bird/Penguin আর Rectangle/Square কীভাবে inheritance-কে ভুল জায়গায় ব্যবহার করে বিপদে ফেলে। এই chapter-এ আমরা দেখবো কেন সেই বিপদ ঘটে, এবং কীভাবে <span class="kw">composition</span> নামের একটা বিকল্প টেকনিক দিয়ে একই কাজ অনেক নিরাপদভাবে করা যায়। শেষে দেখবো composition-ও কোনো জাদুর কাঠি নয় — এটাকে অতিরিক্ত প্রয়োগ করলে নিজের নতুন সমস্যা তৈরি হয়।</p>

<h3>২.১ রিক্যাপ: ইনহেরিটেন্সের ফাঁদের মূল কারণ</h3>
<p>আগের chapter-এ দুইটা ক্লাসিক উদাহরণ দেখা হয়েছিল — <code>Penguin</code> যখন <code>Bird</code>-কে inherit করে <code>Fly()</code> override করতে বাধ্য হয়েছিল (কারণ Penguin উড়তে পারে না), আর <code>Square</code> যখন <code>Rectangle</code>-কে inherit করে Width/Height সেট করার আচরণ ভেঙে ফেলেছিল। দুটো ক্ষেত্রেই সমস্যা একটাই জায়গায় — inheritance শুধু "এটা ওটার একটা ধরন" (<span class="kw">is-a</span>) সম্পর্ক প্রকাশ করে না, বরং সাবক্লাসকে বেস ক্লাসের <b>প্রতিটা implementation detail</b>-এর সাথে বেঁধে ফেলে।</p>
<p>জীববিজ্ঞানের দৃষ্টিতে Penguin সত্যিই Bird-এর একটা ধরন — কিন্তু কোড যখন <code>Bird</code> ক্লাসে <code>Fly()</code>-কে একটা "সব bird-ই পারবে" নিয়ম হিসেবে বসিয়ে দেয়, তখন বাস্তবতার সূক্ষ্মতা (behavior সবার জন্য এক না) আর কোডের কাঠামোর মধ্যে একটা ফাঁক তৈরি হয়। is-a সম্পর্ক বিদ্যমান থাকা মানেই এই না যে বেস ক্লাসের সব behavior সাবক্লাসের জন্য অর্থবহ। এই ফাঁকটাই এই পুরো chapter-এর কেন্দ্রীয় বিষয়।</p>

<h3>২.২ Composition: has-a দিয়ে is-a-এর ফাঁদ এড়ানো</h3>
<p><span class="kw">Composition</span> মানে একটা ক্লাসকে অন্য ক্লাস থেকে "inherit" করানোর বদলে, সেই আচরণটুকু একটা আলাদা অবজেক্ট হিসেবে ভেতরে <b>রেখে দেওয়া (contain)</b> এবং কাজটা তার কাছে <span class="kw">delegate</span> করা — সংক্ষেপে <span class="kw">has-a</span> সম্পর্ক, is-a নয়। Car "is-a" Vehicle না হয়ে, Car বলবে "Car has-a Engine"।</p>
<p>নিচের প্রথম উদাহরণটা inheritance দিয়ে লেখা — familiar লাগবে, কিন্তু এখানেই সমস্যাটা শুরু:</p>
<pre>public class Car
{
    protected int _rpm;

    public virtual void Start()
    {
        _rpm = 800; <span class="c">// idle RPM</span>
        Console.WriteLine("Engine cranking...");
    }

    public virtual void Accelerate()
    {
        _rpm += 500;
        Console.WriteLine($"RPM: {_rpm}");
    }
}

public class ElectricCar : Car
{
    public override void Start()
    {
        <span class="c">// _rpm-এর কোনো মানে নেই, তাও override করতে হচ্ছে</span>
        <span class="c">// base.Start() কল করলে ভুল idle RPM সেট হয়ে যাবে</span>
        Console.WriteLine("Silent power-on.");
    }

    public override void Accelerate()
    {
        <span class="c">// _rpm ফিল্ডটা পুরোপুরি অপ্রাসঙ্গিক, তবু inherited হয়ে বসে আছে</span>
        Console.WriteLine("Instant torque delivered.");
    }
}</pre>
<p><code>ElectricCar</code>-কে <code>Car</code>-এর <b>প্রতিটা</b> method override করতে হচ্ছে, base class-এর private state (<code>_rpm</code>) সম্পর্কে জানতে হচ্ছে, আর ভুলবশত <code>base.Start()</code> কল করলে অর্থহীন idle-RPM লজিক চলে যাবে। এবার একই কাজ composition দিয়ে:</p>
<pre>public interface IEngine
{
    void Start();
    void Accelerate();
}

public class GasEngine : IEngine
{
    private int _rpm;
    public void Start()      { _rpm = 800; Console.WriteLine("Engine cranking..."); }
    public void Accelerate() { _rpm += 500; Console.WriteLine($"RPM: {_rpm}"); }
}

public class ElectricEngine : IEngine
{
    public void Start()      => Console.WriteLine("Silent power-on.");
    public void Accelerate() => Console.WriteLine("Instant torque delivered.");
}

public class Car
{
    private readonly IEngine _engine;

    <span class="c">// has-a: constructor-এর মাধ্যমে ইঞ্জিন "inject" করা হচ্ছে</span>
    public Car(IEngine engine) => _engine = engine;

    public void Start()      => _engine.Start();
    public void Accelerate() => _engine.Accelerate();
}

<span class="c">// Car-এর একটা লাইনও না ছুঁয়ে আচরণ পাল্টে যাচ্ছে:</span>
var teslaLike = new Car(new ElectricEngine());
var oldSchool  = new Car(new GasEngine());</pre>
<p>এখানে <code>Car</code> কখনোই জানে না <code>GasEngine</code> ভেতরে কীভাবে RPM হিসাব করে — সে শুধু <code>IEngine</code> নামের একটা <b>contract</b>-এর সাথে কথা বলে। নতুন <code>HybridEngine</code> যোগ করতে হলে <code>Car</code>-এর একটা অক্ষরও বদলাতে হয় না।</p>

<h3>২.৩ Fragile Base Class Problem</h3>
<p>উপরের inheritance চেইনে যে সমস্যাটা দেখা গেল, তার একটা নাম আছে — <span class="kw">fragile base class problem</span>। এটা বলে: বেস ক্লাসের implementation-এ একটা "নিরীহ" পরিবর্তন করলেও, সেই পরিবর্তন যেসব সাবক্লাস base-এর internal behavior-এর উপর (প্রত্যক্ষ বা পরোক্ষভাবে) নির্ভর করছিল, তাদের silently ভেঙে দিতে পারে — সাবক্লাসের একটা লাইনও না ছুঁয়ে।</p>
<div class="callout why"><span class="tag">কেন এটা ঘটে</span> Inheritance আসলে <b>white-box reuse</b> — সাবক্লাস বেস ক্লাসের ভেতরের কাজ করার পদ্ধতি সম্পর্কে (protected field, virtual method-এর ভেতরের ক্রম, কোন method কাকে কল করে) কিছু না কিছু ধরে নিতে বাধ্য হয়। বেস ক্লাসের author যখন implementation বদলায়, সে হয়তো জানেও না কোন সাবক্লাস কোন detail-এর উপর নির্ভর করছিল। Composition এর বিপরীতে <b>black-box reuse</b> — contained object-এর শুধু public interface-টুকু ব্যবহার হয়, ভেতরের কিছুই "leak" করে না, তাই ভেতরের পরিবর্তন বাইরে থেকে অদৃশ্য থাকে।</div>
<p>হায়ারার্কি যত গভীর হয়, ঝুঁকি তত বাড়ে — কারণ প্রতিটা নতুন লেভেল বেস ক্লাসের সাথে আরেকটা লুকানো নির্ভরতার সম্পর্ক যোগ করে। কয়েক লেভেল গভীর একটা হায়ারার্কি কার্যত একটা মাইনফিল্ডে পরিণত হয় — কোথায় change করলে কোথায় break হবে, সেটা আগে থেকে বলা যায় না।</p>

<h3>২.৪ Diamond Problem এবং কেন C#/Java-তে একাধিক ক্লাস inherit করা যায় না</h3>
<p>C# আর Java ইচ্ছাকৃতভাবে একটা ক্লাসকে একাধিক ক্লাস থেকে inherit করতে দেয় না (single inheritance of implementation)। এর পেছনের কারণটাও fragile base class সমস্যারই আরেকটা রূপ — একে বলে <span class="kw">diamond problem</span>: ধরা যাক <code>D</code> ক্লাস <code>B</code> আর <code>C</code> দুটোকেই inherit করছে, এবং <code>B</code> ও <code>C</code> দুজনেই <code>A</code>-কে inherit করেছে এবং <code>A</code>-এর একটা method আলাদাভাবে override করেছে। এখন <code>D</code>-এর অবজেক্ট থেকে সেই method কল করলে — <code>B</code>-এর ভার্সন চলবে, নাকি <code>C</code>-এর? কম্পাইলার নিজে থেকে এই দ্বন্দ্বের কোনো "সঠিক" উত্তর ঠিক করতে পারে না।</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> Interface দিয়ে "একাধিক inheritance" করা নিরাপদ, কারণ interface কোনো implementation বহন করে না — এটা শুধু <b>টাইপের</b> (contract-এর) multiple inheritance, ফাংশন বডির নয়। একটা ক্লাস <code>IEngine</code> আর <code>IDisposable</code> দুটোই implement করলে কোনো দ্বন্দ্ব নেই, কারণ প্রতিটা method-এর implementation ঠিক একটাই জায়গায় — সেই ক্লাসের নিজের ভেতরে — লেখা থাকে। Diamond সমস্যা তৈরি হয় তখনই, যখন দুইটা আলাদা path থেকে <b>দুই রকম implementation</b> একসাথে চলে আসার সম্ভাবনা তৈরি হয়। C++ multiple class inheritance অনুমতি দেয় বলেই virtual inheritance-এর মতো জটিল workaround লাগে এই দ্বন্দ্ব সামলাতে — C#/Java শুরু থেকেই এই পুরো সমস্যাটা এড়িয়ে গেছে composition এবং interface-কে প্রথম শ্রেণির টুল বানিয়ে।</div>

<h3>২.৫ কখন Inheritance, কখন Composition — একটা heuristic</h3>
<p>"Composition over inheritance" একটা <b>ডিফল্ট heuristic</b>, কোনো absolute নিয়ম না। প্রশ্নটা "inheritance ব্যবহার করব কি না" নয় — প্রশ্নটা হলো, কোন সম্পর্কটা বাস্তবে বেশি স্থিতিশীল এবং কোনটা সময়ের সাথে বদলাবে।</p>

<p>তাহলে কবে কোনটা বেছে নেবেন?</p>
<div class="grid2">
<div class="box"><span class="badge">✅ Inheritance উপযুক্ত</span><b>Shape</b> ক্লাস আর তার <code>Circle</code>/<code>Square</code> সাবক্লাস — যেখানে হায়ারার্কি ছোট, স্থিতিশীল, ভালোভাবে বোঝা যায়, আর মাত্র দুই-একটা virtual method (<code>Area()</code>, <code>Draw()</code>) আছে যেগুলো ভবিষ্যতে বদলানোর সম্ভাবনা কম। এখানে is-a সম্পর্কটা সত্যিই দৃঢ় এবং behavior variation সীমিত।</div>
<div class="box"><span class="badge">✅ Composition জেতে</span> Payment processing-এ <code>IPaymentGateway</code> (Stripe/PayPal/bKash) — behavior স্বাধীনভাবে পরিবর্তিত হয়, নতুন gateway নিয়মিত যোগ হতে পারে, runtime-এ config অনুযায়ী switch করতে হয়, আর হায়ারার্কি গভীর হলে ব্যবস্থাপনা কঠিন হয়ে পড়ত। এখানে behavior-ই আসল জিনিস, is-a সম্পর্ক গৌণ।</div>
</div>
<p>সংক্ষেপে বলা যায়: হায়ারার্কি যদি সত্যিই <b>ছোট, স্থিতিশীল, এবং সবার behavior মূলত এক</b> হয়, inheritance ঠিক আছে। যদি behavior <b>স্বাধীনভাবে বদলায়, runtime-এ swap দরকার হয়, বা হায়ারার্কি গভীর হতে থাকে</b> — composition বেছে নিন।</p>
<div class="card"><b>মনে রাখার নিয়ম:</b> নিজেকে জিজ্ঞেস করুন — "এই সম্পর্কটা কি সত্যিই <i>is-a</i>, নাকি আমি শুধু কোড reuse করার সুবিধার জন্য inheritance ব্যবহার করছি?" যদি উত্তর হয় শুধু reuse-এর জন্য, তাহলে সেটা composition দিয়ে করাই ভালো — inheritance-কে সংরক্ষণ করুন সত্যিকারের, স্থিতিশীল is-a সম্পর্কের জন্য।</div>

<h3>২.৬ Overcorrection-এর বিপদ: Compositional Soup</h3>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span> "Composition over inheritance" শুনে অনেকে এটাকে "inheritance কখনো ব্যবহার করা যাবে না" হিসেবে ধরে নেন। ফলাফল: প্রতিটা ছোট behavior-এর জন্য আলাদা ইন্টারফেস, আলাদা wrapper ক্লাস, আর delegation-এর উপর delegation — একটা সহজ কাজ বুঝতে ১০টা ফাইল খুলতে হয়। একে অনেকে ঠাট্টা করে বলেন <b>compositional soup</b>। একটা স্থিতিশীল, ছোট, ভালোভাবে বোঝা <code>Shape</code>-এর মতো হায়ারার্কির জন্য অহেতুক <code>IShape</code> + <code>ShapeBase</code> + তিন স্তরের delegation বানানো সমস্যার সমাধান নয়, বরং নতুন সমস্যা তৈরি করা। Heuristic-টা মনে রাখুন প্রসঙ্গসহ — inheritance খারাপ না, ভুল জায়গায় ব্যবহার করা খারাপ।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> Inheritance সাবক্লাসকে বেস ক্লাসের প্রতিটা implementation detail-এর সাথে বেঁধে ফেলে (fragile base class problem), আর জোর করে is-a সম্পর্ক চাপিয়ে দেয় যেখানে বাস্তবতা বেশি সূক্ষ্ম। Composition — has-a সম্পর্ক, ইন্টারফেসের পেছনে delegation — সেই কোপলিং আলগা করে, runtime-এ behavior swap করার সুযোগ দেয়, আর ভালোভাবে unit test করা সহজ করে। এটা একটা heuristic, absolute নিয়ম না: হায়ারার্কি ছোট-স্থিতিশীল হলে inheritance ঠিক আছে, behavior স্বাধীনভাবে বদলালে composition জেতে। যে instinct আমাদের বলছে "কংক্রিট ক্লাসের বদলে একটা swappable, decoupled contract-এর উপর নির্ভর করো" — এটাই পরের পাঁচ chapter জুড়ে <b>SOLID</b>-এর ভিত্তি। শুরু হবে সবচেয়ে মৌলিক নীতি দিয়ে — <b>Single Responsibility Principle (SRP)</b> — একটা ক্লাসের একটাই কারণে বদলানো উচিত, এই ধারণা থেকে।</div>
</template>

<h2 class="title">৩. SOLID — Single Responsibility Principle</h2>
<p class="lead">এখান থেকে শুরু হচ্ছে কোর্সের সবচেয়ে ব্যবহারিক অংশ — <span class="kw">SOLID</span>। আগের দুই chapter-এ OOP-এর ভিত্তি আর Composition over Inheritance দেখেছেন; এখন সেই ভিত্তির উপর দাঁড়িয়ে পাঁচটা নীতি শিখবেন যেগুলো বাস্তবে কোড maintainable রাখে। শুরুটা হচ্ছে প্রথম আর সবচেয়ে ভুল-বোঝা নীতি দিয়ে — Single Responsibility Principle।</p>

<h3>৩.১ SOLID — পাঁচটা নীতির সংক্ষিপ্ত মানচিত্র</h3>
<p><span class="kw">SOLID</span> হলো পাঁচটা object-oriented design নীতির সংক্ষিপ্ত রূপ, যা ২০০০-এর দশকে <b>Robert C. Martin</b> (পরিচিত নাম "Uncle Bob") গুছিয়ে উপস্থাপন করেন — যদিও প্রতিটা নীতির মূল ধারণা আরও আগে থেকেই ছিল। লক্ষ্য একটাই: এমন কোড লেখা যা সময়ের সাথে সাথে পরিবর্তন সহ্য করতে পারে, ভেঙে না পড়ে।</p>

<tr><td><b>D</b></td><td>Dependency Inversion Principle</td><td>High-level module low-level module-এর উপর সরাসরি নির্ভর করবে না, দুজনেই abstraction-এর উপর নির্ভর করবে — chapter ৭</td></tr>
</table>
<p>পাঁচটা নীতিই একসাথে পড়া যেত, কিন্তু বাস্তবে প্রতিটাই এতটা গভীর আর এতটা misconception-প্রবণ যে আলাদা আলাদা chapter-এ গভীরভাবে দেখা দরকার। এই chapter শুধু <b>S</b> নিয়ে — এবং দেখবেন, এই সবচেয়ে "সহজ" মনে হওয়া নীতিটাই আসলে সবচেয়ে বেশি ভুলভাবে প্রয়োগ করা হয়।</p>

<h3>৩.২ SRP-এর প্রকৃত সংজ্ঞা — "reason to change", না "একটা কাজ"</h3>
<p>বেশিরভাগ ডেভেলপার SRP শিখেন এভাবে: <i>"একটা class-এর একটাই কাজ করা উচিত"</i>। এটা শোনায় সহজ, কিন্তু এটা Robert C. Martin-এর আসল সংজ্ঞা <b>নয়</b> — এবং এই ভুল সরলীকরণই বেশিরভাগ ভুল প্রয়োগের কারণ। আসল সংজ্ঞা:</p>
<div class="card">
<b>"A class should have only one reason to change."</b><br>
একটা class-এর change করার কারণ থাকা উচিত ঠিক একটাই — "কাজ" (method সংখ্যা) নয়, বরং <span class="kw">reason to change</span>-এর সংখ্যা গোনা হয়।
</div>
<p>পার্থক্যটা সূক্ষ্ম কিন্তু সিদ্ধান্তমূলক। একটা class-এর ৫টা method থাকতে পারে, কিন্তু যদি সবগুলো একই কারণে, একই সময়ে, একই stakeholder-এর দাবিতে বদলায় — তাহলে সেই class পুরোপুরি SRP-compliant, যদিও তার একাধিক "কাজ" আছে বলে মনে হতে পারে। বিপরীতে, একটা class-এর একটামাত্র method থাকতে পারে, কিন্তু যদি সেই একটামাত্র method দুটো ভিন্ন, সম্পর্কহীন কারণে বদলাতে হয় — তাহলে সেটা SRP লঙ্ঘন করছে, যদিও দেখতে "একটাই কাজ" মনে হয়।</p>
<div class="callout mistake"><span class="tag">সাধারণ ভুল ধারণা — "SRP মানে ছোট class"</span>
"SRP মানে একটা class-এর একটাই method/কাজ থাকা উচিত" — এই ধারণা থেকে অনেকে ভাবেন SRP মানেই <b>ছোট class</b> বানানো। এটা ভুল। Size কোনো criterion না — <span class="kw">cohesion</span> (class-এর সব member একই উদ্দেশ্যে, একই reason-to-change-এর চারপাশে জোটবদ্ধ কিনা) হলো আসল মাপকাঠি। একটা class ৫০০ লাইনের হতে পারে এবং তারপরও পুরোপুরি SRP মেনে চলতে পারে, যদি সেই ৫০০ লাইনের প্রতিটা অংশ একই একক stakeholder-এর জন্য, একই কারণে বদলায়।</div>

<h3>৩.৩ Actor / Stakeholder — "reason to change" আসলে চেনার উপায়</h3>
<p>"Reason to change" একটা বিমূর্ত ধারণা মনে হতে পারে, কিন্তু এটাকে ধরার একটা কংক্রিট উপায় আছে — প্রশ্ন করুন: <b>এই পরিবর্তনটা দাবি করতে পারে এমন মানুষ/team (actor) কে?</b> Uncle Bob নিজেই SRP-এর সংজ্ঞা পরে refine করে বলেছিলেন — "a module should be responsible to one, and only one, actor" (<span class="kw">actor</span> = একটা নির্দিষ্ট role/stakeholder যে একই ধরনের পরিবর্তন চায়)।</p>
<p>ক্লাসিক উদাহরণ — একটা <code>Employee</code> class-এর একটা মাত্র method <code>CalculatePay()</code>। দেখতে এটা "একটাই কাজ" মনে হলেও, বাস্তবে দুইটা সম্পূর্ণ ভিন্ন actor এর পরিবর্তন চাইতে পারে এই একই method-এ:</p>
<div class="diagram"><pre>
        Employee
        └── CalculatePay()
              ▲                                 ▲
              │                                 │
     change: ট্যাক্স ব্র্যাকেট,          change: pay-period batching
     বোনাস/কমিশন ফর্মুলা                  logic, external payroll API-র
              │                            output format
              │                                 │
        Finance Dept                    IT / Payroll-Ops Dept
   (business rule বদলালে এখানে হাত        (টেকনিক্যাল/integration কারণে
    দিতে হবে)                             এখানে হাত দিতে হবে)

   একই method — কিন্তু দুই ভিন্ন actor, দুই ভিন্ন reason to change → SRP লঙ্ঘন
</pre></div>
<div class="callout why"><span class="tag">কেন actor-ভিত্তিক চিন্তা গুরুত্বপূর্ণ</span> Finance দল যখন ট্যাক্স রুল বদলাতে বলে, আর IT/Payroll দল যখন payroll API integration বদলাতে বলে — দুটো অনুরোধই একই <code>CalculatePay()</code> method-এ গিয়ে পড়ে। ফলে Finance-এর দাবিতে করা একটা পরিবর্তন ভুলবশত IT-এর অংশে bug ঢুকিয়ে দিতে পারে, এবং উল্টোটাও সত্যি। দুই actor-এর কোড একই জায়গায় জট পাকিয়ে থাকলে, একজনের পরিবর্তনের ঝুঁকি অন্যজনের কাঁধে চেপে বসে — অথচ তাদের মধ্যে বাস্তব কোনো নির্ভরতা নেই। এটাই SRP-এর মূল উদ্বেগ: কাপলিং নয়, বরং <b>ভিন্ন ভিন্ন কারণে বদলানো কোডকে একসাথে জড়িয়ে রাখা</b>।</div>
<div class="grid2">
<div class="box"><b>হিউরিস্টিক ১ — actor প্রশ্ন</b><br>"এই class/method-টা কে কে বদলাতে বলতে পারে?" যদি উত্তর একাধিক ভিন্ন role/team হয়, সেখানে সম্ভাব্য SRP লঙ্ঘন আছে।</div>
<div class="box"><b>হিউরিস্টিক ২ — একসাথে বদলানোর প্রশ্ন</b><br>"এই দুটো পরিবর্তন কি সবসময় একই সময়ে, একই কারণে ঘটবে?" যদি না হয় — অর্থাৎ একটা বদলাতে পারে আরেকটা স্থির রেখেই — তাহলে তারা আলাদা responsibility।</div>
</div>

<h3>৩.৪ বাস্তব উদাহরণ — Invoice class-এর SRP লঙ্ঘন ও তার Refactor</h3>
<h4>আগে (Before) — তিনটা reason to change একসাথে জট পাকানো</h4>
<p>নিচের <code>Invoice</code> class দেখতে সুশৃঙ্খল মনে হতে পারে — সব invoice-সংক্রান্ত logic এক জায়গায়। কিন্তু এখানে আসলে তিনটা সম্পূর্ণ ভিন্ন actor-এর জন্য তিনটা ভিন্ন reason to change লুকিয়ে আছে।</p>
<pre><span class="c">// BEFORE — একই class-এ business logic, presentation, আর persistence একসাথে</span>
class Invoice
{
    private readonly List&lt;InvoiceLine&gt; _lines = new();

    public void AddLine(string item, decimal price, int qty) =>
        _lines.Add(new InvoiceLine(item, price, qty));

    <span class="c">// Reason #1 — Finance dept: VAT/discount policy বদলালে এখানে হাত দিতে হয়</span>
    public decimal CalculateTotal()
    {
        decimal subtotal = _lines.Sum(l => l.Price * l.Quantity);
        decimal tax = subtotal * 0.15m;
        return subtotal + tax;
    }

    <span class="c">// Reason #2 — Reporting/UI team: প্রিন্ট ফরম্যাট বদলালে এখানে হাত দিতে হয়</span>
    public void PrintInvoice()
    {
        Console.WriteLine("---- INVOICE ----");
        foreach (var line in _lines)
            Console.WriteLine($"{line.Item,-20} {line.Quantity,3} x {line.Price,8:C}");
        Console.WriteLine($"Total: {CalculateTotal():C}");
    }

    <span class="c">// Reason #3 — DBA/Infra team: SQL Server থেকে PostgreSQL-এ migration হলে এখানে হাত দিতে হয়</span>
    public void SaveToDatabase()
    {
        using var conn = new SqlConnection(_connectionString);
        conn.Open();
        var cmd = new SqlCommand("INSERT INTO Invoices (...) VALUES (...)", conn);
        cmd.ExecuteNonQuery();
    }

    private readonly string _connectionString = "...";
}</pre>
<p>Business rule (tax %), output format (console vs PDF vs JSON), আর storage technology (SQL Server vs PostgreSQL vs NoSQL) — এই তিনটার কোনোটার সাথে বাকি দুটোর প্রকৃত নির্ভরতা নেই, অথচ তিনটাই একই class-এ বাঁধা। Reporting team যদি invoice print করার ফরম্যাট বদলাতে চায়, তাকে সেই একই ফাইল ছুঁতে হবে যেখানে DBA persistence logic লিখেছে — merge conflict আর ভুল করে অন্য কারো কোড ভেঙে ফেলার ঝুঁকি দুটোই বাড়ে।</p>

<h4>পরে (After) — প্রতিটা class-এর একটাই reason</h4>
<pre><span class="c">// AFTER — প্রতিটা class একটা মাত্র actor/reason-এর জন্য দায়ী</span>
class Invoice                                    <span class="c">// reason: business/finance rule</span>
{
    private readonly List&lt;InvoiceLine&gt; _lines = new();
    public IReadOnlyList&lt;InvoiceLine&gt; Lines => _lines;

    public void AddLine(string item, decimal price, int qty) =>
        _lines.Add(new InvoiceLine(item, price, qty));

    public decimal CalculateTotal()
    {
        decimal subtotal = _lines.Sum(l => l.Price * l.Quantity);
        return subtotal + subtotal * 0.15m;
    }
}

class InvoicePrinter                             <span class="c">// reason: presentation/format</span>
{
    public void Print(Invoice invoice)
    {
        Console.WriteLine("---- INVOICE ----");
        foreach (var line in invoice.Lines)
            Console.WriteLine($"{line.Item,-20} {line.Quantity,3} x {line.Price,8:C}");
        Console.WriteLine($"Total: {invoice.CalculateTotal():C}");
    }
}

class InvoiceRepository                          <span class="c">// reason: persistence technology</span>
{
    private readonly string _connectionString;
    public InvoiceRepository(string connectionString) => _connectionString = connectionString;

    public void Save(Invoice invoice)
    {
        using var conn = new SqlConnection(_connectionString);
        conn.Open();
        var cmd = new SqlCommand("INSERT INTO Invoices (...) VALUES (...)", conn);
        cmd.ExecuteNonQuery();
    }
}</pre>
<p>লক্ষ করুন — <code>Invoice</code> এখন শুধু ডেটা আর গণনার নিয়ম ধরে রাখে; এটা কীভাবে দেখানো হবে বা কোথায় সংরক্ষিত হবে তা জানে না। এখন PDF export যোগ করতে চাইলে শুধু নতুন <code>InvoicePdfExporter</code> লিখলেই চলে — <code>Invoice</code> বা <code>InvoiceRepository</code>-কে ছোঁয়ারই দরকার নেই।</p>

<div class="callout behind"><span class="tag">পর্দার আড়ালে — এই বিভাজনই পরের নীতির ভিত্তি</span> লক্ষ করুন, refactor করার পর <code>InvoicePrinter</code> নতুন একটা export format (PDF, JSON) যোগ করার সময় <code>Invoice</code>-কে স্পর্শ করার দরকার পড়ে না। এই "existing code পরিবর্তন ছাড়াই নতুন behavior যোগ করা যাচ্ছে" গুণটাই আসলে chapter ৪-এর বিষয় — Open/Closed Principle। SRP দিয়ে responsibility-গুলো আলাদা করাটাই OCP প্রয়োগের পূর্বশর্ত — যা এখনো আলাদা করা হয়নি, তাকে "বন্ধ" রেখে extend করা যায় না।</div>

<h3>৩.৫ SRP আর Testability</h3>
<p>SRP-এর একটা সরাসরি, দৈনন্দিন সুফল হলো <span class="kw">unit test</span> লেখা সহজ হয়ে যাওয়া। যে class-এর একটাই responsibility, তার জন্য test লেখাও সহজ — কারণ test করার জন্য একটাই ধরনের behavior mock/verify করতে হয়। উপরের before-উদাহরণে <code>Invoice.CalculateTotal()</code> unit test করতে গেলে পুরো class instantiate করতে হয়, যার ভেতরে database connection string-ও বাঁধা আছে — অথচ এই test-টার সাথে database-এর কোনো সম্পর্কই নেই।</p>
<p>Refactor-এর পর <code>Invoice.CalculateTotal()</code> টেস্ট করতে শুধু একটা plain object লাগে — কোনো database, কোনো console output, কোনো external dependency ছাড়াই:</p>
<pre><span class="c">// শুধু business logic টেস্ট হচ্ছে — কোনো DB/console dependency নেই</span>
[Fact]
public void CalculateTotal_AddsVat_Correctly()
{
    var invoice = new Invoice();
    invoice.AddLine("Widget", price: 100m, qty: 2);

    decimal total = invoice.CalculateTotal();

    Assert.Equal(230m, total); <span class="c">// 200 + 15% VAT</span>
}</pre>
<div class="callout best"><span class="tag">Test-এর দৃষ্টিকোণ থেকে SRP যাচাই</span> একটা সহজ ব্যবহারিক চেক: যদি একটা class-এর জন্য test লিখতে গিয়ে বারবার এমন dependency mock করতে হয় যেগুলো test-এর মূল বিষয়ের সাথে সম্পর্কহীন (যেমন business-rule test-এ database mock করা লাগছে), সেটা একটা সংকেত যে class-টা একাধিক responsibility বহন করছে। ভালোভাবে factored class-এর test-এ mock/setup কোড ন্যূনতম থাকে, কারণ dependency-র সংখ্যা আর ধরন দুটোই সীমিত।</div>

<h3>৩.৬ সাধারণ ভুল — SRP-কে বাড়াবাড়ি করে প্রয়োগ করা</h3>
<p>"ভুল ধারণা" (৩.২) থেকে উল্টো দিকের বিপদও আসে। যারা SRP-কে আক্ষরিক অর্থে "প্রতিটা class একটামাত্র method" ধরে নেন, তারা প্রায়ই একটা সহজ ৩-লাইনের calculation-কেও আলাদা <code>TaxCalculator</code>, <code>SubtotalCalculator</code>, <code>DiscountCalculator</code>, <code>TotalAggregator</code>-এ ভেঙে ফেলেন — প্রতিটার একটাই method, কোনোটারই স্পষ্ট, স্বাধীন identity নেই।</p>
<div class="callout mistake"><span class="tag">Over-fragmentation — anti-pattern-এর পূর্বাভাস</span> এই বাড়াবাড়ি প্রয়োগের ফল হলো এক গাদা ছোট ছোট class যাদের কোনোটাই বোঝার মতো একক দায়িত্ব বহন করে না — বরং একটামাত্র যৌক্তিক অপারেশন কৃত্রিমভাবে টুকরো টুকরো করা হয়েছে। এতে সুবিধা তো হয়ই না, বরং code navigate করা কঠিন হয়ে যায় (একটা simple calculation বুঝতে ৫টা ফাইল খুলতে হয়), আর প্রতিটা class-এর constructor-এ বাকি সবগুলোকে wire করতে হয়। এই প্যাটার্ন — অতিরিক্ত fragmentation, বা তার বিপরীত (anemic domain model যেখানে সব ক্লাস শুধু data ধরে, behavior বাইরে চলে যায়) — বিস্তারিতভাবে দেখা হবে chapter ১২-এর Anti-patterns আলোচনায়। এখনকার নিয়ম সহজ: <b>ভাঙুন যখন সত্যিকারের ভিন্ন actor/reason আছে, শুধু "ছোট রাখতে হবে" এই বিশ্বাসে নয়।</b></div>

<h3>৩.৭ SRP লঙ্ঘনের লক্ষণ চেনা</h3>
<p>প্রতিদিনের কোডে SRP লঙ্ঘন খুঁজে বের করার জন্য গভীর তাত্ত্বিক বিশ্লেষণের দরকার নেই — কিছু চেনা, পুনরাবৃত্ত লক্ষণ দেখলেই সন্দেহ করা যায়:</p>
<table>
<tr><th>SRP লঙ্ঘনের লক্ষণ</th><th>ভালোভাবে factored class</th></tr>
<tr><td><span class="kw">God class</span> — শত শত লাইন, বহু unrelated method, বহু dependency</td><td>ছোট থেকে মাঝারি, সবগুলো method একই actor/উদ্দেশ্যকে সেবা দেয়</td></tr>
<tr><td>Method-এর নামে "And"/"Or" থাকে (যেমন <code>ValidateAndSave()</code>, <code>CalculateAndPrint()</code>)</td><td>প্রতিটা method-এর নাম একটামাত্র স্পষ্ট verb-এ বর্ণনা করা যায়</td></tr>
<tr><td>ক্লাসের নাম সংক্ষেপে বলা কঠিন — শেষমেশ "Manager", "Processor", "Helper", "Utility" জাতীয় catch-all নাম দিতে হয়</td><td>ক্লাসের নাম তার একমাত্র দায়িত্ব স্পষ্টভাবে বর্ণনা করে (<code>InvoicePrinter</code>, <code>InvoiceRepository</code>)</td></tr>
<tr><td>একই file/class-এ ভিন্ন ভিন্ন team-এর ঘন ঘন merge conflict হয়</td><td>ভিন্ন দায়িত্বের কোড আলাদা file/class-এ থাকে, team-ভিত্তিক conflict কম হয়</td></tr>
<tr><td>Constructor-এ অনেকগুলো সম্পর্কহীন dependency inject হয় (DB connection, logger, formatter, external API client — সব একসাথে)</td><td>Constructor-এ অল্প, একে অপরের সাথে cohesive dependency থাকে</td></tr>
</table>
<p><span class="badge">চ্যাপ্টার ৪ → Open/Closed Principle</span> <span class="badge">চ্যাপ্টার ১২ → Anti-patterns</span></p>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
SOLID পাঁচটা নীতির সংক্ষিপ্ত রূপ — এই chapter দিয়ে শুরু হলো প্রথমটা, Single Responsibility Principle। SRP-এর আসল সংজ্ঞা "একটা class-এর একটাই কাজ করা উচিত" নয় — বরং "একটা class-এর change করার কারণ থাকা উচিত ঠিক একটাই", যেখানে সেই কারণ বাঁধা থাকে একটামাত্র actor/stakeholder-এর সাথে। <code>Invoice</code> class-এর উদাহরণে দেখলেন কীভাবে business logic, presentation, আর persistence — তিনটা ভিন্ন actor-এর তিনটা ভিন্ন reason — একসাথে জট পাকিয়ে থাকলে merge conflict বাড়ে, ঝুঁকিপূর্ণ coupling তৈরি হয়, আর test লেখা কঠিন হয়ে যায়; আলাদা <code>Invoice</code>, <code>InvoicePrinter</code>, <code>InvoiceRepository</code>-এ ভাগ করলে প্রতিটা সমস্যাই দূর হয়। তবে সতর্ক থাকুন — SRP মানে ছোট class বানানো নয়, আর বাড়াবাড়ি প্রয়োগ করলে অর্থহীন fragmentation তৈরি হয় (chapter ১২-এ যা বিস্তারিত দেখবেন)। SRP দিয়ে responsibility আলাদা করাটাই আসলে পরের নীতির পূর্বশর্ত — কারণ যা এখনো আলাদা করা হয়নি, তাকে বিদ্যমান কোড না ছুঁয়ে "extend" করা যায় না। ঠিক এই প্রশ্ন দিয়েই শুরু হবে পরের চ্যাপ্টার — Open/Closed Principle।
</div>

<h2 class="title">৪. SOLID — Open/Closed Principle</h2>
<p class="lead">নতুন business requirement এলে existing, already-tested কোড না ছুঁয়েই নতুন behavior যোগ করা যায় কিনা — এটাই OCP-এর আসল প্রশ্ন। এই চ্যাপ্টারে দেখব কেন if/else-এর পাহাড় একটা code smell, আর কীভাবে <span class="kw">abstraction</span> ও <span class="kw">polymorphism</span> (চ্যাপ্টার ১ থেকে মনে করুন) দিয়ে সেটা সমাধান হয়।</p>

<h3>সংজ্ঞা — Open for Extension, Closed for Modification</h3>
<p>১৯৮৮ সালে Bertrand Meyer প্রথম এই নীতি প্রস্তাব করেন, পরে Robert C. Martin একে SOLID-এর "O" হিসেবে জনপ্রিয় করেন। মূল কথাটা এক লাইনে —</p>
<div class="callout why"><span class="tag">মূল সংজ্ঞা</span>
"Software entities (class, module, function) should be <span class="kw">open for extension</span>, but <span class="kw">closed for modification</span>।" — অর্থাৎ নতুন behavior/feature যোগ করতে হলে existing, working, tested কোড <b>এডিট না করে</b> নতুন কোড <b>যোগ করেই</b> কাজটা করা যাওয়া উচিত। কেন এটা গুরুত্বপূর্ণ? প্রতিবার existing method এডিট করলে সেই method-এর সব পুরনো, ইতিমধ্যে সঠিকভাবে কাজ করা case-গুলোতেও regression-এর ঝুঁকি তৈরি হয় — নতুন কোড শুধু নতুন case-এর জন্যই ঝুঁকিপূর্ণ, পুরনো কোড এডিট করলে পুরনো, প্রমাণিত behavior-ও ঝুঁকিতে পড়ে।</div>

<h3>উদাহরণ — Discount Calculator</h3>
<p>ধরুন একটা e-commerce সিস্টেমে customer type অনুযায়ী discount হিসাব করতে হয়। শুরুতে স্বাভাবিকভাবেই একটা simple if/else বা switch দিয়ে শুরু হয়।</p>
<pre><span class="c">// BEFORE — প্রতিটা নতুন customer type মানেই এই method-এ ফিরে আসা</span>
public class DiscountCalculator
{
    public decimal CalculateDiscount(string customerType, decimal amount)
    {
        switch (customerType)
        {
            case "Regular":
                return amount * 0.02m;
            case "Premium":
                return amount * 0.05m;
            case "VIP":
                return amount * 0.10m;
            default:
                throw new ArgumentException("Unknown customer type");
        }
    }
}</pre>
<p>প্রথম দৃষ্টিতে এটা সম্পূর্ণ স্বাভাবিক কোড — ছোট, readable, কাজ করে। সমস্যা তখন শুরু হয় যখন business বলে "এখন থেকে <b>Corporate</b> customer-দের জন্যও ১৫% discount চাই"। এই একটা নতুন requirement মেটাতে আপনাকে <code>CalculateDiscount</code> method-এর ভেতরে ঢুকে existing switch statement-টা এডিট করতে হবে — যেই method ইতিমধ্যে Regular/Premium/VIP-এর জন্য production-এ সঠিকভাবে কাজ করছে। এটাই OCP লঙ্ঘন — modification ছাড়া extension সম্ভব হচ্ছে না।</p>
<div class="callout mistake"><span class="tag">বাস্তব ঝুঁকি — regression</span>
এই method যত বড় হতে থাকে (৩টা case থেকে ১০টা, ২০টা), প্রতিবার এডিট করার সময় ভুল করে একটা বন্ধনী মিসপ্লেস করা, বা একটা existing case-এর logic ভুলবশত বদলে ফেলা, বা কারো merge conflict-এ পুরনো case হারিয়ে যাওয়ার সম্ভাবনা বাড়তেই থাকে। আর সবচেয়ে বিরক্তিকর ব্যাপার — এই method-টাই সাধারণত এক জায়গায় না থেকে কোডবেসের একাধিক জায়গায় (invoice, report, UI label) একই ধরনের switch হিসেবে ছড়িয়ে থাকে, তাই প্রতিটা নতুন customer type মানে <b>একাধিক জায়গায় একই এডিট</b> — আর একটা জায়গা ভুলে গেলে সেটাই bug।</div>

<h3>রিফ্যাক্টর — Abstraction দিয়ে Extension Point তৈরি</h3>
<p>সমাধান হলো — "কোন customer type-এ কী discount" এই সিদ্ধান্তটাকে একটা common <span class="kw">abstraction</span>-এর পেছনে সরিয়ে ফেলা, যাতে <code>DiscountCalculator</code> কোনো নির্দিষ্ট customer type সম্পর্কে কিছু না জানে — শুধু interface-টা জানে।</p>
<pre><span class="c">// AFTER — interface + এক-একটা implementation, calculator শুধু abstraction-এর উপর নির্ভরশীল</span>
public interface IDiscountStrategy
{
    decimal CalculateDiscount(decimal amount);
}

public class RegularDiscount : IDiscountStrategy
{
    public decimal CalculateDiscount(decimal amount) => amount * 0.02m;
}

public class PremiumDiscount : IDiscountStrategy
{
    public decimal CalculateDiscount(decimal amount) => amount * 0.05m;
}

public class VipDiscount : IDiscountStrategy
{
    public decimal CalculateDiscount(decimal amount) => amount * 0.10m;
}

public class DiscountCalculator
{
    private readonly IDiscountStrategy _strategy;

    public DiscountCalculator(IDiscountStrategy strategy) => _strategy = strategy;

    public decimal CalculateDiscount(decimal amount) => _strategy.CalculateDiscount(amount);
}</pre>
<p>এখন Corporate customer যোগ করতে হলে —</p>
<pre><span class="c">// নতুন requirement → শুধু একটা নতুন class, existing কিছুই এডিট হয় না</span>
public class CorporateDiscount : IDiscountStrategy
{
    public decimal CalculateDiscount(decimal amount) => amount * 0.15m;
}</pre>
<p><code>DiscountCalculator</code> class, আর <code>RegularDiscount</code>/<code>PremiumDiscount</code>/<code>VipDiscount</code> — এই একটা লাইনও এডিট হলো না। শুধু একটা <b>নতুন</b> ফাইলে <b>নতুন</b> class যোগ হলো, আর caller (যেখানে DI দিয়ে সঠিক strategy resolve হয়) সেটা ব্যবহার শুরু করল। পুরনো, প্রমাণিত তিনটা class একদম অক্ষত রইল — regression-এর কোনো সুযোগই নেই।</p>
<div class="callout mistake"><span class="tag">স্বাভাবিক প্রশ্ন — if/else তো তাহলে কোথাও একটা থাকতেই হবে?</span>
এখানে একটা খুবই স্বাভাবিক সন্দেহ জাগা উচিত — <code>customerType</code> থেকে ঠিক কোন <code>IDiscountStrategy</code> ব্যবহার হবে, এই সিদ্ধান্তটা তো কোথাও না কোথাও নিতেই হবে। তাহলে কি if/else-টা শুধু <b>সরানো</b> হলো, মুছে ফেলা হলো না? উত্তর — হ্যাঁ, একটা mapping (customerType → strategy) থাকবেই, কিন্তু সেটা এখন একটা ছোট, বিচ্ছিন্ন resolution point-এ বাস করে, discount-এর % হিসাব করা business logic-এর সাথে মেশানো না:
<pre><span class="c">// resolution point — শুধু "কোনটা চলবে" তা ঠিক করে, কোনো % হিসাব এখানে নেই</span>
public static class DiscountStrategyResolver
{
    private static readonly Dictionary&lt;string, IDiscountStrategy&gt; _map = new()
    {
        ["Regular"]   = new RegularDiscount(),
        ["Premium"]   = new PremiumDiscount(),
        ["VIP"]       = new VipDiscount(),
        ["Corporate"] = new CorporateDiscount()   <span class="c">// নতুন type এলে এখানে এক লাইন যোগ হয়</span>
    };

    public static IDiscountStrategy Resolve(string customerType) => _map[customerType];
}</pre>
নতুন customer type এলে এই resolver-টাও একবার ছোঁয়া লাগবে ঠিকই — কিন্তু সেটা একটা এক-লাইনের mapping যোগ, কোনো calculation logic এডিট না, আর এই একটামাত্র জায়গা ছাড়া বাকি পুরো কোডবেসে <code>"Corporate"</code> শব্দটাই কোথাও লেখা লাগে না। OCP প্রতিশ্রুতি দেয় না যে branching সম্পূর্ণ শূন্যে নেমে আসবে — এটা প্রতিশ্রুতি দেয় সেই branching-কে business rule থেকে আলাদা, ছোট, কম-ঝুঁকিপূর্ণ একটা জায়গায় বন্দী করার।
</div>

<h3>দুইটা ডিজাইনের ভিজ্যুয়াল তুলনা</h3>
<div class="diagram"><pre>
BEFORE — একটা method, প্রতিটা নতুন case মানেই এডিট        AFTER — interface + pluggable implementation
──────────────────────────────────────────────           ──────────────────────────────────────────────
  CalculateDiscount(type, amount)                            IDiscountStrategy
    │                                                            │
    ├─ if type == "Regular"  → ...                               ├─ RegularDiscount     (existing, untouched)
    ├─ if type == "Premium"  → ...                               ├─ PremiumDiscount     (existing, untouched)
    ├─ if type == "VIP"      → ...                               ├─ VipDiscount         (existing, untouched)
    └─ if type == "Corporate"→ ...  ⚠ এখানে এডিট করতে হলো         └─ CorporateDiscount   ⭐ শুধু নতুন class যোগ

  পরের বার নতুন type এলে আবার এই method-ই এডিট হবে          পরের বার নতুন type এলে আরেকটা নতুন class যোগ হবে,
  → regression-এর ঝুঁকি প্রতিবার নতুন করে                    existing class-গুলো এবারও অক্ষত থাকবে
</pre></div>

<h3>মেকানিজম — Abstraction + Polymorphism কীভাবে "Closed" বানায়</h3>
<p>OCP কোনো জাদু নয় — এটা চ্যাপ্টার ১-এ শেখা দুইটা মৌলিক OOP concept-এর প্রয়োগ মাত্র। <code>DiscountCalculator</code> কখনোই <code>RegularDiscount</code> বা <code>VipDiscount</code>-এর concrete type জানে না — এটা শুধু <code>IDiscountStrategy</code> নামের <span class="kw">abstraction</span>-এর উপর নির্ভরশীল। Runtime-এ ঠিক কোন implementation চলবে তা নির্ধারিত হয় <span class="kw">polymorphism</span>-এর মাধ্যমে — একই method call (<code>_strategy.CalculateDiscount(amount)</code>), কিন্তু injected object-এর ধরন অনুযায়ী ভিন্ন ভিন্ন actual code চলে। যেহেতু calculator শুধু "contract"-এর সাথে কথা বলে, নতুন contract-implementer যোগ করা মানেই calculator-এর কোনো কোড না জেনেই, না ছুঁয়েই নতুন behavior সমর্থন করা।</p>
<table>
<tr><th>উপাদান</th><th>ভূমিকা</th></tr>
<tr><td><span class="kw">Abstraction</span> (<code>IDiscountStrategy</code>)</td><td>"extension point" সংজ্ঞায়িত করে — নতুন behavior ঠিক কোন shape-এ যোগ হবে তার contract</td></tr>
<tr><td><span class="kw">Polymorphism</span></td><td>Compile-time-এ calculator জানে না কোন implementation চলবে; runtime-এ সঠিক object-এর method চলে</td></tr>
<tr><td>Consumer (<code>DiscountCalculator</code>)</td><td>Concrete class-এর উপর নয়, শুধু abstraction-এর উপর নির্ভরশীল — তাই নতুন implementation যোগ হলেও এটা "closed" থাকে</td></tr>
</table>

<div class="callout behind"><span class="tag">পর্দার আড়ালে — এটাই Strategy Pattern</span>
এইমাত্র যা করলাম — একটা algorithm-family-কে আলাদা class-এ বের করে এনে, একটা common interface-এর পেছনে interchangeable করে ফেলা — এটার নিজস্ব নাম আছে। OCP হলো <b>তাত্ত্বিক নীতি</b> (কেন এভাবে ডিজাইন করা উচিত), আর <span class="kw">Strategy pattern</span> হলো এই নীতিটাকে বাস্তবে প্রয়োগ করার <b>কাঠামোগত সমাধান</b> (structurally ঠিক কীভাবে করবেন)। চ্যাপ্টার ১০ (Behavioral Patterns)-এ আমরা ঠিক এই একই <code>DiscountCalculator</code>/<code>IDiscountStrategy</code> shape-টা আবার দেখব — সেখানে formal নামকরণ, variation, আর আরও কিছু বাস্তব use-case নিয়ে।</div>

<h3>সাধারণ ভুল ধারণা — "OCP মানে ফাইল আর কখনো ছোঁয়া যাবে না"</h3>
<div class="callout mistake"><span class="tag">Common misconception</span>
নতুনদের একটা সাধারণ ভুল ধারণা হলো — OCP মানে "একবার class লেখা হয়ে গেলে সেটা চিরদিনের জন্য immutable, কোনো এডিটই করা যাবে না।" এটা সঠিক নয়। OCP শুধু বলে <b>নতুন feature/behavior</b> যোগ করার জন্য existing, ইতিমধ্যে-সঠিক logic এডিট করা উচিত নয়। কিন্তু <b>bug fix</b> সম্পূর্ণ ভিন্ন ব্যাপার — যদি <code>PremiumDiscount</code>-এ ভুল percentage থাকে (৫%-এর বদলে ৪% লেখা হয়ে গেছে), সেটা ঠিক করতে আপনাকে সেই class-ই এডিট করতে হবে, এবং করাই উচিত। OCP bug fix-কে নিষিদ্ধ করে না — এটা শুধু বলে <b>correct, working logic-এর পাশে নতুন logic যোগ করার সময় সেই পুরনো logic-কে ঝুঁকিতে ফেলবেন না।</b></div>

<h3>সাধারণ ভুল — অতিরিক্ত প্রয়োগ (Premature Abstraction)</h3>
<p>OCP-এর বিপরীত দিকেও একটা বাস্তব বিপদ আছে — নীতিটা এত মনে ধরে যায় যে ডেভেলপাররা "ভবিষ্যতে হয়তো দরকার হতে পারে" ভেবে <b>প্রতিটা</b> class-এর সামনে একটা interface, প্রতিটা logic-এর জন্য একটা abstract layer বসিয়ে দেন — এমনকি যেখানে দ্বিতীয় কোনো implementation-এর বাস্তব সম্ভাবনাই নেই।</p>
<div class="callout mistake"><span class="tag">Over-engineering — YAGNI-এর সাথে সংঘাত</span>
একটা interface যার ঠিক একটাই implementation আছে, আর কোনো বাস্তব roadmap নেই দ্বিতীয় কোনো implementation আসার — এটা OCP-এর সুবিধা ছাড়াই শুধু <b>indirection</b> যোগ করে। প্রতিটা call এখন এক লাফ বেশি ঘুরে যায় (interface → implementation), IDE-তে "Go to definition" একবার বেশি ক্লিক লাগে, নতুন টিমমেট বুঝতে বেশি সময় নেয় — অথচ বিনিময়ে কোনো real flexibility পাওয়া যাচ্ছে না, কারণ কখনো দ্বিতীয় case আসবেই না। এটা <span class="kw">YAGNI</span> ("You Aren't Gonna Need It") নীতির সাথে সরাসরি সংঘাতে যায় — চ্যাপ্টার ১২-এ (Anti-patterns) আমরা এই "just in case" abstraction-কে একটা নির্দিষ্ট নাম দিয়ে বিস্তারিত দেখব।</div>

<h3>কখন দরকার, কখন অতিরিক্ত — সিদ্ধান্তের সংকেত</h3>
<table>
<tr><th>সংকেত</th><th>OCP দরকার (extension point বানান)</th><th>OCP অতিরিক্ত প্রয়োগ (interface সরিয়ে ফেলুন)</th></tr>
<tr><td>Type-code-এর উপর branching</td><td>একটা type-code-এর উপর if/else বা switch, যা সময়ের সাথে নতুন case পেতে থাকে (customer type, payment method, notification channel)</td><td>একটা interface-এর ঠিক <b>একটাই</b> implementation আছে, আর কোনো দ্বিতীয় case কখনো আসার বাস্তব সম্ভাবনা নেই</td></tr>
<tr><td>বাগের ধরন</td><td>একই ধরনের bug বারবার ফিরে আসে — "নতুন case যোগ করতে গিয়ে পুরনো case ভেঙে গেছে"</td><td>Interface/abstract layer শুধু "future-proof" ভাবনা থেকে বসানো, বাস্তব bug history নেই</td></tr>
<tr><td>একাধিক জায়গায় ছড়িয়ে থাকা logic</td><td>একই decision (কোন customer type-এ কী rate) কোডবেসের একাধিক জায়গায় প্রায়-অনুরূপ switch হিসেবে বারবার লেখা হচ্ছে</td><td>Logic ছোট, একবারই লেখা, একটাই জায়গায় থাকে, আর পরিবর্তনের কোনো ইঙ্গিত নেই</td></tr>
</table>
<div class="callout best"><span class="tag">ব্যবহারিক নিয়ম</span>
Rule of thumb: প্রথম implementation যখন লিখছেন, সাধারণত interface দরকার নেই — সরাসরি concrete class লিখুন। যখন <b>দ্বিতীয়</b> বাস্তব variation সত্যিই আসে (বা আসার স্পষ্ট, নথিভুক্ত পরিকল্পনা থাকে), তখনই দুটোর কমন contract বের করে interface বানান। এভাবে abstraction সবসময় বাস্তব প্রয়োজনের প্রতিক্রিয়ায় আসে, কল্পনার প্রতিক্রিয়ায় নয়।</div>

<h3>বাস্তব প্রভাব — টেস্টিং ও ডিপ্লয়মেন্টে</h3>
<div class="grid2">
<div class="box"><b>Regression risk কমে</b> — নতুন <code>CorporateDiscount</code> class-এর জন্য নতুন unit test লিখলেই যথেষ্ট। <code>RegularDiscountTests</code>, <code>PremiumDiscountTests</code>, <code>VipDiscountTests</code> — এই কোনোটা আবার রান করে দেখার দরকার নেই যে কিছু ভেঙে গেছে কিনা (যদিও ভালো practice হিসেবে পুরো suite-ই CI-তে চলবে, কিন্তু <b>manual re-verification</b>-এর প্রয়োজন কমে যায়)।</div>
<div class="box"><b>Parallel development সহজ হয়</b> — দুইজন developer একই সময়ে দুটো নতুন customer type নিয়ে কাজ করলে, দুজনেই আলাদা আলাদা নতুন ফাইলে কাজ করছে — merge conflict-এর সম্ভাবনা প্রায় শূন্যে নেমে আসে, কারণ কেউই একই existing ফাইল এডিট করছে না।</div>

OCP বলে — নতুন behavior যোগ করার সময় existing, tested কোড এডিট না করে নতুন কোড <b>যোগ</b> করেই কাজটা করা উচিত, কারণ প্রতিটা edit পুরনো, প্রমাণিত logic-কে regression-এর ঝুঁকিতে ফেলে। এই "closed for modification" বাস্তবে অর্জিত হয় দুটো পরিচিত হাতিয়ার দিয়ে — <span class="kw">abstraction</span> (একটা interface দিয়ে extension point সংজ্ঞায়িত করা) আর <span class="kw">polymorphism</span> (runtime-এ সঠিক implementation resolve হওয়া) — <code>DiscountCalculator</code> উদাহরণে দেখলাম কীভাবে একটা switch statement-কে <code>IDiscountStrategy</code>-তে ভেঙে নতুন customer type-কে একটা সম্পূর্ণ নতুন, বিচ্ছিন্ন class বানানো যায়। কিন্তু OCP-এর দুই দিকেই ভারসাম্য জরুরি — খুব কম abstraction মানে ঘন ঘন regression-ঝুঁকিপূর্ণ edit, আর খুব বেশি abstraction (এক-implementation-ওয়ালা interface, YAGNI ভেঙে "just in case" layer) মানে বিনা কারণে indirection। এই একই ভারসাম্যের প্রশ্ন — কতটা abstraction যথেষ্ট, কতটা অতিরিক্ত — পরের চ্যাপ্টারেও ফিরে আসবে, তবে ভিন্ন কোণ থেকে। যদি আপনি <code>IDiscountStrategy</code>-এর একটা implementation লেখার সময় base contract না মেনে চলেন — যেমন কোনো implementation নেগেটিভ discount রিটার্ন করে বা exception ছুঁড়ে বসে যেখানে caller সেটা আশাই করেনি — তাহলে abstraction থাকা সত্ত্বেও পুরো সিস্টেম ভেঙে পড়তে পারে। ঠিক এই "যেকোনো subtype নিরাপদে parent-এর জায়গায় বসানো যাবে কিনা" প্রশ্নটাই পরের চ্যাপ্টার ৫ (Liskov Substitution Principle)-এর কেন্দ্রবিন্দু।

<h2 class="title">৫. SOLID — Liskov Substitution Principle</h2>
<p class="lead">১ম chapter-এ আমরা <code>Rectangle</code>/<code>Square</code> আর <code>Bird</code>/<code>Penguin</code>-এর inheritance ফাঁদ দুটো দেখিয়েছিলাম, কিন্তু ব্যাখ্যা করিনি ঠিক কোন নিয়ম ভাঙার কারণে সেগুলো ভাঙে। <span class="kw">Liskov Substitution Principle</span> (LSP) হলো সেই নিয়ম — এবং এটাই একমাত্র SOLID নীতি যেটা বলে দেয় কোন inheritance hierarchy আদৌ সঠিক, শুধু কম্পাইল হওয়া বা টাইপ-চেক পাস করা যথেষ্ট নয়।</p>

<h3>৫.১ সংজ্ঞা — টাইপ ম্যাচ যথেষ্ট নয়, আচরণও মিলতে হবে</h3>
<p>১৯৮৭ সালে <b>Barbara Liskov</b> এই নীতিটা প্রথম প্রস্তাব করেন, যার আধুনিক ভাষ্য হলো:</p>
<div class="card">"If <code>S</code> is a subtype of <code>T</code>, then objects of type <code>T</code> may be replaced with objects of type <code>S</code> without altering any of the desirable properties of the program (correctness, task performed, etc.)."</div>
<p>বাংলায় — কোনো প্রোগ্রামে <b>base class</b>-এর object যেখানেই ব্যবহার হচ্ছে, সেখানে তার জায়গায় কোনো <b>subclass</b>-এর object বসিয়ে দিলেও প্রোগ্রামটা সঠিকভাবে কাজ করা চালিয়ে যাওয়ার কথা। এখানে গুরুত্বপূর্ণ শব্দ হলো <b>correctness</b> — শুধু method signature মিলে গেলেই (কম্পাইলার খুশি হলেই) LSP সন্তুষ্ট হয় না। Subclass-কে base class-এর <span class="kw">contract</span> — অর্থাৎ base class সম্পর্কে caller code যা যা ধরে নেয় (behavioral promise) — সেটাও মেনে চলতে হবে। C#-এর <span class="kw">inheritance</span> শুধু <i>type compatibility</i> নিশ্চিত করে (compiler এটা check করে); LSP দাবি করে <i>behavioral compatibility</i>-ও (compiler এটা check করতে পারে না, এটা design-এর দায়িত্ব)।</p>

<h3>৫.২ Rectangle/Square — টাইপ ঠিক, আচরণ ভুল</h3>
<p>১ম chapter-এর ক্লাসিক উদাহরণটা এবার formal ভাবে দেখা যাক। <code>Square</code> জ্যামিতিকভাবে একটা special <code>Rectangle</code> (সব <code>Square</code>ই একটা <code>Rectangle</code>) — তাই inheritance দিয়ে মডেল করাটা স্বাভাবিক মনে হয়। সমস্যাটা math-এ না, contract-এ।</p>
<pre>class Rectangle
{
    public virtual int Width  { get; set; }
    public virtual int Height { get; set; }

    public int Area() => Width * Height;
}

class Square : Rectangle
{
    private int _side;

    <span class="c">// Square-কে square থাকতে হবে, তাই Width সেট করলে Height-ও বদলে যায়</span>
    public override int Width
    {
        get => _side;
        set { _side = value; }
    }

    public override int Height
    {
        get => _side;
        set { _side = value; } <span class="c">// Height সেট করলে Width-ও বদলে যায়!</span>
    }
}</pre>
<p>এখন base class-এর কোনো caller যদি ধরে নেয় "<code>Width</code> সেট করলে শুধু <code>Width</code>ই বদলায়, <code>Height</code> অপরিবর্তিত থাকে" — যেটা <code>Rectangle</code>-এর জন্য পুরোপুরি সত্যি একটা behavioral promise — সেই ধারণার উপর ভিত্তি করে লেখা যেকোনো টেস্ট বা business logic <code>Square</code> এলে নীরবে ভুল ফলাফল দেবে:</p>
<pre>void Resize(Rectangle rect)
{
    rect.SetWidth(5);
    rect.SetHeight(4);

    <span class="c">// Rectangle-এর জন্য এই assumption সবসময় সত্যি ছিল...</span>
    Debug.Assert(rect.Area() == 20);
}

Resize(new Rectangle()); <span class="c">// পাস — Area = 5 * 4 = 20</span>
Resize(new Square());    <span class="c">// FAIL — Height=4 সেট হওয়ায় Width-ও 4 হয়ে গেছে, Area = 16</span></pre>
<div class="callout why"><span class="tag">কেন এটা LSP ভঙ্গ</span> <code>Square</code>, <code>Rectangle</code>-এর টাইপ signature হুবহু মেনে চলছে — একই property, একই method, কম্পাইলার কোনো অভিযোগ করবে না। কিন্তু <code>Rectangle</code>-এর <b>contract</b>-এ থাকা প্রতিশ্রুতি — "<code>Width</code> আর <code>Height</code> স্বাধীন, একটা বদলালে আরেকটা বদলায় না" — <code>Square</code> নীরবে ভেঙে দিচ্ছে। <code>Square</code> is-a <code>Rectangle</code> জ্যামিতিতে সত্যি, কিন্তু <b>mutable behavior</b>-এর দিক থেকে সত্যি না — আর LSP behavior নিয়ে, geometry নিয়ে না।</div>

<h3>৫.৩ কেন এটা compile error-এর চেয়ে ভয়ংকর</h3>
<p>টাইপ mismatch হলে কম্পাইলার সাথে সাথে আটকে দেয় — সেটা সস্তা এবং তাৎক্ষণিক bug। LSP ভঙ্গ এর চেয়ে আলাদা শ্রেণীর সমস্যা, কারণ এটা <b>silent</b>:</p>
<ul>
<li>কোড নিখুঁতভাবে <b>compile</b> হয় — কোনো error নেই।</li>
<li>Type-checker <b>pass</b> করে — <code>Square is a Rectangle</code>, সম্পূর্ণ বৈধ।</li>
<li>ব্যর্থতা ঘটে শুধু <b>runtime</b>-এ, আর তা-ও শুধু সেই code path-এ যেখানে actual object একটা <code>Square</code> হিসেবে আসে।</li>
<li>যে function-টা ভেঙে যাচ্ছে (<code>Resize</code>) — তার ভেতরে <code>Square</code> শব্দটাই কোথাও লেখা নেই। যে কোড <code>Square</code>-এর অস্তিত্ব সম্পর্কে জানেও না, সেটাও ভেঙে যায়।</li>
</ul>
<div class="callout mistake"><span class="tag">সাধারণ ভুল ধারণা</span> "Code কম্পাইল হয়েছে আর টাইপ-চেক পাস করেছে মানে সাবক্লাসটা নিরাপদ" — এটাই সবচেয়ে বিপজ্জনক ভুল ধারণা। Type system শুধু <i>shape</i> (method signature) মেলায়; <i>behavior</i> মেলায় না। LSP ভঙ্গের bug তাই production-এ ধরা পড়ে অনেক পরে, প্রায়ই এমন কোডে যেটা মাসখানেক আগে লেখা হয়েছিল এবং যার সাথে subclass-টার কোনো সরাসরি সম্পর্কই নেই।</div>

<h3>৫.৪ Bird/Penguin — polymorphic call-এর উপর crash</h3>
<p>একইভাবে ১ম chapter-এর <code>Bird</code>/<code>Penguin</code> উদাহরণটাও একই root cause-এর আরেকটা রূপ। <code>Bird</code> base class একটা contract ঘোষণা করছে: "প্রতিটা <code>Bird</code> <code>Fly()</code> করতে পারে।"</p>
<pre>class Bird
{
    public virtual void Fly() => Console.WriteLine("Flying...");
}

class Sparrow : Bird { } <span class="c">// contract মেনে চলে — সত্যিই উড়তে পারে</span>

class Penguin : Bird
{
    public override void Fly()
    {
        throw new NotImplementedException("Penguins can't fly!");
    }
}</pre>
<p>এই <code>Penguin</code>ও কম্পাইল হয়, <code>Bird</code>-এর সব signature মেনে চলে। কিন্তু যেকোনো code যেটা <code>List&lt;Bird&gt;</code>-এর উপর polymorphic-ভাবে <code>Fly()</code> কল করে, সেটা একটা লুকানো time bomb পায়:</p>
<pre>List&lt;Bird&gt; birds = new List&lt;Bird&gt; { new Sparrow(), new Eagle(), new Penguin() };

foreach (Bird b in birds)
{
    b.Fly(); <span class="c">// Sparrow, Eagle পর্যন্ত ঠিক আছে... Penguin-এ এসে exception!</span>
}</pre>

<h3>৫.৫ Design by Contract — precondition ও postcondition</h3>
<p><span class="kw">Design by Contract</span> (Bertrand Meyer) পরিভাষায় প্রতিটা method-এর একটা <b>precondition</b> (method কল করার আগে caller-কে যা নিশ্চিত করতে হয়) এবং একটা <b>postcondition</b> (method সফলভাবে শেষ হলে সে যা নিশ্চিত করে) থাকে। LSP-কে এভাবে formal করা যায় — override করা method:</p>
<table>
<tr><th>নিয়ম</th><th>মানে কী</th><th>লঙ্ঘন হলে যা ঘটে</th></tr>
<tr><td>Precondition <b>strengthen</b> করা যাবে না</td><td>Subclass base-এর চেয়ে বেশি শর্ত দাবি করতে পারবে না — caller base-এর নিয়ম মেনে কল করলে সাবক্লাসেও তা গ্রহণযোগ্য হতে হবে</td><td>যে input base class-এর জন্য বৈধ ছিল, subclass-এ সেটা exception ছুঁড়ে</td></tr>

<tr><td>Invariant বজায় থাকতে হবে</td><td>Base class-এর object সবসময় যা সত্যি থাকে (যেমন balance ≥ 0), subclass-এও তা সবসময় সত্যি থাকতে হবে</td><td>Subclass এমন state-এ পৌঁছাতে পারে যা base class-এর দৃষ্টিতে অবৈধ</td></tr>
</table>
<p>Precondition strengthening-এর একটা প্রত্যক্ষ উদাহরণ — base method যেকোনো positive integer গ্রহণ করে বলে ঘোষণা করেছে, কিন্তু override তার চেয়ে সংকীর্ণ শর্ত চাপিয়ে দিচ্ছে:</p>
<pre>class Base
{
    <span class="c">// Contract: কোনো positive int-এর জন্য কাজ করবে</span>
    public virtual void Process(int value)
    {
        if (value &lt;= 0) throw new ArgumentException("must be positive");
        Console.WriteLine("Processed " + value);
    }
}

class Derived : Base
{
    <span class="c">// Precondition strengthened! এখন even number-ও প্রত্যাখ্যাত — base-এর চেয়ে সংকীর্ণ</span>
    public override void Process(int value)
    {
        if (value % 2 == 0) throw new ArgumentException("even numbers not supported");
        base.Process(value);
    }
}

void Run(Base b) => b.Process(4); <span class="c">// Base-এর জন্য সম্পূর্ণ বৈধ input</span>

Run(new Base());    <span class="c">// পাস — "Processed 4"</span>
Run(new Derived());  <span class="c">// FAIL — ArgumentException, যদিও 4 একটা positive int</span></pre>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span> মনে হতে পারে override-এ "extra validation" যোগ করা নিরাপদ, বরং defensive coding। কিন্তু <code>Base</code>-এর contract অনুযায়ী যা গ্রহণযোগ্য input, override সেটাকেই প্রত্যাখ্যান করলে যেকোনো caller যে <code>Base</code> রেফারেন্স ধরে কোড লিখেছে (এবং <code>Base</code>-এর contract বিশ্বাস করেছে) — সে ভেঙে যাবে, ঠিক <code>Rectangle</code>/<code>Square</code>-এর মতোই।</div>

<h3>৫.৬ সমাধান — জোর করে IS-A বানাবেন না</h3>
<p>মূল ভুলটা inheritance ব্যবহার করাতে না — ভুলটা হলো এমন জায়গায় একটা rigid base class hierarchy জোর করে বসানো, যেখানে subclass-গুলোর আচরণ আসলে ভিন্ন দিকে চলে যায়। দুটো ব্যবহারিক বিকল্প:</p>
<div class="grid2">
<div class="box"><b>বিকল্প ১ — Composition (২য় chapter)</b><br/>"<code>Square</code> is-a <code>Rectangle</code>" জোর করার বদলে, দুটোকেই আলাদা রাখুন, বা একটা কমন <code>Shape</code> interface-এর পেছনে দুটো independent বাস্তবায়ন রাখুন যাদের কোনোটাই অন্যেরটার mutable behavior inherit করে না।</div>
<div class="box"><b>বিকল্প ২ — Interface segregation</b><br/><code>Bird</code>-এর মতো একটা monolithic base class না বানিয়ে, শুধু যেসব bird সত্যিই উড়তে পারে তাদের জন্য আলাদা <code>IFlyable</code> interface দিন। <code>Penguin</code> সেটা implement-ই করবে না, ফলে কম্পাইল-টাইমেই ভুল ব্যবহার আটকে যায়।</div>
</div>
<pre>interface IFlyable { void Fly(); }
interface ISwimmable { void Swim(); }

class Sparrow : Bird, IFlyable
{
    public void Fly() => Console.WriteLine("Flying...");
}

class Penguin : Bird, ISwimmable
{
    public void Swim() => Console.WriteLine("Swimming...");
    <span class="c">// Fly() লেখাই হয়নি — কারণ Penguin IFlyable implement করে না</span>
}

<span class="c">// এখন compiler-ই আটকে দেবে ভুল ব্যবহার:</span>
<span class="c">// void MakeItFly(IFlyable f) => f.Fly();</span>
<span class="c">// MakeItFly(new Penguin());  // Compile error — Penguin is not IFlyable</span></pre>
<div class="callout best"><span class="tag">Best practice</span> Inheritance বেছে নেওয়ার আগে প্রশ্ন করুন — "এই subclass কি base class-এর <b>প্রতিটা</b> behavioral promise আক্ষরিকভাবে মেনে চলবে, বিশেষ কেসের exception বা override দিয়ে বাইপাস না করে?" উত্তর "না" হলে inheritance-এর বদলে composition বা ছোট, role-specific interface ব্যবহার করুন।</div>

<h3>৫.৭ ধরার উপায় — LSP ভাঙার লক্ষণ</h3>
<div class="diagram"><pre>              ┌───────────────────────────────┐
              │      Base class contract       │
              │  precondition  : P              │
              │  postcondition : Q              │
              └───────────────┬────────────────┘
                               │ "should be substitutable for"
              ┌────────────────┴────────────────┐
              ▼                                  ▼

   │   accepts   ⊇ P          │      │   accepts   ⊂ P (সংকীর্ণ)  │
   │   guarantees ⊇ Q         │      │   guarantees ⊂ Q (দুর্বল)  │
   │   ✔ safe substitution    │      │   ✘ broken promise        │
   └─────────────────────────┘      └──────────────────────────┘

<p>Code review-এ নিচের যেকোনো একটা signal দেখলে সন্দেহ করুন LSP ভাঙছে কিনা:</p>
<table>
<tr><th>Signal</th><th>উদাহরণ</th></tr>
<tr><td>Override-এ <code>throw new NotImplementedException()</code></td><td><code>Penguin.Fly()</code></td></tr>
<tr><td>Override একটা setter/property-এর মাধ্যমে অন্য property বদলে দিচ্ছে</td><td><code>Square.Height</code> সেট করলে <code>Width</code>-ও বদলায়</td></tr>
<tr><td>Override-এ base-এর চেয়ে সংকীর্ণ input validation</td><td>base যেকোনো positive int নেয়, override even number reject করে</td></tr>
<tr><td>Override-এ base-এর ঘোষিত return guarantee ছাড়াই <code>null</code> ফেরত</td><td>base বলেছে সবসময় non-null collection ফেরত দেবে, override মাঝেমধ্যে <code>null</code> দেয়</td></tr>
<tr><td>Caller code-এ <code>if (obj is SpecificSubclass)</code> টাইপ চেক করে আলাদা আচরণ</td><td>polymorphism ব্যবহার করেও type-check দিয়ে বাইপাস করতে হচ্ছে — স্পষ্ট চিহ্ন contract ভাঙা</td></tr>
</table>
<div class="callout behind"><span class="tag">সামনে যা আসছে — ISP</span> লক্ষ্য করুন উপরের প্রায় প্রতিটা LSP ভাঙার মূল কারণ একটাই — base class/interface অতিরিক্ত <b>broad</b> ছিল। <code>Bird</code> সবাইকে <code>Fly()</code> করতে বাধ্য করেছিল, অথচ সব bird ওড়ে না। যখন একটা interface অনেকগুলো ভিন্ন responsibility একসাথে চাপিয়ে দেয়, তখন কিছু implementer-এর জন্য কিছু method অর্থহীন হয়ে পড়ে — আর তারা হয় সেটা ভুলভাবে implement করে (LSP ভঙ্গ), নয়তো খালি/exception-ছোঁড়া method লেখে। পরের chapter-এ <span class="kw">Interface Segregation Principle</span> ঠিক এই সমস্যাটাই সমাধান করবে — বড় interface-কে ছোট, role-specific interface-এ ভেঙে।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> LSP বলে দেয় — subclass শুধু base class-এর <b>type</b> মেলালেই চলবে না, তার <b>behavioral contract</b>-ও মেনে চলতে হবে; নাহলে বাগ আসবে নীরবে, compile-time-এ ধরা পড়বে না, এবং এমন কোডেও আঘাত করবে যা subclass-এর নামই জানে না। <code>Rectangle</code>/<code>Square</code> আর <code>Bird</code>/<code>Penguin</code> — দুটোই দেখিয়েছে সমস্যার মূল একই: একটা rigid, অতিরিক্ত-প্রশস্ত base class hierarchy জোর করে চাপানো হয়েছে এমন জায়গায় যেখানে আচরণ আসলে ভিন্ন। পরের chapter-এ আমরা দেখব <span class="kw">Interface Segregation Principle</span> কীভাবে এই একই মূল সমস্যাটাকে — অতিরিক্ত-প্রশস্ত contract — উৎস থেকেই আটকে দেয়, base class ডিজাইন করার পর্যায়েই।</div>

<h2 class="title">৬. SOLID — Interface Segregation Principle</h2>
<p class="lead">গত চ্যাপ্টারে <span class="kw">Liskov Substitution Principle</span> নিয়ে আলোচনা শেষ হয়েছিল একটা অস্বস্তিকর পর্যবেক্ষণ দিয়ে — একটা বড়, "সবকিছু-করতে-পারে" ইন্টারফেস প্রায়ই সাবটাইপকে LSP ভাঙতে বাধ্য করে। এই চ্যাপ্টারে সেই সমস্যাটার একটা নাম দেওয়া হবে, এবং সমাধানও।</p>

<h3>যেখানে LSP চ্যাপ্টার থেমেছিল, সেখান থেকে শুরু</h3>
<p>মনে করুন <code>IWorker</code> নামে একটা ইন্টারফেস আছে যেখানে <code>Work()</code> এবং <code>Eat()</code> — দুটোই মেথড হিসেবে আছে, কারণ ডিজাইনের সময় মনে হয়েছিল "worker মানেই তো কাজও করে, খায়ও।" এখন <code>RobotWorker : IWorker</code> লিখতে গেলে বাধ্যতামূলকভাবে <code>Eat()</code>-ও implement করতে হবে — অথচ robot খায় না। ফলাফল হয় দুটোর একটা: হয় <code>throw new NotImplementedException()</code>, নয়তো একটা অর্থহীন no-op বডি। দুটোই ঠিক আগের চ্যাপ্টারে দেখা LSP লঙ্ঘন — যেকোনো কোড যা <code>IWorker.Eat()</code> কল করে, <code>RobotWorker</code> পেলে হয় crash করবে নয়তো নীরবে কিছুই করবে না।</p>
<p>এই সমস্যাটার নিজস্ব নাম আছে — <span class="kw">Interface Segregation Principle</span> (ISP), SOLID-এর "I"। সংজ্ঞাটা প্রায় verbatim মনে রাখার মতো: <b>"Clients should not be forced to depend on interfaces (or methods) they don't use।"</b> এখানে "client" মানে যে ক্লাস একটা ইন্টারফেসের ওপর নির্ভর করছে — হয় সেটাকে implement করে, নয়তো সেটাকে consume করে। একটা <span class="kw">fat interface</span> (অনেকগুলো ভিন্ন উদ্দেশ্যের মেথড একসাথে গুঁজে রাখা ইন্টারফেস) প্রতিটা implementer-কে হয় পুরোটা মেনে নিতে বাধ্য করে, নয়তো dummy stub লিখতে বাধ্য করে।</p>
<div class="callout why"><span class="tag">ISP আসলে কী সমাধান করে</span>
লক্ষ করুন — ISP আর LSP আলাদা জিনিস নয় দুটো ভিন্ন সমস্যা; ISP হলো LSP-লঙ্ঘনের একটা <b>নির্দিষ্ট ও প্রতিরোধযোগ্য কারণ</b>-এর নাম। LSP বলে "সাবটাইপ প্যারেন্টের প্রতিশ্রুতি ভাঙতে পারবে না।" ISP বলে "যদি ইন্টারফেসটাই এমন মেথড দাবি করে যা প্রতিটা বাস্তবসম্মত implementation-এর জন্য প্রাসঙ্গিক না হয়, তাহলে LSP ভাঙা প্রায় অনিবার্য হয়ে যায়।" তাই ISP মেনে চলা মানে আসলে LSP লঙ্ঘনের সুযোগই তৈরি না হতে দেওয়া — সমস্যাটা শুরুতেই, ইন্টারফেস ডিজাইনের পর্যায়ে বন্ধ করা।
</div>

<h3>ফ্যাট ইন্টারফেস: সমস্যাটা কোডে</h3>
<p>নিচের <code>IWorker</code> ইন্টারফেসটা দেখতে সম্পূর্ণ স্বাভাবিক মনে হয় — যতক্ষণ না কেউ এমন একটা implementer লেখে যেটা "worker" ধারণার একটা অংশ মেলে, পুরোটা না।</p>
<pre><span class="c">// ❌ BEFORE — একটা ফ্যাট ইন্টারফেস, দুটো ভিন্ন দায়িত্ব একসাথে</span>
public interface <span class="kw">IWorker</span>
{
    void Work();
    void Eat();
}

public class HumanWorker : IWorker
{
    public void Work() { /* শিফট অনুযায়ী কাজ করে */ }
    public void Eat()  { /* লাঞ্চ ব্রেক নেয় */ }
}

public class RobotWorker : IWorker
{
    public void Work() { /* ২৪/৭ ওয়েল্ডিং করে */ }

    public void Eat()
    {
        <span class="kw">throw</span> new NotImplementedException(); <span class="c">// robot খায় না, কিন্তু ইন্টারফেস মেথডটা দাবি করছে</span>
    }
}</pre>
<div class="callout mistake"><span class="tag">Common mistake — dummy stub-কে "সাময়িক সমাধান" ভাবা</span>
<code>throw new NotImplementedException()</code> বা একটা খালি <code>{ }</code> বডি লেখা কম্পাইল করার একটা উপায় মাত্র, ডিজাইন সমস্যার সমাধান না। যে কেউ <code>IWorker</code> নিয়ে কাজ করবে (উদাহরণ: একটা <code>Scheduler</code> ক্লাস যা প্রতিটা worker-এর ওপর <code>Eat()</code> কল করে বিরতির সময় হিসাব রাখে) সে জানার কোনো compile-time উপায় নেই যে <code>RobotWorker</code>-এর জন্য এই কলটা নিরাপদ না। বাগ ধরা পড়বে শুধু runtime-এ, প্রোডাকশনে exception ছোঁড়ার পর।
</div>

<h3>সমাধান: ভূমিকা অনুযায়ী ইন্টারফেস ভাঙা</h3>
<p>সমাধানটা ইন্টারফেসটাকে তার প্রকৃত ভূমিকা (role) অনুযায়ী ভেঙে ফেলা — একটা "worker" ধারণা মেলে না, বরং দুটো স্বতন্ত্র সামর্থ্য মেলে: কাজ করতে পারা, আর খেতে পারা। এই দুটোকে আলাদা <span class="kw">role interface</span> বানালে প্রতিটা ক্লাস শুধু তার প্রাসঙ্গিক ইন্টারফেসটুকু implement করে।</p>
<pre><span class="c">// ✅ AFTER — দুটো ছোট, একক-উদ্দেশ্যের ইন্টারফেস</span>
public interface IWorkable { void Work(); }
public interface IFeedable { void Eat(); }

public class HumanWorker : IWorkable, IFeedable
{
    public void Work() { /* শিফট অনুযায়ী কাজ করে */ }
    public void Eat()  { /* লাঞ্চ ব্রেক নেয় */ }
}

public class RobotWorker : IWorkable   <span class="c">// শুধু যা সত্যিই প্রযোজ্য</span>
{
    public void Work() { /* ২৪/৭ ওয়েল্ডিং করে */ }
    <span class="c">// Eat() নেই — কারণ ইন্টারফেসটাই এখন এটা দাবি করে না</span>
}</pre>
<p>এখন <code>Scheduler</code>-এর মতো ক্লায়েন্ট যদি শুধু কাজ শিডিউল করতে চায়, সে <code>IWorkable</code>-এর ওপর নির্ভর করবে — <code>RobotWorker</code> ও <code>HumanWorker</code> দুটোই নির্দ্বিধায় সেখানে বসতে পারে, কারণ কেউই এমন কোনো প্রতিশ্রুতি ভাঙছে না যা তারা রাখতে পারে না। যে কোড আসলেই বিরতির হিসাব রাখে, সে-ই শুধু <code>IFeedable</code> চায় — আর <code>RobotWorker</code>-কে সেখানে পাস করার সুযোগই কম্পাইলার দেবে না, কারণ এটা <code>IFeedable</code> implement করে না। ভুলটা এখন runtime exception নয়, একটা compile-time type error।</p>

<div class="diagram"><pre>ফ্যাট ইন্টারফেস — সবাইকে সব মেথড বহন করতে হয়

<h3>বাস্তব উদাহরণ: <code>IRepository</code> — আরেকটা ক্লাসিক ফ্যাট ইন্টারফেস</h3>
<p>এই একই প্যাটার্ন প্রোডাকশন কোডে সবচেয়ে বেশি দেখা যায় data-access লেয়ারে, যেখানে "একটা জেনেরিক <code>IRepository&lt;T&gt;</code> বানিয়ে ফেলি, সব entity-র জন্য কাজ করবে" — এই চিন্তা থেকে ইন্টারফেসটা ধীরে ধীরে ফুলেফেঁপে ওঠে।</p>
<pre><span class="c">// ❌ BEFORE — একটা "সবকিছু-করতে-পারে" repository ইন্টারফেস</span>
public interface IRepository&lt;T&gt;
{
    T Create(T entity);
    T Read(int id);
    void Update(T entity);
    void Delete(int id);
    void BulkImport(IEnumerable&lt;T&gt; entities);
    void Archive(int id);
    void Restore(int id);
}

<span class="c">// একটা read-only রিপোর্টিং ক্লাসকে বাধ্য হয়ে ৬টা মেথব stub করতে হচ্ছে</span>
public class SalesReportRepository : IRepository&lt;SalesRow&gt;
{
    public SalesRow Read(int id) { /* আসল query */ }

    public SalesRow Create(SalesRow entity)         =&gt; throw new NotSupportedException();
    public void Update(SalesRow entity)              =&gt; throw new NotSupportedException();
    public void Delete(int id)                        =&gt; throw new NotSupportedException();
    public void BulkImport(IEnumerable&lt;SalesRow&gt; e) =&gt; throw new NotSupportedException();
    public void Archive(int id)                       =&gt; throw new NotSupportedException();
    public void Restore(int id)                       =&gt; throw new NotSupportedException();
}</pre>
<p>এই ক্লাসটার একমাত্র কাজ ডেটা পড়া, তবু ইন্টারফেসের কারণে ৬টা মেথড implement দেখাতে হচ্ছে যেগুলোর একটাও কখনো কল হবে না — অথচ যে-কেউ <code>IRepository&lt;SalesRow&gt;</code> টাইপ ধরে কোড লিখবে, সে ভাবতে পারে <code>Delete</code> কল করা নিরাপদ, যতক্ষণ না রানটাইমে exception খেয়ে বুঝবে তা নয়।</p>
<pre><span class="c">// ✅ AFTER — ভূমিকা অনুযায়ী ভাঙা ইন্টারফেস</span>
public interface IReadRepository&lt;T&gt;
{
    T Read(int id);
}

public interface IWriteRepository&lt;T&gt;
{
    T Create(T entity);
    void Update(T entity);
    void Delete(int id);
}

<span class="c">// এখন শুধু যেটুকু দরকার সেটুকুই implement</span>
public class SalesReportRepository : IReadRepository&lt;SalesRow&gt;
{
    public SalesRow Read(int id) { /* আসল query */ }
}</pre>
<div class="grid2">
<div class="box"><b>IReadRepository&lt;T&gt;</b> <span class="badge">read-only ক্লায়েন্ট</span><br/>যে কোড শুধু ডেটা দেখায় — রিপোর্ট, ড্যাশবোর্ড, এক্সপোর্ট — তারা শুধু এটার ওপর নির্ভর করে। <code>SalesReportRepository</code> শুধু এটা implement করে; <code>Delete</code> কল করার সুযোগই নেই।</div>
<div class="box"><b>IWriteRepository&lt;T&gt;</b> <span class="badge">command ক্লায়েন্ট</span><br/>যে কোড ডেটা তৈরি/পরিবর্তন করে (order processing, admin panel) সে এটা চায়। <code>OrderRepository</code>-র মতো ক্লাস দুটো ইন্টারফেসই implement করতে পারে — সেটা তার নিজের যৌক্তিক প্রয়োজন, ইন্টারফেসের জোরাজুরি নয়।</div>
</div>
<p><code>BulkImport</code>, <code>Archive</code>, <code>Restore</code>-এর মতো মেথবগুলো কোথায় গেল? সেগুলোরও যদি সত্যিকারের একাধিক ব্যবহারকারী থাকে, তারা নিজেদের মতো আলাদা ইন্টারফেস (<code>IBulkImportable&lt;T&gt;</code>, <code>IArchivable</code>) পাবে — শুধু যে ক্লাস বাল্ক-ইমপোর্ট আসলেই করে, সে-ই সেটা implement করবে।</p>

<h3>কম্পাইল-টাইম কাপলিং ও ব্লাস্ট রেডিয়াস</h3>
<p>ফ্যাট ইন্টারফেসের ক্ষতি শুধু runtime exception-এ সীমাবদ্ধ না — এমনকি <code>RobotWorker</code> যদি <b>কখনোই</b> <code>Eat()</code> কল না-ও হয়, তবু <code>IWorker</code>-এর ওপর নির্ভরশীল থাকা মানে <code>Eat()</code>-এর সিগনেচার বদলালে (যেমন একটা প্যারামিটার যোগ হলো) <code>RobotWorker</code>-সহ প্রতিটা implementer আবার কম্পাইল ও রিডিপ্লয় করতে হয়। এটাই <span class="kw">compile-time coupling</span> — নির্ভরতা শুধু "কে কাকে কল করে" তা দিয়ে না, "কে কার সংজ্ঞার ওপর বাঁধা আছে" তা দিয়েও মাপা হয়। ছোট, সেগ্রিগেটেড ইন্টারফেসে একটা মেথড বদলালে শুধু সেই নির্দিষ্ট ইন্টারফেসের ওপর নির্ভরশীলরাই প্রভাবিত হয় — বাকিরা একদমই অনাহত থাকে। একেই বলা হয় ছোট <span class="kw">blast radius</span>।</p>
