<div class="callout behind"><span class="tag">ISP আর SRP — একই নীতির দুই স্তর</span>
ISP-কে বলা যায় SRP-এর ইন্টারফেস-স্তরের যমজ ভাই। <span class="kw">SRP</span> (চ্যাপ্টার ৩) বলে একটা <b>ক্লাস</b>-এর পরিবর্তনের একটাই কারণ থাকা উচিত। ISP বলে একটা <b>ইন্টারফেস</b>-এর শুধু ততটুকুই প্রকাশ করা উচিত যতটুকু একটা নির্দিষ্ট ধরনের ক্লায়েন্টের দরকার — পুরো "concept"-টা যা কিছু করতে পারত তার সবটা না। একটা ক্লাস SRP মেনে চললেও তার implement করা ইন্টারফেসটা যদি ফ্যাট হয়, ISP এখনও ভাঙা থাকতে পারে — দুটো নীতি স্বাধীন, একটা মানলে অন্যটা এমনিতেই মেলে না।
</div>

<h3>Common mistake: ইন্টারফেস অতি-বিভাজন</h3>
<p>ISP শেখার পর একটা স্বাভাবিক অতি-প্রতিক্রিয়া হয় — প্রতিটা মেথডের জন্য আলাদা একটা ইন্টারফেস বানানো শুরু করা: <code>IWorkable</code>, <code>IEatable</code>, <code>ISleepable</code>, <code>IRestable</code>... এভাবে চললে একটা সাধারণ <code>HumanWorker</code>-কে গঠন (compose) করতেই হয়তো এক ডজন ইন্টারফেস implement করতে হয়, আর কনসিউমার সাইডেও প্রতিটা মেথডের জন্য আলাদা প্যারামিটার নেওয়া লাগে।</p>
<div class="callout mistake"><span class="tag">Common mistake — মেকানিক্যালি এক-মেথড-এক-ইন্টারফেস</span>
ISP-এর লক্ষ্য "প্রতিটা মেথড আলাদা ইন্টারফেসে রাখা" না — লক্ষ্য হলো <b>ক্লায়েন্টের চাহিদা (role) অনুযায়ী</b> সেগ্রিগেট করা। যদি বাস্তবে এমন কোনো ক্লায়েন্ট না-ই থাকে যে শুধু <code>Sleep()</code> চায়, তাহলে <code>ISleepable</code> আলাদা করার কোনো লাভ নেই — এটা শুধু জটিলতা বাড়ায়, uncohesive ইন্টারফেসের স্তূপ তৈরি করে। কোহিশন এখনও গুরুত্বপূর্ণ; প্রশ্নটা "প্রতিটা মেথড কি আলাদা?" না, বরং "কোন কোন মেথড সবসময় একসাথে ব্যবহৃত হয়, একই ধরনের ক্লায়েন্ট দ্বারা?" — সেই গ্রুপগুলোই একেকটা ইন্টারফেস হওয়া উচিত।
</div>

<h3>ফ্যাট বনাম সেগ্রিগেটেড: লক্ষণ চিনে নেওয়া</h3>
<p>নিচের লক্ষণগুলো কোড রিভিউ-এর সময় দ্রুত বুঝতে সাহায্য করে একটা ইন্টারফেস ISP মানছে কি না।</p>
<table>
<tr><th>ফ্যাট ইন্টারফেসের লক্ষণ</th><th>সেগ্রিগেটেড ইন্টারফেসের লক্ষণ</th></tr>
<tr><td><code>throw new NotImplementedException()</code> / <code>NotSupportedException()</code>-সহ মেথড বডি</td><td>প্রতিটা implement করা মেথডই সত্যিকার লজিক দিয়ে পূর্ণ</td></tr>
<tr><td>খালি <code>{ }</code> বডি বা শুধু <code>return default;</code></td><td>মেথড কল হলে বাস্তবিক আচরণ ঘটে, কোনো নীরব no-op নেই</td></tr>
<tr><td><code>// not applicable</code>, <code>// TODO: never called</code>-এর মতো কমেন্ট</td><td>একটা implementer-এর মেথড লিস্ট তার আসল ব্যবহারের সাথে হুবহু মেলে</td></tr>
<tr><td>একটা ইন্টারফেস পরিবর্তনে অসংখ্য অপ্রাসঙ্গিক ক্লাস recompile করতে হয়</td><td>ইন্টারফেস পরিবর্তনের প্রভাব শুধু সেই role-এর প্রকৃত ব্যবহারকারীদের মধ্যে সীমাবদ্ধ</td></tr>
<tr><td>একটা ইন্টারফেসের নামে "Manager", "Service", "Repository"-র মতো ব্যাপক (generic) শব্দ, মেথড সংখ্যা ৭+</td><td>ইন্টারফেসের নাম একটা নির্দিষ্ট ভূমিকা বর্ণনা করে (<code>IReadRepository</code>, <code>IFeedable</code>)</td></tr>
</table>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span>
<span class="kw">ISP</span> বলে — একটা ইন্টারফেস শুধু তা-ই প্রকাশ করবে যা তার প্রকৃত ক্লায়েন্টদের দরকার, পুরো ধারণাটা যা যা করতে পারত তার সবটা না। ফ্যাট ইন্টারফেস (<code>IWorker</code>-এ Work+Eat, বা <code>IRepository</code>-এ CRUD+Bulk+Archive) implementer-দের dummy stub লিখতে বাধ্য করে, LSP ভাঙার সরাসরি রাস্তা খুলে দেয়, আর যেকোনো মেথড বদলের compile-time ব্লাস্ট রেডিয়াস অহেতুক বড় করে। সমাধান — role অনুযায়ী ছোট ইন্টারফেসে ভাঙা, কিন্তু কোহিশন বজায় রেখে, মেকানিক্যালি প্রতিটা মেথড আলাদা না করে। এখন পর্যন্ত আমরা দেখেছি ক্লাস কীভাবে গঠন করতে হয় (SRP), এক্সটেনশনের জন্য কীভাবে খোলা রাখতে হয় (OCP), সাবটাইপ কীভাবে নিরাপদ রাখতে হয় (LSP), আর ইন্টারফেস কীভাবে ছোট রাখতে হয় (ISP)। কিন্তু একটা প্রশ্ন এখনও অনুত্তরিত — এই ছোট, well-designed ইন্টারফেসগুলো একে অপরের সাথে <b>কীভাবে তারবন্দি (wire) হবে</b>, যাতে হাই-লেভেল কোড লো-লেভেল বাস্তবায়নের বিস্তারিত জানার ওপর নির্ভরশীল না থাকে? পরের চ্যাপ্টারে — <span class="kw">Dependency Inversion Principle</span> এবং Dependency Injection — ঠিক এই প্রশ্নটারই উত্তর।
</div>

<h2 class="title">৭. SOLID — Dependency Inversion ও Dependency Injection</h2>
<p class="lead">SOLID-এর শেষ নীতি — এবং সম্ভবত সবচেয়ে বেশি ভুল বোঝা নীতি। এই চ্যাপ্টারে আমরা দেখব <span class="kw">Dependency Inversion Principle</span> (DIP) ঠিক কী বলছে, কেন এটা <span class="kw">Dependency Injection</span> (DI)-এর মতো একই জিনিস নয়, ASP.NET Core-এর built-in DI container বাস্তবে কীভাবে এই নীতি কার্যকর করে, এবং কীভাবে এই একটা নীতি আগের চারটা SOLID নীতিকে (বিশেষত Composition ও OCP) একটা সত্যিকারের অ্যাপ্লিকেশনে একসাথে বেঁধে ফেলে।</p>

<h3>৭.১ সংজ্ঞার দুটো অংশ — দুটোই সমান গুরুত্বপূর্ণ</h3>
<p><span class="kw">Dependency Inversion Principle</span> আসলে একটা নয়, দুটো statement নিয়ে গঠিত। বেশিরভাগ ডেভেলপার শুধু প্রথমটা মনে রাখেন, দ্বিতীয়টা ভুলে যান — অথচ দ্বিতীয়টা ছাড়া প্রথমটার কোনো মানেই থাকে না।</p>
<ol>
<li><b>High-level module কখনো low-level module-এর উপর সরাসরি নির্ভর করবে না — উভয়ই একটা abstraction-এর উপর নির্ভর করবে।</b></li>
<li><b>Abstraction কখনো detail-এর উপর নির্ভর করবে না — detail নির্ভর করবে abstraction-এর উপর।</b></li>
</ol>
<p>এখানে "high-level module" মানে ব্যবসায়িক নীতি ধারণকারী কোড — অর্ডার প্রসেস করা, প্রাইসিং হিসাব করা, পেমেন্ট যাচাই করা। "Low-level module" মানে বাস্তবায়নের খুঁটিনাটি বা <span class="kw">detail</span> — কোন ডাটাবেজ, কোন HTTP client, কোন ফাইল ফরম্যাট। স্বাভাবিক (naive) কোডে high-level কোড সরাসরি low-level ক্লাস <code>new</code> করে বা reference করে — এটাই স্বাভাবিক মনে হয়, কারণ business logic-কেই তো আসল কাজটা "করাতে" হয়। কিন্তু DIP বলছে এই নির্ভরতার দিক (direction) ভুল — উচিত হলো দুই পক্ষই একটা মাঝের <span class="kw">abstraction</span>-এর দিকে তাকানো, একে অপরকে সরাসরি না চেনা।</p>
<div class="diagram"><pre>
Runtime call flow (সবসময় একই দিকে যায়, এটা কখনো পরিবর্তন হয় না):

  Controller ──calls──> OrderService ──calls──> Repository.Save()

Source-code DEPENDENCY direction (DIP আসলে এই তীরটা নিয়ে কথা বলে):

  Naive (DIP ভাঙা):
    OrderService ───references───> SqlOrderRepository
      (high-level)                    (low-level detail)

  DIP-compliant (Inverted):
    OrderService ───references───> IOrderRepository <───implements─── SqlOrderRepository
      (high-level)                    (abstraction)          (low-level detail)
</pre></div>
<p>লক্ষ্য করুন — উপরের দুই ক্ষেত্রেই <b>runtime-এ কল কে কাকে করছে তা এক</b>। পরিবর্তন হয়েছে শুধু <b>source code-এ কে কাকে চেনে (reference করে)</b> — আর DIP ঠিক এই দ্বিতীয় জিনিসটা নিয়েই কথা বলে, প্রথমটা নিয়ে না। এই পার্থক্য বোঝা না গেলে DIP-কে "একটা extra interface layer" ছাড়া আর কিছু মনে হয় না।</p>

<h3>৭.২ Naive Design — High-level সরাসরি Low-level চেনে</h3>
<p>ধরা যাক একটা <code>OrderService</code> আছে যেটা অর্ডার সেভ করার জন্য সরাসরি একটা SQL-based repository তৈরি করছে।</p>
<pre>
<span class="c">// Naive — high-level module (OrderService) সরাসরি low-level detail (SqlOrderRepository) চেনে</span>
public class OrderService
{
    private readonly SqlOrderRepository _repository = new SqlOrderRepository();

    public void PlaceOrder(Order order)
    {
        _repository.Save(order);
    }
}

public class SqlOrderRepository
{
    public void Save(Order order)
    {
        <span class="c">// SQL Server-নির্দিষ্ট কোড</span>
    }
}
</pre>
<p>এখানে <code>OrderService</code> — যেটা কিনা ব্যবসায়িক নীতি ধারণ করে ("অর্ডার কীভাবে প্রসেস হবে") — সরাসরি <code>SqlOrderRepository</code>-এর সাথে কম্পাইল-টাইমে বাঁধা পড়ে গেছে, যেটা নিছক একটা বাস্তবায়নের খুঁটিনাটি। এর তিনটা বাস্তব ফলাফলঃ ডাটাবেজ পাল্টাতে হলে (SQL থেকে MongoDB) <code>OrderService</code>-এর কোড ছুঁতে হবে; আসল ডাটাবেজ ছাড়া <code>OrderService</code> unit test করা যাবে না; আর <code>OrderService</code> আর <code>SqlOrderRepository</code> — দুটো সম্পূর্ণ ভিন্ন স্তরের কোড — একসাথে বদলাতে বাধ্য হবে।</p>

<h3>৭.৩ Inversion — নির্ভরতার তীর উল্টে দেওয়া</h3>
<p>সমাধান হলো মাঝখানে একটা abstraction বসানো, আর <code>OrderService</code>-কে সেই abstraction-এর উপর নির্ভরশীল করা — concrete ক্লাসের উপর নয়।</p>
<pre>
<span class="c">// Inverted — উভয় পক্ষই IOrderRepository abstraction-এর উপর নির্ভরশীল</span>
public interface IOrderRepository
{
    void Save(Order order);
}

public class OrderService
{
    private readonly IOrderRepository _repository;

    public OrderService(IOrderRepository repository) <span class="c">// constructor injection</span>
    {
        _repository = repository;
    }

    public void PlaceOrder(Order order)
    {
        _repository.Save(order);
    }
}

public class SqlOrderRepository : IOrderRepository
{
    public void Save(Order order)
    {
        <span class="c">// SQL Server-নির্দিষ্ট কোড</span>
    }
}
</pre>
<p>লক্ষ্য করুন — <code>OrderService</code>-এর কোডে এখন আর কোথাও <code>SqlOrderRepository</code> নামটাই নেই। <code>IOrderRepository</code> নিজেও কোনো concrete ক্লাস চেনে না। ফলে নির্ভরতার তীর দুই দিক থেকেই একটা নিরপেক্ষ কেন্দ্রবিন্দুর দিকে যাচ্ছে — এটাই আক্ষরিক অর্থে "inversion"।</p>

<h3>৭.৪ ASP.NET Core DI Container — বাস্তবে wiring কীভাবে হয়</h3>
<p>উপরের কোড কম্পাইল হয়, কিন্তু <code>IOrderRepository</code>-এর জন্য আসলে কোন concrete ক্লাসটা ব্যবহার হবে তা কোথাও না কোথাও ঠিক করে দিতে হয় — এই কাজটাই করে ASP.NET Core-এর built-in <span class="kw">DI container</span>। <code>Program.cs</code>-এ একবার registration করে দিলে, framework constructor দেখে বাকি সব নিজে থেকেই resolve করে দেয়।</p>
<pre>
<span class="c">// Program.cs — কোন abstraction-এর জন্য কোন implementation ব্যবহার হবে তা registration</span>
var builder = WebApplication.CreateBuilder(args);

builder.Services.AddScoped&lt;IOrderRepository, SqlOrderRepository&gt;();
builder.Services.AddScoped&lt;OrderService&gt;();

var app = builder.Build();
</pre>
<pre>
<span class="c">// Controller — constructor-এ interface চাইলেই container সেটা resolve করে দেয়</span>
public class OrdersController : ControllerBase
{
    private readonly OrderService _orderService;

    public OrdersController(OrderService orderService) <span class="c">// _orderService.repository ইতিমধ্যে wired</span>
    {
        _orderService = orderService;
    }

    [HttpPost]
    public IActionResult Create(Order order)
    {
        _orderService.PlaceOrder(order);
        return Ok();
    }
}
</pre>
<p>এখানে কোথাও <code>new SqlOrderRepository()</code> বা <code>new OrderService(...)</code> লেখা হয়নি — request আসার সময় container পুরো dependency chain automatically বানিয়ে দেয়। ঠিক এই কারণেই <code>SqlOrderRepository</code>-কে পরে <code>MongoOrderRepository</code> দিয়ে বদলানো — বা unit test-এর সময় একটা হাতে-লেখা fake দিয়ে বদলানো — মাত্র <b>এক লাইন registration পরিবর্তন</b> করলেই হয়ে যায়, <code>OrderService</code>-এর একটা অক্ষরও না ছুঁয়ে।</p>
<pre>
<span class="c">// Unit test — আসল SQL ছাড়াই OrderService টেস্ট করা যাচ্ছে, কারণ dependency injected</span>
public class FakeOrderRepository : IOrderRepository
{
    public List&lt;Order&gt; Saved { get; } = new();
    public void Save(Order order) =&gt; Saved.Add(order);
}

[Fact]
public void PlaceOrder_SavesOrder()
{
    var fakeRepo = new FakeOrderRepository();
    var service = new OrderService(fakeRepo); <span class="c">// production কোডে এটা container করে, test-এ আমরা হাতে করি</span>

    service.PlaceOrder(new Order());

    Assert.Single(fakeRepo.Saved);
}
</pre>
<p><span class="badge">Testability</span> <span class="badge">Swappable implementation</span> <span class="badge">Loose coupling</span></p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> DI container কোনো ম্যাজিক না — এটা শুধু একটা lookup table যা abstraction-কে concrete implementation-এর সাথে ম্যাপ করে। আসল সুবিধাটা আসে DIP থেকে — <code>OrderService</code>-এর কোড শুধু <code>IOrderRepository</code> চেনে বলেই container-এর পক্ষে যেকোনো implementation "প্লাগ ইন" করা সম্ভব হচ্ছে। DIP না থাকলে DI container-এর এই ক্ষমতাটাই অর্থহীন হয়ে যেত।</div>

<h4>Service Lifetime — object-টা কতক্ষণ বাঁচবে, সেটাও একটা registration decision</h4>
<p>উপরের <code>AddScoped&lt;IOrderRepository, SqlOrderRepository&gt;()</code> কলে <code>AddScoped</code> শব্দটা নিজেই একটা গুরুত্বপূর্ণ সিদ্ধান্ত বহন করছে, যেটা এতক্ষণ চোখ এড়িয়ে গেছে — container শুধু <i>কোন</i> concrete class resolve করবে তা ঠিক করে না, <i>কতক্ষণ</i> সেই instance-টা বেঁচে থাকবে তাও ঠিক করে। ASP.NET Core-এর DI container তিনটা <span class="kw">lifetime</span> সমর্থন করে:</p>
<table>
<tr><th>Lifetime</th><th>Instance তৈরি হয় কখন</th><th>সাধারণ ব্যবহার</th></tr>
<tr><td><code>AddTransient</code></td><td>প্রতিবার resolve করার সময় — সবসময় একটা নতুন instance</td><td>ছোট, stateless service যার lifetime নিয়ে ভাবার কিছু নেই</td></tr>
<tr><td><code>AddScoped</code></td><td>একটা HTTP request-এর ভেতরে ঠিক একবার — সেই request-এর সব জায়গায় একই instance শেয়ার হয়</td><td><code>DbContext</code>-নির্ভর repository, request-ভিত্তিক unit-of-work</td></tr>
<tr><td><code>AddSingleton</code></td><td>পুরো অ্যাপ্লিকেশনের lifetime-এ ঠিক একবার</td><td>Configuration, cache, connection pool — চ্যাপ্টার ৮-এ দেখা Singleton pattern-এরই DI-managed রূপ</td></tr>
</table>
<div class="callout mistake"><span class="tag">Captive dependency — ভুল lifetime মেশানোর সবচেয়ে সাধারণ বাগ</span>
একটা <code>Singleton</code>-নিবন্ধিত service যদি constructor-এ একটা <code>Scoped</code> service (যেমন <code>DbContext</code>-নির্ভর repository) ইনজেক্ট করে, তাহলে container সেই Scoped instance-টা প্রথমবার resolve হওয়ার সময়ই একবার তৈরি করে Singleton-এর ভেতরে চিরকালের জন্য "বন্দী" (captive) করে ফেলে — এরপর প্রতিটা request সেই একই পুরনো, সম্ভবত ততক্ষণে disposed <code>DbContext</code>-এর সাথে কাজ করতে যায়, ফলে random <code>ObjectDisposedException</code> বা এক request-এর ডেটা আরেক request-এ মিশে যাওয়ার মতো bug দেখা দেয় — যা প্রোডাকশনে intermittent এবং রিপ্রোডিউস করা কঠিন। নিয়ম মনে রাখার সহজ উপায়: একটা service-এর lifetime তার সবচেয়ে "সংক্ষিপ্ত-জীবী" (shortest-lived) dependency-র চেয়ে দীর্ঘ হতে পারবে না — Singleton কখনো Scoped/Transient ইনজেক্ট করবে না; করলে ASP.NET Core-এর built-in scope validation সাধারণত এটা startup-এই ধরে ফেলে।
</div>

<h3>৭.৫ DIP বনাম DI — এই দুটো এক জিনিস না</h3>
<p>এখানেই সবচেয়ে বেশি বিভ্রান্তি হয়। <span class="kw">Dependency Inversion Principle</span> একটা <b>design principle</b> — এটা বলে দেয় নির্ভরতার দিক কেমন হওয়া উচিত (abstraction-এর দিকে)। <span class="kw">Dependency Injection</span> একটা <b>technique</b> — dependency তৈরি করার বদলে বাইরে থেকে (constructor/method/property-এর মাধ্যমে) সরবরাহ করা। DI হলো DIP অর্জন করার একটা খুবই সাধারণ ও ব্যবহারিক উপায়, কিন্তু এই দুটো সমার্থক নয়।</p>
<table>
<tr><th></th><th>Dependency Inversion Principle (DIP)</th><th>Dependency Injection (DI)</th></tr>
<tr><td>ধরন</td><td>ডিজাইন নীতি (what/why)</td><td>বাস্তবায়নের কৌশল (how)</td></tr>
<tr><td>বলে দেয়</td><td>High-level কোড কীসের উপর নির্ভর করবে (abstraction, concrete class নয়)</td><td>সেই dependency কীভাবে ক্লাসের ভেতরে পৌঁছাবে (constructor injection, property injection ইত্যাদি)</td></tr>
<tr><td>ছাড়া চলে কি</td><td>DI ছাড়াও মানা যায় — যেমন factory method দিয়ে abstraction resolve করেও</td><td>DIP ছাড়াও ব্যবহার করা যায় — constructor-এ concrete class injectও করা যায়</td></tr>
</table>
<div class="callout mistake"><span class="tag">সাধারণ ভুল ধারণা — "DI container মানেই DIP মানা হয়ে গেছে"</span> এটা সত্যি নয়। একটা DI container দিয়ে concrete class-ও ইনজেক্ট করা যায়ঃ <code>builder.Services.AddScoped&lt;SqlOrderRepository&gt;()</code> এবং <code>OrderService</code>-এর constructor-এ সরাসরি <code>SqlOrderRepository</code> চাওয়া — এটা DI (dependency বাইরে থেকে আসছে), কিন্তু DIP ভাঙা হচ্ছে, কারণ high-level module এখনো concrete detail-কেই সরাসরি চিনছে। Container শুধু <b>wiring mechanism</b> — DIP আসলে source code-এ নির্ভরতার <b>স্ট্যাটিক দিক</b> নিয়ে কথা বলে, অর্থাৎ <code>OrderService</code>-এর কোড <code>IOrderRepository</code> reference করছে নাকি সরাসরি <code>SqlOrderRepository</code> — সেটাই আসল পরীক্ষা, container কী করছে সেটা নয়।</div>

<h3>৭.৬ DIP আগের নীতিগুলোকে একসাথে বাঁধে</h3>
<p>DIP নতুন কোনো ধারণা নয় — এটা এই কোর্সে আগেই দেখা দুটো instinct-এর আনুষ্ঠানিক রূপ, আর যেটা একটা DI container-এর মাধ্যমে বাস্তব অ্যাপ্লিকেশনে কাজে লাগে।</p>
<div class="grid2">
<div class="box"><b>চ্যাপ্টার ২ — Composition over Inheritance</b><br/>সেখানে শেখা হয়েছিল একটা fixed concrete টাইপের বদলে একটা swappable, composed অংশের উপর নির্ভর করা ভালো। DIP ঠিক এই একই instinct-কে "নির্ভরতা abstraction-এর দিকে যাক" হিসেবে সাধারণীকরণ করে।</div>
<div class="box"><b>চ্যাপ্টার ৪ — Open/Closed Principle</b><br/>OCP বলেছিল নতুন behavior/implementation existing কোড না বদলে "প্লাগ ইন" করা যাওয়া উচিত। DIP-ই সেই প্লাগ পয়েন্টটা বাস্তবে তৈরি করে দেয় — abstraction-টাই সেই "closed for modification, open for extension" contract।</div>
</div>
<p>বাস্তবে এই তিনটা নীতি একসাথে কাজ করেঃ Composition আমাদের শেখায় inheritance নয়, একটা swappable অংশ রাখতে; OCP বলে সেই অংশটা এমনভাবে ডিজাইন করতে যাতে নতুন variant existing কোড না বদলে যোগ করা যায়; আর DIP + DI container সেই সোয়াপটাকে বাস্তবে <b>রান-টাইম wiring হিসেবে সম্ভব</b> করে তোলে — একটা `AddScoped` লাইন বদলালেই পুরো implementation বদলে যায়।</p>
<div class="callout behind"><span class="tag">এর পেছনের চিন্তা</span> Robert C. Martin যখন Clean Architecture-এর কথা বলেন, তার কেন্দ্রীয় দাবিটাই DIP — ব্যবসায়িক নিয়ম (policy) কখনো জানবে না ডাটাবেজ, ফ্রেমওয়ার্ক, বা UI কী; বরং ডাটাবেজ/ফ্রেমওয়ার্ক জানবে ব্যবসায়িক নিয়ম কী abstraction আশা করছে। এভাবেই ব্যবসায়িক লজিক টেকনোলজি পরিবর্তনের (নতুন ডাটাবেজ, নতুন ORM) ধাক্কা থেকে সুরক্ষিত থাকে — কারণ পরিবর্তনটা সবসময় "বাইরের" স্তরে ঘটে, "ভেতরের" নীতিতে না।</div>

<h3>৭.৭ Over-injection — Interface-itis</h3>
<p>DIP-কে ভুল প্রয়োগ করার সবচেয়ে সাধারণ উপায় হলো প্রতিটা ক্লাসের জন্যই একটা interface বানিয়ে ফেলা — এমনকি যেই ক্লাসের দ্বিতীয় কোনো implementation কখনো হবে না তার জন্যও। একে বলা হয় <span class="kw">interface-itis</span>।</p>
<pre>
<span class="c">// অপ্রয়োজনীয় abstraction — এই EmailFormatter-এর দ্বিতীয় কোনো implementation কখনো আসবে না</span>
public interface IEmailFormatter
{
    string Format(string subject, string body);
}

public class EmailFormatter : IEmailFormatter
{
    public string Format(string subject, string body) =&gt; $"{subject}\n\n{body}";
}
</pre>
<div class="callout mistake"><span class="tag">Common mistake — অপ্রয়োজনীয় abstraction</span> শুধুমাত্র "DIP মেনে চলার জন্য" প্রতিটা ক্লাসের সামনে একটা interface বসিয়ে দিলে কোডে extra indirection যোগ হয় (একটা জিনিস খুঁজতে দুটো ফাইল খুলতে হয়) কিন্তু বাস্তব সুবিধা কিছুই পাওয়া যায় না — কারণ কখনোই দ্বিতীয় কোনো implementation আসবে না। এটা ঠিক চ্যাপ্টার ৪-এ OCP-এর অতিরিক্ত প্রয়োগের (speculative extensibility) মতোই একটা YAGNI-বিরোধী ভুল। Abstraction তখনই বসান যখন সত্যিই একাধিক implementation থাকবে (বিভিন্ন ডাটাবেজ, বা test-এর জন্য fake) — নয়তো concrete ক্লাসই যথেষ্ট।</div>
<div class="card"><b>দ্রুত যাচাই — কখন abstraction বসাবেন</b>
<ul>

<p>এখানেই SOLID-এর পাঁচটা নীতি শেষ হলো। নিচের টেবিলে পুরো arc-টা একসাথে দেখে নেওয়া যাকঃ</p>

<b>Dependency Inversion Principle</b> বলে — high-level module কখনো low-level module-এর উপর সরাসরি নির্ভর করবে না, দুটোই একটা abstraction-এর উপর নির্ভর করবে, আর সেই abstraction নিজে কোনো detail-এর উপর নির্ভর করবে না। <b>Dependency Injection</b> এটা অর্জনের একটা কৌশল মাত্র — constructor-এর মাধ্যমে dependency সরবরাহ করা — DI ব্যবহার করলেই DIP মানা হয়ে যায় না, যদি সেই dependency এখনো concrete class হয়ে থাকে। ASP.NET Core-এর DI container (<code>AddScoped&lt;IOrderRepository, SqlOrderRepository&gt;()</code>) এই নীতিটাকে বাস্তব রান-টাইম wiring-এ পরিণত করে — implementation বদলানো, mock/fake দিয়ে টেস্ট করা সবকিছু এক লাইনের registration পরিবর্তনে হয়ে যায়। সেই সাথে, এখানে SOLID-এর পাঁচটা নীতিই সম্পূর্ণ হলো — SRP ক্লাসকে একক দায়িত্বে রাখে, OCP এক্সটেনশনের জায়গা রাখে, LSP নিশ্চিত করে subtype নিরাপদে বসে, ISP interface-কে চিকন রাখে, আর DIP এই সবকিছুকে একটা abstraction-কেন্দ্রিক কাঠামোয় বেঁধে দেয়। এখন থেকে "SOLID মেনে চলা" মানেই এই পাঁচটা নীতি একসাথে বিবেচনা করা — কোনোটাই বিচ্ছিন্নভাবে প্রয়োগ করার জিনিস না।
<br/><br/>
পরের চ্যাপ্টারে (৮. Creational Design Patterns) আমরা দেখব DIP-এর এই "abstraction-এর পেছনে object তৈরি করা" ধারণাটাই কীভাবে Factory, Builder, ও Singleton-এর মতো classic pattern-এর ভিত্তি — যেখানে object তৈরি করার সিদ্ধান্তটাকেও ব্যবহারকারী কোড থেকে আলাদা করে ফেলা হয়।

<h2 class="title">৮. Creational Patterns — Singleton, Factory, Builder</h2>
<p class="lead">এতদিন আমরা SOLID দিয়ে ক্লাসের <b>ভেতরের</b> ডিজাইন ঠিক করেছি — দায়িত্ব কীভাবে ভাগ হবে, নতুন আচরণ কীভাবে যোগ হবে মূল কোড না ছুঁয়ে, abstraction-এর উপর নির্ভরতা কীভাবে তৈরি হবে। এখান থেকে শুরু হচ্ছে <span class="kw">Gang of Four</span> (GoF)-এর ২৩টি classic <span class="kw">Design Pattern</span>-এর জগৎ, তিনটে ভাগে: <b>Creational</b> (এই অধ্যায়) — object <b>কীভাবে তৈরি হবে</b>; <b>Structural</b> (অধ্যায় ৯) — object-রা কীভাবে <b>একসাথে জোড়া লাগে/composed হয়</b>; আর <b>Behavioral</b> (অধ্যায় ১০-১১) — object-রা রানটাইমে কীভাবে <b>একে অপরের সাথে কথা বলে</b>। তিনটে প্রশ্নই আলাদা, আর গুলিয়ে ফেললে প্যাটার্ন শেখাটা মুখস্থবিদ্যা হয়ে যায়। এই অধ্যায়ে আমরা চারটা সবচেয়ে গুরুত্বপূর্ণ creational প্যাটার্ন দেখব — এবং প্রতিটার সাথেই একটা সতর্কতা থাকবে, কারণ এই দলের প্যাটার্নগুলো যতটা দরকারি, ততটাই অপব্যবহৃত হয়।</p>

<h3>কেন সরাসরি <code>new</code> যথেষ্ট নয়</h3>
<p>যেকোনো জায়গায় <code>new SomeClass()</code> লিখলে সেই কোড চিরকালের জন্য <code>SomeClass</code>-এর সাথে সরাসরি বাঁধা পড়ে যায় — ঠিক যেমন DIP অধ্যায়ে দেখেছিলাম, concrete class-এর উপর সরাসরি নির্ভরতা মানে সেই নির্ভরতা পরে বদলানো, mock করা, বা রানটাইমে ভিন্ন implementation-এ সুইচ করা কঠিন হয়ে যায়। Creational প্যাটার্নগুলোর মূল কাজ একটাই — <b>object তৈরি করার সিদ্ধান্তটাকে</b> client কোড থেকে আলাদা করে একটা নিয়ন্ত্রিত জায়গায় নিয়ে আসা, যাতে:</p>
<ul>
<li>Client কোড জানে <i>কী ধরনের</i> object দরকার, কিন্তু জানে না <i>ঠিক কোন concrete class</i> এসে সেটা পূরণ করবে (Factory Method, Abstract Factory)।</li>
<li>একই instance পুরো অ্যাপ জুড়ে শেয়ার হওয়া দরকার হলে, সেটা এক জায়গায় নিয়ন্ত্রিত হয় (Singleton)।</li>
<li>একটা object তৈরি করতে অনেকগুলো ধাপ বা অনেক optional parameter লাগলে, সেই জটিলতা client-এর কাছ থেকে লুকানো থাকে (Builder)।</li>
</ul>

<h3>Singleton — একটাই ইনস্ট্যান্স, সবখানে</h3>
<span class="badge">Sole instance</span><span class="badge">Global access point</span>
<p><span class="kw">Singleton</span> প্যাটার্ন নিশ্চিত করে একটা ক্লাসের ঠিক একটাই instance পুরো অ্যাপ্লিকেশনের lifetime জুড়ে বিদ্যমান থাকবে, এবং সেই instance-এ যেকোনো জায়গা থেকে অ্যাক্সেস করা যাবে। ক্লাসিক ব্যবহার — একটা configuration manager, একটা connection pool, বা লগিং সাবসিস্টেম, যেখানে একাধিক instance থাকলে state-এর অসামঞ্জস্য বা resource-এর অপচয় হতো।</p>
<pre>public sealed class ConfigurationManager
{
    <span class="c">// Lazy&lt;T&gt; নিশ্চিত করে instance তৈরি হয় প্রথমবার ব্যবহারের সময়, thread-safe ভাবে</span>
    private static readonly Lazy&lt;ConfigurationManager&gt; _instance =
        new Lazy&lt;ConfigurationManager&gt;(() =&gt; new ConfigurationManager());

    public static ConfigurationManager Instance =&gt; _instance.Value;

    private readonly Dictionary&lt;string, string&gt; _settings;

    <span class="kw">private</span> ConfigurationManager() <span class="c">// constructor private — বাইরে থেকে 'new' করা যাবে না</span>
    {
        _settings = LoadFromDisk();
    }

    public string Get(string key) =&gt;
        _settings.TryGetValue(key, out var v) ? v : null;
}

<span class="c">// ব্যবহার — অ্যাপের যেকোনো জায়গা থেকে</span>
var timeout = ConfigurationManager.Instance.Get("Timeout");</pre>
<p><code>private</code> constructor বাইরের কোডকে দ্বিতীয় instance বানানো থেকে আটকায়, আর <span class="kw">Lazy&lt;T&gt;</span> নিশ্চিত করে instance তৈরি হয় প্রথমবার ব্যবহারের ঠিক আগ মুহূর্তে (lazy initialization), এবং একাধিক thread একসাথে <code>.Instance</code> কল করলেও <code>Lazy&lt;T&gt;</code>-এর ভেতরের locking নিশ্চিত করে মাত্র একটাই object তৈরি হয়।</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — Lazy&lt;T&gt; ছাড়া ঠিক কী ভাঙে</span>

<pre>public class NaiveConfig
{
    private static NaiveConfig _instance;
    public static NaiveConfig Instance

<h4>আধুনিক বিকল্প: DI Container-এর Singleton Lifetime</h4>
<div class="callout best"><span class="tag">ব্যবহারিক পরামর্শ</span> আধুনিক ASP.NET Core-এ হাতে-বানানো static Singleton ক্লাসের বদলে DI container-এর <span class="kw">Singleton lifetime</span> ব্যবহার করুন — <code>services.AddSingleton&lt;IConfigService, ConfigService&gt;()</code>। গ্যারান্টি একই (একটাই instance, পুরো অ্যাপ জুড়ে), কিন্তু dependency ইন্টারফেসের মাধ্যমে injected হয় বলে (ঠিক DIP অধ্যায়ে দেখা প্যাটার্নেই) unit test-এ সহজে mock/fake দিয়ে বদলে দেওয়া যায়, আর প্রতিটা test আলাদা DI container/scope নিয়ে শুরু করলে state leak হওয়ার সুযোগ থাকে না। hidden global state-এর গ্যারান্টিও কমে যায়, কারণ dependency constructor-এ explicit — কোথা থেকে আসছে সেটা স্পষ্ট, ম্যাজিক static access না।</div>

<h3>Factory Method — কে তৈরি হবে, ঠিক করে subclass/implementation</h3>
<span class="badge">One product type</span><span class="badge">Runtime selection</span>
<p><span class="kw">Factory Method</span> প্যাটার্নে object তৈরির জন্য একটা interface/abstract method ডিফাইন করা হয়, কিন্তু ঠিক কোন concrete class instantiate হবে সেটা ঠিক করে ভিন্ন ভিন্ন বাস্তবায়ন। সমস্যাটা এখানে — client-এর একটা <code>INotification</code> দরকার, কিন্তু client-কে জানতে হবে না সেটা <code>EmailNotification</code> নাকি <code>SmsNotification</code>।</p>
<pre>public interface INotification
{
    void Send(string to, string message);
}

public class EmailNotification : INotification
{
    public void Send(string to, string message) { /* SMTP দিয়ে পাঠানো */ }
}

public class SmsNotification : INotification
{
    public void Send(string to, string message) { /* SMS gateway দিয়ে পাঠানো */ }
}

public interface INotificationFactory
{
    INotification Create();
}

public class EmailNotificationFactory : INotificationFactory
{
    public INotification Create() =&gt; new EmailNotification();
}

public class SmsNotificationFactory : INotificationFactory
{
    public INotification Create() =&gt; new SmsNotification();
}

<span class="c">// client কখনো EmailNotification/SmsNotification নামটাই দেখে না</span>
public class AlertService
{
    <span class="kw">private readonly</span> INotificationFactory _factory;
    public AlertService(INotificationFactory factory) =&gt; _factory = factory;

    public void Alert(string to, string msg) =&gt; _factory.Create().Send(to, msg);
}</pre>
<p><code>AlertService</code> শুধু <code>INotificationFactory</code> ও <code>INotification</code> চেনে। নতুন একটা <code>PushNotificationFactory</code> যোগ করতে হলে <code>AlertService</code>-এর একটা লাইনও বদলাতে হয় না — শুধু নতুন ক্লাস যোগ করে DI-তে register করলেই হয়।</p>

<h3>Abstract Factory — পুরো পরিবার একসাথে, নাহলে না</h3>
<span class="badge">Product family</span><span class="badge">Consistency guarantee</span>
<p><span class="kw">Abstract Factory</span>-কে বলা যায় "factory-দের factory" — এটা একটামাত্র product না, বরং <b>সম্পর্কিত object-এর একটা পুরো পরিবার</b> তৈরি করে, যেগুলো সবসময় একসাথে ব্যবহৃত হওয়া উচিত। ক্লাসিক উদাহরণ — একটা UI theme factory, যা Dark থিমের জন্য মিলিয়ে-যাওয়া Button + Checkbox + Scrollbar একসাথে তৈরি করে দেয়, যাতে ভুলবশত একটা Dark Button-এর সাথে Light Scrollbar মিশে না যায়।</p>
<div class="callout why"><span class="tag">কেন শুধু Factory Method যথেষ্ট নয়</span> Factory Method একবারে একটা product-এর সিদ্ধান্ত নেয়। কিন্তু যদি ৩টা আলাদা Factory Method দিয়ে Button, Checkbox, Scrollbar আলাদাভাবে তৈরি করা হতো, তাহলে কোনো কিছুই আটকাত না যদি কেউ ভুলবশত Dark Button-এর সাথে Light Checkbox তৈরি করে ফেলে — প্রতিটা সিদ্ধান্ত স্বাধীন। Abstract Factory এই সমস্যার সমাধান করে একটা <b>একক factory object</b>-এর মধ্যে পুরো পরিবারের creation logic বেঁধে রেখে — একটা <code>DarkThemeFactory</code> থেকে যা-ই আসুক, তা গ্যারান্টিড Dark পরিবারের।</div>
<pre>public interface IButton { void Render(); }
public interface ICheckbox { void Render(); }

public interface IUiThemeFactory
{
    IButton CreateButton();
    ICheckbox CreateCheckbox();
}

public class DarkThemeFactory : IUiThemeFactory
{
    public IButton CreateButton() =&gt; new DarkButton();
    public ICheckbox CreateCheckbox() =&gt; new DarkCheckbox();
}

public class LightThemeFactory : IUiThemeFactory
{
    public IButton CreateButton() =&gt; new LightButton();
    public ICheckbox CreateCheckbox() =&gt; new LightCheckbox();
}

<span class="c">// client শুধু IUiThemeFactory চেনে — কোন থিম, তা runtime-এ ঠিক হয়</span>
void RenderPanel(IUiThemeFactory factory)
{
    IButton button = factory.CreateButton();
    ICheckbox checkbox = factory.CreateCheckbox();
    button.Render();
    checkbox.Render();
}</pre>

Abstract Factory-তে নতুন পরিবার (ধরুন একটা <code>HighContrastThemeFactory</code>) যোগ করা সহজ — শুধু <code>IUiThemeFactory</code> implement করা একটা নতুন class। কিন্তু উল্টো দিকের প্রশ্নটা প্রায়ই ভুলে যাওয়া হয়: পরিবারে একটা <b>নতুন product type</b> যোগ করতে হলে (ধরুন সব থিমেই এখন <code>CreateScrollbar()</code>-ও লাগবে) <code>IUiThemeFactory</code> ইন্টারফেসটাই বদলাতে হয় — আর তার মানে <code>DarkThemeFactory</code>, <code>LightThemeFactory</code>-সহ ইন্টারফেসটার প্রতিটা existing implementation-এ নতুন method যোগ করতে হবে, নাহলে কম্পাইলই হবে না। অর্থাৎ Abstract Factory একদিকে (নতুন family) OCP মেনে চলে, কিন্তু অন্যদিকে (নতুন product type) সেটা ভেঙে ফেলে — existing সব factory-কেই ছুঁতে হয়। এটা কোনো bug না, প্যাটার্নটার নিজস্ব সীমাবদ্ধতা — তাই Abstract Factory তখনই বেছে নিন যখন পরিবারের সংখ্যা (নতুন theme) বদলানোর সম্ভাবনা product type-এর সংখ্যা (নতুন widget) বদলানোর চেয়ে বাস্তবে অনেক বেশি।
</div>

<h3>Builder — জটিল object ধাপে ধাপে তৈরি</h3>
<span class="badge">Step-by-step</span><span class="badge">Optional parameters</span>
<div class="callout why"><span class="tag">Telescoping Constructor সমস্যা</span> একটা <code>Email</code> ক্লাসের constructor-এ যদি To, Cc, Bcc, Subject, Body, Attachments, Priority, IsHtml — আট-নয়টা parameter থাকে, তাহলে হয় সবকটা একসাথে নিতে হয় (বেশিরভাগ optional হলেও), নয়তো প্রতিটা কম্বিনেশনের জন্য একটা করে constructor overload লিখতে হয় — একে বলে <b>telescoping constructor anti-pattern</b>। কল করার সময় কোন position-এ কী parameter, তা মনে রাখাও কঠিন হয়ে যায় (<code>new Email(a, null, null, b, c, null, 1, true)</code> পড়া প্রায় অসম্ভব)।</div>
<p><span class="kw">Builder</span> প্যাটার্ন object তৈরির প্রক্রিয়াকে তার representation থেকে আলাদা করে — একটা fluent, named-step API দিয়ে object বানানো হয়, আর শেষ ধাপে (<code>Build()</code>) invariant validate করে চূড়ান্ত, পূর্ণাঙ্গ object রিটার্ন করা হয়।</p>
<pre>public class Email
{
    public string To { get; init; }
    public string Subject { get; init; }
    public string Body { get; init; }
    public IReadOnlyList&lt;string&gt; Attachments { get; init; } = Array.Empty&lt;string&gt;();
}

public class EmailBuilder
{
    private string _to, _subject, _body;
    private readonly List&lt;string&gt; _attachments = new();

    public EmailBuilder To(string address) { _to = address; return this; }
    public EmailBuilder Subject(string subject) { _subject = subject; return this; }
    public EmailBuilder Body(string body) { _body = body; return this; }
    public EmailBuilder Attach(string filePath) { _attachments.Add(filePath); return this; }

    public Email Build()
    {
        <span class="c">// invariant validate করা হয় ঠিক এখানে, তৈরির শেষ মুহূর্তে</span>
        if (string.IsNullOrWhiteSpace(_to))
            <span class="kw">throw new</span> InvalidOperationException("To ছাড়া email পাঠানো যায় না");

        return new Email { To = _to, Subject = _subject, Body = _body, Attachments = _attachments };
    }
}

<span class="c">// fluent chain — কোনো telescoping constructor নেই, প্রতিটা ধাপ স্ব-ব্যাখ্যাত</span>
var email = new EmailBuilder()
    .To("client@example.com")
    .Subject("Invoice #4521")
    .Body("আপনার ইনভয়েস সংযুক্ত করা হলো।")
    .Attach("invoice.pdf")
    .Build();</pre>
<div class="grid2">
<div class="box"><b>Object Initializer / Record (C# 9+)</b><p>সাধারণ, স্বল্প-field object-এর জন্য যথেষ্ট: <code>new Email { To = "...", Subject = "..." }</code>। কিন্তু কোনো validation বা multi-step logic নেই — কেউ চাইলে অসম্পূর্ণ বা invalid object তৈরি করে ফেলতে পারে, আর <code>init</code>-এর পরে কোনো enforced ধাপ নেই।</p></div>
<div class="box"><b>Builder Pattern</b><p><code>Build()</code>-এর মধ্যে invariant validate করা যায় (যেমন "To ছাড়া object তৈরিই হবে না"), ধাপে ধাপে conditional logic দিয়ে object সাজানো যায়, আর জটিল, বহু-অংশের object (nested collection, computed field) তৈরির প্রক্রিয়াটাকে readable রাখা যায়।</p></div>
</div>

<h3>চার প্যাটার্নের পাশাপাশি তুলনা</h3>
<div class="diagram"><pre>Factory Method                  Abstract Factory                  Builder
───────────────                 ────────────────                  ───────
 Client                          Client                            Client
   │                               │                                 │
   ▼                               ▼                                 ▼
 Creator (abstract)             AbstractFactory                   Builder
   │                               │                              .StepA()
   ├──▶ ConcreteCreatorA           ├──▶ ConcreteFactory1           .StepB()
   │      └─▶ ProductA             │      ├─▶ ProductA1           .StepC()
   └──▶ ConcreteCreatorB           │      ├─▶ ProductB1               │
          └─▶ ProductB             │      └─▶ ProductC1  (family)     ▼
                                   └──▶ ConcreteFactory2           .Build()
                                          ├─▶ ProductA2                │
                                          ├─▶ ProductB2                ▼
                                          └─▶ ProductC2  (family)  একটাই
                                                                   জটিল Product

এক ধরনের প্রোডাক্ট,             একগুচ্ছ সম্পর্কিত প্রোডাক্ট,           ধাপে ধাপে অ্যাসেম্বল,
ভিন্ন ভিন্ন বাস্তবায়ন             সবসময় একসাথে ও সামঞ্জস্যপূর্ণ            শেষে validate করে
</pre></div>
<div class="card">
<p><b>মনে রাখার শর্টকাট:</b> নিজেকে জিজ্ঞেস করুন — "আমার কি <i>একটা</i> object দরকার, নাকি <i>একগুচ্ছ মিলে-যাওয়া</i> object, নাকি <i>একটাই জটিল</i> object যা ধাপে ধাপে বানাতে হয়?" প্রথম উত্তর হলে Factory Method, দ্বিতীয় হলে Abstract Factory, তৃতীয় হলে Builder। আর যদি প্রশ্নটা "পুরো অ্যাপে এটার একটাই কপি থাকা উচিত কি না" হয়, তাহলে Singleton — তবে হাতে-বানানো ক্লাস হিসেবে নয়, DI lifetime হিসেবে।</p>
</div>
<table>
<tr><th>প্যাটার্ন</th><th>কোন সমস্যা সমাধান করে</th><th>কখন ব্যবহার করবেন</th><th>.NET / বাস্তব উদাহরণ</th></tr>
<tr><td><span class="kw">Singleton</span></td><td>পুরো অ্যাপে একটাই instance দরকার — একাধিক instance হলে state duplication বা resource conflict হবে</td><td>Shared cache, connection pool — আধুনিক কোডে হাতে-বানানো static ক্লাসের বদলে DI lifetime দিয়ে</td><td><code>services.AddSingleton&lt;T&gt;()</code></td></tr>
<tr><td>Factory Method</td><td>Client-কে concrete class না জানিয়ে object তৈরি — নতুন type এলে client কোড অপরিবর্তিত থাকে</td><td>এক ধরনের product-এর একাধিক implementation আছে, runtime-এ বাছাই দরকার</td><td><code>IHttpClientFactory.CreateClient(name)</code></td></tr>
<tr><td>Abstract Factory</td><td>একগুচ্ছ সম্পর্কিত object সবসময় সামঞ্জস্যপূর্ণভাবে তৈরি হওয়া নিশ্চিত করে — ভুল মিশ্রণ রোধ করে</td><td>Theme/UI kit, cross-provider abstraction, cross-platform widget family</td><td><code>System.Data.Common.DbProviderFactory</code> (Connection+Command+Parameter একসাথে family হিসেবে আসে)</td></tr>
<tr><td>Builder</td><td>জটিল object, অনেক optional field — ধাপে ধাপে তৈরি করে শেষে invariant validate করা দরকার</td><td>৫+ optional parameter, multi-step configuration, telescoping constructor এড়ানো</td><td><code>StringBuilder</code>, <code>IHostBuilder</code> / <code>WebApplicationBuilder</code></td></tr>
</table>

<h3>এই প্যাটার্নগুলো আসলে SOLID-এরই প্রয়োগ</h3>
<div class="callout behind"><span class="tag">পর্দার আড়ালে</span> Factory Method এবং Abstract Factory কোনো নতুন নীতি আবিষ্কার করে না — এগুলো <span class="kw">DIP</span> (অধ্যায় ৭) আর <span class="kw">OCP</span> (অধ্যায় ৪)-এর সরাসরি, বাস্তব প্রয়োগ। Client কোড শুধু abstract product interface (<code>INotification</code>) আর abstract creator interface (<code>INotificationFactory</code>)-এর উপর নির্ভর করে — এটাই DIP: high-level module concrete implementation-এর উপর নির্ভর করে না। আর নতুন product type (<code>PushNotification</code>) যোগ করতে গিয়ে client-এর একটা লাইনও বদলাতে হয় না, শুধু নতুন ক্লাস extend/implement করে register করলেই হয় — এটাই OCP: extension-এর জন্য open, existing code modification-এর জন্য closed। Creational প্যাটার্ন তাই SOLID নীতির বিপরীত কিছু নয়, বরং সেই নীতিগুলোকে কংক্রিট, পুনর্ব্যবহারযোগ্য আকারে বাস্তবায়নের একটা রেসিপি বই।</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> Creational Patterns সমাধান করে <b>object কীভাবে তৈরি হবে</b> তার সমস্যা — Singleton একটাই instance নিশ্চিত করে (কিন্তু হাতে-বানানো static ক্লাসের বদলে DI Singleton lifetime ব্যবহার করুন), Factory Method client-কে concrete type থেকে আলাদা রাখে, Abstract Factory পুরো একটা সামঞ্জস্যপূর্ণ পরিবার একসাথে তৈরি করায়, আর Builder জটিল, বহু-parameter object-কে readable, validated ধাপে ভাগ করে দেয়। চারটাই মূলত DIP আর OCP-এর প্রয়োগ। কিন্তু object তৈরি হয়ে যাওয়ার পর প্রশ্ন থাকে — এই object-গুলো <b>একসাথে কীভাবে জোড়া লাগবে</b়? একটা পুরনো ক্লাসকে নতুন interface-এর সাথে কীভাবে মেলানো যায় (Adapter), রানটাইমে কীভাবে নতুন আচরণ চাপানো যায় ইনহেরিটেন্স ছাড়াই (Decorator), বা একটা জটিল subsystem-কে কীভাবে একটা সহজ facade-এর পেছনে লুকানো যায় — সেটাই পরের অধ্যায়ের বিষয়: <b>৯. Structural Patterns</b>।</div>

<h2 class="title">৯. Structural Patterns — Adapter, Decorator, Facade, Proxy</h2>
<p class="lead">Creational patterns সমাধান করে অবজেক্ট <b>তৈরি</b> করার সমস্যা। Structural patterns সমাধান করে অবজেক্ট আর ক্লাস <b>কম্পোজ</b> করার সমস্যা — ছোট ছোট বিল্ডিং ব্লককে কীভাবে জোড়া দিয়ে বড়, নমনীয় স্ট্রাকচার বানানো যায়, ইনহেরিটেন্সের রিজিড ট্রি না বানিয়ে। চ্যাপ্টার ২-এ আমরা শিখেছিলাম কেন composition, inheritance-এর চেয়ে নমনীয়; এই চারটা প্যাটার্ন — <span class="kw">Adapter</span>, <span class="kw">Decorator</span>, <span class="kw">Facade</span>, আর <span class="kw">Proxy</span> — সেই instinct-টাকেই কংক্রিট, নাম-করা টেকনিকে রূপ দেয়।</p>

<h3>সবগুলোর মিল — "wrap" করা, কিন্তু কেন আলাদা আলাদা প্যাটার্ন</h3>
<p>চারটা প্যাটার্নেরই কাঠামো একরকম দেখতে লাগে — একটা ক্লাস আরেকটা অবজেক্ট ধরে রাখে (হোল্ড করে) আর তার কাজ কোনো না কোনোভাবে ব্যবহার করে। কিন্তু <b>উদ্দেশ্য (intent)</b> সম্পূর্ণ ভিন্ন, আর সেই উদ্দেশ্যই ঠিক করে কোন প্যাটার্ন কখন ব্যবহার করবেন:</p>
<div class="grid2">
  <div class="box"><b>Adapter</b> — দুইটা <i>বেমানান interface</i>-কে মেলায়। সমস্যাটা shape mismatch।</div>
  <div class="box"><b>Decorator</b> — একই interface রেখে <i>নতুন আচরণ</i> যোগ করে। সমস্যাটা behavior extension।</div>
  <div class="box"><b>Facade</b> — অনেকগুলো ক্লাসের <i>জটিলতা লুকিয়ে</i> একটা সহজ প্রবেশপথ দেয়। সমস্যাটা complexity hiding।</div>
  <div class="box"><b>Proxy</b> — আসল অবজেক্টের <i>অ্যাক্সেস নিয়ন্ত্রণ</i> করে। সমস্যাটা access control।</div>
</div>
<p>এই পার্থক্যটা মনে রাখলে বাকি পুরো চ্যাপ্টার সহজ হয়ে যাবে — কারণ কোড দেখতে প্রায় একরকম হলেও, প্রশ্নটা সবসময় হবে "আমি কী <i>করার চেষ্টা</i> করছি", শুধু "কোড কেমন দেখতে" না।</p>

<h3>Adapter — বেমানান ইন্টারফেসের অনুবাদক</h3>
<p><span class="kw">Adapter</span> প্যাটার্ন একটা ক্লাসের existing interface-কে ক্লায়েন্ট যে interface আশা করে সেই আকারে রূপান্তর করে, যাতে অন্যথায় বেমানান দুইটা জিনিস একসাথে কাজ করতে পারে। বাস্তব সমস্যা — ধরুন আপনার সিস্টেমে একটা legacy payment gateway আছে, যার API ডিজাইন হয়েছিল দশ বছর আগে, আর তার সিগনেচার আজকের কোডবেসের সাথে মেলে না।</p>
<pre>public <span class="kw">interface</span> ILegacyPaymentGateway
{
    <span class="c">// legacy সিস্টেম amount নেয় string হিসেবে, রেজাল্টও string ("OK"/"FAIL:...")</span>
    <span class="kw">string</span> Charge(<span class="kw">string</span> amountStr, <span class="kw">string</span> cardNumber);
}

<span class="kw">public interface</span> IPaymentGateway
{
    PaymentResult Charge(<span class="kw">decimal</span> amount, <span class="kw">string</span> cardNumber);
}

<span class="kw">public class</span> PaymentGatewayAdapter : IPaymentGateway
{
    <span class="kw">private readonly</span> ILegacyPaymentGateway _legacy;

    <span class="kw">public</span> PaymentGatewayAdapter(ILegacyPaymentGateway legacy) => _legacy = legacy;

    <span class="kw">public</span> PaymentResult Charge(<span class="kw">decimal</span> amount, <span class="kw">string</span> cardNumber)
    {
        <span class="c">// এখানেই ট্রান্সলেশন হয় — modern shape → legacy shape</span>
        <span class="kw">var</span> raw = _legacy.Charge(amount.ToString(<span class="kw">"F2"</span>), cardNumber);
        <span class="kw">return</span> raw == <span class="kw">"OK"</span>
            ? PaymentResult.Success()
            : PaymentResult.Failed(raw);
    }
}</pre>
<p>খেয়াল করুন — বাকি পুরো অ্যাপ্লিকেশন শুধু <code>IPaymentGateway</code>-এর কথা জানে। legacy gateway-এর অদ্ভুত string-based API-এর অস্তিত্ব সম্পূর্ণভাবে <code>PaymentGatewayAdapter</code>-এর ভেতরে বন্দী থাকে।</p>
<div class="callout why"><span class="tag">কেন এটা গুরুত্বপূর্ণ</span> Adapter শুধু legacy কোডের জন্য না — এটা প্রতিদিনের কাজ। যখনই আপনি কোনো third-party SDK (যেমন কোনো payment provider-এর বা SMS gateway-এর নিজস্ব client লাইব্রেরি) ব্যবহার করেন, সেই SDK-এর client-কে সরাসরি আপনার business logic-এ inject করা <b>উচিত না</b>। বরং নিজের একটা domain interface (যেমন <code>ISmsSender</code>) ডিফাইন করুন, আর SDK-কে wrap করে একটা adapter লিখুন। এতে সুবিধা দুইটা — (১) SDK পাল্টালে বা ভেন্ডর বদলালে শুধু adapter-টা বদলাতে হয়, বাকি কোড অক্ষত থাকে; (২) SDK-এর client টাইপ যদি unit test করা কঠিন হয় (sealed class, static method ইত্যাদি), আপনার নিজের interface সহজেই mock করা যায়।</div>

<h3>Decorator — রানটাইমে আচরণ স্তরে স্তরে যোগ করা</h3>
<p><span class="kw">Decorator</span> একই interface implement করে মূল অবজেক্টকে wrap করে, আর প্রতিটা wrapper কিছু আচরণ যোগ করে আসল call-টা ভেতরের অবজেক্টের কাছে delegate করে দেয় — মূল ক্লাসের কোড না বদলিয়ে, আর অন্য instance-কে প্রভাবিত না করে। উদাহরণ — একটা notification সিস্টেমে core কাজ হলো email পাঠানো, কিন্তু আমরা চাই সেটার সাথে logging আর retry যোগ হোক।</p>
<pre><span class="kw">public interface</span> INotifier
{
    <span class="kw">void</span> Send(<span class="kw">string</span> message);
}

<span class="kw">public class</span> EmailNotifier : INotifier
{
    <span class="kw">public void</span> Send(<span class="kw">string</span> message)
    {
        <span class="c">// SMTP দিয়ে সরাসরি ইমেইল পাঠানো — এটাই "core" আচরণ</span>
    }
}

<span class="kw">public class</span> LoggingNotifierDecorator : INotifier
{
    <span class="kw">private readonly</span> INotifier _inner;
    <span class="kw">private readonly</span> ILogger _logger;

    <span class="kw">public</span> LoggingNotifierDecorator(INotifier inner, ILogger logger)
        => (_inner, _logger) = (inner, logger);

    <span class="kw">public void</span> Send(<span class="kw">string</span> message)
    {
        _logger.LogInformation(<span class="kw">"Sending: {Message}"</span>, message);
        _inner.Send(message); <span class="c">// সবসময় delegate করে — শুধু আশেপাশে behavior জোড়া</span>
    }
}

<span class="kw">public class</span> RetryNotifierDecorator : INotifier
{
    <span class="kw">private readonly</span> INotifier _inner;

    <span class="kw">public</span> RetryNotifierDecorator(INotifier inner) => _inner = inner;

    <span class="kw">public void</span> Send(<span class="kw">string</span> message)
    {
        <span class="kw">for</span> (<span class="kw">var</span> attempt = 1; attempt <= 3; attempt++)
        {
            <span class="kw">try</span> { _inner.Send(message); <span class="kw">return</span>; }
            <span class="kw">catch</span> (Exception) <span class="kw">when</span> (attempt < 3) { <span class="c">/* পরের চেষ্টার জন্য গিলে ফেলা */</span> }
        }
    }
}

<span class="c">// রানটাইমে, ইচ্ছেমতো ক্রমে স্তর সাজানো — কোনো নতুন ক্লাসের দরকার নেই</span>
INotifier notifier = <span class="kw">new</span> RetryNotifierDecorator(
    <span class="kw">new</span> LoggingNotifierDecorator(<span class="kw">new</span> EmailNotifier(), logger));</pre>
<p>এখানে <code>RetryNotifierDecorator</code> আর <code>LoggingNotifierDecorator</code> দুইজনেই <code>INotifier</code> implement করে <b>এবং</b> একটা <code>INotifier</code> instance ধরে রাখে — এই দুটোই একসাথে থাকাটাই Decorator-এর গঠনগত স্বাক্ষর (structural signature)।</p>
<div class="callout mistake"><span class="tag">কেন subclassing দিয়ে এটা করা যায় না</span> ধরুন আপনি inheritance দিয়ে একই জিনিস করতে চাইলেন — <code>LoggingEmailNotifier</code>, <code>RetryEmailNotifier</code>। এখন যদি দুটোই একসাথে দরকার হয়, লিখতে হবে <code>LoggingRetryEmailNotifier</code> আর <code>RetryLoggingEmailNotifier</code> (অর্ডার ভিন্ন হলে আচরণও ভিন্ন হতে পারে)। তিনটা cross-cutting concern (logging, retry, caching) আর দুইটা notifier টাইপ (email, SMS) থাকলে combination সংখ্যা exponential হারে বাড়ে — এটাই <b>subclass explosion</b>। Decorator এই সমস্যা পুরোপুরি এড়িয়ে যায়, কারণ কম্পোজিশন হয় রানটাইমে, কম্পাইল-টাইম ক্লাস হায়ারার্কিতে না।</div>

<h3>Proxy বনাম Decorator — সবচেয়ে বেশি গুলিয়ে যাওয়া জোড়া</h3>
<p><span class="kw">Proxy</span> দেখতে প্রায় Decorator-এর মতোই — একই interface implement করে, ভেতরে একটা real object ধরে রাখে। কিন্তু উদ্দেশ্য উলটো। Proxy হলো real subject-এর সামনে দাঁড়ানো একটা <b>gatekeeper</b> — সে <b>অ্যাক্সেস নিয়ন্ত্রণ</b> করে, এমনকি call-টা real object পর্যন্ত পৌঁছাতেই নাও দিতে পারে। Decorator কখনো এমনটা করে না — সে সবসময় inner object-কে delegate করে, শুধু আশেপাশে behavior <b>যোগ</b> করে।</p>
<div class="callout mistake"><span class="tag">Common confusion — Decorator vs Proxy</span> নিয়ম মনে রাখার সবচেয়ে সহজ উপায়: <b>Decorator সবসময় delegate করে, শুধু বাড়তি কাজ করে</b> (logging, retry, formatting) — call কখনো আটকায় না। <b>Proxy delegate করতে পারে অথবা নাও করতে পারে</b> — সিদ্ধান্তটাই তার মূল কাজ (permission নেই? object এখনো লোড হয়নি? — তাহলে real object-এ যাওয়ারই দরকার নেই)। GoF বইয়ে দুটোকে আলাদা প্যাটার্ন হিসেবে রাখার কারণও এটাই — কোড গঠন এক হলেও, <i>ইন্টেন্ট</i> ভিন্ন, আর ইন্টেন্ট অনুযায়ী রিভিউয়ে প্রশ্ন করা উচিত ভিন্ন — Decorator রিভিউ করার সময় প্রশ্ন "behavior ঠিকমতো composable কিনা", Proxy রিভিউ করার সময় প্রশ্ন "access control ঠিকমতো enforce হচ্ছে কিনা, bypass করার কোনো ফাঁক আছে কিনা"।</div>

<h3>Facade — জটিল সাবসিস্টেমের ওপর একটা সহজ দরজা</h3>
<p><span class="kw">Facade</span> একগুচ্ছ ক্লাস নিয়ে গঠিত জটিল সাবসিস্টেমের ওপর একটা সরল, একীভূত interface দেয়। গুরুত্বপূর্ণ বিষয় — Facade কোনো <b>নতুন functionality</b> যোগ করে না, শুধু <b>existing functionality-তে অ্যাক্সেস সহজ</b> করে। ধরুন অর্ডার প্লেস করতে চারটা আলাদা সার্ভিস কো-অর্ডিনেট করতে হয়:</p>
<pre><span class="kw">public class</span> OrderFacade
{
    <span class="kw">private readonly</span> InventoryService _inventory;
    <span class="kw">private readonly</span> PaymentService _payment;
    <span class="kw">private readonly</span> ShippingService _shipping;
    <span class="kw">private readonly</span> NotificationService _notification;

    <span class="kw">public</span> OrderResult PlaceOrder(OrderRequest request)
    {
        <span class="kw">if</span> (!_inventory.Reserve(request.Items))
            <span class="kw">return</span> OrderResult.Failed(<span class="kw">"Out of stock"</span>);

        <span class="kw">var</span> payment = _payment.Charge(request.Amount, request.Card);
        <span class="kw">if</span> (!payment.Success)
        {
            _inventory.Release(request.Items); <span class="c">// rollback</span>
            <span class="kw">return</span> OrderResult.Failed(payment.Error);
        }

        _shipping.Schedule(request.Items, request.Address);
        _notification.NotifyOrderPlaced(request.CustomerId);
        <span class="kw">return</span> OrderResult.Success();
    }
}</pre>
<p>কলিং কোড (যেমন একটা API controller) এখন শুধু <code>orderFacade.PlaceOrder(request)</code> কল করে — চারটা সার্ভিসের অস্তিত্ব, তাদের কল করার সঠিক ক্রম, বা rollback লজিক জানারও দরকার নেই।</p>
<div class="callout best"><span class="tag">মনে রাখুন — Facade কী যোগ করে না</span> Facade-এর ভেতরের চারটা সার্ভিস এখনো সরাসরি ব্যবহারযোগ্য থাকে — Facade তাদের প্রতিস্থাপন করে না, শুধু একটা <b>সুবিধাজনক শর্টকাট</b> দেয়। যেসব জায়গায় fine-grained নিয়ন্ত্রণ দরকার (যেমন কোনো admin script শুধু inventory reserve করবে, পেমেন্ট ছাড়াই), সেখানে সরাসরি <code>InventoryService</code> ব্যবহার করা যায়। এখানেই Facade আর SOLID-এর SRP-এর সম্পর্ক — Facade নিজে একটা coordination দায়িত্ব নেয়, প্রতিটা সাবসিস্টেম নিজের একক দায়িত্বে থাকে।</div>
<div class="callout mistake"><span class="tag">Facade যখন নীরবে God Object হয়ে যায়</span> চ্যাপ্টার ১১-এ দেখবেন Mediator pattern-এর একটা পরিচিত ঝুঁকি হলো ধীরে ধীরে একটা God Object-এ পরিণত হওয়া — Facade-এরও ঠিক একই ঝুঁকি আছে, কারণ কাঠামোগতভাবে দুটোই একটা কেন্দ্রীয় coordination point। শুরুতে <code>OrderFacade.PlaceOrder()</code> শুধু চারটা service call আর rollback সাজায় — কিন্তু সময়ের সাথে যদি validation rule, retry logic, বা কোনো ব্যবসায়িক সিদ্ধান্ত সরাসরি Facade-এর ভেতরেই লেখা হতে থাকে ("এখানেই তো সবগুলো service-এর access আছে, এখানেই লিখে ফেলি"), তাহলে <code>OrderFacade</code>-ই একসময় নিজে একটা বিশাল, সব-জানা ক্লাসে পরিণত হয় — ঠিক যে সমস্যা এড়াতে Facade আনা হয়েছিল, সেটাই ফিরে আসে। মনে রাখার নিয়ম: Facade শুধু <i>coordinate</i> করে (কাকে, কোন ক্রমে কল করা হবে) — ব্যবসায়িক সিদ্ধান্ত (কত ডিসকাউন্ট, কবে refund) প্রতিটা নিজের সাবসিস্টেমেই (SRP অনুযায়ী) থাকা উচিত।</div>

<h3>Proxy — অ্যাক্সেস নিয়ন্ত্রণের তিনটি সাধারণ রূপ</h3>
<p>Proxy একটা placeholder বা stand-in অবজেক্ট, যেটা আরেকটা অবজেক্টের অ্যাক্সেস নিয়ন্ত্রণ করে। ব্যবহারিক জগতে এটা মূলত তিনটা রূপে দেখা যায়:</p>
<h4>Virtual Proxy — expensive object-কে lazy করা</h4>
<pre><span class="kw">public class</span> VirtualReportProxy : IReportGenerator
{
    <span class="kw">private</span> HeavyReportGenerator? _real;

    <span class="kw">public byte</span>[] Generate()
    {
        _real ??= <span class="kw">new</span> HeavyReportGenerator(); <span class="c">// প্রথম অ্যাক্সেসেই তৈরি হয়, তার আগে না</span>
        <span class="kw">return</span> _real.Generate();
    }
}</pre>
<p>যতক্ষণ কেউ <code>Generate()</code> না ডাকছে, ততক্ষণ ভারী রিপোর্ট অবজেক্টটা তৈরিই হয় না — মেমোরি আর CPU বাঁচে।</p>
<h4>Protection Proxy — কল যাওয়ার আগে অথরাইজেশন চেক</h4>
<p>Real object-কে কল করার আগে proxy চেক করে ইউজারের সেই কাজ করার অনুমতি আছে কিনা — না থাকলে exception ছুঁড়ে দেয় বা কল-টাই block করে দেয়, real object-এর কাছে যাওয়ার সুযোগই দেয় না।</p>
<h4>Remote Proxy — অন্য প্রসেসে থাকা অবজেক্টের প্রতিনিধি</h4>
<p>এখানে real object আসলে অন্য একটা প্রসেসে বা অন্য সার্ভারে থাকে (আরেকটা মাইক্রোসার্ভিসে)। প্রক্সি স্থানীয়ভাবে একই interface দেখায়, কিন্তু ভেতরে actual কাজটা হয় নেটওয়ার্ক কল দিয়ে — যেমন একটা generated gRPC client stub, যেটা দেখতে একটা সাধারণ method call, কিন্তু আসলে serialization আর একটা network round-trip লুকিয়ে থাকে।</p>

<h3>ASP.NET Core মিডলওয়্যার — আপনি প্রতিদিন Decorator ব্যবহার করছেন</h3>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — middleware pipeline আসলে stacked Decorator</span> ASP.NET Core-এর <code>app.Use(...)</code> দিয়ে বানানো middleware pipeline — exception handling, authentication, logging, routing — প্রতিটা middleware <code>RequestDelegate next</code> ধরে রাখে, নিজের কাজ করে, তারপর <code>await next(context)</code> কল করে পরের middleware-কে delegate করে। এটা হুবহু Decorator প্যাটার্ন — প্রতিটা middleware একই "signature" (<code>RequestDelegate</code>) নিয়ে পরের স্তরকে wrap করে, নিজে কিছু আচরণ (logging, timing, header injection) যোগ করে, আর ভেতরের স্তর জানেই না তাকে কে wrap করেছে। <code>UseExceptionHandler</code> সবচেয়ে বাইরের স্তরে থাকে বলেই সে pipeline-এর যেকোনো গভীর স্তরে ছোঁড়া exception ধরতে পারে — ঠিক যেমন <code>RetryNotifierDecorator</code> সবচেয়ে বাইরে থেকে ভেতরের সবকিছুকে ঘিরে রাখে।</div>

<h3>EF Core আর HttpClient-এ Proxy — চেনা উদাহরণ যেগুলো আসলে এই প্যাটার্ন</h3>
<p>দুটো পরিচিত .NET মেকানিজম আসলে Proxy প্যাটার্নের বাস্তব প্রয়োগ, যদিও নাম শুনে বোঝা যায় না:</p>
<div class="grid2">
  <div class="box"><b>EF Core lazy-loading proxies</b> — যখন কোনো entity class-এর navigation property <code>virtual</code> মার্ক করা থাকে, EF Core রানটাইমে একটা dynamically-generated proxy subclass তৈরি করে, যেটা মূল entity-র জায়গায় বসে। ওই property প্রথমবার অ্যাক্সেস করার আগ পর্যন্ত সংশ্লিষ্ট ডেটা ডাটাবেজ থেকে লোডই হয় না — classic virtual proxy।</div>
  <div class="box"><b>HttpClient delegating handlers</b> — <code>DelegatingHandler</code> দিয়ে বানানো handler chain (auth token যোগ করা, retry, logging) request-টাকে ধাপে ধাপে পার করায়, প্রতিটা handler পরেরটাকে কল করার সিদ্ধান্ত নিজে নিতে পারে (এমনকি short-circuit করে সরাসরি response ফেরত দিতে পারে) — এটা Decorator আর protection-Proxy-এর মিশ্রণ, যা আবারও দেখায় বাস্তব কোডে দুই প্যাটার্নের সীমারেখা মাঝে মাঝে ঝাপসা হয়ে যায়, কিন্তু ইন্টেন্ট বোঝাটাই আসল দক্ষতা।</div>
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> Structural patterns অবজেক্ট/ক্লাস <b>কম্পোজ</b> করার সমস্যা সমাধান করে — Adapter শেপ মেলায়, Decorator রানটাইমে behavior স্তরে স্তরে যোগ করে, Facade জটিলতা লুকিয়ে সহজ অ্যাক্সেস দেয়, আর Proxy অ্যাক্সেস নিয়ন্ত্রণ করে (দরকার হলে ব্লকও করে) — এই শেষ দুটোর পার্থক্যটাই (delegate সবসময় বনাম delegate কন্ডিশনাল) সবচেয়ে বেশি ইন্টারভিউতে জিজ্ঞেস করা হয়। এখন পর্যন্ত আমরা দেখেছি অবজেক্ট কীভাবে <i>তৈরি</i> হয় (creational) আর কীভাবে <i>গঠিত</i> হয় (structural)। বাকি রইল সবচেয়ে বড় প্রশ্ন — অবজেক্টগুলো একে অপরের সাথে কীভাবে <i>যোগাযোগ</i> করে আর দায়িত্ব ভাগ করে নেয়, রানটাইমে কীভাবে আচরণ বদলায়। চ্যাপ্টার ১০-এ শুরু হবে Behavioral Patterns — প্রথমে <span class="kw">Strategy</span> (রানটাইমে অ্যালগরিদম অদলবদল), <span class="kw">Observer</span> (এক-থেকে-অনেক ইভেন্ট নোটিফিকেশন), আর <span class="kw">Command</span> (একটা রিকোয়েস্টকে অবজেক্টে রূপান্তর — undo/redo, queueing-এর ভিত্তি)।</div>
</template>

<h2 class="title">১০. Behavioral Patterns — Strategy, Observer, Command</h2>
<p class="lead">Creational patterns সমাধান করে object <b>কীভাবে তৈরি হবে</b> সেই সমস্যা, Structural patterns সমাধান করে object-গুলো <b>কীভাবে একসাথে জোড়া লাগবে</b> সেই সমস্যা। এখন তৃতীয় পরিবার — <span class="kw">Behavioral Patterns</span> — যা সমাধান করে একদম ভিন্ন একটা প্রশ্ন: object-গুলো <b>কীভাবে যোগাযোগ করবে</b>, এবং একটা কাজের দায়িত্ব (responsibility) কীভাবে তাদের মধ্যে বণ্টন করা হবে। এই chapter-এ আমরা দেখবো তিনটা সবচেয়ে বেশি ব্যবহৃত behavioral pattern — Strategy, Observer, আর Command — এবং এদের প্রতিটাই .NET-এর built-in feature (LINQ comparer, event, MediatR) হিসেবে প্রতিদিন আপনার হাতের কাছে আছে।</p>

<h3>১০.১ Behavioral Patterns আসলে কী সমস্যা সমাধান করে</h3>
<p>একটু থেমে পার্থক্যটা স্পষ্ট করে নেওয়া যাক। <span class="kw">Creational</span> patterns প্রশ্ন করে — "object কীভাবে instantiate হবে?" <span class="kw">Structural</span> patterns প্রশ্ন করে — "ভিন্ন ভিন্ন interface-এর object-গুলোকে কীভাবে একসাথে কম্পোজ করব, একটাকে না ভেঙে?" আর <span class="kw">Behavioral</span> patterns প্রশ্ন করে একেবারে ভিন্ন কিছু — "রানটাইমে object-গুলোর মধ্যে দায়িত্ব আর যোগাযোগ কীভাবে ভাগ হবে? কে কাকে কল করবে, কে কার সিদ্ধান্তের জন্য অপেক্ষা করবে?" এই পার্থক্যটা মাথায় রাখলে পুরো chapter জুড়েই একটা কাঠামো পাবেন — প্রতিটা pattern আসলে "কে কার সাথে কীভাবে কথা বলে" সেই প্রশ্নের একটা নির্দিষ্ট উত্তর।</p>

<h3>১০.২ Strategy Pattern — যে জিনিসটা আপনি ইতিমধ্যে দুইবার দেখেছেন</h3>
<p><span class="kw">Strategy</span> pattern একগুচ্ছ interchangeable (একে অন্যের জায়গায় বসানো যায় এমন) algorithm সংজ্ঞায়িত করে, প্রতিটাকে একটা common interface-এর পেছনে encapsulate করে, এবং runtime-এ যেকোনোটা বেছে নেওয়ার সুযোগ দেয়। এখানে মূল ব্যাপারটা হলো — কাজটা (the "what") একই থাকে, শুধু সেটা করার পদ্ধতি (the "how") পাল্টায়, এবং সেই পদ্ধতিটা একটা আলাদা, injectable object-এর মধ্যে বাস করে।</p>
<div class="callout why"><span class="tag">এটা নতুন কিছু না</span> এটা লক্ষ করার মতো একটা ব্যাপার — আপনি এই pattern-টা এই কোর্সেই আগে দুইবার দেখে ফেলেছেন, নাম না জেনেই। OCP chapter-এর discount calculation উদাহরণে যখন <code>IDiscountPolicy</code>-এর মতো একটা interface দিয়ে ভিন্ন ভিন্ন discount logic inject করা হয়েছিল যাতে নতুন discount type যোগ করতে existing class-এ কোনো পরিবর্তন না লাগে — সেটা ছিল Strategy। আর Composition over Inheritance chapter-এ যখন <code>Car</code>-এর ভেতরে একটা swappable <code>Engine</code> বসানো হয়েছিল — সেটাও কার্যত Strategy-র-ই একটা রূপ। এই chapter শুধু সেই একই আইডিয়াকে একটা নাম আর একটা formal vocabulary দিচ্ছে।</div>
<p>ধরুন একটা reporting service আছে, যাকে data compress করে পাঠাতে হয়, কিন্তু compression algorithm ক্লায়েন্ট ভেদে ভিন্ন হতে পারে (Gzip, Brotli, বা কোনো proprietary format)। Strategy দিয়ে এটা এভাবে লেখা যায়:</p>
<pre>public interface ICompressionStrategy
{
    byte[] Compress(byte[] data);
}

public class GzipCompression : ICompressionStrategy
{
    public byte[] Compress(byte[] data) => /* GZipStream ব্যবহার করে compress */ data;
}

public class BrotliCompression : ICompressionStrategy
{
    public byte[] Compress(byte[] data) => /* BrotliStream ব্যবহার করে compress */ data;
}

<span class="c">// Context class — নিজে কম্প্রেশন কীভাবে হবে তা জানে না, শুধু interface-এর উপর নির্ভর করে</span>
public class ReportExporter
{
    private readonly ICompressionStrategy _compression;

    public ReportExporter(ICompressionStrategy compression)
    {
        _compression = compression;   <span class="c">// রানটাইমে বেছে নেওয়া strategy inject করা হলো</span>
    }

    public byte[] Export(byte[] rawReport) => _compression.Compress(rawReport);
}

<span class="c">// ব্যবহার — Context-এর কোডে হাত না দিয়েই strategy বদলে যাচ্ছে</span>
var exporter1 = new ReportExporter(new GzipCompression());
var exporter2 = new ReportExporter(new BrotliCompression());</pre>
<p>লক্ষ করুন — <code>ReportExporter</code>-এর ভেতরে কোনো <code>if (type == "gzip")</code> নেই। কোন algorithm চলবে সেটা constructor-এ ঠিক হয়ে যায়, এবং নতুন একটা compression scheme যোগ করতে হলে <code>ReportExporter</code>-এর একটা লাইনও বদলাতে হয় না — নতুন <code>ICompressionStrategy</code> implement করলেই হয়। এটাই ঠিক OCP-এর সংজ্ঞা: extension-এর জন্য open, modification-এর জন্য closed। Sorting-এর ক্ষেত্রেও একই আইডিয়া — একটা <code>ISortStrategy</code> interface দিয়ে বিভিন্ন sorting algorithm (bubble, quick, merge) একটা <code>Sorter</code> context class-এ inject করা যায়, ঠিক একইভাবে।</p>

<h3>১০.৩ Observer Pattern — এক-থেকে-বহু নোটিফিকেশন</h3>
<p><span class="kw">Observer</span> pattern একটা one-to-many dependency সংজ্ঞায়িত করে — একটা object (<b>subject</b>) যখন state পরিবর্তন করে, তখন তার উপর নির্ভরশীল সব object (<b>observers</b>) স্বয়ংক্রিয়ভাবে notify হয়ে যায়, subject-কে ম্যানুয়ালি প্রতিটা observer-কে খুঁজে বের করে জানাতে হয় না। C#-এ এই pattern এতটাই মৌলিক যে ভাষার built-in feature হিসেবে <span class="kw">event</span>/<code>EventHandler</code> আছে — আপনাকে নিজে থেকে observer list ম্যানেজ করতে হয় না।</p>
<pre>public class StockTicker
{
    <span class="c">// event — এটাই "subject"-এর নোটিফিকেশন চ্যানেল</span>
    public event EventHandler&lt;decimal&gt;? PriceChanged;

    private decimal _price;
    public decimal Price
    {
        get => _price;
        set
        {
            _price = value;
            PriceChanged?.Invoke(this, value);   <span class="c">// সব subscriber-কে notify করা হচ্ছে</span>
        }
    }
}

<span class="c">// দুটো ভিন্ন UI widget, দুটোরই টিকারের ব্যাপারে কোনো ধারণা নেই সরাসরি — শুধু event-এর সাথে subscribe করা</span>
public class PriceLabel
{
    public void Subscribe(StockTicker ticker) => ticker.PriceChanged += (s, price) =>
        Console.WriteLine($"Label updated: {price:C}");
}

public class PriceAlert
{
    public void Subscribe(StockTicker ticker) => ticker.PriceChanged += (s, price) =>
    {
        if (price &gt; 1000) Console.WriteLine("Alert: price crossed threshold!");
    };
}</pre>
<p>ডিকাপলিং-এর জায়গাটা লক্ষ করুন — <code>StockTicker</code>-এর <code>PriceLabel</code> বা <code>PriceAlert</code> নামে কোনো class সম্পর্কে জানার দরকার নেই। এটা শুধু জানে যে কেউ একটা <code>EventHandler&lt;decimal&gt;</code>-signature-এর delegate subscribe করেছে। নতুন একটা widget (ধরুন <code>PriceLogger</code>) যোগ করতে হলে <code>StockTicker</code>-এর একটা লাইনও বদলাতে হয় না — এটাই Observer-এর মূল সুবিধা: subject আর observer-দের মধ্যে concrete type-এর কোনো compile-time dependency থাকে না, শুধু একটা delegate signature/interface-এর চুক্তি থাকে। বড় সিস্টেমে যেখানে একাধিক asynchronous stream মেলাতে হয় বা event-এ LINQ-এর মতো filter/transform করতে হয়, সেখানে C#-এর <code>event</code>-এর বদলে <code>IObservable&lt;T&gt;</code>/<code>IObserver&lt;T&gt;</code> (Reactive Extensions / Rx) ব্যবহার করা হয় — একই আইডিয়ার আরও শক্তিশালী রূপ।</p>

<div class="callout mistake"><span class="tag">বিপজ্জনক ভুল — Observer memory leak</span> .NET-এ memory leak-এর সবচেয়ে সাধারণ উৎসগুলোর একটা হলো unsubscribed event handler। যদি কোনো short-lived object (যেমন একটা UI page বা request-scoped service) একটা long-lived subject-এর event-এ subscribe করে কিন্তু কখনো unsubscribe না করে, তাহলে subject সেই observer-এর একটা reference চিরকাল ধরে রাখে — এবং যতক্ষণ subject বেঁচে থাকে, ততক্ষণ garbage collector সেই observer-কে collect করতে পারে না, যদিও বাকি অ্যাপ্লিকেশনের দৃষ্টিতে সেটা "মৃত"। এটা একদিক থেকে counter-intuitive: observer subject-কে reference করছে ভেবে ভুল হয়, আসলে ঘটনা উল্টো — <code>+=</code> দিয়ে subscribe করলে delegate-এর ভেতরে subject observer-এর একটা reference ধরে রাখে।
<pre>public class ReportPage : IDisposable
{
    private readonly StockTicker _ticker;

    public ReportPage(StockTicker ticker)
    {
        _ticker = ticker;
        _ticker.PriceChanged += OnPriceChanged;   <span class="c">// subscribe</span>
    }

    private void OnPriceChanged(object? sender, decimal price) { /* ... */ }

    public void Dispose()
    {
        _ticker.PriceChanged -= OnPriceChanged;   <span class="c">// fix: explicit unsubscribe, নাহলে _ticker চিরকাল এই page-কে ধরে রাখবে</span>
    }
}</pre>
সমাধান সহজ কিন্তু ভুলে যাওয়া সহজ: <code>Dispose()</code>-এ (বা equivalent lifecycle hook-এ) সবসময় <code>-=</code> দিয়ে explicit unsubscribe করুন। বড় স্কেলে এটা manual ভাবে মনে রাখা কঠিন হলে .NET-এর <b>weak event pattern</b> (বা <code>WeakReference</code>-ভিত্তিক custom event manager) ব্যবহার করা যায়, যেখানে subject observer-কে শুধু weak reference দিয়ে ধরে রাখে — ফলে observer অন্য সব জায়গা থেকে unreachable হয়ে গেলে GC তাকে collect করতে পারে, subscription থাকা সত্ত্বেও।</div>

<h3>১০.৪ Command Pattern — action নিজেই একটা object</h3>
<p><span class="kw">Command</span> pattern একটা request বা action-কে নিজেই একটা object হিসেবে encapsulate করে, যাতে সেটাকে queue করা যায়, log করা যায়, undo করা যায়, বা যেকোনো সাধারণ value-র মতো এদিক-ওদিক পাস করা যায়। মূল আইডিয়া হলো — "কল করো" আর "কল করার তথ্য" আলাদা করে ফেলা: caller কমান্ড object তৈরি করে, কিন্তু সেটা কখন, কীভাবে বা এমনকি আদৌ execute হবে কিনা তার নিয়ন্ত্রণ অন্য কারো হাতে চলে যায়।</p>
<pre>public interface ICommand
{
    void Execute();
    void Undo();
}

public class InsertTextCommand : ICommand
{
    private readonly StringBuilder _document;
    private readonly string _text;
    private readonly int _position;

    public InsertTextCommand(StringBuilder document, string text, int position)
    {
        _document = document;
        _text = text;
        _position = position;
    }

    public void Execute() => _document.Insert(_position, _text);
    public void Undo() => _document.Remove(_position, _text.Length);
}

<span class="c">// Invoker — একটা undo/redo stack ধরে রাখে, Receiver (document)-এর ভেতরের লজিক জানে না</span>
public class CommandHistory
{
    private readonly Stack&lt;ICommand&gt; _history = new();

    public void Execute(ICommand command)
    {
        command.Execute();
        _history.Push(command);   <span class="c">// পরে undo করার জন্য জমা রাখা হলো</span>
    }

    public void UndoLast()
    {
        if (_history.TryPop(out var command))
            command.Undo();
    }
}</pre>
<p>এখানে editor-এর undo/redo stack যে কাজটা করছে সেটাই Command pattern-এর ক্লাসিক ব্যবহার — প্রতিটা action একটা storable object, তাই সেটা ফিরিয়ে নেওয়া (undo) বা পুনরায় করা (redo) সম্ভব শুধুমাত্র সেই object-টা আবার invoke করে। ঠিক একই আইডিয়া background job processing-এও কাজে লাগে — প্রতিটা job একটা Command object হিসেবে একটা queue-তে রাখা হয়, আর একটা worker পরে সেই queue থেকে job তুলে execute করে, request আসার সময় থেকে সম্পূর্ণ decoupled একটা সময়ে।</p>
<div class="callout behind"><span class="tag">বাস্তব জগতে — MediatR</span> আধুনিক ASP.NET Core অ্যাপ্লিকেশনে Command pattern-এর সবচেয়ে ব্যাপক ব্যবহার দেখা যায় <b>MediatR</b>-এর মতো লাইব্রেরিতে। এখানে প্রতিটা use case-কে একটা request object (<code>CreateOrderCommand</code>, <code>UpdateUserCommand</code>) হিসেবে মডেল করা হয়, যা <code>IRequest&lt;TResponse&gt;</code> implement করে, আর একটা আলাদা <code>IRequestHandler</code> সেটা execute করে। Controller শুধু <code>_mediator.Send(command)</code> কল করে — কমান্ডটা কীভাবে execute হবে সেই জ্ঞান controller-এর হাতে থাকে না। এটা Command pattern-এরই একটা industrial-strength রূপ, যেখানে request object, handler resolution, আর pipeline behavior (logging, validation) সবকিছু একসাথে গাঁথা।</div>

<h3>১০.৫ Strategy বনাম Command — একটা common interview confusion</h3>
<div class="callout mistake"><span class="tag">সাধারণ ভুল</span> Strategy আর Command দেখতে কাঠামোগতভাবে প্রায় একরকম — দুটোই একটা interface-এর পেছনে behavior লুকিয়ে রাখে এবং inject/pass করা যায় — যার কারণে ইন্টারভিউতে এই দুটো প্রায়ই গুলিয়ে ফেলা হয়। পার্থক্যটা তাদের <b>উদ্দেশ্যে</b>, গঠনে না। Strategy পাল্টায় <b>একই operation কীভাবে</b> সম্পন্ন হবে — উদাহরণস্বরূপ, "sort" সবসময় sort-ই থাকে, শুধু algorithm পাল্টায়। Command পাল্টায় আদৌ <b>কী operation</b> সম্পন্ন হবে, এবং সেই action-টাকেই একটা storable, queueable, undoable value বানিয়ে ফেলে। এক কথায়: Strategy interchangeable <i>algorithm</i>-এর জন্য, Command storable <i>action</i>-এর জন্য।</div>

<h3>১০.৬ Observer বনাম Command — যোগাযোগের ধরন</h3>
<p>দুটো pattern-ই object-দের মধ্যে decoupled যোগাযোগ তৈরি করে, কিন্তু একেবারে ভিন্ন আকারে। Observer একটা <b>fan-out</b> — একজন subject, বহু observer, সবাই সাথে সাথে notify হয়। Command একটা <b>time-shifted, single-path</b> flow — client একটা action object বানায়, সেটা কোথাও জমা থাকে, আর অনেক পরে, সম্পূর্ণ ভিন্ন context-এ, একজন receiver সেটা execute করে।</p>

<h3>১০.৭ সব একনজরে</h3>

<tr><td><span class="kw">Strategy</span></td><td>একই operation-এর জন্য interchangeable algorithm সংজ্ঞায়িত ও swap করা</td><td>Context class algorithm-এর concrete implementation থেকে ডিকাপলড — শুধু interface জানে</td><td><code>IComparer&lt;T&gt;</code> — <code>list.Sort(comparer)</code>, LINQ-এর <code>OrderBy(keySelector, comparer)</code></td></tr>

<h3>১০.৮ কোনটা কখন বেছে নেবেন</h3>
<div class="grid2">
<div class="box"><b>Strategy বেছে নিন যখন</b> — একটা fixed operation আছে (validate, sort, compress, calculate discount) যার একাধিক interchangeable বাস্তবায়ন দরকার, এবং caller runtime-এ ঠিক করবে কোনটা ব্যবহার হবে। Context class-এর কোড অপরিবর্তিত থাকে, শুধু injected strategy বদলায়।</div>
<div class="box"><b>Observer বেছে নিন যখন</b> — একাধিক অংশ একটা state পরিবর্তনে প্রতিক্রিয়া দেখাতে হবে, কিন্তু subject-কে সেই অংশগুলোর সংখ্যা বা identity নিয়ে মাথা ঘামাতে হবে না। এক-থেকে-বহু, push-based notification-এর জন্য আদর্শ।</div>
<div class="box"><b>Command বেছে নিন যখন</b> — একটা action-কে immediately execute না করে queue/log/schedule/undo করতে হবে — যেমন background job, undo stack, বা একটা request pipeline যেখানে logging/validation/retry middleware হিসেবে চলবে।</div>
<div class="box"><b>সতর্কতা</b> — তিনটাই misuse হতে পারে over-engineering হিসেবে। যদি সত্যিই কখনো দ্বিতীয় algorithm/observer/queued-action আসার সম্ভাবনা না থাকে, একটা সাধারণ method call-ই ঠিক আছে — pattern নিজেই কোনো goal না, প্রয়োজনের উত্তর মাত্র।</div>
</div>

<div class="callout best"><span class="tag">এই চ্যাপ্টারের সারাংশ</span> Behavioral patterns object-দের মধ্যে responsibility আর communication সংগঠিত করে। <span class="kw">Strategy</span> একই operation-এর interchangeable "how" এনক্যাপসুলেট করে (আপনি এটা আগে OCP আর Composition chapter-এ দুইবার দেখেছেন)। <span class="kw">Observer</span> C#-এর <code>event</code>-এর মাধ্যমে এক-থেকে-বহু notification দেয়, তবে unsubscribe ভুলে গেলে memory leak-এর ঝুঁকি থাকে। <span class="kw">Command</span> একটা action-কে নিজেই একটা storable/queueable/undoable object বানায় — MediatR এর industrial-strength উদাহরণ। পরের chapter, <b>১১. Behavioral Patterns part 2</b>-এ আমরা দেখব আরও তিনটা pattern — <span class="kw">Template Method</span> (একটা algorithm-এর skeleton fix রেখে ধাপগুলো subclass-এ override করা), <span class="kw">State</span> (object-এর আচরণ তার internal state অনুযায়ী বদলানো, if-else-এর জঙ্গল ছাড়াই), আর <span class="kw">Mediator</span> (object-দের সরাসরি একে অপরকে না জানিয়ে একটা কেন্দ্রীয় object দিয়ে communication সংগঠিত করা)।</div>

<template data-page="behavioral2">
<h2 class="title">১১. Behavioral Patterns — Template Method, State, Mediator</h2>
<p class="lead">গত চ্যাপ্টারে (১০) আমরা দেখেছি অবজেক্টদের মধ্যে <b>আচরণ</b> কীভাবে সংগঠিত হয় — algorithm swap করা (<span class="kw">Strategy</span>), event broadcast করা (<span class="kw">Observer</span>), request-কে object বানানো (<span class="kw">Command</span>)। এই চ্যাপ্টারে বাকি তিনটা মূল Behavioral pattern — একটা algorithm-এর <b>কাঠামো</b> ভাগাভাগি করা, একটা object-এর <b>internal state</b>-কে প্রথম-শ্রেণির নাগরিক বানানো, আর N-টা object-এর মধ্যে <b>যোগাযোগ</b> কেন্দ্রীভূত করা।</p>

<h3>Template Method — অ্যালগরিদমের কঙ্কাল, ধাপগুলো subclass-এর হাতে</h3>
<p><span class="kw">Template Method</span> pattern একটা base class-এ একটা algorithm-এর <b>স্কেলেটন</b> (ধাপের সুনির্দিষ্ট ক্রম) fix করে দেয়, কিন্তু প্রতিটা ধাপের বাস্তবায়ন subclass-এর উপর ছেড়ে দেয়। মূল method-টা (প্রায়ই <code>sealed</code>/non-overridable) ধাপগুলোকে নির্দিষ্ট ক্রমে ডাকে; subclass শুধু নির্দিষ্ট hook method override করে।</p>
<pre>public abstract class DataImporter
{
    // Template Method — ক্রম fix, override করা যাবে না
    public void Import()
    {
        var raw = ReadSource();
        if (!Validate(raw))
            throw new InvalidDataException("Source validation ব্যর্থ");

        var records = Transform(raw);
        Save(records);
    }

    protected abstract string ReadSource();
    protected abstract IEnumerable&lt;Record&gt; Transform(string raw);

    // ডিফল্ট বাস্তবায়ন আছে — subclass চাইলে override করতে পারে ("hook")
    protected virtual bool Validate(string raw) =&gt; !string.IsNullOrWhiteSpace(raw);

    private void Save(IEnumerable&lt;Record&gt; records) { <span class="c">/* সব subclass-এর জন্য এক */</span> }
}

public class CsvImporter : DataImporter
{
    protected override string ReadSource() =&gt; File.ReadAllText("data.csv");
    protected override IEnumerable&lt;Record&gt; Transform(string raw) =&gt; CsvParser.Parse(raw);
}

public class JsonImporter : DataImporter
{
    protected override string ReadSource() =&gt; File.ReadAllText("data.json");
    protected override IEnumerable&lt;Record&gt; Transform(string raw) =&gt; JsonParser.Parse(raw);
}</pre>
<p><code>CsvImporter</code> আর <code>JsonImporter</code> — কেউই <code>Import()</code>-এর ভেতরের ক্রম (read → validate → transform → save) নিয়ে চিন্তা করে না; এটা একবার লেখা, চিরকালের জন্য এক জায়গায় বন্ধ। শুধু যেখানে আসল পার্থক্য (source format), সেখানেই override।</p>

<div class="callout why"><span class="tag">Template Method বনাম Strategy — inheritance বনাম composition</span>
দুটোই "algorithm-এর অংশ পাল্টানো" সমস্যা সমাধান করে, কিন্তু ভিন্ন মেকানিজমে:
<ul>
<li><b>Template Method</b> — <span class="kw">inheritance</span> দিয়ে কাজ করে। Algorithm-এর <i>overall shape</i> (ধাপের সংখ্যা, ক্রম) সব variant জুড়ে সত্যিই এক থাকে; শুধু নির্দিষ্ট ধাপের বাস্তবায়ন পাল্টায়। একটা নতুন importer লিখতে একটা নতুন subclass লাগে — compile-time বাঁধন।</li>
<li><b>Strategy</b> (চ্যাপ্টার ১০) — <span class="kw">composition</span> দিয়ে কাজ করে। পুরো algorithm-টাই একটা swappable object; runtime-এ বদলানো যায়, একসাথে একাধিক strategy বাঁচতে পারে, আর একই object বিভিন্ন সময়ে ভিন্ন strategy ব্যবহার করতে পারে।</li>
</ul>
চ্যাপ্টার ২-এ আমরা শিখেছিলাম "composition over inheritance" — সাধারণত Strategy বেশি flexible, কারণ inheritance একটা rigid, compile-time সম্পর্ক তৈরি করে। কিন্তু Template Method তখনই সহজ ও সঠিক পছন্দ যখন ধাপের <b>ক্রম নিজেই</b> ডোমেইনের সত্যিকারের নিয়ম এবং সব variant-এর মধ্যে অভিন্ন — তখন সেই ক্রমটা বারবার প্রতিটা strategy-তে পুনরাবৃত্তি করার চেয়ে একবার base class-এ লেখা ভালো। ASP.NET Core-এর নিজস্ব pipeline hook-গুলো (যেমন middleware-এর মতো fixed lifecycle-এর উপর নির্ভরশীল abstract base class) এই ধরনের ব্যবহারের কাছাকাছি উদাহরণ।
</div>

<h3>কখন Template Method এড়িয়ে চলবেন</h3>
<p><span class="badge">চ্যাপ্টার ২</span><span class="badge">চ্যাপ্টার ৩ — LSP</span> Template Method-এর সবচেয়ে সাধারণ ব্যর্থতা হলো <b>fragile base class problem</b>: সময়ের সাথে সাথে যদি বিভিন্ন subclass-এর জন্য ধাপের ক্রম-ই আলাদা করার দরকার পড়ে (যেমন কোনো importer-এর <code>Transform()</code> আসলে <code>Validate()</code>-এর <i>আগে</i> চালাতে চায়), তাহলে base class-এর ফিক্সড <code>Import()</code> মেথডটাই বাধা হয়ে দাঁড়ায় — এবং subclass-গুলো hack (যেমন <code>Validate()</code>-কে no-op বানিয়ে আসল validation <code>Transform()</code>-এর ভেতরে গুঁজে দেওয়া) দিয়ে সেটা এড়াতে বাধ্য হয়, যা Liskov Substitution Principle ভাঙে। এই সংকেত দেখলে বুঝবেন — algorithm-এর shape আসলে fixed না, আর Strategy-তে (পুরো algorithm object হিসেবে composition) ফিরে যাওয়াই সঠিক।</p>

<h3>State — internal state-কে object বানিয়ে ফেলা</h3>
<p><span class="kw">State</span> pattern একটা object-কে তার internal state বদলানোর সাথে সাথে আচরণ বদলাতে দেয় — এমনভাবে যেন সে runtime-এ তার class-ই বদলে ফেলেছে। প্রতিটা state-কে একটা আলাদা class হিসেবে এনক্যাপসুলেট করা হয়, যেটা একটা common interface implement করে; context object তার বর্তমান state object-এর কাছে আচরণ delegate করে।</p>
<p>ক্লাসিক অ্যান্টি-প্যাটার্ন যেটা State প্রতিস্থাপন করে: কোডবেস জুড়ে ছড়িয়ে থাকা <code>switch (order.Status)</code> — অর্ডার-প্রসেসিং, রিপোর্টিং, নোটিফিকেশন — প্রতিটা জায়গায় একই enum-এর উপর ভিন্ন switch, আর নতুন state যোগ করলে সব জায়গা খুঁজে-খুঁজে আপডেট করতে হয়।</p>
<pre>public interface IOrderState
{
    IOrderState Pay(Order order);
    IOrderState Ship(Order order);
    IOrderState Cancel(Order order);
}

public class PendingState : IOrderState
{
    public IOrderState Pay(Order order) { order.ChargedAt = DateTime.UtcNow; return new PaidState(); }
    public IOrderState Ship(Order order) =&gt; throw new InvalidOperationException("Pay না করে Ship করা যাবে না");
    public IOrderState Cancel(Order order) =&gt; new CancelledState();
}

public class PaidState : IOrderState
{
    public IOrderState Pay(Order order) =&gt; throw new InvalidOperationException("ইতিমধ্যে Paid");
    public IOrderState Ship(Order order) { order.ShippedAt = DateTime.UtcNow; return new ShippedState(); }
    public IOrderState Cancel(Order order) =&gt; new CancelledState(); // refund logic এখানে
}

public class ShippedState : IOrderState
{
    public IOrderState Pay(Order order) =&gt; throw new InvalidOperationException("ইতিমধ্যে Shipped");
    public IOrderState Ship(Order order) =&gt; throw new InvalidOperationException("ইতিমধ্যে Shipped");
    public IOrderState Cancel(Order order) =&gt; throw new InvalidOperationException("Shipped অর্ডার cancel করা যায় না");
}

public class CancelledState : IOrderState
{
    public IOrderState Pay(Order order) =&gt; throw new InvalidOperationException("Cancelled অর্ডার-এ Pay করা যায় না");
    public IOrderState Ship(Order order) =&gt; throw new InvalidOperationException("Cancelled অর্ডার-এ Ship করা যায় না");
    public IOrderState Cancel(Order order) =&gt; this; // idempotent
}

public class Order
{
    public IOrderState State { get; private set; } = new PendingState();
    public DateTime? ChargedAt, ShippedAt;

    public void Pay()    =&gt; State = State.Pay(this);
    public void Ship()   =&gt; State = State.Ship(this);
    public void Cancel() =&gt; State = State.Cancel(this);
}</pre>
<p>এখন প্রতিটা state-এর <b>বৈধ transition</b> ঠিক একটাই class-এ co-located — নতুন state (যেমন <code>RefundedState</code>) যোগ করতে existing class-গুলো ঘাঁটতে হয় না, শুধু নতুন class লিখে যেসব state থেকে সেটায় যাওয়া সম্ভব সেগুলো আপডেট করলেই চলে। এটাই মূলত Open/Closed Principle (চ্যাপ্টার ৪)-এর একটা প্রয়োগ।</p>
