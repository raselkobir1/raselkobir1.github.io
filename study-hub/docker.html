<template data-page="foundation">
<h2 class="title">১. Foundation — Docker কী?</h2>
<p class="lead">এক লাইনে: Docker আপনার application-কে তার সব dependency সহ একটা হালকা, পোর্টেবল <span class="kw">container</span>-এ প্যাক করে — যা dev, test, production সব জায়গায় হুবহু একইভাবে চলে।</p>

<h3>কোন সমস্যা সমাধান করে?</h3>
<p>"আমার machine-এ তো চলছিল!" — এই চিরন্তন সমস্যা Docker শেষ করে। আপনার .NET app হয়তো আপনার laptop-এ চলে, কিন্তু server-এ .NET version, environment variable, বা OS library ভিন্ন হলে ভাঙে। Docker app + runtime + dependency + config সব একটা <b>image</b>-এ বেঁধে দেয় — যেখানেই চালান, একই পরিবেশ।</p>

<h3>Container বনাম Virtual Machine</h3>
<table>
<tr><th></th><th>Container</th><th>Virtual Machine</th></tr>
<tr><td>OS</td><td>Host-এর kernel <b>share</b> করে</td><td>প্রতিটার নিজের সম্পূর্ণ OS</td></tr>
<tr><td>আকার</td><td>MB (হালকা)</td><td>GB (ভারী)</td></tr>
<tr><td>Startup</td><td>মিলিসেকেন্ড/সেকেন্ড</td><td>মিনিট</td></tr>
<tr><td>Isolation</td><td>Process-level (namespace + cgroup)</td><td>Hardware-level (শক্তিশালী)</td></tr>
</table>
<div class="callout why"><span class="tag">কেন এত হালকা</span>
Container আলাদা OS boot করে না — এটা host Linux kernel-ই ব্যবহার করে, শুধু <span class="kw">namespace</span> (isolation) আর <span class="kw">cgroup</span> (resource limit) দিয়ে আলাদা করা প্রক্রিয়া। তাই VM-এর মতো ভারী নয়, অথচ যথেষ্ট isolation দেয়।</div>

<h3>Docker Architecture</h3>
<p>Docker একটা <b>client-server</b> স্থাপত্য: আপনি <code>docker</code> CLI দিয়ে command দেন → সেটা <span class="kw">Docker daemon</span> (<code>dockerd</code>)-এ REST API-তে যায় → daemon image build/run, container চালানো, registry থেকে pull সব করে।</p>

<tr><td><span class="kw">Docker CLI</span></td><td><code>docker</code> command — build, run, ps, logs ইত্যাদি (daemon-কে নির্দেশ দেয়)।</td></tr>

</table>

<template data-page="images">
<h2 class="title">২. Images · Layers · Union File System</h2>
<p class="lead">Image হলো blueprint, container হলো তার চলন্ত রূপ। মাঝখানে layer আর OverlayFS-এর জাদু — যা Docker-কে দ্রুত ও efficient করে।</p>

<h3>Image বনাম Container</h3>
<p><span class="kw">Image</span> = read-only template (app + dependency + config-এর snapshot)। <span class="kw">Container</span> = সেই image থেকে চালু হওয়া একটা জীবন্ত instance। একই image থেকে অনেক container চালানো যায়।</p>
<div class="callout why"><span class="tag">Class vs Object</span>
সহজ উপমা: image হলো <b>class</b>, container হলো তার <b>object</b>। Image একবার build হয়, তারপর সেটা থেকে যতবার খুশি container চালান — প্রতিটা container image-এর ওপর নিজের একটা পাতলা writable layer পায়।</div>

<h3>Layers — image কীভাবে গড়ে ওঠে</h3>
<p>একটা image অনেকগুলো <span class="kw">layer</span>-এর স্তূপ। Dockerfile-এর প্রায় প্রতিটা instruction (<code>FROM</code>, <code>RUN</code>, <code>COPY</code>…) একটা করে read-only layer তৈরি করে। Layer গুলো <b>cache</b> হয় ও image-এর মধ্যে <b>share</b> হয় — তাই একই base layer বারবার download/store হয় না।</p>

<h3>Union File System (OverlayFS)</h3>
<p>Docker <span class="kw">OverlayFS</span> দিয়ে সব read-only layer-কে একসাথে স্তূপ করে একটাই filesystem হিসেবে দেখায়, আর সবার ওপরে container-এর একটা পাতলা <b>writable layer</b> বসায়। Container যা লেখে সব ওই top layer-এ যায় — নিচের image layer অপরিবর্তিত থাকে (<span class="kw">copy-on-write</span>)।</p>
<figure class="viz">
<svg viewBox="0 0 520 320" role="img" aria-label="OverlayFS: read-only image layers stacked at the bottom with a thin writable container layer on top; writes use copy-on-write">
  <g text-anchor="middle" font-size="12.5" fill="#e6edf3">

    <rect x="110" y="92" width="300" height="40" rx="8" fill="rgba(74,163,255,.14)" stroke="#4aa3ff"/><text x="260" y="117">Layer: COPY . (app files)</text>

  </g>
  <text x="470" y="118" fill="#9aa7b4" font-size="11" transform="rotate(90 470 118)" text-anchor="middle" class="bn">read-only image layers</text>
  <line x1="440" y1="92" x2="440" y2="270" stroke="#4aa3ff" stroke-width="1.5"/>
  <text x="260" y="296" text-anchor="middle" fill="#9aa7b4" font-size="11" class="bn">container যা লেখে → শুধু উপরের writable layer-এ (copy-on-write)</text>
</svg>
<figcaption>নিচে অপরিবর্তনীয় image layer-এর স্তূপ, ওপরে container-এর writable layer। এজন্য একই image থেকে ১০টা container চালালেও image একবারই disk-এ থাকে — প্রতিটা container শুধু নিজের ছোট writable layer পায়।</figcaption>
</figure>

<h3>Base Images</h3>
<p>প্রতিটা Dockerfile <code>FROM</code> দিয়ে একটা <span class="kw">base image</span>-এর ওপর দাঁড়ায়। কয়েক ধরন:</p>
<table>
<tr><th>Base</th><th>বৈশিষ্ট্য</th></tr>
<tr><td><code>scratch</code></td><td>একদম খালি — কিছুই নেই (static binary-র জন্য)</td></tr>
<tr><td><code>alpine</code></td><td>~5MB, খুব ছোট (musl libc)</td></tr>
<tr><td><code>debian</code>/<code>ubuntu</code></td><td>পূর্ণ, বড়, সব tool আছে</td></tr>
<tr><td><code>mcr.microsoft.com/dotnet/aspnet</code></td><td>ASP.NET Core runtime (.NET app চালানোর জন্য)</td></tr>
<tr><td><code>mcr.microsoft.com/dotnet/sdk</code></td><td>.NET SDK (build করার জন্য — বড়)</td></tr>
</table>

<h4>Distroless Images</h4>
<p><span class="kw">Distroless</span> image-এ শুধু আপনার app আর তার runtime থাকে — কোনো shell, package manager, বা বাড়তি OS tool নেই। ফলে image ছোট আর <b>attack surface কম</b> (হ্যাকার shell পায় না)। .NET-এ <code>mcr.microsoft.com/dotnet/aspnet:8.0-noble-chiseled</code> এই ধরনের (chiseled = distroless-সদৃশ)।</p>
<div class="callout best"><span class="tag">Best practice</span>
Build-এ SDK image, চালাতে ছোট runtime image (<code>aspnet</code>) বা chiseled/distroless। কখনো production container-এ পুরো SDK পাঠাবেন না — বড়, ধীর, বেশি vulnerability।</div>

<h3>Image Tagging ও Versioning</h3>
<p>Image-এর নাম: <code>repository:tag</code> (যেমন <code>myapi:1.4.2</code>)। tag না দিলে default <code>latest</code>।</p>
<div class="callout mistake"><span class="tag">Common mistake</span>
Production-এ <code>:latest</code> ব্যবহার — "latest" আসলে একটা mutable label, আজ যেটা কাল সেটা নাও হতে পারে → কোন version চলছে বোঝা যায় না, rollback কঠিন। Production-এ <b>immutable version tag</b> (<code>myapi:1.4.2</code>) বা এমনকি digest pin (<code>myapi@sha256:...</code>) ব্যবহার করুন।</div>
</template>

<template data-page="dockerfile">
<h2 class="title">৩. Dockerfile · Build · Multi-Stage</h2>
<p class="lead">Dockerfile হলো image বানানোর রেসিপি। এখানে build কীভাবে কাজ করে, cache কীভাবে বাঁচে, আর multi-stage দিয়ে ছোট production image।</p>

<h3>Dockerfile — একটা সাধারণ .NET উদাহরণ</h3>
<pre>FROM mcr.microsoft.com/dotnet/aspnet:8.0
WORKDIR /app
COPY bin/Release/net8.0/publish/ .
EXPOSE 8080
ENTRYPOINT ["dotnet", "MyApi.dll"]</pre>
<p>প্রতিটা লাইন একটা instruction, আর (বেশিরভাগ) একটা layer তৈরি করে।</p>

<h3>Image Build Process ও Build Context</h3>
<p><code>docker build -t myapi:1.0 .</code> চালালে যা ঘটে:</p>
<ol>
<li>শেষের <code>.</code> = <span class="kw">build context</span> — ঐ directory-র সব ফাইল daemon-এ পাঠানো হয়।</li>
<li>Daemon Dockerfile-এর instruction একে একে চালায়, প্রতিটার জন্য একটা layer বানায়।</li>
<li>ফলাফল = একটা image, tag <code>myapi:1.0</code>।</li>
</ol>
<div class="callout mistake"><span class="tag">Common mistake — বিশাল build context</span>
Context-এ <code>bin/</code>, <code>obj/</code>, <code>.git/</code>, <code>node_modules/</code> থাকলে সেগুলোও daemon-এ যায় → build ধীর, image নোংরা। এজন্যই <code>.dockerignore</code>।</div>

<h3>.dockerignore</h3>
<p><code>.gitignore</code>-এর মতো — build context থেকে অপ্রয়োজনীয় ফাইল বাদ দেয়:</p>
<pre><span class="c"># .dockerignore</span>
bin/
obj/
.git/
.vs/
**/node_modules
Dockerfile
docker-compose*.yml
*.md</pre>

<h3>Build Cache — দ্রুত rebuild-এর চাবি</h3>
<p>Docker প্রতিটা layer cache করে। কোনো instruction ও তার input অপরিবর্তিত থাকলে Docker সেই layer আবার না চালিয়ে cache থেকে নেয়। কিন্তু একটা layer বদলালে তার <b>পরের সব layer</b> আবার চালাতে হয়।</p>
<div class="callout best"><span class="tag">Dependency caching (.NET-এর জন্য গুরুত্বপূর্ণ)</span>
আগে <code>.csproj</code> copy করে <code>dotnet restore</code>, <b>তারপর</b> বাকি source copy করুন। তাহলে শুধু code বদলালে (csproj নয়) restore layer cache থেকে আসে — build অনেক দ্রুত। উল্টো করলে প্রতিবার code বদলেই পুরো restore আবার হয়।</div>

<h3>Multi-Stage Builds — ছোট, নিরাপদ image</h3>
<p>এক Dockerfile-এ একাধিক <code>FROM</code> (stage)। এক stage-এ ভারী SDK দিয়ে build করুন, তারপর শুধু build artifact ছোট runtime stage-এ copy করুন — final image-এ SDK/source থাকে না।</p>
<pre><span class="c"># ---- ১) build stage (ভারী SDK) ----</span>
FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY *.csproj ./
RUN dotnet restore                          <span class="c"># cache-friendly</span>
COPY . .
RUN dotnet publish -c Release -o /app/publish

<span class="c"># ---- ২) runtime stage (ছোট) ----</span>
FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS final
WORKDIR /app
COPY --from=build /app/publish .            <span class="c"># শুধু artifact আনি</span>
EXPOSE 8080
USER app                                    <span class="c"># non-root (aspnet 8 এ built-in)</span>
ENTRYPOINT ["dotnet", "MyApi.dll"]</pre>
<div class="callout best"><span class="tag">ফলাফল</span>
Final image-এ শুধু runtime + published DLL — SDK, source, restore cache কিছুই নেই। ফলে image ~200MB (SDK image হলে ~800MB+), দ্রুত pull, কম vulnerability।</div>

<h3>BuildKit ও cache mount — আরও দ্রুত build</h3>
<p>আধুনিক Docker-এ <span class="kw">BuildKit</span> default build engine (parallel, উন্নত cache)। এর <b>cache mount</b> দিয়ে NuGet package cache build-এর বাইরে ধরে রাখা যায় — layer invalidate হলেও package আবার download করতে হয় না:</p>
<pre># syntax=docker/dockerfile:1
FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY *.csproj ./
RUN --mount=type=cache,target=/root/.nuget/packages \
    dotnet restore
COPY . .
RUN --mount=type=cache,target=/root/.nuget/packages \
    dotnet publish -c Release -o /app/publish</pre>
<p>CI-তে এটা বড় সাশ্রয় (প্রতি build-এ NuGet পুরো টানতে হয় না)। build-time secret-ও নিরাপদে দেওয়া যায়: <code>--mount=type=secret</code> (secret image layer-এ থাকে না)।</p>

<h3>Multi-arch build — Apple Silicon → x86 server</h3>
<p>Mac (ARM64/Apple Silicon)-এ build করা image সরাসরি x86 (amd64) Linux server-এ না-ও চলতে পারে। <code>docker buildx</code> দিয়ে একাধিক architecture-এর image একসাথে বানান:</p>
<pre>docker buildx build --platform linux/amd64,linux/arm64 \
  -t rasel/myapi:1.0 --push .</pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
Apple Silicon-এ সাধারণ <code>docker build</code> করে সেই ARM image production x86 server-এ push করা → server-এ <b>"exec format error"</b>। হয় <code>--platform linux/amd64</code> দিয়ে build করুন, নয় buildx দিয়ে multi-arch push করুন।</div>
</template>

<template data-page="instructions">
<h2 class="title">৪. Dockerfile Instructions</h2>
<p class="lead">প্রতিটা Dockerfile instruction কী করে — বিশেষ করে যেগুলো নিয়ে সবচেয়ে বেশি ভুল হয় (CMD vs ENTRYPOINT, COPY vs ADD, ENV vs ARG)।</p>

<h3>পূর্ণ তালিকা</h3>
<table>
<tr><th>Instruction</th><th>কাজ</th></tr>
<tr><td><code>FROM</code></td><td>base image ঠিক করে (প্রতি stage-এর শুরু)</td></tr>
<tr><td><code>RUN</code></td><td>build-এর সময় একটা command চালায় (নতুন layer)</td></tr>
<tr><td><code>CMD</code></td><td>container চালু হলে default command (override করা যায়)</td></tr>
<tr><td><code>ENTRYPOINT</code></td><td>container-এর মূল executable (সহজে override হয় না)</td></tr>
<tr><td><code>COPY</code></td><td>host থেকে ফাইল image-এ copy</td></tr>
<tr><td><code>ADD</code></td><td>COPY + URL download + auto-extract tar</td></tr>
<tr><td><code>WORKDIR</code></td><td>পরের instruction-এর working directory</td></tr>
<tr><td><code>ENV</code></td><td>environment variable (build ও runtime দুটোতেই)</td></tr>
<tr><td><code>ARG</code></td><td>build-time variable (শুধু build-এ)</td></tr>
<tr><td><code>EXPOSE</code></td><td>container কোন port-এ শোনে (documentation; auto-publish নয়)</td></tr>
<tr><td><code>USER</code></td><td>পরের command ও container কোন user-এ চলবে</td></tr>
<tr><td><code>HEALTHCHECK</code></td><td>container সুস্থ কি না যাচাইয়ের command</td></tr>
<tr><td><code>LABEL</code></td><td>image-এ metadata (maintainer, version…)</td></tr>
<tr><td><code>VOLUME</code></td><td>একটা mount point ঘোষণা (persistent data)</td></tr>
</table>

<h3>CMD বনাম ENTRYPOINT — সবচেয়ে বিভ্রান্তিকর</h3>
<table>
<tr><th></th><th>ENTRYPOINT</th><th>CMD</th></tr>
<tr><td>ভূমিকা</td><td>container "কী executable" — স্থির</td><td>default argument/command — override সহজ</td></tr>
<tr><td>Override</td><td><code>--entrypoint</code> দিয়ে (কঠিন)</td><td><code>docker run img &lt;নতুন cmd&gt;</code> দিলেই</td></tr>
</table>
<p>দুটো একসাথে ব্যবহার করলে ENTRYPOINT = executable, CMD = default argument:</p>
<pre>ENTRYPOINT ["dotnet", "MyApi.dll"]
CMD ["--environment=Production"]     <span class="c"># override করা যায়</span></pre>
<div class="callout behind"><span class="tag">exec form vs shell form</span>
<code>["dotnet","MyApi.dll"]</code> = <b>exec form</b> (সুপারিশ) — সরাসরি process চালায়, signal (SIGTERM) ঠিকমতো পৌঁছায় → graceful shutdown কাজ করে। <code>dotnet MyApi.dll</code> = <b>shell form</b> — <code>/bin/sh -c</code>-এর ভেতরে চলে, signal app পর্যন্ত না-ও পৌঁছাতে পারে।</div>

<h3>COPY বনাম ADD</h3>
<div class="callout why"><span class="tag">নিয়ম</span>
প্রায় সবসময় <b>COPY</b> ব্যবহার করুন — এটা সরল ও predictable। <b>ADD</b> বাড়তি করে: remote URL download আর local tar auto-extract — এই দুটো সত্যিই দরকার হলে (কমই) তবেই ADD। ADD-এর জাদুকরী আচরণ প্রায়ই surprise তৈরি করে।</div>

<h3>ENV বনাম ARG</h3>
<pre>ARG BUILD_VERSION=1.0        <span class="c"># শুধু build এর সময়, image এ থাকে না</span>
ENV ASPNETCORE_URLS=http://+:8080   <span class="c"># runtime এও থাকে, container এ পাওয়া যায়</span></pre>
<p><code>ARG</code> build-time (<code>docker build --build-arg</code>); <code>ENV</code> runtime-এও বজায় থাকে (app পড়তে পারে)।</p>

<h3>HEALTHCHECK, USER, LABEL</h3>
<pre>LABEL maintainer="rasel@example.com" version="1.4.2"
USER app                                        <span class="c"># non-root</span>
HEALTHCHECK --interval=30s --timeout=3s --retries=3 \
  CMD curl -f http://localhost:8080/health || exit 1</pre>
<p><code>HEALTHCHECK</code> থাকলে <code>docker ps</code>-এ container "healthy/unhealthy" দেখায়, আর Compose/orchestrator তার ওপর সিদ্ধান্ত নিতে পারে (<code>depends_on</code> condition)।</p>
</template>

<template data-page="containers">
<h2 class="title">৫. Containers · Lifecycle · Logs</h2>
<p class="lead">Container চালানো, দেখা, ভেতরে ঢোকা, resource বেঁধে দেওয়া, আর crash হলে কী করবে — দৈনন্দিন Docker।</p>

<h3>Container Lifecycle</h3>
<div class="diagram"><pre>
docker create ─► [Created] ─ docker start ─► [Running] ─ docker stop ─► [Stopped/Exited]
                                 │  ▲                                        │
                     docker pause│  │docker unpause              docker start│ (আবার)
                                 ▼  │                                        ▼
                              [Paused]                              docker rm ─► [মুছে গেল]
</pre></div>
<p><code>docker run</code> = <code>create</code> + <code>start</code> একসাথে।</p>

<h3>Run modes — Interactive, Detached</h3>
<table>
<tr><th>Flag</th><th>মানে</th></tr>
<tr><td><code>-it</code></td><td><span class="kw">Interactive</span> + TTY — shell-এ ঢুকে কাজ (<code>docker run -it ubuntu bash</code>)</td></tr>
<tr><td><code>-d</code></td><td><span class="kw">Detached</span> — background-এ চলে (server/service)</td></tr>
<tr><td><code>--rm</code></td><td>থামলেই container auto-remove (একবারের কাজ)</td></tr>
<tr><td><code>-p 8080:8080</code></td><td>port publish (Networking ট্যাব)</td></tr>
<tr><td><code>--name api</code></td><td>container-এর নাম দেওয়া</td></tr>
</table>

<h3>Exec বনাম Attach</h3>
<div class="callout why"><span class="tag">পার্থক্য</span>
<code>docker exec -it api bash</code> — চলন্ত container-এ <b>নতুন একটা process</b> (shell) চালায় — debug করতে এটাই। <code>docker attach api</code> — container-এর <b>মূল process</b>-এর stdin/stdout-এ যুক্ত হয় (এখানে Ctrl-C দিলে main process মরে যেতে পারে — সাবধান)। debug-এ প্রায় সবসময় <code>exec</code>।</div>

<h3>দেখা ও পর্যবেক্ষণ — Logs, Inspect, Stats, Events</h3>
<pre>docker logs -f api            <span class="c"># container এর stdout/stderr (live)</span>
docker inspect api            <span class="c"># সব বিস্তারিত JSON (IP, mount, env, state)</span>
docker stats                  <span class="c"># live CPU/memory/network প্রতি container</span>
docker events                 <span class="c"># daemon এর real-time event stream</span>
docker top api                <span class="c"># container এর ভেতরের process</span></pre>

<h3>Restart Policies</h3>
<table>
<tr><th>Policy</th><th>আচরণ</th></tr>
<tr><td><code>no</code> (default)</td><td>কখনো auto-restart নয়</td></tr>
<tr><td><code>on-failure[:n]</code></td><td>non-zero exit-এ restart (সর্বোচ্চ n বার)</td></tr>
<tr><td><code>always</code></td><td>সবসময় restart (daemon restart-এও)</td></tr>
<tr><td><code>unless-stopped</code></td><td>always, তবে আপনি নিজে stop করলে নয়</td></tr>
</table>
<pre>docker run -d --restart unless-stopped --name api myapi:1.0</pre>

<h3>Resource Limits (CPU &amp; Memory)</h3>
<pre>docker run -d --memory="512m" --cpus="1.5" --name api myapi:1.0</pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
Limit ছাড়া container চালানো — একটা memory leak বা runaway process পুরো host-এর RAM/CPU খেয়ে ফেলে, অন্য container-ও মরে। Production-এ সবসময় <code>--memory</code> ও <code>--cpus</code> (বা Compose-এ limit) দিন।</div>

<h3>Logging Drivers</h3>
<p>Container-এর log কোথায় যাবে তা <span class="kw">logging driver</span> ঠিক করে: <code>json-file</code> (default), <code>local</code>, <code>journald</code>, <code>syslog</code>, <code>fluentd</code>, ক্লাউড driver ইত্যাদি। Production-এ central logging (ELK/Loki)-তে পাঠাতে fluentd/syslog driver বা sidecar ব্যবহার হয়।</p>
<div class="callout best"><span class="tag">Log rotation</span>
Default <code>json-file</code> driver disk ভরিয়ে ফেলতে পারে। <code>--log-opt max-size=10m --log-opt max-file=3</code> দিয়ে rotation সেট করুন (বা daemon.json-এ globally)।</div>

<h3>PID 1, signal ও graceful shutdown</h3>
<p>Container-এর ভেতরে আপনার process চলে <b>PID 1</b> হিসেবে — যার দায়িত্ব signal handle করা ও child-এর zombie reap করা। <code>docker stop</code> প্রথমে <b>SIGTERM</b> পাঠায় (graceful), তারপর grace period (default ~১০s) পেরোলে <b>SIGKILL</b> (জোর করে)।</p>
<ul>
<li><b>exec form ব্যবহার করুন</b> (<code>ENTRYPOINT ["dotnet","App.dll"]</code>) — তাহলে SIGTERM সরাসরি app পায় → graceful shutdown। shell form-এ signal <code>sh</code>-এ আটকে যায়।</li>
<li>App যদি child spawn করে বা signal handle না করে, <code>docker run --init</code> দিন — ছোট একটা init (tini) PID 1 হয়ে signal forward ও zombie reap করে।</li>
</ul>
<div class="callout mistake"><span class="tag">Common mistake</span>
<code>docker stop</code>-এ container ~১০s ঝুলে থেকে জোর করে kill হচ্ছে — মানে app SIGTERM ধরছে না (প্রায়ই shell-form ENTRYPOINT বা signal-অসচেতন app)। ফলে in-flight request কাটা পড়ে। exec form + app-এ SIGTERM handling দিয়ে ঠিক করুন; দরকারে grace বাড়ান (<code>docker stop -t 30</code> / Compose <code>stop_grace_period: 30s</code>)।</div>
</template>

<template data-page="storage">
<h2 class="title">৬. Volumes · Bind Mounts · tmpfs</h2>
<p class="lead">Container-এর filesystem ephemeral — remove করলেই data উধাও। স্থায়ী data রাখতে mount ব্যবহার করতে হয়।</p>

<h3>কেন দরকার</h3>
<p>Container মুছে ফেললে তার writable layer-ও মুছে যায় — মানে ভেতরে লেখা সব data হারায়। Database, upload করা ফাইল, log — এসব container-এর বাইরে persist করতে হয়। তিন ধরনের mount:</p>

<h3>তিন ধরনের mount</h3>
<table>
<tr><th></th><th>Named Volume</th><th>Bind Mount</th><th>tmpfs</th></tr>
<tr><td>কোথায়</td><td>Docker-পরিচালিত এলাকা (<code>/var/lib/docker/volumes</code>)</td><td>host-এর নির্দিষ্ট path</td><td>host-এর RAM (disk নয়)</td></tr>
<tr><td>ব্যবহার</td><td>Production data (DB) — সুপারিশ</td><td>Dev-এ source code, config</td><td>ক্ষণস্থায়ী/sensitive data</td></tr>
<tr><td>Persist?</td><td>হ্যাঁ</td><td>হ্যাঁ (host-এ)</td><td>না (container মরলে শেষ)</td></tr>
<tr><td>পোর্টেবল?</td><td>বেশি (Docker manage করে)</td><td>কম (host path-নির্ভর)</td><td>—</td></tr>
</table>
<pre><span class="c"># Named volume — Docker manage করে (production DB)</span>
docker volume create pgdata
docker run -d -v pgdata:/var/lib/postgresql/data postgres:16

<span class="c"># Bind mount — host path (dev এ live code)</span>
docker run -d -v /home/rasel/app:/app myapi:1.0

<span class="c"># tmpfs — RAM এ, disk এ কিছু লেখে না</span>
docker run -d --tmpfs /tmp:size=64m myapi:1.0</pre>
<div class="callout best"><span class="tag">Named volume বনাম bind mount</span>
Production-এ database/persistent data-র জন্য <b>named volume</b> (Docker manage করে, পোর্টেবল, backup সহজ)। Development-এ code live reload-এর জন্য <b>bind mount</b> (host-এর ফাইল সরাসরি container-এ)।</div>

<h3><code>-v</code> বনাম <code>--mount</code> — দুই syntax</h3>
<p>ভলিউম/bind mount attach করার দুইটা flag আছে — একই কাজ, ভিন্ন verbosity:</p>
<table>
<tr><th></th><th><code>-v</code> / <code>--volume</code></th><th><code>--mount</code></th></tr>
<tr><td>Syntax</td><td>সংক্ষিপ্ত, colon-separated: <code>src:dst:opts</code></td><td>verbose, key=value: <code>type=volume,source=src,target=dst</code></td></tr>
<tr><td>পড়া সহজ?</td><td>ছোট command-এ ঠিক আছে</td><td>স্পষ্ট, Compose-এর মতো — production script-এ ভালো</td></tr>
<tr><td>Non-existent path</td><td>bind mount-এ path না থাকলে <b>auto-create</b> করে ফেলে (ভুল হলে বোঝা কঠিন)</td><td>একই আচরণ, তবে <code>type=bind</code> explicit বলে ভুল কম হয়</td></tr>
</table>
<pre><span class="c"># দুটোই একই কাজ করে:</span>
docker run -d -v pgdata:/var/lib/postgresql/data postgres:16
docker run -d --mount type=volume,source=pgdata,target=/var/lib/postgresql/data postgres:16

<span class="c"># bind mount, --mount দিয়ে:</span>
docker run -d --mount type=bind,source=/home/rasel/app,target=/app myapi:1.0</pre>

<h3>Named বনাম Anonymous Volume</h3>
<p>শুধু container path দিলে (নাম ছাড়া) Docker একটা <b>anonymous volume</b> বানায় — একটা এলোমেলো hash নাম পায়, কোনো কিছুর সাথে সহজে যুক্ত করা যায় না, আর সাধারণত container মুছলে হারিয়ে যায়/orphan হয়ে থাকে। এজন্য প্রায় সবসময় নাম দিয়ে <b>named volume</b> ব্যবহার করুন।</p>
<pre><span class="c"># Anonymous volume — নাম নেই, ট্র্যাক করা কঠিন (এড়িয়ে চলুন)</span>
docker run -d -v /var/lib/postgresql/data postgres:16

<span class="c"># Named volume — স্পষ্ট নাম, পরে সহজে খুঁজে/backup করা যায়</span>
docker run -d -v pgdata:/var/lib/postgresql/data postgres:16</pre>
<div class="callout why"><span class="tag">Dockerfile-এর <code>VOLUME</code> instruction সাবধানে</span>
Dockerfile-এ <code>VOLUME /data</code> লিখলে সেই path থেকে <b>প্রতিটা container run-এ</b> একটা anonymous volume auto-তৈরি হয় — এমনকি আপনি নিজে <code>-v</code> না দিলেও। এতে অনেক না-দরকারি anonymous volume জমে যায় (<code>docker volume ls</code>-এ dangling দেখবেন)। তাই base image-এ <code>VOLUME</code> থাকলে খেয়াল রাখুন, আর নিজে সবসময় explicit named volume/bind mount দিন।</div>

<h3>Read-only Mount</h3>
<p>Container-কে data পড়তে দিতে চান কিন্তু বদলাতে দিতে চান না — <code>:ro</code> suffix দিন:</p>
<pre>docker run -d -v /host/config:/app/config:ro myapi:1.0   <span class="c"># container শুধু পড়তে পারবে, লিখতে পারবে না</span></pre>

<h3>Volume Sharing — একাধিক container একই ডেটা</h3>
<p>একই named volume একাধিক container-এ mount করলে সবাই একই ডেটা দেখে — যেমন log-writer + log-shipper আলাদা container একই log volume ব্যবহার করা:</p>
<pre>docker run -d --name writer -v sharedlogs:/var/log/app myapi:1.0
docker run -d --name shipper -v sharedlogs:/var/log/app:ro fluent/fluent-bit</pre>

<h3>Volume Management Commands</h3>
<pre>docker volume create pgdata        <span class="c"># তৈরি করুন</span>
docker volume ls                   <span class="c"># সব volume তালিকা</span>
docker volume inspect pgdata       <span class="c"># mountpoint, driver, label — JSON</span>
docker volume rm pgdata            <span class="c"># মুছুন (ব্যবহারে থাকলে error দেবে)</span>
docker volume prune                <span class="c"># কোনো container ব্যবহার করছে না এমন সব volume মুছুন</span></pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
<code>docker compose down</code> (volume flag ছাড়া) দিলে volume থেকে যায় — এটাই safe default। কিন্তু <code>docker compose down -v</code> দিলে সব named volume-ও মুছে যায় — production-এ ভুলে এটা চালালে <b>পুরো ডেটাবেস হারাতে পারেন</b>। সবসময় দুবার ভাবুন, আর আগে backup নিন।</div>

<h3>Ownership ও Permission সমস্যা</h3>
<p>Bind mount-এ host আর container-এর user ID (UID) না মিললে <b>Permission denied</b> দেখা যায় — কারণ container-এর ভেতরের user সেই host file-এর owner নয়। সমাধান: container-এ host-এর মতো একই UID দিয়ে user বানানো, বা <code>--user</code> দিয়ে UID মিলিয়ে চালানো।</p>
<pre>docker run -d --user $(id -u):$(id -g) -v /home/rasel/app:/app myapi:1.0</pre>

<h3>Volume Drivers</h3>
<p>Default <code>local</code> driver host disk-এ ডেটা রাখে। বড় setup-এ plugin driver দিয়ে network storage-এও volume রাখা যায় — যেমন NFS, বা cloud driver দিয়ে EBS/Azure Disk। Volume driver বদলালেও app কোড অপরিবর্তিত থাকে — শুধু data আসলে কোথায় সংরক্ষিত হচ্ছে তা বদলায়।</p>

<h3>Container Backup &amp; Restore</h3>
<p>Volume backup করার সহজ কৌশল — একটা অস্থায়ী container দিয়ে volume-কে tar করা:</p>
<pre><span class="c"># backup: pgdata volume কে tar এ</span>
docker run --rm -v pgdata:/data -v $(pwd):/backup alpine \
  tar czf /backup/pgdata.tar.gz -C /data .

<span class="c"># restore: tar থেকে ফেরত</span>
docker run --rm -v pgdata:/data -v $(pwd):/backup alpine \
  tar xzf /backup/pgdata.tar.gz -C /data</pre>
</template>

<template data-page="network">
<h2 class="title">৭. Networking · DNS · Ports</h2>
<p class="lead">Container কীভাবে একে অপরের সাথে ও বাইরের জগতের সাথে কথা বলে — network driver, port mapping, আর নাম দিয়ে খুঁজে পাওয়া।</p>

<h3>Network Drivers</h3>
<table>
<tr><th>Driver</th><th>কাজ</th></tr>
<tr><td><span class="kw">bridge</span> (default)</td><td>একই host-এর container-দের জন্য private virtual network</td></tr>
<tr><td><span class="kw">host</span></td><td>container সরাসরি host-এর network ব্যবহার করে (isolation নেই, দ্রুত)</td></tr>
<tr><td><span class="kw">none</span></td><td>কোনো network নেই (সম্পূর্ণ isolated)</td></tr>
<tr><td><span class="kw">container:&lt;name&gt;</span></td><td>অন্য একটা container-এর network namespace <b>share</b> করে (নিজের IP/interface নেই)</td></tr>
<tr><td><span class="kw">overlay</span></td><td>একাধিক host জুড়ে container network (Swarm/multi-host) — concept</td></tr>
</table>

<h3>Bridge ও DNS / Service Discovery</h3>
<p>Default bridge-এ container শুধু IP দিয়ে কথা বলতে পারে। কিন্তু নিজের একটা <b>user-defined bridge network</b> বানালে Docker সেখানে built-in <span class="kw">DNS</span> দেয় — container একে অপরকে <b>নাম দিয়ে</b> খুঁজে পায়।</p>
<pre>docker network create appnet
docker run -d --name db  --network appnet postgres:16
docker run -d --name api --network appnet myapi:1.0
<span class="c"># api এখন connection string এ শুধু "db" লিখলেই DB পাবে (DNS resolve)</span>
<span class="c"># Host=db;Port=5432;...</span></pre>
<div class="callout why"><span class="tag">এজন্যই Compose সহজ</span>
Docker Compose প্রতিটা project-এর জন্য একটা user-defined network বানায়, তাই service-রা একে অপরকে service-নাম দিয়ে ডাকতে পারে (<code>db</code>, <code>redis</code>, <code>rabbitmq</code>) — কোনো IP মনে রাখতে হয় না।</div>

<h3>Default Bridge বনাম User-defined Bridge</h3>
<p>ইনস্টলের সাথেই একটা default network থাকে যার নাম <code>bridge</code> — কিন্তু এখানে <b>DNS কাজ করে না</b>, শুধু IP দিয়ে যোগাযোগ, আর <code>--link</code> (legacy, deprecated) ছাড়া নাম দিয়ে খোঁজা যায় না। এজন্যই সবসময় নিজের <b>user-defined bridge</b> বানানো উচিত।</p>
<table>
<tr><th></th><th>default <code>bridge</code></th><th>user-defined bridge (<code>docker network create</code>)</th></tr>
<tr><td>DNS (নাম দিয়ে খোঁজা)</td><td>❌ নেই</td><td>✅ built-in embedded DNS (<code>127.0.0.11</code>)</td></tr>
<tr><td>Isolation</td><td>একই host-এর সব container একসাথে দেখে</td><td>শুধু একই network-এর container একে অপরকে দেখে</td></tr>
<tr><td>Container সংযোগ বিচ্ছিন্ন/যুক্ত করা</td><td>কঠিন (restart লাগে)</td><td><code>docker network connect/disconnect</code> — চলন্ত container-এও</td></tr>
</table>
<div class="callout behind"><span class="tag">Embedded DNS কীভাবে কাজ করে</span>
প্রতিটা user-defined network-এ Docker একটা internal DNS server চালায় (container-এর ভেতর থেকে <code>127.0.0.11:53</code>-এ দেখা যায়)। Container যখন <code>db</code>-এর মতো নাম resolve করতে চায়, request প্রথমে এই embedded DNS-এ যায় — সেটা network-এর সব container-container name ↔ IP মিলিয়ে জবাব দেয়; না মিললে বাইরের DNS (host-এর resolver)-এ পাঠায়। তাই internal service-নাম আর external domain (যেমন <code>api.stripe.com</code>) দুটোই একই container থেকে resolve হয়।</div>

<h3>একটা Container একাধিক Network-এ</h3>
<p>একটা container একসাথে একাধিক network-এ যুক্ত থাকতে পারে — যেমন <code>api</code> একদিকে <code>appnet</code> (db/cache-এর সাথে) আর অন্যদিকে <code>edgenet</code> (reverse proxy-র সাথে) — এভাবে network segmentation করা যায় (DB network কখনো সরাসরি internet-facing proxy-র সাথে থাকে না)।</p>
<pre>docker network create appnet
docker network create edgenet
docker run -d --name api --network appnet myapi:1.0
docker network connect edgenet api        <span class="c"># চলন্ত container-কে দ্বিতীয় network-এ যুক্ত করা</span>
docker network disconnect appnet api      <span class="c"># বিচ্ছিন্ন করা</span></pre>

<h3>Custom Subnet ও Gateway</h3>
<p>Default-এ Docker নিজে থেকে subnet বেছে নেয়; নির্দিষ্ট IP range দরকার হলে (যেমন অন্য network-এর সাথে সংঘর্ষ এড়াতে) নিজে দিতে পারেন:</p>
<pre>docker network create --driver bridge \
  --subnet 172.28.0.0/16 --gateway 172.28.0.1 appnet

docker run -d --name db --network appnet --ip 172.28.0.10 postgres:16   <span class="c"># static IP (কমই লাগে)</span></pre>

<h3>Network Management Commands</h3>
<pre>docker network ls                  <span class="c"># সব network তালিকা</span>
docker network inspect appnet      <span class="c"># subnet, gateway, যুক্ত container, IP — JSON</span>
docker network rm appnet           <span class="c"># মুছুন (কোনো container যুক্ত থাকলে আগে disconnect)</span>
docker network prune               <span class="c"># কোনো container ব্যবহার করছে না এমন সব network মুছুন</span></pre>

<h3>Network Aliases — একই container-কে একাধিক নামে চেনা</h3>
<p>একটা container-এর মূল নাম ছাড়াও network-এ বাড়তি DNS নাম (<span class="kw">alias</span>) দেওয়া যায় — একই container একাধিক নামে resolve হবে। Blue-green deployment বা একটা shared cache-এর জন্য একাধিক নাম রাখতে কাজে লাগে।</p>
<pre>docker run -d --name api-v2 --network appnet --network-alias api myapi:2.0
<span class="c"># অন্য container থেকে "api-v2" বা "api" দুটো নাম দিয়েই এটাকে পাওয়া যাবে</span>

docker network connect --alias cache-primary appnet redis-main   <span class="c"># চলমান container-এ alias যোগ</span></pre>
<p>Compose-এ একইভাবে <code>networks.&lt;network&gt;.aliases</code> দিয়ে:</p>
<pre>services:
  db:
    image: postgres:16
    networks:
      appnet:
        aliases: [primary-db]</pre>

<h3>Container Network Mode — namespace share (debug sidecar)</h3>
<p><code>--network container:&lt;name&gt;</code> দিলে নতুন container তার <b>নিজের network namespace বানায় না</b> — বরং target container-এর network namespace-ই ধার করে (একই IP, একই port, <code>localhost</code> দিয়ে একে অপরকে দেখে)। এটাই সেই কৌশল যা দিয়ে distroless/chiseled container-এ shell না থাকলেও পাশে একটা <b>debug sidecar</b> চালিয়ে সমস্যা দেখা যায় (Troubleshooting ট্যাব দেখুন)।</p>
<pre><span class="c"># myapi container এ shell নেই (distroless) — পাশে debug container একই network namespace এ চালান</span>
docker run -it --rm --network container:myapi nicolaka/netshoot sh
<span class="c"># এখন curl/ping/netstat দিয়ে myapi এর মতো একই localhost/port এ debug করা যায়</span></pre>
<div class="callout why"><span class="tag">Kubernetes-এর সাথে মিল</span>
এই একই ধারণা Kubernetes-এ Pod-এর সব container একসাথে ব্যবহার করে (একই Pod-এর container-রা <code>localhost</code>-এ একে অপরকে দেখে) — সেখানে এটাই default আচরণ, Docker-এ এটা <code>--network container:</code> দিয়ে explicit করে নিতে হয়।</div>

<h3>Port Publishing আসলে কীভাবে কাজ করে</h3>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — NAT / <code>docker-proxy</code></span>
<code>-p 8080:8080</code> দিলে Docker host-এর <code>iptables</code>-এ একটা <b>DNAT (destination NAT)</b> rule বসায়, যা host-এর 8080-এ আসা traffic container-এর IP:8080-এ ফরওয়ার্ড করে। কিছু ক্ষেত্রে (বা platform-এ) এর পাশাপাশি একটা ছোট <code>docker-proxy</code> userspace process-ও একই কাজ হ্যান্ডেল করে। এজন্যই port publish করতে root/iptables permission লাগে, আর Linux firewall (<code>ufw</code>/<code>firewalld</code>) সরাসরি বসালে মাঝেমধ্যে Docker-এর নিজের iptables rule-এর সাথে conflict করে — port খোলা থাকলেও বাইরে থেকে access না পাওয়ার একটা সাধারণ কারণ এটা।</div>

<h3>Port Mapping</h3>
<p>Container-এর port host-এ প্রকাশ করতে <code>-p host:container</code>:</p>
<pre>docker run -d -p 8080:8080 myapi:1.0    <span class="c"># host:8080 → container:8080</span>
docker run -d -p 5432:5432 postgres:16  <span class="c"># বাইরে থেকে DB access</span>
docker run -d -p 127.0.0.1:5432:5432 postgres:16   <span class="c"># শুধু localhost-এ bind (নিরাপদ)</span>
docker run -d -p 8000-8010:8000-8010 myapi:1.0      <span class="c"># port range</span>
docker run -d -p 9999:9999/udp myapi:1.0            <span class="c"># UDP port (default TCP)</span>
docker run -d -P myapi:1.0              <span class="c"># EXPOSE করা সব port host-এ random port-এ auto-publish</span></pre>
<div class="callout mistake"><span class="tag">EXPOSE ≠ publish</span>
Dockerfile-এর <code>EXPOSE</code> শুধু documentation — এটা নিজে থেকে port খুলে দেয় না। বাইরে থেকে access পেতে <code>docker run -p</code> (বা Compose-এ <code>ports:</code>) লাগবেই।</div>

<h3><code>host</code> ও <code>none</code> network — কখন ব্যবহার</h3>
<div class="grid2">
<div class="box"><b><code>--network host</code></b><br>
container সরাসরি host-এর network stack ব্যবহার করে — কোনো port mapping লাগে না, app যে port-এ শোনে সেটাই host-এ খোলে। সুবিধা: সর্বোচ্চ performance (NAT overhead নেই)। অসুবিধা: isolation নেই, port conflict host-এর অন্য process-এর সাথে হতে পারে। Linux-এ কাজ করে; Docker Desktop (Mac/Windows)-এ সীমিত সাপোর্ট।</div>
<div class="box"><b><code>--network none</code></b><br>
কোনো network interface-ই নেই (শুধু loopback)। সম্পূর্ণ network-isolated batch job/security-sensitive processing-এ ব্যবহার হয়, যেখানে container-এর বাইরে কোনো communication দরকার নেই।</div>
</div>
<pre>docker run -d --network host myapi:1.0     <span class="c"># host এর port সরাসরি ব্যবহার</span>
docker run --rm --network none alpine ping 8.8.8.8   <span class="c"># fail করবে — কোনো network নেই</span></pre>

<h3>extra_hosts / <code>--add-host</code></h3>
<p>Container-এর ভেতর থেকে host machine-কে বা কোনো কাস্টম নামকে নির্দিষ্ট IP-তে resolve করাতে চাইলে:</p>
<pre>docker run -d --add-host=host.docker.internal:host-gateway myapi:1.0
<span class="c"># Linux-এ container থেকে host machine-এ পৌঁছানোর সহজ উপায় (Mac/Windows-এ এটা built-in)</span></pre>

<h3>Overlay ও Macvlan — বহু-host নেটওয়ার্ক (concept)</h3>
<table>
<tr><th>Driver</th><th>কোথায় ব্যবহার</th></tr>
<tr><td><span class="kw">overlay</span></td><td>একাধিক Docker host জুড়ে (Swarm/cluster) — একই virtual network-এ container, host ভিন্ন হলেও</td></tr>
<tr><td><span class="kw">macvlan</span></td><td>container-কে সরাসরি একটা physical MAC/IP দেওয়া — legacy app যেটা network-এ সরাসরি device হিসেবে দৃশ্যমান হতে হবে</td></tr>
</table>
<p>Single-host dev/small production-এ এগুলো সাধারণত লাগে না — <b>bridge</b> দিয়েই কাজ চলে। Kubernetes/Swarm-এর মতো multi-host orchestration-এ overlay গুরুত্বপূর্ণ হয়ে ওঠে।</p>

<h3>Network Troubleshooting</h3>
<pre>docker network inspect appnet | grep -A3 Containers   <span class="c"># কোন container, কোন IP</span>
docker exec -it api ping db                            <span class="c"># DNS + reachability টেস্ট</span>
docker exec -it api sh -c "cat /etc/resolv.conf"        <span class="c"># container কোন DNS ব্যবহার করছে</span>
docker port api                                         <span class="c"># container এর কোন port host এ map হয়েছে</span></pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
দুই container ভিন্ন network-এ থাকা অবস্থায় নাম দিয়ে একে অপরকে খুঁজতে যাওয়া — DNS resolve fail করবে। <code>docker network inspect</code> দিয়ে নিশ্চিত করুন দুটোই একই user-defined network-এ আছে।</div>
</template>

<template data-page="security">
<h2 class="title">৮. Config · Secrets · Security</h2>
<p class="lead">Environment variable দিয়ে config, secret নিরাপদে দেওয়া, container-কে non-root/read-only করা, আর image ছোট ও নিরাপদ রাখা।</p>

<h3>Environment Variables</h3>
<pre>docker run -d -e ASPNETCORE_ENVIRONMENT=Production \
             -e ConnectionStrings__Db="Host=db;..." myapi:1.0
docker run -d --env-file ./app.env myapi:1.0     <span class="c"># ফাইল থেকে</span></pre>
<p>.NET-এ nested config-এ <code>__</code> (double underscore) = <code>:</code> — যেমন <code>ConnectionStrings__Db</code> → <code>ConnectionStrings:Db</code>।</p>

<h3>Secrets (Docker Secrets — concept)</h3>
<div class="callout mistake"><span class="tag">Common mistake</span>
Password/API key <code>ENV</code>-এ বা image-এ hardcode করা — <code>docker inspect</code> বা image history-তে যে কেউ দেখে ফেলে। Secret কখনো image-এ bake করবেন না।</div>
<p>নিরাপদ উপায়: <span class="kw">Docker secrets</span> (Swarm/Compose) — secret একটা ফাইল হিসেবে container-এ <code>/run/secrets/&lt;name&gt;</code>-এ mount হয়, environment বা image-এ থাকে না। বাইরের secret manager (Vault, AWS Secrets Manager, Azure Key Vault) আরও ভালো।</p>
<pre><span class="c"># compose.yaml (secret ফাইল হিসেবে mount)</span>
services:
  api:
    image: myapi:1.0
    secrets: [db_password]
secrets:
  db_password:
    file: ./db_password.txt</pre>
<div class="callout mistake"><span class="tag">রানটাইমেও env var secret কেন যথেষ্ট নিরাপদ নয়</span>
<code>docker run -e DB_PASSWORD=...</code> secret ইমেজে bake হয় না ঠিকই, কিন্তু তারপরও এটা <code>docker inspect</code>-এর আউটপুটে plaintext দেখা যায়, container-এর ভেতর থেকে <code>/proc/&lt;pid&gt;/environ</code>-এ readable থাকে, আর app crash/exception log-এ পুরো environment dump করলে সেখানেও চলে যেতে পারে। Secret <b>ফাইল</b> (<code>/run/secrets/...</code>) এসবের কোথাও দেখা যায় না ও file permission দিয়ে সীমিত করা যায় — এজন্যই env var নয়, file-based secret (বা secret manager) বেশি নিরাপদ ধরা হয়।</div>

<h3>Security Best Practices</h3>
<div class="callout best"><span class="tag">Checklist</span>
<ul style="margin:4px 0">
<li><b>Non-root:</b> <code>USER app</code> — root হিসেবে চালাবেন না (container escape ঝুঁকি কমে)।</li>
<li><b>Read-only filesystem:</b> <code>docker run --read-only --tmpfs /tmp</code> — app যেন নিজের FS বদলাতে না পারে।</li>
<li><b>Minimal base:</b> alpine/chiseled/distroless — কম tool = কম vulnerability।</li>
<li><b>Image scanning:</b> <code>docker scout cves myapi:1.0</code> বা Trivy দিয়ে vulnerability scan (concept)।</li>
<li>Secret env/image-এ নয়; capability drop; নির্দিষ্ট version tag (latest নয়)।</li>
</ul></div>

<h3>Image Optimization ও Size Reduction</h3>
<table>
<tr><th>কৌশল</th><th>প্রভাব</th></tr>
<tr><td>Multi-stage build</td><td>SDK/source বাদ → বিশাল হ্রাস</td></tr>
<tr><td>ছোট base (alpine/chiseled)</td><td>শত শত MB সাশ্রয়</td></tr>
<tr><td><code>.dockerignore</code></td><td>context ছোট, নোংরা ফাইল বাদ</td></tr>
<tr><td>RUN একত্রীকরণ (<code>&amp;&amp;</code>) + cache পরিষ্কার</td><td>কম layer, ছোট image</td></tr>
<tr><td>নির্দিষ্ট COPY (পুরো <code>.</code> নয়)</td><td>অপ্রয়োজনীয় ফাইল বাদ</td></tr>
</table>

<h3>আরও hardening — privilege ও port exposure</h3>
<pre>docker run -d \
  --user 1000:1000 \                    <span class="c"># non-root user</span>
  --read-only --tmpfs /tmp \            <span class="c"># read-only FS + লেখার জায়গা tmpfs</span>
  --cap-drop ALL \                      <span class="c"># সব Linux capability বাদ</span>
  --security-opt no-new-privileges \    <span class="c"># privilege escalation বন্ধ</span>
  --memory 512m --cpus 1.5 \
  myapi:1.0</pre>
<div class="callout behind"><span class="tag">Linux Capability আসলে কী</span>
প্রথাগতভাবে root user মানে "সব পারে" — কিন্তু Linux kernel root-এর ক্ষমতাকে ছোট ছোট <span class="kw">capability</span>-তে ভাগ করেছে (যেমন <code>NET_BIND_SERVICE</code> = 1024-এর নিচে port bind করা, <code>SYS_ADMIN</code> = mount/system config বদলানো, <code>CHOWN</code> = যেকোনো ফাইলের owner বদলানো)। Docker container ডিফল্টভাবে root user হলেও <b>সব</b> capability পায় না — একটা ছোট নিরাপদ default subset পায় (~১৪টা)। <code>--cap-drop ALL</code> দিয়ে সেই default subset-ও বাদ দিয়ে শূন্য থেকে শুরু করে, app-এর সত্যিই যা লাগে শুধু সেটুকু <code>--cap-add</code> দিয়ে ফিরিয়ে দেওয়া হয় — ফলে container escape হলেও attacker-এর হাতে কার্যত কোনো ক্ষমতা থাকে না।</div>
<div class="callout best"><span class="tag">Port exposure — শুধু যা দরকার</span>
Database/internal service-এর port <b>পুরো network-এ খুলবেন না</b>। দরকার হলে শুধু localhost-এ bind করুন: <code>-p 127.0.0.1:5432:5432</code> — তাহলে শুধু host থেকেই access। <code>-p 5432:5432</code> (মানে <code>0.0.0.0</code>) দিলে DB বাইরের সবার কাছে খুলে যায় — production-এ বিপজ্জনক।</div>
</template>

<template data-page="registry">
<h2 class="title">৯. Registry · Docker Hub · Push/Pull</h2>
<p class="lead">Image তৈরির পর কোথায় রাখবেন, কীভাবে শেয়ার করবেন — registry-র কাজ।</p>

<h3>Registry কী</h3>
<p>একটা <span class="kw">registry</span> হলো image-এর ভাণ্ডার (store)। <code>docker pull</code>/<code>push</code> এখান থেকেই হয়।</p>
<ul>
<li><span class="kw">Docker Hub</span> — public default registry (<code>docker.io</code>)। official image (postgres, redis…) এখান থেকেই আসে।</li>
<li><span class="kw">Private registry</span> — নিজের/কোম্পানির: self-hosted <code>registry:2</code>, বা cloud — Azure ACR, AWS ECR, Google GAR, GitHub GHCR।</li>
</ul>

<h3>Push &amp; Pull</h3>
<pre>docker login                              <span class="c"># Docker Hub এ (বা registry URL সহ)</span>
docker tag myapi:1.0 rasel/myapi:1.0      <span class="c"># registry/repo:tag আকারে নাম</span>
docker push rasel/myapi:1.0               <span class="c"># upload</span>
docker pull rasel/myapi:1.0               <span class="c"># download</span>

<span class="c"># Private registry উদাহরণ (Azure ACR)</span>
docker tag myapi:1.0 myreg.azurecr.io/myapi:1.0
docker push myreg.azurecr.io/myapi:1.0</pre>
<div class="callout best"><span class="tag">Best practice</span>
CI pipeline-এ commit SHA বা semantic version দিয়ে tag করে push করুন (<code>myapi:1.4.2</code>, <code>myapi:git-a1b2c3</code>) — কখনো শুধু <code>latest</code> নয়, যাতে ঠিক কোন build production-এ আছে তা জানা যায়।</div>

<h3>Push আসলে কী পাঠায় — Layer Reuse</h3>
<p>Push করলে পুরো image আবার আপলোড হয় না। Registry প্রতিটা layer-কে তার content hash (<span class="kw">digest</span>) দিয়ে চেনে — push শুরুর আগে Docker registry-কে জিজ্ঞেস করে কোন layer-এর digest ইতিমধ্যে ওখানে আছে; যেগুলো আগে থেকেই আছে (যেমন <code>FROM aspnet:8.0</code>-এর base layer) সেগুলো <b>skip</b> হয়ে যায়, শুধু নতুন/বদলানো layer আপলোড হয়।</p>
<div class="callout why"><span class="tag">তাই দ্বিতীয় push দ্রুত</span>
Code-এ ছোট পরিবর্তন করে rebuild+push করলে output-এ বেশিরভাগ layer-এর পাশে "Layer already exists" দেখবেন — মাত্র ১-২টা layer আসলে আপলোড হয়, কারণ base image ও dependency layer আগে থেকেই registry-তে জমা আছে। এজন্যই Dockerfile চ্যাপ্টারের <code>.csproj</code> আলাদা করে <code>restore</code> layer আগে রাখার কৌশল শুধু local build cache নয় — push/pull-ও দ্রুত করে।</div>

<h3>একই Tag, ভিন্ন Architecture — Manifest List</h3>
<p>Dockerfile চ্যাপ্টারে দেখা <code>docker buildx build --platform linux/amd64,linux/arm64 --push</code> একই <code>rasel/myapi:1.0</code> tag-এর নিচে amd64 ও arm64-এর জন্য দুটো <b>ভিন্ন image</b> push করে। তাহলে Mac (ARM) আর x86 Linux server দুটোতেই <code>docker pull rasel/myapi:1.0</code> করলে সঠিক architecture-টাই কীভাবে আসে?</p>
<div class="callout behind"><span class="tag">পর্দার আড়ালে — Manifest List / Image Index</span>
Registry tag-এর নিচে একটা image সরাসরি না রেখে একটা <b>manifest list</b> (OCI image index) রাখে — এতে প্রতিটা architecture-এর জন্য আলাদা image digest-এর একটা ম্যাপ থাকে (amd64 → digest A, arm64 → digest B)। <code>docker pull</code>-এর সময় client নিজের platform (host-এর CPU architecture) জানিয়ে দেয়, registry সেই অনুযায়ী সঠিক digest বেছে সেই একটা image-ই পাঠায়। এজন্যই একই tag ভিন্ন architecture-এর host-এ ভিন্ন আলাদা tag ছাড়াই ঠিক image টেনে আনে।</div>
</template>

<template data-page="compose">
<h2 class="title">১০. Docker Compose</h2>
<p class="lead">এক YAML ফাইলে পুরো multi-container stack সংজ্ঞায়িত করে এক command-এ চালানো — dev ও ছোট production-এ অপরিহার্য।</p>

<h3>Compose কী</h3>
<p><span class="kw">Docker Compose</span> দিয়ে একাধিক container (service), তাদের network, volume, config — সব একটা <code>compose.yaml</code>-এ লেখা যায়। তারপর <code>docker compose up</code> দিলেই পুরো stack দাঁড়িয়ে যায়।</p>

<h3>একটা পূর্ণ compose.yaml (.NET API + PostgreSQL)</h3>
<pre>services:
  api:
    build: .                          <span class="c"># Dockerfile থেকে build</span>
    ports: ["8080:8080"]
    env_file: .env                    <span class="c"># environment ফাইল</span>
    environment:
      ConnectionStrings__Db: "Host=db;Port=5432;Database=app;Username=app;Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy    <span class="c"># db healthy হলে তবেই api চালু</span>
    networks: [appnet]
    restart: unless-stopped

  db:
    image: postgres:16                <span class="c"># image টেনে আনে (build নয়)</span>
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [appnet]

volumes:
  pgdata:
networks:
  appnet:</pre>

<h3>মূল ধারণাগুলো</h3>
<table>
<tr><th>ধারণা</th><th>মানে</th></tr>
<tr><td><span class="kw">services</span></td><td>প্রতিটা container (api, db, redis…)</td></tr>
<tr><td><span class="kw">build vs image</span></td><td><code>build:</code> = Dockerfile থেকে বানাও; <code>image:</code> = তৈরি image টানো</td></tr>
<tr><td><span class="kw">networks</span></td><td>service-রা একই network-এ থাকলে নাম দিয়ে কথা বলে</td></tr>
<tr><td><span class="kw">volumes</span></td><td>persistent data (named volume)</td></tr>
<tr><td><span class="kw">.env</span> / <code>env_file</code></td><td>variable বাইরে রেখে <code>${VAR}</code> দিয়ে ব্যবহার</td></tr>
<tr><td><span class="kw">healthcheck</span></td><td>service সুস্থ কি না</td></tr>
<tr><td><span class="kw">depends_on</span></td><td>startup order (+ <code>condition: service_healthy</code>)</td></tr>
<tr><td><span class="kw">profiles</span></td><td>নির্দিষ্ট service শুধু নির্দিষ্ট profile-এ চালু (যেমন <code>--profile debug</code>)</td></tr>
</table>
<div class="callout mistake"><span class="tag">depends_on-এর ফাঁদ</span>
সাধারণ <code>depends_on</code> শুধু container <b>start</b> হওয়ার order ঠিক করে — service <b>প্রস্তুত</b> কি না নয়। DB container চালু হয়েছে কিন্তু এখনো connection নিচ্ছে না — এমন হতে পারে। তাই <code>condition: service_healthy</code> + DB-তে healthcheck ব্যবহার করুন, নাহলে app-এ retry logic রাখুন।</div>

<h3>প্রধান command</h3>
<pre>docker compose up -d          <span class="c"># সব service background এ চালাও</span>
docker compose ps             <span class="c"># status</span>
docker compose logs -f api    <span class="c"># নির্দিষ্ট service এর log</span>
docker compose down           <span class="c"># সব থামাও ও মুছো (-v দিলে volume ও)</span>
docker compose up -d --build  <span class="c"># rebuild করে চালাও</span></pre>

<h3>Compose Override File — environment অনুযায়ী আলাদা config</h3>
<p>একটাই <code>compose.yaml</code> দিয়ে dev, staging, production সব সামলানো কঠিন — dev-এ চান bind-mount + hot reload + port খোলা, production-এ চান নির্দিষ্ট image tag + resource limit + কম exposure। <span class="kw">Override file</span> এই সমস্যা মেটায়: একটা <b>base</b> file-এ shared config, আর environment-ভিত্তিক পার্থক্য আলাদা file-এ — Compose দুটো <b>merge</b> করে চালায়।</p>

<h4>দুইভাবে override হয়</h4>
<table>
<tr><th>উপায়</th><th>কীভাবে</th><th>কখন</th></tr>
<tr><td><span class="kw">Automatic</span></td><td><code>compose.yaml</code> + <code>compose.override.yaml</code> — <code>docker compose up</code> নিজেই দুটো merge করে (override file লাগে না উল্লেখ করতে)</td><td>Local dev</td></tr>
<tr><td><span class="kw">Explicit (multiple -f)</span></td><td><code>docker compose -f compose.yaml -f compose.prod.yaml up</code> — পরের file আগেরটাকে override করে</td><td>Staging / production / CI</td></tr>
</table>
<div class="callout why"><span class="tag">কেন — আর merge কীভাবে হয়</span>
<b>কেন:</b> DRY — common সব base-এ একবার, শুধু যা environment-ভেদে বদলায় সেটুকু override-এ। ডুপ্লিকেট compose file রাখতে হয় না, ভুলের ঝুঁকি কমে, আর production-specific জিনিস (tag, limit) dev-এ ঢোকে না।<br>
<b>Merge:</b> পরের file আগেরটার ওপর বসে — scalar মান (image, single value) <b>replace</b> হয়, map (environment, labels) <b>merge</b> হয়।</div>

<h4>উদাহরণ — base + dev + prod</h4>
<pre><span class="c"># compose.yaml — সবার common (base)</span>
services:
  api:
    image: myapi:${TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    networks: [appnet]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks: [appnet]
networks: { appnet: {} }</pre>
<pre><span class="c"># compose.override.yaml — শুধু dev (docker compose up এ auto-merge)</span>
services:
  api:
    build: .                       <span class="c"># dev এ Dockerfile থেকে build</span>
    ports: ["8080:8080"]
    volumes: ["./src:/app/src"]    <span class="c"># bind mount — live code</span>
  db:
    ports: ["5432:5432"]           <span class="c"># dev এ DB বাইরে থেকে দেখা</span></pre>
<pre><span class="c"># compose.prod.yaml — production (explicit -f দিয়ে)</span>
services:
  api:
    image: rasel/myapi:1.4.2       <span class="c"># নির্দিষ্ট tag, build নয়</span>
    ports: ["127.0.0.1:8080:8080"] <span class="c"># শুধু localhost</span>
    deploy:
      replicas: 3
      resources: { limits: { cpus: "1.5", memory: 512M } }
    restart: unless-stopped</pre>
<pre><span class="c"># চালানো</span>
docker compose up -d                                        <span class="c"># base + override.yaml (dev)</span>
docker compose -f compose.yaml -f compose.prod.yaml up -d   <span class="c"># base + prod</span>
docker compose -f compose.yaml -f compose.prod.yaml config  <span class="c"># merge শেষে কী দাঁড়ালো দেখুন</span></pre>

<h4>Environment variable — কোথা থেকে আসে, কে জেতে</h4>
<p>Compose-এ <code>${VAR}</code> interpolation-এর মান নিচের ক্রমে খোঁজা হয় (উপরেরটা জেতে):</p>
<ol>
<li>Shell environment variable (<code>export DB_PASSWORD=... ; docker compose up</code>)</li>
<li><code>--env-file</code> দিয়ে দেওয়া file</li>
<li>Project directory-র <code>.env</code> file (auto-loaded)</li>
<li>compose file-এ <code>${VAR:-default}</code>-এর default মান</li>
</ol>
<pre><span class="c"># .env (auto-load হয়; secret থাকলে .gitignore এ দিন)</span>
TAG=1.4.2
ASPNETCORE_ENVIRONMENT=Production
DB_PASSWORD=supersecret</pre>
<div class="callout best"><span class="tag">Benefit ও Best practice</span>
<ul style="margin:4px 0">
<li><b>Benefit:</b> এক codebase, এক base compose — অথচ প্রতি environment-এ সঠিক config, secret বাইরে (<code>.env</code>/shell), এবং production-এ <code>config</code> দিয়ে merge যাচাই করা যায়।</li>
<li><code>${VAR:-default}</code> দিয়ে নিরাপদ default দিন — variable না থাকলেও ভাঙবে না।</li>
<li>Environment-ভিত্তিক আলাদা <code>.env</code> (<code>.env.dev</code>, <code>.env.prod</code>) + <code>--env-file .env.prod</code>।</li>
<li>আসল secret production-এ secret manager/Docker secrets দিয়ে (Security ট্যাব) — plain <code>.env</code> নয়।</li>
</ul></div>
<div class="callout mistake"><span class="tag">Common mistake — root <code>.env</code> vs service <code>env_file</code></span>
দুটো আলাদা জিনিস গুলিয়ে ফেলা। Root <code>.env</code> শুধু compose file-এর <code>${...}</code> substitution-এ কাজে লাগে — এটা container-এর <b>ভেতরে যায় না</b>। container-এর app-কে variable দিতে হলে service-এ <code>environment:</code> বা <code>env_file:</code> ব্যবহার করতে হবে।</div>
</template>

<template data-page="dotnet">
<h2 class="title">১১. Docker for .NET</h2>
<p class="lead">আপনার আসল লক্ষ্য — ASP.NET Core API আর তার সহযোগী (PostgreSQL, Redis, RabbitMQ, Kafka) সব container-এ, এক Compose-এ।</p>

<h3>ASP.NET Core — production Dockerfile</h3>
<pre>FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY *.csproj ./
RUN dotnet restore
COPY . .
RUN dotnet publish -c Release -o /app/publish /p:UseAppHost=false

FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS final
WORKDIR /app
COPY --from=build /app/publish .
ENV ASPNETCORE_URLS=http://+:8080
EXPOSE 8080
USER app
HEALTHCHECK --interval=30s --timeout=3s CMD curl -f http://localhost:8080/health || exit 1
ENTRYPOINT ["dotnet", "MyApi.dll"]</pre>
<div class="callout best"><span class="tag">.NET 8+ tips</span>
<code>aspnet:8.0</code> image-এ built-in non-root <code>app</code> user আছে ও default port 8080 (পুরনো 80 নয়)। আরও ছোট/নিরাপদ চাইলে <code>8.0-noble-chiseled</code> (distroless-সদৃশ)।</div>
<div class="callout mistake"><span class="tag">HEALTHCHECK-এ curl নেই — সাবধান!</span>
উপরের <code>HEALTHCHECK ... curl</code> একটা ফাঁদ: .NET runtime image-এ (আর chiseled/distroless-এ তো নিশ্চিতভাবেই) <b>curl বা shell থাকে না</b> — তাই ঐ healthcheck সবসময় fail করবে। উপায়: (১) সবচেয়ে ভালো — orchestrator/Compose-এর HTTP probe ব্যবহার করুন (container HEALTHCHECK নয়); (২) non-chiseled image-এ হলে Dockerfile-এ <code>curl</code>/<code>wget</code> install করে নিন; (৩) অথবা একটা ছোট .NET health-check entrypoint বানান। Chiseled-এ container HEALTHCHECK এড়িয়ে যান।</div>

<h3>নির্ভরশীল service গুলো — একক run</h3>
<pre><span class="c"># PostgreSQL</span>
docker run -d --name db -e POSTGRES_PASSWORD=secret -p 5432:5432 \
  -v pgdata:/var/lib/postgresql/data postgres:16

<span class="c"># Redis</span>
docker run -d --name cache -p 6379:6379 redis:7

<span class="c"># RabbitMQ (management UI সহ)</span>
docker run -d --name mq -p 5672:5672 -p 15672:15672 rabbitmq:3-management

<span class="c"># Kafka (KRaft, single-node — official apache image)</span>
docker run -d --name kafka -p 9092:9092 apache/kafka:latest</pre>

<h3>Production Multi-Container Compose (পুরো stack)</h3>
<pre>services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Db: "Host=db;Port=5432;Database=app;Username=app;Password=${DB_PASSWORD}"
      ConnectionStrings__Redis: "cache:6379"
      Rabbit__Host: "mq"
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
      mq: { condition: service_started }
    networks: [appnet]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 512M }

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      retries: 5
    networks: [appnet]

  cache:
    image: redis:7
    networks: [appnet]

  mq:
    image: rabbitmq:3-management
    ports: ["15672:15672"]
    networks: [appnet]

volumes:
  pgdata:
networks:
  appnet:</pre>
<div class="callout behind"><span class="tag">কীভাবে সব যুক্ত</span>
api তার connection string-এ host হিসেবে <b>service নাম</b> (<code>db</code>, <code>cache</code>, <code>mq</code>) ব্যবহার করে — Compose-এর DNS সেগুলো resolve করে। কোনো IP মনে রাখতে হয় না, আর পুরো stack এক <code>docker compose up -d</code>-তে দাঁড়িয়ে যায়।</div>

<h3>EF Core migration container-এ কীভাবে চালাবেন</h3>
<p>Container-এ DB migration চালানোর তিনটা প্রচলিত উপায় — প্রতিটার trade-off আছে:</p>
<table>
<tr><th>উপায়</th><th>কীভাবে</th><th>trade-off</th></tr>
<tr><td>App startup-এ</td><td><code>db.Database.Migrate()</code> Program.cs-এ</td><td>সহজ; কিন্তু একাধিক replica একসাথে চালালে race, startup ধীর</td></tr>
<tr><td>আলাদা migration job / init container</td><td>এক-shot container শুধু migrate চালায়, তারপর app</td><td>নিরাপদ — production-এ সুপারিশ; সামান্য বেশি setup</td></tr>
<tr><td>Migration bundle</td><td><code>dotnet ef migrations bundle</code> → executable</td><td>SDK ছাড়াই চালানো যায়, CI/CD-বান্ধব</td></tr>
</table>
<pre><span class="c"># compose এ init container — app এর আগে migrate একবার চলে</span>
services:
  migrate:
    image: myapi:1.0
    entrypoint: ["dotnet", "MyApi.dll", "--migrate-only"]
    depends_on:
      db: { condition: service_healthy }
    networks: [appnet]
  api:
    depends_on:
      migrate: { condition: service_completed_successfully }   <span class="c"># migrate শেষ হলে তবেই</span></pre>
<div class="callout mistake"><span class="tag">Common mistake</span>
৫টা api replica সবাই startup-এ <code>Migrate()</code> চালানো → একই migration parallel চলে DB lock/error। Migration <b>একবারই</b> চালান (init container/job), প্রতিটা replica-তে নয়।</div>

<h3>Graceful shutdown ও .NET container-awareness</h3>
<p><b>Graceful shutdown:</b> exec-form ENTRYPOINT থাকলে <code>docker stop</code>-এর SIGTERM .NET host পায় → ASP.NET Core নতুন request নেওয়া বন্ধ করে চলমান request শেষ করে (<code>IHostApplicationLifetime</code>)। ভারী কাজ থাকলে timeout বাড়ান এবং docker-এর grace period-এর সাথে মেলান:</p>
<pre>builder.Services.Configure&lt;HostOptions&gt;(o =&gt;
    o.ShutdownTimeout = TimeSpan.FromSeconds(30));   <span class="c">// docker stop -t 30 / stop_grace_period: 30s এর সাথে মেলান</span></pre>
<div class="callout why"><span class="tag">.NET container-aware — GC ও thread pool</span>
.NET (Core 3.0+) cgroup limit <b>নিজে পড়ে</b> — <code>--memory</code>/<code>--cpus</code> দিলে GC heap ও thread pool সেই অনুযায়ী adjust হয়। তাই limit দেওয়া শুধু নিরাপত্তা নয়, .NET runtime-কে সঠিকভাবে tune-ও করে। তবে খুব কম memory limit দিলে GC আক্রমণাত্মক হয়ে CPU বাড়ায় — বাস্তব workload মেপে সুষম limit দিন।</div>
</template>

<template data-page="prod">
<h2 class="title">১২. Troubleshooting · Best Practices</h2>
<p class="lead">যা ভাঙে, কেন ভাঙে, কীভাবে debug করবেন — আর production-এ নিরাপদ default। শেষে master checklist।</p>

<h3>Troubleshooting — Containers</h3>
<table>
<tr><th>উপসর্গ</th><th>কারণ / সমাধান</th></tr>
<tr><td>Container সাথে সাথেই exit</td><td>main process শেষ হয়ে গেছে/crash → <code>docker logs</code> দেখুন; ENTRYPOINT/CMD ঠিক আছে?</td></tr>
<tr><td>"Exited (137)"</td><td>OOM (memory limit পার) বা SIGKILL → <code>--memory</code> বাড়ান/leak খুঁজুন</td></tr>
<tr><td>Port লাগছে না</td><td><code>-p</code> দেননি, বা app <code>localhost</code>-এ bind (container-এ <code>0.0.0.0</code>/<code>+</code> লাগবে)</td></tr>
<tr><td>পরিবর্তন দেখা যাচ্ছে না</td><td>rebuild করেননি / cache → <code>docker compose up --build</code></td></tr>
</table>

<h3>Troubleshooting — Networks &amp; Volumes</h3>
<table>
<tr><th>সমস্যা</th><th>সমাধান</th></tr>
<tr><td>এক container আরেকটাকে পায় না</td><td>একই user-defined network-এ আছে? IP নয়, <b>service/container নাম</b> দিয়ে connect করুন</td></tr>
<tr><td>DB data হারিয়ে গেছে</td><td>volume ছাড়া চালানো হয়েছিল → named volume mount করুন</td></tr>
<tr><td>Permission denied (mount)</td><td>bind mount-এ host file ownership/UID mismatch → container user/permission মেলান</td></tr>
</table>

<h3>Debugging Containers</h3>
<pre>docker logs -f --tail 100 api        <span class="c"># সাম্প্রতিক log</span>
docker exec -it api sh               <span class="c"># ভেতরে shell (chiseled এ shell নেই!)</span>
docker inspect api                   <span class="c"># config/state/mount/network</span>
docker stats api                     <span class="c"># live resource</span>
docker compose logs -f               <span class="c"># সব service একসাথে</span></pre>
<div class="callout behind"><span class="tag">Distroless/chiseled-এ debug</span>
Chiseled/distroless image-এ shell নেই, তাই <code>exec sh</code> চলবে না। Debug করতে হলে একটা "debug sidecar" container একই namespace-এ চালান, বা temporarily full image দিয়ে reproduce করুন।</div>

<p class="lead" style="margin-top:24px">প্রতিদিনের command-এর পূর্ণ, ব্যাখ্যাসহ তালিকা এখন আলাদা <b>"Essential CLI Commands"</b> ট্যাবে (পাশের মেনুর ১৩ নম্বর) — category অনুযায়ী সাজানো, প্রতিটার পাশে কী কাজ করে তার সংক্ষিপ্ত ব্যাখ্যা।</p>

<h3>Production Best Practices</h3>
<div class="callout best"><span class="tag">Checklist</span>
<ul style="margin:4px 0">
<li><b>Multi-stage build</b> + ছোট runtime/chiseled base; <code>.dockerignore</code>।</li>
<li><b>Non-root</b> (<code>USER app</code>), <b>read-only</b> FS যেখানে সম্ভব, নির্দিষ্ট <b>version tag</b> (latest নয়)।</li>
<li><b>Resource limits</b> (cpu/memory) + <b>restart policy</b> (<code>unless-stopped</code>) + <b>healthcheck</b>।</li>
<li>Secret env/image-এ নয় — secret manager/Docker secrets; log rotation সেট করুন।</li>
<li>Persistent data = <b>named volume</b>; regular backup।</li>
<li>Image <b>scan</b> (Scout/Trivy); base image নিয়মিত update।</li>
<li>Graceful shutdown — exec-form ENTRYPOINT যাতে SIGTERM পৌঁছায়; app SIGTERM handle করুক।</li>
</ul></div>
</template>

<template data-page="cli">
<h2 class="title">১৩. Essential CLI Commands — নিত্যদিনের Docker</h2>
<p class="lead">রোজকার কাজে যে command গুলো বারবার লাগবে — category অনুযায়ী সাজানো quick-reference। মুখস্থ করার দরকার নেই, দরকার হলে এই পাতায় ফিরে আসুন।</p>

<div class="callout best"><span class="tag">সবচেয়ে বেশি ব্যবহৃত ৮টা command</span>
<code>docker build</code> · <code>docker run</code> · <code>docker ps</code> · <code>docker logs</code> · <code>docker exec</code> · <code>docker stop</code>/<code>rm</code> · <code>docker compose up</code>/<code>down</code> · <code>docker system prune</code> — এই আটটা দিয়েই দৈনন্দিন কাজের ৯০% চলে।</div>

<h3>🖼️ Images</h3>
<table>
<tr><th>Command</th><th>কাজ</th></tr>
<tr><td><code>docker build -t name:tag .</code></td><td>Dockerfile থেকে image build (<code>.</code> = build context)</td></tr>
<tr><td><code>docker build --no-cache -t name:tag .</code></td><td>cache ছাড়া পুরোপুরি নতুন করে build</td></tr>
<tr><td><code>docker images</code> / <code>docker image ls</code></td><td>local image তালিকা</td></tr>
<tr><td><code>docker tag src:tag dst:tag</code></td><td>image-কে নতুন নাম/tag দেওয়া (push-এর আগে দরকার)</td></tr>
<tr><td><code>docker rmi name:tag</code></td><td>local image মুছুন (<code>-f</code> জোর করে)</td></tr>
<tr><td><code>docker image prune</code></td><td>dangling (নাম-ছাড়া) image মুছুন</td></tr>
<tr><td><code>docker image prune -a</code></td><td>কোনো container ব্যবহার করছে না এমন <b>সব</b> image মুছুন</td></tr>
<tr><td><code>docker history name:tag</code></td><td>image-এর প্রতিটা layer ও তার সাইজ দেখুন</td></tr>
<tr><td><code>docker inspect name:tag</code></td><td>image-এর metadata (env, entrypoint, layers) — JSON</td></tr>
<tr><td><code>docker save -o out.tar name:tag</code></td><td>image-কে tar ফাইলে export (offline transfer)</td></tr>
<tr><td><code>docker load -i out.tar</code></td><td>tar থেকে image আবার import</td></tr>
</table>

<h3>🚢 Containers — চালানো ও নিয়ন্ত্রণ</h3>

<tr><th>Command</th><th>কাজ</th></tr>
<tr><td><code>docker run -d -p 8080:8080 --name api myapi:1.0</code></td><td>detached mode-এ চালু (background)</td></tr>

<tr><td><code>docker run --rm alpine echo hi</code></td><td>থেমে গেলেই auto-remove (one-off কাজ)</td></tr>
<tr><td><code>docker ps</code></td><td>চলমান container তালিকা</td></tr>
<tr><td><code>docker ps -a</code></td><td>সব container (থেমে যাওয়া সহ)</td></tr>
<tr><td><code>docker stop api</code></td><td>SIGTERM পাঠিয়ে graceful থামানো (grace period পরে SIGKILL)</td></tr>
<tr><td><code>docker kill api</code></td><td>সাথে সাথেই SIGKILL — জোর করে থামানো</td></tr>
<tr><td><code>docker start api</code></td><td>থেমে থাকা container আবার চালু</td></tr>
<tr><td><code>docker restart api</code></td><td>stop + start একসাথে</td></tr>
<tr><td><code>docker rm api</code></td><td>থেমে থাকা container মুছুন (<code>-f</code> চলমান হলেও জোর করে)</td></tr>
<tr><td><code>docker rename old new</code></td><td>container-এর নাম বদলান</td></tr>
<tr><td><code>docker pause</code> / <code>unpause api</code></td><td>process freeze/resume (কাজ বন্ধ না করেই)</td></tr>
</table>

<h3>🔍 দেখা ও Debug করা</h3>
<table>
<tr><th>Command</th><th>কাজ</th></tr>

<tr><td><code>docker exec api env</code></td><td>এক-লাইন command চালিয়ে ফলাফল দেখা (shell ছাড়াই)</td></tr>
<tr><td><code>docker inspect api</code></td><td>IP, mount, env, state — সম্পূর্ণ JSON</td></tr>
<tr><td><code>docker stats</code></td><td>সব চলমান container-এর live CPU/RAM/network</td></tr>
<tr><td><code>docker top api</code></td><td>container-এর ভেতরের process তালিকা</td></tr>
<tr><td><code>docker diff api</code></td><td>image-এর তুলনায় container-এ কী ফাইল বদলেছে</td></tr>
<tr><td><code>docker cp api:/app/log.txt .</code></td><td>container থেকে host-এ ফাইল কপি (উল্টো দিকেও চলে)</td></tr>

</table>

<h3>🧩 Docker Compose</h3>
<table>
<tr><th>Command</th><th>কাজ</th></tr>
<tr><td><code>docker compose up -d</code></td><td>সব service background-এ চালু</td></tr>

<tr><td><code>docker compose restart api</code></td><td>একটা service restart</td></tr>
<tr><td><code>docker compose config</code></td><td>সব file merge হয়ে চূড়ান্ত config কী দাঁড়ালো দেখা</td></tr>
<tr><td><code>docker compose pull</code></td><td>সব service-এর image latest ভার্সন টানা</td></tr>
</table>

<h3>🧹 System Cleanup</h3>
<table>
<tr><th>Command</th><th>কাজ</th></tr>
<tr><td><code>docker system df</code></td><td>image/container/volume কতটা disk খাচ্ছে তার সারসংক্ষেপ</td></tr>
<tr><td><code>docker system prune</code></td><td>থেমে থাকা container + dangling image + অব্যবহৃত network মুছুন</td></tr>
<tr><td><code>docker system prune -a</code></td><td>+ ব্যবহার-না-হওয়া <b>সব</b> image-ও মুছুন (⚠ বেশি আক্রমণাত্মক)</td></tr>
<tr><td><code>docker system prune -a --volumes</code></td><td>উপরেরটা + অব্যবহৃত volume-ও (⚠⚠ সবচেয়ে ধ্বংসাত্মক — সাবধান)</td></tr>
<tr><td><code>docker info</code></td><td>daemon-এর সম্পূর্ণ কনফিগ/সিস্টেম তথ্য</td></tr>
<tr><td><code>docker version</code></td><td>client ও server (daemon)-এর version</td></tr>
</table>
<div class="callout mistake"><span class="tag">Common mistake</span>
<code>docker system prune -a --volumes</code> কোনো confirmation ছাড়াই স্ক্রিপ্টে/cron-এ রাখা — এটা চলমান নয় এমন প্রতিটা image আর volume মুছে দেয়। CI/CD বা automation-এ চালানোর আগে নিশ্চিত হয়ে নিন কোনটা আসলে দরকার নেই।</div>

<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const templates = {};
  document.querySelectorAll('template[data-page]').forEach(t=>{ templates[t.dataset.page]=t.innerHTML; });

  pages.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className='navbtn'+(i===0?' active':'');
    btn.dataset.target=p.id;
    btn.innerHTML=`<span class="num">${i+1}</span><span>${p.icon} ${p.title}</span>`;
    sidebar.appendChild(btn);

    const pg = document.createElement('section');
    pg.className='page'+(i===0?' active':'');
    pg.id='page-'+p.id;
    pg.innerHTML=templates[p.id]||('<h2 class="title">'+p.title+'</h2><p>Coming soon.</p>');
    const nav=document.createElement('div');
    nav.className='footer';
    const prev=pages[i-1], next=pages[i+1];
    nav.innerHTML = (prev?`<a href="#" data-go="${prev.id}" style="color:var(--accent2);text-decoration:none">← ${prev.title}</a>`:'<span></span>')
      + ' &nbsp;•&nbsp; '
      + (next?`<a href="#" data-go="${next.id}" style="color:var(--accent2);text-decoration:none">${next.title} →</a>`:'<span>শেষ</span>');
    pg.appendChild(nav);
    main.appendChild(pg);
  });

  function show(id){
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
    document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+id));
    window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }

  sidebar.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.target);});
  main.addEventListener('click',e=>{const a=e.target.closest('[data-go]'); if(a){e.preventDefault(); show(a.dataset.go);}});

  const h=location.hash.replace('#','');
  if(h && pages.some(p=>p.id===h)) show(h);
})();
</script>
</body>
